<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Число π (9 клас)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#13203f;--acc:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ebf0ff 0%,#dbe5ff 45%,#c7d6ff 100%) fixed;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 24px}
.hero{background:var(--acc);color:#fff;border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(29,78,216,.22)}
.pill{background:#ffb938;color:#4a3000;font-weight:900;font-size:12px;letter-spacing:.06em;padding:4px 12px;border-radius:999px}
h1{margin:0;font-size:clamp(18px,3.6vw,24px);font-weight:900}
.box{margin-top:12px;background:#fff;border:2px solid #c9d6f5;border-radius:14px;overflow:hidden}
iframe{display:block;width:100%;height:min(78vh,720px);min-height:420px;border:0}
.lnk{text-align:center;margin:10px 0 0;font-size:14px}
.lnk a{color:var(--acc);font-weight:700}
.auth{margin-top:10px;text-align:center;font-size:13px;color:#5b6b8f}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span class="pill">ГЕОМЕТРІЯ · 9 КЛАС</span><h1>Звідки береться число π</h1></div>
  <div class="box"><iframe title="Число π (GeoGebra)" src="https://www.geogebra.org/material/iframe/id/ueawjwqj/width/1000/height/650/border/888888/rc/false/ai/false/sdz/true/smb/false/stb/false/stbh/true/ld/false/sri/true" allowfullscreen></iframe></div>
  <p class="lnk">Не відкривається? <a href="https://www.geogebra.org/m/ueawjwqj" target="_blank" rel="noopener">Відкрити на сайті GeoGebra</a></p>
  <div class="auth">Автор розробки <b>Ковтун Тетяна</b></div>
</div>
</body>
</html>
