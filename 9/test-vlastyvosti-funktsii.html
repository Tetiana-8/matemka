/* ================= Допоміжне ================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[].slice.call((r||document).querySelectorAll(s));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;

const N=n=>n<0?'−'+(-n):String(n);
const iv=s=>String(s).replace(/(<[^>]+>)|([a-z])/g,(m,t,l)=>t?t:'<i class="v">'+l+'</i>');
const F=(a,b)=>'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';

const PWX=rows=>'<span class="pw">'+BR+'<span class="rows">'+rows.map(r=>'<span>'+r[0]+'</span><span>'+r[1]+'</span>').join('')+'</span></span>';
function poly(cs){ // [[коеф, степінь], ...] за спаданням
  let s='';
  cs.forEach(function(t){const c=t[0],p=t[1];if(!c)return;const a=Math.abs(c);let term=(a===1&&p>0)?'':String(a);if(p===1)term+='x';if(p===2)term+='x²';if(p===3)term+='x³';
    if(!s)s=(c<0?'−':'')+term;else s+=(c<0?' − ':' + ')+term;});

}
const INF=Infinity;
function fmtI(lo,hi,lc,hc){return (lc?'[':'(')+(lo===-INF?'−∞':N(lo))+'; '+(hi===INF?'+∞':N(hi))+(hc?']':')')}
function fmtSet(set){return set.map(s=>fmtI(s[0],s[1],s[2],s[3])).join(' ∪ ')}
function inSet(x,set){return set.some(s=>(x>s[0]||(s[2]&&x===s[0]))&&(x<s[1]||(s[3]&&x===s[1])))}
function pchip(P){
  const n=P.length,x=P.map(p=>p[0]),y=P.map(p=>p[1]),h=[],d=[],mm=[];
  for(let i=0;i<n-1;i++){h[i]=x[i+1]-x[i];d[i]=(y[i+1]-y[i])/h[i]}
  mm[0]=d[0];mm[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0)mm[i]=0;
    else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];mm[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}
  }
  return function(t){
    let i=0;while(i<n-2&&t>x[i+1])i++;
    const s=(t-x[i])/h[i],s2=s*s,s3=s2*s;
    return (2*s3-3*s2+1)*y[i]+(s3-2*s2+s)*h[i]*mm[i]+(-2*s3+3*s2)*y[i+1]+(s3-s2)*h[i]*mm[i+1];
  };
}
/* нулі функції числово: точні (|f|<1e-9) та зі зміною знака */
function zerosOf(f,lo,hi){
  const out=[];let prev=null;
  for(let i=lo*100;i<=hi*100;i++){
    const x=i/100,y=f(x);
    if(!isFinite(y)){prev=null;continue}
    if(Math.abs(y)<1e-9){out.push(x);prev=null;continue}
    if(prev!==null&&prev*y<0)out.push(x-0.005);
    prev=y;
  }
  const r=[];out.forEach(z=>{if(!r.length||z-r[r.length-1]>0.02)r.push(z)});
  return r;
}
/* координатна площина в клітинку */
function plane(o){
  const u=o.u||26,x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1,P=x=>(x-x0)*u,Q=y=>(y1-y)*u,W=(x1-x0)*u,H=(y1-y0)*u,pad=u*1;

let S={screen:'start',cur:0,ans:[],checked:false,tasks:[],seed:0,sur:'',nam:'',sel:null,marks:[],score:0,from:'result'};
let W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0};
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}
function leave(){if(S.screen==='start'||S.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',function(){document.hidden?leave():back()});
window.addEventListener('blur',leave);window.addEventListener('focus',back);

function newSeed(){const q=/[?&]v=(\d+)/.exec(location.search);if(q&&!S._used){S._used=1;return +q[1]}return Math.floor(Math.random()*2147483647)+1}
function build(){
  S.seed=newSeed();S.tasks=buildTasks(S.seed);S.ans=S.tasks.map(t=>t.type==='match'?[null,null,null]:(t.type==='num'?'':null));
  S.cur=0;S.checked=false;S.sel=null;resetWatch();
}
const coarse=()=>window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
function answered(i){const t=S.tasks[i],a=S.ans[i];if(t.type==='num')return String(a).trim()!=='';if(t.type==='match')return a.every(x=>x!==null);return a!==null}
function isRight(i){
  const t=S.tasks[i],a=S.ans[i];
  if(t.type==='num'){const v=Number(String(a).trim().replace(/[−–—]/g,'-').replace(',','.'));return isFinite(v)&&String(a).trim()!==''&&Math.abs(v-t.correct)<1e-9}
  if(t.type==='match')return t.items.every((it,k)=>a[k]!==null&&t.pool[a[k]]===it.res);
  return a===t.ci;
}
function ansText(i){
  const t=S.tasks[i],a=S.ans[i];
  if(t.type==='num')return String(a).trim()===''?'—':String(a).trim();
  if(t.type==='match')return a.map(x=>x===null?'—':t.pool[x]).join(' | ');
  return a===null?'—':(t.type==='tf'?t.options[a]:t.options[a]);
}

/* ================= Відображення ================= */
const card=$('#card'),head=$('#head'),nav=$('#nav'),kp=$('#kp');
const LET=['А','Б','В','Г'];
function cellsRow(mode){
  let h='<div class="cells">';
  S.tasks.forEach(function(t,i){
    let c='cell';
    if(mode==='review')c+=S.marks[i]?' right':' wrong';else if(answered(i))c+=' ans';
    if(i===S.cur&&S.screen!=='before'&&S.screen!=='result')c+=' cur';
    h+='<button class="'+c+'" data-go="'+i+'">'+(i+1)+'</button>';
  });
  return h+'</div>';
}
function taskHTML(i,review){
  const t=S.tasks[i],a=S.ans[i];
  let h='<div class="q">'+t.text+'</div>'+(t.svg||'');
  if(t.type==='num'){
    const cls=review?(S.marks[i]?' right':' wrong'):'';
    h+='<div class="numrow"><input id="ans" class="'+cls.trim()+'" autocomplete="off" autocapitalize="off" spellcheck="false" '+(coarse()?'inputmode="none"':'inputmode="text"')+' value="'+String(a).replace(/"/g,'&quot;')+'" '+(review?'readonly':'')+' placeholder="Відповідь"></div><div class="hint" style="margin-top:4px">Введіть число (можна з мінусом)</div>';
  }else if(t.type==='choice'||t.type==='tf'){
    h+='<div class="opts">'+t.options.map(function(o,k){
      let c='opt';
      if(review){if(k===t.ci)c+=' right';else if(k===a)c+=' wrong'}else if(k===a)c+=' sel';
      return '<button class="'+c+'" data-opt="'+k+'">'+(t.type==='choice'?'<b>'+LET[k]+'</b>':'')+o+'</button>';
    }).join('')+'</div>';
  }else{
    const used=a.filter(x=>x!==null);
    h+='<div class="match">'+t.items.map(function(it,k){
      let cc='dcell';if(review)cc+=(a[k]!==null&&t.pool[a[k]]===it.res)?' right':' wrong';
      return '<div class="row"><div class="expr math">'+iv(it.expr)+'</div><div class="'+cc+'" data-cell="'+k+'">'+(a[k]!==null?'<div class="chipd'+(review?' stat':'')+(S.sel===a[k]?' sel':'')+'" data-idx="'+a[k]+'">'+t.pool[a[k]]+'</div>':'')+'</div></div>';
    }).join('')+
    '<div class="pool" id="pool">'+t.pool.map(function(p,idx){return used.indexOf(idx)>=0?'':'<div class="chipd'+(review?' stat':'')+(S.sel===idx?' sel':'')+'" data-idx="'+idx+'">'+p+'</div>'}).join('')+'</div></div>';
  }
  if(review){
    const ok=S.marks[i];
    h+=(ok?'<div class="corrbox">✓ Правильно</div>':'<div class="badbox">✗ Ваша відповідь: '+ansText(i)+'<br><span style="color:var(--oktx)">Правильно: '+t.correctText+'</span>'+(t.expl?'<br><span style="color:var(--mut);font-weight:600">'+t.expl+'</span>':'')+'</div>');
  }
  return h;
}
function render(){
  kp.innerHTML='';
  if(S.screen==='start'){
    head.innerHTML='';
    card.innerHTML='<h1>Тест. Властивості функції (9 клас)</h1>'+
      '<label class="fld"><span>Прізвище</span><input id="sur" autocomplete="off" value="'+S.sur.replace(/"/g,'&quot;')+'"></label>'+
      '<label class="fld"><span>Ім’я</span><input id="nam" autocomplete="off" value="'+S.nam.replace(/"/g,'&quot;')+'"></label>'+
      '<div class="msg" id="smsg"></div>';
    nav.innerHTML='<span></span><button class="btn" id="go">Почати</button>';
    setTimeout(function(){const s=$('#sur');if(s&&!document.activeElement.id)s.focus()},50);
  }else if(S.screen==='task'||S.screen==='review'){
    const rv=S.screen==='review';
    head.innerHTML='<div class="topbar"><span>Завдання '+(S.cur+1)+' з '+S.tasks.length+'</span></div>'+cellsRow(rv?'review':'')+'<div style="height:8px"></div>';
    card.innerHTML=taskHTML(S.cur,rv);
    if(rv){
      nav.innerHTML='<button class="btn gh" id="prev"'+(S.cur===0?' disabled':'')+'>← Назад</button><button class="btn gh" id="toRes">До результату</button><button class="btn" id="next"'+(S.cur===S.tasks.length-1?' disabled':'')+'>Далі →</button>';
    }else{
      nav.innerHTML='<button class="btn gh" id="prev"'+(S.cur===0?' disabled':'')+'>← Назад</button><button class="btn" id="next">Далі →</button>';
      if(S.tasks[S.cur].type==='num'&&coarse()){
        kp.innerHTML='<div class="kp">'+['1','2','3','⌫','4','5','6','−','7','8','9',',','0'].map(function(k){return '<button data-k="'+k+'"'+(k==='0'?' style="grid-column:span 4"':'')+'>'+k+'</button>'}).join('')+'</div>';
      }
    }
  }else if(S.screen==='before'){
    const un=S.tasks.map((t,i)=>answered(i)?-1:i).filter(i=>i>=0);
    head.innerHTML='';
    card.innerHTML='<h1>Перед здачею</h1><div style="font-weight:800">Відповіли на '+(S.tasks.length-un.length)+' з '+S.tasks.length+'</div><div class="sumgrid">'+
      S.tasks.map((t,i)=>'<button class="cell '+(answered(i)?'ans':'empty')+'" data-go="'+i+'">'+(i+1)+'</button>').join('')+'</div>'+
      (un.length?'<div class="msg" style="color:#b45309">Ви не завершили '+un.length+' '+(un.length===1?'завдання':'завдань')+'. Натисніть на номер, щоб відкрити.</div>':'');
    nav.innerHTML='<button class="btn gh" id="prev">← Назад</button><button class="btn '+(un.length?'gh':'ok')+'" id="check">'+(un.length?'Все одно перевірити':'Перевірити')+'</button>';
  }else if(S.screen==='result'){
    head.innerHTML='';
    card.innerHTML='<div class="res"><h1>Результат</h1><div class="nm">'+S.sur+' '+S.nam+'</div><div class="big">'+S.score+' з 100 балів</div><div class="pc">'+S.score+' %</div>'+
      '<div class="shot">Зробіть скриншот цього екрана та прикріпіть його до Д/з.</div>'+
      '<div class="btns"><button class="btn gh" id="errs">Дивитись помилки</button><button class="btn" id="again">Пройти ще раз</button></div></div>';
    nav.innerHTML='';
  }
  bindTask();
}
function bindTask(){
  const inp=$('#ans');
  if(inp&&S.screen==='task'){
    inp.addEventListener('input',function(){S.ans[S.cur]=inp.value;updateCells()});
    if(!coarse())inp.focus();
  }
}
function updateCells(){const cs=$$('.cells .cell');cs.forEach(function(c,i){c.classList.toggle('ans',answered(i))})}
function show(scr,cur){S.screen=scr;if(cur!==undefined)S.cur=cur;render();card.scrollTop=0}

/* ================= Події ================= */
document.addEventListener('click',function(e){
  const t=e.target;
  let b;
  if((b=t.closest('[data-go]'))){const i=+b.dataset.go;if(S.screen==='before'){show('task',i)}else if(S.screen==='task'||S.screen==='review'){show(S.screen,i)}return}
  if((b=t.closest('[data-opt]'))&&S.screen==='task'){S.ans[S.cur]=+b.dataset.opt;render();return}
  if(t.id==='go'){
    const s=$('#sur'),n=$('#nam');S.sur=s.value.trim();S.nam=n.value.trim();
    s.classList.toggle('err',!S.sur);n.classList.toggle('err',!S.nam);
    if(!S.sur||!S.nam){$('#smsg').textContent='Введіть прізвище та ім’я, щоб почати';return}
    build();show('task',0);return;
  }
  if(t.id==='prev'){if(S.screen==='before')show('task',S.tasks.length-1);else show(S.screen,S.cur-1);return}
  if(t.id==='next'){
    if(S.screen==='task'){if(S.cur===S.tasks.length-1)show('before');else show('task',S.cur+1)}
    else show('review',S.cur+1);return;
  }
  if(t.id==='check'){doCheck();return}
  if(t.id==='errs'){const f=S.marks.findIndex(m=>!m);S.from='result';show('review',f<0?0:f);return}
  if(t.id==='toRes'){show('result');return}
  if(t.id==='again'){build();show('task',0);return}
  if((b=t.closest('[data-k]'))){return}
});
/* екранна клавіатура: pointerdown, оновлює стан і поле */
document.addEventListener('pointerdown',function(e){
  const b=e.target.closest('[data-k]');if(!b||S.screen!=='task')return;
  e.preventDefault();
  const k=b.dataset.k;let v=String(S.ans[S.cur]);
  if(k==='⌫')v=v.slice(0,-1);
  else if(k==='−'){v=v.charAt(0)==='−'?v.slice(1):'−'+v}
  else if(k===','){if(v.indexOf(',')<0&&v.replace('−','')!=='')v+=','}
  else if(v.replace(/[−,]/g,'').length<6)v+=k;
  S.ans[S.cur]=v;
  const inp=$('#ans');if(inp){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}))}
  updateCells();
});
/* перетягування */
let drag=null;
card.addEventListener('pointerdown',function(e){
  if(S.screen!=='task')return;const c=e.target.closest('.chipd');if(!c||c.classList.contains('stat'))return;
  e.preventDefault();drag={idx:+c.dataset.idx,sx:e.clientX,sy:e.clientY,moved:false,ghost:null,el:c};
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){
    drag.moved=true;const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=drag.el.offsetWidth+'px';document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.35';
  }
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-20)+'px';
    $$('.dcell').forEach(c=>c.classList.remove('over'));
    drag.ghost.style.display='none';const u=document.elementFromPoint(e.clientX,e.clientY);drag.ghost.style.display='';
    const cl=u&&u.closest('.dcell');if(cl)cl.classList.add('over');
  }
});
function putChip(idx,k){
  const a=S.ans[S.cur].slice(),p=a.indexOf(idx);if(p>=0)a[p]=null;if(k>=0)a[k]=idx;
  S.ans[S.cur]=a;S.sel=null;render();
}
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();
  if(d.moved){
    const u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest('.dcell');
    if(cl)putChip(d.idx,+cl.dataset.cell);else if(u&&u.closest('#pool'))putChip(d.idx,-1);else render();
  }else if(d.el.parentNode.classList.contains('dcell'))putChip(d.idx,-1);
  else{S.sel=(S.sel===d.idx?null:d.idx);render()}
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
card.addEventListener('click',function(e){
  if(S.screen!=='task')return;const cl=e.target.closest('.dcell');
  if(cl&&S.sel!==null&&!e.target.closest('.chipd')){putChip(S.sel,+cl.dataset.cell)}
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'){
    if(e.key==='Enter'&&S.screen==='task'&&e.target.id==='ans'&&String(S.ans[S.cur]).trim()!==''){$('#next').click()}
    if(e.key==='Enter'&&S.screen==='start'&&$('#go'))$('#go').click();
    return;
  }
  if(S.screen==='task'||S.screen==='review'){if(e.key==='ArrowRight'){const n=$('#next');n&&!n.disabled&&n.click()}if(e.key==='ArrowLeft'){const p=$('#prev');p&&!p.disabled&&p.click()}}
});

/* ================= Перевірка і запис ================= */
function doCheck(){
  back();
  S.checked=true;
  S.marks=S.tasks.map((t,i)=>isRight(i));
  S.score=S.tasks.reduce((s,t,i)=>s+(S.marks[i]?t.w:0),0);
  const now=Date.now();
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.sur+' '+S.nam,surname:S.sur,firstName:S.nam,
    ts:now,date:new Date(now).toISOString(),
    score:S.score,max:100,percent:S.score,
    tasks:S.marks.map(m=>m?1:0),weights:S.tasks.map(t=>t.w),rightCount:S.marks.filter(Boolean).length,
    qtext:S.tasks.map(t=>t.qtext),
    answers:S.tasks.map((t,i)=>ansText(i)),
    correct:S.tasks.map(t=>t.correctText),
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,
    variant:S.seed,test:TEST_NAME
  });
  show('result');
}

/* ================= Журнал учителя ================= */
let JROWS=[];
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function openJ(){$('#jm').classList.add('on')}
function closeJ(){$('#jm').classList.remove('on')}
$('#keyb').onclick=openJ;$('#jx').onclick=closeJ;$('#jx2').onclick=closeJ;
$('#jm').addEventListener('click',function(e){if(e.target.id==='jm')closeJ()});
function unlockJ(){
  if($('#jpw').value===TEACHER_PASSWORD){$('#jlock').style.display='none';$('#jxlock').style.display='none';$('#jmain').style.display='block';$('#jpw').value='';refreshJ()}
  else{$('#jerr').textContent='Невірний пароль'}
}
$('#jok').onclick=unlockJ;$('#jpw').addEventListener('keydown',function(e){if(e.key==='Enter')unlockJ()});
async function refreshJ(){
  $('#jtab').textContent='Завантаження…';$('#jconf').textContent='';
  try{JROWS=await loadResults()}catch(e){$('#jtab').innerHTML='<div class="msg">Не вдалося підключитися до бази результатів</div>';return}
  drawJ();
}
function drawJ(){
  if(!JROWS.length){$('#jtab').textContent='Поки що немає записів.';return}
  const mx=Math.max.apply(null,JROWS.map(r=>(r.tasks||[]).length));
  let h='<table class="jt"><tr><th>№</th><th class="l">Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=mx;i++)h+='<th>'+i+'</th>';h+='</tr>';
  JROWS.forEach(function(r,k){
    const d=r.date?new Date(r.date):null,ds=d?d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'—';
    const hasT=typeof r.durationSec==='number',fast=hasT&&r.durationSec<120,hasL=typeof r.leaves==='number';
    h+='<tr><td>'+(k+1)+'</td><td class="l nm" data-det="'+k+'">'+(r.name||'—')+'</td><td>'+ds+'</td><td'+(fast?' class="r" title="Дуже швидко"':'')+'>'+(hasT?mmss(r.durationSec):'—')+'</td><td'+(hasL&&r.leaves>=3?' class="r"':'')+(hasL?' title="Поза вікном: '+mmss(r.awaySec||0)+'"':'')+'>'+(hasL?r.leaves:'—')+'</td><td><b>'+String(r.score).replace('.',',')+'</b></td>';
    for(let i=0;i<mx;i++){const v=(r.tasks||[])[i];h+='<td class="'+(v===undefined?'':v>=1?'y':'n')+'">'+(v===undefined?'':v>=1?'✓':'✗')+'</td>'}
    h+='</tr><tr id="det'+k+'" style="display:none"><td colspan="'+(6+mx)+'" class="det">'+
      (r.qtext||[]).map(function(q,i){return '<div><b>'+(i+1)+'.</b> '+q+'<br>Відповідь: '+((r.answers||[])[i]||'—')+' · Правильно: '+((r.correct||[])[i]||'—')+'</div>'}).join('')+'</td></tr>';
  });
  $('#jtab').innerHTML=h+'</table>';
}
$('#jtab').addEventListener('click',function(e){const n=e.target.closest('[data-det]');if(n){const r=$('#det'+n.dataset.det);r.style.display=r.style.display==='none'?'table-row':'none'}});
$('#jref').onclick=refreshJ;
$('#jcsv').onclick=function(){
  const mx=Math.max.apply(null,[0].concat(JROWS.map(r=>(r.tasks||[]).length)));
  const hd=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'];for(let i=1;i<=mx;i++)hd.push('завд. '+i);
  const lines=[hd.join(';')].concat(JROWS.map(function(r){
    const row=[r.name||'',r.date?new Date(r.date).toLocaleString('uk-UA'):'',typeof r.durationSec==='number'?mmss(r.durationSec):'',typeof r.leaves==='number'?r.leaves:'',typeof r.awaySec==='number'?mmss(r.awaySec):'',String(r.score).replace('.',',')];
    for(let i=0;i<mx;i++){const v=(r.tasks||[])[i];row.push(v===undefined?'':v>=1?'+':'-')}
    return row.join(';');
  }));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='Властивості_функції_9клас_результати.csv';a.click();
};
$('#jclr').onclick=function(){
  $('#jconf').innerHTML='Видалити всі записи ('+JROWS.length+')? <button class="btn" id="cy" style="min-height:36px;background:var(--bad)">Так, видалити</button> <button class="btn gh" id="cn" style="min-height:36px">Скасувати</button>';
  $('#cn').onclick=function(){$('#jconf').textContent=''};
  $('#cy').onclick=async function(){
    try{await clearResults();JROWS=[];drawJ();$('#jconf').textContent=''}catch(e){$('#jconf').textContent='Не вдалося очистити записи. Перевірте правила бази Firebase'}
  };
};

/* ================= Старт (і самоперевірка для розробника) ================= */
if(/[?&]selftest/.test(location.search))window.__ST={buildTasks:buildTasks,B:B,ORDER:ORDER,get S(){return S}};
render();
})();
</script>
