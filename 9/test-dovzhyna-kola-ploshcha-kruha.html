<script>
(function(){ "use strict";

/* ================= Firebase (збір результатів) ================= */
const FIREBASE_CONFIG = { apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU", authDomain: "math-5-892a5.firebaseapp.com", projectId: "math-5-892a5", storageBucket: "math-5-892a5.firebasestorage.app", messagingSenderId: "163114803328", appId: "1:163114803328:web:caf86c4e8b8c4b3b630665", measurementId: "G-E06VKZ2GP5" };
const APP_ID='default-app-id', COLLECTION='results_circle_arc_9', TEACHER_EMAIL='vchytel@matemka.invalid', FBV='10.12.2', TEST_NAME='Довжина кола, площа круга, сектора й сегмента (9 клас)';
let fbPromise=null;
function fb(){ if(!fbPromise){ fbPromise=(async()=>{ const [appM,authM,fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]); const app=appM.initializeApp(FIREBASE_CONFIG); const auth=authM.getAuth(app); await authM.signInAnonymously(auth); return {db:fs.getFirestore(app),fs,auth,authM}; })(); fbPromise.catch(()=>{fbPromise=null}); } return fbPromise; }
const coll=(db,fs)=>fs.collection(db,'artifacts',APP_ID,'public','data',COLLECTION);
async function saveResult(rec){ try{rec=JSON.parse(JSON.stringify(rec));}catch(e){} try{ let q=JSON.parse(localStorage.getItem('pending_'+COLLECTION)||'[]'); q=q.filter(x=>x&&x.id!==rec.id); q.push(rec); localStorage.setItem('pending_'+COLLECTION,JSON.stringify(q)); }catch(e){} await flushPending(); }
let _flushing=false;
async function flushPending(){ if(_flushing)return; _flushing=true; try{ const key='pending_'+COLLECTION, tried={}; for(;;){ let q; try{q=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){q=[]} const item=q.find(x=>x&&!tried[x.id]); if(!item)break; tried[item.id]=1; let ok=false; for(let a=0;a<4&&!ok;a++){ try{ const {db,fs}=await fb(); await fs.setDoc(fs.doc(coll(db,fs),item.id),item); ok=true; }catch(e){ console.warn('Save failed',e); await new Promise(r=>setTimeout(r,1500*(a+1))); } } if(ok){ try{ const cur=JSON.parse(localStorage.getItem(key)||'[]').filter(x=>x&&x.id!==item.id); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){} } } } finally { _flushing=false; } }
window.addEventListener('online',()=>{flushPending()}); setTimeout(()=>{flushPending()},2000);
async function teacherLogin(pw){ try{ const {auth,authM}=await fb(); await authM.signInWithEmailAndPassword(auth,TEACHER_EMAIL,pw); return true; }catch(e){ return false; } }
async function teacherLogout(){ try{ const {auth,authM}=await fb(); await authM.signOut(auth); await authM.signInAnonymously(auth); }catch(e){} }
async function loadResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); const out=[]; snap.forEach(d=>out.push(d.data())); return out.sort((a,b)=>(b.ts||0)-(a.ts||0)); }
async function clearResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); await Promise.all(snap.docs.map(d=>fs.deleteDoc(d.ref))); }
fb().catch(()=>{});

/* ================= Допоміжне ================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[].slice.call((r||document).querySelectorAll(s));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
const F=(a,b)=>'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';
const iv=s=>String(s).replace(/(<[^>]+>)|([a-zA-Zα])/g,(m,t,l)=>t?t:'<i class="v">'+l+'</i>');
function plain(s){return String(s).replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'($1)/($2)').replace(/\(1\)\/\(2\)/g,'½').replace(/<sup>2<\/sup>/g,'²').replace(/<sub>(.*?)<\/sub>/g,'_$1').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()}
const pi=k=>(k===1?'':k)+'π';
const pl=(n,o,f,m)=>{const a=n%100,b=n%10;return (a>10&&a<20)?m:(b===1?o:(b>=2&&b<=4?f:m))};
const toNum=s=>{s=String(s).trim();if(s==='')return NaN;return Number(s.replace(/[−–—]/g,'-').replace(',','.'))};
const coarse=()=>window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
const LET=['А','Б','В','Г'];

/* ================= Рисунки ================= */
const CX=150, CY=118, RR=78;
const BL='#1d4ed8', RD='#e0464e', OR='#e08a00', DK='#111';
const pt=(a,r)=>{ const g=a*Math.PI/180; return [CX+r*Math.cos(g), CY-r*Math.sin(g)]; };
const n1=v=>v.toFixed(1);
const TX='font-family="Times New Roman,serif" font-style="italic" font-size="17" text-anchor="middle" stroke="#fff" stroke-width="3.5" paint-order="stroke"';
const txt=(x,y,s,col)=>'<text x="'+n1(x)+'" y="'+n1(y)+'" '+TX+' fill="'+(col||DK)+'">'+s+'</text>';
const ln=(p,q,col,w)=>'<line x1="'+n1(p[0])+'" y1="'+n1(p[1])+'" x2="'+n1(q[0])+'" y2="'+n1(q[1])+'" stroke="'+col+'" stroke-width="'+(w||2.4)+'" stroke-linecap="round"/>';
const dot=(p,r)=>'<circle cx="'+n1(p[0])+'" cy="'+n1(p[1])+'" r="'+(r||3.2)+'" fill="'+DK+'"/>';
function arcPath(a,r){ const p1=pt(0,r), p2=pt(a,r); return 'M'+n1(p1[0])+' '+n1(p1[1])+' A'+r+' '+r+' 0 '+(a>180?1:0)+' 0 '+n1(p2[0])+' '+n1(p2[1]); }
function figure(f){
  let s='<svg class="gf" viewBox="0 0 300 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="рисунок">', O=[CX,CY];
  if(f.mode==='c'||f.mode==='s'){
    const fill=f.mode==='s'?'rgba(29,78,216,.14)':'none', sw=f.mode==='c'?4.2:2.6, col=f.mode==='c'?RD:BL;
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" fill="'+fill+'" stroke="'+col+'" stroke-width="'+sw+'"/>';
    if(f.dLab){ const a=pt(25,RR), b=pt(205,RR), m=pt(25,RR*0.55);
      s+=ln(a,b,DK,2.6)+dot(a)+dot(b)+txt(m[0]+4,m[1]-9,f.dLab); }
    else { const e=pt(35,RR), m=pt(35,RR/2); s+=ln(O,e,DK,2.6)+dot(e);
      if(f.rLab) s+=txt(m[0]+8,m[1]-9,f.rLab); }
    s+=dot(O)+txt(CX-12,CY+19,'O');
  } else {
    const a=f.alpha, P1=pt(0,RR), P2=pt(a,RR), mid=pt(a/2,RR+22);
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" fill="none" stroke="#c9d6f5" stroke-width="2.2"/>';
    if(f.mode==='sec'){
      s+='<path d="M'+CX+' '+CY+' L'+n1(P1[0])+' '+n1(P1[1])+' '+arcPath(a,RR).replace(/^M[^A]*/,'')+' Z" fill="rgba(29,78,216,.18)" stroke="'+BL+'" stroke-width="2.6" stroke-linejoin="round"/>';
    } else if(f.mode==='arc'){
      s+='<path d="'+arcPath(a,RR)+'" fill="none" stroke="'+RD+'" stroke-width="5" stroke-linecap="round"/>'+ln(O,P1,DK,2.4)+ln(O,P2,DK,2.4);
    } else {
      s+='<path d="M'+n1(P1[0])+' '+n1(P1[1])+' '+arcPath(a,RR).replace(/^M[^A]*/,'')+' Z" fill="rgba(224,70,78,.28)" stroke="'+RD+'" stroke-width="2.8" stroke-linejoin="round"/>'+
         '<polygon points="'+n1(CX)+','+n1(CY)+' '+n1(P1[0])+','+n1(P1[1])+' '+n1(P2[0])+','+n1(P2[1])+'" fill="none" stroke="'+DK+'" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 4"/>';
    }
    s+=dot(P1,3)+dot(P2,3);
    if(f.rLab){ const m=pt(0,RR*0.55); s+=txt(m[0],m[1]+19,f.rLab); }
    if(f.aLab){ s+='<path d="'+arcPath(a,20)+'" fill="none" stroke="'+OR+'" stroke-width="2.4"/>'; const m=pt(a/2,38); s+=txt(m[0],m[1]+5,f.aLab,'#a35f00'); }
    if(f.lLab) s+=txt(mid[0],mid[1]+5,f.lLab,RD);
    if(f.sLab) s+=txt(mid[0],mid[1]+5,f.sLab,BL);
    s+=dot(O)+txt(CX-12,CY+19,'O');
  }
  return s+'</svg>';
}

/* ================= Генератор завдань ================= */
const ARC=[], SEC=[], SEC3=[];
[20,30,36,40,45,60,72,90,120,135,150,180,240,270].forEach(a=>{
  for(let R=2;R<=15;R++){ if((R*a)%180===0 && R*a/180<=30) ARC.push([R,a]); }
});
[30,40,45,60,72,90,120,135,150,180,240,270].forEach(a=>{
  for(let R=2;R<=15;R++){
    if((R*R*a)%360===0 && R*R*a/360<=60){
      SEC.push([R,a]);
      if((R*a)%180===0 && ((R*a/180)*R)%2===0) SEC3.push([R,a]);
    }
  }
});

function stN(q,pre,suf,ans){ return {kind:'n',q:q,pre:iv(pre),suf:iv(suf),ans:ans,preP:plain(pre),sufP:plain(suf)}; }
function stF(q,right,wrong){
  const all=shuffle([right].concat(wrong)), ci=all.indexOf(right);
  return {kind:'f',q:q,opts:all,ci:ci};
}
/* формули (html) */

        iv('S<sub>сегм</sub> = S<sub>сект</sub> − S<sub>△</sub> = '+ex(p,q,'−'))]}; }
};
const ORDER=[['cR',5],['cD',5],['rFromC',6],['sR',5],['sD',6],['rFromS',6],['sFromC',6],['arcL',6],['arcA',6],['arcR',7],['secS',7],['secL',7],['seg',14],['seg',14]];
function finalize(t){
  t.steps.forEach(function(st){
    if(st.kind==='f' && st._right){ const all=shuffle([st._right].concat(st._wrong)); st.opts=all; st.ci=all.indexOf(st._right); delete st._right; delete st._wrong; }
  });
  t.qtext=plain(t.text);
  t.ctext=t.steps.map(function(st){ return st.kind==='f'?LET[st.ci]+') '+plain(st.opts[st.ci]):st.preP+' '+st.ans+' '+st.sufP; });
  return t;
}
function buildTasks(seed){
  rnd=mulberry32(seed);
  return ORDER.map(function(o,i){ const t=GEN[o[0]](); t.w=o[1]; t.id=o[0]+'_'+(i+1); return finalize(t); });
}

/* ================= Стан ================= */
let S={screen:'start',cur:0,tasks:[],ans:[],done:[],marks:[],score:0,seed:0,sur:'',nam:'',fi:0,fb:'',finished:false,used:false};
let W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0,log:[],durs:[]};
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0,log:[],durs:[]}}
function inTest(){return S.screen==='task'&&!S.finished}
/* понад половину кількості запитань: попередження; наступний вихід завершує тест (незавершений) */
function endAt(){return Math.floor(S.tasks.length/2)+2}
function warnAt(){return endAt()-1}
function leave(){if(!inTest()||W.awayAt)return;W.awayAt=Date.now();W.leaves++;W.log.push(S.cur+1);if(W.leaves>=endAt())terminateTest()}
function back(){if(!W.awayAt)return;const d=Math.round((Date.now()-W.awayAt)/1000);W.awaySec+=d;W.durs.push(d);W.awayAt=0}
function returned(){const had=!!W.awayAt;back();if(had&&inTest())showNotice()}
const NH=document.getElementById('noticeHost');
function showNotice(){
  const n=W.leaves,warn=n>=warnAt();
  NH.innerHTML='<div class="modal on" style="z-index:2147483645"><div class="nbox"><b style="font-size:19px">Увага!</b>'+
    '<p>Під час тестування не можна виходити з екрана тестування, інакше тест може завершитися, і доведеться проходити все спочатку.</p>'+
    (warn?'<p class="nw">Ви вже виходили з вікна тесту '+n+' '+pl(n,'раз','рази','разів')+', це понад половину кількості запитань. Наступного разу тестування завершиться, а тест залишиться незавершеним.</p>':'')+
    '<div class="row2"><button class="btn" id="ntOk">Зрозуміло</button></div></div></div>';
  document.getElementById('ntOk').onclick=function(){NH.innerHTML=''};
}
function terminateTest(){saveRecord(false);S.ended=true;NH.innerHTML='';show('ended')}
document.addEventListener('visibilitychange',function(){document.hidden?leave():returned()});
window.addEventListener('blur',leave);window.addEventListener('focus',returned);

function newSeed(){const q=/[?&]v=(\d+)/.exec(location.search);if(q&&!S.used){S.used=true;return +q[1]}S.used=true;return Math.floor(Math.random()*2147483647)+1}
function build(){
  S.seed=newSeed();S.tasks=buildTasks(S.seed);
  S.ans=S.tasks.map(t=>t.steps.map(st=>st.kind==='n'?'':null));
  S.done=S.tasks.map(()=>false);S.marks=S.tasks.map(()=>0);
  S.cur=0;S.finished=false;S.ended=false;S.score=0;S.fb='';S.fi=0;NH.innerHTML='';resetWatch();
}
function stepRight(t,k,a){
  const st=t.steps[k];
  if(st.kind==='f')return a===st.ci;
  const v=toNum(a);return isFinite(v)&&Math.abs(v-st.ans)<1e-9;
}
function stepsOk(i){const t=S.tasks[i];return t.steps.map((st,k)=>stepRight(t,k,S.ans[i][k]))}
function markOf(i){const ok=stepsOk(i),n=ok.filter(Boolean).length,tot=ok.length;return n===tot?1:(n*2>=tot?0.5:0)}
function allAnswered(i){return S.tasks[i].steps.every((st,k)=>{const a=S.ans[i][k];return st.kind==='f'?a!==null:String(a).trim()!==''})}
function ansText(i){
  const t=S.tasks[i];
  return t.steps.map(function(st,k){const a=S.ans[i][k];
    if(st.kind==='f')return a===null?'—':LET[a]+') '+plain(st.opts[a]);
    return String(a).trim()===''?'—':st.preP+' '+String(a).trim()+' '+st.sufP;}).join(' | ');
}
const fmtN=x=>String(x).replace('.',',');

/* ================= Відображення ================= */
const card=$('#card'),head=$('#head'),nav=$('#nav'),kp=$('#kp'),fbEl=$('#fb');
function cellsRow(review){
  let h='<div class="cells">';
  S.tasks.forEach(function(t,i){
    let c='cell';
    if(review||S.done[i])c+=S.marks[i]===1?' right':(S.marks[i]===0.5?' half':' wrong');
    if(i===S.cur)c+=' cur';
    h+=review?'<button class="'+c+'" data-go="'+i+'">'+(i+1)+'</button>':'<div class="'+c+'">'+(i+1)+'</div>';
  });
  return h+'</div>';
}
function stepsHTML(i,mode){
  const t=S.tasks[i];let h='';
  t.steps.forEach(function(st,k){
    const a=S.ans[i][k], ok=mode==='review'?stepRight(t,k,a):null;
    h+='<div class="stp"><div class="sq">'+st.q+'</div>';
    if(st.kind==='f'){
      h+='<div class="opts">'+st.opts.map(function(o,j){
        let c='opt';
        if(mode==='review'){ if(j===st.ci)c+=' right'; else if(j===a)c+=' wrong'; }
        else if(j===a)c+=' sel';
        return '<button class="'+c+'" data-opt="'+k+':'+j+'"'+(mode!=='live'?' disabled':'')+'><b>'+LET[j]+'</b>'+o+'</button>';
      }).join('')+'</div>';
    } else {
      const cls=mode==='review'?(ok?' right':' wrong'):'';
      h+='<div class="vrow"><span>'+st.pre+'</span><input id="ans'+k+'" data-k="'+k+'" class="vi'+cls+'" autocomplete="off" autocapitalize="off" spellcheck="false" '+(coarse()?'inputmode="none"':'inputmode="decimal"')+' value="'+String(a).replace(/"/g,'&quot;')+'" '+(mode!=='live'?'readonly':'')+'><span>'+st.suf+'</span></div>';
    }
    if(mode==='review' && !ok){
      h+='<div class="badbox">Ваша відповідь: '+(st.kind==='f'?(a===null?'—':LET[a]+') '+st.opts[a]):(String(a).trim()===''?'—':String(a).trim()))+
         '<br><span style="color:var(--oktx)">Правильно: '+(st.kind==='f'?LET[st.ci]+') '+st.opts[st.ci]:st.ans)+'</span></div>';
    }
    h+='</div>';
  });
  return h;
}
function taskHTML(i,mode){
  const t=S.tasks[i];
  let h='<div class="q">'+t.text+'</div><div class="figc">'+figure(t.fig)+'</div>';
  if(t.hint)h+='<div class="hint">'+t.hint+'</div>';
  h+=stepsHTML(i,mode);
  if(mode==='review'){
    const m=S.marks[i];
    h+=(m===1?'<div class="corrbox">✓ Правильно</div>':(m===0.5?'<div class="halfbox">Частково правильно: '+fmtN(S.tasks[i].w*m)+' з '+S.tasks[i].w+' балів</div>':'<div class="badbox">✗ Помилка (0 з '+S.tasks[i].w+' балів)</div>'));
    h+='<div class="solbox">'+S.tasks[i].sol.map(x=>'<div>'+x+'</div>').join('')+'</div>';
  }
  return h;
}
const PRAISE=['Молодець! Правильно!','Чудово, так і далі!','Відмінно, правильно!','Супер, ви на правильному шляху!','Правильно! Продовжуйте в тому ж дусі!'];
function keypadHTML(){
  const keys=['1','2','3','⌫','4','5','6',',','7','8','9','→','0'];
  const two=S.tasks[S.cur].steps.filter(s=>s.kind==='n').length>1;
  return '<div class="kp">'+keys.map(function(k){
    if(k==='→'&&!two)return '<button disabled style="visibility:hidden">→</button>';
    return '<button data-kk="'+k+'"'+(k==='0'?' style="grid-column:span 3"':'')+'>'+k+'</button>';
  }).join('')+'</div>';
}

  kp.innerHTML='';fbEl.innerHTML='';
  if(S.screen==='start'){
    head.innerHTML='';

      '<div class="hint" style="margin-top:8px"><b>Чесна робота.</b> Вчитель бачить час виконання тесту, а також скільки разів і на скільки ви виходили з вікна тесту. Виконуйте завдання самостійно.</div>'+
      '<div class="msg" id="smsg"></div>';
    nav.innerHTML='<span></span><button class="btn" id="go">Почати</button>';
    setTimeout(function(){const s=$('#sur');if(s&&!document.activeElement.id)s.focus()},50);
  }else if(S.screen==='task'){
    const i=S.cur,done=S.done[i];

      fbEl.innerHTML='<div class="fbk '+(S.marks[i]===1?'ok':'no')+'">'+S.fb+'</div>';

    }else{
      nav.innerHTML='<span></span><button class="btn" id="answer"'+(allAnswered(i)?'':' disabled')+'>Відповісти</button>';
      if(coarse()&&S.tasks[i].steps.some(s=>s.kind==='n'))kp.innerHTML=keypadHTML();
      setActive();
    }
  }else if(S.screen==='ended'){
    head.innerHTML='';
    card.innerHTML='<div class="endc"><h1>Тестування завершено</h1><p style="font-weight:700;line-height:1.5">Тестування завершено, бо ви забагато разів виходили з вікна тесту. Тест залишився незавершеним, і доведеться пройти його спочатку.</p><div class="btns" style="display:flex;justify-content:center;margin-top:14px"><button class="btn" id="again">Пройти ще раз</button></div></div>';
    nav.innerHTML='';
  }else if(S.screen==='review'){
    head.innerHTML='<div class="topbar"><span>Завдання '+(S.cur+1)+' з '+S.tasks.length+'</span></div>'+cellsRow(true)+'<div style="height:6px"></div>';
    card.innerHTML=taskHTML(S.cur,'review');
    nav.innerHTML='<button class="btn gh" id="prev"'+(S.cur===0?' disabled':'')+'>← Назад</button><button class="btn gh" id="toRes">← До результату</button><button class="btn" id="nextr"'+(S.cur===S.tasks.length-1?' disabled':'')+'>Далі →</button>';
  }else if(S.screen==='result'){
    head.innerHTML='';
    const pc=Math.round(S.score);
    card.innerHTML='<div class="res"><h1>Результат</h1><div class="nm">'+S.sur+' '+S.nam+'</div><div class="big">'+fmtN(S.score)+' з 100 балів</div><div class="pc">'+pc+' %</div>'+
      (W.leaves>=3?'<div class="warnc">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: '+W.leaves+'), тому є підозра, що завдання виконано недоброчесно.<br>Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>':'')+
      '<div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>'+
      '<div class="btns"><button class="btn gh" id="errs">Дивитись помилки</button><button class="btn" id="again">Пройти ще раз</button></div></div>';
    nav.innerHTML='';
  }
}
function firstEmptyN(){const t=S.tasks[S.cur];for(let k=0;k<t.steps.length;k++)if(t.steps[k].kind==='n'&&String(S.ans[S.cur][k]).trim()==='')return k;for(let k=0;k<t.steps.length;k++)if(t.steps[k].kind==='n')return k;return -1}
function setActive(){
  S.fi=firstEmptyN();
  $$('.vi').forEach(el=>el.classList.toggle('act',+el.dataset.k===S.fi));
  if(!coarse()&&S.fi>=0){const el=$('#ans'+S.fi);if(el)el.focus()}
}
function updBtn(){const b=$('#answer');if(b)b.disabled=!allAnswered(S.cur)}
function show(scr,cur){S.screen=scr;if(cur!==undefined)S.cur=cur;render();card.scrollTop=0}

/* ================= Події ================= */
card.addEventListener('input',function(e){
  const el=e.target.closest('.vi');if(!el||S.screen!=='task'||S.done[S.cur])return;
  S.ans[S.cur][+el.dataset.k]=el.value;updBtn();
});
card.addEventListener('focusin',function(e){
  const el=e.target.closest('.vi');if(!el||S.screen!=='task')return;
  S.fi=+el.dataset.k;$$('.vi').forEach(x=>x.classList.toggle('act',x===el));
});
card.addEventListener('click',function(e){
  const b=e.target.closest('[data-opt]');
  if(b&&S.screen==='task'&&!S.done[S.cur]){const p=b.dataset.opt.split(':');S.ans[S.cur][+p[0]]=+p[1];
    const sc=card.scrollTop;render();card.scrollTop=sc;return}
  const v=e.target.closest('.vi');
  if(v&&S.screen==='task'&&!S.done[S.cur]){S.fi=+v.dataset.k;$$('.vi').forEach(x=>x.classList.toggle('act',x===v))}
});
document.addEventListener('click',function(e){
  const t=e.target;let b;
  if((b=t.closest('[data-go]'))&&S.screen==='review'){show('review',+b.dataset.go);return}
  if(t.id==='go'){
    const s=$('#sur'),n=$('#nam');S.sur=s.value.trim();S.nam=n.value.trim();
    s.classList.toggle('err',!S.sur);n.classList.toggle('err',!S.nam);
    if(!S.sur||!S.nam){$('#smsg').textContent='Введіть прізвище та ім’я, щоб почати';return}
    build();show('task',0);return;
  }
  if(t.id==='answer'){doAnswer();return}
  if(t.id==='next'){
    if(S.cur===S.tasks.length-1){show('result')}else show('task',S.cur+1);return;
  }
  if(t.id==='prev'){show('review',S.cur-1);return}
  if(t.id==='nextr'){show('review',S.cur+1);return}
  if(t.id==='errs'){const f0=S.marks.findIndex(m=>m<1);show('review',f0<0?0:f0);return}
  if(t.id==='toRes'){show('result');return}
  if(t.id==='again'){build();show('task',0);return}
});
/* екранна клавіатура: оновлює стан, а потім поле */
document.addEventListener('pointerdown',function(e){
  const b=e.target.closest('[data-kk]');if(!b||S.screen!=='task'||S.done[S.cur])return;
  e.preventDefault();
  const k=b.dataset.kk,t=S.tasks[S.cur];
  const ns=[];t.steps.forEach((s,j)=>{if(s.kind==='n')ns.push(j)});
  if(S.fi<0||ns.indexOf(S.fi)<0)S.fi=ns[0];
  if(k==='→'){S.fi=ns[(ns.indexOf(S.fi)+1)%ns.length];$$('.vi').forEach(x=>x.classList.toggle('act',+x.dataset.k===S.fi));return}
  let v=String(S.ans[S.cur][S.fi]);
  if(k==='⌫')v=v.slice(0,-1);
  else if(k===','){if(v.indexOf(',')<0&&v!=='')v+=','}
  else if(v.length<6)v+=k;
  S.ans[S.cur][S.fi]=v;
  const inp=$('#ans'+S.fi);if(inp){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}))}
  updBtn();
});
document.addEventListener('keydown',function(e){
  if(S.screen==='start'){if(e.key==='Enter'&&$('#go'))$('#go').click();return}
  if(S.screen==='task'&&e.key==='Enter'){
    if(S.done[S.cur]){const n=$('#next');n&&n.click()}
    else if(allAnswered(S.cur)){const a=$('#answer');a&&!a.disabled&&a.click()}
    else if(e.target.classList&&e.target.classList.contains('vi')){const ns=[];S.tasks[S.cur].steps.forEach((s,j)=>{if(s.kind==='n')ns.push(j)});const nx=ns[ns.indexOf(+e.target.dataset.k)+1];if(nx!==undefined){const el=$('#ans'+nx);el&&el.focus()}}
    return;
  }
  if(S.screen==='review'&&(e.target.tagName!=='INPUT')){
    if(e.key==='ArrowRight'){const n=$('#nextr');n&&!n.disabled&&n.click()}
    if(e.key==='ArrowLeft'){const p=$('#prev');p&&!p.disabled&&p.click()}
  }
});

/* ================= Відповідь і запис ================= */
function doAnswer(){
  const i=S.cur;if(S.done[i]||!allAnswered(i))return;
  S.done[i]=true;S.marks[i]=markOf(i);
  S.fb=S.marks[i]===1?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Помилка.';
  if(i===S.tasks.length-1)finish();
  render();
}
function finish(){saveRecord(true)}
function saveRecord(fin){
  back();S.finished=true;
  const marks=S.tasks.map((t,i)=>S.done[i]?S.marks[i]:0);
  S.score=Math.round(S.tasks.reduce((sum,t,i)=>sum+t.w*marks[i],0)*10)/10;
  const now=Date.now();
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.sur+' '+S.nam,surname:S.sur,firstName:S.nam,
    ts:now,date:new Date(now).toISOString(),
    score:S.score,max:100,percent:Math.round(S.score),
    tasks:marks.slice(),weights:S.tasks.map(t=>t.w),rightCount:marks.filter(m=>m===1).length,
    qtext:S.tasks.map(t=>t.qtext),
    answers:S.tasks.map((t,i)=>S.done[i]?ansText(i):''),
    correct:S.tasks.map(t=>t.ctext.join(' | ')),
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,
    leaveTasks:W.log.slice(),leaveSecs:W.durs.slice(),
    finished:fin?1:0,answeredCount:S.done.filter(Boolean).length,endReason:fin?'':'exits',
    variant:S.seed,test:TEST_NAME
  });
}

/* ================= Журнал учителя ================= */
let JROWS=[];
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function openJ(){$('#jlock').style.display='block';$('#jmain').style.display='none';$('#jerr').textContent='';$('#jpw').value='';$('#jm').classList.add('on');setTimeout(()=>$('#jpw').focus(),50)}
function closeJ(){$('#jm').classList.remove('on')}
$('#keyb').onclick=openJ;
$('#jcancel').onclick=closeJ;
$('#jx').onclick=function(){closeJ();teacherLogout();$('#jlock').style.display='block';$('#jmain').style.display='none'};
function unlockJ(){
  teacherLogin($('#jpw').value).then(function(ok){if(ok){$('#jlock').style.display='none';$('#jmain').style.display='block';$('#jpw').value='';refreshJ()}else{$('#jerr').textContent='Неправильний пароль'}});
}
$('#jok').onclick=unlockJ;$('#jpw').addEventListener('keydown',function(e){if(e.key==='Enter')unlockJ()});
async function refreshJ(){
  $('#jtab').textContent='Завантаження…';$('#jconf').textContent='';
  try{JROWS=await loadResults()}catch(e){$('#jtab').innerHTML='<div class="msg">Не вдалося підключитися до бази результатів</div>';return}
  drawJ();
}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function drawJ(){
  if(!JROWS.length){$('#jtab').textContent='Поки що немає записів.';return}
  const mx=Math.max.apply(null,JROWS.map(r=>(r.tasks||[]).length));
  let h='<table class="jt"><tr><th>№</th><th class="l">Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=mx;i++)h+='<th>'+i+'</th>';h+='</tr>';
  JROWS.forEach(function(r,k){
    const d=r.date?new Date(r.date):null,ds=d?d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'—';
    const hasT=typeof r.durationSec==='number',fast=hasT&&r.durationSec<120,hasL=typeof r.leaves==='number';
    h+='<tr><td>'+(k+1)+'</td><td class="l nm" data-det="'+k+'">'+esc(r.name||'—')+'</td><td>'+ds+'</td><td'+(fast?' class="r" title="Дуже швидко"':'')+'>'+(hasT?mmss(r.durationSec):'—')+'</td><td'+(hasL&&r.leaves>=3?' class="r"':'')+'>'+(hasL?r.leaves+' ('+mmss(r.awaySec||0)+')':'—')+'</td><td><b>'+String(r.score).replace('.',',')+'</b> з '+(r.max||100)+(r.finished===0?'<br><span class="r">не завершено ('+(r.answeredCount||0)+' з '+((r.tasks||[]).length)+')</span>':'')+'</td>';
    for(let i=0;i<mx;i++){const v=(r.tasks||[])[i];h+='<td class="'+(v===undefined?'':v>=1?'y':(v>0?'h':'n'))+'">'+(v===undefined?'':v>=1?'✓':(v>0?'½':'✗'))+'</td>'}
    const W_=r.weights||[];
    let lvd='';if(r.leaves&&(r.leaveTasks||[]).length){const by={};(r.leaveTasks||[]).forEach(function(n){by[n]=(by[n]||0)+1});lvd=' (де саме: '+Object.keys(by).map(function(n){return 'завд. '+n+' — '+by[n]+' р.'}).join(', ')+')'+((r.leaveSecs||[]).length?'; тривалість виходів, с: '+r.leaveSecs.join(', '):'')}
    h+='</tr><tr id="det'+k+'" style="display:none"><td colspan="'+(6+mx)+'" class="det">'+(r.finished===0?'<div class="dr bad"><b class="da">Тест НЕ завершено:</b> тестування закрито після забагатьох виходів з вікна; дано відповідей: '+(r.answeredCount||0)+' з '+((r.tasks||[]).length)+'.</div>':'')+'<div class="dh">Оцінка: '+String(r.score).replace('.',',')+' з '+(r.max||100)+' ('+(typeof r.percent==='number'?r.percent:Math.round(r.score))+' %)'+(hasL?' · Виходів: '+r.leaves+', поза вікном: '+mmss(r.awaySec||0)+lvd:'')+'</div>'+
      (r.qtext||[]).map(function(q,i){
        const m=(r.tasks||[])[i],w=W_[i],bad=!(m>=1);
        return '<div class="dr '+(bad?'bad':'good')+'"><b class="dn">'+(i+1)+'.</b> '+esc(q)+'<br><span class="da">Відповідь: '+((r.answers||[])[i]?esc((r.answers||[])[i]):'без відповіді')+'</span> · Правильно: '+esc((r.correct||[])[i]||'—')+
          ' · <span class="dm">'+(bad?(m>0?'½ ':'✗ '):'✓ ')+(w!==undefined&&m!==undefined?'балів: '+String(w*m).replace('.',',')+' з '+w:'')+'</span></div>';
      }).join('')+'</td></tr>';
  });
  $('#jtab').innerHTML=h+'</table>';
}
$('#jtab').addEventListener('click',function(e){const n=e.target.closest('[data-det]');if(n){const r=$('#det'+n.dataset.det);r.style.display=r.style.display==='none'?'table-row':'none'}});
$('#jref').onclick=refreshJ;
$('#jcsv').onclick=function(){
  const mx=Math.max.apply(null,[0].concat(JROWS.map(r=>(r.tasks||[]).length)));
  const hd=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (з 100)','Відсоток','Статус'];for(let i=1;i<=mx;i++)hd.push('завд. '+i);
  const lines=[hd.join(';')].concat(JROWS.map(function(r){
    const row=[r.name||'',r.date?new Date(r.date).toLocaleString('uk-UA'):'',typeof r.durationSec==='number'?mmss(r.durationSec):'',typeof r.leaves==='number'?r.leaves:'',typeof r.awaySec==='number'?mmss(r.awaySec):'',String(r.score).replace('.',','),typeof r.percent==='number'?r.percent:'',r.finished===0?'не завершено':'завершено'];
    for(let i=0;i<mx;i++){const v=(r.tasks||[])[i];row.push(v===undefined?'':v>=1?'+':(v>0?'0,5':'-'))}
    return row.join(';');
  }));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='Коло_і_круг_9клас_результати.csv';a.click();
};
$('#jclr').onclick=function(){
  $('#jconf').innerHTML='Видалити всі записи ('+JROWS.length+')? <button class="btn" id="cy" style="min-height:36px;background:var(--bad)">Так, видалити</button> <button class="btn gh" id="cn" style="min-height:36px">Скасувати</button>';
  $('#cn').onclick=function(){$('#jconf').textContent=''};
  $('#cy').onclick=async function(){
    try{await clearResults();JROWS=[];drawJ();$('#jconf').textContent=''}catch(e){$('#jconf').textContent='Не вдалося очистити записи. Перевірте правила бази Firebase'}
  };
};

/* ================= Старт (і самоперевірка для розробника) ================= */
if(/[?&]selftest/.test(location.search))window.__ST={endAt:endAt,warnAt:warnAt,buildTasks:buildTasks,ORDER:ORDER,stepRight:stepRight,plain:plain,get S(){return S}};
render();
})();
</script>
