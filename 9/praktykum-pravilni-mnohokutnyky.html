<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практикум. Правильні многокутники й кола (9 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13203f; --muted:#5b6b8f; --acc:#1d4ed8; --acc2:#4f7cf0; --accL:#dbe5ff;
  --soft:#ebf0ff; --soft2:#f6f8ff; --line:#c9d6f5;
  --ok:#1e9e62; --okbg:#e6f7ee; --oktx:#14663f; --okln:#8fd3b0;
  --bad:#e0464e; --badbg:#fdecee; --badtx:#a3232b; --badln:#efa3a8;
  --q:#2f9e44;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:clamp(16px,min(1.4545vw,2.6016vh),40px)}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#ebf0ff 0%,#dbe5ff 45%,#c7d6ff 100%) fixed;min-height:100vh;line-height:1.45}
.wrap{max-width:61.25rem;margin:0 auto;padding:1rem 0.875rem 3.75rem}
i,.m{font-family:'STIX Two Text','Times New Roman',Times,serif;font-style:italic;font-size:1.06em}
sup,sub{font-size:.7em;line-height:0}
button,input{font-family:inherit}

.hero{background:var(--acc);color:#fff;border-radius:1.25rem;padding:1rem 1.375rem;position:relative;overflow:hidden;box-shadow:0 0.5rem 1.5rem rgba(29,78,216,.25)}
.pill{display:inline-block;background:#ffb938;color:#4a3000;font-weight:900;font-size:0.8125rem;letter-spacing:.06em;padding:0.3125rem 0.875rem;border-radius:62.4375rem}
.hero h1{margin:0.5rem 0 0.125rem;font-size:clamp(1.375rem,4.4vw,2rem);line-height:1.15;font-weight:900;padding-right:5rem}
.hero p{margin:0;font-size:1rem;opacity:.95;padding-right:5rem}
.hero svg{position:absolute;right:0.875rem;top:0.75rem;width:4.375rem;height:4rem;opacity:.9}

.tabs{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0.875rem 0 0.25rem}
.tab{min-width:3rem;min-height:2.75rem;border:0.125rem solid var(--line);background:#fff;color:var(--ink);font-weight:900;font-size:1.0625rem;border-radius:0.75rem;cursor:pointer;padding:0.375rem 0.75rem;touch-action:manipulation}
.tab.on{background:var(--q);border-color:var(--q);color:#fff}
.tab.ok::after{content:" ✓";font-weight:900}
.tab.ok:not(.on){background:var(--okbg);border-color:var(--okln);color:var(--oktx)}

.card{margin-top:0.75rem;background:#fff;border:0.125rem solid var(--line);border-radius:1rem;padding:0.75rem 0.875rem}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 0.125rem;font-size:.95em}
.fr>span:first-child{border-bottom:0.0938rem solid currentColor;padding:0 0.1875rem}.fr>span:last-child{padding:0 0.1875rem}
.tbw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:1.125rem}
.tbl th,.tbl td{border:0.125rem solid var(--line);padding:0.375rem 0.5rem;text-align:center}
.tbl th{background:var(--soft);font-size:1rem}
.tbl td.rl,.tbl th.rl{text-align:left;font-weight:800;font-size:0.9688rem;width:30%}
.tbl tr.sep td{background:var(--soft2);font-weight:900;color:var(--acc);text-align:left;font-size:0.9062rem;padding:0.25rem 0.5rem}
.cc{padding:0.0625rem 0.1875rem;border-radius:0.1875rem}
.cc.m1{background:linear-gradient(transparent 38%,rgba(255,212,59,.75) 38%)}
.cc.m2{background:linear-gradient(transparent 38%,rgba(105,219,124,.65) 38%)}
.cnote{font-size:0.9375rem;color:var(--muted);margin:0.5rem 0.125rem 0;font-weight:700}

.task{border-left:0.5rem solid var(--q)}
.th{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.375rem}
.tn{background:var(--q);color:#fff;font-weight:900;padding:0.25rem 0.75rem;border-radius:0.625rem;font-size:1.125rem}
.tt{font-size:1.1875rem;font-weight:700;margin:0 0 0.375rem}
.cols{display:flex;gap:0.875rem;flex-wrap:wrap;align-items:flex-start}
.figc{flex:1 1 18.75rem;max-width:23.75rem;margin:0 auto}
.gf{width:100%;height:auto;display:block}
.leg{font-size:0.9375rem;margin-top:0.125rem}
.leg div{margin:0.1875rem 0}
.sq{display:inline-block;width:0.75rem;height:0.75rem;border-radius:0.1875rem;margin-right:0.375rem;vertical-align:-0.0625rem}
.work{flex:1 1 18.75rem}
.arow{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin:0.5rem 0}
.arow label{font-weight:800;font-size:1.125rem}
.arow input{width:8.75rem;font-size:1.25rem;padding:0.625rem;text-align:center;border:0.125rem solid var(--line);border-radius:0.625rem;font-family:'STIX Two Text','Times New Roman',serif;color:var(--ink)}
.arow input:focus{outline:none;border-color:var(--q);box-shadow:0 0 0 0.1875rem rgba(0,0,0,.07)}
.arow input.good{border-color:var(--ok);background:var(--okbg)}
.arow input.badi{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--q);color:#fff;border:0;border-radius:0.75rem;font-weight:900;font-size:1.0625rem;padding:0.625rem 1.125rem;cursor:pointer;touch-action:manipulation;min-height:2.875rem}
.btn.sec{background:#fff;color:var(--q);border:0.125rem solid var(--q)}
.btn.rt{background:#fff;color:var(--ink);border:0.125rem solid var(--line);min-width:2.875rem;padding:0.625rem 0.75rem;font-size:1.25rem}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:0.375rem;border-radius:0.75rem;padding:0.5rem 0.75rem;font-size:1rem;font-weight:700}
.msg.ok{background:var(--okbg);border:0.125rem solid var(--okln);color:var(--oktx)}
.msg.no{background:var(--badbg);border:0.125rem solid var(--badln);color:var(--badtx)}
.steps{margin-top:0.5rem}
.st{font-size:1.25rem;padding:0.4375rem 0.625rem;margin:0.375rem 0;border-left:0.25rem solid var(--line);background:var(--soft2);border-radius:0.5rem}
.st.fin{background:var(--okbg);border:0.125rem solid var(--okln);color:var(--oktx);font-weight:900;border-left-width:0.375rem}
.next{margin-top:0;display:none;margin-left:auto}
.auth{text-align:center;font-size:0.625rem;color:var(--muted);margin-top:1.375rem}
@media(max-width:520px){
  .hero{padding:0.875rem}.hero svg{width:3.375rem;height:3rem}.hero h1,.hero p{padding-right:3.5rem}
  .tbl{font-size:0.875rem}.tbl th,.tbl td{padding:0.25rem 0.1875rem}.tbl td.rl,.tbl th.rl{font-size:0.7812rem}.tbl th{font-size:0.7812rem}
  .tt{font-size:1.0625rem}.st{font-size:1.0625rem}
}

/* компактний макет: усе в один екран, таблиця у спливній панелі */
.wrap{padding:0.625rem 0.75rem 1rem}
.hero{padding:0.5rem 1rem;border-radius:0.875rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;box-shadow:0 0.25rem 0.875rem rgba(29,78,216,.22)}
.hero h1{margin:0;font-size:1.375rem;padding-right:0}
.hero p{font-size:0.875rem;padding-right:0}
.hero svg{display:none}
.hero .pill{font-size:0.6875rem;padding:0.1875rem 0.625rem}
.tabs{margin:0.5rem 0 0;gap:0.375rem}
.tab{min-height:2.375rem;min-width:2.625rem;font-size:1rem;padding:0.25rem 0.625rem}
.task{margin-top:0.5rem;padding:0.625rem 0.875rem}
.th .tbtn{margin-left:auto;min-height:2.5rem;padding:0.375rem 0.875rem;font-size:1rem}
.tt{font-size:1.125rem;margin:0 0 0.25rem}
.cols{gap:0.75rem}
.figc{flex:0 1 18.75rem}
.gf{max-height:12.5rem}
.leg{font-size:0.875rem}
.arow{margin:0.375rem 0}
.st{font-size:1.125rem;padding:0.3125rem 0.625rem;margin:0.25rem 0}
.next{margin-top:0.5rem}
.ov{position:fixed;inset:0;background:rgba(19,32,63,.38);display:none;align-items:flex-start;justify-content:center;padding:3.5rem 0.625rem 0.625rem;z-index:50;overflow:auto}
.ov.on{display:flex}
.pnl{background:#fff;border-radius:1rem;padding:0.625rem 0.875rem 0.75rem;max-width:48.75rem;width:100%;box-shadow:0 0.875rem 2.75rem rgba(0,0,0,.35);border:0.125rem solid var(--line)}
.pnl .ph{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:1.0625rem;margin-bottom:0.375rem}
.pnl .ph .btn{min-height:2.375rem;padding:0.25rem 0.875rem}
@media(max-width:520px){
  .hero p{display:none}.hero h1{font-size:1.1875rem}
  .gf{max-height:10.625rem}.figc{flex-basis:100%}
  .th .tbtn{font-size:0.875rem;padding:0.375rem 0.625rem}
}

.msg{margin-top:0.125rem;padding:0.25rem 0.625rem;font-size:0.9375rem}
.st{font-size:1.0625rem;padding:0.1875rem 0.625rem;margin:0.1875rem 0}
.steps{margin-top:0.25rem}
.arow{margin:0.25rem 0}
.task{padding:0.5rem 0.875rem}
.next{margin-top:0}

/* практикум: вибір формул і варіанти відповіді */
.tt .tn{font-size:0.9375rem;margin-right:0.5rem;display:inline-block;padding:0.125rem 0.625rem;vertical-align:0.0625rem}
.bt{font-weight:800;font-size:1.0312rem;margin:0.375rem 0 0.125rem}
.bt .k{background:var(--q);color:#fff;border-radius:0.5rem;padding:0.0625rem 0.5625rem;margin-right:0.375rem;font-size:0.875rem}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem;min-height:3.125rem;align-items:center;padding:0.3125rem 0.5rem;border:0.125rem dashed var(--line);border-radius:0.75rem;margin:0.25rem 0;background:var(--soft2);font-size:1.125rem}
.chips .ph{color:var(--muted);font-size:0.9062rem;font-weight:700}
.chip{background:#fff;border:0.125rem solid var(--q);border-radius:0.625rem;padding:0.125rem 0.625rem;display:inline-flex;align-items:center;gap:0.5rem}
.chip.ok{background:var(--okbg);border-color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad)}
.chip .x{border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 0.125rem}
.opts{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0.25rem 0}
.opt{background:#fff;border:0.125rem solid var(--q);color:var(--ink);border-radius:0.75rem;font-size:1.25rem;font-weight:700;padding:0.3125rem 1rem;min-height:2.75rem;cursor:pointer;font-family:'STIX Two Text','Times New Roman',serif;touch-action:manipulation}
.opt b{font-family:'Nunito',sans-serif;color:var(--q);margin-right:0.375rem;font-size:1.0625rem}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}
.tbl td.pk{cursor:pointer}
.tbl td.pk:hover{background:var(--soft2)}
.tbl td.pk.sel{outline:0.1875rem solid var(--q);outline-offset:-0.1875rem;background:#f0f6ff}
.tbl td.pk.lock{cursor:default}
.fm{display:inline-block;margin-left:0.375rem;font-size:0.9688rem;font-weight:700;vertical-align:middle}
.fm.ok{color:var(--oktx)}.fm.no{color:var(--badtx)}
.sw{font-size:0.9375rem;color:var(--muted);font-weight:700;margin:0 0 0.25rem}

.bt{display:flex;flex-wrap:wrap;align-items:center;gap:0.375rem 0.5rem;margin:0.375rem 0 0.1875rem}
.bb{display:inline-flex;gap:0.5rem;flex-wrap:wrap}
.btn.sm{min-height:2.375rem;padding:0.25rem 0.75rem;font-size:0.9375rem}
.next{margin-left:0}
.chips{min-height:2.75rem}
.chip .fx{display:inline-block}

.auth{margin-top:0.375rem}
.wrap{padding-bottom:0.375rem}
.or{font-weight:800;color:var(--muted);font-size:0.9375rem;align-self:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="pill">ГЕОМЕТРІЯ · 9 КЛАС</span>
    <h1>Практикум</h1>
    <p>Правильні многокутники й спільне коло: комбіновані задачі</p>
    <svg viewBox="0 0 84 76" fill="none"><circle cx="42" cy="38" r="34" stroke="#fff" stroke-opacity=".45" stroke-width="2"/><polygon points="76,38 59,67.4 25,67.4 8,38 25,8.6 59,8.6" stroke="#ffb938" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="38" r="29.4" stroke="#fff" stroke-opacity=".45" stroke-width="2"/></svg>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="ov" id="ov"><div class="pnl">
    <div class="ph"><span>Таблиця формул: клацніть на потрібні</span><button type="button" class="btn sec" id="tbX">✓ Готово</button></div>
    <div class="tbw" id="tblHost"></div>
    <div class="cnote">Вписаний многокутник: коло для нього описане, радіус <i>R</i>. Многокутник описано навколо кола: коло для нього вписане, радіус <i>r</i>.</div>
  </div></div>

  <div class="card task" id="task"></div>
  <div class="auth">Автор розробки <b>Ковтун Тетяна</b></div>
</div>

<script>
(function(){ "use strict";
const $=(s,r)=>(r||document).querySelector(s);
const FR=(a,b)=>'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';
const V=(x,n)=>'<i>'+x+'</i>'+(n?'<sub>'+n+'</sub>':'');
const a_=n=>V('a',n), R_=n=>V('R',n), r_=n=>V('r',n);

/* ===== Таблиця (на кожній сторінці) ===== */
const CELLS={
 R3:R_(3)+' = '+FR(V('a')+'√3','3'), R4:R_(4)+' = '+FR(V('a')+'√2','2'), R6:R_(6)+' = '+V('a'),
 r3:r_(3)+' = '+FR(V('a')+'√3','6'), r4:r_(4)+' = '+FR(V('a'),'2'), r6:r_(6)+' = '+FR(V('a')+'√3','2'),
 aR3:a_(3)+' = '+V('R')+'√3', aR4:a_(4)+' = '+V('R')+'√2', aR6:a_(6)+' = '+V('R'),
 ar3:a_(3)+' = 2'+V('r')+'√3', ar4:a_(4)+' = 2'+V('r'), ar6:a_(6)+' = '+FR('2'+V('r')+'√3','3')
};
function tableHTML(){
  const c=(id)=>'<td class="pk" data-c="'+id+'"><span class="cc">'+CELLS[id]+'</span></td>';
  const row=(lab,ids)=>'<tr><td class="rl">'+lab+'</td>'+ids.map(c).join('')+'</tr>';
  return '<table class="tbl"><tr><th class="rl">Правильний <i>n</i>-кутник</th><th>трикутник<br><i>n</i> = 3</th><th>квадрат<br><i>n</i> = 4</th><th>шестикутник<br><i>n</i> = 6</th></tr>'+
   '<tr class="sep"><td colspan="4">Знаходимо радіус за стороною <i>a</i></td></tr>'+
   row('Радіус описаного кола <i>R</i>',['R3','R4','R6'])+
   row('Радіус вписаного кола <i>r</i>',['r3','r4','r6'])+
   '<tr class="sep"><td colspan="4">Знаходимо сторону <i>a</i> за радіусом</td></tr>'+
   row('Сторона <i>a</i> за радіусом описаного кола <i>R</i>',['aR3','aR4','aR6'])+
   row('Сторона <i>a</i> за радіусом вписаного кола <i>r</i>',['ar3','ar4','ar6'])+'</table>';
}

/* ===== Рисунки ===== */
const DEG=Math.PI/180, CX=150, CY=138, RHO=60;
const NAME={3:'правильний трикутник',4:'квадрат',6:'правильний шестикутник'};
function polyPts(n,rel){
  const Rp=rel==='in'?RHO:RHO/Math.cos(Math.PI/n);
  const st=n===3?-90:(n===4?(rel==='in'?0:45):0);
  return Array.from({length:n},(_,k)=>{const g=(st+k*360/n)*DEG;return [CX+Rp*Math.cos(g),CY+Rp*Math.sin(g)];});
}
const pstr=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function radiusSvg(g){
  const th=(g.rel==='out'?90:(g.n===3?30:0))*DEG, lab=g.rel==='in'?'R':'r';
  const x2=CX+RHO*Math.cos(th), y2=CY+RHO*Math.sin(th);
  const lx=CX+RHO/2*Math.cos(th)+12*Math.sin(th), ly=CY+RHO/2*Math.sin(th)-12*Math.cos(th)+5;
  return '<line x1="'+CX+'" y1="'+CY+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#111" stroke-width="2.8" stroke-linecap="round"/>'+
    '<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="3.4" fill="#111"/>'+
    '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-family="STIX Two Text,Times New Roman,serif" font-style="italic" font-size="18" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">'+lab+'</text>';
}
function figure(g,t){
  const A=polyPts(g.n,g.rel), B=polyPts(t.n,t.rel);
  return '<svg class="gf" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="рисунок">'+
   '<polygon points="'+pstr(A)+'" fill="rgba(29,78,216,.08)" stroke="#1d4ed8" stroke-width="2.6" stroke-linejoin="round"/>'+
   '<polygon points="'+pstr(B)+'" fill="rgba(224,70,78,.07)" stroke="#e0464e" stroke-width="2.6" stroke-linejoin="round"/>'+
   '<circle cx="'+CX+'" cy="'+CY+'" r="'+RHO+'" fill="none" stroke="#e08a00" stroke-width="2.4"/>'+
   radiusSvg(g)+'<circle cx="'+CX+'" cy="'+CY+'" r="3.2" fill="#111"/>'+
   '<text x="'+(CX-8)+'" y="'+(CY-6)+'" text-anchor="end" font-family="STIX Two Text,Times New Roman,serif" font-style="italic" font-size="17" fill="#13203f">O</text></svg>';
}

/* ===== Задачі ===== */
const sq2='√2', sq3='√3';
const TASKS=[
 {text:'У коло вписано правильний трикутник зі стороною 12 см. Знайдіть сторону квадрата, вписаного в це коло.',
  g:{n:3,rel:'in',side:'12'},t:{n:4,rel:'in'},ans:4*Math.sqrt(6),show:'4√6',approx:'≈ 9,8',
  st:[{h:R_(3)+' = '+FR('12'+sq3,'3')+' = 4'+sq3,c:'R3'},
      {h:R_(4)+' = 4'+sq3},
      {h:a_(4)+' = '+R_(4)+sq2+' = 4'+sq3+' · '+sq2+' = 4√6',c:'aR4'}]},
 {text:'Правильний шестикутник зі стороною 8 см вписано в коло. Знайдіть сторону правильного трикутника, описаного навколо цього кола.',
  g:{n:6,rel:'in',side:'8'},t:{n:3,rel:'out'},ans:16*Math.sqrt(3),show:'16√3',approx:'≈ 27,7',
  st:[{h:R_(6)+' = '+a_(6)+' = 8',c:'R6'},
      {h:r_(3)+' = '+R_(6)+' = 8'},
      {h:a_(3)+' = 2'+r_(3)+sq3+' = 2 · 8 · '+sq3+' = 16'+sq3,c:'ar3'}]},
 {text:'Навколо кола описано квадрат зі стороною 10 см. Знайдіть сторону правильного шестикутника, вписаного в це коло.',
  g:{n:4,rel:'out',side:'10'},t:{n:6,rel:'in'},ans:5,show:'5',approx:'',
  st:[{h:r_(4)+' = '+FR('10','2')+' = 5',c:'r4'},
      {h:R_(6)+' = '+r_(4)+' = 5'},
      {h:a_(6)+' = '+R_(6)+' = 5',c:'aR6'}]},
 {text:'Навколо кола описано правильний трикутник зі стороною 18√3 см. Знайдіть сторону правильного шестикутника, описаного навколо цього кола.',
  g:{n:3,rel:'out',side:'18√3'},t:{n:6,rel:'out'},ans:6*Math.sqrt(3),show:'6√3',approx:'≈ 10,4',
  st:[{h:r_(3)+' = '+FR('18'+sq3+' · '+sq3,'6')+' = '+FR('54','6')+' = 9',c:'r3'},
      {h:r_(6)+' = '+r_(3)+' = 9'},
      {h:a_(6)+' = '+FR('2 · 9 · '+sq3,'3')+' = 6'+sq3,c:'ar6'}]},
 {text:'У коло вписано правильний шестикутник зі стороною 9√2 см. Знайдіть сторону квадрата, описаного навколо цього кола.',
  g:{n:6,rel:'in',side:'9√2'},t:{n:4,rel:'out'},ans:18*Math.sqrt(2),show:'18√2',approx:'≈ 25,5',
  st:[{h:R_(6)+' = '+a_(6)+' = 9'+sq2,c:'R6'},
      {h:r_(4)+' = '+R_(6)+' = 9'+sq2},

 {text:'Навколо кола описано квадрат зі стороною 14√3 см. Знайдіть сторону правильного трикутника, вписаного в це коло.',
  g:{n:4,rel:'out',side:'14√3'},t:{n:3,rel:'in'},ans:21,show:'21',approx:'',
  st:[{h:r_(4)+' = '+FR('14'+sq3,'2')+' = 7'+sq3,c:'r4'},
      {h:R_(3)+' = '+r_(4)+' = 7'+sq3},
      {h:a_(3)+' = '+R_(3)+sq3+' = 7'+sq3+' · '+sq3+' = 21',c:'aR3'}]},
 {text:'У коло вписано правильний трикутник зі стороною 6 см. Знайдіть сторону правильного шестикутника, описаного навколо цього кола.',
  g:{n:3,rel:'in',side:'6'},t:{n:6,rel:'out'},ans:4,show:'4',approx:'',
  st:[{h:R_(3)+' = '+FR('6'+sq3,'3')+' = 2'+sq3,c:'R3'},

 {text:'Навколо кола описано правильний шестикутник зі стороною 12 см. Знайдіть сторону правильного трикутника, вписаного в це коло.',
  g:{n:6,rel:'out',side:'12'},t:{n:3,rel:'in'},ans:18,show:'18',approx:'',
  st:[{h:r_(6)+' = '+FR('12'+sq3,'2')+' = 6'+sq3,c:'r6'},
      {h:R_(3)+' = '+r_(6)+' = 6'+sq3},
      {h:a_(3)+' = '+R_(3)+sq3+' = 6'+sq3+' · '+sq3+' = 18',c:'aR3'}]},
 {text:'У коло вписано квадрат зі стороною 8√2 см. Знайдіть сторону правильного трикутника, вписаного в це коло.',
  g:{n:4,rel:'in',side:'8√2'},t:{n:3,rel:'in'},ans:8*Math.sqrt(3),show:'8√3',approx:'≈ 13,9',
  st:[{h:R_(4)+' = '+FR('8'+sq2+' · '+sq2,'2')+' = '+FR('16','2')+' = 8',c:'R4'},
      {h:R_(3)+' = '+R_(4)+' = 8'},
      {h:a_(3)+' = '+R_(3)+sq3+' = 8'+sq3,c:'aR3'}]},
 {text:'Навколо кола описано правильний трикутник зі стороною 24√3 см. Знайдіть сторону квадрата, вписаного в це коло.',
  g:{n:3,rel:'out',side:'24√3'},t:{n:4,rel:'in'},ans:12*Math.sqrt(2),show:'12√2',approx:'≈ 17,0',
  st:[{h:r_(3)+' = '+FR('24'+sq3+' · '+sq3,'6')+' = '+FR('72','6')+' = 12',c:'r3'},
      {h:R_(4)+' = '+r_(3)+' = 12'},
      {h:a_(4)+' = '+R_(4)+sq2+' = 12'+sq2,c:'aR4'}]}
];
const QC=['#2f9e44','#1971c2','#7a8a1d','#4c3fb5'];

/* ===== Варіанти відповіді ===== */
const WR=[['4√3','12','2√6'],['8√3','8','16'],['10','5√3','5√2'],['9','18','9√3'],['9√2','18','18√3'],
          ['7√3','14√3','21√3'],['2√3','6','4√3'],['6√3','12','18√3'],['8√2','16','8'],['12','12√3','24√2']];
const POS=[2,0,3,1,2,0,1,3,0,2];
TASKS.forEach((t,i)=>{ const o=WR[i].slice(); o.splice(POS[i],0,t.show); t.opts=o; t.ci=POS[i]; });
const normId=id=>id.replace(/^a/,'');
const needOf=t=>Array.from(new Set(t.st.filter(s=>s.c).map(s=>normId(s.c))));


/* ===== Задача 11: генератор нових задач ===== */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
// число виду (p/q)·√m, m без квадратних множників; p,q цілі
function RN(p,q,m){ return {p:p,q:q,m:m}; }
function rnMul(a,b){
  let p=a.p*b.p, q=a.q*b.q, m=a.m*b.m, d=1;
  for(let k=2;k*k<=m;k++){ while(m%(k*k)===0){ m/=k*k; d*=k; } }
  p*=d; const g=gcd(p,q); return RN(p/g,q/g,m);
}
const rnVal=a=>a.p/a.q*Math.sqrt(a.m);
const rnInt=a=>a.q===1;
const rnStr=a=>{ const c=a.p; const r=a.m>1?'√'+a.m:''; return (c===1&&r)?r:(c+r); };
const KONST={aR3:RN(1,1,3),aR4:RN(1,1,2),aR6:RN(1,1,1),ar3:RN(2,1,3),ar4:RN(2,1,1),ar6:RN(2,3,3)};
const GN={3:'правильний трикутник',4:'квадрат',6:'правильний шестикутник'};
const GG={3:'правильного трикутника',4:'квадрата',6:'правильного шестикутника'};
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const hasRad=str=>str.indexOf('√')>=0;
const mulTxt=(A,r)=>hasRad(A)?A+' · '+r:A+r;
function genTask(){
  for(let guard=0;guard<5000;guard++){
    const gn=[3,4,6][rnd(3)], grel=rnd(2)?'in':'out', tn_=[3,4,6][rnd(3)], trel=rnd(2)?'in':'out';
    if(gn===tn_&&grel===trel) continue;
    const rho=RN(2+rnd(11),1,[1,2,3][rnd(3)]);
    const kg=KONST[(grel==='in'?'aR':'ar')+gn], kt=KONST[(trel==='in'?'aR':'ar')+tn_];
    const ag=rnMul(rho,kg), at=rnMul(rho,kt);
    if(!rnInt(ag)||!rnInt(at)||ag.p>60||at.p>60) continue;
    if(ag.m===1&&at.m===1&&rho.m===1&&0) continue;
    if(gn===6&&grel==='out'&&rnStr(ag)==='4√3') continue;   // умова 6.34
    if(gn===4&&grel==='in'&&rnStr(ag)==='6√2') continue;    // умова 6.35
    const A=rnStr(ag), RH=rnStr(rho), ans=rnStr(at);
    const L1=grel==='in'?'R':'r', L2=trel==='in'?'R':'r';
    const key1=L1+gn, key2='a'+L2+tn_;
    const F1={R3:FR(mulTxt(A,'√3'),'3'),R4:FR(mulTxt(A,'√2'),'2'),R6:A,r3:FR(mulTxt(A,'√3'),'6'),r4:FR(A,'2'),r6:FR(mulTxt(A,'√3'),'2')}[key1];
    const step1=(key1==='R6')?R_(6)+' = '+a_(6)+' = '+A:V(L1,gn)+' = '+F1+' = '+RH;
    const step2=V(L2,tn_)+' = '+V(L1,gn)+' = '+RH;
    const Lt=V(L2,tn_), sub=RH;
    const F3={aR3:[Lt+'√3',mulTxt(sub,'√3')],aR4:[Lt+'√2',mulTxt(sub,'√2')],aR6:[Lt,sub],
              ar3:['2'+Lt+'√3','2 · '+mulTxt(sub,'√3')],ar4:['2'+Lt,'2 · '+sub],
              ar6:[FR('2'+Lt+'√3','3'),FR('2 · '+mulTxt(sub,'√3'),'3')]}[key2];
    const step3=a_(tn_)+' = '+F3[0]+' = '+F3[1]+' = '+ans;
    // варіанти відповіді: типові помилки + запасні
    const altK=KONST[(trel==='in'?'ar':'aR')+tn_];
    const pool=[rnMul(rho,altK),rho,rnMul(rho,RN(2,1,1)),ag,rnMul(at,RN(2,1,1)),RN(at.p,1,at.m===2?3:2),
                rnMul(rho,RN(1,1,2)),rnMul(rho,RN(1,1,3)),rnMul(rho,RN(2,1,3)),rnMul(rho,RN(2,1,2)),RN(at.p+1,1,at.m),RN(Math.max(1,at.p-1),1,at.m)];
    const seen={}; seen[ans]=1; const wr=[];
    pool.forEach(c=>{ if(wr.length>=3||!rnInt(c)||c.p<1) return; const sv=rnStr(c); if(seen[sv]||Math.abs(rnVal(c)-rnVal(at))<1e-9) return; seen[sv]=1; wr.push(sv); });
    if(wr.length<3) continue;
    const opts=shuffle([ans].concat(wr)); const ci=opts.indexOf(ans);
    const text=(grel==='in'?'У коло вписано '+GN[gn]+' зі стороною '+A+' см.':'Навколо кола описано '+GN[gn]+' зі стороною '+A+' см.')+' Знайдіть сторону '+GG[tn_]+', '+(trel==='in'?'вписаного в це коло.':'описаного навколо цього кола.');
    return {text:text,g:{n:gn,rel:grel,side:A},t:{n:tn_,rel:trel},ans:rnVal(at),show:ans,approx:at.m>1?'≈ '+rnVal(at).toFixed(1).replace('.',','):'',
            st:[{h:step1,c:key1},{h:step2},{h:step3,c:key2}],opts:opts,ci:ci,gen:true};
  }
  return null;
}

TASKS.push(genTask());
let GC=0;
/* ===== Сторінки ===== */
const STATE=TASKS.map(()=>({sel:[],fok:false,fmsg:'',opts:false,bad:[],done:false,shown:0}));
let cur=0;
const LET=['А','Б','В','Г'];
function drawTabs(){
  $('#tabs').innerHTML=TASKS.map((t,i)=>'<button type="button" class="tab'+(i===cur?' on':'')+(STATE[i].done?' ok':'')+'" data-i="'+i+'">'+(i+1)+(t.gen?' ↻':'')+'</button>').join('');
}
function legend(g,t){
  const rl=r=>r==='in'?'вписаний у коло':'описаний навколо кола', L=r=>r==='in'?'R':'r';
  return '<div><span class="sq" style="background:#1d4ed8"></span>Дано: '+NAME[g.n]+' зі стороною '+g.side+' см, '+rl(g.rel)+'</div>'+
         '<div><span class="sq" style="background:#e0464e"></span>Знайти: сторону фігури ('+NAME[t.n]+', '+rl(t.rel)+')</div>'+
         '<div><span class="sq" style="background:#e08a00"></span>Спільне коло з центром <i>O</i></div>'+
         '<div><span class="sq" style="background:#111"></span>Радіус спільного кола: '+(L(g.rel)===L(t.rel)?'для обох многокутників <i>'+L(g.rel)+'</i>':'для даного <i>'+L(g.rel)+'</i>, для шуканого <i>'+L(t.rel)+'</i>')+'</div>';
}
function markCells(i){
  document.querySelectorAll('.cc').forEach(e=>e.classList.remove('m1','m2'));
  const t=TASKS[i], k=STATE[i].shown; let n=0;
  t.st.slice(0,k).forEach(s=>{ if(s.c){ n++; const el=document.querySelector('td[data-c="'+s.c+'"] .cc'); if(el) el.classList.add(n===1?'m1':'m2'); } });
}
function stepHTML(i){
  const t=TASKS[i], k=STATE[i].shown; let n=0, h='';
  t.st.slice(0,k).forEach(s=>{
    if(s.c) n++;
    h+='<div class="st"'+(s.c?' style="border-left-color:'+(n===1?'#f0b400':'#2f9e44')+'"':'')+'>'+s.h+'</div>';
  });
  if(k>=t.st.length) h+='<div class="st fin">Відповідь: '+t.show+' см'+(t.approx?' '+t.approx+' см':'')+'</div>';
  return h;
}
function chipsHTML(i){
  const S=STATE[i];
  if(!S.sel.length) return '<span class="ph">Тут з\'являться обрані формули</span>';
  return S.sel.map(id=>'<span class="chip'+(S.fok?' ok':(S.fmsg==='no'?' bad':''))+'"><span class="fx">'+CELLS[id]+'</span>'+(S.fok?'':'<button type="button" class="x" data-x="'+id+'" aria-label="прибрати">✕</button>')+'</span>').join('');
}
function fmsgHTML(i){
  const S=STATE[i];
  if(S.fok) return '<span class="fm ok">✓ Формули правильні</span>';
  if(S.fmsg==='no') return '<span class="fm no">Неправильно. Спробуйте ще.</span>';
  return '';
}
function optsHTML(i){
  const t=TASKS[i], S=STATE[i];
  return t.opts.map((o,k)=>{
    let c='opt', dis='';
    if(S.done){ dis=' disabled'; if(k===t.ci) c+=' good'; }
    else if(S.bad.indexOf(k)>=0){ c+=' wrong'; dis=' disabled'; }
    return '<button type="button" class="'+c+'" data-o="'+k+'"'+dis+'><b>'+LET[k]+')</b>'+o+'</button>';
  }).join('');
}
function outHTML(i){
  const S=STATE[i];
  if(S.done) return '<span class="fm ok">✓ '+'Правильно!'+'</span>';
  if(S.bad.length) return '<span class="fm no">Неправильно. Спробуйте інший варіант.</span>';
  return '';
}
function syncPanel(){
  const S=STATE[cur];
  document.querySelectorAll('#tblHost td.pk').forEach(td=>{
    td.classList.toggle('sel',S.sel.indexOf(td.dataset.c)>=0);
    td.classList.toggle('lock',!!S.fok);
  });
}
function render(){
  const t=TASKS[cur], q=QC[cur%QC.length], S=STATE[cur], nd=needOf(t).length;
  document.documentElement.style.setProperty('--q',q);
  $('#tblHost').innerHTML=tableHTML();
  $('#task').innerHTML=
   '<p class="tt"><span class="tn">'+(t.gen?'Задача '+(cur+1)+' · генератор (розв\'язано: '+GC+')':'Задача '+(cur+1))+'</span>'+t.text+'</p>'+
   '<div class="cols"><div class="figc">'+figure(t.g,t.t)+'<div class="leg">'+legend(t.g,t.t)+'</div></div>'+
   '<div class="work">'+
   '<div class="bt"><span class="k">Крок 1</span>Оберіть '+nd+' формули <span class="bb"><button type="button" class="btn sec sm" id="tbBtn">📋 Таблиця</button>'+(S.fok?'':'<button type="button" class="btn sm" id="fchk"'+(S.sel.length?'':' disabled')+'>Перевірити</button>')+'</span><span id="fout">'+fmsgHTML(cur)+'</span></div>'+
   '<div class="chips" id="chips">'+chipsHTML(cur)+'</div>'+
   '<div class="bt"><span class="k">Крок 2</span>Обчисліть, а далі <span class="bb">'+(S.opts?'':'<button type="button" class="btn sm" id="ans"'+(S.fok?'':' disabled')+'>✍️ Назвати відповідь</button><span class="or">або</span>')+'<button type="button" class="btn sec sm" id="stp">'+(S.shown?'↓ Далі':'📖 Показати розв\'язання')+'</button>'+(t.gen?'<button type="button" class="btn sm'+(S.done?'':' sec')+'" id="gen">↻ Нова задача</button>':'<button type="button" class="btn sm next" id="nx">Наступна →</button>')+'</span><span id="out">'+outHTML(cur)+'</span></div>'+
   (S.opts?'<div class="opts" id="opts">'+optsHTML(cur)+'</div>':'')+
   '<div class="steps" id="steps">'+stepHTML(cur)+'</div></div></div>';
  if(S.shown>=t.st.length) $('#stp').style.display='none';
  if(S.done && !t.gen && $('#nx')) $('#nx').style.display='inline-block';
  syncPanel(); markCells(cur); drawTabs();
}
function refreshSel(){
  const S=STATE[cur]; S.fmsg='';
  $('#chips').innerHTML=chipsHTML(cur); $('#fout').innerHTML=''; 
  const b=$('#fchk'); if(b) b.disabled=!S.sel.length;
  syncPanel();
}
document.addEventListener('click',e=>{
  const S=STATE[cur], t=TASKS[cur];
  const tb=e.target.closest('.tab'); if(tb){ cur=+tb.dataset.i; render(); return; }
  if(e.target.id==='gen'){ const g=genTask(); if(g){ TASKS[cur]=g; STATE[cur]={sel:[],fok:false,fmsg:'',opts:false,bad:[],done:false,shown:0}; render(); } return; }
  if(e.target.id==='tbBtn'){ $('#ov').classList.add('on'); return; }
  if(e.target.id==='tbX'||e.target.id==='ov'){ $('#ov').classList.remove('on'); return; }
  const td=e.target.closest('#tblHost td.pk');
  if(td){ if(S.fok) return; const id=td.dataset.c, k=S.sel.indexOf(id); if(k>=0) S.sel.splice(k,1); else S.sel.push(id); refreshSel(); return; }
  const x=e.target.closest('.x'); if(x){ const k=S.sel.indexOf(x.dataset.x); if(k>=0) S.sel.splice(k,1); refreshSel(); return; }
  if(e.target.id==='fchk'){
    const nd=needOf(t), have=S.sel.map(normId);
    const ok=S.sel.length===nd.length && nd.every(id=>have.indexOf(id)>=0);
    if(ok){ S.fok=true; S.fmsg='ok'; } else { S.fmsg='no'; }
    render(); return;
  }
  if(e.target.id==='ans'){ if(S.fok){ S.opts=true; render(); } return; }
  const op=e.target.closest('.opt');
  if(op){ const k=+op.dataset.o; if(k===t.ci){ S.done=true; if(t.gen) GC++; } else if(S.bad.indexOf(k)<0) S.bad.push(k); render(); return; }
  if(e.target.id==='stp'){
    if(S.shown<t.st.length) S.shown++;
    $('#steps').innerHTML=stepHTML(cur); markCells(cur);
    $('#stp').textContent='↓ Далі';
    if(S.shown>=t.st.length) $('#stp').style.display='none';
    return;
  }
  if(e.target.id==='nx'){ cur++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#ov').classList.remove('on'); });
window.__P={TASKS,needOf,genTask,rnVal,KONST};
render();
})();

  #pm-panel{width:78px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 2px}
  .pm-sep{display:none}
  .pm-colors{width:100%;grid-template-columns:repeat(4,auto);justify-content:center;gap:4px;padding:4px 0}
  .pm-c{width:14px;height:14px}
}
</style>

<canvas id="pm-ink"></canvas>
<div id="pm-paper"></div>

<button id="pm-fab" type="button" title="Відкрити панельку для письма"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>

<div id="pm-panel" hidden>
  <button type="button" class="pm-b" data-a="cursor" title="Керувати уроком (не писати)"><svg viewBox="0 0 24 24"><path d="M5.5 3.5l6.2 16 2.4-6.6 6.6-2.4z"/></svg></button>
  <button type="button" class="pm-b" data-a="pen" title="Писати"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
  <button type="button" class="pm-b" data-a="eraser" title="Гумка"><svg viewBox="0 0 24 24"><path d="M15.6 4.6l3.8 3.8a1.8 1.8 0 010 2.5L11.2 19H7.6l-3-3a1.8 1.8 0 010-2.5l8.5-8.9a1.8 1.8 0 012.5 0z"/><path d="M8.8 10.8l5.4 5.4"/><path d="M11.5 19H20"/></svg></button>
  <div class="pm-sep"></div>
  <div class="pm-colors">
    <button type="button" class="pm-c" data-a="color" data-c="#e53935" style="background:#e53935" title="Червоний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1e5fd6" style="background:#1e5fd6" title="Синій"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#222222" style="background:#222" title="Чорний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1f9d55" style="background:#1f9d55" title="Зелений"></button>
  </div>
  <button type="button" class="pm-b" data-a="width" title="Тонка / товста лінія"><svg viewBox="0 0 24 24"><path d="M4 8h16" style="stroke-width:1.1"/><path d="M4 15.5h16" style="stroke-width:3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="smart" title="Рівні фігури: трикутник, коло, пряма"><svg viewBox="0 0 24 24"><path d="M3.5 19.5l6-12 6 12z"/><circle cx="17" cy="8" r="3.4"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="paper" title="Виділити прямокутник білим"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2" stroke-dasharray="3 2.6"/></svg></button>
  <button type="button" class="pm-b" data-a="board" title="Закрити весь екран білим"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" style="fill:currentColor;fill-opacity:.14"/></svg></button>
  <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>

</body>
