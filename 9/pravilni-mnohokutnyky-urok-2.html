<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Правильні многокутники та їх властивості</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=STIX+Two+Text:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1b4d;--muted:#5b6b9a;--acc:#1D4ED8;--acc2:#4f7df0;--accL:#DBE5FF;
  --soft:#EBF0FF;--soft2:#F6F8FF;--line:#c3d1fb;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --warnbg:#fff6e5;--warntx:#8a5a00;--warnln:#f3d9a4;
  --hl:#be185d;--cR:#7c3aed;--cr:#0f766e;--cal:#ea580c;--cbe:#ca8a04;--cph:#2563eb;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px)}
body{margin:0;height:100dvh;overflow:hidden;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:600;color:var(--ink);
  background:linear-gradient(135deg,#EBF0FF 0%,#DBE5FF 55%,#C7D6FF 100%) fixed;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;min-height:0}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:1rem}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:2.6rem;padding:.35rem 1.1rem;border-radius:999px;border:1px solid rgba(29,78,216,.3);background:#fff;color:var(--acc);font-weight:800;font-size:.95rem;box-shadow:0 2px 8px rgba(29,78,216,.15);transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accL)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1.title{font-size:2.6rem;line-height:1.15;margin:0 0 .6rem;font-weight:900}
h1.title span{color:var(--acc)}
.sub{font-size:1.2rem;color:var(--muted);margin:0 0 2rem;font-weight:700}
.go{padding:.7rem 1.6rem;font-size:1.05rem;letter-spacing:.12em}

/* меню */
.menu{display:flex;flex-direction:column;gap:.9rem;width:min(34rem,92%)}
.mi{display:flex;align-items:center;gap:1rem;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.8rem 1.1rem;text-align:left;font-size:1.1rem;font-weight:800;color:var(--ink)}
.mi:hover{border-color:var(--acc)}
.mi b{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--accL);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.1rem}

/* сторінки */
.cols{gap:.8rem;padding:.8rem;align-items:stretch}
.panel{background:var(--soft2);border:1px solid var(--line);border-radius:1rem;box-shadow:0 2px 10px rgba(29,78,216,.08);min-height:0;min-width:0;display:flex;flex-direction:column;position:relative}
.cols .left{flex:0 0 49%}
.cols .right{flex:1}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:.8rem .9rem .9rem;scrollbar-width:thin}
.reset{position:absolute;top:.5rem;right:.5rem;z-index:3;width:2.3rem;height:2.3rem;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:1.05rem;display:flex;align-items:center;justify-content:center}

.legend{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.5rem .9rem;margin:0 2.6rem .6rem 0;font-size:.95rem}
.card{background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.55rem .95rem .7rem;margin-bottom:.6rem;cursor:pointer;animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
.card.focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(29,78,216,.14)}
.card .ct{font-weight:900;font-size:.95rem;margin-bottom:.1rem}
.card .fl{text-align:center;font-size:1.28rem;padding:.12rem 0;line-height:1.35}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:none}}
.dn{display:block;margin:.35rem auto .2rem;width:2.9rem;height:2.9rem;border-radius:50%;border:2px solid rgba(29,78,216,.4);background:#fff;color:var(--acc);box-shadow:0 3px 10px rgba(29,78,216,.2);animation:bob 1.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
.dn svg{width:1.4rem;height:1.4rem;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.hint{text-align:center;color:var(--muted);font-size:.9rem;margin:.2rem 0}

#s-form .left{flex:0 0 56%}
#s-form .right{flex:1}
#s-form .chips{flex:none;gap:.5rem;padding:.8rem .8rem .3rem}
#s-form .chip{min-height:2.5rem;min-width:4.6rem;font-size:1rem}
#s-form .figbox{padding:.3rem .5rem .6rem}
.figph{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:1.05rem;padding:1rem}
.frow{background:#fff;border:2px solid var(--line);border-radius:.9rem;margin-bottom:.5rem}
.frow.on{border-color:var(--acc2)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;border:0;background:none;padding:.55rem .9rem;font-size:1rem;font-weight:900;text-align:left;line-height:1.25}
.fh .chev{flex:none;color:var(--muted);font-size:.9rem}
.fbody{padding:0 .8rem .6rem}
.fbody .hint{margin:.1rem 0 0}
.lns{width:fit-content;max-width:100%;margin:.25rem auto;padding:.3rem .9rem;border:2px solid var(--acc2);border-radius:.7rem;background:var(--soft2);text-align:center;font-size:1.25rem;line-height:1.5;overflow-x:auto}
.lns.click{cursor:pointer}
.lns.sel{border-color:var(--hl)}
.lns table.tb{margin:0}
.lns table.tb th,.lns table.tb td{padding:.15rem .5rem;min-width:2.8rem;font-size:1.05rem}
.lns table.tb th small{font-size:.62rem}
table.tb .hc{background:#fce7f3!important;color:var(--hl);box-shadow:inset 0 0 0 2px #db2777}
.fcalc{margin-top:.45rem;background:#fdf2f8;border:2px solid #f0abcf;border-radius:.8rem;padding:.35rem .7rem .45rem}
.fct{font-weight:900;font-size:.92rem;color:var(--hl);margin-bottom:.1rem}
.ln2{text-align:center;font-size:1.25rem;line-height:1.5;padding:.1rem 0}
@media (max-width:760px){#s-form .left{flex:1 1 55%}}
.figbox{flex:1;min-height:0;display:flex;flex-direction:column;padding:.5rem .5rem 0}
.figbox .fig{flex:1;min-height:0;width:100%;height:100%}
.fig .lb{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.cap{text-align:center;font-size:1.35rem;padding:.1rem 0 .2rem;min-height:1.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;padding:.25rem .6rem}
.chip{min-height:2.2rem;min-width:2.5rem;padding:.2rem .7rem;border-radius:.7rem;border:2px solid #b4c4f5;background:#fff;color:var(--ink);font-weight:800;font-size:.95rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.done{background:var(--accL);border-color:#9db5f5;color:var(--acc)}
.chip.on.done{background:var(--acc);color:#fff}
.read{min-height:3.2rem;text-align:center;font-size:1.05rem;padding:.2rem .8rem .6rem;color:var(--ink)}

/* задачі */
.tasks{flex-direction:column;gap:.55rem;padding:.8rem}
.trow{display:flex;gap:.4rem;align-items:center}
.trow .chips{flex:1;padding:0}
.arr{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--acc);font-weight:900;font-size:1.1rem}
.arr:disabled{opacity:.35;cursor:not-allowed}
.tbody{flex:1;min-height:0;display:flex;gap:.8rem}
.tbody .left{flex:0 0 50%}
.tbody .right{flex:1}
.cond{background:#fff;border:2px solid var(--acc2);border-radius:.9rem;padding:.55rem .9rem;margin:0 2.6rem .6rem 0;font-size:1.1rem;line-height:1.5}
.cond .tn{font-weight:900;color:var(--acc);font-size:1.25rem;margin-bottom:.1rem}
.cond p{margin:.1rem 0}
.step{background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.5rem .9rem .6rem;margin-bottom:.55rem;animation:pop .35s cubic-bezier(.2,.9,.3,1.1)}
.step .sh{font-weight:900;color:var(--acc);font-size:1.05rem;margin-bottom:.1rem}
.step .ln{text-align:center;font-size:1.25rem;line-height:1.45;padding:.05rem 0}
.pbar{display:flex;align-items:center;gap:.6rem;width:100%;background:#f1f5ff;border:2px solid var(--line);border-radius:.9rem;padding:.4rem .8rem;margin-bottom:.55rem;font-size:.98rem;font-weight:800;color:var(--ink);text-align:left}
.pbar .pck{color:var(--ok);font-weight:900}
.pbar .pt{color:var(--acc)}
.pbar .ps{margin-left:auto;font-size:1.05rem;color:var(--oktx)}
.pbar .pc{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
.pbar .ps+.pc{margin-left:.6rem}
.ptit{font-weight:900;color:var(--acc);font-size:1.05rem;margin:.2rem 0 .3rem}
.ans{margin-top:.35rem;text-align:center;font-size:1.3rem;background:var(--okbg);border:2px solid var(--ok);color:var(--oktx);border-radius:.7rem;padding:.2rem .5rem;font-weight:800}
.note{margin-top:.3rem;text-align:center;font-size:.95rem;color:var(--muted)}
.done-msg{text-align:center;color:var(--oktx);font-weight:800;margin:.3rem 0}

table.tb{border-collapse:collapse;margin:.2rem auto;background:#fff}
table.tb th,table.tb td{border:2px solid var(--line);padding:.25rem .7rem;text-align:center;min-width:3.4rem;font-size:1.15rem}
table.tb th{background:var(--accL);font-weight:800}
table.tb th small{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
table.tb td.fill{background:var(--okbg);animation:pop .4s}
table.tb td.given{background:#f3f6ff}
table.tb td.blank{background:#fff}
.tbwrap{background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.45rem;margin-bottom:.6rem}

/* математика */
.m{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.08em;white-space:nowrap}
.m .v{font-style:italic}
.m .vR{color:var(--cR);font-weight:700}
.m .vr{color:var(--cr);font-weight:700}
.m .cal{color:var(--cal);font-weight:700}
.m .cbe{color:var(--cbe);font-weight:700}
.m .cph{color:var(--cph);font-weight:700}
.m .hl{color:var(--hl);font-weight:800}
.m .op{margin:0 .22em}
.m .op2{margin:0 .12em}
.m .fn{margin:0 .08em 0 .06em}
.m .tx{font-family:'Nunito',system-ui,sans-serif;font-size:.82em;font-weight:700}
.m sub,.m sup{font-size:.68em;line-height:0}
.m .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .1em}
.m .nu{border-bottom:.075em solid currentColor;padding:0 .18em .05em}
.m .de{padding:.05em .18em 0}
.m .sq{display:inline-flex;align-items:stretch;vertical-align:middle;padding-top:.1em}
.m .rg{width:.72em;flex:none;margin-right:-.02em}
.m .rg path{fill:none;stroke:currentColor;stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:miter}
.m .rb{border-top:.075em solid currentColor;padding:0 .12em 0 .08em;margin-top:.02em}

footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}
#nav{flex:none;display:none;justify-content:flex-end;align-items:center;gap:.5rem;padding:.4rem .8rem;border-top:1px solid var(--line);background:var(--soft)}
#nav.on{display:flex}

@media (max-width:760px){
  .cols,.tbody{flex-direction:column}
  .cols .left,.tbody .left{flex:1 1 55%}
  .cols .right,.tbody .right{flex:1 1 45%}
  h1.title{font-size:1.9rem}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <section class="screen center on" id="s-start">
      <h1 class="title"><span>Правильні многокутники</span><br>та їх властивості</h1>
      <p class="sub">Формули та задачі з підручника</p>
      <button class="btn pri go" data-act="start">ПОЧАТИ ▶</button>
    </section>
    <section class="screen center" id="s-menu">
      <div class="menu">
        <button class="mi" data-act="open" data-p="form"><b>1</b>Формули</button>
        <button class="mi" data-act="open" data-p="tasks"><b>2</b>Задачі з підручника</button>
      </div>
    </section>
    <section class="screen cols" id="s-form">
      <div class="panel left">
        <button class="reset" data-act="resetForm" title="Спочатку">↻</button>
        <div class="scroll" id="fLeft"></div>
      </div>
      <div class="panel right">
        <div class="chips" id="fChips"></div>
        <div class="figbox" id="fFig"></div>
      </div>
    </section>
    <section class="screen tasks" id="s-tasks">
      <div class="trow">
        <button class="arr" data-act="tprev" id="tPrev" title="Попередня">‹</button>
        <div class="chips" id="tChips"></div>
        <button class="arr" data-act="tnext" id="tNext" title="Наступна">›</button>
      </div>
      <div class="tbody">
        <div class="panel left">
          <button class="reset" data-act="resetTask" title="Спочатку">↻</button>
          <div class="scroll" id="tLeft"></div>
        </div>
        <div class="panel right"><div class="figbox" id="tFig"></div></div>
      </div>
    </section>
  </div>
  <div id="nav">
    <button class="btn" data-act="menu">☰ Зміст</button>
    <button class="btn" data-act="back">← Назад</button>
    <button class="btn pri" data-act="fwd" id="fwd">Далі →</button>
  </div>
  <footer>Автор розробки <b style="color:#334155">Ковтун Тетяна</b></footer>
</div>

<script>
(function(){
'use strict';

/* ================= математичний запис ================= */
function M(src){
  let i=0;
  function atom(){
    const c=src[i++];
    if(c===undefined)return '';
    if(/[A-Za-z]/.test(c)){const cl=c==='R'?' vR':(c==='r'?' vr':'');return '<i class="v'+cl+'">'+c+'</i>';}
    if(c==='-')return '<span class="op">−</span>';
    if(c==='=')return '<span class="op">=</span>';
    if(c==='+')return '<span class="op">+</span>';
    if(c==='<')return '<span class="op">&lt;</span>';
    if(c==='>')return '<span class="op">&gt;</span>';
    if(c==='*')return '·';
    if(c==='~')return '&nbsp;';
    if(c==='&')return '&amp;';
    return c;
  }
  function group(){i++;const g=seq('}');i++;return g;}
  function arg(){while(src[i]===' ')i++;return src[i]==='{'?group():atom();}
  function raw(){while(src[i]===' ')i++;if(src[i]!=='{')return src[i++];i++;let s='';while(i<src.length&&src[i]!=='}')s+=src[i++];i++;return s;}
  function cmd(n){
    switch(n){
      case 'f':{const a=arg(),b=arg();return '<span class="fr"><span class="nu">'+a+'</span><span class="de">'+b+'</span></span>';}
      case 's':{const a=arg();return '<span class="sq"><svg class="rg" viewBox="0 0 12 24" preserveAspectRatio="none"><path d="M0.6 14.5 L3 12.5 L6.2 22.5 L11.4 1"/></svg><span class="rb">'+a+'</span></span>';}
      case 't':return '<span class="tx">'+raw()+'</span>';
      case 'deg':return '°';
      case 'h':return '<span class="hl">'+arg()+'</span>';
      case 'cdot':return '<span class="op2">·</span>';
      case 'approx':return '<span class="op">≈</span>';
      case 'Rightarrow':return '<span class="op">⇒</span>';
      case 'perp':return '<span class="op">⟂</span>';
      case 'al':return '<i class="v cal">α</i>';
      case 'be':return '<i class="v cbe">β</i>';
      case 'ph':return '<i class="v cph">φ</i>';
      case 'Delta':return '△';
      case 'ang':return '∠';
      case 'tg':return '<span class="fn">tg</span>';
      case 'sin':return '<span class="fn">sin</span>';
      case 'cos':return '<span class="fn">cos</span>';
      default:return '';
    }
  }
  function seq(stop){
    let o='';
    while(i<src.length){
      const c=src[i];
      if(stop&&c===stop)break;
      if(c==='\\'){i++;let n='';while(i<src.length&&/[A-Za-z]/.test(src[i]))n+=src[i++];o+=cmd(n);continue;}
      if(c==='{'){o+=group();continue;}
      if(c==='_'||c==='^'){i++;const a=arg();o+=c==='_'?'<sub>'+a+'</sub>':'<sup>'+a+'</sup>';continue;}
      o+=atom();
    }
    return o;
  }
  return '<span class="m">'+seq(null)+'</span>';
}
const T=(s,...v)=>M(String.raw(s,...v));

/* ================= малювання SVG ================= */
const D2R=Math.PI/180;
const C={R:'#7c3aed',r:'#0f766e',a:'#334155',al:'#ea580c',be:'#ca8a04',ph:'#2563eb',fill:'#DBE5FF',ink:'#0f1b4d',diag:'#be185d',faint:'#b6c2e2'};
const fx=v=>(+v).toFixed(1);
const P=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R),cy+r*Math.sin(deg*D2R)];
const ang=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0])/D2R;
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
const wrap=(s)=>'<svg viewBox="0 0 500 440" class="fig" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
function pv(n,R,cx,cy,th0){if(th0===undefined)th0=90-180/n;const a=[];for(let i=0;i<n;i++)a.push(P(cx,cy,R,th0+360*i/n));return a;}
function L(p,q,col,w,dash){return '<line x1="'+fx(p[0])+'" y1="'+fx(p[1])+'" x2="'+fx(q[0])+'" y2="'+fx(q[1])+'" stroke="'+col+'" stroke-width="'+(w||3)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';}
function Cc(c,r,col,w,fill,dash){return '<circle cx="'+fx(c[0])+'" cy="'+fx(c[1])+'" r="'+fx(r)+'" fill="'+(fill||'none')+'" stroke="'+col+'" stroke-width="'+(w||3)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';}
function Pg(pts,fill,stroke,w){return '<path d="M'+pts.map(p=>fx(p[0])+','+fx(p[1])).join('L')+'Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+'" stroke-linejoin="round"/>';}
function Dt(p,r,col){return '<circle cx="'+fx(p[0])+'" cy="'+fx(p[1])+'" r="'+(r||4.5)+'" fill="'+(col||'#1e293b')+'" stroke="#fff" stroke-width="1.5"/>';}
function Tx(p,t,col,sz,ital){return '<text class="lb" x="'+fx(p[0])+'" y="'+fx(p[1])+'" fill="'+(col||C.ink)+'" font-size="'+(sz||24)+'" text-anchor="middle" dominant-baseline="central"'+(ital===false?' style="font-style:normal"':'')+'>'+t+'</text>';}
function wedge(v,a1,a2,rad,col,op,label,lcol,lrad){
  let d=(((a2-a1)%360)+360)%360;if(d>180)d-=360;
  const p1=P(v[0],v[1],rad,a1),p2=P(v[0],v[1],rad,a1+d);
  let s='<path d="M'+fx(v[0])+','+fx(v[1])+'L'+fx(p1[0])+','+fx(p1[1])+'A'+rad+','+rad+' 0 0 '+(d>0?1:0)+' '+fx(p2[0])+','+fx(p2[1])+'Z" fill="'+col+'" fill-opacity="'+(op||.35)+'" stroke="'+col+'" stroke-width="2"/>';
  if(label)s+=Tx(P(v[0],v[1],lrad||rad*1.6,a1+d/2),label,lcol||col,22,false);
  return s;
}
function rmark(v,a1,a2,s){
  const u1=[Math.cos(a1*D2R),Math.sin(a1*D2R)],u2=[Math.cos(a2*D2R),Math.sin(a2*D2R)];
  const p1=[v[0]+s*u1[0],v[1]+s*u1[1]],p2=[p1[0]+s*u2[0],p1[1]+s*u2[1]],p3=[v[0]+s*u2[0],v[1]+s*u2[1]];
  return '<path d="M'+fx(p1[0])+','+fx(p1[1])+'L'+fx(p2[0])+','+fx(p2[1])+'L'+fx(p3[0])+','+fx(p3[1])+'" fill="none" stroke="#334155" stroke-width="2"/>';
}
function lab(p,q,t,col,side,d,sz,ital){
  const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,m=mid(p,q);
  return Tx([m[0]+(side||1)*(d||20)*(-dy/l),m[1]+(side||1)*(d||20)*(dx/l)],t,col,sz||24,ital);
}

function kOf(i){return S.prog[TASKS[i].id]||0;}
function stepHTML(s){
  return '<div class="step">'+(s.h?'<div class="sh">'+s.h+'</div>':'')+'<div class="lns">'+s.lines.map(l=>'<div class="ln">'+l+'</div>').join('')+'</div>'+(s.ans?'<div class="ans">'+s.ans+'</div>':'')+(s.note?'<div class="note">'+s.note+'</div>':'')+'</div>';

function renderTasks(scroll){
  const t=TASKS[S.ti],k=kOf(S.ti),parts=t.parts||[0],pl=t.pl||[];
  document.getElementById('tChips').innerHTML=TASKS.map((x,i)=>{
    const dn=kOf(i)>=x.steps.length;
    return '<button class="chip'+(i===S.ti?' on':'')+(dn?' done':'')+'" data-act="task" data-i="'+i+'">'+x.id+(dn?' ✓':'')+'</button>';
  }).join('');
  document.getElementById('tPrev').disabled=S.ti===0;
  document.getElementById('tNext').disabled=S.ti===TASKS.length-1;
  let h='<div class="cond"><div class="tn">Задача '+t.id+'</div>'+t.cond+'</div>';
  if(t.table)h+=t.table(k);
  let cp=0;
  for(let j=0;j<parts.length;j++)if(k>parts[j])cp=j;
  for(let j=0;j<=cp;j++){
    const a=parts[j],b=j+1<parts.length?parts[j+1]:t.steps.length,e=Math.min(b,k);
    if(e<=a)continue;
    const key=t.id+':'+j,label=pl[j]||('Частина '+(j+1)),collapsed=j<cp&&!S.pexp[key];
    if(j<cp){

    }else if(parts.length>1&&pl[j]&&!t.steps[a].h){
      h+='<div class="ptit">'+label+'</div>';

    if(!collapsed)for(let i=a;i<e;i++)h+=stepHTML(t.steps[i]);
  }

}

function show(p){
  S.page=p;
  ['start','menu','form','tasks'].forEach(x=>document.getElementById('s-'+x).classList.toggle('on',x===p));
  document.getElementById('nav').classList.toggle('on',p==='form'||p==='tasks');
  const fw=document.getElementById('fwd');
  fw.textContent=p==='tasks'?'На початок':'Далі →';
  if(p==='form')renderForm(false);
  if(p==='tasks')renderTasks(false);
}
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.getAttribute('data-act');
  if(a==='start')show('menu');
  else if(a==='open')show(b.getAttribute('data-p'));
  else if(a==='menu')show('menu');
  else if(a==='back'){if(S.page==='tasks')show('form');else show('menu');}
  else if(a==='fwd'){if(S.page==='form')show('tasks');else{S.prog={};S.pexp={};S.ti=0;resetF();show('start');}}
  else if(a==='fopen'){const i=+b.getAttribute('data-i');if(S.fopen[i]){delete S.fopen[i];delete S.fcalc[i];}else{S.fopen[i]=1;if(S.sn!=null)S.sf=i;}renderForm();}
  else if(a==='fcalc'){const i=+b.getAttribute('data-i');if(S.sn!=null){if(S.fcalc[i])delete S.fcalc[i];else S.fcalc[i]=1;S.sf=i;renderForm();}}
  else if(a==='n'){S.sn=+b.getAttribute('data-n');S.fcalc={};S.sf=-1;renderForm();}
  else if(a==='resetForm'){resetF();renderForm();}
  else if(a==='ptoggle'){const k=b.getAttribute('data-k');S.pexp[k]=!S.pexp[k];renderTasks('keep');}
  else if(a==='task'){S.ti=+b.getAttribute('data-i');renderTasks(false);}
  else if(a==='tprev'){if(S.ti>0){S.ti--;renderTasks(false);}}
  else if(a==='tnext'){if(S.ti<TASKS.length-1){S.ti++;renderTasks(false);}}
  else if(a==='tstep'){const t=TASKS[S.ti];if(kOf(S.ti)<t.steps.length){S.prog[t.id]=kOf(S.ti)+1;renderTasks(true);}}
  else if(a==='resetTask'){const id=TASKS[S.ti].id;S.prog[id]=0;Object.keys(S.pexp).forEach(x=>{if(x.indexOf(id+':')===0)delete S.pexp[x];});renderTasks(false);}
});

  <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
