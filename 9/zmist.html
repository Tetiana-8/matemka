<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 9 клас — зміст</title>
<style>
  :root{
    --main:#3f6fd1;      /* волошковий — колір 9 класу */
    --soft:#dde8fb;
    --softer:#f3f7fe;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#c3d4f3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 9 клас</h1>
  <p class="sub">Теми за підручниками. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКІВ ===== */
const ZMIST = [
 {rozdil:"Алгебра", par:[
  {t:"§ 1. Нерівності", temy:[
   ["a1","Числові нерівності"],
   ["a2","Основні властивості числових нерівностей"],
   ["a3","Додавання і множення числових нерівностей. Оцінювання значення виразу"],
   ["a4","Нерівності з однією змінною"],
   ["a5","Розв’язування лінійних нерівностей з однією змінною. Числові проміжки"],
   ["a6","Системи лінійних нерівностей з однією змінною"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Квадратична функція", temy:[
   ["a7","Повторення та розширення відомостей про функцію"],
   ["a8","Властивості функції"],
   ["a9","Як побудувати графік функції y = kf(x), якщо відомо графік функції y = f(x)"],
   ["a10","Як побудувати графіки функцій y = f(x) + b і y = f(x + a), якщо відомо графік функції y = f(x)"],
   ["a11","Квадратична функція, її графік і властивості"],
   ["a12","Розв’язування квадратних нерівностей"],
   ["a13","Системи рівнянь із двома змінними"],
   ["a14","Розв’язування задач за допомогою систем рівнянь другого степеня"],
   ["check","Завдання № 2 «Перевірте себе»"]]},
  {t:"§ 3. Числові послідовності", temy:[
   ["a15","Числові послідовності"],
   ["a16","Арифметична прогресія"],
   ["a17","Сума n перших членів арифметичної прогресії"],
   ["a18","Геометрична прогресія"],
   ["a19","Сума n перших членів геометричної прогресії"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 4. Основи комбінаторики, теорії ймовірностей та статистики", temy:[
   ["a20","Комбінаторні задачі. Правила суми та добутку"],
   ["a21","Частота та ймовірність випадкової події"],
   ["a22","Класичне означення ймовірності"],
   ["a23","Початкові відомості про статистику"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"Підготовка до контрольних робіт (алгебра)", temy:[["kr_a","Підготовка до контрольної роботи № 1"]]},
  {t:"Повторення курсу алгебри 9 класу", temy:[["povt_a","Повторення за курс алгебри 9 класу"]]}
 ]},
 {rozdil:"Геометрія", par:[
  {t:"§ 1. Розв’язування трикутників", temy:[
   ["g1","Синус, косинус, тангенс і котангенс кута від 0° до 180°"],
   ["g2","Теорема косинусів"],
   ["g3","Теорема синусів"],
   ["g4","Розв’язування трикутників"],
   ["g5","Формули для знаходження площі трикутника"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Правильні многокутники", temy:[
   ["g6","Правильні многокутники та їхні властивості"],
   ["g7","Довжина кола. Площа круга"],
   ["check","Завдання № 2 «Перевірте себе»"]]},
  {t:"§ 3. Декартові координати на площині", temy:[
   ["g8","Відстань між двома точками із заданими координатами. Координати середини відрізка"],
   ["g9","Рівняння фігури. Рівняння кола"],
   ["g10","Рівняння прямої"],
   ["g11","Кутовий коефіцієнт прямої"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 4. Вектори", temy:[
   ["g12","Поняття вектора"],
   ["g13","Координати вектора"],
   ["g14","Додавання і віднімання векторів"],
   ["g15","Множення вектора на число"],
   ["g16","Скалярний добуток векторів"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"§ 5. Геометричні перетворення", temy:[
   ["g17","Рух (переміщення) фігури. Паралельне перенесення"],
   ["g18","Осьова симетрія"],
   ["g19","Центральна симетрія. Поворот"],
   ["g20","Гомотетія. Подібність фігур"],
   ["check","Завдання № 5 «Перевірте себе»"]]},
  {t:"Підготовка до контрольних робіт (геометрія)", temy:[["kr_g","Підготовка до контрольної роботи № 1"]]},
  {t:"Повторення курсу геометрії 9 класу", temy:[["povt_g","Повторення за курс геометрії 9 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми (наприклад a5, g12) або povt_a / povt_g для повторення.
   test:true — кнопка буде світлою (для тестів).
   Приклад:  a5: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  if(r.rozdil){ const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h); }
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const isT=k=>typeof k==="number"||/^[ag]\d+$/.test(k);
    const nTem=p.temy.filter(x=>isT(x[0])).length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"){ html+=`<li class="check">✔ ${name}</li>`; return; }
      if(k==="chvert1"){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : (/^[ag]\d+$/.test(k) ? k.slice(1) : "↺");
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
</body>
</html>
