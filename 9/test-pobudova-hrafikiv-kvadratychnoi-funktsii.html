<script>
(function(){ "use strict";

/* ================= Firebase (збір результатів) ================= */
const FIREBASE_CONFIG = { apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU", authDomain: "math-5-892a5.firebaseapp.com", projectId: "math-5-892a5", storageBucket: "math-5-892a5.firebasestorage.app", messagingSenderId: "163114803328", appId: "1:163114803328:web:caf86c4e8b8c4b3b630665", measurementId: "G-E06VKZ2GP5" };
const APP_ID='default-app-id', COLLECTION='results_parabola_points_9', TEACHER_EMAIL='vchytel@matemka.invalid', FBV='10.12.2', TEST_NAME='Побудова графіків квадратичної функції (9 клас)';
let fbPromise=null;
function fb(){ if(!fbPromise){ fbPromise=(async()=>{ const [appM,authM,fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]); const app=appM.initializeApp(FIREBASE_CONFIG); const auth=authM.getAuth(app); await authM.signInAnonymously(auth); return {db:fs.getFirestore(app),fs,auth,authM}; })(); fbPromise.catch(()=>{fbPromise=null}); } return fbPromise; }
const coll=(db,fs)=>fs.collection(db,'artifacts',APP_ID,'public','data',COLLECTION);
async function saveResult(rec){ try{rec=JSON.parse(JSON.stringify(rec));}catch(e){} try{ let q=JSON.parse(localStorage.getItem('pending_'+COLLECTION)||'[]'); q=q.filter(x=>x&&x.id!==rec.id); q.push(rec); localStorage.setItem('pending_'+COLLECTION,JSON.stringify(q)); }catch(e){} await flushPending(); }
let _flushing=false;
async function flushPending(){ if(_flushing)return; _flushing=true; try{ const key='pending_'+COLLECTION, tried={}; for(;;){ let q; try{q=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){q=[]} const item=q.find(x=>x&&!tried[x.id]); if(!item)break; tried[item.id]=1; let ok=false; for(let a=0;a<4&&!ok;a++){ try{ const {db,fs}=await fb(); await fs.setDoc(fs.doc(coll(db,fs),item.id),item); ok=true; }catch(e){ console.warn('Save failed',e); await new Promise(r=>setTimeout(r,1500*(a+1))); } } if(ok){ try{ const cur=JSON.parse(localStorage.getItem(key)||'[]').filter(x=>x&&x.id!==item.id); localStorage.setItem(key,JSON.stringify(cur)); }catch(e){} } } } finally { _flushing=false; } }
window.addEventListener('online',()=>{flushPending()}); setTimeout(()=>{flushPending()},2000);
async function teacherLogin(pw){ try{ const {auth,authM}=await fb(); await authM.signInWithEmailAndPassword(auth,TEACHER_EMAIL,pw); return true; }catch(e){ return false; } }
async function teacherLogout(){ try{ const {auth,authM}=await fb(); await authM.signOut(auth); await authM.signInAnonymously(auth); }catch(e){} }
async function loadResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); const out=[]; snap.forEach(d=>out.push(d.data())); return out.sort((a,b)=>(b.ts||0)-(a.ts||0)); }
async function clearResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); await Promise.all(snap.docs.map(d=>fs.deleteDoc(d.ref))); }
fb().catch(()=>{});

/* ================= Допоміжне ================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[].slice.call((r||document).querySelectorAll(s));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const N=n=>n<0?'−'+(-n):String(n);
const iv=s=>String(s).replace(/(<[^>]+>)|([a-z])/g,(m,t,l)=>t?t:'<i class="v">'+l+'</i>');
const F=(a,b)=>'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';
const pl=(n,o,f,m)=>{const a=n%100,b=n%10;return (a>10&&a<20)?m:(b===1?o:(b>=2&&b<=4?f:m))};
const r1=x=>Math.round(x*10)/10;
const fmt=x=>String(r1(x)).replace('.',',');
const M=s=>'<span class="math">'+iv(s)+'</span>';
const ptsWord=x=>Number.isInteger(r1(x))?fmt(x)+' '+pl(r1(x),'бал','бали','балів'):fmt(x)+' бала';
const pt2=p=>'('+N(p[0])+'; '+N(p[1])+')';

/* формули: коефіцієнт a = p/q, зсуви m (вправо) і n (вгору) */
function fmtA(p,q){if(q===1){if(p===1)return'';if(p===-1)return'−';return N(p)}return (p<0?'−':'')+F(Math.abs(p),q)}
function fmtAT(p,q){if(q===1){if(p===1)return'';if(p===-1)return'−';return N(p)}return (p<0?'−':'')+Math.abs(p)+'/'+q}
const core=m=>m===0?'x²':'(x '+(m>0?'− ':'+ ')+Math.abs(m)+')²';
const tail=n=>n?' '+(n>0?'+ ':'− ')+Math.abs(n):'';
const formula =t=>'y = '+fmtA(t.p,t.q) +core(t.m)+tail(t.n);
const formulaT=t=>'y = '+fmtAT(t.p,t.q)+core(t.m)+tail(t.n);
const fv=t=>x=>t.p/t.q*(x-t.m)*(x-t.m)+t.n;
const onGraph=(t,x,y)=>(y-t.n)*t.q===t.p*(x-t.m)*(x-t.m);

const V={x0:-8,x1:8,y0:-8,y1:8,u:20};
function validPts(t){const r=[];for(let x=V.x0;x<=V.x1;x++)for(let y=V.y0;y<=V.y1;y++)if(onGraph(t,x,y))r.push([x,y]);return r}

/* ================= Генератор завдань ================= */
/* групи: A — y = ax², B — зсув угору/вниз, C — зсув праворуч/ліворуч, D — обидва зсуви */
const WEIGHT={A:8,B:6,C:6,D:8};
const ATT=[1,0.7,0.4];             /* частка балів за 1-шу, 2-гу, 3-тю спробу */
function mk(g,p,q,m,n){return {g:g,p:p,q:q,m:m,n:n}}
function gen(){
  const T=[];
  const ok=t=>validPts(t).length>=3;
  const sameAs=t=>T.some(u=>u.p===t.p&&u.q===t.q&&u.m===t.m&&u.n===t.n);
  function add(make){let t,g=0;do{t=make();g++}while((!ok(t)||sameAs(t))&&g<200);if(!ok(t))throw new Error('gen');T.push(t)}
  /* A */
  add(()=>mk('A',pick([2,3]),1,0,0));
  add(()=>mk('A',-pick([2,3]),1,0,0));
  add(()=>mk('A',-1,pick([2,4]),0,0));
  add(()=>mk('A',1,pick([2,3,4]),0,0));
  /* B: вгору, вниз, ще одне */
  add(()=>mk('B',1,1,0,ri(2,5)));
  add(()=>mk('B',1,1,0,-ri(2,5)));
  add(()=>mk('B',1,1,0,pick([-1,1,3,-3,4,-4])));
  /* C: праворуч, ліворуч, ще одне */
  add(()=>mk('C',1,1,ri(2,5),0));
  add(()=>mk('C',1,1,-ri(2,5),0));
  add(()=>mk('C',1,1,pick([-1,1,3,-3,4,-4]),0));
  /* D: чотири «чверті» вершини */
  add(()=>mk('D',1,1,ri(1,4),ri(1,4)));
  add(()=>mk('D',1,1,-ri(1,4),ri(1,4)));
  add(()=>mk('D',1,1,ri(1,4),-ri(1,4)));
  add(()=>mk('D',1,1,-ri(1,4),-ri(1,4)));
  T.forEach(function(t,i){
    t.w=WEIGHT[t.g];t.id=i;
    t.text='Побудуйте графік функції '+M(formula(t))+'.<br><span style="font-weight:600;color:var(--mut)">Поставте на координатній площині <b>три точки</b> цього графіка.</span>';
    t.qtext='Побудувати графік '+formulaT(t)+' за трьома точками';
    t.vertex=pt2([t.m,t.n]);
    const vp=validPts(t);t.valid=vp;
    t.correctText='правильні точки, наприклад: '+vp.slice(0,5).map(pt2).join(', ');
  });
  return T;
}
function buildTasks(seed){rnd=mulberry32(seed);return gen()}

/* ================= Стан ================= */
function newTS(){return {pts:[],st:[],tries:0,done:0,solvedOn:0,earned:0,hist:[],msg:'',mcls:'',sec:0}}
let S={screen:'start',cur:0,tasks:[],T:[],checked:false,seed:0,sur:'',nam:'',score:0,tIn:0,_used:0};
let W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0};
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}
function leave(){if(S.screen==='start'||S.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',function(){document.hidden?leave():back()});
window.addEventListener('blur',leave);window.addEventListener('focus',back);
const TS=()=>S.T[S.cur];
function newSeed(){const q=/[?&]v=(\d+)/.exec(location.search);if(q&&!S._used){S._used=1;return +q[1]}return Math.floor(Math.random()*2147483647)+1}
function build(){
  S.seed=newSeed();S.tasks=buildTasks(S.seed);S.T=S.tasks.map(newTS);
  S.cur=0;S.checked=false;resetWatch();
}
const started=i=>S.T[i].pts.length>0||S.T[i].tries>0;
const doneCount=()=>S.T.filter(t=>t.done).length;

/* ================= Площина ================= */
function planeStatic(){
  const u=V.u,x0=V.x0,x1=V.x1,y0=V.y0,y1=V.y1,P=x=>(x-x0)*u,Q=y=>(y1-y)*u,W2=(x1-x0)*u,H=(y1-y0)*u,pad=u*1.2,fs=Math.max(11,u*.56);
  let g='',ax='';
  for(let x=x0;x<=x1;x++)g+='<line class="gl" x1="'+P(x)+'" y1="0" x2="'+P(x)+'" y2="'+H+'"/>';
  for(let y=y0;y<=y1;y++)g+='<line class="gl" x1="0" y1="'+Q(y)+'" x2="'+W2+'" y2="'+Q(y)+'"/>';
  const ah=(x,y,dx,dy)=>'<polygon points="'+x+','+y+' '+(x-dx*9-dy*4)+','+(y-dy*9+dx*4)+' '+(x-dx*9+dy*4)+','+(y-dy*9-dx*4)+'" fill="#334155"/>';
  ax+='<line class="ax" x1="0" y1="'+Q(0)+'" x2="'+W2+'" y2="'+Q(0)+'"/>'+ah(W2+4,Q(0),1,0)+'<text x="'+(W2+2)+'" y="'+(Q(0)-8)+'" style="font-style:italic;font-size:'+fs+'px">x</text>';
  ax+='<line class="ax" x1="'+P(0)+'" y1="0" x2="'+P(0)+'" y2="'+H+'"/>'+ah(P(0),-4,0,-1)+'<text x="'+(P(0)+8)+'" y="-2" style="font-style:italic;font-size:'+fs+'px">y</text>';
  for(let x=x0;x<=x1;x++){if(x===0)continue;ax+='<text style="font-size:'+fs+'px" text-anchor="middle" x="'+P(x)+'" y="'+(Q(0)+fs*1.15)+'">'+N(x)+'</text>'}
  for(let y=y0;y<=y1;y++){if(y===0)continue;ax+='<text style="font-size:'+fs+'px" text-anchor="end" x="'+(P(0)-4)+'" y="'+(Q(y)+fs*.35)+'">'+N(y)+'</text>'}
  ax+='<text style="font-size:'+fs+'px" text-anchor="end" x="'+(P(0)-4)+'" y="'+(Q(0)+fs*1.1)+'">0</text>';
  return '<svg class="plane" id="svg" viewBox="'+(-pad)+' '+(-pad)+' '+(W2+2*pad)+' '+(H+2*pad)+'"><defs><clipPath id="clpv"><rect x="0" y="0" width="'+W2+'" height="'+H+'"/></clipPath></defs>'+
    '<rect x="'+(-pad)+'" y="'+(-pad)+'" width="'+(W2+2*pad)+'" height="'+(H+2*pad)+'" fill="#fff"/><g>'+g+'</g><g>'+ax+'</g>'+
    '<g id="cvg" clip-path="url(#clpv)" pointer-events="none"></g><g id="ptg" pointer-events="none"></g></svg>';
}
function pathD(f,a,b,P,Q){let d='';const n=Math.max(2,Math.ceil((b-a)/0.05));for(let k=0;k<=n;k++){const t=a+(b-a)*k/n,y=f(t);if(!isFinite(y))continue;d+=(d?'L':'M')+P(t).toFixed(1)+' '+Q(y).toFixed(1)}return d}
const COL={0:'#7c3aed',1:'#1e9e62',2:'#e0464e'};
function updateDyn(){
  const cv=$('#cvg'),pg=$('#ptg');if(!cv||!pg)return;
  const t=S.tasks[S.cur],ts=TS(),u=V.u,P=x=>(x-V.x0)*u,Q=y=>(V.y1-y)*u,W2=(V.x1-V.x0)*u;
  let c='',p='';
  if(ts.done){
    const ok=ts.solvedOn>0;
    c+='<path d="'+pathD(fv(t),V.x0,V.x1,P,Q)+'" fill="none" stroke="#1e9e62" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"'+(ok?'':' stroke-dasharray="7 6"')+'/>';
    if(!ok)t.valid.forEach(function(v){p+='<circle cx="'+P(v[0])+'" cy="'+Q(v[1])+'" r="'+(u*.4)+'" fill="none" stroke="#1e9e62" stroke-width="2"/>'});
  }
  ts.pts.forEach(function(q,i){
    const cx=P(q[0]),cy=Q(q[1]),col=COL[ts.st[i]||0],right=cx>W2-60;
    p+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(u*.27)+'" fill="'+col+'" stroke="#fff" stroke-width="1.6"/>'+
       '<text x="'+(right?cx-7:cx+7)+'" y="'+(cy-6)+'" text-anchor="'+(right?'end':'start')+'" style="font-size:'+Math.max(10,u*.5)+'px;font-weight:700;fill:'+col+';paint-order:stroke;stroke:#fff;stroke-width:3px">'+pt2(q)+'</text>';
  });
  cv.innerHTML=c;pg.innerHTML=p;
}

/* ================= Взаємодія з площиною ================= */
function nodeAt(e){
  const svg=$('#svg');if(!svg)return null;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
  const x=Math.round(loc.x/V.u+V.x0),y=Math.round(V.y1-loc.y/V.u);
  return {x:x,y:y,inb:x>=V.x0&&x<=V.x1&&y>=V.y0&&y<=V.y1};
}
let dg=null;
function changed(i){const ts=TS();ts.st[i]=0;ts.msg='';ts.mcls=''}
document.addEventListener('pointerdown',function(e){
  if(S.screen!=='task')return;
  const svg=e.target.closest&&e.target.closest('svg.plane');if(!svg)return;
  const ts=TS();if(ts.done)return;
  e.preventDefault();clearTimeout(S.ck);
  const n=nodeAt(e);if(!n||!n.inb)return;
  const idx=ts.pts.findIndex(p=>p[0]===n.x&&p[1]===n.y);
  if(idx>=0){dg={i:idx,moved:false,exist:true};return}
  if(ts.pts.length<3){
    ts.pts.push([n.x,n.y]);ts.st.push(0);ts.msg='';ts.mcls='';
    dg={i:ts.pts.length-1,moved:false,exist:false};
    updateDyn();updateInfo(false);drawHead(false);
  }else{
    ts.msg='Вже є три точки. Торкніться точки, щоб прибрати її, або перетягніть її на інше місце.';ts.mcls='tip';updateInfo(false);
  }
});
window.addEventListener('pointermove',function(e){
  if(!dg||S.screen!=='task')return;
  const ts=TS();e.preventDefault();
  const n=nodeAt(e);if(!n||!n.inb)return;
  const p=ts.pts[dg.i];if(!p||(p[0]===n.x&&p[1]===n.y))return;
  if(ts.pts.some((q,k)=>k!==dg.i&&q[0]===n.x&&q[1]===n.y))return;
  ts.pts[dg.i]=[n.x,n.y];changed(dg.i);dg.moved=true;
  updateDyn();updateInfo(false);
},{passive:false});
function endDrag(){
  if(dg&&S.screen==='task'){
    const ts=TS();
    if(dg.exist&&!dg.moved&&!ts.done){ts.pts.splice(dg.i,1);ts.st.splice(dg.i,1);ts.msg='';ts.mcls='';updateDyn();updateInfo(false);drawHead(false)}
    else if(!ts.done&&ts.pts.length===3&&(!dg.exist||dg.moved)){dg=null;scheduleCheck()}
  }
  dg=null;
}

/* ================= Перевірка однієї побудови ================= */
const PRAISE1=['Молодець! З першого разу! 🌟','Чудово! Усі три точки правильні з першої спроби! 🎉','Блискуче! Графік побудовано з першого разу! 👏','Ось так! Ідеально з першого разу! ⭐'];
const PRAISE2=['Молодець, що виправили! Графік побудовано ✓','Так тримати! З другої спроби вийшло 👍','Добре! Помилку виправлено, графік побудовано ✓'];
const PRAISE3=['Вийшло! Головне — що не здалися 💪','Є! З третьої спроби графік побудовано ✓'];
function checkTask(){
  const ts=TS(),t=S.tasks[S.cur];
  if(ts.done||ts.pts.length<3)return;
  ts.tries++;
  const res=ts.pts.map(p=>onGraph(t,p[0],p[1])),k=res.filter(Boolean).length;
  ts.st=res.map(r=>r?1:2);
  const list=ts.pts.map((p,i)=>'<span class="pl">'+pt2(p)+' '+(res[i]?'✓':'✗')+'</span>').join('');
  ts.hist.push('Спроба '+ts.tries+': '+ts.pts.map((p,i)=>pt2(p)+' '+(res[i]?'✓':'✗')).join(', ')+(k===3?' — правильно':' — правильно '+k+' з 3'));
  if(k===3){
    ts.done=1;ts.solvedOn=ts.tries;ts.earned=r1(t.w*ATT[ts.tries-1]);
    const pr=pick(ts.tries===1?PRAISE1:ts.tries===2?PRAISE2:PRAISE3);
    ts.msg='<span class="big">'+pr+'</span>Усі три точки лежать на графіку, графік побудовано. Переходимо далі!<br>'+list+'<br><b>+'+ptsWord(ts.earned)+'</b>';
    ts.mcls=ts.tries===1?'good':'good';
  }else if(ts.tries<3){
    const head=k===0?'Жодна з точок не лежить на графіку.':'Правильно '+k+' з 3 точок: '+(k===1?'зелена точка лежить':'зелені точки лежать')+' на графіку, '+(3-k===1?'червона — ні':'червоні — ні')+'.';
    ts.msg='<span class="big">'+(k>0?'Добра спроба! ':'Нічого, спробуйте ще! ')+'</span>'+head+'<br>'+list+'<br>Спробуйте ще раз: пересуньте червоні точки'+(k>0?' (зелені можна лишити)':'')+'. Тепер за це завдання можна отримати до '+ptsWord(r1(t.w*ATT[ts.tries]))+'.'+
      (ts.tries===2?'<br><b>Підказка:</b> вершина параболи — точка '+t.vertex+'. Від неї знайдіть інші точки, підставляючи значення '+iv('x')+' у формулу.':'');
    ts.mcls='warn';
  }else{
    ts.done=1;ts.solvedOn=0;ts.earned=0;
    ts.msg='<span class="big">Цього разу не вийшло — це нормально.</span>Дивіться правильний графік (зелений пунктир): кільця — точки, які лежать на ньому. Підставте їхні координати у формулу й перевірте. Зараз ви перейдете до наступного завдання.<br>'+list;
    ts.mcls='bad';
  }
  ts.pts.forEach(function(p,i){if(ts.done&&ts.solvedOn===0)ts.st[i]=ts.st[i]});
  updateDyn();updateInfo(false);drawHead(false);
  const mg=$('#msg');if(mg&&mg.scrollIntoView)setTimeout(function(){mg.scrollIntoView({block:'nearest',behavior:'smooth'})},30);
  if(ts.done){
    const i=S.cur;clearTimeout(S.adv);
    S.adv=setTimeout(function(){
      if(S.screen==='task'&&S.cur===i){if(i===S.tasks.length-1)show('before');else show('task',i+1)}
    },ts.solvedOn>0?2600:6500);
  }
}
function scheduleCheck(){
  clearTimeout(S.ck);const i=S.cur;
  S.ck=setTimeout(function(){
    const ts=S.T[i];
    if(S.screen==='task'&&S.cur===i&&!dg&&!ts.done&&ts.pts.length===3)checkTask();
  },450);
}

document.addEventListener('click',function(e){
  const t=e.target;let b;
  if((b=t.closest('[data-go]'))){const i=+b.dataset.go;if(S.screen==='before')show('task',i);else if(S.screen==='task'||S.screen==='review')show(S.screen,i);return}
  if(t.id==='go'){
    const s=$('#sur'),n=$('#nam');S.sur=s.value.trim();S.nam=n.value.trim();
    s.classList.toggle('err',!S.sur);n.classList.toggle('err',!S.nam);

    build();show('task',0);return;
  }
  if(t.id==='clr'){const ts=TS();if(!ts.done){ts.pts=[];ts.st=[];ts.msg='';ts.mcls='';updateDyn();updateInfo(false);drawHead(false)}return}
  if(t.id==='prev'){if(S.screen==='before')show('task',S.tasks.length-1);else show(S.screen,S.cur-1);return}
  if(t.id==='next'){
    if(S.screen==='task'){if(S.cur===S.tasks.length-1)show('before');else show('task',S.cur+1)}
    else show('review',S.cur+1);return;
  }
  if(t.id==='check'){doCheck();return}
  if(t.id==='errs'){const f=S.T.findIndex(x=>x.solvedOn!==1);show('review',f<0?0:f);return}
  if(t.id==='toRes'){show('result');return}
  if(t.id==='again'){build();show('task',0);return}
});

function jcell(r,i){
  const s=(r.solvedOn||[])[i],a=(r.attempts||[])[i];
  if(s===undefined)return ['',''];
  if(s===1)return ['y','✓'];
  if(s>1)return ['o','✓'+['','','²','³'][s]];
  return a>0?['n','✗']:['g','—'];
}
function drawJ(){
  if(!JROWS.length){$('#jtab').textContent='Поки що немає записів.';return}
  const mx=Math.max.apply(null,JROWS.map(r=>(r.tasks||[]).length));
  let h='<table class="jt"><tr><th>№</th><th class="l">Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=mx;i++)h+='<th>'+i+'</th>';h+='</tr>';
  JROWS.forEach(function(r,k){
    const d=r.date?new Date(r.date):null,ds=d?d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'—';
    const hasT=typeof r.durationSec==='number',fast=hasT&&r.durationSec<120,hasL=typeof r.leaves==='number';
    h+='<tr><td>'+(k+1)+'</td><td class="l nm" data-det="'+k+'">'+(r.name||'—')+'</td><td>'+ds+'</td><td'+(fast?' class="r" title="Дуже швидко"':'')+'>'+(hasT?mmss(r.durationSec):'—')+'</td><td'+(hasL&&r.leaves>=3?' class="r"':'')+'>'+(hasL?r.leaves+(r.leaves?' · '+mmss(r.awaySec||0):''):'—')+'</td><td><b>'+fmt(r.score||0)+'</b></td>';
    for(let i=0;i<mx;i++){const c=jcell(r,i);h+='<td class="'+c[0]+'">'+c[1]+'</td>'}
    h+='</tr><tr id="det'+k+'" style="display:none"><td colspan="'+(6+mx)+'" class="det"><div><b>Оцінка: '+fmt(r.score||0)+' з 100 ('+fmt(r.percent||r.score||0)+' %).</b> Виходів з вікна: '+(hasL?r.leaves:'—')+', поза вікном: '+mmss(r.awaySec||0)+' (хв:с). Час: '+(hasT?mmss(r.durationSec):'—')+'.</div>'+
      (r.qtext||[]).map(function(q,i){return '<div><b>'+(i+1)+'.</b> '+q+' · <b>'+fmt((r.pts||[])[i]||0)+' з '+((r.weights||[])[i]||'—')+' б.</b>'+((r.taskSec||[])[i]!==undefined?' · час: '+mmss(r.taskSec[i]):'')+'<br>Відповіді: '+((r.answers||[])[i]||'—')+'<br>Правильно: '+((r.correct||[])[i]||'—')+'</div>'}).join('')+'</td></tr>';
  });
  $('#jtab').innerHTML=h+'</table>';
}
$('#jtab').addEventListener('click',function(e){const n=e.target.closest('[data-det]');if(n){const r=$('#det'+n.dataset.det);r.style.display=r.style.display==='none'?'table-row':'none'}});
$('#jref').onclick=refreshJ;
$('#jcsv').onclick=function(){
  const mx=Math.max.apply(null,[0].concat(JROWS.map(r=>(r.tasks||[]).length)));
  const hd=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'];for(let i=1;i<=mx;i++)hd.push('завд. '+i+' (спроба)');
  const lines=[hd.join(';')].concat(JROWS.map(function(r){
    const row=[r.name||'',r.date?new Date(r.date).toLocaleString('uk-UA'):'',typeof r.durationSec==='number'?mmss(r.durationSec):'',typeof r.leaves==='number'?r.leaves:'',typeof r.awaySec==='number'?mmss(r.awaySec):'',fmt(r.score||0)];
    for(let i=0;i<mx;i++){const s=(r.solvedOn||[])[i],a=(r.attempts||[])[i];row.push(s===undefined?'':s>0?('+'+s):(a>0?'-':''))}
    return row.join(';');
  }));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='Побудова_графіків_9клас_результати.csv';a.click();
};
$('#jclr').onclick=function(){
  $('#jconf').innerHTML='Видалити всі записи ('+JROWS.length+')? <button class="btn" id="cy" style="min-height:36px;background:var(--bad)">Так, видалити</button> <button class="btn gh" id="cn" style="min-height:36px">Скасувати</button>';
  $('#cn').onclick=function(){$('#jconf').textContent=''};
  $('#cy').onclick=async function(){
    try{await clearResults();JROWS=[];drawJ();$('#jconf').textContent=''}catch(e){$('#jconf').textContent='Не вдалося очистити записи. Перевірте правила бази Firebase'}
  };
};

if(/[?&]selftest/.test(location.search))window.__ST={buildTasks:buildTasks,onGraph:onGraph,validPts:validPts,get S(){return S},checkTask:checkTask,ATT:ATT};
render();
})();
