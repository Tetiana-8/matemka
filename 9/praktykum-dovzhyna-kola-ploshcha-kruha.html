<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Практикум. Довжина кола і площа круга (9 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13203f; --muted:#5b6b8f; --acc:#1d4ed8; --accL:#dbe5ff;
  --soft:#ebf0ff; --soft2:#f6f8ff; --line:#c9d6f5;
  --ok:#1e9e62; --okbg:#e6f7ee; --oktx:#14663f; --okln:#8fd3b0;
  --bad:#e0464e; --badbg:#fdecee; --badtx:#a3232b; --badln:#efa3a8;
  --q:#2f9e44;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:clamp(16px,min(1.4545vw,2.6016vh),40px)}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#ebf0ff 0%,#dbe5ff 45%,#c7d6ff 100%) fixed;min-height:100vh;line-height:1.45}
.wrap{max-width:61.25rem;margin:0 auto;padding:0.625rem 0.75rem 0.5rem}
i,.m{font-family:'STIX Two Text','Times New Roman',Times,serif;font-style:italic;font-size:1.06em}
sup,sub{font-size:.7em;line-height:0}
button,input{font-family:inherit}

.hero{background:var(--acc);color:#fff;border-radius:0.875rem;padding:0.5rem 1rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;box-shadow:0 0.25rem 0.875rem rgba(29,78,216,.22)}
.pill{display:inline-block;background:#ffb938;color:#4a3000;font-weight:900;font-size:0.6875rem;letter-spacing:.06em;padding:0.1875rem 0.625rem;border-radius:62.4375rem}
.hero h1{margin:0;font-size:1.375rem;line-height:1.15;font-weight:900}
.hero p{margin:0;font-size:0.875rem;opacity:.95}

.tabs{display:flex;flex-wrap:wrap;gap:0.375rem;margin:0.5rem 0 0}
.tab{min-height:2.375rem;border:0.125rem solid var(--line);background:#fff;color:var(--ink);font-weight:900;font-size:0.9375rem;border-radius:0.75rem;cursor:pointer;padding:0.25rem 0.75rem;touch-action:manipulation}
.tab.on{background:var(--q);border-color:var(--q);color:#fff}
.tab .n{display:inline-block;margin-left:0.375rem;font-size:0.8125rem;background:rgba(0,0,0,.12);border-radius:0.5rem;padding:0 0.375rem}
.tab:not(.on) .n{background:var(--okbg);color:var(--oktx)}

.card{margin-top:0.5rem;background:#fff;border:0.125rem solid var(--line);border-radius:1rem;padding:0.5rem 0.875rem}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 0.125rem;font-size:.95em}
.fr>span:first-child{border-bottom:0.0938rem solid currentColor;padding:0 0.1875rem}.fr>span:last-child{padding:0 0.1875rem}
.tbw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:1.125rem}
.tbl th,.tbl td{border:0.125rem solid var(--line);padding:0.375rem 0.5rem;text-align:center}
.tbl th{background:var(--soft);font-size:1rem}
.tbl td.rl,.tbl th.rl{text-align:left;font-weight:800;font-size:0.9688rem;width:38%}
.tbl tr.sep td{background:var(--soft2);font-weight:900;color:var(--acc);text-align:left;font-size:0.9062rem;padding:0.25rem 0.5rem}
.tbl td.nt{font-size:0.9375rem;color:var(--muted);font-weight:700}
.cc{padding:0.0625rem 0.1875rem;border-radius:0.1875rem}
.cc.m1{background:linear-gradient(transparent 38%,rgba(255,212,59,.75) 38%)}
.cc.m2{background:linear-gradient(transparent 38%,rgba(105,219,124,.65) 38%)}
.cc.m3{background:linear-gradient(transparent 38%,rgba(116,192,252,.7) 38%)}
.cnote{font-size:0.9375rem;color:var(--muted);margin:0.5rem 0.125rem 0;font-weight:700}

.task{border-left:0.5rem solid var(--q)}
.tt{font-size:1.125rem;font-weight:700;margin:0 0 0.25rem}
.tt .tn{background:var(--q);color:#fff;font-weight:900;font-size:0.9375rem;margin-right:0.5rem;display:inline-block;padding:0.125rem 0.625rem;border-radius:0.625rem;vertical-align:0.0625rem}
.cols{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-start}
.figc{flex:0 1 18.75rem;max-width:23.75rem;margin:0 auto}
.gf{width:100%;height:auto;display:block;max-height:13rem}
.leg{font-size:0.875rem;margin-top:0.125rem}
.leg div{margin:0.1875rem 0}
.sq{display:inline-block;width:0.75rem;height:0.75rem;border-radius:0.1875rem;margin-right:0.375rem;vertical-align:-0.0625rem}
.work{flex:1 1 18.75rem}
.btn{background:var(--q);color:#fff;border:0;border-radius:0.75rem;font-weight:900;font-size:1.0625rem;padding:0.625rem 1.125rem;cursor:pointer;touch-action:manipulation;min-height:2.875rem}
.btn.sec{background:#fff;color:var(--q);border:0.125rem solid var(--q)}
.btn.sm{min-height:2.375rem;padding:0.25rem 0.75rem;font-size:0.9375rem}
.btn:disabled{opacity:.5;cursor:default}
.steps{margin-top:0.25rem}
.st{font-size:1.0625rem;padding:0.1875rem 0.625rem;margin:0.1875rem 0;border-left:0.25rem solid var(--line);background:var(--soft2);border-radius:0.5rem}
.st.fin{background:var(--okbg);border:0.125rem solid var(--okln);color:var(--oktx);font-weight:900;border-left-width:0.375rem}
.auth{text-align:center;font-size:0.625rem;color:var(--muted);margin-top:0.375rem}

.ov{position:fixed;inset:0;background:rgba(19,32,63,.38);display:none;align-items:flex-start;justify-content:center;padding:3rem 0.625rem 0.625rem;z-index:50;overflow:auto}
.ov.on{display:flex}
.pnl{background:#fff;border-radius:1rem;padding:0.625rem 0.875rem 0.75rem;max-width:48.75rem;width:100%;box-shadow:0 0.875rem 2.75rem rgba(0,0,0,.35);border:0.125rem solid var(--line)}
.pnl .ph{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:1.0625rem;margin-bottom:0.375rem}
.pnl .ph .btn{min-height:2.375rem;padding:0.25rem 0.875rem}

.bt{display:flex;flex-wrap:wrap;align-items:center;gap:0.375rem 0.5rem;margin:0.375rem 0 0.1875rem;font-weight:800;font-size:1.0312rem}
.bt .k{background:var(--q);color:#fff;border-radius:0.5rem;padding:0.0625rem 0.5625rem;margin-right:0.125rem;font-size:0.875rem}
.bb{display:inline-flex;gap:0.5rem;flex-wrap:wrap}
.or{font-weight:800;color:var(--muted);font-size:0.9375rem;align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem;min-height:2.75rem;align-items:center;padding:0.3125rem 0.5rem;border:0.125rem dashed var(--line);border-radius:0.75rem;margin:0.25rem 0;background:var(--soft2);font-size:1.125rem}
.chips .ph{color:var(--muted);font-size:0.9062rem;font-weight:700}
.chip{background:#fff;border:0.125rem solid var(--q);border-radius:0.625rem;padding:0.125rem 0.625rem;display:inline-flex;align-items:center;gap:0.5rem}
.chip.ok{background:var(--okbg);border-color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad)}
.chip .x{border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 0.125rem}
.opts{display:flex;flex-wrap:wrap;gap:0.5rem;margin:0.25rem 0}
.opt{background:#fff;border:0.125rem solid var(--q);color:var(--ink);border-radius:0.75rem;font-size:1.25rem;font-weight:700;padding:0.3125rem 1rem;min-height:2.75rem;cursor:pointer;font-family:'STIX Two Text','Times New Roman',serif;touch-action:manipulation}
.opt b{font-family:'Nunito',sans-serif;color:var(--q);margin-right:0.375rem;font-size:1.0625rem}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}
.tbl td.pk{cursor:pointer}
.tbl td.pk:hover{background:var(--soft2)}
.tbl td.pk.sel{outline:0.1875rem solid var(--q);outline-offset:-0.1875rem;background:#f0f6ff}
.tbl td.pk.lock{cursor:default}
.fm{display:inline-block;margin-left:0.375rem;font-size:0.9688rem;font-weight:700;vertical-align:middle}
.fm.ok{color:var(--oktx)}.fm.no{color:var(--badtx)}

/* яскрава кнопка «Нова задача» і різнокольорові елементи */
.btn.gen{background:#ffd43b;color:#3b2a00;border:0.1875rem solid #ff9d00;box-shadow:0 0.25rem 0.75rem rgba(255,157,0,.45);font-size:1rem}
.btn.gen:hover{background:#ffc800}
.btn.gen.pulse{animation:pls 1.1s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(255,157,0,.7)}50%{box-shadow:0 0 0 0.6rem rgba(255,157,0,0)}}
.tab{border-color:var(--tc);color:var(--ink)}
.tab::before{content:"";display:inline-block;width:0.625rem;height:0.625rem;border-radius:50%;background:var(--tc);margin-right:0.4375rem;vertical-align:0.0625rem}
.tab.on{background:var(--tc);border-color:var(--tc);color:#fff}
.tab.on::before{background:#fff}
.opt{border-color:var(--oc);}
.opt b{color:var(--oc)}
.opt[data-o="0"]{--oc:#e8590c}.opt[data-o="1"]{--oc:#7048e8}.opt[data-o="2"]{--oc:#0c8599}.opt[data-o="3"]{--oc:#d6336c}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.chip{border-color:var(--cc,var(--q))}
.chip.ok{border-color:var(--cc,var(--ok))}
.card.task{border-left-color:var(--q)}
.tt .tn,.bt .k{background:var(--q)}
.bt:nth-of-type(2) .k{background:#7048e8}
@media(max-width:520px){
  .hero p{display:none}.hero h1{font-size:1.1875rem}
  .gf{max-height:10.625rem}.figc{flex-basis:100%}
  .tbl{font-size:0.875rem}.tbl th,.tbl td{padding:0.25rem 0.1875rem}.tbl td.rl,.tbl th.rl{font-size:0.7812rem}
  .tt{font-size:1.0625rem}.st{font-size:1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="pill">ГЕОМЕТРІЯ · 9 КЛАС</span>
    <h1>Практикум</h1>
    <p>Довжина кола, площа круга, довжина дуги, площа сектора й сегмента</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="ov" id="ov"><div class="pnl">
    <div class="ph"><span>Таблиця формул: клацніть на потрібні</span><button type="button" class="btn sec" id="tbX">✓ Готово</button></div>
    <div class="tbw" id="tblHost"></div>
    <div class="cnote"><i>R</i> — радіус, <i>d</i> — діаметр, <i>α</i> — градусна міра центрального кута, <i>l</i> — довжина дуги.</div>
  </div></div>

  <div class="card task" id="task"></div>
  <div class="auth">Автор розробки <b>Ковтун Тетяна</b></div>
</div>

<script>
(function(){ "use strict";
/*GEN-START*/
const FR=(a,b)=>'<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>';
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const pi=k=>(k===1?'':k)+'π';
const fLen=k=>pi(k)+' см', fArea=k=>pi(k)+' см²', fCm=k=>k+' см', fDeg=k=>k+'°';
const Ri='<i>R</i>', Ai='<i>α</i>';

/* варіанти відповіді: правильна + 3 правдоподібні хибні (цілі додатні числа) */
function mk(k,fmt,cands){
  const seen={}; seen[k]=1; const out=[];
  cands.concat([k+1,k+2,k*2,k+3,Math.max(1,k-1),k+4,k+5,k+6]).forEach(c=>{
    if(out.length<3 && Number.isInteger(c) && c>0 && !seen[c]){ seen[c]=1; out.push(c); }
  });
  const opts=shuffle([fmt(k)].concat(out.map(fmt)));
  return {opts:opts, ci:opts.indexOf(fmt(k))};
}

/* пари для дуги й сектора */
const ARC=[], SEC=[], SEC3=[];
[20,30,36,40,45,60,72,90,120,135,150,180,240,270].forEach(a=>{
  for(let R=2;R<=24;R++){ if((R*a)%180===0 && R*a/180<=40) ARC.push([R,a]); }
});
[30,40,45,60,72,90,120,135,150,180,240,270].forEach(a=>{
  for(let R=2;R<=18;R++){
    if((R*R*a)%360===0 && R*R*a/360<=60){
      SEC.push([R,a]);
      if((R*a)%180===0 && ((R*a/180)*R)%2===0) SEC3.push([R,a]);
    }
  }
});

/* ---- 1. Довжина кола ---- */
function gC(){
  const v=rnd(4), cs='<i>C</i>';
  if(v===0){ const R=2+rnd(19), k=2*R, m=mk(k,fLen,[R,4*R,R*R,k+R]);
    return {kind:'C',v:v,p:{R:R},text:'Радіус кола дорівнює '+R+' см. Знайдіть довжину цього кола.',
      f:{mode:'c',rLab:'R = '+R,hl:'circ'},need:['C1'],
      st:[{h:cs+' = 2π'+Ri+' = 2 · π · '+R+' = '+pi(k),c:'C1'}],show:fLen(k),ans:fLen(k),opts:m.opts,ci:m.ci}; }
  if(v===1){ const d=4+rnd(27), m=mk(d,fLen,[2*d,d*d,d%2===0?d/2:0,d+2]);
    return {kind:'C',v:v,p:{d:d},text:'Діаметр кола дорівнює '+d+' см. Знайдіть довжину цього кола.',
      f:{mode:'c',dLab:'d = '+d,hl:'circ'},need:['C2'],
      st:[{h:cs+' = π<i>d</i> = π · '+d+' = '+pi(d),c:'C2'}],show:fLen(d),ans:fLen(d),opts:m.opts,ci:m.ci}; }
  if(v===2){ const R=2+rnd(19), k=2*R, m=mk(R,fCm,[k,2*k,k+R,R*R>400?0:R*R]);
    return {kind:'C',v:v,p:{k:k},text:'Довжина кола дорівнює '+pi(k)+' см. Знайдіть радіус цього кола.',
      f:{mode:'c',rLab:'R = ?',hl:'circ'},need:['C1'],
      st:[{h:pi(k)+' = 2π'+Ri,c:'C1'},{h:Ri+' = '+FR(pi(k),'2π')+' = '+R}],show:fCm(R),ans:fCm(R),opts:m.opts,ci:m.ci}; }
  const d=6+rnd(35), m=mk(d,fCm,[2*d,d*2+2,d%2===0?d/2:0,d+4]);
  return {kind:'C',v:v,p:{k:d},text:'Довжина кола дорівнює '+pi(d)+' см. Знайдіть діаметр цього кола.',
    f:{mode:'c',dLab:'d = ?',hl:'circ'},need:['C2'],
    st:[{h:pi(d)+' = π<i>d</i>',c:'C2'},{h:'<i>d</i> = '+FR(pi(d),'π')+' = '+d}],show:fCm(d),ans:fCm(d),opts:m.opts,ci:m.ci};
}

/* ---- 2. Площа круга ---- */
function gS(){
  const v=rnd(4), ss='<i>S</i>';
  if(v===0){ const R=2+rnd(14), k=R*R, m=mk(k,fArea,[2*R,R,4*R,k*2]);
    return {kind:'S',v:v,p:{R:R},text:'Радіус круга дорівнює '+R+' см. Знайдіть площу круга.',
      f:{mode:'s',rLab:'R = '+R},need:['S1'],
      st:[{h:ss+' = π'+Ri+'<sup>2</sup> = π · '+R+'<sup>2</sup> = '+pi(k),c:'S1'}],show:fArea(k),ans:fArea(k),opts:m.opts,ci:m.ci}; }
  if(v===1){ const R=2+rnd(14), d=2*R, k=R*R, m=mk(k,fArea,[d*d,d,R,2*R*R]);
    return {kind:'S',v:v,p:{d:d},text:'Діаметр круга дорівнює '+d+' см. Знайдіть площу круга.',
      f:{mode:'s',dLab:'d = '+d},need:['D','S1'],
      st:[{h:Ri+' = '+FR('<i>d</i>','2')+' = '+FR(d,'2')+' = '+R,c:'D'},{h:ss+' = π'+Ri+'<sup>2</sup> = π · '+R+'<sup>2</sup> = '+pi(k),c:'S1'}],
      show:fArea(k),ans:fArea(k),opts:m.opts,ci:m.ci}; }
  if(v===2){ const R=2+rnd(14), k=R*R, m=mk(R,fCm,[k,2*R,k/2===Math.floor(k/2)?k/2:0,R+2]);
    return {kind:'S',v:v,p:{k:k},text:'Площа круга дорівнює '+pi(k)+' см². Знайдіть радіус круга.',
      f:{mode:'s',rLab:'R = ?'},need:['S1'],
      st:[{h:pi(k)+' = π'+Ri+'<sup>2</sup>',c:'S1'},{h:Ri+'<sup>2</sup> = '+k+', '+Ri+' = '+R}],show:fCm(R),ans:fCm(R),opts:m.opts,ci:m.ci}; }
  const R=2+rnd(12), C=2*R, k=R*R, m=mk(k,fArea,[C*C,C,2*R*R,R]);
  return {kind:'S',v:v,p:{k:C},text:'Довжина кола, що обмежує круг, дорівнює '+pi(C)+' см. Знайдіть площу круга.',
    f:{mode:'s',rLab:''},need:['C1','S1'],
    st:[{h:pi(C)+' = 2π'+Ri+', '+Ri+' = '+FR(pi(C),'2π')+' = '+R,c:'C1'},{h:'<i>S</i> = π'+Ri+'<sup>2</sup> = π · '+R+'<sup>2</sup> = '+pi(k),c:'S1'}],
    show:fArea(k),ans:fArea(k),opts:m.opts,ci:m.ci};
}

/* ---- 3. Довжина дуги ---- */
function gL(){
  const v=rnd(3), pr=pick(ARC), R=pr[0], a=pr[1], c=R*a/180, ls='<i>l</i>';
  const form=ls+' = '+FR('π'+Ri+Ai,'180');
  if(v===0){ const m=mk(c,fLen,[2*c,c%2===0?c/2:0,R*a/360===Math.floor(R*a/360)?R*a/360:0,R*R*a/180===Math.floor(R*R*a/180)?R*R*a/180:0]);
    return {kind:'L',v:v,p:{R:R,a:a},text:'Радіус кола дорівнює '+R+' см. Знайдіть довжину дуги цього кола, градусна міра якої '+a+'°.',
      f:{mode:'arc',alpha:a,rLab:'R = '+R,aLab:a+'°',lLab:'l = ?'},need:['A1'],
      st:[{h:form+' = '+FR('π · '+R+' · '+a,'180')+' = '+pi(c),c:'A1'}],show:fLen(c),ans:fLen(c),opts:m.opts,ci:m.ci}; }
  if(v===1){ const m=mk(a,fDeg,[2*a,a%2===0?a/2:0,360-a,180-a>0?180-a:0]);
    return {kind:'L',v:v,p:{R:R,c:c},text:'Довжина дуги кола радіуса '+R+' см дорівнює '+pi(c)+' см. Знайдіть градусну міру цієї дуги.',
      f:{mode:'arc',alpha:a,rLab:'R = '+R,aLab:'α = ?',lLab:'l = '+pi(c)},need:['A1'],
      st:[{h:pi(c)+' = '+FR('π · '+R+' · '+Ai,'180'),c:'A1'},{h:Ai+' = '+FR('180 · '+pi(c),'π · '+R)+' = '+a+'°'}],show:fDeg(a),ans:fDeg(a),opts:m.opts,ci:m.ci}; }
  const m=mk(R,fCm,[2*R,c,Math.round(R/2),R+2]);
  return {kind:'L',v:v,p:{a:a,c:c},text:'Довжина дуги кола, градусна міра якої '+a+'°, дорівнює '+pi(c)+' см. Знайдіть радіус цього кола.',
    f:{mode:'arc',alpha:a,rLab:'R = ?',aLab:a+'°',lLab:'l = '+pi(c)},need:['A1'],
    st:[{h:pi(c)+' = '+FR('π · '+Ri+' · '+a,'180'),c:'A1'},{h:Ri+' = '+FR('180 · '+pi(c),'π · '+a)+' = '+R}],show:fCm(R),ans:fCm(R),opts:m.opts,ci:m.ci};
}

/* ---- 4. Площа сектора ---- */
function gSec(){
  const v=rnd(4), ss='<i>S</i><sub>сект</sub>';
  const form=ss+' = '+FR('π'+Ri+'<sup>2</sup>'+Ai,'360');
  if(v===3){ const pr=pick(SEC3), R=pr[0], a=pr[1], c=R*a/180, k=c*R/2, m=mk(k,fArea,[c*R,c,2*k+R,Math.round(c/2)]);
    return {kind:'Sec',v:v,p:{R:R,c:c},text:'Довжина дуги сектора дорівнює '+pi(c)+' см, а радіус круга '+R+' см. Знайдіть площу цього сектора.',
      f:{mode:'sec',alpha:a,rLab:'R = '+R,aLab:'',sLab:'S = ?',lLab2:'l = '+pi(c)},need:['A3'],
      st:[{h:ss+' = '+FR('1','2')+'<i>lR</i> = '+FR('1','2')+' · '+pi(c)+' · '+R+' = '+pi(k),c:'A3'}],show:fArea(k),ans:fArea(k),opts:m.opts,ci:m.ci}; }
  const pr=pick(SEC), R=pr[0], a=pr[1], k=R*R*a/360;
  if(v===0){ const m=mk(k,fArea,[2*k,k%2===0?k/2:0,R*a/180===Math.floor(R*a/180)?R*a/180:0,R*R]);
    return {kind:'Sec',v:v,p:{R:R,a:a},text:'Радіус круга дорівнює '+R+' см. Знайдіть площу сектора, центральний кут якого дорівнює '+a+'°.',
      f:{mode:'sec',alpha:a,rLab:'R = '+R,aLab:a+'°',sLab:'S = ?'},need:['A2'],
      st:[{h:form+' = '+FR('π · '+R+'<sup>2</sup> · '+a,'360')+' = '+pi(k),c:'A2'}],show:fArea(k),ans:fArea(k),opts:m.opts,ci:m.ci}; }
  if(v===1){ const m=mk(a,fDeg,[2*a,a%2===0?a/2:0,360-a,180-a>0?180-a:0]);
    return {kind:'Sec',v:v,p:{R:R,k:k},text:'Площа сектора круга радіуса '+R+' см дорівнює '+pi(k)+' см². Знайдіть градусну міру його дуги.',
      f:{mode:'sec',alpha:a,rLab:'R = '+R,aLab:'α = ?',sLab:'S = '+pi(k)},need:['A2'],
      st:[{h:pi(k)+' = '+FR('π · '+R+'<sup>2</sup> · '+Ai,'360'),c:'A2'},{h:Ai+' = '+FR('360 · '+pi(k),'π · '+R+'<sup>2</sup>')+' = '+a+'°'}],show:fDeg(a),ans:fDeg(a),opts:m.opts,ci:m.ci}; }
  const m=mk(R,fCm,[R*2,R*R,k,R+2]);
  return {kind:'Sec',v:v,p:{a:a,k:k},text:'Площа сектора з центральним кутом '+a+'° дорівнює '+pi(k)+' см². Знайдіть радіус круга.',
    f:{mode:'sec',alpha:a,rLab:'R = ?',aLab:a+'°',sLab:'S = '+pi(k)},need:['A2'],
    st:[{h:pi(k)+' = '+FR('π · '+Ri+'<sup>2</sup> · '+a,'360'),c:'A2'},{h:Ri+'<sup>2</sup> = '+FR('360 · '+k,String(a))+' = '+(R*R)+', '+Ri+' = '+R}],show:fCm(R),ans:fCm(R),opts:m.opts,ci:m.ci};
}

/* ---- 5. Площа сегмента ---- */
function expr(p,q,rad,sign){ return pi(p)+' '+sign+' '+((q===1&&rad)?'':q)+rad+' см²'; }
function gSeg(){
  const a=pick([60,90,120]), R=a===90?pick([4,6,8,10,12,14,16]):pick([6,12,18]), R2=R*R;
  let p,q,rad,triH,secK;
  if(a===90){ p=R2/4; q=R2/2; rad=''; triH=FR('1','2')+' · '+R+'<sup>2</sup> · 1 = '+q; }
  else { p=a===60?R2/6:R2/3; q=R2/4; rad='√3'; triH=FR('1','2')+' · '+R+'<sup>2</sup> · '+FR('√3','2')+' = '+q+'√3'; }
  const ans=expr(p,q,rad,'−');
  const cand=[expr(p,q,rad,'+'),pi(p)+' см²',expr(p,2*q,rad,'−'),expr(p,Math.max(1,q/2),rad,'−'),expr(p+q,q,rad,'−'),expr(Math.max(1,p-1),q,rad,'−'),expr(p,q+1,rad,'−'),expr(p+1,q,rad,'−')];
  const out=[], seen={}; seen[ans]=1; cand.forEach(c=>{ if(out.length<3 && !seen[c] && /\d|π/.test(c)){ seen[c]=1; out.push(c); } });
  const opts=shuffle([ans].concat(out));
  const sinTxt=a===90?'1':'√3/2';
  return {kind:'Seg',v:0,p:{R:R,a:a},text:'Радіус круга дорівнює '+R+' см. Знайдіть площу сегмента, відсіченого хордою, яка стягує дугу '+a+'°.',
    f:{mode:'seg',alpha:a,rLab:'R = '+R,aLab:a+'°'},need:['G1','A2','G2'],
    st:[{h:'<i>S</i><sub>сект</sub> = '+FR('π · '+R+'<sup>2</sup> · '+a,'360')+' = '+pi(p),c:'A2'},
        {h:'<i>S</i><sub>△</sub> = '+triH,c:'G2'},
        {h:'<i>S</i><sub>сегм</sub> = <i>S</i><sub>сект</sub> − <i>S</i><sub>△</sub> = '+pi(p)+' − '+((q===1&&rad)?'':q)+rad,c:'G1'}],
    show:ans,ans:ans,opts:opts,ci:opts.indexOf(ans)};
}
const GENS=[gC,gS,gL,gSec,gSeg];
const TABN=['Довжина кола','Площа круга','Довжина дуги','Площа сектора','Площа сегмента','Мікс'];
function gen(i){ return i===5 ? pick(GENS)() : GENS[i](); }
/*GEN-END*/

/* ===== Таблиця формул ===== */
const CELLS={
 C1:'<i>C</i> = 2π<i>R</i>', C2:'<i>C</i> = π<i>d</i>', D:'<i>d</i> = 2<i>R</i>', S1:'<i>S</i> = π<i>R</i><sup>2</sup>',
 A1:'<i>l</i> = '+FR('π<i>R</i><i>α</i>','180'),
 A2:'<i>S</i><sub>сект</sub> = '+FR('π<i>R</i><sup>2</sup><i>α</i>','360'),
 A3:'<i>S</i><sub>сект</sub> = '+FR('1','2')+'<i>lR</i>',
 G1:'<i>S</i><sub>сегм</sub> = <i>S</i><sub>сект</sub> − <i>S</i><sub>△</sub>',
 G2:'<i>S</i><sub>△</sub> = '+FR('1','2')+'<i>R</i><sup>2</sup> sin <i>α</i>'
};
function tableHTML(){
  const c=id=>'<td class="pk" data-c="'+id+'"><span class="cc">'+CELLS[id]+'</span></td>';
  const row=(l,id)=>'<tr><td class="rl">'+l+'</td>'+c(id)+'</tr>';
  return '<table class="tbl"><tr><th class="rl">Що знаходимо</th><th>Формула</th></tr>'+
   '<tr class="sep"><td colspan="2">Коло і круг</td></tr>'+
   row('Довжина кола через радіус','C1')+row('Довжина кола через діаметр','C2')+row('Діаметр через радіус','D')+row('Площа круга','S1')+
   '<tr class="sep"><td colspan="2">Дуга і сектор</td></tr>'+
   row('Довжина дуги в <i>α</i>°','A1')+row('Площа сектора з кутом <i>α</i>°','A2')+row('Площа сектора за довжиною дуги','A3')+
   '<tr class="sep"><td colspan="2">Сегмент</td></tr>'+
   row('Площа сегмента','G1')+row('Площа трикутника з двома радіусами','G2')+
   '<tr><td class="nt" colspan="2">sin 60° = '+FR('√3','2')+', sin 90° = 1, sin 120° = '+FR('√3','2')+'</td></tr></table>';
}

/* ===== Рисунки ===== */
const CX=150, CY=118, RR=78;
const BL='#1d4ed8', RD='#e0464e', OR='#e08a00', DK='#111';
const pt=(a,r)=>{ const g=a*Math.PI/180; return [CX+r*Math.cos(g), CY-r*Math.sin(g)]; };
const n1=v=>v.toFixed(1);
const TX='font-family="STIX Two Text,Times New Roman,serif" font-style="italic" font-size="17" text-anchor="middle" stroke="#fff" stroke-width="3.5" paint-order="stroke"';
const txt=(x,y,s,col)=>'<text x="'+n1(x)+'" y="'+n1(y)+'" '+TX+' fill="'+(col||DK)+'">'+s+'</text>';
const ln=(p,q,col,w)=>'<line x1="'+n1(p[0])+'" y1="'+n1(p[1])+'" x2="'+n1(q[0])+'" y2="'+n1(q[1])+'" stroke="'+col+'" stroke-width="'+(w||2.4)+'" stroke-linecap="round"/>';
const dot=(p,r)=>'<circle cx="'+n1(p[0])+'" cy="'+n1(p[1])+'" r="'+(r||3.2)+'" fill="'+DK+'"/>';
function arcPath(a,r,from){ const p1=pt(from||0,r), p2=pt(a,r); return 'M'+n1(p1[0])+' '+n1(p1[1])+' A'+r+' '+r+' 0 '+(a>180?1:0)+' 0 '+n1(p2[0])+' '+n1(p2[1]); }
function figure(f){
  let s='<svg class="gf" viewBox="0 0 300 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="рисунок">', O=[CX,CY];
  if(f.mode==='c'||f.mode==='s'){
    const fill=f.mode==='s'?'rgba(29,78,216,.14)':'none', sw=f.mode==='c'?4.2:2.6, col=f.mode==='c'?RD:BL;
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" fill="'+fill+'" stroke="'+col+'" stroke-width="'+sw+'"/>';
    if(f.dLab){ const a=pt(25,RR), b=pt(205,RR), m=pt(25,RR*0.55);
      s+=ln(a,b,DK,2.6)+dot(a)+dot(b)+txt(m[0]+4,m[1]-9,f.dLab); }
    else { const e=pt(35,RR), m=pt(35,RR/2); s+=ln(O,e,DK,2.6)+dot(e);
      if(f.rLab) s+=txt(m[0]+8,m[1]-9,f.rLab); }
    s+=dot(O)+txt(CX-12,CY+19,'O');
  } else {
    const a=f.alpha, P1=pt(0,RR), P2=pt(a,RR), mid=pt(a/2,RR+22);
    s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" fill="none" stroke="#c9d6f5" stroke-width="2.2"/>';
    if(f.mode==='sec'){
      s+='<path d="M'+CX+' '+CY+' L'+n1(P1[0])+' '+n1(P1[1])+' '+arcPath(a,RR).replace(/^M[^A]*/,'')+' Z" fill="rgba(29,78,216,.18)" stroke="'+BL+'" stroke-width="2.6" stroke-linejoin="round"/>';
    } else if(f.mode==='arc'){
      s+='<path d="'+arcPath(a,RR)+'" fill="none" stroke="'+RD+'" stroke-width="5" stroke-linecap="round"/>'+ln(O,P1,DK,2.4)+ln(O,P2,DK,2.4);
    } else {
      s+='<path d="M'+n1(P1[0])+' '+n1(P1[1])+' '+arcPath(a,RR).replace(/^M[^A]*/,'')+' Z" fill="rgba(224,70,78,.28)" stroke="'+RD+'" stroke-width="2.8" stroke-linejoin="round"/>'+
         '<polygon points="'+n1(CX)+','+n1(CY)+' '+n1(P1[0])+','+n1(P1[1])+' '+n1(P2[0])+','+n1(P2[1])+'" fill="none" stroke="'+DK+'" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 4"/>';
    }
    s+=dot(P1,3)+dot(P2,3);
    if(f.rLab){ const m=pt(0,RR*0.55); s+=txt(m[0],m[1]+19,f.rLab); }
    if(f.aLab){ s+='<path d="'+arcPath(a,20)+'" fill="none" stroke="'+OR+'" stroke-width="2.4"/>'; const m=pt(a/2,38); s+=txt(m[0],m[1]+5,f.aLab,'#a35f00'); }
    if(f.lLab) s+=txt(mid[0],mid[1]+5,f.lLab,RD);
    if(f.sLab) s+=txt(mid[0],mid[1]+5,f.sLab,BL);
    s+=dot(O)+txt(CX-12,CY+19,'O');
  }
  return s+'</svg>';
}
function legend(f){
  const L=(c,t)=>'<div><span class="sq" style="background:'+c+'"></span>'+t+'</div>';
  if(f.mode==='c') return L(RD,'Коло з центром <i>O</i>')+L(DK,f.dLab?'Діаметр кола':'Радіус кола');
  if(f.mode==='s') return L(BL,'Круг з центром <i>O</i>')+(f.dLab?L(DK,'Діаметр круга'):L(DK,'Радіус круга'));
  if(f.mode==='arc') return L(RD,'Дуга кола')+L(DK,'Радіуси')+L(OR,'Центральний кут');
  if(f.mode==='sec') return L(BL,'Сектор круга')+L(OR,'Центральний кут');
  return L(RD,'Сегмент круга')+L(DK,'Трикутник з двома радіусами й хордою')+L(OR,'Центральний кут');
}

/* ===== Стан і сторінки ===== */
const QC=['#e8590c','#7048e8','#0c8599','#d6336c','#e03131','#2f9e44'];
const LET=['А','Б','В','Г'];
const $=(s,r)=>(r||document).querySelector(s);
const fresh=i=>({t:gen(i),sel:[],fok:false,fmsg:'',opts:false,bad:[],done:false,shown:0});
const STATE=TABN.map((_,i)=>fresh(i));
const SOLVED=TABN.map(()=>0);
let cur=0;
const CNT=()=>SOLVED[cur];
function drawTabs(){
  $('#tabs').innerHTML=TABN.map((t,i)=>'<button type="button" class="tab'+(i===cur?' on':'')+'" data-i="'+i+'" style="--tc:'+QC[i]+'">'+t+(SOLVED[i]?'<span class="n">'+SOLVED[i]+'</span>':'')+'</button>').join('');
}
function markCells(){
  document.querySelectorAll('.cc').forEach(e=>e.classList.remove('m1','m2','m3'));
  const S=STATE[cur], t=S.t; let n=0;
  t.st.slice(0,S.shown).forEach(s=>{ if(s.c){ n++; const el=document.querySelector('td[data-c="'+s.c+'"] .cc'); if(el) el.classList.add('m'+Math.min(n,3)); } });
}
const stCol=['#f0b400','#2f9e44','#1c7ed6'];
function stepHTML(){
  const S=STATE[cur], t=S.t; let n=0, h='';
  t.st.slice(0,S.shown).forEach(s=>{ if(s.c) n++;
    h+='<div class="st"'+(s.c?' style="border-left-color:'+stCol[Math.min(n,3)-1]+'"':'')+'>'+s.h+'</div>'; });
  if(S.shown>=t.st.length) h+='<div class="st fin">Відповідь: '+t.show+'</div>';
  return h;
}
function chipsHTML(){
  const S=STATE[cur];
  if(!S.sel.length) return '<span class="ph">Тут з\'являться обрані формули</span>';
  const CH=['#e8590c','#7048e8','#0c8599'];
  return S.sel.map((id,ix)=>'<span class="chip'+(S.fok?' ok':(S.fmsg==='no'?' bad':''))+'" style="--cc:'+CH[ix%3]+'"><span>'+CELLS[id]+'</span>'+(S.fok?'':'<button type="button" class="x" data-x="'+id+'" aria-label="прибрати">✕</button>')+'</span>').join('');
}
function fmsgHTML(){
  const S=STATE[cur];
  if(S.fok) return '<span class="fm ok">✓ Формули правильні</span>';
  if(S.fmsg==='no') return '<span class="fm no">Неправильно. Спробуйте ще.</span>';
  return '';
}
function optsHTML(){
  const S=STATE[cur], t=S.t;
  return t.opts.map((o,k)=>{ let c='opt', dis='';
    if(S.done){ dis=' disabled'; if(k===t.ci) c+=' good'; }
    else if(S.bad.indexOf(k)>=0){ c+=' wrong'; dis=' disabled'; }
    return '<button type="button" class="'+c+'" data-o="'+k+'"'+dis+'><b>'+LET[k]+')</b>'+o+'</button>'; }).join('');
}
function outHTML(){
  const S=STATE[cur];
  if(S.done) return '<span class="fm ok">✓ Правильно!</span>';
  if(S.bad.length) return '<span class="fm no">Неправильно. Спробуйте інший варіант.</span>';
  return '';
}
function syncPanel(){
  const S=STATE[cur];
  document.querySelectorAll('#tblHost td.pk').forEach(td=>{
    td.classList.toggle('sel',S.sel.indexOf(td.dataset.c)>=0);
    td.classList.toggle('lock',!!S.fok);
  });
}
function render(){
  const S=STATE[cur], t=S.t, nd=t.need.length;
  document.documentElement.style.setProperty('--q',QC[cur]);
  $('#tblHost').innerHTML=tableHTML();
  $('#task').innerHTML=
   '<p class="tt"><span class="tn">Задача</span>'+t.text+'</p>'+
   '<div class="cols"><div class="figc">'+figure(t.f)+'<div class="leg">'+legend(t.f)+'</div></div>'+
   '<div class="work">'+
   '<div class="bt"><span class="k">Крок 1</span>Оберіть '+nd+' '+(nd===1?'формулу':(nd<5?'формули':'формул'))+' <span class="bb"><button type="button" class="btn sec sm" id="tbBtn">📋 Таблиця</button>'+(S.fok?'':'<button type="button" class="btn sm" id="fchk"'+(S.sel.length?'':' disabled')+'>Перевірити</button>')+'</span><span id="fout">'+fmsgHTML()+'</span></div>'+
   '<div class="chips" id="chips">'+chipsHTML()+'</div>'+
   '<div class="bt"><span class="k">Крок 2</span>Обчисліть, а далі <span class="bb">'+(S.opts?'':'<button type="button" class="btn sm" id="ans"'+(S.fok?'':' disabled')+'>✍️ Назвати відповідь</button><span class="or">або</span>')+
   '<button type="button" class="btn sec sm" id="stp">'+(S.shown?'↓ Далі':'📖 Показати розв\'язання')+'</button>'+
   '<button type="button" class="btn sm gen'+(S.done?' pulse':'')+'" id="gen">↻ Нова задача</button></span><span id="out">'+outHTML()+'</span></div>'+
   (S.opts?'<div class="opts" id="opts">'+optsHTML()+'</div>':'')+
   '<div class="steps" id="steps">'+stepHTML()+'</div></div></div>';
  if(S.shown>=t.st.length) $('#stp').style.display='none';
  syncPanel(); markCells(); drawTabs();
}
function refreshSel(){
  const S=STATE[cur]; S.fmsg='';
  $('#chips').innerHTML=chipsHTML(); $('#fout').innerHTML='';
  const b=$('#fchk'); if(b) b.disabled=!S.sel.length;
  syncPanel();
}
document.addEventListener('click',e=>{
  const S=STATE[cur], t=S.t;
  const tb=e.target.closest('.tab'); if(tb){ cur=+tb.dataset.i; render(); return; }
  if(e.target.id==='gen'){ STATE[cur]=fresh(cur); render(); return; }
  if(e.target.id==='tbBtn'){ $('#ov').classList.add('on'); return; }
  if(e.target.id==='tbX'||e.target.id==='ov'){ $('#ov').classList.remove('on'); return; }
  const td=e.target.closest('#tblHost td.pk');
  if(td){ if(S.fok) return; const id=td.dataset.c, k=S.sel.indexOf(id); if(k>=0) S.sel.splice(k,1); else S.sel.push(id); refreshSel(); return; }
  const x=e.target.closest('.x'); if(x){ const k=S.sel.indexOf(x.dataset.x); if(k>=0) S.sel.splice(k,1); refreshSel(); return; }
  if(e.target.id==='fchk'){
    const ok=S.sel.length===t.need.length && t.need.every(id=>S.sel.indexOf(id)>=0);
    if(ok){ S.fok=true; S.fmsg='ok'; } else { S.fmsg='no'; }
    render(); return;
  }
  if(e.target.id==='ans'){ if(S.fok){ S.opts=true; render(); } return; }
  const op=e.target.closest('.opt');
  if(op){ const k=+op.dataset.o; if(k===t.ci){ if(!S.done) SOLVED[cur]++; S.done=true; } else if(S.bad.indexOf(k)<0) S.bad.push(k); render(); return; }
  if(e.target.id==='stp'){
    if(S.shown<t.st.length) S.shown++;
    $('#steps').innerHTML=stepHTML(); markCells();
    $('#stp').textContent='↓ Далі';
    if(S.shown>=t.st.length) $('#stp').style.display='none';
    return;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#ov').classList.remove('on'); });
window.__P={GENS:GENS,gen:gen,STATE:STATE};
render();
})();
</script>
