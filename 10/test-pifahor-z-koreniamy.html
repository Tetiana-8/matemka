<body>
<div id="app"></div>
<button id="keyBtn" type="button" title="">🔑</button>
<div id="jr"><div class="box" id="jrBox"></div></div>

<script>
(function(){ "use strict";

/* ========================= ГЕНЕРАТОР І ПЕРЕВІРКА ========================= */
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){
  const f=mulberry32(seed>>>0);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample:(arr,k)=>R.shuffle(arr).slice(0,k)};
  return R;
}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
function sqrtSimp(n){let s=1,r=n;for(let f=2;f*f<=r;f++){while(r%(f*f)===0){r/=f*f;s*=f;}}return {s,r};}

/* ---- запис значення s·√r/d (з необов'язковою змінною) ---- */
function vNorm(s,r,d){const g=gcd(s,d);return {s:s/g,r:r,d:d/g};}
function vTex(v,nm){
  let top;
  if(nm)top=(v.s>1?String(v.s):'')+nm+(v.r>1?'\\sqrt{'+v.r+'}':'');
  else top=v.r===1?String(v.s):(v.s===1?'':String(v.s))+'\\sqrt{'+v.r+'}';
  return v.d===1?top:'\\dfrac{'+top+'}{'+v.d+'}';
}
function vTyped(v,nm){
  let top;
  if(nm)top=(v.s>1?String(v.s):'')+nm+(v.r>1?'√'+v.r:'');
  else top=v.r===1?String(v.s):(v.s===1?'':String(v.s))+'√'+v.r;
  return v.d===1?top:top+'/'+v.d;
}
const vVal=v=>v.s*Math.sqrt(v.r)/v.d;
const fracTex=(n,d)=>d===1?String(n):'\\dfrac{'+n+'}{'+d+'}';
const fracTyped=(n,d)=>d===1?String(n):n+'/'+d;
const rootTex=(k,m)=>(k===1?'':String(k))+'\\sqrt{'+m+'}';

/* ---- розбір виразу, введеного учнем ---- */
function tokenize(str){
  let s=String(str).replace(/\s/g,'').replace(/-/g,'−').replace(/\*/g,'·').replace(/[:÷]/g,'/').replace(/\^2/g,'²').replace(/\./g,',');
  const out=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\d/.test(c)){let j=i;while(j<s.length&&/\d/.test(s[j]))j++;let txt=s.slice(i,j);
      if(s[j]===','&&/\d/.test(s[j+1]||'')){let k=j+1;while(k<s.length&&/\d/.test(s[k]))k++;txt=s.slice(i,k);j=k;}
      out.push({k:'n',v:parseFloat(txt.replace(',','.')),s:txt});i=j;}
    else if(/[a-z]/.test(c)){out.push({k:'v',n:c});i++;}
    else if('+−·/()√²'.indexOf(c)>=0){out.push({k:c});i++;}
    else throw new Error('bad char');
  }
  return out;
}
function parseExpr(str){
  const T=tokenize(str);let p=0;
  const peek=()=>T[p]?T[p].k:null;
  function expr(){
    let a=term();
    while(peek()==='+'||peek()==='−'){const op=T[p++].k;const b=term();a={t:op==='+'?'add':'sub',l:a,r:b};}
    return a;
  }
  function term(){
    let a=unary();
    for(;;){
      const k=peek();
      if(k==='·'||k==='/'){p++;const b=unary();a={t:k==='/'?'div':'mul',l:a,r:b,dot:k==='·'};}
      else if(k==='√'||k==='('||k==='n'||k==='v'){const b=unary();a={t:'mul',l:a,r:b,dot:false};}
      else break;
    }
    return a;
  }
  function unary(){
    if(peek()==='−'){p++;return {t:'neg',e:unary()};}
    return power();
  }
  function power(){
    let a=atom();
    while(peek()==='²'){p++;a={t:'pow',e:a};}
    return a;
  }
  function atom(){
    const k=peek();
    if(k==='n'){const t=T[p++];return {t:'num',v:t.v,s:t.s};}
    if(k==='v'){const t=T[p++];return {t:'var',n:t.n};}
    if(k==='('){p++;const e=expr();if(peek()!==')')throw new Error('no )');p++;return {t:'paren',e};}
    if(k==='√'){p++;const k2=peek();
      if(k2==='n'){const t=T[p++];return {t:'sqrt',e:{t:'num',v:t.v,s:t.s}};}
      if(k2==='v'){const t=T[p++];return {t:'sqrt',e:{t:'var',n:t.n}};}
      if(k2==='('){p++;const e=expr();if(peek()!==')')throw new Error('no )');p++;return {t:'sqrt',e:{t:'paren',e}};}
      if(k2==='√'){return {t:'sqrt',e:atom()};}
      throw new Error('no arg');}
    throw new Error('unexpected');
  }
  const r=expr();
  if(p!==T.length)throw new Error('tail');
  return r;
}
function evalAst(n,env){
  switch(n.t){
    case 'num':return n.v;
    case 'var':return env&&env[n.n]!==undefined?env[n.n]:NaN;
    case 'paren':return evalAst(n.e,env);
    case 'neg':return -evalAst(n.e,env);
    case 'add':return evalAst(n.l,env)+evalAst(n.r,env);
    case 'sub':return evalAst(n.l,env)-evalAst(n.r,env);
    case 'mul':return evalAst(n.l,env)*evalAst(n.r,env);
    case 'div':{const d=evalAst(n.r,env);return d===0?NaN:evalAst(n.l,env)/d;}
    case 'pow':{const v=evalAst(n.e,env);return v*v;}
    case 'sqrt':{const v=evalAst(n.e,env);return v<0?NaN:Math.sqrt(v);}
  }
  return NaN;
}
const strip=n=>{while(n.t==='paren')n=n.e;return n;};
const isIntNum=n=>n.t==='num'&&Number.isInteger(n.v)&&!/,/.test(n.s||'');
/* добуток із чисел, змінних і коренів: {ints,sq,vr} або null */
function prodInfo(n){
  n=strip(n);
  if(n.t==='num')return {ints:[n],sq:0,vr:0};
  if(n.t==='var')return {ints:[],sq:0,vr:1};
  if(n.t==='sqrt'){const a=strip(n.e);if(!isIntNum(a)||a.v<2||sqrtSimp(a.v).s!==1)return null;return {ints:[],sq:1,vr:0};}
  if(n.t==='mul'){const l=prodInfo(n.l),r=prodInfo(n.r);if(!l||!r)return null;return {ints:l.ints.concat(r.ints),sq:l.sq+r.sq,vr:l.vr+r.vr};}
  return null;
}
const prodOk=p=>!!p&&p.ints.length<=1&&p.sq<=1&&p.ints.every(isIntNum);
function divInfo(n){
  const den=strip(n.r);if(!isIntNum(den)||den.v<2)return null;
  const p=prodInfo(n.l);if(!prodOk(p))return null;
  const coef=p.ints.length?p.ints[0].v:1;
  if(gcd(coef,den.v)>1)return null;
  return {sq:p.sq};
}
/* остаточна форма: без дій між числами, корінь спрощений, дріб скорочений */
function isFinalForm(root){
  let s=strip(root);if(s.t==='neg')s=strip(s.e);
  if(s.t==='num')return true;
  const p=prodInfo(s);if(p)return prodOk(p);
  if(s.t==='div')return !!divInfo(s);
  if(s.t==='mul'){
    const L=strip(s.l),R=strip(s.r);
    const tryDiv=(D,O)=>{if(D.t!=='div')return false;const d=divInfo(D);const op=prodInfo(O);return !!(d&&op&&op.ints.length===0&&d.sq+op.sq<=1);};
    return tryDiv(L,R)||tryDiv(R,L);
  }
  return false;
}
function sampleEnvs(vars){
  if(!vars||!vars.length)return [{}];
  const base=[1.7,2.9,0.6,4.3,3.1];
  return base.map((b,i)=>{const e={};vars.forEach((v,j)=>{e[v]=b+0.37*j*(i+1);});return e;});
}
/* 1 — правильно й у кінцевій формі; 0,5 — значення правильне, але не спрощено; 0 — неправильно */
function gradeExpr(str,fn,vars){
  let ast;try{ast=parseExpr(str);}catch(e){return 0;}
  const envs=sampleEnvs(vars);
  for(const env of envs){
    const v=evalAst(ast,env),w=fn(env);
    if(!isFinite(v)||Math.abs(v-w)>1e-9*Math.max(1,Math.abs(w)))return 0;
  }
  return isFinalForm(ast)?1:0.5;
}
/* TeX для передпоказу */
function nodeTex(n,inFrac){
  switch(n.t){
    case 'num':return n.s.replace(',','{,}');
    case 'var':return n.n;
    case 'paren':return inFrac===true?nodeTex(n.e,true):'\\left('+nodeTex(n.e)+'\\right)';
    case 'neg':return '-'+nodeTex(n.e);
    case 'add':return nodeTex(n.l)+'+'+nodeTex(n.r);
    case 'sub':return nodeTex(n.l)+'-'+nodeTex(n.r);
    case 'mul':{const l=nodeTex(n.l),r=nodeTex(n.r);return l+(n.dot||(n.l.t==='num'&&n.r.t==='num')?'\\cdot ':'')+r;}
    case 'div':return '\\dfrac{'+nodeTex(n.l,true)+'}{'+nodeTex(n.r,true)+'}';
    case 'pow':{const b=strip(n.e);return (b.t==='num'||b.t==='var'||n.e.t==='paren')?nodeTex(n.e)+'^{2}':'\\left('+nodeTex(n.e)+'\\right)^{2}';}
    case 'sqrt':return '\\sqrt{'+nodeTex(n.e,true)+'}';
  }
  return '';
}
function exprToTex(str){
  str=String(str||'');
  if(!str.trim())return null;
  for(let extra=0;extra<4;extra++){
    try{return nodeTex(parseExpr(str+')'.repeat(extra)));}catch(e){}
  }
  return null;
}

/* ---- завдання ---- */
function CH(R,q,right,wrongs,exp,extra){
  const o=R.shuffle([{t:right.t,ok:true}].concat(wrongs.map(w=>({t:w.t,ok:false}))));
  return Object.assign({type:'choice',q,opts:o.map(x=>x.t),correct:o.findIndex(x=>x.ok),exp},extra||{});
}
function distinctWrongs(R,right,cands,n){
  const ok=[];
  R.shuffle(cands).forEach(c=>{
    if(Math.abs(c.v-right.v)<1e-9)return;
    if(ok.some(x=>Math.abs(x.v-c.v)<1e-9||x.t===c.t))return;
    ok.push(c);
  });
  return ok.length>=n?ok.slice(0,n):null;
}
const VARS=['a','b','k','m','n','p','y'];
const HINT='Корінь — кнопка √, дріб — кнопка /. Відповідь спростіть.';
const hintV=nm=>'Змінна — кнопка «'+nm+'», корінь — √, дріб — /. Відповідь спростіть.';
const mkNum=(v)=>({val:vVal(v),fn:()=>vVal(v),vars:[],ansTyped:vTyped(v),ansTex:vTex(v)});
const mkVar=(v,nm)=>({val:vVal(v),fn:e=>vVal(v)*e[nm],vars:[nm],ansTyped:vTyped(v,nm),ansTex:vTex(v,nm)});

/* 1. Катет за гіпотенузою й катетом (вибір) */
function g1(R){
  const k=R.int(1,4),m=R.pick([2,3,5,6,7]),a=R.pick([1,3,5,7,9]);
  const N2=4*k*k*m-a*a; if(N2<1)return null;
  const sp=sqrtSimp(N2);const v=vNorm(sp.s,sp.r,2);
  const right={t:'$'+vTex(v)+'$',v:vVal(v)};
  const mk=x=>{const y=vNorm(x.s,x.r,x.d);return {t:'$'+vTex(y)+'$',v:vVal(y)};};
  const N3=4*k*k*m+a*a,sp3=sqrtSimp(N3);
  const g=gcd(N2,4);
  const cands=[
    mk({s:sp.s,r:sp.r,d:1}),

  return CH(R,'У прямокутному трикутнику гіпотенуза дорівнює $'+hyp+'$, а один з катетів — $'+leg+'$. Чому дорівнює другий катет $b$?',right,w,exp,
    {fig:{kind:'right',h:leg,v:'b=?',c:hyp},ansTex:vTex(v),ansTyped:vTyped(v)});

const lcm=(a,b)=>a/gcd(a,b)*b;
const PAIRS=[];[2,3,4,5,6].forEach(x=>[2,3,4,5,6].forEach(y=>{if(x!==y&&lcm(x,y)<=15)PAIRS.push([x,y]);}));
const ODDP=[[3,5],[5,3],[3,7],[7,3],[3,9],[9,3]];
/* 2. Гіпотенуза, катети з різними знаменниками (введення) */
function g2(R){
  let a,k,m,d1,d2;
  do{const pr=R.pick(PAIRS);d1=pr[0];d2=pr[1];a=R.int(1,7);k=R.int(1,3);m=R.pick([2,3,5,6,7]);}while(gcd(a,d1)!==1||gcd(k,d2)!==1);
  const l=lcm(d1,d2),u=l/d1,w=l/d2,L=l*l;
  const N2=a*a*u*u+k*k*m*w*w,sp=sqrtSimp(N2);const v=vNorm(sp.s,sp.r,l);
  const L1='\\dfrac{'+a+'}{'+d1+'}',L2='\\dfrac{'+rootTex(k,m)+'}{'+d2+'}';
  const sw=R.f()<0.5;
  const exp='$c^2=\\left('+L1+'\\right)^2+\\left('+L2+'\\right)^2=\\dfrac{'+a*a+'}{'+d1*d1+'}+\\dfrac{'+k*k*m+'}{'+d2*d2+'}$. Спільний знаменник — $'+L+'$: $\\dfrac{'+a*a*u*u+'}{'+L+'}+\\dfrac{'+k*k*m*w*w+'}{'+L+'}=\\dfrac{'+N2+'}{'+L+'}$, тому $c=\\dfrac{\\sqrt{'+N2+'}}{'+l+'}='+vTex(v)+'$.';
  return Object.assign({type:'expr',q:'Катети прямокутного трикутника дорівнюють $'+L1+'$ і $'+L2+'$. Знайдіть гіпотенузу $c$.',
    fig:{kind:'right',h:sw?L2:L1,v:sw?L1:L2,c:'c=?'},exp,hint:HINT},mkNum(v));
}
/* 3. Висота рівнобедреного трикутника, основа — корінь (введення) */
function g3(R){
  let k,m,pp,q,N2;
  do{k=R.int(1,3);m=R.pick([2,3,5,6,7]);pp=R.int(1,3);q=R.pick([2,3,5,6,7]);N2=4*k*k*m-pp*pp*q;}while(N2<1);
  const sp=sqrtSimp(N2);const v=vNorm(sp.s,sp.r,2);
  const b=rootTex(k,m),base=rootTex(pp,q);
  const exp='Висота ділить основу навпіл: $h^2=\\left('+b+'\\right)^2-\\left(\\dfrac{'+base+'}{2}\\right)^2='+k*k*m+'-\\dfrac{'+pp*pp*q+'}{4}=\\dfrac{'+4*k*k*m+'}{4}-\\dfrac{'+pp*pp*q+'}{4}=\\dfrac{'+N2+'}{4}$, тому $h=\\dfrac{\\sqrt{'+N2+'}}{2}='+vTex(v)+'$.';
  return Object.assign({type:'expr',q:'У рівнобедреному трикутнику бічна сторона дорівнює $'+b+'$, а основа — $'+base+'$. Знайдіть висоту $h$, проведену до основи.',
    fig:{kind:'iso',b:b,base:base,h:'h=?'},exp,hint:HINT},mkNum(v));
}
/* 4. Висота рівностороннього трикутника зі стороною x (введення) */
function g4(R){
  const nm=R.pick(['abcd','mnkl','defg','pqrs'].map(x=>x.toUpperCase().split('')));
  const v=vNorm(1,3,2);
  const hn=nm[1]+nm[3],tri=nm[0]+nm[1]+nm[2];
  const exp='Висота $'+hn+'$ ділить сторону навпіл: $'+hn+'^2=x^2-\\left(\\dfrac{x}{2}\\right)^2=x^2-\\dfrac{x^2}{4}=\\dfrac{3x^2}{4}$, тому $'+hn+'='+vTex(v,'x')+'$.';
  return Object.assign({type:'expr',q:'У рівносторонньому трикутнику $'+tri+'$ сторона дорівнює $x$. Знайдіть висоту $'+hn+'$.',
    fig:{kind:'eq',a:'x',h:hn+'=?',n:nm},exp,hint:hintV('x')},mkVar(v,'x'));

/* 5. Гіпотенуза, катети зі змінною й різними знаменниками (введення) */
function g5(R){
  let nm,k,m,d1,d2;
  do{nm=R.pick(VARS);const pr=R.pick(PAIRS);d1=pr[0];d2=pr[1];k=R.int(1,3);m=R.pick([2,3,5,6,7]);}while(gcd(k,d2)!==1);
  const l=lcm(d1,d2),u=l/d1,w=l/d2,L=l*l;
  const N2=u*u+k*k*m*w*w,sp=sqrtSimp(N2);const v=vNorm(sp.s,sp.r,l);
  const L1='\\dfrac{'+nm+'}{'+d1+'}',L2='\\dfrac{'+(k===1?'':k)+nm+'\\sqrt{'+m+'}}{'+d2+'}';
  const sw=R.f()<0.5;
  const exp='$c^2=\\left('+L1+'\\right)^2+\\left('+L2+'\\right)^2=\\dfrac{'+nm+'^2}{'+d1*d1+'}+\\dfrac{'+k*k*m+nm+'^2}{'+d2*d2+'}$. Спільний знаменник — $'+L+'$: $\\dfrac{'+u*u+nm+'^2}{'+L+'}+\\dfrac{'+k*k*m*w*w+nm+'^2}{'+L+'}=\\dfrac{'+N2+nm+'^2}{'+L+'}$, тому $c=\\dfrac{\\sqrt{'+N2+'}\\,'+nm+'}{'+l+'}='+vTex(v,nm)+'$.';
  return Object.assign({type:'expr',q:'Катети прямокутного трикутника дорівнюють $'+L1+'$ і $'+L2+'$. Знайдіть гіпотенузу $c$.',
    fig:{kind:'right',h:sw?L2:L1,v:sw?L1:L2,c:'c=?'},exp,hint:hintV(nm)},mkVar(v,nm));
}
/* 6. Катет за гіпотенузою й катетом, знаменники непарні й різні (введення) */
function g6(R){
  let nm,n,j,d1,d2,N2,l,pn,pj;
  do{nm=R.pick(VARS);const pr=R.pick(ODDP);d1=pr[0];d2=pr[1];n=R.int(1,6);j=R.int(1,6);
    l=lcm(d1,d2);pn=n*l/d1;pj=j*l/d2;N2=pn*pn-pj*pj;}while(gcd(n,d1)!==1||gcd(j,d2)!==1||N2<1);

  const exp='$x^2=\\left('+hyp+'\\right)^2-\\left('+leg+'\\right)^2=\\dfrac{'+n*n+nm+'^2}{'+d1*d1+'}-\\dfrac{'+j*j+nm+'^2}{'+d2*d2+'}$. Спільний знаменник — $'+L+'$: $\\dfrac{'+pn*pn+nm+'^2}{'+L+'}-\\dfrac{'+pj*pj+nm+'^2}{'+L+'}=\\dfrac{'+N2+nm+'^2}{'+L+'}$, тому $x=\\dfrac{\\sqrt{'+N2+'}\\,'+nm+'}{'+l+'}='+vTex(v,nm)+'$.';
  return Object.assign({type:'expr',q:'У прямокутному трикутнику гіпотенуза дорівнює $'+hyp+'$, а один з катетів — $'+leg+'$. Знайдіть другий катет $x$.',
    fig:{kind:'right',h:leg,v:'x=?',c:hyp},exp,hint:hintV(nm)},mkVar(v,nm));
}

function validTask(t){

  if(t.type==='expr')return isFinite(t.val)&&gradeExpr(t.ansTyped,t.fn,t.vars)===1;
  return false;
}
function genTest(seed){
  const R=mkR(seed);const out=[];
  GENS.forEach((g,i)=>{let t=null;for(let tr=0;tr<80;tr++){t=g.fn(R);if(validTask(t))break;t=null;}
    if(!t)throw new Error('gen fail '+i);
    t.w=g.w;t.kind=g.k;t.id=i;out.push(t);});
  return out;
}
function markOf(t,a){

  if(t.type==='choice')return a!=null;

function bindTask(){
  const k=S.i,t=S.tasks[k];
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;renderTask();});
  document.getElementById('prev0').onclick=()=>{if(S.i>0){S.i--;renderTask();}};
  document.getElementById('next').onclick=()=>{if(S.i<S.tasks.length-1){S.i++;renderTask();}else{S.screen='review';render();}};
  if(t.type==='choice'){
    app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{S.ans[k]=+b.dataset.opt;renderTask();});
  }else{
    const inp=document.getElementById('numin');
    inp.addEventListener('input',()=>{
      const v=inp.value.replace(/-/g,'−').replace(/\*/g,'·').replace(/\./g,',').replace(/[:÷]/g,'/').replace(/\^2/g,'²').replace(/\s/g,'').replace(/[^0-9a-z,+−·\/()√²]/g,'').replace(/[a-z]/g,ch=>(t.vars||[]).indexOf(ch)>=0?ch:'').slice(0,40);
      setExpr(v);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('next').click();}});
    app.querySelectorAll('[data-key]').forEach(b=>{
      b.addEventListener('pointerdown',e=>e.preventDefault());
      b.addEventListener('click',()=>{
        let v=String(S.ans[k]||'');const key=b.dataset.key;
        if(key==='⌫')v=v.slice(0,-1);
        else if(key==='C')v='';
        else if(v.length<40)v+=key;
        setExpr(v);
      });
    });
  }
}
function refreshCells(){
  const c=app.querySelector('.cells'); if(!c)return;
  c.outerHTML=cellsHtml(S.screen==='task'?'task':'review');
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;S.screen='task';renderTask();});
}

function renderReview(){
  const miss=S.tasks.filter((t,k)=>!isAnswered(t,S.ans[k])).length;
  app.innerHTML=header()+'<div class="card scroll"><div class="qhead"><span>Перед здачею</span></div>'+cellsHtml('review')+
    '<div class="q">Відповіли на '+(S.tasks.length-miss)+' з '+S.tasks.length+'</div>'+
    (miss?'<div class="warn">Ви не завершили '+miss+' '+(miss===1?'завдання':(miss<5?'завдання':'завдань'))+'. Натисніть на номер, щоб повернутися до нього.</div>':'<div class="note">Ви майже закінчили! Перевірте відповіді й натисніть «Перевірити».</div>')+'</div>'+
    '<div class="nav"><button class="btn light" id="back" type="button">← Назад</button><button class="btn" id="chk" type="button">'+(miss?'Все одно перевірити':'Перевірити')+'</button></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;S.screen='task';render();});
  document.getElementById('back').onclick=()=>{S.i=S.tasks.length-1;S.screen='task';render();};
  document.getElementById('chk').onclick=check;
}

function ansText(t,a){
  if(t.type==='choice')return a==null?'':plain(t.opts[a]);
  return a==null?'':String(a);
}
function correctText(t){
  if(t.type==='choice')return plain(t.opts[t.correct]);
  return t.ansTyped;
}
function check(){
  awayOff(); S.done=true;
  const marks=S.tasks.map((t,k)=>markOf(t,S.ans[k]));
  const score=marks.reduce((s,m,k)=>s+m*S.tasks[k].w,0);
  const now=Date.now();
  const pct=Math.round(score*10)/10;
  S.res={tasks:marks,score:pct,percent:pct,right:marks.filter(m=>m===1).length};
  const dur=(now-S.t0)/1000;
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.surname.trim()+' '+S.first.trim(),surname:S.surname.trim(),firstName:S.first.trim(),
    ts:now,date:new Date(now).toISOString(),
    score:pct,max:100,percent:pct,tasks:marks,weights:S.tasks.map(t=>t.w),rightCount:S.res.right,
    qtext:S.tasks.map(t=>plain(t.q)),
    answers:S.tasks.map((t,k)=>ansText(t,S.ans[k])),
    correct:S.tasks.map(t=>correctText(t)),
    durationSec:Math.round(dur),leaves:S.leaves,awaySec:Math.round(S.awaySec),variant:S.seed,test:TEST_NAME_FB
  });
  S.screen='result'; render();
}

function cheerText(p){
  if(p>=90)return 'Чудова робота! Ви впевнено справляєтеся з коренями й дробами у теоремі Піфагора.';
  if(p>=70)return 'Дуже гарний результат! Ще трохи практики — і обчислення стануть автоматичними.';
  if(p>=45)return 'Гарний початок! Перегляньте розв’язки помилок — це найкоротший шлях до успіху.';
  return 'Тема непроста, але ви вже зробили крок уперед. Перегляньте розв’язки й спробуйте ще раз — з кожним разом вийде краще.';
}
function renderResult(){
  const r=S.res;
  app.innerHTML=header()+'<div class="card scroll center"><div style="font-weight:800;font-size:20px;margin-bottom:6px">'+esc(S.surname.trim()+' '+S.first.trim())+'</div>'+
    '<div class="big">'+fmtScore(r.score)+' з 100 балів</div><div class="big" style="font-size:clamp(26px,6vw,38px);margin-top:4px">'+fmtScore(r.percent)+' %</div>'+
    '<div class="cheer">'+cheerText(r.percent)+'</div>'+
    (S.leaves>=3?'<div class="soft">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: '+S.leaves+'), тому є підозра, що завдання виконано недоброчесно. Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>':'')+
    '<div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn light" id="err" type="button">Дивитись помилки</button><button class="btn" id="again" type="button">Пройти ще раз</button></div></div>'+FOOT;
  document.getElementById('again').onclick=()=>{begin();};
  document.getElementById('err').onclick=()=>{let f=S.res.tasks.findIndex(m=>m<1);S.ri=f<0?0:f;S.screen='errors';render();};
}
function renderErrors(){
  const k=S.ri,t=S.tasks[k],a=S.ans[k],m=S.res.tasks[k];
  let body='';
  if(t.fig)body+=figHtml(t.fig);
  if(t.type==='choice'){
    body+='<div class="opts">'+t.opts.map((o,j)=>'<div class="opt'+(j===t.correct?' right':(j===a?' wrong':''))+'"><span class="L">'+LET[j]+'</span><span>'+M(o)+'</span></div>').join('')+'</div>';
    if(a==null)body+='<div class="ans"><b class="no">Відповіді не було</b></div>';
  }else{
    const cls=m===1?'ok':(m===0.5?'hf':'no');
    body+='<div class="ans">Ваша відповідь: <b class="'+cls+'">'+(String(a||'').trim()?previewHtml(a):'—')+'</b></div>';
    if(m===0.5)body+='<div class="ans">Значення правильне, але відповідь не спрощено (скоротіть дріб і винесіть множник з-під кореня).</div>';
    if(m<1)body+='<div class="ans">Правильно: <b class="ok">'+kx(t.ansTex)+'</b></div>';
  }
  app.innerHTML=header()+cellsHtml('res')+'<div class="card scroll"><div class="qhead"><span>Завдання '+(k+1)+' з '+S.tasks.length+'</span><span class="badge">'+esc(t.kind)+' · '+fmtScore(m*t.w)+' з '+t.w+' б.</span></div><div class="q">'+M(t.q)+'</div>'+body+'<div class="exp">'+M(t.exp)+'</div></div>'+
    '<div class="nav"><button class="btn light" id="toRes" type="button">← До результату</button><div style="display:flex;gap:8px"><button class="btn light" id="p" type="button"'+(k===0?' disabled':'')+'>←</button><button class="btn" id="n" type="button"'+(k===S.tasks.length-1?' disabled':'')+'>→</button></div></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.ri=+b.dataset.go;renderErrors();});
  document.getElementById('toRes').onclick=()=>{S.screen='result';render();};
  document.getElementById('p').onclick=()=>{if(S.ri>0){S.ri--;renderErrors();}};
  document.getElementById('n').onclick=()=>{if(S.ri<S.tasks.length-1){S.ri++;renderErrors();}};
}

/* ========================= ЖУРНАЛ ВЧИТЕЛЯ ========================= */
const jr=document.getElementById('jr'),jrBox=document.getElementById('jrBox');
let jrRows=[],teacherOk=false,clearArm=false,clearMsg='';
function closeJr(){ jr.classList.remove('on'); if(teacherOk){teacherOk=false;teacherLogout();} }
document.getElementById('keyBtn').onclick=()=>{jr.classList.add('on');teacherOk?showTable():showLogin('');};
jr.addEventListener('click',e=>{if(e.target===jr)closeJr();});
function showLogin(msg){
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px;margin-bottom:8px">Журнал вчителя</div>'+
    '<label class="field"><span>Пароль</span><input id="jpw" type="password" autocomplete="off"></label>'+
    '<div class="hint">'+esc(msg)+'</div><div style="display:flex;gap:8px"><button class="btn" id="jin" type="button">Увійти</button><button class="btn light" id="jcl" type="button">Скасувати</button></div>';
  const pw=document.getElementById('jpw');
  const go=async()=>{ const ok=await teacherLogin(pw.value); if(ok){teacherOk=true;showTable();}else showLogin('Неправильний пароль'); };
  document.getElementById('jin').onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('jcl').onclick=closeJr;
  pw.focus();
}
async function showTable(){
  clearArm=false;
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+'</div><div class="tw" id="jtw">Завантаження…</div>';
  try{ jrRows=await loadResults(); }catch(e){ jrBox.innerHTML='<div class="hint">Не вдалося підключитися до бази результатів</div><button class="btn light" id="jcl" type="button">Закрити</button>'; document.getElementById('jcl').onclick=closeJr; return; }
  drawTable();
}
function drawTable(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||6;
  let h='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+' ('+jrRows.length+')</div>'+
    '<div class="tools"><button class="btn light" id="jup" type="button">Оновити</button><button class="btn light" id="jcsv" type="button">Завантажити CSV</button><button class="btn light" id="jclr" type="button">'+(clearArm?'Видалити всі записи ('+jrRows.length+')? Так, видалити':'Очистити')+'</button>'+(clearArm?'<button class="btn light" id="jno" type="button">Скасувати</button>':'')+'<button class="btn light" id="jcl" type="button">Закрити</button></div>'+(clearMsg?'<div class="hint">'+esc(clearMsg)+'</div>':'');
  h+='<div class="tw"><table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=N;i++)h+='<th>'+i+'</th>'; h+='</tr></thead><tbody>';
  jrRows.forEach((r,ri)=>{
    const d=new Date(r.ts||r.date||0); const ds=isNaN(d)?'—':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const fast=r.durationSec!=null&&r.durationSec<120, many=(r.leaves||0)>=3;
    const lv=r.leaves!=null?(r.leaves+(r.awaySec?' ('+fmtDur(r.awaySec)+')':'')):'—';
    h+='<tr><td>'+(ri+1)+'</td><td class="nm" data-d="'+ri+'">'+esc(r.name||'—')+'</td><td>'+ds+'</td><td class="'+(fast?'red':'')+'" title="'+(fast?'Дуже швидко':'')+'">'+(r.durationSec!=null?fmtDur(r.durationSec):'—')+'</td><td class="'+(many?'red':'')+'" title="Поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec):'—')+'">'+lv+'</td><td><b>'+(r.score!=null?fmtScore(r.score):'—')+'</b></td>';
    for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+=m===1?'<td class="o">✓</td>':m===0.5?'<td style="color:#f59e0b;font-weight:800">½</td>':m===0?'<td class="x">✗</td>':'<td>—</td>';}
    h+='</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+N)+'">'+detHtml(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  jrBox.innerHTML=h;
  jrBox.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{const e=document.getElementById('det'+c.dataset.d);e.style.display=e.style.display==='none'?'table-row':'none';});
  document.getElementById('jup').onclick=()=>{clearMsg='';showTable();};
  document.getElementById('jcl').onclick=closeJr;
  document.getElementById('jcsv').onclick=csv;
  const no=document.getElementById('jno'); if(no)no.onclick=()=>{clearArm=false;drawTable();};
  document.getElementById('jclr').onclick=async()=>{
    if(!clearArm){clearArm=true;clearMsg='';drawTable();return;}
    try{await clearResults();clearMsg='';}catch(e){clearMsg='Не вдалося очистити записи. Перевірте правила бази Firebase';clearArm=false;drawTable();return;}
    showTable();
  };
}
function detHtml(r){
  const q=r.qtext||[],a=r.answers||[],c=r.correct||[],t=r.tasks||[],w=r.weights||[];
  let h='<div style="margin-bottom:6px"><b>Оцінка: '+(r.score!=null?fmtScore(r.score):'—')+' з '+(r.max||100)+' балів ('+(r.percent!=null?fmtScore(r.percent):'—')+' %)</b>'+
    ' · Виходів: '+(r.leaves!=null?r.leaves:'—')+', поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec):'—')+' (усього '+(r.awaySec!=null?r.awaySec:'—')+' с)</div>';
  h+=t.map((m,i)=>{
    const pts=w[i]!=null?' <i>['+fmtScore(m*w[i])+' з '+w[i]+' б.]</i>':'';
    return '<div><b>'+(i+1)+'.</b> '+esc(q[i]||'')+' — відповідь: <b style="color:'+(m===1?'#16a34a':m===0.5?'#b45309':'#dc2626')+'">'+esc(a[i]===''?'—':(a[i]||'—'))+'</b>'+(m===1?'':' · правильно: <b>'+esc(c[i]||'')+'</b>')+pts+'</div>';
  }).join('');
  return h;
}
function csv(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||6;
  const head=['№','Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'].concat(Array.from({length:N},(_,i)=>'завд. '+(i+1)));
  const rows=jrRows.map((r,ri)=>{
    const d=new Date(r.ts||0);
    return [ri+1,r.name||'',isNaN(d)?'':d.toLocaleString('uk-UA'),r.durationSec!=null?fmtDur(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtDur(r.awaySec):'',r.score!=null?fmtScore(r.score):'']
      .concat(Array.from({length:N},(_,i)=>{const m=(r.tasks||[])[i];return m===1?'+':m===0.5?'0,5':m===0?'-':'';}));
  });
  const txt='\ufeff'+[head].concat(rows).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='Піфагор_корені_10клас_результати.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

render();
})();
</script>
</body>
</html>
