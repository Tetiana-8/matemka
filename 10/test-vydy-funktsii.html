<style>

.gopt.sel{border-color:var(--brand);background:var(--brandLight)}

<body>
<div id="app"></div>
<button id="keyBtn" type="button" title="">🔑</button>
<div id="jr"><div class="box" id="jrBox"></div></div>

<script>
(function(){ "use strict";

/* ========================= ГЕНЕРАТОР ЗАВДАНЬ ========================= */
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){
  const f=mulberry32(seed>>>0);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample:(arr,k)=>R.shuffle(arr).slice(0,k)};
  return R;
}
const LET=['А','Б','В','Г'];
const rt=(n,a)=>n===2?'\\sqrt{'+a+'}':'\\sqrt['+n+']{'+a+'}';

/* ---------- специфікації функцій ---------- */
function kx(k){return k===1?'x':k===-1?'-x':k+'x';}
function sgn(b){return b>0?'+'+b:b<0?'-'+(-b):'';}
function lin(k,b){return {fam:'A',f:x=>k*x+b,tex:'y='+kx(k)+sgn(b)};}
function prop(k){return {fam:'B',f:x=>k*x,tex:'y='+kx(k)};}
function cst(b){return {fam:'C',f:x=>b,tex:'y='+b};}
function hyp(k){return {fam:'D',f:x=>k/x,tex:'y='+(k<0?'-':'')+'\\dfrac{'+Math.abs(k)+'}{x}'};}
function par0(s,c){return {fam:'E',f:x=>s*x*x+c,tex:'y='+(s<0?'-':'')+'x^{2}'+sgn(c)};}
function parG(a,p,q){return {fam:'E',f:x=>a*(x-p)*(x-p)+q,tex:''};}
function absf(){return {fam:'ABS',f:x=>Math.abs(x),tex:'y=|x|'};}
const FAMS=['NE','NO','ZE','ZO','RE','RO'];
const EXPS={NE:[4,6],NO:[3,5,7],ZE:[2,4],ZO:[3,5],RE:[2,4],RO:[3,5]};
const SIB={NE:'NO',NO:'NE',ZE:'ZO',ZO:'ZE',RE:'RO',RO:'RE'};
function pw(fam,n){
  if(fam==='NE'||fam==='NO')return {fam,n,f:x=>Math.pow(x,n),tex:'y=x^{'+n+'}'};
  if(fam==='ZE'||fam==='ZO')return {fam,n,f:x=>Math.pow(x,-n),tex:'y=x^{-'+n+'}'};
  const odd=n%2===1;
  return {fam,n,f:x=>odd?Math.sign(x)*Math.pow(Math.abs(x),1/n):(x<0?NaN:Math.pow(x,1/n)),tex:'y='+rt(n,'x')};
}
const S5={x:[-5,5],y:[-5,5],tx:1,ty:1};
const WIN={
  NE:{x:[-2.5,2.5],y:[-2,10],tx:1,ty:2}, NO:{x:[-2.5,2.5],y:[-8,8],tx:1,ty:2},
  ZE:{x:[-3,3],y:[-1,7],tx:1,ty:1}, ZO:{x:[-3,3],y:[-4,4],tx:1,ty:1},
  RE:{x:[-2,10],y:[-2,4],tx:2,ty:1}, RO:{x:[-9,9],y:[-3,3],tx:3,ty:1},
  A:S5,B:S5,C:S5,D:S5,E:S5,ABS:S5
};

/* ---------- малювання графіка (SVG) ---------- */
let FIGID=0;
function f1(v){return (Math.round(v*10)/10).toFixed(1);}
function samples(sp,W){
  const out=[]; const poles=sp.fam==='ZE'||sp.fam==='ZO'||sp.fam==='D';
  const sides=[]; if(W.x[0]<0)sides.push([-1,-W.x[0]]); if(W.x[1]>0)sides.push([1,W.x[1]]);
  const N=500;
  sides.forEach(function(sd){
    const s=sd[0],L=sd[1]; let seg=[];
    for(let i=0;i<=N;i++){
      const u=i/N; const ax=poles?0.004*Math.pow(L/0.004,u):L*u*u;
      const x=s*ax, y=sp.f(x);
      if(isFinite(y))seg.push([x,y]); else if(seg.length){out.push(seg);seg=[];}
    }
    if(seg.length)out.push(seg);
  });
  return out;
}
function plot(sp,size,mini){
  const W=WIN[sp.fam], id='fg'+(++FIGID);
  const x0=W.x[0],x1=W.x[1],y0=W.y[0],y1=W.y[1];
  const X=x=>(x-x0)/(x1-x0)*size, Y=y=>size-(y-y0)/(y1-y0)*size;
  const ax=X(0), ay=Y(0), yr=y1-y0;
  let s='<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Графік функції"><defs><clipPath id="'+id+'"><rect x="1" y="1" width="'+(size-2)+'" height="'+(size-2)+'"/></clipPath></defs>';
  s+='<rect x="0.5" y="0.5" width="'+(size-1)+'" height="'+(size-1)+'" rx="10" fill="#fff" stroke="#d8c3f0"/>';
  const ln=(a,b,c,d,col,w)=>'<line x1="'+f1(a)+'" y1="'+f1(b)+'" x2="'+f1(c)+'" y2="'+f1(d)+'" stroke="'+col+'" stroke-width="'+w+'"/>';
  const xt=[],yt=[];
  for(let t=Math.ceil(x0/W.tx-1e-9)*W.tx;t<=x1+1e-9;t+=W.tx)if(Math.abs(t)>1e-9)xt.push(t);
  for(let t=Math.ceil(y0/W.ty-1e-9)*W.ty;t<=y1+1e-9;t+=W.ty)if(Math.abs(t)>1e-9)yt.push(t);
  xt.forEach(t=>{s+=ln(X(t),1,X(t),size-1,'#f0e8fa',1);});
  yt.forEach(t=>{s+=ln(1,Y(t),size-1,Y(t),'#f0e8fa',1);});
  s+=ln(1,ay,size-1,ay,'#3b2a4d',1.4)+ln(ax,1,ax,size-1,'#3b2a4d',1.4);
  s+='<polygon points="'+f1(size-1)+','+f1(ay)+' '+f1(size-9)+','+f1(ay-3.5)+' '+f1(size-9)+','+f1(ay+3.5)+'" fill="#3b2a4d"/>';
  s+='<polygon points="'+f1(ax)+',1 '+f1(ax-3.5)+',9 '+f1(ax+3.5)+',9" fill="#3b2a4d"/>';
  xt.forEach(t=>{s+=ln(X(t),ay-3,X(t),ay+3,'#3b2a4d',1.2);});
  yt.forEach(t=>{s+=ln(ax-3,Y(t),ax+3,Y(t),'#3b2a4d',1.2);});
  let d='';
  samples(sp,W).forEach(function(seg){
    seg.forEach(function(p,j){
      let py=Y(p[1]); if(py>size+yr*size*20)py=size+yr*size*20; if(py<-yr*size*20)py=-yr*size*20;
      d+=(j?'L':'M')+f1(X(p[0]))+' '+f1(py);
    });
  });
  s+='<g clip-path="url(#'+id+')"><path d="'+d+'" fill="none" stroke="#6B21A8" stroke-width="'+(mini?2.2:2.8)+'" stroke-linejoin="round" stroke-linecap="round"/></g>';
  const fs=mini?9:10, fmt=t=>String(t).replace('-','−');
  if(!mini){
    xt.forEach(t=>{const px=X(t); if(px>10&&px<size-10)s+='<text x="'+f1(px)+'" y="'+f1(ay+13)+'" font-size="'+fs+'" text-anchor="middle" fill="#6b5a80" font-family="Nunito,Arial,sans-serif">'+fmt(t)+'</text>';});
    yt.forEach(t=>{const py=Y(t); if(py>10&&py<size-8)s+='<text x="'+f1(ax-5)+'" y="'+f1(py+3.5)+'" font-size="'+fs+'" text-anchor="end" fill="#6b5a80" font-family="Nunito,Arial,sans-serif">'+fmt(t)+'</text>';});
    s+='<text x="'+f1(ax-5)+'" y="'+f1(ay+13)+'" font-size="'+fs+'" text-anchor="end" fill="#6b5a80" font-family="Nunito,Arial,sans-serif">0</text>';
  }
  s+='<text x="'+f1(size-12)+'" y="'+f1(ay-7)+'" font-size="13" font-style="italic" fill="#2b1a3d" font-family="Times New Roman,serif">x</text>';
  s+='<text x="'+f1(ax+9)+'" y="16" font-size="13" font-style="italic" fill="#2b1a3d" font-family="Times New Roman,serif">y</text>';
  return s+'</svg>';
}

/* ---------- допоміжне для завдань ---------- */
function CHS(R,q,right,wrongs,exp,extra){
  const norm=x=>(typeof x==='string'||x.alt!==undefined&&x.sp===undefined&&x.t===undefined)?{t:x}:x;
  const items=R.shuffle([Object.assign({ok:true},norm(right))].concat(wrongs.map(w=>Object.assign({ok:false},norm(w)))));
  const task={type:'choice',q,opts:items.map(x=>x.t),correct:items.findIndex(x=>x.ok),exp};
  if(items.some(x=>x.sp))task.specs=items.map(x=>x.sp);
  return Object.assign(task,extra||{});
}
const F$=sp=>'$'+sp.tex+'$';
const NZ3=[-3,-2,-1,1,2,3];
const FAMTXT={
  NE:'графік симетричний відносно осі $Oy$ (функція парна), вітки йдуть угору: степенева функція з парним натуральним показником',
  NO:'графік симетричний відносно початку координат (функція непарна), проходить через нього і зростає: степенева функція з непарним натуральним показником',
  ZE:'дві вітки над віссю $Ox$, симетричні відносно осі $Oy$: степенева функція з парним від’ємним показником',
  ZO:'дві вітки в I та III чвертях, симетричні відносно початку координат: степенева функція з непарним від’ємним показником',
  RE:'одна вітка, що починається в початку координат і існує лише при $x \\geqslant 0$: корінь парного степеня',
  RO:'графік існує при всіх $x$, симетричний відносно початку координат: корінь непарного степеня'
};

/* ---------- завдання ---------- */
function gG1(R){ // 1. графік -> вид функції
  const LAB={
    A:'лінійна функція $y=kx+b$, де $k \\ne 0$, $b \\ne 0$',
    B:'пряма пропорційність $y=kx$',
    C:'стала функція $y=b$',
    D:'обернена пропорційність $y=\\dfrac{k}{x}$',
    E:'квадратична функція $y=ax^2+bx+c$'
  };
  const EX={
    A:'Пряма, що не проходить через початок координат і не є горизонтальною, — графік лінійної функції $y=kx+b$.',
    B:'Пряма, що проходить через початок координат, — графік прямої пропорційності $y=kx$.',
    C:'Горизонтальна пряма — графік сталої функції $y=b$.',
    D:'Гіпербола з двома вітками — графік оберненої пропорційності $y=\\dfrac{k}{x}$.',
    E:'Парабола — графік квадратичної функції.'
  };
  const fam=R.pick(['A','B','C','D','E']); let sp,desc;
  if(fam==='A'){sp=lin(R.pick(NZ3),R.pick(NZ3));desc='пряма, що не проходить через початок координат, '+sp.tex;}
  else if(fam==='B'){sp=prop(R.pick(NZ3));desc='пряма через початок координат, '+sp.tex;}
  else if(fam==='C'){sp=cst(R.pick([-4,-3,-2,-1,1,2,3,4]));desc='горизонтальна пряма, '+sp.tex;}
  else if(fam==='D'){sp=hyp(R.pick([-4,-3,-2,-1,1,2,3,4]));desc='гіпербола, '+sp.tex;}

function polyTex(a,b,c){

/* ---------- базові точки ---------- */
function ptY(f,x){const y=f(x);return Math.abs(y*1024-Math.round(y*1024))<1e-6?Math.round(y*1024)/1024:y;}
function fmtNum(y){
  if(Number.isInteger(y))return String(y);
  const sg=y<0?'-':'';let a=Math.abs(y);
  for(let d=2;d<=1024;d*=2){if(Math.abs(a*d-Math.round(a*d))<1e-9)return sg+'\\dfrac{'+Math.round(a*d)+'}{'+d+'}';}
  return String(y);
}
const ptTex=p=>'('+p[0]+';'+fmtNum(p[1])+')';
function basePts(sp){
  const n=sp.n,f=sp.f;
  const xs={NE:[-1,0,1],NO:[-1,0,1],ZE:[-1,1,2],ZO:[-1,1,2],RE:[0,1,Math.pow(2,n)],RO:[-Math.pow(2,n),0,Math.pow(2,n)]}[sp.fam];
  return xs.map(x=>[x,ptY(f,x)]);
}
const onG=(sp,p)=>{const y=sp.f(p[0]);return isFinite(y)&&Math.abs(y-p[1])<1e-6*(1+Math.abs(p[1]));};
function gPts(R){ // 6. через які точки проходить графік
  const fam=R.pick(FAMS),g=pw(fam,R.pick(EXPS[fam])),own=basePts(g);
  const cand=R.shuffle(FAMS.filter(f=>f!==fam)).map(f=>basePts(pw(f,R.pick(EXPS[f])))).filter(ps=>!ps.every(p=>onG(g,p)));
  const txt=ps=>'$'+ps.map(ptTex).join(',\\ ')+'$';
  const seen=new Set([txt(own)]),wr=[];
  cand.forEach(ps=>{if(wr.length<3&&!seen.has(txt(ps))){seen.add(txt(ps));wr.push({t:txt(ps),sp:ps});}});
  const t=CHS(R,'Через які точки проходить графік зображеної функції?',{t:txt(own),sp:own},wr,
    'Це графік функції $'+g.tex+'$. Він проходить через точки '+txt(own)+'. Інші набори містять точку, яка графіку не належить.',
    {fig:plot(g,280),desc:'Рисунок: графік '+g.tex});
  t.pv={g:g};

}

function gMatchP(R){ // 7. відповідність: точка <-> графік

    ()=>({sp:lin(R.pick(NZ3),R.pick(NZ3)),a:'n'}),()=>({sp:prop(R.pick(NZ3)),a:'o'}),
    ()=>({sp:hyp(R.pick([-4,-3,-2,-1,1,2,3,4])),a:'o'}),()=>({sp:cst(R.pick([-4,-3,-2,-1,1,2,3,4])),a:'e'})
  ];
  const it=R.pick(c)();
  const L={e:'функція парна',o:'функція непарна',n:'функція ні парна, ні непарна'};

/* властивості степеневих функцій */
const IV={R:'$\\mathbb{R}$',R0:'$(-\\infty;0)\\cup(0;+\\infty)$',P0:'$[0;+\\infty)$',P:'$(0;+\\infty)$'};
const PR={
  NE:{D:'R',E:'P0',par:'e',orig:true,q:'I та II'},
  NO:{D:'R',E:'R',par:'o',orig:true,q:'I та III'},
  ZE:{D:'R0',E:'P',par:'e',orig:false,q:'I та II'},
  ZO:{D:'R0',E:'R0',par:'o',orig:false,q:'I та III'},
  RE:{D:'P0',E:'P0',par:'n',orig:true,q:'I'},
  RO:{D:'R',E:'R',par:'o',orig:true,q:'I та III'}
};
function propsText(sp){
  const P=PR[sp.fam];
  return 'Для функції $'+sp.tex+'$: область визначення — '+IV[P.D]+', область значень — '+IV[P.E]+', '+
    (P.par==='e'?'функція парна':P.par==='o'?'функція непарна':'функція ні парна, ні непарна')+
    ', графік '+(P.orig?'проходить':'не проходить')+' через початок координат і розташований у '+P.q+(P.q==='I'?' чверті':' чвертях')+'.';
}
function gDomain(R){ // 13
  const fam=R.pick(FAMS), sp=pw(fam,R.pick(EXPS[fam])), P=PR[fam];
  const keys=['R','R0','P0','P'];
  return CHS(R,'Укажіть область визначення функції $'+sp.tex+'$.',IV[P.D],keys.filter(k=>k!==P.D).map(k=>IV[k]),propsText(sp),{});
}
function gRange(R){ // 14
  const fam=R.pick(FAMS), sp=pw(fam,R.pick(EXPS[fam])), P=PR[fam];
  const keys=['R','R0','P0','P'];
  return CHS(R,'Укажіть область значень функції $'+sp.tex+'$.',IV[P.E],keys.filter(k=>k!==P.E).map(k=>IV[k]),propsText(sp),{});
}
function gG8(R){ // 15. який рисунок
  const CONF={D:['ZO'],ZO:['D'],E:['NE'],NE:['E']};
  const all=['A','B','C','D','E'].concat(FAMS);
  const mk=function(fam){
    if(fam==='A')return lin(R.pick(NZ3),R.pick(NZ3));
    if(fam==='B')return prop(R.pick(NZ3));
    if(fam==='C')return cst(R.pick([-4,-3,-2,-1,1,2,3,4]));
    if(fam==='D')return hyp(R.pick([-4,-3,-2,-1,1,2,3,4]));
    if(fam==='E')return par0(R.pick([1,-1]),R.pick(NZ3));
    return pw(fam,R.pick(EXPS[fam]));
  };
  const fam=R.pick(all), g=mk(fam);
  const pool=all.filter(f=>f!==fam&&!(CONF[fam]||[]).includes(f));
  const wr=R.sample(pool,3).map(f=>{const s=mk(f);return {t:{alt:s.tex,svg:plot(s,150,true)},sp:s};});
  const t=CHS(R,'Який із рисунків є графіком функції $'+g.tex+'$?',{t:{alt:g.tex,svg:plot(g,150,true)},sp:g},wr,
    'Для функції $'+g.tex+'$ потрібен графік такого виду: '+(FAMTXT[fam]||({A:'пряма, що не проходить через початок координат',B:'пряма через початок координат',C:'горизонтальна пряма',D:'гіпербола з вітками в I та III чвертях, якщо $k>0$, і в II та IV, якщо $k<0$',E:'парабола'})[fam])+'.',
    {gopts:true,desc:'Чотири рисунки, потрібна функція '+g.tex});
  t.v={g:g};
  return t;
}
function gYN(R){ // 16. Так / Ні
  const fam=R.pick(FAMS), sp=pw(fam,R.pick(EXPS[fam])), P=PR[fam];
  const keys=['R','R0','P0','P'];
  const types=R.sample(['par','D','E','orig','quart'],3);
  const items=types.map(function(ty){
    if(ty==='par'){const ev=R.f()<0.5;return {t:'функція '+(ev?'парна':'непарна'),ok:P.par===(ev?'e':'o')};}
    if(ty==='D'){const tr=R.f()<0.5;const k=tr?P.D:R.pick(keys.filter(x=>x!==P.D));return {t:'область визначення — '+IV[k],ok:tr};}
    if(ty==='E'){const tr=R.f()<0.5;const k=tr?P.E:R.pick(keys.filter(x=>x!==P.E));return {t:'область значень — '+IV[k],ok:tr};}
    if(ty==='orig'){const w=R.f()<0.5;return {t:'графік '+(w?'проходить':'не проходить')+' через початок координат',ok:P.orig===w};}
    const qs=['I','I та II','I та III'];const tr=R.f()<0.5;const q=tr?P.q:R.pick(qs.filter(x=>x!==P.q));
    return {t:'графік розташований у '+q+(q==='I'?' чверті':' чвертях'),ok:tr};
  });
  return {type:'yn',q:'Чи правильне твердження про функцію $'+sp.tex+'$?',items,exp:propsText(sp)};
}

const GENS=[
 {k:'Графік → вид функції',fn:gG1},

 {k:'Парність',fn:gParity},
 {k:'Графік → формула',fn:gGF(['NE','NO'])},
 {k:'Графік → формула',fn:gGF(['ZE','ZO'])},
 {k:'Графік → формула',fn:gGF(['RE','RO'])},

 {k:'Область визначення',fn:gDomain},

 {k:'Формула → графік',fn:gG8},
 {k:'Так чи ні',fn:gYN}

function sameFn(a,b){
  const xs=[-4.3,-2.7,-1.6,-0.8,0.7,1.3,2.2,3.9,6.1];let n=0;
  for(const x of xs){const u=a.f(x),v=b.f(x);if(isFinite(u)&&isFinite(v)){n++;if(Math.abs(u-v)>1e-9*(1+Math.abs(u)))return false;}else if(isFinite(u)!==isFinite(v))return false;}
  return n>=3;
}
function validTask(t){
  if(t.type==='choice'){
    const keys=t.opts.map(o=>typeof o==='string'?o:o.alt);
    if(new Set(keys).size!==keys.length||t.correct<0||t.correct>=t.opts.length||t.opts.length<3)return false;
    if(t.pv){
      const ok=t.specs.map(ps=>ps.every(p=>onG(t.pv.g,p)));
      if(ok.filter(Boolean).length!==1||!ok[t.correct])return false;
    }
    if(t.v){
      const m=t.specs.map((s,i)=>sameFn(t.v.g,s)?i:-1).filter(i=>i>=0);
      if(m.length!==1||m[0]!==t.correct)return false;
    }
    return true;
  }
  if(t.type==='yn'){const s=new Set(t.items.map(x=>x.t));return s.size===t.items.length&&t.items.some(x=>x.ok)&&t.items.some(x=>!x.ok);}
  if(t.type==='match'){
    if(t.rows.length!==4||t.figs.length!==4)return false;
    if(t.pts){
      return t.rows.every((r,i)=>t.gspecs.every((g,j)=>onG(g,t.pts[i])===(j===r.ok)))&&new Set(t.rows.map(r=>r.ok)).size===4;
    }
    if(t.rspecs){ // кожен рядок збігається рівно з одним графіком — тим, що вказано
      return t.rows.every((r,i)=>{const m=t.gspecs.map((g,j)=>sameFn(g,t.rspecs[i])?j:-1).filter(j=>j>=0);return m.length===1&&m[0]===r.ok;})
        && new Set(t.rows.map(r=>r.ok)).size===4;
    }
    return true;
  }
  return false;
}
function genTest(seed){
  const R=mkR(seed); const out=[];
  GENS.forEach((g,i)=>{let t=null;for(let tr=0;tr<60;tr++){t=g.fn(R);if(validTask(t))break;}
    t.w=1;t.kind=g.k;t.id=i;out.push(t);});
  return out;
}
function isRight(t,a){
  if(t.type==='choice')return a===t.correct;
  if(t.type==='yn')return Array.isArray(a)&&t.items.every((it,k)=>a[k]===it.ok);
  if(t.type==='match')return Array.isArray(a)&&t.rows.every((r,k)=>a[k]===r.ok);
  return false;
}
function isAnswered(t,a){
  if(t.type==='match')return Array.isArray(a)&&a.length===t.rows.length&&a.every(x=>x!=null);
  if(t.type==='choice')return a!=null;
  if(t.type==='yn')return Array.isArray(a)&&a.length===t.items.length&&a.every(x=>x===true||x===false);
  return false;
}

  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;renderTask();});
  document.getElementById('prev').onclick=()=>{if(S.i>0){S.i--;renderTask();}};
  document.getElementById('next').onclick=()=>{if(S.i<S.tasks.length-1){S.i++;renderTask();}else{S.screen='review';render();}};
  if(t.type==='choice'){
    app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{S.ans[k]=+b.dataset.opt;const sc=document.getElementById('sc').scrollTop;renderTask();document.getElementById('sc').scrollTop=sc;});
  }else if(t.type==='match'){
    app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.ans[k][+b.dataset.m]=+b.dataset.v;const sc=document.getElementById('sc').scrollTop;renderTask();document.getElementById('sc').scrollTop=sc;});
  }else{
    app.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{S.ans[k][+b.dataset.yn]=b.dataset.v==='1';renderTask();});
  }
}
document.addEventListener('keydown',function(e){
  if(S.screen!=='task'||/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||''))return;
  if(e.key==='ArrowRight'){const n=document.getElementById('next');if(n)n.click();}
  else if(e.key==='ArrowLeft'){const p=document.getElementById('prev');if(p&&!p.disabled)p.click();}
});

function renderReview(){
  const miss=S.tasks.filter((t,k)=>!isAnswered(t,S.ans[k])).length;
  app.innerHTML=header()+'<div class="card scroll"><div class="qhead"><span>Перед здачею</span></div>'+cellsHtml('review')+
    '<div class="q">Відповіли на '+(S.tasks.length-miss)+' з '+S.tasks.length+'</div>'+
    (miss?'<div class="warn">Ви не завершили '+miss+' '+(miss===1?'завдання':(miss<5?'завдання':'завдань'))+'. Натисніть на номер, щоб до нього повернутися.</div>':'')+'</div>'+
    '<div class="nav"><button class="btn light" id="back" type="button">← Назад</button><button class="btn" id="chk" type="button">'+(miss?'Все одно перевірити':'Перевірити')+'</button></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;S.screen='task';render();});
  document.getElementById('back').onclick=()=>{S.i=S.tasks.length-1;S.screen='task';render();};
  document.getElementById('chk').onclick=check;
}

function ansText(t,a){
  if(t.type==='choice')return a==null?'':(t.gopts?LET[a]+' ('+plain('$'+t.opts[a].alt+'$')+')':plain(t.opts[a]));
  if(t.type==='match')return t.rows.map((r,i)=>plain(r.t)+' → '+(a[i]==null?'—':t.clab[a[i]])).join(' | ');
  return t.items.map((it,j)=>a[j]===true?'Так':a[j]===false?'Ні':'—').join(' | ');
}
function correctText(t){
  if(t.type==='match')return t.rows.map(r=>plain(r.t)+' → '+t.clab[r.ok]).join(' | ');
  if(t.type==='choice')return t.gopts?LET[t.correct]+' ('+plain('$'+t.opts[t.correct].alt+'$')+')':plain(t.opts[t.correct]);
  return t.items.map(it=>it.ok?'Так':'Ні').join(' | ');
}
function check(){
  const now=Date.now();
  back();
  S.done=true;
  const marks=S.tasks.map((t,k)=>isRight(t,S.ans[k])?1:0);
  const score=marks.reduce((s,m)=>s+m,0);
  S.res={tasks:marks,score,leaves:W.leaves};
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.surname.trim()+' '+S.first.trim(),surname:S.surname.trim(),firstName:S.first.trim(),
    ts:now,date:new Date(now).toISOString(),
    score,max:S.tasks.length,tasks:marks,
    qtext:S.tasks.map(t=>plain(t.q)+(t.type==='yn'?': '+t.items.map(it=>plain(it.t)).join('; '):'')+(t.type==='match'&&t.legend?' ('+t.legend.map(plain).join('; ')+')':'')+(t.desc?' ['+t.desc+']':'')),
    answers:S.tasks.map((t,k)=>ansText(t,S.ans[k])),
    correct:S.tasks.map(t=>correctText(t)),
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,variant:S.seed,test:TEST_NAME
  });
  S.screen='result'; render();
}

function renderResult(){
  const r=S.res;
  app.innerHTML=header()+'<div class="card scroll center"><div style="font-weight:800;font-size:20px;margin-bottom:6px">'+esc(S.surname.trim()+' '+S.first.trim())+'</div>'+
    '<div class="big">'+r.score+' з '+S.tasks.length+'</div>'+
    (r.leaves>=3?'<div class="soft">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: '+r.leaves+'), тому є підозра, що завдання виконано недоброчесно.<br>Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>':'')+
    '<div style="margin:12px 0 4px;font-size:14px;color:#6b5a80">Натисніть на номер, щоб переглянути завдання</div>'+cellsHtml('res')+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"><button class="btn light" id="err" type="button">Дивитись завдання</button><button class="btn" id="again" type="button">Пройти ще раз</button></div></div>'+FOOT;
  document.getElementById('again').onclick=()=>{begin();};
  document.getElementById('err').onclick=()=>{const f=S.res.tasks.findIndex(m=>!m);S.ri=f<0?0:f;S.screen='errors';render();};
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.ri=+b.dataset.go;S.screen='errors';render();});
}
function renderErrors(){
  const k=S.ri,t=S.tasks[k],a=S.ans[k],ok=S.res.tasks[k]===1;
  let body='';
  if(t.type==='match'){
    body=matchHtml(t,k,'err');
  }else if(t.type==='choice'){
    body=optsHtml(t,k,null,'err');
    if(a==null)body+='<div style="margin-top:8px;font-weight:700;color:#dc2626">Відповіді не було</div>';
  }else{
    body=t.items.map((it,j)=>{const g=a[j]===it.ok;return '<div class="yn" style="border-color:'+(g?'#16a34a':'#dc2626')+'"><div class="t">'+M(it.t)+'</div><div class="b"><b>'+(a[j]===true?'Так':a[j]===false?'Ні':'—')+'</b>'+(g?'':' <span style="color:#16a34a;font-weight:800">→ '+(it.ok?'Так':'Ні')+'</span>')+'</div></div>';}).join('');
  }
  app.innerHTML=header()+cellsHtml('err')+'<div class="card scroll"><div class="qhead"><span>Завдання '+(k+1)+' з '+S.tasks.length+' '+(ok?'✓':'✗')+'</span><span class="badge">'+esc(t.kind)+'</span></div><div class="q">'+M(t.q)+'</div>'+(t.fig?'<div class="fig">'+t.fig+'</div>':'')+body+'<div class="exp">'+M(t.exp)+'</div></div>'+
    '<div class="nav"><button class="btn light" id="toRes" type="button">← До результату</button><div style="display:flex;gap:8px"><button class="btn light" id="p" type="button"'+(k===0?' disabled':'')+'>←</button><button class="btn" id="n" type="button"'+(k===S.tasks.length-1?' disabled':'')+'>→</button></div></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.ri=+b.dataset.go;renderErrors();});
  document.getElementById('toRes').onclick=()=>{S.screen='result';render();};
  document.getElementById('p').onclick=()=>{if(S.ri>0){S.ri--;renderErrors();}};
  document.getElementById('n').onclick=()=>{if(S.ri<S.tasks.length-1){S.ri++;renderErrors();}};
}

/* ========================= ЖУРНАЛ ВЧИТЕЛЯ ========================= */
const jr=document.getElementById('jr'),jrBox=document.getElementById('jrBox');
let jrRows=[],teacherOk=false,clearArm=false;
function closeJr(){ jr.classList.remove('on'); if(teacherOk){teacherOk=false;teacherLogout();} }
document.getElementById('keyBtn').onclick=()=>{jr.classList.add('on');teacherOk?showTable():showLogin('');};
jr.addEventListener('click',e=>{if(e.target===jr)closeJr();});
function showLogin(msg){
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px;margin-bottom:8px">Пароль</div>'+
    '<label class="field"><input id="jpw" type="password" autocomplete="off"></label>'+
    '<div class="hint">'+esc(msg)+'</div><div style="display:flex;gap:8px"><button class="btn" id="jin" type="button">Увійти</button><button class="btn light" id="jcl" type="button">Скасувати</button></div>';
  const pw=document.getElementById('jpw');
  const go=async()=>{ const ok=await teacherLogin(pw.value); if(ok){teacherOk=true;showTable();}else showLogin('Неправильний пароль'); };
  document.getElementById('jin').onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('jcl').onclick=()=>jr.classList.remove('on');
  pw.focus();
}
async function showTable(){
  clearArm=false;
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+'</div><div class="tw" id="jtw">Завантаження…</div>';
  try{ jrRows=await loadResults(); }catch(e){ jrBox.innerHTML='<div class="hint">Не вдалося підключитися до бази результатів</div><button class="btn light" id="jcl" type="button">Закрити</button>'; document.getElementById('jcl').onclick=closeJr; return; }
  drawTable();
}
let jrMsg='';
function drawTable(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||S.tasks.length||16;
  let h='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+' ('+jrRows.length+')</div>'+
    '<div class="tools"><button class="btn light" id="jup" type="button">Оновити</button><button class="btn light" id="jcsv" type="button">Завантажити CSV</button>'+
    (clearArm?'<span style="align-self:center;font-weight:700">Видалити всі записи ('+jrRows.length+')?</span><button class="btn" id="jyes" type="button">Так, видалити</button><button class="btn light" id="jno" type="button">Скасувати</button>':'<button class="btn light" id="jclr" type="button">Очистити</button>')+
    '<button class="btn light" id="jcl" type="button">Закрити</button></div>'+(jrMsg?'<div class="hint">'+esc(jrMsg)+'</div>':'');
  h+='<div class="tw"><table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=N;i++)h+='<th>'+i+'</th>'; h+='</tr></thead><tbody>';
  jrRows.forEach((r,ri)=>{
    const d=new Date(r.ts||r.date||0); const ds=isNaN(d)?'—':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const fast=r.durationSec!=null&&r.durationSec<120, many=(r.leaves||0)>=3;
    h+='<tr><td>'+(ri+1)+'</td><td class="nm" data-d="'+ri+'">'+esc(r.name||'—')+'</td><td>'+ds+'</td><td class="'+(fast?'red':'')+'" title="'+(fast?'Дуже швидко':'')+'">'+(r.durationSec!=null?fmtDur(r.durationSec):'—')+'</td><td class="'+(many?'red':'')+'" title="'+(r.awaySec!=null?'Поза вікном: '+r.awaySec+' с':'')+'">'+(r.leaves!=null?r.leaves:'—')+'</td><td><b>'+(r.score!=null?String(r.score).replace('.',','):'—')+'</b></td>';
    for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+=m===1?'<td class="o">✓</td>':m===0.5?'<td style="color:#f59e0b;font-weight:800">½</td>':m===0?'<td class="x">✗</td>':'<td>—</td>';}
    h+='</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+N)+'">'+detHtml(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  jrBox.innerHTML=h;
  jrBox.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{const e=document.getElementById('det'+c.dataset.d);e.style.display=e.style.display==='none'?'table-row':'none';});
  document.getElementById('jup').onclick=()=>{jrMsg='';showTable();};
  document.getElementById('jcl').onclick=closeJr;
  document.getElementById('jcsv').onclick=csv;
  const clr=document.getElementById('jclr'); if(clr)clr.onclick=()=>{clearArm=true;jrMsg='';drawTable();};
  const no=document.getElementById('jno'); if(no)no.onclick=()=>{clearArm=false;drawTable();};
  const yes=document.getElementById('jyes'); if(yes)yes.onclick=async()=>{
    try{await clearResults();jrMsg='';}catch(e){jrMsg='Не вдалося очистити записи. Перевірте правила бази Firebase';}
    showTable();
  };
}
function detHtml(r){
  const q=r.qtext||[],a=r.answers||[],c=r.correct||[],t=r.tasks||[];
  const ex=(r.leaves!=null?'<div style="margin-bottom:4px"><b>Виходів: '+r.leaves+'</b>, поза вікном: '+(r.awaySec||0)+' с</div>':'');
  return ex+t.map((m,i)=>'<div><b>'+(i+1)+'.</b> '+esc(q[i]||'')+' — відповідь: <b style="color:'+(m?'#16a34a':'#dc2626')+'">'+esc(a[i]===''?'—':(a[i]||'—'))+'</b>'+(m?'':' · правильно: <b>'+esc(c[i]||'')+'</b>')+'</div>').join('');
}
function csv(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||16;
  const head=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'].concat(Array.from({length:N},(_,i)=>'завд. '+(i+1)));
  const rows=jrRows.map(r=>{
    const d=new Date(r.ts||0);
    return [r.name||'',isNaN(d)?'':d.toLocaleString('uk-UA'),r.durationSec!=null?fmtDur(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtDur(r.awaySec):'',r.score!=null?String(r.score).replace('.',','):'']
      .concat(Array.from({length:N},(_,i)=>{const m=(r.tasks||[])[i];return m===1?'+':m===0.5?'0,5':m===0?'-':'';}));
  });
  const txt='﻿'+[head].concat(rows).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='Види_функцій_10клас_результати.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

render();
})();
</script>
</body>
</html>
