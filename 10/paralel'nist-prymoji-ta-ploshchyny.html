<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext } = React;

/* ---------- векторна алгебра ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.sqrt(dot(a,a));
const lerp=(a,b,t)=>add(mul(a,1-t),mul(b,t));
const mid=(a,b)=>lerp(a,b,.5);
const cen=arr=>mul(arr.reduce(add,[0,0,0]),1/arr.length);
const nrm=a=>{const l=len(a)||1;return mul(a,1/l);};
const rad=d=>d*Math.PI/180;
const fmt=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const L=id=>String(id).replace(/1$/,'₁');
const rectPlane=(Cn,e1,e2,hw,hh)=>[
  add(Cn,add(mul(e1,hw),mul(e2,hh))),add(Cn,add(mul(e1,-hw),mul(e2,hh))),
  add(Cn,add(mul(e1,-hw),mul(e2,-hh))),add(Cn,add(mul(e1,hw),mul(e2,-hh)))];
const planeThrough=(P1,P2,P3,hw,hh)=>{
  const e1=nrm(sub(P2,P1));const n=cross(sub(P2,P1),sub(P3,P1));const e2=nrm(cross(n,e1));
  return rectPlane(cen([P1,P2,P3]),e1,e2,hw,hh);};

/* взаємне розміщення прямої та площини */
function relLinePlane(a1,a2,Q1,Q2,Q3){
  const n=cross(sub(Q2,Q1),sub(Q3,Q1)),d=sub(a2,a1);
  if(Math.abs(dot(d,n))>1e-9) return 'int';
  return Math.abs(dot(sub(a1,Q1),n))<1e-9?'in':'par';
}

/* ---------- кольори ---------- */
const C={edge:'#334155',ink:'#0f172a',par:'#16a34a',int:'#7e22ce',skew:'#dc2626',inn:'#2563eb',
  al:'#2563eb',be:'#ea580c',ga:'#7e22ce',gold:'#d97706',proj:'#ea580c',teal:'#0d9488',halo:'#FAF5FF'};

/* ---------- будівельники фігур ---------- */
const boxP=(hx,hy,hz)=>({
  A:[-hx,-hy,-hz],B:[hx,-hy,-hz],C:[hx,hy,-hz],D:[-hx,hy,-hz],
  A1:[-hx,-hy,hz],B1:[hx,-hy,hz],C1:[hx,hy,hz],D1:[-hx,hy,hz]});
const BOXF=[['A','B','C','D'],['A1','B1','C1','D1'],['A','B','B1','A1'],['B','C','C1','B1'],['C','D','D1','C1'],['D','A','A1','D1']];
const BOXE=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
const TETF=[['A','B','C'],['D','A','B'],['D','B','C'],['D','C','A']];
const plane=(p,color,op=.14,sw=1.6)=>({t:'poly',p,fill:color,op,stroke:color,sw});
const vp=(ids,c)=>ids.map(id=>({t:'pt',id,c:c||C.ink}));
const CUBE=boxP(1,1,1);
const FN=['ABCD','A₁B₁C₁D₁','ABB₁A₁','BCC₁B₁','CDD₁C₁','DAA₁D₁'];
const bigFace=(P,f,k=1.4)=>{const pts=BOXF[f].map(id=>P[id]);const c=cen(pts);return pts.map(p=>add(c,mul(sub(p,c),k)));};
const relEF=(P,e,f)=>{const q=BOXF[f].slice(0,3).map(id=>P[id]);return relLinePlane(P[e[0]],P[e[1]],q[0],q[1],q[2]);};

/* ---------- 3D-сцена (SVG, обертання мишею/пальцем) ---------- */
function Scene3D({scene,yaw0=0.7,pitch0=0.42,auto0=false,bare=false,legend=null}){
  const wrap=useRef(null);
  const [sz,setSz]=useState({w:600,h:500});
  const [cam,setCam]=useState({yaw:yaw0,pitch:pitch0});
  const [auto,setAuto]=useState(auto0);
  const drag=useRef(null),moved=useRef(false);

  useEffect(()=>{
    const el=wrap.current;
    const upd=()=>setSz({w:el.clientWidth||600,h:el.clientHeight||500});
    const ro=new ResizeObserver(upd);ro.observe(el);upd();
    return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    if(!auto)return;let raf,last=performance.now();
    const tick=t=>{const dt=t-last;last=t;
      if(!drag.current)setCam(c=>({...c,yaw:c.yaw+dt*0.0005}));
      raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[auto]);

  const onDown=e=>{drag.current={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,id:e.pointerId};moved.current=false;};
  const onMove=e=>{
    const d=drag.current;if(!d)return;
    if(!moved.current){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5)return;
      moved.current=true;
      try{e.currentTarget.setPointerCapture(d.id);}catch(_){}
    }
    const dx=e.clientX-d.px,dy=e.clientY-d.py;d.px=e.clientX;d.py=e.clientY;
    setCam(c=>({yaw:c.yaw+dx*0.0085,pitch:Math.max(-1.25,Math.min(1.45,c.pitch+dy*0.0085))}));
  };
  const onUp=()=>{drag.current=null;setTimeout(()=>{moved.current=false;},0);};

  const {w,h}=sz;
  const R=scene.R||2.8,ctr=scene.ctr||[0,0,0],P=scene.P||{};
  const D=R*5.5,S=Math.min(w,h)/(2*R)*0.97;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const tfv=v=>{const x1=v[0]*cy-v[1]*sy,y1=v[0]*sy+v[1]*cy;return[x1,y1*sp+v[2]*cp,y1*cp-v[2]*sp];};
  const tf=p=>tfv(sub(p,ctr));
  const pj=p=>{const q=tf(p),k=D/(D+q[2]);return{x:w/2+q[0]*k*S,y:h/2-q[1]*k*S,d:q[2]};};
  const get=p=>typeof p==='string'?P[p]:p;
  const fs=Math.max(15,Math.min(26,w/32)),big=w>900?1.25:1;

  const polys=[],hid=[],vis=[],dots=[],lbls=[];let kk=0;
  const pushSeg=(a,b,o,hidden)=>{
    const A=pj(get(a)),B=pj(get(b));const col=o.c||C.edge,sw=(o.w||2.2)*big;
    const el=<line key={'s'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={col} strokeWidth={sw}
      strokeLinecap="round" strokeDasharray={(hidden||o.dash)?`${sw*2.6} ${sw*2.2}`:undefined} opacity={hidden?.7:(o.op||1)}/>;
    (hidden||o.dash?hid:vis).push(el);
  };
  const pushPoly=(pts3,o)=>{
    const q=pts3.map(p=>pj(get(p)));const dm=q.reduce((s,a)=>s+a.d,0)/q.length;
    polys.push({dm,el:<polygon key={'p'+(kk++)} points={q.map(a=>a.x+','+a.y).join(' ')} fill={o.fill||'none'} fillOpacity={o.op==null?.15:o.op}
      stroke={o.stroke||'none'} strokeWidth={(o.sw||1.5)*big} strokeDasharray={o.dash?'6 5':undefined} strokeLinejoin="round"/>});
  };

  scene.prims.forEach(pr=>{
    if(!pr)return;
    if(pr.t==='poly')pushPoly(pr.p,pr);
    else if(pr.t==='seg')pushSeg(pr.a,pr.b,pr,false);
    else if(pr.t==='solid'){
      const verts=[...new Set(pr.faces.flat())];const c0=cen(verts.map(get));
      const em=new Map();
      pr.faces.forEach((f,i)=>{
        const p3=f.map(get);const n0=cross(sub(p3[1],p3[0]),sub(p3[2],p3[0]));
        const n=dot(n0,sub(cen(p3),c0))<0?mul(n0,-1):n0;const front=tfv(n)[2]<0;
        const fl=pr.fills&&pr.fills[i];
        if(fl)pushPoly(f,{fill:fl[0],op:fl[1]});
        else if(pr.tint)pushPoly(f,{fill:'#7c3aed',op:front?.06:.025});
        f.forEach((v,j)=>{const u=f[(j+1)%f.length];const key=[v,u].sort().join('|');
          const e=em.get(key)||{a:v,b:u,vis:false};e.vis=e.vis||front;em.set(key,e);});
      });
      em.forEach(e=>{
        const st=(pr.estyle&&pr.estyle(e.a,e.b))||{};
        pushSeg(e.a,e.b,{c:st.c||pr.c||C.edge,w:st.w||pr.w||2.4},!e.vis);
      });
    }
    else if(pr.t==='pt'){
      const p=pr.p||P[pr.id];const q=pj(p);const col=pr.c||C.ink;
      dots.push(<circle key={'d'+(kk++)} cx={q.x} cy={q.y} r={(pr.r||fs*.27)*(big>1?1.1:1)} fill={col} stroke="#fff" strokeWidth="1.5"/>);
      const label=pr.label===false?null:(pr.label||L(pr.id||''));
      if(label){
        let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
        if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
        const off=fs*(pr.off||1.0);
        lbls.push(<text key={'l'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
          fontFamily='"Times New Roman",Georgia,serif' fontStyle="italic" fontWeight="700" fontSize={fs*(pr.size||1)} fill={pr.lc||col}
          stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{label}</text>);
      }
    }
    else if(pr.t==='txt'){
      const q=pj(get(pr.p));let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
      if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
      const off=fs*(pr.off==null?.8:pr.off);
      lbls.push(<text key={'t'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
        fontFamily={pr.upright?'-apple-system,Segoe UI,Roboto,sans-serif':'"Times New Roman",Georgia,serif'} fontStyle={pr.upright?'normal':'italic'}
        fontWeight="700" fontSize={fs*(pr.size||1.1)} fill={pr.c||C.ink} stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{pr.s}</text>);
    }
  });
  polys.sort((a,b)=>b.dm-a.dm);

  return(
    <div ref={wrap} style={{position:'absolute',inset:0}}>
      <svg width={w} height={h} style={{position:'absolute',inset:0,touchAction:'none',cursor:drag.current?'grabbing':'grab',display:'block'}}

        </button>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3a9 9 0 0 1 0 18"/><path d="M17 16l3.5.5.5-3.5"/></svg>
        </button>

}

/* пряма a над площиною α, пряма b ⊂ α, a ∥ b */
function scSign(h,k,tab){
  const al=rectPlane([0,0,0],[1,0,0],[0,1,0],2.6,1.9);
  const a1=[-2.3,-0.7,h],a2=[2.3,-0.7,h],b1=[-2.3,0.5,0],b2=[2.3,0.5,0];
  const P={X:[0.8,0.5,0]};
  const pr=[plane(al,C.al,.16),txtPl(al,3,'α',C.al)];
  const proof=tab==='proof';
  if(proof&&k>=1)pr.push(plane([a1,a2,b2,b1],C.be,.2),{t:'txt',p:a1,s:'β',c:C.be,size:1.4,lo:[-1,0]});
  pr.push({t:'seg',a:b1,b:b2,c:C.gold,w:(proof&&k>=2)?6.5:4.4},{t:'seg',a:a1,b:a2,c:C.par,w:(proof&&k>=3)?6.5:4.4},
    {t:'txt',p:a2,s:'a',c:C.par,size:1.4,lo:[1,0]},{t:'txt',p:b2,s:'b',c:C.gold,size:1.4,lo:[1,0]});
  if(proof&&k>=2)pr.push({t:'pt',id:'X',c:C.skew,r:7});
  return{P,prims:pr,R:3.2,ctr:[0,0,0.5]};
}
/* побудова прямої m ∥ a через точку M ∈ α */
function scCon(k){
  const al=rectPlane([0,0.3,0],[1,0,0],[0,1,0],2.6,2.0);
  const a1=[-2.4,-1.0,1.4],a2=[2.4,-1.0,1.4],M0=[0.3,0.9,0],m1=[-2.4,0.9,0],m2=[2.4,0.9,0];
  const pr=[plane(al,C.al,.16),txtPl(al,3,'α',C.al),{t:'seg',a:a1,b:a2,c:C.ink,w:4},{t:'txt',p:a2,s:'a',c:C.ink,size:1.4,lo:[1,0]},{t:'pt',id:'M',c:C.skew,r:7}];
  if(k>=1)pr.push(plane([a1,a2,m2,m1],C.be,.2),{t:'txt',p:a1,s:'β',c:C.be,size:1.4,lo:[-1,0]});
  if(k>=2)pr.push({t:'seg',a:m1,b:m2,c:C.par,w:5.4},{t:'txt',p:m2,s:'m',c:C.par,size:1.4,lo:[1,0]});
  return{P:{M:M0},prims:pr,R:3.2,ctr:[0,0,0.6]};
}
/* тетраедр DABC із середньою лінією MN */
const TP={D:[0.2,0.1,1.8],A:[-1.5,-1.1,-0.9],B:[1.4,-0.9,-0.9],C:[0.2,1.5,-0.9]};
function scTet(t,hl){
  const P={...TP,M:lerp(TP.D,TP.A,t),N:lerp(TP.D,TP.B,t)};
  const base=planeThrough(TP.A,TP.B,TP.C,2.5,2.2);
  const pr=[plane(base,C.al,.16),{t:'solid',faces:TETF,tint:true,w:2.2},
    {t:'seg',a:'A',b:'B',c:C.par,w:hl?5:3.2},{t:'seg',a:'M',b:'N',c:C.par,w:5.6},
    ...vp(['A','B','C','D']),{t:'pt',id:'M',c:C.skew},{t:'pt',id:'N',c:C.skew}];
  return{P,prims:pr,R:3.0,ctr:[0,0,0.2]};
}

    {q:<>Пряма <M>a</M> паралельна площині <M>α</M>. Скільки прямих, паралельних <M>a</M>, можна провести в площині <M>α</M> через точку <M>M ∈ α</M>?</>,

    {q:<>Точки <M>M</M> і <M>K</M> — середини сторін <M>AB</M> і <M>BC</M> трикутника <M>ABC</M>. Сторона <M>AC</M> лежить у площині <M>α</M>, точка <M>B</M> їй не належить. <M>MK = 5 см</M>. Знайдіть <M>AC</M>.</>,
      opts:['2,5 см','5 см','10 см','15 см','Знайти неможливо'],ok:2,

    {q:<>Відомо, що <M>a ∥ b</M>, <M>b ⊂ α</M> і <M>a ⊄ α</M>. Яке взаємне розміщення прямої <M>a</M> і площини <M>α</M>?</>,
      opts:['a ⊂ α','a ∥ α','a перетинає α в одній точці','a перетинає α у двох точках','Визначити неможливо'],ok:1,
      ex:<>Це умова ознаки паралельності прямої та площини: <M>a ∥ α</M>.</>}];

  let sc,legend=null;
  if(ti===0){
    const p=pairs[row];const bp=bigFace(BX,p[1],1.35);

  if(ti===1){sc=scTet(0.5,false);legend=[[C.par,'MN'],[C.al,'площина ABC']];}
  if(ti===2){sc=scCon(2);legend=[[C.ink,'a ∥ α'],[C.par,'m ∥ a, m ⊂ α']];}
  if(ti===3){
    const A=[-1.8,-0.8,0],Cc=[1.8,-0.5,0],B=[0.2,1.0,2.0];
    const P={A,B,C:Cc,M:mid(A,B),K:mid(Cc,B)};
    const al=rectPlane([0,0.2,0],[1,0,0],[0,1,0],3.1,2.2);
    sc={P,R:3.6,ctr:[0,0,0.8],prims:[plane(al,C.al,.16),txtPl(al,3,'α',C.al),

  const d0=tbl.every((x,i)=>x===right1[i]);
  const tabs=<div className="tabs">{[0,1,2,3,4].map(i=><button key={i} className={'tab sq'+(ti===i?' on':'')+((i===0?d0:done[i])?' done':'')} onClick={()=>setTi(i)}>{(i===0?d0:done[i])?'✓ ':''}{i+1}</button>)}</div>;

  const left=(<>

    {ti===0&&<div className="fade">

      <div className="cnt"><div>Пара<b>{row+1} з 6</b>у завданні 1</div><div><b className="cg">{tbl.filter((x,i)=>x===right1[i]).length}</b>правильно</div></div>

      {d0&&done.slice(1).every(Boolean)&&ti===4&&<div className="fb ok">Усі завдання виконано правильно!</div>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} camKey={ti} yaw0={0.6} pitch0={0.4}/>;
}

const faceStr=a=>a.length===0?'жодній із граней':a.length===1?'лише '+FN[a[0]]:a.slice(0,-1).map(i=>FN[i]).join(', ')+' і '+FN[a[a.length-1]];
const nm=a=>a.length?a.map(i=>FN[i]).join(', '):'—';
const edgeStep=(P,e,name,w,sets)=>{
  const F=[0,1,2,3,4,5],par=F.filter(f=>relEF(P,e,f)==='par'),inn=F.filter(f=>relEF(P,e,f)==='in'),int=F.filter(f=>relEF(P,e,f)==='int');
  const ok=sets.findIndex(s=>s.length===par.length&&s.every(x=>par.includes(x)));
  return {ed:e,par,ok,opts:sets.map(faceStr),
    nm:name,q:<>Площинам яких граней {w[1]} {w[0]} <span className="ca"><M>{name}</M></span>?</>,
    ex:<>Лежить у гранях: {nm(inn)}. Перетинає грані: {nm(int)}. Паралельна граням: {nm(par)}.</>};
};
const edgeTask=(id,intro,P,steps)=>({id,intro,steps,unit:'Пункт',
  scene:p=>{const n=steps.length,st=steps[Math.min(p,n-1)],fin=p>=n;
    const fills=fin?Object.fromEntries(st.par.map(f=>[f,[C.par,.3]])):null;
    const prims=[{t:'solid',faces:BOXF,tint:true,fills,w:2.2},{t:'seg',a:st.ed[0],b:st.ed[1],c:C.gold,w:6.2},...vp(Object.keys(P))];
    return {P,R:2.9,prims};},
  legend:p=>p>=steps.length?[[C.gold,'пряма'],[C.par,'грані, яким вона паралельна']]:[[C.gold,'пряма']]});
const BX2=(()=>{const b=boxP(1.5,1.1,1.0);return {...b,E:mid(b.C,b.C1),F:mid(b.D,b.D1)};})();
const plAlpha=()=>rectPlane([0,0,0],[1,0,0],[0,1,0],2.6,1.9);
const lineSeg=(a,b,c,w=4.6)=>({t:'seg',a,b,c,w});

function Item6(){
  const N=TASKS.length;
  const [ti,setTi]=useState(0);const [prog,setProg]=useState(Array(N).fill(0));const [wr,setWr]=useState({});
  const tk=TASKS[ti],n=tk.steps.length,p=prog[ti],fin=p>=n,st=tk.steps[Math.min(p,n-1)];
  const key=ti+'-'+p,bad=wr[key]||[];
  const choose=i=>{
    if(fin||bad.includes(i))return;
    if(i===st.ok){const q=[...prog];q[ti]=p+1;setProg(q);}
    else setWr({...wr,[key]:[...bad,i]});
  };
  const tabs=<div className="tabs">{TASKS.map((t,i)=>{const d=prog[i]>=t.steps.length;
    return <button key={i} className={'tab'+(ti===i?' on':'')+(d?' done':'')} onClick={()=>setTi(i)}>{d?'✓ ':''}{t.id}</button>;})}</div>;
  const left=(<>
    {tabs}
    <div className="fade" key={ti}>
      <Note><b>{tk.id}.</b> {tk.intro}</Note>
      {p>0&&<div className="steps">{tk.steps.slice(0,p).map((s,j)=><details key={j} className="done">
        <summary><span className="sn">{j+1})</span> ✓ {s.nm&&<><M>{s.nm}</M>: </>}{s.opts[s.ok]}</summary>
        <div className="why">{s.ex}</div></details>)}</div>}
      {!fin&&<div className="curq">
        {n>1&&<div className="badge">{tk.unit||'Крок'} {p+1} з {n}</div>}
        <p className="lead">{st.q}</p>
        {st.opts.map((o,i)=><button key={i} className={'opt'+(bad.includes(i)?' bad':'')} disabled={bad.includes(i)} onClick={()=>choose(i)}><b>{'АБВГД'[i]}</b><span>{o}</span></button>)}
        {bad.length>0&&<div className="fb bad">Неправильно. Спробуй інший варіант.</div>}
      </div>}
      {fin&&<div className="fb ok">Задачу {tk.id} розв’язано!</div>}
      {fin&&ti<N-1&&<button className="btn" onClick={()=>setTi(ti+1)}>Наступна задача →</button>}
      {fin&&ti===N-1&&prog.every((x,i)=>x>=TASKS[i].steps.length)&&<div className="fb ok">Усі задачі виконано!</div>}
    </div>
  </>);
  return <Frame left={left} scene={tk.scene(p)} legend={tk.legend(p)} camKey={ti} yaw0={0.65} pitch0={0.4}/>;
}
