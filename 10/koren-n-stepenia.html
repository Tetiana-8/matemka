<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Означення кореня n-го степеня</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
:root{
  --ink:#1f2937; --muted:#64748b; --line:#E4D0FA; --bg:#F2E6FF;
  --odd:#2563eb; --even:#16a34a; --arith:#6B21A8; --red:#dc2626; --accent:#6B21A8;--chip:#F3E8FF; --soft:#FAF5FF;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;font-size:clamp(15px,.45vw + 12px,19px);line-height:1.5}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:1em;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pos{color:var(--muted);font-size:.9em;white-space:nowrap}
.btn{border:1px solid #d8b4fe;background:var(--chip);color:var(--accent);border-radius:999px;padding:.4em 1em;font-weight:600}
.btn:hover:not(:disabled){background:#e9d5ff}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;border-color:#d8b4fe;color:var(--accent)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,5fr) 6fr}
main.solo{grid-template-columns:1fr}
main.solo #right{display:none}
#left{overflow-y:auto;padding:clamp(12px,2vw,28px);background:var(--bg)}
#left>*+*{margin-top:12px}
#right{position:relative;background:var(--soft);border-left:1px solid var(--line);min-height:0}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.legend{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700;pointer-events:none;font-size:1.2em}
.legend .eqrow{font-size:1.2em;color:#111827;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}
.hint{position:absolute;bottom:8px;left:12px;color:var(--muted);font-size:.8em;pointer-events:none}
.replay{position:absolute;top:10px;right:10px;font-size:.85em;padding:.25em .8em}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.solo-wrap{max-width:780px;margin:0 auto}
.solo-wrap>*+*{margin-top:12px}
.hero{border-color:#f5c2d7;background:#fff7fb}
.pink{color:#be185d;font-weight:700}
.big{text-align:center;font-size:1.7em;margin:.3em 0;color:#be185d}
.warn{background:#fff7ed;border:2px solid #fb923c;border-radius:10px;padding:10px 14px}
.warn b{color:#c2410c}
.head{border-radius:10px;padding:10px 14px;text-align:center;font-weight:700;font-size:1.25em;border:1px solid}
.head small{font-size:.65em;font-weight:500;color:#475569;margin-left:.4em}
.head.blue{background:#eff6ff;border-color:#bfdbfe;color:var(--odd)}
.head.green{background:#f0fdf4;border-color:#bbf7d0;color:var(--even)}
.head.purple{background:var(--chip);border-color:#d8b4fe;color:var(--accent)}
.head.gray{background:#f8fafc;border-color:#cbd5e1;color:#334155}
p{margin:0}
ul{margin:.3em 0 0;padding-left:1.2em}
li+li{margin-top:.3em}
ul.plain{list-style:none;padding:0}
ul.plain li{padding-left:1em;text-indent:-1em}
ul.plain li::before{content:"• "}
ol.how{margin:.3em 0 0;padding-left:1.4em}
ol.how li+li{margin-top:.35em}

.choice p{font-weight:600;margin-bottom:6px}
.choice .row{display:flex;flex-wrap:wrap;gap:8px}
.choice button{min-width:2.6em;height:2.4em;padding:0 .8em;border-radius:999px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-weight:700}
.choice button:hover{background:#f3e8ff}
.choice button.on{background:var(--c);border-color:var(--c);color:#fff}

.sl label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px;gap:8px}
.sl output{font-variant-numeric:tabular-nums;color:var(--red)}
.sl input{width:100%;accent-color:var(--red)}
.sl.p input{accent-color:var(--arith)}
.sl .play{margin-top:8px}

.live{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 14px;text-align:center;font-weight:600}
.concl{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px}
.concl h4{margin:0 0 4px;font-size:1em;color:var(--accent)}
.concl p+p,.concl li+li{margin-top:.35em}
.case{border:1px solid transparent;border-radius:8px;padding:4px 8px;transition:background .15s}
.case.on{background:#fef3c7;border-color:#fcd34d}
.good{color:#15803d;font-weight:700} .bad{color:#be123c;font-weight:700} .b-odd{color:var(--odd);font-weight:700} .b-even{color:var(--even);font-weight:700}

table.vt{width:100%;border-collapse:collapse;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.vt td{padding:5px 8px;border:1px solid var(--line)}
table.vt td:first-child{font-weight:700;background:#f8fafc;white-space:nowrap}

.btn.go{font-size:1.8em;padding:.15em 1.2em;border-radius:999px;line-height:1.3}
.btn.go.wide{font-size:1.25em;padding:.4em 1.6em}
.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.2;transform:scale(1.12)}}
.head.big1{font-size:1.7em}
.lg{font-size:1.08em}.lg .card{padding:10px 14px}
.solo-wrap.wide{max-width:1120px}
.cols{font-size:.92em}.cols .card{padding:10px 14px}.cols,.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.col>*+*,.exb>*+*{margin-top:10px}
.ch{margin:0 0 4px;color:var(--accent)}
.boxed{border:2px solid var(--accent);border-radius:10px;padding:10px 14px;background:#fff}
.live:empty{display:none}
.lines p+p{margin-top:.7em}
.ex{border-left:4px solid #14b8a6}
.ex summary{color:#0f766e}
.sk{display:block;width:100%;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:4px}
.skc{font-size:.75em;color:var(--muted);margin-bottom:8px}
@media (max-width:820px){.cols,.pair{grid-template-columns:1fr}}
.ex summary{cursor:pointer;font-weight:600}
.ex[open]{background:var(--soft)}
.ex .sol{margin-top:8px;padding-top:8px;border-top:1px dashed #d8b4fe}
footer{background:#fff;border-top:1px solid var(--line);padding:8px 16px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:6px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:#d8b4fe;padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.credit{text-align:center;color:var(--muted);font-size:.72em;margin-top:4px}

.overlay{position:fixed;inset:0;background:rgba(30,20,60,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.overlay.open{display:flex}
.menu{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.menu h2{margin:0 0 10px;font-size:1.1em}
.menu button.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.menu button.item:hover{border-color:#a78bfa;background:var(--chip)}
.menu .num{width:2em;height:2em;border-radius:50%;background:var(--chip);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.grid{stroke:#d4d4d8;stroke-width:1;opacity:.6}
.tick{stroke:#334155;stroke-width:1.5}
.tl{font:700 12px system-ui,sans-serif;fill:#475569}
.lbl{font:700 14px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.banner{font:700 16px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .8s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ah{opacity:0;animation:ahIn .25s forwards}
@keyframes ahIn{to{opacity:1}}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:42% 58%}
  main.solo{grid-template-rows:1fr}
  #right{order:-1;border-left:0;border-bottom:1px solid var(--line)}
  .dots{display:none}
  .hint{display:none}
  .legend{font-size:1em}
}
@media (prefers-reduced-motion:reduce){.fade,.draw,.ah{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body>

<header>
  <h1>Означення кореня <i>n</i>-го степеня</h1>
  <span class="pos" id="pos"></span>
  <button class="btn ghost" id="menuBtn">☰ Зміст</button>
</header>

<main id="main">
  <section id="left"></section>
  <section id="right">
    <svg id="svg"></svg>
    <div class="legend" id="legend"></div>
    <div class="hint" id="hint"></div>
    <button class="btn ghost replay" id="replay">↺ Повторити</button>
  </section>
</main>

<footer>
  <div class="nav">
    <button class="btn ghost" id="prev">← Назад</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next">Далі →</button>
  </div>
  <div class="credit">Автор розробки <b>Ковтун Тетяна</b> за технічної підтримки Claude</div>
</footer>

<div class="overlay" id="overlay"><div class="menu"><h2>Зміст уроку</h2><div id="menuList"></div></div></div>

<script>
const $ = s => document.querySelector(s);
const r = String.raw;
const T = (s, block) => katex.renderToString(s, { throwOnError: false, displayMode: !!block });
const rnd2 = v => { let x = Math.round(v * 100) / 100; return Object.is(x, -0) ? 0 : x; };
const fmt = v => String(rnd2(v)).replace('.', ',').replace('-', '−');
const tn  = v => String(rnd2(v)).replace('.', '{,}');
const eq  = v => Math.abs(v - rnd2(v)) < 1e-9 ? '=' : r`\approx`;
const eqs = v => Math.abs(v - rnd2(v)) < 1e-9 ? '=' : '≈';
const root = (a, n) => Math.sign(a) * Math.pow(Math.abs(a), 1 / n);
const RED = '#dc2626', BLUE = '#2563eb', GREEN = '#16a34a', PURPLE = '#6B21A8', GRAY = '#94a3b8', INK = '#334155';
const N = `<i>n</i>`;
const AL = '<b style="color:var(--red);font-size:1.4em;font-family:serif;font-style:italic">a</b>';
const B = s => T('\\boldsymbol{' + s + '}');
const S = { step: 0, n: 3, a: 3, cube: 8 };

/* ---------- блоки лівої панелі ---------- */
const choice = (key, vals, label, color = 'var(--accent)') =>
  `<div class="card choice" data-key="${key}" style="--c:${color}"><p>${label}</p><div class="row">` +
  vals.map(v => `<button data-v="${v}">${fmt(v)}</button>`).join('') + `</div></div>`;
const slider = (label, min, max, cls = '', play = false) =>
  `<div class="card sl ${cls}"><label for="sl"><span>${label}</span><output id="av"></output></label>` +
  `<input id="sl" type="range" min="${min}" max="${max}" step="0.1" value="${S.a}">` +
  (play ? `<button class="btn play" id="play">▶ Автоматична анімація</button>` : '') + `</div>`;
const head = (cls, tex, note) => `<div class="head ${cls}">${T(tex)}${note ? `<small>${note}</small>` : ''}</div>`;
const table = rows => `<table class="vt">` + rows.map(rw => `<tr>${rw.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + `</table>`;

/* ---------- геометрія графіка ---------- */
let G = {}, ANIM = false;
const X = x => G.cx + x * G.sx, Y = y => G.cy - y * G.sy;

function geom(view, equal) {
  const rc = $('#right').getBoundingClientRect();
  const w = rc.width, h = rc.height;
  let sx = w / (view[1] - view[0]), sy = h / (view[3] - view[2]);
  if (equal) sx = sy = Math.min(sx, sy);
  G = { w, h, sx, sy,
    cx: w / 2 - sx * (view[0] + view[1]) / 2,
    cy: h / 2 + sy * (view[2] + view[3]) / 2 };
  G.xmin = -G.cx / sx; G.xmax = (w - G.cx) / sx;
  G.ymax = G.cy / sy;  G.ymin = (G.cy - h) / sy;
}
const niceStep = px => { for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200]) if (s * px >= 34) return s; return 500; };

function axes() {
  let s = '';
  const xs = niceStep(G.sx), ys = niceStep(G.sy);
  const L = v => v < 0 ? '−' + (-v) : v;
  for (let i = G.nonum ? 1 : Math.ceil(G.xmin / xs); i <= (G.nonum ? 0 : Math.floor(G.xmax / xs)); i++) {
    if (!i) continue;
    const v = i * xs, px = X(v);
    s += `<line class="grid" x1="${px}" y1="0" x2="${px}" y2="${G.h}"/><line class="tick" x1="${px}" y1="${Y(0) - 3}" x2="${px}" y2="${Y(0) + 3}"/>` +
         `<text class="tl" x="${px}" y="${Y(0) + 16}" text-anchor="middle">${L(v)}</text>`;
  }
  for (let i = G.nonum ? 1 : Math.ceil(G.ymin / ys); i <= (G.nonum ? 0 : Math.floor(G.ymax / ys)); i++) {
    if (!i) continue;
    const v = i * ys, py = Y(v);
    s += `<line class="grid" x1="0" y1="${py}" x2="${G.w}" y2="${py}"/><line class="tick" x1="${X(0) - 3}" y1="${py}" x2="${X(0) + 3}" y2="${py}"/>` +
         `<text class="tl" x="${X(0) - 8}" y="${py + 4}" text-anchor="end">${L(v)}</text>`;
  }
  const x0 = X(0), y0 = Y(0);
  s += `<line x1="0" y1="${y0}" x2="${G.w}" y2="${y0}" stroke="${INK}" stroke-width="2"/>` +
       `<line x1="${x0}" y1="${G.h}" x2="${x0}" y2="0" stroke="${INK}" stroke-width="2"/>` +
       `<polygon points="${G.w},${y0} ${G.w - 10},${y0 - 4} ${G.w - 10},${y0 + 4}" fill="${INK}"/>` +
       `<polygon points="${x0},0 ${x0 - 4},10 ${x0 + 4},10" fill="${INK}"/>` +
       `<text x="${G.w - 16}" y="${y0 - 10}" font-family="serif" font-style="italic" font-weight="700" font-size="18" fill="${INK}">x</text>` +
       `<text x="${x0 + 12}" y="18" font-family="serif" font-style="italic" font-weight="700" font-size="18" fill="${INK}">y</text>` +
       (G.nonum ? '' : `<text class="tl" x="${x0 - 12}" y="${y0 + 16}">0</text>`);
  return s;
}

function pathFn(fn, x0, x1, col, wd = 3.5, n = 500) {
  let d = '', pen = false;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = fn(x), py = Y(y);
    if (!isFinite(y) || Math.abs(py - G.h / 2) > G.h * 2) { pen = false; continue; }
    d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ',' + py.toFixed(1) + ' '; pen = true;
  }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
function pathParam(fx, fy, t0, t1, col, wd = 3.5, n = 400) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n;
    d += (i ? 'L' : 'M') + X(fx(t)).toFixed(1) + ',' + Y(fy(t)).toFixed(1) + ' ';
  }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round" stroke-linecap="round"/>`;
}
const hline = (y, col) => `<line x1="0" y1="${Y(y)}" x2="${G.w}" y2="${Y(y)}" stroke="${col}" stroke-width="3" stroke-dasharray="10 6"/>`;
const lineLabel = (a, text, col = RED) =>
  `<text class="lbl" x="${G.w - 10}" y="${Y(a) - 8}" text-anchor="end" fill="${col}">${text}</text>`;
function pt(x, y, col, label = '', dx = 0, dy = -10, anc = 'middle') {
  return `<circle cx="${X(x)}" cy="${Y(y)}" r="5.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>` +
    (label ? `<text class="lbl" x="${X(x) + dx}" y="${Y(y) + dy}" text-anchor="${anc}" fill="${col}">${label}</text>` : '');
}
function tag(x, text, col = INK, below = true) {
  const fs = 14, w = text.length * fs * .6 + 18, h = fs + 10;
  const px = Math.min(Math.max(X(x), w / 2 + 4), G.w - w / 2 - 4);
  const y0 = below ? Y(0) + 22 : Y(0) - 22 - h;
  return `<g class="fade"><rect x="${px - w / 2}" y="${y0}" width="${w}" height="${h}" rx="6" fill="${col}"/>` +
    `<text x="${px}" y="${y0 + h / 2 + fs * .35}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#fff">${text}</text></g>`;
}
const banner = (text, col, y) =>
  `<text class="banner" x="${G.w - 12}" y="${y === undefined ? G.h - 60 : y}" text-anchor="end" fill="${col}">${text}</text>`;

/* стрілка з анімацією (координати математичні) */
function arrow(x1, y1, x2, y2, col, d = 0) {
  const p1 = [X(x1), Y(y1)], p2 = [X(x2), Y(y2)];
  const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
  if (len < 16) return '';
  const ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]), L = 12, W = 6;
  const bx = p2[0] - L * Math.cos(ang), by = p2[1] - L * Math.sin(ang);
  const sn = Math.sin(ang), cs = Math.cos(ang);
  const head = `${p2[0]},${p2[1]} ${bx - W * sn},${by + W * cs} ${bx + W * sn},${by - W * cs}`;
  return `<path d="M${p1[0]},${p1[1]} L${bx},${by}" pathLength="1" fill="none" stroke="${col}" stroke-width="3"` +
         (ANIM ? ` class="draw" style="animation-delay:${d}s"` : '') + `/>` +
         `<polygon points="${head}" fill="${col}"` + (ANIM ? ` class="ah" style="animation-delay:${d + 0.7}s"` : '') + `/>`;
}
/* від a на осі y — уздовж прямої до кореня r — і вниз на вісь x */
function rootArrows(rt, a, col = PURPLE, d = 0) {
  if (!isFinite(rt)) return '';
  return arrow(0, a, rt, a, col, d) + arrow(rt, a, rt, 0, col, d + 0.9) +
         `<circle cx="${X(0)}" cy="${Y(a)}" r="5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
}

/* ---------- кроки ---------- */
const exBlock = (num, task, items) => `<div class="exb"><div class="head purple">Вправа ${num}<small>${task}</small></div>` +
  items.map(([q, sol]) => `<details class="card ex"><summary>${q}</summary><div class="sol">${sol}</div></details>`).join('') + `</div>`;
const ex = (title, blocks) => ({ title, graph: false,
  render() { return `<div class="solo-wrap" style="font-size:1.2em">` + blocks.map(b => exBlock(...b)).join('') + `</div>`; } });

/* маленький схематичний графік для нерівностей */
function sketch(o) {
  const W = 300, H = 170, pl = 28, pr = 10, ptp = 10, pb = 28;
  const sx = v => pl + (v - o.x0) / (o.x1 - o.x0) * (W - pl - pr), sy = v => H - pb - (v - o.y0) / (o.y1 - o.y0) * (H - ptp - pb);
  let d = '', pen = false;
  for (let i = 0; i <= 200; i++) { const x = o.x0 + (o.x1 - o.x0) * i / 200, y = o.f(x);
    if (!isFinite(y) || y < o.y0 || y > o.y1) { pen = false; continue; }
    d += (pen ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(y).toFixed(1) + ' '; pen = true; }
  const ax = Math.min(Math.max(sx(0), pl), W - pr), ay = sy(0);
  let s = `<svg class="sk" viewBox="0 0 ${W} ${H}" role="img">` +
    `<line x1="${pl}" y1="${ay}" x2="${W - pr}" y2="${ay}" stroke="#334155" stroke-width="1.5"/><line x1="${ax}" y1="${H - pb + 6}" x2="${ax}" y2="${ptp}" stroke="#334155" stroke-width="1.5"/>` +
    `<line x1="${pl}" y1="${sy(o.a)}" x2="${W - pr}" y2="${sy(o.a)}" stroke="${RED}" stroke-width="1.8" stroke-dasharray="6 4"/>` +
    `<line x1="${sx(o.xr)}" y1="${sy(o.a)}" x2="${sx(o.xr)}" y2="${ay}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>` +
    `<path d="${d}" fill="none" stroke="${BLUE}" stroke-width="2.6" stroke-linecap="round"/>` +
    `<line x1="${sx(o.from)}" y1="${ay}" x2="${sx(o.to)}" y2="${ay}" stroke="${GREEN}" stroke-width="6" stroke-linecap="round" opacity=".85"/>` +
    `<circle cx="${sx(o.xr)}" cy="${sy(o.a)}" r="3.5" fill="${RED}"/>` +
    `<text x="${W - pr}" y="${sy(o.a) - 5}" text-anchor="end" font-size="11" font-weight="700" fill="${RED}">${o.alab}</text>` +
    `<text x="${pl + 4}" y="${ptp + 10}" font-size="11" font-weight="700" fill="${BLUE}">${o.flab}</text>`;
  o.marks.forEach(m => { s += `<text x="${sx(m.x)}" y="${ay + 15}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">${m.t}</text>`; });
  return s + `</svg><div class="skc">схематично; зелений відрізок — розв’язок</div>`;
}

function example(o) {
  return { title: o.title, graph: true, view: o.view,
    render() { return head(o.cls, `x^{${o.n}}=${o.a}`, o.note) + `<div class="concl"><h4>Корінь</h4>${o.concl}</div>`; },
    eqn() { return `x^{${o.n}}=${o.a}`; },
    legend() { return [[o.col, `y=x^{${o.n}}`], [RED, `y=${o.a}`]]; },
    draw() {
      let s = pathFn(x => Math.pow(x, o.n), G.xmin, G.xmax, o.col) + hline(o.a, RED) + lineLabel(o.a, `y = ${fmt(o.a)}`, RED);
      o.roots.forEach(rt => { s += rootArrows(rt, o.a, PURPLE, 0) + pt(rt, o.a, RED) + tag(rt, `корінь x = ${fmt(rt)}`, INK, true); });
      return s; } };
}

  legend() { return []; },
  draw() { return pathFn(x => 3 - 2 * x, G.xmin, 1, PURPLE, 4) + pt(1, 1, PURPLE, '(1; 1)', 8, 18, 'start') + pt(0, 3, PURPLE, '(0; 3)', 10, -8, 'start'); } }

];

/* ---------- керування ---------- */
function drawGraph() {
  const s = steps[S.step];
  if (s.showIf && !s.showIf()) return;
  geom(s.view, s.equal);
  G.nonum = !!(s.nonum && s.nonum());
  $('#svg').innerHTML = axes() + s.draw();
  ANIM = false;
  const eqs0 = s.eqn ? s.eqn() : '';
  const rows = (eqs0 ? [`<div class="eqrow">${T(eqs0)}</div>`] : []).concat(s.legend().map(([c, t]) => `<div style="color:${c}">${T(t)}</div>`));
  $('#legend').innerHTML = rows.join('');
}

function refresh(anim) {
  const s = steps[S.step];
  if (s.graph) $('#main').classList.toggle('solo', !!(s.showIf && !s.showIf()));
  document.querySelectorAll('.choice').forEach(c => {
    const k = c.dataset.key;
    c.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === S[k]));
  });
  const sl = $('#sl');
  if (sl) { sl.value = S.a; $('#av').textContent = fmt(S.a); }
  if (s.update) s.update();
  if (s.graph) { ANIM = !!anim; drawGraph(); }
}

function go(i) {
  i = Math.max(0, Math.min(steps.length - 1, i));
  S.step = i;
  const s = steps[i];
  Object.assign(S, s.defaults || {});
  $('#main').classList.toggle('solo', !s.graph);
  $('#left').innerHTML = s.render();
  $('#left').scrollTop = 0;
  $('#hint').textContent = s.amax !== undefined ? 'Червону пряму можна перетягувати' : '';
  $('#pos').textContent = `${i + 1} / ${steps.length}`;
  $('#prev').disabled = i === 0;
  $('#next').textContent = i === steps.length - 1 ? 'На початок ↺' : 'Далі →';
  document.querySelectorAll('.dots button').forEach((d, j) => d.classList.toggle('on', j === i));
  refresh(true);
}

/* події */
$('#left').addEventListener('click', e => {
  if (e.target.closest('#reveal')) { S.rev = (S.rev || 0) + 1; $('#left').innerHTML = steps[S.step].render(); refresh(true);
    if (steps[S.step].prog) $('#left').scrollTop = $('#left').scrollHeight; return; }
  const b = e.target.closest('.choice button'); if (!b) return;
  const key = b.closest('.choice').dataset.key; S[key] = +b.dataset.v;
  const st = steps[S.step];
  if (st.resetOn === key) { S.rev = 0; $('#left').innerHTML = st.render(); }
  refresh(true);
});
$('#left').addEventListener('input', e => {
  if (e.target.id === 'sl') { S.a = parseFloat(e.target.value); refresh(false); }
});
$('#left').addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.ex') && d.open) document.querySelectorAll('#left details.ex').forEach(o => { if (o !== d) o.open = false; });
}, true);
$('#replay').onclick = () => refresh(true);
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step === steps.length - 1 ? 0 : S.step + 1);
$('#menuBtn').onclick = () => $('#overlay').classList.add('open');
$('#overlay').onclick = e => { if (e.target.id === 'overlay') $('#overlay').classList.remove('open'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#overlay').classList.remove('open');
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === 'ArrowLeft' && S.step > 0) go(S.step - 1);
});

/* перетягування червоної прямої */
let drag = false;
function pointer(e) {
  const s = steps[S.step]; if (s.amax === undefined) return;
  const rc = $('#svg').getBoundingClientRect();
  let v = (G.cy - (e.clientY - rc.top)) / G.sy;
  v = Math.round(Math.max(s.amin, Math.min(s.amax, v)) * 10) / 10;
  S.a = v === 0 ? 0 : v; refresh(false);
}
$('#svg').addEventListener('pointerdown', e => { drag = true; try { e.target.setPointerCapture(e.pointerId); } catch (_) {} pointer(e); });
$('#svg').addEventListener('pointermove', e => { if (drag) pointer(e); });
['pointerup', 'pointercancel'].forEach(t => $('#svg').addEventListener(t, () => drag = false));

new ResizeObserver(() => { const s = steps[S.step]; if (!s.graph || (s.showIf && !s.showIf())) return;
  const rc = $('#right').getBoundingClientRect(); if (Math.abs(rc.width - G.w) < 1 && Math.abs(rc.height - G.h) < 1) return; drawGraph(); }).observe($('#right'));

/* зміст і крапки */
steps.forEach((s, i) => {
  $('#menuList').insertAdjacentHTML('beforeend',
    `<button class="item" data-i="${i}"><span class="num">${i + 1}</span><span>${s.title}</span></button>`);
  $('#dots').insertAdjacentHTML('beforeend', `<button title="${s.title}" data-i="${i}"></button>`);
});
document.addEventListener('click', e => {
  const b = e.target.closest('.menu .item, .dots button'); if (!b) return;
  $('#overlay').classList.remove('open'); go(+b.dataset.i);
});

go(0);
</script>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }

    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
