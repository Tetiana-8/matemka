<div id="app"></div>
<button id="keyBtn" type="button" title="">🔑</button>

<script>
(function(){ "use strict";

/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){
  const f=mulberry32(seed>>>0);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample:(arr,k)=>R.shuffle(arr).slice(0,k)};
  return R;
}
const rt=(n,a)=>'\\sqrt['+n+']{'+a+'}';
const pw=(b,e)=>e===1?String(b):b+'^{'+e+'}';
const dfr=(a,b)=>'\\dfrac{'+a+'}{'+b+'}';
const dec=s=>String(s).replace('.','{,}');
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const ipow=(b,e)=>Math.pow(b,e);
const root=(x,n)=>Math.pow(x,1/n);
function isPow(x,n){const r=Math.round(Math.pow(x,1/n));for(let c=Math.max(1,r-1);c<=r+1;c++)if(Math.pow(c,n)===x)return true;return false;}
function divisors(x){const d=[];for(let i=1;i<=x;i++)if(x%i===0)d.push(i);return d;}
const EXQ='Знайдіть значення виразу.';
function T(kind,ex,ans,ansTxt,chk,exp,extra){return Object.assign({type:'num',kind,q:EXQ,ex,ans,ansTxt:String(ansTxt),chk,lab:'Введіть відповідь числом',exp},extra||{});}
const cm=x=>String(x).replace('.',',');

function g1(R){ // 5.1 (1): добуток коренів
  const n=R.pick([3,3,4,5]); const rg=n===3?[2,9]:n===4?[2,5]:[2,3];
  const p=R.int(rg[0],rg[1]); let q=R.int(rg[0],rg[1]); while(q===p)q=R.int(rg[0],rg[1]);
  const A=ipow(p,n),B=ipow(q,n);
  const ex=R.f()<0.5?rt(n,A)+'\\cdot'+rt(n,B):rt(n,A+'\\cdot '+B);
  return T('Корінь із добутку',ex,p*q,p*q,root(A,n)*root(B,n),
    '$'+rt(n,A)+'='+p+'$, $'+rt(n,B)+'='+q+'$, тому добуток дорівнює $'+p+'\\cdot '+q+'='+(p*q)+'$.');
}
function g2(R){ // 5.1 (2): корінь зі степенів
  const n=R.pick([3,4,5]); const pq=R.sample([2,3,5],2),p=pq[0],q=pq[1],k1=R.int(1,2),k2=R.int(1,2);
  const ans=ipow(p,k1)*ipow(q,k2);
  return T('Корінь із степеня',rt(n,pw(p,n*k1)+'\\cdot '+pw(q,n*k2)),ans,ans,root(ipow(p,n*k1),n)*root(ipow(q,n*k2),n),
    '$'+rt(n,pw(p,n*k1))+'='+pw(p,k1)+'$ і $'+rt(n,pw(q,n*k2))+'='+pw(q,k2)+'$, тому значення дорівнює $'+ipow(p,k1)+'\\cdot '+ipow(q,k2)+'='+ans+'$.');
}
function g3(R){ // 5.1 (2): однакова основа
  let n,p,k,a,b,t=0;
  do{n=R.pick([3,4,5]);p=R.pick([2,3]);k=R.int(2,3);a=R.int(1,n*k-1);b=n*k-a;t++;}while((a%n===0||b%n===0)&&t<200);
  const ans=ipow(p,k);
  return T('Корінь із степеня',rt(n,pw(p,a))+'\\cdot'+rt(n,pw(p,b)),ans,ans,root(ipow(p,a),n)*root(ipow(p,b),n),
    'Корінь із добутку: $'+rt(n,pw(p,a))+'\\cdot'+rt(n,pw(p,b))+'='+rt(n,pw(p,a+b))+'='+rt(n,pw(p,n*k))+'='+ans+'$.');
}
function g4(R){ // 5.1 (3): дріб зі степенів
  const n=R.pick([3,4,5]); const pq=R.sample([2,3,5],2),p=pq[0],q=pq[1];
  const k1=R.int(1,2),k2=R.int(1,2),c=R.int(1,4),d=R.int(1,4),a=c+n*k1,b=d+n*k2;
  const ans=ipow(p,k1)*ipow(q,k2);
  const ex=dfr(rt(n,pw(p,a))+'\\cdot'+rt(n,pw(q,b)),rt(n,pw(p,c))+'\\cdot'+rt(n,pw(q,d)));
  const chk=root(ipow(p,a),n)*root(ipow(q,b),n)/(root(ipow(p,c),n)*root(ipow(q,d),n));
  return T('Корінь із частки',ex,ans,ans,chk,
    'Усе під одним коренем: $'+rt(n,dfr(pw(p,a)+'\\cdot '+pw(q,b),pw(p,c)+'\\cdot '+pw(q,d)))+'='+rt(n,pw(p,n*k1)+'\\cdot '+pw(q,n*k2))+'='+ipow(p,k1)+'\\cdot '+ipow(q,k2)+'='+ans+'$.');
}
function g5(R){ // 5.3 (1)
  const n=R.pick([3,4,4,5]); const c=R.int(2,n===3?6:n===4?4:3); const N=ipow(c,n);
  const ds=divisors(N).filter(d=>d>1&&d<N&&!isPow(d,n)&&!isPow(N/d,n)&&d!==N/d);
  let a=R.pick(ds),b=N/a; if(R.f()<0.5){const x=a;a=b;b=x;}
  return T('Добуток коренів',rt(n,a)+'\\cdot'+rt(n,b),c,c,root(a,n)*root(b,n),
    '$'+rt(n,a)+'\\cdot'+rt(n,b)+'='+rt(n,a+'\\cdot '+b)+'='+rt(n,N)+'='+c+'$, бо $'+pw(c,n)+'='+N+'$.');
}
function g6(R){ // 5.3 (2): десяткові
  const n=R.pick([3,3,4]); const d=R.int(2,9); const D=ipow(d,n);
  let ds=divisors(D).filter(f=>f>1&&f<D&&f%10!==0&&!isPow(f,n)&&D/f<=60);
  if(!ds.length)ds=divisors(D).filter(f=>f>1&&f<D&&f%10!==0&&!isPow(f,n));
  const f=R.pick(ds),b=D/f; const aStr='0,'+String(f).padStart(n,'0'); const a=f/ipow(10,n);
  const ans=d/10;
  return T('Десяткові дроби',rt(n,dec(aStr))+'\\cdot'+rt(n,b),ans,'0,'+d,root(a,n)*root(b,n),
    '$'+rt(n,dec(aStr))+'\\cdot'+rt(n,b)+'='+rt(n,dec(aStr)+'\\cdot '+b)+'='+rt(n,dec(cm(ipow(d,n)/ipow(10,n))))+'='+dec('0,'+d)+'$, бо $('+dec('0,'+d)+')^{'+n+'}='+dec(cm(ipow(d,n)/ipow(10,n)))+'$.');
}
function g7(R){ // 5.3 (3): частка -> дріб
  const n=R.pick([3,4,5]); const qm=n===3?5:3; let p,q,t=0;
  do{q=R.int(2,qm);p=R.int(1,Math.min(3,q-1));t++;}while(gcd(p,q)!==1&&t<200);
  const m=R.pick([2,3,4,5,6,7]),a=ipow(p,n)*m,b=ipow(q,n)*m;
  return {type:'frac',kind:'Частка коренів',q:EXQ,ex:dfr(rt(n,a),rt(n,b)),ans:p/q,fp:p,fq:q,ansTxt:p+'/'+q,chk:root(a,n)/root(b,n),
    lab:'Відповідь — скорочений дріб',exp:'$'+dfr(rt(n,a),rt(n,b))+'='+rt(n,dfr(a,b))+'='+rt(n,dfr(pw(p,n),pw(q,n)))+'='+dfr(p,q)+'$.'};
}
function g8(R){ // 5.3 (4): дріб із добутком
  const n=R.pick([3,3,4]); const r=R.int(2,n===3?5:3); let c,ds,P,t=0;
  do{c=R.pick([2,3,4,5,6]);P=ipow(r,n)*c;ds=divisors(P).filter(d=>d>=2&&P/d>=2&&!isPow(d,n)&&!isPow(P/d,n));t++;}while((isPow(c,n)||!ds.length)&&t<200);
  const a=R.pick(ds),b=P/a;
  return T('Добуток і частка',dfr(rt(n,a)+'\\cdot'+rt(n,b),rt(n,c)),r,r,root(a,n)*root(b,n)/root(c,n),
    'Усе під одним коренем: $'+rt(n,dfr(a+'\\cdot '+b,c))+'='+rt(n,ipow(r,n))+'='+r+'$.');
}
function g9(R){ // 5.3 (5): сума й різниця під кубічним коренем
  let c,m,k,t=0;
  do{c=R.int(2,5);m=R.int(3,20);k=m*m-ipow(c,3);t++;}while((k<=0||k>300||Number.isInteger(Math.sqrt(k)))&&t<500);
  const s='\\sqrt{'+k+'}';
  return T('Спряжені вирази',rt(3,m+'+'+s)+'\\cdot'+rt(3,m+'-'+s),c,c,root(m+Math.sqrt(k),3)*root(m-Math.sqrt(k),3),
    '$'+rt(3,'('+m+'+'+s+')('+m+'-'+s+')')+'='+rt(3,pw(m,2)+'-('+s+')^{2}')+'='+rt(3,m*m-k)+'='+c+'$.');
}
function g10(R){ // 5.3 (5): корінь 4-го степеня
  let c,b,a,t=0;
  do{c=R.int(2,3);b=R.int(1,8);a=ipow(c,4)+b*b;t++;}while(Number.isInteger(Math.sqrt(a))&&t<500);
  const s='\\sqrt{'+a+'}';
  return T('Спряжені вирази',rt(4,s+'+'+b)+'\\cdot'+rt(4,s+'-'+b),c,c,root(Math.sqrt(a)+b,4)*root(Math.sqrt(a)-b,4),
    '$'+rt(4,'('+s+'+'+b+')('+s+'-'+b+')')+'='+rt(4,'('+s+')^{2}-'+pw(b,2))+'='+rt(4,a-b*b)+'='+c+'$.');
}
function g11(R){ // 5.3 (6): три корені
  const n=R.pick([3,4]); const c=n===3?R.pick([4,6]):R.int(2,3); const N=ipow(c,n); const tr=[];
  for(let a=2;a<=N;a++){if(N%a||isPow(a,n))continue;for(let b=a;b<=N/a;b++){if((N/a)%b||isPow(b,n))continue;const d=N/a/b;if(d>=b&&d>=2&&!isPow(d,n)&&!(a===b&&b===d))tr.push([a,b,d]);}}
  const f=R.shuffle(R.pick(tr));
  return T('Добуток коренів',rt(n,f[0])+'\\cdot'+rt(n,f[1])+'\\cdot'+rt(n,f[2]),c,c,root(f[0],n)*root(f[1],n)*root(f[2],n),
    '$'+rt(n,f[0]+'\\cdot '+f[1]+'\\cdot '+f[2])+'='+rt(n,N)+'='+c+'$, бо $'+pw(c,n)+'='+N+'$.');
}
function g12(R){ // частка -> десятковий дріб
  const n=R.pick([3,3,4]); let u,v,t=0;
  do{v=n===3?R.pick([2,5]):2;u=R.int(v+1,v===2?9:11);t++;}while((gcd(u,v)!==1||(v===5&&u%5===0))&&t<200);
  const m=R.pick([2,3,4,5,6]),a=ipow(u,n)*m,b=ipow(v,n)*m,r=u/v;
  return T('Частка коренів',dfr(rt(n,a),rt(n,b)),r,cm(r),root(a,n)/root(b,n),
    '$'+dfr(rt(n,a),rt(n,b))+'='+rt(n,dfr(a,b))+'='+rt(n,dfr(pw(u,n),pw(v,n)))+'='+dfr(u,v)+'='+dec(cm(r))+'$.',{lab:'Введіть відповідь десятковим дробом'});
}
const GENS=[g1,g2,g3,g4,g5,g6,g7,g8,g9,g10,g11,g12];
const WEIGHTS=[8,8,8,8,8,8,8,8,9,9,9,9];
function genTest(seed){
  const R=mkR(seed);
  return GENS.map((g,i)=>{const t=g(R);t.w=WEIGHTS[i];t.id=i;return t;});
}
function parseNum(s){
  if(s==null)return null; s=String(s).replace(/\s/g,'').replace(/[−–—]/g,'-').replace(',','.');
  let m=/^(-?\d+(?:\.\d+)?)\/(\d+)$/.exec(s); if(m){const d=parseFloat(m[2]);return d?parseFloat(m[1])/d:null;}
  if(!/^-?\d+(\.\d+)?$/.test(s))return null; return parseFloat(s);
}
function mark(t,a){ // 1 / 0.5 / 0
  if(t.type==='num'){const v=parseNum(a);return v!==null&&Math.abs(v-t.ans)<1e-9?1:0;}
  if(t.type==='frac'){
    if(!a)return 0; const w=a.w===''||a.w==null?0:parseInt(a.w,10),n=parseInt(a.n,10),d=parseInt(a.d,10);
    if(!isFinite(w)||!isFinite(n)||!isFinite(d)||d===0)return 0;
    if(Math.abs(w+n/d-t.ans)>1e-9)return 0;
    return (w===0&&n===t.fp&&d===t.fq)?1:0.5;
  }
  return 0;
}
function isAnswered(t,a){
  if(t.type==='num')return a!=null&&String(a).trim()!=='';
  return !!a&&String(a.n||'').trim()!==''&&String(a.d||'').trim()!=='';
}

function plain(s){
  s=String(s).replace(/\$([^$]+)\$/g,'$1').replace(/\{,\}/g,',');
  let p;
  do{ p=s;
    s=s.replace(/\\sqrt\[(\d+)\]\{([^{}]*)\}/g,'$1√($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)')
       .replace(/\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\^\{([^{}]*)\}/g,'^$1').replace(/\)\^\{/g,')^{');
  }while(s!==p);
  return s.replace(/\\cdot/g,'·').replace(/\\left|\\right/g,'').replace(/[{}\\]/g,'');
}

let jrRows=[],teacherOk=false,clearArm=false;
function closeJr(){ jr.classList.remove('on'); if(teacherOk){teacherOk=false;teacherLogout();} }
document.getElementById('keyBtn').onclick=()=>{jr.classList.add('on');teacherOk?showTable():showLogin('');};
jr.addEventListener('click',e=>{if(e.target===jr)closeJr();});
function showLogin(msg){
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px;margin-bottom:8px">Журнал вчителя</div>'+
    '<label class="field"><span>Пароль</span><input id="jpw" type="password" autocomplete="off"></label>'+
    '<div class="hint">'+esc(msg)+'</div><div style="display:flex;gap:8px"><button class="btn" id="jin" type="button">Увійти</button><button class="btn light" id="jcl" type="button">Скасувати</button></div>';
  const pw=document.getElementById('jpw');
  const go=async()=>{ const ok=await teacherLogin(pw.value); if(ok){teacherOk=true;showTable();}else showLogin('Неправильний пароль'); };
  document.getElementById('jin').onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('jcl').onclick=closeJr;
  pw.focus();
}
async function showTable(){
  clearArm=false;
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+'</div><div class="tw" id="jtw">Завантаження…</div>';
  try{ jrRows=await loadResults(); }catch(e){ jrBox.innerHTML='<div class="hint">Не вдалося підключитися до бази результатів</div><button class="btn light" id="jcl" type="button">Закрити</button>'; document.getElementById('jcl').onclick=closeJr; return; }
  drawTable();
}
function dtxt(r){const d=new Date(r.ts||r.date||0);return isNaN(d)?'—':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});}
function drawTable(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||NQ;
  let h='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+' ('+jrRows.length+')</div>'+
    '<div class="tools"><button class="btn light" id="jup" type="button">Оновити</button><button class="btn light" id="jcsv" type="button">Завантажити CSV</button><button class="btn light" id="jclr" type="button">'+(clearArm?'Так, очистити все ('+jrRows.length+')':'Очистити')+'</button><button class="btn light" id="jcl" type="button">Закрити</button></div>';
  h+='<div class="tw"><table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=N;i++)h+='<th>'+i+'</th>'; h+='</tr></thead><tbody>';
  jrRows.forEach((r,ri)=>{
    const fast=r.durationSec!=null&&r.durationSec<120, many=(r.leaves||0)>=3, unf=r.finished===0;
    const away=r.awaySec!=null?' ('+fmtDur(r.awaySec)+')':'';
    h+='<tr><td>'+(ri+1)+'</td><td class="nm" data-d="'+ri+'">'+esc(r.name||'—')+'</td><td>'+dtxt(r)+'</td><td class="'+(fast?'red':'')+'" title="'+(fast?'Дуже швидко':'')+'">'+(r.durationSec!=null?fmtDur(r.durationSec):'—')+'</td><td class="'+(many?'red':'')+'" title="Поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec):'—')+'">'+(r.leaves!=null?r.leaves+away:'—')+'</td>'+
      '<td>'+(unf?'<span style="color:#dc2626;font-weight:800">не завершено ('+(r.answeredCount||0)+' з '+((r.tasks||[]).length||NQ)+')</span>':'<b>'+(r.score!=null?String(r.score).replace('.',','):'—')+'</b>')+'</td>';
    for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+=m===1?'<td class="o">✓</td>':m===0.5?'<td class="h">½</td>':m===0?'<td class="x">✗</td>':'<td>—</td>';}
    h+='</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+N)+'">'+detHtml(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  jrBox.innerHTML=h;
  jrBox.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{const e=document.getElementById('det'+c.dataset.d);e.style.display=e.style.display==='none'?'table-row':'none';});
  document.getElementById('jup').onclick=showTable;
  document.getElementById('jcl').onclick=closeJr;
  document.getElementById('jcsv').onclick=csv;
  document.getElementById('jclr').onclick=async()=>{ if(!clearArm){clearArm=true;drawTable();return;} try{await clearResults();}catch(e){ jrBox.insertAdjacentHTML('afterbegin','<div class="hint">Не вдалося очистити записи. Перевірте правила бази Firebase</div>'); return; } showTable(); };
}
function detHtml(r){
  const q=r.qtext||[],a=r.answers||[],c=r.correct||[],t=r.tasks||[],w=r.weights||[];
  let h='<div><b>Оцінка: '+(r.score!=null?String(r.score).replace('.',','):'—')+' з '+(r.max||100)+' балів ('+(r.percent!=null?r.percent:'—')+' %)</b></div>';
  if(r.finished===0)h+='<div style="color:#dc2626;font-weight:800">Тест НЕ завершено'+(r.endReason==='exits'?' (забагато виходів з вікна)':'')+': відповіли на '+(r.answeredCount||0)+' з '+t.length+'.</div>';
  h+='<div>Виходів: '+(r.leaves!=null?r.leaves:'—')+', поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec)+' ('+r.awaySec+' с)':'—')+', тривалість: '+(r.durationSec!=null?r.durationSec+' с':'—')+'</div>';
  if((r.leaveTasks||[]).length)h+='<div>Виходи по завданнях: '+r.leaveTasks.map((x,i)=>'№'+x+((r.leaveSecs||[])[i]!=null?' ('+r.leaveSecs[i]+' с)':'')).join(', ')+'</div>';
  h+=t.map((m,i)=>{
    const got=(m*(w[i]||0)), wt=w[i]!=null?' [<b>'+String(got).replace('.',',')+' з '+w[i]+' б.</b>]':'';
    const empty=a[i]===''||a[i]==null;
    const cls=m===1?'good':'bad';
    return '<div class="'+cls+'"><b>'+(i+1)+'.</b> '+esc(q[i]||'')+' — відповідь: <b>'+(empty?'без відповіді':esc(a[i]))+'</b>'+(m===1?'':' · правильно: <b>'+esc(c[i]||'')+'</b>')+wt+(m===1?' ✓':m===0.5?' ½':' ✗')+'</div>';
  }).join('');
  return h;
}
function csv(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||NQ;
  const head=['№','Прізвище та ім’я','Дата','Час','Виходів','Поза вікном','Бал','Статус'].concat(Array.from({length:N},(_,i)=>'завд. '+(i+1)));
  const rows=jrRows.map((r,ri)=>{
    const d=new Date(r.ts||0);
    return [ri+1,r.name||'',isNaN(d)?'':d.toLocaleString('uk-UA'),r.durationSec!=null?fmtDur(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtDur(r.awaySec):'',r.score!=null?String(r.score).replace('.',','):'',r.finished===0?'не завершено':'завершено']
      .concat(Array.from({length:N},(_,i)=>{const m=(r.tasks||[])[i];return m===1?'+':m===0.5?'0,5':m===0?'-':'';}));
  });
  const txt='﻿'+[head].concat(rows).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='results_root_properties_10.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

render();
})();
</script>
</body>
</html>
