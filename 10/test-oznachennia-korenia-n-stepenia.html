<script>
(function(){ "use strict";

/* ========================= ГЕНЕРАТОР ЗАВДАНЬ ========================= */
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){
  const f=mulberry32(seed>>>0);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample:(arr,k)=>R.shuffle(arr).slice(0,k)};
  return R;
}
const ORD={3:'третього',4:'четвертого',5:'п’ятого',6:'шостого',7:'сьомого',8:'восьмого',9:'дев’ятого'};
const rt=(n,a)=>n===2?'\\sqrt{'+a+'}':'\\sqrt['+n+']{'+a+'}';
const num=x=>String(x).replace('.','{,}');
const neg=a=>'-'+a;
function CH(R,q,right,wrongs,exp){
  const o=R.shuffle([{t:right,ok:true}].concat(wrongs.map(t=>({t,ok:false}))));
  return {type:'choice',q,opts:o.map(x=>x.t),correct:o.findIndex(x=>x.ok),exp};
}

/* --- Теорія (с. 21–25) --- */
function g1(R){
  return CH(R,'Що називають коренем $n$-го степеня із числа $a$, де $n \\in \\mathbb{N}$, $n>1$?',
    'таке число, $n$-й степінь якого дорівнює $a$',
    ['таке невід’ємне число, $n$-й степінь якого дорівнює $a$','таке число, яке в $n$ разів менше від $a$','таке число, добуток якого на $n$ дорівнює $a$'],
    'Коренем $n$-го степеня із числа $a$ називають таке число, $n$-й степінь якого дорівнює $a$.');
}
function g2(R){
  if(R.f()<0.5){
    return CH(R,'Яке твердження правильне, якщо $n$ — непарне натуральне число, $n>1$?',
      'з будь-якого числа існує корінь $n$-го степеня, причому тільки один',
      ['з від’ємного числа корінь $n$-го степеня не існує','з додатного числа існують два корені — протилежні числа','корінь $n$-го степеня існує лише з невід’ємних чисел'],
      'Графіки $y=x^n$ і $y=a$ при непарному $n$ перетинаються в одній точці при будь-якому $a$.');
  }
  const n=R.pick([3,5,7]); let a=R.int(2,40); if(R.f()<0.5)a=-a;
  return CH(R,'Скільки коренів '+ORD[n]+' степеня має число $'+a+'$?','один',
    ['два (протилежні числа)','жодного','залежить від знака числа'],
    'Корінь непарного степеня з будь-якого числа існує і тільки один.');
}
function g3(R){
  const n=R.pick([4,6]); const c=R.pick(['neg','zero','pos']);
  let a; if(c==='neg')a=-R.pick([4,16,64,5,9]); else if(c==='zero')a=0; else a=R.pick([16,64,81,5,7]);
  const right=c==='neg'?'жодного':c==='zero'?'один — число 0':'два — протилежні числа';
  const all=['жодного','один — число 0','один — додатне число','два — протилежні числа'];
  return CH(R,'Скільки коренів '+ORD[n]+' степеня має число $'+a+'$?',right,all.filter(x=>x!==right),
    'Парний $n$: при $a<0$ коренів немає; при $a=0$ корінь $0$; при $a>0$ — два протилежних числа.');
}
function g4(R){
  const odd=R.f()<0.5; const n=odd?R.pick([3,5,7]):R.pick([4,6]);
  const all=['при будь-яких $a$','при $a \\geqslant 0$','при $a>0$','при $a \\leqslant 0$'];
  const right=odd?all[0]:all[1];
  return CH(R,'При яких значеннях $a$ має зміст вираз $'+rt(n,'a')+'$?',right,all.filter(x=>x!==right),
    odd?'Вираз $\\sqrt[2k+1]{a}$ визначений при будь-якому $a$.':'Арифметичний корінь парного степеня існує лише з невід’ємних чисел.');
}
function g5(R){
  return CH(R,'Арифметичним коренем $n$-го степеня з невід’ємного числа $a$ називають…',
    'таке невід’ємне число, $n$-й степінь якого дорівнює $a$',
    ['будь-яке число, $n$-й степінь якого дорівнює $a$','таке додатне число, $n$-й степінь якого дорівнює $a$','таке невід’ємне число, яке в $n$ разів менше від $a$'],
    'Арифметичний корінь — невід’ємне число $b$, для якого $b^n=a$ (корінь з $0$ дорівнює $0$).');
}
function g6(R){
  const ne=R.pick([4,6,8]), no=R.pick([3,5,7,9]);
  const a=R.int(2,9), a2=R.int(10,19), a3=R.int(2,9);
  const rights=[
    '\\left('+rt(ne,a)+'\\right)^{'+ne+'}='+a,
    rt(no,'-'+a2)+'=-'+rt(no,a2),
    rt(ne,a3)+' \\geqslant 0'
  ];
  const wrongs=[
    rt(no,'-'+a2)+'='+rt(no,a2),
    rt(ne,a3)+' < 0',
    '\\left('+rt(ne,'-'+a)+'\\right)^{'+ne+'}=-'+a,
    rt(ne,'-'+a3)+'=-'+rt(ne,a3)
  ];
  const r=R.pick(rights); const w=R.sample(wrongs,3);
  return CH(R,'Яка рівність правильна?','$'+r+'$',w.map(x=>'$'+x+'$'),
    'З означення: $\\left(\\sqrt[n]{a}\\right)^n=a$ при $a \\geqslant 0$; $\\sqrt[n]{a} \\geqslant 0$; $\\sqrt[2k+1]{-a}=-\\sqrt[2k+1]{a}$. Корінь парного степеня з від’ємного числа не існує.');
}
function g7(R){
  const odd=R.f()<0.5; const n=odd?R.pick([3,5,7]):R.pick([4,6]);
  let right,wr,exp;
  if(odd){
    right=R.pick(['область визначення — $\\mathbb{R}$','функція непарна','функція зростає на $\\mathbb{R}$']);
    wr=['область визначення — $[0;+\\infty)$','функція парна','функція спадає на $\\mathbb{R}$','область значень — $[0;+\\infty)$'];
    exp='Для непарного $n$: $D(y)=E(y)=\\mathbb{R}$, функція непарна, зростаюча.';
  }else{
    right=R.pick(['область визначення — $[0;+\\infty)$','функція ні парна, ні непарна','область значень — $[0;+\\infty)$','функція зростає на області визначення']);
    wr=['область визначення — $\\mathbb{R}$','функція непарна','функція парна','функція спадає на області визначення','область значень — $\\mathbb{R}$'];
    exp='Для парного $n$: $D(y)=E(y)=[0;+\\infty)$, функція ні парна, ні непарна, зростаюча.';
  }
  return CH(R,'Яке твердження про функцію $y='+rt(n,'x')+'$ правильне?',right,R.sample(wr,3),exp);
}

/* --- Задачі (4.1–4.4, 4.6–4.8) --- */
function g8(R){ // 4.1
  const no=R.pick([3,5]), ne=R.pick([4,6]), ne2=ne===4?6:4;
  const a=R.int(1,9), b=R.int(1,9), c=R.int(1,9);
  const T=[
    {t:rt(no,'-'+a),ok:true},{t:rt(no,String(b)),ok:true},{t:rt(ne,String(c)),ok:true},{t:rt(ne2,'0'),ok:true},{t:rt(ne2,'-'+a),ok:false},{t:rt(ne,'-'+b),ok:false}
  ];
  const fl=R.sample(T.filter(x=>!x.ok),R.pick([1,2])); const tr=R.sample(T.filter(x=>x.ok),4-fl.length);
  return {type:'yn',q:'Чи має зміст запис?',items:R.shuffle(fl.concat(tr)).map(x=>({t:'$'+x.t+'$',ok:x.ok})),
    exp:'Корінь непарного степеня має зміст при будь-якому $a$; парного — при $a \\geqslant 0$.'};
}
function g9(R){ // 4.2
  function item(){
    const k=R.pick(['o','e']); let t;
    if(k==='o'){const n=R.pick([3,5]);const b=n===3?R.int(2,7):R.int(2,3);const s=R.pick([1,-1]);const a=s*Math.pow(b,n);
      const ok=R.f()<0.5; const v=ok?s*b:-s*b; t={t:'$'+rt(n,a)+'='+v+'$',ok};}
    else{const n=R.pick([4,6]);const b=n===4?R.int(2,4):2;const a=Math.pow(b,n);const ok=R.f()<0.5;t={t:'$'+rt(n,a)+'='+(ok?b:-b)+'$',ok};}
    return t;
  }
  const items=[item(),item(),item()];
  return {type:'yn',q:'Чи є правильною рівність?',items,
    exp:'Перевірте: $b^n=a$ і, для парного $n$, $b \\geqslant 0$ (арифметичний корінь невід’ємний).'};
}
function g10(R){ // 4.3
  const n=R.pick([4,6]); const b=n===4?R.pick([2,3]):2; const a=Math.pow(b,n);
  return CH(R,'Чому число $-'+b+'$ не є арифметичним коренем '+ORD[n]+' степеня із числа $'+a+'$?',
    'бо арифметичний корінь невід’ємний, а число $-'+b+'$ від’ємне',
    ['бо $(-'+b+')^{'+n+'}\\ne '+a+'$','бо арифметичний корінь парного степеня не існує','бо число $'+a+'$ має лише один корінь'],
    '$(-'+b+')^{'+n+'}='+a+'$, але арифметичний корінь має бути невід’ємним.');
}
function g11(R){ // 4.4 (а)
  const n=R.pick([3,3,5,4]); let k,s=1;
  if(n===3)k=R.pick([3,4,5,6,7,8,9,10]); else if(n===5)k=R.pick([2,3,4]); else k=R.pick([2,3,4,5]);
  if(n%2===1&&R.f()<0.5)s=-1;
  const a=s*Math.pow(k,n);
  return {type:'num',q:'Знайдіть значення виразу $'+rt(n,a)+'$.',ans:s*k,lab:'Введіть відповідь числом',
    exp:'$'+rt(n,a)+'='+(s*k)+'$, бо $('+(s*k)+')^{'+n+'}='+a+'$'+(n%2===0?' і $'+k+' \\geqslant 0$':'')+'.'};
}
function g12(R){ // 4.4 (б)
  const n=R.pick([3,4,5]); const k=R.pick(n===5?[1,2,3]:[1,2,3,4,5]); const s=(n%2===1&&R.f()<0.5)?-1:1;
  let d=String(Math.pow(k,n)); while(d.length<n+1)d='0'+d;
  const a=d.slice(0,d.length-n)+'.'+d.slice(d.length-n);
  const ans=s*k/10;
  return {type:'num',q:'Знайдіть значення виразу $'+rt(n,(s<0?'-':'')+num(a))+'$.',ans,lab:'Введіть відповідь десятковим дробом',
    exp:'$'+rt(n,(s<0?'-':'')+num(a))+'='+(s<0?'-':'')+num(String(k/10))+'$, бо $('+(s<0?'-':'')+num(String(k/10))+')^{'+n+'}='+(s<0?'-':'')+num(a)+'$.'};
}
function g13(R){ // 4.6
  const n=R.pick([3,5,7,9]); let a=R.int(2,9); if(R.f()<0.5)a=-a;
  const v=R.pick([1,2]);
  if(v===1)return {type:'num',q:'Обчисліть: $\\left('+rt(n,a)+'\\right)^{'+n+'}$.',ans:a,lab:'Введіть відповідь числом',
    exp:'За означенням кореня $\\left(\\sqrt[2k+1]{a}\\right)^{2k+1}=a$, тому значення дорівнює $'+a+'$.'};
  return {type:'num',q:'Обчисліть: $\\left(-'+rt(n,a)+'\\right)^{'+n+'}$.',ans:-a,lab:'Введіть відповідь числом',
    exp:'Непарний степінь: $\\left(-x\\right)^{'+n+'}=-x^{'+n+'}$, тому значення дорівнює $'+(-a)+'$.'};
}
function g14(R){ // 4.7
  const n=R.pick([4,6,8]); const a=R.int(3,30); const v=R.pick(['a','b','u']);
  const opts=['$'+a+'$','$-'+a+'$','не має змісту','$0$'];
  let right,q,exp;

}
function g15(R){ // 4.8 (а)

function g17(R){ // 4.8 (в)

function validTask(t){
  if(t.type==='choice'){return new Set(t.opts).size===t.opts.length && t.correct>=0 && t.opts.length===4;}
  if(t.type==='yn'){const s=new Set(t.items.map(x=>x.t));return s.size===t.items.length&&t.items.some(x=>x.ok)&&t.items.some(x=>!x.ok);}
  if(t.type==='num'){return isFinite(t.ans);}
  return false;
}
function genTest(seed){
  const R=mkR(seed); const out=[];
  GENS.forEach((g,i)=>{let t=null;for(let tr=0;tr<40;tr++){t=g.fn(R);if(validTask(t))break;}
    t.w=g.w;t.kind=g.k;t.id=i;out.push(t);});
  return out;
}
function parseNum(s){
  if(s==null)return null; s=String(s).replace(/\s/g,'').replace(/[−–—]/g,'-').replace(',','.');
  if(!/^-?\d+(\.\d+)?$/.test(s))return null; return parseFloat(s);
}
function isRight(t,a){
  if(t.type==='choice')return a===t.correct;
  if(t.type==='yn')return Array.isArray(a)&&t.items.every((it,k)=>a[k]===it.ok);
  if(t.type==='num'){const v=parseNum(a);return v!==null&&Math.abs(v-t.ans)<1e-9;}
  return false;
}
function isAnswered(t,a){
  if(t.type==='choice')return a!=null;
  if(t.type==='yn')return Array.isArray(a)&&a.length===t.items.length&&a.every(x=>x===true||x===false);
  return a!=null&&String(a).trim()!=='';
}

    qtext:S.tasks.map(t=>plain(t.q)),

  const r=S.res;
  app.innerHTML=header()+'<div class="card scroll center"><div style="font-weight:800;font-size:20px;margin-bottom:6px">'+esc(S.surname.trim()+' '+S.first.trim())+'</div>'+
    '<div class="big">'+r.score+' з 100</div><div class="big" style="font-size:clamp(26px,6vw,38px);margin-top:4px">'+r.percent+' %</div>'+
    '<div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn light" id="err" type="button">Дивитись помилки</button><button class="btn" id="again" type="button">Пройти ще раз</button></div></div>'+FOOT;
  document.getElementById('again').onclick=()=>{begin();};
  document.getElementById('err').onclick=()=>{const f=S.res.tasks.findIndex(m=>!m);S.ri=f<0?0:f;S.screen='errors';render();};
}
function renderErrors(){
  const k=S.ri,t=S.tasks[k],a=S.ans[k],ok=S.res.tasks[k]===1;
  let body='';
  if(t.type==='choice'){
    body='<div class="opts">'+t.opts.map((o,j)=>'<div class="opt'+(j===t.correct?' right':(j===a?' wrong':''))+'"><span class="L">'+LET[j]+'</span><span>'+M(o)+'</span></div>').join('')+'</div>';
    if(a==null)body+='<div class="ans"><b class="no">Відповіді не було</b></div>';
  }else if(t.type==='yn'){
    body=t.items.map((it,j)=>{const g=a[j]===it.ok;return '<div class="yn" style="border-color:'+(g?'#16a34a':'#dc2626')+'"><div class="t">'+M(it.t)+'</div><div class="b"><b>'+(a[j]===true?'Так':a[j]===false?'Ні':'—')+'</b>'+(g?'':' <span style="color:#16a34a;font-weight:800">→ '+(it.ok?'Так':'Ні')+'</span>')+'</div></div>';}).join('');
  }else{
    body='<div class="ans">Ваша відповідь: <b class="'+(ok?'ok':'no')+'">'+(esc(a)||'—')+'</b></div>'+(ok?'':'<div class="ans">Правильно: <b class="ok">'+esc(correctText(t))+'</b></div>');
  }
  app.innerHTML=header()+cellsHtml('res')+'<div class="card scroll"><div class="qhead"><span>Завдання '+(k+1)+' з '+S.tasks.length+'</span><span class="badge">'+esc(t.kind)+' · '+t.w+' б.</span></div><div class="q">'+M(t.q)+'</div>'+body+'<div class="exp">'+M(t.exp)+'</div></div>'+
    '<div class="nav"><button class="btn light" id="toRes" type="button">← До результату</button><div style="display:flex;gap:8px"><button class="btn light" id="p" type="button"'+(k===0?' disabled':'')+'>←</button><button class="btn" id="n" type="button"'+(k===S.tasks.length-1?' disabled':'')+'>→</button></div></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.ri=+b.dataset.go;renderErrors();});
  document.getElementById('toRes').onclick=()=>{S.screen='result';render();};
  document.getElementById('p').onclick=()=>{if(S.ri>0){S.ri--;renderErrors();}};
  document.getElementById('n').onclick=()=>{if(S.ri<S.tasks.length-1){S.ri++;renderErrors();}};
}

/* ========================= ЖУРНАЛ ВЧИТЕЛЯ ========================= */
const jr=document.getElementById('jr'),jrBox=document.getElementById('jrBox');
let jrRows=[],teacherOk=false,clearArm=false;
document.getElementById('keyBtn').onclick=()=>{jr.classList.add('on');teacherOk?showTable():showLogin('');};
jr.addEventListener('click',e=>{if(e.target===jr)jr.classList.remove('on');});
function showLogin(msg){
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px;margin-bottom:8px">Журнал вчителя</div>'+
    '<label class="field"><span>Пароль</span><input id="jpw" type="password" autocomplete="off"></label>'+
    '<div class="hint">'+esc(msg)+'</div><div style="display:flex;gap:8px"><button class="btn" id="jin" type="button">Увійти</button><button class="btn light" id="jcl" type="button">Закрити</button></div>';
  const pw=document.getElementById('jpw');
  const go=async()=>{ const ok=await teacherLogin(pw.value); if(ok){teacherOk=true;showTable();}else showLogin('Неправильний пароль'); };
  document.getElementById('jin').onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('jcl').onclick=()=>jr.classList.remove('on');
  pw.focus();
}
async function showTable(){
  clearArm=false;
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+'</div><div class="tw" id="jtw">Завантаження…</div>';
  try{ jrRows=await loadResults(); }catch(e){ jrBox.innerHTML='<div class="hint">Не вдалося підключитися до бази результатів</div><button class="btn light" id="jcl" type="button">Закрити</button>'; document.getElementById('jcl').onclick=()=>jr.classList.remove('on'); return; }
  drawTable();
}
function drawTable(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||S.tasks.length||18;
  let h='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+' ('+jrRows.length+')</div>'+
    '<div class="tools"><button class="btn light" id="jup" type="button">Оновити</button><button class="btn light" id="jcsv" type="button">Завантажити CSV</button><button class="btn light" id="jclr" type="button">'+(clearArm?'Так, очистити все':'Очистити')+'</button><button class="btn light" id="jcl" type="button">Закрити</button></div>';
  h+='<div class="tw"><table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=N;i++)h+='<th>'+i+'</th>'; h+='</tr></thead><tbody>';
  jrRows.forEach((r,ri)=>{
    const d=new Date(r.ts||r.date||0); const ds=isNaN(d)?'—':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const fast=r.durationSec!=null&&r.durationSec<120, many=(r.leaves||0)>=3;
    h+='<tr><td>'+(ri+1)+'</td><td class="nm" data-d="'+ri+'">'+esc(r.name||'—')+'</td><td>'+ds+'</td><td class="'+(fast?'red':'')+'">'+(r.durationSec!=null?fmtDur(r.durationSec):'—')+'</td><td class="'+(many?'red':'')+'">'+(r.leaves!=null?r.leaves:'—')+'</td><td><b>'+(r.score!=null?String(r.score).replace('.',','):'—')+'</b></td>';
    for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+=m===1?'<td class="o">✓</td>':m===0.5?'<td style="color:#f59e0b;font-weight:800">½</td>':m===0?'<td class="x">✗</td>':'<td>—</td>';}
    h+='</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+N)+'">'+detHtml(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  jrBox.innerHTML=h;
  jrBox.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{const e=document.getElementById('det'+c.dataset.d);e.style.display=e.style.display==='none'?'table-row':'none';});
  document.getElementById('jup').onclick=showTable;
  document.getElementById('jcl').onclick=()=>jr.classList.remove('on');
  document.getElementById('jcsv').onclick=csv;
  document.getElementById('jclr').onclick=async()=>{ if(!clearArm){clearArm=true;drawTable();return;} try{await clearResults();}catch(e){} showTable(); };
}
function detHtml(r){
  const q=r.qtext||[],a=r.answers||[],c=r.correct||[],t=r.tasks||[];
  return t.map((m,i)=>'<div><b>'+(i+1)+'.</b> '+esc(q[i]||'')+' — відповідь: <b style="color:'+(m?'#16a34a':'#dc2626')+'">'+esc(a[i]===''?'—':(a[i]||'—'))+'</b>'+(m?'':' · правильно: <b>'+esc(c[i]||'')+'</b>')+'</div>').join('');
}
function csv(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||18;
  const head=['№','Прізвище та ім’я','Дата','Час','Виходів','Бал'].concat(Array.from({length:N},(_,i)=>String(i+1)));
  const rows=jrRows.map((r,ri)=>{
    const d=new Date(r.ts||0);
    return [ri+1,r.name||'',isNaN(d)?'':d.toLocaleString('uk-UA'),r.durationSec!=null?fmtDur(r.durationSec):'',r.leaves!=null?r.leaves:'',r.score!=null?String(r.score).replace('.',','):'']
      .concat(Array.from({length:N},(_,i)=>{const m=(r.tasks||[])[i];return m===1?'+':m===0.5?'0,5':m===0?'-':'';}));
  });
  const txt='﻿'+[head].concat(rows).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='results_nth_root_10.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

render();
})();
</script>
