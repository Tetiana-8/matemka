<body>
<div id="app"></div>
<button id="keyBtn" type="button" title="">🔑</button>
<div id="jr"><div class="box" id="jrBox"></div></div>

<script>
(function(){ "use strict";

/* ========================= ГЕНЕРАТОР ========================= */
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){
  const f=mulberry32(seed>>>0);
  const R={f,
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample:(arr,k)=>R.shuffle(arr).slice(0,k)};
  return R;
}
const sq=(c,r)=>(c===1?'':String(c))+'\\sqrt{'+r+'}';
const SUB=n=>String(n).replace(/(\d)$/,'_$1');
const T=x=>'$'+x+'$';
const RED='#dc2626',BLUE='#2563eb',ORG='#ea580c',GRN='#16a34a',GREY='#64748b',PUR='#6B21A8';
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];


/* ---- розбір і перевірка виразу, введеного учнем ---- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
function sqrtSimp(n){let s=1,r=n;for(let f=2;f*f<=r;f++){while(r%(f*f)===0){r/=f*f;s*=f;}}return {s,r};}
function tokenize(str){
  let s=String(str).replace(/\s/g,'').replace(/-/g,'−').replace(/\*/g,'·').replace(/[:÷]/g,'/').replace(/\./g,',');
  const out=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\d/.test(c)){let j=i;while(j<s.length&&/\d/.test(s[j]))j++;let txt=s.slice(i,j);
      if(s[j]===','&&/\d/.test(s[j+1]||'')){let k=j+1;while(k<s.length&&/\d/.test(s[k]))k++;txt=s.slice(i,k);j=k;}
      out.push({k:'n',v:parseFloat(txt.replace(',','.')),s:txt});i=j;}
    else if('+−·/()√'.indexOf(c)>=0){out.push({k:c});i++;}
    else throw new Error('bad char');
  }
  return out;
}
function parseExpr(str){
  const T=tokenize(str);let p=0;
  const peek=()=>T[p]?T[p].k:null;
  function expr(){let a=term();while(peek()==='+'||peek()==='−'){const op=T[p++].k;const b=term();a={t:op==='+'?'add':'sub',l:a,r:b};}return a;}
  function term(){
    let a=unary();
    for(;;){const k=peek();
      if(k==='·'||k==='/'){p++;const b=unary();a={t:k==='/'?'div':'mul',l:a,r:b,dot:k==='·'};}
      else if(k==='√'||k==='('||k==='n'){const b=unary();a={t:'mul',l:a,r:b,dot:false};}
      else break;}
    return a;
  }
  function unary(){if(peek()==='−'){p++;return {t:'neg',e:unary()};}return atom();}
  function atom(){
    const k=peek();
    if(k==='n'){const t=T[p++];return {t:'num',v:t.v,s:t.s};}
    if(k==='('){p++;const e=expr();if(peek()!==')')throw new Error('no )');p++;return {t:'paren',e};}
    if(k==='√'){p++;const k2=peek();
      if(k2==='n'){const t=T[p++];return {t:'sqrt',e:{t:'num',v:t.v,s:t.s}};}
      if(k2==='('){p++;const e=expr();if(peek()!==')')throw new Error('no )');p++;return {t:'sqrt',e:{t:'paren',e}};}
      if(k2==='√'){return {t:'sqrt',e:atom()};}
      throw new Error('no arg');}
    throw new Error('unexpected');
  }
  const r=expr();
  if(p!==T.length)throw new Error('tail');
  return r;
}
function evalAst(n){
  switch(n.t){
    case 'num':return n.v;
    case 'paren':return evalAst(n.e);
    case 'neg':return -evalAst(n.e);
    case 'add':return evalAst(n.l)+evalAst(n.r);
    case 'sub':return evalAst(n.l)-evalAst(n.r);
    case 'mul':return evalAst(n.l)*evalAst(n.r);
    case 'div':{const d=evalAst(n.r);return d===0?NaN:evalAst(n.l)/d;}
    case 'sqrt':{const v=evalAst(n.e);return v<0?NaN:Math.sqrt(v);}
  }
  return NaN;
}
const strip=n=>{while(n.t==='paren')n=n.e;return n;};
const isIntNum=n=>n.t==='num'&&Number.isInteger(n.v)&&!/,/.test(n.s||'');
function prodInfo(n){
  n=strip(n);
  if(n.t==='num')return {ints:[n],sq:0};
  if(n.t==='sqrt'){const a=strip(n.e);if(!isIntNum(a)||a.v<2||sqrtSimp(a.v).s!==1)return null;return {ints:[],sq:1};}
  if(n.t==='mul'){const l=prodInfo(n.l),r=prodInfo(n.r);if(!l||!r)return null;return {ints:l.ints.concat(r.ints),sq:l.sq+r.sq};}
  return null;
}
const prodOk=p=>!!p&&p.ints.length<=1&&p.sq<=1&&p.ints.every(isIntNum);
function divInfo(n){
  const den=strip(n.r);if(!isIntNum(den)||den.v<2)return null;
  const p=prodInfo(n.l);if(!prodOk(p))return null;
  const coef=p.ints.length?p.ints[0].v:1;
  if(gcd(coef,den.v)>1)return null;
  return {sq:p.sq};
}
function isFinalForm(root){
  let s=strip(root);if(s.t==='neg')s=strip(s.e);
  if(s.t==='num')return true;
  const p=prodInfo(s);if(p)return prodOk(p);
  if(s.t==='div')return !!divInfo(s);
  return false;
}
/* 1 — правильно й спрощено; 0,5 — значення правильне, але не спрощено; 0 — неправильно */
function gradeExpr(str,fn){
  let ast;try{ast=parseExpr(str);}catch(e){return 0;}
  const v=evalAst(ast),w=fn();
  if(!isFinite(v)||Math.abs(v-w)>1e-9*Math.max(1,Math.abs(w)))return 0;
  return isFinalForm(ast)?1:0.5;
}
function nodeTex(n,inFrac){
  switch(n.t){
    case 'num':return n.s.replace(',','{,}');
    case 'paren':return inFrac===true?nodeTex(n.e,true):'\\left('+nodeTex(n.e)+'\\right)';
    case 'neg':return '-'+nodeTex(n.e);
    case 'add':return nodeTex(n.l)+'+'+nodeTex(n.r);
    case 'sub':return nodeTex(n.l)+'-'+nodeTex(n.r);
    case 'mul':{const l=nodeTex(n.l),r=nodeTex(n.r);return l+(n.dot||(n.l.t==='num'&&n.r.t==='num')?'\\cdot ':'')+r;}
    case 'div':return '\\dfrac{'+nodeTex(n.l,true)+'}{'+nodeTex(n.r,true)+'}';
    case 'sqrt':return '\\sqrt{'+nodeTex(n.e,true)+'}';
  }
  return '';
}
function exprToTex(str){
  str=String(str||'');
  if(!str.trim())return null;
  for(let extra=0;extra<4;extra++){try{return nodeTex(parseExpr(str+')'.repeat(extra)));}catch(e){}}
  return null;
}

/* типи завдань: choice — вибір А–Г, num — ціле число (см), expr — вираз з коренем */
function CH(R,q,right,wrongs,exp,extra){
  const o=R.shuffle([{t:right,ok:true}].concat(wrongs.map(w=>({t:w,ok:false}))));
  return Object.assign({type:'choice',q,opts:o.map(x=>x.t),correct:o.findIndex(x=>x.ok),exp},extra||{});
}
function NUM(q,val,exp,extra){ return Object.assign({type:'num',q,val,exp},extra||{}); }

/* ---- рисунки ---- */
const FLOORPOLY=(hw,hh)=>[[-hw,-hh,0],[hw,-hh,0],[hw,hh,0],[-hw,hh,0]];
function floorPlane(items,hw,hh){
  items.push({k:'poly',p:FLOORPOLY(hw,hh),fill:'#dbeafe',op:.75,stroke:'#93c5fd',sw:1.4});
  items.push({k:'txt',at:[hw-.25,-hh+.25,0],s:'α',c:BLUE,size:19,lo:[0,0]});
}
function cubeFig(extraItems,opts){
  const h=1.1;
  const pts={A:[-h,-h,-h],B:[h,-h,-h],C:[h,h,-h],D:[-h,h,-h],A1:[-h,-h,h],B1:[h,-h,h],C1:[h,h,h],D1:[-h,h,h],O:[0,0,-h]};
  const it=[];
  [['A','B'],['B','C'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1']].forEach(e=>it.push({k:'seg',a:e[0],b:e[1],w:2.2}));
  [['A','D'],['D','C'],['D','D1']].forEach(e=>it.push({k:'seg',a:e[0],b:e[1],w:1.5,dash:true}));
  (extraItems||[]).forEach(x=>it.push(x));
  ['A','B','C','D','A1','B1','C1','D1'].forEach(n=>it.push({k:'pt',n}));
  if(opts&&opts.O)it.push({k:'pt',n:'O',lo:[0,1]});
  return {pts,items:it};
}

/* 1. Правильний трикутник: DO ⟂ ABC */
const T1=[];
for(let m=1;m<=6;m++)for(let h=2;h<=40;h++){const d2=12*m*m+h*h,d=Math.round(Math.sqrt(d2));if(d*d===d2&&!(m===2&&h===11))T1.push({m,h,d});}
const NS3=[['A','B','C','D'],['K','L','M','F'],['P','Q','R','S'],['E','F','G','H']];
function g1(R){
  const c=R.pick(T1),a=6*c.m,nm=R.pick(NS3),v0=nm[0],v1=nm[1],v2=nm[2],tp=nm[3];
  const pts={[v0]:[-1.4,-0.81,0],[v1]:[0,1.62,0],[v2]:[1.4,-0.81,0],O:[0,0,0],[tp]:[0,0,2.3]};
  const items=[
    {k:'poly',p:[v0,v1,v2],fill:'#f3e8ff',op:.85,stroke:'#334155',sw:2.2},
    {k:'seg',a:tp,b:v1,w:1.4},{k:'seg',a:tp,b:v2,w:1.4},{k:'seg',a:tp,b:v0,w:2.2},
    {k:'seg',a:tp,b:'O',w:2.8,c:RED},{k:'rm',o:'O',u:[0,0,1],v:[1,0,0],s:.22},
    {k:'pt',n:v0},{k:'pt',n:v1},{k:'pt',n:v2},{k:'pt',n:tp},{k:'pt',n:'O',lo:[1,.6]},
    {k:'txt',at:{mid:[v0,v1]},s:a+' см',u:1,lo:[-1,.3]},{k:'txt',at:{mid:[tp,v0]},s:c.d+' см',u:1,lo:[-1,0]},
    {k:'txt',at:{mid:[tp,'O']},s:'?',c:RED,lo:[1,0],size:20}];
  const q='Через центр '+T('O')+' правильного трикутника '+T(v0+v1+v2)+' проведено пряму '+T(tp+'O')+', перпендикулярну до площини '+T(v0+v1+v2)+'. Знайдіть відрізок '+T(tp+'O')+', якщо '+T(v0+v1)+' = '+a+' см, '+T(tp+v0)+' = '+c.d+' см.';
  const exp='Оскільки '+T(tp+'O\\perp '+v0+v1+v2)+', трикутник '+T(tp+'O'+v0)+' прямокутний (кут при '+T('O')+' прямий). '+T(v0+'O')+' — радіус описаного кола правильного трикутника: '+T(v0+'O=\\dfrac{'+a+'}{\\sqrt3}='+sq(2*c.m,3))+' см. Тоді '+T(tp+'O=\\sqrt{'+tp+v0+'^2-'+v0+'O^2}=\\sqrt{'+c.d*c.d+'-'+12*c.m*c.m+'}=\\sqrt{'+c.h*c.h+'}='+c.h)+' см.';
  return NUM(q,c.h,exp,{fig:{pts,items},kind:'Відстань',meta:{a,d:c.d,h:c.h}});
}

/* 2. Прямокутник: OM ⟂ площини, діагональ і MV задані */
const TR=[];
[[3,4,5,6],[5,12,13,3],[8,15,17,2],[7,24,25,1],[20,21,29,1]].forEach(b=>{for(let k=1;k<=b[3];k++){TR.push([b[0]*k,b[1]*k,b[2]*k]);TR.push([b[1]*k,b[0]*k,b[2]*k]);}});
const NS4=[['A','B','C','D','M'],['K','L','M','N','F'],['P','Q','R','S','T'],['E','F','G','H','M']];
function g2(R){

  const dn=nm[di]+nm[di+2],V=nm[vj];

    {k:'pt',n:nm[0]},{k:'pt',n:nm[1]},{k:'pt',n:nm[2]},{k:'pt',n:nm[3]},{k:'pt',n:tp},{k:'pt',n:'O',lo:[0,1]},
    {k:'txt',at:{mid:[nm[di],nm[di+2]],t:.28},s:(2*r)+' см',u:1,lo:[0,1.2]},
    {k:'txt',at:{mid:[tp,V]},s:x+' см',u:1,lo:[di?-1:1,-.3]},
    {k:'txt',at:{mid:[tp,'O']},s:'?',c:RED,lo:[-1,0],size:20}];
  const q='Через точку '+T('O')+' перетину діагоналей прямокутника '+T(nm.slice(0,4).join(''))+' проведено пряму '+T('O'+tp)+', перпендикулярну до площини прямокутника. Знайдіть відрізок '+T('O'+tp)+', якщо '+T(dn)+' = '+(2*r)+' см, '+T(tp+V)+' = '+x+' см.';
  const exp='Діагоналі прямокутника рівні й точкою перетину діляться навпіл: '+T('O'+V+'=\\dfrac{'+dn+'}{2}='+r)+' см. Оскільки '+T('O'+tp+'\\perp '+nm.slice(0,4).join(''))+', трикутник '+T('O'+tp+V)+' прямокутний (кут при '+T('O')+' прямий). '+T('O'+tp+'=\\sqrt{'+tp+V+'^2-O'+V+'^2}=\\sqrt{'+x*x+'-'+r*r+'}=\\sqrt{'+h*h+'}='+h)+' см.';
  return NUM(q,h,exp,{fig:{pts,items},kind:'Відстань',meta:{r,h,x}});
}

/* 3. Куб: відстань від центра грані до вершини */
const BASE=['A','B','C','D'];
const HINTR='Корінь — кнопка √, дріб — кнопка /. Відповідь спростіть.';
function g3(R){
  const k=R.int(1,6),a=2*k,vi=R.int(0,3),V=BASE[vi],V1=V+'1',tV=V+'_1';
  const fig=cubeFig([{k:'seg',a:'O',b:V1,w:3,c:RED}],{O:1});
  fig.items.push({k:'txt',at:{mid:['A','B']},s:a+' см',u:1,lo:[0,1.2]});
  const q='Точка '+T('O')+' — центр грані '+T('ABCD')+' куба '+T('ABCDA_1B_1C_1D_1')+', ребро якого дорівнює '+a+' см. Знайдіть відстань від точки '+T('O')+' до вершини '+T(tV)+' куба.';
  const exp=T('O'+V)+' — половина діагоналі квадрата '+T('ABCD')+': діагональ дорівнює '+T(a+'\\sqrt2')+' см, тому '+T('O'+V+'='+sq(k,2))+' см. '+T(V+tV+'\\perp ABC')+', тож '+T(V+tV+'\\perp O'+V)+' і трикутник '+T('O'+V+tV)+' прямокутний: '+T('O'+tV+'=\\sqrt{O'+V+'^2+'+V+tV+'^2}=\\sqrt{'+2*k*k+'+'+a*a+'}=\\sqrt{'+6*k*k+'}='+sq(k,6))+' см.';
  return {type:'expr',q,exp,fig,kind:'Відстань',hint:HINTR+' Відповідь у сантиметрах (без одиниць).',ansTyped:(k===1?'':k)+'√6',ansTex:sq(k,6),fn:()=>k*Math.sqrt(6),val:k*Math.sqrt(6),meta:{a,V}};
}

/* 4. Куб: косинус кута між прямими */
const TYPV=['√3/3','√2/2','√3/2','√6/6','√6/3','1/2'];
const COSV=[['\\dfrac{\\sqrt{3}}{3}',Math.sqrt(3)/3],['\\dfrac{\\sqrt{2}}{2}',Math.sqrt(2)/2],['\\dfrac{\\sqrt{3}}{2}',Math.sqrt(3)/2],['\\dfrac{\\sqrt{6}}{6}',Math.sqrt(6)/6],['\\dfrac{\\sqrt{6}}{3}',Math.sqrt(6)/3],['\\dfrac{1}{2}',0.5]];
function g4(R){
  const k=R.int(1,6),a=2*k,variant=R.int(0,2);
  let l1,l2,ci,exp,txt1,txt2,ex={};
  const edge=U=>[U,U+'1'];
  if(variant===0){
    const vi=R.int(0,3),V=BASE[vi],ui=(vi+R.int(1,3))%4,U=BASE[ui];
    l1=['O',V+'1'];l2=edge(U);ci=4;
    txt1=T(V+'_1O');txt2=T(U+U+'_1');
    exp='Прямі '+T(U+U+'_1')+' і '+T(V+V+'_1')+' паралельні, тому шуканий кут дорівнює куту '+T('OD1D'.replace('D1D',V+'_1'+V))+'. '+T('O'+V+'='+sq(k,2))+', '+T(V+V+'_1='+a)+', '+T('O'+V+'_1=\\sqrt{'+2*k*k+'+'+a*a+'}='+sq(k,6))+'. Трикутник '+T('O'+V+V+'_1')+' прямокутний (кут при '+T(V)+' прямий): '+T('\\cos\\angle O'+V+'_1'+V+'=\\dfrac{'+V+V+'_1}{O'+V+'_1}=\\dfrac{'+a+'}{'+sq(k,6)+'}=\\dfrac{2}{\\sqrt6}=\\dfrac{\\sqrt6}{3}')+'.';
  }else if(variant===1){
    const pr=R.pick([['A1','C'],['B1','D'],['C1','A'],['D1','B']]),X=pr[0][0],Z=pr[1],U=R.pick(BASE);
    l1=[pr[0],Z];l2=edge(U);ci=0;
    txt1=T(X+'_1'+Z);txt2=T(U+U+'_1');
    exp='Прямі '+T(U+U+'_1')+' і '+T(X+X+'_1')+' паралельні, тому шуканий кут дорівнює куту '+T(Z+X+'_1'+X)+'. '+T(X+Z+'='+a+'\\sqrt2')+' (діагональ грані), '+T(X+X+'_1='+a)+', '+T(X+'_1'+Z+'=\\sqrt{'+2*a*a+'+'+a*a+'}='+a+'\\sqrt3')+'. Трикутник '+T(Z+X+X+'_1')+' прямокутний (кут при '+T(X)+' прямий): '+T('\\cos='+'\\dfrac{'+X+X+'_1}{'+X+'_1'+Z+'}=\\dfrac{'+a+'}{'+a+'\\sqrt3}=\\dfrac{1}{\\sqrt3}=\\dfrac{\\sqrt3}{3}')+'.';
  }else{
    const xi=R.int(0,3),X=BASE[xi],Y=BASE[(xi+1)%4],useY=R.f()<.5,U=useY?Y:X;
    l1=[X,Y+'1'];l2=edge(U);ci=1;
    txt1=T(X+Y+'_1');txt2=T(U+U+'_1');
    exp=(useY?'':'Прямі '+T(X+X+'_1')+' і '+T(Y+Y+'_1')+' паралельні, тому кут між '+T(X+Y+'_1')+' і '+T(X+X+'_1')+' дорівнює куту '+T(X+Y+'_1'+Y)+'. ')+'Розглянемо трикутник '+T(X+Y+Y+'_1')+': кут при '+T(Y)+' прямий, '+T(X+Y+'='+a)+', '+T(Y+Y+'_1='+a)+', тому '+T(X+Y+'_1='+a+'\\sqrt2')+'. '+T('\\cos\\angle '+X+Y+'_1'+Y+'=\\dfrac{'+Y+Y+'_1}{'+X+Y+'_1}=\\dfrac{'+a+'}{'+a+'\\sqrt2}=\\dfrac{1}{\\sqrt2}=\\dfrac{\\sqrt2}{2}')+'.';
  }
  const right=COSV[ci];
  const fig=cubeFig([{k:'seg',a:l1[0],b:l1[1],w:3.2,c:ORG},{k:'seg',a:l2[0],b:l2[1],w:3.2,c:BLUE}],{O:variant===0});
  fig.items.push({k:'txt',at:{mid:['A','B']},s:a+' см',u:1,lo:[0,1.2]});
  const q=(variant===0?'Точка '+T('O')+' — центр грані '+T('ABCD')+' куба ':'Дано куб ')+T('ABCDA_1B_1C_1D_1')+', ребро якого дорівнює '+a+' см. Знайдіть косинус кута між прямими '+txt1+' і '+txt2+'.';
  return {type:'expr',q,exp,fig,kind:'Кут між прямими',hint:HINTR,ansTyped:TYPV[ci],ansTex:right[0],fn:()=>right[1],val:right[1],meta:{a,variant,l1,l2}};
}

/* 5. Ромб: ознака перпендикулярності прямої та площини */
const NS5=[['K','L','M','N','F'],['A','B','C','D','F'],['P','Q','R','S','T'],['E','F','G','H','T']];
function g5(R){
  const nm=R.pick(NS5),v=R.int(0,3),F=nm[4];

  const base=[[-1.7,0,0],[0,-1.1,0],[1.7,0,0],[0,1.1,0]];
  const pts={O:[0,0,0],[F]:[base[v][0],base[v][1],1.8]};
  nm.slice(0,4).forEach((n,i)=>pts[n]=base[i]);
  const dvec=[-base[v][0],-base[v][1],0];
  const items=[
    {k:'poly',p:nm.slice(0,4),fill:'#f3e8ff',op:.85,stroke:'#334155',sw:2.2},
    {k:'seg',a:X,b:Xo,w:1.2,c:GREY},{k:'seg',a:Xn,b:Xp,w:1.2,c:GREY},
    {k:'seg',a:X,b:F,w:2.8},{k:'rm',o:X,u:[0,0,1],v:dvec,s:.24},

  const dl=X+Xo,tg=Xn+Xp,pl=X+F+'O';
  const right=T(dl)+' і '+T(X+F);
  const wr=[T(X+Xn)+' і '+T(X+F),T(X+Xp)+' і '+T(X+F),T(X+'O')+' і '+T(dl)];
  const q='Через вершину '+T(X)+' ромба '+T(nm.slice(0,4).join(''))+' проведено пряму '+T(X+F)+', перпендикулярну до площини ромба. Діагоналі ромба перетинаються в точці '+T('O')+'. Які дві прямі площини '+T(pl)+' треба взяти для ознаки перпендикулярності, щоб довести, що пряма '+T(tg)+' перпендикулярна до площини '+T(pl)+'?';
  const exp='Діагоналі ромба перпендикулярні: '+T(tg+'\\perp '+dl)+'. Оскільки '+T(X+F+'\\perp '+nm.slice(0,4).join(''))+', то '+T(X+F+'\\perp '+tg)+'. Прямі '+T(dl)+' і '+T(X+F)+' перетинаються в точці '+T(X)+' та лежать у площині '+T(pl)+', тож за ознакою перпендикулярності '+T(tg+'\\perp '+pl)+'. Прямі '+T(X+'O')+' і '+T(dl)+' збігаються, а '+T(X+Xn)+', '+T(X+Xp)+' не лежать у площині '+T(pl)+'.';
  return CH(R,q,right,wr,exp,{fig:{pts,items},kind:'Ознака перпендикулярності',ansTex:T(dl)+' і '+T(X+F),meta:{dl,tg,X,F,nm,v}});
}

/* 6. Два перпендикуляри до площини: знайти CD */
const TRI6=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[12,16,20],[15,20,25],[20,21,29]];
const NS6=[['A','B','C','D'],['M','N','K','L'],['P','Q','R','S'],['E','F','G','H']];
function g6(R){
  const t=R.pick(TRI6),sw=R.f()<.5,diff=sw?t[0]:t[1],cd=sw?t[1]:t[0],ab=t[2];
  const q0=R.int(4,22),big=R.f()<.5,ac=big?q0+diff:q0,bd=big?q0:q0+diff,nm=R.pick(NS6),A=nm[0],B=nm[1],C=nm[2],D=nm[3];
  const mx=Math.max(ac,bd),sc=2.5/mx;
  const pts={[C]:[-1.3,-0.4,0],[D]:[1.3,0.3,0],[A]:[-1.3,-0.4,ac*sc],[B]:[1.3,0.3,bd*sc]};
  const items=[];floorPlane(items,2.5,1.6);
  items.push({k:'seg',a:C,b:D,w:2,c:RED,dash:true},{k:'seg',a:A,b:C,w:2.6},{k:'seg',a:B,b:D,w:2.6},{k:'seg',a:A,b:B,w:2.6},
    {k:'rm',o:C,u:[0,0,1],v:[1,0,0],s:.22},{k:'rm',o:D,u:[0,0,1],v:[-1,0,0],s:.22},
    {k:'pt',n:A},{k:'pt',n:B},{k:'pt',n:C,lo:[-1,.5]},{k:'pt',n:D,lo:[1,.5]},

    {k:'txt',at:{mid:[A,B]},s:ab+' см',u:1,lo:[0,-1]},{k:'txt',at:{mid:[C,D]},s:'?',c:RED,lo:[0,1],size:20});
  const q='Відрізок '+T(A+B)+' не перетинає площину '+T('\\alpha')+'. Через точки '+T(A)+' і '+T(B)+' проведено прямі, перпендикулярні до площини '+T('\\alpha')+', які перетинають її в точках '+T(C)+' і '+T(D)+' відповідно. Знайдіть відрізок '+T(C+D)+', якщо '+T(A+C)+' = '+ac+' см, '+T(B+D)+' = '+bd+' см, '+T(A+B)+' = '+ab+' см.';
  const hi=big?A+C:B+D;

  return NUM(q,cd,exp,{fig:{pts,items},kind:'Паралельні перпендикуляри',meta:{ac,bd,ab,cd}});
}

/* 7 і 8. Три паралельні перпендикуляри на одній прямій */
const RAT=[[1,2],[2,1],[1,3],[3,1],[2,3],[3,2],[1,4],[4,1],[3,4],[4,3]];
const NS7=[['A','B','C'],['M','N','K'],['P','Q','R'],['E','F','G']];
function fig3(e1,e2,md,he1,he2,s,t,lab1,lab2,labm){
  const f1=[-1.8,-0.5,0],f2=[1.8,0.7,0],fm=lerp3(f1,f2,s/(s+t));
  const mx=Math.max(he1,he2),sc=2.6/mx,hm=he1+(he2-he1)*s/(s+t);
  const pts={[e1+'1']:f1,[e2+'1']:f2,[md+'1']:fm,[e1]:[f1[0],f1[1],he1*sc],[e2]:[f2[0],f2[1],he2*sc],[md]:[fm[0],fm[1],hm*sc]};
  const items=[];floorPlane(items,2.7,1.7);
  items.push({k:'seg',a:e1+'1',b:e2+'1',w:2.4,c:BLUE},{k:'seg',a:e1,b:e2,w:2.6},
    {k:'seg',a:e1,b:e1+'1',w:2.6},{k:'seg',a:e2,b:e2+'1',w:2.6},{k:'seg',a:md,b:md+'1',w:2.6},
    {k:'rm',o:e1+'1',u:[0,0,1],v:[1,.3,0],s:.2},{k:'rm',o:e2+'1',u:[0,0,1],v:[-1,-.3,0],s:.2},
    {k:'pt',n:e1,lo:[-1,.2]},{k:'pt',n:e2,lo:[1,.2]},{k:'pt',n:md,lo:[0,-1]},
    {k:'pt',n:e1+'1',lo:[-1,.6]},{k:'pt',n:e2+'1',lo:[1,.6]},{k:'pt',n:md+'1',lo:[0,1]});
  [[e1,lab1,[-1,0]],[e2,lab2,[1,0]],[md,labm,[-1,0]]].forEach(x=>{
    const unk=x[1]==='?';
    items.push({k:'txt',at:{mid:[x[0],x[0]+'1'],t:.45},s:x[1]==='?'?'?':x[1]+' см',u:unk?0:1,c:unk?RED:undefined,lo:x[2],size:unk?20:undefined});
    if(unk)items.push({k:'seg',a:x[0],b:x[0]+'1',w:3.2,c:RED});
  });
  return {pts,items};
}
function g7(R){
  const st=R.pick(RAT),s=st[0],t=st[1],nm=R.pick(NS7),A=nm[0],B=nm[1],C=nm[2];
  const m=R.int(6,24),qq=R.int(1,6),d=(s+t)*qq,n=m+d,x=m+s*qq;
  const A1=SUB(A+'1'),B1=SUB(B+'1'),C1=SUB(C+'1');
  const fig=fig3(A,B,C,m,n,s,t,String(m),String(n),'?');
  const q='Через кінці '+T(A)+' і '+T(B)+' та точку '+T(C)+' відрізка '+T(A+B)+', що не перетинає площину '+T('\\alpha')+', проведено прямі, перпендикулярні до площини '+T('\\alpha')+', які перетинають її в точках '+T(A1)+', '+T(B1)+' і '+T(C1)+' відповідно. Знайдіть відрізок '+T(C+C1)+', якщо '+T(A+A1)+' = '+m+' см, '+T(B+B1)+' = '+n+' см, '+T(A+C+':'+B+C+'='+s+':'+t)+'.';
  const exp='Прямі '+T(A+A1+','+B+B1+','+C+C1)+' перпендикулярні до '+T('\\alpha')+', тому паралельні; точка '+T(C)+' лежить на '+T(A+B)+', отже, усі вони лежать в одній площині (трапеція '+T(A+A1+B1+B)+'). Проведемо через '+T(A)+' пряму '+T(A+'D\\parallel '+A1+B1)+' ('+T('D')+' на '+T(B+B1)+', '+T('K')+' на '+T(C+C1)+'). Тоді '+T('DB_1='+A+A1+'='+m)+' см, '+T(B+'D='+n+'-'+m+'='+d)+' см. '+T(A+C+':'+A+B+'='+s+':'+(s+t))+', а '+T('\\triangle '+A+C+'K\\sim\\triangle '+A+B+'D')+': '+T('CK=\\dfrac{'+s+'}{'+(s+t)+'}\\cdot '+d+'='+s*qq)+' см. '+T(C+C1+'='+m+'+'+s*qq+'='+x)+' см.';
  return NUM(q,x,exp,{fig,kind:'Паралельні перпендикуляри',meta:{m,n,s,t,x}});
}
function g8(R){
  const st=R.pick(RAT),s=st[0],t=st[1],nm=R.pick(NS7),M=nm[0],N=nm[1],K=nm[2];
  let m,n,k,tries=0;

  if(!Number.isInteger(k))return null;
  const M1=SUB(M+'1'),N1=SUB(N+'1'),K1=SUB(K+'1');

const NS9=[['A','B','C','D'],['K','L','M','N'],['P','Q','R','S'],['E','F','G','H']];
function g9(R){
  const nm=R.pick(NS9),u=R.int(0,3);
  let hv,tries=0;
  do{
    hv=[R.int(8,36),R.int(8,36),R.int(8,36),0];
    const o=(u+2)%4,p=(u+1)%4,q2=(u+3)%4;
    // u-та висота = сума двох сусідніх мінус протилежна
    const vals=[0,0,0,0];vals[o]=R.int(8,30);vals[p]=R.int(8,36);vals[q2]=R.int(8,36);vals[u]=vals[p]+vals[q2]-vals[o];
    hv=vals;tries++;
  }while((hv[u]<6||hv[u]>60||new Set(hv).size<4)&&tries<500);
  if(hv[u]<6||hv[u]>60||new Set(hv).size<4)return null;
  const mx=Math.max.apply(null,hv),sc=2.6/mx;
  const f=[[-1.7,-1.0,0],[1.0,-1.3,0],[1.7,0.8,0],[-1.0,1.1,0]],pts={};
  nm.forEach((n,i)=>{pts[n+'1']=f[i];pts[n]=[f[i][0],f[i][1],hv[i]*sc];});
  const items=[];floorPlane(items,2.6,1.8);
  items.push({k:'poly',p:nm.slice(),fill:'#fef3c7',op:.55,stroke:'#334155',sw:2.2});
  nm.forEach((n,i)=>{items.push({k:'seg',a:n,b:n+'1',w:2.4,c:i===u?RED:undefined},{k:'pt',n:n,lo:[0,-1]},{k:'pt',n:n+'1',lo:[i===3||i===0?-1:1,.8]});
    const unk=i===u;items.push({k:'txt',at:{mid:[n,n+'1'],t:.3},s:unk?'?':hv[i]+' см',u:unk?0:1,c:unk?RED:undefined,lo:[i===3||i===0?-1:1.2,0],size:unk?20:undefined});});
  const o=(u+2)%4,p=(u+1)%4,q2=(u+3)%4;
  const N1=i=>SUB(nm[i]+'1');
  const given=[0,1,2,3].filter(i=>i!==u).map(i=>T(nm[i]+N1(i)+'='+hv[i])+' см').join(', ');
  const q='Паралелограм '+T(nm.join(''))+' не має спільних точок із площиною '+T('\\alpha')+'. Через вершини '+T(nm[0])+', '+T(nm[1])+', '+T(nm[2])+' і '+T(nm[3])+' проведено прямі, перпендикулярні до площини '+T('\\alpha')+', які перетинають її в точках '+T(N1(0))+', '+T(N1(1))+', '+T(N1(2))+' і '+T(N1(3))+' відповідно. Знайдіть відрізок '+T(nm[u]+N1(u))+', якщо '+given+'.';
  const S=hv[0]+hv[2];
  const nmx=i=>nm[i]+N1(i);
  const exp='Усі чотири перпендикуляри до '+T('\\alpha')+' паралельні. Діагоналі паралелограма перетинаються в точці '+T('O')+', яка є серединою і '+T(nm[0]+nm[2])+', і '+T(nm[1]+nm[3])+'. Нехай '+T('OO_1\\perp\\alpha')+'. Тоді '+T('OO_1')+' — середня лінія трапеції '+T(nm[0]+N1(0)+N1(2)+nm[2])+' і трапеції '+T(nm[1]+N1(1)+N1(3)+nm[3])+': '+T('OO_1=\\dfrac{'+nmx(0)+'+'+nmx(2)+'}{2}=\\dfrac{'+nmx(1)+'+'+nmx(3)+'}{2}')+'. Отже, '+T(nmx(0)+'+'+nmx(2)+'='+nmx(1)+'+'+nmx(3))+'. '+T(nmx(u)+'='+nmx(p)+'+'+nmx(q2)+'-'+nmx(o)+'='+hv[p]+'+'+hv[q2]+'-'+hv[o]+'='+hv[u])+' см.';
  return NUM(q,hv[u],exp,{fig:{pts,items},kind:'Сума висот',meta:{hv,u}});
}

function validTask(t){

  if(t.type==='num')return Number.isInteger(t.val)&&t.val>0;
  if(t.type==='expr')return isFinite(t.val)&&gradeExpr(t.ansTyped,t.fn)===1;

}
function genTest(seed){
  const R=mkR(seed);const out=[];
  GENS.forEach((g,i)=>{let t=null;for(let tr=0;tr<80;tr++){t=g.fn(R);if(validTask(t))break;t=null;}
    if(!t)throw new Error('gen fail '+i);
    t.w=g.w;t.id=i;out.push(t);});
  return out;
}
function parseNum(a){
  const s=String(a==null?'':a).replace(/\s/g,'').replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(s))return NaN;
  return parseFloat(s);
}
function markOf(t,a){
  if(t.type==='choice')return a===t.correct?1:0;
  if(t.type==='expr')return gradeExpr(a==null?'':a,t.fn);

  return Math.abs(x-t.val)<1e-9?1:0;
}

function figSvg(f){
  const P=f.pts;
  const g=p=>{
    if(typeof p==='string')return P[p];
    if(Array.isArray(p))return p;
    if(p&&p.mid){const a=g(p.mid[0]),b=g(p.mid[1]),t=p.t==null?.5:p.t;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
    return [0,0,0];
  };
  const pr=p=>[p[0]+0.5*p[1],-(p[2]+0.45*p[1])];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const grow=p=>{const q=pr(p);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);};
  Object.keys(P).forEach(k=>grow(P[k]));
  f.items.forEach(it=>{if(it.k==='poly')it.p.forEach(p=>grow(g(p)));});
  const W=300,H=210,px=38,py=30;
  let sc=Math.min((W-2*px)/Math.max(x1-x0,.1),(H-2*py)/Math.max(y1-y0,.1));sc=Math.min(sc,80);
  const ox=W/2-(x0+x1)/2*sc,oy=H/2-(y0+y1)/2*sc;
  const S=p=>{const q=pr(p);return [ox+q[0]*sc,oy+q[1]*sc];};
  const cx=W/2,cy=H/2;
  const fmt=n=>n.toFixed(1);
  let polys='',dashed='',solid='',marks='',dots='',labs='';
  const label=(q,lo,off)=>{
    let dx,dy;
    if(lo&&(lo[0]||lo[1])){dx=lo[0];dy=lo[1];}else{dx=q[0]-cx;dy=q[1]-cy;}
    const l=Math.hypot(dx,dy)||1;
    return [q[0]+dx/l*off,q[1]+dy/l*off];
  };
  f.items.forEach(it=>{
    if(it.k==='poly'){
      const pts=it.p.map(p=>S(g(p)).map(fmt).join(',')).join(' ');
      polys+='<polygon points="'+pts+'" fill="'+(it.fill||'none')+'" fill-opacity="'+(it.op==null?.2:it.op)+'" stroke="'+(it.stroke||'none')+'" stroke-width="'+(it.sw||1.5)+'" stroke-linejoin="round"/>';
    }else if(it.k==='seg'){
      const a=S(g(it.a)),b=S(g(it.b));
      const el='<line x1="'+fmt(a[0])+'" y1="'+fmt(a[1])+'" x2="'+fmt(b[0])+'" y2="'+fmt(b[1])+'" stroke="'+(it.c||'#334155')+'" stroke-width="'+(it.w||2)+'" stroke-linecap="round"'+(it.dash?' stroke-dasharray="5 4"':'')+'/>';
      if(it.dash)dashed+=el;else solid+=el;
    }else if(it.k==='rm'){
      const o=g(it.o),nrm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];};
      const u=nrm(it.u),v=nrm(it.v),s=it.s||.22;
      const A=[o[0]+u[0]*s,o[1]+u[1]*s,o[2]+u[2]*s],B=[A[0]+v[0]*s,A[1]+v[1]*s,A[2]+v[2]*s],C=[o[0]+v[0]*s,o[1]+v[1]*s,o[2]+v[2]*s];
      const a=S(A),b=S(B),c=S(C);
      marks+='<path d="M'+fmt(a[0])+' '+fmt(a[1])+' L'+fmt(b[0])+' '+fmt(b[1])+' L'+fmt(c[0])+' '+fmt(c[1])+'" fill="none" stroke="#16a34a" stroke-width="1.6"/>';
    }else if(it.k==='pt'){
      const q=S(P[it.n]);
      dots+='<circle cx="'+fmt(q[0])+'" cy="'+fmt(q[1])+'" r="3.1" fill="#0f172a" stroke="#fff" stroke-width="1"/>';
      const t=label(q,it.lo,13);
      labs+='<text x="'+fmt(t[0])+'" y="'+fmt(t[1])+'" text-anchor="middle" dominant-baseline="central" font-size="17" fill="#0f172a" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">'+esc(it.n.replace(/1$/,'₁'))+'</text>';
    }else if(it.k==='txt'){
      const q=S(g(it.at)),t=label(q,it.lo,it.s==='?'||it.s==='α'?(it.lo&&!it.lo[0]&&!it.lo[1]?0:12):15);
      labs+='<text class="'+(it.u?'u':'')+'" x="'+fmt(t[0])+'" y="'+fmt(t[1])+'" text-anchor="middle" dominant-baseline="central" font-size="'+(it.size||(it.u?13:17))+'" fill="'+(it.c||'#0f172a')+'" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">'+esc(it.s)+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+polys+dashed+solid+marks+dots+labs+'</svg>';
}

  if(t.fig)h+=figHtml(t.fig,t.type!=='num');
  if(t.type==='choice'){
    h+='<div class="opts">'+t.opts.map((o,j)=>'<button type="button" class="opt'+(S.ans[k]===j?' sel':'')+(lock?' locked':'')+'" data-opt="'+j+'"'+(lock?' disabled':'')+'><span class="L">'+LET[j]+'</span><span>'+M(o)+'</span></button>').join('')+'</div>';
  }else{
    const ex=t.type==='expr';
    h+='<div class="entry"><div class="numlab">'+(ex?esc(t.hint):'Відповідь запишіть числом (у сантиметрах).')+'</div><input class="numin" id="numin" autocomplete="off" spellcheck="false" '+(touch?'inputmode="none" readonly ':(ex?'inputmode="text" ':'inputmode="decimal" '))+'placeholder="Ваша відповідь" value="'+esc(S.ans[k])+'"'+(lock?' disabled':'')+'>'+(ex?'<div class="prev" id="prev">'+previewHtml(S.ans[k])+'</div>':'')+'</div>';
  }
  if(lock&&S.fb)h+='<div class="fbk '+(S.fb.half?'hf':(S.fb.ok?'ok':'no'))+'">'+esc(S.fb.text)+'</div>';
  return h;
}
function mainBtn(k){
  const t=S.tasks[k];
  if(!S.locked[k])return '<button class="btn" id="main" type="button"'+(isAnswered(t,S.ans[k])?'':' disabled')+'>Відповісти</button>';
  return '<button class="btn" id="main" type="button">'+(k===S.tasks.length-1?'Результат →':'Далі →')+'</button>';
}
function renderTask(){
  const k=S.i,t=S.tasks[k];
  app.innerHTML=header()+cellsHtml('task')+
    '<div class="card scroll" id="sc"><div class="qhead"><span>Завдання '+(k+1)+' з '+S.tasks.length+'</span><span class="badge">'+esc(t.kind)+'</span></div><div class="q">'+M(t.q)+'</div>'+taskBody(t,k)+'</div>'+
    '<div class="nav" id="nav">'+mainBtn(k)+'</div>'+
    (t.type!=='choice'?kbHtml(S.locked[k],t.type==='expr'):'')+FOOT;
  bindTask();
}
function refreshMain(){
  const k=S.i,t=S.tasks[k];
  const m=document.getElementById('main'); if(m&&!S.locked[k])m.disabled=!isAnswered(t,S.ans[k]);
}
function bindTask(){
  const k=S.i,t=S.tasks[k];
  document.getElementById('main').onclick=()=>{ if(!S.locked[k])answer(); else next(); };
  if(S.locked[k])return;
  if(t.type==='choice'){
    app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
      S.ans[k]=+b.dataset.opt;
      app.querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('sel',+x.dataset.opt===S.ans[k]));
      refreshMain();
    });
  }else{
    const inp=document.getElementById('numin');
    const ex=t.type==='expr';
    const set=v=>{S.ans[k]=v;if(inp.value!==v)inp.value=v;const pv=document.getElementById('prev');if(pv)pv.innerHTML=previewHtml(v);refreshMain();};
    inp.addEventListener('input',()=>{
      if(ex)set(inp.value.replace(/-/g,'−').replace(/\*/g,'·').replace(/[:÷]/g,'/').replace(/\./g,',').replace(/\s/g,'').replace(/[^0-9,+−·\/()√]/g,'').slice(0,30));
      else set(inp.value.replace(/\./g,',').replace(/[^0-9,]/g,'').replace(/,(?=.*,)/g,'').slice(0,7));
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const m=document.getElementById('main');if(m&&!m.disabled)m.click();}});
    app.querySelectorAll('[data-key]').forEach(b=>{
      b.addEventListener('pointerdown',e=>e.preventDefault());
      b.addEventListener('click',()=>{
        let v=String(S.ans[k]||'');const key=b.dataset.key;
        if(key==='⌫')v=v.slice(0,-1);
        else if(ex){if(v.length<30)v+=key;}
        else if(key===','){if(v&&v.indexOf(',')<0)v+=',';}
        else if(v.length<7)v+=key;
        set(v);
      });
    });
  }
}
function answer(){
  const k=S.i,t=S.tasks[k];
  if(!isAnswered(t,S.ans[k]))return;
  const m=markOf(t,S.ans[k]);
  S.locked[k]=true;S.marks[k]=m;
  S.fb=m===1?{ok:true,text:PRAISE[Math.floor(Math.random()*PRAISE.length)]}:(m===0.5?{half:true,text:'Значення правильне, але відповідь не спрощено (скоротіть дріб, винесіть множник з-під кореня).'}:{ok:false,text:'Помилка.'});
  if(k===S.tasks.length-1)finish();
  renderTask();
}
function next(){
  if(S.i<S.tasks.length-1){S.i++;S.fb=null;renderTask();}
  else{S.screen='result';render();}
}
function ansText(t,a){
  if(t.type==='choice')return a==null?'':plain(t.opts[a]);
  return a==null?'':String(a);
}
function correctText(t){
  if(t.type==='choice')return plain(t.opts[t.correct]);
  if(t.type==='expr')return t.ansTyped;
  return String(t.val);
}
function finish(){
  awayOff(); S.done=true;
  const marks=S.marks.slice();
  const score=marks.reduce((s,m,k)=>s+m*S.tasks[k].w,0);
  const now=Date.now();
  S.res={tasks:marks,score,percent:score,right:marks.filter(m=>m===1).length};
  const dur=(now-S.t0)/1000;
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.surname.trim()+' '+S.first.trim(),surname:S.surname.trim(),firstName:S.first.trim(),
    ts:now,date:new Date(now).toISOString(),
    score:score,max:100,percent:score,tasks:marks,weights:S.tasks.map(t=>t.w),rightCount:S.res.right,
    qtext:S.tasks.map(t=>plain(t.q)),
    answers:S.tasks.map((t,k)=>ansText(t,S.ans[k])),
    correct:S.tasks.map(t=>correctText(t)),
    durationSec:Math.round(dur),leaves:S.leaves,awaySec:Math.round(S.awaySec),variant:S.seed,test:TEST_NAME_FB
  });
}
function cheerText(p){
  if(p>=90)return 'Чудова робота! Ви впевнено застосовуєте перпендикулярність прямої та площини.';
  if(p>=70)return 'Дуже гарний результат! Ще трохи практики — і задачі на перпендикуляри стануть звичними.';
  if(p>=45)return 'Гарний початок! Перегляньте розв’язки помилок — це найкоротший шлях до успіху.';
  return 'Тема непроста, але ви вже зробили крок уперед. Перегляньте розв’язки й спробуйте ще раз — з кожним разом вийде краще.';
}
function renderResult(){
  const r=S.res;
  app.innerHTML=header()+'<div class="card scroll center"><div style="font-weight:800;font-size:20px;margin-bottom:6px">'+esc(S.surname.trim()+' '+S.first.trim())+'</div>'+
    '<div class="big">'+fmtScore(r.score)+' з 100 балів</div><div class="big" style="font-size:clamp(26px,6vw,38px);margin-top:4px">'+fmtScore(r.percent)+' %</div>'+
    '<div class="cheer">'+cheerText(r.percent)+'</div>'+
    (S.leaves>=3?'<div class="soft">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: '+S.leaves+'), тому є підозра, що завдання виконано недоброчесно. Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>':'')+
    '<div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn light" id="err" type="button">Дивитись помилки</button><button class="btn" id="again" type="button">Пройти ще раз</button></div></div>'+FOOT;
  document.getElementById('again').onclick=()=>{begin();};
  document.getElementById('err').onclick=()=>{let f=S.res.tasks.findIndex(m=>m<1);S.ri=f<0?0:f;S.screen='errors';render();};
}
function renderErrors(){
  const k=S.ri,t=S.tasks[k],a=S.ans[k],m=S.res.tasks[k];
  let body='';
  if(t.fig)body+=figHtml(t.fig,t.type!=='num');
  if(t.type==='choice'){
    body+='<div class="opts">'+t.opts.map((o,j)=>'<div class="opt'+(j===t.correct?' right':(j===a?' wrong':''))+'"><span class="L">'+LET[j]+'</span><span>'+M(o)+'</span></div>').join('')+'</div>';
  }else if(t.type==='expr'){
    body+='<div class="ans">Ваша відповідь: <b class="'+(m===1?'ok':(m===0.5?'hf':'no'))+'">'+(String(a||'').trim()?previewHtml(a):'—')+'</b></div>';
    if(m===0.5)body+='<div class="ans">Значення правильне, але відповідь не спрощено (скоротіть дріб, винесіть множник з-під кореня).</div>';
    if(m<1)body+='<div class="ans">Правильно: <b class="ok">'+kx(t.ansTex)+'</b></div>';
  }else{
    body+='<div class="ans">Ваша відповідь: <b class="'+(m===1?'ok':'no')+'">'+esc(String(a||'—'))+(String(a||'').trim()?' см':'')+'</b></div>';
    if(m<1)body+='<div class="ans">Правильно: <b class="ok">'+t.val+' см</b></div>';
  }
  app.innerHTML=header()+cellsHtml('res')+'<div class="card scroll"><div class="qhead"><span>Завдання '+(k+1)+' з '+S.tasks.length+'</span><span class="badge">'+esc(t.kind)+' · '+fmtScore(m*t.w)+' з '+t.w+' б.</span></div><div class="q">'+M(t.q)+'</div>'+body+'<div class="exp">'+M(t.exp)+'</div></div>'+
    '<div class="nav"><button class="btn light" id="toRes" type="button">← До результату</button><button class="btn light" id="p" type="button"'+(k===0?' disabled':'')+'>←</button><button class="btn" id="n" type="button"'+(k===S.tasks.length-1?' disabled':'')+'>→</button></div>'+FOOT;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.ri=+b.dataset.go;renderErrors();});
  document.getElementById('toRes').onclick=()=>{S.screen='result';render();};
  document.getElementById('p').onclick=()=>{if(S.ri>0){S.ri--;renderErrors();}};
  document.getElementById('n').onclick=()=>{if(S.ri<S.tasks.length-1){S.ri++;renderErrors();}};
}

/* ========================= ЖУРНАЛ ВЧИТЕЛЯ ========================= */
const jr=document.getElementById('jr'),jrBox=document.getElementById('jrBox');
let jrRows=[],teacherOk=false,clearArm=false,clearMsg='';
function closeJr(){ jr.classList.remove('on'); if(teacherOk){teacherOk=false;teacherLogout();} }
document.getElementById('keyBtn').onclick=()=>{jr.classList.add('on');teacherOk?showTable():showLogin('');};
jr.addEventListener('click',e=>{if(e.target===jr)closeJr();});
function showLogin(msg){
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px;margin-bottom:8px">Журнал вчителя</div>'+
    '<label class="field"><span>Пароль</span><input id="jpw" type="password" autocomplete="off"></label>'+
    '<div class="hint">'+esc(msg)+'</div><div style="display:flex;gap:8px"><button class="btn" id="jin" type="button">Увійти</button><button class="btn light" id="jcl" type="button">Скасувати</button></div>';
  const pw=document.getElementById('jpw');
  const go=async()=>{ const ok=await teacherLogin(pw.value); if(ok){teacherOk=true;showTable();}else showLogin('Неправильний пароль'); };
  document.getElementById('jin').onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  document.getElementById('jcl').onclick=closeJr;
  pw.focus();
}
async function showTable(){
  clearArm=false;
  jrBox.innerHTML='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+'</div><div class="tw" id="jtw">Завантаження…</div>';
  try{ jrRows=await loadResults(); }catch(e){ jrBox.innerHTML='<div class="hint">Не вдалося підключитися до бази результатів</div><button class="btn light" id="jcl" type="button">Закрити</button>'; document.getElementById('jcl').onclick=closeJr; return; }
  drawTable();
}
function drawTable(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||9;
  let h='<div style="font-weight:800;color:var(--brand);font-size:18px">Результати: '+esc(TEST_NAME)+' ('+jrRows.length+')</div>'+
    '<div class="tools"><button class="btn light" id="jup" type="button">Оновити</button><button class="btn light" id="jcsv" type="button">Завантажити CSV</button><button class="btn light" id="jclr" type="button">'+(clearArm?'Видалити всі записи ('+jrRows.length+')? Так, видалити':'Очистити')+'</button>'+(clearArm?'<button class="btn light" id="jno" type="button">Скасувати</button>':'')+'<button class="btn light" id="jcl" type="button">Закрити</button></div>'+(clearMsg?'<div class="hint">'+esc(clearMsg)+'</div>':'');
  h+='<div class="tw"><table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=N;i++)h+='<th>'+i+'</th>'; h+='</tr></thead><tbody>';
  jrRows.forEach((r,ri)=>{
    const d=new Date(r.ts||r.date||0); const ds=isNaN(d)?'—':d.toLocaleDateString('uk-UA')+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const fast=r.durationSec!=null&&r.durationSec<120, many=(r.leaves||0)>=3;
    const lv=r.leaves!=null?(r.leaves+(r.awaySec?' ('+fmtDur(r.awaySec)+')':'')):'—';
    h+='<tr><td>'+(ri+1)+'</td><td class="nm" data-d="'+ri+'">'+esc(r.name||'—')+'</td><td>'+ds+'</td><td class="'+(fast?'red':'')+'" title="'+(fast?'Дуже швидко':'')+'">'+(r.durationSec!=null?fmtDur(r.durationSec):'—')+'</td><td class="'+(many?'red':'')+'" title="Поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec):'—')+'">'+lv+'</td><td><b>'+(r.score!=null?fmtScore(r.score):'—')+'</b></td>';
    for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+=m===1?'<td class="o">✓</td>':m===0.5?'<td style="color:#f59e0b;font-weight:800">½</td>':m===0?'<td class="x">✗</td>':'<td>—</td>';}
    h+='</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+N)+'">'+detHtml(r)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  jrBox.innerHTML=h;
  jrBox.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{const e=document.getElementById('det'+c.dataset.d);e.style.display=e.style.display==='none'?'table-row':'none';});
  document.getElementById('jup').onclick=()=>{clearMsg='';showTable();};
  document.getElementById('jcl').onclick=closeJr;
  document.getElementById('jcsv').onclick=csv;
  const no=document.getElementById('jno'); if(no)no.onclick=()=>{clearArm=false;drawTable();};
  document.getElementById('jclr').onclick=async()=>{
    if(!clearArm){clearArm=true;clearMsg='';drawTable();return;}
    try{await clearResults();clearMsg='';}catch(e){clearMsg='Не вдалося очистити записи. Перевірте правила бази Firebase';clearArm=false;drawTable();return;}
    showTable();
  };
}
function detHtml(r){
  const q=r.qtext||[],a=r.answers||[],c=r.correct||[],t=r.tasks||[],w=r.weights||[];
  let h='<div style="margin-bottom:6px"><b>Оцінка: '+(r.score!=null?fmtScore(r.score):'—')+' з '+(r.max||100)+' балів ('+(r.percent!=null?fmtScore(r.percent):'—')+' %)</b>'+
    ' · Виходів: '+(r.leaves!=null?r.leaves:'—')+', поза вікном: '+(r.awaySec!=null?fmtDur(r.awaySec):'—')+' (усього '+(r.awaySec!=null?r.awaySec:'—')+' с)</div>';
  h+=t.map((m,i)=>{
    const pts=w[i]!=null?' <i>['+fmtScore(m*w[i])+' з '+w[i]+' б.]</i>':'';
    const bad=m!==1,empty=(a[i]===''||a[i]==null);
    return '<div class="row'+(bad?' bad':'')+'"><b style="color:'+(bad?'#dc2626':'inherit')+'">'+(i+1)+'.</b> '+(bad?'✗ ':'✓ ')+esc(q[i]||'')+' — відповідь: <b style="color:'+(bad?'#dc2626':'#16a34a')+'">'+(empty?'без відповіді':esc(a[i]))+'</b>'+(bad?' · правильно: <b>'+esc(c[i]||'')+'</b>':'')+pts+'</div>';
  }).join('');
  return h;
}
function csv(){
  const N=jrRows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)||9;
  const head=['№','Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'].concat(Array.from({length:N},(_,i)=>'завд. '+(i+1)));
  const rows=jrRows.map((r,ri)=>{
    const d=new Date(r.ts||0);
    return [ri+1,r.name||'',isNaN(d)?'':d.toLocaleString('uk-UA'),r.durationSec!=null?fmtDur(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtDur(r.awaySec):'',r.score!=null?fmtScore(r.score):'']
      .concat(Array.from({length:N},(_,i)=>{const m=(r.tasks||[])[i];return m===1?'+':m===0.5?'0,5':m===0?'-':'';}));
  });
  const txt='﻿'+[head].concat(rows).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download='Перпендикулярність_10клас_результати.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

render();
})();
</script>
