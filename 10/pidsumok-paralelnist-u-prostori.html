<!DOCTYPE html>

<style>
/* Кольори 10 класу задаються один раз */
:root{
  --panelLeft:#F2E6FF; --panelRight:#FAF5FF; --brand:#6B21A8; --brandLight:#F3E8FF;
  --ink:#1e293b; --muted:#64748b; --line:#e9d5ff;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --orange:#ea580c; --violet:#7e22ce;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#ffffff;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#root{height:100dvh;width:100%}
.app{display:flex;flex-direction:column;height:100dvh;width:100%;font-size:14px;background:#fff}
@media(min-width:768px){.app{font-size:15px}}
@media(min-width:1024px){.app{font-size:17px}}
@media(min-width:1280px){.app{font-size:20px}}
@media(min-width:1536px){.app{font-size:22px}}
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.left{order:2;height:55%;min-height:0;background:var(--panelLeft);position:relative;border-top:1px solid var(--line)}
.right{order:1;height:45%;min-height:0;background:var(--panelRight);position:relative;overflow:hidden}
@media(min-width:768px){
  .main{flex-direction:row}
  .left{order:1;height:auto;width:40%;border-top:0;border-right:1px solid var(--line)}

}
.left::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4.6em;background:linear-gradient(to top,var(--panelLeft) 60%,rgba(242,230,255,0));pointer-events:none;z-index:20}
.lscroll{position:absolute;inset:0;overflow-y:auto;padding:.8em max(16px,env(safe-area-inset-left,0px)) 5em;scrollbar-width:thin}
.nav{position:absolute;right:.7em;bottom:.6em;display:flex;gap:.5em;z-index:30;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:44px;padding:0 1.05em;border-radius:999px;border:1px solid #d8b4fe;background:var(--brandLight);
  color:var(--brand);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  box-shadow:0 2px 6px rgba(107,33,168,.12);transition:transform .15s,background .15s}
.btn:hover{background:#ebdcff}.btn:active{transform:scale(.96)}

  font:inherit;font-weight:700;cursor:pointer;line-height:1.15;text-align:center}

.key h5{margin:0 0 .15em;font-size:.82em;letter-spacing:.04em;text-transform:uppercase;color:#a16207}
.m{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-weight:600;white-space:nowrap}
.cg{color:var(--green);font-weight:700}.cr{color:var(--red);font-weight:700}.cv{color:var(--violet);font-weight:700}
.cb{color:var(--blue);font-weight:700}.co{color:var(--orange);font-weight:700}.ca{color:var(--amber);font-weight:700}
.sliderRow{display:flex;align-items:center;gap:.7em;background:#fff;border:1px solid var(--line);border-radius:.7em;padding:.35em .8em;margin:.45em 0}

  font-size:1.3em;cursor:pointer;animation:bounce 1.3s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}

  border-radius:999px;padding:.3em .75em;font-size:.82em;font-weight:700;color:var(--brand);pointer-events:none;z-index:5}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}

.cnt{display:flex;gap:.5em;margin:.5em 0}

.opt{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;min-height:46px;padding:.45em .75em;margin:.3em 0;border-radius:.7em;border:2px solid var(--line);
  background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);line-height:1.3}

.opt.sel{border-color:var(--brand);background:var(--brandLight)}
.opt.ok{border-color:#16a34a;background:#dcfce7}.opt.bad{border-color:#dc2626;background:#fee2e2;opacity:.85}
.fb{border-radius:.7em;padding:.5em .8em;margin:.5em 0;font-weight:700;line-height:1.35}
.fb.ok{background:#dcfce7;border:1px solid #86efac;color:#166534}.fb.bad{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.qtable{width:100%;border-collapse:separate;border-spacing:0 .35em}
.qtable td{background:#fff;padding:.3em .4em;vertical-align:middle}
.qtable td:first-child{border-radius:.6em 0 0 .6em;font-weight:700;padding-left:.7em;white-space:nowrap}
.qtable td:last-child{border-radius:0 .6em .6em 0;width:1.8em;text-align:center;font-weight:800}
.qtable tr.act td{background:#fdf4ff;box-shadow:inset 0 0 0 0 transparent}
.qtable tr.act td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.seg3{display:flex;gap:.25em}
.seg3 button{min-height:40px;flex:1;border-radius:.55em;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.82em;font-weight:700;color:var(--ink);cursor:pointer;padding:0 .2em;line-height:1.1}
.seg3 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg3 button.ok{background:#16a34a;color:#fff;border-color:#16a34a}.seg3 button.bad{background:#dc2626;color:#fff;border-color:#dc2626}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;text-align:center}
.start{background:var(--panelLeft)}
.start h1{margin:.2em 0 .6em;font-size:2em;line-height:1.1;color:#1e1b4b;font-weight:800;animation:fadeUp .6s ease both}
.start h1 span{color:var(--brand)}
@media(min-width:768px){.start h1{font-size:2.6em}}
.go{display:flex;align-items:center;gap:.9em;background:#fff;border:1px solid #e9d5ff;border-radius:999px;padding:.55em .6em .55em 1.4em;color:#581c87;font:inherit;font-weight:800;
  letter-spacing:.14em;cursor:pointer;box-shadow:0 2px 10px rgba(88,28,135,.1);animation:pop .5s ease both}
.go i{width:2.2em;height:2.2em;border-radius:50%;background:#f3e8ff;display:grid;place-items:center;font-style:normal;font-size:.8em}
.menu{position:absolute;inset:0;overflow-y:auto;padding:1em max(16px,env(safe-area-inset-left,0px)) 5em;background:var(--panelLeft)}
.menu h2{margin:.1em 0 .7em;font-size:1.25em;color:var(--brand)}
.mgrid{display:grid;grid-template-columns:1fr;gap:.7em;max-width:70em;margin:0 auto}
@media(min-width:768px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;align-items:center;gap:.9em;background:var(--panelRight);border:1px solid #e2e8f0;border-radius:.9em;padding:.8em 1em;cursor:pointer;
  text-align:left;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;min-height:56px}
.mcard:hover{border-color:#c084fc;background:#faf5ff;box-shadow:0 3px 12px rgba(107,33,168,.1)}
.mcard .n{width:2.5em;height:2.5em;border-radius:50%;background:#ede9fe;color:#5b21b6;font-weight:800;display:grid;place-items:center;flex:none}
.mcard b{display:block;line-height:1.2}.mcard small{color:var(--muted);font-weight:600}
.sign{flex:none;text-align:center;padding:.35em .5em;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:.78em;color:#64748b;letter-spacing:.02em}
.sign b{color:#1e293b}
svg text{user-select:none;-webkit-user-select:none}
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext } = React;

/* ---------- векторна алгебра ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.sqrt(dot(a,a));
const nrm=a=>{const l=len(a)||1;return mul(a,1/l);};
const lerp=(a,b,t)=>add(mul(a,1-t),mul(b,t));
const mid=(a,b)=>lerp(a,b,.5);
const cen=arr=>mul(arr.reduce(add,[0,0,0]),1/arr.length);
const rad=d=>d*Math.PI/180;
const fmt=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const L=id=>String(id).replace(/1$/,'₁');
const rectPlane=(Cn,e1,e2,hw,hh)=>[
  add(Cn,add(mul(e1,hw),mul(e2,hh))),add(Cn,add(mul(e1,-hw),mul(e2,hh))),
  add(Cn,add(mul(e1,-hw),mul(e2,-hh))),add(Cn,add(mul(e1,hw),mul(e2,-hh)))];
const planeThrough=(P1,P2,P3,hw,hh)=>{
  const e1=nrm(sub(P2,P1));const n=cross(sub(P2,P1),sub(P3,P1));const e2=nrm(cross(n,e1));
  return rectPlane(cen([P1,P2,P3]),e1,e2,hw,hh);};
const linePlane=(P0,d,Q,n)=>add(P0,mul(d,dot(sub(Q,P0),n)/dot(d,n)));
const perp=(v,e)=>sub(v,mul(e,dot(v,e)));

/* взаємне розміщення */
function relLines(a1,a2,b1,b2){
  const d1=sub(a2,a1),d2=sub(b2,b1),c=cross(d1,d2);
  if(len(c)<1e-9) return len(cross(d1,sub(b1,a1)))<1e-9?'same':'par';
  return Math.abs(dot(sub(b1,a1),c))<1e-9?'int':'skew';
}
function relLinePlane(a1,a2,Q1,Q2,Q3){
  const n=cross(sub(Q2,Q1),sub(Q3,Q1)),d=sub(a2,a1);
  if(Math.abs(dot(d,n))>1e-9) return 'int';
  return Math.abs(dot(sub(a1,Q1),n))<1e-9?'in':'par';
}

/* ---------- кольори ---------- */
const C={edge:'#334155',ink:'#0f172a',par:'#16a34a',int:'#7e22ce',skew:'#dc2626',inn:'#2563eb',
  al:'#2563eb',be:'#ea580c',ga:'#7e22ce',gold:'#d97706',proj:'#ea580c',teal:'#0d9488',halo:'#FAF5FF'};

/* ---------- прості будівельники фігур ---------- */
const boxP=(hx,hy,hz,sx=0,sy=0)=>({
  A:[-hx,-hy,-hz],B:[hx,-hy,-hz],C:[hx,hy,-hz],D:[-hx,hy,-hz],
  A1:[-hx+sx,-hy+sy,hz],B1:[hx+sx,-hy+sy,hz],C1:[hx+sx,hy+sy,hz],D1:[-hx+sx,hy+sy,hz]});
const paraP=(a,u,v,w)=>({A:a,B:add(a,u),D:add(a,v),C:add(add(a,u),v),
  A1:add(a,w),B1:add(add(a,u),w),D1:add(add(a,v),w),C1:add(add(add(a,u),v),w)});
const BOXF=[['A','B','C','D'],['A1','B1','C1','D1'],['A','B','B1','A1'],['B','C','C1','B1'],['C','D','D1','C1'],['D','A','A1','D1']];
const BOXE=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
const eName=e=>L(e[0])+L(e[1]);
const plane=(p,color,op=.14,sw=1.6)=>({t:'poly',p,fill:color,op,stroke:color,sw});
const vp=(ids,c)=>ids.map(id=>({t:'pt',id,c:c||C.ink}));

/* ---------- 3D-сцена (SVG, обертання мишею/пальцем) ---------- */
function Scene3D({scene,yaw0=0.7,pitch0=0.42,auto0=false,bare=false,legend=null}){
  const wrap=useRef(null);
  const [sz,setSz]=useState({w:600,h:500});
  const [cam,setCam]=useState({yaw:yaw0,pitch:pitch0});
  const [auto,setAuto]=useState(auto0);
  const drag=useRef(null),moved=useRef(false);

  useEffect(()=>{
    const el=wrap.current;
    const upd=()=>setSz({w:el.clientWidth||600,h:el.clientHeight||500});
    const ro=new ResizeObserver(upd);ro.observe(el);upd();
    return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    if(!auto)return;let raf,last=performance.now();
    const tick=t=>{const dt=t-last;last=t;
      if(!drag.current)setCam(c=>({...c,yaw:c.yaw+dt*0.0005}));
      raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[auto]);

  const onDown=e=>{drag.current={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,id:e.pointerId};moved.current=false;};
  const onMove=e=>{
    const d=drag.current;if(!d)return;
    if(!moved.current){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5)return;
      moved.current=true;
      try{e.currentTarget.setPointerCapture(d.id);}catch(_){}
    }
    const dx=e.clientX-d.px,dy=e.clientY-d.py;d.px=e.clientX;d.py=e.clientY;
    setCam(c=>({yaw:c.yaw+dx*0.0085,pitch:Math.max(-1.25,Math.min(1.45,c.pitch+dy*0.0085))}));
  };
  const onUp=()=>{drag.current=null;setTimeout(()=>{moved.current=false;},0);};

  const {w,h}=sz;
  const R=scene.R||2.8,ctr=scene.ctr||[0,0,0],P=scene.P||{};
  const D=R*5.5,S=Math.min(w,h)/(2*R)*0.97;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const tfv=v=>{const x1=v[0]*cy-v[1]*sy,y1=v[0]*sy+v[1]*cy;return[x1,y1*sp+v[2]*cp,y1*cp-v[2]*sp];};
  const tf=p=>tfv(sub(p,ctr));
  const pj=p=>{const q=tf(p),k=D/(D+q[2]);return{x:w/2+q[0]*k*S,y:h/2-q[1]*k*S,d:q[2]};};
  const get=p=>typeof p==='string'?P[p]:p;
  const fs=Math.max(15,Math.min(26,w/32)),big=w>900?1.25:1;

  const polys=[],hid=[],vis=[],dots=[],lbls=[],hits=[];let kk=0;
  const pushSeg=(a,b,o,hidden)=>{
    const A=pj(get(a)),B=pj(get(b));const col=o.c||C.edge,sw=(o.w||2.2)*big;
    const el=<line key={'s'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={col} strokeWidth={sw}
      strokeLinecap="round" strokeDasharray={(hidden||o.dash)?`${sw*2.6} ${sw*2.2}`:undefined} opacity={hidden?.7:(o.op||1)}/>;
    (hidden||o.dash?hid:vis).push(el);
    if(o.arrow){
      const ang=Math.atan2(B.y-A.y,B.x-A.x),s=fs*0.6;
      vis.push(<polygon key={'a'+(kk++)} fill={col} points={`${B.x},${B.y} ${B.x-s*Math.cos(ang-.4)},${B.y-s*Math.sin(ang-.4)} ${B.x-s*Math.cos(ang+.4)},${B.y-s*Math.sin(ang+.4)}`}/>);
    }
    if(o.pick){
      hits.push(<line key={'h'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="rgba(0,0,0,0.001)" strokeWidth={Math.max(18,fs)}
        strokeLinecap="round" style={{cursor:'pointer'}} onClick={()=>{if(!moved.current)o.pick();}}/>);
    }
  };
  const pushPoly=(pts3,o)=>{
    const q=pts3.map(p=>pj(get(p)));const dm=q.reduce((s,a)=>s+a.d,0)/q.length;
    polys.push({dm,el:<polygon key={'p'+(kk++)} points={q.map(a=>a.x+','+a.y).join(' ')} fill={o.fill||'none'} fillOpacity={o.op==null?.15:o.op}
      stroke={o.stroke||'none'} strokeWidth={(o.sw||1.5)*big} strokeDasharray={o.dash?'6 5':undefined} strokeLinejoin="round"/>});
  };

  scene.prims.forEach(pr=>{
    if(!pr)return;
    if(pr.t==='poly')pushPoly(pr.p,pr);
    else if(pr.t==='seg')pushSeg(pr.a,pr.b,pr,false);
    else if(pr.t==='solid'){
      const verts=[...new Set(pr.faces.flat())];const c0=cen(verts.map(get));
      const em=new Map();
      pr.faces.forEach((f,i)=>{
        const p3=f.map(get);const n0=cross(sub(p3[1],p3[0]),sub(p3[2],p3[0]));
        const n=dot(n0,sub(cen(p3),c0))<0?mul(n0,-1):n0;const front=tfv(n)[2]<0;
        const fl=pr.fills&&pr.fills[i];
        if(fl)pushPoly(f,{fill:fl[0],op:fl[1]});
        else if(pr.tint)pushPoly(f,{fill:'#7c3aed',op:front?.06:.025});
        f.forEach((v,j)=>{const u=f[(j+1)%f.length];const key=[v,u].sort().join('|');
          const e=em.get(key)||{a:v,b:u,vis:false};e.vis=e.vis||front;em.set(key,e);});
      });
      em.forEach(e=>{
        const st=(pr.estyle&&pr.estyle(e.a,e.b))||{};
        pushSeg(e.a,e.b,{c:st.c||pr.c||C.edge,w:st.w||pr.w||2.4,pick:pr.pick?()=>pr.pick(e.a,e.b):null},!e.vis);
      });
    }
    else if(pr.t==='pt'){
      const p=pr.p||P[pr.id];const q=pj(p);const col=pr.c||C.ink;
      dots.push(<circle key={'d'+(kk++)} cx={q.x} cy={q.y} r={(pr.r||fs*.27)*(big>1?1.1:1)} fill={col} stroke="#fff" strokeWidth="1.5"/>);
      const label=pr.label===false?null:(pr.label||L(pr.id||''));
      if(label){
        let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
        if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
        const off=fs*(pr.off||1.0);
        lbls.push(<text key={'l'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
          fontFamily='"Times New Roman",Georgia,serif' fontStyle="italic" fontWeight="700" fontSize={fs*(pr.size||1)} fill={pr.lc||col}
          stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{label}</text>);
      }
    }
    else if(pr.t==='txt'){
      const q=pj(get(pr.p));let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
      if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
      const off=fs*(pr.off==null?.8:pr.off);
      lbls.push(<text key={'t'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
        fontFamily={pr.upright?'-apple-system,Segoe UI,Roboto,sans-serif':'"Times New Roman",Georgia,serif'} fontStyle={pr.upright?'normal':'italic'}
        fontWeight="700" fontSize={fs*(pr.size||1.1)} fill={pr.c||C.ink} stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{pr.s}</text>);
    }
  });
  polys.sort((a,b)=>b.dm-a.dm);

  return(
    <div ref={wrap} style={{position:'absolute',inset:0}}>
      <svg width={w} height={h} style={{position:'absolute',inset:0,touchAction:'none',cursor:drag.current?'grabbing':'grab',display:'block'}}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} onPointerLeave={()=>{if(!moved.current)drag.current=null;}}>
        <g>{polys.map(p=>p.el)}</g><g>{hid}</g><g>{vis}</g><g>{dots}</g><g>{lbls}</g><g>{hits}</g>
      </svg>
      {!bare&&<div className="tools">

        </button>
        <button className={'tool'+(auto?' on':'')} aria-label="Автообертання" title="Автообертання" onClick={()=>setAuto(a=>!a)}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3a9 9 0 0 1 0 18"/><path d="M17 16l3.5.5.5-3.5"/></svg>
        </button>
      </div>}
      {!bare&&<div className="hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v3"/><path d="M9 11a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h1a6 6 0 0 0 6-6v-2"/></svg>
        Тягни — обертай

      {legend&&<div className="legend">{legend.map((l,i)=><span key={i}><i className="dot" style={{background:l[0]}}/>{l[1]}</span>)}</div>}
    </div>
  );
}

const txtPl=(poly,i,s,c,lo)=>({t:'txt',p:poly[i],s,c,size:1.35,lo});

/* =====================================================================
   Пункт 1. Основні поняття. Аксіоми стереометрії (п. 27)
   ===================================================================== */
function scene1(tab,mode,theta,way){
  const P={},pr=[];
  if(tab==='A1'){
    const pl=rectPlane([0,0,0],[1,0,0],[0,1,0],2.6,1.9);
    Object.assign(P,{A:[-1.5,-1,0],B:[0.1,1.25,0],C:[1.7,-0.95,0]});
    P.M=mid(P.A,P.B);P.N=mid(P.B,P.C);
    pr.push(plane(pl,C.al),{t:'poly',p:['A','B','C'],fill:'#f59e0b',op:.22,stroke:C.edge,sw:2.4},
      {t:'seg',a:'A',b:'C',c:C.par,w:3.4},{t:'seg',a:'M',b:'N',c:C.par,w:4},
      ...vp(['A','B','C']),{t:'pt',id:'M',c:C.par},{t:'pt',id:'N',c:C.par},txtPl(pl,3,'α',C.al));
  }
  if(tab==='A2'){
    if(mode===0){
      Object.assign(P,{A:[-1.3,-0.8,-0.2],B:[1.2,-0.9,0.4],C:[0.3,1.3,0.9]});
      const pl=planeThrough(P.A,P.B,P.C,2.4,2.0);
      pr.push(plane(pl,C.al,.16),{t:'poly',p:['A','B','C'],fill:'#f59e0b',op:.25,stroke:C.edge,sw:2},...vp(['A','B','C'],C.skew),txtPl(pl,3,'α',C.al));
    }else{
      const d=nrm([1,0.35,0.2]);
      Object.assign(P,{A:mul(d,-1.4),B:mul(d,0.2),C:mul(d,1.5)});
      const p=nrm(cross(d,[0,0,1])),q=cross(d,p);
      [0,60,120].forEach((deg,i)=>{
        const e2=add(mul(p,Math.cos(rad(deg))),mul(q,Math.sin(rad(deg))));
        pr.push(plane(rectPlane([0,0,0],d,e2,2.6,1.5),['#2563eb','#ea580c','#16a34a'][i],.16));
      });
      pr.push({t:'seg',a:mul(d,-2.7),b:mul(d,2.7),c:C.ink,w:3},...vp(['A','B','C'],C.skew));
    }
  }
  if(tab==='A3'){
    const pl=rectPlane([0,0,0],[1,0,0],[0,1,0],2.6,1.9);
    pr.push(plane(pl,C.al,.15),txtPl(pl,3,'α',C.al));
    if(mode===0){
      Object.assign(P,{A:[-1.3,-0.5,0],B:[0.9,0.7,0]});
      const ab=sub(P.B,P.A);
      pr.push({t:'seg',a:sub(P.A,mul(ab,.55)),b:add(P.B,mul(ab,.6)),c:C.par,w:4},...vp(['A','B'],C.skew));
    }else{
      const K=[-0.8,-1.0,1.5],Lp=[1.0,1.0,-1.3],d=sub(Lp,K);
      const M=linePlane(K,d,[0,0,0],[0,0,1]);P.K=K;P.L=Lp;P.M=M;
      pr.push({t:'seg',a:K,b:Lp,c:C.ink,w:3.4},{t:'pt',id:'K',c:C.ink},{t:'pt',id:'M',c:C.skew,r:7});
    }
  }
  if(tab==='A4'){
    const th=rad(theta),e=[0,Math.cos(th),Math.sin(th)];
    const a=rectPlane([0,0,0],[1,0,0],[0,1,0],2.5,1.8),b=rectPlane([0,0,0],[1,0,0],e,2.5,1.8);
    P.M=[0.9,0,0];
    pr.push(plane(a,C.al,.15),plane(b,C.be,.17),{t:'seg',a:[-2.5,0,0],b:[2.5,0,0],c:C.skew,w:4.4},
      {t:'pt',id:'M',c:C.ink,r:7},txtPl(a,3,'α',C.al),txtPl(b,0,'β',C.be),{t:'txt',p:[-2.5,0,0],s:'c',c:C.skew,size:1.35,lo:[-1,.3]});
  }
  if(tab==='ways'){
    if(way===0){
      Object.assign(P,{A:[-1.3,-0.8,-0.2],B:[1.2,-0.9,0.4],C:[0.3,1.3,0.9]});
      const pl=planeThrough(P.A,P.B,P.C,2.4,2.0);
      pr.push(plane(pl,C.al,.16),{t:'poly',p:['A','B','C'],fill:'#f59e0b',op:.25,stroke:C.edge,sw:2},...vp(['A','B','C'],C.skew),txtPl(pl,3,'α',C.al));
    }
    if(way===1){
      const P1=[-2,-0.8,0.2],P2=[2,0.6,-0.2],K=[0.2,0.9,1.0];Object.assign(P,{K});
      const e1=nrm(sub(P2,P1)),e2=nrm(perp(sub(K,P1),e1));
      const pl=rectPlane(cen([P1,P2,K]),e1,e2,2.5,1.9);
      pr.push(plane(pl,C.al,.16),{t:'seg',a:P1,b:P2,c:C.ink,w:3.6},{t:'pt',id:'K',c:C.skew,r:7},
        {t:'txt',p:P2,s:'a',c:C.ink,size:1.35,lo:[1,0]},txtPl(pl,3,'α',C.al));
    }
    if(way===2){
      const O=[0.1,0.1,0.2],da=nrm([1,0.25,0.15]),db=nrm([-0.3,1,0.2]);P.O=O;
      const n=nrm(cross(da,db));const e2=nrm(cross(n,da));
      pr.push(plane(rectPlane(O,da,e2,2.6,2.0),C.al,.16),{t:'seg',a:sub(O,mul(da,2.3)),b:add(O,mul(da,2.3)),c:C.ink,w:3.6},
        {t:'seg',a:sub(O,mul(db,1.8)),b:add(O,mul(db,1.8)),c:C.ink,w:3.6},{t:'pt',id:'O',c:C.skew,r:7},
        {t:'txt',p:add(O,mul(da,2.3)),s:'a',c:C.ink,size:1.35,lo:[1,0]},{t:'txt',p:add(O,mul(db,1.8)),s:'b',c:C.ink,size:1.35,lo:[1,0]},
        txtPl(rectPlane(O,da,e2,2.6,2.0),3,'α',C.al));
    }
    if(way===3){
      const d=nrm([1,0.2,0.1]),a0=[0,-0.8,0],b0=[0.3,0.9,0.4];
      const nn=nrm(cross(d,sub(b0,a0))),e2=nrm(cross(nn,d));
      const pl=rectPlane(mid(a0,b0),d,e2,2.7,1.6);
      pr.push(plane(pl,C.al,.16),{t:'seg',a:sub(a0,mul(d,2.4)),b:add(a0,mul(d,2.4)),c:C.par,w:4},{t:'seg',a:sub(b0,mul(d,2.4)),b:add(b0,mul(d,2.4)),c:C.par,w:4},
        {t:'txt',p:add(a0,mul(d,2.4)),s:'a',c:C.par,size:1.35,lo:[1,0]},{t:'txt',p:add(b0,mul(d,2.4)),s:'b',c:C.par,size:1.35,lo:[1,0]},txtPl(pl,3,'α',C.al));
    }
  }
  return{P,prims:pr,R:3.1};
}
function Item1(){

function solidData(k){
  const zb=-0.95;
  if(k==='tet'){const P={D:[0.1,0.1,1.7],A:[-1.5,-1,zb],B:[1.5,-0.8,zb],C:[0.1,1.5,zb]};
    return{P,faces:[['A','B','C'],['D','A','B'],['D','B','C'],['D','C','A']],base:[0],lat:[1,2,3],ledges:[['D','A'],['D','B'],['D','C']],
      name:'Тетраедр DABC',info:'Трикутна піраміда називається тетраедром. Основа — трикутник ABC, вершина піраміди — D.'};}
  if(k==='pyr'){const P={S:[0.1,0.1,1.75],A:[-1.4,-1.3,zb],B:[1.4,-1.3,zb],C:[1.4,1.3,zb],D:[-1.4,1.3,zb]};
    return{P,faces:[['A','B','C','D'],['S','A','B'],['S','B','C'],['S','C','D'],['S','D','A']],base:[0],lat:[1,2,3,4],ledges:[['S','A'],['S','B'],['S','C'],['S','D']],
      name:'Піраміда SABCD',info:'Основа — чотирикутник ABCD. Бічні грані — трикутники зі спільною вершиною S.'};}
  if(k==='pri'){const h=[0.3,0.2,1.9];const P={A:[-1.5,-1.2,zb],B:[1.3,-1,zb],C:[0,1.4,zb]};['A','B','C'].forEach(v=>{P[v+'1']=add(P[v],h);});
    return{P,faces:[['A','B','C'],['A1','B1','C1'],['A','B','B1','A1'],['B','C','C1','B1'],['C','A','A1','C1']],base:[0,1],lat:[2,3,4],ledges:[['A','A1'],['B','B1'],['C','C1']],
      name:'Призма ABCA₁B₁C₁',info:'Основи — рівні трикутники ABC і A₁B₁C₁. Бічні грані — паралелограми. Бічні ребра AA₁, BB₁, CC₁ паралельні.'};}
  const mk=(P,name,info)=>({P,faces:BOXF,base:[0,1],lat:[2,3,4,5],ledges:[['A','A1'],['B','B1'],['C','C1'],['D','D1']],name,info});
  if(k==='par')return mk(paraP([-1.6,-1.1,-0.95],[2.4,0,0],[0.7,1.9,0],[0.5,0.3,1.85]),'Паралелепіпед ABCDA₁B₁C₁D₁','Чотирикутна призма, основою якої є паралелограм.');
  if(k==='box')return mk(boxP(1.4,1.05,0.95),'Прямокутний паралелепіпед','Усі грані — прямокутники.');
  return mk(boxP(1.05,1.05,1.05),'Куб ABCDA₁B₁C₁D₁','Усі грані — рівні квадрати.');
}
function Item2(){

  const E=new Set(d.faces.flatMap(f=>f.map((v,j)=>[v,f[(j+1)%f.length]].sort().join('|')))).size;
  const sols=[['tet','Тетраедр'],['pyr','Піраміда'],['pri','Призма'],['par','Паралелепіпед'],['box','Прямокутний паралелепіпед'],['cube','Куб']];

      <div className="grid3" style={{margin:'.5em 0'}}>{sols.map(([key,t])=><button key={key} className={'chip'+(sol===key?' on':'')} onClick={()=>setSol(key)} style={{fontSize:'.9em'}}>{t}</button>)}</div>

        <button className={'chip'+(sh.edges?' on':'')} onClick={()=>setSh({...sh,edges:!sh.edges})}><span className="cr">■</span> Бічні ребра</button>

    </div>}
    {tab==='task'&&<div className="fade">
      <Note>На ребрах <M>AA₁</M> і <M>DD₁</M> куба позначено точки <M>M</M> і <M>N</M>, причому <M>AM ≠ DN</M>. Побудуйте точку перетину прямої <M>MN</M> із площиною <M>ABC</M>.</Note>
      <Steps k={k} setK={setK} items={[
        <><M>M</M> і <M>N</M> лежать у площині <M>AA₁D₁</M>. За аксіомою А3 пряма <M>MN</M> лежить у цій площині.</>,
        <>Пряма <M>AD</M> також лежить у площині <M>AA₁D₁</M>. Оскільки <M>AM ≠ DN</M>, прямі <M>AD</M> і <M>MN</M> перетинаються. Нехай <M>X</M> — точка перетину.</>,
        <><M>X ∈ AD</M>, а <M>AD</M> лежить у площині <M>ABC</M>. Тому <M>X ∈ ABC</M>. Також <M>X ∈ MN</M>. Отже, <M>MN ∩ ABC = X</M>.</>]}/>
    </div>}
  </>);
  return <Frame left={left} scene={sc} camKey={tab} legend={tab==='task'?[[C.skew,'пряма MN'],[C.par,'пряма AD'],[C.al,'площина AA₁D₁'],[C.be,'площина ABC']]:null} yaw0={tab==='task'?1.0:0.6} pitch0={tab==='task'?0.38:0.45}/>;
}

/* =====================================================================
   Пункт 3. Взаємне розміщення двох прямих (п. 29)
   ===================================================================== */
const CUBE=boxP(1,1,1);
function Item3(){
  const [tab,setTab]=useState('cases');const [ex,setEx]=useState(0);const [sel,setSel]=useState(2);const [k,setK]=useState(0);
  const relCol={par:C.par,int:C.int,skew:C.skew};
  const exs=[null,{rel:'int',a:['A','B'],b:['A','A1'],t:'AB і AA₁'},{rel:'par',a:['A','B'],b:['D','C'],t:'AB і DC'},{rel:'skew',a:['A','A1'],b:['D','C'],t:'AA₁ і DC'}];
  let sc,legend=null;
  if(tab==='cases'){
    const pr=[],e=exs[ex];
    pr.push({t:'solid',faces:BOXF,tint:true,w:2.2,estyle:(a,b)=>e&&((a===e.a[0]&&b===e.a[1])||(b===e.a[0]&&a===e.a[1])||(a===e.b[0]&&b===e.b[1])||(b===e.b[0]&&a===e.b[1]))?{c:relCol[e.rel],w:5.2}:null});
    if(e&&e.rel==='par')pr.push({t:'poly',p:BOXF[0],fill:C.al,op:.22});
    if(e&&e.rel==='int')pr.push({t:'poly',p:BOXF[2],fill:C.al,op:.22});
    pr.push(...vp(Object.keys(CUBE)));
    sc={P:CUBE,prims:pr,R:2.7};
  }
  if(tab==='explore'){
    const s=BOXE[sel];
    sc={P:CUBE,R:2.7,prims:[{t:'solid',faces:BOXF,tint:true,w:3,
      pick:(a,b)=>{const i=BOXE.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));if(i>=0)setSel(i);},
      estyle:(a,b)=>{const r=relLines(CUBE[s[0]],CUBE[s[1]],CUBE[a],CUBE[b]);
        if(r==='same')return{c:C.gold,w:6};return{c:relCol[r],w:3.6};}},...vp(Object.keys(CUBE))]};
    legend=[[C.gold,'обране ребро'],[C.par,'паралельні'],[C.int,'перетинаються'],[C.skew,'мимобіжні']];
  }
  if(tab==='sign'){
    const P={D:[0.2,0.1,1.8],A:[-1.5,-1.1,-0.9],B:[1.4,-0.9,-0.9],C:[0.2,1.5,-0.9]};
    const pr=[{t:'solid',faces:[['A','B','C'],['D','A','B'],['D','B','C'],['D','C','A']],w:2.2}];
    const base=planeThrough(P.A,P.B,P.C,2.5,2.2);
    if(k>=1)pr.push(plane(base,C.al,.2),{t:'seg',a:'A',b:'B',c:C.al,w:5.2});
    if(k>=2)pr.push({t:'seg',a:'D',b:'C',c:C.be,w:5.2});
    if(k>=3)pr.push({t:'pt',id:'C',c:C.ink,r:7});
    if(k>=4){pr.push({t:'seg',a:'A',b:'B',c:C.skew,w:5.6},{t:'seg',a:'D',b:'C',c:C.skew,w:5.6});}
    pr.push(...vp(['A','B','C','D']));
    sc={P,prims:pr,R:3.0,ctr:[0,0,0.2]};
  }
  const cntSel=()=>{const s=BOXE[sel];const c={par:0,int:0,skew:0};BOXE.forEach(e=>{const r=relLines(CUBE[s[0]],CUBE[s[1]],CUBE[e[0]],CUBE[e[1]]);if(r!=='same')c[r]++;});return c;};
  const cnt=tab==='explore'?cntSel():null;
  const left=(<>
    <Tabs val={tab} set={t=>{setTab(t);setK(0);}} items={[['cases','Три випадки'],['explore','Дослідження'],['sign','Ознака мимобіжних']]}/>
    {tab==='cases'&&<div className="fade">
      <div className="note" style={{fontWeight:600}}>
        <span className="cv">Перетинаються</span> — мають тільки одну спільну точку.<br/>
        <span className="cg">Паралельні</span> — лежать в одній площині та не перетинаються.<br/>
        <span className="cr">Мимобіжні</span> — не лежать в одній площині.
      </div>
      <div className="chips">
        <button className={'chip'+(ex===1?' on':'')} onClick={()=>setEx(1)}><span className="cv">AB і AA₁</span></button>
        <button className={'chip'+(ex===2?' on':'')} onClick={()=>setEx(2)}><span className="cg">AB і DC</span></button>
        <button className={'chip'+(ex===3?' on':'')} onClick={()=>setEx(3)}><span className="cr">AA₁ і DC</span></button>
      </div>
      {ex===1&&<Note>Прямі перетинаються. Через них проходить єдина площина <M>ABB₁</M> (теорема 27.2).</Note>}
      {ex===2&&<Note>Прямі паралельні: <M>AB ∥ DC</M>. Через них проходить єдина площина <M>ABC</M> (теорема 29.1).</Note>}
      {ex===3&&<Note>Прямі мимобіжні. Спільних точок немає, площини, що містить обидві прямі, не існує.</Note>}
      {ex===0&&<Note>Обери пару прямих.</Note>}
    </div>}
    {tab==='explore'&&<div className="fade">
      <p className="lead">Обери ребро на кубі й подивись, як розміщені решта ребер.</p>
      <div className="grid4">{BOXE.map((e,i)=><button key={i} className={'chip'+(sel===i?' on':'')} onClick={()=>setSel(i)} style={{fontSize:'.85em',padding:'.1em .2em'}}>{eName(e)}</button>)}</div>
      <div className="cnt">
        <div><b className="cg">{cnt.par}</b>паралельних</div><div><b className="cv">{cnt.int}</b>перетинаються</div><div><b className="cr">{cnt.skew}</b>мимобіжних</div>
      </div>
    </div>}
    {tab==='sign'&&<div className="fade">
      <Box title="Ознака мимобіжних прямих">Якщо одна з двох прямих лежить у площині, а друга перетинає цю площину в точці, яка не належить першій прямій, то дані прямі є мимобіжними.</Box>
      <Note>Доведемо, що ребра <M>AB</M> і <M>DC</M> тетраедра <M>DABC</M> мимобіжні.</Note>
      <Steps k={k} setK={setK} label="Показати" items={[
        <><M>AB</M> лежить у площині <M>ABC</M>.</>,
        <>Пряма <M>DC</M> перетинає площину <M>ABC</M> у точці <M>C</M>.</>,
        <>Точка <M>C</M> не належить прямій <M>AB</M>.</>,
        <>За ознакою прямі <M>AB</M> і <M>DC</M> — <span className="cr">мимобіжні</span>.</>]}/>
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} yaw0={0.65} pitch0={0.42}/>;
}

/* =====================================================================
   Пункт 4. Паралельність прямої та площини (п. 30)
   ===================================================================== */
const FACES=[{k:0,t:'ABC'},{k:1,t:'A₁B₁C₁'},{k:2,t:'AA₁B'},{k:4,t:'DD₁C'},{k:5,t:'AA₁D'},{k:3,t:'BB₁C'}];
function Item4(){
  const [tab,setTab]=useState('cases');const [pl,setPl]=useState(0);const [sel,setSel]=useState(4);const [k,setK]=useState(0);
  const [th,setTh]=useState('30.2');const [yb,setYb]=useState(0.8);const [tilt,setTilt]=useState(50);
  const relCol={par:C.par,int:C.int,in:C.inn};
  let sc,legend=null;
  if(tab==='cases'){

    const big=f.map(p=>add(c0,mul(sub(p,c0),1.3)));
    const rel=(e)=>relLinePlane(CUBE[e[0]],CUBE[e[1]],f[0],f[1],f[2]);
    sc={P:CUBE,R:2.8,prims:[plane(big,C.al,.17),{t:'solid',faces:BOXF,tint:true,w:3,
      pick:(a,b)=>{const i=BOXE.findIndex(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));if(i>=0)setSel(i);},
      estyle:(a,b)=>{const r=rel([a,b]);const s=BOXE[sel];const isSel=(s[0]===a&&s[1]===b)||(s[0]===b&&s[1]===a);return{c:relCol[r],w:isSel?6.4:3.4};}},
      ...vp(Object.keys(CUBE)),txtPl(big,3,'α',C.al)]};
    legend=[[C.inn,'лежить у площині'],[C.int,'перетинає'],[C.par,'паралельна']];
  }
  if(tab==='sign'){
    const pr=[{t:'solid',faces:BOXF,tint:true,w:2.2}];
    const base=rectPlane([0,0,-1],[1,0,0],[0,1,0],1.5,1.5);
    if(k>=1)pr.push({t:'seg',a:'A1',b:'B1',c:C.par,w:5.4},{t:'seg',a:'A',b:'B',c:C.par,w:5.4});
    if(k>=2)pr.push(plane(base,C.al,.2),txtPl(base,3,'α',C.al));
    if(k>=3)pr.push({t:'seg',a:'A1',b:'B1',c:C.par,w:7});
    pr.push(...vp(Object.keys(CUBE)));
    sc={P:CUBE,prims:pr,R:2.8};
    legend=k>=1?[[C.par,'A₁B₁ ∥ AB']]:null;
  }
  if(tab==='cond'){
    const P={},pr=[];
    if(th==='30.2'){
      const al=rectPlane([0,0.3,0],[1,0,0],[0,1,0],2.4,2.2);
      const A1=[-2.4,-1,1.3],A2=[2.4,-1,1.3],B1=[-2.4,yb,0],B2=[2.4,yb,0];
      pr.push(plane(al,C.al,.16),plane([A1,A2,B2,B1],C.be,.22),{t:'seg',a:A1,b:A2,c:C.par,w:4.6},{t:'seg',a:B1,b:B2,c:C.par,w:4.6},
        txtPl(al,3,'α',C.al),txtPl([A1,A2,B2,B1],0,'β',C.be),{t:'txt',p:A2,s:'a',c:C.par,size:1.4,lo:[1,0]},{t:'txt',p:B2,s:'b',c:C.par,size:1.4,lo:[1,0]});
    }
    if(th==='30.3'){
      const p=rad(tilt),h=1.2*Math.tan(p);
      const a1=[-2.3,-1.2,0],a2=[2.3,-1.2,0],b1=[-2.3,1.2,0],b2=[2.3,1.2,0],c1=[-2.3,0,h],c2=[2.3,0,h];
      pr.push(plane([a1,a2,c2,c1],C.al,.2),plane([b1,b2,c2,c1],C.be,.2),{t:'seg',a:a1,b:a2,c:C.par,w:4.4},{t:'seg',a:b1,b:b2,c:C.par,w:4.4},{t:'seg',a:c1,b:c2,c:C.par,w:4.4},
        {t:'txt',p:a2,s:'a',c:C.par,size:1.4,lo:[1,.2]},{t:'txt',p:b2,s:'b',c:C.par,size:1.4,lo:[1,.2]},{t:'txt',p:c2,s:'c',c:C.par,size:1.4,lo:[1,0]},
        {t:'txt',p:mid(mid(a1,c1),mid(a2,c2)),s:'α',c:C.al,size:1.4,lo:[-1,-.2]},{t:'txt',p:mid(mid(b1,c1),mid(b2,c2)),s:'β',c:C.be,size:1.4,lo:[1,-.2]});
      P.z=[0,0,0];
    }
    if(th==='30.4'){
      const ls=[[-1.3,-0.6,'a'],[1.3,-0.2,'b'],[0,1.4,'c']];
      ls.forEach(([y,z,n])=>{pr.push({t:'seg',a:[-2.4,y,z],b:[2.4,y,z],c:C.par,w:4.6},{t:'txt',p:[2.4,y,z],s:n,c:C.par,size:1.4,lo:[1,0]});});
    }
    sc={P,prims:pr,R:3.2,ctr:[0,0,0.4]};
  }
  const s=BOXE[sel];
  const r0=relLinePlane(CUBE[s[0]],CUBE[s[1]],...BOXF[FACES[pl].k].slice(0,3).map(v=>CUBE[v]));
  const left=(<>
    <Tabs val={tab} set={t=>{setTab(t);setK(0);}} items={[['cases','Три випадки'],['sign','Ознака'],['cond','Теореми 30.2–30.4']]}/>
    {tab==='cases'&&<div className="fade">
      <Box title="Означення">Пряму та площину називають паралельними, якщо вони не мають спільних точок.</Box>
      <Note>Пряма <M>{eName(s)}</M> {r0==='par'&&<>— <span className="cg">паралельна</span> площині <M>{FACES[pl].t}</M>.</>}{r0==='int'&&<>— <span className="cv">перетинає</span> площину <M>{FACES[pl].t}</M> в одній точці.</>}{r0==='in'&&<>— <span className="cb">лежить</span> у площині <M>{FACES[pl].t}</M>.</>}</Note>
      <p className="lead" style={{marginBottom:0}}>Площина:</p>
      <div className="grid3" style={{margin:'.35em 0'}}>{FACES.map((f,i)=><button key={i} className={'chip'+(pl===i?' on':'')} onClick={()=>setPl(i)} style={{fontSize:'.9em'}}>{f.t}</button>)}</div>
      <p className="lead" style={{marginBottom:0}}>Пряма — клікни ребро куба:</p>
      <div className="grid4" style={{margin:'.35em 0'}}>{BOXE.map((e,i)=><button key={i} className={'chip'+(sel===i?' on':'')} onClick={()=>setSel(i)} style={{fontSize:'.8em',padding:'.1em .1em'}}>{eName(e)}</button>)}</div>
    </div>}
    {tab==='sign'&&<div className="fade">
      <Box title="Ознака паралельності прямої та площини">Якщо пряма, яка не належить даній площині, паралельна якій-небудь прямій, що лежить у цій площині, то дана пряма паралельна самій площині.</Box>
      <Steps k={k} setK={setK} label="Приклад на кубі" items={[
        <>Прямі <M>A₁B₁</M> і <M>AB</M> містять протилежні сторони квадрата <M>ABB₁A₁</M>, тому <span className="cg"><M>A₁B₁ ∥ AB</M></span>.</>,
        <><M>AB</M> лежить у площині <M>ABC</M>, а <M>A₁B₁</M> у цій площині не лежить.</>,
        <>За ознакою <span className="cg"><M>A₁B₁ ∥ ABC</M></span>.</>]}/>
    </div>}
    {tab==='cond'&&<div className="fade">
      <div className="chips">{[['30.2','Теорема 30.2'],['30.3','Теорема 30.3'],['30.4','Теорема 30.4']].map(([key,t])=><button key={key} className={'chip'+(th===key?' on':'')} onClick={()=>setTh(key)}>{t}</button>)}</div>
      {th==='30.2'&&<div className="fade"><Box title="Теорема 30.2">Якщо площина проходить через дану пряму, паралельну другій площині, та перетинає цю площину, то пряма перетину площин паралельна даній прямій.</Box>
        <Slider label="Положення прямої b" min={-0.8} max={1.8} step={0.1} val={yb} set={setYb} unit=""/>
        <Note><M>a ∥ α</M>, <M>a ⊂ β</M>, <M>β ∩ α = b</M> ⇒ <span className="cg"><M>b ∥ a</M></span>.</Note></div>}
      {th==='30.3'&&<div className="fade"><Box title="Теорема 30.3">Якщо через кожну з двох паралельних прямих проведено площину, причому ці площини перетинаються по прямій, відмінній від двох даних, то ця пряма паралельна кожній із двох даних прямих.</Box>
        <Slider label="Нахил площин" min={25} max={75} step={5} val={tilt} set={setTilt}/>
        <Note><M>a ∥ b</M>, <M>a ⊂ α</M>, <M>b ⊂ β</M>, <M>α ∩ β = c</M> ⇒ <span className="cg"><M>c ∥ a</M>, <M>c ∥ b</M></span>.</Note></div>}
      {th==='30.4'&&<div className="fade"><Box title="Теорема 30.4">Дві прямі, паралельні третій прямій, паралельні між собою.</Box>
        <Note><M>a ∥ c</M>, <M>b ∥ c</M> ⇒ <span className="cg"><M>a ∥ b</M></span>.</Note></div>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} yaw0={0.6} pitch0={0.4}/>;

/* =====================================================================
   Пункт 5. Паралельність площин (п. 31)
   ===================================================================== */
function Item5(){
  const [tab,setTab]=useState('sign');const [k,setK]=useState(0);const [th,setTh]=useState('31.3');
  const [phi,setPhi]=useState(35);const [hh,setHh]=useState(1.4);const [tau,setTau]=useState(30);
  const BX=boxP(1.5,1.1,1.0);
  let sc,legend=null,val={};
  if(tab==='sign'){
    const pr=[{t:'solid',faces:BOXF,tint:true,w:2.2,fills:k>=3?{2:[C.al,.26],4:[C.be,.26]}:null}];

    sc={P:BX,prims:pr,R:2.9};
    legend=k>=1?(k>=2?[[C.par,'AA₁ ∥ DD₁'],[C.gold,'AB ∥ DC']]:[[C.par,'AA₁ ∥ DD₁']]):null;

    const u=[Math.cos(rad(phi)),Math.sin(rad(phi)),0];const P0=[0,0,-1],P1=[0.7,-0.3,1];
    const g=[add(P0,mul(u,1.8)),add(P0,mul(u,-1.8)),add(P1,mul(u,-1.8)),add(P1,mul(u,1.8))];

    val={ab:len(dv),aa:len(sub(P.A1,P.A))};
    legend=[[C.par,'AB і A₁B₁ — паралельні відрізки'],[C.gold,'AA₁ = BB₁']];
  }
  const left=(<>
    <Tabs val={tab} set={t=>{setTab(t);setK(0);}} items={[['sign','Ознака'],['prop','Властивості'],['seg','Відрізки між площинами']]}/>
    {tab==='sign'&&<div className="fade">
      <Box title="Означення">Дві площини називають паралельними, якщо вони не мають спільних точок.</Box>
      <Box title="Теорема 31.1 (ознака)">Якщо дві прямі, що перетинаються, однієї площини паралельні відповідно двом прямим другої площини, то ці площини паралельні.</Box>
      <Steps k={k} setK={setK} label="Приклад на паралелепіпеді" items={[

        <><span className="ca"><M>AB ∥ DC</M></span>.</>,
        <><M>AA₁</M> і <M>AB</M> перетинаються й лежать у площині <M>AA₁B</M>; <M>DD₁</M> і <M>DC</M> перетинаються й лежать у площині <M>DD₁C</M>. Тому <span className="cb"><M>AA₁B</M></span> <b>∥</b> <span className="co"><M>DD₁C</M></span>.</>]}/>
    </div>}
    {tab==='prop'&&<div className="fade">

    {tab==='seg'&&<div className="fade">

/* =====================================================================
   Пункт 6. Паралельне проектування (п. 32)
   ===================================================================== */
function Item6(){
  const [tab,setTab]=useState('proj');const [fig,setFig]=useState('tri');const [pp,setPp]=useState('p1');
  const [phi,setPhi]=useState(40);const [tau,setTau]=useState(35);
  const z0=-1.6,ph=rad(phi),ta=rad(tau);
  const d=[Math.sin(ta)*Math.cos(ph),Math.sin(ta)*Math.sin(ph),-Math.cos(ta)];
  const pjp=p=>add(p,mul(d,(z0-p[2])/d[2]));
  const al=rectPlane([0,0,z0],[1,0,0],[0,1,0],3.4,2.6);
  const pr=[plane(al,C.al,.13),txtPl(al,3,'α',C.al)];const P={};
  const inPlane=Math.abs(d[1])<0.03;
  let info=null,c0=[0,0,0.9],legend=[[C.ink,'фігура F'],[C.proj,'проекція F₁'],[C.proj,'промені ∥ l']];
  const both=(id,p)=>{P[id]=p;P[id+'p']=pjp(p);};
  const ray=id=>({t:'seg',a:id,b:id+'p',c:C.proj,w:1.8,dash:true});
  const dotO=id=>({t:'pt',id,c:C.ink});
  const lab1=id=>({t:'pt',id:id+'p',label:id+'₁',c:C.proj});

  if(tab==='proj'){
    if(fig==='seg'){
      both('A',[-1.3,0,0.2]);both('B',[1.2,0,1.3]);
      pr.push({t:'seg',a:'Ap',b:'Bp',c:C.proj,w:5},{t:'seg',a:'A',b:'B',c:C.ink,w:4.4},ray('A'),ray('B'),dotO('A'),dotO('B'),lab1('A'),lab1('B'));
      info='Проекція відрізка — відрізок.';
    }
    if(fig==='tri'){
      ['A','B','C'].forEach((id,i)=>both(id,[[-1.2,0,0.1],[1.2,0,0.3],[0.1,0,1.9]][i]));
      pr.push({t:'poly',p:['Ap','Bp','Cp'],fill:C.proj,op:.3,stroke:C.proj,sw:3},{t:'poly',p:['A','B','C'],fill:C.al,op:.25,stroke:C.ink,sw:2.6});
      ['A','B','C'].forEach(id=>{pr.push(ray(id),dotO(id),lab1(id));});
      info=inPlane?null:'Проекція трикутника — трикутник.';
    }
    if(fig==='sq'){
      ['A','B','C','D'].forEach((id,i)=>both(id,[[-1,0,0.2],[1,0,0.2],[1,0,2.2],[-1,0,2.2]][i]));
      pr.push({t:'poly',p:['Ap','Bp','Cp','Dp'],fill:C.proj,op:.3,stroke:C.proj,sw:3},{t:'poly',p:['A','B','C','D'],fill:C.al,op:.25,stroke:C.ink,sw:2.6});
      ['A','B','C','D'].forEach(id=>{pr.push(ray(id),dotO(id),lab1(id));});
      info=inPlane?null:'Проекція квадрата — паралелограм.';c0=[0,0,1.2];
    }
    if(fig==='circ'){
      const ring=[],ringP=[];for(let i=0;i<48;i++){const a=i/48*2*Math.PI;const p=[Math.cos(a),0,1.1+Math.sin(a)];ring.push(p);ringP.push(pjp(p));}
      pr.push({t:'poly',p:ringP,fill:C.proj,op:.3,stroke:C.proj,sw:3},{t:'poly',p:ring,fill:C.al,op:.25,stroke:C.ink,sw:2.6});
      for(let i=0;i<48;i+=6)pr.push({t:'seg',a:ring[i],b:ringP[i],c:C.proj,w:1.8,dash:true});
      info=inPlane?null:'Проекція кола — еліпс.';c0=[0,0,1.1];
    }
    if(fig==='cube'){
      const B=boxP(.9,.9,.9);const mv={};Object.keys(B).forEach(k=>{mv[k]=add(B[k],[0,0,0.1]);P[k]=mv[k];P[k+'p']=pjp(mv[k]);});
      pr.push({t:'solid',faces:BOXF,tint:true,w:2.6});
      BOXE.forEach(e=>pr.push({t:'seg',a:e[0]+'p',b:e[1]+'p',c:C.proj,w:3.6}));
      Object.keys(B).forEach(k=>pr.push({t:'seg',a:k,b:k+'p',c:C.proj,w:1.5,dash:true}));
      info='Зображення куба на площині α.';c0=[0,0,0.1];
    }
    if(inPlane&&fig!=='seg'&&fig!=='cube')info='Пряма l паралельна площині фігури — проекція є відрізком.';
  }
  if(tab==='props'){
    const A=[-1.3,0,0.2],B=[1.1,0,1.2];
    if(pp==='p1'){both('A',A);both('B',B);
      pr.push({t:'seg',a:'Ap',b:'Bp',c:C.proj,w:5},{t:'seg',a:'A',b:'B',c:C.ink,w:4.4},ray('A'),ray('B'),dotO('A'),dotO('B'),lab1('A'),lab1('B'));}
    if(pp==='p2'){
      const Cc=add(A,[0.4,1.3,0.8]),Dd=add(Cc,mul(sub(B,A),0.6));both('A',A);both('B',B);both('C',Cc);both('D',Dd);
      pr.push({t:'seg',a:'A',b:'B',c:C.par,w:4.4},{t:'seg',a:'C',b:'D',c:C.par,w:4.4},{t:'seg',a:'Ap',b:'Bp',c:C.par,w:5},{t:'seg',a:'Cp',b:'Dp',c:C.par,w:5});
      ['A','B','C','D'].forEach(id=>{pr.push(ray(id),dotO(id),lab1(id));});c0=[0,0.6,0.8];
    }
    if(pp==='p3'){
      const Mm=lerp(A,B,2/3);both('A',A);both('B',B);both('M',Mm);
      pr.push({t:'seg',a:'Ap',b:'Bp',c:C.proj,w:5},{t:'seg',a:'A',b:'B',c:C.ink,w:4.4});
      ['A','M','B'].forEach(id=>{pr.push(ray(id),dotO(id),lab1(id));});
    }
  }
  /* стрілка напрямку l */
  const st=add(c0,mul(d,-2.4)),en=add(c0,mul(d,-1.4));
  pr.push({t:'seg',a:st,b:en,c:C.skew,w:4,arrow:true},{t:'txt',p:st,s:'l',c:C.skew,size:1.5,lo:[-1,-.4]});

  const pP=(id)=>P[id+'p'];
  let p2txt=null,p3txt=null;
  if(tab==='props'&&pp==='p2'){const u=sub(pP('B'),pP('A')),v=sub(pP('D'),pP('C'));p2txt=len(cross(u,v))<1e-6?'Проекції лежать на одній прямій.':'A₁B₁ ∥ C₁D₁';}
  if(tab==='props'&&pp==='p3'){const a=len(sub(pP('M'),pP('A'))),b=len(sub(pP('B'),pP('M')));p3txt={a,b,r:a/b};}

  const left=(<>
    <Tabs val={tab} set={setTab} items={[['proj','Проекція фігури'],['props','Властивості']]}/>
    {tab==='proj'&&<div className="fade">
      <Box title="Паралельне проектування">Через кожну точку фігури <M>F</M> проводимо пряму, паралельну прямій <M>l</M>. Точки перетину цих прямих із площиною <M>α</M> утворюють фігуру <M>F₁</M> — паралельну проекцію <M>F</M>.</Box>
      <div className="chips">{[['seg','Відрізок'],['tri','Трикутник'],['sq','Квадрат'],['circ','Коло'],['cube','Куб']].map(([k,t])=><button key={k} className={'chip'+(fig===k?' on':'')} onClick={()=>setFig(k)}>{t}</button>)}</div>
    </div>}
    {tab==='props'&&<div className="fade">
      <div className="chips">{[['p1','Теорема 32.1'],['p2','Теорема 32.2'],['p3','Теорема 32.3']].map(([k,t])=><button key={k} className={'chip'+(pp===k?' on':'')} onClick={()=>setPp(k)}>{t}</button>)}</div>
      {pp==='p1'&&<Box title="Теорема 32.1">Паралельною проекцією прямої є пряма; паралельною проекцією відрізка є відрізок.</Box>}
      {pp==='p2'&&<><Box title="Теорема 32.2">Паралельною проекцією двох паралельних прямих є або пряма, або дві паралельні прямі.</Box><Note><span className="cg">{p2txt}</span></Note></>}
      {pp==='p3'&&<><Box title="Теорема 32.3">Відношення паралельних проекцій відрізків, які лежать на одній прямій або на паралельних прямих, дорівнює відношенню самих відрізків.</Box>
        <Note><M>AM : MB = 2 : 1</M><br/><M>A₁M₁</M> = {fmt(p3txt.a)}, <M>M₁B₁</M> = {fmt(p3txt.b)}<br/><b><M>A₁M₁ : M₁B₁</M> = {fmt(p3txt.r)} : 1</b></Note></>}
    </div>}
    <Slider label="Напрям l (обертання)" min={0} max={355} step={5} val={phi} set={setPhi}/>
    <Slider label="Нахил l до площини" min={10} max={70} step={5} val={tau} set={setTau}/>
    {tab==='proj'&&fig!=='cube'&&fig!=='seg'&&<button className="btn sm" onClick={()=>setPhi(0)}>l ∥ площині фігури</button>}
    {tab==='proj'&&info&&<Note>{info}</Note>}
  </>);
  return <Frame left={left} scene={{P,prims:pr,R:4.3,ctr:[0,0,0.6]}} legend={legend} yaw0={0.55} pitch0={0.32}/>;
}

      {t:'txt',p:mid(Cc,C1),s:'5 см',c:C.par,upright:true,size:1,lo:[1.3,0]},{t:'txt',p:mid(B,B1),s:'?',c:C.skew,upright:true,size:1.3,lo:[1.3,0]}]};
  }
  if(ti===3){
    const A=[-1.8,-0.9,0],B=[0.4,-1.2,0],Cc=[-0.6,1.0,0],dv=[1.6,0.8,2.2];
    const P={A,B,C:Cc,A1:add(A,dv),B1:add(B,dv),C1:add(Cc,dv)};
    const al=rectPlane([0,0,0],[1,0,0],[0,1,0],3.1,2.3),be=rectPlane([0.8,0.4,2.2],[1,0,0],[0,1,0],3.1,2.3);
    sc={P,R:3.8,ctr:[0.5,0,1.1],prims:[plane(al,C.al,.16),plane(be,C.be,.16),txtPl(al,3,'α',C.al),txtPl(be,3,'β',C.be),
      {t:'poly',p:['A','B','C'],fill:C.al,op:.3,stroke:C.al,sw:3},{t:'poly',p:['A1','B1','C1'],fill:C.be,op:.3,stroke:C.be,sw:3},
      {t:'seg',a:'A',b:'A1',c:C.par,w:3.4},{t:'seg',a:'B',b:'B1',c:C.par,w:3.4},{t:'seg',a:'C',b:'C1',c:C.par,w:3.4},...vp(['A','B','C','A1','B1','C1'])]};
  }
  if(ti===4){
    const z0=-1.6,dd=[0.3,0.5,-1],pjp=p=>add(p,mul(dd,(z0-p[2])/dd[2]));
    const A=[-1.8,-0.6,0.9],Cc=[2.0,0.7,1.8],B=lerp(A,Cc,8/14);
    const P={A,B,C:Cc,A1:pjp(A),B1:pjp(B),C1:pjp(Cc)};
    const al=rectPlane([0,0,z0],[1,0,0],[0,1,0],3.4,2.4);
    sc={P,R:3.6,ctr:[0,0,0.2],prims:[plane(al,C.al,.15),txtPl(al,3,'α',C.al),{t:'seg',a:'A',b:'C',c:C.ink,w:4.2},{t:'seg',a:'A1',b:'C1',c:C.proj,w:5},
      ...['A','B','C'].map(id=>({t:'seg',a:id,b:id+'1',c:C.proj,w:1.8,dash:true})),...vp(['A','B','C']),
      ...['A1','B1','C1'].map(id=>({t:'pt',id,c:C.proj})),
      {t:'txt',p:mid(A,B),s:'8 см',c:C.ink,upright:true,size:.95,lo:[0,-1.2]},{t:'txt',p:mid(B,Cc),s:'6 см',c:C.ink,upright:true,size:.95,lo:[0,-1.2]},
      {t:'txt',p:mid(P.A1,P.B1),s:'12 см',c:C.proj,upright:true,size:.95,lo:[0,1.3]},{t:'txt',p:mid(P.B1,P.C1),s:'?',c:C.skew,upright:true,size:1.3,lo:[0,1.3]}]};
  }

  /* ---------- інтерфейс ---------- */
  const tabs=<div className="tabs">{[0,1,2,3,4].map(i=><button key={i} className={'tab sq'+(ti===i?' on':'')+(done[i]?' done':'')} onClick={()=>setTi(i)}>{done[i]?'✓ ':''}{i+1}</button>)}</div>;
  const allAns=tbl.every(x=>x);const allOk=chk&&tbl.every((x,i)=>x===right1[i]);
  const names={int:'Перетинаються',par:'Паралельні',skew:'Мимобіжні'};
  const choose=(i)=>{
    if(done[ti]||wrong[ti].includes(i))return;
    if(i===T[ti].ok){const d=[...done];d[ti]=true;setDone(d);}
    else{const w=wrong.map(x=>[...x]);w[ti].push(i);setWrong(w);}
  };
  const left=(<>
    {tabs}
    {ti===0&&<div className="fade">
      <Note>Дано прямокутний паралелепіпед <M>ABCDA₁B₁C₁D₁</M>. Укажіть взаємне розміщення прямих.</Note>
      <table className="qtable"><tbody>{pairs.map((p,i)=>{

          <tr className={row===i?'act':''} onClick={()=>setRow(i)}><td><M>{p[2]}</M></td><td></td><td>{good?<span className="cg">✓</span>:bad?<span className="cr">✗</span>:''}</td></tr>
          <tr><td colSpan="3" style={{background:'transparent',padding:'0 0 .2em'}}><div className="seg3">{['int','par','skew'].map(v=>
            <button key={v} className={tbl[i]===v?(good?'ok':bad?'bad':'on'):''} onClick={()=>{const t=[...tbl];t[i]=v;setTbl(t);setChk(false);setRow(i);}}>{names[v]}</button>)}</div></td></tr>
        </React.Fragment>);})}</tbody></table>
      <button className="btn" disabled={!allAns} onClick={()=>{setChk(true);if(tbl.every((x,i)=>x===right1[i])){const d=[...done];d[0]=true;setDone(d);}}}>Перевірити відповіді</button>
      {allOk&&<div className="fb ok">Усі відповіді правильні!</div>}
      {chk&&!allOk&&<div className="fb bad">Є помилки. Виправ відповіді з позначкою ✗.</div>}
    </div>}
    {ti>=1&&<div className="fade">
      <Note>{T[ti].q}</Note>
      {T[ti].opts.map((o,i)=>{
        const isOk=done[ti]&&i===T[ti].ok,isBad=wrong[ti].includes(i);
        return <button key={i} className={'opt'+(isOk?' ok':isBad?' bad':'')} disabled={isBad} onMouseEnter={()=>ti===1&&setHov(i)} onMouseLeave={()=>ti===1&&setHov(null)}
          onFocus={()=>ti===1&&setHov(i)} onClick={()=>{choose(i);if(ti===1)setHov(i);}}><b>{'АБВГД'[i]}</b><span>{o}</span></button>;})}
      {done[ti]&&<div className="fb ok">Правильно! <span style={{fontWeight:600}}>{T[ti].ex}</span></div>}
      {!done[ti]&&wrong[ti].length>0&&<div className="fb bad">Неправильно. Спробуй інший варіант.</div>}

      {done.every(Boolean)&&ti===4&&<div className="fb ok">Усі завдання виконано правильно!</div>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} yaw0={0.6} pitch0={0.4}/>;
}

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper'), modeEl = document.getElementById('pm-mode');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var LABEL = { pen: '✏️ Пишу', eraser: '🧽 Стираю', paper: '⬜ Малюю біле поле' };
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
    modeEl.textContent = st.tool ? LABEL[st.tool] : '👆 Керую уроком';
    modeEl.className = st.tool ? 'm-' + st.tool : '';
    modeEl.id = 'pm-mode';
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    var el = mkSheet(sx(), sy(), document.documentElement.clientWidth, document.documentElement.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'pen') setTool(st.tool === 'pen' ? null : 'pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? null : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? null : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); if (st.tool !== 'pen') st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); });
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ (кінець) ===================== -->
</body>
