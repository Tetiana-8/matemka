<style>

.start{background:var(--panelLeft)}

@media(min-width:768px){.start h1{font-size:2.6em}}
.go{display:flex;align-items:center;gap:.9em;background:#fff;border:1px solid #e9d5ff;border-radius:999px;padding:.55em .6em .55em 1.4em;color:#581c87;font:inherit;font-weight:800;
  letter-spacing:.14em;cursor:pointer;box-shadow:0 2px 10px rgba(88,28,135,.1);animation:pop .5s ease both}
.go i{width:2.2em;height:2.2em;border-radius:50%;background:#f3e8ff;display:grid;place-items:center;font-style:normal;font-size:.8em}
.menu{position:absolute;inset:0;overflow-y:auto;padding:1em max(16px,env(safe-area-inset-left,0px)) 5em;background:var(--panelLeft)}
.menu h2{margin:.1em 0 .7em;font-size:1.25em;color:var(--brand)}
.mgrid{display:grid;grid-template-columns:1fr;gap:.7em;max-width:70em;margin:0 auto}
@media(min-width:768px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;align-items:center;gap:.9em;background:var(--panelRight);border:1px solid #e2e8f0;border-radius:.9em;padding:.8em 1em;cursor:pointer;
  text-align:left;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;min-height:56px}
.mcard:hover{border-color:#c084fc;background:#faf5ff;box-shadow:0 3px 12px rgba(107,33,168,.1)}

.mcard b{display:block;line-height:1.2}.mcard small{color:var(--muted);font-weight:600}
.clk{font:inherit;font-weight:800;background:none;border:0;border-bottom:2px dashed currentColor;border-radius:.2em;cursor:pointer;padding:0 .08em;line-height:1.35;text-align:left}
.clk.on{background:#fef9c3;border-bottom-style:solid}
.sign{flex:none;text-align:center;padding:.35em .5em;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:.78em;color:#64748b;letter-spacing:.02em}
.sign b{color:#1e293b}
svg text{user-select:none;-webkit-user-select:none}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext } = React;

/* ---------- векторна алгебра ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.sqrt(dot(a,a));
const nrm=a=>{const l=len(a)||1;return mul(a,1/l);};
const lerp=(a,b,t)=>add(mul(a,1-t),mul(b,t));
const mid=(a,b)=>lerp(a,b,.5);
const cen=arr=>mul(arr.reduce(add,[0,0,0]),1/arr.length);
const rad=d=>d*Math.PI/180;
const L=id=>String(id).replace(/1$/,'₁');
const rectPlane=(Cn,e1,e2,hw,hh)=>[
  add(Cn,add(mul(e1,hw),mul(e2,hh))),add(Cn,add(mul(e1,-hw),mul(e2,hh))),
  add(Cn,add(mul(e1,-hw),mul(e2,-hh))),add(Cn,add(mul(e1,hw),mul(e2,-hh)))];
const planeThrough=(P1,P2,P3,hw,hh)=>{
  const e1=nrm(sub(P2,P1));const n=cross(sub(P2,P1),sub(P3,P1));const e2=nrm(cross(n,e1));
  return rectPlane(cen([P1,P2,P3]),e1,e2,hw,hh);};

/* взаємне розміщення двох прямих */
function relLines(a1,a2,b1,b2){
  const d1=sub(a2,a1),d2=sub(b2,b1),c=cross(d1,d2);
  if(len(c)<1e-9) return len(cross(d1,sub(b1,a1)))<1e-9?'same':'par';
  return Math.abs(dot(sub(b1,a1),c))<1e-9?'int':'skew';
}

/* ---------- кольори ---------- */
const C={edge:'#334155',ink:'#0f172a',par:'#16a34a',int:'#7e22ce',skew:'#dc2626',inn:'#2563eb',
  al:'#2563eb',be:'#ea580c',ga:'#7e22ce',gold:'#d97706',proj:'#ea580c',teal:'#0d9488',halo:'#FAF5FF'};
const relCol={par:C.par,int:C.int,skew:C.skew};
const relName={par:'Паралельні',int:'Перетинаються',skew:'Мимобіжні'};

/* ---------- прості будівельники фігур ---------- */
const boxP=(hx,hy,hz,sx=0,sy=0)=>({
  A:[-hx,-hy,-hz],B:[hx,-hy,-hz],C:[hx,hy,-hz],D:[-hx,hy,-hz],
  A1:[-hx+sx,-hy+sy,hz],B1:[hx+sx,-hy+sy,hz],C1:[hx+sx,hy+sy,hz],D1:[-hx+sx,hy+sy,hz]});
const BOXF=[['A','B','C','D'],['A1','B1','C1','D1'],['A','B','B1','A1'],['B','C','C1','B1'],['C','D','D1','C1'],['D','A','A1','D1']];
const BOXE=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
const plane=(p,color,op=.14,sw=1.6)=>({t:'poly',p,fill:color,op,stroke:color,sw});
const vp=(ids,c)=>ids.map(id=>({t:'pt',id,c:c||C.ink}));
const sameEdge=(e,a,b)=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a);

/* ---------- 3D-сцена (SVG, обертання мишею/пальцем) ---------- */
function Scene3D({scene,yaw0=0.7,pitch0=0.42,auto0=false,bare=false,legend=null}){
  const wrap=useRef(null);
  const [sz,setSz]=useState({w:600,h:500});
  const [cam,setCam]=useState({yaw:yaw0,pitch:pitch0});
  const [auto,setAuto]=useState(auto0);
  const drag=useRef(null),moved=useRef(false);

  useEffect(()=>{
    const el=wrap.current;
    const upd=()=>setSz({w:el.clientWidth||600,h:el.clientHeight||500});
    const ro=new ResizeObserver(upd);ro.observe(el);upd();
    return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    if(!auto)return;let raf,last=performance.now();
    const tick=t=>{const dt=t-last;last=t;
      if(!drag.current)setCam(c=>({...c,yaw:c.yaw+dt*0.0005}));
      raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[auto]);

  const onDown=e=>{drag.current={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,id:e.pointerId};moved.current=false;};
  const onMove=e=>{
    const d=drag.current;if(!d)return;
    if(!moved.current){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5)return;
      moved.current=true;
      try{e.currentTarget.setPointerCapture(d.id);}catch(_){}
    }
    const dx=e.clientX-d.px,dy=e.clientY-d.py;d.px=e.clientX;d.py=e.clientY;
    setCam(c=>({yaw:c.yaw+dx*0.0085,pitch:Math.max(-1.25,Math.min(1.45,c.pitch+dy*0.0085))}));
  };
  const onUp=()=>{drag.current=null;setTimeout(()=>{moved.current=false;},0);};

  const {w,h}=sz;
  const R=scene.R||2.8,ctr=scene.ctr||[0,0,0],P=scene.P||{};
  const D=R*5.5,S=Math.min(w,h)/(2*R)*0.97;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const tfv=v=>{const x1=v[0]*cy-v[1]*sy,y1=v[0]*sy+v[1]*cy;return[x1,y1*sp+v[2]*cp,y1*cp-v[2]*sp];};
  const tf=p=>tfv(sub(p,ctr));
  const pj=p=>{const q=tf(p),k=D/(D+q[2]);return{x:w/2+q[0]*k*S,y:h/2-q[1]*k*S,d:q[2]};};
  const get=p=>typeof p==='string'?P[p]:p;
  const fs=Math.max(15,Math.min(26,w/32)),big=w>900?1.25:1;

  const polys=[],hid=[],vis=[],dots=[],lbls=[],hits=[];let kk=0;
  const pushSeg=(a,b,o,hidden)=>{
    const A=pj(get(a)),B=pj(get(b));const col=o.c||C.edge,sw=(o.w||2.2)*big;
    const el=<line key={'s'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={col} strokeWidth={sw}
      strokeLinecap="round" strokeDasharray={(hidden||o.dash)?`${sw*2.6} ${sw*2.2}`:undefined} opacity={hidden?.7:(o.op||1)}/>;
    (hidden||o.dash?hid:vis).push(el);
    if(o.arrow){
      const ang=Math.atan2(B.y-A.y,B.x-A.x),s=fs*0.6;
      vis.push(<polygon key={'a'+(kk++)} fill={col} points={`${B.x},${B.y} ${B.x-s*Math.cos(ang-.4)},${B.y-s*Math.sin(ang-.4)} ${B.x-s*Math.cos(ang+.4)},${B.y-s*Math.sin(ang+.4)}`}/>);
    }
    if(o.pick){
      hits.push(<line key={'h'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="rgba(0,0,0,0.001)" strokeWidth={Math.max(18,fs)}
        strokeLinecap="round" style={{cursor:'pointer'}} onClick={()=>{if(!moved.current)o.pick();}}/>);
    }
  };
  const pushPoly=(pts3,o)=>{
    const q=pts3.map(p=>pj(get(p)));const dm=q.reduce((s,a)=>s+a.d,0)/q.length-(o.lift||0);
    polys.push({dm,el:<polygon key={'p'+(kk++)} points={q.map(a=>a.x+','+a.y).join(' ')} fill={o.fill||'none'} fillOpacity={o.op==null?.15:o.op}
      stroke={o.stroke||'none'} strokeWidth={(o.sw||1.5)*big} strokeDasharray={o.dash?'6 5':undefined} strokeLinejoin="round"/>});
  };

  scene.prims.forEach(pr=>{
    if(!pr)return;
    if(pr.t==='poly')pushPoly(pr.p,pr);
    else if(pr.t==='seg')pushSeg(pr.a,pr.b,pr,false);
    else if(pr.t==='solid'){
      const verts=[...new Set(pr.faces.flat())];const c0=cen(verts.map(get));
      const em=new Map();
      pr.faces.forEach((f,i)=>{
        const p3=f.map(get);const n0=cross(sub(p3[1],p3[0]),sub(p3[2],p3[0]));
        const n=dot(n0,sub(cen(p3),c0))<0?mul(n0,-1):n0;const front=tfv(n)[2]<0;
        const fl=pr.fills&&pr.fills[i];
        if(fl)pushPoly(f,{fill:fl[0],op:fl[1]});
        else if(pr.tint)pushPoly(f,{fill:'#7c3aed',op:front?.06:.025});
        f.forEach((v,j)=>{const u=f[(j+1)%f.length];const key=[v,u].sort().join('|');
          const e=em.get(key)||{a:v,b:u,vis:false};e.vis=e.vis||front;em.set(key,e);});
      });
      em.forEach(e=>{
        const st=(pr.estyle&&pr.estyle(e.a,e.b))||{};
        pushSeg(e.a,e.b,{c:st.c||pr.c||C.edge,w:st.w||pr.w||2.4,pick:pr.pick?()=>pr.pick(e.a,e.b):null},!e.vis);
      });
    }
    else if(pr.t==='pt'){
      const p=pr.p||P[pr.id];const q=pj(p);const col=pr.c||C.ink;
      dots.push(<circle key={'d'+(kk++)} cx={q.x} cy={q.y} r={(pr.r||fs*.27)*(big>1?1.1:1)} fill={col} stroke="#fff" strokeWidth="1.5"/>);
      const label=pr.label===false?null:(pr.label||L(pr.id||''));
      if(label){
        let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
        if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
        const off=fs*(pr.off||1.0);
        lbls.push(<text key={'l'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
          fontFamily='"Times New Roman",Georgia,serif' fontStyle="italic" fontWeight="700" fontSize={fs*(pr.size||1)} fill={pr.lc||col}
          stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{label}</text>);
      }
    }
    else if(pr.t==='txt'){
      const q=pj(get(pr.p));let dx=q.x-w/2,dy=q.y-h/2;let l=Math.hypot(dx,dy);
      if(pr.lo){dx=pr.lo[0];dy=pr.lo[1];l=Math.hypot(dx,dy)||1;}else if(l<1){dx=0;dy=-1;l=1;}
      const off=fs*(pr.off==null?.8:pr.off);
      lbls.push(<text key={'t'+(kk++)} x={q.x+dx/l*off} y={q.y+dy/l*off} textAnchor="middle" dominantBaseline="central"
        fontFamily={pr.upright?'-apple-system,Segoe UI,Roboto,sans-serif':'"Times New Roman",Georgia,serif'} fontStyle={pr.upright?'normal':'italic'}
        fontWeight="700" fontSize={fs*(pr.size||1.1)} fill={pr.c||C.ink} stroke={C.halo} strokeWidth="4" paintOrder="stroke" strokeLinejoin="round">{pr.s}</text>);
    }
  });
  polys.sort((a,b)=>b.dm-a.dm);

  return(
    <div ref={wrap} style={{position:'absolute',inset:0}}>
      <svg width={w} height={h} style={{position:'absolute',inset:0,touchAction:'none',cursor:drag.current?'grabbing':'grab',display:'block'}}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} onPointerLeave={()=>{if(!moved.current)drag.current=null;}}>
        <g>{polys.map(p=>p.el)}</g><g>{hid}</g><g>{vis}</g><g>{dots}</g><g>{lbls}</g><g>{hits}</g>
      </svg>
      {!bare&&<div className="tools">
        <button className="tool" aria-label="Скинути вигляд" title="Скинути вигляд" onClick={()=>setCam({yaw:yaw0,pitch:pitch0})}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button className={'tool'+(auto?' on':'')} aria-label="Автообертання" title="Автообертання" onClick={()=>setAuto(a=>!a)}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3a9 9 0 0 1 0 18"/><path d="M17 16l3.5.5.5-3.5"/></svg>
        </button>
      </div>}
      {!bare&&<div className="hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v3"/><path d="M9 11a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h1a6 6 0 0 0 6-6v-2"/></svg>
        Тягни — обертай
      </div>}
      {legend&&<div className="legend">{legend.map((l,i)=><span key={i}><i className="dot" style={{background:l[0]}}/>{l[1]}</span>)}</div>}
    </div>
  );
}

/* ---------- елементи інтерфейсу ---------- */
const NavCtx=createContext(null);
const M=({children})=><i className="m">{children}</i>;
const Box=({title,children})=><div className="box"><h4>{title}</h4><p>{children}</p></div>;
const Note=({children})=><div className="note">{children}</div>;
const Key=({children})=><div className="key">{children}</div>;
const Tabs=({items,val,set})=><div className="tabs">{items.map(([k,t])=><button key={k} className={'tab'+(val===k?' on':'')} onClick={()=>set(k)}>{t}</button>)}</div>;
const Slider=({label,min,max,step=1,val,set,unit='°'})=>(
  <div className="sliderRow"><label>{label}</label>
    <input type="range" min={min} max={max} step={step} value={val} onChange={e=>set(parseFloat(e.target.value))}/>
    <output>{val}{unit}</output></div>);
function Steps({items,k,setK,label='Показати розв’язання'}){
  return(<div className="steps">
    {items.slice(0,k).map((t,i)=><div key={i} className={'step'+(i===items.length-1?' last':'')}><span className="sn">{i+1})</span><div>{t}</div></div>)}

function Frame({left,scene,legend,yaw0,pitch0,camKey}){
  const nav=useContext(NavCtx);
  return(<>
    <div className="left"><div className="lscroll">{left}</div>{nav}</div>
    <div className="right"><Scene3D key={camKey} scene={scene} legend={legend} yaw0={yaw0} pitch0={pitch0}/></div>
  </>);
}
const txtPl=(poly,i,s,c,lo)=>({t:'txt',p:poly[i],s,c,size:1.35,lo});
const CUBE=boxP(1,1,1);
const perp=(v,e)=>sub(v,mul(e,dot(v,e)));
const linePlane=(P0,d,Q,n)=>add(P0,mul(d,dot(sub(Q,P0),n)/dot(d,n)));

const para=(p0,e1,e2)=>[p0,add(p0,e1),add(add(p0,e1),e2),add(p0,e2)];
const nmE=e=>L(e[0])+L(e[1]);
const GR={edge:'#94a3b8',vert:'#475569',face:'#94a3b8',plane:'#94a3b8',txt:'#64748b'};
const greyFills={0:[GR.face,.08],1:[GR.face,.08],2:[GR.face,.08],3:[GR.face,.08],4:[GR.face,.08],5:[GR.face,.08]};
const colM='#ea580c',colP='#7e22ce',colX='#dc2626';
const Clk=({c,on,onClick,children})=><button className={'clk'+(on?' on':'')} style={{color:c}} onClick={onClick}>{children}</button>;

/* =====================================================================
   Пункт 1. Три випадки взаємного розміщення
   ===================================================================== */
function Item1(){
  const [tab,setTab]=useState('cases');const [ex,setEx]=useState(0);
  const [sel,setSel]=useState(null);const [stage,setStage]=useState('par');
  const [found,setFound]=useState({par:[],int:[],skew:[]});const [bad,setBad]=useState(false);
  const exs=[null,{rel:'int',a:['A','B'],b:['A','A1']},{rel:'par',a:['A','B'],b:['D','C']},{rel:'skew',a:['A','A1'],b:['D','C']}];
  const total={par:3,int:4,skew:4};
  const stCol={par:C.gold,int:C.int,skew:C.skew};
  const stName={par:'паралельні',int:'перетинаються',skew:'мимобіжні'};
  const relOf=(i,j)=>relLines(CUBE[BOXE[i][0]],CUBE[BOXE[i][1]],CUBE[BOXE[j][0]],CUBE[BOXE[j][1]]);
  const pick=(a,b)=>{
    const i=BOXE.findIndex(e=>sameEdge(e,a,b));if(i<0)return;
    if(sel===null){setSel(i);setBad(false);return;}
    if(i===sel)return;
    if(relOf(sel,i)===stage){setBad(false);setFound(f=>f[stage].includes(i)?f:{...f,[stage]:[...f[stage],i]});}
    else setBad(true);
  };
  const reset=()=>{setSel(null);setFound({par:[],int:[],skew:[]});setBad(false);setStage('par');};
  let sc,legend=null;
  if(tab==='cases'){
    const e=exs[ex];const pr=[];
    pr.push({t:'solid',faces:BOXF,tint:true,w:2.2,estyle:(a,b)=>e&&(sameEdge(e.a,a,b)||sameEdge(e.b,a,b))?{c:relCol[e.rel],w:5.4}:null});
    if(e&&e.rel==='par')pr.push({t:'poly',p:BOXF[0],fill:C.al,op:.22});
    if(e&&e.rel==='int')pr.push({t:'poly',p:BOXF[2],fill:C.al,op:.22});
    pr.push(...vp(Object.keys(CUBE)));
    sc={P:CUBE,prims:pr,R:2.7};
  }else{
    sc={P:CUBE,R:2.7,prims:[{t:'solid',faces:BOXF,fills:greyFills,c:GR.edge,w:2.8,pick,
      estyle:(a,b)=>{const i=BOXE.findIndex(e=>sameEdge(e,a,b));
        if(i===sel)return{c:C.gold,w:6.4};
        if(sel!==null&&found[stage].includes(i))return{c:stCol[stage],w:6};
        return null;}},...vp(Object.keys(CUBE),GR.vert)]};
    if(sel!==null)legend=stage==='par'?[[C.gold,'обране ребро і паралельні до нього']]:[[C.gold,'обране ребро'],[stCol[stage],stName[stage]]];
  }
  const done=sel!==null&&found[stage].length===total[stage];
  const nextSt={par:'int',int:'skew'};
  const left=(<>
    <Tabs val={tab} set={t=>{setTab(t);}} items={[['cases','Три випадки'],['explore','Дослідження на кубі']]}/>
    {tab==='cases'&&<div className="fade">
      <p className="lead">Дві прямі в просторі можуть розміщуватися <b>трьома способами</b>.</p>
      <div className="note" style={{fontWeight:600}}>
        <span className="cv">Перетинаються</span> — мають тільки одну спільну точку.<br/>
        <span className="cg">Паралельні</span> — лежать в одній площині та не перетинаються.<br/>
        <span className="cr">Мимобіжні</span> — не лежать в одній площині.
      </div>
      <div className="chips">
        <button className={'chip'+(ex===1?' on':'')} onClick={()=>setEx(1)}><span className="cv">AB і AA₁</span></button>
        <button className={'chip'+(ex===2?' on':'')} onClick={()=>setEx(2)}><span className="cg">AB і DC</span></button>
        <button className={'chip'+(ex===3?' on':'')} onClick={()=>setEx(3)}><span className="cr">AA₁ і DC</span></button>
      </div>
      {ex===0&&<Note>Обери пару прямих на кубі <M>ABCDA₁B₁C₁D₁</M>.</Note>}
      {ex===1&&<Note>Спільна точка одна — <M>A</M>. Прямі перетинаються, через них проходить площина <M>ABB₁</M>.</Note>}
      {ex===2&&<Note>Прямі лежать в одній площині <M>ABC</M> і не мають спільних точок: <span className="cg"><M>AB ∥ DC</M></span>.</Note>}
      {ex===3&&<Note>Спільних точок немає, і жодна площина не містить обох прямих. Прямі <span className="cr">мимобіжні</span>.</Note>}
      <Key>У планіметрії є лише два випадки. У стереометрії з’являється третій — <b>мимобіжні прямі</b>: вони не перетинаються й не паралельні.</Key>
    </div>}
    {tab==='explore'&&<div className="fade">
      {sel===null?<p className="lead">Клікни будь-яке ребро куба — воно засвітиться.</p>:<>
        <p className="lead">Обране ребро <span className="ca"><M>{nmE(BOXE[sel])}</M></span>. Клікай ребра, які <span style={{color:stCol[stage],fontWeight:800}}>{stName[stage]}</span> з ним.</p>
        <div className="chips">
          {['par','int','skew'].map(s=><button key={s} className={'chip'+(stage===s?' on':'')} onClick={()=>{setStage(s);setBad(false);}}>
            <span style={{color:stCol[s]}}>{stName[s][0].toUpperCase()+stName[s].slice(1)}</span></button>)}
        </div>
        <div className="cnt">
          {['par','int','skew'].map(s=><div key={s} className={found[s].length===total[s]?'got':''}><b style={{color:stCol[s]}}>{found[s].length}/{total[s]}</b>{stName[s]}</div>)}
        </div>
        {bad&&<div className="fb bad">Це ребро не підходить. Спробуй інше.</div>}
        {done&&<div className="fb ok">Знайдено всі: {total[stage]}.</div>}
        {done&&nextSt[stage]&&<button className="btn" onClick={()=>{setStage(nextSt[stage]);setBad(false);}}>Далі: {stName[nextSt[stage]]} →</button>}
        <div><button className="btn ghost sm" style={{marginTop:'.5em'}} onClick={reset}>↻ Обрати інше ребро</button></div>
      </>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} camKey={tab} yaw0={0.65} pitch0={0.42}/>;
}

/* =====================================================================
   Пункт 2. Паралельні прямі
   ===================================================================== */
function Item2(){
  const [tab,setTab]=useState('def');const [k,setK]=useState(0);
  const [shown,setShown]=useState(false);const [phi,setPhi]=useState(40);
  let sc,legend=null;
  const goTab=t=>{setTab(t);setK(0);setShown(false);setPhi(40);};
  if(tab==='def'){
    const pr=[{t:'solid',faces:BOXF,tint:true,w:2.2}];
    if(k>=1)pr.push({t:'poly',p:BOXF[0],fill:C.al,op:.24});
    if(k>=2)pr.push({t:'seg',a:'A',b:'B',c:C.par,w:5.6},{t:'seg',a:'D',b:'C',c:C.par,w:5.6});
    pr.push(...vp(Object.keys(CUBE)));
    sc={P:CUBE,prims:pr,R:2.8};
    legend=k>=2?[[C.par,'AB ∥ DC'],[C.al,'площина ABC']]:(k>=1?[[C.al,'площина ABC']]:null);
  }else{
    const ok=shown&&Math.abs(phi)<=2;const f=rad(ok?0:phi);
    const e1=[1,0,0],v=[0,1.4,0.5],e2=nrm(v),nn=cross(e1,e2);
    const e2r=add(mul(e2,Math.cos(f)),mul(nn,Math.sin(f)));
    const cl=ok?C.par:GR.txt,w=ok?5.4:3.6;
    const m1=[-2.6,0,0],m2=[2.6,0,0],n1=add(m1,v),n2=add(m2,v);
    const pr=[{t:'seg',a:m1,b:m2,c:cl,w},{t:'seg',a:n1,b:n2,c:cl,w},
      {t:'txt',p:m2,s:'m',c:cl,size:1.4,lo:[1,0]},{t:'txt',p:n2,s:'n',c:cl,size:1.4,lo:[1,0]}];
    if(shown){const pl=rectPlane(mul(e2r,.8),e1,e2r,2.7,1.4);pr.push(plane(pl,C.al,.18),txtPl(pl,3,'α',C.al));}
    sc={P:{},prims:pr,R:3.2,ctr:[0,0.5,0.4]};
  }
  const left=(<>
    <Tabs val={tab} set={goTab} items={[['def','Означення'],['thm','Теорема 29.1']]}/>
    {tab==='def'&&<div className="fade">
      <Box title="Означення">Дві прямі в просторі називають паралельними, якщо вони <span className="cb">лежать в одній площині</span> та <span className="cg">не перетинаються</span>.</Box>
      <Steps k={k} setK={setK} label="Приклад на кубі" items={[
        <>Прямі <M>AB</M> і <M>DC</M> <span className="cb">лежать в одній площині</span> <M>ABC</M>.</>,
        <>У площині <M>ABC</M> вони є протилежними сторонами квадрата й <span className="cg">не мають спільних точок</span>.</>,
        <>Отже, <span className="cg"><M>AB ∥ DC</M></span>.</>]}/>
    </div>}
    {tab==='thm'&&<div className="fade">
      <Box title="Теорема 29.1">Через дві <span className="cg">паралельні прямі</span> проходить <span className="cb">площина</span>, і до того ж <span className="co">тільки одна</span>.</Box>
      {!shown?<button className="btn" onClick={()=>{setShown(true);setPhi(40);}}>Показати площину</button>:<>
        <Slider label="Поверни площину" min={-80} max={80} step={1} val={phi} set={setPhi}/>
        {shown&&Math.abs(phi)<=2?<div className="fb ok">Площина <M>α</M> містить обидві прямі. Така площина <b>єдина</b>.</div>
          :<Note>Площина <M>α</M> проходить через <M>m</M>. Знайди положення, у якому вона містить і <M>n</M>.</Note>}
        <button className="btn ghost sm" onClick={()=>{setShown(false);setPhi(40);}}>Сховати площину</button>
      </>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} camKey={tab} legend={legend} yaw0={tab==='thm'?0.7:0.65} pitch0={tab==='thm'?0.35:0.42}/>;
}

/* =====================================================================
   Пункт 3. Мимобіжні прямі
   ===================================================================== */
const TET={D:[0.2,0.1,1.8],A:[-1.5,-1.1,-0.9],B:[1.4,-0.9,-0.9],C:[0.2,1.5,-0.9]};
const TETF=[['A','B','C'],['D','A','B'],['D','B','C'],['D','C','A']];
const EXF={
  cube:{P:CUBE,faces:BOXF,R:2.8,plane:['A','B','C','D'],pn:'ABC',a:['D','C'],b:['A','A1'],M:'A',
    t:{in:<>Пряма <M>DC</M> лежить у площині <M>ABC</M>.</>,cross:<>Пряма <M>AA₁</M> перетинає площину <M>ABC</M> у точці <M>A</M>.</>,
       notOn:<>Точка <M>A</M> не належить прямій <M>DC</M>.</>,skew:<>За ознакою прямі <M>DC</M> і <M>AA₁</M> — мимобіжні.</>}},
  tet:{P:TET,faces:TETF,R:3.0,plane:['A','B','C'],pn:'ABC',a:['A','B'],b:['D','C'],M:'C',ctr:[0,0,0.2],
    t:{in:<>Пряма <M>AB</M> лежить у площині <M>ABC</M>.</>,cross:<>Пряма <M>DC</M> перетинає площину <M>ABC</M> у точці <M>C</M>.</>,
       notOn:<>Точка <M>C</M> не належить прямій <M>AB</M>.</>,skew:<>За ознакою прямі <M>AB</M> і <M>DC</M> — мимобіжні.</>}}};
function exScene(fg,hl){
  const F=EXF[fg];const show=n=>hl&&({in:['in'],cross:['cross'],notOn:['notOn'],skew:['skew']}[hl]||[]).includes(n);
  const pr=[{t:'solid',faces:F.faces,c:GR.edge,w:2.8,fills:fg==='cube'?greyFills:{0:[GR.face,.08],1:[GR.face,.08],2:[GR.face,.08],3:[GR.face,.08]},
    estyle:(a,b)=>{
      if(sameEdge(F.a,a,b)&&hl&&hl!=='cross')return hl==='skew'?{c:C.skew,w:6}:{c:colM,w:6};
      if(sameEdge(F.b,a,b)&&(hl==='cross'||hl==='skew'))return hl==='skew'?{c:C.skew,w:6}:{c:colP,w:6};
      return null;}}];
  if(hl)pr.push({t:'poly',p:F.plane,fill:C.al,op:hl==='skew'?.12:.26});
  if(hl==='cross'||hl==='notOn'||hl==='skew')pr.push({t:'pt',id:F.M,c:colX,r:8});
  pr.push(...vp(Object.keys(F.P),GR.vert));
  return{P:F.P,prims:pr,R:F.R,ctr:F.ctr};
}
function Item3(){
  const [tab,setTab]=useState('def');const [hl,setHl]=useState(null);const [fg,setFg]=useState('cube');
  const [d,setD]=useState(0);const [third,setThird]=useState('D');
  let sc,legend=null,yaw=0.6,pit=0.35;

    if(d===1)pr.push({t:'poly',p:BOXF[0],fill:C.al,op:.22});
    pr.push(...vp(Object.keys(CUBE),GR.vert));
    sc={P:CUBE,prims:pr,R:2.8};yaw=0.65;pit=0.42;
  }
  if(tab==='thm'){
    /* рис. 29.6: площина α, пряма a у ній, пряма b перетинає α в точці M */
    const al=para([-2.8,-1.5,0],[5.2,0,0],[1.4,3.0,0]);
    const A1=[-1.5,0.1,0],A2=[2.9,0.1,0],M=[0.6,-0.7,0],dd=[0.35,0.25,1];
    const b1=sub(M,mul(dd,1.15)),b2=add(M,mul(dd,1.7));
    const hP=hl==='in'||hl==='cross'||hl==='notOn';
    const ca=hl==='in'||hl==='notOn'?colM:hl==='skew'?C.skew:GR.txt;
    const cb=hl==='cross'?colP:hl==='skew'?C.skew:GR.txt;
    sc={P:{M},R:3.3,ctr:[0.3,0.1,0.4],prims:[plane(al,hP?C.al:GR.plane,hP?.2:.12),txtPl(al,0,'α',hP?C.al:GR.txt),

    </div>}
    {tab==='thm'&&<div className="fade">
      <div className="box"><h4>Теорема 29.2 (ознака мимобіжних прямих)</h4>
        <p>Якщо <Clk c={colM} on={hl==='in'} onClick={()=>setHl('in')}>одна з двох прямих лежить у площині</Clk>, а <Clk c={colP} on={hl==='cross'} onClick={()=>setHl('cross')}>друга перетинає цю площину в точці</Clk>, <Clk c={colX} on={hl==='notOn'} onClick={()=>setHl('notOn')}>яка не належить першій прямій</Clk>, то дані прямі є <Clk c={C.skew} on={hl==='skew'} onClick={()=>setHl('skew')}>мимобіжними</Clk>.</p></div>

      {hl&&<button className="btn ghost sm" onClick={()=>setHl(null)}>↻ Скинути</button>}
    </div>}
    {tab==='plane'&&<div className="fade">
      <Note>Спробуємо провести площину через <M>AB</M> так, щоб вона містила <M>DC</M>. Обери третю точку.</Note>

      </div>

/* =====================================================================
   Пункт 4. Лабораторія: рухай пряму b
   ===================================================================== */
function Item4(){
  const [h,setH]=useState(1);const [phi,setPhi]=useState(45);const [seen,setSeen]=useState([]);
  const HL=3.8,y0=0.8,ph=rad(phi);
  const dir=[Math.cos(ph),Math.sin(ph),0];
  const B0=[0,y0,h];
  const a1=[-HL,0,0],a2=[HL,0,0],b1=sub(B0,mul(dir,HL)),b2=add(B0,mul(dir,HL));
  const rel=relLines(a1,a2,b1,b2);
  useEffect(()=>{setSeen(s=>s.includes(rel)?s:[...s,rel]);},[rel]);
  const al=rectPlane([0,0.6,0],[1,0,0],[0,1,0],HL-0.2,2.3);
  const pr=[plane(al,C.al,.13),txtPl(al,3,'α',C.al),{t:'seg',a:a1,b:a2,c:C.ink,w:4},{t:'seg',a:b1,b:b2,c:relCol[rel],w:5.4},
    {t:'txt',p:a2,s:'a',c:C.ink,size:1.4,lo:[1,0]},{t:'txt',p:b2,s:'b',c:relCol[rel],size:1.4,lo:[1,0]}];
  if(rel==='par'&&h!==0){
    const e2=nrm(B0);pr.unshift(plane(rectPlane(mul(B0,.5),[1,0,0],e2,HL-0.2,len(B0)/2+0.8),C.par,.18));
  }
  if(rel==='int'){
    const t=-y0/Math.sin(ph);pr.push({t:'pt',p:[t*Math.cos(ph),0,0],label:'M',c:C.int,r:7});
  }
  const info={par:['Прямі лежать в одній площині й не перетинаються.','Спільна площина показана зеленим.'],
    int:['Є рівно одна спільна точка M.','Через дві прямі, що перетинаються, проходить єдина площина.'],
    skew:['Спільних точок немає, і спільної площини теж немає.','Прямі не лежать в одній площині.']}[rel];
  const left=(<>
    <p className="lead">Пряма <M>a</M> нерухома й лежить у площині <M>α</M>. Рухай пряму <M>b</M> і знайди <b>всі три випадки</b>.</p>
    <Slider label="Висота b над α" min={-2} max={2} step={0.5} val={h} set={setH} unit=""/>
    <Slider label="Поворот b" min={0} max={150} step={15} val={phi} set={setPhi}/>
    <div className={'status '+rel}>{relName[rel]}<small>{info[0]} {info[1]}</small></div>
    <div className="cnt">
      {['par','int','skew'].map(r=><div key={r} className={seen.includes(r)?'got':''}><b className={r==='par'?'cg':r==='int'?'cv':'cr'}>{seen.includes(r)?'✓':'·'}</b>{relName[r]}</div>)}
    </div>
    {seen.length===3&&<div className="fb ok">Усі три випадки знайдено!</div>}
    <Key>Паралельні — коли <b>поворот 0°</b> (напрямки збігаються). Перетинаються — коли <b>висота 0</b> і поворот не нульовий. Інакше прямі мимобіжні.</Key>
  </>);
  const legend=[[C.ink,'пряма a'],[relCol[rel],'пряма b']];
  return <Frame left={left} scene={{P:{},prims:pr,R:4.3,ctr:[0,0.4,0.2]}} legend={legend} yaw0={0.75} pitch0={0.4}/>;
}

      opts:['Тільки перетинаються','Тільки мимобіжні','Перетинаються або мимобіжні','Паралельні','Збігаються'],ok:2,
      ex:<><M>c ∥ b</M> бути не може: тоді з <M>b ∥ a</M> випливало б <M>c ∥ a</M>, а <M>c</M> перетинає <M>a</M>. Обидва інші випадки можливі — перемикай приклади на кубі.</>},
    {q:<>Скільки ребер куба мимобіжні з ребром <M>AA₁</M>?</>,opts:['2','3','4','6','8'],ok:2,
      ex:<>З ребром <M>AA₁</M> перетинаються 4 ребра (<M>AB, AD, A₁B₁, A₁D₁</M>), паралельні 3 (<M>BB₁, CC₁, DD₁</M>). Решта 4 ребра — <M>BC, CD, B₁C₁, C₁D₁</M> — мимобіжні.</>}];

  let sc,legend=null;
  if(ti===0){
    const p=pairs[row];
    sc={P:BX,R:2.9,prims:[{t:'solid',faces:BOXF,tint:true,w:2.2},{t:'seg',a:p[0][0],b:p[0][1],c:C.gold,w:5.6},{t:'seg',a:p[1][0],b:p[1][1],c:C.inn,w:5.6},...vp(Object.keys(BX))]};
    legend=[[C.gold,'перша пряма'],[C.inn,'друга пряма']];
  }
  if(ti===1){
    const chosen=hov!=null?(hov===0?['BC','CD']:hov===1?['AB','AD']:hov===2?['SC','BC']:hov===3?['CD','SB']:['SD','BC']):(done[1]?['BC','CD']:null);
    sc={P:PY,R:3.0,ctr:[0,0,0.2],prims:[{t:'solid',faces:pyF,tint:true,w:2.2,estyle:(a,b)=>{
      const nm=[a+b,b+a];
      if(nm.includes('SA'))return{c:C.gold,w:6};
      if(chosen&&chosen.some(n=>nm.includes(n)))return{c:done[1]?C.skew:C.inn,w:6};
      return null;}},...vp(Object.keys(PY))]};
    legend=[[C.gold,'SA'],[C.inn,'вибрані ребра']];
  }
  if(ti===2){
    const Pt={D:[0.2,0.1,1.8],A:[-1.5,-1.1,-0.9],B:[1.4,-0.9,-0.9],C:[0.2,1.5,-0.9]};
    sc={P:Pt,R:3.0,ctr:[0,0,0.2],prims:[{t:'solid',faces:[['A','B','C'],['D','A','B'],['D','B','C'],['D','C','A']],w:2.2,
      estyle:(a,b)=>sameEdge(['A','B'],a,b)?{c:C.gold,w:5.6}:sameEdge(['C','D'],a,b)?{c:C.inn,w:5.6}:null},...vp(['A','B','C','D'])]};
    legend=[[C.gold,'AB'],[C.inn,'CD']];

  const choose=i=>{

      <div className="cnt"><div><b>{row+1}/6</b>пара</div><div><b className="cg">{tbl.filter((x,i)=>x===right1[i]).length}</b>правильно</div></div>

      {!done[ti]&&wrong[ti].length>0&&<div className="fb bad">Неправильно. Спробуй інший варіант.</div>}
      {done[ti]&&ti<4&&<button className="btn" onClick={()=>setTi(ti+1)}>Наступне завдання →</button>}
      {d0&&done.slice(1).every(Boolean)&&ti===4&&<div className="fb ok">Усі завдання виконано правильно!</div>}
    </div>}
  </>);
  return <Frame left={left} scene={sc} legend={legend} yaw0={0.6} pitch0={0.4}/>;
}

/* =====================================================================
   Пункт 6. Вправи з підручника (п. 29)

const Yb={f:'#fde047',s:'#a16207',v:'#a99bdc',vs:'#5b4aa8',ln:'#111827',ans:'#dc2626'};
const ppl=(p,fill,st,op=.55)=>({t:'poly',p,fill,op,stroke:st,sw:2});
const sg=(a,b,c=Yb.ln,w=2.8,dash)=>({t:'seg',a,b,c,w,dash});

const BX6=boxP(1.5,1.1,1.0);
const PL6=para([-2.6,-1.3,0],[5.4,0,0],[1.3,2.6,0]);
const DR=[0.3,0.25,-1];

const relOpt={par:'Паралельні',int:'Перетинаються',skew:'Мимобіжні'};

function mkBoxTask(i,l1,l2,ord,planePts,ex){
  const r=relLines(BX6[l1[0]],BX6[l1[1]],BX6[l2[0]],BX6[l2[1]]);
  const nm=(a)=>L(a[0])+L(a[1]);
  return{lbl:'29.4 ('+i+')',cam:[0.6,0.4],
    q:<><b>29.4 ({i}).</b> Дано прямокутний паралелепіпед <M>ABCDA₁B₁C₁D₁</M>. Укажіть взаємне розміщення прямих <M>{nm(l1)}</M> і <M>{nm(l2)}</M>.</>,
    opts:ord.map(x=>relOpt[x]),ok:ord.indexOf(r),ex,
    mk:(dn)=>{
      const col=dn?relCol[r]:null;

 {lbl:'29.15',cam:[0,0.55],q:<><b>29.15.</b> Трикутник <M>ABC</M> не має спільних точок із площиною <M>α</M>. Відрізок <M>BM</M> — медіана трикутника <M>ABC</M>, точка <M>O</M> — середина відрізка <M>BM</M>. Через точки <M>A</M>, <M>B</M>, <M>C</M>, <M>M</M> і <M>O</M> проведено паралельні прямі, які перетинають площину <M>α</M> в точках <M>A₁</M>, <M>B₁</M>, <M>C₁</M>, <M>M₁</M> і <M>O₁</M> відповідно. Знайдіть відрізок <M>BB₁</M>, якщо <M>AA₁ = 17</M> см, <M>CC₁ = 13</M> см, <M>OO₁ = 12</M> см.</>,
  opts:['11 см','24 см','9 см','7 см','15 см'],ok:2,
  ex:<><M>MM₁</M> — середня лінія трапеції <M>AA₁C₁C</M>: <M>MM₁ = (17 + 13)/2 = 15</M> см. <M>OO₁</M> — середня лінія трапеції <M>BB₁M₁M</M>: <M>12 = (BB₁ + 15)/2</M>, звідси <M>BB₁ = 9</M> см.</>,
  mk:(dn)=>{const A=[-2.0,-0.6,1.7],C=[0.6,-0.5,1.3],B=[1.6,0.9,0.9],Mm=mid(A,C),O=mid(B,Mm);
    const P={A,B,C,M:Mm,O,A1:foot(A),B1:foot(B),C1:foot(C),M1:foot(Mm),O1:foot(O)};
    const pr=[ppl(PL6,Yb.f,Yb.s,.45),txtPl(PL6,0,'α',Yb.s),
      sg('A','B'),sg('B','C'),sg('A','C'),sg('B','M'),
      sg('A','A1'),sg('B','B1'),sg('C','C1'),sg('M','M1'),sg('O','O1'),
      lab(mid(A,P.A1),'17 см',Yb.ln,[-1,0]),lab(mid(C,P.C1),'13 см',Yb.ln,[1,0]),lab(mid(O,P.O1),'12 см',Yb.ln,[1,0]),
      ...vp(['A','B','C','M','O','A1','B1','C1','M1','O1'])];
    if(dn)pr.push({...ppl(['A','C','C1','A1'],'#2563eb','#2563eb',.14),lift:100,sw:1.4},{...ppl(['B','M','M1','B1'],'#ea580c','#ea580c',.14),lift:100,sw:1.4},sg('B','B1',Yb.ans,5.6),lab(mid(B,P.B1),'9 см',Yb.ans,[-1,0]),lab(mid(Mm,P.M1),'15 см',Yb.ln,[1,0]));
    return{sc:{P,R:2.7,ctr:[0,0.2,0.8],prims:pr},legend:dn?[['#2563eb','трапеція AA₁C₁C'],['#ea580c','трапеція BB₁M₁M'],[Yb.ans,'BB₁']]:null};}}
].flat();

function Item6(){
  const T=T6;
  const [ti,setTi]=useState(0);const [cs,setCs]=useState(0);
  const [done,setDone]=useState(()=>T.map(()=>false));const [wrong,setWrong]=useState(()=>T.map(()=>[]));
  const t=T[ti],dn=done[ti];
  const goTo=i=>{setTi(i);setCs(0);};
  const r=t.mk(dn,cs);
  const choose=i=>{
    if(done[ti]||wrong[ti].includes(i))return;
    if(i===t.ok){const d=[...done];d[ti]=true;setDone(d);}
    else{const w=wrong.map(x=>[...x]);w[ti].push(i);setWrong(w);}
  };
  const tabs=<div className="tabs">{T.map((x,i)=><button key={i} className={'tab sq'+(ti===i?' on':'')+(done[i]?' done':'')} onClick={()=>goTo(i)}>{done[i]?'✓ ':''}{x.lbl}</button>)}</div>;
  const left=(<>
    {tabs}
    <div className="fade" key={ti}>
      <Note>{t.q}</Note>
      {t.opts.map((o,i)=>{const isOk=dn&&i===t.ok,isBad=wrong[ti].includes(i);
        return <button key={i} className={'opt'+(isOk?' ok':isBad?' bad':'')} disabled={isBad} onClick={()=>choose(i)}><b>{'АБВГД'[i]}</b><span>{o}</span></button>;})}
      {dn&&<div className="fb ok">Правильно! <span style={{fontWeight:600}}>{t.ex}</span></div>}
      {dn&&t.cases&&<div className="chips">{t.cases.map((c,i)=><button key={i} className={'chip'+(cs===i?' on':'')} onClick={()=>setCs(i)}>{c}</button>)}</div>}
      {!dn&&wrong[ti].length>0&&<div className="fb bad">Неправильно. Спробуй інший варіант.</div>}
      {dn&&ti<T.length-1&&<button className="btn" onClick={()=>goTo(ti+1)}>Наступне завдання →</button>}
      {done.every(Boolean)&&ti===T.length-1&&<div className="fb ok">Усі завдання виконано правильно!</div>}
    </div>
  </>);
  return <Frame left={left} scene={r.sc} legend={r.legend} camKey={ti} yaw0={t.cam[0]} pitch0={t.cam[1]}/>;
}

/* =====================================================================
   Оболонка уроку
   ===================================================================== */
const ITEMS=[
  {t:'Три випадки взаємного розміщення прямих',p:'п. 27 · 6 хв',Cmp:Item1},
  {t:'Паралельні прямі в просторі',p:'п. 27 · 7 хв',Cmp:Item2},
  {t:'Мимобіжні прямі. Ознака',p:'п. 27 · 7 хв',Cmp:Item3},
  {t:'Лабораторія: рухай пряму',p:'п. 27 · 5 хв',Cmp:Item4},
  {t:'Задачі',p:'§ 4 · 10 хв',Cmp:Item5},
  {t:'Вправи з підручника',p:'§ 4 · 20 хв',Cmp:Item6}];

function startScene(){
  const B=boxP(1,1,1);
  return{P:B,R:2.7,prims:[{t:'solid',faces:BOXF,tint:true,w:2.6,c:'#6B21A8'},
    {t:'seg',a:[-1.9,-1,1.5],b:[1.9,-1,1.5],c:C.skew,w:4.4},
    {t:'seg',a:[0.2,-1.9,-0.2],b:[0.2,1.9,-0.2],c:C.al,w:4.4}]};
}
function App(){
  const [scr,setScr]=useState('start');
  const isItem=typeof scr==='number';
  const nav=isItem&&(<div className="nav">
    <button className="btn" onClick={()=>setScr('menu')}>☰ Зміст</button>
    {scr>0&&<button className="btn ghost" onClick={()=>setScr(scr-1)}>← Назад</button>}
    {scr<ITEMS.length-1?<button className="btn" onClick={()=>setScr(scr+1)}>Далі →</button>:<button className="btn" onClick={()=>setScr('start')}>На початок</button>}
  </div>);
  const Cur=isItem?ITEMS[scr].Cmp:null;
  return(
    <div className="app">
      <div className="main">
        {scr==='start'&&<div className="center start">
          <div style={{width:'min(78vw,330px)',height:'min(34vh,260px)',position:'relative',marginBottom:'.4em'}}><Scene3D scene={startScene()} bare auto0 yaw0={0.5} pitch0={0.4}/></div>
          <h1><span>Взаємне розміщення</span><br/>двох прямих у просторі</h1>
          <button className="go" onClick={()=>setScr('menu')}>ПОЧАТИ<i>▶</i></button>
        </div>}
        {scr==='menu'&&<div className="menu"><div style={{maxWidth:'70em',margin:'0 auto'}}><h2>§ 4. Взаємне розміщення двох прямих у просторі</h2>
          <div className="mgrid">{ITEMS.map((it,i)=><button key={i} className="mcard" onClick={()=>setScr(i)}><span className="n">{i+1}</span><span><b>{it.t}</b><small>{it.p}</small></span></button>)}</div></div></div>}
        {isItem&&<NavCtx.Provider value={nav}><Cur key={scr}/></NavCtx.Provider>}
      </div>
      <div className="sign">Автор розробки <b>Ковтун Тетяна</b></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
