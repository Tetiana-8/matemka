<style>
/* Кольори 10 класу задаються один раз */
:root{
  --panelLeft:#F2E6FF; --panelRight:#FAF5FF; --brand:#6B21A8; --brandLight:#F3E8FF;

.cg{color:var(--green);font-weight:700}.cr{color:var(--red);font-weight:700}.cv{color:var(--violet);font-weight:700}

.seg3 button{min-height:40px;flex:1;border-radius:.55em;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.82em;font-weight:700;color:var(--ink);cursor:pointer;padding:0 .2em;line-height:1.1}
.seg3 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg3 button.ok{background:#16a34a;color:#fff;border-color:#16a34a}.seg3 button.bad{background:#dc2626;color:#fff;border-color:#dc2626}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;text-align:center}
.start{background:var(--panelLeft)}

@media(min-width:768px){.start h1{font-size:2.6em}}
.go{display:flex;align-items:center;gap:.9em;background:#fff;border:1px solid #e9d5ff;border-radius:999px;padding:.55em .6em .55em 1.4em;color:#581c87;font:inherit;font-weight:800;
  letter-spacing:.14em;cursor:pointer;box-shadow:0 2px 10px rgba(88,28,135,.1);animation:pop .5s ease both}
.go i{width:2.2em;height:2.2em;border-radius:50%;background:#f3e8ff;display:grid;place-items:center;font-style:normal;font-size:.8em}
.menu{position:absolute;inset:0;overflow-y:auto;padding:1em max(16px,env(safe-area-inset-left,0px)) 5em;background:var(--panelLeft)}
.menu h2{margin:.1em 0 .7em;font-size:1.25em;color:var(--brand)}
.mgrid{display:grid;grid-template-columns:1fr;gap:.7em;max-width:70em;margin:0 auto}
@media(min-width:768px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;align-items:center;gap:.9em;background:var(--panelRight);border:1px solid #e2e8f0;border-radius:.9em;padding:.8em 1em;cursor:pointer;
  text-align:left;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;min-height:56px}
.mcard:hover{border-color:#c084fc;background:#faf5ff;box-shadow:0 3px 12px rgba(107,33,168,.1)}
.mcard .n{width:2.5em;height:2.5em;border-radius:50%;background:#ede9fe;color:#5b21b6;font-weight:800;display:grid;place-items:center;flex:none}
.mcard b{display:block;line-height:1.2}.mcard small{color:var(--muted);font-weight:600}
.sign{flex:none;text-align:center;padding:.35em .5em;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:.78em;color:#64748b;letter-spacing:.02em}
.sign b{color:#1e293b}
svg text{user-select:none;-webkit-user-select:none}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext } = React;

/* ---------- векторна алгебра ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.sqrt(dot(a,a));
const nrm=a=>{const l=len(a)||1;return mul(a,1/l);};
const lerp=(a,b,t)=>add(mul(a,1-t),mul(b,t));
const mid=(a,b)=>lerp(a,b,.5);
const cen=arr=>mul(arr.reduce(add,[0,0,0]),1/arr.length);
const rad=d=>d*Math.PI/180;
const fmt=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
const L=id=>String(id).replace(/1$/,'₁');
const rectPlane=(Cn,e1,e2,hw,hh)=>[
  add(Cn,add(mul(e1,hw),mul(e2,hh))),add(Cn,add(mul(e1,-hw),mul(e2,hh))),
  add(Cn,add(mul(e1,-hw),mul(e2,-hh))),add(Cn,add(mul(e1,hw),mul(e2,-hh)))];
const planeThrough=(P1,P2,P3,hw,hh)=>{
  const e1=nrm(sub(P2,P1));const n=cross(sub(P2,P1),sub(P3,P1));const e2=nrm(cross(n,e1));
  return rectPlane(cen([P1,P2,P3]),e1,e2,hw,hh);};
const linePlane=(P0,d,Q,n)=>add(P0,mul(d,dot(sub(Q,P0),n)/dot(d,n)));
const perp=(v,e)=>sub(v,mul(e,dot(v,e)));

/* взаємне розміщення */
function relLines(a1,a2,b1,b2){
  const d1=sub(a2,a1),d2=sub(b2,b1),c=cross(d1,d2);
  if(len(c)<1e-9) return len(cross(d1,sub(b1,a1)))<1e-9?'same':'par';
  return Math.abs(dot(sub(b1,a1),c))<1e-9?'int':'skew';
}
function relLinePlane(a1,a2,Q1,Q2,Q3){
  const n=cross(sub(Q2,Q1),sub(Q3,Q1)),d=sub(a2,a1);
  if(Math.abs(dot(d,n))>1e-9) return 'int';
  return Math.abs(dot(sub(a1,Q1),n))<1e-9?'in':'par';
}

/* ---------- кольори ---------- */
const C={edge:'#334155',ink:'#0f172a',par:'#16a34a',int:'#7e22ce',skew:'#dc2626',inn:'#2563eb',
  al:'#2563eb',be:'#ea580c',ga:'#7e22ce',gold:'#d97706',proj:'#ea580c',teal:'#0d9488',halo:'#FAF5FF'};

/* ---------- прості будівельники фігур ---------- */
const boxP=(hx,hy,hz,sx=0,sy=0)=>({
  A:[-hx,-hy,-hz],B:[hx,-hy,-hz],C:[hx,hy,-hz],D:[-hx,hy,-hz],
  A1:[-hx+sx,-hy+sy,hz],B1:[hx+sx,-hy+sy,hz],C1:[hx+sx,hy+sy,hz],D1:[-hx+sx,hy+sy,hz]});
const paraP=(a,u,v,w)=>({A:a,B:add(a,u),D:add(a,v),C:add(add(a,u),v),
  A1:add(a,w),B1:add(add(a,u),w),D1:add(add(a,v),w),C1:add(add(add(a,u),v),w)});
const BOXF=[['A','B','C','D'],['A1','B1','C1','D1'],['A','B','B1','A1'],['B','C','C1','B1'],['C','D','D1','C1'],['D','A','A1','D1']];
const BOXE=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
const eName=e=>L(e[0])+L(e[1]);
const plane=(p,color,op=.14,sw=1.6)=>({t:'poly',p,fill:color,op,stroke:color,sw});
const vp=(ids,c)=>ids.map(id=>({t:'pt',id,c:c||C.ink}));

/* ---------- 3D-сцена (SVG, обертання мишею/пальцем) ---------- */
function Scene3D({scene,yaw0=0.7,pitch0=0.42,auto0=false,bare=false,legend=null}){
  const wrap=useRef(null);
  const [sz,setSz]=useState({w:600,h:500});
  const [cam,setCam]=useState({yaw:yaw0,pitch:pitch0});
  const [auto,setAuto]=useState(auto0);
  const drag=useRef(null),moved=useRef(false);

  useEffect(()=>{
    const el=wrap.current;
    const upd=()=>setSz({w:el.clientWidth||600,h:el.clientHeight||500});
    const ro=new ResizeObserver(upd);ro.observe(el);upd();
    return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    if(!auto)return;let raf,last=performance.now();
    const tick=t=>{const dt=t-last;last=t;
      if(!drag.current)setCam(c=>({...c,yaw:c.yaw+dt*0.0005}));
      raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[auto]);

  const onDown=e=>{drag.current={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,id:e.pointerId};moved.current=false;};
  const onMove=e=>{
    const d=drag.current;if(!d)return;
    if(!moved.current){
      if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5)return;
      moved.current=true;
      try{e.currentTarget.setPointerCapture(d.id);}catch(_){}
    }
    const dx=e.clientX-d.px,dy=e.clientY-d.py;d.px=e.clientX;d.py=e.clientY;
    setCam(c=>({yaw:c.yaw+dx*0.0085,pitch:Math.max(-1.25,Math.min(1.45,c.pitch+dy*0.0085))}));
  };
  const onUp=()=>{drag.current=null;setTimeout(()=>{moved.current=false;},0);};

  const {w,h}=sz;
  const R=scene.R||2.8,ctr=scene.ctr||[0,0,0],P=scene.P||{};
  const D=R*5.5,S=Math.min(w,h)/(2*R)*0.97;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const tfv=v=>{const x1=v[0]*cy-v[1]*sy,y1=v[0]*sy+v[1]*cy;return[x1,y1*sp+v[2]*cp,y1*cp-v[2]*sp];};
  const tf=p=>tfv(sub(p,ctr));
  const pj=p=>{const q=tf(p),k=D/(D+q[2]);return{x:w/2+q[0]*k*S,y:h/2-q[1]*k*S,d:q[2]};};
  const get=p=>typeof p==='string'?P[p]:p;
  const fs=Math.max(15,Math.min(26,w/32)),big=w>900?1.25:1;

  const polys=[],hid=[],vis=[],dots=[],lbls=[],hits=[];let kk=0;
  const pushSeg=(a,b,o,hidden)=>{
    const A=pj(get(a)),B=pj(get(b));const col=o.c||C.edge,sw=(o.w||2.2)*big;
    const el=<line key={'s'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={col} strokeWidth={sw}
      strokeLinecap="round" strokeDasharray={(hidden||o.dash)?`${sw*2.6} ${sw*2.2}`:undefined} opacity={hidden?.7:(o.op||1)}/>;
    (hidden||o.dash?hid:vis).push(el);
    if(o.arrow){
      const ang=Math.atan2(B.y-A.y,B.x-A.x),s=fs*0.6;
      vis.push(<polygon key={'a'+(kk++)} fill={col} points={`${B.x},${B.y} ${B.x-s*Math.cos(ang-.4)},${B.y-s*Math.sin(ang-.4)} ${B.x-s*Math.cos(ang+.4)},${B.y-s*Math.sin(ang+.4)}`}/>);
    }
    if(o.pick){
      hits.push(<line key={'h'+(kk++)} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="rgba(0,0,0,0.001)" strokeWidth={Math.max(18,fs)}
        strokeLinecap="round" style={{cursor:'pointer'}} onClick={()=>{if(!moved.current)o.pick();}}/>);
    }
  };
  const pushPoly=(pts3,o)=>{
    const q=pts3.map(p=>pj(get(p)));const dm=q.reduce((s,a)=>s+a.d,0)/q.length;
    polys.push({dm,el:<polygon key={'p'+(kk++)} points={q.map(a=>a.x+','+a.y).join(' ')} fill={o.fill||'none'} fillOpacity={o.op==null?.15:o.op}
      stroke={o.stroke||'none'} strokeWidth={(o.sw||1.5)*big} strokeDasharray={o.dash?'6 5':undefined} strokeLinejoin="round"/>});
  };

  scene.prims.forEach(pr=>{
    if(!pr)return;
    if(pr.t==='poly')pushPoly(pr.p,pr);
    else if(pr.t==='seg')pushSeg(pr.a,pr.b,pr,false);
    else if(pr.t==='solid'){
      const verts=[...new Set(pr.faces.flat())];const c0=cen(verts.map(get));
      const em=new Map();
      pr.faces.forEach((f,i)=>{
        const p3=f.map(get);const n0=cross(sub(p3[1],p3[0]),sub(p3[2],p3[0]));
        const n=dot(n0,sub(cen(p3),c0))<0?mul(n0,-1):n0;const front=tfv(n)[2]<0;
        const fl=pr.fills&&pr.fills[i];
        if(fl)pushPoly(f,{fill:fl[0],op:fl[1]});
        else if(pr.tint)pushPoly(f,{fill:'#7c3aed',op:front?.06:.025});
        f.forEach((v,j)=>{const u=f[(j+1)%f.length];const key=[v,u].sort().join('|');
          const e=em.get(key)||{a:v,b:u,vis:false};e.vis=e.vis||front;em.set(key,e);});
      });
      em.forEach(e=>{

const LET='ABCDEFGH';
const polyBase=(n,r=1.55,z=-0.95)=>Array.from({length:n},(_,i)=>{const a=-Math.PI*0.75+i*2*Math.PI/n;return[r*Math.cos(a),r*Math.sin(a)*.9,z];});
const fin=(d,name,info)=>{d.name=name;d.info=info;d.V=new Set(d.faces.flat()).size;d.F=d.faces.length;
  d.E=new Set(d.faces.flatMap(f=>f.map((v,j)=>[v,f[(j+1)%f.length]].sort().join('|')))).size;return d;};
function pyrN(n){const P={S:[0.1,0.1,1.75]},ids=[];
  polyBase(n).forEach((p,i)=>{P[LET[i]]=p;ids.push(LET[i]);});
  return{P,faces:[ids,...ids.map((v,i)=>['S',v,ids[(i+1)%n]])],base:[0],lat:ids.map((_,i)=>i+1),ledges:ids.map(v=>['S',v])};}
function priN(n,sh=0){const P={},ids=[],h=[sh,sh*.6,1.9];
  polyBase(n,1.4).forEach((p,i)=>{const v=LET[i];P[v]=p;P[v+'1']=add(p,h);ids.push(v);});
  return{P,faces:[ids,ids.map(v=>v+'1'),...ids.map((v,i)=>{const u=ids[(i+1)%n];return[v,u,u+'1',v+'1'];})],
    base:[0,1],lat:ids.map((_,i)=>i+2),ledges:ids.map(v=>[v,v+'1'])};}
const mkBox=P=>({P,faces:BOXF,base:[0,1],lat:[2,3,4,5],ledges:[['A','A1'],['B','B1'],['C','C1'],['D','D1']]});
const FIX={

function Item6(){
  const [ti,setTi]=useState(0);const [done,setDone]=useState(Array(TB.length).fill(false));const [wrong,setWrong]=useState(TB.map(()=>[]));
  const t=TB[ti];
  const choose=i=>{if(done[ti]||wrong[ti].includes(i))return;
    if(i===t.ok){const x=[...done];x[ti]=true;setDone(x);}else{const w=wrong.map(a=>[...a]);w[ti].push(i);setWrong(w);}};
  const left=(<>
    <div className="tabs">{TB.map((x,i)=><button key={i} className={'tab'+(ti===i?' on':'')+(done[i]?' done':'')} style={{fontSize:'.85em',padding:'.2em .6em'}} onClick={()=>setTi(i)}>{done[i]?'✓ ':''}{x.id}{x.sub?' '+x.sub:''}</button>)}</div>
    <div className="fade" key={ti}>
      <Note><b>{t.id}.</b> {t.q}</Note>
      {t.opts.map((o,i)=>{const ok=done[ti]&&i===t.ok,bad=wrong[ti].includes(i);
        return <button key={i} className={'opt'+(ok?' ok':bad?' bad':'')} disabled={bad} onClick={()=>choose(i)}><b>{'АБВГД'[i]}</b><span>{o}</span></button>;})}
      {done[ti]&&<div className="fb ok">Правильно! <span style={{fontWeight:600}}>{t.ex}</span></div>}
      {!done[ti]&&wrong[ti].length>0&&<div className="fb bad">Неправильно. Спробуй інший варіант.</div>}
      {done[ti]&&ti<TB.length-1&&<button className="btn" onClick={()=>setTi(ti+1)}>Наступне завдання →</button>}
      {done.every(Boolean)&&<div className="fb ok">Усі завдання виконано правильно!</div>}
    </div>
  </>);
  const sc=done[ti]?t.after:(t.init||EMPTY);
  return <Frame left={left} scene={sc} legend={done[ti]?t.leg:null} camKey={ti} yaw0={0.6} pitch0={0.42}/>;
}
