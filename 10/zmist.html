<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 10 клас — зміст</title>
<style>
  :root{
    --main:#7b4fc9;      /* фіолетовий — колір 10 класу */
    --soft:#ece3fa;
    --softer:#f7f3fd;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#d5c4f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 10 клас</h1>
  <p class="sub">Теми за підручником. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКА ===== */
const ZMIST = [
 {rozdil:"Розділ 1. Алгебра і початки аналізу", par:[
  {t:"§ 1. Функції, їхні властивості та графіки", temy:[
   ["a1","Найбільше і найменше значення функції. Парні та непарні функції"],
   ["a2","Степенева функція з натуральним показником"],
   ["a3","Степенева функція із цілим показником"],
   ["a4","Означення кореня n-го степеня"],
   ["a5","Властивості кореня n-го степеня"],
   ["a6","Означення та властивості степеня з раціональним показником"],
   ["a7","Ірраціональні рівняння"]]},
  {t:"§ 2. Тригонометричні функції", temy:[
   ["a8","Радіанна міра кутів"],
   ["a9","Тригонометричні функції числового аргументу"],
   ["a10","Знаки значень тригонометричних функцій. Парність і непарність тригонометричних функцій"],
   ["a11","Властивості та графіки тригонометричних функцій"],
   ["a12","Основні співвідношення між тригонометричними функціями одного й того самого аргументу"],
   ["a13","Формули додавання"],
   ["a14","Формули зведення"],
   ["a15","Рівняння cos x = b"],
   ["a16","Рівняння sin x = b і tg x = b"],
   ["a17","Тригонометричні рівняння, які зводяться до алгебраїчних"]]},
  {t:"§ 3. Похідна та її застосування", temy:[
   ["a18","Задачі про миттєву швидкість і дотичну до графіка функції"],
   ["a19","Поняття похідної"],
   ["a20","Правила обчислення похідних"],
   ["a21","Рівняння дотичної"],
   ["a22","Ознаки зростання і спадання функції"],
   ["a23","Точки екстремуму функції"],
   ["a24","Найбільше і найменше значення функції"],
   ["a25","Побудова графіків функцій"]]},
  {t:"Повторення курсу алгебри і початків аналізу 10 класу", temy:[["povt_a","Вправи для повторення курсу алгебри і початків аналізу 10 класу"]]}
 ]},
 {rozdil:"Розділ 2. Стереометрія", par:[
  {t:"§ 4. Паралельність у просторі", temy:[
   ["g27","Основні поняття стереометрії. Аксіоми стереометрії"],
   ["g28","Просторові фігури. Початкові відомості про многогранники"],
   ["g29","Взаємне розміщення двох прямих у просторі"],
   ["g30","Паралельність прямої та площини"],
   ["g31","Паралельність площин"],
   ["g32","Паралельне проектування"],
   ["pidsum_g4","Підсумок § 4. Паралельність у просторі"]]},
  {t:"§ 5. Перпендикулярність у просторі", temy:[
   ["g33","Кут між прямими в просторі"],
   ["g34","Перпендикулярність прямої та площини"],
   ["g35","Перпендикуляр і похила"],
   ["g36","Кут між прямою та площиною"],
   ["g37","Двогранний кут. Кут між площинами"]]},
  {t:"§ 6. Координати та вектори в просторі", temy:[
   ["g38","Декартові координати точки в просторі"],
   ["g39","Вектори в просторі"],
   ["g40","Додавання і віднімання векторів"],
   ["g41","Множення вектора на число"],
   ["g42","Скалярний добуток векторів"]]},
  {t:"Повторення курсу геометрії 10 класу", temy:[["povt_g","Вправи для повторення курсу геометрії 10 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми з буквою (a — алгебра, g — геометрія), напр. a5, g30; povt_a / povt_g — повторення.
   test:true — кнопка буде світлою (для тестів).
   Приклад:  a5: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
  a2: [{n:"Урок", url:"https://sites.google.com/view/stepenevafunktsiia-naturalny"},
       {n:"Тест", url:"https://sites.google.com/view/stepeneva-test", test:true}],
  a3: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/10/stepeneva-funktsiia-tsilyi-pokaznyk.html"}, {n:"Вправи", url:"https://github.com/Tetiana-8/matemka/blob/main/10/%E2%84%963%20%D0%92%D0%BF%D1%80%D0%B0%D0%B2%D0%B8%203.1%E2%80%933.9%20%D0%A1%D1%82%D0%B5%D0%BF%D0%B5%D0%BD%D0%B5%D0%B2%D0%B0%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D1%96%D1%8F%20%D0%B7%20%D1%86%D1%96%D0%BB%D0%B8%D0%BC%20%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%BD%D0%B8%D0%BA%D0%BE%D0%BC.html"}],
  pidsum_g4: [{n:"Урок-презентація", url:"https://tetiana-8.github.io/matemka/10/pidsumok-paralelnist-u-prostori.html"}]
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  if(r.rozdil){ const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h); }
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const isT=k=>typeof k==="number"||/^[ag]\d+$/.test(k);
    const nTem=p.temy.filter(x=>isT(x[0])).length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"){ html+=`<li class="check">✔ ${name}</li>`; return; }
      if(k==="chvert1"||/^pidsum/.test(k)){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : (/^[ag]\d+$/.test(k) ? k.slice(1) : "↺");
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
</body>
</html>
