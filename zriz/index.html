<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зріз знань</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#3b3552;
  background:linear-gradient(135deg,#fde7f1 0%,#efe9fb 35%,#e3f1fb 65%,#e4f6ea 100%);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#app{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 10px 0}
.screen{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:0;position:relative}
.card{background:rgba(255,255,255,.88);border-radius:18px;box-shadow:0 4px 18px rgba(120,100,170,.14);padding:16px 18px}
h1{font-size:22px;color:#5a4b8a;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:#7d7699;text-align:center;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:#5a4b8a;margin:10px 0 5px}
input[type=text],select{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;color:#3b3552;outline:none}
input[type=text]:focus,select:focus{border-color:#a695d6}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;padding:11px 8px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;font-weight:600;color:#5a4b8a;cursor:pointer}
.seg button.on{background:#e5dcf7;border-color:#a695d6}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;border:none;background:#b9a6ea;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#a994e0}
.btn:disabled{background:#d8d0ec;cursor:default}
.btn.soft{background:#ece6f8;color:#5a4b8a}
.btn.soft:hover{background:#e0d6f3}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:#8e7cc3;font-size:14px;font-weight:600;cursor:pointer;padding:6px 2px}
.back:hover{text-decoration:underline}
.err{color:#b04a5a;font-size:13px;margin-top:8px;min-height:18px;text-align:center}
.note{font-size:12px;color:#8b84a3;margin-top:8px;line-height:1.4}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;color:#7d7699}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.dots{display:flex;gap:6px}
.dots span{width:10px;height:10px;border-radius:50%;background:#ddd5f1}
.dots span.d{background:#b9a6ea}
.dots span.c{background:#8e7cc3}
.qbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.q{font-size:18px;line-height:1.5;color:#2f2946}
.tt{font-size:12px;font-weight:700;color:#8e7cc3;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:11px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:16px;cursor:pointer;text-align:left;color:#2f2946;min-height:46px;display:flex;align-items:center}
.opt:hover{border-color:#b9a6ea}
.opt.on{background:#e5dcf7;border-color:#8e7cc3}
.disp{min-height:50px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:24px;padding:8px 14px;color:#2f2946;display:flex;align-items:center;justify-content:space-between}
.disp .ph{color:#b6afcc;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{padding:11px 0;border-radius:12px;border:none;background:#efe9fb;font-size:20px;font-weight:600;color:#4a3d78;cursor:pointer}
.pad button:active{background:#ddd2f4}
.act{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}
.link{background:none;border:none;color:#8b84a3;font-size:13px;text-decoration:underline;cursor:pointer}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em;line-height:1.2}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:1.6px solid currentColor}
.sys{display:inline-block;border-left:3px solid #8e7cc3;padding-left:10px;border-radius:2px;vertical-align:middle;line-height:1.5}
sub,sup{font-size:.7em}
/* results */
.scroll{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.res-head{text-align:center}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:700;font-size:16px;margin:6px 0}
.g{background:#cdebd6;color:#2f6b45}.y{background:#fff1c2;color:#8a6a00}.r{background:#fadadd;color:#a33b4a}.n{background:#ececf2;color:#6b6585}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:#f6f2fd;border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;color:#5a4b8a}
.stat span{font-size:11px;color:#8b84a3}
h2{font-size:16px;color:#5a4b8a;margin:16px 0 8px}
.item{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1.5px solid #ece6f8}
.item .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15px}
.item .num{width:24px;height:24px;border-radius:50%;background:#e5dcf7;color:#5a4b8a;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.item p{font-size:13px;line-height:1.45;color:#5b5476;margin-top:5px}
.item p b{color:#4a3d78}
.map{display:flex;flex-wrap:wrap;gap:6px}
.map .m{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:600}
.mis{font-size:13px;line-height:1.5;border-bottom:1px dashed #e3dcf3;padding:8px 0}
.mis .a{color:#a33b4a}.mis .ok{color:#2f6b45}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
#foot{font-size:10px;letter-spacing:.05em;color:#9ca3af;text-align:center;padding:6px 0 8px}
#foot b{font-weight:700}
.key{position:absolute;top:0;right:0;background:none;border:none;font-size:15px;opacity:.5;cursor:pointer}
.key:hover{opacity:1}
.modal{position:fixed;inset:0;background:rgba(60,50,90,.25);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.modal .box{background:#fff;border-radius:18px;padding:16px;max-width:860px;width:100%;max-height:88dvh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid #eee8f8;padding:6px 5px;text-align:left;vertical-align:top}
th{color:#5a4b8a}
@media (max-width:520px){.opts{grid-template-columns:1fr}.q{font-size:17px}h1{font-size:20px}}
@media (max-height:640px){.pad button{padding:8px 0;font-size:18px}.q{font-size:16px}}
@media print{
  body{height:auto;overflow:visible;background:#fff}#app{display:block;padding:0}.scroll{overflow:visible}
  .btns,#foot,.key{display:none}.card{box-shadow:none}
}
</style>

var st = {name:"",surname:"",first:"",subj:"",grade:0,stop:-1,book:"merzliak"};
function saveNames(){if($("sn"))st.surname=$("sn").value;if($("fn"))st.first=$("fn").value;}
var run = null;      // стан тестування
var CFG_FB = null;   // firebase
var sessionId = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(s){return String(s).replace(/\[\[(.+?)\|(.+?)\]\]/g,'<span class="fr"><i>$1</i><i>$2</i></span>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function chip(g){var c=GRADE_COLORS[g]||["#eee","#555"];return '<span class="chip" style="background:'+c[0]+';color:'+c[1]+'">'+g+' клас</span>';}
function okBook(x){return !x[2] || (x[2]==="ister" ? st.book==="ister" : st.book!=="ister");}
function stepsOf(S,g){return (STEPS[S][g]||[]).filter(okBook);}
function nextGradeSteps(){return st.subj && st.grade ? stepsOf(st.subj,st.grade+1) : [];}

/* --- побудова черги --- */
function computeStudied(){
  var S=st.subj,done=[],partial=[],last=[];
  Object.keys(STEPS[S]).map(Number).sort(function(a,b){return a-b;}).forEach(function(g){
    var l=stepsOf(S,g);
    if(g<=st.grade){l.forEach(function(x){done.push(x[1]);});if(g===st.grade)l.forEach(function(x){last.push(x[1]);});}
    else if(g===st.grade+1&&st.stop>=0){l.slice(0,st.stop+1).forEach(function(x){partial.push(x[1]);});}
  });
  return {studied:uniq(done.concat(partial)),init:uniq(partial.concat(last))};
}
function uniq(a){var s={},r=[];a.forEach(function(x){if(!s[x]){s[x]=1;r.push(x);}});return r;}
function closure(ids){var seen={},st2=ids.slice();while(st2.length){var x=st2.pop();B[x].d.forEach(function(y){if(!seen[y]){seen[y]=1;st2.push(y);}});}return Object.keys(seen);}
function depth(id,memo){memo=memo||{};if(memo[id]!=null)return memo[id];var m=0;B[id].d.forEach(function(d){m=Math.max(m,depth(d,memo)+1);});memo[id]=m;return m;}

function startQuiz(){
  saveNames();
  st.surname=st.surname.trim();st.first=st.first.trim();st.name=st.surname+" "+st.first;
  var e=$("err");
  if(!st.surname||!st.first){e.textContent="Введи прізвище та ім'я.";return;}
  if(!st.subj){e.textContent="Обери предмет.";return;}
  if(!st.grade){e.textContent="Обери завершений клас.";return;}
  var c=computeStudied();
  var init=c.init.length?c.init:START[st.subj];
  run={queue:init.slice(),tested:{},studied:c.studied,initial:init.slice(),cur:null,answers:[],answered:0,done:false,origInit:init.slice(),hist:[],t0:Date.now(),t1:0,leaves:0,awaySec:0,awayAt:null};
  nextBlock();
}
function nextBlock(){
  if(!run.queue.length){return showResult();}
  var id=run.queue.shift();
  var qs=Q.filter(function(q){return q.b===id;});
  run.cur={id:id,qs:qs,i:0,ok:0};
  showQuestion();
}

/* --- екран завдання --- */
function showQuestion(){
  var c=run.cur,q=c.qs[c.i];
  var map=B[c.id];
  var h='<div class="screen"><div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">';
  h+='<div class="top"><div>'+chip(map.g)+' <span style="margin-left:4px">'+esc(map.n)+'</span></div><div class="dots">';
  for(var i=0;i<c.qs.length;i++)h+='<span class="'+(i<c.i?'c':(i===c.i?'d':''))+'"></span>';
  h+='</div></div><div class="qbox">';
  h+='<div><div class="tt">'+(q.t==="т"?"Теорія":"Практика")+'</div><div class="q">'+fmt(q.q)+'</div></div>';
  if(q.k==="mc"){
    run.order=shuffle(q.o.map(function(_,i){return i;}));
    h+='<div class="opts" id="opts">';
    run.order.forEach(function(oi,pos){h+='<button class="opt" data-p="'+pos+'">'+fmt(q.o[oi])+'</button>';});
    h+='</div>';
  }else{
    h+='<div class="disp"><span id="val"></span><span class="ph" id="ph">введи відповідь</span></div>';
    h+='<div class="pad" id="pad">';
    ["7","8","9","4","5","6","1","2","3","−","0",","].forEach(function(k){h+='<button data-k="'+k+'">'+k+'</button>';});
    h+='</div>';
  }
  h+='<div class="act"><div>'+(run.hist.length?'<button class="back" id="bk">← Назад</button> ':'')+'<button class="link" id="dk">Не знаю</button></div><button class="btn" id="nx" disabled>Далі →</button></div>';
  h+='</div></div></div>';
  $("app").innerHTML=h;
  run.sel=null;run.txt="";
  if(q.k==="mc"){
    $("opts").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;
      Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.classList.remove("on");});
      b.classList.add("on");run.sel=+b.dataset.p;$("nx").disabled=false;};
  }else{
    $("pad").onclick=function(e){var b=e.target.closest("button");if(!b)return;typeKey(b.dataset.k);};
  }
  $("nx").onclick=function(){submit(false);};
  $("dk").onclick=function(){submit(true);};
  if($("bk"))$("bk").onclick=goBack;
}
function goBack(){
  if(!run||!run.hist.length)return;
  var s=JSON.parse(run.hist.pop());
  run.queue=s.queue;run.tested=s.tested;run.answers=s.answers;run.answered=s.answered;run.cur=s.cur;
  showQuestion();
}
function typeKey(k){
  if(!run.cur)return;
  var q=run.cur.qs[run.cur.i];if(q.k!=="num")return;
  if(k==="⌫"){run.txt=run.txt.slice(0,-1);}
  else if(k==="−"){if(run.txt.length===0)run.txt="−";}
  else if(k===","){if(run.txt.indexOf(",")<0&&run.txt.replace("−","").length>0)run.txt+=",";}
  else{if(run.txt.replace(/[−,]/g,"").length<9)run.txt+=k;}
  $("val").textContent=run.txt;$("ph").style.display=run.txt?"none":"";
  $("nx").disabled=!/\d/.test(run.txt);
}
document.addEventListener("keydown",function(e){
  if(!run||!run.cur||run.done)return;
  var q=run.cur.qs[run.cur.i];if(!q)return;
  if(e.key==="Enter"){var n=$("nx");if(n&&!n.disabled){submit(false);}return;}
  if(q.k!=="num")return;
  if(/^[0-9]$/.test(e.key))typeKey(e.key);
  else if(e.key===","||e.key===".")typeKey(",");
  else if(e.key==="-")typeKey("−");
  else if(e.key==="Backspace"){typeKey("⌫");e.preventDefault();}
});
/* доброчесність: виходи з вікна під час тесту */
function goAway(){if(!run||run.done||!run.cur||run.awayAt)return;run.leaves++;run.awayAt=Date.now();}
function comeBack(){if(run&&run.awayAt){run.awaySec+=Math.round((Date.now()-run.awayAt)/1000);run.awayAt=null;}}
document.addEventListener("visibilitychange",function(){if(document.hidden)goAway();else comeBack();});
window.addEventListener("blur",goAway);
window.addEventListener("focus",comeBack);
function grade12(ok,all){if(!all)return 1;return Math.max(1,Math.round(ok*12/all));}
function mmss(sec){var m=Math.floor(sec/60),s=sec%60;return m+" хв "+(s<10?"0":"")+s+" с";}
function parseNum(s){return Number(String(s).replace(/\s/g,"").replace("−","-").replace(",","."));}
function showNum(a){return String(a).replace(".",",").replace("-","−");}
function submit(skip){
  run.hist.push(JSON.stringify({queue:run.queue,tested:run.tested,answers:run.answers,answered:run.answered,cur:run.cur}));
  var c=run.cur,q=c.qs[c.i],ok=false,given="",right="";
  if(q.k==="mc"){
    right=q.o[q.a];
    if(!skip&&run.sel!=null){var oi=run.order[run.sel];given=q.o[oi];ok=(oi===q.a);}
  }else{
    right=showNum(q.a);
    if(!skip&&/\d/.test(run.txt)){given=run.txt;var v=parseNum(run.txt);ok=Math.abs(v-q.a)<0.0005;}
  }
  if(skip)given="";
  run.answers.push({b:c.id,t:q.t,q:q.q,given:given,right:right,ok:ok});
  run.answered++;
  if(ok)c.ok++;
  c.i++;
  if(c.i<c.qs.length)return showQuestion();
  var total=c.qs.length;
  run.tested[c.id]={c:c.ok,t:total};
  if(c.ok<2){B[c.id].d.forEach(function(d){if(!run.tested[d]&&run.queue.indexOf(d)<0)run.queue.push(d);});}
  nextBlock();
}

/* --- результати --- */
function status(r){return r.c>=r.t?"g":(r.c>=2?"y":"r");}
function computeResult(){
  var T=run.tested,ids=Object.keys(T);
  var passed=ids.filter(function(i){return T[i].c>=2;});
  var assumedSet={};
  closure(passed).forEach(function(d){if(!T[d])assumedSet[d]=1;});
  run.studied.forEach(function(d){if(!T[d])assumedSet[d]=1;});
  var red=ids.filter(function(i){return status(T[i])==="r";});
  var yel=ids.filter(function(i){return status(T[i])==="y";});
  var all=0,ok=0,tOk=0,tAll=0,pOk=0,pAll=0;
  run.answers.forEach(function(a){all++;if(a.ok)ok++;if(a.t==="т"){tAll++;if(a.ok)tOk++;}else{pAll++;if(a.ok)pOk++;}});
  var iOk=0,iAll=0;
  run.answers.forEach(function(a){if(run.origInit.indexOf(a.b)>=0){iAll++;if(a.ok)iOk++;}});
  var grade=grade12(iOk,iAll);
  var ratio=ids.length?red.length/ids.length:0;
  var lvl,cls;
  if(!red.length&&yel.length<=1){lvl="Високий рівень";cls="g";}
  else if(!red.length){lvl="Достатній рівень";cls="y";}
  else if(ratio<=0.4){lvl="Середній рівень: є прогалини";cls="y";}
  else{lvl="Потрібно систематичне повторення";cls="r";}
  var plan=red.concat(yel);var memo={};
  plan.sort(function(a,b){var da=depth(a,memo),db=depth(b,memo);return da!==db?da-db:B[a].g-B[b].g;});
  var minGrade=red.length?Math.min.apply(null,red.map(function(i){return B[i].g;})):0;
  return {grade:grade,T:T,ids:ids,assumed:Object.keys(assumedSet),red:red,yel:yel,plan:plan,all:all,ok:ok,tAll:tAll,tOk:tOk,pAll:pAll,pOk:pOk,lvl:lvl,cls:cls,minGrade:minGrade};
}
function pct(a,b){return b?Math.round(a*100/b)+"%":"—";}
function showResult(){
  comeBack();run.done=true;run.cur=null;run.t1=Date.now();
  var r=computeResult();run.res=r;
  var dur=Math.max(1,Math.round((run.t1-run.t0)/1000));run.dur=dur;
  var h='<div class="screen"><div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="scroll" id="sc">';
  h+='<div class="res-head"><h1>Результат</h1><div class="sub">'+esc(st.name)+' · '+SUBJ[st.subj]+', завершено: '+(st.grade===4?"початкову школу":st.grade+" клас")+
     (st.stop>=0&&nextGradeSteps()[st.stop]?'<br>остання тема наступного класу: '+esc(nextGradeSteps()[st.stop][0]):'')+'</div>';
  h+='<span class="badge '+r.cls+'">'+r.lvl+'</span>';
  if(r.red.length&&r.minGrade){
    h+='<div class="note" style="font-size:13px;color:#5b5476">'+(r.minGrade>5?'Надійна основа — до '+(r.minGrade-1)+' класу включно. Прогалини починаються з '+r.minGrade+' класу.':'Є прогалини в основі — починаючи з '+r.minGrade+' класу.')+'</div>';
  }
  h+='<div class="stats"><div class="stat"><b>'+r.grade+' / 12</b><span>оцінка</span></div><div class="stat"><b>'+r.ok+' з '+r.all+'</b><span>правильних відповідей</span></div>'+
     '<div class="stat"><b>'+pct(r.tOk,r.tAll)+'</b><span>теорія</span></div><div class="stat"><b>'+pct(r.pOk,r.pAll)+'</b><span>практика</span></div></div>';
  h+='<div class="note" style="font-size:13px;color:#5b5476">Час виконання: '+mmss(dur)+'. '+
     (run.leaves?'Під час тесту ти виходив(ла) з вікна '+run.leaves+' '+(run.leaves===1?'раз':'разів')+' (разом '+mmss(run.awaySec)+'). Учитель бачить цю інформацію, тож не впевнений, що відповіді були самостійними.':'Ти виконував(ла) тест, не виходячи з вікна. Це доброчесно.')+
     '</div><div class="note">Оцінка виставлена за темами твого класу; теми, які додатково перевірялись, на неї не впливають.</div></div>';

  if(r.plan.length){
    h+='<h2>Що надолужити (у такому порядку)</h2>';
    r.plan.forEach(function(id,i){
      var t=r.T[id],b=B[id],s=status(t);
      h+='<div class="item"><div class="t"><span class="num">'+(i+1)+'</span><span>'+esc(b.n)+'</span>'+chip(b.g)+
         '<span class="chip '+s+'">'+(s==="r"?"прогалина":"закріпити")+' · '+t.c+'/'+t.t+'</span></div>'+
         '<p><b>Що повторити:</b> '+esc(b.desc)+'.</p><p><b>Де в підручнику:</b> '+esc(b.ref)+'</p></div>';
    });
    h+='<div class="note">Починай із першої теми зі списку: наступні спираються на попередні.</div>';
  }else{
    h+='<h2>Висновок</h2><div class="item"><p>Усі перевірені теми засвоєно. Можна впевнено рухатися далі за програмою.</p></div>';
  }

  h+='<h2>Карта тем</h2><div class="map">';
  var order=r.ids.concat(r.assumed).sort(function(a,b){return B[a].g-B[b].g||a.localeCompare(b,undefined,{numeric:true});});
  order.forEach(function(id){
    var t=r.T[id],cls=t?status(t):"n",label=t?(t.c+"/"+t.t):"не перевірялась";
    h+='<span class="m '+cls+'" title="'+esc(B[id].n)+'">'+esc(SUBJ[id[0]].charAt(0)+id.slice(1))+' · '+esc(shortName(B[id].n))+' — '+label+'</span>';
  });
  h+='</div><div class="note">Зелений — засвоєно, жовтий — потрібно закріпити, червоний — прогалина, сірий — не перевірялась (учень впорався з темами, що на неї спираються, тож її вважаємо засвоєною).</div>';

  var wrong=run.answers.filter(function(a){return !a.ok;});
  if(wrong.length){
    h+='<h2>Розбір помилок ('+wrong.length+')</h2>';
    wrong.forEach(function(a){
      h+='<div class="mis"><b>'+esc(shortName(B[a.b].n))+'</b> · '+(a.t==="т"?"теорія":"практика")+'<br>'+fmt(a.q)+
         '<br><span class="a">Твоя відповідь: '+(a.given?fmt(a.given):"— (не знаю)")+'</span><br><span class="ok">Правильна відповідь: '+fmt(a.right)+'</span></div>';
    });
  }
  h+='<div class="btns"><button class="btn sm" id="again">Пройти ще раз</button>';
  if(r.assumed.length)h+='<button class="btn sm soft" id="deep">Перевірити й решту тем</button>';
  h+='<button class="btn sm soft" id="prn">Друк / PDF</button><button class="btn sm soft" id="cp">Копіювати результат</button></div><div class="center note" id="cpm"></div>';
  h+='</div></div></div>';
  $("app").innerHTML=h;
  $("again").onclick=function(){showSetup();};
  if($("deep"))$("deep").onclick=function(){
    run.done=false;run.queue=r.assumed.filter(function(x){return !run.tested[x];});nextBlock();};
  $("prn").onclick=function(){window.print();};
  $("cp").onclick=copyResult;
  saveResult(r);
}
function shortName(n){var s=n.split(":")[0].split(",")[0];return s.length>34?s.slice(0,32)+"…":s;}
function textSummary(){
  var r=run.res,L=[];
  L.push("Зріз знань — "+st.name);
  L.push(SUBJ[st.subj]+", завершено: "+(st.grade===4?"початкову школу":st.grade+" клас"));
  L.push("Оцінка: "+r.grade+" з 12. Час: "+mmss(run.dur)+". Виходів з вікна: "+run.leaves);
  L.push("Рівень: "+r.lvl+". Правильно: "+r.ok+" з "+r.all+" (теорія "+pct(r.tOk,r.tAll)+", практика "+pct(r.pOk,r.pAll)+")");
  if(r.plan.length){L.push("Треба надолужити:");r.plan.forEach(function(id,i){L.push((i+1)+". "+B[id].n+" ("+B[id].g+" кл.) — "+(status(r.T[id])==="r"?"прогалина":"закріпити"));});}
  else L.push("Усі перевірені теми засвоєно.");
  return L.join("\n");
}
function copyResult(){
  var t=textSummary(),m=$("cpm");
  function ok(){m.textContent="Скопійовано.";}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallback();});}else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){m.textContent="Не вдалося скопіювати.";}document.body.removeChild(ta);}
}

/* --- збір результатів (Firebase, якщо задано конфіг) --- */
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function fbReady(){
  if(!FIREBASE_CONFIG)return Promise.reject();
  if(CFG_FB)return CFG_FB;
  var base="https://www.gstatic.com/firebasejs/10.12.2/";
  CFG_FB=loadScript(base+"firebase-app-compat.js").then(function(){return loadScript(base+"firebase-auth-compat.js");})
    .then(function(){return loadScript(base+"firebase-firestore-compat.js");})
    .then(function(){firebase.initializeApp(FIREBASE_CONFIG);return firebase.auth().signInAnonymously();})
    .then(function(){return firebase.firestore();});
  return CFG_FB;
}
function fbCol(db){return db.collection("artifacts").doc(FB_APP_ID).collection("public").doc("data").collection(FB_COLLECTION);}
function saveResult(r){
  if(!FIREBASE_CONFIG)return;
  fbReady().then(function(db){
    return fbCol(db).doc(sessionId).set({
      name:st.name,surname:st.surname,first:st.first,date:new Date(run.t1).toISOString(),start:new Date(run.t0).toISOString(),end:new Date(run.t1).toISOString(),
      durationSec:run.dur,mark:r.grade,leaves:run.leaves,awaySec:run.awaySec,subject:SUBJ[st.subj],grade:st.grade,
      stop:(st.stop>=0&&nextGradeSteps()[st.stop])?nextGradeSteps()[st.stop][0]:"",
      level:r.lvl,correct:r.ok,total:r.all,theory:pct(r.tOk,r.tAll),practice:pct(r.pOk,r.pAll),
      gaps:r.plan.map(function(id){return B[id].n+" ("+B[id].g+" кл.)";}).join("; ")
    });
  }).catch(function(){});
}
function teacherPanel(){
  var p=prompt("Пароль вчителя:");if(p!==TEACHER_PASSWORD)return;
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="box"><div class="btns" style="margin-top:0;justify-content:space-between"><b style="color:#5a4b8a">Результати учнів</b><span><button class="btn sm soft" id="clr">Очистити</button> <button class="btn sm" id="cls">Закрити</button></span></div><div id="tb">Завантаження…</div></div>';
  document.body.appendChild(m);
  $("cls").onclick=function(){document.body.removeChild(m);};
  function load(){
    fbReady().then(function(db){return fbCol(db).get();}).then(function(snap){
      var rows=[];snap.forEach(function(d){rows.push(d.data());});
      rows.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
      function tm(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString("uk-UA")+" "+d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
      var h='<table><tr><th>Учень</th><th>Початок</th><th>Кінець</th><th>Тривалість</th><th>Оцінка</th><th>Виходів з вікна</th><th>Предмет, клас</th><th>Рівень</th><th>Правильно</th><th>Теорія / практика</th><th>Що надолужити</th></tr>';
      rows.forEach(function(x){h+='<tr><td>'+esc(x.name)+'</td><td>'+esc(tm(x.start||x.date))+'</td><td>'+esc(tm(x.end||x.date))+'</td><td>'+(x.durationSec!=null?esc(mmss(x.durationSec)):"—")+'</td><td>'+(x.mark!=null?esc(x.mark)+' / 12':"—")+'</td><td>'+(x.leaves!=null?esc(x.leaves)+(x.leaves?' ('+esc(mmss(x.awaySec||0))+')':''):"—")+'</td><td>'+esc(x.subject)+', '+esc(x.grade)+' кл.</td><td>'+esc(x.level)+'</td><td>'+esc(x.correct)+' з '+esc(x.total)+'</td><td>'+esc(x.theory)+' / '+esc(x.practice)+'</td><td>'+esc(x.gaps||"—")+'</td></tr>';});
      h+='</table>';if(!rows.length)h="Результатів поки немає.";$("tb").innerHTML=h;
    }).catch(function(){$("tb").textContent="Не вдалося завантажити результати.";});
  }
  $("clr").onclick=function(){
    if(!confirm("Видалити всі результати?"))return;
    fbReady().then(function(db){return fbCol(db).get().then(function(snap){var b=db.batch();snap.forEach(function(d){b.delete(d.ref);});return b.commit();});}).then(load);
  };
  load();
}

showSetup();
</script>
