<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест. Множення одночлена на многочлен (7 клас)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#0f2f45; --muted:#55708a; --card:#ffffff; --accent:#2A6592; --accent2:#3887AF;
    --ok:#059669; --okbg:#ecfdf5; --bad:#dc2626; --badbg:#fef2f2; --line:#B5CFE0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#DCE9F2 0%,#BAD3E5 35%,#A5C5DD 65%,#D3E3EF 100%) fixed;
    padding:24px 16px 48px;
  }
  .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{margin:8px 0 4px;text-align:center;color:#173F5F;font-size:clamp(24px,4vw,40px);text-wrap:balance}
  .card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(15,47,69,.12)}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .who label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
  .who input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
  .who input:focus{border-color:var(--accent)}
  .who input.err{border-color:var(--bad);background:var(--badbg)}
  @media (max-width:560px){.who{grid-template-columns:1fr}}
  .q{display:flex;flex-direction:column;gap:12px;border:2px solid transparent;transition:border-color .2s}
  .q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
  .qhead{display:flex;gap:12px;align-items:flex-start}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .qtext{font-size:17px;line-height:1.5;padding-top:5px}
  .qmath{font-size:22px;text-align:center;padding:6px 0;overflow-x:auto}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-size:18px;transition:all .15s;background:#F4F8FB;min-height:52px}
  .opt:hover{border-color:#7FB0CE}
  .opt input{accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
  .opt .t{font-size:16px}
  .opt.chosen{border-color:var(--accent);background:#DCE9F2}
  .opt.right{border-color:var(--ok);background:var(--okbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .locked .opt{cursor:default}
  .verdict{font-weight:700;font-size:15px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .actions{display:flex;flex-direction:column;align-items:center;gap:10px}
  .btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(42,101,146,.3)}
  .btn:hover{filter:brightness(1.08)}
  .btn.light{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(15,47,69,.12)}
  .msg{color:#0f2f45;font-weight:600;text-align:center;min-height:1.4em;background:rgba(255,255,255,.7);border-radius:12px;padding:0 12px}
  .msg:empty{background:transparent;padding:0}
  .result{text-align:center}
  .result .big{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .result p{margin:6px 0;font-size:17px}
  .hidden{display:none!important}
  .sign{text-align:center;color:#64748b;font-size:13px;line-height:1.3;margin-top:6px}
  .sign b{color:#334155;font-weight:700}
  
  /* Математичний рендеринг */
  .m{font-family:"Cambria Math","Cambria","Times New Roman",Times,serif;font-size:1.2em;white-space:nowrap;letter-spacing:.02em}
  .m i{font-style:italic;padding-right:.04em}
  .m sup{font-size:.72em;font-style:normal;vertical-align:super;line-height:0;margin-left:.05em;color:#2A6592;font-weight:600}
  .m .op{padding:0 .28em}
  .m .mbox{display:inline-block;min-width:1.4em;padding:0 .2em;border:2px solid #2A6592;border-radius:6px;text-align:center;font-style:normal;color:#2A6592;font-weight:700;margin:0 .1em;background:#E6F0F5}
  .qmath.m{font-size:clamp(22px,3.5vw,32px);white-space:nowrap}

  /* Журнал вчителя */
  .key{position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:19px;cursor:pointer;box-shadow:0 2px 10px rgba(15,47,69,.15);z-index:20;transition:all .2s}
  .key:hover{background:#fff;transform:scale(1.08)}
  .modal{position:fixed;inset:0;background:rgba(15,47,69,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:30;overflow:auto}
  .panel{background:#fff;border-radius:18px;padding:20px;width:min(1100px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .panel h2{margin:0 0 12px;font-size:22px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
  .tbl{overflow-x:auto;margin-top:14px}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{border:1px solid var(--line);padding:8px;text-align:center;white-space:nowrap}
  th{background:#E6F0F5}
  td.name{text-align:left;font-weight:600}
  td.y{color:var(--ok);font-weight:800} td.n{color:var(--bad);font-weight:800}
  .small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<button class="key" id="keyBtn" title="Журнал вчителя">🔑</button>

<div class="wrap">
  <h1>Тест. Множення одночлена на многочлен (7 клас)</h1>

  <!-- Введення даних учня -->
  <div class="card who" id="who">
    <label>Прізвище <input id="surname" autocomplete="family-name" placeholder="Наприклад: Шевченко"></label>
    <label>Ім’я <input id="firstname" autocomplete="given-name" placeholder="Наприклад: Олена"></label>
  </div>

  <div id="questions" class="wrap" style="gap:16px"></div>

  <div class="card result hidden" id="result"></div>

  <div class="actions">
    <div class="msg" id="msg"></div>
    <button class="btn" id="checkBtn">Перевірити</button>
    <button class="btn light hidden" id="againBtn">Пройти ще раз (новий варіант)</button>
  </div>
  <div class="sign">Автор розробки <b>Ковтун Тетяна</b></div>
</div>

<!-- Модальне вікно для вчителя -->
<div class="modal hidden" id="modal">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2>Журнал вчителя — Результати учнів</h2>
      <button class="btn light" id="closeBtn" style="padding:8px 18px;font-size:15px">Закрити ✕</button>
    </div>
    <div id="pwdBox" class="row">
      <input type="password" id="pwd" placeholder="Пароль" autocomplete="off">
      <button class="btn" id="pwdBtn" style="padding:10px 22px;font-size:16px">Увійти</button>
      <span class="small" id="pwdMsg" style="color:var(--bad)"></span>
    </div>
    <div id="resBox" class="hidden">
      <div class="row"><button class="btn light" id="refreshBtn" style="padding:8px 18px;font-size:15px">Оновити</button><span class="small" id="resInfo"></span></div>
      <div class="tbl" id="tbl"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   НАЛАШТУВАННЯ FIREBASE
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU",
  authDomain: "math-5-892a5.firebaseapp.com",
  projectId: "math-5-892a5",
  storageBucket: "math-5-892a5.firebasestorage.app",
  messagingSenderId: "163114803328",
  appId: "1:163114803328:web:caf86c4e8b8c4b3b630665",
  measurementId: "G-E06VKZ2GP5"
};
const APP_ID = "default-app-id";                       
const COLLECTION = "mnozhennia_odnochlena_results";    
const TEACHER_PASSWORD = "8019";
const TOTAL = 12;

/* ---------- Firebase ---------- */
let db = null, authReady = null;
try {
  if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    authReady = firebase.auth().signInAnonymously();
  }
} catch (e) { console.error("Firebase init error:", e); }
const colRef = () => db.collection(`artifacts/${APP_ID}/public/data/${COLLECTION}`);

/* ---------- Допоміжні функції ---------- */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* Точний рендеринг математичних виразів та степенів */
function mathHTML(src) {
  let s = src.replace(/\\boxed\{\\,\?\\,\}/g, "\u0001").replace(/\\cdot/g, "\u0002").replace(/\{,\}/g, ",");
  let out = "", prevOperand = false;
  
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "^") {
      let exp = "";
      if (s[i + 1] === "{") { 
        const j = s.indexOf("}", i); 
        exp = s.slice(i + 2, j); 
        i = j; 
      } else { 
        let j = i + 1; 
        while (j < s.length && /\d/.test(s[j])) j++; 
        exp = s.slice(i + 1, j); 
        i = j - 1; 
      }
      out += `<sup>${exp}</sup>`; 
      prevOperand = true; 
      continue;
    }
    if (ch === "\u0001") { out += '<span class="mbox">?</span>'; prevOperand = true; continue; }
    if (ch === "\u0002") { out += '<span class="op">·</span>'; prevOperand = false; continue; }
    if (ch === "+" || ch === "-" || ch === "=") {
      const sym = ch === "-" ? "−" : ch;
      out += prevOperand ? `<span class="op">${sym}</span>` : sym;
      prevOperand = false; continue;
    }
    if (/[a-zA-Z]/.test(ch)) { out += `<i>${ch}</i>`; prevOperand = true; continue; }
    if (ch === "(") { out += "("; prevOperand = false; continue; }
    if (ch === " ") continue;
    out += ch; 
    prevOperand = /[\d)]/.test(ch) || (prevOperand && ch === ",");
  }
  return out;
}
const tex = (s, el) => { el.classList.add("m"); el.innerHTML = mathHTML(s); };

function poly(terms) {
  let out = "";
  terms.filter(([c]) => c !== 0).forEach(([c, v], i) => {
    const sign = c < 0 ? "-" : (i ? "+" : "");
    const a = Math.abs(c);
    const coef = (a === 1 && v) ? "" : String(a);
    out += sign + coef + v;
  });
  return out || "0";
}
const sgn = n => (n < 0 ? "-" : "+") + Math.abs(n);

/* ---------- Генератори тесту ---------- */
const GEN = [
  // 1. Правило
  () => ({
    kind: "t",
    text: "Щоб помножити одночлен на многочлен, потрібно:",
    right: "помножити одночлен на кожний член многочлена й отримані добутки додати",
    wrong: ["помножити одночлен лише на перший член многочлена",
            "додати одночлен до кожного члена многочлена",
            "помножити коефіцієнти, а змінні залишити без змін"]
  }),
  // 2. kx(x + c)
  () => {
    const k = ri(2, 6), c = pick([-1, 1]) * ri(2, 9);
    return { text: "Виконайте множення:", math: `${k}x(x${sgn(c)})`,
      right: poly([[k, "x^2"], [k * c, "x"]]),
      wrong: [poly([[k, "x^2"], [c, "x"]]), poly([[k, "x^2"], [k * c, ""]]), poly([[k, "x^2"], [-k * c, "x"]])] };
  },
  // 3. -ka(a - c)
  () => {
    const k = ri(2, 7), c = ri(2, 9);
    return { text: "Виконайте множення:", math: `-${k}a(a-${c})`,
      right: poly([[-k, "a^2"], [k * c, "a"]]),
      wrong: [poly([[-k, "a^2"], [-k * c, "a"]]), poly([[k, "a^2"], [-k * c, "a"]]), poly([[-k, "a^2"], [c, "a"]])] };
  },
  // 4. kx(ax^2 + bx + c)
  () => {
    const k = ri(2, 5), a = ri(2, 4), b = -ri(1, 6), c = ri(1, 7);
    return { text: "Подайте добуток у вигляді многочлена:", math: `${k}x(${a}x^2${sgn(b)}x${sgn(c)})`.replace(/([+-])1x/g, "$1x"),
      right: poly([[k * a, "x^3"], [k * b, "x^2"], [k * c, "x"]]),
      wrong: [poly([[k * a, "x^2"], [k * b, "x"], [k * c, ""]]),
              poly([[k * a, "x^3"], [b, "x^2"], [c, "x"]]),
              poly([[k * a, "x^3"], [-k * b, "x^2"], [k * c, "x"]])] };
  },
  // 5. Пропущене число
  () => {
    const k = ri(2, 5), m = ri(2, 5), n = ri(2, 8);
    return { text: "Яке число треба поставити замість «?», щоб рівність була правильною?",
      math: `${k}x(${m}x+\\boxed{\\,?\\,})=${k * m}x^2+${k * n}x`,
      right: String(n), wrong: [String(k * n), String(n + k), String(-n)] };
  },
  // 6. (x^2 - c)·kx
  () => {
    const k = ri(2, 6), c = ri(2, 9);
    return { text: "Виконайте множення:", math: `(x^2-${c})\\cdot ${k}x`,
      right: poly([[k, "x^3"], [-k * c, "x"]]),
      wrong: [poly([[k, "x^3"], [-c, "x"]]), poly([[k, "x^2"], [-k * c, "x"]]), poly([[k, "x^3"], [k * c, "x"]])] };
  },
  // 7. kab(a - mb)
  () => {
    const k = ri(2, 6), m = ri(2, 5);
    return { text: "Виконайте множення:", math: `${k}ab(a-${m}b)`,
      right: poly([[k, "a^2b"], [-k * m, "ab^2"]]),
      wrong: [poly([[k, "a^2b"], [-k * m, "ab"]]), poly([[k, "a^2b"], [k * m, "ab^2"]]), poly([[k, "ab"], [-k * m, "ab^2"]])] };
  },
  // 8. -x^2(x^3 - cx + d)
  () => {
    const c = ri(2, 7), d = ri(2, 9);
    return { text: "Подайте добуток у вигляді многочлена:", math: `-x^2(x^3-${c}x+${d})`,
      right: poly([[-1, "x^5"], [c, "x^3"], [-d, "x^2"]]),
      wrong: [poly([[-1, "x^6"], [c, "x^3"], [-d, "x^2"]]),
              poly([[-1, "x^5"], [-c, "x^3"], [-d, "x^2"]]),
              poly([[1, "x^5"], [-c, "x^3"], [d, "x^2"]])] };
  },
  // 9. ax(x + b) - ax^2
  () => {
    const a = ri(2, 6), b = ri(2, 8);
    return { text: "Спростіть вираз:", math: `${a}x(x+${b})-${a}x^2`,
      right: poly([[a * b, "x"]]),
      wrong: [poly([[2 * a, "x^2"], [a * b, "x"]]), poly([[-a * b, "x"]]), poly([[a * b, ""]])] };
  },
  // 10. ax(x - b) - a(x^2 - c)
  () => {
    const a = ri(2, 5), b = ri(2, 7), c = ri(2, 9);
    return { text: "Спростіть вираз:", math: `${a}x(x-${b})-${a}(x^2-${c})`,
      right: poly([[-a * b, "x"], [a * c, ""]]),
      wrong: [poly([[-a * b, "x"], [-a * c, ""]]), poly([[2 * a, "x^2"], [-a * b, "x"], [a * c, ""]]), poly([[a * b, "x"], [a * c, ""]])] };
  },
  // 11. Рівняння x(x + b) - x^2 = c
  () => {
    const b = ri(2, 7), t = pick([-1, 1]) * ri(2, 9), c = b * t;
    return { text: "Розв’яжіть рівняння:", math: `x(x+${b})-x^2=${c}`,
      right: String(t), wrong: [String(-t), String(c - b), String(c + b)] };
  },
  // 12. Значення виразу
  () => {
    const p = ri(2, 6), q = ri(2, 6), v = pick([-3, -2, 2, 3, 4, 5]);
    const vs = v < 0 ? `${v}` : `${v}`;
    return { text: `Спростіть вираз і знайдіть його значення при x = ${vs}:`, math: `x(x+${p})-x(x-${q})`,
      right: String((p + q) * v), wrong: [String((p - q) * v), String(-(p + q) * v), String((p + q) * v + 2 * v * v)] };
  },
];

let QS = [], checked = false;

function makeOptions(q) {
  const seen = new Set([q.right]); const opts = [q.right];
  q.wrong.forEach(w => { if (!seen.has(w)) { seen.add(w); opts.push(w); } });
  let guard = 0;
  while (opts.length < 4 && guard++ < 50) {
    const base = q.kind === "t" ? null : q.right;
    const extra = base && /^-?\d+$/.test(base) ? String(Number(base) + ri(1, 9) * pick([-1, 1])) : (base ? base.replace(/(\d+)/, m => String(Number(m) + ri(1, 3))) : null);
    if (extra && !seen.has(extra)) { seen.add(extra); opts.push(extra); }
  }
  return shuffle(opts);
}

function build() {
  checked = false;
  QS = GEN.map(g => { const q = g(); q.kind = q.kind || "m"; q.opts = makeOptions(q); q.answer = null; return q; });
  const box = document.getElementById("questions");
  box.innerHTML = "";
  QS.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "card q"; card.id = "q" + i;
    card.innerHTML = `<div class="qhead"><div class="num">${i + 1}</div><div class="qtext"></div></div>
      ${q.math ? '<div class="qmath"></div>' : ""}
      <div class="opts"></div><div class="verdict hidden"></div>`;
    card.querySelector(".qtext").textContent = q.text;
    if (q.math) tex(q.math, card.querySelector(".qmath"));
    const opts = card.querySelector(".opts");
    q.opts.forEach((o, j) => {
      const lab = document.createElement("label");
      lab.className = "opt";
      lab.innerHTML = `<input type="radio" name="r${i}" id="r${i}_${j}"><span class="${q.kind === "t" ? "t" : ""}"></span>`;
      const span = lab.querySelector("span");
      if (q.kind === "t") span.textContent = o; else tex(o, span);
      lab.querySelector("input").addEventListener("change", () => {
        if (checked) return;
        q.answer = o;
        opts.querySelectorAll(".opt").forEach(x => x.classList.remove("chosen"));
        lab.classList.add("chosen");
      });
      opts.appendChild(lab);
    });
    box.appendChild(card);
  });
  document.getElementById("result").classList.add("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");
  document.getElementById("againBtn").classList.add("hidden");
  document.getElementById("msg").textContent = "";
}

/* ---------- Обробка тесту ---------- */
document.getElementById("checkBtn").addEventListener("click", async () => {
  const sn = document.getElementById("surname"), fn = document.getElementById("firstname");
  const msg = document.getElementById("msg");
  sn.classList.toggle("err", !sn.value.trim()); fn.classList.toggle("err", !fn.value.trim());
  if (!sn.value.trim() || !fn.value.trim()) {
    msg.textContent = "Введіть прізвище та ім’я на початку тесту";
    document.getElementById("who").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const left = QS.filter(q => q.answer === null).length;
  if (left) {
    msg.textContent = `Дайте відповідь на всі запитання (залишилось: ${left})`;
    const first = QS.findIndex(q => q.answer === null);
    document.getElementById("q" + first).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  checked = true; msg.textContent = "";
  const marks = QS.map(q => q.answer === q.right);
  QS.forEach((q, i) => {
    const card = document.getElementById("q" + i);
    card.classList.add(marks[i] ? "ok" : "bad", "locked");
    card.querySelectorAll(".opt").forEach((lab, j) => {
      lab.querySelector("input").disabled = true;
      if (q.opts[j] === q.right) lab.classList.add("right");
      else if (q.opts[j] === q.answer) lab.classList.add("wrong");
    });
    const v = card.querySelector(".verdict");
    v.classList.remove("hidden"); v.classList.add(marks[i] ? "ok" : "bad");
    v.textContent = marks[i] ? "✓ Правильно" : "✗ Неправильно — правильну відповідь виділено зеленим";
  });
  const score = marks.filter(Boolean).length;
  const sName = sn.value.trim(), fName = fn.value.trim();
  const res = document.getElementById("result");
  res.innerHTML = `<p><b>${sName} ${fName}</b></p><div class="big">${score} / ${TOTAL}</div><p>Ваша оцінка: <b>${score}</b> ${score >= 10 ? "— чудово! 🎉" : score >= 7 ? "— добре!" : "— варто ще потренуватися."}</p>`;
  res.classList.remove("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("againBtn").classList.remove("hidden");
  res.scrollIntoView({ behavior: "smooth", block: "center" });

  if (db) {
    try {
      await authReady;
      const id = Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      await colRef().doc(id).set({
        surname: sName, firstname: fName, fullName: `${sName} ${fName}`,
        date: new Date().toISOString(), score, total: TOTAL, answers: marks
      });
    } catch (e) { console.error("Помилка збереження результатів:", e); }
  }
});

document.getElementById("againBtn").addEventListener("click", () => { build(); window.scrollTo({ top: 0, behavior: "smooth" }); });

/* ---------- Панель вчителя ---------- */
const modal = document.getElementById("modal");
document.getElementById("keyBtn").addEventListener("click", () => { modal.classList.remove("hidden"); document.getElementById("pwd").focus(); });
document.getElementById("closeBtn").addEventListener("click", () => modal.classList.add("hidden"));

const tryLogin = () => {
  if (document.getElementById("pwd").value === TEACHER_PASSWORD) {
    document.getElementById("pwdBox").classList.add("hidden");
    document.getElementById("resBox").classList.remove("hidden");
    document.getElementById("pwdMsg").textContent = "";
    loadResults();
  } else document.getElementById("pwdMsg").textContent = "Неправильний пароль";
};

document.getElementById("pwdBtn").addEventListener("click", tryLogin);
document.getElementById("pwd").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
document.getElementById("refreshBtn").addEventListener("click", loadResults);

async function loadResults() {
  const info = document.getElementById("resInfo"), tbl = document.getElementById("tbl");
  if (!db) { info.textContent = "Помилка підключення до бази даних."; tbl.innerHTML = ""; return; }
  info.textContent = "Завантаження…";
  try {
    await authReady;
    const snap = await colRef().get();
    const rows = [];
    snap.forEach(d => rows.push(d.data()));
    rows.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    info.textContent = `Усього спроб: ${rows.length}`;
    let h = "<table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Бали</th>";
    for (let i = 1; i <= TOTAL; i++) h += `<th>${i}</th>`;
    h += "</tr></thead><tbody>";
    rows.forEach((r, k) => {
      const dt = r.date ? new Date(r.date).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      h += `<tr><td>${k + 1}</td><td class="name"></td><td>${dt}</td><td><b>${r.score} / ${r.total || TOTAL}</b></td>`;
      for (let i = 0; i < TOTAL; i++) { const v = (r.answers || [])[i]; h += v ? '<td class="y">✓</td>' : '<td class="n">✗</td>'; }
      h += "</tr>";
    });
    h += "</tbody></table>";
    tbl.innerHTML = h;
    tbl.querySelectorAll("td.name").forEach((td, k) => td.textContent = rows[k].fullName || `${rows[k].surname || ""} ${rows[k].firstname || ""}`);
  } catch (e) {
    console.error(e); info.textContent = "Не вдалося завантажити результати: " + e.message;
  }
}

build();

<script>
(function(){

  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };

  /* ---------- розмір і перемальовування ---------- */

  function sy(){ return window.pageYOffset || 0; }

    var w = window.innerWidth, h = window.innerHeight;

    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);

  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){

    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {

      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс

    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);

    var V = p1.concat(p2.slice(1, -1));

    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);

    }

    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);

      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }

    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
