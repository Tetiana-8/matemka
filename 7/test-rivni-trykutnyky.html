<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест. Рівні трикутники. Висота, медіана, бісектриса (7 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f2f45; --muted:#55708a; --card:#ffffff; --accent:#2A6592; --accent2:#3887AF; --light:#DCE9F2;
    --ok:#059669; --okbg:#ecfdf5; --bad:#dc2626; --badbg:#fef2f2; --line:#B5CFE0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#DCE9F2 0%,#BAD3E5 35%,#A5C5DD 65%,#D3E3EF 100%) fixed;
    padding:24px 16px 48px;
  }
  .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{margin:8px 0 4px;text-align:center;color:#173F5F;font-size:clamp(24px,4vw,40px);font-weight:900;text-wrap:balance}
  .card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(15,47,69,.12)}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .who label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
  .who input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
  .who input:focus{border-color:var(--accent)}
  .who input.err{border-color:var(--bad);background:var(--badbg)}
  @media (max-width:560px){.who{grid-template-columns:1fr}}
  .q{display:flex;flex-direction:column;gap:12px;border:2px solid transparent;transition:border-color .2s}
  .q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
  .qhead{display:flex;gap:12px;align-items:flex-start}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .qtext{font-size:17px;line-height:1.5;padding-top:4px;font-weight:600}
  .m{font-family:"Cambria Math","Cambria","Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:1.08em;white-space:nowrap}
  .fig{display:flex;justify-content:center}
  .fig svg{width:100%;max-width:440px;height:auto;display:block}
  .fig .vl{font-family:"Cambria Math","Cambria","Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:24px;fill:#1e293b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .fig .fl{font-family:"Cambria Math","Cambria","Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:22px;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .fig .hit{cursor:pointer;stroke:transparent;stroke-width:26;stroke-linecap:round;fill:none}
  .fig .vis{stroke:#334155;stroke-width:4.5;stroke-linecap:round;transition:stroke .15s}
  .fig .vis.sel{stroke:#f97316;stroke-width:6}
  .fig .vis.right{stroke:var(--ok);stroke-width:6}
  .fig .vis.wrong{stroke:var(--bad);stroke-width:6}
  .opts{display:grid;grid-template-columns:1fr;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  @media (max-width:560px){.opts.two{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-size:16px;transition:all .15s;background:#F4F8FB;min-height:52px}
  .opt:hover{border-color:#7FB0CE}
  .opt input{accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
  .opt.chosen{border-color:var(--accent);background:#DCE9F2}
  .opt.right{border-color:var(--ok);background:var(--okbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .locked .opt{cursor:default}
  .numrow{display:flex;align-items:center;gap:10px}
  .numin{font:inherit;font-size:20px;font-weight:700;width:160px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;outline:none;text-align:center}
  .numin:focus{border-color:var(--accent)}
  .numin.right{border-color:var(--ok);background:var(--okbg)} .numin.wrong{border-color:var(--bad);background:var(--badbg)}
  .unit{font-size:18px;font-weight:700;color:var(--muted)}
  .mrow{display:grid;grid-template-columns:1fr 190px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #D5E5F0}
  .mrow:last-child{border-bottom:0}
  @media (max-width:560px){.mrow{grid-template-columns:1fr}}
  .mrow select{font:inherit;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:46px}
  .mrow select.right{border-color:var(--ok);background:var(--okbg)} .mrow select.wrong{border-color:var(--bad);background:var(--badbg)}
  .trow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #D5E5F0}
  .trow:last-child{border-bottom:0}
  .trow .st{font-size:16px;line-height:1.4}
  .trow label{display:flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:700;background:#F4F8FB;min-height:44px}
  .trow label.chosen{border-color:var(--accent);background:#DCE9F2}
  .trow.right{background:var(--okbg)} .trow.wrong{background:var(--badbg)}
  .trow input{accent-color:var(--accent)}
  .hint{font-size:14px;color:var(--ok);font-weight:700}
  .verdict{font-weight:800;font-size:15px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .actions{display:flex;flex-direction:column;align-items:center;gap:10px}
  .btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(42,101,146,.35)}
  .btn:hover{filter:brightness(1.08)}
  .btn.light{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(15,47,69,.12)}
  .msg{color:#0f2f45;font-weight:800;text-align:center;min-height:1.4em;background:rgba(255,255,255,.7);border-radius:12px;padding:0 12px}
  .msg:empty{background:transparent;padding:0}
  .result{text-align:center}
  .result .big{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .result p{margin:6px 0;font-size:17px}
  .dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .dot{width:36px;height:36px;border-radius:10px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .dot.y{background:var(--ok)} .dot.n{background:var(--bad)}
  .hidden{display:none!important}
  .sign{text-align:center;color:#64748b;font-size:13px;line-height:1.3;margin-top:6px}
  .sign b{color:#334155;font-weight:700}

  .key{position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.7);font-size:19px;cursor:pointer;box-shadow:0 2px 10px rgba(15,47,69,.15);z-index:20;opacity:.75}
  .key:hover{background:#fff;opacity:1}
  .modal{position:fixed;inset:0;background:rgba(15,47,69,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:30;overflow:auto}
  .panel{background:#fff;border-radius:18px;padding:20px;width:min(1100px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .panel h2{margin:0 0 12px;font-size:22px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
  .tbl{overflow-x:auto;margin-top:14px}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
  th{background:#E6F0F5}
  td.name{text-align:left}
  td.y{color:var(--ok);font-weight:800} td.n{color:var(--bad);font-weight:800}
  .small{font-size:14px;color:var(--muted)}
</style>

<button class="key" id="keyBtn" title="Для вчителя">🔑</button>

<div class="wrap">

<script>
(function(){ "use strict";

/* ===================== FIREBASE (проєкт math-5-892a5) ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU",
  authDomain: "math-5-892a5.firebaseapp.com",
  projectId: "math-5-892a5",
  storageBucket: "math-5-892a5.firebasestorage.app",
  messagingSenderId: "163114803328",
  appId: "1:163114803328:web:caf86c4e8b8c4b3b630665",
  measurementId: "G-E06VKZ2GP5"
};
const APP_ID = 'default-app-id';
const COLLECTION = 'results_triangles_cevians_7';   // колекція цього тесту
const TEACHER_PASSWORD = '8019';
const FBV = '10.12.2';

let fbPromise = null;
function fb(){
  if(!fbPromise){
    fbPromise = (async()=>{
      const [appM, authM, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
      ]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      await authM.signInAnonymously(authM.getAuth(app));
      return { db: fs.getFirestore(app), fs };
    })();
    fbPromise.catch(() => { fbPromise = null; }); // при збої — повторна спроба
  }
  return fbPromise;
}
const coll = (db, fs) => fs.collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION);

async function saveResult(rec){
  try { const { db, fs } = await fb(); await fs.setDoc(fs.doc(coll(db, fs), rec.id), rec); }
  catch(e){ console.warn('Save failed', e); }   // учням нічого не показувати
}
async function loadResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const jobs = []; snap.forEach(d => jobs.push(fs.deleteDoc(d.ref)));
  await Promise.all(jobs);
}
fb().catch(() => {});   // підключення одразу при відкритті сторінки

/* ===================== ЗАГАЛЬНЕ ===================== */
const TOTAL = 12;
const TEST_NAME = 'Рівні трикутники. Висота, медіана, бісектриса (7 клас)';
const $ = id => document.getElementById(id);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const m = s => `<span class="m">${s}</span>`;

/* ---------- геометрія для рисунків ---------- */
const V = (x, y) => ({ x, y });
const sub = (a, b) => V(a.x - b.x, a.y - b.y);
const add = (a, b) => V(a.x + b.x, a.y + b.y);
const mul = (a, k) => V(a.x * k, a.y * k);
const dot = (a, b) => a.x * b.x + a.y * b.y;
const len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return V(a.x / l, a.y / l); };
const mid = (a, b) => V((a.x + b.x) / 2, (a.y + b.y) / 2);
const dist = (a, b) => len(sub(a, b));
const lerp = (a, b, t) => add(a, mul(sub(b, a), t));
const f1 = n => n.toFixed(1);
function foot(P, Q, R) {
  const d = sub(R, Q), t = dot(sub(P, Q), d) / dot(d, d);
  return { pt: add(Q, mul(d, t)), t };
}
const centroid = T => mul(add(add(T[0], T[1]), T[2]), 1 / 3);
const svgWrap = inner => `<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
const poly = T => `<polygon points="${T.map(p => f1(p.x) + ',' + f1(p.y)).join(' ')}" fill="rgba(42,101,146,.08)" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>`;
function vLabels(T, L) {
  const G = centroid(T);
  return T.map((p, i) => { const q = add(p, mul(norm(sub(p, G)), 26)); return `<text x="${f1(q.x)}" y="${f1(q.y)}" text-anchor="middle" dominant-baseline="middle" class="vl">${L[i]}</text>`; }).join('');
}
function rightMark(P, Q, R, s) {
  s = s || 15;
  const u = norm(sub(Q, P)), w = norm(sub(R, P));
  const a = add(P, mul(u, s)), c = add(P, mul(w, s)), b = add(a, mul(w, s));
  return `<path d="M ${f1(a.x)} ${f1(a.y)} L ${f1(b.x)} ${f1(b.y)} L ${f1(c.x)} ${f1(c.y)}" fill="none" stroke="#475569" stroke-width="2.5"/>`;
}

const SETS = [['A', 'B', 'C'], ['D', 'E', 'F'], ['K', 'L', 'M'], ['P', 'Q', 'R'], ['X', 'Y', 'Z']];
const freeLetter = (t, pool) => pick(pool.filter(c => !t.includes(c)));

/* ===================== ЗАВДАННЯ ===================== */
// 1. означення рівних трикутників
function g1() {
  const wrong = shuffle(['Якщо вони мають однакові периметри', 'Якщо в них рівні всі кути', 'Якщо в них рівні дві сторони', 'Якщо вони мають однакову форму']).slice(0, 3);
  return { type: 'single', text: 'Які два трикутники називають рівними?',
    opts: shuffle([{ h: 'Якщо їх можна сумістити накладанням', ok: true }, ...wrong.map(w => ({ h: w, ok: false }))]), ans: null };
}
// 2. кут у рівних трикутниках
function g2() {
  const [a, b] = shuffle(SETS).slice(0, 2);
  const al = ri(25, 85);
  return { type: 'num', ans: al, val: '', unit: '°',
    text: `Трикутники ${m(a.join(''))} і ${m(b.join(''))} рівні, сторони ${m(a[0] + a[1])} і ${m(b[0] + b[1])}, ${m(a[1] + a[2])} і ${m(b[0] + b[2])} відповідні, ${m('∠' + a[1])} = ${al}°. Знайдіть ${m('∠' + b[0])}.` };
}
// 3. сторона в рівних трикутниках
function g3() {
  const [x, y] = shuffle(SETS).slice(0, 2);
  const L = ri(6, 24);
  return { type: 'num', ans: L, val: '', unit: 'см',
    text: `Трикутники ${m(x.join(''))} і ${m(y.join(''))} рівні, кути ${m(x[0])} і ${m(y[1])} відповідні, ${m(x[1] + x[2])} = ${L} см. Знайдіть ${m(y[0] + y[2])}.` };
}
// 4. клік по відрізку на рисунку
function g4() {
  const kind = pick([['h', 'висотою'], ['m', 'медіаною'], ['b', 'бісектрисою']]);
  const flip = Math.random() < 0.5;
  let T = [V(80, 350), V(190, 60), V(520, 325)];
  if (flip) T = T.map(p => V(600 - p.x, p.y));
  const fH = foot(T[1], T[0], T[2]).pt, fM = mid(T[0], T[2]);
  const q = dist(T[1], T[0]), r = dist(T[1], T[2]);
  const fB = lerp(T[0], T[2], q / (q + r));
  const letters = shuffle(['D', 'E', 'F', 'K', 'L', 'M', 'N', 'P']).slice(0, 3);
  const segs = shuffle([{ id: 'h', f: fH }, { id: 'm', f: fM }, { id: 'b', f: fB }]).map((s, i) => ({ ...s, lab: letters[i] }));
  let inner = poly(T);
  segs.forEach(s => {
    inner += `<line class="vis" data-id="${s.id}" x1="${f1(T[1].x)}" y1="${f1(T[1].y)}" x2="${f1(s.f.x)}" y2="${f1(s.f.y)}"/>`;
    inner += `<circle cx="${f1(s.f.x)}" cy="${f1(s.f.y)}" r="4.5" fill="#334155"/>`;
    inner += `<text x="${f1(s.f.x)}" y="${f1(s.f.y + 26)}" text-anchor="middle" class="fl">${s.lab}</text>`;
  });
  T.forEach(p => { inner += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="5" fill="#1e293b"/>`; });
  inner += vLabels(T, flip ? ['A', 'B', 'C'] : ['A', 'B', 'C']);
  segs.forEach(s => { inner += `<line class="hit" data-id="${s.id}" x1="${f1(T[1].x)}" y1="${f1(T[1].y)}" x2="${f1(s.f.x)}" y2="${f1(s.f.y)}"/>`; });
  return { type: 'click', right: kind[0], ans: null, fig: svgWrap(inner),
    text: `Натисніть на відрізок, який є ${kind[1]} трикутника ${m('ABC')}, проведеною з вершини ${m('B')}.` };
}
// 5. розташування висоти
function g5() {
  const type = pick(['acute', 'right', 'obtuse']);
  let T = { acute: [V(80, 340), V(260, 60), V(510, 310)], right: [V(110, 330), V(110, 80), V(500, 330)], obtuse: [V(70, 350), V(200, 200), V(540, 350)] }[type];
  const p = ri(0, 2);
  const h = foot(T[p], T[(p + 1) % 3], T[(p + 2) % 3]);
  const e = 3 / dist(T[(p + 1) % 3], T[(p + 2) % 3]);
  const ans = (Math.abs(h.t) <= e || Math.abs(h.t - 1) <= e) ? 'side' : (h.t < 0 || h.t > 1) ? 'out' : 'in';
  const names = shuffle(pick(SETS));
  if (Math.random() < 0.5) T = T.map(q => V(600 - q.x, q.y));
  let inner = poly(T);
  if (type === 'right') inner += rightMark(T[0], T[1], T[2]);
  T.forEach(q => { inner += `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="5" fill="#1e293b"/>`; });
  inner += vLabels(T, names);
  const labels = { in: 'лежить усередині трикутника', side: 'збігається з однією зі сторін трикутника', out: 'лежить поза трикутником' };
  return { type: 'single', fig: svgWrap(inner), ans: null,
    text: `Де розташована висота трикутника ${m(names.join(''))}, проведена з вершини ${m(names[p])}?`,
    opts: shuffle(Object.keys(labels).map(k => ({ h: labels[k], ok: k === ans }))) };
}
// 6. медіана
function g6() {
  const t = pick(SETS), v = ri(0, 2), X = freeLetter(t, ['M', 'D', 'N', 'S', 'T', 'H']);
  const Q = t[(v + 1) % 3], R = t[(v + 2) % 3], k = ri(3, 15);
  return { type: 'num', ans: 2 * k, val: '', unit: 'см',
    text: `Відрізок ${m(t[v] + X)} — медіана трикутника ${m(t.join(''))}, ${m(Q + X)} = ${k} см. Знайдіть ${m(Q + R)}.` };
}
// 7. бісектриса
function g7() {
  const t = pick(SETS), v = ri(0, 2), X = freeLetter(t, ['D', 'N', 'S', 'T', 'H', 'M']);
  const Q = t[(v + 1) % 3], R = t[(v + 2) % 3], a = ri(18, 44);
  return { type: 'num', ans: 2 * a, val: '', unit: '°',
    text: `Відрізок ${m(t[v] + X)} — бісектриса трикутника ${m(t.join(''))}, ${m('∠' + Q + t[v] + X)} = ${a}°. Знайдіть ${m('∠' + Q + t[v] + R)}.` };
}
// 8. відповідність
function g8() {
  const rows = shuffle([
    { h: 'Відрізок, який сполучає вершину трикутника із серединою протилежної сторони', right: 'Медіана' },
    { h: 'Перпендикуляр, опущений з вершини трикутника на пряму, яка містить протилежну сторону', right: 'Висота' },
    { h: 'Відрізок бісектриси кута трикутника, який сполучає вершину трикутника з точкою протилежної сторони', right: 'Бісектриса' },
  ]);
  return { type: 'match', text: 'Установіть відповідність між означенням і назвою.', rows, choices: ['Бісектриса', 'Висота', 'Медіана'], ans: [null, null, null] };
}
// 9. периметр
function g9() {
  const t = pick(SETS), D = freeLetter(t, ['D', 'S', 'N', 'T', 'H']), d = ri(5, 10), p1 = ri(22, 30), p2 = p1 + ri(2, 8);
  return { type: 'num', ans: p1 + p2 - 2 * d, val: '', unit: 'см',
    text: `На стороні ${m(t[0] + t[2])} трикутника ${m(t.join(''))} позначили точку ${m(D)}. Відрізок ${m(t[1] + D)} розбиває трикутник на два трикутники, периметри яких дорівнюють ${p1} см і ${p2} см. Знайдіть периметр трикутника ${m(t.join(''))}, якщо ${m(t[1] + D)} = ${d} см.` };
}
// 10. точка перетину висот
function g10() {
  const k = pick(['acute', 'right', 'obtuse']);
  const text = {
    acute: 'Де розташована точка перетину висот гострокутного трикутника?',
    right: 'Де розташована точка перетину висот прямокутного трикутника?',
    obtuse: 'Де розташована точка перетину прямих, які містять висоти тупокутного трикутника?',
  }[k];
  const labels = { acute: 'усередині трикутника', right: 'у вершині прямого кута', obtuse: 'поза трикутником', mid: 'на середині однієї зі сторін' };
  return { type: 'single', text, ans: null, opts: shuffle(Object.keys(labels).map(x => ({ h: labels[x], ok: x === k }))) };
}
// 11. особливі випадки
function g11() {
  const pool = [
    { text: `У рівнобедреному трикутнику ${m('ABC')} з основою ${m('AC')} бісектриса ${m('BL')}, проведена до основи, є також…`, ok: 'медіаною і висотою', wr: ['лише медіаною', 'лише висотою', 'жодним із цих відрізків'] },
    { text: 'Бісектриса, висота й медіана рівностороннього трикутника, проведені з однієї вершини…', ok: 'збігаються', wr: ['мають різні довжини', 'перпендикулярні одна до одної', 'ділять трикутник на три рівні частини'] },
    { text: 'Де лежить точка перетину медіан будь-якого трикутника?', ok: 'усередині трикутника', wr: ['поза трикутником', 'на стороні трикутника', 'залежить від виду трикутника'] },
  ];
  const p = pick(pool);
  return { type: 'single', text: p.text, ans: null, opts: shuffle([{ h: p.ok, ok: true }, ...p.wr.map(h => ({ h, ok: false }))]) };
}
// 12. Так / Ні
function g12() {
  const T = ['Кожний трикутник має три висоти', 'Кожна медіана трикутника лежить усередині нього', 'Якщо трикутники рівні, то їхні периметри рівні', 'У прямокутному трикутнику дві висоти збігаються з його сторонами', 'Бісектриса, висота й медіана рівностороннього трикутника, проведені з однієї вершини, збігаються'];
  const F = ['Висота трикутника завжди лежить усередині трикутника', 'Бісектриса трикутника може лежати поза трикутником', 'Якщо периметри двох трикутників рівні, то й самі трикутники рівні', 'Медіана трикутника може збігатися з його стороною', 'Усі три висоти тупокутного трикутника лежать поза ним'];
  const nT = ri(2, 3);
  const rows = shuffle([...shuffle(T).slice(0, nT).map(h => ({ h, truth: true })), ...shuffle(F).slice(0, 5 - nT).map(h => ({ h, truth: false }))]);
  return { type: 'tf', text: 'Чи є правильним твердження?', rows, ans: rows.map(() => null) };
}

/* ===================== ПОБУДОВА ===================== */
let QS = [], checked = false;

function build() {
  checked = false;
  QS = [g1(), g2(), g3(), g4(), g5(), g6(), g7(), g8(), g9(), g10(), g11(), g12()];
  const box = $('questions');
  box.innerHTML = '';
  QS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card q'; card.id = 'q' + i;
    card.innerHTML = `<div class="qhead"><div class="num">${i + 1}</div><div class="qtext">${q.text}</div></div>
      ${q.fig ? `<div class="fig">${q.fig}</div>` : ''}<div class="body"></div><div class="verdict hidden"></div>`;
    const body = card.querySelector('.body');

    if (q.type === 'single') {
      body.className = 'body opts';
      q.opts.forEach((o, j) => {
        const lab = document.createElement('label'); lab.className = 'opt';
        lab.innerHTML = `<input type="radio" name="r${i}"><span>${o.h}</span>`;
        lab.querySelector('input').addEventListener('change', () => {
          if (checked) return;
          q.ans = j;
          body.querySelectorAll('.opt').forEach(x => x.classList.remove('chosen')); lab.classList.add('chosen');
        });
        body.appendChild(lab);
      });
    }
    if (q.type === 'num') {
      body.innerHTML = `<div class="numrow"><input class="numin" inputmode="decimal" autocomplete="off" placeholder="Відповідь"><span class="unit">${q.unit}</span></div>`;
      body.querySelector('input').addEventListener('input', e => { if (!checked) q.val = e.target.value; });
    }
    if (q.type === 'click') {
      card.querySelectorAll('.hit').forEach(h => h.addEventListener('click', () => {
        if (checked) return;
        q.ans = h.getAttribute('data-id');
        card.querySelectorAll('.vis').forEach(v => v.classList.toggle('sel', v.getAttribute('data-id') === q.ans));
      }));
    }
    if (q.type === 'match') {
      q.rows.forEach((r, j) => {
        const row = document.createElement('div'); row.className = 'mrow';
        row.innerHTML = `<div class="mdef">${r.h}</div><select><option value="">— оберіть —</option>${q.choices.map(c => `<option>${c}</option>`).join('')}</select>`;
        row.querySelector('select').addEventListener('change', e => { if (!checked) q.ans[j] = e.target.value || null; });
        body.appendChild(row);
      });
    }
    if (q.type === 'tf') {
      q.rows.forEach((r, j) => {
        const row = document.createElement('div'); row.className = 'trow';
        row.innerHTML = `<div class="st">${esc(r.h)}</div>
          <label><input type="radio" name="t${i}_${j}" value="1"> Так</label>
          <label><input type="radio" name="t${i}_${j}" value="0"> Ні</label>`;
        row.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
          if (checked) return;
          q.ans[j] = inp.value === '1';
          row.querySelectorAll('label').forEach(l => l.classList.toggle('chosen', l.contains(inp) && inp.checked));
        }));
        body.appendChild(row);
      });
    }
    box.appendChild(card);
  });
  $('result').classList.add('hidden');
  $('checkBtn').classList.remove('hidden');
  $('forceBtn').classList.add('hidden');
  $('againBtn').classList.add('hidden');
  $('msg').textContent = '';
}

/* ---------- відповіді ---------- */
const numVal = q => { const s = String(q.val || '').trim().replace(',', '.'); return s === '' ? NaN : Number(s); };
function answered(q) {
  switch (q.type) {
    case 'single': case 'click': return q.ans !== null;
    case 'num': return !isNaN(numVal(q));
    case 'match': case 'tf': return q.ans.every(x => x !== null);
  }
}
function isRight(q) {
  switch (q.type) {
    case 'single': return q.ans !== null && q.opts[q.ans].ok;
    case 'click': return q.ans === q.right;
    case 'num': return Math.abs(numVal(q) - q.ans) < 1e-9;
    case 'match': return q.rows.every((r, j) => q.ans[j] === r.right);
    case 'tf': return q.rows.every((r, j) => q.ans[j] === r.truth);
  }
}
function answerText(q) {
  switch (q.type) {
    case 'single': return q.ans === null ? '' : q.opts[q.ans].h.replace(/<[^>]+>/g, '');
    case 'click': return q.ans || '';
    case 'num': return String(q.val || '').trim();
    case 'match': return q.ans.map(a => a || '').join(' | ');
    case 'tf': return q.ans.map(a => a === null ? '' : (a ? 'Так' : 'Ні')).join(' | ');
  }
}

/* ---------- перевірка ---------- */
function doCheck() {
  const sn = $('surname'), fn = $('firstname');
  const sur = sn.value.trim(), nam = fn.value.trim();
  checked = true;
  $('msg').textContent = '';
  const marks = QS.map(q => isRight(q) ? 1 : 0);

  QS.forEach((q, i) => {
    const card = $('q' + i);
    card.classList.add(marks[i] ? 'ok' : 'bad', 'locked');
    const v = card.querySelector('.verdict');
    v.classList.remove('hidden'); v.classList.add(marks[i] ? 'ok' : 'bad');
    v.textContent = marks[i] ? '✓ Правильно' : '✗ Неправильно';
    const body = card.querySelector('.body');
    if (q.type === 'single') {
      body.querySelectorAll('.opt').forEach((lab, j) => {
        lab.querySelector('input').disabled = true;
        if (q.opts[j].ok) lab.classList.add('right'); else if (j === q.ans) lab.classList.add('wrong');
      });
    }
    if (q.type === 'num') {
      const inp = body.querySelector('input'); inp.disabled = true;
      inp.classList.add(marks[i] ? 'right' : 'wrong');
      if (!marks[i]) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Правильна відповідь: ' + q.ans + ' ' + q.unit; body.appendChild(h); }
    }
    if (q.type === 'click') {
      card.querySelectorAll('.vis').forEach(vs => {
        const id = vs.getAttribute('data-id');
        vs.classList.remove('sel');
        if (id === q.right) vs.classList.add('right'); else if (id === q.ans) vs.classList.add('wrong');
      });
    }
    if (q.type === 'match') {
      body.querySelectorAll('.mrow').forEach((row, j) => {
        const sel = row.querySelector('select'); sel.disabled = true;
        const ok = q.ans[j] === q.rows[j].right;
        sel.classList.add(ok ? 'right' : 'wrong');
        if (!ok) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Правильно: ' + q.rows[j].right; row.children[0].appendChild(h); }
      });
    }
    if (q.type === 'tf') {
      body.querySelectorAll('.trow').forEach((row, j) => {
        row.querySelectorAll('input').forEach(x => x.disabled = true);
        const ok = q.ans[j] === q.rows[j].truth;
        row.classList.add(ok ? 'right' : 'wrong');
        if (!ok) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Правильно: ' + (q.rows[j].truth ? 'Так' : 'Ні'); row.children[0].appendChild(h); }
      });
    }
  });

  const score = marks.reduce((a, b) => a + b, 0);
  const res = $('result');
  res.innerHTML = `<p>${esc(sur)} ${esc(nam)}</p><div class="big">${score} з ${TOTAL}</div><p>балів</p>
    <div class="dots">${marks.map((x, i) => `<div class="dot ${x ? 'y' : 'n'}">${i + 1}</div>`).join('')}</div>`;
  res.classList.remove('hidden');
  $('checkBtn').classList.add('hidden');
  $('forceBtn').classList.add('hidden');
  $('againBtn').classList.remove('hidden');
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });

  const now = Date.now();
  saveResult({
    id: now + '_' + Math.random().toString(36).slice(2, 8),
    name: `${sur} ${nam}`, surname: sur, firstName: nam,
    ts: now, date: new Date(now).toISOString(),
    score, max: TOTAL, tasks: marks,
    answers: QS.map(answerText),
    test: TEST_NAME
  });
}

$('checkBtn').addEventListener('click', () => {
  const sn = $('surname'), fn = $('firstname'), msg = $('msg');
  sn.classList.toggle('err', !sn.value.trim()); fn.classList.toggle('err', !fn.value.trim());
  if (!sn.value.trim() || !fn.value.trim()) {
    msg.textContent = 'Введіть прізвище та ім’я';
    $('who').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const left = QS.filter(q => !answered(q)).length;
  if (left) {
    msg.textContent = `Ви не відповіли на ${left} ${left === 1 ? 'завдання' : 'завдань'}`;
    $('forceBtn').classList.remove('hidden');
    const first = QS.findIndex(q => !answered(q));
    $('q' + first).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  doCheck();
});
$('forceBtn').addEventListener('click', doCheck);
$('againBtn').addEventListener('click', () => { build(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

/* ===================== ЖУРНАЛ ВЧИТЕЛЯ ===================== */
const modal = $('modal');
let lastRows = [];
$('keyBtn').addEventListener('click', () => { modal.classList.remove('hidden'); $('pwd').focus(); });
$('closeBtn').addEventListener('click', () => modal.classList.add('hidden'));
function tryLogin() {
  if ($('pwd').value === TEACHER_PASSWORD) {
    $('pwdBox').classList.add('hidden'); $('resBox').classList.remove('hidden'); refresh();
  } else $('pwdMsg').textContent = 'Неправильний пароль';
}
$('pwdBtn').addEventListener('click', tryLogin);
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
$('refreshBtn').addEventListener('click', refresh);

async function refresh() {
  const info = $('resInfo'), tbl = $('tbl');
  info.textContent = 'Завантаження…';
  try {
    const rows = await loadResults();
    lastRows = rows;
    info.textContent = `Усього спроб: ${rows.length}`;
    let h = '<table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата й час</th><th>Бал</th>';
    for (let i = 1; i <= TOTAL; i++) h += `<th>${i}</th>`;
    h += '</tr></thead><tbody>';
    rows.forEach((r, k) => {
      const dt = r.date ? new Date(r.date).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      h += `<tr><td>${k + 1}</td><td class="name">${esc(r.name || '')}</td><td>${dt}</td><td><b>${r.score} / ${r.max || TOTAL}</b></td>`;
      for (let i = 0; i < TOTAL; i++) { const v = (r.tasks || [])[i]; h += v ? '<td class="y">✓</td>' : '<td class="n">✗</td>'; }
      h += '</tr>';
    });
    h += '</tbody></table>';
    tbl.innerHTML = h;
  } catch (e) {
    console.warn(e); info.textContent = 'Не вдалося завантажити результати'; tbl.innerHTML = '';
  }
}
$('csvBtn').addEventListener('click', () => {
  const head = ['№', 'Прізвище та ім’я', 'Дата', 'Бал', ...Array.from({ length: TOTAL }, (_, i) => String(i + 1))];
  const lines = [head.join(';')];
  lastRows.forEach((r, k) => {
    const dt = r.date ? new Date(r.date).toLocaleString('uk-UA') : '';
    lines.push([k + 1, '"' + String(r.name || '').replace(/"/g, '""') + '"', '"' + dt + '"', r.score, ...Array.from({ length: TOTAL }, (_, i) => (r.tasks || [])[i] ? 1 : 0)].join(';'));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'rezultaty_trykutnyky_7.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
$('clearBtn').addEventListener('click', () => { $('clearBtn').classList.add('hidden'); $('clearAsk').classList.remove('hidden'); });
$('clearNo').addEventListener('click', () => { $('clearAsk').classList.add('hidden'); $('clearBtn').classList.remove('hidden'); });
$('clearYes').addEventListener('click', async () => {
  $('clearAsk').classList.add('hidden'); $('clearBtn').classList.remove('hidden');
  try { await clearResults(); } catch (e) { console.warn(e); $('resInfo').textContent = 'Не вдалося очистити'; return; }
  refresh();
});

build();
})();
</script>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
