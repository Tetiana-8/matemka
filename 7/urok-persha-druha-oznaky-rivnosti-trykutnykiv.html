<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ознаки рівності трикутників</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=STIX+Two+Text:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#173F5F;--muted:#5d7b93;
  --acc:#2A6592;--accD:#1F4E73;--acc2:#3887AF;--accL:#DCE9F2;--soft:#EAF2F7;--soft2:#F5F9FC;--line:#A8CADD;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;--badln:#efa3a8;
  --warnbg:#fff6e5;--warntx:#8a5a00;--warnln:#f3d9a4;
  --c0:#e8590c;--c1:#7048e8;--c2:#d6336c;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);height:100%}
body{margin:0;height:100dvh;overflow:hidden;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#EAF2F7 0%,#DCE9F2 55%,#c7dbea 100%) fixed;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;touch-action:manipulation}
i,.m{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:1.08em}
.nw{white-space:nowrap}
.c0{color:var(--c0);font-weight:800}.c1{color:var(--c1);font-weight:800}.c2{color:var(--c2);font-weight:800}

#app{height:100%;display:flex;flex-direction:column;padding:.6rem .8rem 0;gap:.5rem}
#stagewrap{flex:1;min-height:0;display:flex}
.stage{display:none;flex:1;min-width:0;position:relative}
.stage.on{display:flex}
.card{flex:1;min-width:0;min-height:0;display:flex;overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:1.1rem;box-shadow:0 .25rem 1rem rgba(31,78,115,.12)}
.inner{margin:auto;width:100%;max-width:72rem;padding:1rem 1.4rem}
h2.st{margin:0 0 .6rem;font-size:1.5rem;color:var(--acc);font-weight:900;display:flex;align-items:center;gap:.6rem}

.btn{border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:.45em 1.1em;font-weight:800;font-size:1rem;cursor:pointer;min-height:2.5rem;transition:background .15s,transform .1s}
.btn:hover{background:var(--accD);border-color:var(--accD)}
.btn:active{transform:scale(.96)}
.btn.light{background:var(--accL);color:var(--accD);border-color:var(--line)}
.btn.light:hover{background:#cfe0ec}
.btn:disabled{opacity:.45;cursor:default}

.stage.start .card{background:linear-gradient(135deg,#DCE9F2 0%,#EAF2F7 55%,#F5F9FC 100%);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem}
.stage.start .kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-size:1.1rem}
.stage.start h1{margin:.4rem 0 1.4rem;font-size:3.2rem;line-height:1.12;color:var(--accD);font-weight:900;padding:0 1rem}
.stage.start h1 small{display:block;font-size:1.3rem;color:var(--muted);font-weight:700;margin-bottom:.4rem}
.go{border:2px solid var(--line);background:#fff;color:var(--accD);font-weight:900;font-size:1.3rem;border-radius:999px;padding:.5em .6em .5em 1.4em;cursor:pointer;display:inline-flex;align-items:center;gap:.9rem;box-shadow:0 .2rem .6rem rgba(31,78,115,.15)}
.go span{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.go:hover span{background:var(--accD)}
.dia{position:absolute;top:.7rem;right:.8rem;z-index:6;width:2.4rem;height:2.4rem;border:1.5px solid var(--line);border-radius:.7rem;background:#fff;color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dia svg{width:1.6rem;height:1.6rem}
.dia:hover{background:var(--accL)}

.nav{flex:none;display:flex;justify-content:center;align-items:center;gap:.9rem}
.nav[hidden]{display:none}
.nav .btn{min-width:7.5rem}
#candle{position:relative;flex:none;width:.6rem;height:2.4rem;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:2px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#candle .wax{width:100%;height:100%;background:var(--acc2);border-radius:9px;transition:height 1s linear}
#ctip{position:absolute;bottom:3rem;left:50%;transform:translateX(-50%);background:var(--accD);color:#fff;font-size:.9rem;font-weight:700;padding:.4em .8em;border-radius:.6rem;white-space:nowrap;display:none;z-index:20}
#candle:hover #ctip{display:block}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

.tabbar{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.7rem}
.tab{border:2.5px solid var(--line);background:var(--soft2);color:var(--accD);font-weight:900;border-radius:999px;padding:.35em 1.2em;cursor:pointer;font-size:1.15rem}
.tab:not(.seen):not(.on){animation:glow 1.6s infinite;border-color:var(--acc2)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(56,135,175,.55)}100%{box-shadow:0 0 0 .6rem rgba(56,135,175,0)}}
.tabnext{margin-top:.4rem}
.tab:hover{background:var(--accL)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}

.def{border-left:.35rem solid var(--acc);background:var(--accL);border-radius:.2rem .8rem .8rem .2rem;padding:.7rem 1rem;margin:.5rem 0;font-size:1.2rem}
.def .dl{display:inline-block;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;margin-right:.5rem}
.def b{color:var(--accD)}
.def.big{font-size:1.45rem;line-height:1.42;padding:.8rem 1.1rem}
.note{font-size:1.15rem;margin:.4rem 0}
.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
.down{display:block;margin:.5rem auto 0;width:2.7rem;height:2.7rem;border-radius:50%;border:none;background:var(--acc2);color:#fff;font-size:1.5rem;font-weight:900;cursor:pointer;animation:bob 1.1s infinite;box-shadow:0 .2rem .5rem rgba(31,78,115,.3)}
.down:hover{background:var(--acc)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.25rem)}}

.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.figbox{background:var(--soft2);border:1.5px solid var(--line);border-radius:1rem;padding:.4rem;display:flex;align-items:center;justify-content:center}
.task .figbox{width:min(100%,34rem);margin:.3rem auto}
.figbox svg{width:100%;height:auto;max-height:52vh;display:block}
.vt{font-family:"STIX Two Text","Times New Roman",serif;font-style:italic;font-weight:700;font-size:21px;fill:#173F5F;text-anchor:middle;dominant-baseline:central}
.lt2{font-family:Nunito,Arial,sans-serif;font-weight:800;font-size:16px;fill:#173F5F;text-anchor:middle;dominant-baseline:central}
.lt2.c0f{fill:var(--c0)}.lt2.c1f{fill:var(--c1)}.lt2.c2f{fill:var(--c2)}.lt2.okf{fill:var(--ok)}

/* завдання */
.ask{font-weight:800;color:var(--accD);font-size:1.25rem;margin:.2rem 0 .5rem}
.msg{min-height:1.6rem;font-weight:800;font-size:1.1rem;margin:.3rem 0}
.msg.ok{color:var(--oktx)}.msg.bad{color:var(--badtx)}
.hint{display:block;margin-top:.2rem;padding:.35rem .7rem;background:var(--warnbg);border:1.5px solid var(--warnln);color:var(--warntx);border-radius:.6rem;font-weight:700;font-size:1rem}
.bar{display:flex;gap:.6rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap;align-items:center}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.5rem 0}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);background:#fff;border-radius:.9rem;padding:.5rem .8rem;cursor:pointer;font-size:1.2rem;text-align:left;font-weight:700;min-height:3.2rem}
.opt .lt-l{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accL);color:var(--accD);font-size:.95rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){background:var(--soft);border-color:var(--acc2)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badtx);opacity:.8}
.opts.done .opt:not(.ok){opacity:.5}
.task{--tc:var(--acc);--tl:var(--soft2);--tb:var(--line);border-left:.45rem solid var(--tc);padding:.2rem .3rem .2rem .9rem;border-radius:.4rem}
.task .ask{color:var(--tc)}
.task .opt:not(.ok):not(.bad){border-color:var(--tb)}
.task .opt .lt-l{background:var(--tl);color:var(--tc);box-shadow:0 0 0 1.5px var(--tb)}
.task .opt:hover:not(:disabled):not(.ok):not(.bad){background:var(--tl);border-color:var(--tc)}
.task .btn:not(.light){background:var(--tc);border-color:var(--tc)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:2.4rem;height:2.1rem;padding:0 .6rem;border-radius:.6rem;background:var(--tc);color:#fff;font-weight:900;margin-right:.6rem;font-size:1.05rem}
.mrows{display:flex;flex-direction:column;gap:.5rem}
.mrow{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center;border:2px solid var(--tb);border-radius:.9rem;padding:.4rem .8rem;background:#fff}
@media (max-width:700px){.mrow{grid-template-columns:1fr}}
.mrow .mt{font-size:1.25rem;font-weight:700}
.mrow.ok{background:var(--okbg);border-color:var(--ok)}
.mbtns{display:flex;gap:.4rem;flex-wrap:wrap}
.mb{border:2px solid var(--tb);background:var(--tl);color:var(--tc);font-weight:800;border-radius:.7rem;padding:.3em .8em;cursor:pointer;font-size:1.05rem}
.mb:hover:not(:disabled){background:#fff;border-color:var(--tc)}
.mb.bad{background:var(--badbg);border-color:var(--bad);color:var(--badtx);opacity:.75}
.mb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.mrow.ok .mb:not(.ok){display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media (max-width:700px){.thumbs{grid-template-columns:1fr}}
.thumb{border:2px solid var(--tb);border-radius:.9rem;background:#fff;padding:.3rem .4rem .5rem;text-align:center}
.thumb.ok{background:var(--okbg);border-color:var(--ok)}
.thumb svg{width:100%;height:auto;max-height:24vh}
.thumb .mbtns{justify-content:center}
.thumb.ok .mb:not(.ok){display:none}

/* кроки-запис у «зошиті» */
.dado{border:2px solid var(--line);border-radius:.9rem;background:#fff;padding:.5rem .9rem;font-size:1.3rem;margin-bottom:.5rem}
.dado .row{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;margin:.1rem 0}
.dado .lb{font-weight:900;color:var(--acc);min-width:6.2rem}
.proof{border:2px solid var(--line);border-left:.4rem solid var(--acc);border-radius:.9rem;background:#fff;padding:.5rem .9rem .7rem}
.proof .pt{font-weight:900;color:var(--acc);font-size:1.15rem;margin-bottom:.2rem}
.pl{font-size:1.3rem;padding:.2rem 0;animation:pop .35s ease;line-height:1.4}
.pl.fin{margin-top:.3rem;padding:.4rem .7rem;border-radius:.7rem;background:var(--okbg);border:2px solid var(--ok);color:var(--oktx);font-weight:800}
.pl .why{color:var(--muted);font-weight:700}
.hl{padding:0 .12em;border-radius:.25em}

/* слайдер */
.sliderbar{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:.5rem 0;flex-wrap:wrap}
.sliderbar input[type=range]{width:min(26rem,70%);accent-color:var(--acc);height:1.6rem}
.sliderbar .lbl{font-weight:800;font-size:1.2rem;color:var(--accD)}
.slinfo{min-height:3.2rem;font-size:1.25rem;font-weight:800;text-align:center;padding:.4rem .8rem;border-radius:.8rem;margin-top:.3rem;background:var(--warnbg);border:2px solid var(--warnln);color:var(--warntx)}
.slinfo.ok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}

.sum .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1rem;align-items:center;border:1.5px solid var(--line);border-radius:1rem;padding:.4rem .8rem;margin:.4rem 0;animation:pop .35s ease;background:#fff}
@media (max-width:820px){.sum .row{grid-template-columns:1fr}}
.sum .row svg{width:100%;height:auto;max-height:26vh}
.sum .txt{font-size:1.3rem}
.sum .txt .hd{font-weight:900;color:var(--acc);display:block;margin-bottom:.2rem}
.sum .gochk{margin:.7rem auto 0;display:block}
.fin-q{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem .9rem;margin:.4rem 0;font-size:1.2rem;background:var(--soft2)}
.fin-q .end{color:var(--accD);font-weight:800}
.fin-q .btn{min-height:2rem;padding:.15em .8em;font-size:.95rem}

.tl{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center}
@media (max-width:760px){.tl{grid-template-columns:1fr}}
.votes{display:flex;flex-direction:column;gap:.6rem}
.vote{display:flex;align-items:center;gap:.8rem;border:2px solid var(--line);border-radius:1rem;padding:.5rem .9rem;background:#fff;font-size:1.15rem;font-weight:800}
.vote .dotc{width:2.6rem;height:2.6rem;border-radius:50%;border:none;cursor:pointer;box-shadow:0 .15rem .4rem rgba(0,0,0,.25);flex:none}
.vote .dotc:active{transform:scale(.92)}
.vote .cnt{margin-left:auto;font-size:1.7rem;min-width:2.2rem;text-align:right;color:var(--accD)}
.lamp{width:6.5rem;background:#3a4a58;border-radius:1.4rem;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;align-items:center;margin:0 auto}
.lamp u{width:4.4rem;height:4.4rem;border-radius:50%;background:#56697a;opacity:.45;display:block;transition:all .3s}
.lamp u.on{opacity:1;box-shadow:0 0 1.4rem currentColor}
.tlmsg{font-size:1.25rem;font-weight:800;color:var(--accD);margin-top:.5rem;min-height:3rem}

.ov{position:fixed;inset:0;z-index:2147483000;background:rgba(23,63,95,.45);display:none;align-items:center;justify-content:center;padding:1rem}
.ov.on{display:flex}
.mod{background:#fff;border-radius:1.2rem;max-width:44rem;width:100%;max-height:92%;overflow:auto;padding:1.2rem 1.5rem;border:2px solid var(--line);box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.mod h3{margin:0 0 .6rem;color:var(--acc);font-size:1.4rem}
.mod h4{margin:.8rem 0 .3rem;color:var(--accD);font-size:1.05rem}
.mod p,.mod li{font-size:1.05rem}
.mod .x{float:right;border:none;background:var(--accL);color:var(--accD);border-radius:50%;width:2.1rem;height:2.1rem;font-size:1.1rem;cursor:pointer;font-weight:900}
.plan{display:flex;flex-direction:column;gap:.35rem}
.plan button{display:flex;justify-content:space-between;gap:1rem;border:1.5px solid var(--line);background:var(--soft2);border-radius:.7rem;padding:.4rem .8rem;cursor:pointer;font-size:1rem;font-weight:700;color:var(--accD);text-align:left}
.plan button:hover{background:var(--accL)}
.plan .tm2{font-weight:900;color:var(--acc);white-space:nowrap}
.conf{position:fixed;width:.7rem;height:1rem;z-index:2147483100;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.finbox{text-align:center}
.finbox .big{font-size:3rem;font-weight:900;color:var(--acc);margin:.2rem 0}
</style>
</head>
<body>
<div id="app">
  <div id="stagewrap"></div>
  <div id="nav" class="nav" hidden>
    <button class="btn light" id="bBack">← Назад</button>
    <button class="dia" id="bDia" title="Методична картка" style="position:static"></button>
    <div id="candle" title=""><div class="wax"></div><div id="ctip"></div></div>
    <button class="btn" id="bNext">Далі →</button>
  </div>
  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>
<div class="ov" id="ovMeta"><div class="mod" id="metaBox"></div></div>
<div class="ov" id="ovFin"><div class="mod finbox" id="finBox"></div></div>
<script>
/* ===================== ДОПОМІЖНІ ===================== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function plural(n,a,b,c){const m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c;}
const $=(s,r)=>(r||document).querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
const dec=n=>String(n).replace('.',',');
let SCORE=0;

/* ===================== ГЕОМЕТРІЯ (SVG-рядки) ===================== */
const D2R=Math.PI/180, PC=['#e8590c','#7048e8','#d6336c'];
const f1=n=>Number(n).toFixed(1), P_=p=>f1(p[0])+','+f1(p[1]);
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1]], vadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], vmul=(v,k)=>[v[0]*k,v[1]*k];
const vlen=v=>Math.hypot(v[0],v[1]), vun=v=>{const l=vlen(v)||1;return [v[0]/l,v[1]/l];};
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const cen3=P=>[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
const angDeg=(a,b,c)=>{const u=vsub(a,b),v=vsub(c,b);return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(vlen(u)*vlen(v)))))/D2R;};

function xf(Q,o){o=o||{};const k=o.k||26,r=(o.rot||0)*D2R,c=Math.cos(r),s=Math.sin(r);
  let P=Q.map(p=>[o.flip?-p[0]:p[0],p[1]]);
  P=P.map(p=>[p[0]*c-p[1]*s,p[0]*s+p[1]*c]);
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
  const mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2;
  let kk=k,cx=o.cx||0,cy=o.cy||0;
  if(o.fit){const w=Math.max(...xs)-Math.min(...xs)||1,h=Math.max(...ys)-Math.min(...ys)||1,W=o.fit[0],H=o.fit[1],pd=o.fit[2];kk=Math.min(k,(W-2*pd)/w,(H-2*pd)/h);cx=W/2;cy=H/2;}
  return P.map(p=>[cx+(p[0]-mx)*kk,cy+(p[1]-my)*kk]);}
/* трикутники в одиницях; порядок вершин [A,B,C]; сторони: 0=AB, 1=BC, 2=CA; кути: 0=A, 1=B, 2=C */
const triSAS=(ab,bc,B)=>{const r=B*D2R;return [[ab,0],[0,0],[bc*Math.cos(r),-bc*Math.sin(r)]];};
const triASA=(ac,A,C)=>{const B=180-A-C,ab=ac*Math.sin(C*D2R)/Math.sin(B*D2R);return [[0,0],[ab*Math.cos(A*D2R),-ab*Math.sin(A*D2R)],[ac,0]];};
function triSSA(c,b,Bd,second){const r=Bd*D2R,d=Math.sqrt(b*b-c*c*Math.sin(r)**2),A=[c*Math.cos(r),-c*Math.sin(r)];
  return [A,[0,0],[c*Math.cos(r)+(second?d:-d),0]];}

function ticks(a,b,n,color,spacing,half){
  if(!n)return '';spacing=spacing||6;half=half||7;
  const m=mid(a,b),u=vun(vsub(b,a)),nr=[-u[1],u[0]];let s='';
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*spacing,c=[m[0]+u[0]*o,m[1]+u[1]*o];
    s+='<line x1="'+f1(c[0]-nr[0]*half)+'" y1="'+f1(c[1]-nr[1]*half)+'" x2="'+f1(c[0]+nr[0]*half)+'" y2="'+f1(c[1]+nr[1]*half)+'" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/>';}
  return s;}
function arcs(a,b,c,n,color,r,right){
  r=r||18;
  const u=vun(vsub(a,b)),v=vun(vsub(c,b));
  if(right){const p1=vadd(b,vmul(u,15)),p3=vadd(b,vmul(v,15)),p2=vadd(p1,vmul(v,15));
    return '<polyline points="'+P_(p1)+' '+P_(p2)+' '+P_(p3)+'" fill="none" stroke="'+color+'" stroke-width="2.6"/>';}
  if(!n)return '';
  const sweep=(u[0]*v[1]-u[1]*v[0])>0?1:0;let s='';
  for(let i=0;i<n;i++){const rr=r+i*5.5,p=vadd(b,vmul(u,rr)),q=vadd(b,vmul(v,rr));
    s+='<path d="M '+P_(p)+' A '+rr+' '+rr+' 0 0 '+sweep+' '+P_(q)+'" fill="none" stroke="'+color+'" stroke-width="2.8"/>';}
  return s;}
function seg(a,b,color,w,dash){return '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" stroke="'+(color||'#1F4E73')+'" stroke-width="'+(w||2.6)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';}
function dot(p,r,c){return '<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="'+(r||3.6)+'" fill="'+(c||'#1F4E73')+'"/>';}
function txt(p,t,cls){return '<text x="'+f1(p[0])+'" y="'+f1(p[1])+'" class="'+(cls||'vt')+'">'+t+'</text>';}
/* позначка кута всередині: текст на бісектрисі */
function angTxt(P,i,r,t,cls){const b=P[i],u=vun(vsub(P[(i+2)%3],b)),v=vun(vsub(P[(i+1)%3],b)),d=vun(vadd(u,v));return txt(vadd(b,vmul(d,r)),t,cls||'lt2');}

/* малювання трикутника: o.lab, o.sm[i]=[n,color], o.am[i]=[n,color,right], o.sl[i] (текст), o.at[i] (текст), o.fill */
function drawTri(P,o){o=o||{};const c=cen3(P);
  let s='<polygon points="'+P.map(P_).join(' ')+'" fill="'+(o.fill||'rgba(42,101,146,.07)')+'" stroke="'+(o.stroke||'#1F4E73')+'" stroke-width="'+(o.sw||2.8)+'" stroke-linejoin="round"/>';
  for(let i=0;i<3;i++){const m=o.sm&&o.sm[i];if(m)s+=ticks(P[i],P[(i+1)%3],m[0],m[1]);}
  for(let i=0;i<3;i++){const m=o.am&&o.am[i];if(m)s+=arcs(P[(i+2)%3],P[i],P[(i+1)%3],m[0],m[1],o.ar||19,m[2]);}
  for(let i=0;i<3;i++){if(o.sl&&o.sl[i]){const a=P[i],b=P[(i+1)%3],m=mid(a,b),u=vun(vsub(b,a));let n=[-u[1],u[0]];if((m[0]-c[0])*n[0]+(m[1]-c[1])*n[1]<0)n=[-n[0],-n[1]];
      s+=txt(vadd(m,vmul(n,(o.slr||20))),o.sl[i],'lt2'+(o.slc&&o.slc[i]?' '+o.slc[i]:''));}}
  for(let i=0;i<3;i++){if(o.at&&o.at[i])s+=angTxt(P,i,(o.atr||40),o.at[i],'lt2'+(o.atc&&o.atc[i]?' '+o.atc[i]:''));}
  if(o.lab)for(let i=0;i<3;i++){const d=vun(vsub(P[i],c));s+=txt(vadd(P[i],vmul(d,o.lr||19)),o.lab[i],'vt');}
  return s;}
const svgWrap=(vb,inner,extra)=>'<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img"'+(extra||'')+'>'+inner+'</svg>';

/* ---------- пара трикутників для ознак (теорема): level 0..3 — скільки пар рівних елементів показано ---------- */
const CRIT={
  sas:{Q:()=>triSAS(3.2,4.4,65),pairs:[{t:'s',i:0},{t:'s',i:1},{t:'a',i:1}]},
  asa:{Q:()=>triASA(4.4,52,68),pairs:[{t:'s',i:2},{t:'a',i:0},{t:'a',i:2}]}
};
function marksFor(pairs,level,shift){/* повертає {sm1,am1,sm2,am2} для двох трикутників */
  const sm1=[0,0,0],am1=[0,0,0],sm2=[0,0,0],am2=[0,0,0];let ns=0,na=0;
  pairs.forEach((p,k)=>{if(k>=level)return;const col=PC[k],j=(p.i-(shift||0)+3)%3;
    if(p.t==='s'){ns++;sm1[p.i]=[ns,col];sm2[j]=[ns,col];}else{na++;am1[p.i]=[na,col];am2[j]=[na,col];}});
  return {sm1,am1,sm2,am2};}
function critSVG(kind,level,opts){opts=opts||{};const d=CRIT[kind],Q=d.Q();
  const T1=xf(Q,{k:opts.k||31,cx:140,cy:120,rot:-6}),T2=xf(Q,{k:opts.k||31,cx:420,cy:120,rot:18});
  const m=marksFor(d.pairs,level,0);
  return svgWrap('0 0 560 235',
    drawTri(T1,{lab:['A','B','C'],sm:m.sm1,am:m.am1,lr:20})+drawTri(T2,{lab:['A₁','B₁','C₁'],sm:m.sm2,am:m.am2,lr:22}));}

/* ---------- генератор для вправи «За якою ознакою рівні?» ---------- */
const cm=x=>dec(x.toFixed(1))+' см';
function genPair(kind){
  const pairs=[];let QA,QB;
  if(kind==='sas'){const ab=rnd(30,55)/10,bc=rnd(30,55)/10,B=rnd(45,105);QA=QB=triSAS(ab,bc,B);pairs.push({t:'s',i:0,v:cm(ab)},{t:'s',i:1,v:cm(bc)},{t:'a',i:1,v:B+'°'});}
  else if(kind==='asa'){const ac=rnd(38,55)/10,A=rnd(42,75),C=rnd(42,75);QA=QB=triASA(ac,A,C);pairs.push({t:'s',i:2,v:cm(ac)},{t:'a',i:0,v:A+'°'},{t:'a',i:2,v:C+'°'});}
  else if(kind==='ssa'){const Bd=rnd(30,42),c=rnd(55,62)/10,lo=c*Math.sin(Bd*D2R)+.55,b=Math.round((lo+(c-.5-lo)*Math.random())*10)/10;
    QA=triSSA(c,b,Bd,false);QB=triSSA(c,b,Bd,true);pairs.push({t:'s',i:0,v:cm(c)},{t:'s',i:2,v:cm(b)},{t:'a',i:1,v:Bd+'°'});}
  else if(kind==='aaa'){const ac=rnd(26,32)/10,A=rnd(45,70),C=rnd(45,70),q=triASA(ac,A,C);QA=q;QB=q.map(p=>[p[0]*1.55,p[1]*1.55]);pairs.push({t:'a',i:0,v:A+'°'},{t:'a',i:1,v:(180-A-C)+'°'},{t:'a',i:2,v:C+'°'});}
  else {const ac=rnd(40,52)/10,A=rnd(45,65),C1=rnd(45,60);QA=triASA(ac,A,C1);QB=triASA(ac,A,C1+pick([-1,1])*rnd(18,24));pairs.push({t:'s',i:2,v:cm(ac)},{t:'a',i:0,v:A+'°'});}
  const sh=rnd(0,2),flip=Math.random()<.5,num=Math.random()<.5;
  const T1=xf(QA,{k:27,cx:140,cy:118,rot:rnd(-20,20)});
  const T2=xf(QB,{k:27,cx:420,cy:118,rot:rnd(-70,70),flip});
  const R=[0,1,2].map(i=>T2[(i+sh)%3]);
  let o1={lab:['A','B','C']},o2={lab:['M','N','K'],lr:21};
  if(!num){const m=marksFor(pairs,pairs.length,sh);o1.sm=m.sm1;o1.am=m.am1;o2.sm=m.sm2;o2.am=m.am2;}
  else{const sl1=[],sl2=[],at1=[],at2=[],am1=[0,0,0],am2=[0,0,0],G='#6b7f90';
    pairs.forEach(p=>{const j=(p.i-sh+3)%3;if(p.t==='s'){sl1[p.i]=p.v;sl2[j]=p.v;}else{at1[p.i]=p.v;at2[j]=p.v;am1[p.i]=[1,G];am2[j]=[1,G];}});
    Object.assign(o1,{sl:sl1,at:at1,am:am1,atr:44,slr:24});Object.assign(o2,{sl:sl2,at:at2,am:am2,atr:44,slr:24});}
  const svg=svgWrap('0 0 560 235',drawTri(T1,o1)+drawTri(R,o2));
  return {kind,num,svg};
}

function tabs(parent,items,onShow){

function mc(box,ask,opts,ci,why,done){

function overlayDemo(parent){
  const Q=triSAS(3.4,4.4,70),P1=xf(Q,{k:34,cx:120,cy:112,rot:-6}),P2=xf(Q,{k:34,cx:400,cy:112,rot:28});
  const c1=cen3(P1),c2=cen3(P2),dx=c1[0]-c2[0],dy=c1[1]-c2[1],th=-34;
  const g='<g id="ovg" transform="translate(0 0)"><polygon points="'+P2.map(P_).join(' ')+'" fill="rgba(232,89,12,.28)" stroke="#e8590c" stroke-width="2.8" stroke-linejoin="round"/></g>';
  const fb=el('div','figbox',svgWrap('0 0 520 225',drawTri(P1,{lab:['A','B','C'],fill:'rgba(42,101,146,.10)'})+g));parent.appendChild(fb);
  const gg=fb.querySelector('#ovg');
  const bar=el('div','bar');const b=el('button','btn','Накласти ▶');bar.appendChild(b);parent.appendChild(bar);
  const msg=el('div','msg');parent.appendChild(msg);const tailHost=el('div');parent.appendChild(tailHost);
  let busy=false,on=false,started=false;
  function set(t){gg.setAttribute('transform','translate('+f1(dx*t)+' '+f1(dy*t)+') rotate('+f1(th*t)+' '+f1(c2[0])+' '+f1(c2[1])+')');}
  function anim(a,z,cb){busy=true;const t0=performance.now();(function f(n){let t=Math.min(1,(n-t0)/1400);const e=t*t*(3-2*t);set(a+(z-a)*e);if(t<1)requestAnimationFrame(f);else{busy=false;cb&&cb();}})(t0);}
  let tail=null;
  b.onclick=()=>{if(busy)return;
    if(!on){anim(0,1,()=>{on=true;b.textContent='↺ Повернути';msg.className='msg ok';msg.textContent='Трикутники повністю збіглися: вони рівні.';
      if(!started){started=true;tail=stepper(tailHost,[
        {h:'Накласти трикутники можна, лише якщо їх можна взяти й пересунути.'},
        {h:'А рисунок у підручнику? Ділянка землі? Деталь моста? Там накласти не можна.'},
        {h:'Тому потрібен спосіб перевірити рівність <b>без накладання</b>: порівняти лише кілька елементів. Скільки їх потрібно? Перевіримо.',cls:'pl fin'}]);}});}
    else{anim(1,0,()=>{on=false;b.textContent='Накласти ▶';msg.textContent='';});}};
}
function sliderDemo(parent,cfg){
  const fb=el('div','figbox');parent.appendChild(fb);
  const sb=el('div','sliderbar','<span class="lbl">'+cfg.label+'</span>');
  const inp=el('input');inp.type='range';inp.min=cfg.min;inp.max=cfg.max;inp.step=1;inp.value=cfg.start;
  const val=el('span','lbl');sb.appendChild(inp);sb.appendChild(val);parent.appendChild(sb);
  const info=el('div','slinfo');parent.appendChild(info);
  let hit=false;
  function upd(){const v=+inp.value;val.textContent=v+'°';const r=cfg.draw(v);fb.innerHTML=r.svg;
    const eq=Math.abs(v-cfg.target)<.5;info.className='slinfo'+(eq?' ok':'');info.innerHTML=r.info;
    if(eq&&!hit){hit=true;cfg.onHit&&cfg.onHit();}}
  inp.oninput=upd;upd();}

function critStage(kind){
  const T={
    sas:{title:'Перша ознака рівності трикутників',tag:'за двома сторонами та кутом між ними',
      th:'<b>Теорема 8.1</b> (перша ознака рівності трикутників). Якщо <span class="c0">дві сторони</span> та <span class="c2">кут між ними</span> одного трикутника дорівнюють відповідно двом сторонам та куту між ними другого трикутника, то такі трикутники рівні.',
      steps:[
       {h:'<span class="c0">Сторона</span> <i>AB</i> = <i>A</i>₁<i>B</i>₁',lv:1},
       {h:'<span class="c1">Сторона</span> <i>BC</i> = <i>B</i>₁<i>C</i>₁',lv:2},
       {h:'<span class="c2">Кут</span> ∠<i>B</i> = ∠<i>B</i>₁ <span class="why">(кут <i>B</i> лежить між сторонами <i>AB</i> і <i>BC</i>)</span>',lv:3},
       {h:'Отже, ∆<i>ABC</i> = ∆<i>A</i>₁<i>B</i>₁<i>C</i>₁',cls:'pl fin',lv:3}],
      warn:'Кут має бути саме <b>між</b> рівними сторонами.'},
    asa:{title:'Друга ознака рівності трикутників',tag:'за стороною та двома прилеглими кутами',
      th:'<b>Теорема 8.3</b> (друга ознака рівності трикутників). Якщо <span class="c0">сторона</span> та <span class="c1">два прилеглих до неї кути</span> одного трикутника дорівнюють відповідно стороні та двом прилеглим до неї кутам другого трикутника, то такі трикутники рівні.',
      steps:[
       {h:'<span class="c0">Сторона</span> <i>AC</i> = <i>A</i>₁<i>C</i>₁',lv:1},
       {h:'<span class="c1">Кут</span> ∠<i>A</i> = ∠<i>A</i>₁ <span class="why">(прилягає до сторони <i>AC</i>)</span>',lv:2},
       {h:'<span class="c2">Кут</span> ∠<i>C</i> = ∠<i>C</i>₁ <span class="why">(теж прилягає до сторони <i>AC</i>)</span>',lv:3},
       {h:'Отже, ∆<i>ABC</i> = ∆<i>A</i>₁<i>B</i>₁<i>C</i>₁',cls:'pl fin',lv:3}],
      warn:'Обидва кути мають прилягати до рівної сторони.'}}[kind];
  return c=>{
    c.innerHTML='<div class="inner"><h2 class="st">'+T.title+'</h2><div class="cols"><div><div class="figbox" id="cf"></div></div><div id="cr"></div></div></div>';

  };}

/* 5. Серединний перпендикуляр */
function mpFig(level){
  const A=[40,150],B=[340,150],M=[190,150];let s='';
  if(level>=2)s+='<line x1="190" y1="12" x2="190" y2="210" stroke="#2A6592" stroke-width="2.8"/>'+txt([206,24],'a','vt');
  s+=seg(A,B,'#173F5F',3);
  if(level>=1)s+=dot(M,3.8)+txt([M[0]-14,M[1]+17],'M','vt');
  if(level>=1)s+=ticks(A,M,1,PC[0])+ticks(M,B,1,PC[0]);
  if(level>=2)s+='<polyline points="190,135 205,135 205,150" fill="none" stroke="'+PC[1]+'" stroke-width="2.6"/>';
  s+=dot(A,4)+dot(B,4)+txt([A[0]-4,A[1]+22],'A','vt')+txt([B[0]+4,B[1]+22],'B','vt');
  return svgWrap('0 0 380 225',s);}
function propBuild(p){
  p.appendChild(el('div','def big','<span class="dl">Теорема 8.2</span>Кожна точка серединного перпендикуляра відрізка рівновіддалена від кінців цього відрізка.'));
  p.appendChild(el('p','note','Пересувайте точку <i>X</i> по прямій <i>a</i> і порівнюйте відстані <i>XA</i> та <i>XB</i>.'));
  const fb=el('div','figbox');p.appendChild(fb);
  const sb=el('div','sliderbar','<span class="lbl">Точка <i>X</i></span>');const inp=el('input');inp.type='range';inp.min=-100;inp.max=100;inp.step=1;inp.value=55;sb.appendChild(inp);p.appendChild(sb);
  const info=el('div','slinfo ok');p.appendChild(info);
  const k=30,A=[50,150],B=[230,150],M=[140,150];
  function upd(){const t=+inp.value/100*3.4,X=[140,150-t*k*1.0+0];const Xp=[140,150-t*k*1];
    const xa=vlen(vsub(Xp,A))/k,xb=vlen(vsub(Xp,B))/k;
    let s='<line x1="140" y1="10" x2="140" y2="215" stroke="#2A6592" stroke-width="2.8"/>'+txt([158,22],'a','vt')+seg(A,B,'#173F5F',3);
    s+=seg(Xp,A,PC[0],3,'7 5')+seg(Xp,B,PC[1],3,'7 5');
    s+=ticks(Xp,A,2,'#1e9e62')+ticks(Xp,B,2,'#1e9e62');
    s+=dot(M,3.6)+txt([M[0]+14,M[1]+17],'M','vt')+dot(A,4)+dot(B,4)+txt([A[0],A[1]+22],'A','vt')+txt([B[0],B[1]+22],'B','vt')+dot(Xp,5,'#2A6592')+txt([Xp[0]+16,Xp[1]-12],'X','vt');
    fb.innerHTML=svgWrap('0 0 280 225',s);
    info.innerHTML='<span class="c0"><i>XA</i> = '+dec(xa.toFixed(1))+' см</span> &nbsp; <span class="c1"><i>XB</i> = '+dec(xb.toFixed(1))+' см</span><br><i>XA</i> = <i>XB</i>';}
  inp.oninput=upd;upd();}

function angLab(a,b,c,r,t){const u=vun(vsub(a,b)),v=vun(vsub(c,b)),d=vun(vadd(u,v));return txt(vadd(b,vmul(d,r)),t,'lt2');}
function outLab(p,c,t,d){return txt(vadd(p,vmul(vun(vsub(p,c)),d||17)),t,'vt');}
function exBody(parent,cfg){
  const cols=el('div','cols');parent.appendChild(cols);const l=el('div'),r=el('div');cols.appendChild(l);cols.appendChild(r);
  const fb=el('div','figbox',cfg.fig(0));l.appendChild(fb);
  if(cfg.cap)l.appendChild(el('div','note',cfg.cap));
  r.appendChild(el('div','note',cfg.cond));
  r.appendChild(el('div','dado',cfg.dado.map(d=>'<div class="row"><span class="lb">'+d[0]+'</span><span>'+d[1]+'</span></div>').join('')));

function burstAt(x,y){const cols=['#2A6592','#3887AF','#e8590c','#7048e8','#d6336c','#1e9e62','#f2b01e'];

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body></html>
