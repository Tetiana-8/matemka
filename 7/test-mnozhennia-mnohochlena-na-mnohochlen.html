<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Множення многочлена на многочлен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#2A6592; --dark:#1F4E73; --acc2:#3887AF; --soft:#DCE9F2; --pl:#EAF2F7; --pr:#F5F9FC; --line:#A8CADD;
  --title:#173F5F; --ink:#173F5F; --muted:#5b7a92;
  --ok:#059669; --okbg:#ecfdf5; --bad:#dc2626; --badbg:#fef2f2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#DCE9F2 0%,#A5C5DD 100%) fixed;-webkit-tap-highlight-color:transparent}
.app{height:100vh;height:100dvh;max-width:900px;margin:0 auto;padding:10px 14px 6px;display:flex;flex-direction:column;gap:8px}
h1{margin:0;padding:0 46px;text-align:center;color:var(--title);font-size:clamp(17px,3.1vw,28px);font-weight:900;line-height:1.2;text-wrap:balance}
#top{flex:none}
.prog{display:flex;flex-direction:column;align-items:center;gap:6px}
.prog .lbl{font-weight:800;font-size:15px;color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--dark);font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:0;touch-action:manipulation}
.chip.fill{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.cur{box-shadow:0 0 0 3px var(--acc2);border-color:var(--dark)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.miss{background:#fff;border-color:var(--bad);color:var(--bad)}
.card{flex:1 1 auto;min-height:0;overflow:auto;background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 26px rgba(23,63,95,.15);border:1px solid var(--line)}
.q{display:flex;flex-direction:column;gap:14px}
.qtext{font-size:clamp(16px,2.4vw,19px);line-height:1.5;font-weight:600}
.expr{font-size:clamp(20px,5.4vw,30px);text-align:center;padding:6px 0;overflow-x:auto;white-space:nowrap}
.m{font-family:"Cambria Math","Cambria","Times New Roman",Times,serif;font-size:1.12em;white-space:nowrap}
.m i{font-style:italic;padding-right:.04em}
.m sup{font-size:.68em;font-style:normal;vertical-align:super;line-height:0;margin-left:.02em}
.m .op{padding:0 .28em}
.m .mbox{display:inline-block;min-width:1.4em;padding:0 .2em;border:2px solid var(--acc);border-radius:6px;text-align:center;font-style:normal;color:var(--acc);font-weight:700;margin:0 .1em}
.lines{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--pr);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:clamp(14px,3.9vw,24px)}
.lines div{white-space:normal;display:flex;flex-wrap:wrap;align-items:center;row-gap:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.tf{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}.opts.tf{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--pr);cursor:pointer;font:inherit;font-size:clamp(15px,2.2vw,18px);color:var(--ink);text-align:left;touch-action:manipulation;width:100%}
.opts.tf .opt{justify-content:center;font-weight:800;font-size:20px}
.opt:hover{border-color:var(--acc2)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--acc2);background:#fff}
.opts.tf .dot{display:none}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.sel .dot{background:var(--acc);box-shadow:inset 0 0 0 3px #fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.locked .opt{cursor:default}
.ansrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.ansrow .lab{font-size:18px;font-weight:700;color:var(--dark)}
.num{font:inherit;font-size:24px;font-weight:800;width:150px;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;outline:none;color:var(--ink);background:#fff}
.num:focus{border-color:var(--acc)}
.num.ok{border-color:var(--ok);background:var(--okbg)} .num.bad{border-color:var(--bad);background:var(--badbg)}
.hintnum{text-align:center;font-size:14px;color:var(--muted)}
.verdict{font-weight:800;font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.corr{font-size:17px;font-weight:700;color:var(--ok);text-align:center}
#nav{flex:none;display:flex;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:12px 26px;min-height:46px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 5px 14px rgba(42,101,146,.3);touch-action:manipulation}
.btn:hover{background:linear-gradient(135deg,var(--dark),var(--acc))}
.btn.light{background:#fff;color:var(--acc);box-shadow:0 3px 10px rgba(23,63,95,.15);border:2px solid var(--line)}
.btn.light:hover{background:var(--soft)}
.btn[disabled]{opacity:.4;cursor:default}
#nav .btn{flex:1 1 0;max-width:260px;padding:12px 14px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.who{display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}
.who label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;text-align:left}
.who input{font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;color:var(--ink)}
.who input:focus{border-color:var(--acc)}
.who input.err{border-color:var(--bad);background:var(--badbg)}
.err-msg{color:var(--bad);font-weight:700;font-size:14px;min-height:1.3em}
.info{font-size:15px;line-height:1.5;color:var(--dark);max-width:520px}
.shot{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border:2px solid var(--acc);border-radius:14px;padding:12px 16px;max-width:560px;font-weight:700;font-size:16px;line-height:1.4;color:var(--dark)}
.shot .ic{font-size:30px;flex:none}
.big{font-size:clamp(40px,10vw,60px);font-weight:900;color:var(--acc);line-height:1.1}
.who-name{font-size:20px;font-weight:800}
.when{font-size:14px;color:var(--muted)}
.warn{color:var(--bad);font-weight:800;font-size:16px}
.sign{flex:none;text-align:center;font-size:10px;color:#8a8f98;padding:0 0 2px}
#kb{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px;background:var(--pl);border:1px solid var(--line);border-radius:14px}
#kb[hidden]{display:none}
#kb button{min-height:46px;border:0;border-radius:10px;background:#fff;color:var(--dark);font:inherit;font-weight:800;font-size:22px;box-shadow:0 1px 3px rgba(23,63,95,.2);touch-action:manipulation}
#kb button:active{background:var(--soft)}
/* вчитель */
.key{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(23,63,95,.15);z-index:2147483300;opacity:.55}
.key:hover{opacity:1;background:#fff}
.modal{position:fixed;inset:0;background:rgba(23,63,95,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;z-index:2147483640;overflow:auto}
.modal[hidden]{display:none}
.panel{background:#fff;border-radius:18px;padding:20px;width:min(1150px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel h2{margin:0;font-size:22px;color:var(--title)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
.tbl{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--soft)}
td.name{text-align:left;cursor:pointer;font-weight:700;color:var(--dark)}
td.y{color:var(--ok);font-weight:800} td.n{color:var(--bad);font-weight:800}
td.red{color:var(--bad);font-weight:800}
tr.det td{white-space:normal;text-align:left;background:var(--pr)}
.small{font-size:14px;color:var(--muted)}
.mini{font:inherit;font-weight:700;font-size:14px;padding:8px 16px;min-height:0;box-shadow:none}
.term{display:inline-block;padding:3px 3px;border-radius:8px;border:2px solid transparent;cursor:pointer;touch-action:manipulation}
.term:hover{background:var(--soft)}
.term.sel{background:var(--soft);border-color:var(--acc)}
.term.right{background:var(--okbg);border-color:var(--ok)}
.term.wrong{background:var(--badbg);border-color:var(--bad)}
.lines .m{font-size:1.12em}
.lines .term .op{padding:0 .2em}
.mrows{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
@media (max-width:560px){.mrow{grid-template-columns:1fr;gap:6px}}
.mexpr{font-size:clamp(17px,4.6vw,24px);white-space:nowrap}
.cell{min-height:54px;border:2px dashed var(--acc2);border-radius:12px;background:var(--pr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.cell.over{background:var(--soft);border-style:solid;border-color:var(--acc)}
.cell.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.cell.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.cor2{font-size:14px;color:var(--ok);font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px;padding:10px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.chipd{padding:8px 14px;border:2px solid var(--acc2);background:#fff;color:var(--ink);border-radius:10px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;font-size:clamp(15px,4vw,19px);white-space:nowrap}
.chipd.sel{background:var(--soft);border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.chipd.stat{cursor:default;border-color:transparent;background:transparent}
.chipd.ghost{position:fixed;z-index:2147483647;pointer-events:none;opacity:.92;box-shadow:0 6px 16px rgba(23,63,95,.3);background:var(--soft)}
@media (max-height:620px){.app{gap:5px;padding-top:6px}.card{padding:12px 14px}.chip{width:28px;height:28px;font-size:13px}.q{gap:8px}}
</style>
</head>
<body>
<button class="key" id="keyBtn" title="Для вчителя" type="button">🔑</button>

<div class="app">
  <h1>Множення многочлена на многочлен</h1>
  <div id="top"></div>
  <main class="card" id="card"></main>
  <div id="nav"></div>
  <div id="kb" hidden></div>
  <div class="sign">Автор розробки <b>Ковтун Тетяна</b></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-top:0">
      <h2>Результати учнів</h2>
      <button class="btn light mini" id="closeBtn" type="button">Закрити ✕</button>
    </div>
    <div id="pwdBox" class="row">
      <input type="password" id="pwd" placeholder="Пароль" autocomplete="off">
      <button class="btn mini" id="pwdBtn" type="button">Увійти</button>
      <span class="small" id="pwdMsg"></span>
    </div>
    <div id="resBox" hidden>
      <div class="row">
        <button class="btn light mini" id="refreshBtn" type="button">Оновити</button>
        <button class="btn light mini" id="csvBtn" type="button">Завантажити CSV</button>
        <button class="btn light mini" id="clearBtn" type="button">Очистити</button>
        <span class="small" id="resInfo"></span>
      </div>
      <div class="row hidden" id="confirmBox" hidden>
        <span id="confirmTxt" style="font-weight:700"></span>
        <button class="btn mini" id="confYes" type="button" style="background:var(--bad)">Так, видалити</button>
        <button class="btn light mini" id="confNo" type="button">Скасувати</button>
      </div>
      <div class="tbl" id="tbl"></div>
    </div>
  </div>
</div>

<script>
(function(){ "use strict";

/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=Math.random;
function setRng(f){rnd=f;}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nz(a,b){var n=0;while(n===0)n=ri(a,b);return n;}

/* многочлени як масиви коефіцієнтів: P[d] — коефіцієнт при v^d */
function mul(A,B){var r=[];for(var k=0;k<A.length+B.length-1;k++)r.push(0);for(var i=0;i<A.length;i++)for(var j=0;j<B.length;j++)r[i+j]+=A[i]*B[j];return r;}
function body(ab,txt){return (ab===1&&txt)?txt:String(ab)+txt;}
function join(terms){ /* [[коеф, текст]] без зведення подібних */
  var out="";
  terms.forEach(function(t){var c=t[0];if(c===0)return;var b=body(Math.abs(c),t[1]);
    if(!out)out=(c<0?"-":"")+b;else out+=(c<0?" - ":" + ")+b;});
  return out||"0";
}
function fmt(P,v){var terms=[];for(var d=P.length-1;d>=0;d--)terms.push([P[d],d===0?"":v+(d>1?"^"+d:"")]);return join(terms);}
function par(P,v){return "("+fmt(P,v)+")";}

function partials(A,B){var t=[];for(var i=0;i<A.length;i++)for(var j=0;j<B.length;j++)t.push({c:A[i]*B[j],d:i+j,i:i,j:j});return t;}
function comb(ts){var n=0;ts.forEach(function(t){if(t.d+1>n)n=t.d+1;});var r=[];for(var k=0;k<n;k++)r.push(0);ts.forEach(function(t){r[t.d]+=t.c;});return r;}
function cp(t,o){var r={c:t.c,d:t.d,i:t.i,j:t.j};for(var k in o)r[k]=o[k];return r;}
/* типові помилки при множенні многочленів */
function wrongPolys(A,B){
  var T=partials(A,B),out=[];
  T.forEach(function(_,k){out.push(comb(T.filter(function(_,m){return m!==k;})));});
  T.forEach(function(t,k){out.push(comb(T.map(function(u,m){return m===k?cp(u,{c:-u.c}):u;})));});
  out.push(comb(T.map(function(t){return (t.i===0&&t.j===0)?cp(t,{c:A[0]+B[0]}):t;})));
  out.push(comb(T.map(function(t){return (t.i===A.length-1&&t.j===B.length-1)?cp(t,{d:t.d-1}):t;})));
  return out;
}
/* 4 різні варіанти: правильний + 3 хибні (типові помилки), перемішані */
function makeOpts(rightP,cands,v){
  var right=fmt(rightP,v),seen={},list=[];seen[right]=1;
  shuffle(cands).forEach(function(P){var s=fmt(P,v);if(!seen[s]){seen[s]=1;list.push(s);}});
  var guard=0;
  while(list.length<3&&guard++<200){var P=rightP.slice();var d=ri(0,P.length-1);P[d]+=pick([-2,-1,1,2]);var s=fmt(P,v);if(!seen[s]){seen[s]=1;list.push(s);}}
  var opts=shuffle([right].concat(list.slice(0,3)));
  return {opts:opts,right:opts.indexOf(right)};
}
function polyRand(n,v,lead){ /* n членів, стандартний вигляд */
  var P=[];for(var d=0;d<n;d++)P.push(nz(-5,5));P[n-1]=lead||ri(1,3);return P;
}
var VARS=["x","y","a","b","m","n","p","t"];
function ev(P,x){var s=0;for(var d=P.length-1;d>=0;d--)s=s*x+P[d];return s;}

function mkMatch(v,E){
  var items=E.map(function(p){return {expr:par(p[0],v)+par(p[1],v),res:fmt(mul(p[0],p[1]),v),f:(function(A,B){return function(x){return ev(A,x)*ev(B,x);};})(p[0],p[1])};});
  var seen={},ok=true;items.forEach(function(it){if(seen[it.res])ok=false;seen[it.res]=1;});
  if(!ok)return null;
  var pool=shuffle(items.map(function(it){return it.res;}));
  return {type:"match",text:"Перетягніть кожну відповідь у клітинку біля свого добутку.",items:items,pool:pool,m:{kind:"match"}};
}
var GEN=[
/* 1. правило (теорія) */
function(){
  var right="помножити кожний член першого многочлена на кожний член другого й додати отримані добутки";
  var o=shuffle([right,
    "помножити кожний член першого многочлена лише на перший член другого",
    "помножити перші члени многочленів між собою, а другі між собою й додати добутки",
    "помножити коефіцієнти многочленів, а змінні залишити без змін"]);
  return {type:"choice",text:"Щоб помножити многочлен на многочлен, потрібно:",expr:"",opts:o,right:o.indexOf(right),math:false,cols:1,m:{kind:"theory"}};
},
/* 2. кількість добутків */
function(){
  var v=pick(VARS),m=ri(2,3),n=ri(2,3);
  var A=polyRand(m,v),B=polyRand(n,v);
  return {type:"num",text:"Скільки добутків членів многочленів треба скласти під час множення (до зведення подібних членів)?",expr:par(A,v)+par(B,v),label:"кількість добутків",right:m*n,m:{kind:"count",m:m,n:n}};
},
/* 3. (v+a)(v+b) */
function(){
  var v=pick(VARS),a=ri(2,7),b=ri(2,7);while(b===a)b=ri(2,7);
  var A=[a,1],B=[b,1],R=mul(A,B),o=makeOpts(R,wrongPolys(A,B),v);
  return {type:"choice",text:"Виконайте множення:",expr:par(A,v)+par(B,v),opts:o.opts,right:o.right,math:true,cols:2,m:{kind:"poly",f:function(x){return ev(A,x)*ev(B,x);}}};
},
/* 4. так / ні */
function(){
  var v=pick(VARS),a=ri(2,7),b=ri(2,7);while(b===a)b=ri(2,7);
  var A=[a,1],B=[-b,1],R=mul(A,B),truth=rnd()<0.5,rhs;
  if(truth)rhs=fmt(R,v);else{var w=wrongPolys(A,B).map(function(P){return fmt(P,v);}).filter(function(s){return s!==fmt(R,v);});rhs=pick(w);}
  return {type:"choice",text:"Чи правильно виконано множення?",expr:par(A,v)+par(B,v)+" = "+rhs,opts:["Так","Ні"],right:truth?0:1,math:false,cols:2,tf:true,m:{kind:"tf",f:function(x){return ev(A,x)*ev(B,x);},rhs:rhs,truth:truth}};
},
/* 5. три добутки: перетягнути відповіді */
function(){
  var v=pick(VARS),a=ri(2,6),b=ri(2,6);while(b===a)b=ri(2,6);
  return mkMatch(v,[[[a,1],[b,1]],[[-a,1],[b,1]],[[-a,1],[-b,1]]]);
},
/* 6. (v-a)(v+b) */
function(){
  var v=pick(VARS),a=ri(2,8),b=ri(2,8);while(b===a)b=ri(2,8);
  var A=[-a,1],B=[b,1],R=mul(A,B),o=makeOpts(R,wrongPolys(A,B),v);
  return {type:"choice",text:"Виконайте множення:",expr:par(A,v)+par(B,v),opts:o.opts,right:o.right,math:true,cols:2,m:{kind:"poly",f:function(x){return ev(A,x)*ev(B,x);}}};
},
/* 7. (kv+a)(mv-b) */
function(){
  var v=pick(VARS),k,m,a,b;
  do{k=ri(2,3);m=ri(2,3);a=ri(1,5);b=ri(1,5);}while(a*m-k*b===0);
  var A=[a,k],B=[-b,m],R=mul(A,B),o=makeOpts(R,wrongPolys(A,B),v);

function Mi(s){
  var o="";
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch==="^"){var j=i+1;while(j<s.length&&/[0-9]/.test(s[j]))j++;o+="<sup>"+s.slice(i+1,j)+"</sup>";i=j-1;continue;}
    if(ch==="["&&s.slice(i,i+3)==="[?]"){o+='<span class="mbox">?</span>';i+=2;continue;}
    if(ch===" "&&/[+\-=]/.test(s[i+1]||"")&&s[i+2]===" "){var sym=s[i+1]==="-"?"−":s[i+1];o+='<span class="op">'+sym+"</span>";i+=2;continue;}
    if(ch==="-"){o+="−";continue;}
    if(ch==="*"){o+="·";continue;}
    if(/[a-zA-Z]/.test(ch)){o+="<i>"+ch+"</i>";continue;}
    o+=ch;
  }
  return o;
}
function M(s){return '<span class="m">'+Mi(s)+"</span>";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function R(text){ /* звичайний текст із формулами між ⟦ ⟧ */
  return text.split(/⟦|⟧/).map(function(p,i){return i%2?M(p):esc(p);}).join("");
}
function plain(s){return String(s).replace(/⟦|⟧/g,"").replace(/\[\?\]/g,"?").replace(/ - /g," − ").replace(/(^|\()-/g,"$1−").replace(/\*/g,"·").replace(/\^2/g,"²").replace(/\^3/g,"³");}

  S.score=S.marks.reduce(function(s,x){return s+x;},0);
  var now=Date.now();
  S.when=new Date(now).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  saveResult({
    id:now+"_"+Math.random().toString(36).slice(2,8),
    name:S.sur+" "+S.nam,surname:S.sur,firstName:S.nam,
    ts:now,date:new Date(now).toISOString(),
    score:S.score,max:TOTAL,tasks:S.marks,
    qtext:S.tasks.map(function(_,i){return qtext(i);}),
    answers:S.tasks.map(function(_,i){return ansText(i);}),
    correct:S.tasks.map(function(_,i){return rightText(i);}),
    durationSec:Math.round((now-W.t0)/1000),
    leaves:W.leaves,awaySec:W.awaySec,
    variant:S.seed,test:TEST_NAME
  });
  go("result");
}
function again(){newVariant();go("task",0);}

/* ---------- події ---------- */
$("card").addEventListener("click",function(e){
  var c=e.target.closest("[data-chip]");
  if(c){var i=+c.getAttribute("data-chip");
    if(S.screen==="task"||S.screen==="review")go("task",i);
    else if(S.screen==="result"||S.screen==="rview")go("rview",i);
    return;}
  var tmm=e.target.closest("[data-term]");
  if(tmm&&S.screen==="task"){S.ans[S.cur]=tmm.getAttribute("data-term");
    $("card").querySelectorAll("[data-term]").forEach(function(n){n.classList.toggle("sel",n===tmm);});refreshChips();return;}
  var ce=e.target.closest(".cell");
  if(ce&&S.screen==="task"&&S.sel!==null&&S.sel!==undefined&&!e.target.closest(".chipd")){putChip(S.sel,+ce.getAttribute("data-cell"));return;}
  var o=e.target.closest("[data-opt]");
  if(o&&S.screen==="task"){S.ans[S.cur]=+o.getAttribute("data-opt");
    var btns=$("card").querySelectorAll("[data-opt]");
    for(var k=0;k<btns.length;k++)btns[k].classList.toggle("sel",k===S.ans[S.cur]);
    refreshChips();}
});
$("top").addEventListener("click",function(e){
  var c=e.target.closest("[data-chip]");if(!c)return;var i=+c.getAttribute("data-chip");
  if(S.screen==="task")go("task",i);else if(S.screen==="rview")go("rview",i);
});
$("card").addEventListener("input",function(e){
  if(e.target.id==="numIn"&&S.screen==="task"){
    var v=e.target.value.replace(/[^0-9\-−,.\s]/g,"");
    if(v!==e.target.value)e.target.value=v;
    S.ans[S.cur]=v;refreshChips();
  }
  if(e.target.id==="sur"||e.target.id==="nam"){e.target.classList.remove("err");}
});
$("nav").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;
  var id=b.id;
  if(id==="startBtn")start();
  else if(id==="nextBtn")next();
  else if(id==="prevBtn")prev();
  else if(id==="checkBtn")check();
  else if(id==="againBtn")again();
  else if(id==="sumBtn")go("result");
});
$("kb").addEventListener("pointerdown",function(e){e.preventDefault();});
$("kb").addEventListener("click",function(e){
  var b=e.target.closest("[data-k]");if(!b||S.screen!=="task")return;
  var k=b.getAttribute("data-k"),cur=S.ans[S.cur]===null?"":String(S.ans[S.cur]);
  if(k==="b")cur=cur.slice(0,-1);
  else if(k==="-"){cur=cur.charAt(0)==="-"?cur.slice(1):"-"+cur;}
  else if(cur.replace("-","").length<6)cur+=k;
  S.ans[S.cur]=cur;
  var inp=$("numIn");if(inp)inp.value=cur;
  refreshChips();
});
document.addEventListener("keydown",function(e){
  if(!$("modal").hidden)return;
  var inField=e.target&&(e.target.tagName==="INPUT");
  if(e.key==="Enter"){
    if(S.screen==="start"){start();}
    else if(S.screen==="task"&&answered(S.cur)){e.preventDefault();next();}
  }else if(!inField&&(S.screen==="task"||S.screen==="rview")){
    if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();
  }
});

/* ---------- перетягування відповідей ---------- */
function cellsOf(){var a=S.ans[S.cur];return Array.isArray(a)?a.slice():[null,null,null];}
function putChip(idx,k){var c=cellsOf(),p=c.indexOf(idx);if(p>=0)c[p]=null;if(k>=0)c[k]=idx;S.ans[S.cur]=c;S.sel=null;render();}
var drag=null;
function clearOver(){document.querySelectorAll(".cell.over").forEach(function(n){n.classList.remove("over");});}
$("card").addEventListener("pointerdown",function(e){
  if(S.screen!=="task")return;var c=e.target.closest(".chipd");if(!c||c.classList.contains("stat"))return;
  e.preventDefault();drag={idx:+c.getAttribute("data-idx"),sx:e.clientX,sy:e.clientY,moved:false,ghost:null,el:c};
});
window.addEventListener("pointermove",function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){
    drag.moved=true;var g=drag.el.cloneNode(true);g.classList.add("ghost");g.style.width=drag.el.offsetWidth+"px";document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity=".35";}
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+"px";drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+"px";
    var u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest?u.closest(".cell"):null;
    clearOver();if(cl)cl.classList.add("over");
  }
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;
  if(d.ghost)d.ghost.remove();clearOver();
  if(d.moved){
    var u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest?u.closest(".cell"):null;
    if(cl)putChip(d.idx,+cl.getAttribute("data-cell"));
    else if(u&&u.closest&&u.closest("#pool"))putChip(d.idx,-1);
    else render();
  }else if(d.el.parentNode&&d.el.parentNode.classList.contains("cell"))putChip(d.idx,-1);
  else{S.sel=(S.sel===d.idx?null:d.idx);render();}
}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);

/* ---------- журнал учителя ---------- */
var rows=[];
$("keyBtn").addEventListener("click",function(){$("modal").hidden=false;if(!$("pwdBox").hidden)$("pwd").focus();});
$("closeBtn").addEventListener("click",function(){$("modal").hidden=true;});
function login(){
  if($("pwd").value===TEACHER_PASSWORD){$("pwdBox").hidden=true;$("resBox").hidden=false;load();}
  else $("pwdMsg").textContent="Неправильний пароль";
}
$("pwdBtn").addEventListener("click",login);
$("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")login();});
$("refreshBtn").addEventListener("click",load);
function mmss(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
async function load(){
  var info=$("resInfo");info.textContent="Завантаження…";
  try{rows=await loadResults();}catch(e){info.textContent="Не вдалося підключитися до бази результатів";$("tbl").innerHTML="";return;}
  info.textContent="Усього записів: "+rows.length;
  var maxN=rows.reduce(function(m,r){return Math.max(m,r.max||0);},0)||TOTAL;
  var h="<table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>";
  for(var i=1;i<=maxN;i++)h+="<th>"+i+"</th>";
  h+="</tr></thead><tbody>";
  rows.forEach(function(r,k){
    var dt=r.date?new Date(r.date).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
    var hasT=typeof r.durationSec==="number",hasL=typeof r.leaves==="number";
    var fast=hasT&&r.durationSec<120,many=hasL&&r.leaves>=3;
    h+='<tr><td>'+(k+1)+'</td><td class="name" data-row="'+k+'"></td><td>'+dt+"</td>"+
      '<td'+(fast?' class="red" title="Дуже швидко"':"")+">"+(hasT?mmss(r.durationSec):"—")+"</td>"+
      '<td'+(many?' class="red"':"")+(hasL&&typeof r.awaySec==="number"?' title="Поза вікном: '+mmss(r.awaySec)+'"':"")+">"+(hasL?r.leaves:"—")+"</td>"+
      "<td><b>"+r.score+" / "+(r.max||"")+"</b></td>";
    for(var q=0;q<maxN;q++){var v=(r.tasks||[])[q];h+=v===undefined?"<td>—</td>":(v?'<td class="y">✓</td>':'<td class="n">✗</td>');}
    h+="</tr>";
  });
  $("tbl").innerHTML=h+"</tbody></table>";
  var tds=$("tbl").querySelectorAll("td.name");
  tds.forEach(function(td){var r=rows[+td.getAttribute("data-row")];td.textContent=r.name||((r.surname||"")+" "+(r.firstName||""));});
}
$("tbl").addEventListener("click",function(e){
  var td=e.target.closest("td.name");if(!td)return;
  var tr=td.parentNode,nx=tr.nextSibling;
  if(nx&&nx.classList&&nx.classList.contains("det")){nx.remove();return;}
  var r=rows[+td.getAttribute("data-row")];
  var span=tr.children.length,h='<tr class="det"><td colspan="'+span+'"><table><thead><tr><th>№</th><th>Завдання</th><th>Відповідь учня</th><th>Правильна</th></tr></thead><tbody>';
  (r.qtext||[]).forEach(function(q,i){
    var ok=(r.tasks||[])[i];
    h+="<tr><td>"+(i+1)+'</td><td style="text-align:left;white-space:normal">'+esc(q)+'</td><td class="'+(ok?"y":"n")+'">'+esc((r.answers||[])[i]||"—")+"</td><td>"+esc((r.correct||[])[i]||"")+"</td></tr>";
  });
  tr.insertAdjacentHTML("afterend",h+"</tbody></table></td></tr>");
});
$("csvBtn").addEventListener("click",function(){
  var maxN=rows.reduce(function(m,r){return Math.max(m,r.max||0);},0)||TOTAL;
  var head=["Прізвище та ім’я","Дата","Час (хв:с)","Виходів з вікна","Поза вікном (хв:с)","Бал"];
  for(var i=1;i<=maxN;i++)head.push("Завд. "+i);
  var lines=[head.join(";")];
  rows.forEach(function(r){
    var l=[(r.name||"").replace(/;/g,","),r.date?new Date(r.date).toLocaleString("uk-UA"):"",typeof r.durationSec==="number"?mmss(r.durationSec):"",typeof r.leaves==="number"?r.leaves:"",typeof r.awaySec==="number"?mmss(r.awaySec):"",r.score+"/"+(r.max||"")];
    for(var q=0;q<maxN;q++){var v=(r.tasks||[])[q];l.push(v===undefined?"":(v?"+":"-"));}
    lines.push(l.join(";"));
  });
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Множення_многочлена_7клас_результати.csv";
  document.body.appendChild(a);a.click();a.remove();
});
$("clearBtn").addEventListener("click",function(){
  $("confirmTxt").textContent="Видалити всі записи ("+rows.length+")?";$("confirmBox").hidden=false;
});
$("confNo").addEventListener("click",function(){$("confirmBox").hidden=true;});
$("confYes").addEventListener("click",async function(){
  $("confirmBox").hidden=true;
  try{await clearResults();await load();}catch(e){$("resInfo").textContent="Не вдалося очистити записи. Перевірте правила бази Firebase";}
});

newVariant();
render();
})();
</script>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
