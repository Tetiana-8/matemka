<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Множення многочлена на многочлен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap&amp;subset=cyrillic">
<style>
:root{
  --acc:#2A6592;--accD:#1F4E73;--acc2:#3887AF;--soft:#DCE9F2;--panelL:#EAF2F7;--panelR:#F5F9FC;--line:#A8CADD;--ink:#173F5F;
  --ok:#1f9d55;--okBg:#e6f6ec;--bad:#d93025;--badBg:#fdecea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:16px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17324a;
  background:linear-gradient(160deg,#DCE9F2 0%,#A5C5DD 100%) fixed;-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding:12px 12px 24px}
body.kp .wrap{padding-bottom:280px}
h1{margin:6px 0 10px;text-align:center;color:var(--ink);font-size:clamp(20px,5.8vw,30px);font-weight:800;line-height:1.2}
i{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:400}
sup{font-size:.62em;line-height:0;vertical-align:.55em}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}

#tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--acc);border-radius:12px;font-weight:800;font-size:clamp(12px,3.3vw,15px);line-height:1.15;padding:4px;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(23,63,95,.08)}
.lead{font-weight:800;color:var(--ink);font-size:clamp(17px,4.6vw,21px);text-align:center;margin:2px 0 6px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--ink)}
.dots{letter-spacing:3px;color:var(--acc2);white-space:nowrap}
.step{font-weight:800;color:var(--accD);margin:12px 0 8px;font-size:17px}
.cap{margin:6px 0 0;text-align:center;color:var(--accD);font-weight:700;min-height:1.4em}

.btn{min-height:48px;padding:10px 18px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn:hover{background:var(--accD)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.light{background:var(--soft);color:var(--accD)}
.btn.light:hover{background:#cfe0ec}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--line)}
.btn.big{width:100%;font-size:18px;min-height:54px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.row .btn{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:10px}

/* вираз і стрілки */
.exwrap{position:relative;padding:60px 0 60px;overflow-x:auto;overflow-y:hidden}
.exwrap.mono{padding-bottom:10px}
.exwrap svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.expr{position:relative;display:flex;justify-content:center;align-items:baseline;flex-wrap:nowrap;white-space:nowrap;
  font-size:clamp(20px,5.6vw,30px);color:var(--ink);min-width:min-content}
.expr .tm{padding:0 1px}
.expr .op{margin:0 .3em}
.expr .sg{margin-right:1px}
.sumrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 3px;font-size:clamp(19px,5.2vw,28px);color:var(--ink);padding:2px 0}
.sumrow .op{margin:0 .2em}
.tg{white-space:nowrap}
.ch{padding:1px 6px;border-radius:7px;white-space:nowrap}
.ph{opacity:.4}
.fin{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:8px}
.memo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.memo div{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;font-size:15px;text-align:center}
.memo b{color:var(--accD);display:block;font-size:14px;margin-bottom:2px}
.memo span{font-size:18px;white-space:nowrap}

/* поля введення */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{border:2.5px solid var(--c);border-radius:14px;padding:8px 10px;background:#fff}
.slot .lab{font-size:19px;color:var(--c);font-weight:700;white-space:nowrap;margin-bottom:4px}
.inp{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--panelR);padding:6px 10px;font-size:22px;display:flex;align-items:center;overflow:hidden;cursor:text;color:var(--ink);white-space:nowrap}
.inp.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(42,101,146,.2)}
.inp.ok{border-color:var(--ok);background:var(--okBg)}
.inp.bad{border-color:var(--bad);background:var(--badBg)}
.inp .op{margin:0 .2em}
.cur{display:inline-block;width:2px;height:1.15em;background:var(--acc);margin-left:1px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.fb{font-size:14.5px;color:var(--bad);margin-top:4px;font-weight:600}
.fb:empty{display:none}
.fin-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin-row .lab{font-weight:800;color:var(--accD)}
.fin-row .inp{flex:1 1 220px}
.hl{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:10px;font-size:18px}
.ok-box{background:var(--okBg);border:2px solid var(--ok);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:18px}
.ok-box b{color:var(--ok)}
.bad-box{background:var(--badBg);border:2px solid var(--bad);border-radius:14px;padding:10px 12px;margin-top:10px}
.bad-box b{color:var(--bad)}

/* тест */
.q{font-size:clamp(18px,5vw,22px);color:var(--ink);font-weight:700;margin:4px 0 12px;text-align:center}
.q span{white-space:nowrap}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:clamp(17px,4.8vw,21px);margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt b{color:var(--acc);min-width:1.4em;font-family:inherit}
.opt:hover{background:var(--panelR)}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--bad);background:var(--badBg)}
.opt[disabled]{cursor:default}
.score{font-size:19px;text-align:center;margin:6px 0}
.sig{text-align:center;font-size:12px;color:#8a97a3;margin-top:14px}

/* екранна клавіатура */
#kp{position:fixed;left:0;right:var(--pm-w,0px);bottom:0;z-index:50;background:var(--panelL);border-top:2px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(23,63,95,.15)}
html.pm-dock-l #kp{left:var(--pm-w,0px);right:0}
#kp[hidden]{display:none}
#kp .g{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#kp button{min-height:48px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:21px;font-weight:700;cursor:pointer;padding:0}
#kp button:active{background:var(--soft)}
#kp .k-v{font-family:"Times New Roman",serif;font-style:italic;font-weight:400;font-size:24px}
#kp .k-f{background:var(--soft);color:var(--accD)}
#kp .k-go{background:var(--acc);color:#fff;border-color:var(--acc)}
#kp .k-go:active{background:var(--accD)}
@media (max-height:560px){#kp button{min-height:38px;font-size:18px}body.kp .wrap{padding-bottom:230px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Множення многочлена на многочлен</h1>
  <nav id="tabs"></nav>
  <main id="app"></main>
  <div class="sig">Автор розробки Ковтун Тетяна</div>
</div>

<div id="kp" hidden>
  <div class="g">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="−" class="k-f">−</button><button data-k="+" class="k-f">+</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="x" class="k-v">x</button><button data-k="y" class="k-v">y</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="²" class="k-f">x²</button><button data-k="³" class="k-f">x³</button>
    <button data-k="0">0</button><button data-k="⁴" class="k-f">x⁴</button><button data-k="⌫" class="k-f" title="Стерти">⌫</button><button data-k="➜" class="k-f" title="Наступне поле">➜</button><button data-k="✓" class="k-go" title="Перевірити">✓</button>
  </div>
</div>

<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (початок) =====================
     Вставити цей блок цілком перед </body> будь-якої розробки.
     Тонка смужка збоку: урок трохи звужується і ніколи не перекривається панелькою.
     Малюнок тимчасовий: нічого не зберігається, після закриття уроку все зникає. -->
<style>
#pm-ink{position:fixed;left:0;top:0;z-index:2147483200;pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none}
#pm-ink.on{pointer-events:auto;cursor:crosshair}
#pm-paper{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;z-index:2147483100}
.pm-sheet{position:absolute;background:#fff;border:1px solid #c9c9c9;box-shadow:0 2px 10px rgba(0,0,0,.2);box-sizing:border-box}
.pm-sheet.grid{background-image:linear-gradient(#cfe0f3 1px,transparent 1px),linear-gradient(90deg,#cfe0f3 1px,transparent 1px);background-size:24px 24px}
.pm-sheet.pm-prev{border:2px dashed #f08a00;background-color:rgba(255,255,255,.85)}

/* місце під панельку забираємо в уроку, а не перекриваємо ним */
html.pm-dock-r{padding-right:var(--pm-w,26px)!important;box-sizing:border-box!important}
html.pm-dock-l{padding-left:var(--pm-w,26px)!important;box-sizing:border-box!important}

#pm-panel,#pm-fab{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;box-sizing:border-box}
#pm-panel *{box-sizing:border-box}
#pm-panel[hidden],#pm-fab[hidden]{display:none!important}
#pm-panel{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:2147483600;width:42px;max-height:calc(100vh - 10px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  background:#e3e7ee;border:1px solid #aeb7c4;border-radius:14px;box-shadow:0 2px 12px rgba(40,50,70,.22)}
#pm-panel::-webkit-scrollbar{display:none}
#pm-panel.pm-left{right:auto;left:4px}
.pm-b{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:transparent;color:#465162;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pm-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pm-b:hover{background:#d3d9e3}
.pm-b:active{transform:scale(.93)}
.pm-b.on{background:#c5cedb;color:#26303f;box-shadow:inset 0 0 0 1px #8f9db2}
#pm-panel.pm-left [data-a="hide"] svg{transform:scaleX(-1)}
.pm-sep{flex:none;width:18px;height:1px;margin:3px 0;background:#bcc4d0}
.pm-colors{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px 0}
.pm-c{width:15px;height:15px;padding:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #9aa4b3;cursor:pointer}
.pm-c.on{box-shadow:0 0 0 2px #3b4452}

#pm-fab{position:fixed;right:0;top:50%;margin-top:-26px;z-index:2147483600;width:20px;height:52px;padding:0;
  display:flex;align-items:center;justify-content:center;color:#465162;cursor:pointer;
  background:#e3e7ee;border:1px solid #aeb7c4;border-right:0;border-radius:12px 0 0 12px;box-shadow:0 2px 8px rgba(40,50,70,.2)}
#pm-fab.pm-left{right:auto;left:0;border:1px solid #aeb7c4;border-left:0;border-radius:0 12px 12px 0}
#pm-fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* низький екран: кнопки стають у дві колонки */
@media (max-height:600px){
  #pm-panel{width:78px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 2px}
  .pm-sep{display:none}
  .pm-colors{width:100%;grid-template-columns:repeat(4,auto);justify-content:center;gap:4px;padding:4px 0}
  .pm-c{width:14px;height:14px}
}
</style>

<canvas id="pm-ink"></canvas>
<div id="pm-paper"></div>

<button id="pm-fab" type="button" title="Відкрити панельку для письма"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>

<div id="pm-panel" hidden>
  <button type="button" class="pm-b" data-a="cursor" title="Керувати уроком (не писати)"><svg viewBox="0 0 24 24"><path d="M5.5 3.5l6.2 16 2.4-6.6 6.6-2.4z"/></svg></button>
  <button type="button" class="pm-b" data-a="pen" title="Писати"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
  <button type="button" class="pm-b" data-a="eraser" title="Гумка"><svg viewBox="0 0 24 24"><path d="M15.6 4.6l3.8 3.8a1.8 1.8 0 010 2.5L11.2 19H7.6l-3-3a1.8 1.8 0 010-2.5l8.5-8.9a1.8 1.8 0 012.5 0z"/><path d="M8.8 10.8l5.4 5.4"/><path d="M11.5 19H20"/></svg></button>
  <div class="pm-sep"></div>
  <div class="pm-colors">
    <button type="button" class="pm-c" data-a="color" data-c="#e53935" style="background:#e53935" title="Червоний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1e5fd6" style="background:#1e5fd6" title="Синій"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#222222" style="background:#222" title="Чорний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1f9d55" style="background:#1f9d55" title="Зелений"></button>
  </div>
  <button type="button" class="pm-b" data-a="width" title="Тонка / товста лінія"><svg viewBox="0 0 24 24"><path d="M4 8h16" style="stroke-width:1.1"/><path d="M4 15.5h16" style="stroke-width:3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="smart" title="Рівні фігури: трикутник, коло, пряма"><svg viewBox="0 0 24 24"><path d="M3.5 19.5l6-12 6 12z"/><circle cx="17" cy="8" r="3.4"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="paper" title="Виділити прямокутник білим"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2" stroke-dasharray="3 2.6"/></svg></button>
  <button type="button" class="pm-b" data-a="board" title="Закрити весь екран білим"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" style="fill:currentColor;fill-opacity:.14"/></svg></button>
  <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';

var WHY={
  unsimpl:'Це ще не остаточна відповідь: подібні члени не зведено.',
  sign:'У цій відповіді помилка в знаку одного з добутків.',
  forgot:'Тут пропущено один із добутків.',
  coef:'Один із добутків пораховано неправильно.',
  combine:'Помилка під час зведення подібних членів.'
};
function buildOptions(F,S,noneOk){
  var raw=pmulRaw(F,S),E=simplify(raw),used={};used[canon(E)]=1;
  var need=noneOk?4:3,out=[];
  function add(c){
    if(!c)return;
    var k=(c.un?'U':'S')+canon(c.un?c.L:simplify(c.L));
    if(c.un){if(used[k])return;}else{if(used[canon(simplify(c.L))]||used[k])return;}
    used[k]=1;if(!c.un)used[canon(simplify(c.L))]=1;out.push(c);
  }
  var gens={
    unsimpl:function(){return raw.length>E.length?{L:raw.map(copy),kind:'unsimpl',un:true}:null;},
    sign:function(){var L=raw.map(copy);L[ri(0,L.length-1)].c*=-1;return {L:simplify(L),kind:'sign'};},
    forgot:function(){var L=raw.map(copy);L.splice(ri(0,L.length-1),1);return {L:simplify(L),kind:'forgot'};},
    coef:function(){var L=raw.map(copy),i=ri(0,L.length-1);L[i].c+=pick([1,-1,2,-2]);if(!L[i].c)L[i].c=1;return {L:simplify(L),kind:'coef'};},
    combine:function(){var L=E.map(copy),i=ri(0,L.length-1);L[i].c+=pick([1,-1,2,-2]);if(!L[i].c)L[i].c=3;return {L:L,kind:'combine'};}
  };
  add(gens.unsimpl());
  shuffle(['sign','forgot','coef','combine']).forEach(function(k){if(out.length<need)add(gens[k]());});
  var guard=0,ks=['sign','coef','combine','forgot'];
  while(out.length<need&&guard++<200)add(gens[pick(ks)]());
  return {raw:raw,E:E,dist:out.slice(0,need)};
}
function buildQuiz(){
  var lv=shuffle([1,1,2,2,3,3]);
  return {i:0,done:false,score:0,qs:lv.map(function(l){
    var q=genPoly(l),none=Math.random()<.15,o=buildOptions(q.F,q.S,none);
    var opts=o.dist.map(function(c){return {h:polyHTML(c.L),ok:false,kind:c.kind};});
    if(!none)opts.push({h:polyHTML(o.E),ok:true,kind:'ok'});
    opts=shuffle(opts);
    opts.push({h:'інша відповідь',ok:none,kind:none?'ok':'other'});
    return {F:q.F,S:q.S,raw:o.raw,E:o.E,none:none,opts:opts,pick:-1};
  })};
}

/* ===================== екранна клавіатура ===================== */
var active=null;
function inputHTML(v){
  return v.replace(/[xy]/g,function(m){return '<i>'+m+'</i>';})
          .replace(/[²³⁴]/g,function(m){return '<sup>'+SUPR[m]+'</sup>';})
          .replace(/([+−])/g,'<span class="op">$1</span>');
}
function paintInput(o){
  if(!o||!o.el)return;
  o.el.innerHTML=inputHTML(o.v)+(o===active?'<span class="cur"></span>':'');
  o.el.classList.toggle('act',o===active);
  o.el.classList.toggle('bad',!!o.bad);
  o.el.classList.toggle('ok',!!o.ok);
  var fb=document.getElementById('fb-'+o.id);if(fb)fb.innerHTML=o.msg||'';
}
function setActive(o,noScroll){
  var prev=active;active=o||null;
  if(prev&&prev!==o)paintInput(prev);
  if(o){paintInput(o);if(!noScroll&&o.el&&o.el.scrollIntoView)try{o.el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
}
function press(k){
  if(k==='✓'){check();return;}
  if(k==='➜'){nextSlot();return;}
  var o=active;if(!o||o.ok)return;
  if(k==='⌫')o.v=o.v.slice(0,-1);else if(o.v.length<26)o.v+=k;
  o.bad=false;o.msg='';paintInput(o);
}
function curTask(){
  if(S.screen!=='mono'&&S.screen!=='poly')return null;
  var set=S.sets[S.screen];return set&&set.tasks[set.i]||null;
}
function fields(t){var f=t.pairs.slice();if(t.step===2)f=[t.fin];return f;}
function firstOpen(t){var f=fields(t);for(var i=0;i<f.length;i++)if(!f[i].ok)return f[i];return null;}
function nextSlot(){
  var t=curTask();if(!t||t.step>=3)return;
  var f=fields(t).filter(function(o){return !o.ok;});if(!f.length)return;
  var i=f.indexOf(active);setActive(f[(i+1)%f.length]);
}

/* ===================== перевірка ===================== */
function checkTerm(p){
  var L=parsePoly(p.v);
  if(!L)return 'Запиши добуток, наприклад 6<i>x</i><sup>2</sup> або −8<i>x</i>';
  if(L.length!==1)return 'Тут має бути один член (добуток)';
  var g=L[0],e=p.exp;
  if(key(g)===key(e)&&g.c===e.c)return true;
  if(key(g)===key(e)){
    if(g.c===-e.c)return 'Перевір знак: ('+sg(p.f.c)+')·('+sg(p.s.c)+') = '+sg(e.c);
    return 'Перевір коефіцієнти: '+Math.abs(p.f.c)+' · '+Math.abs(p.s.c)+' = ?';
  }
  return 'Перевір змінні: при множенні степені додаються, наприклад <i>x</i> · <i>x</i><sup>2</sup> = <i>x</i><sup>3</sup>';
}
function lbl(q){var v=varsHTML(q);return v?'з '+v:'без змінної (число)';}
function checkFinal(t){
  var L=parsePoly(t.fin.v);
  if(!L)return 'Запиши многочлен, наприклад 2<i>x</i><sup>2</sup> − 5<i>x</i> − 12';
  var m={},i,k;
  for(i=0;i<L.length;i++){
    k=key(L[i]);
    if(k in m)return 'Є подібні члени, їх ще можна звести';
    if(L[i].c===0)return 'Член з нулем не записують';
    m[k]=L[i];
  }
  var em={};t.E.forEach(function(q){em[key(q)]=q;});
  for(i=0;i<t.E.length;i++){
    k=key(t.E[i]);
    if(!(k in m))return 'Не вистачає доданка '+lbl(t.E[i]);
    if(m[k].c!==t.E[i].c)return 'Перевір коефіцієнт доданка '+lbl(t.E[i]);
  }
  for(k in m)if(!(k in em))return 'Зайвий доданок '+lbl(m[k])+' (такі члени взаємно знищуються)';
  return true;
}
function check(){
  var t=curTask();if(!t||t.step>=3)return;
  var kind=S.screen,bad=false;
  if(t.step===1){
    t.pairs.forEach(function(p){
      if(p.ok)return;
      if(!p.v){p.bad=true;p.msg='Заповни цей добуток';return;}
      var r=checkTerm(p);
      if(r===true){p.ok=true;p.bad=false;p.msg='';}else{p.bad=true;p.msg=r;bad=true;}
    });
    if(bad)t.mist++;
    if(t.pairs.every(function(p){return p.ok;}))t.step=kind==='mono'?3:2;
  }else if(t.step===2){
    var r=checkFinal(t);
    if(r===true){t.fin.ok=true;t.fin.bad=false;t.fin.msg='';t.step=3;}
    else{t.fin.bad=true;t.fin.msg=r;t.mist++;}
  }
  var keepScroll=window.pageYOffset;
  render(true);
  window.scrollTo(0,keepScroll);
  var o=firstOpen(t);if(o)setActive(o,t.step===curStepSeen);
  curStepSeen=t.step;
}
var curStepSeen=1;

/* ===================== стрілки ===================== */
var uid=0;
function exprHTML(F,S,isMono){
  function part(P,g){
    return P.map(function(t,i){
      return (i===0?(t.c<0?'<span class="sg">−</span>':''):'<span class="op">'+(t.c<0?'−':'+')+'</span>')+'<span class="tm" data-g="'+g+'">'+absHTML(t)+'</span>';
    }).join('');
  }
  var pr=function(s){return '<span class="pr">'+s+'</span>';};
  return '<svg></svg><div class="expr">'+(isMono?part(F,'f')+pr('(')+part(S,'s')+pr(')'):pr('(')+part(F,'f')+pr(')(')+part(S,'s')+pr(')'))+'</div>';
}
function drawArcs(wrap,count){
  var svg=wrap.querySelector('svg');if(!svg)return;
  svg.setAttribute('width',0);svg.setAttribute('height',0);
  var base=wrap.getBoundingClientRect(),sl=wrap.scrollLeft;
  var fs=wrap.querySelectorAll('.tm[data-g="f"]'),ss=wrap.querySelectorAll('.tm[data-g="s"]');
  var m=ss.length,n=fs.length*m,id='mk'+(++uid);
  svg.setAttribute('width',wrap.scrollWidth);svg.setAttribute('height',wrap.clientHeight);
  var h='<defs>';
  for(var k=0;k<n;k++)h+='<marker id="'+id+'_'+k+'" viewBox="0 0 8 8" refX="7.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0.5 L8,4 L0,7.5 Z" fill="'+COL[k%COL.length]+'"/></marker>';
  h+='</defs>';
  for(k=0;k<Math.min(count,n);k++){
    var i=Math.floor(k/m),j=k%m,a=fs[i].getBoundingClientRect(),b=ss[j].getBoundingClientRect();
    var x0=a.left+a.width/2-base.left+sl+(j-(m-1)/2)*6,x1=b.left+b.width/2-base.left+sl,above=(i===0),hh=16+15*j,y0,y1,c1,c2;
    if(above){y0=a.top-base.top-2;y1=b.top-base.top-3;c1=y0-hh;c2=y1-hh;}
    else{y0=a.bottom-base.top+2;y1=b.bottom-base.top+3;c1=y0+hh;c2=y1+hh;}
    h+='<path d="M'+x0+','+y0+' C'+x0+','+c1+' '+x1+','+c2+' '+x1+','+y1+'" fill="none" stroke="'+COL[k%COL.length]+'" stroke-width="2.6" stroke-linecap="round" marker-end="url(#'+id+'_'+k+')"/>';
  }
  svg.innerHTML=h;
}
function redrawAll(){
  var w=document.querySelectorAll('.exwrap');
  for(var i=0;i<w.length;i++)if(w[i]._draw)w[i]._draw();
}

/* ===================== пояснення (стрілки по кроках) ===================== */
function groupsOf(raw){
  var m={},g=[];
  raw.forEach(function(t,k){var kk=key(t);(m[kk]=m[kk]||[]).push(k);});
  Object.keys(m).forEach(function(kk){if(m[kk].length>1)g.push({key:kk,idx:m[kk]});});
  return g;
}
function tintOf(groups,k){for(var gi=0;gi<groups.length;gi++)if(groups[gi].idx.indexOf(k)>=0)return TINT[gi%TINT.length];return '';}
function chipsRow(items){
  return items.map(function(it,i){
    return '<span class="tg">'+(i===0?(it.t.c<0?'<span class="op">−</span>':''):'<span class="op">'+(it.t.c<0?'−':'+')+'</span>')+
      '<span class="ch" style="color:'+it.color+';background:'+(it.bg||'transparent')+'">'+absHTML(it.t)+'</span></span>';
  }).join('');
}
function mountExplainer(host,kind){
  var isMono=kind==='mono',F,S,step=0,first=true;
  function gen(){
    if(first){
      if(isMono){F=[mono(3,1)];S=[mono(1,2),mono(-2,1),mono(5)];}
      else{F=[mono(2,1),mono(3)];S=[mono(1,1),mono(-4)];}
    }else{var q=isMono?genMono(pick([1,2])):genPoly(Math.random()<.6?1:2);F=q.F;S=q.S;}
    first=false;step=0;
  }
  function paint(){
    var raw=pmulRaw(F,S),n=raw.length,E=simplify(raw),groups=isMono?[]:groupsOf(raw);
    var total=isMono?n:n+(groups.length?2:0);
    var items=[],k;
    for(k=0;k<Math.min(step,n);k++)items.push({t:raw[k],color:COL[k%COL.length],bg:(!isMono&&step>n)?tintOf(groups,k):''});
    var sum=items.length?chipsRow(items):'<span class="ph">…</span>';
    var fin='';
    if(!isMono&&step>=n+2){
      var fi=E.map(function(t){
        var gi=-1;groups.forEach(function(g,q){if(g.key===key(t))gi=q;});
        return {t:t,color:'#173F5F',bg:gi>=0?TINT[gi%TINT.length]:''};
      });
      fin='<div class="sumrow fin"><span class="op">=</span>'+chipsRow(fi)+'</div>';
    }
    var cap=step===0?'Натискай «Далі»':step<=n?(isMono?'Одночлен множимо на кожен член многочлена':'Кожен член першої дужки множимо на кожен член другої'):step===n+1?'Зводимо подібні члени (вони підсвічені однаково)':'Відповідь';
    host.innerHTML='<div class="exwrap'+(isMono?' mono':'')+'">'+exprHTML(F,S,isMono)+'</div>'+
      '<div class="sumrow"><span class="op">=</span>'+sum+'</div>'+fin+
      '<p class="cap">'+cap+'</p>'+
      '<div class="row"><button class="btn ghost" data-e="prev"'+(step===0?' disabled':'')+'>◂ Назад</button>'+
      '<button class="btn" data-e="next"'+(step>=total?' disabled':'')+'>Далі ▸</button>'+
      '<button class="btn light" data-e="new">↻ Новий приклад</button></div>';
    var w=host.querySelector('.exwrap');
    w._draw=function(){drawArcs(w,Math.min(step,n));};
    w._draw();
  }
  host.onclick=function(e){
    var b=e.target.closest('[data-e]');if(!b||b.disabled)return;
    var a=b.getAttribute('data-e'),raw=pmulRaw(F,S),n=raw.length,groups=isMono?[]:groupsOf(raw),total=isMono?n:n+(groups.length?2:0);
    if(a==='next'&&step<total)step++;
    else if(a==='prev'&&step>0)step--;
    else if(a==='new')gen();
    paint();
  };
  gen();paint();
}

/* ===================== стан ===================== */
var S={screen:'intro',sets:{mono:null,poly:null},quiz:null};
function mkTask(kind,q){
  var pairs=[],k=0;
  q.F.forEach(function(f,i){q.S.forEach(function(s,j){pairs.push({id:'s'+k,k:k,f:f,s:s,exp:tmul(f,s),v:'',ok:false,bad:false,msg:''});k++;});});
  var raw=pmulRaw(q.F,q.S);
  return {kind:kind,F:q.F,S:q.S,raw:raw,E:simplify(raw),pairs:pairs,step:1,fin:{id:'fin',v:'',ok:false,bad:false,msg:''},mist:0,hint:false};
}
function newSet(kind){
  var g=kind==='mono'?genMono:genPoly;
  return {i:0,tasks:[1,1,2,2,3,3].map(function(l){return mkTask(kind,g(l));})};
}

var LET=['А','Б','В','Г','Ґ'];
function viewQuiz(){
  var Q=S.quiz||(S.quiz=buildQuiz());
  if(Q.done)return viewFinal();
  var q=Q.qs[Q.i],ans=q.pick>=0,h='<div class="card">';
  h+='<div class="hd"><b>Запитання '+(Q.i+1)+' з '+Q.qs.length+'</b></div>';
  h+='<div class="q">Виконайте множення: <span>('+polyHTML(q.F)+')('+polyHTML(q.S)+') =</span></div>';
  h+=q.opts.map(function(o,i){
    var cls=ans?(o.ok?' ok':(i===q.pick?' bad':'')):'';
    return '<button class="opt'+cls+'" data-o="'+i+'"'+(ans?' disabled':'')+'><b>'+LET[i]+')</b><span>'+o.h+'</span></button>';
  }).join('');
  if(ans){
    var o=q.opts[q.pick],good=o.ok;
    var sol='('+polyHTML(q.F)+')('+polyHTML(q.S)+') = '+(q.raw.length>q.E.length?polyHTML(q.raw)+' = ':'')+polyHTML(q.E);
    var why=good?(q.none?'Жоден із варіантів А–Г не підходить, тому «інша відповідь».':''):(o.kind==='other'?'Правильна відповідь є серед варіантів А–Г: перевір ще раз.':(WHY[o.kind]||''));
    h+='<div class="'+(good?'ok-box':'bad-box')+'"><b>'+(good?'Правильно!':'Не зовсім.')+'</b> '+why+'<div style="margin-top:6px;font-size:18px">'+sol+'</div></div>';
    h+='<div class="row"><button class="btn big" data-a="nextQ">'+(Q.i===Q.qs.length-1?'Завершити ▸':'Далі ▸')+'</button></div>';
  }
  return h+'</div>';
}
function viewFinal(){
  var Q=S.quiz,sc=Q.qs.filter(function(q){return q.pick>=0&&q.opts[q.pick].ok;}).length;
  function res(kind){var s=S.sets[kind];if(!s)return '—';var g=s.tasks.filter(function(t){return t.step>=3&&t.mist===0;}).length;return g+' з '+s.tasks.length;}
  return '<div class="card"><div class="lead">Підсумок</div>'+
    '<div class="score">Одночлен × многочлен без помилок: <b>'+res('mono')+'</b></div>'+
    '<div class="score">Многочлен × многочлен без помилок: <b>'+res('poly')+'</b></div>'+
    '<div class="score">Запитання як у тесті: <b>'+sc+' з '+Q.qs.length+'</b></div>'+
    '<div class="stack" style="margin-top:8px"><button class="btn big" data-a="againquiz">↻ Ще раз «як у тесті»</button>'+
    '<button class="btn big light" data-a="againpoly">Ще потренувати многочлени</button></div></div>';
}
function view(){
  switch(S.screen){
    case 'intro':return viewIntro();
    case 'choose':return viewChoose();
    case 'monoExp':return viewMonoExp();
    case 'mono':return viewPractice('mono');
    case 'poly':return viewPractice('poly');
    case 'quiz':return viewQuiz();
    default:return viewIntro();
  }
}
function render(keep){
  var app=document.getElementById('app');
  document.getElementById('tabs').innerHTML=tabsHTML();
  app.innerHTML=view();
  active=null;
  var t=curTask(),kp=document.getElementById('kp');
  if(t&&t.step<3){
    kp.hidden=false;document.body.classList.add('kp');
  }else{kp.hidden=true;document.body.classList.remove('kp');}
  if(t){
    t.pairs.concat([t.fin]).forEach(function(o){
      var el=app.querySelector('[data-in="'+o.id+'"]');if(el){o.el=el;paintInput(o);}
    });
  }
  var e1=document.getElementById('ex1');if(e1)mountExplainer(e1,'poly');
  var e2=document.getElementById('ex2');if(e2)mountExplainer(e2,'mono');
  var pw=document.getElementById('pw');
  if(pw&&t){var isMono=t.kind==='mono';pw._draw=function(){drawArcs(pw,t.pairs.length);};pw._draw();}
  if(!keep)window.scrollTo(0,0);
}
function go(screen){
  S.screen=screen;
  if(screen==='mono'&&!S.sets.mono)S.sets.mono=newSet('mono');
  if(screen==='poly'&&!S.sets.poly)S.sets.poly=newSet('poly');
  render();
  var t=curTask();
  if(t&&t.step<3){curStepSeen=t.step;var o=firstOpen(t);if(o)setActive(o,true);}
}

/* ===================== події ===================== */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a],[data-o],[data-in],#kp [data-k]');if(!el)return;
  if(el.hasAttribute('data-k')){press(el.getAttribute('data-k'));return;}
  if(el.hasAttribute('data-in')){
    var t=curTask();if(!t)return;
    var id=el.getAttribute('data-in'),all=t.pairs.concat([t.fin]);
    for(var i=0;i<all.length;i++)if(all[i].id===id&&!all[i].ok){setActive(all[i],true);}
    return;
  }
  if(el.hasAttribute('data-o')){
    var Q=S.quiz,q=Q&&Q.qs[Q.i];if(!q||q.pick>=0)return;
    q.pick=+el.getAttribute('data-o');
    var keep=window.pageYOffset;render(true);window.scrollTo(0,keep);
    var box=document.querySelector('.ok-box,.bad-box');if(box&&box.scrollIntoView)box.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
  var a=el.getAttribute('data-a');
  if(a==='tab0')go('intro');
  else if(a==='tab1')go('monoExp');
  else if(a==='tab2')go('poly');
  else if(a==='tab3'){if(!S.quiz)S.quiz=buildQuiz();go('quiz');}
  else if(a==='toChoose')go('choose');
  else if(a==='startMonoExp')go('monoExp');
  else if(a==='startMono')go('mono');
  else if(a==='startPoly')go('poly');
  else if(a==='startQuiz'){if(!S.quiz)S.quiz=buildQuiz();go('quiz');}
  else if(a==='hint'){var t2=curTask();if(t2){t2.hint=true;var k2=window.pageYOffset;render(true);window.scrollTo(0,k2);var o2=firstOpen(t2);if(o2)setActive(o2,true);}}
  else if(a==='nextTask'){S.sets[S.screen].i++;go(S.screen);}
  else if(a==='nextQ'){var Q2=S.quiz;if(Q2.i<Q2.qs.length-1)Q2.i++;else Q2.done=true;render();}
  else if(a==='againmono'){S.sets.mono=null;go('mono');}
  else if(a==='againpoly'){S.sets.poly=null;go('poly');}
  else if(a==='againquiz'){S.quiz=buildQuiz();go('quiz');}
});
document.addEventListener('keydown',function(e){
  if(!active||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key,map={'-':'−','–':'−','+':'+','x':'x','X':'x','y':'y','Y':'y','х':'x','Х':'x','у':'y','У':'y'};
  if(k==='Backspace'){press('⌫');e.preventDefault();return;}
  if(k==='Enter'){press('✓');e.preventDefault();return;}
  if(k==='Tab'){press('➜');e.preventDefault();return;}
  if(k==='^'){supNext=true;e.preventDefault();return;}
  if(/^[0-9]$/.test(k)){
    if(supNext&&'234'.indexOf(k)>=0){press({'2':'²','3':'³','4':'⁴'}[k]);}else press(k);
    supNext=false;e.preventDefault();return;
  }
  if(map[k]){press(map[k]);supNext=false;e.preventDefault();}
});
var supNext=false;
window.addEventListener('resize',redrawAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawAll);

window.__MP={T:T,mono:mono,key:key,tmul:tmul,pmulRaw:pmulRaw,simplify:simplify,polyTxt:polyTxt,termTxt:termTxt,parsePoly:parsePoly,canon:canon,
  genMono:genMono,genPoly:genPoly,buildOptions:buildOptions,buildQuiz:buildQuiz,checkTerm:checkTerm,checkFinal:checkFinal,mkTask:mkTask,groupsOf:groupsOf,state:S};

function init(){render();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
