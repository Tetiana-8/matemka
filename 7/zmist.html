<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 7 клас — зміст</title>
<style>
  :root{
    --main:#2A6592;      /* шляхетний синій — колір 7 класу */
    --soft:#DCE9F2;
    --softer:#F5F9FC;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#B5CFE0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 7 клас</h1>
  <p class="sub">Теми за підручником. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКА ===== */
const ZMIST = [
 {rozdil:"Алгебра", par:[
  {t:"§ 1. Алгебраїчні вирази. Рівняння з однією змінною", temy:[
   ["a1","Вступ до алгебри"],
   ["a2","Лінійне рівняння з однією змінною"],
   ["a3","Розв’язування текстових задач"],
   ["check","Завдання № 1 «Перевірте себе»"],
   ["a4","Тотожно рівні вирази. Тотожності"],
   ["a5","Степінь з натуральним показником"],
   ["a6","Властивості степеня з натуральним показником"],
   ["a7","Одночлени"],
   ["a8","Многочлени"],
   ["a9","Додавання і віднімання многочленів"],
   ["check","Завдання № 2 «Перевірте себе»"],
   ["a10","Множення одночлена на многочлен"],
   ["a11","Множення многочлена на многочлен"],
   ["a12","Розкладання многочлена на множники. Винесення спільного множника за дужки"],
   ["a13","Розкладання многочлена на множники. Метод групування"],
   ["check","Завдання № 3 «Перевірте себе»"],
   ["a14","Добуток різниці та суми двох виразів"],
   ["a15","Різниця квадратів двох виразів"],
   ["a16","Квадрат суми та квадрат різниці двох виразів"],
   ["a17","Перетворення многочлена у квадрат суми або різниці двох виразів"],
   ["check","Завдання № 4 «Перевірте себе»"],
   ["a18","Сума й різниця кубів двох виразів"],
   ["a19","Застосування різних способів розкладання многочлена на множники"],
   ["check","Завдання № 5 «Перевірте себе»"]]},
  {t:"§ 2. Функції", temy:[
   ["a20","Зв’язки між величинами. Функція"],
   ["a21","Способи задання функції"],
   ["a22","Графік функції"],
   ["a23","Лінійна функція, її графік і властивості"],
   ["check","Завдання № 6 «Перевірте себе»"]]},
  {t:"§ 3. Системи лінійних рівнянь із двома змінними", temy:[
   ["a24","Рівняння з двома змінними"],
   ["a25","Лінійне рівняння з двома змінними та його графік"],
   ["a26","Системи рівнянь із двома змінними. Графічний метод розв’язування системи двох лінійних рівнянь із двома змінними"],
   ["a27","Розв’язування систем лінійних рівнянь методом підстановки"],
   ["a28","Розв’язування систем лінійних рівнянь методом додавання"],
   ["a29","Розв’язування задач за допомогою систем лінійних рівнянь"],
   ["check","Завдання № 7 «Перевірте себе»"]]},
  {t:"Підготовка до контрольних робіт (алгебра)", temy:[["kr_a","Підготовка до контрольної роботи № 1"]]},
  {t:"Вправи для повторення курсу алгебри 7 класу", temy:[["povt_a","Повторення за курс алгебри 7 класу"]]}
 ]},
 {rozdil:"Геометрія", par:[
  {t:"§ 1. Найпростіші геометричні фігури та їхні властивості", temy:[
   ["g1","Точки та прямі"],
   ["g2","Відрізок і його довжина"],
   ["g3","Промінь. Кут. Вимірювання кутів"],
   ["g4","Суміжні та вертикальні кути"],
   ["g5","Перпендикулярні прямі"],
   ["g6","Аксіоми"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Трикутники", temy:[
   ["g7","Рівні трикутники. Висота, медіана, бісектриса трикутника"],
   ["g8","Перша та друга ознаки рівності трикутників"],
   ["g9","Рівнобедрений трикутник та його властивості"],
   ["g10","Ознаки рівнобедреного трикутника"],
   ["g11","Третя ознака рівності трикутників"],
   ["g12","Теореми"],
   ["check","Завдання № 2 «Перевірте себе»"]]},
  {t:"§ 3. Паралельні прямі. Сума кутів трикутника", temy:[
   ["g13","Паралельні прямі"],
   ["g14","Ознаки паралельності двох прямих"],
   ["g15","Властивості паралельних прямих"],
   ["g16","Сума кутів трикутника"],
   ["g17","Нерівності, пов’язані з елементами трикутника"],
   ["g18","Прямокутний трикутник"],
   ["g19","Властивості прямокутного трикутника"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 4. Коло та круг", temy:[
   ["g20","Геометричне місце точок. Коло та круг"],
   ["g21","Деякі властивості кола. Дотична до кола"],
   ["g22","Описане та вписане кола трикутника"],
   ["g23","Задачі на побудову"],
   ["g24","Метод геометричних місць точок у задачах на побудову"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"Підготовка до контрольних робіт (геометрія)", temy:[["kr_g","Підготовка до контрольної роботи № 1"]]},
  {t:"Вправи для повторення курсу геометрії 7 класу", temy:[["povt_g","Повторення за курс геометрії 7 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми (або "povt" для повторення).
   test:true — кнопка буде світлою (для тестів).
   Приклад:  7: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
  a5: [{n:"Тренажер: остання цифра степеня", url:"https://sites.google.com/view/ostanniatsyfrastepenia"}],
  a9: [{n:"Многочлени: додавання і віднімання", url:"https://sites.google.com/view/mnogochleny-7"}],
  a10: [{n:"Урок", url:"https://sites.google.com/view/mnogodnochteor"},
        {n:"Тест", url:"https://sites.google.com/view/mnogennyaodnochlena", test:true}],
  g7: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/7/urok-rivni-trykutnyky.html"},
       {n:"Тест", url:"https://tetiana-8.github.io/matemka/7/test-rivni-trykutnyky.html", test:true}],
  kr_a: [{n:"Тренування до КР №1 (алгебра)", url:"https://sites.google.com/view/pidgotovkaalgebra1"}],
  kr_g: [{n:"Підготовка до КР №1 (геометрія)", url:"https://sites.google.com/view/pidgotovkageometriya7kl1"}],
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  if(r.rozdil){ const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h); }
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const isT=k=>typeof k==="number"||/^[ag]\d+$/.test(k);
    const nTem=p.temy.filter(x=>isT(x[0])).length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"){ html+=`<li class="check">✔ ${name}</li>`; return; }
      if(k==="chvert1"){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : (/^[ag]\d+$/.test(k) ? k.slice(1) : "↺");
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
</body>
</html>
