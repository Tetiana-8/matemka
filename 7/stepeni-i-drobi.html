<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Степені й дроби</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a wide column that scales with the screen (laptop, tablet, phone). Tabs on top, the expression centred in the free space, then choices or answer cells, then status + skip. */
:root{
  --bg:#E4F3DC;
  --surface:#F4FAF0;
  --fg:#173222;
  --muted:#4F6B56;
  --line:#A9C9A2;
  --accent:#2D6A3E;
  --accent-ink:#F4FAF0;
  --ok:#2B8A3E;
  --ok-bg:#CFEBC6;
  --bad:#B8432F;
  --bad-bg:#F6DDD5;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13231A;--surface:#1B3023;--fg:#E2F1DC;--muted:#9DB9A2;--line:#3B5A44;
    --accent:#7CC48B;--accent-ink:#0F2216;--ok:#7CD98F;--ok-bg:#21432B;--bad:#F0907C;--bad-bg:#40231D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13231A;--surface:#1B3023;--fg:#E2F1DC;--muted:#9DB9A2;--line:#3B5A44;
  --accent:#7CC48B;--accent-ink:#0F2216;--ok:#7CD98F;--ok-bg:#21432B;--bad:#F0907C;--bad-bg:#40231D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{
  font-size:clamp(16px,min(calc(11px + 1vw),3.1vh),28px);
  max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:1.2em;
  min-height:calc(100vh - 60px);
  min-height:calc(100dvh - 60px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}

.tabs{display:flex;flex-wrap:wrap;gap:.4em}
.tab{font-size:.8em;font-weight:700;padding:.5em .95em;border-radius:.6em;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}

/* math */
.expr{font-size:min(3.4em,7.2vw);font-weight:700;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.2em .3em;padding:.3em 0;font-variant-numeric:tabular-nums}
.val{display:inline-flex;align-items:center;gap:.25em}
.n{line-height:1.1}
.op{padding:0 .1em;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.82em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.mx{display:inline-flex;align-items:center;gap:.12em}
.grp{display:inline-flex;align-items:center;gap:.15em}
.pa{display:inline-block;font-weight:300;line-height:1}
.pa.t{font-size:1.15em;transform:scaleY(1.7)}
.pw{display:inline-flex;align-items:flex-start}
.pw>.ex{font-size:.55em;margin-left:.08em;margin-top:-.1em;line-height:1}

/* choices */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
@media (min-width:900px){.choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ch{min-height:2.6em;padding:.3em;border:2px solid var(--line);border-radius:.5em;background:var(--surface);font-size:1.7em;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .12s,background-color .12s}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:disabled{cursor:default}
.ch:disabled:not(.ok):not(.bad){opacity:.6}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)}
.ch.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.8}

/* write-in cells */
.write{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1em 1.4em}
.cells{display:flex;align-items:center;gap:.6em;font-size:1.9em}
.cell{width:2.4em;height:1.8em;padding:0;text-align:center;border:2px solid var(--line);border-radius:.3em;background:var(--surface);font-size:1em;font-weight:700;font-variant-numeric:tabular-nums}
.cell.bad{border-color:var(--bad);background:var(--bad-bg)}
.cell.ok{border-color:var(--ok);background:var(--ok-bg)}
.afr{display:inline-flex;flex-direction:column;align-items:center;gap:.2em}
.afr .bar{width:2.4em;height:max(3px,.07em);border-radius:2px;background:var(--fg)}
.go{height:2.9em;padding:0 1.4em;border:2px solid var(--accent);border-radius:.6em;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1em;cursor:pointer}

.foot{display:flex;align-items:center;justify-content:space-between;gap:.8em;min-height:2.8em}
.status{display:flex;align-items:center;gap:.45em;font-weight:800;font-size:1.2em;min-width:0}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.status.hint{color:var(--muted);font-weight:700;font-size:1em}
.status svg{flex:none;width:1.1em;height:1.1em}
.next{height:2.4em;padding:0 1.2em;border:2px solid var(--line);border-radius:.6em;background:transparent;color:var(--muted);font-weight:800;font-size:.9em;cursor:pointer}
.next:hover{border-color:var(--accent);color:var(--accent)}

@media (prefers-reduced-motion:reduce){.ch{transition:none}}
</style>

<main class="app">
  <nav class="tabs" id="tabs" aria-label="Розділи"></nav>
  <div class="stage"><div class="expr" id="expr"></div></div>
  <div class="choices" id="choices" hidden></div>
  <form class="write" id="form" autocomplete="off" hidden>
    <div class="cells" id="cells"></div>
    <button class="go" type="submit">Перевірити</button>
  </form>
  <div class="foot">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button class="next" id="next" type="button">Далі</button>
  </div>
</main>

<script>
//<logic>
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const cop=(a,b)=>gcd(a,b)===1;
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const add=(x,y)=>fr(x.n*y.d+y.n*x.d,x.d*y.d);
const sub=(x,y)=>fr(x.n*y.d-y.n*x.d,x.d*y.d);
const mul=(x,y)=>fr(x.n*y.n,x.d*y.d);
const div=(x,y)=>fr(x.n*y.d,x.d*y.n);
const pow=(x,e)=>fr(x.n**e,x.d**e);
const neg=x=>fr(-x.n,x.d);
const absf=x=>fr(Math.abs(x.n),x.d);
const eq=(x,y)=>x.n===y.n&&x.d===y.d;
const mv=(w,n,d)=>fr(w*d+n,d);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const key=f=>f.n+'/'+f.d;

// rendering
const N=n=>`<span class="n">${n}</span>`;
const FR=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`<span class="mx">${N(w)}${FR(n,d)}</span>`;
const OP=s=>`<span class="op">${s}</span>`;
const PAR=(h,tall=true)=>`<span class="grp"><span class="pa${tall?' t':''}">(</span>${h}<span class="pa${tall?' t':''}">)</span></span>`;
const POW=(b,e)=>`<span class="pw">${b}<span class="ex">${e}</span></span>`;
const parts=f=>{const n=Math.abs(f.n),d=f.d;return{neg:f.n<0,w:Math.floor(n/d),r:n%d,n,d}};
// fmt 'frac' shows an improper fraction as is; anything else shows a mixed number
function showVal(f,fmt){
  const p=parts(f);let h;
  if(p.d===1)h=N(p.n);
  else if(fmt==='frac'||p.n<p.d)h=FR(p.n,p.d);
  else h=MX(p.w,p.r,p.d);
  return `<span class="val">${p.neg?OP('−'):''}${h}</span>`;
}
function txt(f,fmt){
  const p=parts(f);let s;
  if(p.d===1)s=''+p.n;else if(fmt==='frac'||p.n<p.d)s=p.n+'/'+p.d;else s=p.w+' '+p.r+'/'+p.d;
  return (p.neg?'−':'')+s;
}
function afmtOf(t){
  if(t.fmt==='frac')return t.value.d===1?'int':'frac';
  const v=t.value;
  if(v.d===1)return 'int';
  return v.n<v.d?'frac':'mixed';
}

// generators: {html, value, wrong[], fmt?}
function g1(){
  let b,e;
  do{e=pick([2,2,2,3,3,4]);b=e===2?rnd(2,15):e===3?rnd(2,10):rnd(2,6)}while(b**e>1500);
  const p=b**e;
  return{html:POW(N(b),e),value:fr(p),
    wrong:[fr(b*e),fr(b**(e-1)),fr(b**(e+1)),fr(p+b),fr(p-b),fr(p+e),fr(b+e)]};
}
function g2(){
  const e=pick([2,2,2,3]);let a,b;
  do{b=e===3?rnd(2,4):rnd(2,7);a=Math.random()<.25?rnd(2,b+3):rnd(1,b-1)}while(!cop(a,b)||a===b);
  return{fmt:'frac',html:POW(PAR(FR(a,b)),e),value:fr(a**e,b**e),
    wrong:[fr(a**e,b),fr(a,b**e),fr(a,b),fr(a*e,b),fr(a**e,b*e),fr(a*e,b*e+1),fr(a**e+1,b**e)]};
}
function g3(){
  const e=Math.random()<.85?2:3;let w,n,d;
  do{d=e===3?2:rnd(2,5);n=rnd(1,d-1);w=e===3?1:rnd(1,3)}while(!cop(n,d));
  const m=mv(w,n,d),value=pow(m,e);
  return{fmt:'frac',html:POW(PAR(MX(w,n,d)),e),value,
    wrong:[add(fr(w**e),pow(fr(n,d),e)),mul(m,fr(e)),add(fr(w**e),fr(n*e,d)),add(fr(w**e),fr(n,d)),add(value,fr(1)),sub(value,fr(1)),fr(value.n+1,value.d),fr(value.n-1,value.d)]};
}
function g4(){
  let a,b,c,d;
  do{b=rnd(2,9);d=rnd(2,9);a=rnd(1,b-1);c=rnd(1,d-1)}while(!cop(a,b)||!cop(c,d)||(b===d&&Math.random()<.8)||lcm(b,d)>36);
  return{html:FR(a,b)+OP('+')+FR(c,d),value:add(fr(a,b),fr(c,d)),
    wrong:[fr(a+c,b+d),fr(a+c,b*d),fr(a+c,b),fr(a+c,d),fr(a*c,b*d)]};
}
function g5(){
  let w1,n1,d1,w2,n2,d2;
  do{d1=rnd(2,6);d2=rnd(2,6);n1=rnd(1,d1-1);n2=rnd(1,d2-1);w1=rnd(1,5);w2=rnd(1,5)}
  while(!cop(n1,d1)||!cop(n2,d2)||(d1===d2&&Math.random()<.5)||lcm(d1,d2)>12);
  const value=add(mv(w1,n1,d1),mv(w2,n2,d2));
  return{html:MX(w1,n1,d1)+OP('+')+MX(w2,n2,d2),value,
    wrong:[add(fr(w1+w2),fr(n1+n2,d1+d2)),add(fr(w1+w2),fr(n1+n2,d1*d2)),add(value,fr(1)),sub(value,fr(1)),add(fr(w1+w2),fr(n1+n2,Math.max(d1,d2)))]};
}
function g6(){
  const v=rnd(1,4);let A,B,ha,hb,wrong=[];
  if(v===1){
    let a,b,c,d;
    do{b=rnd(2,9);d=rnd(2,9);a=rnd(1,b-1);c=rnd(1,d-1)}
    while(!cop(a,b)||!cop(c,d)||(b===d&&Math.random()<.7)||lcm(b,d)>36||a*d<=c*b);
    A=fr(a,b);B=fr(c,d);ha=FR(a,b);hb=FR(c,d);
    wrong=[fr(a-c,Math.abs(b-d)||b),fr(a-c,b*d),fr(a-c,b),fr(a-c,d)];
  }else if(v===2){
    let w1,n1,d1,w2,n2,d2;
    do{d1=rnd(2,6);d2=rnd(2,6);n1=rnd(1,d1-1);n2=rnd(1,d2-1);w1=rnd(2,6);w2=rnd(1,5);
       A=mv(w1,n1,d1);B=mv(w2,n2,d2)}
    while(!cop(n1,d1)||!cop(n2,d2)||lcm(d1,d2)>12||sub(A,B).n<=0||(d1===d2&&Math.random()<.5));
    ha=MX(w1,n1,d1);hb=MX(w2,n2,d2);
    wrong=[add(fr(w1-w2),absf(sub(fr(n1,d1),fr(n2,d2))))];
  }else if(v===3){
    const W=rnd(2,6);let n,d;
    do{d=rnd(2,9);n=rnd(1,d-1)}while(!cop(n,d));
    A=fr(W);B=fr(n,d);ha=N(W);hb=FR(n,d);
    wrong=[add(fr(W-1),fr(n,d)),fr(W*d-n,d+1),add(fr(W-1),fr(d-n,d+1))];
  }else{
    let w,n,d,c,e;
    do{d=rnd(2,6);n=rnd(1,d-1);w=rnd(2,5);e=rnd(3,9);c=rnd(1,e-1);A=mv(w,n,d);B=fr(c,e)}
    while(!cop(n,d)||!cop(c,e)||lcm(d,e)>18||sub(A,B).n<=0||(d===e&&Math.random()<.6));
    ha=MX(w,n,d);hb=FR(c,e);
    wrong=[add(fr(w),absf(sub(fr(n,d),fr(c,e))))];
  }
  const value=sub(A,B);
  wrong.push(add(value,fr(1)),sub(value,fr(1)));
  return{html:ha+OP('−')+hb,value,wrong};
}
function g7(){ // multiplication
  const v=rnd(1,5);let A,B,ha,hb,wrong=[];
  if(v===1){
    let a,b,c,d;
    do{b=rnd(2,9);d=rnd(2,9);a=rnd(1,b-1);c=rnd(1,d-1)}while(!cop(a,b)||!cop(c,d));
    A=fr(a,b);B=fr(c,d);ha=FR(a,b);hb=FR(c,d);
    wrong=[fr(a+c,b+d),fr(a*c,b),fr(a*d,b*c),fr(a*c,b+d),add(A,B)];
  }else if(v===2||v===3){
    let a,b,k;
    do{b=rnd(2,9);a=rnd(1,b-1);k=rnd(2,9)}while(!cop(a,b));
    A=fr(a,b);B=fr(k);
    if(v===2){ha=FR(a,b);hb=N(k)}else{ha=N(k);hb=FR(a,b)}
    wrong=[fr(a,b*k),fr(a+k,b),fr(a*k,b+k),fr(a*k,b*k)];
  }else if(v===4){
    let w,n,d,c,e;
    do{d=rnd(2,5);n=rnd(1,d-1);w=rnd(1,4);e=rnd(2,6);c=rnd(1,e-1)}while(!cop(n,d)||!cop(c,e));
    A=mv(w,n,d);B=fr(c,e);ha=MX(w,n,d);hb=FR(c,e);
    wrong=[add(fr(w),mul(fr(n,d),B)),mul(fr(n,d),B),add(fr(w*c,e),fr(n,d))];
  }else{
    let w1,n1,d1,w2,n2,d2;
    do{d1=rnd(2,4);d2=rnd(2,4);n1=rnd(1,d1-1);n2=rnd(1,d2-1);w1=rnd(1,3);w2=rnd(1,3)}while(!cop(n1,d1)||!cop(n2,d2));
    A=mv(w1,n1,d1);B=mv(w2,n2,d2);ha=MX(w1,n1,d1);hb=MX(w2,n2,d2);
    wrong=[add(fr(w1*w2),mul(fr(n1,d1),fr(n2,d2))),add(A,B),mul(fr(w1*w2),mul(fr(n1,d1),fr(n2,d2)))];
  }
  const value=mul(A,B);
  wrong.push(add(value,fr(1)),sub(value,fr(1)));
  return{html:ha+OP('×')+hb,value,wrong};
}
function g8(){ // division
  const v=rnd(1,5);let A,B,ha,hb,wrong=[];
  if(v===1){
    let a,b,c,d;
    do{b=rnd(2,9);d=rnd(2,9);a=rnd(1,b-1);c=rnd(1,d-1)}while(!cop(a,b)||!cop(c,d));
    A=fr(a,b);B=fr(c,d);ha=FR(a,b);hb=FR(c,d);
    wrong=[mul(A,B),div(B,A),fr(a*d,b*d+c),fr(a,c)];
  }else if(v===2){
    let a,b,k;
    do{b=rnd(2,9);a=rnd(1,b-1);k=rnd(2,9)}while(!cop(a,b));
    A=fr(a,b);B=fr(k);ha=FR(a,b);hb=N(k);
    wrong=[mul(A,B),div(B,A),fr(a*k,b*k)];
  }else if(v===3){
    let a,b,k;
    do{b=rnd(2,9);a=rnd(1,b-1);k=rnd(2,9)}while(!cop(a,b));
    A=fr(k);B=fr(a,b);ha=N(k);hb=FR(a,b);
    wrong=[mul(A,B),div(B,A),fr(k,a*b)];
  }else if(v===4){
    let w,n,d,c,e;
    do{d=rnd(2,5);n=rnd(1,d-1);w=rnd(1,4);e=rnd(2,6);c=rnd(1,e-1)}while(!cop(n,d)||!cop(c,e));
    A=mv(w,n,d);B=fr(c,e);ha=MX(w,n,d);hb=FR(c,e);
    wrong=[mul(A,B),div(B,A),add(fr(w),div(fr(n,d),B))];
  }else{
    let w1,n1,d1,w2,n2,d2;
    do{d1=rnd(2,4);d2=rnd(2,4);n1=rnd(1,d1-1);n2=rnd(1,d2-1);w1=rnd(1,3);w2=rnd(1,3)}while(!cop(n1,d1)||!cop(n2,d2));
    A=mv(w1,n1,d1);B=mv(w2,n2,d2);ha=MX(w1,n1,d1);hb=MX(w2,n2,d2);
    wrong=[mul(A,B),div(B,A),add(fr(w1,w2),div(fr(n1,d1),fr(n2,d2)))];
  }
  const value=div(A,B);
  wrong.push(add(value,fr(1)),sub(value,fr(1)));
  return{html:ha+OP(':')+hb,value,wrong};
}

// stage "Приклади"
function Ta(a,b,c,d,e,k){
  const f1=fr(a,b),f2=fr(c,d),s=add(f1,f2),p=e*e;
  return{html:PAR(FR(a,b)+OP('+')+FR(c,d))+OP('×')+POW(N(e),2)+OP('+')+N(k),
    value:add(mul(s,fr(p)),fr(k)),
    wrong:[add(mul(s,fr(e)),fr(k)),add(pow(mul(s,fr(e)),2),fr(k)),mul(s,fr(p+k)),mul(s,fr(p)),add(add(mul(f1,fr(p)),f2),fr(k))]};
}
function Tb(n,a,b,k){
  const f=fr(a,b),inner=sub(fr(k),f),p=n*n;
  return{html:POW(N(n),2)+OP('×')+PAR(OP('−')+FR(a,b)+OP('+')+N(k)),
    value:mul(fr(p),inner),
    wrong:[mul(fr(2*n),inner),add(mul(fr(p),neg(f)),fr(k)),mul(fr(p),add(f,fr(k))),mul(fr(n),inner),add(mul(fr(p),inner),fr(1))]};
}
function Tc(m,x,y,op){
  const s=op==='+'?1:-1,P=m**x,Q=m**y,F=fr(1,m);
  return{html:FR(1,m)+OP('×')+PAR(POW(N(m),x)+OP(op==='+'?'+':'−')+POW(N(m),y)),
    value:mul(F,fr(P+s*Q)),
    wrong:[add(mul(F,fr(P)),fr(s*Q)),mul(F,fr(m*x+s*m*y)),fr(P+s*Q),mul(F,fr(P+s*(m*y))),mul(F,fr(m**(x-1)+s*m**y))]};
}
function Td(w1,n1,d1,w2,n2,d2){
  const m1=mv(w1,n1,d1),m2=mv(w2,n2,d2);
  return{html:MX(w1,n1,d1)+OP('+')+POW(PAR(MX(w2,n2,d2)),2),
    value:add(m1,pow(m2,2)),
    wrong:[pow(add(m1,m2),2),add(m1,mul(m2,fr(2))),add(m1,add(fr(w2*w2),fr(n2*n2,d2*d2))),add(fr(w1+w2*w2),fr(n1*n1,d1)),mul(add(m1,m2),m2)]};
}
function ra(){
  let a,b,c,d;
  do{b=rnd(2,6);d=rnd(2,6);a=rnd(1,b-1);c=rnd(1,d+3)}while(b===d||!cop(a,b)||!cop(c,d)||lcm(b,d)>12);
  return Ta(a,b,c,d,Math.random()<.8?2:3,rnd(1,6));
}
function rb(){
  const n=pick([2,3,4,5,6]);
  const bs=[2,3,4,5,6].filter(b=>(n*n)%b===0);
  const b=pick(bs);let a;
  do{a=rnd(1,2*b)}while(!cop(a,b));
  return Tb(n,a,b,Math.ceil(a/b)+rnd(0,3));
}
function rc(){
  const m=rnd(2,6),x=pick([3,3,4]),y=x===3?2:pick([2,3]);
  return Tc(m,x,y,Math.random()<.7?'−':'+');
}
function rd(){
  let d1,d2,n1,n2;
  do{d1=rnd(2,4);d2=rnd(2,4);n1=rnd(1,d1-1);n2=rnd(1,d2-1)}while(!cop(n1,d1)||!cop(n2,d2));
  return Td(rnd(1,3),n1,d1,rnd(1,2),n2,d2);
}
const EX_FIXED=[()=>Ta(1,3,7,4,2,3),()=>Tb(4,3,2,4),()=>Tc(5,3,2,'−'),()=>Td(1,1,3,2,1,3)];
const EX_RANDOM=[ra,rb,rc,rd];

// choices and write-in checking
function makeOptions(t){
  const c=t.value,seen=new Set([key(c)]),out=[];
  const ok=f=>f&&Number.isFinite(f.n)&&Number.isFinite(f.d)&&f.d>0&&Math.abs(f.n)<1e7&&!(c.n>=0&&f.n<0);
  const tryAdd=f=>{if(out.length>=3||!ok(f))return;const k=key(f);if(seen.has(k))return;seen.add(k);out.push(f)};
  shuffle([...(t.wrong||[])]).forEach(tryAdd);
  const q=c.d>1?c.d:2;
  [add(c,fr(1)),sub(c,fr(1)),add(c,fr(1,q)),sub(c,fr(1,q)),add(c,fr(2)),sub(c,fr(2)),mul(c,fr(2)),add(c,fr(1,2)),sub(c,fr(1,2)),fr(c.n+1,c.d),fr(c.n-1,c.d),add(c,fr(3))].forEach(tryAdd);
  return shuffle([c,...out]);
}
// vals: strings from the cells. Returns {r:'ok'|'bad'|'hint'|'empty', k?}
function checkWrite(t,vals){
  const f=t.afmt,need=f==='int'?['v']:f==='frac'?['n','d']:['w','n','d'];
  for(const k of need)if(vals[k]==null||vals[k]==='')return{r:'empty',k};
  const x=k=>parseInt(vals[k],10);
  if(f==='int')return{r:eq(fr(x('v')),t.value)?'ok':'bad'};
  if(x('d')===0)return{r:'bad'};
  let val;
  if(f==='frac')val=fr(x('n'),x('d'));
  else{if(x('n')>=x('d'))return{r:'bad'};val=fr(x('w')*x('d')+x('n'),x('d'))}
  if(!eq(val,t.value))return{r:'bad'};
  return{r:gcd(x('n'),x('d'))===1?'ok':'hint'};
}
//</logic>

const STAGES=[
  {name:'Степені',gen:g1},
  {name:'Дріб у степені',gen:g2},
  {name:'Мішане в степені',gen:g3},
  {name:'Додавання дробів',gen:g4},
  {name:'Додавання мішаних',gen:g5},
  {name:'Віднімання',gen:g6},
  {name:'Множення',gen:g7},
  {name:'Ділення',gen:g8},
  {name:'Приклади',ex:true}
];
const $=id=>document.getElementById(id);
const tabsEl=$('tabs'),exprEl=$('expr'),choicesEl=$('choices'),formEl=$('form'),cellsEl=$('cells'),statusEl=$('status'),nextEl=$('next');
const ICON_OK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BAD='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ADVANCE_MS=1600;

let st=0,idx=0,task=null,opts=[],done=false,last=null,mode='choice',lastMode=null,streak=0,timer=null;
try{const s=parseInt(localStorage.getItem('trenazher-stage'),10);if(s>=0&&s<STAGES.length)st=s}catch(e){}

function renderTabs(){
  tabsEl.innerHTML=STAGES.map((s,i)=>`<button type="button" class="tab" data-i="${i}" aria-pressed="${i===st}">${s.name}</button>`).join('');
}
function setStatus(kind,html){
  statusEl.className='status'+(kind?' '+kind:'');
  statusEl.innerHTML=html||'';
}
function pickMode(){
  let m=Math.random()<.5?'choice':'write';
  if(m===lastMode&&streak>=2)m=m==='choice'?'write':'choice';
  streak=m===lastMode?streak+1:1;lastMode=m;
  return m;
}
const cell=(k,label)=>`<input class="cell" data-k="${k}" type="text" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="${label}">`;
const acell=()=>`<span class="afr">${cell('n','чисельник')}<span class="bar"></span>${cell('d','знаменник')}</span>`;
function buildCells(f){
  cellsEl.innerHTML=f==='int'?cell('v','відповідь'):f==='frac'?acell():cell('w','ціла частина')+acell();
}
function newTask(){
  clearTimeout(timer);
  const S=STAGES[st];let t;
  if(S.ex){
    t=idx<4?EX_FIXED[idx]():EX_RANDOM[idx%4]();
    idx++;
  }else{
    for(let i=0;i<8;i++){t=S.gen();if(t.html!==last)break}
  }
  last=t.html;t.afmt=afmtOf(t);task=t;done=false;mode=pickMode();
  exprEl.innerHTML=t.html+OP('=');
  if(mode==='choice'){
    opts=makeOptions(t);
    choicesEl.innerHTML=opts.map((f,i)=>`<button type="button" class="ch" data-i="${i}" aria-label="${txt(f,t.fmt)}">${showVal(f,t.fmt)}</button>`).join('');
    choicesEl.hidden=false;formEl.hidden=true;cellsEl.innerHTML='';
  }else{
    choicesEl.hidden=true;choicesEl.innerHTML='';
    buildCells(t.afmt);formEl.hidden=false;
    const first=cellsEl.querySelector('.cell');if(first)first.focus({preventScroll:true});
  }
  setStatus('','');
}
function success(){
  done=true;
  setStatus('ok',ICON_OK+'Правильно');
  clearTimeout(timer);timer=setTimeout(newTask,ADVANCE_MS);
}
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  st=+b.dataset.i;idx=0;last=null;
  try{localStorage.setItem('trenazher-stage',String(st))}catch(err){}
  renderTabs();newTask();
});
choicesEl.addEventListener('click',e=>{
  const b=e.target.closest('.ch');if(!b||b.disabled||done)return;
  const val=opts[+b.dataset.i];
  if(eq(val,task.value)){
    b.classList.add('ok');
    choicesEl.querySelectorAll('.ch').forEach(x=>x.disabled=true);
    success();
  }else{
    b.classList.add('bad');b.disabled=true;
    setStatus('bad',ICON_BAD+'Неправильно');
  }
});
formEl.addEventListener('submit',e=>{
  e.preventDefault();
  if(done)return;
  const vals={};
  cellsEl.querySelectorAll('.cell').forEach(c=>vals[c.dataset.k]=c.value.trim());
  const res=checkWrite(task,vals);
  if(res.r==='empty'){const c=cellsEl.querySelector(`[data-k="${res.k}"]`);if(c)c.focus();return}
  if(res.r==='ok'){
    cellsEl.querySelectorAll('.cell').forEach(c=>{c.classList.remove('bad');c.classList.add('ok');c.readOnly=true});
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    success();
  }else if(res.r==='hint'){
    setStatus('hint','Скоротіть дріб');
  }else{
    cellsEl.querySelectorAll('.cell').forEach(c=>c.classList.add('bad'));
    setStatus('bad',ICON_BAD+'Неправильно');
  }
});
cellsEl.addEventListener('input',e=>{
  const c=e.target;if(!c.classList.contains('cell'))return;
  c.value=c.value.replace(/\D/g,'');
  if(!done){
    cellsEl.querySelectorAll('.cell').forEach(x=>x.classList.remove('bad'));
    if(statusEl.classList.contains('bad')||statusEl.classList.contains('hint'))setStatus('','');
  }
});
nextEl.addEventListener('click',newTask);

renderTabs();newTask();
</script>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
