<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Множення многочлена на многочлен. ДЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=STIX+Two+Text:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#173F5F;--muted:#5d7b93;
  --acc:#2A6592;--accD:#1F4E73;--acc2:#3887AF;--accL:#DCE9F2;--soft:#EAF2F7;--soft2:#F5F9FC;--line:#A8CADD;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;--badln:#efa3a8;
  --warnbg:#fff6e5;--warntx:#8a5a00;--warnln:#f3d9a4;
  --o1:#b45309;--o2:#7c3aed;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);height:100%}
body{margin:0;height:100dvh;overflow:hidden;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#EAF2F7 0%,#DCE9F2 55%,#c7dbea 100%) fixed;background-color:#EAF2F7;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;touch-action:manipulation}
i{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:1.08em;padding-right:.04em}
sup{font-size:.62em;line-height:0;position:relative;top:-.12em;margin-right:.06em}
.cf{color:var(--o1)} .lt{color:var(--o2)}
.nw{white-space:nowrap}
.ic svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:.4em}

#app{height:100%;display:flex;flex-direction:column;padding:.6rem .8rem 0;gap:.5rem}
#stagewrap{flex:1;min-height:0;display:flex}
.stage{display:none;flex:1;min-width:0;position:relative}
.stage.on{display:flex}
.card{flex:1;min-width:0;min-height:0;display:flex;overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:1.1rem;box-shadow:0 .25rem 1rem rgba(31,78,115,.12)}
.inner{margin:auto;width:100%;max-width:66rem;padding:.7rem 1.4rem}
h2.st{margin:0 0 .6rem;font-size:1.5rem;color:var(--acc);font-weight:900}

.btn{border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:.45em 1.1em;font-weight:800;font-size:1rem;cursor:pointer;min-height:2.5rem;transition:background .15s,transform .1s}
.btn:hover{background:var(--accD);border-color:var(--accD)}
.btn:active{transform:scale(.96)}
.btn.light{background:var(--accL);color:var(--accD);border-color:var(--line)}
.btn.light:hover{background:#cfe0ec}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:2.1rem;padding:.2em .9em;font-size:.95rem}

/* старт */
.stage.start .card{background:linear-gradient(135deg,#DCE9F2 0%,#EAF2F7 55%,#F5F9FC 100%);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem}
.stage.start .kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-size:1.1rem}
.stage.start h1{margin:.4rem 0 .4rem;font-size:3.2rem;line-height:1.12;color:var(--accD);font-weight:900;padding:0 1rem;text-wrap:balance}
.stage.start h1 small{display:block;font-size:1.3rem;color:var(--muted);font-weight:700;margin-bottom:.4rem}
.stage.start .sub{font-size:1.4rem;font-weight:700;color:var(--acc);margin-bottom:1.2rem}
.go{border:2px solid var(--line);background:#fff;color:var(--accD);font-weight:900;font-size:1.3rem;border-radius:999px;padding:.5em .6em .5em 1.4em;cursor:pointer;display:inline-flex;align-items:center;gap:.9rem;box-shadow:0 .2rem .6rem rgba(31,78,115,.15)}
.go span{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.go:hover span{background:var(--accD)}
.dia{position:absolute;top:.7rem;right:.8rem;z-index:6;width:2.4rem;height:2.4rem;border:1.5px solid var(--line);border-radius:.7rem;background:#fff;color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dia svg{width:1.6rem;height:1.6rem}
.dia:hover{background:var(--accL)}

/* навігація */
.nav{flex:none;display:flex;justify-content:center;align-items:center;gap:.9rem}
.nav[hidden]{display:none}
.nav .btn{min-width:7.5rem}
.nav .btn.light{min-width:0}
#candle{position:relative;flex:none;width:.6rem;height:2.4rem;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:2px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#candle .wax{width:100%;height:100%;background:var(--acc2);border-radius:9px;transition:height 1s linear}
#ctip{position:absolute;bottom:3rem;left:50%;transform:translateX(-50%);background:var(--accD);color:#fff;font-size:.9rem;font-weight:700;padding:.4em .8em;border-radius:.6rem;white-space:nowrap;display:none;z-index:20}
#candle:hover #ctip{display:block}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* вкладки */
.tabbar{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.8rem}
.tab{border:2.5px solid var(--line);background:var(--soft2);color:var(--accD);font-weight:900;border-radius:999px;padding:.4em 1.2em;cursor:pointer;font-size:1.15rem}
.tab:not(.seen):not(.on){animation:glow 1.6s infinite;border-color:var(--acc2)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(56,135,175,.55)}100%{box-shadow:0 0 0 .6rem rgba(56,135,175,0)}}
.tabnext{margin-top:.4rem}
.tab:hover{background:var(--accL)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:.6rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap}

/* завдання */
.task{--tc:var(--acc);--tl:var(--soft2);--tb:var(--line);border-left:.45rem solid var(--tc);padding:.2rem .3rem .2rem .9rem;border-radius:.4rem}
.kick{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--tc)}
.ask{font-weight:800;color:var(--tc);font-size:1.2rem;margin:.15rem 0}
.expr{font-size:2.1rem;font-weight:700;text-align:center;padding:.3rem .8rem;margin:.3rem 0;background:var(--tl);border:1.5px solid var(--tb);border-radius:.8rem;overflow-x:auto;white-space:nowrap}
.task .btn:not(.light){background:var(--tc);border-color:var(--tc)}
.tools{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;justify-content:space-between;margin:.25rem 0}
.caller{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;min-height:2.6rem}
.cname{font-size:1.5rem;font-weight:900;color:var(--ink);padding:.05em .6em;border-radius:.7rem;background:transparent}
.cname.on{background:var(--accL);border:2px solid var(--line)}
.cname.good{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.cname.wrong{background:var(--badbg);border-color:var(--bad);color:var(--badtx)}
.mk{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid;font-size:1.25rem;font-weight:900;cursor:pointer;line-height:1;padding:0}
.mkok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.mkbad{background:var(--badbg);border-color:var(--bad);color:var(--badtx)}
.mk:disabled{opacity:.4;cursor:default}
.mk[hidden]{display:none}
.tmr{display:flex;align-items:center;gap:.5rem}
.tdisp{font-size:1.7rem;font-weight:900;min-width:3.6rem;text-align:center;color:var(--accD);font-variant-numeric:tabular-nums}
.tmr.low .tdisp{color:var(--warntx)}
.tmr.end .tdisp{color:var(--badtx);animation:bob 1s infinite}

/* кроки */
.stepper{margin:.3rem 0}
.steps{display:flex;flex-direction:column;gap:.25rem}
.step{padding:.2rem .8rem;border:1.5px solid var(--line);border-radius:.8rem;background:#fff;font-size:1.2rem;animation:pop .35s ease}
.step .sn{display:inline-flex;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--tc,var(--acc));color:#fff;font-weight:800;font-size:.9rem;align-items:center;justify-content:center;margin-right:.6rem;vertical-align:middle}
.step.only{border:none;padding:.2rem 0;text-align:center}
.sexp{display:inline-block;vertical-align:middle;max-width:calc(100% - 3rem);font-size:1.55rem;font-weight:700;white-space:nowrap;overflow-x:auto;color:var(--ink)}
.step.only .sexp{max-width:100%}
.sexp:has(.ab){display:block;max-width:none;overflow:visible;white-space:normal}
.sexp .res{display:inline-block;padding:.05em .5em;border-radius:.6rem;background:var(--okbg);border:2px solid var(--ok);color:var(--oktx)}
.down{display:block;margin:.5rem auto 0;width:2.7rem;height:2.7rem;border-radius:50%;border:none;background:var(--acc2);color:#fff;font-size:1.5rem;font-weight:900;cursor:pointer;animation:bob 1.1s infinite;box-shadow:0 .2rem .5rem rgba(31,78,115,.3)}
.down:hover{background:var(--acc)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.25rem)}}
@keyframes pop{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}
.mkd{padding:0 .06em}
.mkd.on{background:linear-gradient(transparent 14%,var(--c) 14%,var(--c) 92%,transparent 92%)}

/* журнал, ключик */
#keyBtn{position:fixed;left:.6rem;bottom:.5rem;z-index:30;border:none;background:transparent;font-size:1.1rem;opacity:.28;cursor:pointer;padding:.3rem}
#keyBtn:hover{opacity:.9}
.mk{opacity:.45;transform:scale(.85)}.mk:hover{opacity:.9}.mk.mkok,.mk.mkbad{background:var(--soft);border-color:var(--line);color:var(--muted)}.mk.done,.mk.done:disabled{opacity:1;background:var(--accL);color:var(--accD);border-color:var(--acc2)}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.pchips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.pchip{border:1.5px solid var(--line);border-radius:2rem;padding:.15rem .7rem;font-weight:700;color:var(--muted);background:var(--soft2)}
.pchip.was{background:var(--accL);color:var(--accD)}
.hint{font-size:.9rem;color:var(--muted);margin-top:.4rem}
.mod input[type=password],.mod input[type=text]{font:inherit;font-size:1.1rem;padding:.4rem .7rem;border:2px solid var(--line);border-radius:.6rem;min-width:12rem}
.tick .bx{width:2.2rem;height:2.2rem;border:3px solid var(--acc2);border-radius:.5rem;background:#fff;display:inline-block;position:relative}
.tick.on .bx{background:var(--acc);border-color:var(--acc)}
.tick.on .bx::after{content:"";position:absolute;left:.62rem;top:.15rem;width:.6rem;height:1.2rem;border:solid #fff;border-width:0 .25rem .25rem 0;transform:rotate(45deg)}
.btn.sm{font-size:.95rem}
.ask .kk{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-right:.8rem;opacity:.85}
.callbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;min-height:3rem;margin:0}
.who[hidden],.callbar [hidden]{display:none!important}
.who{display:flex;align-items:center;gap:.8rem;background:#FFF1CC;border:2.5px solid #E0A82E;border-radius:.9rem;padding:.25rem 1.1rem;color:#6B4200}
.who .wl{font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.who .wn{font-weight:900;font-size:2rem;line-height:1.1}
.exprrow{position:relative}
.exprrow .expr{padding-right:4rem}
.exprrow .tick{position:absolute;right:.7rem;top:50%;transform:translateY(-50%)}
.wc{position:relative;padding-right:4.2rem!important}
.wc .tick{position:absolute;right:.9rem;top:50%;transform:translateY(-50%)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.tick{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;padding:.2rem;cursor:pointer}
.tick:disabled{opacity:.35;cursor:default}
.prbox{display:flex;flex-direction:column;gap:.35rem;margin:.3rem 0}
.prrow{display:grid;grid-template-columns:9.5rem minmax(0,1fr);align-items:center;gap:.6rem;border:1.5px solid var(--tb);border-radius:.8rem;padding:.2rem .7rem;background:#fff}
.prl{font-weight:800;font-size:.95rem;color:var(--tc);line-height:1.15}
.prrow .wans{min-height:2.4rem}
.sfxt{font-size:1.45rem;font-weight:700;margin-left:.3rem}
.task .btn.cur{box-shadow:0 0 0 3px var(--tb)}
.exprrow .expr{padding-right:.8rem}
/* розминка */
.lvl{font-weight:900;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);margin:.35rem 0 .2rem}
.wlist{display:flex;flex-direction:column;gap:.6rem;margin:.4rem 0}
.wc{--tc:var(--acc);--tl:var(--soft2);--tb:var(--line);border:2px solid var(--tb);border-left:.45rem solid var(--tc);border-radius:.9rem;padding:.5rem .9rem;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:.3rem 1.2rem;align-items:center}
@media (max-width:760px){.wc{grid-template-columns:1fr}}
.wexp{font-size:1.7rem;font-weight:700;white-space:nowrap;overflow-x:auto}
.wansw{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.wans{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-size:1.45rem;font-weight:700;min-height:2.6rem}
.wans.nudge{animation:nudge .4s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}
.wans .eq{color:var(--muted)}
.chip{border:2px solid var(--tb);background:var(--tl);color:var(--tc);font-weight:900;font-size:1.3rem;border-radius:.6rem;min-width:2.6rem;min-height:2.3rem;padding:0 .5rem;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--accL)}
.chip.open{background:#fff;color:var(--ink);border-style:dashed;font-size:1.45rem}
.chip .sg{margin-right:.15em}

/* схема зі стрілками */
.ab{text-align:center;display:flex;flex-direction:column;align-items:center}
.abw{position:relative;display:inline-block;padding:2.3em .4em 2.3em;max-width:100%}
.abw svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.exrow{display:flex;align-items:baseline;justify-content:center;white-space:nowrap;font-size:2.3rem;font-weight:700;gap:.1em}
.fac{display:inline-flex;align-items:baseline}
.pr{font-weight:500;color:var(--muted);margin:0 .06em}
.sg{margin:0 .22em}
.tm{font-weight:800;padding:0 .04em}
.rows{font-size:1.9rem;font-weight:700;text-align:left;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap}
.rows .rw{margin:.25em 0;min-height:1.4em}
.rows .rw.fin{border-radius:.6rem;padding:.1em .4em;background:var(--accL);box-shadow:0 0 0 2px var(--line)}
.rows .eq{color:var(--muted);margin-right:.35em}

/* підсумок */
.sum .step{font-size:1.4rem;padding:.7rem 1.1rem}
.sum .step b{color:var(--accD)}
.sum .sexp{max-width:calc(100% - 3rem);white-space:normal;overflow:visible}
.sum .sexp:has(.ab){max-width:none}
.sum .gochk{margin:.7rem auto 0;display:block}
.fin-q{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem .9rem;margin:.4rem 0;font-size:1.2rem;background:var(--soft2)}
.fin-q .end{color:var(--accD);font-weight:800}
.fin-q .btn{min-height:2rem;padding:.15em .8em;font-size:.95rem}

/* світлофор */
.tl{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center}
@media (max-width:760px){.tl{grid-template-columns:1fr}}
.votes{display:flex;flex-direction:column;gap:.6rem}
.vote{display:flex;align-items:center;gap:.8rem;border:2px solid var(--line);border-radius:1rem;padding:.5rem .9rem;background:#fff;font-size:1.15rem;font-weight:800}
.vote .dotc{width:2.6rem;height:2.6rem;border-radius:50%;border:none;cursor:pointer;box-shadow:0 .15rem .4rem rgba(0,0,0,.25);flex:none}
.vote .dotc:active{transform:scale(.92)}
.vote .cnt{margin-left:auto;font-size:1.7rem;min-width:2.2rem;text-align:right;color:var(--accD)}
.lamp{width:6.5rem;background:#3a4a58;border-radius:1.4rem;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;align-items:center;margin:0 auto}
.lamp i{width:4.4rem;height:4.4rem;border-radius:50%;background:#56697a;opacity:.45;display:block;transition:all .3s}
.lamp i.on{opacity:1;box-shadow:0 0 1.4rem currentColor}
.tlmsg{font-size:1.25rem;font-weight:800;color:var(--accD);margin-top:.5rem;min-height:3rem}

/* модальні */
.ov{position:fixed;inset:0;z-index:2147483000;background:rgba(23,63,95,.45);display:none;align-items:center;justify-content:center;padding:1rem}
.ov.on{display:flex}
.mod{background:#fff;border-radius:1.2rem;max-width:44rem;width:100%;max-height:92%;overflow:auto;padding:1.2rem 1.5rem;border:2px solid var(--line);box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.mod h3{margin:0 0 .6rem;color:var(--acc);font-size:1.4rem}
.mod h4{margin:.8rem 0 .3rem;color:var(--accD);font-size:1.05rem}
.mod p,.mod li{font-size:1.05rem}
.mod .x{float:right;border:none;background:var(--accL);color:var(--accD);border-radius:50%;width:2.1rem;height:2.1rem;font-size:1.1rem;cursor:pointer;font-weight:900}
.plan{display:flex;flex-direction:column;gap:.35rem}
.plan button{display:flex;justify-content:space-between;gap:1rem;border:1.5px solid var(--line);background:var(--soft2);border-radius:.7rem;padding:.4rem .8rem;cursor:pointer;font-size:1rem;font-weight:700;color:var(--accD);text-align:left}
.plan button:hover{background:var(--accL)}
.plan .tm2{font-weight:900;color:var(--acc);white-space:nowrap}
.lab{display:block;font-weight:800;font-size:1rem;margin:.3rem 0}
#names{width:100%;font:inherit;font-size:1.05rem;padding:.5rem .7rem;border:2px solid var(--line);border-radius:.7rem;color:var(--ink);background:#fff;resize:vertical}
#names:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 .2rem var(--accL)}
.jwrap{overflow-x:auto}
.jt{border-collapse:collapse;width:100%;font-size:1rem}
.jt th,.jt td{border-bottom:1.5px solid var(--line);padding:.3rem .6rem;text-align:center}
.jt th:first-child,.jt td:first-child{text-align:left}
.jt th{color:var(--accD);font-weight:900;font-size:.9rem}
.jt .gd{color:var(--oktx);font-weight:900}.jt .bd{color:var(--badtx);font-weight:900}
.conf{position:fixed;width:.7rem;height:1rem;z-index:2147483100;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.finbox{text-align:center}
.finbox .big{font-size:3rem;font-weight:900;color:var(--acc);margin:.2rem 0}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stagewrap"></div>
  <div id="nav" class="nav" hidden>
    <button class="btn light" id="bBack">← Назад</button>
    <button class="btn" id="bNext">Далі →</button>
  </div>
  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>
<div class="ov" id="ovMeta"><div class="mod" id="metaBox"></div></div>
<div class="ov" id="ovFin"><div class="mod finbox" id="finBox"></div></div>
<script>
/* ===================== ДВИЖОК: многочлени кількох змінних ===================== */
const MINUS = '−';
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const sgn = () => Math.random() < .5 ? -1 : 1;

/* член: { c: коефіцієнт, v: [[літера, степінь], …] у порядку запису } */
function parsePoly(s) {
  s = s.replace(/\s+/g, '').replace(/−/g, '-'); const out = []; let i = 0;
  while (i < s.length) {
    let sg = 1; if (s[i] === '+') i++; else if (s[i] === '-') { sg = -1; i++; }
    let num = ''; while (i < s.length && /\d/.test(s[i])) num += s[i++];
    const v = [];
    while (i < s.length && /[a-z]/.test(s[i])) {

<script>

    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
</html>
