<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">

<style>

html,body{height:100%;margin:0}
body{font-family:Nunito,Arial,sans-serif;color:var(--tx);background:linear-gradient(135deg,#efe9ff,#fde8f3 60%,#e6f0ff);font-size:18px}
i{font-family:"Times New Roman",serif;font-size:1.08em}
#app{height:100dvh;max-width:780px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(80,60,150,.12);padding:16px 18px}
h1{font-size:1.25em;margin:0 0 8px;color:var(--c)}
.scroll{flex:1;overflow:auto;min-height:0}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;color:var(--c);padding-right:42px}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.strip button{width:30px;height:30px;border-radius:8px;border:2px solid #cfc6ee;background:#fff;font:700 13px Nunito;cursor:pointer;padding:0;color:var(--tx)}
.strip button.f{background:var(--c);border-color:var(--c);color:#fff}
.strip button.cur{border-width:4px;border-color:var(--tx)}
.strip button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.strip button.no{background:var(--no);border-color:var(--no);color:#fff}
.strip button.cur.ok,.strip button.cur.no{border-color:var(--tx)}
.part{font-size:.8em;font-weight:800;color:#8a7fb5;text-transform:uppercase;margin-bottom:6px}
.q{font-weight:700;margin-bottom:12px;line-height:1.35}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:46px;margin:7px 0;padding:8px 12px;border:2px solid #d9d2f2;border-radius:12px;background:#fff;font:600 1em Nunito;color:var(--tx);cursor:pointer}
.opt b{background:var(--cl);border-radius:8px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--c)}
.opt.sel{border-color:var(--c);background:var(--cl)}
.opt.ok{border-color:var(--ok);background:var(--okl)}
.opt.no{border-color:var(--no);background:var(--nol)}
.opt:disabled{cursor:default;opacity:1}

.fld input{width:110px;height:46px;font:700 1.1em Nunito;text-align:center;border:2px solid #d9d2f2;border-radius:12px;color:var(--tx)}
.fld input:focus{outline:none;border-color:var(--c)}
.fld input.ok{border-color:var(--ok);background:var(--okl)}
.fld input.no{border-color:var(--no);background:var(--nol)}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700}
.fb.ok{background:var(--okl);color:#1d6e3e}.fb.no{background:var(--nol);color:#a02f2f}
.bar{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border:0;border-radius:14px;background:var(--c);color:#fff;font:800 1em Nunito;cursor:pointer;padding:8px 14px}
.btn.s{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn:disabled{opacity:.4;cursor:default}
.in{width:100%;height:48px;border:2px solid #d9d2f2;border-radius:12px;padding:0 12px;font:600 1em Nunito;margin:6px 0}
.in.bad{border-color:var(--no);background:var(--nol)}
.msg{color:var(--no);font-weight:700;min-height:1.3em}
.kp{display:none;grid-template-columns:repeat(6,1fr);gap:6px}
.kp.on{display:grid}
.kp button{height:46px;border:0;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(80,60,150,.2);font:800 1.15em Nunito;color:var(--tx)}
.big{font-size:2em;font-weight:800;color:var(--c);text-align:center;margin:8px 0}
.sig{text-align:center;font-size:.72em;color:#7d74a8}
#key{position:fixed;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.55);opacity:.45;font-size:16px;z-index:20;cursor:pointer}
#jr{position:fixed;inset:0;background:rgba(30,20,70,.55);z-index:30;display:none;padding:10px}
#jr .box{background:#fff;border-radius:16px;height:100%;max-width:1200px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:8px}
#jr .tb{flex:1;overflow:auto}
#jr table{border-collapse:collapse;font-size:14px;width:100%}
#jr th,#jr td{border:1px solid #e1dcf3;padding:4px 6px;text-align:center;white-space:nowrap}
#jr td.nm{text-align:left;cursor:pointer;color:var(--c);font-weight:700}
#jr .det td{text-align:left;white-space:normal;background:#faf8ff;font-size:13px}
.red{color:var(--no);font-weight:800}
.jb{display:flex;gap:6px;flex-wrap:wrap}.jb .btn{flex:none;min-height:38px;font-size:14px}
@media(max-width:480px){body{font-size:16px}.card{padding:12px}}

let fbPromise = null;
function fb(){
  if(!fbPromise){
    fbPromise = (async()=>{
      const [appM, authM, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),

}
const coll = (db, fs) => fs.collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION);
async function saveResult(rec){
  try { const { db, fs } = await fb(); await fs.setDoc(fs.doc(coll(db, fs), rec.id), rec); }
  catch(e){ console.warn('Save failed', e); }
}
async function loadResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
}

{p:'Частина I',t:'Якщо кут <i>α</i> вертикальний до кута 55'+D+', то <i>α</i> є:',o:['Суміжним','Прямим','Тупим','Гострим'],c:3},
{p:'Частина II',t:'На прямій послідовно позначено точки A, B, C. AC = 42 см, BC на 8 см менший за AC. Знайдіть довжину відрізка AB.',o:['25 см','16 см','42 см','50 см'],c:0},

{p:'Частина II. Задачі',t:'Суміжні кути <i>α</i> і <i>β</i> відомі: <i>α</i> на 50'+D+' менший за <i>β</i>. Знайдіть градусні міри обох кутів.',n:[{l:'Кут <i>α</i>, °',a:65},{l:'Кут <i>β</i>, °',a:115}]},

{p:'Частина III. Моделювання',t:'Розгорнутий кут ∠ACB, промінь CD — його бісектриса. Який кут утворює CD з кожною зі сторін CA і CB?',o:['45'+D+', бо бісектриса ділить 90'+D+' навпіл','90'+D+', бо бісектриса ділить розгорнутий кут 180'+D+' на два рівні кути','180'+D+', бо CD лежить на одній прямій із CA','60'+D+', бо розгорнутий кут містить три рівні кути'],c:1}
];
const N=T.length;
const L=['А','Б','В','Г'];

/* ===== Допоміжне ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const it=s=>s.replace(/(?<![A-Za-z<\/])[A-Z]{1,3}(?![A-Za-z>])/g,m=>'<i>'+m+'</i>');
const strip=s=>s.replace(/<[^>]+>/g,'').replace('⁄','/');
const $=id=>document.getElementById(id);
const coarse=matchMedia('(pointer:coarse)').matches;
let state,W,sur='',nam='',seed;
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}
function leave(){if(!state||state.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);window.addEventListener('focus',back);
resetWatch();

function build(){
  const q=new URLSearchParams(location.search).get('v');
  seed=q?parseInt(q)||1:Math.floor(Math.random()*1e9);
  const r=mulberry32(seed);
  state={screen:state?state.screen:'start',i:0,checked:false,marks:[],
    perm:T.map(x=>{if(!x.o)return null;const p=x.o.map((_,k)=>k);
      const lim=x.fix!==undefined?x.fix:x.o.length;
      const a=p.slice(0,lim);for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}
      return a.concat(p.slice(lim))}),
    ans:T.map(x=>x.n?x.n.map(()=>''):null)};
  resetWatch();
}
/* fix:3 — залишає останні варіанти на місці? ні: перші fix перемішуються, решта лишається */

function answered(i){const x=T[i],a=state.ans[i];return x.n?a.every(v=>v.trim()!==''):a!==null}
function isOk(i){const x=T[i],a=state.ans[i];
  if(x.n)return x.n.every((f,k)=>parseFloat(String(a[k]).replace(',','.'))===f.a);
  return a!==null&&state.perm[i][a]===x.c}
function cnt(){let n=0;for(let i=0;i<N;i++)if(answered(i))n++;return n}

    <p style="margin:6px 0">Введіть прізвище та ім'я, щоб почати.</p>

      body=state.perm[i].map((src,k)=>{

    A_html();
    function A_html(){
    A.innerHTML=`<div class="card" style="padding:10px 12px"><div class="top"><span>Завдання ${i+1} з ${N}</span><span id="cn"></span></div><div id="st">${stripHTML()}</div></div>
    <div class="card scroll"><div class="part">${x.p}</div><div class="q">${it(x.t)}</div>${body}${fbk}</div>
    <div class="bar"><button class="btn s" id="bk" ${i===0?'disabled':''}>← Назад</button><button class="btn" id="nx">${i===N-1?(state.checked?'До результату':'Далі →'):'Далі →'}</button></div>
    <div class="kp ${coarse&&x.n&&!state.checked?'on':''}" id="kp">${'123456789'.split('').map(d=>`<button data-k="${d}">${d}</button>`).join('')}<button data-k="0">0</button><button data-k="b">⌫</button><button data-k="n">→</button></div>`;}
    bindTask();return}
  if(s==='review'){
    const n=cnt();
    A.innerHTML=`${head()}<div class="top" style="margin:0 0 6px"><span>Перед здачею</span></div>${stripHTML()}</div>
    <div class="card"><div class="q" style="margin:0">Відповіли на ${n} з ${N}</div>
    ${n<N?`<div class="msg">Ви не завершили ${N-n} ${plural(N-n)}. Незавершені — порожні клітинки.</div>`:''}</div>
    <div class="bar"><button class="btn s" id="bk">← Назад</button><button class="btn" id="chk">${n<N?'Все одно перевірити':'Перевірити'}</button></div>`;
    document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.i=+b.dataset.g;state.screen='task';render()});
    $('bk').onclick=()=>{state.i=N-1;state.screen='task';render()};
    $('chk').onclick=check;return}
  if(s==='result'){
    const sc=state.marks.reduce((a,b)=>a+b,0);
    A.innerHTML=`<div class="card"><div class="top" style="padding:0"><span>${sur} ${nam}</span></div><div class="big">${sc} з ${N}</div>${stripHTML()}
    <p style="margin:10px 0 0;font-size:.9em">Натисніть на номер, щоб переглянути завдання.</p></div>
    <div class="bar"><button class="btn s" id="vw">Переглянути завдання</button><button class="btn" id="again">Пройти ще раз</button></div>
    <div class="sig">Автор розробки <b>Ковтун Тетяна</b></div>`;
    document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.i=+b.dataset.g;state.screen='task';render()});
    $('vw').onclick=()=>{state.i=0;state.screen='task';render()};
    $('again').onclick=()=>{history.replaceState(null,'',location.pathname);state.screen='task';build();state.screen='task';render()};
  }
}
function plural(n){const a=n%10,b=n%100;return (a===1&&b!==11)?'завдання':'завдань'}
let activeInp=null;
function bindTask(){
  const i=state.i,x=T[i];
  const upd=()=>{$('st').innerHTML=stripHTML();bindStrip();$('cn').textContent='';};
  const bindStrip=()=>document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.i=+b.dataset.g;render()});
  bindStrip();
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{state.ans[i]=+b.dataset.o;render()});
  const ins=[...document.querySelectorAll('[data-n]')];
  ins.forEach(e=>{
    e.onfocus=()=>activeInp=e;
    e.oninput=()=>{e.value=e.value.replace(/[^0-9.,]/g,'');state.ans[i][+e.dataset.n]=e.value;upd()};
    e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();nextField(e)}}});
  if(ins.length&&!state.checked&&!coarse)ins[0].focus();else if(ins.length&&!state.checked)activeInp=ins[0];
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(!activeInp)activeInp=ins[0];if(!activeInp)return;
    if(k==='n')return nextField(activeInp);
    activeInp.value=k==='b'?activeInp.value.slice(0,-1):activeInp.value+k;
    state.ans[i][+activeInp.dataset.n]=activeInp.value;upd()});
  $('bk').onclick=()=>go(-1);$('nx').onclick=()=>go(1);
}
function nextField(e){const ins=[...document.querySelectorAll('[data-n]')];const k=ins.indexOf(e);
  if(k<ins.length-1){ins[k+1].focus();activeInp=ins[k+1]}else go(1)}
function go(d){
  const j=state.i+d;
  if(state.checked){if(j<0)return;if(j>=N){state.screen='result';render();return}state.i=j;render();return}
  if(j<0)return;if(j>=N){state.screen='review';render();return}state.i=j;render()}
document.addEventListener('keydown',e=>{
  if(!state||state.screen!=='task')return;
  const inField=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(e.key==='ArrowRight'&&!inField)go(1);
  else if(e.key==='ArrowLeft'&&!inField)go(-1);
  else if(e.key==='Enter'&&!inField&&answered(state.i))go(1)});

function check(){
  state.marks=T.map((_,i)=>isOk(i)?1:0);
  state.checked=true;
  const score=state.marks.reduce((a,b)=>a+b,0);
  const now=Date.now();back();
  const qtext=T.map(x=>strip(x.t)),
    answers=T.map((x,i)=>x.n?state.ans[i].join(' | '):(state.ans[i]===null?'—':L[state.ans[i]]+') '+strip(x.o[state.perm[i][state.ans[i]]]))),
    correct=T.map(x=>x.n?x.n.map(f=>f.a).join(' | '):strip(x.o[x.c]));
  saveResult({id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,ts:now,date:new Date(now).toISOString(),
    score,max:N,grade100:Math.round(score/N*100),tasks:state.marks,qtext,answers,correct,
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,test:TEST_NAME});
  state.screen='result';render();
}

/* ===== Журнал ===== */
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let recs=[];
const gr=r=>r.grade100!=null?r.grade100:(r.max?Math.round(r.score/r.max*100):'—');
$('key').onclick=()=>{
  const p=prompt?null:null; // без prompt: свій ввід
  $('jr').style.display='block';
  $('jbar').innerHTML='';$('jtb').innerHTML='<input class="in" id="pw" type="password" placeholder="Пароль" style="max-width:260px"> <button class="btn" id="pwb" style="flex:none;min-height:40px">Увійти</button>';
  $('jmsg').textContent='';
  const ok=()=>{if($('pw').value===TEACHER_PASSWORD)openJ();else $('jmsg').textContent='Неправильний пароль'};
  $('pwb').onclick=ok;$('pw').onkeydown=e=>{if(e.key==='Enter')ok()};
  const c=document.createElement('button');c.className='btn s';c.style.cssText='flex:none;min-height:38px;font-size:14px';c.textContent='Закрити';c.onclick=()=>$('jr').style.display='none';$('jbar').appendChild(c);
};
function openJ(){
  $('jbar').innerHTML='';
  [['Оновити',refreshJ],['Завантажити CSV',csv],['Очистити',askClear],['Закрити',()=>$('jr').style.display='none']].forEach(([t,f])=>{
    const b=document.createElement('button');b.className='btn'+(t==='Закрити'?' s':'');b.textContent=t;b.onclick=f;$('jbar').appendChild(b)});
  refreshJ()}
async function refreshJ(){
  $('jmsg').textContent='';$('jtb').innerHTML='Завантаження…';
  try{recs=await loadResults();drawJ()}catch(e){$('jtb').innerHTML='';$('jmsg').textContent='Не вдалося підключитися до бази результатів'}}
function drawJ(){
  const M=Math.max(N,...recs.map(r=>r.max||0));
  let h='<table><tr><th>№</th><th>Прізвище та ім\'я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th><th>Оцінка (100)</th>';
  for(let k=1;k<=M;k++)h+=`<th>${k}</th>`;h+='</tr>';
  recs.forEach((r,n)=>{
    const t=r.durationSec,lv=r.leaves;
    h+=`<tr><td>${n+1}</td><td class="nm" data-d="${n}">${r.name||''}</td><td>${new Date(r.ts).toLocaleString('uk-UA')}</td>
    <td>${t==null?'—':`<span class="${t<120?'red':''}" ${t<120?'title="Дуже швидко"':''}>${mmss(t)}</span>`}</td>
    <td>${lv==null?'—':`<span class="${lv>=3?'red':''}" title="Поза вікном: ${mmss(r.awaySec||0)}">${lv}</span>`}</td><td><b>${r.score}/${r.max}</b></td><td><b>${gr(r)}</b></td>`;
    for(let k=0;k<M;k++){const v=(r.tasks||[])[k];h+=`<td>${v===undefined?'':v?'✓':'<span class="red">✗</span>'}</td>`}
    h+='</tr>'});
  $('jtb').innerHTML=h+'</table>'+(recs.length?'':'<p>Записів немає</p>');
  document.querySelectorAll('[data-d]').forEach(td=>td.onclick=()=>{
    const row=td.parentNode,nx=row.nextSibling;
    if(nx&&nx.className==='det'){nx.remove();return}
    const r=recs[+td.dataset.d];let d='<table>';
    (r.qtext||[]).forEach((q,k)=>d+=`<tr><td>${k+1}</td><td>${q}</td><td>Учень: ${(r.answers||[])[k]}</td><td>Правильно: ${(r.correct||[])[k]}</td></tr>`);
    const tr=document.createElement('tr');tr.className='det';tr.innerHTML=`<td colspan="${7+M}">${d}</table></td>`;row.after(tr)})}
function csv(){
  const M=Math.max(N,...recs.map(r=>r.max||0));
  const rows=[['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал','Оцінка (100)'].concat(Array.from({length:M},(_,k)=>'Завд. '+(k+1)))];
  recs.forEach(r=>rows.push([r.name,new Date(r.ts).toLocaleString('uk-UA'),r.durationSec==null?'':mmss(r.durationSec),r.leaves==null?'':r.leaves,r.awaySec==null?'':mmss(r.awaySec),r.score+'/'+r.max,gr(r)].concat(Array.from({length:M},(_,k)=>{const v=(r.tasks||[])[k];return v===undefined?'':v?'+':'-'}))));
  const txt='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='Контрольна_геометрія_7клас_результати.csv';a.click()}
function askClear(){
  $('jmsg').innerHTML=`Видалити всі записи (${recs.length})? <button class="btn" id="yy" style="flex:none;min-height:34px">Так, видалити</button> <button class="btn s" id="nn" style="flex:none;min-height:34px">Скасувати</button>`;
  $('nn').onclick=()=>$('jmsg').textContent='';
  $('yy').onclick=async()=>{try{await clearResults();$('jmsg').textContent='';refreshJ()}catch(e){$('jmsg').textContent='Не вдалося очистити записи. Перевірте правила бази Firebase'}}}

build();render();
})();
</script></body></html>
