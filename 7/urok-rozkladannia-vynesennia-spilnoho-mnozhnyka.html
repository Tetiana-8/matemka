<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Розкладання многочлена на множники. Винесення спільного множника за дужки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=STIX+Two+Text:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#173F5F;--muted:#5d7b93;
  --acc:#2A6592;--accD:#1F4E73;--acc2:#3887AF;--accL:#DCE9F2;--soft:#EAF2F7;--soft2:#F5F9FC;--line:#A8CADD;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;
  --warnbg:#fff6e5;--warntx:#8a5a00;--warnln:#f3d9a4;
  --cf:#e8590c;--c1:#7048e8;--c2:#d6336c;--c3:#1971c2;--c4:#8a5a1c;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);height:100%}
body{margin:0;height:100dvh;overflow:hidden;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#EAF2F7 0%,#DCE9F2 55%,#c7dbea 100%) fixed;background-color:#EAF2F7;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;touch-action:manipulation}
i{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:1.08em;padding-right:.04em}
sup{font-size:.62em;line-height:0;position:relative;top:-.12em;margin-right:.06em}
.nw{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em;font-size:.9em}
.fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}
#app{height:100%;display:flex;flex-direction:column;padding:.6rem .8rem 0;gap:.5rem}
#stagewrap{flex:1;min-height:0;display:flex}
.stage{display:none;flex:1;min-width:0;position:relative}
.stage.on{display:flex}
.card{flex:1;min-width:0;min-height:0;display:flex;overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:1.1rem;box-shadow:0 .25rem 1rem rgba(31,78,115,.12)}

h2.st{margin:0 0 .5rem;font-size:1.5rem;color:var(--acc);font-weight:900}
.btn{border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:999px;padding:.4em 1.1em;font-weight:800;font-size:1rem;cursor:pointer;min-height:2.4rem;transition:background .15s,transform .1s}
.btn:hover{background:var(--accD);border-color:var(--accD)}
.btn:active{transform:scale(.96)}
.btn.light{background:var(--accL);color:var(--accD);border-color:var(--line)}
.btn.light:hover{background:#cfe0ec}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:2rem;padding:.2em .9em;font-size:.95rem}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.bar{display:flex;gap:.6rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap}
.stage.start .card{background:linear-gradient(135deg,#DCE9F2 0%,#EAF2F7 55%,#F5F9FC 100%);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem}
.stage.start .kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-size:1.1rem}
.stage.start h1{margin:.4rem 0;font-size:2.9rem;line-height:1.12;color:var(--accD);font-weight:900;padding:0 1rem;text-wrap:balance}
.stage.start h1 small{display:block;font-size:1.3rem;color:var(--muted);font-weight:700;margin-bottom:.4rem}
.stage.start .sub{font-size:1.3rem;font-weight:700;color:var(--acc);margin-bottom:1.2rem}
.go{border:2px solid var(--line);background:#fff;color:var(--accD);font-weight:900;font-size:1.3rem;border-radius:999px;padding:.5em .6em .5em 1.4em;cursor:pointer;display:inline-flex;align-items:center;gap:.9rem;box-shadow:0 .2rem .6rem rgba(31,78,115,.15)}
.go span{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.dia{position:absolute;top:.7rem;right:.8rem;z-index:6;width:2.4rem;height:2.4rem;border:1.5px solid var(--line);border-radius:.7rem;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dia svg{width:1.6rem;height:1.6rem}
.dia:hover{background:var(--accL)}
.nav{flex:none;display:flex;justify-content:center;align-items:center;gap:.9rem}
.nav[hidden]{display:none}
.nav .btn{min-width:7.5rem}
.nav .btn.light{min-width:0}
.nav .dia{position:static}
#candle{position:relative;flex:none;width:.6rem;height:2.4rem;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:2px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#candle .wax{width:100%;height:100%;background:var(--acc2);border-radius:9px;transition:height 1s linear}
#ctip{position:absolute;bottom:3rem;left:50%;transform:translateX(-50%);background:var(--accD);color:#fff;font-size:.9rem;font-weight:700;padding:.4em .8em;border-radius:.6rem;white-space:nowrap;display:none;z-index:20}

.dice{width:2.7rem;height:2.7rem;border:2px solid #E0A82E;background:#FFF1CC;border-radius:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:#6B4200}
.dice svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dice:hover{background:#ffe7a8}
.dice:active{transform:scale(.93)}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}
#callbar{flex:none;display:flex;flex-wrap:wrap;min-width:0;align-items:center;justify-content:center;gap:.8rem}
#callbar[hidden]{display:none}
.who{display:flex;flex-wrap:wrap;justify-content:center;min-width:0;max-width:100%;align-items:center;gap:.8rem;background:#FFF1CC;border:2.5px solid #E0A82E;border-radius:.9rem;padding:.2rem 1.1rem;color:#6B4200}
.who .wl{font-weight:800;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.who .wn{min-width:0;overflow-wrap:anywhere;font-weight:900;font-size:clamp(1.1rem,5vw,1.9rem);line-height:1.1}
@media(max-width:560px){.who .wl{display:none}.rw{font-size:1.7rem}.rw.t{font-size:1.25rem}.chip2{font-size:1.1rem}}
.box{white-space:nowrap}
@media (pointer:coarse){.btn,.btn.sm,.tab,.opt,.down,.dia,.dice,.dotc,#keyBtn,.mod .x{min-height:44px;min-width:44px}.tab{padding:.4em 1em}}
.who .wr{font-size:.85rem;font-weight:700;opacity:.75}
.tabbar{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.2rem}
.tab{border:2px solid var(--line);background:var(--soft2);color:var(--accD);font-weight:800;border-radius:999px;padding:.2em .9em;cursor:pointer;font-size:.95rem}
.tab:hover{background:var(--accL)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab:not(.seen):not(.on){border-color:var(--acc2)}
.tabnext{margin-top:.5rem}
.task{--tc:var(--acc);border-left:.45rem solid var(--tc);padding:.1rem .3rem .1rem .9rem;border-radius:.4rem}
.ask{font-weight:800;color:var(--tc);font-size:1.25rem;margin:.1rem 0 .3rem}
.ask .kk{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-right:.8rem;opacity:.85}
.expr{font-size:2rem;font-weight:700;text-align:center;padding:.25rem .8rem;margin:.3rem 0;background:var(--soft2);border:1.5px solid var(--line);border-radius:.8rem;overflow-x:auto;white-space:nowrap}
.task .btn:not(.light){background:var(--tc);border-color:var(--tc)}
/* дошка кроків */
.brd{position:relative;width:fit-content;max-width:100%;margin:1.2rem auto .4rem}
.brd svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}

.box,.rw.res .box{border:2.5px solid var(--ok);background:var(--okbg);color:var(--oktx);border-radius:.7rem;padding:.05em .5em}
.box .cfx{background:none;padding:0}
.rw.chk{font-size:1.4rem;color:var(--muted)}
.cfx{color:var(--cf);font-weight:900;background:rgba(232,89,12,.14);border-radius:.3rem;padding:0 .12em}
.slot{display:inline-block;min-width:1.6em;border:2px dashed var(--line);border-radius:.4rem;text-align:center;color:transparent;padding:0 .1em}
.rem{padding:0 .05em;animation:pop .35s ease}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.chip2{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.1em .6em;font-size:1.4rem;font-weight:700;color:var(--ink)}

.down{display:block;margin:.3rem auto 0;width:2.6rem;height:2.6rem;border-radius:50%;border:none;background:var(--acc2);color:#fff;font-size:1.5rem;font-weight:900;cursor:pointer;animation:bob 1.1s infinite;box-shadow:0 .2rem .5rem rgba(31,78,115,.3)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.fin-q{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem .9rem;margin:.4rem 0;font-size:1.2rem;background:var(--soft2)}
.fin-q .end{color:var(--accD);font-weight:800}
.tl{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center}

.votes{display:flex;flex-direction:column;gap:.6rem}
.vote{display:flex;align-items:center;gap:.8rem;border:2px solid var(--line);border-radius:1rem;padding:.5rem .9rem;background:#fff;font-size:1.15rem;font-weight:800}
.vote .dotc{width:2.6rem;height:2.6rem;border-radius:50%;border:none;cursor:pointer;box-shadow:0 .15rem .4rem rgba(0,0,0,.25);flex:none}
.vote .cnt{margin-left:auto;font-size:1.7rem;min-width:2.2rem;text-align:right;color:var(--accD)}
.lamp{width:6.5rem;background:#3a4a58;border-radius:1.4rem;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;align-items:center;margin:0 auto}
.lamp i{width:4.4rem;height:4.4rem;border-radius:50%;background:#56697a;opacity:.45;display:block;transition:all .3s;padding:0}
.lamp i.on{opacity:1;box-shadow:0 0 1.4rem currentColor}
.tlmsg{font-size:1.25rem;font-weight:800;color:var(--accD);margin-top:.5rem;min-height:3rem}
#keyBtn{position:fixed;left:.6rem;bottom:.5rem;z-index:30;border:none;background:transparent;font-size:1.1rem;opacity:.28;cursor:pointer;padding:.3rem}
#keyBtn:hover{opacity:.9}
.ov{position:fixed;inset:0;z-index:2147483000;background:rgba(23,63,95,.45);display:none;align-items:center;justify-content:center;padding:1rem}
.ov.on{display:flex}
.mod{background:#fff;border-radius:1.2rem;max-width:44rem;width:100%;max-height:92%;overflow:auto;padding:1.2rem 1.5rem;border:2px solid var(--line);box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.mod h3{margin:0 0 .6rem;color:var(--acc);font-size:1.4rem}
.mod h4{margin:.8rem 0 .3rem;color:var(--accD);font-size:1.05rem}
.mod p,.mod li{font-size:1.05rem}
.mod .x{float:right;border:none;background:var(--accL);color:var(--accD);border-radius:50%;width:2.1rem;height:2.1rem;font-size:1.1rem;cursor:pointer;font-weight:900}
.mod input[type=password],.mod input[type=text]{font:inherit;font-size:1.1rem;padding:.4rem .7rem;border:2px solid var(--line);border-radius:.6rem;min-width:12rem}
.plan{display:flex;flex-direction:column;gap:.35rem}
.plan button{display:flex;justify-content:space-between;gap:1rem;border:1.5px solid var(--line);background:var(--soft2);border-radius:.7rem;padding:.4rem .8rem;cursor:pointer;font-size:1rem;font-weight:700;color:var(--accD);text-align:left}
.plan button:hover{background:var(--accL)}
.plan .tm2{font-weight:900;color:var(--acc);white-space:nowrap}
.lab{display:block;font-weight:800;font-size:1rem;margin:.3rem 0}
#names{width:100%;font:inherit;font-size:1.05rem;padding:.5rem .7rem;border:2px solid var(--line);border-radius:.7rem;color:var(--ink);background:#fff;resize:vertical}
.jt{border-collapse:collapse;width:100%;font-size:1rem}
.jt th,.jt td{border-bottom:1.5px solid var(--line);padding:.3rem .6rem;text-align:center}
.jt th:first-child,.jt td:first-child{text-align:left}
.jt th{color:var(--accD);font-weight:900;font-size:.9rem}
.conf{position:fixed;width:.7rem;height:1rem;z-index:2147483100;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.finbox{text-align:center}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.def{border-left:.35rem solid var(--acc);background:var(--accL);border-radius:.2rem .8rem .8rem .2rem;padding:.6rem 1rem;margin:.5rem 0;font-size:1.45rem;font-weight:700;color:var(--accD);line-height:1.4}
.def .dl{display:inline-block;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;font-size:.6em;margin-right:.6rem}
.def b{color:var(--cf)}
.brd.sm .rw{font-size:1.9rem;margin-bottom:.55rem}
.brd.sm.big .def{font-size:1.7rem;padding:.8rem 1.1rem;margin:.8rem 0}
.brd.sm .def{font-size:1.2rem;padding:.4rem .8rem;margin:.3rem 0}
.task .def{font-size:1.15rem;padding:.35rem .8rem;margin:.3rem 0}
.task .brd .rw.t{font-size:1.5rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.6rem 0}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);background:#fff;border-radius:.9rem;padding:.55rem .8rem;cursor:pointer;font-size:1.7rem;text-align:left;font-weight:700;min-height:3.6rem}
.opt .lt-l{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accL);color:var(--accD);font-size:.95rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt .ot{flex:1;text-align:center}
.opt:hover:not(:disabled){background:var(--soft);border-color:var(--acc2)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badtx);opacity:.8}
.opts.done .opt:not(.ok){opacity:.5}
.msg{min-height:1.6rem;font-weight:800;font-size:1.15rem;margin:.3rem 0}
.msg.ok{color:var(--oktx)}.msg.bad{color:var(--badtx)}
.hint{display:block;margin-top:.2rem;padding:.35rem .7rem;background:var(--warnbg);border:1.5px solid var(--warnln);color:var(--warntx);border-radius:.6rem;font-weight:700;font-size:1rem}
.task .expr{font-size:2.2rem}
.ab{text-align:center}
.abw{position:relative;display:inline-block;padding:1.6em .4em 1.6em;max-width:100%}
.abw svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.exrow{display:flex;align-items:baseline;justify-content:center;white-space:nowrap;font-size:2.2rem;font-weight:700;gap:.1em}
.fac{display:inline-flex;align-items:baseline}
.pr{font-weight:500;color:var(--muted);margin:0 .06em}
.sg{margin:0 .22em}
.tm{font-weight:800;padding:0 .04em}
.rows{font-size:1.9rem;font-weight:700;text-align:left;display:block;width:fit-content;margin:0 auto;max-width:100%;overflow-x:auto;white-space:nowrap}
.rows .rw{font-size:inherit;margin:.2em 0;min-height:1.3em;animation:none}
.rows .rw.fin{border-radius:.6rem;padding:.1em .4em;background:var(--accL);box-shadow:0 0 0 2px var(--line)}
.abhint:empty{display:none}
.abhint{min-height:1.5rem;font-size:1.1rem;font-weight:800;color:var(--accD);margin:.1rem 0}
.mkd{padding:0 .06em}
.mkd.on{background:linear-gradient(transparent 14%,var(--c) 14%,var(--c) 92%,transparent 92%)}
/* службові кнопки — внизу картки, нікому не заважають */
.tools{position:absolute;right:1rem;bottom:.7rem;z-index:5;display:flex;gap:.4rem}
.tools .btn{min-height:0;padding:.2em .8em;font-size:.85rem;opacity:.85}
.stp,.ab{padding-bottom:2.8rem}
.st.num{font-size:2.8rem;line-height:1.1;margin:0 0 .3rem;color:var(--accD)}
.ext{text-align:center}
.ext:empty{display:none}
.ext .def{text-align:left}
.ext .rw.t{font-size:1.4rem;margin-bottom:.4rem}
</style>
</head>
<body>
<div id="app">
  <div id="callbar" hidden></div>
  <div id="stagewrap"></div>
  <div id="nav" class="nav" hidden>
    <button class="btn light" id="bBack">← Назад</button>
    <button class="dia" id="bDia" title="Методична картка"></button>
    <button class="dice" id="bDice" title="Викликати учня"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/></svg></button>
    <div id="candle"><div class="wax"></div><div id="ctip"></div></div>
    <button class="btn" id="bNext">Далі →</button>
  </div>
  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>
<button id="keyBtn" title="Для вчителя" aria-label="Для вчителя">🔑</button>
<div class="ov" id="ovMeta"><div class="mod" id="metaBox"></div></div>
<div class="ov" id="ovKey"><div class="mod" id="keyBox"></div></div>
<div class="ov" id="ovFin"><div class="mod finbox" id="finBox"></div></div>
<script>

/* ---- спільні дрібниці ---- */
const C1='#7048e8',C2='#d6336c';

/* ---- актуалізація: 3 типи запитань, один правильний варіант ---- */
let warmPrev='';
function mcOf(q,expr,right,wrongs,hint){
  const seen=new Set([right]),w=[];
  shuffle(wrongs).forEach(x=>{if(!seen.has(x)&&w.length<3){seen.add(x);w.push(x);}});
  if(w.length<3)return null;
  return {q,expr,hint,options:shuffle([{h:right,ok:true}].concat(w.map(h=>({h,ok:false}))))};
}
function genWarm(){
  const t=pick(['mul','gcd','pow'].filter(x=>x!==warmPrev));warmPrev=t;
  const v=pick(['a','b','x','y','m','n','p','c']),V='<i>'+v+'</i>';
  if(t==='mul'){
    const c=rnd(2,9),k=rnd(2,9),neg=Math.random()<.5,s=neg?' − ':' + ',s2=neg?' + ':' − ';
    return mcOf('Виконайте множення',c+'('+V+s+k+')',c+V+s+c*k,[c+V+s+k,V+s+c*k,c+V+s2+c*k,c+V+s+(c+k)],'Множимо число на кожний член дужки.');
  }
  if(t==='gcd'){
    let p,q;do{p=rnd(2,7);q=rnd(2,7);}while(p===q||gcd(p,q)!==1);
    const g=rnd(2,6),a=Math.min(g*p,g*q),b=Math.max(g*p,g*q);
    return mcOf('Знайдіть найбільший спільний дільник чисел',a+' і '+b,String(g),['1',String(g*p*q),String(g*2),String(g+1),String(Math.abs(b-a))].filter(x=>x!==String(g)),'Найбільше число, на яке діляться обидва числа.');
  }
  const n=rnd(6,10),k=rnd(2,n-2),P=e=>V+sup(e);
  return mcOf('Закінчіть запис',P(n)+' = '+P(k)+' · …',P(n-k),[P(n+k),P(n-k+1),P(n-k-1),P(k)].filter(x=>x!==P(n-k)),'Показники при множенні степенів додаються.');
}
function mcWidget(gen){

    root.appendChild(el('div','ask',spec.q));root.appendChild(el('div','expr',spec.expr));

      b.onclick=()=>{
        if(done||b.disabled)return;
        if(o.ok){done=true;b.classList.add('ok');grid.classList.add('done');msg.className='msg ok';msg.textContent='Правильно!';burstAt(b);}
        else{b.classList.add('bad');b.disabled=true;msg.className='msg bad';msg.innerHTML='Неправильно. Спробуйте інший варіант.<span class="hint">'+spec.hint+'</span>';}
      };

    const bar=el('div','bar'),nb=el('button','btn light','Нове запитання ↻');nb.onclick=build;bar.appendChild(nb);root.appendChild(bar);

}

/* ---- множення зі стрілками «кожний на кожний» (як в уроці про множення многочленів) ---- */
const AC=['#7048e8','#d6336c','#1971c2','#2f9e44','#8a5a1c','#c2255c'];
const MK=['rgba(255,214,60,.5)','rgba(104,200,128,.42)','rgba(240,120,176,.34)','rgba(130,130,238,.32)'];
const mkd=(h,i)=>'<span class="mkd on" style="--c:'+MK[i%MK.length]+'">'+h+'</span>';
const varHTML=(v,e)=>'<i>'+v+'</i>'+(e>1?'<sup>'+e+'</sup>':'');
function termHTML(c,e,v){const a=Math.abs(c);if(e===0)return String(a);return (a===1?'':String(a))+varHTML(v,e);}
function arcBoard(ex,o){
  o=o||{};
  const v=ex.v,A=ex.A,B=ex.B,pairs=[],extra=o.extra||[];
  A.forEach((a,i)=>B.forEach((b,j)=>pairs.push([i,j])));
  const n=pairs.length,grp={},sumD={};
  const prod=k=>{const a=A[pairs[k][0]],b=B[pairs[k][1]];return [a[0]*b[0],a[1]+b[1]];};
  pairs.forEach((_,k)=>{const p=prod(k);(grp[p[1]]=grp[p[1]]||[]).push(k);sumD[p[1]]=(sumD[p[1]]||0)+p[0];});
  const degs=Object.keys(grp).map(Number).sort((a,b)=>b-a),multi=degs.filter(d=>grp[d].length>1),last=n+1,total=last+extra.length;
  const gidx={};multi.forEach((d,i)=>{gidx[d]=i;});
  let r=0,geo=null,shown=0;
  const root=el('div','ab'),wrap=el('div','abw'),NSV='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NSV,'svg'),row=el('div','exrow'),aEl=[],bEl=[];
  function factor(T,store){
    const w=el('span','fac');w.appendChild(el('span','pr','('));
    T.forEach((t,i)=>{
      const neg=t[0]<0,s=i===0?(neg?MINUS:''):(neg?MINUS:'+');
      if(s)w.appendChild(el('span',i===0?'':'sg',s));
      const b=el('span','tm',termHTML(t[0],t[1],v));store.push(b);w.appendChild(b);
    });
    w.appendChild(el('span','pr',')'));return w;
  }
  row.append(factor(A,aEl),factor(B,bEl));wrap.append(svg,row);
  const rows=el('div','rows'),ext=el('div','ext brd sm'),down=el('button','down','↓'),tools=el('div','tools');
  const bReset=el('button','btn light sm','↺ Спочатку'),bAll=el('button','btn light sm','Показати все');
  tools.append(bAll,bReset);
  root.append(wrap,rows,ext,down,tools);
  function renderRows(){
    let h='';
    if(r>0){
      const t=[];
      for(let k=0;k<Math.min(r,n);k++){
        const p=prod(k),mi=p[1] in gidx?gidx[p[1]]:-1,tm=termHTML(p[0],p[1],v);
        t.push('<span style="color:'+AC[k]+';font-weight:800">'+(k===0?(p[0]<0?MINUS:''):' '+(p[0]<0?MINUS:'+')+' ')+(mi>=0&&r>n?mkd(tm,mi):tm)+'</span>');
      }
      h+='<div class="rw"><span class="eq">=</span>'+t.join('')+'</div>';
    }
    if(r>n){
      let out='',first=true;
      degs.forEach(d=>{const c=sumD[d];if(!c)return;const tm=termHTML(c,d,v);
        out+=(first?(c<0?MINUS:''):' '+(c<0?MINUS:'+')+' ')+(d in gidx?mkd(tm,gidx[d]):tm);first=false;});
      h+='<div class="rw fin"><span class="eq">=</span>'+(first?'0':out)+'</div>';
    }
    rows.innerHTML=h;
    const k=Math.max(0,r-last);
    if(k<shown){ext.innerHTML='';shown=0;}
    for(;shown<k;shown++)ext.insertAdjacentHTML('beforeend',extra[shown]);
    down.style.display=r>=total?'none':'';
    bAll.disabled=r>=total;bReset.disabled=r===0;
  }
  function draw(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    if(!geo)return;
    svg.setAttribute('width',geo.W);svg.setAttribute('height',geo.H);
    const defs=document.createElementNS(NSV,'defs');
    AC.forEach((c,i)=>{
      const mk=document.createElementNS(NSV,'marker');
      mk.setAttribute('id','mk'+geo.uid+i);mk.setAttribute('markerUnits','userSpaceOnUse');mk.setAttribute('markerWidth',14);mk.setAttribute('markerHeight',14);
      mk.setAttribute('refX',7);mk.setAttribute('refY',7);mk.setAttribute('orient','auto');
      const pa=document.createElementNS(NSV,'path');pa.setAttribute('d','M1,1 L13,7 L1,13 z');pa.setAttribute('fill',c);
      mk.appendChild(pa);defs.appendChild(mk);
    });
    svg.appendChild(defs);
    for(let k=0;k<Math.min(r,n);k++){
      const g=geo.p[k],top=pairs[k][0]%2===0,j=pairs[k][1];
      const sx=g.ax+(j-(B.length-1)/2)*8,y0=top?g.at-3:g.ab+3,y1=top?g.bt-7:g.bb+7,dx=Math.abs(g.bx-sx);
      const h=Math.max(14,Math.min(geo.pad*0.85,16+dx*0.28)),d=top?-1:1;
      const path=document.createElementNS(NSV,'path');
      path.setAttribute('d','M '+sx+' '+y0+' C '+sx+' '+(y0+d*h*1.3)+', '+g.bx+' '+(y1+d*h*1.3)+', '+g.bx+' '+y1);
      path.setAttribute('fill','none');path.setAttribute('stroke',AC[k]);path.setAttribute('stroke-width',3);path.setAttribute('stroke-linecap','round');
      path.setAttribute('marker-end','url(#mk'+geo.uid+k+')');

    }
  }
  const uid=Math.random().toString(36).slice(2,7);
  function measure(){
    const wr=wrap.getBoundingClientRect();if(!wr.width)return;
    geo={uid,W:wr.width,H:wr.height,pad:parseFloat(getComputedStyle(wrap).paddingTop)||40,
      p:pairs.map(([i,j])=>{const a=aEl[i].getBoundingClientRect(),b=bEl[j].getBoundingClientRect();
        return {ax:a.left+a.width/2-wr.left,at:a.top-wr.top,ab:a.bottom-wr.top,bx:b.left+b.width/2-wr.left,bt:b.top-wr.top,bb:b.bottom-wr.top};})};

  down.onclick=()=>{if(r<total){r++;upd();look();}};

}

function clsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.names)){CLS.names=[...new Set(d.names.map(String))];CLS.st={};CLS.names.forEach(n=>{CLS.st[n]=(d.st&&d.st[n])||{called:0};});CLS.queue=(Array.isArray(d.queue)?d.queue:[]).filter(n=>CLS.names.includes(n));CLS.last=d.last||'';}}catch(e){}}
function clsSet(text){
  const names=[...new Set(text.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))],st={};
  names.forEach(n=>{st[n]=CLS.st[n]||{called:0};});
  const fresh=names.filter(n=>!CLS.names.includes(n));
  CLS.queue=CLS.queue.filter(n=>names.includes(n));
  fresh.forEach(n=>CLS.queue.splice(rnd(0,CLS.queue.length),0,n));
  CLS.names=names;CLS.st=st;clsSave();
}
function clsNext(){
  if(!CLS.names.length)return '';
  if(!CLS.queue.length){
    CLS.queue=shuffle(CLS.names);
    if(CLS.queue.length>1&&CLS.queue[0]===CLS.last){const j=rnd(1,CLS.queue.length-1);[CLS.queue[0],CLS.queue[j]]=[CLS.queue[j],CLS.queue[0]];}

}

  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
