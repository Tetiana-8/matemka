<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Контрольна робота. Одночлени та многочлени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#2A6592; --accD:#1F4E73; --acc2:#3887AF; --light:#DCE9F2; --panelL:#EAF2F7; --panelR:#F5F9FC; --line:#A8CADD;
  --ink:#173F5F; --txt:#1b3446; --muted:#5b7a91;
  --ok:#059669; --okbg:#ecfdf5; --bad:#dc2626; --badbg:#fef2f2; --warn:#d97706; --warnbg:#fffbeb;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);
  background:linear-gradient(135deg,#DCE9F2 0%,#A5C5DD 100%) fixed;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.m{font-family:"Times New Roman","Cambria Math",Times,serif;font-size:1.18em}
.m i,i{font-style:italic}
.op{padding:0 .26em}
sup{font-size:.68em;line-height:0;vertical-align:super}
.line.lw{display:block;line-height:2.3}
.lw .fld{margin:0 3px;vertical-align:middle}
.xs{display:inline-block;position:relative;top:-.62em;margin-left:.08em;line-height:1}
.xs .fld{font-size:.78em;width:2.6em;padding:3px 2px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .15em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}

/* початок */
.start{max-width:560px;margin:0 auto;padding:36px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100dvh;justify-content:center}
h1{margin:0;text-align:center;color:var(--ink);font-size:clamp(24px,5vw,36px);font-weight:900;text-wrap:balance}
.box{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(23,63,95,.14);border:1px solid var(--line)}
.who{display:flex;flex-direction:column;gap:12px}
.who label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.who input{font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--panelR)}
.who input:focus{border-color:var(--acc)}
.who input.err{border-color:var(--bad);background:var(--badbg)}
.msg{color:var(--bad);font-weight:700;text-align:center;min-height:1.3em}
.btn{border:0;border-radius:999px;padding:13px 30px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 5px 16px rgba(42,101,146,.32);min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.light{background:#fff;color:var(--acc);box-shadow:0 3px 10px rgba(23,63,95,.14);border:2px solid var(--line)}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sign{text-align:center;font-size:10px;color:#8a97a3;padding:10px 0 4px}

/* завдання */
.tscreen{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:8px 8px 6px;gap:6px}
.top{display:flex;flex-direction:column;gap:6px;padding:2px 4px}
.ttl{font-weight:900;color:var(--ink);font-size:17px}
.nums{display:flex;flex-wrap:wrap;gap:4px}
.nc{width:31px;height:31px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13px;color:var(--accD);padding:0}
.nc.part{background:var(--light)}
.nc.done{background:var(--acc);color:#fff;border-color:var(--acc)}
.nc.cur{border:3px solid var(--accD)}
.nc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.nc.mid{background:var(--warn);border-color:var(--warn);color:#fff}
.nc.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.card{flex:1;overflow:auto;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 6px 22px rgba(23,63,95,.13);border:1px solid var(--line);font-size:18px;line-height:1.5;-webkit-overflow-scrolling:touch}
.q{font-weight:700;margin-bottom:8px}
.step{margin:12px 0 6px}
.qmath{font-size:clamp(20px,3.4vw,28px);text-align:center;padding:6px 0;overflow-x:auto;white-space:nowrap}
.line{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:1;padding:10px 12px;font-size:16px;min-height:44px}

.fld{font:inherit;font-family:"Times New Roman",serif;font-size:1.05em;width:4.4em;text-align:center;border:2px solid var(--line);border-radius:10px;padding:5px 3px;background:var(--panelR);outline:none;color:var(--accD);font-weight:700}
.fld.sm{width:2.9em}
.fld:focus,.fld.active{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--light)}
.fld.ok{border-color:var(--ok);background:var(--okbg)}
.fld.bad{border-color:var(--bad);background:var(--badbg)}
.corr{display:inline-block;color:var(--ok);font-size:14px;font-weight:700;margin-left:6px}
.cols{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.col .t{font-size:20px;white-space:nowrap}

.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--panelR);border-radius:12px;padding:9px 12px;min-height:48px;font-size:19px;color:var(--txt)}
.opt .lt{font-weight:800;color:var(--acc);font-family:Nunito,sans-serif;font-size:16px;flex:0 0 auto}
.opt:hover{border-color:var(--acc2)}
.opt.chosen{border-color:var(--acc);background:var(--light)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.txt{font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--panelR);border-radius:12px;padding:8px 12px;font-size:21px;min-height:44px;color:var(--txt)}
.chip.sel.y{background:rgba(250,204,21,.5);border-color:#eab308}
.chip.sel.g{background:rgba(74,222,128,.5);border-color:#22a55a}
.chip.right{outline:3px solid var(--ok)}
.chip.wrong{outline:3px solid var(--bad)}

.mrows{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mexpr{font-size:22px;white-space:nowrap}
.cell{min-width:96px;min-height:54px;border:2px dashed var(--acc2);background:var(--panelR);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:4px}
.cell.over{border-style:solid;border-color:var(--acc);background:var(--light)}
.cell.ok{border:2px solid var(--ok);background:var(--okbg)}
.cell.bad{border:2px solid var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;background:var(--light);border:2px solid var(--line);min-height:60px;margin-top:6px}
.chipd{background:#fff;border:2px solid var(--acc2);border-radius:10px;padding:7px 12px;font-size:20px;white-space:nowrap;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chipd.sel{box-shadow:0 0 0 3px var(--acc);}
.chipd.stat{cursor:default}
.chipd.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.25)}

/* екранна клавіатура */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:rgba(255,255,255,.7);border-radius:14px}
.kb button{height:44px;border:0;border-radius:10px;background:#fff;color:var(--accD);font-weight:800;font-size:20px;box-shadow:0 1px 4px rgba(23,63,95,.2);touch-action:manipulation}
.kb button.fn{background:var(--light)}
.kb button.go{background:var(--acc);color:#fff}
.kb .w2{grid-column:span 2}
.kb button i{font-family:"Times New Roman",serif;font-size:22px}
.kb button sup{font-size:.6em}
.exprwrap{position:sticky;bottom:-16px;background:#fff;padding:8px 0 10px;z-index:2}
.expr{min-height:56px;border:2px solid var(--acc);border-radius:12px;background:#fff;padding:8px 12px;font-size:26px;display:flex;align-items:center;flex-wrap:wrap;box-shadow:0 0 0 3px var(--light);color:var(--accD)}
.expr .ph{color:#9db3c4;font-size:16px;font-family:Nunito,sans-serif}
.expr .car{display:inline-block;width:2px;height:1.1em;background:var(--acc);margin-left:2px;animation:bl 1s steps(2) infinite}
.expr.ok{border-color:var(--ok);background:var(--okbg);box-shadow:none}
.expr.bad{border-color:var(--bad);background:var(--badbg);box-shadow:none}
@keyframes bl{50%{opacity:0}}

/* перед здачею / результат */
.page{max-width:720px;margin:0 auto;padding:22px 14px 28px;display:flex;flex-direction:column;gap:14px}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grid .nc{width:44px;height:44px;font-size:16px}
.big{font-size:clamp(44px,12vw,72px);font-weight:900;color:var(--acc);line-height:1.05}
.res{text-align:center}
.res p{margin:6px 0;font-size:18px}
.gradeb{display:inline-block;margin:6px 0;padding:8px 22px;border-radius:999px;background:var(--light);color:var(--accD);font-weight:900;font-size:24px;border:2px solid var(--line)}
.shot{border:2px dashed var(--acc2);border-radius:14px;padding:10px 14px;background:var(--panelR);font-weight:700;color:var(--accD);margin-top:10px}
.warncard{background:#fff8e1;border:2px solid #f4c862;border-radius:14px;padding:12px 16px;text-align:left;font-size:16px;margin-top:10px}
.revbar{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-right:46px}
.revmark{font-weight:800}
.revmark.ok{color:var(--ok)}.revmark.mid{color:var(--warn)}.revmark.bad{color:var(--bad)}

/* вчитель */
.key{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.65);font-size:18px;z-index:40;padding:0}
.key:hover{background:#fff}
.modal{position:fixed;inset:0;background:rgba(23,63,95,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;z-index:60;overflow:auto}
.panel{background:#fff;border-radius:16px;padding:18px;width:min(1180px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.panel.small{width:min(380px,100%);margin-top:60px}
.panel h2{margin:0 0 10px;font-size:21px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
th{background:var(--panelL)}
td.nm{text-align:left;cursor:pointer;color:var(--accD);font-weight:700}
td.y{color:var(--ok);font-weight:800}td.n{color:var(--bad);font-weight:800}td.h{color:var(--warn);font-weight:800}
td.red{color:var(--bad);font-weight:800}
tr.det td{white-space:normal;text-align:left;background:var(--panelR)}
.det table td,.det table th{white-space:normal}
.small{font-size:13px;color:var(--muted)}
@media (max-width:560px){.card{padding:12px 12px;font-size:17px}.nc{width:28px;height:28px}}
</style>
</head>
<body>
<button class="key" id="keyBtn" title="Для вчителя">🔑</button>
<div id="app"></div>

<div class="modal hidden" id="lgModal">
  <div class="panel small">
    <h2>Пароль</h2>
    <div class="row"><input type="password" id="pwd" autocomplete="off" style="width:100%"></div>
    <div class="small" id="pwdMsg" style="min-height:1.2em;color:#dc2626"></div>
    <div class="row"><button class="btn" id="pwdGo" style="padding:9px 22px;font-size:15px">Увійти</button><button class="btn light" id="pwdNo" style="padding:9px 22px;font-size:15px">Скасувати</button></div>
  </div>
</div>
<div class="modal hidden" id="jrModal">
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h2>Результати учнів</h2><button class="btn light" id="jrClose" style="padding:7px 18px;font-size:15px">Закрити</button></div>
    <div class="row">
      <button class="btn light" id="jrRef" style="padding:7px 16px;font-size:14px">Оновити</button>
      <button class="btn light" id="jrCsv" style="padding:7px 16px;font-size:14px">Завантажити CSV</button>
      <button class="btn light" id="jrClr" style="padding:7px 16px;font-size:14px">Очистити</button>
      <span class="small" id="jrInfo"></span>
    </div>
    <div id="jrConfirm" class="row hidden"><b id="jrConfTxt"></b><button class="btn" id="jrYes" style="padding:7px 16px;font-size:14px">Так, видалити</button><button class="btn light" id="jrNo" style="padding:7px 16px;font-size:14px">Скасувати</button></div>
    <div class="tbl" id="jrTbl"></div>
  </div>
</div>

<script>
(function(){ "use strict";

/*GEN-START*/
var MINUS='−';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=Math.random;
function seedRng(s){R=mulberry32(s>>>0);}
function ri(a,b){return a+Math.floor(R()*(b-a+1));}
function pick(arr){return arr[Math.floor(R()*arr.length)];}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(R()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sgnr(){return R()<0.5?-1:1;}

function plain(h){return String(h)
  .replace(/<span class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'($1)/($2)')
  .replace(/<sup>(.*?)<\/sup>/g,'^$1')
  .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();}
function V(ch){return '<i>'+ch+'</i>';}
function sup(e){return e===1?'':'<sup>'+e+'</sup>';}
function vpart(vars){return vars.filter(function(p){return p[1]>0;}).map(function(p){return V(p[0])+sup(p[1]);}).join('');}
function num(n){return String(n).replace('-',MINUS).replace('.',',');}
function absTerm(c,vars){var a=Math.abs(c),vp=vpart(vars);return (a===1&&vp)?vp:(num(a)+vp);}
function termHTML(c,vars,first){var t=absTerm(c,vars);if(first)return (c<0?MINUS:'')+t;return '<span class="op">'+(c<0?MINUS:'+')+'</span>'+t;}
function polyHTML(terms){var out='',first=true;terms.forEach(function(t){if(t[0]===0)return;out+=termHTML(t[0],t[1],first);first=false;});return out||'0';}
function frac(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';}
function EQ(){return '<span class="op">=</span>';}
function DOT(){return '<span class="op">·</span>';}
function M(h){return '<span class="m">'+h+'</span>';}
var PAIRS=[['a','b'],['x','y'],['m','n'],['p','q'],['c','d'],['k','m']];
var LETTERS=['x','a','y','m','n','b','c'];

/* ---- частини завдання ---- */
function numPart(v,w,cls){return {k:'num',v:v,w:w,cls:cls||''};}
function distinctPlain(arr){var s={};for(var i=0;i<arr.length;i++){var p=plain(arr[i]);if(s[p])return false;s[p]=1;}return true;}
function choicePart(corH,wrH,w,txt){
  var all=[corH].concat(wrH);if(!distinctPlain(all))return null;
  var opts=shuffle(all.map(function(h,i){return {h:h,c:i===0?1:0};}));
  var ci=0;opts.forEach(function(o,i){if(o.c)ci=i;});
  return {k:'choice',opts:opts,ci:ci,w:w,txt:!!txt};
}
function exprStr(co,v){var out='';[2,1,0].forEach(function(d){var c=co[d];if(c===0)return;var a=Math.abs(c);var body=(d===0)?String(a):((a===1?'':String(a))+v+(d===2?'\u00b2':''));out+=(c<0?MINUS:(out?'+':''))+body;});return out;}
function parseExpr(s,v){
  s=String(s||'').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2').replace(/\s+/g,'');
  if(!s)return null;
  var terms=s.split(/(?=[+-])/),c=[0,0,0],seen=[false,false,false];
  for(var i=0;i<terms.length;i++){
    var m=/^([+-]?)(\d*)(?:([a-z])(\^2)?)?$/.exec(terms[i]);
    if(!m)return null;
    if(m[2]===''&&!m[3])return null;
    if(m[3]&&m[3]!==v)return null;
    var deg=m[3]?(m[4]?2:1):0;
    if(seen[deg])return {dup:true};
    seen[deg]=true;
    var coef=m[2]===''?1:parseInt(m[2],10);if(coef===0)return null;if(m[1]==='-')coef=-coef;
    c[deg]=coef;
  }
  return {c:c};
}
function exprPart(co,v,w){return {k:'expr',v:v,co:co,w:w};}
function parseNum(s){s=String(s==null?'':s).replace(/−/g,'-').replace(',','.').trim();if(!/^-?\d+(\.\d+)?$/.test(s))return NaN;return parseFloat(s);}
function partFill(p,st){
  if(p.k==='num')return (st&&!isNaN(parseNum(st)))?1:0;
  if(p.k==='choice')return st!==null&&st!==undefined?1:0;
  if(p.k==='pick')return st&&st.length?1:0;
  if(p.k==='expr')return st&&st.length?1:0;
  if(p.k==='match'){var c=0;(st||[]).forEach(function(x){if(x!==null&&x!==undefined)c++;});return c/3;}
  return 0;
}
function partScore(p,st){
  if(p.k==='num'){var n=parseNum(st);return (!isNaN(n)&&Math.abs(n-p.v)<1e-9)?1:0;}
  if(p.k==='choice')return st===p.ci?1:0;
  if(p.k==='pick'){var a=(st||[]).slice().sort(),b=p.set.slice().sort();return (a.length===b.length&&a.every(function(x,i){return x===b[i];}))?1:0;}
  if(p.k==='expr'){var r=parseExpr(st,p.v);if(!r||r.dup)return 0;var n=0;for(var d=0;d<3;d++)if(r.c[d]===p.co[d])n++;return n/3;}
  if(p.k==='match'){var c=0;for(var i=0;i<3;i++)if(st&&st[i]===p.ci[i])c++;return c/3;}
  return 0;
}
function corrState(p){
  if(p.k==='num')return num(p.v);
  if(p.k==='choice')return p.ci;
  if(p.k==='pick')return p.set.slice();
  if(p.k==='expr')return exprStr(p.co,p.v);
  if(p.k==='match')return p.ci.slice();
}
function initState(p){
  if(p.k==='num')return '';
  if(p.k==='choice')return null;
  if(p.k==='pick')return [];
  if(p.k==='expr')return '';
  return [null,null,null];
}
function ansText(p,st){
  if(p.k==='num')return st?String(st):'—';
  if(p.k==='choice')return (st===null||st===undefined)?'—':plain(p.opts[st].h);
  if(p.k==='pick')return (st&&st.length)?st.slice().sort(function(a,b){return a-b;}).map(function(i){return plain(p.items[i].h);}).join(', '):'—';
  if(p.k==='expr')return st?String(st).replace(/\u00b2/g,'^2'):'\u2014';
  if(p.k==='match')return [0,1,2].map(function(i){return (st&&st[i]!==null&&st[i]!==undefined)?plain(p.pool[st[i]]):'—';}).join(' ; ');
}
function corrText(p){return ansText(p,corrState(p));}
function taskFrac(t,st){var sw=0,sc=0;t.parts.forEach(function(p,i){sw+=p.w;sc+=p.w*partScore(p,st[i]);});return sc/sw;}
function taskFill(t,st){var all=true,any=false;t.parts.forEach(function(p,i){var f=partFill(p,st[i]);if(f<1)all=false;if(f>0)any=true;});return all?2:(any?1:0);}

/* ---- завдання ---- */
function g1(){ // одночлен
  var pr=pick(PAIRS),u=pr[0],v=pr[1];
  var c=ri(2,9)*sgnr();
  var cor=termHTML(c,[[u,ri(1,3)],[v,ri(2,4)]],true);
  var types=shuffle([0,1,2,3]).slice(0,3),wr=[];
  types.forEach(function(t){

    co.push(t.parts.map(function(p){return corrText(p);}).join(' | '));
  });
  var score=Math.round(sc),percent=Math.round(sc);
  S.checked=true;
  S.res={score:score,percent:percent,grade:grade12(sc),leaves:W.leaves};
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:S.sur+' '+S.nam,surname:S.sur,firstName:S.nam,
    ts:now,date:new Date(now).toISOString(),
    score:score,max:100,percent:percent,grade:S.res.grade,tasks:marks,weights:weights,
    qtext:qt,answers:an,correct:co,
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,exits:W.log.slice(),taskSec:S.taskSec.slice(),
    variant:S.seed,test:TEST_NAME
  });
  S.screen='result';render();
}

/* ---- введення чисел ---- */
function sanitize(s){
  s=String(s).replace(/-/g,MINUS).replace(/\./g,',');
  var neg=s.charAt(0)===MINUS;s=s.replace(/[^0-9,]/g,'');
  var i=s.indexOf(',');if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,'');
  s=(neg?MINUS:'')+s;return s.slice(0,8);
}
function setNum(pi,val,el){
  S.ans[S.cur][pi]=val;
  if(el)el.value=val;
  refreshNums();
}
function nextField(){
  var fs=[].slice.call(document.querySelectorAll('.fld:not([disabled])'));
  var i=fs.findIndex(function(f){return +f.dataset.p===S.activeP;});
  if(i>=0&&i<fs.length-1){fs[i+1].focus();return true;}
  return false;
}
document.addEventListener('input',function(e){
  var f=e.target.closest&&e.target.closest('.fld');if(!f||S.screen!=='task')return;
  var v=sanitize(f.value);f.value=v;S.ans[S.cur][+f.dataset.p]=v;refreshNums();
});
document.addEventListener('focusin',function(e){
  var f=e.target.closest&&e.target.closest('.fld');if(!f||S.screen!=='task')return;
  S.activeP=+f.dataset.p;document.querySelectorAll('.fld.active').forEach(function(x){x.classList.remove('active');});f.classList.add('active');
});
document.addEventListener('keydown',function(e){
  if(S.screen!=='task')return;
  if(kbMode(S.cur)==='expr'&&!(e.target.closest&&e.target.closest('input'))){
    var k=e.key,m=null,ep=exprPartOf(S.cur);
    if(/^\d$/.test(k))m=k;else if(k==='+')m='+';else if(k==='-'||k===MINUS)m=MINUS;else if(k==='Backspace')m='\u232b';else if(ep&&k.toLowerCase()===ep.v)m='v';
    if(m){e.preventDefault();exprKey(m);return;}
  }
  var inF=e.target.closest&&e.target.closest('.fld');
  if(e.key==='Enter'&&inF){e.preventDefault();if(!nextField()&&S.ans[S.cur][+inF.dataset.p]){if(S.cur<S.tasks.length-1)go(S.cur+1);else{flushTask();S.screen='pre';render();}}return;}
  if(!inF&&!(e.target.tagName==='INPUT')){
    if(e.key==='ArrowRight'){if(S.cur<S.tasks.length-1)go(S.cur+1);}
    if(e.key==='ArrowLeft'){if(S.cur>0)go(S.cur-1);}
  }
});
function exprKey(key){
  var ti=S.cur,p=exprPartOf(ti);if(!p)return;var pi=S.tasks[ti].parts.indexOf(p);
  var cur=String(S.ans[ti][pi]||''),last=cur.slice(-1);
  var isSign=function(c){return c==='+'||c===MINUS;},isVar=function(c){return c===p.v||c==='\u00b2';};
  if(key==='\u232b')cur=cur.slice(0,-1);
  else if(key==='clr')cur='';
  else if(key==='+'||key===MINUS){if(!cur&&key==='+')return;if(isSign(last))cur=cur.slice(0,-1);cur+=key;}
  else if(key==='v'||key==='v2'){if(isVar(last))return;cur+=p.v+(key==='v2'?'\u00b2':'');}
  else{if(isVar(last))return;cur+=key;}
  if(cur.length>24)return;
  S.ans[ti][pi]=cur;renderCard();
}
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('[data-key]');if(!b)return;
  e.preventDefault();
  var key=b.dataset.key;
  if(S.screen==='task'&&kbMode(S.cur)==='expr'){exprKey(key);return;}
  var pi=S.activeP;
  if(key==='next'){if(!nextField()){/* остання клітинка */}return;}
  if(pi===null||pi===undefined)return;
  var el=$('.fld[data-p="'+pi+'"]'),cur=String(S.ans[S.cur][pi]||'');
  if(key==='⌫')cur=cur.slice(0,-1);
  else if(key===MINUS)cur=(cur.charAt(0)===MINUS)?cur.slice(1):MINUS+cur;
  else if(key===','){if(cur.indexOf(',')<0&&/\d$/.test(cur))cur+=',';}
  else cur+=key;
  cur=sanitize(cur);
  setNum(pi,cur,el);
  if(el){el.dispatchEvent(new Event('input',{bubbles:true}));}
});

/* ---- кліки ---- */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='start')return startTest();
  if(a==='go'){if(S.screen==='task'||S.screen==='review'||S.screen==='pre'){return go(+t.dataset.n);}}
  if(a==='next'){
    if(S.cur<S.tasks.length-1)return go(S.cur+1);
    if(S.screen==='review'){S.screen='result';return render();}
    flushTask();S.screen='pre';return render();
  }
  if(a==='prev'){if(S.cur>0)go(S.cur-1);return;}
  if(a==='prev2'){S.screen='task';S.cur=S.tasks.length-1;S.tEnter=0;return render();}
  if(a==='check')return check();
  if(a==='errors'){var f=0;for(var i=0;i<S.tasks.length;i++){if(taskFrac(S.tasks[i],S.ans[i])<0.999){f=i;break;}}S.cur=f;S.screen='review';return render();}
  if(a==='toresult'){S.screen='result';return render();}
  if(a==='again'){newTest();S.started=true;resetWatch();S.screen='task';S.tEnter=0;return render();}
  if(S.screen!=='task')return;
  var pi=+t.dataset.p,st=S.ans[S.cur];
  if(a==='opt'){st[pi]=+t.dataset.i;return renderCard();}
  if(a==='chip'){var i2=+t.dataset.i,ar=st[pi],x=ar.indexOf(i2);if(x>=0)ar.splice(x,1);else ar.push(i2);return renderCard();}
});

/* ---- перетягування ---- */
var drag=null;
function putChip(pi,idx,k){var st=S.ans[S.cur][pi],p=st.indexOf(idx);if(p>=0)st[p]=null;if(k>=0)st[k]=idx;S.sel=null;renderCard();}
document.addEventListener('pointerdown',function(e){
  if(S.screen!=='task')return;
  var c=e.target.closest&&e.target.closest('.chipd');if(!c||c.classList.contains('stat'))return;
  var w=c.closest('.mwrap');if(!w)return;
  e.preventDefault();
  drag={pi:+w.dataset.mp,idx:+c.dataset.idx,sx:e.clientX,sy:e.clientY,moved:false,ghost:null,el:c};
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){
    drag.moved=true;var g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=drag.el.offsetWidth+'px';document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.35';
  }
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+'px';
    document.querySelectorAll('.cell.over').forEach(function(x){x.classList.remove('over');});
    var u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest('.cell');if(cl)cl.classList.add('over');
  }
});
function endDrag(e){
  if(!drag)return;var d=drag;drag=null;if(d.ghost)d.ghost.remove();
  document.querySelectorAll('.cell.over').forEach(function(x){x.classList.remove('over');});
  if(d.moved){
    var u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest('.cell');
    if(cl)putChip(d.pi,d.idx,+cl.dataset.cell);
    else if(u&&u.closest('.pool'))putChip(d.pi,d.idx,-1);
    else renderCard();
  } else if(d.el.parentNode.classList.contains('cell')){putChip(d.pi,d.idx,-1);}
  else{S.sel=(S.sel&&S.sel.p===d.pi&&S.sel.idx===d.idx)?null:{p:d.pi,idx:d.idx};renderCard();}
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
document.addEventListener('click',function(e){
  if(S.screen!=='task'||!S.sel)return;
  var cl=e.target.closest&&e.target.closest('.cell');if(!cl)return;
  var w=cl.closest('.mwrap');if(!w||+w.dataset.mp!==S.sel.p)return;
  putChip(S.sel.p,S.sel.idx,+cl.dataset.cell);
});

/* ---- журнал вчителя ---- */
var jrRows=[];
function fmtMs(sec){sec=Math.round(sec||0);return Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2);}
$('#keyBtn').addEventListener('click',function(){$('#pwd').value='';$('#pwdMsg').textContent='';$('#lgModal').classList.remove('hidden');$('#pwd').focus();});
$('#pwdNo').addEventListener('click',function(){$('#lgModal').classList.add('hidden');});
async function doLogin(){
  var ok=await teacherLogin($('#pwd').value);
  if(!ok){$('#pwdMsg').textContent='Неправильний пароль';return;}
  $('#lgModal').classList.add('hidden');$('#jrModal').classList.remove('hidden');refreshJr();
}
$('#pwdGo').addEventListener('click',doLogin);
$('#pwd').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('#jrClose').addEventListener('click',function(){$('#jrModal').classList.add('hidden');teacherLogout();});
$('#jrRef').addEventListener('click',refreshJr);
async function refreshJr(){
  var info=$('#jrInfo');info.textContent='Завантаження…';
  try{jrRows=await loadResults();info.textContent='Записів: '+jrRows.length;drawJr();}
  catch(e){info.textContent='Не вдалося підключитися до бази результатів';}
}
function drawJr(){
  var mx=0;jrRows.forEach(function(r){mx=Math.max(mx,(r.tasks||[]).length);});
  var h='<table><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал (з 100)</th><th>Оцінка (з 12)</th>';
  for(var i=1;i<=mx;i++)h+='<th>'+i+'</th>';h+='</tr></thead><tbody>';
  jrRows.forEach(function(r,k){
    var d=r.date?new Date(r.date).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
    var tm=(r.durationSec==null)?'—':fmtMs(r.durationSec),tr=(r.durationSec!=null&&r.durationSec<120)?' red':'';
    var lv=(r.leaves==null)?'—':r.leaves,lr=(r.leaves>=3)?' red':'';
    h+='<tr><td>'+(k+1)+'</td><td class="nm" data-det="'+k+'">'+esc(r.name)+'</td><td>'+d+'</td><td class="'+tr.trim()+'" title="'+(tr?'Дуже швидко':'')+'">'+tm+'</td><td class="'+lr.trim()+'" title="Поза вікном: '+fmtMs(r.awaySec)+'">'+lv+'</td><td><b>'+esc(r.score)+'</b></td><td>'+(r.grade==null?'—':r.grade)+'</td>';
    for(var i2=0;i2<mx;i2++){var v=(r.tasks||[])[i2];h+=(v==null)?'<td>—</td>':(v>=0.999?'<td class="y">✓</td>':(v>0?'<td class="h">'+Math.round(v*100)/100+'</td>':'<td class="n">✗</td>'));}
    h+='</tr><tr class="det hidden" id="det'+k+'"><td colspan="'+(7+mx)+'"></td></tr>';
  });
  $('#jrTbl').innerHTML=h+'</tbody></table>';
}
$('#jrTbl').addEventListener('click',function(e){
  var td=e.target.closest('[data-det]');if(!td)return;
  var k=+td.dataset.det,row=$('#det'+k),r=jrRows[k];
  if(!row.classList.contains('hidden')){row.classList.add('hidden');return;}
  var h='<div class="small">Виходів: '+(r.leaves==null?'—':r.leaves)+', поза вікном: '+fmtMs(r.awaySec)+(r.exits&&r.exits.length?' (кожен вихід, с: '+r.exits.join(', ')+')':'')+'. Варіант: '+esc(r.variant)+'</div><table><thead><tr><th>№</th><th>Завдання</th><th>Відповідь учня</th><th>Правильна</th><th>Бал</th><th>Час, с</th></tr></thead><tbody>';
  (r.tasks||[]).forEach(function(v,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc((r.qtext||[])[i])+'</td><td>'+esc((r.answers||[])[i])+'</td><td>'+esc((r.correct||[])[i])+'</td><td>'+(v>=0.999?'✓ ':(v>0?'½ ':'✗ '))+((r.weights&&r.weights[i]!=null)?(Math.round(v*r.weights[i]*10)/10)+' з '+r.weights[i]:'')+'</td><td>'+esc((r.taskSec||[])[i]==null?'—':(r.taskSec||[])[i])+'</td></tr>';});
  row.firstChild.innerHTML=h+'</tbody></table>';row.classList.remove('hidden');
});
$('#jrCsv').addEventListener('click',function(){
  var mx=0;jrRows.forEach(function(r){mx=Math.max(mx,(r.tasks||[]).length);});
  var head=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (з 100)','Оцінка (з 12)'];for(var i=1;i<=mx;i++)head.push('Завд. '+i);
  var lines=[head.join(';')];
  jrRows.forEach(function(r){
    var row=['"'+String(r.name).replace(/"/g,'""')+'"',r.date||'',r.durationSec==null?'':fmtMs(r.durationSec),r.leaves==null?'':r.leaves,r.awaySec==null?'':fmtMs(r.awaySec),r.score,r.grade==null?'':r.grade];
    for(var i2=0;i2<mx;i2++){var v=(r.tasks||[])[i2];row.push(v==null?'':(v>=0.999?'+':(v>0?String(Math.round(v*100)/100).replace('.',','):'-')));}
    lines.push(row.join(';'));
  });
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Одночлени_многочлени_7клас_результати.csv';document.body.appendChild(a);a.click();a.remove();
});
$('#jrClr').addEventListener('click',function(){$('#jrConfTxt').textContent='Видалити всі записи ('+jrRows.length+')?';$('#jrConfirm').classList.remove('hidden');});
$('#jrNo').addEventListener('click',function(){$('#jrConfirm').classList.add('hidden');});
$('#jrYes').addEventListener('click',async function(){
  $('#jrConfirm').classList.add('hidden');
  try{await clearResults();await refreshJr();}catch(e){$('#jrInfo').textContent='Не вдалося очистити записи. Перевірте правила бази Firebase';}
});

newTest();render();
})();
</script>
</body>
