<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тест. Формули скороченого множення (8 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--acc:#2A6592;--accD:#1F4E73;--acc2:#3887AF;--accL:#DCE9F2;--soft:#EAF2F7;--soft2:#F5F9FC;--line:#A8CADD;--ttl:#173F5F;
--ok:#1f9d55;--okL:#e3f5ea;--bad:#d64545;--badL:#fdeaea;--warn:#e08a00;--warnL:#fff4de;
--c1:#e8590c;--c2:#7048e8;--c3:#2f9e44;--cA:#1971c2;--cB:#d6336c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1c2b3a;background:linear-gradient(135deg,#DCE9F2 0%,#A5C5DD 100%) fixed;min-height:100vh;display:flex;flex-direction:column;touch-action:manipulation}
#app{width:100%;max-width:960px;margin:0 auto;padding:10px 12px 0;flex:1}
h1{margin:6px 0 8px;font-size:clamp(20px,3.4vw,30px);color:var(--ttl);text-align:center;font-weight:800}
.m{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.18em;line-height:1.5}
.m i{font-style:italic}
sup{font-size:.68em;line-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px}
.tab{border:2px solid var(--line);background:#fff;color:var(--accD);border-radius:12px;padding:9px 16px;font:800 16px Nunito,sans-serif;cursor:pointer;min-height:44px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 18px rgba(31,78,115,.14);margin-bottom:12px}
.card.soft{background:var(--soft2)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--line);background:var(--soft2);color:var(--accD);border-radius:999px;padding:7px 13px;font:700 15px Nunito,sans-serif;cursor:pointer;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;border-radius:12px;background:var(--acc);color:#fff;font:800 16px Nunito,sans-serif;padding:10px 20px;cursor:pointer;min-height:46px}
.btn:hover{background:var(--accD)}
.btn.light{background:var(--accL);color:var(--accD)}
.btn.light:hover{background:#c9dcea}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:7px 14px;min-height:40px;font-size:15px}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sp{flex:1}
.banner{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;font-size:clamp(22px,4.4vw,34px);margin-bottom:12px}
.cA{color:var(--cA);font-weight:600}.cB{color:var(--cB);font-weight:600}
.bt{border-radius:7px;padding:1px 4px;margin:0 -1px;transition:background .25s}
.bt.c1.on{background:#ffd9bf}.bt.c2.on{background:#dccffb}.bt.c3.on{background:#c9ecd2}
.starlbl{display:inline-block;background:var(--warnL);color:#8a5a00;font-weight:800;border-radius:999px;padding:3px 12px;margin-bottom:4px}
.c1{color:var(--c1);font-weight:600}.c2{color:var(--c2);font-weight:600}.c3{color:var(--c3);font-weight:600}
.ex{font-size:clamp(22px,4vw,32px);margin:8px 0 6px}
.rowx{display:flex;align-items:center;gap:12px;margin:6px 0;padding:6px 10px;border-radius:10px;background:var(--soft2);animation:fi .35s}
.rowx .arr{font-size:1.1em;font-weight:700}
.fin{margin-top:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.warn{background:var(--badL);border-radius:10px;padding:8px 12px;margin:10px 0;color:#8f2020;font-size:18px}
.rule{font-size:clamp(20px,3.2vw,28px);line-height:1.5}
.rule b{font-weight:800}
.rule .it{margin:12px 0;padding:12px 14px;border-left:6px solid var(--acc2);background:var(--soft2);border-radius:10px}
.q{font-size:clamp(20px,3.6vw,28px);margin:6px 0 12px}
.fld{width:3.1em;max-width:22vw;text-align:center;font:600 1em 'STIX Two Text','Times New Roman',serif;border:2px solid var(--line);border-radius:10px;padding:4px 2px;margin:0 3px;background:#fff;color:#173F5F;outline:none;vertical-align:baseline}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accL)}
.fld.ok{border-color:var(--ok);background:var(--okL)}.fld.bad{border-color:var(--bad);background:var(--badL)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:1.25em;cursor:pointer;min-height:48px}
.opt b{font:800 16px Nunito,sans-serif;color:var(--acc);min-width:1.4em}
.opt.sel{border-color:var(--acc);background:var(--accL)}
.opt.ok{border-color:var(--ok);background:var(--okL)}.opt.bad{border-color:var(--bad);background:var(--badL)}
.msg{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:700}
.msg.ok{background:var(--okL);color:#146c3a}.msg.bad{background:var(--badL);color:#8f2020}.msg.hint{background:var(--accL);color:var(--accD)}
.sol{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft2);border:1px dashed var(--line);font-size:1.05em}
.stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--accD);font-weight:700;margin:6px 0 10px}
.stat span{background:var(--accL);border-radius:999px;padding:4px 12px}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.num{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);background:#fff;font:800 15px Nunito,sans-serif;color:var(--accD);cursor:pointer}
.num.fill{background:var(--acc);border-color:var(--acc);color:#fff}
.num.cur{border-width:4px}
.num.r{background:var(--ok);border-color:var(--ok);color:#fff}.num.w{background:var(--bad);border-color:var(--bad);color:#fff}
.field{width:100%;max-width:340px;font:700 18px Nunito,sans-serif;padding:11px 12px;border:2px solid var(--line);border-radius:12px;margin:5px 0;outline:none}
.field.err{border-color:var(--bad);background:var(--badL)}
.big{font-size:clamp(34px,8vw,60px);font-weight:800;color:var(--acc);text-align:center;line-height:1.1}
.shot{margin:12px auto;max-width:460px;border:2px dashed var(--acc2);border-radius:12px;padding:10px;text-align:center;color:var(--accD);font-weight:700;background:var(--soft2)}
.leaves{margin:10px 0;padding:10px 14px;border-radius:12px;background:#fff8dc;border:1px solid #ecd58a;color:#6b5400}
.sig{text-align:center;color:#8a95a3;font-size:10px;padding:14px 0 12px}
#keyBtn{position:fixed;top:6px;right:6px;z-index:900;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.55);opacity:.55;font-size:16px;cursor:pointer}
#keyBtn:hover{opacity:1}
#kbd{display:none;position:sticky;bottom:0;z-index:800;background:#dfe6ee;border-top:1px solid #aeb7c4;padding:6px 6px calc(6px + env(safe-area-inset-bottom));margin:0}
#kbd.show{display:block}
#kbd .kr{display:flex;gap:5px;margin-bottom:5px;justify-content:center}
#kbd .kr:last-child{margin-bottom:0}
#kbd button{flex:1;max-width:62px;height:44px;border:0;border-radius:9px;background:#fff;font:800 20px Nunito,sans-serif;color:#173F5F;box-shadow:0 1px 2px rgba(0,0,0,.25);touch-action:manipulation}
#kbd button:active{background:var(--accL)}
#kbd button.wide{max-width:96px}
.modal{position:fixed;inset:0;background:rgba(23,63,95,.45);z-index:2147483640;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
.modal .box{background:#fff;border-radius:16px;padding:16px;max-width:1000px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal .box.small{max-width:340px;margin-top:12vh}
.jt{width:100%;border-collapse:collapse;font-size:13px}
.jt th,.jt td{border:1px solid #cfd9e3;padding:4px 6px;text-align:center}
.jt td.nm{text-align:left;cursor:pointer;color:var(--acc);font-weight:700}
.jt th{background:var(--accL)}
.jt .r{color:var(--ok);font-weight:800}.jt .w{color:var(--bad);font-weight:800}
.jt .red{color:var(--bad);font-weight:800}
.jscroll{overflow:auto;max-height:62vh;margin-top:8px}
.det{text-align:left;background:var(--soft2);font-size:13px}
.det div{margin:2px 0}
.hide-pm #pm-panel,.hide-pm #pm-fab,.hide-pm #pm-ink,.hide-pm #pm-paper{display:none!important}
html.hide-pm.pm-dock-r,html.hide-pm.pm-dock-l{padding-left:0!important;padding-right:0!important}
@media(max-width:560px){#app{padding:6px 8px 0}.card{padding:12px}.tab{padding:8px 11px;font-size:15px}}
</style>
</head>
<body>
<div id="app">
  <h1>Тест. Формули скороченого множення (8 клас)</h1>
  <div class="tabs" id="tabs" hidden></div>
  <div id="screen"></div>
</div>
<div id="kbd"></div>
<div class="sig">Автор розробки <b>Ковтун Тетяна</b></div>
<button id="keyBtn" type="button" title="Журнал">🔑</button>
<div id="modalHost"></div>

<script>
(function(){ "use strict";

// ==GEN-START==
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
function setSeed(s){rnd=mulberry32(s>>>0);}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

// одночлен: c — коефіцієнт, v — {літера: степінь}
const M=(c,v)=>({c:c,v:v||{}});
const mul=(a,b)=>{const v=Object.assign({},a.v);for(const k in b.v)v[k]=(v[k]||0)+b.v[k];return M(a.c*b.c,v);};
const pw=(a,n)=>{const v={};for(const k in a.v)v[k]=a.v[k]*n;return M(Math.pow(a.c,n),v);};
const neg=a=>M(-a.c,a.v);
function vstr(a){return Object.keys(a.v).sort().map(k=>'<i>'+k+'</i>'+(a.v[k]>1?'<sup>'+a.v[k]+'</sup>':'')).join('');}
function mstr(a){const vs=vstr(a),c=a.c;if(!vs)return (c<0?'−':'')+Math.abs(c);if(c===1)return vs;if(c===-1)return '−'+vs;return (c<0?'−':'')+Math.abs(c)+vs;}
function simple(a){const ks=Object.keys(a.v);return ks.length===0?a.c>=0:(a.c===1&&ks.length===1&&a.v[ks[0]]===1);}
function wrap(a){return simple(a)?mstr(a):'('+mstr(a)+')';}
function pstr(ts){return ts.map((t,i)=>{const s=mstr(M(Math.abs(t.c),t.v));return i===0?(t.c<0?'−':'')+s:(t.c<0?' − ':' + ')+s;}).join('');}
function col(a,cls){return '<span class="'+cls+'">'+mstr(a)+'</span>';}
function Wc(a,cls){const s='<span class="'+cls+'">'+mstr(a)+'</span>';return simple(a)?s:'('+s+')';}
function cpoly(arr){return arr.map((p,i)=>{const m=p[0],s='<span class="'+p[1]+'">'+mstr(M(Math.abs(m.c),m.v))+'</span>';return i===0?(m.c<0?'−':'')+s:(m.c<0?' − ':' + ')+s;}).join('');}

const LET=['a','b','c','m','n','p','x','y'];
function pickAB(level,o){
  o=o||{};
  const u=pick(LET);let w;do{w=pick(LET);}while(w===u);
  const V=(l,p)=>{const r={};r[l]=p||1;return r;};
  let A,B;
  if(level===1){A=M(1,V(u));B=M(ri(2,o.maxB||9));}
  else if(level===2){A=M(ri(2,o.maxK||5),V(u));B=rnd()<0.6?M(ri(1,o.maxB||9)):M(ri(2,o.maxK2||5),V(w));}
  else{A=M(ri(1,o.maxK||6),V(u,o.p1?1:ri(1,2)));B=rnd()<0.45?M(ri(2,o.maxB||9)):M(ri(1,o.maxK2||5),V(w,o.p1?1:ri(1,2)));}
  return {A:A,B:B};
}
const F={ // формули (для підказок)
  sq1:'(<i>a</i> + <i>b</i>)<sup>2</sup> = <i>a</i><sup>2</sup> + 2<i>ab</i> + <i>b</i><sup>2</sup>',
  sq2:'(<i>a</i> − <i>b</i>)<sup>2</sup> = <i>a</i><sup>2</sup> − 2<i>ab</i> + <i>b</i><sup>2</sup>',
  dsq:'(<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>) = <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup>',
  cb1:'(<i>a</i> + <i>b</i>)(<i>a</i><sup>2</sup> − <i>ab</i> + <i>b</i><sup>2</sup>) = <i>a</i><sup>3</sup> + <i>b</i><sup>3</sup>',
  cb2:'(<i>a</i> − <i>b</i>)(<i>a</i><sup>2</sup> + <i>ab</i> + <i>b</i><sup>2</sup>) = <i>a</i><sup>3</sup> − <i>b</i><sup>3</sup>'
};
const m_=h=>'<span class="m">'+h+'</span>';
function hintAB(A,B,f){return 'Перший вираз <span class="m"><i>a</i> = '+mstr(A)+'</span>, другий <span class="m"><i>b</i> = '+mstr(B)+'</span>.<br><span class="m">'+f+'</span>';}
function mkChoice(g,q,right,wrongs,sol,hint){
  const seen={};seen[right]=1;const w=[];
  wrongs.forEach(x=>{if(!seen[x]){seen[x]=1;w.push(x);}});
  const all=shuffle([{h:right,ok:1}].concat(w.slice(0,3).map(h=>({h:h,ok:0}))));
  let ok=0;all.forEach((o,i)=>{if(o.ok)ok=i;});
  return {g:g,f:'choice',q:q,opts:all.map(o=>o.h),ok:ok,ans:[String(ok)],sol:sol,hint:hint};
}
function fillT(g,q,ans,sol,hint){return {g:g,f:'fill',q:q,ans:ans,sol:sol,hint:hint};}
const FLD=i=>'§'+i+'§';

function genSq(sign,level,form){
  const ab=pickAB(level),A=ab.A,B=ab.B;
  const A2=pw(A,2),B2=pw(B,2),AB=mul(A,B),mid=M(2*sign*AB.c,AB.v);
  const op=sign>0?' + ':' − ';
  const expr='('+mstr(A)+op+mstr(B)+')<sup>2</sup>';
  const res=[{c:A2.c,v:A2.v},{c:mid.c,v:mid.v},{c:B2.c,v:B2.v}];
  const sol=m_(expr+' = '+wrap(A)+'<sup>2</sup>'+op+'2·'+wrap(A)+'·'+wrap(B)+' + '+wrap(B)+'<sup>2</sup> = '+pstr(res));
  const hint=hintAB(A,B,sign>0?F.sq1:F.sq2);
  const g=sign>0?'sum':'dif';
  if(form==='choice'){
    const right=pstr(res);
    const wr=sign>0?[pstr([A2,B2]),pstr([A2,AB,B2]),pstr([A2,neg(mid),B2])]:[pstr([A2,neg(B2)]),pstr([A2,neg(mid),B2]),pstr([A2,neg(AB),B2])];
    return mkChoice(g,m_('Яка рівність правильна?<br>'+expr+' = ?'),right,wr,sol,hint);
  }
  const q=m_(expr+' = '+FLD(0)+vstr(A2)+' + '+FLD(1)+vstr(AB)+' + '+FLD(2)+vstr(B2));
  return fillT(g,q,[A2.c,mid.c,B2.c],sol,hint);
}
function genFsq(sign,level,form){
  const ab=pickAB(level),A=ab.A,B=ab.B;
  const A2=pw(A,2),B2=pw(B,2),AB=mul(A,B),mid=M(2*sign*AB.c,AB.v);
  const op=sign>0?' + ':' − ';
  const tri=pstr([A2,mid,B2]);
  const sq='('+mstr(A)+op+mstr(B)+')<sup>2</sup>';
  const sol=m_(tri+' = '+wrap(A)+'<sup>2</sup>'+op+'2·'+wrap(A)+'·'+wrap(B)+' + '+wrap(B)+'<sup>2</sup> = '+sq);
  const hint=hintAB(A,B,sign>0?F.sq1:F.sq2).replace('Перший вираз','Перший член — квадрат першого виразу. Перший вираз').replace(/<br>.*$/,'<br><span class="m">'+(sign>0?F.sq1:F.sq2)+'</span>');
  const g=sign>0?'sum':'dif';
  if(form==='choice'){
    const other='('+mstr(A)+(sign>0?' − ':' + ')+mstr(B)+')<sup>2</sup>';
    return mkChoice(g,m_('Подайте у вигляді квадрата двочлена:<br>'+tri),sq,[other,'('+mstr(A)+' − '+mstr(B)+')('+mstr(A)+' + '+mstr(B)+')','('+mstr(A)+op+mstr(M(2*B.c,B.v))+')<sup>2</sup>'],sol,hint);
  }
  if(level>=2&&rnd()<0.3){
    const q=m_('Доповніть до квадрата двочлена:<br>'+pstr([A2])+' + '+FLD(0)+vstr(AB)+' + '+mstr(B2)+' = '+sq);
    return fillT(g,q,[mid.c],sol,hint);
  }
  const q=m_(tri+' = ('+FLD(0)+vstr(A)+op+FLD(1)+vstr(B)+')<sup>2</sup>');
  return fillT(g,q,[A.c,B.c],sol,hint);
}
function genDsq(level,form){
  const ab=pickAB(level),A=ab.A,B=ab.B;
  const A2=pw(A,2),B2=pw(B,2),AB=mul(A,B);
  const expr=rnd()<0.5?'('+mstr(A)+' − '+mstr(B)+')('+mstr(A)+' + '+mstr(B)+')':'('+mstr(A)+' + '+mstr(B)+')('+mstr(A)+' − '+mstr(B)+')';
  const sol=m_(expr+' = '+wrap(A)+'<sup>2</sup> − '+wrap(B)+'<sup>2</sup> = '+pstr([A2,neg(B2)]));
  const hint=hintAB(A,B,F.dsq);
  if(form==='choice'){
    return mkChoice('dsq',m_('Яка рівність правильна?<br>'+expr+' = ?'),pstr([A2,neg(B2)]),[pstr([A2,B2]),pstr([A2,neg(M(2*AB.c,AB.v)),B2]),pstr([A2,M(2*AB.c,AB.v),neg(B2)])],sol,hint);
  }
  const q=m_(expr+' = '+FLD(0)+vstr(A2)+' − '+FLD(1)+vstr(B2));
  return fillT('dsq',q,[A2.c,B2.c],sol,hint);
}
function genFdsq(level,form){
  const ab=pickAB(level),A=ab.A,B=ab.B;
  const A2=pw(A,2),B2=pw(B,2);
  const ex=pstr([A2,neg(B2)]);
  const right='('+mstr(A)+' − '+mstr(B)+')('+mstr(A)+' + '+mstr(B)+')';
  const sol=m_(ex+' = '+wrap(A)+'<sup>2</sup> − '+wrap(B)+'<sup>2</sup> = '+right);
  const hint=hintAB(A,B,F.dsq).replace('Перший вираз','Квадрат першого виразу мінус квадрат другого. Перший вираз');
  if(form==='choice'){
    const B3=M(2*B.c,B.v);
    return mkChoice('dsq',m_('Розкладіть на множники:<br>'+ex),right,['('+mstr(A)+' − '+mstr(B)+')<sup>2</sup>','('+mstr(A)+' + '+mstr(B)+')<sup>2</sup>','('+mstr(A)+' − '+mstr(B3)+')('+mstr(A)+' + '+mstr(B3)+')'],sol,hint);
  }
  const q=m_(ex+' = ('+FLD(0)+vstr(A)+' − '+FLD(1)+vstr(B)+')('+FLD(2)+vstr(A)+' + '+FLD(3)+vstr(B)+')');
  return fillT('dsq',q,[A.c,B.c,A.c,B.c],sol,hint);
}
function cubeAB(level){return pickAB(level,{maxB:4,maxK:3,maxK2:3,p1:true});}
function genCube(sign,level){
  const ab=cubeAB(level),A=ab.A,B=ab.B;
  const A2=pw(A,2),B2=pw(B,2),AB=mul(A,B),A3=pw(A,3),B3=pw(B,3);
  const op=sign>0?' + ':' − ',op2=sign>0?' − ':' + ';
  const f2=pstr([A2,M(-sign*AB.c,AB.v),B2]);
  const expr='('+mstr(A)+op+mstr(B)+')('+f2+')';

function newTrain(){setSeed(Math.floor(Math.random()*4e9));P.task=genGroup(P.group,curLevel());P.ans=[];P.checked=false;P.res=null;P.hint=false;}
function taskInner(t,ans,res,locked,sel){
  let h='<div class="q">';
  if(t.f==='fill')h+=fieldsHtml(t.q,ans,res?res.per.map(p=>p?'ok':'bad'):null,locked);
  else h+=t.q;
  h+='</div>';
  if(t.f==='fill')h+='<div style="color:#6b7b8c;font-size:14px;margin:-4px 0 6px">Впишіть числа в клітинки. Якщо перед змінною немає числа, пишіть 1.</div>';
  if(t.f==='choice'){
    h+='<div class="opts">'+t.opts.map((o,i)=>{let c='opt';if(res){if(i===t.ok)c+=' ok';else if(String(ans[0])===String(i))c+=' bad';}else if(String(ans[0])===String(i))c+=' sel';
      return '<button class="'+c+'" data-act="opt" data-i="'+i+'"'+(locked?' disabled':'')+'><b>'+LTR[i]+'</b><span class="m">'+o+'</span></button>';}).join('')+'</div>';
  }
  return h;
}
function trainHtml(){
  if(!P.task)newTrain();
  const t=P.task;
  let h='<div class="card soft"><div class="sub">'+GR.map(g=>'<button class="chip'+(P.group===g[0]?' on':'')+'" data-act="grp" data-g="'+g[0]+'">'+g[1]+'</button>').join('')+'</div>'+
  '<div class="sub"><span style="font-weight:700;color:var(--accD);align-self:center">Рівень:</span>'+[['auto','Авто'],['1','Легко'],['2','Середньо'],['3','Складно']].map(l=>'<button class="chip'+(P.level===l[0]?' on':'')+'" data-act="lvl" data-l="'+l[0]+'">'+l[1]+'</button>').join('')+'</div>'+
  '<div class="stat"><span>Правильно: '+P.right+' з '+P.total+'</span><span>Підряд: '+P.streak+'</span><span>Рівень: '+curLevel()+' з 3</span></div></div>';
  h+='<div class="card" id="task">'+taskInner(t,P.ans,P.res,P.checked)+'<div id="fb">'+fbHtml()+'</div>';
  h+='<div class="row-btn">'+(P.checked?'<button class="btn" data-act="next">Наступне ▶</button>':'<button class="btn" data-act="check">Перевірити</button><button class="btn light" data-act="hint">Підказка</button><span class="sp"></span><button class="btn light sm" data-act="skip">Пропустити</button>')+'</div></div>';
  return h;
}
function fbHtml(){
  const t=P.task;let h='';
  if(P.hint&&!P.checked)h+='<div class="msg hint">'+t.hint+'</div>';
  if(P.res)h+=(P.res.ok?'<div class="msg ok">Правильно!</div>':'<div class="msg bad">Неправильно</div>')+'<div class="sol">'+t.sol+'</div>';
  if(P.warn)h+='<div class="msg bad">'+P.warn+'</div>';
  return h;
}
function trainCheck(){
  const t=P.task;
  const empty=t.f==='choice'?(P.ans[0]===undefined||P.ans[0]===''):t.ans.some((c,i)=>!String(P.ans[i]||'').trim());
  if(empty){P.warn=t.f==='choice'?'Оберіть відповідь':'Заповніть усі клітинки';render();return;}
  P.warn='';
  const r=checkTask(t,P.ans);P.res=r;P.checked=true;P.total++;
  if(r.ok){P.right++;P.streak++;if(P.streak%3===0&&P.autoLevel<3)P.autoLevel++;}
  else{P.streak=0;if(P.autoLevel>1)P.autoLevel--;}
  render();
}

// ===== ТЕСТ =====
function testStart(seed){
  T.seed=seed||(Math.floor(Math.random()*9e8)+1);
  setSeed(T.seed);
  T.tasks=SPEC.map(genSpec);
  T.ans=T.tasks.map(()=>[]);T.i=0;T.view='task';T.rec=null;resetWatch();render();
}
function answered(i){const t=T.tasks[i],a=T.ans[i];return t.f==='choice'?(a[0]!==undefined&&a[0]!==''):t.ans.every((c,k)=>String(a[k]||'').trim());}
function numsHtml(res){
  return '<div class="nums" id="nums">'+T.tasks.map((t,i)=>{let c='num';if(res)c+=res.marks[i]?' r':' w';else if(answered(i))c+=' fill';if(i===T.i&&T.view!=='review')c+=' cur';return '<button class="'+c+'" data-act="go" data-i="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>';
}
function testHtml(){
  if(T.view==='intro'||!T.tasks)return '<div class="card"><div class="q" style="margin-top:0">У тесті 12 завдань, максимум 100 балів. Підказок немає, відповіді перевіряються після кнопки «Перевірити». Завдання йдуть по одному, до них можна повертатися.</div><div class="row-btn"><button class="btn" data-act="tstart">Почати тест</button></div></div>';
  if(T.view==='task'){
    const t=T.tasks[T.i];
    return numsHtml(null)+'<div class="card"><div class="stat" style="margin-top:0"><span>Завдання '+(T.i+1)+' з '+T.tasks.length+'</span></div>'+taskInner(t,T.ans[T.i],null,false)+
    '<div class="row-btn"><button class="btn light" data-act="tprev"'+(T.i===0?' disabled':'')+'>← Назад</button><span class="sp"></span><button class="btn" data-act="tnext">Далі →</button></div></div>';
  }
  if(T.view==='review'){
    const cnt=T.tasks.filter((t,i)=>answered(i)).length,miss=T.tasks.length-cnt;
    return '<div class="card"><div class="q" style="margin-top:0">Перед здачею</div><div class="stat"><span>Відповіли на '+cnt+' з '+T.tasks.length+'</span></div>'+numsHtml(null)+
    (miss?'<div class="msg hint">Ви не завершили '+miss+' '+plural(miss,'завдання','завдання','завдань')+'</div>':'')+
    '<div class="row-btn"><button class="btn light" data-act="tprev">← Назад</button><span class="sp"></span><button class="btn" data-act="tcheck">'+(miss?'Все одно перевірити':'Перевірити')+'</button></div></div>';
  }
  const R=T.rec;
  if(T.view==='result'){
    return '<div class="card"><div style="text-align:center;font-weight:800;font-size:22px;color:var(--ttl)">'+esc(R.name)+'</div>'+
    '<div class="big">'+R.score+' з 100 балів</div><div class="big" style="font-size:clamp(28px,6vw,46px)">'+R.percent+' %</div>'+
    (R.leaves>=3?'<div class="leaves">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: '+R.leaves+'), тому є підозра, що завдання виконано недоброчесно.<br>Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>':'')+
    '<div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>'+numsHtml({marks:R.tasks})+
    '<div class="row-btn" style="justify-content:center"><button class="btn light" data-act="terrs">Дивитись помилки</button><button class="btn" data-act="tagain">Пройти ще раз</button></div></div>';
  }
  // errors
  const t=T.tasks[T.i],res=checkTask(t,T.ans[T.i]);
  return '<div class="card"><div class="row-btn" style="margin:0 0 8px"><button class="btn light sm" data-act="tres">← До результату</button></div>'+numsHtml({marks:R.tasks})+
  '<div class="stat"><span>Завдання '+(T.i+1)+' з '+T.tasks.length+' · '+R.weights[T.i]+' б.</span></div>'+taskInner(t,T.ans[T.i],res,true)+
  (res.ok?'<div class="msg ok">Правильно!</div>':'<div class="msg bad">Неправильно</div>')+'<div class="sol">'+t.sol+'</div>'+
  '<div class="row-btn"><button class="btn light" data-act="eprev"'+(T.i===0?' disabled':'')+'>← Назад</button><span class="sp"></span><button class="btn light" data-act="enext"'+(T.i===T.tasks.length-1?' disabled':'')+'>Далі →</button></div></div>';
}
function plural(n,a,b,c){n=Math.abs(n)%100;const k=n%10;if(n>10&&n<20)return c;if(k>1&&k<5)return b;if(k===1)return a;return c;}
function testCheck(){
  back();
  const now=Date.now(),sur=V.name.sur,nam=V.name.nam;
  const marks=T.tasks.map((t,i)=>checkTask(t,T.ans[i]).ok?1:0);
  const score=marks.reduce((s,m,i)=>s+m*WEIGHTS[i],0);
  const rec={id:now+'_'+Math.random().toString(36).slice(2,8),name:sur+' '+nam,surname:sur,firstName:nam,ts:now,date:new Date(now).toISOString(),
    score:score,max:100,percent:score,tasks:marks,weights:WEIGHTS.slice(),rightCount:marks.reduce((s,m)=>s+m,0),
    qtext:T.tasks.map(t=>plainQ(t.q)+(t.f==='choice'?' ['+t.opts.map((o,k)=>LTR[k]+') '+plainQ(o)).join('; ')+']':'')),
    answers:T.tasks.map((t,i)=>t.f==='choice'?(T.ans[i][0]===undefined||T.ans[i][0]===''?'':LTR[+T.ans[i][0]]):t.ans.map((c,k)=>String(T.ans[i][k]||'').trim()).join(' | ')),
    correct:T.tasks.map(t=>t.f==='choice'?LTR[t.ok]:t.ans.join(' | ')),
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,variant:T.seed,test:TEST_NAME};
  T.rec=rec;T.view='result';T.i=0;
  saveResult(rec);
  render();window.scrollTo(0,0);
}

// ---------- події ----------
function curCtx(){
  if(V.view==='train'&&P.task&&!P.checked)return P.ans;
  if(V.view==='test'&&T.view==='task')return T.ans[T.i];
  return null;
}
function onFld(el){
  const a=curCtx();if(!a)return;
  a[+el.dataset.i]=el.value;
  if(V.view==='test'){const n=$('#nums');if(n)n.outerHTML=numsHtml(null);}
}
let lastFld=null;
S.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('fld'))lastFld=e.target;});
S.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('fld'))onFld(e.target);});
S.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(V.view==='train'){e.preventDefault();act(P.checked?'next':'check');}
    else if(V.view==='test'&&T.view==='task'){e.preventDefault();act('tnext');}
  }
});
KBD.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button[data-k]');if(!b)return;
  e.preventDefault();
  const k=b.dataset.k;
  const flds=[].slice.call(S.querySelectorAll('.fld:not([disabled])'));
  let el=lastFld&&document.body.contains(lastFld)?lastFld:flds[0];
  if(!el)return;
  if(k==='next'){const i=flds.indexOf(el);const nx=flds[i+1];if(nx){nx.focus();lastFld=nx;}return;}
  let v=el.value;
  if(k==='bs')v=v.slice(0,-1);else if(k==='-'){v=v.charAt(0)==='-'?v.slice(1):'-'+v;}else if(v.replace('-','').length<7)v+=k;
  el.value=v;onFld(el);el.dispatchEvent(new Event('input',{bubbles:true}));
  if(!document.activeElement||document.activeElement!==el){try{el.focus({preventScroll:true});}catch(_){}}
});
document.addEventListener('keydown',e=>{
  if(V.view!=='test'||!T.tasks)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT')return;
  if(T.view==='task'){if(e.key==='ArrowRight')act('tnext');else if(e.key==='ArrowLeft')act('tprev');}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b);});
function act(a,b){
  const d=b?b.dataset:{};
  switch(a){
    case 'begin':{
      const su=$('#sur').value.trim(),na=$('#nam').value.trim();
      $('#sur').classList.toggle('err',!su);$('#nam').classList.toggle('err',!na);
      if(!su||!na){$('#nmErr').textContent='Введіть прізвище та ім\'я, щоб почати';return;}
      V.name={sur:su,nam:na};V.view='learn';render();break;}
    case 'view':if(d.v!=='learn'&&!unlocked())break;V.view=d.v;if(V.view==='train'&&!P.task)newTrain();render();window.scrollTo(0,0);break;
    case 'ltab':L.tab=d.t;L.ex=null;L.mode='x';render();break;
    case 'cube':L.cube=+d.s;buildEx(false);render();break;
    case 'mode':L.mode=d.m;buildEx(false);render();break;
    case 'step':if(L.step<=(L.ex.fold?L.ex.rows:L.ex.pieces).length)L.step++;render();break;
    case 'newex':L.cnt=L.cnt||{};L.cnt[exKey()]=(L.cnt[exKey()]||0)+1;buildEx(false);render();break;
    case 'star':buildEx(true);render();break;
    case 'grp':P.group=d.g;newTrain();render();break;
    case 'lvl':P.level=d.l;newTrain();render();break;
    case 'opt':if(!P.checked&&V.view==='train'){P.ans=[d.i];P.warn='';render();}else if(V.view==='test'&&T.view==='task'){T.ans[T.i]=[d.i];render();}break;
    case 'check':trainCheck();break;
    case 'hint':P.hint=true;P.warn='';{const f=$('#fb');if(f)f.innerHTML=fbHtml();}break;
    case 'next':case 'skip':P.warn='';newTrain();render();break;
    case 'tstart':testStart(+(new URLSearchParams(location.search).get('v'))||0);break;
    case 'tagain':testStart(0);window.scrollTo(0,0);break;
    case 'tprev':if(T.view==='review'){T.view='task';T.i=T.tasks.length-1;}else if(T.i>0)T.i--;render();break;
    case 'tnext':if(T.i<T.tasks.length-1)T.i++;else T.view='review';render();break;
    case 'go':if(T.view==='review')T.view='task';T.i=+d.i;render();break;
    case 'tcheck':testCheck();break;
    case 'terrs':{const f=T.rec.tasks.indexOf(0);T.i=f<0?0:f;T.view='errors';render();break;}
    case 'tres':T.view='result';render();break;
    case 'eprev':if(T.i>0)T.i--;render();break;
    case 'enext':if(T.i<T.tasks.length-1)T.i++;render();break;
  }
  if(a==='go'&&T.view==='errors')render();
}
// у режимі помилок клітинки-номери теж перемикають завдання
document.addEventListener('click',e=>{const b=e.target.closest('.num');if(!b||V.view!=='test'||T.view!=='result')return;});

const MH=$('#modalHost');
$('#keyBtn').addEventListener('click',()=>{
  MH.innerHTML='<div class="modal"><div class="box small"><b>Пароль</b><input class="field" id="pw" type="password" autocomplete="off"><div id="pwErr" style="color:var(--bad);min-height:20px;font-weight:700"></div><div class="row-btn"><button class="btn" id="pwOk">Увійти</button><button class="btn light" id="pwNo">Скасувати</button></div></div></div>';
  const pw=$('#pw');pw.focus();
  const go=async()=>{const ok=await teacherLogin(pw.value);if(!ok){$('#pwErr').textContent='Неправильний пароль';return;}openJournal();};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go();};$('#pwNo').onclick=()=>{MH.innerHTML='';};

async function openJournal(){
  MH.innerHTML='<div class="modal"><div class="box"><div class="row-btn" style="margin:0"><b style="font-size:18px">Журнал результатів</b><span class="sp"></span><button class="btn light sm" id="jRef">Оновити</button><button class="btn light sm" id="jCsv">Завантажити CSV</button><button class="btn light sm" id="jClr">Очистити</button><button class="btn sm" id="jClose">Закрити</button></div><div id="jBody" class="jscroll">Завантаження…</div></div></div>';
  let rows=[];
  const draw=()=>{
    const N=rows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0);
    let h='<table class="jt"><thead><tr><th>№</th><th>Прізвище та ім\'я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
    for(let i=1;i<=N;i++)h+='<th>'+i+'</th>';h+='</tr></thead><tbody>';
    rows.forEach((r,k)=>{
      const d=r.ts?new Date(r.ts).toLocaleString('uk-UA'):'—';
      const fast=r.durationSec!=null&&r.durationSec<120;
      h+='<tr><td>'+(k+1)+'</td><td class="nm" data-d="'+k+'">'+esc(r.name)+'</td><td>'+d+'</td><td'+(fast?' class="red" title="Дуже швидко"':'')+'>'+(r.durationSec!=null?fmtTime(r.durationSec):'—')+'</td><td'+((r.leaves||0)>=3?' class="red"':'')+(r.awaySec!=null?' title="Поза вікном: '+fmtTime(r.awaySec)+'"':'')+'>'+(r.leaves!=null?r.leaves:'—')+'</td><td><b>'+nf(r.score)+'</b></td>';
      for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+='<td class="'+(m===1?'r':m===0?'w':'')+'">'+(m===1?'✓':m===0?'✗':'')+'</td>';}
      h+='</tr><tr id="det'+k+'" hidden><td colspan="'+(6+N)+'" class="det">'+detHtml(r)+'</td></tr>';
    });
    h+='</tbody></table>';
    $('#jBody').innerHTML=h||'';
    $('#jBody').querySelectorAll('.nm').forEach(td=>td.onclick=()=>{const e=$('#det'+td.dataset.d);e.hidden=!e.hidden;});
  };
  const load=async()=>{try{rows=await loadResults();draw();}catch(e){$('#jBody').textContent='Не вдалося підключитися до бази результатів';}};
  $('#jRef').onclick=load;
  $('#jClose').onclick=async()=>{MH.innerHTML='';await teacherLogout();};
  $('#jCsv').onclick=()=>{
    const N=rows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0);
    const head=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (з 100)','%'];for(let i=1;i<=N;i++)head.push('Завд. '+i);
    const lines=[head].concat(rows.map(r=>{const a=[r.name,r.date||'',r.durationSec!=null?fmtTime(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtTime(r.awaySec):'',nf(r.score),r.percent!=null?r.percent:''];for(let i=0;i<N;i++){const m=(r.tasks||[])[i];a.push(m===1?'+':m===0?'-':'');}return a;}));
    const csv='﻿'+lines.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Формули_скороченого_множення_8клас_результати.csv';document.body.appendChild(a);a.click();a.remove();
  };
  $('#jClr').onclick=()=>{
    $('#jBody').insertAdjacentHTML('afterbegin','<div class="msg bad" id="cf">Видалити всі записи ('+rows.length+')? <button class="btn sm" id="cfY">Так, видалити</button> <button class="btn light sm" id="cfN">Скасувати</button></div>');
    $('#cfN').onclick=()=>$('#cf').remove();
    $('#cfY').onclick=async()=>{try{await clearResults();rows=[];draw();}catch(e){$('#jBody').insertAdjacentHTML('afterbegin','<div class="msg bad">Не вдалося очистити записи. Перевірте правила бази Firebase</div>');}};
  };
  load();
}
function detHtml(r){
  let h='<div><b>Бал: '+nf(r.score)+' з '+(r.max||100)+(r.percent!=null?' ('+r.percent+' %)':'')+'</b>'+(r.leaves!=null?' · Виходів: '+r.leaves+', поза вікном: '+fmtTime(r.awaySec||0):'')+(r.variant?' · варіант '+r.variant:'')+'</div>';
  (r.tasks||[]).forEach((m,i)=>{h+='<div>'+(i+1)+') '+(m===1?'✓':'✗')+' '+esc((r.qtext||[])[i]||'')+' — відповідь: <b>'+esc((r.answers||[])[i]||'—')+'</b>; правильно: <b>'+esc((r.correct||[])[i]||'')+'</b>'+(r.weights?' ('+(m===1?r.weights[i]:0)+' з '+r.weights[i]+' б.)':'')+'</div>';});
  return h;
}

window.__skm={state:function(){return {P:P,T:T,V:V,L:L};},genSq:genSq,genFsq:genFsq,genDsq:genDsq,genFdsq:genFdsq,genCube:genCube,genFcube:genFcube,genArith:genArith,genSpec:genSpec,checkTask:checkTask,SPEC:SPEC,setSeed:setSeed};
render();
})();

.pm-sheet{position:absolute;background:#fff;border:1px solid #c9c9c9;box-shadow:0 2px 10px rgba(0,0,0,.2);box-sizing:border-box}
.pm-sheet.grid{background-image:linear-gradient(#cfe0f3 1px,transparent 1px),linear-gradient(90deg,#cfe0f3 1px,transparent 1px);background-size:24px 24px}
.pm-sheet.pm-prev{border:2px dashed #f08a00;background-color:rgba(255,255,255,.85)}

/* місце під панельку забираємо в уроку, а не перекриваємо ним */
html.pm-dock-r{padding-right:var(--pm-w,26px)!important;box-sizing:border-box!important}
html.pm-dock-l{padding-left:var(--pm-w,26px)!important;box-sizing:border-box!important}

#pm-panel,#pm-fab{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;box-sizing:border-box}
#pm-panel *{box-sizing:border-box}
#pm-panel[hidden],#pm-fab[hidden]{display:none!important}
#pm-panel{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:2147483600;width:42px;max-height:calc(100vh - 10px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  background:#e3e7ee;border:1px solid #aeb7c4;border-radius:14px;box-shadow:0 2px 12px rgba(40,50,70,.22)}
#pm-panel::-webkit-scrollbar{display:none}
#pm-panel.pm-left{right:auto;left:4px}
.pm-b{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:transparent;color:#465162;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pm-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pm-b:hover{background:#d3d9e3}
.pm-b:active{transform:scale(.93)}
.pm-b.on{background:#c5cedb;color:#26303f;box-shadow:inset 0 0 0 1px #8f9db2}
#pm-panel.pm-left [data-a="hide"] svg{transform:scaleX(-1)}
.pm-sep{flex:none;width:18px;height:1px;margin:3px 0;background:#bcc4d0}
.pm-colors{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px 0}
.pm-c{width:15px;height:15px;padding:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #9aa4b3;cursor:pointer}
.pm-c.on{box-shadow:0 0 0 2px #3b4452}

#pm-fab{position:fixed;right:0;top:50%;margin-top:-26px;z-index:2147483600;width:20px;height:52px;padding:0;
  display:flex;align-items:center;justify-content:center;color:#465162;cursor:pointer;
  background:#e3e7ee;border:1px solid #aeb7c4;border-right:0;border-radius:12px 0 0 12px;box-shadow:0 2px 8px rgba(40,50,70,.2)}
#pm-fab.pm-left{right:auto;left:0;border:1px solid #aeb7c4;border-left:0;border-radius:0 12px 12px 0}
#pm-fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* низький екран: кнопки стають у дві колонки */
@media (max-height:600px){
  #pm-panel{width:78px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 2px}
  .pm-sep{display:none}
  .pm-colors{width:100%;grid-template-columns:repeat(4,auto);justify-content:center;gap:4px;padding:4px 0}
  .pm-c{width:14px;height:14px}
}

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
