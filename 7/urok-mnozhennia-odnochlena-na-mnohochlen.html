<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Множення одночлена на многочлен: Інтерактивний урок</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards; }
        @keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
        .arc { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine 0.6s ease-out forwards; }
        @keyframes headIn { from { opacity: 0; } to { opacity: 1; } }
        .arc-head { opacity: 0; animation: headIn 0.2s 0.5s forwards; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .animate-shake { animation: shake 0.3s ease-in-out 2; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fs-xs { font-size: clamp(11px, 0.9vw, 17px); }
        .fs-sm { font-size: clamp(13px, 1.1vw, 21px); }
        .fs-md { font-size: clamp(14px, 1.3vw, 25px); }
        .fs-lg { font-size: clamp(16px, 1.6vw, 31px); }
        .fs-xl { font-size: clamp(20px, 2.2vw, 42px); }
        .fs-board { font-size: clamp(21px, 2.8vw, 54px); }
        .big-board .fs-board { font-size: clamp(24px, 3.6vw, 76px); }
        .fs-card { font-size: clamp(18px, 1.75vw, 34px); }

        .qbox {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 2.2em; height: 1.6em; padding: 0 0.4em;
            border: 2px dashed #A8CADD; border-radius: 0.5em;
            background: #F5F9FC; color: #2A6592; font-weight: 800;
            cursor: pointer; transition: all .15s;
        }
        .qbox:hover { background: #E6F0F5; border-color: #3887AF; transform: translateY(-1px); }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0f2f45',
                        panelLeft: '#EAF2F7',
                        panelRight: '#F5F9FC',
                        sky: {
                            50:'#F5F9FC',100:'#E6F0F5',200:'#CCE0EB',300:'#A8CADD',400:'#6FA3C4',
                            500:'#3887AF',600:'#2A6592',700:'#235580',800:'#1F4E73',900:'#173F5F',950:'#0F2F45'
                        },
                        cyan: { 100: '#DCE9F2', 200: '#C6DCE9' },
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sky-50 overflow-hidden text-ink font-sans h-screen w-full relative selection:bg-sky-600 selection:text-white">

<div id="root" class="h-full w-full"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- Кольори ---------- */
const MONO = '#173F5F';
const TC = ['#2A6592', '#0d9488', '#ea580c', '#c026d3'];

/* ---------- KaTeX ---------- */
const Latex = ({ math, block = false }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (ref.current) {
            try { window.katex.render(math, ref.current, { displayMode: block, throwOnError: false, trust: true }); }
            catch (e) { console.error(e); }
        }
    }, [math, block]);
    return <span ref={ref} />;
};

const splitTerm = (t) => {
    const s = t.trim();
    if (s[0] === '+' || s[0] === '-') return { sign: s[0], body: s.slice(1).trim() };
    return { sign: '', body: s };
};

/* =========================================================
   ДАНІ
   ========================================================= */
const EXAMPLES = [
    { side: 'left', mono: '2x', terms: ['3x', '+2y', '-5'],
      mids: ['2x\\cdot 3x', '+\\,2x\\cdot 2y', '-\\,2x\\cdot 5'],
      results: ['6x^2', '+\\,4xy', '-\\,10x'] },
    { side: 'left', mono: '5a', terms: ['a^2', '+2ab', '-3b'],
      mids: ['5a\\cdot a^2', '+\\,5a\\cdot 2ab', '-\\,5a\\cdot 3b'],
      results: ['5a^3', '+\\,10a^2b', '-\\,15ab'] },
    { side: 'left', mono: '-3a', terms: ['a^2', '-2a', '+4'],
      mids: ['-3a\\cdot a^2', '+(-3a)\\cdot(-2a)', '+(-3a)\\cdot 4'],
      results: ['-3a^3', '+\\,6a^2', '-\\,12a'] },
    { side: 'left', mono: '-x^2', terms: ['x^3', '-5x', '+2'],
      mids: ['-x^2\\cdot x^3', '+(-x^2)\\cdot(-5x)', '+(-x^2)\\cdot 2'],
      results: ['-x^5', '+\\,5x^3', '-\\,2x^2'] },
    { side: 'left', mono: '4ab', terms: ['2a', '-3b', '+1'],
      mids: ['4ab\\cdot 2a', '-\\,4ab\\cdot 3b', '+\\,4ab\\cdot 1'],
      results: ['8a^2b', '-\\,12ab^2', '+\\,4ab'] },
];

const ORAL2 = [
    { q: 'y(y-7)', ans: ['y^2', '-7y'] },
    { q: '-m(m+2)', ans: ['-m^2', '-2m'] },
    { q: '2a(3a+4)', ans: ['6a^2', '+8a'] },
    { q: '-3(x^2-2x+5)', ans: ['-3x^2', '+6x', '-15'] },
    { q: '5c(c^2-1)', ans: ['5c^3', '-5c'] },
    { q: '-a^3(a^2+a-1)', ans: ['-a^5', '-a^4', '+a^3'] },
    { q: '3xy(x+2y)', ans: ['3x^2y', '+6xy^2'] },
    { q: '(2b^2-b)\\cdot 4b', ans: ['8b^3', '-4b^2'] },
    { q: '0{,}2p(5p-10)', ans: ['p^2', '-2p'] },
];

const ORAL = [
    { q: 'x(x+4)', ans: ['x^2', '+4x'] },
    { q: '-a(a-3)', ans: ['-a^2', '+3a'] },
    { q: '3m(2m-1)', ans: ['6m^2', '-3m'] },
    { q: '5(2y^2-y+3)', ans: ['10y^2', '-5y', '+15'] },
    { q: '-2b(b^2+4)', ans: ['-2b^3', '-8b'] },
    { q: 'x^2(x^3-2x+1)', ans: ['x^5', '-2x^3', '+x^2'] },
    { q: '4ab(a-2b)', ans: ['4a^2b', '-8ab^2'] },
    { q: '(c^2-3c)\\cdot(-c)', ans: ['-c^3', '+3c^2'] },
    { q: '-0{,}5k(4k-6)', ans: ['-2k^2', '+3k'] },
];

/* =========================================================
   ДРІБНІ КОМПОНЕНТИ
   ========================================================= */
const Card = ({ children, className = '' }) => (
    <div className={`bg-white rounded-2xl p-4 lg:p-6 shadow-sm border border-sky-100 ${className}`}>{children}</div>
);

const Ask = ({ children }) => (
    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 lg:p-4 fs-sm text-slate-700 flex gap-2 lg:gap-3 items-start">
        <span className="shrink-0">💬</span><div>{children}</div>
    </div>
);

const Title = ({ children }) => (
    <div className="bg-white/80 rounded-xl border border-sky-200 px-4 py-2.5 lg:py-4 text-center animate-pop">
        <p className="font-bold text-sky-700 fs-lg">{children}</p>
    </div>
);

/* =========================================================
   ДОШКА: стрілочки «фонтанчиком»
   ========================================================= */
const Distribute = ({ ex, revealed }) => {
    const wrapRef = useRef(null), monoRef = useRef(null), termRefs = useRef([]);
    const uid = useRef('d' + Math.random().toString(36).slice(2, 7)).current;
    const [geo, setGeo] = useState(null);
    const n = ex.terms.length;

    const measure = useCallback(() => {
        const w = wrapRef.current, m = monoRef.current;
        if (!w || !m) return;
        const wr = w.getBoundingClientRect(), mr = m.getBoundingClientRect();
        const pts = [];
        for (let i = 0; i < n; i++) {
            const el = termRefs.current[i];
            if (!el) return;
            const r = el.getBoundingClientRect();
            pts.push({ x: r.left + r.width / 2 - wr.left, y: r.top - wr.top });
        }
        setGeo({ w: wr.width, h: wr.height, x0: mr.left + mr.width / 2 - wr.left, y0: mr.top - wr.top, pts });
    }, [n]);

    useEffect(() => {
        measure();
        const ts = [60, 300, 650].map(d => setTimeout(measure, d));
        let ro;
        if (window.ResizeObserver && wrapRef.current) { ro = new ResizeObserver(() => measure()); ro.observe(wrapRef.current); }
        window.addEventListener('resize', measure);
        return () => { ts.forEach(clearTimeout); ro && ro.disconnect(); window.removeEventListener('resize', measure); };
    }, [measure, ex]);

    const monoEl = (
        <span ref={monoRef} className="font-bold px-[0.08em]" style={{ color: MONO }}><Latex math={ex.mono} /></span>
    );
    const termsEl = ex.terms.map((t, i) => {
        const { sign, body } = splitTerm(t);
        return (
            <span key={i} className="inline-flex items-baseline">
                {sign && <span className="mx-[0.18em]"><Latex math={sign} /></span>}
                <span ref={el => termRefs.current[i] = el} style={{ color: revealed >= 2 * i + 1 ? TC[i] : undefined }}
                      className="transition-colors duration-300 font-semibold"><Latex math={body} /></span>
            </span>
        );
    });

    return (
        <div className="flex flex-col items-start">
            <div ref={wrapRef} className="relative pt-[2.3em] pb-[0.2em]">
                {geo && (
                    <svg className="absolute top-0 left-0 overflow-visible pointer-events-none" width={geo.w} height={geo.h}>
                        <defs>
                            {TC.map((c, i) => (
                                <marker key={i} id={`${uid}-h${i}`} markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
                                    <path d="M1,1 L13,7 L1,13 z" fill={c} className="arc-head" />
                                </marker>
                            ))}
                        </defs>
                        {geo.pts.map((p, i) => {
                            if (revealed < 2 * i + 1) return null;
                            const sx = geo.x0 + (i - (n - 1) / 2) * 7;
                            const top = Math.min(geo.y0, p.y);
                            const dx = Math.abs(p.x - sx);
                            const h = Math.max(14, Math.min(top - 6, 16 + dx * 0.3));
                            const d = `M ${sx} ${geo.y0 - 3} C ${sx} ${geo.y0 - 3 - h * 1.3}, ${p.x} ${p.y - 3 - h * 1.3}, ${p.x} ${p.y - 6}`;
                            return <path key={i} d={d} pathLength="1" className="arc" fill="none" stroke={TC[i]} strokeWidth="3"
                                         strokeLinecap="round" markerEnd={`url(#${uid}-h${i})`} />;
                        })}
                    </svg>
                )}
                <div className="flex items-baseline whitespace-nowrap">
                    {ex.side === 'left' && monoEl}
                    <span className="mx-[0.05em]"><Latex math="(" /></span>
                    {termsEl}
                    <span className="mx-[0.05em]"><Latex math=")" /></span>
                    {ex.side === 'right' && <><span className="mx-[0.15em]"><Latex math="\cdot" /></span>{monoEl}</>}
                </div>
            </div>

            <div className="flex items-baseline whitespace-nowrap mt-[0.35em] text-[0.78em]">
                <span className="mr-[0.3em] text-slate-500"><Latex math="=" /></span>
                {ex.mids.map((m, i) => (
                    <span key={i} className={`mx-[0.12em] ${revealed >= 2 * i + 1 ? 'animate-pop' : ''}`}
                          style={{ color: TC[i], visibility: revealed >= 2 * i + 1 ? 'visible' : 'hidden' }}><Latex math={m} /></span>
                ))}
            </div>

            <div className={`flex items-baseline whitespace-nowrap mt-[0.35em] rounded-xl px-[0.25em] -mx-[0.25em] transition-colors duration-500 ${revealed >= 2 * n ? 'bg-sky-100/80 ring-2 ring-sky-300' : ''}`}>
                <span className="mr-[0.3em] text-slate-500"><Latex math="=" /></span>
                {ex.results.map((m, i) => {
                    const on = revealed >= 2 * i + 2;
                    return (
                        <span key={i} className={`mx-[0.1em] font-bold ${on ? 'animate-pop' : ''}`}
                              style={{ color: TC[i], visibility: on ? 'visible' : 'hidden' }}><Latex math={m} /></span>
                    );
                })}
            </div>
        </div>
    );
};

const Btn = ({ onClick, disabled, primary, children }) => (
    <button onClick={disabled ? undefined : onClick}
        className={`px-3 py-1.5 md:px-4 md:py-2 lg:px-6 lg:py-3 rounded-full font-semibold fs-sm transition-all flex items-center gap-1.5
        ${disabled ? 'bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed'
            : primary ? 'bg-sky-600 text-white shadow-md hover:bg-sky-700 active:scale-95 cursor-pointer'
            : 'bg-white text-sky-800 border border-sky-200 hover:bg-sky-50 active:scale-95 cursor-pointer shadow-sm'}`}>
        {children}
    </button>
);

const Tabs = ({ count, idx, setIdx, labels }) => (
    <div className="flex justify-center gap-2 pt-3 lg:pt-5 px-3 flex-wrap">
        {Array.from({ length: count }).map((_, i) => (
            <button key={i} onClick={() => setIdx(i)}
                className={`px-3 py-1 lg:px-5 lg:py-2 rounded-full fs-sm font-semibold transition-all cursor-pointer
                ${idx === i ? 'bg-sky-600 text-white shadow' : 'bg-white text-sky-700 border border-sky-200 hover:bg-sky-50'}`}>
                {labels ? labels[i] : `Приклад ${i + 1}`}
            </button>
        ))}
    </div>
);

const BoardShell = ({ tabs, hint, r, max, setR, children }) => (
    <div className="absolute inset-0 flex flex-col">
        {tabs}
        <div className="flex-1 overflow-auto no-scrollbar flex p-3 lg:p-6">
            <div className="m-auto fs-board">{children}</div>
        </div>
        <div className="text-center fs-sm text-sky-900 font-medium px-4 min-h-[1.7em]">{hint}</div>
        <div className="flex justify-center gap-2 lg:gap-3 p-3 lg:p-5">
            <Btn onClick={() => setR(0)} disabled={r === 0}>↺ Спочатку</Btn>
            <Btn onClick={() => setR(x => Math.min(max, x + 1))} disabled={r >= max} primary>Крок ▶</Btn>
            <Btn onClick={() => setR(max)} disabled={r >= max}>Показати все</Btn>
        </div>
    </div>
);

const DistributeBoard = ({ examples }) => {
    const [idx, setIdx] = useState(0);
    const [r, setR] = useState(0);
    useEffect(() => setR(0), [idx]);
    const ex = examples[idx];
    const n = ex.terms.length, max = 2 * n;
    let hint;
    if (r === 0) hint = '💬 На що множимо одночлен спочатку?';
    else if (r >= max) hint = '✓ Одночлен помножили на кожний член многочлена й додали добутки';
    else if (r % 2 === 1) hint = '💬 Скільки це буде?';
    else hint = '💬 На який член множимо далі?';
    return (
        <BoardShell tabs={examples.length > 1 && <Tabs count={examples.length} idx={idx} setIdx={setIdx} />}
                    hint={hint} r={r} max={max} setR={setR}>
            <Distribute key={idx} ex={ex} revealed={r} />
        </BoardShell>
    );
};

/* ---------- Усна розминка ---------- */
const OralCard = ({ idx, task, showAll }) => {
    const [open, setOpen] = useState(() => task.ans.map(() => false));
    useEffect(() => { setOpen(task.ans.map(() => showAll)); }, [showAll]);
    const toggle = (i) => setOpen(o => o.map((v, j) => j === i ? !v : v));
    const done = open.every(Boolean);
    return (
        <div className={`bg-white rounded-2xl border shadow-sm p-3 lg:p-5 flex flex-col gap-2 lg:gap-3 transition-colors ${done ? 'border-sky-300' : 'border-sky-100'}`}>
            <div className="flex items-center justify-between">
                <span className="w-7 h-7 lg:w-9 lg:h-9 rounded-full bg-sky-100 text-sky-700 font-extrabold fs-sm flex items-center justify-center">{idx + 1}</span>
                {done && <span className="text-sky-600 fs-sm font-bold animate-pop">✓</span>}
            </div>
            <div className="fs-card"><Latex math={task.q} /></div>
            <div className="flex flex-wrap items-center gap-x-1.5 gap-y-2 fs-card">
                <span className="text-slate-400"><Latex math="=" /></span>
                {task.ans.map((a, i) => open[i]
                    ? <span key={i} onClick={() => toggle(i)} className="animate-pop font-bold cursor-pointer" style={{ color: TC[i % 4] }}><Latex math={a} /></span>
                    : <button key={i} onClick={() => toggle(i)} className="qbox text-[0.8em]">?</button>)}
            </div>
        </div>
    );
};

const OralTrainer = ({ tasks, title }) => {
    const [showAll, setShowAll] = useState(false);
    return (
        <div className="max-w-6xl 2xl:max-w-7xl mx-auto w-full space-y-4 lg:space-y-6">
            <Title>{title}</Title>
            <div className="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
                <Ask>Кожен знак <b>«?»</b> — це один член відповіді. Спочатку запитайте клас, потім натискайте.</Ask>
                <div className="flex justify-center shrink-0">
                    <Btn onClick={() => setShowAll(s => !s)} primary={!showAll}>{showAll ? 'Сховати всі' : 'Відкрити всі'}</Btn>
                </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 lg:gap-5">
                {tasks.map((t, i) => <OralCard key={i} idx={i} task={t} showAll={showAll} />)}
            </div>
        </div>
    );
};

/* =========================================================
   ДОДАТОК
   ========================================================= */
const App = () => {
    const [step, setStep] = useState(0); // 0 — старт, 1 — множення, 2 — розминка 1, 3 — розминка 2
    const navBtn = 'px-4 py-2 lg:px-6 lg:py-3 rounded-full font-semibold transition-all shadow-md active:scale-95 fs-sm cursor-pointer flex items-center gap-1.5';
    const navLight = `${navBtn} border border-slate-300 bg-white text-slate-700 hover:bg-slate-50`;
    const navSky = `${navBtn} border border-sky-300 bg-sky-100 text-sky-800 hover:bg-sky-200`;

    return (
        <div className="flex flex-col w-full h-full overflow-hidden font-sans text-ink bg-white">
            <div className="flex-1 relative overflow-hidden bg-panelLeft">
                {step === 0 && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-sky-100 via-sky-50 to-cyan-100 p-4 text-center">
                        <p className="fs-md font-semibold tracking-widest uppercase text-sky-500 mb-3 lg:mb-6 animate-fade-in">Алгебра · 7 клас</p>
                        <h1 className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl 2xl:text-7xl font-bold text-slate-800 mb-8 lg:mb-14 animate-fade-in leading-tight">
                            <span className="text-sky-700">Множення одночлена</span><br />на многочлен
                        </h1>
                        <button onClick={() => setStep(1)}
                            className="px-5 py-2.5 lg:px-9 lg:py-4 bg-white border border-sky-200 rounded-full shadow-sm hover:shadow-md hover:border-sky-400 transition-all active:scale-95 fs-md uppercase tracking-widest cursor-pointer animate-pop flex items-center gap-3 lg:gap-5 group">
                            <span className="pl-1.5 font-extrabold text-sky-800">Почати урок</span>
                            <span className="w-8 h-8 lg:w-12 lg:h-12 rounded-full bg-sky-100 group-hover:bg-sky-600 group-hover:text-white text-sky-700 flex items-center justify-center transition-colors">▶</span>
                        </button>
                    </div>
                )}

                {step === 1 && (
                    <div key="s1" className="absolute inset-0 flex flex-col animate-fade-in"
                         style={{ backgroundImage: 'radial-gradient(#CCE0EB 1px, transparent 1px)', backgroundSize: '22px 22px', backgroundColor: '#F5F9FC' }}>
                        <div className="px-3 pt-3 lg:px-8 lg:pt-6">
                            <div className="max-w-5xl mx-auto"><Title>Множимо одночлен на многочлен</Title></div>
                        </div>
                        <div className="flex-1 relative big-board">
                            <DistributeBoard examples={EXAMPLES} />
                        </div>
                        <div className="h-14 md:h-16 lg:h-20 shrink-0" />
                    </div>
                )}

                {step === 2 && (
                    <div key="s2" className="absolute inset-0 overflow-y-auto no-scrollbar p-3 md:p-5 lg:p-8 pb-24 lg:pb-28 animate-fade-in">
                        <OralTrainer tasks={ORAL} title="Усна розминка 1: скільки буде?" />
                    </div>
                )}

                {step === 3 && (
                    <div key="s3" className="absolute inset-0 overflow-y-auto no-scrollbar p-3 md:p-5 lg:p-8 pb-24 lg:pb-28 animate-fade-in">
                        <OralTrainer tasks={ORAL2} title="Усна розминка 2: скільки буде?" />
                    </div>
                )}

                {step > 0 && (
                    <div className="absolute bottom-3 right-3 md:bottom-4 md:right-4 lg:bottom-6 lg:right-6 z-30 flex gap-2 lg:gap-3">
                        <button onClick={() => setStep(s => s - 1)} className={navLight}>← Назад</button>
                        {step < 3
                            ? <button key={step} onClick={() => setStep(s => s + 1)} className={`${navSky} animate-pop`}>{step === 1 ? 'Розминка 1 ➔' : 'Розминка 2 ➔'}</button>
                            : <button onClick={() => setStep(0)} className={navSky}>На початок</button>}
                    </div>
                )}
            </div>

            <div className="w-full shrink-0 select-none text-center py-1.5 md:py-2 bg-slate-50 border-t border-slate-200 fs-xs text-slate-500 tracking-wide">
                Автор розробки <span className="font-bold text-slate-800">Ковтун Тетяна</span>
            </div>

<script>

      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
