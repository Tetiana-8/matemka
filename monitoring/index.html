<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моніторинг за Блумом</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#3b3552;
  background:linear-gradient(135deg,#fde7f1 0%,#efe9fb 35%,#e3f1fb 65%,#e4f6ea 100%);

.screen{width:100%;max-width:820px;display:flex;flex-direction:column;min-height:0;position:relative}
.card{background:rgba(255,255,255,.9);border-radius:18px;box-shadow:0 4px 18px rgba(120,100,170,.14);padding:16px 18px;position:relative}

label{display:block;font-size:13px;font-weight:600;color:#5a4b8a;margin:12px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;color:#3b3552;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#a695d6}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:10px 8px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;font-weight:600;color:#5a4b8a;cursor:pointer}
.seg button.on{background:#e5dcf7;border-color:#a695d6}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;border:none;background:#b9a6ea;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#a994e0}
.btn:disabled{background:#d8d0ec;cursor:default}
.btn.soft{background:#ece6f8;color:#5a4b8a}
.btn.soft:hover{background:#e0d6f3}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.row6 div{text-align:center;font-size:11px;color:#7d7699}
.err{color:#b04a5a;font-size:13px;margin-top:8px;min-height:18px;text-align:center}
.note{font-size:12px;color:#8b84a3;margin-top:8px;line-height:1.45}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;color:#7d7699}
.tm{font-weight:700;color:#5a4b8a;font-size:15px;font-variant-numeric:tabular-nums}
.tm.low{color:#b04a5a}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.dots span{width:11px;height:11px;border-radius:50%;background:#ddd5f1;cursor:pointer}
.dots span.a{background:#b9a6ea}
.dots span.c{outline:2px solid #8e7cc3;outline-offset:1px}
.qbox{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.q{font-size:18px;line-height:1.55;color:#2f2946}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:11px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:16px;cursor:pointer;text-align:left;color:#2f2946;min-height:46px;display:flex;align-items:center}
.opt:hover{border-color:#b9a6ea}
.opt.on{background:#e5dcf7;border-color:#8e7cc3}
.disp{min-height:50px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:24px;padding:8px 14px;color:#2f2946;display:flex;align-items:center}
.disp .ph{color:#b6afcc;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.act{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}

sub,sup{font-size:.7em}

table{border-collapse:collapse;width:100%;font-size:12px}

function xmur(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return h>>>0;};}

  var r=function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^(a>>>15),1|a);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296;};

    p:function(arr){return arr[Math.floor(r()*arr.length)];},
    sh:function(arr){var c=arr.slice();for(var i=c.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=c[i];c[i]=c[j];c[j]=t;}return c;}};}

function split(total,k){var base=Math.floor(total/k),r=total%k,o=[];for(var i=0;i<k;i++)o.push(base+(i<r?1:0));return o;}
function poolOf(cfg,L){return GEN.filter(function(g){return g.l===L&&cfg.tp.indexOf(g.t)>=0;});}
function effCounts(cfg){return LV.map(function(L,i){return Math.min(cfg.n[i],poolOf(cfg,L).length);});}

  if(o.k==="mc"){var ord=R.sh(o.o.map(function(_,i){return i;}));t.o=ord.map(function(i){return o.o[i];});t.a=ord.indexOf(o.a||0);t.right=o.o[o.a||0];}
  else{t.a=o.a;t.right=fm(o.a);}

function buildTest(cfg,name){
  var key=name+"|"+cfg.id,R=mkR(key+"|order"),chosen=[];
  LV.forEach(function(L,li){
    var by={};poolOf(cfg,L).forEach(function(g){(by[g.t]=by[g.t]||[]).push(g);});
    var tops=R.sh(Object.keys(by));tops.forEach(function(t){by[t]=R.sh(by[t]);});
    var total=tops.reduce(function(s,t){return s+by[t].length;},0),k=Math.min(cfg.n[li],total),picked=[];

/* Вибір завдань: структура залежить лише від коду зрізу (клас, предмет, теми) і точки, а числа — від учня.
   К1 однаковий за структурою в усіх точках; К2 — свій для кожної точки. Якірні однакові в усіх точках для одного учня. */
function pickGens(pool,spec,k,used){
  var by={};pool.forEach(function(g){if(used.indexOf(g.id)<0)(by[g.t]=by[g.t]||[]).push(g);});
  var tops=spec.sh(Object.keys(by).sort());tops.forEach(function(t){by[t]=spec.sh(by[t].sort(function(a,b){return a.id<b.id?-1:1;}));});
  var out=[];
  while(out.length<k){var moved=false;tops.forEach(function(t){if(out.length<k&&by[t].length){out.push(by[t].shift());moved=true;}});if(!moved)break;}
  return out;
}
function mkTaskM(g,slot,key){
  var t=mkTask(g,slot.L,slot.p,key);
  t.c=slot.c;if(slot.an)t.an=1;
  if(slot.ar){t.rb=1;t.aut=0;t.opn=slot.p;if(!t.open)t.open="Запиши відповідь і поясни, як ти її знайшов(ла).";if(!t.rub)t.rub="Ключ: "+t.right+". 4 — правильний результат + повне пояснення ходу міркувань і виділено всі суттєві елементи; 3 — результат правильний, пояснення неповне, або пояснення правильне з однією обчислювальною помилкою; 2 — частина елементів виділена, результат хибний; 1 — лише фрагмент; 0 — не по суті.";}
  else if(slot.rb&&t.open){t.rb=1;t.aut=0;t.opn=slot.p;}
  return t;
}
function buildMon2(cfg,name){
  var pt=cfg.pt|0,slots=monSlots(pt,cfg.ar?1:0),used=[],chosen=[];
  var key="mon|"+name+"|"+cfg.id+"|"+pt,keyA="mon|"+name+"|"+cfg.id+"|anchor";
  LV.forEach(function(L){
    [1,2].forEach(function(c){
      var sl=slots.filter(function(s){return s.L===L&&s.c===c;});if(!sl.length)return;
      var spec=mkR(c===1?"mon1|"+cfg.id+"|"+L:"mon2|"+cfg.id+"|"+pt+"|"+L);
      var gens=pickGens(poolOf({tp:c===1?cfg.tp:cfg.tk},L),spec,sl.length,used);
      gens.forEach(function(g,i){used.push(g.id);chosen.push(mkTaskM(g,sl[i],sl[i].an?keyA:key));});
    });
  });
  var R=mkR(key+"|order"),out=[];
  BLK.forEach(function(b){R.sh(chosen.filter(function(t){return b[1].indexOf(t.l)>=0;})).forEach(function(t){t.blk=b[0];out.push(t);});});
  return out;
}

/* Попередня версія (посилання v:1): по 2 завдання на рівень, однакові теми в обох точках */
function buildMon(cfg,name){
  if(cfg.v>=3)return buildKit(cfg);
  if(cfg.v>=2)return buildMon2(cfg,name);
  var spec=mkR("mon|"+cfg.id),chosen=[],key="mon|"+name+"|"+cfg.id+"|"+cfg.pt;
  LV.forEach(function(L,li){
    var by={};poolOf(cfg,L).forEach(function(g){(by[g.t]=by[g.t]||[]).push(g);});
    var tops=spec.sh(Object.keys(by).sort());tops.forEach(function(t){by[t]=spec.sh(by[t].sort(function(a,b){return a.id<b.id?-1:1;}));});
    var total=tops.reduce(function(s,t){return s+by[t].length;},0),k=Math.min(cfg.n[li],total),picked=[];
    while(picked.length<k){tops.forEach(function(t){if(picked.length<k&&by[t].length)picked.push(by[t].shift());});}
    var pts=(L==="Оц"||L==="Ст")?4:2;
    picked.forEach(function(g){chosen.push(mkTask(g,L,pts,key));});
  });
  var R=mkR(key+"|order"),out=[];
  BLK.forEach(function(b){R.sh(chosen.filter(function(t){return b[1].indexOf(t.l)>=0;})).forEach(function(t){t.blk=b[0];out.push(t);});});
  return out;
}

  4:{l:"Ан",c:1,k:"rub",pts:4,
     stim:"Мама двічі купувала яблука на однакову суму грошей. Першого разу ціна була 20 грн за кілограм, другого — 30 грн за кілограм. Сусідка вважає, що середня ціна за всю покупку — 25 грн за кілограм.",
     q:"Нехай щоразу мама витрачала m грн. Запишіть дробами, скільки кілограмів вона купила першого й другого разу та разом (спростіть). Обчисліть загальну кількість кілограмів для m = 300. Знайдіть середню ціну (вся сума : вся кількість) і поясніть, чому вона не залежить від m.",

  6:{l:"Ст",c:1,k:"rub",pts:4,

     q:"Складіть власну задачу, відповідь у якій записується алгебраїчним дробом зі змінною (ціна, продуктивність, час роботи). Спростіть вираз, обчисліть його для двох значень змінної і поясніть, які значення змінної недопустимі та чому це має сенс у задачі.",

KITS["A9"].fin={t:{
  1:{l:"Зн",c:2,k:"mcs",pts:4,q:"Оберіть правильну відповідь.",
     parts:[["Абсциса вершини параболи y = x<sup>2</sup> − 4x + 3:",["−2","2","4","−4"],1],["Розв'язок нерівності x<sup>2</sup> − 9 < 0:",["(−∞; −3) ∪ (3; +∞)","(−3; 3)","(−∞; 3)","(3; +∞)"],1],["Арифметична прогресія: a<sub>1</sub> = 3, d = 2. Тоді a<sub>5</sub> =",["9","11","13","15"],1],["Геометрична прогресія: b<sub>1</sub> = 2, q = 3. Тоді b<sub>3</sub> =",["8","12","18","54"],2]]},
  3:{l:"Зс",c:2,k:"nums",pts:4,q:"Виконайте завдання.",
     parts:[["(а) Знайдіть нулі функції y = x<sup>2</sup> − 5x + 6 (через кому, від меншого):",["2,3"],"txt"],["(б) Розв'яжіть нерівність x<sup>2</sup> − 4x − 5 ≤ 0 (відповідь проміжком, наприклад [1; 2]):",["[-1;5]"],"txt"],["(в) Арифметична прогресія: a<sub>1</sub> = 5, d = 3. Знайдіть суму перших десяти членів:",185],["(г) Геометрична прогресія: b<sub>1</sub> = 3, q = 2. Знайдіть b<sub>5</sub>:",48]]},
  4:{l:"Ан",c:1,k:"rub",pts:4,
     stim:"Гурток організовує майстер-клас. Оренда зали — 4 500 грн за всю залу (30 місць). Матеріали — 120 грн на учасника. Також будуть 2 організатори: вони не платять, але займають місця в залі. Керівник вирішив, що внесок з одного учасника (зала + матеріали) має бути не більшим за 300 грн.",
     q:"Нехай прийде n учасників. Запишіть вираз для внеску одного учасника. Складіть систему нерівностей, що враховує обидві умови: внесок не більший за 300 грн і всі мають вміститися в залі. Розв'яжіть її та поясніть, що означає кожна межа відповіді.",
     open:"Запиши розв'язання й пояснення меж (перевіряє вчитель).",
     rub:"Ключ: внесок (4 500 + 120n) / n. Умови: (4 500 + 120n) / n ≤ 300 → 4 500 ≤ 180n → n ≥ 25 (множимо на n > 0, знак не змінюється); n + 2 ≤ 30 → n ≤ 28. Відповідь: 25 ≤ n ≤ 28. Нижня межа — при меншій кількості оренда розкладається на замало людей і внесок перевищить 300 грн; верхня — обмеження місць. 4 — вираз + система + розв'язок + пояснення обох меж (зокрема чому при множенні на n знак не змінюється). 3 — без пояснення однієї межі або з однією неточністю. 2 — розв'язано лише одну нерівність. 1 — лише вираз внеску або числові проби. 0 — не по суті."},
  6:{l:"Ст",c:1,k:"rub",pts:4,
     q:"Складіть власну задачу з життєвою ситуацією (подарунок, оренда залу, друк футболок), яка зводиться до системи двох нерівностей (однією з них може бути квадратна) і має відповідь у вигляді проміжку цілих значень. Розв'яжіть її і поясніть зміст кожної межі.",
     open:"Запиши задачу, розв'язання й пояснення (перевіряє вчитель).",
     rub:"Умови: контекст, відмінний від екскурсії й майстер-класу; дві умови-обмеження; відповідь — непорожній проміжок цілих значень; правильний розв'язок; пояснення меж. 4 — усі умови. 3 — одна вада. 2 — одна нерівність замість системи або змінені числа в задачі про екскурсію чи майстер-клас. 1 — лише нерівність без умови. 0 — немає."}
}};

KITS["A10"].fin={t:{
  1:{l:"Зн",c:2,k:"mcs",pts:4,q:"Оберіть правильну відповідь.",
     parts:[["sin 30° =",["[[1|2]]","[[√3|2]]","1","0"],0],["Розв'язки рівняння cos x = 0:",["x = πn","x = [[π|2]] + πn","x = 2πn","x = π + 2πn"],1],["Похідна функції y = x<sup>3</sup>:",["x<sup>2</sup>","3x<sup>2</sup>","3x","[[x<sup>4</sup>|4]]"],1],["Похідна функції y = 2x<sup>2</sup> − 5x:",["4x − 5","2x − 5","4x<sup>2</sup> − 5","x − 5"],0]]},

  4:{l:"Ан",c:1,k:"rub",pts:4,
     stim:"Іграшкову ракету запустили вертикально вгору від рівня землі. Її висота (у метрах) через t секунд описується формулою h(t) = −2t² + 12t (опір повітря не враховуємо).",
     q:"Дослідіть модель: (а) яка область визначення функції має зміст у цій ситуації і чому; (б) на якому проміжку ракета піднімається, а на якому падає; (в) знайдіть найбільшу висоту і час, коли її досягнуто (за допомогою похідної); (г) скільки часу ракета перебувала вище 10 м?",
     open:"Запиши відповіді на (а)–(г) з обґрунтуванням (перевіряє вчитель).",
     rub:"Ключ: (а) [0; 6]: від запуску до падіння на землю (h = 0 при t = 0 і t = 6), хоча формула визначена для всіх t. (б) зростає на [0; 3], спадає на [3; 6]. (в) h′(t) = −4t + 12 = 0 → t = 3; h(3) = 18 м. (г) −2t² + 12t ≥ 10 → t² − 6t + 5 ≤ 0 → 1 ≤ t ≤ 5, тобто 4 с. 4 — усі 4 частини з обґрунтуванням. 3 — 3 частини або 4 без обґрунтування (а). 2 — 2 частини. 1 — 1. 0 — не по суті."},
  6:{l:"Ст",c:1,k:"rub",pts:4,
     stim:"Іграшкову ракету запустили вертикально вгору від рівня землі. Її висота (у метрах) через t секунд описується формулою h(t) = −2t² + 12t (опір повітря не враховуємо).",
     q:"Складіть власну задачу з реальною ситуацією (фонтан, стрибок у довжину, траєкторія кидка, прибуток від ціни квитка), яка описується квадратичною функцією. Сформулюйте три запитання: про область визначення, що має зміст, про найбільше або найменше значення (можна через похідну) і про проміжок, де величина більша за певне число. Розв'яжіть їх.",
     open:"Запиши задачу, три запитання й розв'язання (перевіряє вчитель).",
     rub:"Умови: життєвий контекст, відмінний від м'яча й ракети; функція правдоподібна (числа реалістичні); три запитання за умовою; правильний розв'язок; область визначення пояснена змістом ситуації. 4 — усі умови. 3 — одна вада. 2 — задача про ракету чи м'яч зі зміненими числами або без одного з трьох запитань. 1 — лише формула. 0 — немає."}
}};

KITS["G7"].fin={t:(function(){
  var stim="Дві паралельні вулиці — Лісова (пряма a) і Польова (пряма b) — перетинає провулок Центральний (пряма c) у точках P і Q відповідно. На прямій a точки K і L лежать по різні боки від P, на прямій b точки M і N — по різні боки від Q; K і M з одного боку від провулка. ∠LPQ = 70°. Рисунок виконано не в масштабі."+
   '<svg viewBox="0 0 340 215" class="kfig" role="img" aria-label="Паралельні прямі a і b та січна c"><g stroke="currentColor" stroke-width="2"><line x1="20" y1="70" x2="320" y2="70"/><line x1="20" y1="140" x2="320" y2="140"/><line x1="128" y1="23" x2="188" y2="187"/></g><circle cx="145" cy="70" r="3.5" fill="currentColor"/><circle cx="170.5" cy="140" r="3.5" fill="currentColor"/><path d="M 175 70 A 30 30 0 0 1 155.3 98.2" fill="none" stroke="#d9534f" stroke-width="1.6"/><text x="176" y="92" font-size="13" fill="#d9534f">70°</text><g font-size="14" font-weight="700" fill="currentColor"><text x="14" y="62">K</text><text x="318" y="62" text-anchor="end">L</text><text x="14" y="132">M</text><text x="318" y="132" text-anchor="end">N</text><text x="132" y="62" text-anchor="end">P</text><text x="182" y="156">Q</text><text x="180" y="17">c</text><text x="300" y="86">a</text><text x="300" y="156">b</text></g></svg>';
  return {
  1:{l:"Зн",c:2,k:"mcs",pts:4,q:"Оберіть правильну відповідь.",
     parts:[["Сума кутів трикутника:",["90°","180°","360°","залежить від трикутника"],1],["Ознака рівності трикутників:",["за трьома кутами","за двома сторонами й кутом між ними","за двома кутами","за двома сторонами"],1],["Якщо a ∥ b і c — січна, то внутрішні різносторонні кути:",["рівні","у сумі дають 180°","завжди прямі","у сумі дають 90°"],0],["Кути при основі рівнобедреного трикутника:",["різні","рівні","прямі","у сумі дають 90°"],1]]},
  3:{l:"Зс",c:2,k:"nums",pts:4,q:"Виконайте завдання.",
     parts:[["(а) У трикутнику два кути дорівнюють 55° і 65°. Знайдіть третій кут (у градусах):",60],["(б) У рівнобедреному трикутнику кут при вершині 40°. Знайдіть кут при основі (у градусах):",70],["(в) Прямі a і b паралельні, c — січна. Один із внутрішніх односторонніх кутів дорівнює 65°. Знайдіть другий (у градусах):",115],["(г) Зовнішній кут трикутника при вершині дорівнює 110°, один із внутрішніх кутів, не суміжних з ним, — 45°. Знайдіть інший такий кут (у градусах):",65]]},
  4:{l:"Ан",c:1,k:"rub",pts:4,stim:stim,
     q:"Знайдіть ∠PQM, ∠KPQ і ∠PQN. Запишіть розв'язання по кроках і біля кожного кроку вкажіть властивість чи означення. Чи перпендикулярний провулок Центральний до вулиць? Обґрунтуйте.",
     open:"Запиши розв'язання по кроках з обґрунтуванням і висновок (перевіряє вчитель).",
     rub:"Ключ: ∠PQM = ∠LPQ = 70° (внутрішні різносторонні кути при паралельних прямих a і b та січній c); ∠KPQ = 180° − 70° = 110° (суміжні); ∠PQN = 180° − 70° = 110° (суміжні з ∠PQM). Провулок не перпендикулярний до вулиць: 70° ≠ 90°. 4 — правильні відповіді + усі обґрунтування + висновок про перпендикулярність. 3 — без одного обґрунтування або без висновку. 2 — правильні відповіді без обґрунтувань. 1 — один кут. 0 — не по суті."},
  6:{l:"Ст",c:1,k:"rub",pts:4,stim:stim,
     q:"Складіть власну задачу про життєвий об'єкт (залізничні колії, сходи, лінії в зошиті, смуги на дорозі), у якій треба використати властивості паралельних прямих і січної. Зробіть рисунок і розв'яжіть задачу.",
     open:"Запиши задачу, опиши рисунок і розв'язання (перевіряє вчитель; рисунок можна показати вчителю на папері).",
     rub:"Умови: життєвий контекст, відмінний від вулиць; використано паралельні прямі й січну та хоча б одну властивість кутів; даних достатньо і вони не суперечливі; рисунок відповідає умові; правильний розв'язок з обґрунтуванням. 4 — усі умови. 3 — одна вада. 2 — задача лише на суміжні кути без паралельних прямих або змінені числа в задачі про вулиці. 1 — лише рисунок або умова. 0 — немає."}
  };})()};

KITS["G8"].fin={t:(function(){
  var stim="Тесля збив дерев'яну раму воріт ABCD і виміряв: AB = CD = 60 см, BC = AD = 80 см, діагоналі AC = 96 см, BD = 104 см. Рама має бути прямокутною.";
  return {
  1:{l:"Зн",c:2,k:"mcs",pts:4,q:"Оберіть правильну відповідь.",
     parts:[["Площа прямокутника зі сторонами 6 і 4:",["10","20","24","48"],2],["Катети прямокутного трикутника 6 і 8. Гіпотенуза дорівнює:",["10","14","12","48"],0],["Подібні трикутники з коефіцієнтом подібності 2. Відношення їхніх площ:",["2","4","8","6"],1],["Площа паралелограма дорівнює:",["сумі основ на висоту","добутку основи на висоту","півдобутку діагоналей","півсумі основ на висоту"],1]]},
  3:{l:"Зс",c:2,k:"nums",pts:4,q:"Виконайте завдання.",
     parts:[["(а) Сторона трикутника 10 см, проведена до неї висота 6 см. Знайдіть площу (см²):",30],["(б) Гіпотенуза прямокутного трикутника 13 см, один катет 5 см. Знайдіть другий катет (см):",12],["(в) Трикутники подібні з коефіцієнтом 3. Периметр меншого — 12 см. Знайдіть периметр більшого (см):",36],["(г) Основи трапеції 4 см і 10 см, висота 5 см. Знайдіть площу (см²):",35]]},
  4:{l:"Ан",c:1,k:"rub",pts:4,stim:stim,
     q:"За вимірюваннями визначте: чи є рама паралелограмом (за якою ознакою)? Чи є вона прямокутником? Якою мала б бути діагональ AC, щоб кут B був прямим (обґрунтуйте теоремою)? Що треба змінити в рамі і як це перевірити без кутоміра?",
     open:"Запиши висновки з назвами ознак і теорем (перевіряє вчитель).",
     rub:"Ключ: паралелограм: протилежні сторони попарно рівні. Не прямокутник: діагоналі не рівні (96 ≠ 104). Кут B прямий, якби AC² = AB² + BC² = 3 600 + 6 400 = 10 000, тобто AC = 100 см (обернена теорема Піфагора); фактично 96 ≠ 100, тож кут B не прямий. Треба виправити перекіс, не змінюючи сторін, доки діагоналі стануть рівними (по 100 см); перевірка — рулеткою по діагоналях. 4 — усі частини з названими ознаками й теоремою. 3 — правильні висновки, але одну ознаку чи теорему не названо. 2 — лише «не прямокутник, бо діагоналі різні». 1 — один правильний висновок. 0 — не по суті."},

/* ================= Панель вчителя (моніторинг) =================
   Показники за розділом 4 ТЗ: P = бали за рівень ÷ максимум рівня × 100 %;
   Δ = P2 − P1; g = (P2 − P1) ÷ (100 − P1); рівні сформованості 90 / 74 / 60 %;
   S(TGI) = 0,73·(Зн+Ро)/2 + 0,16·(Зс+Ан)/2 + 0,11·(Оц+Ст)/2. */
function normName(x){return String(x.name||"").toLowerCase().replace(/\s+/g," ").trim();}
var PTL=["Вхід","Підсумок","Проміжний"];
function aggT(tasks,pred){var e=0,m=0;tasks.forEach(function(r){if(pred(r)){e+=gotOf(r);m+=r.pts;}});return m?Math.round(e*100/m):null;}
function lvPct(x){var S=summarize(x.tasks),o={};
  LV.forEach(function(L){o[L]=S.lv[L].m?Math.round(S.lv[L].e*100/S.lv[L].m):null;});
  o.all=pct(S.score,S.max);o.pending=S.pending;
  o.k1=aggT(x.tasks,function(r){return r.c===1;});
  o.an=aggT(x.tasks,function(r){return r.an;});
  o.k1r=aggT(x.tasks,function(r){return r.c===1&&!r.an;});
  o.raw={};LV.forEach(function(L){o.raw[L]=S.lv[L].m?S.lv[L].e:"";});
  o.anRaw=0;x.tasks.forEach(function(r){if(r.an)o.anRaw+=gotOf(r);});
  return o;}
function mean(a){a=a.filter(function(v){return v!=null;});return a.length?Math.round(a.reduce(function(s,v){return s+v;},0)/a.length):null;}
function median(a){a=a.filter(function(v){return v!=null;}).sort(function(x,y){return x-y;});if(!a.length)return null;var m=a.length>>1;return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2);}
function dlt(a,b){return a==null||b==null?null:b-a;}
function dtxt(d){return d==null?"—":(d>0?"+":"")+d;}
function dcls(d){return d==null?"":d>=10?"ok":d<=-10?"a":"";}
function nf(x){return String(Math.round(x*100)/100).replace(".",",").replace("-","−");}
/* індекс Хейка; для P1 ≥ 90 % дивимося на утримання рівня */
function gx(a,b){if(a==null||b==null)return null;if(a>=90)return {hold:true,ok:b>=90};return {g:(b-a)/(100-a)};}
function gtxt(o){return o==null?"—":o.hold?(o.ok?"утр.":"↓"):nf(o.g);}
function glab(g){return g>=0.5?"високий приріст":g>=0.3?"стійкий приріст":g>=0.1?"слабкий приріст":"без зрушень або регрес";}
function gcls(o){return o==null||o.hold?"":o.g>=0.3?"ok":o.g<0.1?"a":"";}
function stgi(p){if(!p)return null;for(var i=0;i<LV.length;i++)if(p[LV[i]]==null)return null;return Math.round(0.73*(p["Зн"]+p["Ро"])/2+0.16*(p["Зс"]+p["Ан"])/2+0.11*(p["Оц"]+p["Ст"])/2);}

      given=t.items.map(function(it,j){return (a.ms[j]?"✓":"–");}).join(" ");right=t.items.map(function(it){return it[1]?"✓":"–";}).join(" ");}
    else if(t.k==="nums"){part=0;t.parts.forEach(function(p,j){if(numOk(p,a.ps[j]))part++;});ok=part===t.pts;
      given=t.parts.map(function(p,j){return a.ps[j]||"—";}).join("; ");right=t.parts.map(function(p){return fm(Array.isArray(p[1])?p[1][0]:p[1]);}).join("; ");}
    else if(t.k==="mcs"){part=0;t.parts.forEach(function(p,j){if(a.ps[j]===p[2])part++;});ok=part===t.pts;
      given=t.parts.map(function(p,j){return a.ps[j]==null?"—":p[1][a.ps[j]];}).join("; ");right=t.parts.map(function(p){return p[1][p[2]];}).join("; ");}
    else if(t.k==="rub"){given="";}
    else if(/\d/.test(a.txt)){given=a.txt;ok=Math.abs(parseNum(a.txt)-t.a)<0.0005;}
    return {l:t.l,t:t.t,blk:t.blk,pts:t.pts,aut:t.aut,opn:t.opn,q:t.q,k:t.k,given:given,right:right,ok:ok,otext:a.otext,rub:t.rub,open:t.open,ograde:null,c:t.c||0,an:t.an||0,rb:t.rb||0,part:part};});
  var S=summarize(recs),g=grade12(S.score);
  var res={recs:recs,S:S,g:g,start:T0,end:end,dur:(end-T0)/1000,exits:EXITS,away:Math.round(AWAY)};
  showResult(res);saveResult(res);
}
function showResult(r){
  if(MON){showResultM(r);return;}
  var S=r.S,o=CFG.o,h='<div class="screen"><div class="card fill"><div class="scroll"><div class="center"><h1>Роботу здано</h1><div class="sub">'+esc(ST.sn+" "+ST.fn)+' · '+esc(CFG.t)+'</div>';
  if(PREV)h+='<div class="banner">Попередній перегляд: результат не збережено</div>';
  if(o.grade)h+='<span class="badge">Орієнтовна оцінка: '+(S.pending?"≈ ":"")+r.g+' з 12</span>'+(S.pending?'<div class="note">Частину відповідей ще перевірить учитель, тому оцінка може змінитися.</div>':"");
  else h+='<div class="note">Результат побачить учитель.</div>';
  h+='<div class="stats"><div class="stat"><b>'+dur(r.dur)+'</b><span>час виконання</span></div><div class="stat"><b>'+r.exits+'</b><span>виходів із вікна</span></div></div>';
  h+='<div class="note">Учитель бачить кількість виходів із вікна.</div></div>';
  if(o.prof){
    h+='<h2>Рівні мислення</h2>'+bars(S.lv);
    var rep=Object.keys(S.tp).filter(function(t){return S.tp[t].m&&S.tp[t].e/S.tp[t].m<0.6;});
    if(rep.length)h+='<h2>Що повторити</h2>'+rep.map(function(t){return '<div class="mis">'+esc(TOPN[t])+'</div>';}).join("");
    else h+='<h2>Висновок</h2><div class="mis">Усі перевірені теми засвоєно на доброму рівні.</div>';
  }
  if(o.err){var w=r.recs.filter(function(x){return !x.ok&&x.aut>0;});
    if(w.length){h+='<h2>Розбір помилок ('+w.length+')</h2>'+w.map(function(x){return '<div class="mis">'+fmt(x.q)+'<br><span class="a">Твоя відповідь: '+(x.given?fmt(esc(x.given)):"— (не знаю)")+'</span><br><span class="ok">Правильна відповідь: '+fmt(x.right)+'</span></div>';}).join("");}}
  h+='</div></div></div>';
  $("app").innerHTML=h;
}

/* ================= Firebase і панель вчителя ================= */
var CFG_FB=null;
function fbReady(){
  if(CFG_FB)return CFG_FB;
  var base="https://www.gstatic.com/firebasejs/"+FBV+"/";
  CFG_FB=Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]).then(function(m){
    var app=m[0].initializeApp(FIREBASE_CONFIG),au=m[1].getAuth(app);
    return m[1].signInAnonymously(au).then(function(){return {fs:m[2],db:m[2].getFirestore(app)};});
  });
  CFG_FB.catch(function(){CFG_FB=null;});
  return CFG_FB;
}
function fbCol(F){var fs=F.fs,db=F.db;
  return {
    doc:function(id){var ref=fs.doc(db,"artifacts",FB_APP,"public","data",FB_COL,id);return {set:function(d){return fs.setDoc(ref,d);},update:function(d){return fs.updateDoc(ref,d);}};},
    get:function(){return fs.getDocs(fs.collection(db,"artifacts",FB_APP,"public","data",FB_COL));},
    del:function(ref){return fs.deleteDoc(ref);}
  };}
function pack(res){
  var S=res.S;
  return {surname:ST.sn,first:ST.fn,name:ST.sn+" "+ST.fn,code:CFG.id,title:CFG.t,subject:SUBJ[CFG.s],grade:CFG.g,
    id:SID,test:CFG.t,ts:res.end,date:new Date(res.end).toISOString(),leaves:res.exits,durationSec:Math.round(res.dur),start:new Date(res.start).toISOString(),end:new Date(res.end).toISOString(),durSec:Math.round(res.dur),exits:res.exits,awaySec:res.away,
    score:S.score,grade12:res.g,pending:S.pending,lv:S.lv,tasks:res.recs,pt:CFG.pt||0,yr:CFG.yr||"",per:CFG.per||"",mon:MON?1:0};
}
function saveResult(res){
  if(PREV||!FIREBASE_CONFIG)return;
  fbReady().then(function(db){return fbCol(db).doc(SID).set(pack(res));}).catch(function(){});
}

function teacherPanel(){
  if(MON){teacherPanelM();return;}
  var p=prompt("Пароль вчителя:");if(p!==TEACHER_PASSWORD)return;
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="box"><div class="act" style="margin-top:0"><b style="color:#5a4b8a">Результати учнів</b><span><select id="wk" style="width:auto;display:inline-block"></select> <button class="btn sm soft" id="csv">CSV</button> <button class="btn sm soft" id="clr">Очистити</button> <button class="btn sm" id="cls">Закрити</button></span></div><div id="tb">Завантаження…</div></div>';
  document.body.appendChild(m);
  $("cls").onclick=function(){document.body.removeChild(m);};
  var ROWS=[];
  function load(){
    $("tb").textContent="Завантаження…";
    fbReady().then(function(db){return fbCol(db).get();}).then(function(snap){
      ROWS=[];snap.forEach(function(d){var x=d.data();x._id=d.id;ROWS.push(x);});
      ROWS.sort(function(a,b){return String(b.end).localeCompare(String(a.end));});
      var works={};ROWS.forEach(function(x){works[x.code]=x.title;});
      $("wk").innerHTML='<option value="">Усі роботи</option>'+Object.keys(works).map(function(c){return '<option value="'+esc(c)+'">'+esc(works[c])+' ['+esc(c)+']</option>';}).join("");
      $("wk").onchange=render;render();
    }).catch(function(){$("tb").textContent=FIREBASE_CONFIG?"Не вдалося завантажити результати.":"Збір результатів не підключено: вставте firebaseConfig у файл (змінна FIREBASE_CONFIG на початку скрипта).";});
  }
  function view(){var c=$("wk").value;return ROWS.filter(function(x){return !c||x.code===c;});}
  function render(){
    var rows=view(),h='<table><tr><th>Учень</th><th>Робота</th><th>Здано</th><th>Бал /100</th><th>12 б</th><th>ECTS</th><th>Рівень</th>'+LV.map(function(L){return '<th>'+L+'</th>';}).join("")+'<th>Час</th><th>Виходи</th><th></th></tr>';
    rows.forEach(function(x,i){var S=summarize(x.tasks),g=grade12(S.score);
      h+='<tr class="cl" data-i="'+i+'"><td>'+esc(x.name)+'</td><td>'+esc(x.title)+'</td><td>'+esc(String(x.end).slice(0,16).replace("T"," "))+'</td><td><b>'+S.score+'</b>'+(S.pending?" ⏳":"")+'</td><td>'+g+'</td><td>'+ectsOf(S.score)+'</td><td>'+esc(compLevel(S.score))+'</td>'+LV.map(function(L){return '<td>'+pct(S.lv[L].e,S.lv[L].m)+'%</td>';}).join("")+'<td>'+dur(x.durSec)+'</td><td>'+x.exits+(x.awaySec?" ("+x.awaySec+" с)":"")+'</td><td>'+(S.pending?'<span class="chip">перевірити</span>':"")+'</td></tr>';});
    h+='</table>';if(!rows.length)h="Результатів поки немає.";
    $("tb").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll("tr.cl"),function(tr){tr.onclick=function(){detail(rows[+tr.dataset.i]);};});
  }
  function detail(x){
    var d=document.createElement("div");d.className="modal";
    var S=summarize(x.tasks);
    var h='<div class="box"><div class="act" style="margin-top:0"><b style="color:#5a4b8a">'+esc(x.name)+' · '+esc(x.title)+'</b><button class="btn sm" id="dc">Закрити</button></div>';
    h+='<div class="note">Бал: <b>'+S.score+' з 100</b> · 12-бальна: '+grade12(S.score)+' · ECTS '+ectsOf(S.score)+' · рівень компетентності: '+esc(compLevel(S.score))+' · за шкалою TGI відповідає рівню: '+bloomByScore(S.score)+'</div>';
    h+='<h2>Профіль за рівнями Блума</h2>'+bars(S.lv);
    h+='<h2>Блоки</h2><div class="note">'+BLK.map(function(b){return BLKN[b[0]]+': <b>'+S.bl[b[0]].e+' з '+S.bl[b[0]].m+'</b>';}).join(" · ")+'</div><h2>Завдання</h2>';
    x.tasks.forEach(function(r,i){
      h+='<div class="gtask"><b>'+(i+1)+'. '+LVN[r.l]+'</b> · '+esc(TOPN[r.t]||r.t)+' · '+r.pts+' б<br>'+fmt(r.q)+'<br>Відповідь учня: '+(r.given?fmt(esc(r.given)):"—")+' · правильно: '+fmt(r.right)+' · '+(r.ok?"✓ "+r.aut+" б":"✗ 0 б");
      if(r.opn)h+='<br><i>Завдання відкритої частини:</i> '+esc(r.open)+'<br><i>Рубрика:</i> '+esc(r.rub)+'<br><i>Відповідь учня:</i> '+(r.otext&&r.otext.trim()?'<span style="white-space:pre-wrap">'+esc(r.otext)+'</span>':"— (порожньо)")+'<br>'+(r.otext&&r.otext.trim()?'Бали за відкриту частину (0–'+r.opn+'): <input type="number" min="0" max="'+r.opn+'" data-r="'+i+'" value="'+(r.ograde==null?"":r.ograde)+'">':"");
      h+='</div>';});
    h+='<div class="center"><button class="btn" id="sv">Зберегти бали</button></div></div>';
    d.innerHTML=h;document.body.appendChild(d);
    $("dc").onclick=function(){document.body.removeChild(d);};
    $("sv").onclick=function(){
      Array.prototype.forEach.call(d.querySelectorAll("input[data-r]"),function(inp){var r=x.tasks[+inp.dataset.r];r.ograde=inp.value===""?null:Math.max(0,Math.min(r.opn,+inp.value));});
      var S2=summarize(x.tasks);x.score=S2.score;x.grade12=grade12(S2.score);x.pending=S2.pending;x.lv=S2.lv;
      fbReady().then(function(db){return fbCol(db).doc(x._id).update({tasks:x.tasks,score:x.score,grade12:x.grade12,pending:x.pending,lv:x.lv});}).then(function(){document.body.removeChild(d);render();});
    };
  }
  $("csv").onclick=function(){
    var rows=view(),L=[["Прізвище","Ім'я","Робота","Здано","Бал","12 б","ECTS"].concat(LV).concat(["Час, с","Виходи"]).join(";")];
    rows.forEach(function(x){var S=summarize(x.tasks);L.push([x.surname,x.first,x.title,x.end,S.score,grade12(S.score),ectsOf(S.score)].concat(LV.map(function(l){return pct(S.lv[l].e,S.lv[l].m)+"%";})).concat([x.durSec,x.exits]).join(";"));});
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\n")],{type:"text/csv"}));a.download="rezultaty.csv";a.click();};
  $("clr").onclick=function(){if(!confirm("Видалити всі результати?"))return;
    fbReady().then(function(db){return fbCol(db).get().then(function(snap){var ps=[];snap.forEach(function(d){ps.push(fbCol(db).del(d.ref));});return Promise.all(ps);});}).then(load);};
  load();
}

boot();

</script>
