<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чотирикутники: перевірка на міцність (8 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#173a26;--muted:#5b7d69;--acc:#2f8f5b;--acc2:#56b383;--accL:#dff3e6;--soft:#eefaf2;--soft2:#f7fcf9;--line:#c3e6d0;
--ok:#1f9d55;--okBg:#e3f7ea;--bad:#d64545;--badBg:#fde8e8;--warn:#b7791f;--warnBg:#fff4d6;--o1:#e0822b}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eefaf2 0%,#dff3e6 45%,#cdeedb 100%) fixed;-webkit-text-size-adjust:100%}
i{font-family:'Times New Roman',Times,serif;font-style:italic}
b{font-weight:800}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:.4rem .7rem .2rem;max-width:78rem;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.15rem .1rem}
.brand{font-weight:900;font-size:.95rem;color:var(--acc);letter-spacing:.01em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname{font-size:.8rem;font-weight:800;color:var(--muted);white-space:nowrap}
.score{background:#fff;border:2px solid var(--line);border-radius:2rem;padding:.15rem .8rem;font-weight:900;font-size:.95rem;white-space:nowrap}
.score b{color:var(--acc)}
#prog{height:.35rem;background:rgba(255,255,255,.7);border-radius:1rem;overflow:hidden;margin:.15rem 0 .35rem}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .35s}
#stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:.1rem}
#stage>.card{margin:auto}
.card{background:#fff;border:2px solid var(--line);border-radius:1.2rem;padding:1rem 1.4rem;box-shadow:0 .4rem 1.4rem rgba(47,143,91,.12);width:min(100%,62rem)}
.card.wide{width:min(100%,64rem)}
.center{text-align:center}
h1{font-size:1.9rem;margin:.1rem 0 .1rem;color:var(--acc);line-height:1.15}
.sub{color:var(--muted);font-weight:700;font-size:.9rem;margin:.1rem 0 .6rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem;align-items:center}
.pill{background:var(--accL);color:var(--acc);border-radius:2rem;padding:.12rem .7rem;font-weight:800;font-size:.72rem}
.pill.g7{background:var(--warnBg);color:var(--warn)}
.pill.ref{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.q{font-size:1.35rem;font-weight:800;line-height:1.35;margin:.2rem 0 .7rem}
.ans{background:var(--soft);border:2px solid var(--acc2);border-radius:.9rem;padding:.7rem 1rem;font-size:1.05rem;line-height:1.5;margin:.4rem 0}
.ans .lbl{font-size:.7rem;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.15rem}
.flipin{animation:flipin .45s ease}
@keyframes flipin{from{transform:rotateX(80deg);opacity:0}to{transform:none;opacity:1}}
.hint{background:var(--warnBg);border:2px solid #f3d98a;border-radius:.9rem;padding:.5rem .9rem;font-size:.95rem;font-weight:700;margin:.4rem 0}
.sol{background:var(--soft);border:2px dashed var(--acc2);border-radius:.9rem;padding:.55rem .9rem;font-size:.95rem;line-height:1.5;margin:.4rem 0}
.sol .lbl{font-size:.7rem;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.fb{min-height:1.5rem;font-weight:900;font-size:1.05rem;margin:.25rem 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.5rem}
.btn{font:inherit;font-weight:800;font-size:.95rem;min-height:2.7rem;padding:.45rem 1.1rem;border-radius:.8rem;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.btn small{font-size:.62rem;font-weight:700;color:var(--muted)}
.btn:hover{border-color:var(--acc2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary small{color:#dff3e6}
.btn.primary:hover{background:#277a4d}
.btn.ghost{background:var(--warnBg);border-color:#f3d98a}
.btn.link{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;min-height:2.2rem}
.btn.good{background:var(--okBg);border-color:var(--ok);color:#14653a}
.btn.mid{background:var(--warnBg);border-color:#e6c25a;color:#7a5200}
.btn.no{background:var(--badBg);border-color:var(--bad);color:#8f2a2a}
.rate{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem;align-items:center}
.rate .lbl2{font-weight:800;font-size:.85rem;color:var(--muted);width:100%}
.grid2{display:grid;grid-template-columns:1fr minmax(0,.8fr);gap:1rem;align-items:center}
.fig svg{width:100%;height:auto;max-height:36vh;display:block;background:var(--soft2);border:2px solid var(--line);border-radius:.9rem}
.flds{display:flex;flex-direction:column;gap:.45rem;margin:.2rem 0 .3rem}
.fld{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.1rem}
.fld .l{min-width:5.2rem}
.fld input{font:inherit;font-weight:800;width:6.5rem;padding:.3rem .6rem;border:2.5px solid var(--line);border-radius:.7rem;text-align:center;background:#fff;color:var(--ink)}
.fld input:focus,.fld input.act{outline:none;border-color:var(--acc);box-shadow:0 0 0 .2rem var(--accL)}
.fld input.ok{border-color:var(--ok);background:var(--okBg)}
.fld input.bad{border-color:var(--bad);background:var(--badBg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.2rem 0}
.opt{font:inherit;font-weight:800;font-size:1.02rem;text-align:left;padding:.55rem .9rem;border-radius:.8rem;border:2.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
.opt:hover{border-color:var(--acc2)}
.opt.sel{border-color:var(--acc);background:var(--accL)}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--bad);background:var(--badBg);opacity:.7}
.stmt{font-size:1.5rem;font-weight:800;line-height:1.4;text-align:center;margin:.6rem 0 1rem}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tf .btn{min-height:3.6rem;font-size:1.3rem}
.tf .btn.t{background:var(--okBg);border-color:#8fd3ac}.tf .btn.f{background:var(--badBg);border-color:#eba0a0}
.streak{font-weight:900;font-size:.9rem;color:var(--o1)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.6rem;margin:.6rem 0}
.tile{text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:1rem;padding:.6rem .8rem;cursor:pointer;font:inherit;color:var(--ink);touch-action:manipulation}
.tile:hover{border-color:var(--acc);background:#fff}
.tile .ic{font-size:1.5rem}.tile .tn{font-weight:900;font-size:.95rem}.tile .td{font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.25}
.tile .tc{font-size:.7rem;font-weight:900;color:var(--acc)}
.nm{display:flex;gap:.5rem;align-items:center;justify-content:center;margin:.3rem 0;font-weight:800;font-size:.9rem}
.nm input{font:inherit;font-weight:700;padding:.3rem .7rem;border:2px solid var(--line);border-radius:.7rem;width:12rem}
.stars{font-size:2.4rem;letter-spacing:.2rem}
.big{font-size:2.2rem;font-weight:900;color:var(--acc)}
.lvl{font-size:1.25rem;font-weight:900;margin:.1rem 0 .3rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.45rem;margin:.5rem 0;text-align:left}
.mt{border-radius:.8rem;padding:.4rem .65rem;border:2px solid;font-size:.78rem;font-weight:800;line-height:1.25}
.mt .pc{font-size:1.15rem;font-weight:900}
.mt .pp{font-size:.62rem;font-weight:700;opacity:.8}
.mt.g{background:var(--okBg);border-color:#8fd3ac;color:#14653a}
.mt.y{background:var(--warnBg);border-color:#ecce70;color:#7a5200}
.mt.r{background:var(--badBg);border-color:#eba0a0;color:#8f2a2a}
.mt.n{background:#f2f2f2;border-color:#ddd;color:#888}
.legend{font-size:.72rem;font-weight:700;color:var(--muted)}
.todo{text-align:left;font-size:.85rem;line-height:1.4;margin:.4rem 0}
.todo summary{cursor:pointer;font-weight:800}
.todo ul{margin:.2rem 0 .4rem 1.1rem;padding:0}
.rtab{width:100%;border-collapse:collapse;font-size:.85rem;font-weight:700;margin:.4rem 0}
.rtab td,.rtab th{padding:.2rem .5rem;border-bottom:1.5px solid var(--line);text-align:left}
.rtab td:last-child,.rtab th:last-child{text-align:right}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .15rem;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2rem}
.fr>span:last-child{padding:0 .2rem}
#kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;padding:.4rem .2rem;max-width:26rem;margin:0 auto;width:100%}
#kp[hidden]{display:none}
#kp button{font:inherit;font-weight:900;font-size:1.2rem;min-height:2.6rem;border-radius:.7rem;border:2px solid var(--line);background:#fff;color:var(--ink);touch-action:manipulation}
footer{text-align:center;color:#9a9a9a;font-size:10px;letter-spacing:.1em;padding:.15rem 0 .1rem}
footer b{font-weight:800}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.fig svg{max-height:24vh}.tf .btn{font-size:1.1rem}h1{font-size:1.5rem}.card{padding:.8rem .9rem}}

</style>
</head>
<body>
<div id="app">
<header><div class="brand" title="До меню">📐 Чотирикутники · 8 клас</div><div class="rname" id="rn"></div><div class="score" id="sc">⭐ <b>0</b> / 0</div></header>
<div id="prog"><i id="pg"></i></div>
<main id="stage"></main>
<div id="kp" hidden></div>
<footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>
<script>
(function(){"use strict";
/* ===== ДАНІ: теми, картки теорії, твердження для бліцу ===== */
const TOP={
  quad:{n:'Чотирикутник',p:'п. 1'},
  par:{n:'Паралелограм і його властивості',p:'п. 2'},
  sign:{n:'Ознаки паралелограма',p:'п. 3'},
  rect:{n:'Прямокутник',p:'п. 4'},
  rhomb:{n:'Ромб',p:'п. 5'},
  sq:{n:'Квадрат',p:'п. 6'},
  mid:{n:'Середня лінія трикутника',p:'п. 7'},
  trap:{n:'Трапеція',p:'п. 8'},
  tmid:{n:'Середня лінія трапеції',p:'п. 8'},
  g7a:{n:'З 7 класу: кути й паралельні прямі',p:'7 клас'},
  g7b:{n:'З 7 класу: трикутники',p:'7 клас'},
  g7c:{n:'З 7 класу: коло',p:'7 клас'}
};
const TOPIC_ORDER=['quad','par','sign','rect','rhomb','sq','mid','trap','tmid','g7a','g7b','g7c'];

/* t — тема, q — запитання, h — початок відповіді (підказка), a — еталонна відповідь, g7 — з 7 класу */
const CARDS=[
 {t:'quad',q:'Що називають чотирикутником? Які в нього елементи?',
  h:'Фігура з чотирьох точок і чотирьох відрізків, що їх послідовно сполучають…',
  a:'Фігура, що складається з чотирьох точок (вершин) і чотирьох відрізків (сторін), які послідовно їх сполучають. Жодні три вершини не лежать на одній прямій, а сторони, що сполучають сусідні вершини, не перетинаються.<br><b>Елементи:</b> вершини, сторони, кути, діагоналі.'},
 {t:'quad',q:'Які вершини називають сусідніми, а які протилежними? Що таке діагональ чотирикутника?',
  h:'Сусідні вершини — це кінці однієї…',
  a:'Сусідні вершини — кінці однієї сторони; протилежні — ті, що не є сусідніми. <b>Діагональ</b> — відрізок, що сполучає дві протилежні вершини. У чотирикутника дві діагоналі.'},
 {t:'quad',q:'Чому дорівнює сума кутів чотирикутника? Як це довести?',
  h:'Проведіть діагональ — чотирикутник розпадеться на…',
  a:'<b>360°.</b> Діагональ ділить чотирикутник на два трикутники, сума кутів кожного 180°, тому 180° + 180° = 360°.'},
 {t:'g7b',g7:1,q:'Чому дорівнює сума кутів трикутника? Що можна сказати про зовнішній кут трикутника?',
  h:'Сума кутів трикутника — … Зовнішній кут дорівнює сумі двох…',
  a:'Сума кутів трикутника дорівнює <b>180°</b>. Зовнішній кут трикутника дорівнює сумі двох внутрішніх кутів, не суміжних із ним.'},
 {t:'par',q:'Дайте означення паралелограма.',
  h:'Чотирикутник, у якого протилежні сторони…',
  a:'<b>Паралелограмом</b> називають чотирикутник, у якого протилежні сторони попарно паралельні.'},
 {t:'par',q:'Назвіть властивості паралелограма: про сторони, кути й діагоналі.',
  h:'Є три основні властивості: сторони, кути, діагоналі…',
  a:'1) Протилежні сторони рівні.<br>2) Протилежні кути рівні.<br>3) Діагоналі точкою перетину діляться навпіл.<br>Крім того, сума кутів, прилеглих до однієї сторони, дорівнює 180°.'},
 {t:'g7a',g7:1,q:'Які кути називають суміжними, а які вертикальними? Яка властивість кожних?',
  h:'Суміжні мають спільну сторону, а дві інші сторони…',
  a:'<b>Суміжні</b> кути мають спільну сторону, а дві інші сторони утворюють розгорнутий кут; їх сума <b>180°</b>.<br><b>Вертикальні</b> кути: сторони одного є продовженням сторін другого; вони <b>рівні</b>.'},
 {t:'g7a',g7:1,q:'Назвіть ознаки паралельності прямих і властивості кутів при паралельних прямих. Що відомо про внутрішні односторонні кути?',
  h:'Січна утворює пари кутів: відповідні, різносторонні, односторонні…',
  a:'Прямі паралельні, якщо при січній рівні відповідні кути, або рівні внутрішні різносторонні, або сума внутрішніх односторонніх дорівнює 180°.<br>Для паралельних прямих усе навпаки: відповідні й різносторонні кути <b>рівні</b>, а сума внутрішніх односторонніх — <b>180°</b>.'},
 {t:'par',q:'Чому в паралелограмі сума кутів, прилеглих до однієї сторони, дорівнює 180°?',
  h:'Протилежні сторони паралельні, а ці кути для них…',
  a:'Протилежні сторони паралельні, а два кути, прилеглі до сторони, є внутрішніми односторонніми при паралельних прямих і січній. Їх сума 180°.'},
 {t:'par',q:'Що називають висотою паралелограма?',
  h:'Перпендикуляр, опущений з будь-якої точки…',
  a:'Перпендикуляр, опущений з будь-якої точки прямої, яка містить сторону паралелограма, на пряму, що містить протилежну сторону.'},
 {t:'sign',q:'Сформулюйте три ознаки паралелограма.',
  h:'Перша: кожні дві протилежні сторони… Друга: дві протилежні сторони… Третя: діагоналі…',
  a:'1) Якщо в чотирикутнику кожні дві протилежні сторони рівні — це паралелограм.<br>2) Якщо в чотирикутнику дві протилежні сторони рівні та паралельні — це паралелограм.<br>3) Якщо в чотирикутнику діагоналі точкою перетину діляться навпіл — це паралелограм.'},
 {t:'g7b',g7:1,q:'Назвіть три ознаки рівності трикутників.',
  h:'За двома сторонами й кутом між ними…',
  a:'1) За двома сторонами й кутом між ними.<br>2) За стороною та двома прилеглими до неї кутами.<br>3) За трьома сторонами.'},
 {t:'rect',q:'Дайте означення прямокутника. Яка його особлива властивість?',
  h:'Паралелограм, у якого всі кути… А діагоналі прямокутника…',
  a:'<b>Прямокутник</b> — паралелограм, у якого всі кути прямі.<br>Особлива властивість: <b>діагоналі прямокутника рівні</b>.'},
 {t:'rect',q:'Сформулюйте ознаки прямокутника.',
  h:'Обидві ознаки починаються словами «якщо в паралелограма…»',
  a:'1) Якщо один із кутів паралелограма прямий — це прямокутник.<br>2) Якщо діагоналі паралелограма рівні — це прямокутник.'},
 {t:'g7b',g7:1,q:'Чому дорівнює сума гострих кутів прямокутного трикутника? Що можна сказати про катет, який лежить проти кута 30°?',
  h:'Сума гострих кутів — … Катет проти 30° дорівнює половині…',
  a:'Сума гострих кутів прямокутного трикутника дорівнює <b>90°</b>.<br>Катет, що лежить проти кута 30°, дорівнює <b>половині гіпотенузи</b>.'},
 {t:'rhomb',q:'Дайте означення ромба. Яка його особлива властивість?',
  h:'Паралелограм, у якого всі… Діагоналі ромба перпендикулярні та є…',
  a:'<b>Ромб</b> — паралелограм, у якого всі сторони рівні.<br>Особлива властивість: діагоналі ромба <b>перпендикулярні</b> та є <b>бісектрисами його кутів</b>.'},
 {t:'rhomb',q:'Сформулюйте ознаки ромба.',
  h:'Обидві ознаки — про діагоналі паралелограма…',
  a:'1) Якщо діагоналі паралелограма перпендикулярні — це ромб.<br>2) Якщо діагональ паралелограма є бісектрисою його кута — це ромб.'},
 {t:'g7b',g7:1,q:'Які властивості має рівнобедрений трикутник?',
  h:'Кути при основі… Медіана, проведена до основи, є ще й…',
  a:'Кути при основі рівнобедреного трикутника рівні. Медіана, проведена до основи, є також <b>висотою</b> і <b>бісектрисою</b>.'},

function nv(a,V,len){const dx=a[0]-V[0],dy=a[1]-V[1],L=Math.hypot(dx,dy)||1;return [dx/L*len,dy/L*len];}
function figure(sp){
  const P=sp.pts;let s='<svg viewBox="0 0 300 190" role="img" aria-label="Рисунок до задачі">';
  s+='<polygon points="'+sp.poly.map(n=>P[n].join(',')).join(' ')+'" fill="#eefaf2" stroke="'+GR+'" stroke-width="3" stroke-linejoin="round"/>';
  (sp.segs||[]).forEach(g=>{const a=P[g[0]],b=P[g[1]];s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+OR+'" stroke-width="3"'+(g[2]?' stroke-dasharray="7 5"':'')+'/>';});
  (sp.rights||[]).forEach(r=>{const V=P[r[0]],u=nv(P[r[1]],V,13),w=nv(P[r[2]],V,13);
    s+='<path d="M'+(V[0]+u[0])+' '+(V[1]+u[1])+' L'+(V[0]+u[0]+w[0])+' '+(V[1]+u[1]+w[1])+' L'+(V[0]+w[0])+' '+(V[1]+w[1])+'" fill="none" stroke="'+OR+'" stroke-width="2"/>';});
  (sp.dots||[]).forEach(n=>{s+='<circle cx="'+P[n][0]+'" cy="'+P[n][1]+'" r="4" fill="'+OR+'"/>';});
  let cx=0,cy=0;sp.poly.forEach(n=>{cx+=P[n][0];cy+=P[n][1]});cx/=sp.poly.length;cy/=sp.poly.length;
  (sp.label||sp.poly.concat(sp.dots||[])).forEach(n=>{
    const p=P[n];let o=sp.off&&sp.off[n];
    if(!o){const dx=p[0]-cx,dy=p[1]-cy,L=Math.hypot(dx,dy)||1;o=[dx/L*17,dy/L*17];}
    s+='<text x="'+(p[0]+o[0])+'" y="'+(p[1]+o[1]+7)+'" text-anchor="middle" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#173a26">'+n+'</text>';});
  return s+'</svg>';
}

  trapIso:()=>figure({pts:{A:[40,160],B:[90,50],C:[210,50],D:[260,160]},poly:['A','B','C','D']}),

  trapRightH:()=>figure({pts:{A:[40,160],B:[40,50],C:[180,50],D:[270,160],H:[180,160]},poly:['A','B','C','D'],segs:[['C','H']],dots:['H'],rights:[['A','B','D'],['B','A','C'],['H','C','D']],off:{H:[0,22]}}),

  tangent:()=>'<svg viewBox="0 0 300 190" role="img" aria-label="Рисунок до задачі"><circle cx="110" cy="100" r="60" fill="#eefaf2" stroke="'+GR+'" stroke-width="3"/>'+
    '<line x1="170" y1="18" x2="170" y2="182" stroke="'+GR+'" stroke-width="3"/><line x1="110" y1="100" x2="170" y2="100" stroke="'+OR+'" stroke-width="3"/>'+
    '<line x1="110" y1="100" x2="170" y2="20" stroke="'+OR+'" stroke-width="3"/><circle cx="110" cy="100" r="4" fill="'+OR+'"/>'+
    '<path d="M157 100 L157 87 L170 87" fill="none" stroke="'+OR+'" stroke-width="2"/>'+
    '<g font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#173a26" text-anchor="middle"><text x="96" y="115">O</text><text x="186" y="112">A</text><text x="186" y="26">B</text></g></svg>'
};

/* ---------- конструктори задач ---------- */
const F=(l,u,a)=>({l:l,u:u,a:a});
function num(topic,q,fields,hint,sol,fig,g7){return {type:'num',t:topic,q:q,fields:fields,hint:hint,sol:sol,fig:fig||'',g7:g7?1:0};}
function choice(topic,q,opts,ci,hint,sol,g7){return {type:'choice',t:topic,q:q,opts:opts,ci:ci,hint:hint,sol:sol,fig:'',g7:g7?1:0};}
const D=n=>n+'°';

/* ===== Раунд 2: прості задачі (19) ===== */
const T={};
T.quad=()=>{let a,b,c,d;do{a=pick([70,75,80,85,90,95,100,110,120]);b=pick([60,65,70,80,85,95,105,110]);c=pick([70,80,90,100,105,115,125]);d=360-a-b-c}while(d<40||d>140);
  return num('quad','У чотирикутнику '+v('ABCD')+' '+ang('A')+' = '+D(a)+', '+ang('B')+' = '+D(b)+', '+ang('C')+' = '+D(c)+'. Знайдіть '+ang('D')+'.',[F(ang('D')+' =','°',d)],
   'Сума кутів чотирикутника дорівнює 360°.','Сума кутів чотирикутника — 360°.<br>'+ang('D')+' = 360° − ('+D(a)+' + '+D(b)+' + '+D(c)+') = <b>'+D(d)+'</b>.');};
T.par=()=>{const a=pick([40,50,55,60,65,70,75,80]);
  return num('par','У паралелограмі '+v('ABCD')+' '+ang('A')+' = '+D(a)+'. Знайдіть '+ang('B')+' і '+ang('C')+'.',[F(ang('B')+' =','°',180-a),F(ang('C')+' =','°',a)],
   'Протилежні кути паралелограма рівні, а кути, прилеглі до однієї сторони, у сумі дають 180°.',
   ang('C')+' = '+ang('A')+' = <b>'+D(a)+'</b> (протилежні кути паралелограма рівні).<br>'+ang('B')+' = 180° − '+D(a)+' = <b>'+D(180-a)+'</b> (кути, прилеглі до сторони, у сумі 180°).',FIG.par());};
T.vert=()=>{const a=pick([35,40,50,55,65,70,75,110,125]);
  return num('g7a','Дві прямі перетинаються. Один з утворених кутів дорівнює '+D(a)+'. Знайдіть кут, вертикальний до нього, і кут, суміжний з ним.',[F('вертикальний =','°',a),F('суміжний =','°',180-a)],
   'Вертикальні кути рівні, а суміжні дають у сумі 180°.','Вертикальний кут дорівнює даному: <b>'+D(a)+'</b>.<br>Суміжний: 180° − '+D(a)+' = <b>'+D(180-a)+'</b>.',null,1);};
T.diag=()=>{let x,y;do{x=ri(5,15)*2;y=ri(4,14)*2}while(x===y);
  return num('par','Діагоналі паралелограма '+v('ABCD')+' перетинаються в точці '+v('O')+'. '+v('AC')+' = '+x+' см, '+v('BD')+' = '+y+' см. Знайдіть '+v('AO')+' і '+v('OD')+'.',[F(v('AO')+' =','см',x/2),F(v('OD')+' =','см',y/2)],
   'Діагоналі паралелограма точкою перетину діляться навпіл.',
   'Діагоналі паралелограма точкою перетину діляться навпіл.<br>'+v('AO')+' = '+v('AC')+' : 2 = <b>'+x/2+' см</b>; '+v('OD')+' = '+v('BD')+' : 2 = <b>'+y/2+' см</b>.',FIG.parDiag());};
T.sign=()=>{const good='діагоналі точкою перетину діляться навпіл';
  const opts=shuf([good,'діагоналі рівні','діагоналі перпендикулярні','дві сторони паралельні']);
  return choice('sign','У якому випадку чотирикутник <b>обов’язково</b> є паралелограмом? Він має таку властивість:',opts,opts.indexOf(good),
   'Згадайте три ознаки паралелограма. Одна з них — про діагоналі.',
   'Це третя ознака паралелограма: якщо діагоналі чотирикутника точкою перетину діляться навпіл, то він — паралелограм.<br>Рівні діагоналі є й у рівнобічної трапеції, перпендикулярні — у «повітряного змія», а лише одна пара паралельних сторін — у трапеції.');};
T.par2=()=>{const a=pick([40,50,55,60,65,70,75,80,85]);
  return num('g7a','Паралельні прямі '+v('a')+' і '+v('b')+' перетнуто січною. Один із внутрішніх односторонніх кутів дорівнює '+D(a)+'. Знайдіть другий.',[F('другий кут =','°',180-a)],
   'Сума внутрішніх односторонніх кутів при паралельних прямих дорівнює 180°.','Сума внутрішніх односторонніх кутів при паралельних прямих — 180°.<br>180° − '+D(a)+' = <b>'+D(180-a)+'</b>.',null,1);};
T.rect=()=>{const a=pick([20,25,30,35,40,50,55,60,65,70]);
  return num('rect','Діагональ '+v('AC')+' прямокутника '+v('ABCD')+' утворює зі стороною '+v('AD')+' кут '+D(a)+'. Знайдіть '+ang('ACD')+'.',[F(ang('ACD')+' =','°',90-a)],
   'У прямокутнику всі кути прямі. Розгляньте трикутник '+v('ACD')+'.','Трикутник '+v('ACD')+' прямокутний (∠'+v('D')+' = 90°). Сума його гострих кутів 90°.<br>'+ang('ACD')+' = 90° − '+D(a)+' = <b>'+D(90-a)+'</b>.',FIG.rectAC());};
T.rhomb=()=>{const a=pick([40,50,60,70,80]);
  return num('rhomb','У ромбі '+v('ABCD')+' '+ang('BAD')+' = '+D(a)+'. Діагоналі перетинаються в точці '+v('O')+'. Знайдіть '+ang('ABD')+' і '+ang('AOB')+'.',[F(ang('ABD')+' =','°',(180-a)/2),F(ang('AOB')+' =','°',90)],
   'Трикутник '+v('ABD')+' рівнобедрений ('+v('AB')+' = '+v('AD')+'). Діагоналі ромба перпендикулярні.',
   'У ромба '+v('AB')+' = '+v('AD')+', тому трикутник '+v('ABD')+' рівнобедрений, і '+ang('ABD')+' = (180° − '+D(a)+') : 2 = <b>'+D((180-a)/2)+'</b>.<br>Діагоналі ромба перпендикулярні, тому '+ang('AOB')+' = <b>90°</b>.',FIG.rhomb());};
T.iso7=()=>{const w=pick([20,40,50,70,80,100,110,140]);
  return num('g7b','Кут при вершині рівнобедреного трикутника дорівнює '+D(w)+'. Знайдіть кут при основі.',[F('кут при основі =','°',(180-w)/2)],
   'Кути при основі рівнобедреного трикутника рівні, а сума кутів трикутника — 180°.','(180° − '+D(w)+') : 2 = <b>'+D((180-w)/2)+'</b>.',null,1);};
T.rhP=()=>{const s=ri(4,15);
  return num('rhomb','Периметр ромба дорівнює '+4*s+' см. Знайдіть його сторону.',[F('сторона =','см',s)],'У ромба всі чотири сторони рівні.','У ромба всі сторони рівні: '+4*s+' : 4 = <b>'+s+' см</b>.');};
T.square=()=>{const good='ромб, у якого є прямий кут';
  const opts=shuf([good,'прямокутник із рівними діагоналями','паралелограм із перпендикулярними діагоналями','паралелограм із рівними діагоналями']);
  return choice('sq','Який із чотирикутників <b>обов’язково</b> є квадратом?',opts,opts.indexOf(good),
   'Квадрат — і прямокутник, і ромб одночасно. Яка умова дає обидві властивості?',
   'Ромб має рівні сторони; якщо ще й один кут прямий — усі кути прямі, тобто це квадрат.<br>Прямокутник із рівними діагоналями — будь-який прямокутник; паралелограм із перпендикулярними діагоналями — ромб; паралелограм із рівними діагоналями — прямокутник.');};
T.midT=()=>{
  if(Math.random()<0.5){const x=ri(4,16)*2;
    return num('mid','У трикутнику '+v('ABC')+' точки '+v('M')+' і '+v('N')+' — середини сторін '+v('AC')+' і '+v('BC')+'. '+v('AB')+' = '+x+' см. Знайдіть '+v('MN')+'.',[F(v('MN')+' =','см',x/2)],
     'Відрізок '+v('MN')+' — середня лінія трикутника. Вона дорівнює половині третьої сторони.','Відрізок '+v('MN')+' — середня лінія, вона дорівнює половині третьої сторони: '+v('MN')+' = '+x+' : 2 = <b>'+x/2+' см</b>.',FIG.tri());}
  const m=ri(3,14);
  return num('mid','У трикутнику '+v('ABC')+' точки '+v('M')+' і '+v('N')+' — середини сторін '+v('AC')+' і '+v('BC')+'. '+v('MN')+' = '+m+' см. Знайдіть '+v('AB')+'.',[F(v('AB')+' =','см',2*m)],
   'Середня лінія дорівнює половині третьої сторони. Яка тоді третя сторона?','Середня лінія вдвічі менша за третю сторону: '+v('AB')+' = 2 · '+m+' = <b>'+2*m+' см</b>.',FIG.tri());};
T.cat30=()=>{const c=ri(3,15)*2;
  return num('g7b','У прямокутному трикутнику один із гострих кутів дорівнює 30°, а гіпотенуза — '+c+' см. Знайдіть катет, що лежить проти цього кута.',[F('катет =','см',c/2)],
   'Катет, що лежить проти кута 30°, дорівнює половині гіпотенузи.','Катет проти кута 30° дорівнює половині гіпотенузи: '+c+' : 2 = <b>'+c/2+' см</b>.',null,1);};
T.mediT=()=>{let a,b,c;do{a=ri(3,10)*2;b=ri(3,10)*2;c=ri(3,10)*2}while(a+b<=c||a+c<=b||b+c<=a);
  return num('mid','Сторони трикутника дорівнюють '+a+' см, '+b+' см і '+c+' см. Знайдіть периметр трикутника, вершини якого — середини сторін даного трикутника.',[F('периметр =','см',(a+b+c)/2)],
   'Кожна сторона нового трикутника — середня лінія, тобто половина відповідної сторони.','Сторони нового трикутника — середні лінії, кожна вдвічі менша за відповідну сторону. Тому його периметр удвічі менший: ('+a+' + '+b+' + '+c+') : 2 = <b>'+(a+b+c)/2+' см</b>.');};
T.tm1=()=>{let a,b;do{a=ri(4,24);b=ri(4,24)}while(a===b||(a+b)%2);
  return num('tmid','Основи трапеції дорівнюють '+a+' см і '+b+' см. Знайдіть її середню лінію.',[F('середня лінія =','см',(a+b)/2)],
   'Середня лінія трапеції дорівнює півсумі основ.','Середня лінія дорівнює півсумі основ: '+frac(a+' + '+b,2)+' = <b>'+fmt((a+b)/2)+' см</b>.',FIG.trapG());};
T.tm2=()=>{let m,a;do{m=ri(6,18);a=ri(3,m+6)}while(2*m-a<=0||2*m-a===a);
  return num('tmid','Середня лінія трапеції дорівнює '+m+' см, а одна з основ — '+a+' см. Знайдіть другу основу.',[F('друга основа =','см',2*m-a)],
   'Півсума основ дорівнює середній лінії, тому сума основ — удвічі більша за неї.','Сума основ у два рази більша за середню лінію: 2 · '+m+' = '+2*m+' см.<br>Друга основа: '+2*m+' − '+a+' = <b>'+(2*m-a)+' см</b>.',FIG.trapG());};
T.iso=()=>{const a=pick([55,60,65,70,75,80]);
  return num('trap','У рівнобічній трапеції '+v('ABCD')+' ('+v('BC')+' ∥ '+v('AD')+') '+ang('A')+' = '+D(a)+'. Знайдіть '+ang('B')+' і '+ang('D')+'.',[F(ang('B')+' =','°',180-a),F(ang('D')+' =','°',a)],
   'У рівнобічної трапеції кути при основі рівні, а кути при бічній стороні в сумі дають 180°.','Кути при основі рівнобічної трапеції рівні: '+ang('D')+' = '+ang('A')+' = <b>'+D(a)+'</b>.<br>'+ang('B')+' = 180° − '+D(a)+' = <b>'+D(180-a)+'</b> (внутрішні односторонні кути).',FIG.trapIso());};
T.right=()=>{const d=pick([40,45,50,55,60,65,70,75]);
  return num('trap','У прямокутній трапеції '+v('ABCD')+' ('+v('BC')+' ∥ '+v('AD')+', '+v('AB')+' ⊥ '+v('AD')+') '+ang('D')+' = '+D(d)+'. Знайдіть '+ang('B')+' і '+ang('C')+'.',[F(ang('B')+' =','°',90),F(ang('C')+' =','°',180-d)],
   'Бічна сторона '+v('AB')+' перпендикулярна до обох основ. Кути '+v('C')+' і '+v('D')+' прилеглі до бічної сторони '+v('CD')+'.','Бічна сторона '+v('AB')+' перпендикулярна до обох основ, тому '+ang('B')+' = <b>90°</b>.<br>'+ang('C')+' + '+ang('D')+' = 180° (кути, прилеглі до бічної сторони), тому '+ang('C')+' = 180° − '+D(d)+' = <b>'+D(180-d)+'</b>.',FIG.trapRight());};
T.tang=()=>{const b=pick([20,25,30,35,40,50,55,60,65]);
  return num('g7c','Пряма '+v('AB')+' — дотична до кола з центром '+v('O')+', '+v('A')+' — точка дотику. '+ang('B')+' = '+D(b)+'. Знайдіть '+ang('AOB')+'.',[F(ang('AOB')+' =','°',90-b)],
   'Радіус, проведений у точку дотику, перпендикулярний до дотичної. Розгляньте трикутник '+v('OAB')+'.','Радіус '+v('OA')+' ⊥ дотичній '+v('AB')+', тому трикутник '+v('OAB')+' прямокутний (∠'+v('A')+' = 90°).<br>'+ang('AOB')+' = 90° − '+D(b)+' = <b>'+D(90-b)+'</b>.',FIG.tangent(),1);};

function makeTasks(){
  return ['quad','par','vert','diag','sign','par2','rect','rhomb','iso7','rhP','square','midT','cat30','mediT','tm1','tm2','tang','iso','right'].map(k=>T[k]());
}

/* ===== Раунд 4: складніші задачі (10, за мотивами підручника) ===== */
const H={};
H.bis=()=>{const a=ri(4,9),b=a+ri(3,9);

   '∠'+v('BAM')+' = ∠'+v('MAD')+' (бісектриса), ∠'+v('MAD')+' = ∠'+v('BMA')+' (різносторонні при '+v('BC')+' ∥ '+v('AD')+'). Тому ∠'+v('BAM')+' = ∠'+v('BMA')+', трикутник '+v('ABM')+' рівнобедрений: '+v('BM')+' = '+v('AB')+' = <b>'+a+' см</b>.<br>'+v('MC')+' = '+v('BC')+' − '+v('BM')+' = '+b+' − '+a+' = <b>'+(b-a)+' см</b>.',FIG.parBis());};
H.pmid=()=>{const m=ri(3,12);

   'Розгляньте трикутник '+v('BCD')+'. Що таке відрізок '+v('MN')+' для нього?','У трикутнику '+v('BCD')+' відрізок '+v('MN')+' сполучає середини сторін '+v('BC')+' і '+v('CD')+', тобто є середньою лінією. Вона вдвічі менша за сторону '+v('BD')+'.<br>'+v('BD')+' = 2 · '+m+' = <b>'+2*m+' см</b>.',FIG.parMid());};
H.perim=()=>{const m=ri(4,9),p=ri(12,26);
  return num('trap','У трапеції '+v('ABCD')+' менша основа '+v('BC')+' дорівнює '+m+' см. Через вершину '+v('B')+' проведено пряму, паралельну '+v('CD')+', яка перетинає більшу основу '+v('AD')+' у точці '+v('M')+'. Периметр трикутника '+v('ABM')+' дорівнює '+p+' см. Знайдіть периметр трапеції.',[F('периметр =','см',p+2*m)],
   'Чотирикутник '+v('BCDM')+' — паралелограм. Які в нього рівні сторони?','У чотирикутнику '+v('BCDM')+' '+v('BC')+' ∥ '+v('MD')+' і '+v('BM')+' ∥ '+v('CD')+', тому він — паралелограм: '+v('BM')+' = '+v('CD')+', '+v('MD')+' = '+v('BC')+' = '+m+' см.<br>P('+v('ABCD')+') = '+v('AB')+' + '+v('BC')+' + '+v('CD')+' + '+v('AM')+' + '+v('MD')+' = P('+v('ABM')+') + 2 · '+m+' = '+p+' + '+2*m+' = <b>'+(p+2*m)+' см</b>.',FIG.trapBM());};
H.isoH=()=>{const x=ri(2,7),y=x+ri(2,7);
  return num('trap','Висота рівнобічної трапеції, проведена з кінця меншої основи, ділить більшу основу на відрізки '+x+' см і '+y+' см. Знайдіть основи трапеції.',[F('менша основа =','см',y-x),F('більша основа =','см',x+y)],
   'Проведіть другу висоту — з іншого кінця меншої основи. Подивіться, на які відрізки вони обидві ділять більшу основу.',
   'Проведіть другу висоту — з іншого кінця меншої основи. Вона відтинає на більшій основі такий самий менший відрізок '+x+' см (трикутники рівні), а середній відрізок дорівнює меншій основі.<br>Менша основа: '+y+' − '+x+' = <b>'+(y-x)+' см</b>. Більша основа: '+x+' + '+y+' = <b>'+(x+y)+' см</b>.',FIG.trapIsoH());};
H.r45=()=>{const a=ri(5,12),b=a+ri(4,14);
  return num('trap','Основи прямокутної трапеції дорівнюють '+a+' см і '+b+' см, а один із кутів — 45°. Знайдіть меншу бічну сторону.',[F('менша бічна сторона =','см',b-a)],
   'Проведіть висоту з вершини тупого кута. У прямокутному трикутнику, що утворився, є кут 45°.',
   'Проведіть висоту '+v('CH')+'. У трикутнику '+v('CHD')+' ∠'+v('D')+' = 45°, тож ∠'+v('HCD')+' = 45°, трикутник рівнобедрений: '+v('CH')+' = '+v('HD')+' = '+b+' − '+a+' = '+(b-a)+' см.<br>Менша бічна сторона '+v('AB')+' дорівнює висоті: <b>'+(b-a)+' см</b>.',FIG.trapRightH());};
H.rect60=()=>{const x=ri(5,15)*2;
  return num('rect','Діагоналі прямокутника '+v('ABCD')+' перетинаються в точці '+v('O')+', ∠'+v('AOB')+' = 60°, '+v('AC')+' = '+x+' см. Знайдіть '+v('AB')+'.',[F(v('AB')+' =','см',x/2)],
   'Діагоналі прямокутника рівні й діляться навпіл. Який вигляд має трикутник '+v('AOB')+'?','Діагоналі прямокутника рівні й діляться навпіл, тому '+v('AO')+' = '+v('BO')+' = '+x+' : 2 = '+x/2+' см. Трикутник '+v('AOB')+' рівнобедрений із кутом 60° при вершині — отже, рівносторонній.<br>'+v('AB')+' = '+v('AO')+' = <b>'+x/2+' см</b>.',FIG.rectO());};
H.r8=()=>{const p=ri(4,9),q=ri(1,5)*2;
  return num('tmid','Висота прямокутної трапеції, проведена з вершини тупого кута, ділить більшу основу на відрізки '+p+' см і '+q+' см, рахуючи від вершини прямого кута. Знайдіть середню лінію трапеції.',[F('середня лінія =','см',p+q/2)],
   'Відрізок від вершини прямого кута до основи висоти дорівнює меншій основі.','Чотирикутник між прямими кутами й висотою — прямокутник, тому менша основа дорівнює '+p+' см, а більша — '+p+' + '+q+' = '+(p+q)+' см.<br>Середня лінія: '+frac(p+' + '+(p+q),2)+' = <b>'+(p+q/2)+' см</b>.',FIG.trapRightH());};
H.r60=()=>{const a=ri(5,12),b=a+ri(3,9);
  return num('trap','Основи прямокутної трапеції дорівнюють '+a+' см і '+b+' см, а один із кутів — 60°. Знайдіть більшу бічну сторону.',[F('більша бічна сторона =','см',2*(b-a))],
   'Проведіть висоту з вершини тупого кута. У прямокутному трикутнику другий гострий кут — 30°.',
   'Проведіть висоту '+v('CH')+'. У трикутнику '+v('CHD')+' ∠'+v('D')+' = 60°, тож ∠'+v('HCD')+' = 30°. Катет '+v('HD')+' = '+b+' − '+a+' = '+(b-a)+' см лежить проти кута 30°, тому дорівнює половині гіпотенузи '+v('CD')+'.<br>'+v('CD')+' = 2 · '+(b-a)+' = <b>'+2*(b-a)+' см</b>.',FIG.trapRightH());};
H.iso60=()=>{const c=pick([8,10,12,14,16,18,20]),b=ri(5,14),a=b+c,S=a+b;
  return num('trap','Один із кутів рівнобічної трапеції дорівнює 60°, бічна сторона — '+c+' см, а сума основ — '+S+' см. Знайдіть основи трапеції.',[F('менша основа =','см',b),F('більша основа =','см',a)],
   'Проведіть дві висоти з кінців меншої основи. Кожна відтинає прямокутний трикутник із кутом 30°.',
   'Проведіть висоти з кінців меншої основи. У кожному відтятому прямокутному трикутнику кут 60°, другий гострий кут 30°, тому катет проти нього дорівнює '+c+' : 2 = '+c/2+' см.<br>Більша основа на '+c+' см довша за меншу ('+c/2+' + '+c/2+'). Отже, <i>a</i> − <i>b</i> = '+c+', <i>a</i> + <i>b</i> = '+S+'.<br>Більша основа: ('+S+' + '+c+') : 2 = <b>'+a+' см</b>, менша: ('+S+' − '+c+') : 2 = <b>'+b+' см</b>.',FIG.trapIso());};
H.ce=()=>{const d=pick([35,40,45,50,55]),e=pick([50,55,60,65,70]),A=180-d-e;
  return num('trap','Через вершину '+v('C')+' трапеції '+v('ABCD')+' ('+v('BC')+' ∥ '+v('AD')+') проведено пряму, паралельну бічній стороні '+v('AB')+', яка перетинає більшу основу '+v('AD')+' у точці '+v('E')+'. Знайдіть кути трапеції, якщо '+ang('D')+' = '+D(d)+', '+ang('DCE')+' = '+D(e)+'.',[F(ang('A')+' =','°',A),F(ang('B')+' =','°',180-A),F(ang('C')+' =','°',180-d)],
   'Розгляньте трикутник '+v('CDE')+': знайдіть кут '+v('CED')+', а потім використайте паралельність '+v('AB')+' ∥ '+v('CE')+'.',
   'У трикутнику '+v('CDE')+': '+ang('CED')+' = 180° − '+D(d)+' − '+D(e)+' = '+D(A)+'.<br>'+v('AB')+' ∥ '+v('CE')+', тому '+ang('A')+' = '+ang('CED')+' = <b>'+D(A)+'</b> (відповідні кути).<br>'+ang('B')+' = 180° − '+ang('A')+' = <b>'+D(180-A)+'</b> (внутрішні односторонні при '+v('BC')+' ∥ '+v('AD')+').<br>'+ang('C')+' = 180° − '+ang('D')+' = <b>'+D(180-d)+'</b>.',FIG.trapCE());};
H.ref={bis:'',pmid:'',perim:'за мотивами №246',isoH:'за мотивами №234',r45:'за мотивами №236',rect60:'',r8:'за мотивами №242',r60:'за мотивами №237',iso60:'за мотивами №235',ce:'за мотивами №247'};
function makeFinal(){
  return ['bis','pmid','perim','isoH','r45','rect60','r8','r60','iso60','ce'].map(k=>{const t=H[k]();t.ref=H.ref[k];return t;});
}



window.TOP=TOP;window.TOPIC_ORDER=TOPIC_ORDER;window.CARDS=CARDS;window.STAT=STAT;window.makeTasks=makeTasks;window.makeFinal=makeFinal;window.shuf=shuf;
})();
</script>
<script>
/* ===== ІНТЕРФЕЙС ===== */
(function(){"use strict";
const ORDER=['theory','tasks','blitz','final'];
const RN={theory:'Раунд 1 · Теорія',tasks:'Раунд 2 · Задачі',blitz:'Раунд 3 · Бліц',final:'Раунд 4 · Фінал'};
const RI={theory:'📇',tasks:'✏️',blitz:'⚡',final:'🏆'};
const RD={theory:'Картки з теорії: відповідаєте вголос, перегортаєте й оцінюєте себе.',tasks:'Прості задачі з відповіддю числом або вибором.',blitz:'Правда чи хиба? Багато швидких тверджень — вони найкраще показують помилки.',final:'Складніші задачі за мотивами підручника.'};
const RMAX={theory:2,tasks:2,blitz:1,final:3};
const COARSE=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
const $=id=>document.getElementById(id);
const GOOD=['Чудово!','Так тримати!','Точно в ціль!','Блискуче!','Молодець!','Бездоганно!','Саме так!','Ось це клас!'];
const SOSO=['Зараховано! Із підказкою теж перемога.','Добре! Запам’ятайте цей момент.','Є результат — наступного разу вийде без підказки.'];
const MISS=['Нічого страшного — саме для цього й повторюємо.','Розберемося й запам’ятаємо.','Помилка знайшлася вчасно — це добре.'];
let S;
function reset(name){S={r:null,seq:false,items:[],i:0,log:[],name:name||'',streak:0,best:0,rg:0,rm:0,hint:false,att:0,sel:null,locked:false,flipped:false,focus:null,key:null,cur:null,tm:null};}
reset();

/* ---------- каркас ---------- */
function fit(){
  const de=document.documentElement,st=$('stage');
  let s=Math.max(13,Math.min(innerWidth*0.021,innerHeight*0.04,31));
  de.style.fontSize=s+'px';let g=0;
  while(st.scrollHeight>st.clientHeight+3&&s>11&&g++<80){s-=0.4;de.style.fontSize=s+'px';}
}
function updHead(){
  let g=0,m=0;S.log.forEach(x=>{g+=x.got;m+=x.max});
  $('sc').innerHTML='⭐ <b>'+g+'</b> / '+m;
  $('rn').textContent=S.r?RN[S.r]:'';
  const tot=S.items.length||1;$('pg').style.width=(S.r?Math.round(S.i/tot*100):0)+'%';
}
function show(html,key){clearTimeout(S.tm);S.key=key||null;$('stage').innerHTML=html;kp(false);updHead();fit();}
function strip(h){return String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function say(a){return a[Math.floor(Math.random()*a.length)];}
function pillMeta(c,extra){const T=TOP[c.t];return '<div class="meta">'+(extra||'')+(c.g7?'<span class="pill g7">🔁 З 7 класу</span>':'')+'<span class="pill">'+T.p+' · '+T.n.replace('З 7 класу: ','')+'</span>'+(c.ref?'<span class="pill ref">'+c.ref+'</span>':'')+'</div>';}
function done(got,max,label,t,g7){S.log.push({r:S.r,t:t,g7:g7,got:got,max:max,label:label});S.rg+=got;S.rm+=max;updHead();}
function nextItem(){S.i++;item();}
function streakMsg(){if(S.streak>0&&S.streak%5===0)return ' 🔥 '+S.streak+' поспіль!';if(S.streak===3)return ' 🔥 3 поспіль!';return '';}

/* ---------- меню ---------- */
function menu(){
  S.r=null;S.items=[];S.i=0;
  const cnt={theory:CARDS.length,tasks:19,blitz:STAT.length,final:10};
  const tiles=ORDER.map(r=>'<button class="tile" data-r="'+r+'"><div class="ic">'+RI[r]+'</div><div class="tn">'+RN[r]+'</div><div class="td">'+RD[r]+'</div><div class="tc">'+cnt[r]+' '+(r==='theory'?'карток':r==='blitz'?'тверджень':'завдань')+'</div></button>').join('');
  show('<div class="card wide center"><h1>Чотирикутники: перевірка на міцність</h1><div class="sub">Повторення §1 · Геометрія, 8 клас · за підручником А. Г. Мерзляка</div>'+
   '<div class="nm"><label for="nm">Ваше ім’я (необов’язково)</label><input id="nm" type="text" autocomplete="off" value="'+S.name.replace(/"/g,'')+'"></div>'+
   '<div class="tiles">'+tiles+'</div>'+
   '<div class="btns" style="justify-content:center"><button class="btn primary" id="all">▶ Усі раунди підряд</button></div>'+
   '<div class="legend" style="margin-top:.6rem">Бали: картка — до 2, задача — до 2 (з підказкою чи другою спробою — 1), бліц — по 1, фінал — до 3. Усе, що не вдалося, потрапить у «карту знань».</div></div>');
  $('nm').addEventListener('input',e=>{S.name=e.target.value.trim()});
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>startRound(b.dataset.r,false));
  $('all').onclick=()=>startRound('theory',true);
  if(!COARSE)$('nm').focus();
}
function startRound(r,seq){
  S.r=r;S.seq=!!seq;S.i=0;S.rg=0;S.rm=0;S.streak=0;
  S.log=S.log.filter(x=>x.r!==r);
  S.items=r==='theory'?CARDS.slice():r==='tasks'?makeTasks():r==='blitz'?shuf(STAT):makeFinal();
  item();
}
function item(){
  if(S.i>=S.items.length)return roundEnd();
  S.hint=false;S.att=0;S.sel=null;S.locked=false;S.flipped=false;S.focus=null;S.cur=S.items[S.i];
  ({theory:showCard,tasks:showTask,final:showTask,blitz:showBlitz})[S.r]();
}

/* ---------- Раунд 1: картки ---------- */
function showCard(){
  const c=S.cur;
  show('<div class="card">'+pillMeta(c,'<span class="pill">Картка '+(S.i+1)+' з '+S.items.length+'</span>')+
   '<div class="q">'+c.q+'</div><div id="hb" class="hint" hidden>💡 '+c.h+'</div>'+
   '<div id="an" class="ans" hidden><div class="lbl">Еталонна відповідь</div>'+c.a+'</div><div id="fb" class="fb"></div>'+
   '<div class="btns" id="bt"><button class="btn ghost" id="bH">💡 Підказка<small>максимум 1 бал</small></button><button class="btn primary" id="bF">Перегорнути ↻<small>пробіл</small></button><button class="btn link" id="bS">Пропустити →</button></div></div>',cardKey);
  $('bH').onclick=()=>{S.hint=true;$('hb').hidden=false;$('bH').disabled=true;fit();};
  $('bF').onclick=flip;$('bS').onclick=nextItem;
}
function flip(){
  if(S.flipped)return;S.flipped=true;
  $('an').hidden=false;$('an').classList.add('flipin');$('hb').hidden=true;
  $('bt').outerHTML='<div class="rate" id="bt"><div class="lbl2">Порівняйте зі своєю відповіддю й оцініть себе чесно:</div>'+
   '<button class="btn good" data-n="2">✅ Відповів повністю<small>2 бали (клавіша 2)</small></button>'+
   '<button class="btn mid" data-n="1">🟡 Частково<small>1 бал (клавіша 1)</small></button>'+
   '<button class="btn no" data-n="0">❌ Не знав<small>0 балів (клавіша 0)</small></button></div>';
  document.querySelectorAll('#bt [data-n]').forEach(b=>b.onclick=()=>rate(+b.dataset.n));
  fit();
}
function rate(n){
  if(S.locked)return;S.locked=true;const c=S.cur;
  let got=n===2?(S.hint?1:2):n;
  done(got,2,c.q,c.t,c.g7);
  if(got===2){S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;
  const fb=$('fb');
  if(n===2&&!S.hint){fb.className='fb ok';fb.textContent=say(GOOD)+streakMsg();}
  else if(n===2){fb.className='fb warn';fb.textContent='Відповідь повна, але була підказка — 1 бал.';}
  else if(n===1){fb.className='fb warn';fb.textContent='Уже щось! Допрацюємо повну відповідь.';}
  else{fb.className='fb bad';fb.textContent=say(MISS);}
  document.querySelectorAll('#bt button').forEach(b=>b.disabled=true);
  S.tm=setTimeout(nextItem,1100);
}
function cardKey(e){
  if(e.target.tagName==='INPUT')return;
  if(!S.flipped){if(e.code==='Space'||e.key==='Enter'){e.preventDefault();flip();}}
  else if(['0','1','2'].indexOf(e.key)>=0)rate(+e.key);
}

/* ---------- Раунди 2 і 4: задачі ---------- */
function showTask(){
  const t=S.cur,mx=RMAX[S.r];let body='';
  if(t.type==='num'){
    body='<div class="flds">'+t.fields.map((f,i)=>'<label class="fld"><span class="l">'+f.l+'</span><input data-i="'+i+'" autocomplete="off" '+(COARSE?'readonly inputmode="none"':'inputmode="decimal"')+'><span>'+(f.u==='°'?'°':f.u)+'</span></label>').join('')+'</div>';
  }else{
    body='<div class="opts">'+t.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+['А','Б','В','Г'][i]+') '+o+'</button>').join('')+'</div>';
  }
  const left='<div class="q">'+t.q+'</div>'+body+'<div id="hb" class="hint" hidden>💡 '+t.hint+'</div><div id="fb" class="fb"></div><div id="sl"></div>';
  show('<div class="card">'+pillMeta(t,'<span class="pill">Завдання '+(S.i+1)+' з '+S.items.length+'</span>')+
   (t.fig?'<div class="grid2"><div>'+left+'</div><div class="fig">'+t.fig+'</div></div>':left)+
   '<div class="btns" id="bt"><button class="btn primary" id="bC">Перевірити<small>Enter</small></button><button class="btn ghost" id="bH">💡 Підказка<small>мінус 1 бал</small></button><button class="btn link" id="bS">Пропустити →</button></div></div>',taskKey);
  $('bC').onclick=check;$('bS').onclick=nextItem;
  $('bH').onclick=()=>{S.hint=true;$('hb').hidden=false;$('bH').disabled=true;fit();};
  if(t.type==='num'){
    const ins=document.querySelectorAll('.fld input');
    ins.forEach(inp=>{inp.addEventListener('focus',()=>{S.focus=inp;ins.forEach(x=>x.classList.remove('act'));if(COARSE)inp.classList.add('act');});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
      inp.addEventListener('input',()=>{inp.classList.remove('bad','ok')});});
    S.focus=ins[0];if(COARSE){ins[0].classList.add('act');kp(true);}else ins[0].focus();
  }else{
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.locked||b.classList.contains('bad'))return;S.sel=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
  }
}
function parse(s){const n=parseFloat(String(s).replace(',','.').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:NaN;}
function check(){
  if(S.locked)return;const t=S.cur,mx=RMAX[S.r],fb=$('fb');let ok;
  if(t.type==='num'){
    const ins=[].slice.call(document.querySelectorAll('.fld input'));
    if(ins.some(x=>!x.value.trim())){fb.className='fb warn';fb.textContent='Введіть відповідь у всі поля.';return;}
    ok=true;ins.forEach((x,i)=>{const good=Math.abs(parse(x.value)-t.fields[i].a)<1e-6;x.classList.remove('ok','bad');x.classList.add(good?'ok':'bad');if(!good)ok=false;});
  }else{
    if(S.sel===null){fb.className='fb warn';fb.textContent='Оберіть варіант відповіді.';return;}
    ok=S.sel===t.ci;const b=document.querySelector('.opt[data-i="'+S.sel+'"]');
    if(!ok){b.classList.remove('sel');b.classList.add('bad');S.sel=null;}
  }
  S.att++;
  if(ok){
    const clean=!S.hint&&S.att===1;
    const got=S.r==='final'?Math.max(1,mx-(S.hint?1:0)-(S.att>1?1:0)):(clean?mx:1);
    if(t.type==='choice')document.querySelector('.opt[data-i="'+t.ci+'"]').classList.add('ok');
    finishTask(got,mx,true,clean);
  }else if(S.att===1){
    S.streak=0;fb.className='fb bad';fb.textContent='Не зовсім. Спробуйте ще раз — або візьміть підказку.';
    if(t.type==='num'){const bad=document.querySelector('.fld input.bad');if(bad)bad.focus();}
  }else{
    S.streak=0;
    if(t.type==='choice')document.querySelector('.opt[data-i="'+t.ci+'"]').classList.add('ok');
    else{document.querySelectorAll('.fld input').forEach((x,i)=>{x.value=String(t.fields[i].a).replace('.',',');x.classList.remove('bad');x.classList.add('ok');});}
    finishTask(0,mx,false,false);
  }
}
function finishTask(got,mx,ok,clean){
  S.locked=true;const t=S.cur,fb=$('fb');
  done(got,mx,strip(t.q),t.t,t.g7);
  if(ok){if(clean){S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;}
  if(ok&&clean){fb.className='fb ok';fb.textContent='✓ '+say(GOOD)+' +'+got+streakMsg();}
  else if(ok){fb.className='fb warn';fb.textContent='✓ '+say(SOSO)+' +'+got;}
  else{fb.className='fb bad';fb.textContent='Правильна відповідь показана. '+say(MISS);}
  $('hb').hidden=true;
  $('sl').innerHTML='<div class="sol"><div class="lbl">Розв’язання</div>'+t.sol+'</div>';
  $('bt').innerHTML='<button class="btn primary" id="bN">Далі →<small>Enter</small></button>';
  $('bN').onclick=nextItem;kp(false);fit();
}
function taskKey(e){
  if(e.key==='Enter'&&S.locked){e.preventDefault();nextItem();}
  else if(e.key==='Enter'&&e.target.tagName!=='INPUT'){e.preventDefault();check();}
}
/* екранна цифрова клавіатура для сенсорних екранів */
function kp(on){
  const k=$('kp');
  if(!on||!COARSE){k.hidden=true;k.innerHTML='';return;}
  k.hidden=false;
  k.innerHTML=['7','8','9','4','5','6','1','2','3',',','0','⌫'].map(x=>'<button type="button" data-k="'+x+'">'+x+'</button>').join('');
  k.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const inp=S.focus||document.querySelector('.fld input');if(!inp||S.locked)return;
    let v=inp.value;const c=b.dataset.k;
    if(c==='⌫')v=v.slice(0,-1);else if(c===','){if(v.indexOf(',')<0&&v)v+=',';}else if(v.length<6)v+=c;
    inp.value=v;inp.classList.remove('bad','ok');});
}

/* ---------- Раунд 3: бліц ---------- */
function showBlitz(){
  const c=S.cur;
  show('<div class="card center">'+pillMeta(c,'<span class="pill">Твердження '+(S.i+1)+' з '+S.items.length+'</span>')+
   '<div class="stmt">'+c.s+'</div><div class="tf" id="tf"><button class="btn t" data-a="1">✔ Правда<small>клавіша ←</small></button><button class="btn f" data-a="0">✖ Хиба<small>клавіша →</small></button></div>'+
   '<div id="fb" class="fb" style="margin-top:.7rem"></div><div id="ex"></div>'+
   '<div class="btns" id="bt" style="justify-content:center"><span class="streak" id="stk">'+(S.streak>1?'🔥 '+S.streak+' поспіль':'')+'</span><button class="btn link" id="bS">Пропустити →</button></div></div>',blitzKey);
  document.querySelectorAll('#tf button').forEach(b=>b.onclick=()=>answerB(!!+b.dataset.a));
  $('bS').onclick=nextItem;
}
function answerB(a){
  if(S.locked)return;S.locked=true;const c=S.cur,ok=(a===c.ok),fb=$('fb');
  done(ok?1:0,1,c.s,c.t,c.g7);
  if(ok){S.streak++;S.best=Math.max(S.best,S.streak);fb.className='fb ok';fb.textContent='✓ Правильно! '+say(GOOD)+streakMsg();}
  else{S.streak=0;fb.className='fb bad';fb.textContent='✗ Ні. Це '+(c.ok?'правда':'хиба')+'.';}
  document.querySelectorAll('#tf button').forEach(b=>{b.disabled=true;if(!!+b.dataset.a===c.ok)b.style.outline='4px solid var(--ok)';});
  $('ex').innerHTML='<div class="sol" style="text-align:left"><div class="lbl">Чому</div>'+c.e+'</div>';
  $('bt').innerHTML='<button class="btn primary" id="bN">Далі →<small>Enter</small></button>';$('bN').onclick=nextItem;fit();
}
function blitzKey(e){
  if(S.locked){if(e.key==='Enter'||e.code==='Space'){e.preventDefault();nextItem();}return;}
  if(e.key==='ArrowLeft')answerB(true);else if(e.key==='ArrowRight')answerB(false);
}

/* ---------- кінець раунду ---------- */
function stars(p){return p>=85?'⭐⭐⭐':p>=60?'⭐⭐☆':'⭐☆☆';}
function roundPraise(p){
  const n=S.name?', '+S.name:'';
  if(p>=90)return 'Майже бездоганно'+n+'! Це справжня майстерність.';
  if(p>=75)return 'Дуже добре'+n+'! Є що відшліфувати, але база міцна.';
  if(p>=55)return 'Непогано'+n+'. Основа є — тепер закріпимо те, що хитається.';
  return 'Хороший початок'+n+'. Тепер видно, що саме треба вчити — це вже півсправи!';
}
function roundEnd(){
  const r=S.r,p=S.rm?Math.round(S.rg/S.rm*100):0;
  const missed=S.log.filter(x=>x.r===r&&x.got<x.max);
  const idx=ORDER.indexOf(r),nx=ORDER[idx+1];
  show('<div class="card center"><div class="stars">'+stars(p)+'</div><h1>'+RN[r]+' завершено</h1><div class="big">'+S.rg+' з '+S.rm+' ('+p+'%)</div>'+
   '<div class="sub" style="font-size:1rem">'+roundPraise(p)+(S.best>=5?' 🔥 Найдовша серія: '+S.best+'.':'')+'</div>'+
   (missed.length?'<details class="todo"><summary>Що не вдалося повністю ('+missed.length+')</summary><ul>'+missed.map(x=>'<li>'+(x.g7?'🔁 ':'')+strip(x.label).slice(0,140)+'</li>').join('')+'</ul></details>':'<div class="fb ok">Жодної помилки в цьому раунді!</div>')+
   '<div class="btns" style="justify-content:center">'+(S.seq&&nx?'<button class="btn primary" id="go">Далі: '+RN[nx]+' →</button>':'')+
   (S.seq&&!nx?'<button class="btn primary" id="go">Підсумок і карта знань →</button>':'')+
   (!S.seq?'<button class="btn primary" id="go">До меню</button><button class="btn" id="res">Карта знань</button>':'')+'</div></div>',function(e){if(e.key==='Enter'&&$('go')){e.preventDefault();$('go').click();}});
  $('go').onclick=()=>{if(S.seq){if(nx)startRound(nx,true);else results();}else menu();};
  if($('res'))$('res').onclick=results;
}

/* ---------- підсумок і карта знань ---------- */
function level(p){
  if(p>=90)return '👑 Майстер чотирикутників';
  if(p>=75)return '🎓 Знавець';
  if(p>=60)return '📐 Конструктор';
  if(p>=40)return '🧱 Будівельник';
  return '🌱 Початківець із хорошим стартом';
}
function results(){
  const n=S.name?', '+S.name:'';
  let g=0,m=0;S.log.forEach(x=>{g+=x.got;m+=x.max});
  if(!m){menu();return;}
  const p=Math.round(g/m*100);
  const per=ORDER.map(r=>{let a=0,b=0;S.log.forEach(x=>{if(x.r===r){a+=x.got;b+=x.max}});return b?'<tr><td>'+RI[r]+' '+RN[r]+'</td><td>'+a+' / '+b+' ('+Math.round(a/b*100)+'%)</td></tr>':'';}).join('');
  const by={};TOPIC_ORDER.forEach(t=>by[t]={g:0,m:0,miss:[]});
  S.log.forEach(x=>{const o=by[x.t];o.g+=x.got;o.m+=x.max;if(x.got<x.max)o.miss.push(x);});
  const tiles=TOPIC_ORDER.map(t=>{const o=by[t],T=TOP[t];if(!o.m)return '<div class="mt n">'+T.n+'<div class="pp">'+T.p+' · ще не перевірено</div></div>';
    const q=Math.round(o.g/o.m*100),c=q>=80?'g':q>=50?'y':'r';
    return '<div class="mt '+c+'">'+T.n+'<div class="pc">'+q+'%</div><div class="pp">'+T.p+' · '+(c==='g'?'міцно':c==='y'?'хитається':'повторити')+'</div></div>';}).join('');
  const todo=TOPIC_ORDER.filter(t=>by[t].m&&by[t].miss.length&&by[t].g/by[t].m<0.8).map(t=>{const o=by[t],T=TOP[t];
    return '<details class="todo"><summary>'+T.n+' — '+T.p+' ('+Math.round(o.g/o.m*100)+'%)</summary><ul>'+o.miss.slice(0,8).map(x=>'<li>'+strip(x.label).slice(0,130)+'</li>').join('')+'</ul></details>';}).join('');
  show('<div class="card wide center"><div class="stars">'+stars(p)+'</div><h1>Результат'+n+'</h1><div class="big">'+g+' з '+m+' ('+p+'%)</div><div class="lvl">'+level(p)+'</div>'+
   '<table class="rtab">'+per+'</table>'+
   '<div style="font-weight:900;margin-top:.3rem">Карта знань</div><div class="legend">зелене — міцно (від 80%), жовте — хитається, червоне — час повторити</div><div class="map">'+tiles+'</div>'+
   (todo?'<div style="font-weight:900;text-align:left">Що повторити до наступного разу</div>'+todo:'<div class="fb ok">Усе міцно! Можна братися за складніше.</div>')+
   '<div class="btns" style="justify-content:center"><button class="btn primary" id="again">↻ Пройти ще раз (нові числа)</button><button class="btn" id="mn">До меню</button></div></div>',null);
  $('again').onclick=()=>{reset(S.name);menu();};$('mn').onclick=menu;
}

/* ---------- запуск ---------- */
document.addEventListener('keydown',e=>{if(S.key)S.key(e);});
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
document.querySelector('.brand').onclick=menu;
window.__dbg={S:()=>S,menu:menu};
menu();
})();

</script>
