<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>№7 Рівносильні рівняння. Раціональні рівняння</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12301f; --muted:#5b7a68; --acc:#0d5c3a; --acc2:#2f9e6b; --accL:#dcf7e4;
  --soft:#eef7e8; --soft2:#f8f7e5; --line:#c9e6cf;
  --ok:#1e9e62; --okbg:#e6f7ee; --oktx:#14663f; --okln:#8fd3b0;
  --bad:#e0464e; --badbg:#fdecee; --badtx:#a3232b; --badln:#efa3a8;
  --warnbg:#fff6e5; --warntx:#8a5a00; --warnln:#f3d9a4;
  --o1:#0f766e; --o2:#7c3aed;
}
*{box-sizing:border-box}
html{font-size:24px}
body{margin:0;height:100dvh;overflow:hidden;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#eef7e8 0%,#e3f4dc 45%,#cfeed0 100%) fixed;display:flex;flex-direction:column;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
i,.m{font-family:'STIX Two Text','Times New Roman',Times,serif;font-style:italic}
sup{font-size:.7em;line-height:0}
#main{flex:1;min-height:0;padding:.5rem .6rem .2rem;display:flex}
#card{flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:1rem;box-shadow:0 .3rem 1rem rgba(13,92,58,.1);overflow:auto;display:flex}
.inner{margin:auto;width:100%;max-width:62rem;padding:.9rem 1.2rem}
h1{font-size:1.9rem;margin:.2rem 0;color:var(--acc);font-weight:900;line-height:1.15}
h2{font-size:1.45rem;margin:0 0 .5rem;color:var(--acc);font-weight:900;line-height:1.2}
.badge{display:inline-block;background:var(--accL);color:var(--acc);font-weight:900;padding:.1rem .7rem;border-radius:.6rem;font-size:.95rem}
.def{border:2px solid var(--acc2);background:var(--soft2);border-radius:.9rem;padding:.7rem 1rem;font-size:1.15rem;line-height:1.45;margin:.5rem 0;font-weight:700}
.def b{color:var(--acc)}
.big{font-size:1.5rem}
.eq{font-size:1.55rem;margin:.4rem 0;text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.A{color:var(--o1);font-weight:800}.B{color:var(--o2);font-weight:800}
.sys{display:inline-flex;vertical-align:middle;text-align:left}
.sys .rows{display:flex;flex-direction:column;border-left:.1em solid currentColor;border-radius:.6em 0 0 .6em;padding:.1em 0 .1em .5em;line-height:1.5}
.ok{color:var(--oktx);font-weight:800}.no{color:var(--badtx);font-weight:800}
.pair{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.5rem 0}
.pair>div{background:var(--soft);border:2px solid var(--line);border-radius:.8rem;padding:.4rem .9rem;font-size:1.35rem}
.btn{border:0;background:var(--acc);color:#fff;font-weight:900;border-radius:.8rem;padding:.4rem 1.1rem;font-size:1rem;min-height:2.4rem}
.btn.sec{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn{white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.startw{text-align:center}
.startw .btn{font-size:1.4rem;padding:.6rem 2rem;margin-top:1rem}
/* кроки */
.stp{display:grid;grid-template-columns:8.5rem 1fr;gap:.2rem .8rem;align-items:center;padding:.3rem .2rem;border-top:1px dashed var(--line);font-size:1.3rem;opacity:1;transition:opacity .25s}
.stp .tg{font-size:.78rem;font-weight:800;color:var(--muted);text-align:right;text-transform:none}
.stp.hid{visibility:hidden;opacity:0}
.stp:first-child{border-top:0}
.arrow{width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--acc2);color:#fff;font-size:1.3rem;font-weight:900;animation:bn 1s infinite;margin:.1rem auto}
.arrow.hid{visibility:hidden}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(.25rem)}}
.ansb{margin-top:.5rem;border:2px solid var(--okln);background:var(--okbg);border-radius:.9rem;padding:.4rem 1rem;font-size:1.45rem;color:var(--oktx);font-weight:900;text-align:center}
.ansb.hid{visibility:hidden}
.ansb.none{border-color:var(--warnln);background:var(--warnbg);color:var(--warntx)}
.ehead{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.2rem}
.ehead .eq{margin:0;flex:1;min-width:14rem}
/* перевірка */
.q{border:2px solid var(--line);border-left-width:.5rem;border-radius:.9rem;padding:.45rem .9rem;margin:.45rem 0;transition:opacity .2s}
.q.hid{visibility:hidden;opacity:0}
.q .qt{font-size:1.3rem;font-weight:700}
.q .who{display:flex;align-items:center;gap:.6rem;margin-bottom:.25rem;flex-wrap:wrap}
.who .nm{font-weight:900;font-size:1.1rem;color:var(--acc);min-width:6rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.3rem .9rem;font-size:1.25rem;font-weight:800;color:var(--ink);min-height:2.4rem}
.opt.w{background:var(--badbg);border-color:var(--badln);color:var(--badtx)}
.opt.r{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.fb{font-size:1.05rem;font-weight:700;min-height:1.2rem}
.fb.ok{color:var(--oktx)}.fb.no{color:var(--badtx)}
.qc0{border-left-color:#1e9e62}.qc1{border-left-color:#2563a8}.qc2{border-left-color:#7a8a1a}.qc3{border-left-color:#4f46a5}
/* підсумок */
.sum{border:2px solid var(--line);border-radius:.9rem;padding:.5rem 1rem;margin:.45rem 0;background:var(--soft2);font-size:1.2rem;font-weight:700;line-height:1.45}
.sum.hid{visibility:hidden;opacity:0}
.sum b{color:var(--acc)}
/* світлофор */
.lights{display:flex;gap:1rem;justify-content:center;margin:.6rem 0;flex-wrap:wrap}
.lt{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.lt button{width:5rem;height:5rem;border-radius:50%;border:.25rem solid #fff;box-shadow:0 0 0 2px #bbb;font-size:1.6rem;font-weight:900;color:#fff}
.lt .cnt{font-size:1.4rem;font-weight:900}
.lamp{width:4.5rem;height:4.5rem;border-radius:50%;margin:.3rem auto;background:#ddd;box-shadow:inset 0 0 .5rem rgba(0,0,0,.2)}
.vws{display:grid;border:2px solid var(--line);border-radius:.9rem;padding:.4rem 1rem;margin:.4rem 0;background:var(--soft2)}
.vw{grid-area:1/1;visibility:hidden;font-size:1.4rem;line-height:1.7}.vw.on{visibility:visible}
.vnav{display:flex;justify-content:center;gap:1.2rem;align-items:center}.vnav .btn{font-size:1.4rem;padding:.2rem 1.6rem}
.dots{display:flex;gap:.4rem}.dt{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:var(--line)}.dt.on{background:var(--acc)}
.bwrap{margin-top:.2rem}
.bsk{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.bsk svg{grid-column:1/3;width:55%;height:2.4rem;margin:0 auto}
.bsk .hd{font-size:1.15rem;font-weight:900}
.bcols{display:grid;grid-template-columns:1fr 1fr}
.bcol.cl{border-right:2px dashed var(--line)}
.bi{font-size:1.3rem;text-align:center;padding:.18rem .3rem;opacity:1;transition:opacity .25s}
.bi.hid{visibility:hidden;opacity:0}
.bj{border-top:2px solid var(--line);margin-top:.25rem;padding-top:.15rem}
/* додатковий множник */
.mf{display:inline-flex;align-items:stretch}
.ad{display:inline-flex;align-items:flex-start;margin-left:.1em}
.ad .sl{display:inline-block;align-self:flex-start;width:0;height:1.05em;border-left:1.6px solid var(--acc);transform:translateY(-.55em) rotate(-35deg);margin:.12em .38em 0 -.15em}
.ad .fill{align-self:flex-start;font-size:.85em;color:var(--acc);font-weight:800;transform:translateY(-.8em)}
/* навігація */
#nav{flex:none;display:flex;align-items:center;gap:.8rem;padding:.2rem .8rem .25rem;justify-content:center}
#nav .btn{font-size:1.1rem;padding:.35rem 1.2rem}
@media(max-width:520px){#nav{gap:.4rem}#nav .btn{padding:.3rem .6rem;font-size:.95rem}#pg{min-width:5.5rem}}
#gem{width:2.6rem;height:2.6rem;border:0;background:transparent;padding:0}
#tm{width:.6rem;height:2.6rem;background:#e2efe5;border-radius:.4rem;position:relative;border:1px solid var(--line);cursor:pointer;overflow:hidden}
#tmf{position:absolute;left:0;right:0;bottom:0;background:var(--acc2);height:100%;transition:height 1s linear}
#tmt{position:fixed;background:#12301f;color:#fff;font-size:.8rem;padding:.2rem .5rem;border-radius:.4rem;display:none;z-index:2147483000;pointer-events:none}
#pg{font-size:.9rem;color:var(--muted);font-weight:700;min-width:9rem;text-align:center}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}
#ovm,#ovc{position:fixed;inset:0;background:rgba(18,48,31,.5);z-index:2147483000;display:none;align-items:center;justify-content:center;padding:1rem}
#ovm.on,#ovc.on{display:flex}
.mbox{background:#fff;border-radius:1rem;padding:1rem 1.3rem;max-width:44rem;width:100%;max-height:92%;overflow:auto;font-size:1.05rem}
.mbox h3{margin:.2rem 0;color:var(--acc);font-size:1.2rem}
.mbox ul{margin:.2rem 0 .5rem;padding-left:1.2rem}
.mbox li{margin:.15rem 0}
.mbox .go{display:flex;justify-content:space-between;gap:.6rem;border:2px solid var(--line);background:var(--soft2);border-radius:.6rem;padding:.25rem .7rem;width:100%;margin:.2rem 0;font-weight:800;color:var(--ink);font-size:1rem;text-align:left}
#stone{position:fixed;right:.8rem;top:.6rem;z-index:20;border:0;background:transparent;padding:0;width:2.2rem;height:2.2rem}
#cls{position:fixed;left:.7rem;top:.6rem;z-index:20;border:2px solid var(--line);background:#fff;color:var(--acc);border-radius:.6rem;font-weight:800;padding:.1rem .6rem;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--line);border-radius:.6rem;padding:.1rem .5rem;margin:.15rem;background:var(--soft2);font-weight:800}
.chip button{border:0;background:transparent;color:var(--bad);font-weight:900;font-size:1rem;padding:0 .2rem}
#cv{position:fixed;inset:0;pointer-events:none;z-index:2147483100}
</style>
</head>
<body>
<button id="stone" title="Методична картка"><svg viewBox="0 0 40 40" width="100%" height="100%"><polygon points="8,15 14,6 26,6 32,15 20,35" fill="#dcf7e4" stroke="#0d5c3a" stroke-width="2.2" stroke-linejoin="round"/><polyline points="8,15 32,15" fill="none" stroke="#0d5c3a" stroke-width="1.6"/><polyline points="14,6 17,15 20,35 23,15 26,6" fill="none" stroke="#2f9e6b" stroke-width="1.4"/></svg></button>
<div id="main"><div id="card"><div class="inner" id="inner"></div></div></div>
<div id="nav">
  <button class="btn sec" id="bk">← Назад</button>
  <button id="gem" title="Методична картка"><svg viewBox="0 0 40 40" width="100%" height="100%"><polygon points="8,15 14,6 26,6 32,15 20,35" fill="#dcf7e4" stroke="#0d5c3a" stroke-width="2.2" stroke-linejoin="round"/><polyline points="8,15 32,15" fill="none" stroke="#0d5c3a" stroke-width="1.6"/><polyline points="14,6 17,15 20,35 23,15 26,6" fill="none" stroke="#2f9e6b" stroke-width="1.4"/></svg></button>
  <div id="tm" title=""><div id="tmf"></div></div>
  <div id="pg"></div>
  <button class="btn" id="nx">Далі →</button>
</div>
<div id="tmt"></div>
<footer>Автор розробки <b>Ковтун Тетяна</b></footer>
<div id="ovm"><div class="mbox" id="mb"></div></div>
<canvas id="cv"></canvas>
<script>
(function(){"use strict";
/* ---------- математичне оформлення ---------- */
const M=s=>s.replace(/x/g,'<i>x</i>').replace(/\^2/g,'<sup>2</sup>').replace(/-/g,'−').replace(/!=/g,'≠');
const mm=(st,...v)=>{let o='';st.forEach((s,i)=>{o+=M(s)+(i<v.length?v[i]:'');});return o;};
const fr=(n,d)=>'<span class="fr"><span>'+M(n)+'</span><span>'+M(d)+'</span></span>';
const sys=rows=>'<span class="sys"><span class="rows">'+rows.map((r,i)=>'<span class="'+(i?'B':'A')+'">'+M(r)+'</span>').join('')+'</span></span>';
const fa=(n,d,k)=>'<span class="mf">'+fr(n,d)+'<span class="ad"><span class="sl"></span><span class="fill">'+M(k)+'</span></span></span>';
const X=M('x');
const OR=' або ';

/* ---------- №196 ---------- */
const A_=t=>'<span class="A">'+t+'</span>', B_=t=>'<span class="B">'+t+'</span>';
const EQS=[
 {eq:mm`${fr('x-6','x-4')} = 0`,steps:[
  ['Правило','Дріб дорівнює 0, коли <span class="A">чисельник = 0</span>, а <span class="B">знаменник ≠ 0</span>'],
  ['Чисельник = 0',A_(M('x-6 = 0'))+', '+mm`x = 6`],
  ['Знаменник ≠ 0',B_(M('x-4 != 0'))+', '+mm`x != 4`],
  ['Перевірка',mm`x = 6`+', '+mm`6 != 4`+' <span class="ok">✓</span>']],ans:'6'},
 {eq:mm`${fr('x-2','x^2-4')} = 0`,steps:[
  ['Чисельник = 0',A_(M('x-2 = 0'))+', '+mm`x = 2`],
  ['Знаменник ≠ 0',B_(M('x^2-4 != 0'))+', '+mm`(x-2)(x+2) != 0`+'<br>'+mm`x != 2`+' і '+mm`x != -2`],
  ['Перевірка',mm`x = 2`+' — знаменник дорівнює 0 <span class="no">✗</span>']],ans:'коренів немає',none:1},
 {eq:mm`${fr('x^2-4','x-2')} = 0`,steps:[
  ['Чисельник = 0',A_(M('x^2-4 = 0'))+', '+mm`x = 2`+OR+mm`x = -2`],
  ['Знаменник ≠ 0',B_(M('x-2 != 0'))+', '+mm`x != 2`],
  ['Коротко: система',sys(['x^2-4 = 0','x-2 != 0'])],
  ['Перевірка',mm`x = 2`+' <span class="no">✗</span> &nbsp; '+mm`x = -2`+' <span class="ok">✓</span>']],ans:'−2'},
 {eq:mm`${fr('x-2','x-2')} = 1`,steps:[
  ['Усе в одну частину',mm`${fr('x-2','x-2')} - 1 = 0`],
  ['Спільний знаменник',mm`${fr('x-2-(x-2)','x-2')} = ${fr('0','x-2')} = 0`],
  ['Умова',sys(['0 = 0 — завжди','x-2 != 0'])]],ans:X+' — будь-яке число, крім 2'},
 {eq:mm`${fr('2x^2+18','x^2+9')} = 2`,steps:[
  ['Усе в одну частину',mm`${fr('2x^2+18','x^2+9')} - 2 = 0`],
  ['Спільний знаменник',mm`${fr('2x^2+18-2(x^2+9)','x^2+9')} = 0`],
  ['Чисельник',mm`${fr('2x^2+18-2x^2-18','x^2+9')} = ${fr('0','x^2+9')} = 0`],
  ['Умова',sys(['0 = 0 — завжди','x^2+9 != 0'])+"   "+M("x^2+9")+" ≥ 9"]],ans:X+' — будь-яке число'},
 {eq:mm`${fr('x','x-5')} + ${fr('2x-9','x-5')} = 0`,steps:[
  ['Один дріб',mm`${fr('x+2x-9','x-5')} = ${fr('3x-9','x-5')} = 0`],
  ['Умова',sys(['3x-9 = 0','x-5 != 0'])],
  ['Корінь',mm`3x = 9`+', '+mm`x = 3`],
  ['Перевірка',mm`3-5 = -2 != 0`+' <span class="ok">✓</span>']],ans:'3'},
 {eq:mm`${fr('5x-7','x+1')} - ${fr('x-5','x+1')} = 0`,steps:[
  ['Один дріб',mm`${fr('5x-7-(x-5)','x+1')} = 0`],
  ['Чисельник',mm`${fr('5x-7-x+5','x+1')} = ${fr('4x-2','x+1')} = 0`],
  ['Умова',sys(['4x-2 = 0','x+1 != 0'])],
  ['Корінь',mm`4x = 2`+', '+mm`x = 0,5`],
  ['Перевірка',mm`0,5+1 = 1,5 != 0`+' <span class="ok">✓</span>']],ans:'0,5'},
 {eq:mm`${fr('2x+16','x+3')} - ${fr('1-3x','x+3')} = 0`,steps:[
  ['Один дріб',mm`${fr('2x+16-(1-3x)','x+3')} = 0`],
  ['Чисельник',mm`${fr('2x+16-1+3x','x+3')} = ${fr('5x+15','x+3')} = 0`],
  ['Умова',sys(['5x+15 = 0','x+3 != 0'])],
  ['Корінь',mm`5x = -15`+', '+mm`x = -3`],
  ['Перевірка',mm`-3+3 = 0`+' — знаменник дорівнює 0 <span class="no">✗</span>']],ans:'коренів немає',none:1},
 {eq:mm`${fr('2','x-1')} + ${fr('1','x+1')} = 0`,steps:[
  ['Додаткові множники',fa('2','x-1','x+1')+' + '+fa('1','x+1','x-1')+' = 0'],
  ['Спільний знаменник',mm`${fr('2(x+1)+(x-1)','(x-1)(x+1)')} = 0`],
  ['Чисельник',mm`${fr('2x+2+x-1','(x-1)(x+1)')} = ${fr('3x+1','(x-1)(x+1)')} = 0`],
  ['Умова',sys(['3x+1 = 0','x != 1','x != -1'])],
  ['Корінь',mm`3x = -1`+', '+mm`x = -${fr('1','3')}`],
  ['Перевірка',mm`-${fr('1','3')} != 1`+', '+mm`-${fr('1','3')} != -1`+' <span class="ok">✓</span>']],ans:'−'+fr('1','3')},
 {eq:mm`${fr('3','x-2')} = ${fr('4','x+3')}`,steps:[
  ['Усе в одну частину',mm`${fr('3','x-2')} - ${fr('4','x+3')} = 0`],
  ['Додаткові множники',fa('3','x-2','x+3')+' − '+fa('4','x+3','x-2')+' = 0'],
  ['Спільний знаменник',mm`${fr('3(x+3)-4(x-2)','(x-2)(x+3)')} = 0`],
  ['Чисельник',mm`${fr('3x+9-4x+8','(x-2)(x+3)')} = ${fr('17-x','(x-2)(x+3)')} = 0`],
  ['Умова',sys(['17-x = 0','x != 2','x != -3'])],
  ['Корінь',mm`x = 17`+', '+mm`17 != 2`+', '+mm`17 != -3`+' <span class="ok">✓</span>']],ans:'17'},
 {eq:mm`${fr('x','x-6')} = 2`,steps:[
  ['Усе в одну частину',mm`${fr('x','x-6')} - 2 = 0`],
  ['Спільний знаменник',mm`${fr('x-2(x-6)','x-6')} = 0`],
  ['Чисельник',mm`${fr('x-2x+12','x-6')} = ${fr('12-x','x-6')} = 0`],
  ['Умова',sys(['12-x = 0','x-6 != 0'])],
  ['Корінь',mm`x = 12`+', '+mm`12-6 = 6 != 0`+' <span class="ok">✓</span>']],ans:'12'},
 {eq:mm`${fr('x-4','x-3')} = ${fr('2x+1','2x-1')}`,steps:[
  ['Усе в одну частину',mm`${fr('x-4','x-3')} - ${fr('2x+1','2x-1')} = 0`],
  ['Додаткові множники',fa('x-4','x-3','2x-1')+' − '+fa('2x+1','2x-1','x-3')+' = 0'],
  ['Спільний знаменник',mm`${fr('(x-4)(2x-1)-(2x+1)(x-3)','(x-3)(2x-1)')} = 0`],
  ['Дужки',mm`(x-4)(2x-1) = 2x^2-x-8x+4 = 2x^2-9x+4`+'<br>'+mm`(2x+1)(x-3) = 2x^2-6x+x-3 = 2x^2-5x-3`],
  ['Чисельник',mm`2x^2-9x+4-(2x^2-5x-3) = -4x+7`],
  ['Умова',sys(['-4x+7 = 0','x != 3','2x-1 != 0'])],
  ['Корінь',mm`4x = 7`+', '+mm`x = ${fr('7','4')} = 1,75`],
  ['Перевірка',mm`1,75 != 3`+', '+mm`2·1,75-1 = 2,5 != 0`+' <span class="ok">✓</span>']],ans:fr('7','4')+' &nbsp;(1,75)'},
 {eq:mm`${fr('x+8','x')} - ${fr('6','x-2')} = 0`,steps:[
  ['Додаткові множники',fa('x+8','x','x-2')+' − '+fa('6','x-2','x')+' = 0'],
  ['Спільний знаменник',mm`${fr('(x+8)(x-2)-6x','x(x-2)')} = 0`],

    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
