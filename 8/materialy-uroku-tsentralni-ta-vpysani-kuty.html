<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Матеріали уроку, центральні та вписані кути</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=STIX+Two+Text:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14301f; --muted:#5b7a66; --acc:#0d5c3a; --acc2:#2e8b57; --accL:#dcf7e4;
  --soft:#eef7e8; --soft2:#f8f7e5; --line:#bcd9bd;
  --ok:#1e9e62; --okbg:#e6f7ee; --oktx:#14663f; --okln:#8fd3b0;
  --bad:#e0464e; --badbg:#fdecee; --badtx:#a3232b; --badln:#efa3a8;
  --warnbg:#fff6e5; --warntx:#8a5a00; --warnln:#f3d9a4;
  --o1:#0f766e; --o2:#7c3aed;
  --g-arc:#e8590c; --g-ang:#7048e8; --g-cen:#1c7ed6; --g-3:#2f9e44; --g-4:#d6336c; --g-5:#8a5a1c;
  --q:#2f9e44;
  --fs:20px;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;height:100dvh;overflow:hidden;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:600;color:var(--ink);
  background:linear-gradient(135deg,#eef7e8 0%,#e4f3d9 50%,#d6ecc6 100%) fixed;touch-action:manipulation}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;padding:.5rem .7rem 0}
#stages{flex:1;min-height:0;position:relative}
.stage{display:none;height:100%}
.stage.on{display:block}
.card{height:100%;overflow:auto;overflow-x:hidden;background:#fffffa;border:2px solid var(--line);border-radius:1.1rem;box-shadow:0 .25rem 1rem rgba(13,92,58,.10);padding:.9rem 1.2rem}
.inner{margin:auto;max-width:78rem}
h1,h2,h3{margin:0}
h2.ttl{font-size:1.5rem;font-weight:900;color:var(--acc);margin-bottom:.5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
i.v{font-family:"STIX Two Text","Times New Roman",serif;font-style:italic;font-weight:600;font-size:1.12em;letter-spacing:.02em}
.arcn{white-space:nowrap}
.sans{font-family:Nunito,system-ui,sans-serif}

/* навігація */
#nav{flex:none;display:flex;align-items:center;justify-content:center;gap:.9rem;padding:.45rem 0 .25rem}
#nav.hide{display:none}
.nb{font:inherit;font-weight:800;font-size:.95rem;color:#fff;background:var(--acc);border:0;border-radius:.8rem;padding:.55rem 1.3rem;min-height:2.6rem;cursor:pointer;box-shadow:0 .15rem 0 #09402a}
.nb:active{transform:translateY(1px)}
.nb.sec{background:var(--accL);color:var(--acc);box-shadow:0 .15rem 0 #b6dcc0}
.gem{width:2.6rem;height:2.6rem;border:0;background:transparent;padding:0;cursor:pointer}
.gem svg{width:100%;height:100%}
#timer{position:relative;width:.7rem;height:2.6rem;border-radius:.4rem;background:#dfeee0;border:1px solid var(--line);overflow:hidden;cursor:pointer}
#tfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7cc78f,#2e8b57);height:100%}
#ttip{position:absolute;bottom:3.1rem;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:.75rem;font-weight:700;border-radius:.4rem;padding:.2rem .5rem;white-space:nowrap;display:none;pointer-events:none}
#twrap{position:relative;display:flex}
#twrap:hover #ttip{display:block}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* старт */
.start{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;min-height:100%;text-align:center}
.start .big{font-size:1.2rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.start h1{font-size:2.6rem;font-weight:900;color:var(--acc);line-height:1.15}
.start .go{font-size:1.4rem;padding:.8rem 2.4rem}
.gemcorner{position:absolute;right:.9rem;top:.8rem;width:3rem;height:3rem}

/* загальні блоки */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.1rem;align-items:start}
.cols.fig-r{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
@media (max-width:760px){.cols,.cols.fig-r{grid-template-columns:minmax(0,1fr)}}
.figbox{background:var(--soft2);border:2px solid var(--line);border-radius:1rem;padding:.4rem;display:flex;justify-content:center}
svg.fig{width:100%;height:auto;max-height:60dvh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
svg.fig.wide{width:auto;max-width:100%;max-height:36dvh}
svg text{font-family:"STIX Two Text","Times New Roman",serif;font-style:italic;font-weight:700;user-select:none}
svg text.n{font-family:Nunito,system-ui,sans-serif;font-style:normal;font-weight:800}
.rule{background:var(--accL);border-left:.4rem solid var(--acc2);border-radius:.7rem;padding:.6rem .9rem;font-size:1.05rem;line-height:1.4;margin-bottom:.6rem}
.rule b{color:var(--acc)}
.note{background:var(--warnbg);border:1.5px solid var(--warnln);color:var(--warntx);border-radius:.7rem;padding:.4rem .7rem;font-size:.9rem}
.kc{color:var(--g-cen);font-weight:900}
.ka{color:var(--g-arc);font-weight:900}
.ki{color:var(--g-ang);font-weight:900}
.kg{color:var(--g-3);font-weight:900}
.kp{color:var(--g-4);font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 .6rem}
.chip{font:inherit;font-weight:800;font-size:.95rem;border:2px solid var(--line);background:#fff;color:var(--acc);border-radius:.8rem;padding:.4rem .75rem;min-height:2.4rem;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.pulse:not(.on){animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,139,87,.5)}50%{box-shadow:0 0 0 .4rem rgba(46,139,87,0)}}
.say{min-height:3.2rem;font-size:1.1rem;line-height:1.42}
.btn{font:inherit;font-weight:800;font-size:.95rem;border:0;border-radius:.75rem;padding:.45rem 1rem;min-height:2.4rem;color:#fff;background:var(--acc2);cursor:pointer;box-shadow:0 .12rem 0 #1f6b40}
.btn.sec{background:#fff;color:var(--acc);border:2px solid var(--line);box-shadow:none}
.btn.on{background:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.read{font-size:1.25rem;line-height:1.7;background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.55rem .9rem;margin:.4rem 0}
.read .num{font-weight:900}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-weight:800}
.frac>span:first-child{border-bottom:.12em solid currentColor;padding:0 .18em .05em}
.frac>span:last-child{padding:.05em .18em 0}

/* актуалізація */
.qcard{border-left:.5rem solid var(--q);background:#fff;border-radius:1rem;padding:.7rem 1rem;border-top:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.qnum{display:inline-block;background:var(--q);color:#fff;font-weight:900;border-radius:.6rem;padding:.1rem .7rem;margin-right:.5rem}
.qtxt{font-size:1.25rem;line-height:1.45;font-weight:700}
.qask{color:var(--q);font-weight:900}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55rem;margin:.7rem 0}
@media (max-width:760px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{font:inherit;font-weight:800;font-size:1.2rem;background:#fff;border:2.5px solid var(--q);color:var(--ink);border-radius:.9rem;padding:.55rem .3rem;min-height:3rem;cursor:pointer}
.opt b{color:var(--q);margin-right:.35rem}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badtx);opacity:.8;cursor:default}
.fb{font-weight:800;font-size:1rem;min-height:1.4rem}
.fb.ok{color:var(--oktx)} .fb.bad{color:var(--badtx)}

/* вправи */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.55rem}
.tab{font:inherit;font-weight:900;font-size:1rem;border:2px solid var(--line);background:#fff;color:var(--acc);border-radius:.8rem;padding:.35rem .9rem;min-height:2.4rem;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab.done::after{content:" ✓";color:#7be3a4}
.tab:not(.on).done::after{color:var(--ok)}
.cond{font-size:1.1rem;line-height:1.45;margin-bottom:.45rem}
.cond .no{font-weight:900;color:var(--acc);margin-right:.3rem}
.trow{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem .6rem;background:#fff;border:2px solid var(--line);border-radius:.85rem;padding:.4rem .7rem;margin:.35rem 0;font-size:1.08rem}
.trow[data-ok="1"]{background:var(--okbg);border-color:var(--okln)}
.trow .lab{font-weight:800}
input.num{font:inherit;font-weight:800;font-size:1.1rem;width:4.6em;text-align:center;border:2.5px solid var(--line);border-radius:.6rem;padding:.25rem .3rem;background:#fff;color:var(--ink);min-height:2.3rem}
input.num:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 .2rem rgba(46,139,87,.25)}
input.num.ok{border-color:var(--ok);background:var(--okbg)}
input.num.bad{border-color:var(--bad);background:var(--badbg)}
.go-chk{font:inherit;font-weight:800;font-size:.9rem;border:0;border-radius:.6rem;padding:.3rem .8rem;min-height:2.3rem;background:var(--acc2);color:#fff;cursor:pointer}
.sol{flex-basis:100%;font-size:.98rem;color:var(--oktx);font-weight:700}
.hint{flex-basis:100%;font-size:.98rem;color:var(--badtx);font-weight:700}
select.sel{font:inherit;font-weight:800;font-size:1rem;border:2.5px solid var(--line);border-radius:.6rem;padding:.3rem .4rem;background:#fff;color:var(--ink);min-height:2.3rem;max-width:100%}
select.sel.ok{border-color:var(--ok);background:var(--okbg)}
select.sel.bad{border-color:var(--bad);background:var(--badbg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}
@media (max-width:760px){.grid3,.grid4,.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:#fff;border:2px solid var(--line);border-radius:.85rem;padding:.35rem;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.mini[data-ok="1"]{background:var(--okbg);border-color:var(--okln)}
.mini svg{width:100%;height:auto;max-height:11rem}
.mini select.sel{width:100%}
.mini .trow{border:0;background:transparent;padding:.1rem;margin:0;justify-content:center}
.alldone{background:var(--okbg);border:2px solid var(--okln);color:var(--oktx);border-radius:.8rem;padding:.45rem .9rem;font-weight:900;margin-top:.5rem;display:none}
.nextrow{margin-top:.5rem;display:flex;justify-content:flex-end}
.angs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem;margin-top:.5rem}
@media (max-width:760px){.angs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ang{background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.35rem .5rem;display:flex;flex-direction:column;gap:.3rem;min-height:3.4rem}
.ang button.nm{font:inherit;font-weight:900;font-size:1.15rem;border:2px solid var(--line);background:var(--soft2);color:var(--ink);border-radius:.6rem;padding:.2rem .5rem;min-height:2.3rem;cursor:pointer}
.ang.ok{background:var(--okbg);border-color:var(--okln)} .ang.ok button.nm{background:#fff;border-color:var(--ok)}
.ang.bad{background:var(--badbg);border-color:var(--badln)}
.ang .why{font-size:.85rem;font-weight:700;color:var(--badtx)}
.ang .sub{font-size:.9rem;font-weight:700;display:none;align-items:center;gap:.35rem;flex-wrap:wrap}
.ang.ok .sub{display:flex}

/* підсумок */
.sumblock{display:none;background:#fff;border:2px solid var(--line);border-left:.45rem solid var(--acc2);border-radius:.9rem;padding:.45rem .9rem;margin:.45rem 0;font-size:1.15rem;line-height:1.4;align-items:center;gap:1rem}
.sumblock.show{display:flex}
.sumblock .mf{flex:none;width:4.6rem}
.sumblock .mf svg{width:100%;height:auto}
.selfq{background:var(--soft2);border:2px dashed var(--line);border-radius:.8rem;padding:.4rem .8rem;margin:.35rem 0;font-size:1.1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.selfq .ans{display:none;color:var(--acc);font-weight:900}
.selfq.show .ans{display:inline}

/* світлофор */
.tl{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.lamps{display:flex;gap:1rem;background:#cfd9d0;padding:.7rem 1rem;border-radius:1.2rem}
.lamp{width:3.6rem;height:3.6rem;border-radius:50%;opacity:.28;border:3px solid rgba(0,0,0,.12);transition:.3s}
.lamp.on{opacity:1;box-shadow:0 0 1.2rem currentColor}
.votes{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.vote{font:inherit;font-weight:900;font-size:1.05rem;border:3px solid;border-radius:1rem;padding:.6rem 1rem;background:#fff;cursor:pointer;min-width:11rem}
.vote small{display:block;font-weight:700;font-size:.8rem;color:var(--muted)}
.vote .cnt{font-size:1.6rem}

/* модальне вікно (нижче за олівець 2147483600) */
#modal{position:fixed;inset:0;z-index:2147483000;background:rgba(20,48,31,.45);display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#mbox{background:#fffffa;border:3px solid var(--line);border-radius:1.1rem;max-width:44rem;width:100%;max-height:92dvh;overflow:auto;padding:1rem 1.3rem;font-size:.95rem}
#mbox h3{color:var(--acc);font-size:1.15rem;font-weight:900;margin:.3rem 0 .15rem}
#mbox ul{margin:.2rem 0 .4rem 1.1rem;padding:0}
.mstage{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;font:inherit;font-weight:700;border:0;background:transparent;padding:.2rem .4rem;border-radius:.5rem;cursor:pointer;color:var(--ink)}
.mstage:hover{background:var(--accL)}
.confetti{position:fixed;top:-2rem;z-index:2147483100;font-size:1.4rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* клавіатура */
#kp{position:fixed;left:50%;bottom:4.2rem;transform:translateX(-50%);z-index:1000;display:none;gap:.3rem;background:#e6efe6;border:2px solid var(--line);border-radius:.9rem;padding:.35rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.2);max-width:98%;flex-wrap:wrap;justify-content:center}
#kp.show{display:flex}
#kp button{font:inherit;font-weight:900;font-size:1.05rem;width:2.5rem;height:2.5rem;border:2px solid var(--line);border-radius:.6rem;background:#fff;color:var(--ink);cursor:pointer;padding:0}
#kp button.w{width:3.6rem;background:var(--acc2);color:#fff;border-color:var(--acc2)}
</style>
</head>
<body>
<div id="app">
  <div id="stages"></div>
  <div id="nav" class="hide">
    <button class="nb sec" id="back">← Назад</button>
    <button class="gem" id="gem2" title="Методична картка"></button>
    <div id="twrap"><div id="timer" title=""><div id="tfill"></div></div><div id="ttip"></div></div>
    <button class="nb" id="next">Далі →</button>
  </div>
  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="kp"></div>
<script>
'use strict';
/* ====================== утиліти ====================== */
const NS='http://www.w3.org/2000/svg';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function h(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const mod=x=>((x%360)+360)%360;
const v=s=>'<i class="v">'+s+'</i>';
const arcN=s=>'<span class="arcn">∪'+v(s)+'</span>';
const angN=s=>'∠'+v(s);
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const frac=(a,b)=>'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';
function plural(n,one,few,many){n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return many;if(d>1&&d<5)return few;if(d===1)return one;return many;}

/* ====================== геометрія в SVG ====================== */
function P(c,R,a){return [c.x+R*Math.cos(rad(a)), c.y-R*Math.sin(rad(a))];}
const f2=n=>n.toFixed(2);
function arcPath(c,R,a1,span){span=Math.max(0.01,Math.min(359.99,span));const s=P(c,R,a1),e=P(c,R,a1+span);
  return 'M'+f2(s[0])+' '+f2(s[1])+'A'+R+' '+R+' 0 '+(span>180?1:0)+' 0 '+f2(e[0])+' '+f2(e[1]);}
function wedgePath(c,r,a1,span){span=Math.max(0.01,Math.min(359.99,span));const s=P(c,r,a1),e=P(c,r,a1+span);
  return 'M'+f2(c.x)+' '+f2(c.y)+'L'+f2(s[0])+' '+f2(s[1])+'A'+r+' '+r+' 0 '+(span>180?1:0)+' 0 '+f2(e[0])+' '+f2(e[1])+'Z';}
function dirAngle(a,b){return mod(deg(Math.atan2(-(b[1]-a[1]),b[0]-a[0])));}
/* клин кута з вершиною V між точками p і q (менший із двох кутів) */
function angleWedge(V,p,q,r){let a1=dirAngle(V,p),a2=dirAngle(V,q);let span=mod(a2-a1);if(span>180){a1=a2;span=360-span;}
  return {d:wedgePath({x:V[0],y:V[1]},r,a1,span),a1:a1,span:span,mid:a1+span/2};}
function rightMark(V,p,q,s){const a=dirAngle(V,p),b=dirAngle(V,q);const u=[Math.cos(rad(a)),-Math.sin(rad(a))],w=[Math.cos(rad(b)),-Math.sin(rad(b))];
  const p1=[V[0]+u[0]*s,V[1]+u[1]*s],p2=[V[0]+(u[0]+w[0])*s,V[1]+(u[1]+w[1])*s],p3=[V[0]+w[0]*s,V[1]+w[1]*s];
  return 'M'+f2(p1[0])+' '+f2(p1[1])+'L'+f2(p2[0])+' '+f2(p2[1])+'L'+f2(p3[0])+' '+f2(p3[1]);}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return [0,0];const q=p.matrixTransform(m.inverse());return [q.x,q.y];}
function drag(svg,node,move,start,end){node.style.cursor='grab';node.style.touchAction='none';let on=false;
  node.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();on=true;try{node.setPointerCapture(e.pointerId);}catch(_){}node.style.cursor='grabbing';if(start)start();});
  node.addEventListener('pointermove',e=>{if(!on)return;const p=svgPt(svg,e);move(p[0],p[1]);});
  const up=()=>{if(!on)return;on=false;node.style.cursor='grab';if(end)end();};
  node.addEventListener('pointerup',up);node.addEventListener('pointercancel',up);}
/* кругла фігура: svg, центр, радіус */
function circleSvg(vb,R,extra){const svg=sv('svg',{viewBox:'0 0 '+vb+' '+(extra||vb),class:'fig'});const c={x:vb/2,y:(extra||vb)/2};
  return {svg:svg,c:c,R:R};}
/* точка-мітка (без перетягування) */
function dot(parent,x,y,color,r){return sv('circle',{cx:f2(x),cy:f2(y),r:r||6,fill:color||'#14301f'},parent);}

/* підпис точки назовні від центру */

function fit(){

  let guard=0;
  while(card.scrollHeight>card.clientHeight+2&&fs>11&&guard<60){fs-=0.5;rt.style.setProperty('--fs',fs+'px');guard++;}
}

/* повертає рядок .trow; opts:{pre,post,ans,hint,sol,w} */
function numOpts(ans){
  const cand=[ans*2,ans/2,180-ans,90-ans,360-ans,ans+10,ans-10,ans+15,ans-15,ans+30,ans-30,ans+20,ans-20,ans+5,ans-5,ans+60,ans-60,ans+45,ans-45];
  const set=[];cand.forEach(function(x){if(Number.isInteger(x)&&x>0&&x<=360&&x!==ans&&set.indexOf(x)<0)set.push(x);});
  const near=set.filter(function(x){return Math.abs(x-ans)<=60;}),far=set.filter(function(x){return Math.abs(x-ans)>60;});
  const pool=shuffle(near).concat(shuffle(far)).slice(0,5);pool.push(ans);
  return pool.sort(function(p,q){return p-q;});
}
function numRow(o){
  const row=h('div',{class:'trow'});row.dataset.need='1';
  if(o.pre)row.appendChild(h('span',{class:'lab'},o.pre));
  const inp=h('select',{class:'sel num'});
  inp.appendChild(h('option',{value:''},'Оберіть…'));
  numOpts(o.ans).forEach(function(x){inp.appendChild(h('option',{value:String(x)},x+'°'));});
  row.appendChild(inp);
  const fb=h('span',{class:'hint'});fb.style.display='none';row.appendChild(fb);
  function check(){
    if(row.dataset.ok==='1')return;
    const s=inp.value;if(s==='')return;
    if(parseFloat(s)===o.ans){row.dataset.ok='1';inp.classList.remove('bad');inp.classList.add('ok');inp.disabled=true;
      fb.className='sol';fb.style.display='block';fb.innerHTML='✓ Правильно! '+(o.sol||'');row.dispatchEvent(new CustomEvent('solved',{bubbles:true}));}
    else{inp.classList.add('bad');fb.className='hint';fb.style.display='block';fb.innerHTML='Неправильно. '+(o.hint||'Спробуйте ще раз.');}
  }
  inp.addEventListener('change',function(){inp.classList.remove('bad');check();fitSoon&&fitSoon();});
  return row;
}

function makeTabs(root,items,finalText){
  const tabs=h('div',{class:'tabs'});const body=h('div');root.appendChild(tabs);root.appendChild(body);
  const done=h('div',{class:'alldone'},finalText||'Усі завдання виконано правильно!');
  const panels=[];
  items.forEach((it,i)=>{
    const b=h('button',{class:'tab'},it.tab);tabs.appendChild(b);
    const p=h('div');p.style.display='none';body.appendChild(p);it.build(p);
    if(i<items.length-1){const nx=h('div',{class:'nextrow'});const nb=h('button',{class:'btn'},'Наступне завдання →');nb.onclick=()=>show(i+1);nx.appendChild(nb);p.appendChild(nx);}
    panels.push({b:b,p:p});
    b.onclick=()=>show(i);
    p.addEventListener('solved',()=>{upd();});
  });
  body.appendChild(done);
  function upd(){let all=true;panels.forEach(x=>{const rows=$$('[data-need]',x.p);const ok=rows.length>0&&rows.every(r=>r.dataset.ok==='1');x.b.classList.toggle('done',ok);if(!ok)all=false;});
    done.style.display=all?'block':'none';}
  function show(i){panels.forEach((x,k)=>{x.p.style.display=k===i?'block':'none';x.b.classList.toggle('on',k===i);});fitSoon();}
  root._tabsUpdate=upd;
  show(0);return {show:show,upd:upd};
}

  r.innerHTML='<h2 class="ttl">Кути</h2><div class="cols"><div><div class="qcard" id="qc"></div><div class="opts" id="qo"></div><div class="fb" id="qf"></div><div style="margin-top:.4rem"><button class="btn" id="qn">Нове запитання ↻</button></div></div><div class="figbox" id="qfig"></div></div>';
  let n=0,last=-1;
  function gen(){
    n++;let t;do{t=rnd(0,QTYPES.length-1);}while(t===last);last=t;
    const q=QTYPES[t]();const col=QCOL[(n-1)%QCOL.length];
    $('#stages').style.setProperty('--q',col);r.style.setProperty('--q',col);
    $('#qc',r).innerHTML='<span class="qnum">№ '+n+'</span><span class="qtxt">'+q.txt+'</span>';
    $('#qfig',r).innerHTML='';$('#qfig',r).appendChild(q.svg);
    const opts=mkOptions(q.ans,q.given);const box=$('#qo',r);box.innerHTML='';$('#qf',r).textContent='';$('#qf',r).className='fb';
    opts.forEach(function(o,i){const b=h('button',{class:'opt'},'<b>'+'АБВГ'[i]+'</b>'+o+'°');box.appendChild(b);
      b.onclick=function(){if(b.classList.contains('bad')||box.dataset.done)return;
        if(o===q.ans){b.classList.add('ok');box.dataset.done='1';$('#qf',r).className='fb ok';$('#qf',r).textContent='Правильно!';}
        else{b.classList.add('bad');$('#qf',r).className='fb bad';$('#qf',r).textContent='Неправильно. Спробуйте інший варіант.';}};});
    delete box.dataset.done;
  }
  $('#qn',r).onclick=gen;gen();STAGES.filter(function(s){return s.id==='act';})[0].regen=gen;
}});
</script>
<script>
const C0={x:200,y:200},R0=140;
const COL={arc:'#e8590c',ang:'#7048e8',cen:'#1c7ed6',g:'#2f9e44',p:'#d6336c',br:'#8a5a1c'};
function baseCircle(svg,c,R){sv('circle',{cx:c.x,cy:c.y,r:R,fill:'#fbfdf6',stroke:'#14301f','stroke-width':3.5},svg);}
function setLayers(svg,names){$$('[data-l]',svg).forEach(function(g){g.style.display=names.indexOf(g.getAttribute('data-l'))>=0?'':'none';});}
function layer(svg,name){return sv('g',{'data-l':name},svg);}
const SUB=['₁','₂','₃','₄','₅'];
function ev(a){return mod(Math.round(a/2)*2);}
function angDiff(a,b){const d=mod(a-b);return Math.min(d,360-d);}

/* ====================== 2. ДУГА І ЦЕНТРАЛЬНИЙ КУТ ====================== */
addStage({id:'arc',title:'Дуга. Центральний кут',dur:210,build:function(r){
  r.innerHTML='<h2 class="ttl">Центральний кут</h2><div class="cols"><div class="figbox" id="f"></div><div><div class="rule">Центральним кутом кола називають <span class="kc">кут з вершиною в центрі кола</span>.</div><div class="chips" id="ch"></div><div class="say" id="say"></div></div></div>';
  const o=circleSvg(400,R0);const svg=o.svg,c=o.c;$('#f',r).appendChild(svg);baseCircle(svg,c,R0);
  const a=30,b=140,m=255;const A=P(c,R0,a),B=P(c,R0,b),M=P(c,R0,m);
  const L1=layer(svg,'sector');sv('path',{d:wedgePath(c,R0,a,b-a),fill:COL.cen,'fill-opacity':.13},L1);sv('path',{d:wedgePath(c,48,a,b-a),fill:COL.cen,'fill-opacity':.45,stroke:COL.cen,'stroke-width':3},L1);
  const lp=P(c,78,(a+b)/2);label(L1,'110°',lp[0],lp[1],COL.cen,24).setAttribute('class','n');
  const L2=layer(svg,'ends');[A,B].forEach(function(p){sv('circle',{cx:f2(p[0]),cy:f2(p[1]),r:19,fill:'none',stroke:COL.p,'stroke-width':4},L2);});
  const L3=layer(svg,'arcMinor');sv('path',{d:arcPath(c,R0,a,b-a),fill:'none',stroke:COL.arc,'stroke-width':11,'stroke-linecap':'round','stroke-opacity':.9},L3);
  const L4=layer(svg,'arcMajor');sv('path',{d:arcPath(c,R0,b,360-(b-a)),fill:'none',stroke:COL.g,'stroke-width':11,'stroke-linecap':'round','stroke-opacity':.8},L4);
  const L5=layer(svg,'notation');let q=P(c,R0+44,(a+b)/2);label(L5,'∪AB',q[0],q[1],COL.arc,28);q=P(c,R0+50,m+30);label(L5,'∪AMB',q[0]-6,q[1]+4,COL.g,28);
  const L6=layer(svg,'values');q=P(c,R0-30,(a+b)/2+38);label(L6,'110°',q[0],q[1],COL.arc,22).setAttribute('class','n');q=P(c,R0-34,m-12);label(L6,'250°',q[0],q[1],COL.g,24).setAttribute('class','n');
  const L7=layer(svg,'chord');sline(L7,A,B,COL.ang,6,'12 8');
  const L8=layer(svg,'full');label(L8,'360°',c.x,c.y+36,'#14301f',24).setAttribute('class','n');
  sline(svg,[c.x,c.y],A,'#14301f',3);sline(svg,[c.x,c.y],B,'#14301f',3);
  dot(svg,c.x,c.y,'#14301f',6);label(svg,'O',c.x+4,c.y+22,'#14301f',26);
  [[A,'A'],[B,'B'],[M,'M']].forEach(function(x){dot(svg,x[0][0],x[0][1],'#14301f',6);plabel(svg,c,x[0],x[1],'#14301f',24);});
  const facts=[
   {n:'Кінці дуги',l:['ends'],t:'Точки '+v('A')+' і '+v('B')+' — <span class="kp">кінці дуги</span>. Вони належать кожній із двох дуг.'},
   {n:'Дві дуги',l:['arcMinor','arcMajor'],t:'Точки '+v('A')+' і '+v('B')+' ділять коло на <span class="ka">дві</span> <span class="kg">дуги</span>.'},
   {n:'Позначення дуги',l:['arcMinor','arcMajor','notation'],t:'<span class="ka">'+arcN('AB')+'</span> — «дуга '+v('AB')+'». Позначення <span class="kg">'+arcN('AMB')+'</span> стосується дуги, на якій лежить точка '+v('M')+'. Якщо на одній із дуг відмічено точку, то '+arcN('AB')+' — дуга, якій ця точка не належить.'},
   {n:'Спирається на дугу',l:['sector','arcMinor'],t:'Центральний кут '+v('AOB')+' <span class="kc">спирається</span> на дугу <span class="ka">'+arcN('AB')+'</span>.'},
   {n:'Градусна міра',l:['sector','arcMinor','arcMajor','values','full'],t:'Градусна міра кола — <b>360°</b>. '+arcN('AB')+' = ∠'+v('AOB')+' = 110°. Дуга '+arcN('AMB')+' = 360° − ∠'+v('AOB')+' = 250°.'},
   {n:'Хорда стягує дуги',l:['chord','arcMinor','arcMajor','values'],t:'Хорда '+v('AB')+' <span class="ki">стягує</span> дуги '+arcN('AB')+' і '+arcN('AMB')+'. Будь-яка хорда стягує дві дуги, сума градусних мір яких дорівнює <b>360°</b>: 110° + 250° = 360°.'}
  ];
  const ch=$('#ch',r),say=$('#say',r);
  function sel(i){$$('.chip',ch).forEach(function(b,k){b.classList.toggle('on',k===i);});if(i<0){setLayers(svg,['sector']);say.innerHTML='';return;}setLayers(svg,facts[i].l);say.innerHTML=facts[i].t;}
  facts.forEach(function(f,i){const b=h('button',{class:'chip'},f.n);b.onclick=function(){sel(i);};ch.appendChild(b);});
  sel(-1);
}});

/* ====================== 3. ВПИСАНИЙ КУТ ====================== */
addStage({id:'insc',title:'Вписаний кут',dur:150,build:function(r){
  r.innerHTML='<h2 class="ttl">Вписаний кут</h2><div class="cols"><div class="figbox" id="f"></div><div><div class="rule">Вписаним кутом кола називають <span class="ki">кут, вершина якого належить колу, а сторони перетинають коло</span>.</div><div class="chips" id="ch"></div><div class="say" id="say"></div></div></div>';
  const o=circleSvg(400,R0);const svg=o.svg,c=o.c;$('#f',r).appendChild(svg);baseCircle(svg,c,R0);
  const a=205,cc=335,bb=80;const A=P(c,R0,a),C=P(c,R0,cc),B=P(c,R0,bb);
  const L1=layer(svg,'angle');const w=angleWedge(B,A,C,52);sv('path',{d:w.d,fill:COL.ang,'fill-opacity':.4,stroke:COL.ang,'stroke-width':3},L1);
  const L2=layer(svg,'arcAC');sv('path',{d:arcPath(c,R0,a,cc-a),fill:'none',stroke:COL.arc,'stroke-width':11,'stroke-linecap':'round','stroke-opacity':.9},L2);
  const L3=layer(svg,'arcABC');sv('path',{d:arcPath(c,R0,cc,360-(cc-a)),fill:'none',stroke:COL.g,'stroke-width':11,'stroke-linecap':'round','stroke-opacity':.55},L3);
  let q=P(c,R0+46,(a+cc)/2);const La=layer(svg,'labAC');label(La,'∪AC',q[0],q[1],COL.arc,28);q=P(c,R0+56,70);label(La,'∪ABC',q[0]+8,q[1]-4,COL.g,28);
  const L4=layer(svg,'chord');sline(L4,A,C,COL.cen,6,'12 8');
  sline(svg,B,A,COL.ang,4);sline(svg,B,C,COL.ang,4);
  dot(svg,c.x,c.y,'#14301f',5);label(svg,'O',c.x+4,c.y+20,'#14301f',24);
  [[A,'A'],[B,'B'],[C,'C']].forEach(function(x){dot(svg,x[0][0],x[0][1],'#14301f',6);plabel(svg,c,x[0],x[1],'#14301f',24);});
  const facts=[
   {n:'Вписаний кут',l:['angle'],t:'Кут '+v('ABC')+' — <span class="ki">вписаний</span>: вершина '+v('B')+' на колі, сторони перетинають коло в точках '+v('A')+' і '+v('C')+'.'},
   {n:'Спирається на дугу',l:['angle','arcAC','arcABC','labAC'],t:'Дуга <span class="ka">'+arcN('AC')+'</span> належить куту '+v('ABC')+', а дуга <span class="kg">'+arcN('ABC')+'</span> — не належить. Вписаний кут '+v('ABC')+' <span class="ki">спирається</span> на дугу <span class="ka">'+arcN('AC')+'</span>.'},
   {n:'Спирається на хорду',l:['angle','chord'],t:'Також можна сказати, що вписаний кут '+v('ABC')+' спирається на <span class="kc">хорду '+v('AC')+'</span>.'}
  ];
  const ch=$('#ch',r),say=$('#say',r);
  function sel(i){$$('.chip',ch).forEach(function(b,k){b.classList.toggle('on',k===i);});if(i<0){setLayers(svg,['angle']);say.innerHTML='';return;}setLayers(svg,facts[i].l);say.innerHTML=facts[i].t;}
  facts.forEach(function(f,i){const b=h('button',{class:'chip'},f.n);b.onclick=function(){sel(i);};ch.appendChild(b);});
  sel(-1);
}});

/* ====================== 4. ТЕОРЕМА 9.1 ====================== */
addStage({id:'thm',title:'Теорема 9.1',dur:300,build:function(r){
  r.innerHTML='<h2 class="ttl">Теорема 9.1</h2><div class="cols"><div class="figbox" id="f"></div><div><div class="rule"><b>Теорема 9.1.</b> Градусна міра вписаного кута дорівнює половині градусної міри дуги, на яку він спирається.</div>'
   +'<div class="read" id="rd"></div><div class="chips" id="pr"></div><div class="chips"><button class="chip" id="tc">Показати центральний кут</button></div><div class="say" id="cap"></div></div></div>';
  const o=circleSvg(400,R0);const svg=o.svg,c=o.c;$('#f',r).appendChild(svg);baseCircle(svg,c,R0);
  const gArc=sv('path',{fill:'none',stroke:COL.arc,'stroke-width':12,'stroke-linecap':'round','stroke-opacity':.9},svg);
  const gCen=sv('g',{},svg);const cw=sv('path',{fill:COL.cen,'fill-opacity':.3,stroke:COL.cen,'stroke-width':3},gCen);const cl1=sv('line',{stroke:COL.cen,'stroke-width':4},gCen),cl2=sv('line',{stroke:COL.cen,'stroke-width':4},gCen);const ct=label(gCen,'',0,0,COL.cen,22);ct.setAttribute('class','n');
  const iw=sv('path',{fill:COL.ang,'fill-opacity':.4,stroke:COL.ang,'stroke-width':3},svg);
  const s1=sv('line',{stroke:COL.ang,'stroke-width':4,'stroke-linecap':'round'},svg),s2=sv('line',{stroke:COL.ang,'stroke-width':4,'stroke-linecap':'round'},svg);
  const it=label(svg,'',0,0,COL.ang,22);it.setAttribute('class','n');
  dot(svg,c.x,c.y,'#14301f',5);label(svg,'O',c.x+4,c.y+20,'#14301f',24);
  const hA=handle(svg,svg,'#14301f','A'),hB=handle(svg,svg,COL.ang,'B'),hC=handle(svg,svg,'#14301f','C');
  let st={a:206,b:80,c:334},showC=false;
  function draw(){
    const A=P(c,R0,st.a),B=P(c,R0,st.b),C=P(c,R0,st.c);
    const mac=mod(st.c-st.a),mb=mod(st.b-st.a);let start,span;
    if(mb<mac){start=st.c;span=360-mac;}else{start=st.a;span=mac;}
    span=Math.round(span);
    gArc.setAttribute('d',arcPath(c,R0,start,span));
    const w=angleWedge(B,A,C,44);iw.setAttribute('d',w.d);
    sline2(s1,B,A);sline2(s1,B,A);sline2(s2,B,C);
    const lp=P({x:B[0],y:B[1]},70,w.mid);it.setAttribute('x',f2(lp[0]));it.setAttribute('y',f2(lp[1]));it.textContent=fmt(span/2)+'°';
    gCen.style.display=showC?'':'none';
    if(showC){cw.setAttribute('d',wedgePath(c,50,start,span));const e1=P(c,R0,start),e2=P(c,R0,start+span);sline2(cl1,[c.x,c.y],e1);sline2(cl2,[c.x,c.y],e2);
      const q=P(c,span>150?78:84,start+span/2);ct.setAttribute('x',f2(q[0]));ct.setAttribute('y',f2(q[1]));ct.textContent=span+'°';}
    hA.set(A[0],A[1],c);hB.set(B[0],B[1],c);hC.set(C[0],C[1],c);
    $('#rd',r).innerHTML='<div>'+arcN('AC')+' = <span class="ka num">'+span+'°</span></div><div>∠'+v('ABC')+' = '+frac(1,2)+' · <span class="ka num">'+span+'°</span> = <span class="ki num">'+fmt(span/2)+'°</span></div>';
    // де центр
    const dO=dirAngle(B,[c.x,c.y]);const dA=dirAngle(B,A),dC=dirAngle(B,C);let t;
    if(Math.abs(mod(dO-dA+180)-180)<1.5||Math.abs(mod(dO-dC+180)-180)<1.5)t='Центр кола <b>лежить на стороні</b> кута.';
    else{const wa=angleWedge(B,A,C,10);t=mod(dO-wa.a1)<=wa.span?'Центр кола <b>лежить усередині</b> кута.':'Центр кола <b>лежить поза кутом</b>.';}
    $('#cap',r).innerHTML=t;
  }
  function sline2(l,a,b){l.setAttribute('x1',f2(a[0]));l.setAttribute('y1',f2(a[1]));l.setAttribute('x2',f2(b[0]));l.setAttribute('y2',f2(b[1]));}
  function mover(key){return function(x,y){const th=ev(dirAngle([c.x,c.y],[x,y]));const o2=Object.assign({},st);o2[key]=th;
    if(angDiff(o2.a,o2.b)<12||angDiff(o2.a,o2.c)<12||angDiff(o2.b,o2.c)<12)return;st=o2;draw();};}
  drag(svg,hA.g,mover('a'));drag(svg,hB.g,mover('b'));drag(svg,hC.g,mover('c'));
  const presets=[{n:'Центр на стороні кута',s:{a:150,b:250,c:70}},{n:'Центр усередині кута',s:{a:166,b:270,c:14}},{n:'Центр поза кутом',s:{a:60,b:120,c:20}}];
  presets.forEach(function(p){const b=h('button',{class:'chip'},p.n);b.onclick=function(){st=Object.assign({},p.s);draw();};$('#pr',r).appendChild(b);});
  $('#tc',r).onclick=function(){showC=!showC;$('#tc',r).classList.toggle('on',showC);$('#tc',r).textContent=showC?'Сховати центральний кут':'Показати центральний кут';draw();};
  draw();
}});

/* ====================== 5–6. НАСЛІДКИ ====================== */
function sameArc(r,o){
  const oc=circleSvg(400,R0);const svg=oc.svg,c=oc.c;$('#f',r).appendChild(svg);baseCircle(svg,c,R0);
  const COLS=[COL.ang,COL.g,COL.p,COL.br,COL.cen];
  const arc=sv('path',{fill:'none',stroke:COL.arc,'stroke-width':12,'stroke-linecap':'round','stroke-opacity':.9},svg);
  const chord=sline(svg,[0,0],[0,0],'#14301f',2.5,'8 7');
  const vg=sv('g',{},svg);
  const hA=handle(svg,svg,'#14301f','A'),hC=handle(svg,svg,'#14301f','C');
  let st={a:o.diameter?200:214,c:o.diameter?20:326,n:o.n0,t:[0.2,0.5,0.8,0.35,0.65]};
  const hv=[];
  for(let i=0;i<5;i++){const hh=handle(svg,svg,COLS[i],'B'+SUB[i]);hv.push(hh);}
  function sl(l,a,b){l.setAttribute('x1',f2(a[0]));l.setAttribute('y1',f2(a[1]));l.setAttribute('x2',f2(b[0]));l.setAttribute('y2',f2(b[1]));}
  const rec=[];
  for(let i=0;i<5;i++){const g=sv('g',{},vg);rec.push({g:g,w:sv('path',{fill:COLS[i],'fill-opacity':.35,stroke:COLS[i],'stroke-width':3},g),l1:sv('line',{stroke:COLS[i],'stroke-width':3.5,'stroke-linecap':'round'},g),l2:sv('line',{stroke:COLS[i],'stroke-width':3.5,'stroke-linecap':'round'},g),sq:sv('path',{fill:'none',stroke:COLS[i],'stroke-width':3},g),t:label(g,'',0,0,COLS[i],20)});rec[i].t.setAttribute('class','n');}
  function draw(){
    const m=o.diameter?180:Math.round(mod(st.c-st.a));const A=P(c,R0,st.a),C=P(c,R0,st.a+m);
    arc.setAttribute('d',arcPath(c,R0,st.a,m));sl(chord,A,C);if(!o.diameter)chord.style.display='none';
    hA.set(A[0],A[1],c);hC.set(C[0],C[1],c);
    const span2=360-m;let rows='';
    for(let i=0;i<5;i++){const on=i<st.n;rec[i].g.style.display=on?'':'none';hv[i].g.style.display=on?'':'none';if(!on)continue;
      const ang=mod(st.a+m+st.t[i]*span2);const B=P(c,R0,ang);hv[i].set(B[0],B[1],c);
      const w=angleWedge(B,A,C,34);rec[i].w.setAttribute('d',w.d);sl(rec[i].l1,B,A);sl(rec[i].l2,B,C);
      if(o.diameter){rec[i].sq.setAttribute('d',rightMark(B,A,C,15));rec[i].w.setAttribute('fill-opacity',.18);}else rec[i].sq.setAttribute('d','');
      const lp=P({x:B[0],y:B[1]},56,w.mid);rec[i].t.setAttribute('x',f2(lp[0]));rec[i].t.setAttribute('y',f2(lp[1]));rec[i].t.textContent=fmt(m/2)+'°';
      rows+='<div>∠<span style="color:'+COLS[i]+'">'+v('AB'+SUB[i]+'C')+'</span> = <span class="num" style="color:'+COLS[i]+'">'+fmt(m/2)+'°</span></div>';}
    const tail=o.diameter?'<div><span class="ka">'+arcN('AC')+' = 180°</span>, тому кожен із цих кутів = '+frac(1,2)+' · 180° = <b>90°</b></div>':'<div><span class="ka">'+arcN('AC')+' = '+m+'°</span>, тому кожен із цих кутів = '+frac(1,2)+' · '+m+'° = <b>'+fmt(m/2)+'°</b></div>';
    $('#rd',r).innerHTML=rows+tail;
  }
  function mv(key){return function(x,y){const th=ev(dirAngle([c.x,c.y],[x,y]));
    if(o.diameter){if(key==='a')st.a=th;else st.a=mod(th+180);draw();return;}
    const n2={a:st.a,c:st.c};n2[key]=th;const m=mod(n2.c-n2.a);if(m<24||m>300)return;st.a=n2.a;st.c=n2.c;draw();};}
  drag(svg,hA.g,mv('a'));drag(svg,hC.g,mv('c'));
  hv.forEach(function(hh,i){drag(svg,hh.g,function(x,y){const th=dirAngle([c.x,c.y],[x,y]);const m=o.diameter?180:mod(st.c-st.a);const span2=360-m;const rel=mod(th-(st.a+m));let t=rel/span2;
    if(t>1){t=(rel-span2)<(360-rel)?1:0;}st.t[i]=Math.max(0.06,Math.min(0.94,t));draw();});});
  $('#add',r).onclick=function(){if(st.n<o.max){st.n++;draw();}$('#add',r).disabled=st.n>=o.max;fitSoon();};
  draw();
}
addStage({id:'c1',title:'Наслідок 1',dur:150,build:function(r){
  r.innerHTML='<h2 class="ttl">Наслідок 1</h2><div class="cols"><div class="figbox" id="f"></div><div><div class="rule"><b>Наслідок 1.</b> Вписані кути, які спираються на одну й ту саму дугу, <span class="ki">рівні</span>.</div><div class="read" id="rd"></div><div class="chips"><button class="chip" id="add">Додати ще один кут</button></div></div></div>';
  sameArc(r,{diameter:false,n0:2,max:4});

addStage({id:'c2',title:'Наслідок 2',dur:150,build:function(r){

html.pm-dock-r{padding-right:var(--pm-w,26px)!important;box-sizing:border-box!important}
html.pm-dock-l{padding-left:var(--pm-w,26px)!important;box-sizing:border-box!important}

#pm-panel,#pm-fab{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;box-sizing:border-box}
#pm-panel *{box-sizing:border-box}
#pm-panel[hidden],#pm-fab[hidden]{display:none!important}
#pm-panel{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:2147483600;width:42px;max-height:calc(100vh - 10px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  background:#e3e7ee;border:1px solid #aeb7c4;border-radius:14px;box-shadow:0 2px 12px rgba(40,50,70,.22)}
#pm-panel::-webkit-scrollbar{display:none}
#pm-panel.pm-left{right:auto;left:4px}
.pm-b{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:transparent;color:#465162;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pm-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pm-b:hover{background:#d3d9e3}
.pm-b:active{transform:scale(.93)}
.pm-b.on{background:#c5cedb;color:#26303f;box-shadow:inset 0 0 0 1px #8f9db2}
#pm-panel.pm-left [data-a="hide"] svg{transform:scaleX(-1)}
.pm-sep{flex:none;width:18px;height:1px;margin:3px 0;background:#bcc4d0}
.pm-colors{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px 0}
.pm-c{width:15px;height:15px;padding:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #9aa4b3;cursor:pointer}
.pm-c.on{box-shadow:0 0 0 2px #3b4452}

#pm-fab{position:fixed;right:0;top:50%;margin-top:-26px;z-index:2147483600;width:20px;height:52px;padding:0;
  display:flex;align-items:center;justify-content:center;color:#465162;cursor:pointer;
  background:#e3e7ee;border:1px solid #aeb7c4;border-right:0;border-radius:12px 0 0 12px;box-shadow:0 2px 8px rgba(40,50,70,.2)}
#pm-fab.pm-left{right:auto;left:0;border:1px solid #aeb7c4;border-left:0;border-radius:0 12px 12px 0}
#pm-fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* низький екран: кнопки стають у дві колонки */
@media (max-height:600px){
  #pm-panel{width:78px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 2px}
  .pm-sep{display:none}
  .pm-colors{width:100%;grid-template-columns:repeat(4,auto);justify-content:center;gap:4px;padding:4px 0}
  .pm-c{width:14px;height:14px}
}

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body></html>
