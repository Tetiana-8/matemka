<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 8 клас — зміст</title>
<style>
  :root{
    --main:#3d9e66;      /* світло-зелений — колір 8 класу */
    --soft:#dff3e6;
    --softer:#f3fbf6;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#bfe2cc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 8 клас</h1>
  <p class="sub">Теми за підручником. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКА ===== */
const ZMIST = [
 {rozdil:"Алгебра", par:[
  {t:"§ 1. Раціональні вирази", temy:[
   ["a1","Раціональні дроби"],
   ["a2","Основна властивість раціонального дробу"],
   ["a3","Додавання і віднімання раціональних дробів з однаковими знаменниками"],
   ["a4","Додавання і віднімання раціональних дробів з різними знаменниками"],
   ["check","Завдання № 1 «Перевірте себе»"],
   ["a5","Множення і ділення раціональних дробів. Піднесення раціонального дробу до степеня"],
   ["a6","Тотожні перетворення раціональних виразів"],
   ["check","Завдання № 2 «Перевірте себе»"],
   ["a7","Рівносильні рівняння. Раціональні рівняння"],
   ["a8","Степінь із цілим від’ємним показником"],
   ["a9","Властивості степеня із цілим показником"],
   ["a10","Функція y = k/x та її графік"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 2. Квадратні корені. Дійсні числа", temy:[
   ["a11","Функція y = x² та її графік"],
   ["a12","Квадратні корені. Арифметичний квадратний корінь"],
   ["a13","Множина та її елементи. Підмножина"],
   ["a14","Числові множини"],
   ["a15","Властивості арифметичного квадратного кореня"],
   ["a16","Тотожні перетворення виразів, які містять квадратні корені"],
   ["a17","Функція y = √x та її графік"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"§ 3. Квадратні рівняння", temy:[
   ["a18","Квадратні рівняння. Розв’язування неповних квадратних рівнянь"],
   ["a19","Формула коренів квадратного рівняння"],
   ["a20","Теорема Вієта"],
   ["check","Завдання № 5 «Перевірте себе»"],
   ["a21","Квадратний тричлен"],
   ["a22","Розв’язування рівнянь, які зводяться до квадратних рівнянь"],
   ["a23","Раціональні рівняння як математичні моделі реальних ситуацій"],
   ["check","Завдання № 6 «Перевірте себе»"]]},
  {t:"Вправи для повторення курсу алгебри 8 класу", temy:[["povt_a","Повторення за курс алгебри 8 класу"]]}
 ]},
 {rozdil:"Геометрія", par:[
  {t:"§ 1. Чотирикутники", temy:[
   ["g1","Чотирикутник та його елементи"],
   ["g2","Паралелограм. Властивості паралелограма"],
   ["g3","Ознаки паралелограма"],
   ["g4","Прямокутник"],
   ["g5","Ромб"],
   ["g6","Квадрат"],
   ["g7","Середня лінія трикутника"],
   ["g8","Трапеція"],
   ["g9","Центральні та вписані кути"],
   ["g10","Описане та вписане кола чотирикутника"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Подібність трикутників", temy:[
   ["g11","Теорема Фалеса. Теорема про пропорційні відрізки"],
   ["g12","Подібні трикутники"],
   ["g13","Перша ознака подібності трикутників"],
   ["g14","Друга та третя ознаки подібності трикутників"],
   ["check","Завдання № 2 «Перевірте себе»"]]},
  {t:"§ 3. Розв’язування прямокутних трикутників", temy:[
   ["g15","Метричні співвідношення в прямокутному трикутнику"],
   ["g16","Теорема Піфагора"],
   ["g17","Тригонометричні функції гострого кута прямокутного трикутника"],
   ["g18","Розв’язування прямокутних трикутників"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 4. Многокутники. Площа многокутника", temy:[
   ["g19","Многокутники"],
   ["g20","Поняття площі многокутника. Площа прямокутника"],
   ["g21","Площа паралелограма"],
   ["g22","Площа трикутника"],
   ["g23","Площа трапеції"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"Вправи для повторення курсу геометрії 8 класу", temy:[["povt_g","Повторення за курс геометрії 8 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми (або "povt" для повторення).
   test:true — кнопка буде світлою (для тестів).
   Приклад:  a7: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
  a4: [{n:"Тренажер: додавання і віднімання дробів", url:"https://sites.google.com/view/dodavannia-ratsionalnykh"}],
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  if(r.rozdil){ const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h); }
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const isT=k=>typeof k==="number"||/^[ag]\d+$/.test(k);
    const nTem=p.temy.filter(x=>isT(x[0])).length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"){ html+=`<li class="check">✔ ${name}</li>`; return; }
      if(k==="chvert1"){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : (/^[ag]\d+$/.test(k) ? k.slice(1) : "↺");
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
</body>
</html>
