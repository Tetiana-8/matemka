<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Флеш-картки. Геометрія 7 клас + Чотирикутники (8 клас)</title>
<style>
:root{
  --ink:#2e3a38; --muted:#86918d; --line:#e6ebe7; --paper:#ffffff;
  --sage:#5a9a84; --sage-d:#3f7d68; --sage-l:#eaf4ef;
  --ok:#3f8f6b; --okbg:#eaf6ef; --bad:#c1655d; --badbg:#fcefed;
  --amber:#b7791f; --amberbg:#fdf3e1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
@property --dot{syntax:'<color>';inherits:true;initial-value:#8ec5b0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);
  background-color:#f6ecdd;
  background-image:radial-gradient(circle at center,var(--dot) 1.8px,transparent 2.3px),
    linear-gradient(125deg,#fbe5cf,#e0f0e6,#e4e2f6,#fde0da,#fbe5cf);
  background-size:26px 26px,400% 400%;
  animation:drift 32s ease-in-out infinite,dotc 18s linear infinite;}
@keyframes drift{0%{background-position:0 0,0% 50%}50%{background-position:13px 13px,100% 50%}100%{background-position:0 0,0% 50%}}
@keyframes dotc{0%,100%{--dot:#86c2ad}25%{--dot:#f0a190}50%{--dot:#efbf5e}75%{--dot:#a39bdc}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:max(.6rem,env(safe-area-inset-top)) .8rem max(.6rem,env(safe-area-inset-bottom));gap:.5rem}
.hd{flex:0 0 auto;text-align:center;line-height:1.25;align-self:center;background:rgba(255,255,255,.62);border-radius:1rem;padding:.3rem .9rem;backdrop-filter:blur(3px)}
.t1{font-size:.8rem;font-weight:700;color:#5d6b66;letter-spacing:.01em}
.t2{font-size:.68rem;color:var(--muted)}
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cw{width:100%;max-width:62rem;height:100%;will-change:transform}
.cw.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(var(--from,40px)) scale(.97)}to{opacity:1;transform:none}}
.card{width:100%;height:100%;perspective:1800px;cursor:pointer}
.card.mc{cursor:default}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:1.5rem;padding:.9rem 1.2rem 1rem;display:flex;flex-direction:column;background:var(--paper);
  box-shadow:0 10px 30px rgba(70,90,80,.13),0 1px 3px rgba(70,90,80,.08)}
.face.back{transform:rotateY(180deg)}
.face.back.ok{background:linear-gradient(#fff,var(--okbg))}
.face.back.bad{background:linear-gradient(#fff,var(--badbg))}
.topic{font-size:.7rem;color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5rem;min-height:0}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:24rem;height:auto;max-height:31vh}
.back .fig svg{max-height:22vh}
.q{font-size:1.45rem;line-height:1.35;font-weight:600;margin:.1rem 0;text-align:center}
.mc .q{font-size:1.3rem}
.verdict{font-size:2.1rem;font-weight:800;text-align:center;margin:0}
.back.ok .verdict{color:var(--ok)} .back.bad .verdict{color:var(--bad)}
.qsmall{font-size:.9rem;color:var(--muted);text-align:center;margin:0 0 .3rem}
.expl{font-size:1.15rem;line-height:1.4;text-align:center;margin:0}
.opts{list-style:none;margin:.2rem 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:.5rem}
.opts.short{grid-template-columns:1fr 1fr}
.opt{width:100%;display:flex;align-items:center;gap:.6rem;text-align:left;border:1.5px solid var(--line);background:#fff;
  border-radius:1rem;padding:.5rem .75rem;font-size:1.1rem;font-weight:600;transition:background .2s,border-color .2s}
.opt:hover{background:#f6faf8;border-color:#cfe0d8}
.opt .L{flex:0 0 auto;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--sage-l);color:var(--sage-d);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.opt.correct{background:var(--okbg);border-color:#7cbf9f} .opt.correct .L{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:#e0958e} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.card.done .opt{pointer-events:none}
.explain{margin-top:.2rem;border-radius:1rem;padding:.5rem .8rem;font-size:1rem;line-height:1.4;visibility:hidden;background:var(--amberbg)}
.explain b{display:block;margin-bottom:.1rem}
.card.done .explain{visibility:visible}
.explain.ok{background:var(--okbg)} .explain.bad{background:var(--badbg)}
.ft{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.25rem}
#nextBtn{width:3rem;height:3rem;border-radius:50%;background:#fff;color:var(--sage-d);font-size:1.7rem;line-height:1;box-shadow:0 3px 10px rgba(70,90,80,.18);display:flex;align-items:center;justify-content:center;padding-bottom:.15rem}
#nextBtn:active{transform:scale(.94)}
.hintline{font-size:.7rem;color:#6f7b77;background:rgba(255,255,255,.62);border-radius:1rem;padding:.1rem .7rem}
@media (min-aspect-ratio:3/2) and (min-width:700px){
  .mid.hasfig{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;column-gap:1.5rem}
  .mid.hasfig .fig svg{max-height:52vh;max-width:none}
  .back .mid.hasfig .fig svg{max-height:44vh}
}
</style>
</head>
<body>
<div id="app">
  <header class="hd"><div class="t1">Геометрія 7 клас + Чотирикутники 8 клас</div><div class="t2">Автор розробки: Ковтун Тетяна</div></header>
  <main class="stage" id="stage"><div class="cw" id="cw"></div></main>
  <footer class="ft"><button id="nextBtn" aria-label="Далі">›</button><div class="hintline">торкнись — відповідь · гортай — далі</div></footer>
</div>

<script>
var TOPICS=[
 {id:'a7',g:7,name:'Кути й паралельні прямі'},
 {id:'t7',g:7,name:'Трикутники'},
 {id:'c7',g:7,name:'Коло'},
 {id:'q8',g:8,name:'Чотирикутник і його елементи'},
 {id:'p8',g:8,name:'Паралелограм'},
 {id:'r8',g:8,name:'Прямокутник'},
 {id:'h8',g:8,name:'Ромб'},
 {id:'s8',g:8,name:'Квадрат'},
 {id:'x8',g:8,name:'Хто є хто (зв’язки між фігурами)'},
 {id:'m8',g:8,name:'Середня лінія трикутника'},
 {id:'z8',g:8,name:'Трапеція'},
 {id:'v8',g:8,name:'Вписані й описані чотирикутники'}
];
var CARDS=[];
function TF(t,q,a,e){CARDS.push({k:'tf',t:t,q:q,a:!!a,e:e});}
function MC(t,q,c,w,e){CARDS.push({k:'mc',t:t,q:q,c:c,w:w,e:e});}

/* ---- 7 клас: кути й паралельні прямі ---- */
TF('a7','Суміжні кути в сумі дають 180°.',1,'Суміжні кути мають спільну сторону, а дві інші сторони — доповняльні промені. Разом вони утворюють розгорнутий кут 180°.');
TF('a7','Вертикальні кути в сумі дають 180°.',0,'Вертикальні кути рівні між собою. А в сумі 180° дають суміжні кути.');
TF('a7','Бісектриса кута ділить його на два рівні кути.',1,'Це означення бісектриси кута.');
TF('a7','Через точку, що не лежить на даній прямій, можна провести дві різні прямі, паралельні даній.',0,'Аксіома паралельності: через точку поза прямою проходить лише одна пряма, паралельна даній.');
TF('a7','Якщо при перетині двох прямих січною відповідні кути рівні, то прямі паралельні.',1,'Це ознака паралельності прямих. Так само працюють рівні внутрішні різносторонні кути або сума внутрішніх односторонніх, що дорівнює 180°.');
TF('a7','Якщо дві паралельні прямі перетнуто січною, то внутрішні односторонні кути рівні.',0,'Внутрішні односторонні кути в сумі дають 180°. Рівними є відповідні та внутрішні різносторонні кути.');
TF('a7','Кут 100° є гострим.',0,'Гострий кут менший від 90°. Кут 100° — тупий (між 90° і 180°).');
TF('a7','Дві прямі на площині, перпендикулярні до третьої прямої, паралельні між собою.',1,'Обидві утворюють з третьою прямою кути по 90°. Відповідні кути рівні, тому прямі паралельні.');
TF('a7','Внутрішні різносторонні кути при паралельних прямих і січній рівні.',1,'Це властивість паралельних прямих (обернена до ознаки паралельності).');
TF('a7','Два суміжні кути можуть бути обидва гострими.',0,'Якби обидва були менші від 90°, їхня сума була б менша від 180°. А сума суміжних кутів завжди дорівнює 180°.');
MC('a7','Один із суміжних кутів дорівнює 65°. Чому дорівнює другий?','115°',['25°','65°','125°'],'Сума суміжних кутів 180°: 180° − 65° = 115°.');
MC('a7','Паралельні прямі перетнуто січною. Один із внутрішніх односторонніх кутів дорівнює 70°. Чому дорівнює другий?','110°',['70°','20°','90°'],'Внутрішні односторонні кути в сумі дають 180°: 180° − 70° = 110°.');
MC('a7','Кут дорівнює 38°. Чому дорівнює вертикальний до нього?','38°',['142°','52°','90°'],'Вертикальні кути рівні. (142° — це кут, суміжний із даним.)');
MC('a7','Бісектриса ділить кут 84° на два кути. Чому дорівнює кожен із них?','42°',['84°','168°','21°'],'Бісектриса ділить кут навпіл: 84° : 2 = 42°.');

/* ---- 7 клас: трикутники ---- */
TF('t7','Сума кутів трикутника дорівнює 180°.',1,'Це теорема про суму кутів трикутника.');
TF('t7','Зовнішній кут трикутника дорівнює сумі двох внутрішніх кутів, не суміжних з ним.',1,'Зовнішній кут = 180° − суміжний внутрішній, а це й є сума двох інших внутрішніх кутів.');
TF('t7','У рівнобедреному трикутнику кути при основі рівні.',1,'Це властивість рівнобедреного трикутника.');
TF('t7','Існує трикутник зі сторонами 3 см, 4 см і 8 см.',0,'Нерівність трикутника: кожна сторона менша за суму двох інших. Але 3 + 4 = 7 < 8, тому такого трикутника не існує.');
TF('t7','У прямокутному трикутнику катет, що лежить проти кута 30°, дорівнює половині гіпотенузи.',1,'Це властивість прямокутного трикутника з кутом 30°. Обернене теж правильне.');
TF('t7','У рівнобедреному трикутнику медіана, проведена до основи, є також висотою і бісектрисою.',1,'Це властивість рівнобедреного трикутника.');
TF('t7','Якщо три кути одного трикутника дорівнюють трьом кутам іншого, то ці трикутники рівні.',0,'Рівні кути ще не гарантують рівних розмірів — такі трикутники лише подібні (це буде в 8 класі). Для рівності потрібні сторони: за трьома сторонами, за двома сторонами й кутом між ними, за стороною та двома прилеглими кутами.');
TF('t7','Трикутники рівні, якщо сторона й два прилеглі до неї кути одного дорівнюють стороні й двом прилеглим кутам іншого.',1,'Це друга ознака рівності трикутників (за стороною та двома прилеглими кутами).');
TF('t7','У трикутнику можуть бути два тупі кути.',0,'Два тупі кути дали б суму понад 180°, а сума всіх кутів трикутника дорівнює 180°.');
TF('t7','Гіпотенуза — найбільша сторона прямокутного трикутника.',1,'Вона лежить проти найбільшого кута 90°, а проти більшого кута лежить більша сторона.');
TF('t7','Висота трикутника — це відрізок, що сполучає вершину із серединою протилежної сторони.',0,'Це медіана. Висота — перпендикуляр, проведений із вершини до прямої, що містить протилежну сторону.');
TF('t7','Усі кути рівностороннього трикутника дорівнюють 60°.',1,'Кути рівні й дають у сумі 180°: 180° : 3 = 60°.');
MC('t7','Два кути трикутника дорівнюють 50° і 60°. Чому дорівнює третій кут?','70°',['80°','110°','130°'],'180° − (50° + 60°) = 70°.');
MC('t7','Зовнішній кут трикутника дорівнює 120°. Один із внутрішніх кутів, не суміжних з ним, дорівнює 45°. Чому дорівнює другий такий кут?','75°',['165°','60°','15°'],'Зовнішній кут дорівнює сумі двох не суміжних з ним внутрішніх: 120° − 45° = 75°.');
MC('t7','У рівнобедреному трикутнику кут при вершині дорівнює 40°. Чому дорівнює кут при основі?','70°',['40°','140°','80°'],'(180° − 40°) : 2 = 70°.');
MC('t7','Як називається відрізок, що сполучає вершину трикутника із серединою протилежної сторони?','Медіана',['Бісектриса','Висота','Середня лінія'],'Це означення медіани. Середня лінія сполучає середини двох сторін.');
MC('t7','Гіпотенуза прямокутного трикутника дорівнює 14 см, один з гострих кутів — 30°. Чому дорівнює катет, що лежить проти цього кута?','7 см',['28 см','14 см','10 см'],'Катет проти кута 30° дорівнює половині гіпотенузи: 14 : 2 = 7 (см).');
MC('t7','Які три відрізки можуть бути сторонами трикутника?','3 см, 4 см, 5 см',['2 см, 3 см, 6 см','1 см, 2 см, 3 см','5 см, 5 см, 11 см'],'Найбільша сторона має бути меншою від суми двох інших. Лише 3 + 4 > 5. У варіанті 1, 2, 3 сума дорівнює третій стороні (трикутника не буде).');
MC('t7','Що НЕ є ознакою рівності трикутників?','За трьома кутами',['За трьома сторонами','За стороною і двома прилеглими кутами','За двома сторонами і кутом між ними'],'Рівність трьох кутів дає лише подібність трикутників, а не рівність.');

/* ---- 7 клас: коло ---- */
TF('c7','Діаметр — найбільша з хорд кола.',1,'Діаметр — хорда, що проходить через центр. Будь-яка інша хорда коротша.');
TF('c7','Дотична до кола перпендикулярна до радіуса, проведеного в точку дотику.',1,'Це властивість дотичної.');
TF('c7','Радіус кола вдвічі більший за його діаметр.',0,'Навпаки: діаметр удвічі більший за радіус, d = 2r.');
TF('c7','Центр кола, описаного навколо трикутника, — це точка перетину серединних перпендикулярів до його сторін.',1,'Кожна точка серединного перпендикуляра рівновіддалена від кінців відрізка — тож точка перетину рівновіддалена від усіх вершин.');
TF('c7','Центр кола, вписаного в трикутник, — це точка перетину його медіан.',0,'Центр вписаного кола — точка перетину бісектрис трикутника.');
TF('c7','Кожна точка серединного перпендикуляра до відрізка рівновіддалена від кінців цього відрізка.',1,'Це властивість серединного перпендикуляра.');
MC('c7','Радіус кола дорівнює 6 см. Чому дорівнює його діаметр?','12 см',['3 см','6 см','36 см'],'d = 2r = 2 · 6 = 12 (см).');
MC('c7','Центр кола, описаного навколо трикутника, лежить на перетині…','серединних перпендикулярів до сторін',['бісектрис','медіан','висот'],'Центр описаного кола рівновіддалений від вершин, тому лежить на серединних перпендикулярах до сторін.');
MC('c7','Центр кола, вписаного в трикутник, лежить на перетині…','бісектрис',['серединних перпендикулярів','медіан','середніх ліній'],'Центр вписаного кола рівновіддалений від сторін, тому лежить на бісектрисах кутів.');
MC('c7','Який кут утворюють дотична до кола і радіус, проведений у точку дотику?','90°',['45°','60°','180°'],'Дотична перпендикулярна до радіуса, проведеного в точку дотику.');

/* ---- 8 клас: чотирикутник ---- */
TF('q8','Сума кутів опуклого чотирикутника дорівнює 360°.',1,'Діагональ ділить чотирикутник на два трикутники, у кожному по 180°: 2 · 180° = 360°.');
TF('q8','Діагональ чотирикутника — це відрізок, що сполучає дві сусідні вершини.',0,'Це сторона. Діагональ сполучає дві несусідні (протилежні) вершини.');
TF('q8','Чотирикутник має чотири діагоналі.',0,'Лише дві: у чотирикутнику ABCD це AC і BD.');
TF('q8','Периметр чотирикутника — це сума довжин усіх його сторін.',1,'Периметр — сума довжин усіх сторін многокутника.');
TF('q8','У чотирикутнику ABCD вершини A і B є протилежними.',0,'A і B — сусідні. Протилежні вершини: A і C, B і D.');
TF('q8','Чотирикутник може мати чотири гострі кути.',0,'Чотири гострі кути дали б суму менше ніж 4 · 90° = 360°, а сума кутів чотирикутника дорівнює 360°.');
MC('q8','Чому дорівнює сума кутів опуклого чотирикутника?','360°',['180°','270°','540°'],'Діагональ ділить чотирикутник на два трикутники: 2 · 180° = 360°.');
MC('q8','Три кути чотирикутника дорівнюють 80°, 100° і 120°. Чому дорівнює четвертий кут?','60°',['80°','40°','120°'],'360° − (80° + 100° + 120°) = 360° − 300° = 60°.');
MC('q8','Скільки діагоналей має чотирикутник?','2',['1','3','4'],'Дві діагоналі: наприклад, AC і BD в чотирикутнику ABCD.');

/* ===================== ГЕНЕРАТОР ЗАДАЧ З РИСУНКАМИ ===================== */
var SL='#5d6b66', FILL='#e7f1ec', GIV='#b7791f', QST='#c1655d';
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function rad(d){return d*Math.PI/180}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function svgWrap(s){return '<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Рисунок">'+s+'</svg>'}
function fitter(pts,circ){
  var mx=1e9,my=1e9,Mx=-1e9,My=-1e9;
  pts.forEach(function(p){mx=Math.min(mx,p[0]);Mx=Math.max(Mx,p[0]);my=Math.min(my,p[1]);My=Math.max(My,p[1])});
  if(circ){mx=Math.min(mx,circ[0]-circ[2]);Mx=Math.max(Mx,circ[0]+circ[2]);my=Math.min(my,circ[1]-circ[2]);My=Math.max(My,circ[1]+circ[2])}
  var pad=40,s=Math.min((300-2*pad)/((Mx-mx)||1),(190-2*pad+14)/((My-my)||1));
  var ox=(300-s*(Mx-mx))/2-s*mx, oy=(190-s*(My-my))/2-s*my;
  return {s:s,f:function(p){return [p[0]*s+ox,p[1]*s+oy]}};
}
function cen(P){var x=0,y=0;P.forEach(function(p){x+=p[0];y+=p[1]});return [x/P.length,y/P.length]}
function unitv(a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [dx/l,dy/l]}
function pstr(P){return P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
function poly(P,fill){return '<polygon points="'+pstr(P)+'" fill="'+(fill||FILL)+'" stroke="'+SL+'" stroke-width="2.4" stroke-linejoin="round"/>'}
function seg(a,b,col,dash){return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+(col||SL)+'" stroke-width="2.2" stroke-linecap="round"'+(dash?' stroke-dasharray="6 5"':'')+'/>'}
function txt(p,t,col,size,w){return '<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="'+(size||16)+'" font-weight="'+(w||700)+'" fill="'+(col||SL)+'" font-family="Segoe UI,Arial,sans-serif">'+t+'</text>'}
function dot(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+SL+'"/>'}
function vlab(p,c,t){var u=unitv(c,p);return txt([p[0]+u[0]*15,p[1]+u[1]*15],t,SL,17,700)}
function slab(a,b,c,t,col,f){f=f||.5;var m=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],e=unitv(a,b),n=[-e[1],e[0]],o=unitv(c,m);if(n[0]*o[0]+n[1]*o[1]<0)n=[-n[0],-n[1]];var w=t.length*4.2+8;return txt([m[0]+n[0]*(10+Math.abs(n[0])*w),m[1]+n[1]*(12+Math.abs(n[0])*4)],t,col||GIV,15,700)}
function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2]}
function angOf(P,Q){var t=Math.atan2(-(Q[1]-P[1]),Q[0]-P[0])*180/Math.PI;return (t+360)%360}
function arcT(P,t1,d,r,col,label){
  var a=[P[0]+r*Math.cos(rad(t1)),P[1]-r*Math.sin(rad(t1))], b=[P[0]+r*Math.cos(rad(t1+d)),P[1]-r*Math.sin(rad(t1+d))];
  var tm=t1+d/2, rl=r+(d<45?25:d<80?19:15);
  var s='<path d="M'+P[0].toFixed(1)+','+P[1].toFixed(1)+' L'+a[0].toFixed(1)+','+a[1].toFixed(1)+' A'+r+','+r+' 0 0 0 '+b[0].toFixed(1)+','+b[1].toFixed(1)+' Z" fill="'+col+'" fill-opacity=".22" stroke="'+col+'" stroke-width="2"/>';
  if(label!=null) s+=txt([P[0]+rl*Math.cos(rad(tm)),P[1]-rl*Math.sin(rad(tm))],label,col,15,800);
  return s;
}
function arcP(P,Q1,Q2,r,col,label){
  var t1=angOf(P,Q1),t2=angOf(P,Q2),d=((t2-t1)%360+360)%360;
  if(d>180){var tmp=t1;t1=t2;t2=tmp;d=360-d}
  return arcT(P,t1,d,r,col,label);
}
function given(P,Q1,Q2,v,r){return arcP(P,Q1,Q2,r||22,GIV,v+'°')}
function quest(P,Q1,Q2,r){return arcP(P,Q1,Q2,r||22,QST,'?')}

/* значення з варіантами відповідей */
function wrongs(g,n){
  var v=g.v, ang=g.unit==='°', c=[];
  if(ang) c=[180-v,90-v,v+10,v-10,v+20,v-20,2*v,v/2,v+5,v-5,v+15,v-15,v+30,v-30,360-v];
  else c=[v+1,v-1,v+2,v-2,2*v,v/2,v+3,v-3,v+4,v-4,v*2+1,v+5,v-5];
  var seen={},out=[];
  function ok(x){return x===Math.round(x)&&x>0&&x!==v&&!seen[x]&&(!ang||x<=180)}
  (g.wrong||[]).concat(shuffle(c)).forEach(function(x){if(out.length<n&&ok(x)){seen[x]=1;out.push(x)}});
  return out;
}

/* ---- генератори: повертають {id,t,stem,lbl,v,unit,expl,svg,wrong} ---- */
var PV=[40,45,50,55,60,65,70,75,80,100,105,110,115,120,125,130,135,140];
function paraPts(a,L){var H=100,dx=H/Math.tan(rad(a));return [[0,H],[dx,0],[L+dx,0],[L,H]]}

function gParaAngle(){
  var a=pick(PV), nm=['A','B','C','D'], val=[a,180-a,a,180-a], gi=R(0,3), ti; do{ti=R(0,3)}while(ti===gi);
  var P=paraPts(a,170), ft=fitter(P), Q=P.map(ft.f), c=cen(Q), s=poly(Q);
  nm.forEach(function(n,i){s+=vlab(Q[i],c,n)});
  s+=given(Q[gi],Q[(gi+3)%4],Q[(gi+1)%4],val[gi])+quest(Q[ti],Q[(ti+3)%4],Q[(ti+1)%4]);
  var eq=((gi-ti)%2===0);
  return {id:'pa'+a+gi+ti,t:'p8',stem:'У паралелограмі ABCD ∠'+nm[gi]+' = '+val[gi]+'°.',lbl:'∠'+nm[ti],v:val[ti],unit:'°',
    expl:eq?'Протилежні кути паралелограма рівні.':'Сусідні кути паралелограма в сумі дають 180°: 180° − '+val[gi]+'° = '+val[ti]+'°.',svg:svgWrap(s),wrong:eq?[180-val[ti],90-val[ti]]:[val[gi],90-val[ti]]};
}
function gParaSum(){
  var a=pick(PV), S=2*a, P=paraPts(65,170), ft=fitter(P), Q=P.map(ft.f), c=cen(Q), s=poly(Q);
  ['A','B','C','D'].forEach(function(n,i){s+=vlab(Q[i],c,n)});
  return {id:'ps'+S,t:'p8',stem:'У паралелограмі ABCD ∠A + ∠C = '+S+'°.',lbl:'∠B',v:180-a,unit:'°',
    expl:'Протилежні кути рівні: ∠A = ∠C = '+S+'° : 2 = '+a+'°. Сусідні кути в сумі 180°: ∠B = 180° − '+a+'° = '+(180-a)+'°.',svg:svgWrap(s),wrong:[a,S,180-S>0?180-S:a+10]};
}
function gParaPerim(){
  var a=R(3,12),b=R(4,14); if(a===b)b++;
  var P=paraPts(65,170), ft=fitter(P), Q=P.map(ft.f), c=cen(Q), s=poly(Q);
  ['A','B','C','D'].forEach(function(n,i){s+=vlab(Q[i],c,n)});
  var tot=2*(a+b);
  if(Math.random()<.6){
    s+=slab(Q[0],Q[1],c,a+' см')+slab(Q[0],Q[3],c,b+' см');
    return {id:'pp'+a+'_'+b,t:'p8',stem:'У паралелограмі ABCD AB = '+a+' см, AD = '+b+' см.',lbl:'периметр паралелограма',v:tot,unit:' см',
      expl:'Протилежні сторони рівні: P = 2 · ('+a+' + '+b+') = '+tot+' см.',svg:svgWrap(s),wrong:[a+b,2*a+b,a+2*b]};
  }
  s+=slab(Q[0],Q[1],c,a+' см');
  return {id:'pq'+a+'_'+b,t:'p8',stem:'Периметр паралелограма ABCD дорівнює '+tot+' см, AB = '+a+' см.',lbl:'сторона AD',v:b,unit:' см',
    expl:'Півпериметр: '+tot+' : 2 = '+(a+b)+' см. Тоді AD = '+(a+b)+' − '+a+' = '+b+' см.',svg:svgWrap(s),wrong:[tot-a,a+b,tot/2+a]};

/* ===================== КАРТКА ===================== */
var $=function(id){return document.getElementById(id)};
var topicById={}; TOPICS.forEach(function(t){topicById[t.id]=t});
var cur=null, busy=false;
function tagHtml(c){var t=topicById[c.t];return '<div class="topic">'+(t?t.g+' клас · '+esc(t.name):'')+'</div>'}
function render(c){
  cur=c; var L=['А','Б','В','Г'], h, fig=c.fig?'<div class="fig">'+c.fig+'</div>':'', hf=c.fig?' hasfig':'';
  if(c.k==='tf'){
    h='<div class="card tf" id="card"><div class="inner">'+
      '<section class="face front">'+tagHtml(c)+'<div class="mid'+hf+'">'+fig+'<div class="txt"><p class="q">'+esc(c.q)+'</p></div></div></section>'+
      '<section class="face back '+(c.a?'ok':'bad')+'">'+tagHtml(c)+'<div class="mid'+hf+'">'+fig+'<div class="txt"><p class="qsmall">'+esc(c.q)+'</p><div class="verdict">'+(c.a?'✓ ПРАВДА':'✗ НЕПРАВДА')+'</div><p class="expl">'+esc(c.e)+'</p></div></div></section>'+
      '</div></div>';
  } else {
    if(!c.opts)c.opts=shuffle([c.c].concat(c.w));
    var shortOpts=c.opts.every(function(o){return o.length<=12});
    h='<div class="card mc" id="card"><div class="inner"><section class="face front">'+tagHtml(c)+'<div class="mid'+hf+'">'+fig+'<div class="txt">'+
      '<p class="q">'+esc(c.q)+'</p><ul class="opts'+(shortOpts?' short':'')+'">'+
      c.opts.map(function(o,i){return '<li><button class="opt" data-i="'+i+'"><span class="L">'+L[i]+'</span><span>'+esc(o)+'</span></button></li>'}).join('')+
      '</ul><div class="explain" id="explain"><b>&nbsp;</b>'+esc(c.e)+'</div></div></div></section></div></div>';
  }
  $('cw').innerHTML=h;
  var card=$('card');
  if(c.k==='tf'){card.addEventListener('click',function(){if(moved)return;card.classList.toggle('flipped')})}
  else{card.addEventListener('click',function(e){if(moved)return;var b=e.target.closest('.opt');if(b&&!card.classList.contains('done'))answer(+b.dataset.i)})}
  fit();
}
function answer(i){
  var c=cur,card=$('card'); card.classList.add('done'); var ok=c.opts[i]===c.c;
  [].forEach.call(card.querySelectorAll('.opt'),function(b,k){
    if(c.opts[k]===c.c)b.classList.add('correct'); else if(k===i)b.classList.add('wrong'); else b.classList.add('dim');
  });
  var ex=$('explain'); ex.className='explain '+(ok?'ok':'bad');
  ex.innerHTML='<b>'+(ok?'✓ Правильно!':'✗ Правильна відповідь: '+esc(c.c))+'</b>'+esc(c.e);
}

/* ---------- гортання ---------- */
var cw=$('cw'),sx=0,sy=0,dx=0,drag=false,moved=false,t0=0,lock=null;
function nextCard(dir){
  if(busy)return; busy=true; dir=dir||-1;
  cw.style.transition='transform .26s ease, opacity .26s ease';
  cw.style.transform='translateX('+(dir*window.innerWidth*1.1)+'px) rotate('+(dir*14)+'deg)'; cw.style.opacity='0';
  setTimeout(function(){
    cw.style.transition='none'; cw.style.transform=''; cw.style.opacity='';
    cw.style.setProperty('--from',(-dir*50)+'px');
    render(nextCardData());
    cw.classList.remove('enter'); void cw.offsetWidth; cw.classList.add('enter');
    busy=false;
  },260);
}
$('nextBtn').addEventListener('click',function(){nextCard(-1)});
$('stage').addEventListener('pointerdown',function(e){if(busy)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;t0=Date.now();lock=null});
window.addEventListener('pointermove',function(e){
  if(!drag||busy)return; var ax=e.clientX-sx, ay=e.clientY-sy;
  if(lock===null&&(Math.abs(ax)>8||Math.abs(ay)>8))lock=Math.abs(ax)>Math.abs(ay)?'x':'y';
  if(lock==='x'){moved=true;dx=ax;cw.style.transition='none';cw.style.transform='translateX('+dx+'px) rotate('+(dx/40)+'deg)';cw.style.opacity=String(1-Math.min(.45,Math.abs(dx)/(window.innerWidth*1.3)))}
});
function endDrag(){
  if(!drag)return; drag=false;
  if(lock==='x'){
    var v=Math.abs(dx)/(Date.now()-t0+1);
    if(Math.abs(dx)>80||(v>.5&&Math.abs(dx)>35)){busy=false;nextCard(dx>0?1:-1)}
    else{cw.style.transition='transform .2s ease, opacity .2s';cw.style.transform='';cw.style.opacity=''}
  }
  setTimeout(function(){moved=false},0);
}
window.addEventListener('pointerup',endDrag); window.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
  var card=$('card'); if(!card)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();nextCard(e.key==='ArrowRight'?1:-1)}
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur.k==='tf')card.classList.toggle('flipped')}
  else if(cur.k==='mc'&&/^[1-4]$/.test(e.key)&&!card.classList.contains('done'))answer(+e.key-1);
});

/* ---------- автопідлаштування розміру тексту ---------- */
function setFs(px){document.documentElement.style.fontSize=px+'px'}
function fit(){
  var base=Math.max(16,Math.min(34,Math.min(window.innerWidth*0.022,window.innerHeight*0.045)));
  setFs(base);
  var fs=base,n=0;
  function over(){return [].some.call(document.querySelectorAll('.face'),function(f){return f.scrollHeight>f.clientHeight+1||f.scrollWidth>f.clientWidth+1})}
  while(n<70&&fs>11&&over()){fs-=0.5;setFs(fs);n++}
}
window.addEventListener('resize',fit);
render(nextCardData());
</script>
</body>
</html>
