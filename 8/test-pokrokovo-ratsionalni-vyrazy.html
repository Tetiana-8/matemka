<body>
<button id="key" title="">🔑</button>
<div id="app"></div>
<div id="kb"><div class="row" id="kbrow"></div></div>
<footer>Автор розробки <b>Ковтун Тетяна</b></footer>

<script>
(function(){ "use strict";
/* ===== ЛОГІКА (без DOM): многочлени, розбір виразів, перевірка кроків, генератор ===== */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkR(seed){const r=mulberry32(seed);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const pick=a=>a[Math.floor(r()*a.length)];
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  return {r,ri,pick,shuf};}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a}
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const fmt=n=>String(n).replace('.',',');
const round1=x=>Math.round(x*10)/10;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* --- многочлени від кількох змінних: {ключ: коефіцієнт}, ключ типу "a2b1" --- */
function pKey(e){return Object.keys(e).filter(k=>e[k]>0).sort().map(k=>k+e[k]).join('')}
function pDec(key){const e={};key.replace(/([a-z])(\d+)/g,(m,a,n)=>{e[a]=+n;return m});return e}
function pClean(p){const o={};for(const k in p){if(p[k]!==0)o[k]=p[k]}return o}
function pAdd(a,b){const o=Object.assign({},a);for(const k in b){o[k]=(o[k]||0)+b[k]}return pClean(o)}
function pNeg(a){const o={};for(const k in a)o[k]=-a[k];return o}
function pMul(a,b){const o={};for(const ka in a){const ea=pDec(ka);for(const kb in b){const e=Object.assign({},ea);const eb=pDec(kb);for(const x in eb)e[x]=(e[x]||0)+eb[x];const k=pKey(e);o[k]=(o[k]||0)+a[ka]*b[kb]}}return pClean(o)}
function pPow(a,n){let r={'':1};for(let i=0;i<n;i++)r=pMul(r,a);return r}
function pConst(c){return c===0?{}:{'':c}}
function pVar(v){const o={};o[v+'1']=1;return o}
function pZero(a){return Object.keys(a).length===0}
function pEq(a,b){return pZero(pAdd(a,pNeg(b)))}
function pDeg(a){let d=0;for(const k in a){const e=pDec(k);let s=0;for(const x in e)s+=e[x];if(s>d)d=s}return d}
function pContent(a){let g=0;for(const k in a)g=gcd(g,a[k]);return g}
function pEval(a,vals){let s=0;for(const k in a){const e=pDec(k);let t=a[k];for(const x in e)t*=Math.pow(vals[x],e[x]);s+=t}return s}

/* --- розбір виразу --- */
const LOOK={'а':'a','с':'c','х':'x','у':'y','м':'m','к':'k','р':'p','е':'e','о':'o'};
function cleanInput(raw,vars){
  let o='';
  for(const ch0 of String(raw)){
    let ch=ch0;
    if(/\s/.test(ch))continue;
    ch=ch.toLowerCase();
    if(LOOK[ch]&&vars.indexOf(LOOK[ch])>=0)ch=LOOK[ch];
    if(ch==='-'||ch==='–'||ch==='—')ch='−';
    if(ch==='*'||ch==='×'||ch==='•'||ch==='∙')ch='·';
    if(/[0-9]/.test(ch)||vars.indexOf(ch)>=0||'+−·()^²³'.indexOf(ch)>=0)o+=ch;
  }
  return o;
}
function normalizeExpr(s){
  const map={'−':'-','–':'-','—':'-','·':'*','×':'*','•':'*','∙':'*','²':'^2','³':'^3'};
  let o='';for(const ch of String(s)){if(/\s/.test(ch))continue;o+=(map[ch]!==undefined?map[ch]:ch)}return o;
}
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9]/.test(c)){let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;t.push({k:'n',v:parseInt(s.slice(i,j),10)});i=j}
    else if(/[a-z]/.test(c)){t.push({k:'v',v:c});i++}
    else if('+-*^()'.indexOf(c)>=0){t.push({k:c});i++}
    else return null;
  }
  return t;
}
function parseAst(str){
  const s=normalizeExpr(str);if(!s)return null;
  const t=tokenize(s);if(!t)return null;
  let p=0;const peek=()=>t[p],nxt=()=>t[p++];
  function expr(){let a=term();if(!a)return null;
    while(peek()&&(peek().k==='+'||peek().k==='-')){const op=nxt().k;const b=term();if(!b)return null;a={t:op==='+'?'add':'sub',a:a,b:b}}
    return a}
  function term(){let a=unary();if(!a)return null;
    while(peek()){const k=peek().k;
      if(k==='*'){nxt();const b=unary();if(!b)return null;a={t:'mul',a:a,b:b}}
      else if(k==='v'||k==='('){const b=power();if(!b)return null;a={t:'mul',a:a,b:b}}
      else if(k==='n')return null;
      else break}
    return a}
  function unary(){const x=peek();if(!x)return null;
    if(x.k==='-'){nxt();const a=unary();return a?{t:'neg',a:a}:null}
    if(x.k==='+'){nxt();return unary()}
    return power()}
  function power(){let b=atom();if(!b)return null;
    if(peek()&&peek().k==='^'){nxt();const e=peek();if(!e||e.k!=='n'||e.v>6)return null;nxt();b={t:'pow',a:b,n:e.v}}
    return b}
  function atom(){const x=nxt();if(!x)return null;
    if(x.k==='n')return {t:'num',v:x.v};
    if(x.k==='v')return {t:'var',v:x.v};
    if(x.k==='('){const e=expr();if(!e)return null;const c=nxt();if(!c||c.k!==')')return null;return e}
    return null}
  const r=expr();
  if(!r||p!==t.length)return null;
  return r;
}
function astPoly(n){
  switch(n.t){
    case 'num':return pConst(n.v);
    case 'var':return pVar(n.v);
    case 'add':return pAdd(astPoly(n.a),astPoly(n.b));
    case 'sub':return pAdd(astPoly(n.a),pNeg(astPoly(n.b)));
    case 'neg':return pNeg(astPoly(n.a));
    case 'mul':return pMul(astPoly(n.a),astPoly(n.b));
    case 'pow':return pPow(astPoly(n.a),n.n);
  }
  return {};
}
function parsePoly(str){const a=parseAst(str);return a?astPoly(a):null}
function nonConst(n){
  switch(n.t){
    case 'num':return 0;
    case 'var':return 1;
    case 'neg':return nonConst(n.a);
    case 'mul':return nonConst(n.a)+nonConst(n.b);
    case 'pow':return nonConst(n.a)*n.n;
    default:return pDeg(astPoly(n))>=1?1:0;
  }
}
function topIsProduct(n){while(n.t==='neg')n=n.a;return n.t==='mul'||n.t==='pow'}
/* fac: добуток щонайменше двох множників зі змінними; fac1: добуток, де є число і дужка зі змінними */
function isFactored(ast){return topIsProduct(ast)&&nonConst(ast)>=2}
function isFactored1(ast){return topIsProduct(ast)&&nonConst(ast)>=1}

/* --- перевірка клітинок і кроків --- */
function checkCell(str,c){
  const ast=parseAst(str);if(!ast)return false;
  if(!pEq(astPoly(ast),c.p))return false;
  if(c.mode==='fac')return isFactored(ast);
  if(c.mode==='fac1')return isFactored1(ast);
  return true;
}
function checkFrac(ns,ds,en,ed){
  const n=parsePoly(ns),d=parsePoly(ds);
  if(!n||!d||pZero(d)||pZero(n))return false;
  if(!pEq(pMul(n,ed),pMul(en,d)))return false;
  if(pDeg(n)+pDeg(d)>pDeg(en)+pDeg(ed))return false;
  if(gcd(pContent(n),pContent(d))!==1)return false;
  return true;
}
function checkFracStrict(ns,ds,en,ed){
  const n=parsePoly(ns),d=parsePoly(ds);
  if(!n||!d||pZero(d))return false;
  return pEq(n,en)&&pEq(d,ed);
}
function stepFilled(st,a){
  if(a==null)return false;
  if(st.kind==='sel')return typeof a==='number';
  if(st.kind==='ord')return Array.isArray(a)&&st.ord.every((_,k)=>typeof a[k]==='number');
  if(st.kind==='ms')return Array.isArray(a)&&st.items.every((_,k)=>typeof a[k]==='number');
  if(st.kind==='line')return Array.isArray(a)&&st.slots.every((sl,k)=>sl.k==='sel'?typeof a[k]==='number':String(a[k]||'').trim()!=='');
  if(st.kind==='ex')return Array.isArray(a)&&st.cells.every((c,k)=>String(a[k]||'').trim()!=='');
  if(st.kind==='fr')return Array.isArray(a)&&String(a[0]||'').trim()!==''&&String(a[1]||'').trim()!=='';
  return false;
}
function checkStepAns(st,a){
  if(!stepFilled(st,a))return false;
  if(st.kind==='sel')return a===st.ci;
  if(st.kind==='ord')return st.ord.every((c,k)=>a[k]===c);
  if(st.kind==='ms')return st.items.every((it,k)=>a[k]===it.ci);
  if(st.kind==='line')return st.slots.every((sl,k)=>sl.k==='sel'?a[k]===sl.ci:checkCell(a[k],sl.cell));
  if(st.kind==='ex')return st.cells.every((c,k)=>checkCell(a[k],c));
  if(st.kind==='fr')return st.strict?checkFracStrict(a[0],a[1],st.en,st.ed):checkFrac(a[0],a[1],st.en,st.ed);
  return false;
}

/* --- запис виразів (HTML і звичайний текст) --- */
function vi(s){
  s=String(s);let o='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='^'){let j=i+1,e='';while(j<s.length&&/[0-9]/.test(s[j])){e+=s[j];j++}o+='<sup>'+e+'</sup>';i=j-1}
    else if(/[a-z]/.test(c))o+='<i>'+c+'</i>';
    else if(c==='-')o+='−';
    else if(c==='*')o+='·';
    else o+=c;
  }
  return o;
}
function tx(s){return String(s).replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/-/g,'−').replace(/\*/g,'·')}
function wrapT(s){return /[+\-]/.test(s)?'('+tx(s)+')':tx(s)}
function ft(n,d){return wrapT(n)+'/'+wrapT(d)}
const OP=t=>'<span class="op">'+t+'</span>';
const BR=t=>'<span class="br">'+t+'</span>';
const FR=(n,d)=>'<span class="fr"><span class="n">'+vi(n)+'</span><span class="d">'+vi(d)+'</span></span>';
const cf=(k,s)=>k===1?s:String(k)+s;

/* --- конструктори кроків --- */
const ACT=['Звести дроби до спільного знаменника','Замінити ділення множенням на обернений дріб','Розкласти чисельник або знаменник на множники','Винести спільний множник за дужки','Застосувати формулу скороченого множення','Скоротити дріб','Звести подібні доданки'];
function sSel(q,opts,ci){return {kind:'sel',q:q,opts:opts,ci:ci}}
function sOrd(R,q,base){const perm=R.shuf([0,1,2]);return {kind:'ord',q:q,opts:perm.map(i=>base[i]),ord:[0,1,2].map(k=>perm.indexOf(k))}}
function sEx(q,cells){cells.forEach(c=>{c.p=parsePoly(c.exp)});return {kind:'ex',q:q,cells:cells}}
function sFr(q,n,d,ref,strict){return {kind:'fr',q:q,n:n,d:d,en:parsePoly(n),ed:parsePoly(d),ref:ref,strict:!!strict}}
const METH=['Формула різниці квадратів','Формула квадрата різниці','Формула квадрата суми','Винесення спільного множника за дужки','Розкласти не можна'];
const SIGN=['залишаємо дію ділення (:)','замінюємо ділення множенням (·)'];
const ftw=(n,d)=>'('+tx(n)+')/('+tx(d)+')';
function sSelR(R,q,opts,ci){const perm=R.shuf(opts.map((_,i)=>i));return {kind:'sel',q:q,opts:perm.map(i=>opts[i]),ci:perm.indexOf(ci)}}
/* рядок розв'язання: готові дроби й знаки + вікна для учня (вибір знака, дроби) */
function sLine(q,parts,ref){
  const slots=[];
  parts.forEach(p=>{
    if(p.t==='sel')slots.push({k:'sel',opts:p.opts,ci:p.ci});
    else if(p.t==='in'){[p.n,p.d].forEach(c=>{c.p=parsePoly(c.exp);slots.push({k:'cell',cell:c})})}
    else if(p.t==='fr'){p.pn=parsePoly(p.n);p.pd=parsePoly(p.d)}
  });
  return {kind:'line',q:q,parts:parts,slots:slots,ref:ref};
}
function lineHTML(st,right){
  return st.parts.map(p=>p.t==='fr'?'<span class="fxfix">'+FR(p.n,p.d)+'</span>':(p.t==='op'?OP(p.v):(p.t==='sel'?OP(p.opts[p.ci]):FR(p.n.exp,p.d.exp)))).join('');
}
function lineText(st){
  return st.parts.map(p=>p.t==='fr'?ft(p.n,p.d):(p.t==='op'?p.v:(p.t==='sel'?p.opts[p.ci]:ft(p.n.exp,p.d.exp)))).join(' ');
}
function sMs(q,items){return {kind:'ms',q:q,items:items}}
function sFx(q,fr,ops,ref){const cells=[];fr.forEach(f=>{cells.push(f.n);cells.push(f.d)});cells.forEach(c=>{c.p=parsePoly(c.exp)});return {kind:'ex',q:q,cells:cells,ops:ops,ref:ref}}
const DIVORD=['виконати дії в дужках','замінити ділення множенням на обернений дріб','скоротити отриманий дріб'];
const PAIRS=[['a','b'],['m','n'],['x','y'],['p','q'],['c','d'],['u','v']];
function dist(n){const b=Math.floor(25/n),rem=25-b*n;return Array.from({length:n},(_,k)=>b+(k>=n-rem?1:0))}
function fin(Q){Q.ws=dist(Q.steps.length);return Q}

/* Завдання 1 (як №1 з фото): (v+m)/(v²−2nv+n²) : (v²−m²)/(kv−kn) − k/(v−m), m=n+1; відповідь −k/(v−n) */
function tA(R,v){
  const n=R.pick([1,2,3]),m=n+1,k=R.pick([2,3,4,5]);
  const d1=v+'^2-'+(2*n)+v+'+'+(n*n),n2=v+'^2-'+(m*m),d2=cf(k,v)+'-'+(k*n),f1n=v+'+'+m;
  const p1='('+v+'-'+n+')',pm='('+v+'-'+m+')',pp='('+v+'+'+m+')';
  const dv=a=>{const x=a[v];return (x+m)/((x-n)*(x-n))/((x*x-m*m)/(k*x-k*n))};
  const orig=a=>dv(a)-k/(a[v]-m);
  return fin({w:25,vars:[v],
    html:FR(f1n,d1)+OP(':')+FR(n2,d2)+OP('−')+FR(String(k),v+'-'+m),
    text:ft(f1n,d1)+' : '+ft(n2,d2)+' − '+ft(String(k),v+'-'+m),
    orig:orig,
    steps:[
      sSelR(R,'Яку дію виконуємо першою?',['ділення','віднімання'],0),
      sLine('Виконуємо ділення. Перший дріб уже записано. Оберіть знак і допишіть другий дріб так, як потрібно.',[
        {t:'fr',n:f1n,d:d1},{t:'sel',opts:[':','·'],ci:1},{t:'in',n:{exp:d2,mode:'eq'},d:{exp:n2,mode:'eq'}}],dv),
      sMs('Чим розкладемо на множники?',[{lab:d1,ci:1},{lab:n2,ci:0},{lab:d2,ci:3}]),
      sLine('Розкладіть чисельники й знаменники на множники прямо в дробах.',[
        {t:'fr',n:f1n,d:d1},{t:'op',v:'·'},{t:'fr',n:d2,d:n2},{t:'op',v:'='},
        {t:'in',n:{exp:f1n,mode:'eq'},d:{exp:p1+'^2',mode:'fac'}},{t:'op',v:'·'},
        {t:'in',n:{exp:k+p1,mode:'fac1'},d:{exp:pm+pp,mode:'fac'}}],dv),
      sFr('Скоротіть дроби. Запишіть результат множення:',String(k),p1+pm,dv),
      sEx('Найменший спільний знаменник дробів, що залишились:',[{exp:p1+pm,mode:'eq'}]),
      sLine('Виконайте віднімання. Запишіть результат одним дробом, розклавши чисельник на множники.',[
        {t:'fr',n:String(k),d:p1+pm},{t:'op',v:'−'},{t:'fr',n:String(k),d:v+'-'+m},{t:'op',v:'='},
        {t:'in',n:{exp:'-'+k+pm,mode:'fac1'},d:{exp:p1+pm,mode:'fac'}}],orig),
      sFr('Скоротіть дріб. Відповідь:','-'+k,v+'-'+n,orig)
    ]});
}
/* Завдання 2 (як №2): (v²+cv)/(v³+c²v) · ((v−c)/(v+c) + (v+c)/(v−c)); відповідь 2/(v−c) */
function tB(R,v){
  const c=R.pick([2,3,4,5]),c2=c*c;
  const num1=v+'^2+'+c+v,den1=v+'^3+'+c2+v,num2=cf(2,v)+'^2+'+(2*c2),den2=v+'^2-'+c2;
  const br=a=>{const x=a[v];return (x-c)/(x+c)+(x+c)/(x-c)};
  const orig=a=>{const x=a[v];return (x*x+c*x)/(x*x*x+c2*x)*br(a)};
  return fin({w:25,vars:[v],
    html:FR(num1,den1)+OP('·')+BR('(')+FR(v+'-'+c,v+'+'+c)+OP('+')+FR(v+'+'+c,v+'-'+c)+BR(')'),
    text:ft(num1,den1)+' · ('+ft(v+'-'+c,v+'+'+c)+' + '+ft(v+'+'+c,v+'-'+c)+')',
    orig:orig,
    steps:[
      sSelR(R,'Яку дію виконуємо першою?',['додавання в дужках','множення'],0),
      sEx('Найменший спільний знаменник дробів у дужках:',[{exp:'('+v+'-'+c+')('+v+'+'+c+')',mode:'eq'}]),
      sLine('Виконайте додавання в дужках. Запишіть результат одним дробом (спростіть чисельник).',[
        {t:'fr',n:v+'-'+c,d:v+'+'+c},{t:'op',v:'+'},{t:'fr',n:v+'+'+c,d:v+'-'+c},{t:'op',v:'='},
        {t:'in',n:{exp:num2,mode:'eq'},d:{exp:den2,mode:'eq'}}],br),
      sMs('Тепер множення двох дробів. Чим розкладемо на множники?',[{lab:num1,ci:3},{lab:den1,ci:3},{lab:num2,ci:3},{lab:den2,ci:0}]),
      sLine('Розкладіть чисельники й знаменники на множники прямо в дробах.',[
        {t:'fr',n:num1,d:den1},{t:'op',v:'·'},{t:'fr',n:num2,d:den2},{t:'op',v:'='},
        {t:'in',n:{exp:v+'('+v+'+'+c+')',mode:'fac'},d:{exp:v+'('+v+'^2+'+c2+')',mode:'fac'}},{t:'op',v:'·'},
        {t:'in',n:{exp:'2('+v+'^2+'+c2+')',mode:'fac1'},d:{exp:'('+v+'-'+c+')('+v+'+'+c+')',mode:'fac'}}],orig),
      sFr('Скоротіть дроби. Відповідь:','2',v+'-'+c,orig)
    ]});
}
/* Завдання 3 (як №3): ((kv+s)/(kv−s) − (kv−s)/(kv+s)) : 2v/(2kv+2s); відповідь 4ks/(kv−s) */
function tC(R,v){
  const ks=R.pick([[2,1],[3,1],[4,1],[5,1],[3,2],[5,2],[2,3],[4,3],[5,3]]),k=ks[0],s=ks[1],kv=cf(k,v);
  const dd=(2*k)+v+'+'+(2*s),big=(k*k)+v+'^2-'+(s*s),bn=cf(4*k*s,v);
  const br=a=>{const x=a[v];return (k*x+s)/(k*x-s)-(k*x-s)/(k*x+s)};
  const orig=a=>{const x=a[v];return br(a)/(2*x/(2*k*x+2*s))};
  const fa='('+kv+'-'+s+')',fb='('+kv+'+'+s+')';
  return fin({w:25,vars:[v],
    html:BR('(')+FR(kv+'+'+s,kv+'-'+s)+OP('−')+FR(kv+'-'+s,kv+'+'+s)+BR(')')+OP(':')+FR('2'+v,dd),
    text:'('+ft(kv+'+'+s,kv+'-'+s)+' − '+ft(kv+'-'+s,kv+'+'+s)+') : '+ft('2'+v,dd),
    orig:orig,
    steps:[
      sSelR(R,'Яку дію виконуємо першою?',['віднімання в дужках','ділення'],0),
      sEx('Найменший спільний знаменник дробів у дужках:',[{exp:fa+fb,mode:'eq'}]),
      sLine('Виконайте віднімання в дужках. Запишіть результат одним дробом (спростіть чисельник).',[
        {t:'fr',n:kv+'+'+s,d:kv+'-'+s},{t:'op',v:'−'},{t:'fr',n:kv+'-'+s,d:kv+'+'+s},{t:'op',v:'='},
        {t:'in',n:{exp:bn,mode:'eq'},d:{exp:big,mode:'eq'}}],br),
      sLine('Тепер ділення. Перший дріб уже записано. Оберіть знак і допишіть другий дріб так, як потрібно.',[
        {t:'fr',n:bn,d:big},{t:'sel',opts:[':','·'],ci:1},{t:'in',n:{exp:dd,mode:'eq'},d:{exp:'2'+v,mode:'eq'}}],orig),
      sMs('Чим розкладемо на множники?',[{lab:big,ci:0},{lab:dd,ci:3}]),
      sLine('Розкладіть чисельники й знаменники на множники прямо в дробах.',[
        {t:'fr',n:bn,d:big},{t:'op',v:'·'},{t:'fr',n:dd,d:'2'+v},{t:'op',v:'='},
        {t:'in',n:{exp:bn,mode:'eq'},d:{exp:fa+fb,mode:'fac'}},{t:'op',v:'·'},
        {t:'in',n:{exp:'2'+fb,mode:'fac1'},d:{exp:'2'+v,mode:'eq'}}],orig),
      sFr('Скоротіть дроби. Відповідь:',String(4*k*s),kv+'-'+s,orig)
    ]});
}
/* Завдання 4 (як №4): (1/(X²−2kXY+k²Y²) − 1/(k²Y²−X²)) : 2X/(X²−k²Y²); відповідь 1/(X−kY) */
function tD(R,xy){
  const X=xy[0],Y=xy[1],k=R.pick([2,3]),kY=cf(k,Y);
  const d1=X+'^2-'+(2*k)+X+Y+'+'+(k*k)+Y+'^2',d2=(k*k)+Y+'^2-'+X+'^2',d3=X+'^2-'+(k*k)+Y+'^2';
  const br=a=>{const x=a[X],y=a[Y];return 1/(x*x-2*k*x*y+k*k*y*y)-1/(k*k*y*y-x*x)};
  const orig=a=>{const x=a[X],y=a[Y];return br(a)/(2*x/(x*x-k*k*y*y))};
  const A1='('+X+'-'+kY+')',A2='('+X+'+'+kY+')',dc=A1+'^2'+A2,B2='('+kY+'-'+X+')('+kY+'+'+X+')';
  return fin({w:25,vars:[X,Y],
    html:BR('(')+FR('1',d1)+OP('−')+FR('1',d2)+BR(')')+OP(':')+FR('2'+X,d3),
    text:'('+ft('1',d1)+' − '+ft('1',d2)+') : '+ft('2'+X,d3),
    orig:orig,
    steps:[
      sSelR(R,'Яку дію виконуємо першою?',['віднімання в дужках','ділення'],0),
      sMs('Чим розкладемо на множники знаменники дробів у дужках?',[{lab:d1,ci:1},{lab:d2,ci:0}]),
      sLine('Розкладіть знаменники на множники прямо в дробах.',[
        {t:'fr',n:'1',d:d1},{t:'op',v:'−'},{t:'fr',n:'1',d:d2},{t:'op',v:'='},
        {t:'in',n:{exp:'1',mode:'eq'},d:{exp:A1+'^2',mode:'fac'}},{t:'op',v:'−'},
        {t:'in',n:{exp:'1',mode:'eq'},d:{exp:B2,mode:'fac'}}],br),
      sEx('Найменший спільний знаменник дробів у дужках:',[{exp:dc,mode:'eq'}]),
      sLine('Виконайте віднімання в дужках. Запишіть результат одним дробом.',[
        {t:'fr',n:'1',d:A1+'^2'},{t:'op',v:'−'},{t:'fr',n:'1',d:B2},{t:'op',v:'='},
        {t:'in',n:{exp:'2'+X,mode:'eq'},d:{exp:dc,mode:'eq'}}],br),
      sLine('Тепер ділення. Перший дріб уже записано. Оберіть знак і допишіть другий дріб так, як потрібно.',[
        {t:'fr',n:'2'+X,d:dc},{t:'sel',opts:[':','·'],ci:1},{t:'in',n:{exp:d3,mode:'eq'},d:{exp:'2'+X,mode:'eq'}}],orig),
      sMs('Чим розкладемо на множники чисельник другого дробу?',[{lab:d3,ci:0}]),
      sLine('Розкладіть чисельники й знаменники на множники прямо в дробах.',[
        {t:'fr',n:'2'+X,d:dc},{t:'op',v:'·'},{t:'fr',n:d3,d:'2'+X},{t:'op',v:'='},
        {t:'in',n:{exp:'2'+X,mode:'eq'},d:{exp:dc,mode:'fac'}},{t:'op',v:'·'},
        {t:'in',n:{exp:A1+A2,mode:'fac'},d:{exp:'2'+X,mode:'eq'}}],orig),
      sFr('Скоротіть дроби. Відповідь:','1',X+'-'+kY,orig)
    ]});
}
function gen(seed){
  const R=mkR(seed),pair=R.pick(PAIRS);
  const pool=R.shuf(['a','b','c','m','n','p','x','y','d','t','k'].filter(l=>pair.indexOf(l)<0));
  const Q=[tA(R,pool[0]),tB(R,pool[1]),tC(R,pool[2]),tD(R,pair)];
  Q.forEach((q,i)=>{q.n=i+1});
  return Q;
}

/* --- тексти відповідей --- */
function ansText(st,a){
  if(st.kind==='sel')return typeof a==='number'?st.opts[a]:'—';
  if(st.kind==='ord')return st.ord.map((_,k)=>(k+1)+') '+(a&&typeof a[k]==='number'?st.opts[a[k]]:'—')).join('; ');
  if(st.kind==='ms')return st.items.map((it,k)=>tx(it.lab)+': '+(a&&typeof a[k]==='number'?METH[a[k]]:'—')).join('; ');
  if(st.kind==='line'){let k=0,o=[];st.parts.forEach(p=>{
    if(p.t==='sel'){o.push(a&&typeof a[k]==='number'?p.opts[a[k]]:'?');k++}
    else if(p.t==='in'){const n=a&&String(a[k]||'').trim(),d=a&&String(a[k+1]||'').trim();o.push((n||'—')+'/'+(d||'—'));k+=2}
    else o.push(p.t==='fr'?ft(p.n,p.d):p.v)});return o.join(' ')}
  if(st.kind==='ex')return st.cells.map((c,k)=>a&&String(a[k]||'').trim()!==''?String(a[k]):'—').join(' | ');
  if(st.kind==='fr'){const n=a&&String(a[0]||'').trim(),d=a&&String(a[1]||'').trim();return (n||'—')+' / '+(d||'—')}
  return '';
}
function corrText(st){
  if(st.kind==='sel')return st.opts[st.ci];
  if(st.kind==='ord')return st.ord.map((c,k)=>(k+1)+') '+st.opts[c]).join('; ');
  if(st.kind==='ms')return st.items.map(it=>tx(it.lab)+': '+METH[it.ci]).join('; ');
  if(st.kind==='line')return lineText(st);
  if(st.kind==='ex'&&st.ops)return st.ops.reduce((acc,op,f)=>acc+' '+tx(op)+' '+ft(st.cells[2*f+2].exp,st.cells[2*f+3].exp),ft(st.cells[0].exp,st.cells[1].exp));
  if(st.kind==='ex')return st.cells.map(c=>tx(c.exp)).join(' | ');
  if(st.kind==='fr')return ft(st.n,st.d);
  return '';
}
function corrHTML(st){
  if(st.kind==='sel')return esc(st.opts[st.ci]);
  if(st.kind==='ord')return st.ord.map((c,k)=>(k+1)+') '+esc(st.opts[c])).join('<br>');
  if(st.kind==='ms')return st.items.map(it=>vi(it.lab)+' — '+esc(METH[it.ci])).join('<br>');
  if(st.kind==='line')return lineHTML(st);
  if(st.kind==='ex'&&st.ops)return st.ops.reduce((acc,op,f)=>acc+OP(op==='-'?'−':op)+FR(st.cells[2*f+2].exp,st.cells[2*f+3].exp),FR(st.cells[0].exp,st.cells[1].exp));
  if(st.kind==='ex')return st.cells.map(c=>vi(c.exp)).join(' | ');
  if(st.kind==='fr')return FR(st.n,st.d);
  return '';
}
function corrAns(st){
  if(st.kind==='sel')return st.ci;
  if(st.kind==='ord')return st.ord.slice();
  if(st.kind==='ms')return st.items.map(it=>it.ci);

function checkStep(j){
  const i=S.i,st=S.Q[i].steps[j],a=S.ans[i][j],r=S.stt[i][j],w=S.Q[i].ws[j];
  if(r.done)return;
  if(!stepFilled(st,a)){r.msg='fill';refreshFoot(j);return}
  if(checkStepAns(st,a)){
    r.done=true;r.msg='';r.pts=r.tries===0?w:w/2;
    S.justOpened=j+1<S.Q[i].steps.length?S.Q[i].n+'_'+(j+1):null;

      if(bad){$('#msg').textContent='Введіть прізвище та ім\'я, щоб почати';return}
      sur=s.value.trim();nam=n.value.trim();newQuiz(seedFromUrl());render();break}
    case'prev':{if(S.stage==='sum'){go(S.Q.length-1)}else if(S.stage==='err'){S.ei=Math.max(0,S.ei-1);renderErr()}else if(S.i>0){go(S.i-1)}break}
    case'next':{if(S.stage==='err'){S.ei=Math.min(S.Q.length-1,S.ei+1);renderErr()}else if(S.i<S.Q.length-1){go(S.i+1)}else{S.stage='sum';render()}break}
    case'check':doFinish();break;
    case'errs':{let k=S.marks.findIndex(m=>m<1);if(k<0)k=0;S.ei=k;S.stage='err';render();break}
    case'tores':S.stage='res';render();break;
    case'again':newQuiz(Math.floor(Math.random()*2147483647)+1);render();break;
  }
});
function clearMsg(el){
  const stp=el.closest&&el.closest('.stp');if(!stp)return;
  const j=+stp.dataset.st,r=S.stt[S.i][j];
  if(r&&r.msg){r.msg='';const m=stp.querySelector('.msg');if(m)m.textContent=''}
}
app.addEventListener('change',e=>{
  const el=e.target;
  if(!S||S.stage!=='q'||!el.matches||!el.matches('select.sl'))return;
  const v=el.value===''?null:+el.value;
  setAns(S.i,+el.dataset.j,el.dataset.c===undefined?NaN:+el.dataset.c,v);
  clearMsg(el);
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(S&&S.stage==='q'&&el.matches&&el.matches('input.ex')){
    const q=S.Q[S.i];
    const caret=el.selectionStart==null?el.value.length:el.selectionStart;
    const c=cleanInput(el.value,q.vars);
    if(c!==el.value){const pos=cleanInput(el.value.slice(0,caret),q.vars).length;el.value=c;try{el.setSelectionRange(pos,pos)}catch(_){}}
    setAns(S.i,+el.dataset.j,+el.dataset.c,c);
    clearMsg(el);
  } else if(el.id==='sur'||el.id==='nam'){el.classList.remove('err');const m=$('#msg');if(m)m.textContent=''}
});
app.addEventListener('focusin',e=>{
  const el=e.target;
  if(el.matches&&el.matches('input.ex:not([readonly])')){app.querySelectorAll('input.ex').forEach(x=>x.classList.remove('act'));el.classList.add('act')}
});
function stepInputs(el){const stp=el.closest('.stp');return stp?Array.from(stp.querySelectorAll('input.ex:not([readonly])')):[]}
function chkFor(el){const stp=el.closest('.stp');return stp?+stp.dataset.st:-1}
document.addEventListener('keydown',e=>{
  if(!S){if(e.key==='Enter'){const g=$('#go');g&&g.click()}return}
  if($('#jr').classList.contains('on'))return;
  const tg=e.target.tagName;
  if(S.stage==='start'){if(e.key==='Enter'){const g=$('#go');g&&g.click()}return}
  if(e.key==='Enter'){
    if(S.stage==='q'&&tg==='INPUT'&&e.target.classList.contains('ex')){
      e.preventDefault();
      const ins=stepInputs(e.target),k=ins.indexOf(e.target);
      if(k<ins.length-1)focusInput(ins[k+1]);else checkStep(chkFor(e.target));
    }
  } else if(tg!=='INPUT'&&tg!=='SELECT'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const b=$(e.key==='ArrowRight'?'#next':'#prev');if(b&&!b.disabled)b.click();
  }
});

/* ===== Екранна клавіатура (сенсорні екрани) ===== */
$('#kbrow').addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');if(!b)return;e.preventDefault();
  if(!S||S.stage!=='q')return;
  const inputs=enabledInputs();
  if(!inputs.length)return;
  let el=inputs.indexOf(document.activeElement)>=0?document.activeElement:(inputs.find(x=>x.classList.contains('act'))||inputs[0]);
  const k=b.dataset.k,sib=stepInputs(el),idx=sib.indexOf(el);
  if(k==='→'){if(idx<sib.length-1)focusInput(sib[idx+1]);else checkStep(chkFor(el));return}
  const v=el.value;let s=el.selectionStart,en=el.selectionEnd;if(s==null){s=en=v.length}
  let nv,pos;
  if(k==='⌫'){if(s!==en){nv=v.slice(0,s)+v.slice(en);pos=s}else if(s>0){nv=v.slice(0,s-1)+v.slice(s);pos=s-1}else{nv=v;pos=0}}
  else{if(v.length>=40)return;nv=v.slice(0,s)+k+v.slice(en);pos=s+k.length}
  el.value=nv;
  if(document.activeElement!==el)focusInput(el);
  try{el.setSelectionRange(pos,pos)}catch(_){}
  setAns(S.i,+el.dataset.j,+el.dataset.c,cleanInput(nv,S.Q[S.i].vars));
  el.dispatchEvent(new Event('input',{bubbles:true}));
});

/* ===== Журнал учителя ===== */
const jr=$('#jr'),jrbox=$('#jrbox');
function mmss(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
$('#key').addEventListener('click',()=>{
  jr.classList.add('on');
  jrbox.innerHTML=`<div class="pw"><b>Пароль:</b><input id="pw" type="password" autocomplete="off"><button id="pwok">Увійти</button><button id="jrx">Закрити</button></div><div id="pwm" class="em"></div>`;
  const pw=$('#pw');pw.focus();
  const ok=()=>{teacherLogin(pw.value).then(function(ok){if(ok)showJournal();else $('#pwm').textContent='Неправильний пароль'})};
  $('#pwok').onclick=ok;pw.onkeydown=ev=>{if(ev.key==='Enter')ok()};
  $('#jrx').onclick=()=>jr.classList.remove('on');
});
let JR=[];
async function showJournal(){
  jrbox.innerHTML=`<div class="tb"><b>Журнал. ${TEST_NAME}</b><button id="jrup">Оновити</button><button id="jrcsv">Завантажити CSV</button><button id="jrclr">Очистити</button><button id="jrx">Закрити</button></div><div class="tw" id="jtw"><div class="em">Завантаження…</div></div>`;
  $('#jrx').onclick=()=>jr.classList.remove('on');
  $('#jrup').onclick=showJournal;
  $('#jrcsv').onclick=()=>csv();
  $('#jrclr').onclick=()=>{
    const tw=$('#jtw');tw.insertAdjacentHTML('afterbegin',`<div class="pw" id="cf"><b>Видалити всі записи (${JR.length})?</b><button id="cfy">Так, видалити</button><button id="cfn">Скасувати</button></div>`);
    $('#cfn').onclick=()=>$('#cf').remove();
    $('#cfy').onclick=async()=>{try{await clearResults();showJournal()}catch(e){$('#cf').innerHTML='<b>Не вдалося очистити записи. Перевірте правила бази Firebase</b>'}};
  };
  try{JR=await loadResults()}catch(e){$('#jtw').innerHTML='<div class="em">Не вдалося підключитися до бази результатів</div>';return}
  drawJournal();
}
function nT(){return JR.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0)}
function cellLab(r,i){
  const m=(r.tasks||[])[i],p=(r.taskPts||[])[i],w=(r.weights||[])[i];
  if(p!=null&&w!=null)return fmt(p)+'/'+w;
  const ok=(r.stepsOk||[])[i],tot=(r.stepsTotal||[])[i];
  return ok!=null&&tot!=null?ok+'/'+tot:(m===1?'✓':(m===0.5?'½':(m===0?'✗':'—')));
}
function drawJournal(){
  const n=nT();
  if(!JR.length){$('#jtw').innerHTML='<div class="em">Записів ще немає</div>';return}
  let h='<table><thead><tr><th>№</th><th>Прізвище та ім\'я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=n;i++)h+='<th>'+i+'</th>';h+='</tr></thead><tbody>';
  JR.forEach((r,ri)=>{
    const d=r.ts?new Date(r.ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
    const fast=r.durationSec!=null&&r.durationSec<120,lv=r.leaves!=null&&r.leaves>=3;
    h+=`<tr><td>${ri+1}</td><td class="n" data-d="${ri}">${esc(r.name||'')}</td><td>${d}</td><td${fast?' class="warnc" title="Дуже швидко"':''}>${r.durationSec!=null?mmss(r.durationSec):'—'}</td><td${lv?' class="warnc"':''}${r.awaySec!=null?` title="поза вікном ${mmss(r.awaySec)}"`:''}>${r.leaves!=null?r.leaves:'—'}</td><td><b>${fmt(r.score)}</b></td>`;
    for(let i=0;i<n;i++){
      const m=(r.tasks||[])[i],lab=cellLab(r,i);
      h+=m===1?`<td class="r1">${lab}</td>`:(m===0.5?`<td class="rh">${lab}</td>`:(m===0?`<td class="r0">${lab}</td>`:'<td>—</td>'));
    }
    h+='</tr><tr id="dt'+ri+'" style="display:none"><td class="det" colspan="'+(6+n)+'">'+detHTML(r)+'</td></tr>';
  });
  h+='</tbody></table>';
  $('#jtw').innerHTML=h;
  $('#jtw').querySelectorAll('td.n').forEach(td=>td.onclick=()=>{const x=$('#dt'+td.dataset.d);x.style.display=x.style.display==='none'?'table-row':'none'});
}
function detHTML(r){
  if(r.detail&&r.detail.length){
    return r.detail.map((t,i)=>`<div class="dq">№${t.n} · ${(r.qtext||[])[i]?esc((r.qtext||[])[i]):''} — ${t.pts!=null?fmt(t.pts)+' з '+t.w+' балів, ':''}правильно ${t.ok} з ${t.total} кроків</div>`+
      (t.steps||[]).map((s,j)=>{
        const tr=s.tries!=null?(s.tries>0?` · помилок: ${s.tries}`:''):'';
        const sh=s.shown?' · відповідь показано':'';
        const nr=s.reached===0?' · крок не відкрито':'';
        return `<div class="ds">${s.ok?'<span class="r1">✓</span>':'<span class="r0">✗</span>'} <b>Крок ${j+1}.</b> ${esc(s.q)}<br>Відповідь учня: <b>${esc(s.a)}</b>${s.ok?'':' · Правильно: '+esc(s.c)}${tr}${sh}${nr}</div>`}).join('')).join('<hr style="border:0;border-top:1px dashed #cfe3d3">');
  }
  return (r.tasks||[]).map((m,i)=>`<div><b>${i+1}.</b> ${m===1?'✓':(m===0.5?'½':'✗')} ${esc((r.qtext||[])[i]||'')}<br>Відповідь: ${esc((r.answers||[])[i]||'—')} · Правильно: ${esc((r.correct||[])[i]||'—')}</div>`).join('');
}
function csvText(){
  const n=nT(),H=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'];
  for(let i=1;i<=n;i++)H.push('Завд. '+i+' (бали)');
  const rows=[H].concat(JR.map(r=>{const a=[r.name||'',r.ts?new Date(r.ts).toLocaleString('uk-UA'):'',r.durationSec!=null?mmss(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?mmss(r.awaySec):'',fmt(r.score)];
    for(let i=0;i<n;i++){const p=(r.taskPts||[])[i];a.push(p!=null?fmt(p):cellLab(r,i))}return a}));
  return '﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
}
function csv(){
  const txt=csvText();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='Раціональні_вирази_покроково_8клас_результати.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

if(/[?&]selftest/.test(location.search))window.__T={gen:gen,checkStepAns:checkStepAns,getS:()=>S,pEval:pEval,corrAns:corrAns,
  fake:rows=>{jr.classList.add('on');jrbox.innerHTML='<div class="tb"><b>Журнал. '+TEST_NAME+'</b><button id="jrcsv">Завантажити CSV</button><button id="jrx">Закрити</button></div><div class="tw" id="jtw"></div>';JR=rows;drawJournal();$('#jrcsv').onclick=()=>{window.__T.csvText=csvText()}}};
renderStart();

})();
</script>
