<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Інструменти вчителя</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#3b3552}
body{padding:6px}
#gem{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;opacity:.55;padding:4px 6px;border-radius:10px}
#gem:hover{opacity:1;background:rgba(185,166,234,.18)}
#box{display:none;margin-top:6px;max-width:340px;background:linear-gradient(135deg,#fde7f1,#efe9fb 50%,#e3f1fb);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(120,100,170,.18)}
#box.on{display:block}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1.5px solid #d9d0ee;font-size:15px;outline:none;background:#fff;color:#3b3552}
input:focus{border-color:#a695d6}
.b{padding:9px 14px;border-radius:12px;border:none;background:#b9a6ea;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.b:hover{background:#a994e0}
#err{min-height:18px;margin-top:6px;font-size:12px;color:#b04a5a}
#tools{display:none}
#tools.on{display:block}
#tools a{display:block;text-decoration:none;text-align:center;margin-bottom:8px;padding:12px 14px;border-radius:14px;background:#fff;color:#5a4b8a;font-weight:700;font-size:15px;border:1.5px solid #d9d0ee}
#tools a:hover{border-color:#a695d6;background:#f6f2fd}
#tools small{display:block;font-weight:400;font-size:11px;color:#8b84a3;margin-top:2px}
#lock{background:none;border:none;color:#8b84a3;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:2px}
</style>
</head>
<body>
<button id="gem" title="Для вчителя" aria-label="Для вчителя">💎</button>
<div id="box">
  <div id="ask">
    <div class="row"><input type="password" id="pw" placeholder="Пароль" autocomplete="off"><button class="b" id="ok">Увійти</button></div>
    <div id="err"></div>
  </div>
  <div id="tools">
    <a href="https://tetiana-8.github.io/matemka/bloom/" target="_blank" rel="noopener">Контрольна за Блумом<small>конструктор посилань для контрольних робіт</small></a>
    <a href="https://tetiana-8.github.io/matemka/monitoring/" target="_blank" rel="noopener">Моніторинг за Блумом<small>вхідний і підсумковий зріз, динаміка за рік</small></a>
    <button id="lock">Сховати</button>
  </div>
</div>
<script>
(function(){
  var PASS="8019",box=document.getElementById("box"),ask=document.getElementById("ask"),tools=document.getElementById("tools"),pw=document.getElementById("pw"),err=document.getElementById("err");
  function reset(){tools.className="";ask.style.display="";pw.value="";err.textContent="";box.className="";}
  function check(){
    if(pw.value===PASS){ask.style.display="none";tools.className="on";err.textContent="";pw.value="";}
    else{err.textContent="Невірний пароль";pw.value="";pw.focus();}
  }
  document.getElementById("gem").onclick=function(){
    if(box.className==="on"){reset();return;}
    box.className="on";if(tools.className!=="on")pw.focus();
  };
  document.getElementById("ok").onclick=check;
  pw.onkeydown=function(e){if(e.key==="Enter")check();};
  document.getElementById("lock").onclick=reset;
})();
</script>
</body>
</html>
