<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пропорції. Урок 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Кольори 6 класу (персиковий / помаранчевий): задано один раз */
:root{
  --bg:#FFF9F1; --head:#FFF1E3; --acc:#C2410C; --acch:#9A3412; --acc2:#EA580C;
  --soft:#FFEDD5; --l1:#FED7AA; --l2:#FDBA74; --ink:#431407; --mut:#7c4a2d;
  --ok:#1e9e62; --okbg:#e6f7ee; --oktx:#14663f; --okln:#8fd3b0;
  --bad:#e0464e; --badbg:#fdecee; --badtx:#a3232b;
  --warnbg:#fff6e5; --warntx:#8a5a00; --warnln:#f3d9a4;
  --blue:#1d6fd0; --bluebg:#e8f1fc; --vio:#6d3fc8;
  --tg:#43b978; --ty:#f5c842; --tr:#e5646b;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);height:100%}
body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;font-weight:600}
button,input{font-family:inherit;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100dvh;width:100%}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{display:none;flex:1;min-height:0;overflow:auto;padding:.8rem 1.6rem}
.stage.cur{display:flex;flex-direction:column}
.inner{margin:auto;width:100%;max-width:70rem}
.stage.top .inner{margin:0 auto}
.stage h2{color:var(--acc);font-size:1.9rem;font-weight:900;margin:0 0 .6rem;text-align:center;line-height:1.2}

/* стартовий екран */
#s0{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;background:var(--head);text-align:center;padding:1rem;position:relative}
#s0 .par{font-size:1.6rem;font-weight:800;color:var(--acc2);margin-bottom:-1rem}
#s0 h1{margin:0;font-size:3.8rem;line-height:1.15;color:var(--acc);font-weight:900;max-width:46rem}
#gem0{position:absolute;top:.8rem;right:1rem}

/* кнопки */
.btn{background:var(--acc);color:#fff;border:2px solid var(--acc);border-radius:999px;padding:.35rem 1.2rem;font-weight:800;font-size:1.05rem;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{background:var(--acch);border-color:var(--acch)}
.btn.light{background:var(--soft);color:var(--acc);border-color:var(--l2)}
.btn.light:hover{background:var(--l1)}
.btn.sm{font-size:.95rem;padding:.15rem .9rem;min-height:38px}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{font-size:1.6rem;padding:.5rem 2.2rem}
.gemb{background:transparent;border:0;cursor:pointer;padding:.2rem;display:flex}
.gemb svg{width:2.3rem;height:2.3rem}
.gem .g1{fill:var(--l1);stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}
.gem .g2{fill:var(--l2);stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}
.gem .g3{fill:var(--soft);stroke:var(--acc);stroke-width:1.5;stroke-linejoin:round}
.plus{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--warnln);background:var(--warnbg);color:var(--warntx);font-size:1.6rem;font-weight:900;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.plus:hover{background:#fdeccc}

/* нижня панель */
#nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.25rem 1rem;background:var(--head);border-top:1px solid var(--l1)}
#nav .mid{display:flex;align-items:center;gap:.9rem}
#tm{width:.6rem;height:2.3rem;border-radius:.3rem;background:#fff;border:1.5px solid var(--l2);position:relative;overflow:hidden;cursor:pointer}
#tmf{position:absolute;left:0;right:0;bottom:0;background:var(--acc2);height:100%;transition:height 1s linear}
#cnt{font-size:.95rem;color:var(--mut);font-weight:800;min-width:3.2rem;text-align:center}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px;background:var(--head)}
footer b{color:#374151}

/* стрілка ↓ */
#dwrap{flex:none;height:0}
#down{position:fixed;z-index:30;left:50%;top:70%;width:2.9rem;height:2.9rem;border-radius:50%;border:0;background:var(--acc2);color:#fff;font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(194,65,12,.35);animation:bob 1.2s ease-in-out infinite}
#down:hover{background:var(--acch)}
#down[hidden]{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.25rem)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.2rem)}75%{transform:translateX(.2rem)}}

/* покрокове розкриття */
.rv{display:none}
.rv.show{display:block;animation:pop .35s both}
.rv.flex.show{display:flex}
.rv.grid.show{display:grid}
.stage.hasmore .inner{padding-bottom:3.4rem}

/* змістові кольори */
.A,.ke{color:var(--acc);font-weight:900}
.B,.se{color:var(--blue);font-weight:900}
.x{font-family:'STIX Two Text','Cambria Math','Times New Roman',serif;font-style:italic;font-weight:700;color:var(--vio);font-size:1.12em}
.mut{color:var(--mut);font-weight:700}
.c{text-align:center}
.mt{margin-top:.8rem}
.bar{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem}
.bar.mid{justify-content:center}
.bar[hidden]{display:none}

/* картки, правила */
.card{background:#fff;border:2px solid var(--l1);border-radius:1rem;padding:.7rem 1.2rem}
.rule{background:var(--soft);border-left:.5rem solid var(--acc2);border-radius:.8rem;padding:.8rem 1.2rem;font-size:1.5rem;font-weight:800;line-height:1.45}
.rule b{color:var(--acc)}
.rule.main{border:3px solid var(--acc2);border-left-width:.6rem;font-size:1.9rem;text-align:center;box-shadow:0 4px 14px rgba(234,88,12,.18)}
.rule.main .star{display:block;font-size:1.05rem;color:var(--acc2);font-weight:900;letter-spacing:.08em;margin-bottom:.15rem}
.rule.sm{font-size:1.25rem}
.note{background:#fff;border:2px dashed var(--l2);border-radius:1rem;padding:.5rem 1.1rem;font-size:1.3rem;font-weight:700;line-height:1.5;text-align:center}
.lines{display:grid;gap:.6rem}
.big{font-size:2.3rem;font-weight:900;text-align:center;line-height:1.5}
.row2{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;font-size:2rem;font-weight:800}
.tag{display:inline-block;font-size:1.05rem;font-weight:900;border-radius:999px;padding:.1rem .8rem;background:var(--soft);color:var(--acc);border:2px solid var(--l2);vertical-align:middle}
.tag.pr{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag.no{background:var(--badbg);color:var(--badtx);border-color:var(--bad)}
.eqok{color:var(--oktx);font-weight:900}

/* дроби */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.15;font-weight:800}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .22em .04em}
.fr>span:last-child{padding:.04em .22em 0}
.fr .fr{font-size:.9em}
.mxw{display:inline-flex;align-items:center;white-space:nowrap}
.mx{font-weight:800;margin-right:.05em}
.pw{font-size:.62em;vertical-align:super;font-weight:900;margin-left:.05em}
/* додатковий множник: коса риска і число біля чисельника */
.mf{display:inline-flex;align-items:stretch;vertical-align:middle}
.ad{display:inline-flex;align-items:flex-start;margin-left:.05em}
.ad .sl{display:inline-block;align-self:flex-start;width:0;height:.95em;border-left:2px solid var(--acc);transform:translateY(-.35em) rotate(-35deg);margin:.12em .34em 0 -.1em}
.ad .fill{align-self:flex-start;font-size:.7em;color:var(--acc);font-weight:900;transform:translateY(-.5em)}

/* члени відношення / пропорції */
.mem{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;padding:.02em .45em;border-radius:.6em;font-weight:900;line-height:1.35}
.mem.a,.mem.ke{background:var(--soft);border:.1em solid var(--l2);color:var(--acc)}
.mem.b,.mem.se{background:var(--bluebg);border:.1em solid var(--blue);color:var(--blue)}
.mem.n{background:#fff;border:.1em solid var(--l1);color:var(--ink)}
.cl{font-weight:900;margin:0 .25em;color:var(--ink)}

/* схема членів пропорції */
.psch{display:grid;grid-template-columns:5rem 2.2rem 5rem 2.8rem 5rem 2.2rem 5rem;justify-content:center;align-items:center;font-size:2.6rem;font-weight:900;margin:.2rem auto;row-gap:.1rem}
.psch .m{justify-self:center}
.psch .o{text-align:center}
.psch .lbl{font-size:1.25rem;text-align:center;font-weight:900;line-height:1.2}
.psch .lbl.t{grid-column:1/8;grid-row:1}
.psch .br.t{grid-column:1/8;grid-row:2;height:.75rem;border:3px solid var(--acc);border-bottom:0;border-radius:.5rem .5rem 0 0;margin:0 2.5rem}
.psch .m,.psch .o{grid-row:3}
.psch .br.b{grid-column:3/6;grid-row:4;height:.75rem;border:3px solid var(--blue);border-top:0;border-radius:0 0 .5rem .5rem;margin:0 2.5rem}
.psch .lbl.b{grid-column:3/6;grid-row:5}
.xsvg{display:block;width:100%;max-width:26rem;height:auto;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:center}
.legend{display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;font-size:1.4rem;font-weight:900}

/* клікабельні члени */
.clk{font:inherit;cursor:pointer;background:#fff;border:.1em solid var(--l1);color:var(--ink);border-radius:.6em;padding:.02em .45em;min-width:2.2em;font-weight:900;line-height:1.35}
.clk:hover{background:var(--soft)}
.clk.ke{background:var(--soft);border-color:var(--l2);color:var(--acc)}
.clk.se{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.clk.err{background:var(--badbg);border-color:var(--bad);color:var(--badtx);animation:shake .3s}
.clkrow{display:flex;justify-content:center;align-items:center;font-size:2.8rem;font-weight:900;margin:.6rem 0}
.clkrow .fr>span:first-child{padding-bottom:.12em}
.clkrow .fr>span:last-child{padding-top:.12em}

/* задача */
.task{background:#fff;border:2px solid var(--l1);border-left:.45rem solid var(--l2);border-radius:1rem;padding:.7rem 1.2rem}
.task.ok{border-color:var(--ok)}
.task.bad{border-color:var(--bad)}
.task.form{border-color:#d9a91a}
.task.extra{background:var(--warnbg);border-color:var(--warnln)}
.plab{font-size:1.2rem;font-weight:900;color:var(--acc);margin-bottom:.1rem}
.cond{font-size:1.6rem;font-weight:800;line-height:1.55}
.cond.c{text-align:center}
.ask{font-size:1.5rem;font-weight:900;color:var(--acc);margin-top:.2rem}
.xa{display:flex;align-items:center;justify-content:center;gap:.45rem;flex-wrap:wrap;font-size:1.5rem;font-weight:800;margin-top:.5rem}
.xa .pre{color:var(--mut)}
.in{width:6.2rem;font-size:1.4rem;font-weight:800;text-align:center;border:2px solid var(--l2);border-radius:.6rem;padding:.15rem .2rem;background:#fff;color:var(--ink);min-height:2.3rem}
.in:focus{outline:3px solid var(--l1);border-color:var(--acc2)}
.in.w{width:4.4rem} .in.n{width:4.6rem}
.in::placeholder{font-size:.7em;font-weight:700;color:#a89080}
.fq{display:inline-flex;flex-direction:column;align-items:center;gap:.1rem}
.fq .ln{display:block;width:100%;height:3px;background:var(--ink);border-radius:2px}
.fb{text-align:center;font-size:1.2rem;font-weight:800;min-height:1.4rem;margin-top:.2rem}
.fb.ok{color:var(--oktx)} .fb.no{color:var(--badtx)} .fb.fm{color:var(--warntx)}
.ch{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.opt{background:#fff;border:3px solid var(--l2);border-radius:1rem;font-size:1.5rem;font-weight:800;color:var(--ink);padding:.25rem 1rem;cursor:pointer;min-height:48px}
.opt:hover{background:var(--soft)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--oktx)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badtx)}
.opt.sel{background:var(--soft);border-color:var(--acc2)}
.opt:disabled{cursor:default}
.steps{display:grid;gap:.35rem;justify-items:center;margin-top:.5rem}
.stp{font-size:1.6rem;font-weight:800;line-height:1.55;text-align:center;padding:.05rem .8rem}
.stp.fin{color:var(--oktx);background:var(--okbg);border:2px solid var(--okln);border-radius:.7rem;padding:.1rem 1rem}
.stp.fin .fr{color:var(--oktx)}
.stp.no{color:var(--badtx)}
.stp .sm{font-size:.8em}
.nt{display:inline-grid;grid-template-columns:auto auto auto;column-gap:.6rem;row-gap:.05rem;text-align:left;font-size:1.6rem;font-weight:800;background:var(--soft);border:2px solid var(--l1);border-radius:.8rem;padding:.2rem 1rem}
.nt>span:nth-child(3n+1){text-align:right}
.nt>span:nth-child(3n+2){color:var(--mut)}

/* сторінка вправи підручника */
.exh{font-size:1.5rem;font-weight:800;text-align:center;margin:0 0 .4rem;line-height:1.5}
.exh b{color:var(--acc)}
.excond{font-size:1.45rem;font-weight:700;line-height:1.55;max-width:60rem;margin:0 auto .5rem;text-align:center}
.pchips{display:flex;justify-content:center;gap:.4rem;margin-bottom:.5rem;flex-wrap:wrap}
.pch{min-width:3rem;height:2.4rem;border-radius:999px;border:2px solid var(--l2);background:#fff;color:var(--acc);font-weight:900;font-size:1.1rem;cursor:pointer;padding:0 .6rem}
.pch.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pch.done::after{content:" ✓";color:var(--ok)}
.pch.on.done::after{color:#fff}

/* карта (масштаб) */
.mapsvg{width:100%;max-width:34rem;display:block;margin:.4rem auto 0;height:auto}
.mapsvg .r{display:none}
.mapsvg.done .r{display:inline}
.mapsvg.done .q{display:none}

/* запитання з варіантами */
.qt{text-align:center;font-size:1.9rem;font-weight:800;line-height:1.5;margin:.3rem 0 .8rem}
.qt .big{font-size:2.6rem}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;max-width:58rem;margin:.4rem auto}
.opts.c3{grid-template-columns:repeat(3,1fr);max-width:48rem}
.opts.c2{grid-template-columns:repeat(2,1fr);max-width:40rem}
.opts.long{grid-template-columns:1fr;max-width:46rem}
.opts.long .opt{font-size:1.4rem;text-align:left;padding:.35rem 1rem}
.opts .opt{font-size:1.8rem;padding:.4rem .3rem;min-height:56px}
.qfb{text-align:center;font-size:1.4rem;font-weight:800;min-height:2rem;margin-top:.5rem}
.qfb.ok{color:var(--oktx)} .qfb.no{color:var(--badtx)}
.qno{display:inline-block;font-size:1rem;font-weight:900;color:#fff;background:var(--acc2);border-radius:999px;padding:.05rem .7rem;margin-bottom:.3rem}

/* так / ні */
.yn{display:grid;gap:.45rem;max-width:52rem;margin:0 auto}
.ynr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.8rem;background:#fff;border:2px solid var(--l1);border-radius:.9rem;padding:.25rem .9rem}
.ynr.ok{border-color:var(--ok);background:var(--okbg)}
.ynr.bad{border-color:var(--bad);background:var(--badbg)}
.ynr .eq{font-size:1.7rem;font-weight:800;text-align:center}
.ynr .pr{grid-column:1/3;font-size:1.2rem;font-weight:800;text-align:center;display:none}
.ynr.chk .pr{display:block}
.ynb{display:flex;gap:.4rem}
.ynb .opt{font-size:1.2rem;padding:.1rem .9rem;min-height:42px;border-width:2px;border-radius:999px}

/* підсумок */
.sumbox{display:grid;gap:.6rem}
.sm1{background:#fff;border:2px solid var(--l1);border-left:.5rem solid var(--acc2);border-radius:.9rem;padding:.5rem 1rem;font-size:1.5rem;font-weight:800;line-height:1.5}
.sm1 b{color:var(--acc)}
.fin2{display:grid;gap:.5rem;max-width:58rem;margin:0 auto}
.fin2 .row{background:#fff;border:2px solid var(--l1);border-radius:.9rem;padding:.4rem 1rem;font-size:1.35rem;font-weight:800;line-height:1.4;cursor:pointer}
.fin2 .row .ed{display:none;color:var(--acc);margin-top:.2rem}
.fin2 .row .ed.show{display:block;animation:pop .35s both}
.pane[hidden]{display:none!important}

/* світлофор */
.tl{display:flex;flex-direction:column;align-items:center;gap:1rem}
.tlrow{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap}
.tlb{display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer;border:0;background:transparent}
.tlb i{width:5rem;height:5rem;border-radius:50%;display:block;border:4px solid rgba(0,0,0,.12)}
.tlb span{font-size:1.1rem;font-weight:800;color:var(--ink)}
.tlb b{font-size:1.8rem;color:var(--acc)}
.tlb.g i{background:var(--tg)}.tlb.y i{background:var(--ty)}.tlb.r i{background:var(--tr)}
.lamp{width:6rem;height:6rem;border-radius:50%;background:#e5e7eb;border:4px solid #d1d5db;transition:all .3s}
.lamp.g{background:var(--tg);border-color:var(--ok)}.lamp.y{background:var(--ty);border-color:#d9a91a}.lamp.r{background:var(--tr);border-color:var(--bad)}
#tlmsg{font-size:1.4rem;font-weight:800;color:var(--acc);text-align:center;min-height:2rem}
#conf{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2147483050}

/* методична картка */
#mc{position:fixed;inset:0;background:rgba(67,20,7,.35);display:none;align-items:center;justify-content:center;z-index:2147483000;padding:1rem}
#mc.on{display:flex}
#mc .box{background:#fff;border:3px solid var(--l2);border-radius:1.2rem;max-width:44rem;width:100%;max-height:92dvh;overflow:auto;padding:1.1rem 1.4rem}
#mc h3{margin:0 0 .3rem;color:var(--acc);font-size:1.3rem}
#mc p{margin:.1rem 0 .7rem;font-size:1.05rem;line-height:1.4}
#mc .li{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;background:var(--soft);border:2px solid var(--l1);border-radius:.7rem;padding:.35rem .8rem;margin:.3rem 0;cursor:pointer;font-weight:800;font-size:1.05rem;color:var(--ink)}
#mc .li:hover{background:var(--l1)}
#mc .li i{font-style:normal;color:var(--acc);white-space:nowrap}

@media (max-width:760px){
  .stage{padding:.6rem .7rem}
  .opts{grid-template-columns:1fr 1fr}
  .opts.c3{grid-template-columns:1fr}
  .opts .opt{font-size:1.4rem}
  #s0 h1{font-size:2.6rem}
  .psch{grid-template-columns:3.4rem 1.4rem 3.4rem 1.8rem 3.4rem 1.4rem 3.4rem;font-size:1.9rem}
  .psch .br.t,.psch .br.b{margin:0 1.7rem}
  .psch .lbl{font-size:1rem}
  .big{font-size:1.9rem}
  .two{grid-template-columns:1fr}
  .clkrow{font-size:1.9rem}
  .xsvg{max-width:18rem}
  .cond{font-size:1.4rem}
  .stp{font-size:1.4rem;padding:0 .2rem}
  .nt{font-size:1.4rem}
  .task{padding:.6rem .7rem}
  #nav{gap:.4rem;padding:.25rem .5rem}
  #nav .btn{padding:.2rem .7rem}
}
@media (max-height:620px){ .stage h2{font-size:1.5rem;margin-bottom:.4rem} .qt{font-size:1.5rem} }
@media (prefers-reduced-motion:reduce){ #down{animation:none} .rv.show{animation:none} }
</style>
</head>
<body>
<div id="app">
  <section id="s0">
    <button class="gemb gem" id="gem0" title="Методична картка" aria-label="Методична картка"></button>
    <div class="par"></div>
    <h1></h1>
    <button class="btn big" id="startBtn">Почати ▶</button>
  </section>
  <div id="main" style="display:none">
    <div id="dwrap"><button id="down" title="Далі" aria-label="Наступний крок" hidden>↓</button></div>
  </div>
  <nav id="nav" style="display:none">
    <button class="btn light" id="back">← Назад</button>
    <div class="mid">

</div>
<div id="mc"><div class="box">
  <h3>Мета уроку</h3><p id="mgoal"></p>

</div></div>
<canvas id="conf"></canvas>
<script>
'use strict';
/* ---------- допоміжне ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const fr=(n,d,c='')=>`<span class="fr ${c}"><span>${n}</span><span>${d}</span></span>`;
const mix=(w,n,d)=>`<span class="mxw"><span class="mx">${w}</span>${fr(n,d)}</span>`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const NB=' ';
const r6=x=>Math.round(x*1e6)/1e6;
const dec=x=>String(r6(x)).replace('.',',');
const grp=s=>{const [i,f]=String(s).split(',');const g=i.length>=5?i.replace(/\B(?=(\d{3})+(?!\d))/g,NB):i;return f!==undefined?g+','+f:g;};
const N=x=>grp(dec(x));
const X='<i class="x">x</i>';
const isNice=(x,d=2)=>Math.abs(x*Math.pow(10,d)-Math.round(x*Math.pow(10,d)))<1e-7;
const GEM=`<svg viewBox="0 0 48 48"><polygon class="g1" points="12,6 36,6 44,18 24,44 4,18"/><polygon class="g2" points="4,18 44,18 24,44"/><polygon class="g3" points="12,6 18,18 24,6"/><polygon class="g3" points="24,6 30,18 36,6"/></svg>`;
function toRat(x){ let q=1,p=x; for(let i=0;i<8&&Math.abs(p-Math.round(p))>1e-7;i++){p*=10;q*=10;} p=Math.round(p); const g=gcd(p,q)||1; return [p/g,q/g]; }
const eqR=(a,b)=>a[0]*b[1]===a[1]*b[0];
function ratParse(s){
  s=String(s).replace(/[\s  %]/g,'').replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(s))return null;
  const i=s.indexOf('.'); if(i<0)return [parseInt(s,10),1];
  const f=s.length-i-1; if(f>6)return null;
  return [parseInt(s.replace('.',''),10),Math.pow(10,f)];
}
/* число у вигляді звичайного / мішаного дробу */
function frac(p,q){ const g=gcd(p,q); p/=g; q/=g; if(q===1)return String(p); if(p<q)return fr(p,q); return mix(Math.floor(p/q),p%q,q); }
function plural(n,f1,f2,f5){ n=Math.abs(n); const m=n%10,c=n%100; if(!Number.isInteger(n))return f2; if(m===1&&c!==11)return f1; if(m>=2&&m<=4&&!(c>=12&&c<=14))return f2; return f5; }
const mem=(h,c)=>`<span class="mem ${c}">${h}</span>`;
const K=t=>`<span class="ke">${t}</span>`, S=t=>`<span class="se">${t}</span>`;
/* пропорція з кольоровими членами: колонка або дроби */
function prop(a,b,c,d,o={}){
  const col=o.plain?(t=>t):null, ka=col||K, sb=col||S;
  if(o.frac) return `${fr(ka(a),sb(b))} = ${fr(sb(c),ka(d))}`;
  return `${ka(a)} : ${sb(b)} = ${sb(c)} : ${ka(d)}`;
}
/* схема «хрест»: крайні члени — помаранчева лінія, середні — синя */
function fracX(a,b,c,d){
  const t=(x,y,s,col)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="44" font-weight="900" fill="${col}" font-family="Nunito,system-ui,sans-serif">${s}</text>`;
  const O='#C2410C', B='#1d6fd0', I='#431407';
  return `<svg class="xsvg" viewBox="0 0 420 210" aria-hidden="true">
    <line x1="138" y1="66" x2="282" y2="156" stroke="${O}" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" opacity=".8"/>
    <line x1="138" y1="156" x2="282" y2="66" stroke="${B}" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" opacity=".8"/>
    <circle cx="210" cy="111" r="24" fill="#fff"/>
    ${t(80,80,a,O)}<line x1="30" y1="104" x2="130" y2="104" stroke="${I}" stroke-width="4" stroke-linecap="round"/>${t(80,158,b,B)}
    ${t(210,127,'=',I)}
    ${t(340,80,c,B)}<line x1="290" y1="104" x2="390" y2="104" stroke="${I}" stroke-width="4" stroke-linecap="round"/>${t(340,158,d,O)}
  </svg>`;
}

/* ---------- каркас: етапи, кроки, навігація ---------- */
let stages=[], DUR=[], NAMES=[]; const ST=[]; let cur=0;
const fmtT=s=>String(Math.round(s/60*100)/100).replace('.',',')+' хв';
function nearScroll(x){ setTimeout(()=>x.scrollIntoView({block:'nearest',behavior:'smooth'}),30); }
function rvStepper(root){
  const it=()=>$$('.rv',root).filter(x=>!x.closest('.task'));
  return {more:()=>it().some(x=>!x.classList.contains('show')),
          next(){const x=it().find(x=>!x.classList.contains('show'));if(x){x.classList.add('show');nearScroll(x);}},
          reset(){it().forEach(x=>x.classList.remove('show'));}};
}
function placeDown(){
  const d=$('#down'); if(d.hidden||!stages[cur])return;
  const st=stages[cur], R=st.getBoundingClientRect(), w=d.offsetWidth, h=d.offsetHeight;
  let bot=null;
  $$('.rv.show',st).forEach(e=>{ if(!e.getClientRects().length)return; const r=e.getBoundingClientRect(); if(bot===null||r.bottom>bot)bot=r.bottom; });
  let top;
  if(bot===null){
    top=R.top+6;
    for(const e of $$('.rv:not(.show)',st)){
      e.style.visibility='hidden'; e.classList.add('show');
      const r=e.getBoundingClientRect(), ok=r.height>0;
      e.classList.remove('show'); e.style.visibility='';
      if(ok){top=r.top;break;}
    }
  } else top=bot+6;
  top=Math.max(R.top+4,Math.min(top,R.bottom-h-6));
  d.style.top=top+'px'; d.style.left=(R.left+R.width/2-w/2)+'px';
}
function updDown(){
  const m=!!(ST[cur]&&ST[cur].more());
  $('#down').hidden=!m; stages[cur]&&stages[cur].classList.toggle('hasmore',m);
  if(m)placeDown();
}
function bump(){ updDown(); [120,450,800].forEach(t=>setTimeout(updDown,t)); }

let left=0,tmr=null;
function tmStart(){ clearInterval(tmr); left=DUR[cur]; paintTm(); tmr=setInterval(()=>{ if(left>0)left--; paintTm(); },1000); }
function paintTm(){
  $('#tmf').style.height=(DUR[cur]?100*left/DUR[cur]:0)+'%';
  const m=Math.floor(left/60), s=String(left%60).padStart(2,'0');
  $('#tm').title='Залишилось '+m+':'+s+' з '+fmtT(DUR[cur]);
}
function go(i){
  cur=Math.max(0,Math.min(stages.length-1,i));
  stages.forEach((s,k)=>s.classList.toggle('cur',k===cur));
  $('#cnt').textContent=(cur+1)+' / '+stages.length;
  $('#back').disabled=cur===0; $('#next').disabled=cur===stages.length-1;
  if(ST[cur]&&ST[cur].enter)ST[cur].enter();
  stages[cur].scrollTop=0; tmStart(); bump();
}

/* ---------- відповіді учнів ---------- */
function wHTML(w){
  if(!w||w.k==='none') return '';
  if(w.k==='ch') return `<div class="xa ch">${w.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="fb"></div>`;
  const pre=`<span class="pre">${w.pre!==undefined?w.pre:'Відповідь:'}</span>`, post=w.post?`<span>${w.post}</span>`:'';
  if(w.k==='frac') return `<div class="xa">${pre}<input class="in w" data-p="w" inputmode="numeric" placeholder="ціла" autocomplete="off"><span class="fq"><input class="in n" data-p="n" inputmode="numeric" placeholder="чис." autocomplete="off"><span class="ln"></span><input class="in n" data-p="d" inputmode="numeric" placeholder="знам." autocomplete="off"></span>${post}<button class="btn sm chk">Перевірити</button></div><div class="fb"></div>`;
  return `<div class="xa">${pre}<input class="in" data-p="v" inputmode="decimal" autocomplete="off">${post}<button class="btn sm chk">Перевірити</button></div><div class="fb"></div>`;
}
function check(w,box){
  const g=p=>$(`[data-p="${p}"]`,box);
  if(w.k==='frac'){
    const wv=g('w').value.trim(), n=g('n').value.trim(), d=g('d').value.trim();
    if(!wv&&!n&&!d)return {s:'empty'};
    if(!n&&!d&&/^\d+$/.test(wv)) return eqR([+wv,1],w.ans)?{s:'ok'}:{s:'bad'};
    if(!n||!d)return {s:'bad',m:'Заповніть чисельник і знаменник.'};
    if(!/^\d+$/.test(n)||!/^\d+$/.test(d)||(wv&&!/^\d+$/.test(wv))||+d===0)return {s:'bad',m:'Вводьте лише цілі числа.'};
    const W=wv?+wv:0,Nn=+n,Dd=+d,[p,q]=w.ans;
    if((W*Dd+Nn)*q!==p*Dd)return {s:'bad'};
    if(Nn>=Dd)return {s:'form',m:'Виділіть цілу частину.'};
    if(gcd(Nn,Dd)!==1)return {s:'form',m:'Дріб можна скоротити.'};
    return {s:'ok'};
  }
  const raw=g('v').value.trim(); if(!raw)return {s:'empty'};
  const v=ratParse(raw); if(!v)return {s:'bad',m:'Введіть число.'};
  return eqR(v,w.ans)?{s:'ok'}:{s:'bad'};
}
function setFb(box,r,hint){
  const fb=$('.fb',box); box.classList.remove('ok','bad','form'); if(!fb)return;
  if(r.s==='ok'){box.classList.add('ok');fb.className='fb ok';fb.textContent='Правильно!';}
  else if(r.s==='bad'){box.classList.add('bad');fb.className='fb no';fb.textContent=r.m?r.m:'Неправильно. '+(hint||'Спробуйте ще раз.');}
  else if(r.s==='form'){box.classList.add('form');fb.className='fb fm';fb.textContent='Майже! '+r.m;}
  else {fb.className='fb';fb.textContent='';}
}
/* ---------- задача з відповіддю і покроковим розв'язанням ---------- */
function taskHTML(t){
  const steps=t.steps||[];
  return `<div class="task${t.cls?' '+t.cls:''}">${t.label?`<div class="plab">${t.label}</div>`:''}<div class="cond${t.cc?' c':''}">${t.cond}</div>${t.ask?`<div class="ask">${t.ask}</div>`:''}${wHTML(t.w)}${steps.length?`<div class="bar mid mt sstb"><button class="btn light sm sst">Показати кроки</button></div><div class="steps">${steps.map((s,j)=>`<div class="stp rv${j===steps.length-1&&!t.nofin?' fin':''}">${s}</div>`).join('')}</div>`:''}</div>`;
}
function mkTask(host,t,o={}){
  host.innerHTML=taskHTML(t); const box=$('.task',host); let started=false;
  const st=()=>$$('.steps .rv',box);
  const c={t,box,
    more:()=>started&&st().some(x=>!x.classList.contains('show')),
    next(){const x=st().find(x=>!x.classList.contains('show')); if(x){x.classList.add('show');nearScroll(x);} if(started&&!c.more()){ if(t.onDone)t.onDone(box); if(o.onDone)o.onDone(c);} },
    get done(){return started&&!c.more();}
  };
  const sb=$('.sst',box);
  if(sb) sb.onclick=()=>{ started=true; $('.sstb',box).hidden=true; c.next(); bump(); };
  const w=t.w;
  if(w&&w.k==='ch'){
    $$('.opt',box).forEach(b=>b.onclick=()=>{
      if(c.solved||b.disabled)return;
      if(+b.dataset.j===w.ok){ b.classList.add('good'); c.solved=true; setFb(box,{s:'ok'}); $$('.opt',box).forEach(x=>x.disabled=true); }
      else { b.classList.add('bad'); b.disabled=true; setFb(box,{s:'bad',m:'Неправильно. '+(t.hint||'Спробуйте інший варіант.')}); }
    });
  } else if(w&&w.k!=='none'){
    const run=()=>{ const r=check(w,box); setFb(box,r,t.hint); };
    $('.chk',box).onclick=run;
    $$('.in',box).forEach(i=>{ i.addEventListener('keydown',e=>{if(e.key==='Enter')run();}); i.addEventListener('input',()=>setFb(box,{s:'empty'})); });
  }
  return c;
}
/* етап із задачею, яку можна генерувати знову */
function genStage(inner,o){
  inner.innerHTML=`${o.h?`<h2>${o.h}</h2>`:''}<div class="bar mid"><button class="btn light sm newb">${o.btn||'Нова задача ↻'}</button>${o.plus?'<button class="plus" title="Додаткове завдання">+</button>':''}</div><div class="thost"></div>`;
  const host=$('.thost',inner); let ctrl=null, first=true;
  const paint=(hard)=>{ const t=hard?o.plus():o.gen(first); first=false; if(hard)t.cls=(t.cls||'')+' extra'; ctrl=mkTask(host,t); bump(); };
  $('.newb',inner).onclick=()=>paint(false);
  if(o.plus) $('.plus',inner).onclick=()=>paint(true);
  paint(false);
  return {more:()=>ctrl.more(),next(){ctrl.next();},reset(){first=true;paint(false);}};
}
/* сторінка вправи підручника: пункти по черзі, кожен — покроково */
function exStage(inner,ex){
  const P=ex.parts, many=P.length>1;
  inner.innerHTML=`<div class="exh"><b>${ex.lab||('№ '+ex.n+'.')}</b> ${ex.head||''}</div>${ex.cond?`<div class="excond">${ex.cond}</div>`:''}
    ${many?`<div class="pchips">${P.map((p,i)=>`<button class="pch" data-i="${i}">${p.chip||(i+1)+')'}</button>`).join('')}</div>`:''}
    <div class="phost"></div><div class="bar mid mt nxp" hidden><button class="btn light sm nxpb"></button></div>`;
  const host=$('.phost',inner), nx=$('.nxp',inner); let i=0, ctrl=null; const done=P.map(()=>false);
  function show(k){
    i=k; nx.hidden=true;
    ctrl=mkTask(host,P[k].t(),{onDone(){ done[k]=true; paintChips(); if(k<P.length-1){ $('.nxpb',inner).textContent='Далі: '+(P[k+1].chip||(k+2)+')')+' →'; nx.hidden=false; } }});
    paintChips(); bump();
  }
  function paintChips(){ $$('.pch',inner).forEach((b,j)=>{b.classList.toggle('on',j===i);b.classList.toggle('done',done[j]);}); }
  $$('.pch',inner).forEach(b=>b.onclick=()=>show(+b.dataset.i));
  $('.nxpb',inner).onclick=()=>show(i+1);
  show(0);
  return {more:()=>ctrl.more(),next(){ctrl.next();},
    fwd(){ if(i<P.length-1){show(i+1);return true;} return false; },
    prev(){ if(i>0){show(i-1);return true;} return false; },
    enter(){ if(i!==0)show(0); },
    reset(){ done.fill(false); show(0); }};
}
/* запитання з варіантами (по колу різні типи) */
function quizStage(inner,o){
  inner.innerHTML=`${o.h?`<h2>${o.h}</h2>`:''}<div class="bar mid"><button class="btn light sm newq">Нове запитання ↻</button></div><div class="qhost"></div>`;
  const host=$('.qhost',inner); let k=0, q=null, solved=false, num=0;
  function render(){
    host.innerHTML=`<div class="c"><span class="qno">№ ${num}</span></div><div class="qt">${q.txt}</div><div class="opts ${q.cls||''}">${q.opts.map((x,j)=>`<button class="opt" data-j="${j}">${x.h}</button>`).join('')}</div><div class="qfb"></div>`;
  }
  host.onclick=e=>{
    const b=e.target.closest('.opt'); if(!b||b.disabled||solved)return;
    const x=q.opts[+b.dataset.j], fb=$('.qfb',host);
    if(x.ok){ solved=true; b.classList.add('good'); fb.className='qfb ok'; fb.textContent='Правильно!'; }
    else { b.classList.add('bad'); b.disabled=true; fb.className='qfb no'; fb.textContent='Неправильно. Спробуйте інший варіант.'; }
  };
  const fresh=()=>{ const T=o.types[k%o.types.length]; k++; num++; q=T(); q.opts=shuf(q.opts); solved=false; render(); };
  $('.newq',inner).onclick=fresh; fresh();
  return {more:()=>false,next(){},reset(){k=0;num=0;fresh();}};
}
/* підсумок + «Закінчіть речення» */
function sumStage(inner,items,F){
  inner.innerHTML=`<div class="pane pS"><h2>Підсумок уроку</h2><div class="sumbox">${items.map(x=>`<div class="sm1 rv">${x}</div>`).join('')}</div></div>
    <div class="pane pC" hidden><h2>Закінчіть речення</h2><div class="fin2">${F.map(([a,b])=>`<div class="row"><div>${a}</div><div class="ed">${b}</div></div>`).join('')}</div></div>
    <div class="bar mid mt"><button class="btn toChk">Перевірте себе ▶</button><button class="btn light toSum" hidden>Показати підсумок</button></div>`;
  const pS=$('.pS',inner), pC=$('.pC',inner); let chk=false; const sst=rvStepper(pS);
  $('.fin2',inner).onclick=e=>{const r=e.target.closest('.row');if(r)$('.ed',r).classList.add('show');};
  function view(c){ chk=c; pS.hidden=c; pC.hidden=!c; $('.toChk',inner).hidden=c; $('.toSum',inner).hidden=!c; bump(); }
  $('.toChk',inner).onclick=()=>view(true); $('.toSum',inner).onclick=()=>view(false);
  return {more:()=>!chk&&sst.more(),next(){sst.next();},reset(){sst.reset();$$('.ed',inner).forEach(x=>x.classList.remove('show'));view(false);}};
}
/* світлофор */
function lightStage(inner){
  inner.innerHTML=`<h2>Як ви засвоїли тему?</h2><div class="tl">
    <div class="tlrow"><button class="tlb g" data-c="g"><i></i><span>Усе зрозуміло</span><b>0</b></button><button class="tlb y" data-c="y"><i></i><span>Є запитання</span><b>0</b></button><button class="tlb r" data-c="r"><i></i><span>Потрібна допомога</span><b>0</b></button></div>
    <div class="tlrow" style="align-items:center"><button class="btn" id="tlok">ОК</button><button class="btn light" id="tlreset">Скинути</button><div class="lamp" id="lamp"></div></div>
    <div id="tlmsg"></div>
    <div class="tlrow"><button class="btn" id="finish">Завершити урок</button><button class="btn light" id="restart">↻ Почати спочатку</button></div></div>`;
  const cnt={g:0,y:0,r:0}, lamp=$('#lamp',inner), msg=$('#tlmsg',inner);
  const MSG={g:'Чудово! Тема засвоєна.',y:'Є що уточнити — розберемо разом.',r:'Потрібна допомога — повернемося до теми.'};
  $$('.tlb',inner).forEach(b=>b.onclick=()=>{const c=b.dataset.c;cnt[c]++;$('b',b).textContent=cnt[c];});
  $('#tlok',inner).onclick=()=>{ const mx=Math.max(cnt.g,cnt.y,cnt.r); if(!mx)return; const w=cnt.r===mx?'r':(cnt.y===mx?'y':'g'); lamp.className='lamp '+w; msg.textContent=MSG[w]; };
  function clr(){cnt.g=cnt.y=cnt.r=0;$$('.tlb b',inner).forEach(b=>b.textContent='0');lamp.className='lamp';msg.textContent='';}
  $('#tlreset',inner).onclick=clr;
  $('#finish',inner).onclick=()=>{fire();msg.textContent='Дякуємо за роботу на уроці!';};
  $('#restart',inner).onclick=()=>{ ST.forEach(s=>s&&s.reset&&s.reset()); go(0); };
  return {more:()=>false,next(){},reset:clr};
}
function fire(){
  const cv=$('#conf'),cx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#EA580C','#FDBA74','#C2410C','#1d6fd0','#43b978','#FED7AA'];
  const parts=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  cancelAnimationFrame(fire.raf); let t=0;
  (function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore();});
    if(++t<220)fire.raf=requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- запуск уроку ---------- */
function boot(L){
  $$('.gem').forEach(b=>b.innerHTML=GEM);
  $('#s0 .par').textContent=L.par; $('#s0 h1').textContent=L.title; document.title=L.title+'. '+L.par;
  $('#mgoal').textContent=L.goal; $('#mcomp').textContent=L.comp;
  const main=$('#main'), dw=$('#dwrap');

function pctTask(o){
  // o: {txt, let, W, P, part, unk:'part'|'pct'|'whole', uW, uP, uAns, pre:[кроки до запису], approx:{t:'69,687…', v:69.7}}

  const ans=o.unk==='part'?o.part:o.unk==='pct'?o.P:o.W;
  let prod, xe;
  if(o.unk==='part'){ prod=`100 · ${X} = ${K(N(o.W))} · ${S(N(o.P))}`; xe=fr(`${K(N(o.W))} · ${S(N(o.P))}`,'100'); }
  else if(o.unk==='pct'){ prod=`${K(N(o.W))} · ${X} = 100 · ${K(N(o.part))}`; xe=fr(`100 · ${K(N(o.part))}`,K(N(o.W))); }
  else { prod=`${S(N(o.P))} · ${X} = 100 · ${K(N(o.part))}`; xe=fr(`100 · ${K(N(o.part))}`,S(N(o.P))); }
  const post=o.unk==='pct'?'%':un(o.uAns,ans);
  const fin=o.approx?o.approx.v:ans;
  const steps=(o.pre||[]).concat([o.let,
    `<span class="nt"><span>${W} ${un(o.uW,o.unk==='whole'?undefined:o.W)}</span><span>—</span><span>${S('100')} %</span><span>${Pt} ${un(o.uP,o.unk==='part'?undefined:o.part)}</span><span>—</span><span>${Pp} %</span></span>`,
    `${fr(W,S('100'))} = ${fr(Pt,Pp)}`, prod, `${X} = ${xe}`]);
  if(o.approx) steps.push(`${X} = ${o.approx.t}`, `${X} ≈ ${N(fin)}`); else steps.push(`${X} = ${N(fin)}`);
  steps.push(`Відповідь: ${o.finPre||''}${o.approx?'≈ ':''}${N(fin)} ${post}`);
  return {cond:o.txt, w:{k:'num',ans:toRat(fin),post:post}, hint:o.hint||'Складіть короткий запис: ціле — 100 %.', steps};
}

/* ---------- задача через пропорцію: короткий запис → пропорція → розв’язання ---------- */
/* m = [a,b,c,d] для a/b = c/d, один елемент null; rows = [[од.1, од.2],[од.1, од.2]]; u = [одиниця до рядка 1/2] */
function pTask(o){
  const m=o.m, pos=m.indexOf(null), ext=pos===0||pos===3, oth=m[3-pos];
  const ans=r6(ext? m[1]*m[2]/oth : m[0]*m[3]/oth);
  const sh=m.map((v,i)=>i===pos?X:N(v));
  const col=(i,t)=>(i===0||i===3)?K(t):S(t);
  const colored=sh.map((t,i)=>i===pos?t:col(i,t));
  const p1=ext?K(`${X} · ${sh[3-pos]}`):S(`${X} · ${sh[3-pos]}`);
  const p2=ext?S(`${sh[1]} · ${sh[2]}`):K(`${sh[0]} · ${sh[3]}`);
  const num=ext?S(`${sh[1]} · ${sh[2]}`):K(`${sh[0]} · ${sh[3]}`), den=ext?K(sh[3-pos]):S(sh[3-pos]);
  const [u0,u1]=o.u, uu=(i,v)=>{ const u=i%2===0?u0:u1; return typeof u==='function'?u(v):u; };
  const lab=(i)=>`${i===pos?X:colored[i]} ${uu(i,m[i])}`;
  const post=typeof o.post==='function'?o.post(ans):o.post;
  return {cond:o.cond,w:{k:'num',ans:toRat(ans),post},hint:o.hint||'Складіть короткий запис і пропорцію.',
    steps:[o.let,
      `<span class="nt"><span>${lab(0)}</span><span>—</span><span>${lab(1)};</span><span>${lab(2)}</span><span>—</span><span>${lab(3)}.</span></span>`,
      `${fr(colored[0],colored[1])} = ${fr(colored[2],colored[3])}`,
      `${p1} = ${p2}`,`${X} = ${fr(num,den)}`,`${X} = ${N(ans)}`,
      `Відповідь: ${N(ans)} ${post}`]};
}

];
let kind=0;
function genMixed(first){
  let t;
  if(first){ kind=0; return pctTask({txt:PARTQ[0].txt(400,35), let:PARTQ[0].let, W:400, P:35, part:140, unk:'part', uW:'порцій', uP:U('порція','порції','порцій'), uAns:U('порція','порції','порцій')}); }
  kind=kind===0?2:0;
  for(let i=0;i<3000;i++){
    const P=pick([5,10,15,20,25,30,35,40,45,60,65,70,75,80]);
    if(kind===0){ const s=pick(PARTQ), W=pick(s.Ws); const p=r6(W*P/100); if(!isNice(p,s.d||0))continue;

    const s=pick(WHOLEQ), W=pick(s.Ws), p=r6(W*P/100); if(!isNice(p,0))continue;
    return pctTask({txt:s.txt(p,P), let:s.let, W, P, part:p, unk:'whole', uW:s.uW, uP:s.uP, uAns:s.uAns});
  }
}

    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
