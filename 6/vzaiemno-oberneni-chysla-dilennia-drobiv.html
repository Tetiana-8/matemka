<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Взаємно обернені числа. Ділення дробів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script>
  /* Колір 6 класу: персиковий / помаранчевий. Усі кольори класу задано тут один раз. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          panelLeft: '#FFF1E3',
          panelRight: '#FFF9F1',
          brand: '#C2410C',
          brandDark: '#9A3412',
          brandLight: '#FFEDD5',
          brandMid: '#FED7AA',
          brandLine: '#FDBA74',
          accent: '#EA580C',
        },
        fontFamily: {
          ui: ['Nunito', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'],
          math: ['Lora', 'Georgia', 'Times New Roman', 'serif'],
        },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #FFF9F1; color: #1e293b; font-family: 'Nunito', system-ui, 'Segoe UI', Arial, sans-serif; overflow: hidden; }
  #root { height: 100%; width: 100%; }
  button:focus-visible, input:focus-visible { outline: 3px solid #EA580C; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .fade, .pop { animation: none; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade { animation: fadeInUp .45s cubic-bezier(.16,1,.3,1) both; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
  .pop { animation: popIn .4s cubic-bezier(.175,.885,.32,1.1) both; }
  .katex { font-size: 1.12em; }
  input.fr::-webkit-outer-spin-button, input.fr::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>
<div id="root" class="h-full w-full"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const Latex = ({ math, block = false }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) {
      try { window.katex.render(math, ref.current, { displayMode: block, throwOnError: false, macros: { '\\inv': '\\mathrel{\\textcolor{EA580C}{\\boldsymbol{\\to}}}', '\\dv': '\\mathbin{\\textcolor{C2410C}{\\boldsymbol{:}}}', '\\ml': '\\mathbin{\\textcolor{C2410C}{\\boldsymbol{\\cdot}}}' } }); } catch (e) {}
    }
  }, [math, block]);
  return <span ref={ref} />;
};

/* ============ Поле для дробу: чисельник / знаменник ============ */
const FracInput = ({ value = {}, onChange, state }) => {
  const border = state === 'ok' ? 'border-green-500 bg-green-50' : state === 'bad' ? 'border-red-400 bg-red-50' : 'border-brandLine bg-white';
  const cls = `fr w-14 sm:w-16 lg:w-20 h-11 lg:h-14 text-center text-xl lg:text-3xl font-bold rounded-lg border-2 ${border} focus:outline-none focus:border-accent`;
  const set = (k, v) => onChange({ ...value, [k]: v.replace(/[^0-9]/g, '').slice(0, 4) });
  return (
    <span className="inline-flex flex-col items-center gap-1 align-middle">
      <input className={cls} inputMode="numeric" value={value.n || ''} onChange={e => set('n', e.target.value)} />
      <span className="block w-16 sm:w-20 lg:w-24 h-1 bg-slate-700 rounded" />
      <input className={cls} inputMode="numeric" value={value.d || ''} onChange={e => set('d', e.target.value)} />
    </span>
  );
};

// правильність дробу: n/d == an/ad; порожній знаменник = 1
const fracOk = (v, [an, ad]) => {
  if (!v || !v.n) return false;
  const n = +v.n, d = v.d ? +v.d : 1;
  if (!d) return false;
  return n * ad === an * d;
};

const Btn = ({ children, onClick, kind = 'main', disabled, className = '' }) => {
  const styles = {
    main: 'bg-brand hover:bg-brandDark text-white border-brand',
    light: 'bg-brandLight hover:bg-brandMid text-brand border-brandLine',
    grey: 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300',
  };
  return (
    <button disabled={disabled} onClick={onClick}
      className={`min-h-[40px] px-4 py-1.5 lg:px-6 lg:py-2.5 rounded-full border-2 font-bold text-base lg:text-xl whitespace-nowrap active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed ${styles[kind]} ${className}`}>
      {children}
    </button>
  );
};

const Rule = ({ children }) => (
  <div className="pop bg-brandLight border-l-8 border-accent rounded-xl px-5 py-4 lg:px-8 lg:py-6 text-lg sm:text-xl lg:text-3xl font-bold leading-snug">
    {children}
  </div>
);

const Title = ({ children }) => <h2 className="text-2xl sm:text-3xl lg:text-5xl font-extrabold text-brand mb-6 lg:mb-10 text-center">{children}</h2>;

/* ============ Міні-перевірка «Спробуй сам» ============ */
// mid — проміжний крок (перевести в неправильний / звичайний дріб)
const TryIt = ({ task, ans, help, mid, onDone }) => {
  const [v, setV] = useState({});
  const [m, setM] = useState({});
  const [st, setSt] = useState(null);
  const [mst, setMst] = useState(null);
  const check = () => {
    const mOk = mid ? fracOk(m, mid.ans) : true;
    const ok = fracOk(v, ans);
    if (mid) setMst(mOk ? 'ok' : 'bad');
    setSt(ok ? 'ok' : 'bad');
    if (ok && mOk && onDone) onDone();
  };
  const allOk = st === 'ok' && (!mid || mst === 'ok');
  const wrong = st === 'bad' || mst === 'bad';
  const msg = mid && mst === 'bad' ? mid.help : help;
  const Lbl = ({ children }) => <span className="block text-center text-sm lg:text-lg text-slate-500 font-medium mt-2 leading-tight">{children}</span>;
  return (
    <div className="fade mt-8 lg:mt-12 border-2 border-dashed border-brandLine rounded-2xl p-4 lg:p-8">
      <p className="text-lg lg:text-2xl font-bold text-slate-600 mb-4"><i className="fa-solid fa-pen text-accent mr-2"></i>Спробуй сам</p>
      <div className="flex flex-wrap items-center justify-center gap-4 lg:gap-6 text-3xl lg:text-5xl">
        <Latex math={task} />
        {mid && <>
          <span>=</span>
          <span className="inline-flex flex-col items-center">
            <FracInput value={m} onChange={x => { setM(x); setMst(null); setSt(null); }} state={mst} />
            <Lbl>{mid.label}</Lbl>
          </span>
        </>}
        <i className="fa-solid fa-arrow-right text-accent text-2xl lg:text-4xl"></i>
        <span className="inline-flex flex-col items-center">
          <FracInput value={v} onChange={x => { setV(x); setSt(null); setMst(null); }} state={st} />
          {mid && <Lbl>обернене число</Lbl>}
        </span>
        <Btn onClick={check}>Перевірити</Btn>
      </div>
      {allOk && <p className="pop mt-4 text-center text-xl lg:text-3xl font-bold text-green-600">✓ Правильно!</p>}
      {wrong && <p className="pop mt-4 text-center text-lg lg:text-2xl text-red-500">Ще раз! <span className="text-slate-600">{msg}</span></p>}
    </div>
  );
};

/* ============ КРОКИ ПОЯСНЕННЯ ============ */

// 1. Спостерігаємо
const Step1 = ({ setReady }) => {
  const rows = [
    ['\\frac{2}{5}\\cdot\\frac{5}{2}', '\\frac{10}{10}=1'],
    ['\\frac{3}{4}\\cdot\\frac{4}{3}', '\\frac{12}{12}=1'],
    ['7\\cdot\\frac{1}{7}', '\\frac{7}{7}=1'],
  ];
  const [open, setOpen] = useState([false, false, false]);
  const [answer, setAnswer] = useState(false);
  const all = open.every(Boolean);
  useEffect(() => setReady(all), [all]);
  return (
    <div>
      <Title>Обчисли добутки</Title>
      <div className="space-y-4 lg:space-y-6 max-w-2xl mx-auto">
        {rows.map(([a, b], i) => (
          <div key={i} className="flex items-center justify-center gap-4 text-3xl lg:text-5xl">
            <Latex math={a + '='} />
            {open[i]
              ? <span className="pop text-brand font-bold"><Latex math={b} /></span>
              : <Btn kind="light" onClick={() => setOpen(o => o.map((x, j) => j === i ? true : x))}>?</Btn>}
          </div>
        ))}
      </div>
      {all && (
        <div className="fade mt-10 lg:mt-14 max-w-3xl mx-auto text-center">
          {!answer
            ? <Btn kind="light" onClick={() => setAnswer(true)}>Що спільного?</Btn>
            : <Rule>Кожен добуток дорівнює <span className="text-brand">1</span>.</Rule>}
        </div>
      )}
    </div>
  );
};

// 2. Означення
const Step2 = ({ setReady }) => {
  const [shown, setShown] = useState(false);
  const [flip, setFlip] = useState(false);
  useEffect(() => setReady(flip), [flip]);
  const press = () => { if (shown) return; setShown(true); setTimeout(() => setFlip(true), 700); };
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Взаємно обернені числа</Title>
      <Rule>Два числа, добуток яких дорівнює <span className="text-brand">1</span>, називають <span className="text-brand">взаємно оберненими</span>.</Rule>

      <div className="mt-10 lg:mt-14 flex flex-col items-center gap-6">
        <p className="text-lg lg:text-2xl text-slate-600">Як отримати обернене число?</p>
        <div className="flex items-center gap-6 lg:gap-10">
          <div className="text-5xl lg:text-7xl"><Latex math="\frac{2}{3}" /></div>
          <button onClick={press} disabled={shown} aria-label="Показати обернене число"
            className={`w-16 h-16 lg:w-24 lg:h-24 rounded-full flex items-center justify-center transition-all ${shown ? 'bg-transparent' : 'bg-accent hover:bg-brand shadow-md cursor-pointer active:scale-95 animate-pulse'}`}>
            <i className={`fa-solid fa-arrow-right text-3xl lg:text-5xl ${shown ? 'text-accent' : 'text-white'}`}></i>
          </button>
          <div className="relative w-20 h-36 lg:w-28 lg:h-48">
            {shown && <div className="pop absolute inset-0">
              <div className="absolute left-1 right-1 top-1/2 h-1.5 -translate-y-1/2 bg-slate-700 rounded"></div>
              <div className="absolute inset-x-0 text-center text-5xl lg:text-7xl font-bold text-accent transition-all duration-700" style={{ top: flip ? '55%' : '0%' }}>2</div>
              <div className="absolute inset-x-0 text-center text-5xl lg:text-7xl font-bold text-sky-600 transition-all duration-700" style={{ top: flip ? '0%' : '55%' }}>3</div>
            </div>}
          </div>
        </div>
        {flip && (
          <div className="fade text-center space-y-3" style={{ animationDelay: '.8s' }}>
            <p className="text-xl lg:text-3xl font-bold">Чисельник і знаменник помінялися місцями.</p>
            <p className="text-xl lg:text-3xl">Тому добуток таких чисел дорівнює 1:</p>
            <p className="text-2xl lg:text-4xl"><Latex math="\frac{2}{3}\cdot\frac{3}{2}=1" /></p>
          </div>
        )}
      </div>
    </div>
  );
};

// 3. Дріб і натуральне число
const Step3 = ({ setReady }) => {
  const [done, setDone] = useState(false);
  useEffect(() => setReady(done), [done]);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Звичайний дріб і натуральне число</Title>
      <div className="grid sm:grid-cols-2 gap-4 lg:gap-8">
        <div className="fade rounded-2xl bg-brandLight p-5 lg:p-8 text-center">
          <p className="text-lg lg:text-2xl font-bold text-slate-600 mb-3">Дріб — перевертаємо</p>
          <div className="text-4xl lg:text-6xl"><Latex math="\frac{5}{8}\inv\frac{8}{5}" /></div>
        </div>
        <div className="fade rounded-2xl bg-sky-50 p-5 lg:p-8 text-center" style={{ animationDelay: '.3s' }}>
          <p className="text-lg lg:text-2xl font-bold text-slate-600 mb-3">Число — пишемо дробом</p>
          <div className="text-4xl lg:text-5xl whitespace-nowrap"><Latex math="7=\frac{7}{1}\inv\frac{1}{7}" /></div>
        </div>
      </div>
      <TryIt task="\frac{4}{9}" ans={[9, 4]} help="Поміняй місцями 4 і 9." onDone={() => setDone(true)} />
    </div>
  );
};

// 4. Мішане число
const Step4 = ({ setReady }) => {
  const [done, setDone] = useState(false);
  useEffect(() => setReady(done), [done]);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Мішане число</Title>
      <div className="space-y-4 lg:space-y-6">
        <div className="fade rounded-2xl border-2 border-brandLine bg-brandLight p-4 lg:p-6 flex flex-col sm:flex-row sm:items-center gap-3 lg:gap-6">
          <span className="w-12 h-12 lg:w-16 lg:h-16 shrink-0 rounded-full bg-brand text-white text-2xl lg:text-4xl font-extrabold flex items-center justify-center">1</span>
          <p className="flex-1 text-xl lg:text-3xl font-bold leading-snug">Важливо записати мішане число у вигляді <span className="text-brand">неправильного дробу</span></p>
          <span className="text-4xl lg:text-6xl whitespace-nowrap"><Latex math="2\frac{1}{3}=\frac{7}{3}" /></span>
        </div>
        <div className="fade rounded-2xl border-2 border-brandLine bg-brandLight p-4 lg:p-6 flex flex-col sm:flex-row sm:items-center gap-3 lg:gap-6" style={{ animationDelay: '.5s' }}>
          <span className="w-12 h-12 lg:w-16 lg:h-16 shrink-0 rounded-full bg-brand text-white text-2xl lg:text-4xl font-extrabold flex items-center justify-center">2</span>
          <p className="flex-1 text-xl lg:text-3xl font-bold leading-snug">Перевернути <span className="text-brand">неправильний дріб</span></p>
          <span className="text-4xl lg:text-6xl whitespace-nowrap"><Latex math="\frac{7}{3}\inv\frac{3}{7}" /></span>
        </div>
      </div>
      <TryIt task="1\frac{2}{5}" ans={[5, 7]} help="Тепер переверни неправильний дріб."
        mid={{ ans: [7, 5], label: 'неправильний дріб', help: '1 2/5 = (1·5 + 2)/5' }} onDone={() => setDone(true)} />
    </div>
  );
};

// 5. Десятковий дріб
const Step5 = ({ setReady }) => {
  const [done, setDone] = useState(false);
  useEffect(() => setReady(done), [done]);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Десятковий дріб</Title>
      <div className="flex flex-wrap items-center justify-center gap-3 lg:gap-6 text-4xl lg:text-6xl">
        <span className="fade"><Latex math="0{,}3" /></span>
        <span className="fade text-2xl lg:text-3xl text-slate-400" style={{ animationDelay: '.3s' }}>①</span>
        <span className="fade" style={{ animationDelay: '.3s' }}><Latex math="=\frac{3}{10}" /></span>
        <span className="fade text-2xl lg:text-3xl text-slate-400" style={{ animationDelay: '.6s' }}>②</span>
        <span className="fade text-brand" style={{ animationDelay: '.6s' }}><Latex math="\inv\frac{10}{3}" /></span>
      </div>
      <div className="mt-6 text-lg lg:text-2xl space-y-1 text-center text-slate-600">
        <p>① записуємо звичайним дробом</p>
        <p>② перевертаємо</p>
      </div>
      <TryIt task="0{,}9" ans={[10, 9]} help="Тепер переверни звичайний дріб."
        mid={{ ans: [9, 10], label: 'звичайний дріб', help: '0,9 — це дев’ять десятих.' }} onDone={() => setDone(true)} />
    </div>
  );
};

// 6. Числа 1 і 0
const Step6 = ({ setReady }) => {
  useEffect(() => setReady(true), []);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Особливі числа: 1 і 0</Title>
      <div className="grid sm:grid-cols-2 gap-4 lg:gap-8">
        <div className="pop rounded-2xl bg-brandLight border-2 border-brandMid p-6 lg:p-10 text-center">
          <div className="text-4xl lg:text-6xl mb-4"><Latex math="1\cdot 1=1" /></div>
          <p className="text-lg lg:text-2xl font-bold">Число 1 обернене саме до себе</p>
        </div>
        <div className="pop rounded-2xl bg-brandLight border-2 border-brandMid p-6 lg:p-10 text-center" style={{ animationDelay: '.4s' }}>
          <div className="text-4xl lg:text-6xl mb-4"><Latex math="0\cdot\,?=1" /></div>
          <p className="text-lg lg:text-2xl font-bold">У числа 0 оберненого <span className="text-brand">немає</span></p>
          <p className="text-base lg:text-xl text-slate-500 mt-2">бо 0, помножене на будь-яке число, дає 0</p>
        </div>
      </div>
    </div>
  );
};

// 7. Запам'ятай
const Step7 = ({ setReady }) => {
  useEffect(() => setReady(true), []);
  const rows = [
    ['Звичайний дріб', '\\frac{a}{b}\\inv\\frac{b}{a}'],
    ['Натуральне число', 'n\\inv\\frac{1}{n}'],
    ['Мішане число', '2\\frac{1}{3}=\\frac{7}{3}\\inv\\frac{3}{7}'],
    ['Десятковий дріб', '0{,}3=\\frac{3}{10}\\inv\\frac{10}{3}'],
  ];
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Запам'ятай</Title>
      <Rule>Взаємно обернені числа: їхній добуток дорівнює 1.</Rule>
      <div className="mt-6 lg:mt-10 rounded-2xl border-2 border-brandMid overflow-hidden">
        {rows.map(([a, b], i) => (
          <div key={i} className={`fade flex items-center justify-between gap-4 px-4 py-3 lg:px-8 lg:py-5 ${i % 2 ? 'bg-white' : 'bg-brandLight'}`} style={{ animationDelay: `${i * .15}s` }}>
            <span className="text-lg lg:text-2xl font-bold text-slate-600">{a}</span>
            <span className="text-2xl lg:text-4xl"><Latex math={b} /></span>
          </div>
        ))}
      </div>
      <p className="mt-6 text-center text-lg lg:text-2xl text-slate-600">Число 1 обернене саме до себе. У числа 0 оберненого немає.</p>
    </div>
  );
};

/* ============ ДІЛЕННЯ ДРОБІВ ============ */

// Кольори логіки ділення: знаки — зелені, дільник і обернене до нього — сині
const G = ({ children }) => <b className="text-brand">{children}</b>;
const B = ({ children }) => <b className="text-sky-700">{children}</b>;
const FLIP = <>Знак <G>:</G> замінюємо на <G>·</G>, <B>дільник</B> перевертаємо</>;

// Розв'язання прикладу по кроках
const Worked = ({ examples }) => {
  const [ex, setEx] = useState(0);
  const [shown, setShown] = useState(1);
  const e = examples[ex];
  const done = shown >= e.lines.length;
  return (
    <div className="rounded-2xl border-2 border-brandMid p-4 lg:p-8">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4 lg:mb-6">
        <p className="text-lg lg:text-2xl font-bold text-slate-600">Приклад {ex + 1}</p>
        <div className="flex gap-2">
          {examples.map((_, i) => (
            <button key={i} onClick={() => { setEx(i); setShown(1); }}
              className={`w-10 h-10 lg:w-12 lg:h-12 rounded-full border-2 font-bold lg:text-xl cursor-pointer ${i === ex ? 'bg-brand border-accent text-white' : 'bg-white border-brandMid text-brand hover:bg-brandLight'}`}>{i + 1}</button>
          ))}
        </div>
      </div>
      <div className="space-y-5 lg:space-y-7">
        {e.lines.slice(0, shown).map(([lbl, tex], i) => (
          <div key={ex + '-' + i} className="fade">
            <p className="text-lg lg:text-2xl text-slate-600 mb-2"><span className="font-bold text-brand mr-2">{i + 1})</span>{lbl}</p>
            <div className="text-3xl lg:text-5xl leading-relaxed"><Latex math={tex} /></div>
          </div>
        ))}
      </div>
      <div className="mt-5 lg:mt-8 flex flex-wrap gap-3">
        {!done && <Btn kind="light" onClick={() => setShown(s => s + 1)}>Наступний крок ↓</Btn>}
        {done && ex < examples.length - 1 && <Btn kind="light" onClick={() => { setEx(ex + 1); setShown(1); }}>Ще приклад →</Btn>}
      </div>
    </div>
  );
};

// «Спробуй сам» з кількома віконцями в одному записі
const TryChain = ({ parts, onDone }) => {
  const inputs = parts.filter(p => p.ans);
  const [vals, setVals] = useState({});
  const [sts, setSts] = useState({});
  const check = () => {
    const r = {}; let all = true;
    parts.forEach((p, i) => { if (p.ans) { const ok = fracOk(vals[i], p.ans); r[i] = ok ? 'ok' : 'bad'; if (!ok) all = false; } });

  };
  const firstBad = parts.findIndex((p, i) => sts[i] === 'bad');

              <FracInput value={vals[i]} onChange={x => { setVals(v => ({ ...v, [i]: x })); setSts({}); }} state={sts[i]} />
              <span className={`block text-center text-sm lg:text-lg font-medium mt-2 leading-tight max-w-[8rem] ${p.blue ? 'text-sky-700 font-bold' : 'text-slate-500'}`}>{p.label}</span>
            </span>
          : <span key={i} className="whitespace-nowrap"><Latex math={p.tex} /></span>)}
        <Btn onClick={check}>Перевірити</Btn>
      </div>
      {allOk && <p className="pop mt-4 text-center text-xl lg:text-3xl font-bold text-green-600">✓ Правильно!</p>}
      {firstBad >= 0 && <p className="pop mt-4 text-center text-lg lg:text-2xl text-red-500">Ще раз! <span className="text-slate-600">{parts[firstBad].help}</span></p>}

    setAnswers(keep); setChecked(false);

  return (
    <div className="fade max-w-5xl mx-auto">
      <div className="text-center mb-4 lg:mb-6">

        {task.tip && <p className="mt-3 text-lg lg:text-2xl text-slate-600">{task.tip}</p>}
      </div>

      <div className={`grid gap-3 lg:gap-4 ${task.items.some(it => it.text) ? '' : 'md:grid-cols-2'}`}>
        {task.items.map((it, i) => {
          const ok = itemOk(it, answers[i]);
          const filled = it.kind === 'select' ? !!answers[i] : !!(answers[i] && answers[i].n);
          const st = checked && filled ? (ok ? 'ok' : 'bad') : null;
          const set = v => setAnswers({ ...answers, [i]: v });
          return (
            <div key={i} className={`rounded-2xl border-2 p-3 lg:p-5 ${st === 'ok' ? 'border-green-300 bg-green-50' : st === 'bad' ? 'border-red-300 bg-red-50' : 'border-brandMid bg-white'}`}>

                  : <span className="text-3xl lg:text-5xl min-w-[6rem]"><Latex math={'\\displaystyle ' + it.q} /></span>}
                {it.kind === 'frac' && !it.text && (it.sign || task.sign

                  : <i className="fa-solid fa-arrow-right text-accent text-xl lg:text-3xl"></i>)}
                {it.kind === 'frac'
                  ? <FracInput value={answers[i]} onChange={set} state={st} />
                  : <Dropdown value={answers[i]} options={it.options} onChange={set} state={st} />}
                {it.unit && <span className="text-xl lg:text-3xl">{it.unit}</span>}
                {st && <i className={`fa-solid ${ok ? 'fa-circle-check text-green-500' : 'fa-circle-xmark text-red-400'} text-3xl lg:text-4xl ml-auto pop`}></i>}
              </div>
              {st === 'bad' && (
                <div className="fade mt-3 pl-11 text-lg lg:text-2xl text-slate-700">
                  <span className="text-slate-500 mr-2">Підказка:</span>{it.help ? <Latex math={it.help} /> : it.tip}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="mt-6 lg:mt-8 flex flex-wrap items-center justify-center gap-3 lg:gap-4">
        {!checked
          ? <Btn onClick={() => setChecked(true)}><i className="fa-solid fa-check mr-2"></i>Перевірити відповіді</Btn>
          : !allRight && <Btn kind="light" onClick={retry}><i className="fa-solid fa-rotate-left mr-2"></i>Виправити помилки</Btn>}
        {checked && (
          <span className={`pop px-5 py-2.5 rounded-full text-lg lg:text-2xl font-extrabold ${allRight ? 'bg-green-100 text-green-700' : 'bg-brandLight text-brand'}`}>
            {allRight ? '🎉 Усе правильно!' : `Правильно: ${right} з ${task.items.length}`}
          </span>
        )}
      </div>
    </div>
  );
};

const makePractice = (LIST, off) => ({ setReady }) => {
  useEffect(() => setReady(true), []);
  const [tab, setTab] = useState(0);
  const [answers, setAnswers] = useState(LIST.map(() => ({})));
  const [checked, setChecked] = useState(LIST.map(() => false));
  const okCount = t => LIST[t].items.filter((it, i) => itemOk(it, answers[t][i])).length;
  return (
    <div>
      <div className="flex flex-wrap justify-center gap-2 lg:gap-3 mb-3 lg:mb-5">
        {LIST.map((t, i) => {
          const full = checked[i] && okCount(i) === t.items.length;
          return (
            <button key={i} onClick={() => setTab(i)}
              className={`px-4 py-2 lg:px-6 lg:py-3 rounded-full border-2 font-bold text-base lg:text-xl cursor-pointer transition-all
                ${i === tab ? 'bg-brand border-accent text-white' : 'bg-white border-brandMid text-brand hover:bg-brandLight'}`}>
              Завдання {i + 1 + off} {full && <i className="fa-solid fa-star ml-1"></i>}
            </button>
          );
        })}
      </div>
      {LIST[tab].items.some(it => it.kind === 'frac') && (
        <p className="text-center text-sm lg:text-lg text-slate-500 mb-2">
          Відповідь записуй дробом. Якщо це ціле число — знаменник можна залишити порожнім.
        </p>
      )}
      <TaskView key={tab} task={LIST[tab]} idx={tab + off}
        answers={answers[tab]} setAnswers={a => setAnswers(p => p.map((x, i) => i === tab ? a : x))}
        checked={checked[tab]} setChecked={c => setChecked(p => p.map((x, i) => i === tab ? c : x))} />
      <div className="max-w-3xl mx-auto mt-8 flex justify-between">
        <Btn kind="grey" disabled={tab === 0} onClick={() => setTab(t => t - 1)}>← Попереднє</Btn>
        <Btn kind="light" disabled={tab === LIST.length - 1} onClick={() => setTab(t => t + 1)}>Наступне →</Btn>
      </div>
    </div>
  );
};

const Practice1 = makePractice(TASKS.slice(0, 4), 0);
const Practice2 = makePractice(TASKS.slice(4), 4);

// Урок вміщується в екран: якщо крок вищий за екран, він трохи зменшується
const Fit = ({ children }) => {
  const box = useRef(null);
  const inner = useRef(null);
  const [k, setK] = useState(1);
  useEffect(() => {
    const calc = () => {
      const b = box.current, i = inner.current;
      if (!b || !i) return;
      const h = i.offsetHeight, avail = b.clientHeight;
      const s = h > avail ? Math.max(0.35, avail / h) : 1;
      setK(prev => (Math.abs(prev - s) > 0.004 ? s : prev));
    };
    calc();
    const ro = new ResizeObserver(calc);
    ro.observe(box.current);
    ro.observe(inner.current);
    window.addEventListener('resize', calc);
    return () => { ro.disconnect(); window.removeEventListener('resize', calc); };
  }, []);
  return (
    <div ref={box} className="h-full w-full overflow-hidden">
      <div ref={inner} className="px-4 py-4 lg:px-10 lg:py-8"
        style={{ transform: `scale(${k})`, transformOrigin: 'top center' }}>
        {children}
      </div>
    </div>
  );
};

const Author = ({ className = '' }) => (
  <span className={`text-[10px] sm:text-xs lg:text-sm tracking-wider text-slate-500 leading-tight text-center ${className}`}>

const App = () => {
  const [started, setStarted] = useState(false);
  const [menu, setMenu] = useState(false);
  const [step, setStep] = useState(0);
  const [ready, setReady] = useState(false);
  const [seen, setSeen] = useState(0);

  useEffect(() => { setSeen(s => Math.max(s, step)); }, [step]);
  const canNext = ready || seen > step;
  const go = s => { setReady(false); setStep(s); setMenu(false); };
  const Cur = STEPS[step].C;

  if (!started) return (
    <div className="h-full flex flex-col font-ui">
      <div className="flex-1 flex flex-col items-center justify-center bg-panelLeft p-4 text-center gap-6 lg:gap-8">

        <h1 className="text-4xl sm:text-5xl lg:text-7xl font-extrabold fade" style={{ textWrap: 'balance' }}>
          <span className="text-brand">Взаємно обернені числа.</span><br />Ділення дробів
        </h1>

        <button onClick={() => { setStarted(true); go(0); }}

          <span className="w-12 h-12 lg:w-14 lg:h-14 rounded-full bg-brand text-white flex items-center justify-center text-lg pl-1">▶</span>
          ПОЧАТИ
        </button>
      </div>
      <div className="shrink-0 flex justify-center px-4 py-2 border-t border-brandMid bg-panelLeft"><Author /></div>
    </div>
  );

  return (
    <div className="h-full flex flex-col font-ui">
      <div className="shrink-0 flex items-center gap-3 px-4 py-1.5 lg:px-6 lg:py-2 border-b border-brandMid bg-panelLeft">
        <Btn kind="light" onClick={() => setMenu(m => !m)}>☰ Зміст</Btn>
        <div className="flex-1 flex items-center justify-center gap-1 lg:gap-1.5">
          {STEPS.map((s, i) => (
            <span key={i} title={s.name}
              className={`h-2.5 lg:h-3 rounded-full transition-all ${i === step ? 'w-8 lg:w-12 bg-brand' : i <= seen ? 'w-2.5 lg:w-3 bg-brandLine' : 'w-2.5 lg:w-3 bg-slate-200'}`} />
          ))}
        </div>
        <span className="text-sm lg:text-lg font-extrabold text-brand whitespace-nowrap">{step + 1} / {STEPS.length}</span>
      </div>

      <div className="flex-1 min-h-0 overflow-hidden bg-panelRight">
       <Fit key={menu ? 'menu' : step}>
        {menu ? (
          <div className="fade max-w-4xl mx-auto">
            <Title>Зміст уроку</Title>
            <div className="grid sm:grid-cols-2 gap-3">
              {STEPS.map((s, i) => (
                <button key={i} onClick={() => go(i)}
                  className={`flex items-center gap-4 p-3 lg:p-4 rounded-xl border-2 text-left cursor-pointer transition-all hover:border-accent hover:bg-brandLight ${i === step ? 'border-accent bg-brandLight' : 'border-brandMid bg-white'}`}>
                  <span className="w-10 h-10 lg:w-12 lg:h-12 shrink-0 rounded-full bg-brandMid text-brand font-extrabold flex items-center justify-center lg:text-xl">
                    {s.name.startsWith('Практикум') ? '✎' : i + 1}
                  </span>
                  <span className="text-lg lg:text-2xl font-bold">{s.name}</span>
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div className="fade"><Cur setReady={setReady} /></div>
        )}
       </Fit>
      </div>

      <div className="shrink-0 flex justify-between items-center gap-3 px-4 py-1.5 lg:px-6 lg:py-2 border-t border-brandMid bg-panelLeft">
        <div className="w-32 lg:w-36 shrink-0 flex justify-start">
          {!menu && <Btn kind="grey" disabled={step === 0} onClick={() => go(step - 1)}>← Назад</Btn>}
        </div>
        <Author className="flex-1 min-w-0" />
        <div className="w-32 lg:w-36 shrink-0 flex justify-end">
          {!menu && (step < STEPS.length - 1
            ? <Btn disabled={!canNext} onClick={() => go(step + 1)}>Далі →</Btn>
            : <Btn kind="light" onClick={() => setStarted(false)}>На початок</Btn>)}
        </div>
      </div>
    </div>
  );
};

(function(){

  var layer = document.getElementById('pm-paper');

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
