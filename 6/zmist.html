<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 6 клас — зміст</title>
<style>
  :root{
    --main:#e8791c;      /* помаранчевий — колір 6 класу */
    --soft:#fdebd9;
    --softer:#fff8f1;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#f6d5b5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 6 клас</h1>
  <p class="sub">Теми за підручником. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКА ===== */
const ZMIST = [
 {rozdil:"", par:[
  {t:"§ 1. Подільність натуральних чисел", temy:[
   [1,"Дільники і кратні"],
   [2,"Ознаки подільності на 10, на 5 і на 2"],
   [3,"Ознаки подільності на 9 і на 3"],
   [4,"Прості та складені числа"],
   [5,"Найбільший спільний дільник"],
   [6,"Найменше спільне кратне"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Звичайні дроби", temy:[
   [7,"Основна властивість дробу"],
   [8,"Скорочення дробів"],
   [9,"Зведення дробів до спільного знаменника. Порівняння дробів"],
   [10,"Додавання і віднімання дробів"],
   ["check","Завдання № 2 «Перевірте себе»"],
   [11,"Множення дробів"],
   [12,"Знаходження дробу від числа"],
   [13,"Взаємно обернені числа. Ділення дробів"],
   [14,"Знаходження числа за заданим значенням його дробу"],
   [15,"Перетворення звичайних дробів у десяткові"],
   [16,"Нескінченні періодичні десяткові дроби"],
   [17,"Десяткове наближення звичайного дробу"],
   ["check","Завдання № 3 «Перевірте себе»"]]},
  {t:"§ 3. Відношення і пропорції", temy:[
   [18,"Відношення"],
   [19,"Пропорції"],
   [20,"Відсоткове відношення двох чисел"],
   [21,"Пряма та обернена пропорційні залежності"],
   [22,"Поділ числа в заданому відношенні"],
   [23,"Коло і круг"],
   [24,"Довжина кола. Площа круга"],
   [25,"Циліндр. Конус. Куля"],
   [26,"Діаграми"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"§ 4. Раціональні числа і дії з ними", temy:[
   [27,"Додатні і від’ємні числа"],
   [28,"Координатна пряма"],
   [29,"Цілі числа. Раціональні числа"],
   [30,"Модуль числа"],
   [31,"Порівняння чисел"],
   [32,"Додавання раціональних чисел"],
   [33,"Властивості додавання раціональних чисел"],
   [34,"Віднімання раціональних чисел"],
   ["check","Завдання № 5 «Перевірте себе»"],
   [35,"Множення раціональних чисел"],
   [36,"Переставна та сполучна властивості множення раціональних чисел. Коефіцієнт"],
   [37,"Розподільна властивість множення"],
   [38,"Ділення раціональних чисел"],
   [39,"Розв’язування рівнянь"],
   [40,"Розв’язування задач за допомогою рівнянь"],
   [41,"Перпендикулярні прямі"],
   [42,"Паралельні прямі"],
   [43,"Координатна площина"],
   [44,"Графіки"],
   ["check","Завдання № 6 «Перевірте себе»"]]}
 ]},
 {rozdil:"Повторення", par:[
  {t:"Вправи для повторення за курс 6 класу", temy:[["povt","Повторення за курс 6 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми (або "povt" для повторення).
   test:true — кнопка буде світлою (для тестів).
   Приклад:  7: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
  10: [{n:"Додавання дробів з різними знаменниками", url:"https://sites.google.com/view/dodividzvichdrobiv"}],
  11: [{n:"Множення звичайних дробів", url:"https://sites.google.com/view/mnozhennia-zvychainykh-drobiv"}],
  12: [{n:"Знаходження дробу від числа", url:"https://tetiana-8.github.io/matemka/6/drib-vid-chysla.html"}],
  13: [{n:"Взаємно обернені числа. Ділення дробів", url:"https://sites.google.com/view/oberneni-ta-dilennya"}],
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  if(r.rozdil){ const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h); }
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const nTem=p.temy.filter(x=>typeof x[0]==="number").length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"){ html+=`<li class="check">✔ ${name}</li>`; return; }
      if(k==="chvert1"){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : "↺";
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
</body>
</html>
