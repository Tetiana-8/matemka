<style>
/* Layout: wide column that scales with the screen. Start screen, then 12 questions (progress bar, task, answer cells, status), then a review and a results list. */
:root{
  --bg:#E4F3DC;
  --surface:#F4FAF0;
  --fg:#173222;
  --muted:#4F6B56;
  --line:#A9C9A2;
  --accent:#2D6A3E;
  --accent-ink:#F4FAF0;
  --ok:#2B8A3E;
  --ok-bg:#CFEBC6;
  --bad:#B8432F;
  --bad-bg:#F6DDD5;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13231A;--surface:#1B3023;--fg:#E2F1DC;--muted:#9DB9A2;--line:#3B5A44;
    --accent:#7CC48B;--accent-ink:#0F2216;--ok:#7CD98F;--ok-bg:#21432B;--bad:#F0907C;--bad-bg:#40231D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13231A;--surface:#1B3023;--fg:#E2F1DC;--muted:#9DB9A2;--line:#3B5A44;
  --accent:#7CC48B;--accent-ink:#0F2216;--ok:#7CD98F;--ok-bg:#21432B;--bad:#F0907C;--bad-bg:#40231D;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{
  font-size:clamp(16px,min(calc(11px + 1vw),3.1vh),28px);
  max-width:1400px;margin:0 auto;display:flex;flex-direction:column;
  min-height:calc(100vh - 60px);
  min-height:calc(100dvh - 60px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}
.screen{flex:1;display:flex;flex-direction:column;gap:1.2em;min-width:0}

/* buttons */
.btn{height:2.9em;padding:0 1.6em;border:2px solid var(--accent);border-radius:.6em;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1em;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.link{align-self:center;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.9em;text-decoration:underline;text-underline-offset:.2em;cursor:pointer;padding:.5em 1em}

/* start */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center}
h1{margin:0;font-size:2.4em;font-weight:800;line-height:1.15;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-weight:700}
.lbl{font-weight:700;margin-top:.8em;font-size:.9em;color:var(--muted)}
.name{width:min(18em,100%);height:2.6em;padding:0 .7em;text-align:center;border:2px solid var(--line);border-radius:.5em;background:var(--surface);font-size:1.3em;font-weight:700}

/* quiz */
.head{display:flex;align-items:center;gap:1em}
.dots{display:flex;gap:.3em;flex:1}
.dot{flex:1;height:.55em;border-radius:.3em;background:var(--line)}
.dot.cur{background:var(--accent)}
.dot.ok{background:var(--ok)}
.dot.ok2{background:var(--ok);opacity:.5}
.dot.skip{background:var(--bad)}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center;max-width:100%}
.cond{font-size:1.7em;font-weight:700;line-height:1.35;max-width:20em;text-wrap:balance}
.cond.sm{font-size:1.15em;color:var(--muted)}

/* math */
.expr{font-size:min(3em,7vw);font-weight:700;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.2em .3em;padding:.2em 0;font-variant-numeric:tabular-nums}
.n{line-height:1.1}
.op{padding:0 .1em;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.82em;white-space:nowrap}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.mx{display:inline-flex;align-items:center;gap:.12em}

/* write-in cells */
.write{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1em 1.4em}
.cells{display:flex;align-items:center;gap:.6em;font-size:1.9em}
.cell{width:2.4em;height:1.8em;padding:0;text-align:center;border:2px solid var(--line);border-radius:.3em;background:var(--surface);font-size:1em;font-weight:700;font-variant-numeric:tabular-nums}
.cell.bad{border-color:var(--bad);background:var(--bad-bg)}
.cell.ok{border-color:var(--ok);background:var(--ok-bg)}
.afr{display:inline-flex;flex-direction:column;align-items:center;gap:.2em}
.afr .bar{width:2.4em;height:max(3px,.07em);border-radius:2px;background:var(--fg)}
.go{height:2.9em;padding:0 1.4em;border:2px solid var(--accent);border-radius:.6em;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1em;cursor:pointer}

.foot{display:flex;align-items:center;justify-content:space-between;gap:.8em;min-height:2.8em}
.status{display:flex;align-items:center;gap:.45em;font-weight:800;font-size:1.2em;min-width:0}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.status.hint{color:var(--accent);font-size:1.1em}
.status svg{flex:none;width:1.1em;height:1.1em}
.next{height:2.4em;padding:0 1.2em;border:2px solid var(--line);border-radius:.6em;background:transparent;color:var(--muted);font-weight:800;font-size:.9em;cursor:pointer}
.next:hover{border-color:var(--accent);color:var(--accent)}

/* end + results */
.endtop{display:flex;flex-direction:column;align-items:center;gap:.2em;text-align:center;padding-top:.5em}
.score{font-size:3.4em;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.saved{margin-top:.4em;color:var(--muted);font-weight:700;font-size:.85em}
.review{list-style:none;margin:0;padding:0;font-size:.8em}
.rv{display:grid;grid-template-columns:1.4em minmax(0,1fr) auto;gap:.2em .7em;align-items:start;padding:.65em .1em;border-bottom:1px solid var(--line)}
.rv .mk{display:flex;padding-top:.15em}
.rv .mk svg{width:1.2em;height:1.2em}
.rv.ok .mk{color:var(--ok)}
.rv.ok2 .mk{color:var(--accent)}
.rv.bad .mk{color:var(--bad)}
.rv .q{font-weight:700;overflow-wrap:anywhere}
.rv .w{grid-column:2/4;color:var(--muted);font-weight:600;font-size:.9em}
.rv .a{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.endbtns{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center;padding-top:.4em}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap}
.rnote{color:var(--muted);font-weight:700;font-size:.85em}
.rlist{display:flex;flex-direction:column;gap:.5em}
details.att{border:2px solid var(--line);border-radius:.6em;background:var(--surface)}
details.att summary{display:flex;align-items:center;gap:1em;padding:.7em .9em;cursor:pointer;font-weight:800;list-style:none}
details.att summary::-webkit-details-marker{display:none}
details.att .nm{flex:1;min-width:0;overflow-wrap:anywhere}
details.att .dt{color:var(--muted);font-weight:700;font-size:.8em}
details.att .sc{font-variant-numeric:tabular-nums}
details.att .review{padding:0 .9em .4em}
details.att .del{margin:.2em .9em .8em;height:2.2em;font-size:.8em}
.empty{color:var(--muted);font-weight:700;text-align:center;padding:2em 0}

/* help: worked example */
.foot{flex-wrap:wrap}
.fbtns{display:flex;flex-wrap:wrap;gap:.6em;justify-content:flex-end;margin-left:auto}
.next.help{border-color:var(--accent);color:var(--accent)}
.hov{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(15,35,22,.55)}
.hcard{font-size:.85em;width:min(46em,100%);max-height:100%;overflow-y:auto;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:.8em;padding:1.2em 1.4em;display:flex;flex-direction:column;gap:.9em}
.hcard h2{margin:0;font-size:1.15em;font-weight:800}
.hcard .hsub{margin:0;color:var(--muted);font-weight:700;font-size:.85em}
.hq{font-size:1.2em;font-weight:700;line-height:1.5;padding:.6em .8em;border-radius:.5em;background:var(--surface);border:1px solid var(--line)}
.hsteps{margin:0;padding:0 0 0 1.5em;display:flex;flex-direction:column;gap:.7em;font-size:1.05em;font-weight:600;line-height:1.6}
.hsteps li::marker{font-weight:800;color:var(--accent)}
.im{display:inline-flex;align-items:center;vertical-align:middle;gap:.15em;font-size:1.3em;font-weight:700;margin:0 .1em;white-space:nowrap}
.hans{font-size:1.15em;font-weight:800;padding:.6em .8em;border-radius:.5em;background:var(--ok-bg);border:2px solid var(--ok);display:flex;align-items:center;flex-wrap:wrap;gap:.4em}
.htip{margin:0;color:var(--muted);font-weight:700;font-size:.9em;line-height:1.5}
.hcard .btn{align-self:flex-start;position:sticky;bottom:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="app">
  <section id="start" class="screen">
    <div class="center">

      <button class="btn" id="hclose" type="button">Зрозуміло</button>
    </div>
  </div>
</main>

<script>
//<logic>
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const add=(x,y)=>fr(x.n*y.d+y.n*x.d,x.d*y.d);
const sub=(x,y)=>fr(x.n*y.d-y.n*x.d,x.d*y.d);
const eq=(x,y)=>x.n===y.n&&x.d===y.d;
const mv=(w,n,d)=>fr(w*d+n,d);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];

const N=n=>`<span class="n">${n}</span>`;
const FR=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`<span class="mx">${N(w)}${FR(n,d)}</span>`;
const OP=s=>`<span class="op">${s}</span>`;
const parts=f=>{const n=Math.abs(f.n),d=f.d;return{w:Math.floor(n/d),r:n%d,n,d}};
function txt(f,fmt){
  const p=parts(f);
  if(p.d===1)return ''+p.n;
  if(fmt==='frac'||p.n<p.d)return p.n+'/'+p.d;
  return p.w+' '+p.r+'/'+p.d;
}
function afmtOf(v){return v.d===1?'int':v.n<v.d?'frac':'mixed'}

const DENS=[12,15,18,20,21,24,28,30,35,36,39,42,45,48,52,54,56,60,63,65,72,75,81,84,85,90];

// every task: {text, html, plain, value, afmt}
function q215(){ // part of a day
  const h=pick([2,3,4,6,8,9,10,12,14,15,16,18,20,21,22]);
  const text=`Яку частину доби становлять ${h} год?`;
  return{text,html:'',plain:text,value:fr(h,24),afmt:'frac'};
}
function q216(){ // part of a straight angle (180°)
  let d;do{d=rnd(2,178)}while(gcd(d,180)<2);
  const text=`Яку частину розгорнутого кута становить кут, градусна міра якого дорівнює ${d}°?`;
  return{text,html:'',plain:text,value:fr(d,180),afmt:'frac'};
}
function q217(){ // part of a right angle (90°)
  let d;do{d=rnd(2,88)}while(gcd(d,90)<2);
  const text=`Яку частину прямого кута становить кут, градусна міра якого дорівнює ${d}°?`;
  return{text,html:'',plain:text,value:fr(d,90),afmt:'frac'};
}
function q218a(op){ // same denominators, reduce the result
  let n,a,b,r;
  for(;;){
    n=pick(DENS);a=rnd(1,n-1);b=rnd(1,n-1);
    if(op==='−'&&a<=b)continue;
    r=op==='+'?a+b:a-b;
    if(r<=0||r>=n||gcd(r,n)<2)continue;
    break;
  }
  const v=op==='+'?add(fr(a,n),fr(b,n)):sub(fr(a,n),fr(b,n));
  return{text:'Виконайте дії та скоротіть результат:',html:FR(a,n)+OP(op)+FR(b,n),plain:`${a}/${n} ${op} ${b}/${n}`,value:v,afmt:'frac'};
}
function q218b(op){ // mixed numbers with the same denominator
  let n,w1,w2,n1,n2,r;
  for(;;){
    n=pick(DENS);w1=rnd(1,9);w2=rnd(1,9);n1=rnd(1,n-1);n2=rnd(1,n-1);
    if(op==='+'){if(n1+n2>=n)continue;r=n1+n2}
    else{if(w1<=w2||n1<=n2)continue;r=n1-n2}
    if(gcd(r,n)<2)continue;
    break;
  }
  const A=mv(w1,n1,n),B=mv(w2,n2,n),v=op==='+'?add(A,B):sub(A,B);
  return{text:'Виконайте дії та скоротіть результат:',html:MX(w1,n1,n)+OP(op)+MX(w2,n2,n),plain:`${w1} ${n1}/${n} ${op} ${w2} ${n2}/${n}`,value:v,afmt:'mixed'};
}
function q222(){ // reduce a fraction written as a product
  let a,b,c,d,v,ok=false;
  for(let i=0;i<30000&&!ok;i++){
    a=rnd(2,40);b=rnd(2,40);c=rnd(2,40);d=rnd(2,40);
    if(a===c||a===d||b===c||b===d)continue;
    const top=a*b,bot=c*d;
    if(top>700||bot>700||gcd(top,bot)<6)continue;
    const pairs=(gcd(a,c)>1)+(gcd(a,d)>1)+(gcd(b,c)>1)+(gcd(b,d)>1);
    if(pairs<2)continue;
    v=fr(top,bot);
    if(v.d<2||v.n>40||v.d>40)continue;
    ok=true;
  }
  if(!ok){a=4;b=5;c=25;d=6;v=fr(20,150)}
  return{text:'Скоротіть:',html:FR(`${a} · ${b}`,`${c} · ${d}`),plain:`(${a}·${b})/(${c}·${d})`,value:v,afmt:'frac'};
}
function buildTest(){
  const plan=[q215,q215,q216,q216,q217,q217,()=>q218a('+'),()=>q218a('−'),()=>q218b('+'),()=>q218b('−'),q222,q222];
  const used=new Set(),out=[];
  for(const g of plan){let t;for(let i=0;i<40;i++){t=g();if(!used.has(t.plain))break}used.add(t.plain);out.push(t)}
  return out;
}
// vals: strings from the cells. Returns {r:'ok'|'bad'|'hint'|'empty', k?}
function checkWrite(t,vals){
  const f=t.afmt,need=f==='int'?['v']:f==='frac'?['n','d']:['w','n','d'];
  for(const k of need)if(vals[k]==null||vals[k]==='')return{r:'empty',k};
  const x=k=>parseInt(vals[k],10);
  if(f==='int')return{r:eq(fr(x('v')),t.value)?'ok':'bad'};
  if(x('d')===0)return{r:'bad'};
  let val;
  if(f==='frac')val=fr(x('n'),x('d'));
  else{if(x('n')>=x('d'))return{r:'bad'};val=fr(x('w')*x('d')+x('n'),x('d'))}
  if(!eq(val,t.value))return{r:'bad'};
  return{r:gcd(x('n'),x('d'))===1?'ok':'hint'};
}
//</logic>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SCREENS=['start','quiz','end','results'];
const show=id=>SCREENS.forEach(s=>$(s).hidden=s!==id);
const ICON_OK='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BAD='<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const LS='drobi-results',LSN='drobi-name',ADVANCE_MS=1600;

let Q=[],rec=[],qi=0,done=false,timer=null,startAt=0,pname='';

/* ---------- storage ---------- */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const localList=()=>{try{return JSON.parse(lsGet(LS)||'[]')}catch(e){return []}};
async function getCap(n){
  try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
// one document per student: results/<id>, holding the latest attempts
async function saveResult(r){
  const L=localList();L.unshift(r);lsSet(LS,JSON.stringify(L.slice(0,60)));
  try{
    const db=await getCap('db'),user=await getCap('user');
    const uid=user?await user.id():null;
    if(db&&uid){
      const ref=db.doc('results/'+uid);
      const snap=await withTimeout(ref.get(),10000);
      const prev=snap.exists&&Array.isArray(snap.data().attempts)?snap.data().attempts:[];
      await withTimeout(ref.set({uid:uid,name:r.name,at:r.at,attempts:[r].concat(prev).slice(0,15)}),10000);
      return 'db';
    }
  }catch(e){}
  return 'local';
}
// results are for the teacher only: the button appears for people who can edit the page
(async()=>{
  try{
    const u=await getCap('user');
    if(u&&await u.canEdit()){$('toRes').hidden=false;$('toRes2').hidden=false}
  }catch(e){}
})();

/* ---------- quiz ---------- */
const cell=(k,label)=>`<input class="cell" data-k="${k}" type="text" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="${label}">`;
const acell=()=>`<span class="afr">${cell('n','чисельник')}<span class="bar"></span>${cell('d','знаменник')}</span>`;
function buildCells(f){
  $('cells').innerHTML=f==='int'?cell('v','відповідь'):f==='frac'?acell():cell('w','ціла частина')+acell();
}
function setStatus(kind,html){const s=$('status');s.className='status'+(kind?' '+kind:'');s.innerHTML=html||''}
function renderDots(){
  $('dots').innerHTML=rec.map((r,i)=>{
    let c='dot';
    if(i===qi)c+=' cur';
    else if(r.skipped)c+=' skip';
    else if(r.ok)c+=r.t===0?' ok':' ok2';
    return `<span class="${c}"></span>`;
  }).join('');
  $('count').textContent=(qi+1)+' / '+Q.length;
}
function begin(){
  pname=$('nm').value.trim();lsSet(LSN,pname);
  Q=buildTest();
  rec=Q.map(t=>({plain:t.plain,expect:txt(t.value,t.afmt==='frac'?'frac':''),ok:false,t:0,w:[],skipped:false}));
  qi=0;startAt=Date.now();
  show('quiz');showQ();
}
function showQ(){
  clearTimeout(timer);done=false;
  const t=Q[qi];
  $('cond').textContent=t.text;
  $('cond').classList.toggle('sm',!!t.html);
  $('expr').innerHTML=t.html?t.html+OP('='):'';
  $('expr').hidden=!t.html;
  buildCells(t.afmt);
  const first=$('cells').querySelector('.cell');if(first)first.focus({preventScroll:true});
  setStatus('','');renderDots();
}
function advance(){
  clearTimeout(timer);
  qi++;
  if(qi>=Q.length)finish();else showQ();
}
function answerString(vals,f){
  return f==='int'?vals.v:f==='frac'?`${vals.n}/${vals.d}`:`${vals.w} ${vals.n}/${vals.d}`;
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  if(done)return;
  const t=Q[qi],r=rec[qi],vals={};
  $('cells').querySelectorAll('.cell').forEach(c=>vals[c.dataset.k]=c.value.trim());
  const res=checkWrite(t,vals);
  if(res.r==='empty'){const c=$('cells').querySelector(`[data-k="${res.k}"]`);if(c)c.focus();return}
  const ans=answerString(vals,t.afmt);
  if(res.r==='ok'){
    done=true;r.ok=true;
    $('cells').querySelectorAll('.cell').forEach(c=>{c.classList.remove('bad');c.classList.add('ok');c.readOnly=true});
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    setStatus('ok',ICON_OK+'Правильно');renderDots();
    clearTimeout(timer);timer=setTimeout(advance,ADVANCE_MS);
  }else if(res.r==='hint'){
    r.t++;if(r.w.length<4)r.w.push(ans+' (не скорочено)');
    setStatus('hint','Скоротіть дріб');
  }else{
    r.t++;if(r.w.length<4)r.w.push(ans);
    $('cells').querySelectorAll('.cell').forEach(c=>c.classList.add('bad'));
    setStatus('bad',ICON_BAD+'Неправильно');
  }
});
$('cells').addEventListener('input',e=>{
  const c=e.target;if(!c.classList.contains('cell'))return;
  c.value=c.value.replace(/\D/g,'');
  if(!done){
    $('cells').querySelectorAll('.cell').forEach(x=>x.classList.remove('bad'));
    const s=$('status');if(s.classList.contains('bad')||s.classList.contains('hint'))setStatus('','');
  }
});
$('skip').addEventListener('click',()=>{
  if(!done&&!rec[qi].ok)rec[qi].skipped=true;
  advance();
});

/* ---------- help: worked examples ---------- */
const I=h=>`<span class="im">${h}</span>`;
const F=(n,d)=>I(FR(n,d));
const M=(w,n,d)=>I(MX(w,n,d));
const HELP={
  day:{
    q:'Яку частину години становлять 5 хв?',
    steps:[
      `У годині 60 хв, це ціле. Частина дорівнює «скільки взяли» поділити на «скільки всього». Скільки взяли (5) пишемо вгорі, скільки всього (60) внизу: ${F(5,60)}.`,
      `Скорочуємо дріб. Шукаємо число, на яке діляться і 5, і 60. Це 5.`,
      `Ділимо чисельник і знаменник на 5: 5 : 5 = 1 і 60 : 5 = 12. Отримуємо ${F(1,12)}.`,
      `Перевіряємо: у чисел 1 і 12 немає спільного дільника, крім 1. Дріб скорочено до кінця.`],
    ans:`${F(5,60)} = ${F(1,12)}`,
    tip:'У завданні про добу ціле це 24 год, тому знаменник до скорочення буде 24.'
  },
  straight:{
    q:'Яку частину повного кута (360°) становить кут 40°?',
    steps:[
      `Повний кут дорівнює 360°, це ціле. Кут, який беремо, 40° пишемо вгорі, ціле 360° внизу: ${F(40,360)}.`,
      `Скорочуємо. Якщо відразу не видно найбільшого спільного дільника, скорочуйте частинами. Спершу обидва числа діляться на 10: 40 : 10 = 4 і 360 : 10 = 36. Маємо ${F(4,36)}.`,
      `Ще раз: 4 і 36 діляться на 4. 4 : 4 = 1 і 36 : 4 = 9. Маємо ${F(1,9)}.`,
      `Спільних дільників більше немає, відповідь готова.`],
    ans:`${F(40,360)} = ${F(1,9)}`,
    tip:'У завданні про розгорнутий кут ціле це 180°, тому знаменник до скорочення буде 180.'
  },
  right:{
    q:'Яку частину року становлять 8 місяців?',
    steps:[
      `У році 12 місяців, це ціле. Скільки взяли (8) пишемо вгорі, скільки всього (12) внизу: ${F(8,12)}.`,
      `Шукаємо число, на яке діляться і 8, і 12. Це 4.`,
      `Ділимо чисельник і знаменник на 4: 8 : 4 = 2 і 12 : 4 = 3. Отримуємо ${F(2,3)}.`,
      `Перевіряємо: у чисел 2 і 3 немає спільного дільника, крім 1. Дріб скорочено до кінця.`],
    ans:`${F(8,12)} = ${F(2,3)}`,
    tip:'У завданні про прямий кут ціле це 90°, тому знаменник до скорочення буде 90.'
  },
  fplus:{
    q:'Виконайте дії та скоротіть результат: '+F(5,16)+' + '+F(7,16),
    steps:[
      `Знаменники однакові (16), тому знаменник не змінюємо. Додаємо тільки чисельники: 5 + 7 = 12. Отримуємо ${F(12,16)}.`,
      `Скорочуємо результат. 12 і 16 діляться на 4: 12 : 4 = 3 і 16 : 4 = 4. Отримуємо ${F(3,4)}.`,
      `У чисел 3 і 4 немає спільного дільника, крім 1. Відповідь готова.`],
    ans:`${F(5,16)} + ${F(7,16)} = ${F(12,16)} = ${F(3,4)}`,
    tip:''
  },
  fminus:{
    q:'Виконайте дії та скоротіть результат: '+F(9,14)+' − '+F(5,14),
    steps:[
      `Знаменники однакові (14), тому знаменник не змінюємо. Віднімаємо чисельники: 9 − 5 = 4. Отримуємо ${F(4,14)}.`,
      `Скорочуємо результат. 4 і 14 діляться на 2: 4 : 2 = 2 і 14 : 2 = 7. Отримуємо ${F(2,7)}.`,
      `У чисел 2 і 7 немає спільного дільника, крім 1. Відповідь готова.`],
    ans:`${F(9,14)} − ${F(5,14)} = ${F(4,14)} = ${F(2,7)}`,
    tip:''
  },
  mplus:{
    q:'Виконайте дії та скоротіть результат: '+M(2,3,10)+' + '+M(4,1,10),
    steps:[
      `Додаємо окремо цілі частини: 2 + 4 = 6.`,
      `Додаємо окремо дробові частини. Знаменник 10 не змінюємо, чисельники додаємо: 3 + 1 = 4. Отримуємо ${F(4,10)}.`,
      `Складаємо разом: ${M(6,4,10)}.`,
      `Скорочуємо дробову частину: 4 і 10 діляться на 2, отримуємо ${F(2,5)}. Ціла частина 6 не змінюється: ${M(6,2,5)}.`],
    ans:`${M(2,3,10)} + ${M(4,1,10)} = ${M(6,4,10)} = ${M(6,2,5)}`,
    tip:'У клітинки пишемо три числа: цілу частину, чисельник і знаменник.'
  },
  mminus:{
    q:'Виконайте дії та скоротіть результат: '+M(7,9,16)+' − '+M(3,5,16),
    steps:[
      `Віднімаємо окремо цілі частини: 7 − 3 = 4.`,
      `Віднімаємо окремо дробові частини. Знаменник 16 не змінюємо, чисельники віднімаємо: 9 − 5 = 4. Отримуємо ${F(4,16)}.`,
      `Складаємо разом: ${M(4,4,16)}.`,
      `Скорочуємо дробову частину: 4 і 16 діляться на 4, отримуємо ${F(1,4)}. Ціла частина 4 не змінюється: ${M(4,1,4)}.`],
    ans:`${M(7,9,16)} − ${M(3,5,16)} = ${M(4,4,16)} = ${M(4,1,4)}`,
    tip:'У клітинки пишемо три числа: цілу частину, чисельник і знаменник.'
  },
  prod:{
    q:'Скоротіть: '+F('6 · 5','10 · 9'),
    steps:[
      `Нічого не множимо. Шукаємо в чисельнику і знаменнику числа зі спільним дільником. 6 і 9 діляться на 3: 6 : 3 = 2 і 9 : 3 = 3. Закреслюємо 6 і 9, пишемо 2 і 3.`,
      `Далі 5 і 10 діляться на 5: 5 : 5 = 1 і 10 : 5 = 2. Закреслюємо 5 і 10, пишемо 1 і 2.`,
      `Тепер маємо ${F('2 · 1','2 · 3')}. У чисельнику і знаменнику є однакові множники 2, скорочуємо їх на 2. Лишається ${F('1 · 1','1 · 3')}.`,
      `Множимо: у чисельнику 1 · 1 = 1, у знаменнику 1 · 3 = 3. Відповідь ${F(1,3)}.`],
    ans:`${F('6 · 5','10 · 9')} = ${F(1,3)}`,
    tip:'Якщо вийшов неправильний дріб (чисельник більший за знаменник), так і залишаємо, ціле число не виділяємо.'
  }
};
function helpKind(t){
  const x=t.text||'';
  if(x.indexOf('частину доби')>=0)return 'day';
  if(x.indexOf('розгорнутого')>=0)return 'straight';
  if(x.indexOf('прямого')>=0)return 'right';
  if(x==='Скоротіть:')return 'prod';
  const plus=(t.plain||'').indexOf('+')>=0;
  if(t.afmt==='mixed')return plus?'mplus':'mminus';
  return plus?'fplus':'fminus';
}
function openHelp(kind){
  const h=HELP[kind];if(!h)return;
  $('hq').innerHTML=h.q;
  $('hsteps').innerHTML=h.steps.map(x=>`<li>${x}</li>`).join('');
  $('hans').innerHTML='<span>Відповідь:</span>'+h.ans;
  $('htip').textContent=h.tip||'';$('htip').hidden=!h.tip;
  $('hov').hidden=false;$('hclose').focus({preventScroll:true});$('hov').querySelector('.hcard').scrollTop=0;
}
function closeHelp(){
  $('hov').hidden=true;
  const c=$('cells').querySelector('.cell:not([readonly])');if(c)c.focus({preventScroll:true});
}
$('help').addEventListener('click',()=>{if(Q[qi])openHelp(helpKind(Q[qi]))});
$('hclose').addEventListener('click',closeHelp);
$('hov').addEventListener('click',e=>{if(e.target===$('hov'))closeHelp()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('hov').hidden)closeHelp()});

/* ---------- review ---------- */
function reviewHtml(items){
  return items.map(it=>{
    const first=it.ok&&it.t===0,cls=first?'ok':it.ok?'ok2':'bad';
    const wrongs=it.w&&it.w.length?`<div class="w">Відповіді: ${it.w.map(esc).join(' · ')}</div>`:'';
    const note=it.s?'<div class="w">Пропущено</div>':'';
    return `<li class="rv ${cls}"><span class="mk">${it.ok?ICON_OK:ICON_BAD}</span><span class="q">${esc(it.q)}</span><span class="a">${esc(it.a)}</span>${wrongs||note}</li>`;
  }).join('');
}
function finish(){
  clearTimeout(timer);
  const items=rec.map(r=>({q:r.plain,a:r.expect,ok:r.ok,t:r.t,w:r.w,s:r.skipped&&!r.ok}));
  const first=items.filter(x=>x.ok&&x.t===0).length,solved=items.filter(x=>x.ok).length;
  const r={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:pname,at:new Date().toISOString(),
    ms:Date.now()-startAt,score:first,solved,total:items.length,items};
  show('end');
  $('score').textContent=`${first} з ${r.total}`;
  $('scoreSub').textContent=solved===r.total?'з першої спроби':`з першої спроби, розв'язано ${solved}`;
  $('review').innerHTML=reviewHtml(items);
  $('saved').textContent='Зберігаю результат…';
  saveResult(r).then(w=>{$('saved').textContent=w==='db'?'Результат збережено':'Результат збережено лише на цьому пристрої'});
  window.scrollTo(0,0);
}

/* ---------- results list ---------- */
const fmtDate=iso=>{try{return new Date(iso).toLocaleString('uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}};
let delArm=null;
async function openResults(){
  show('results');
  $('rlist').innerHTML='<div class="empty">Завантажую…</div>';$('rnote').textContent='';
  const local=localList();let remote=null;
  try{
    const db=await getCap('db');
    if(db){
      const snap=await withTimeout(db.collection('results').limit(500).get(),10000);
      remote=[];
      snap.docs.forEach(d=>{const x=d.data()||{};(x.attempts||[]).forEach(r=>remote.push(Object.assign({},r,{_uid:d.id})))});
    }
  }catch(e){}
  const map=new Map();
  (remote||[]).concat(local).forEach(r=>{if(r&&r.id&&!map.has(r.id))map.set(r.id,r)});
  const list=[...map.values()].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  $('rnote').textContent=remote?'':'Показано лише результати з цього пристрою';
  if(!list.length){$('rlist').innerHTML='<div class="empty">Результатів ще немає</div>';return}
  let owner=false;try{const u=await getCap('user');owner=!!(u&&await u.isOwner())}catch(e){}
  $('rlist').innerHTML=list.map(r=>{
    const mins=r.ms?Math.max(1,Math.round(r.ms/60000))+' хв':'';
    const del=owner&&r._uid?`<button type="button" class="next del" data-uid="${esc(r._uid)}">Видалити всі спроби учня</button>`:'';
    return `<details class="att"><summary><span class="nm">${esc(r.name||'Без імені')}</span><span class="dt">${esc(fmtDate(r.at))}${mins?' · '+mins:''}</span><span class="sc">${r.score} з ${r.total}</span></summary><ol class="review">${reviewHtml(r.items||[])}</ol>${del}</details>`;
  }).join('');
}
$('rlist').addEventListener('click',async e=>{
  const b=e.target.closest('.del');if(!b)return;
  if(delArm!==b){delArm=b;b.textContent='Точно видалити?';return}
  try{const db=await getCap('db');if(db){await db.doc('results/'+b.dataset.uid).delete();delArm=null;openResults()}}catch(err){b.textContent='Не вдалося видалити'}
});

/* ---------- wiring ---------- */
$('begin').addEventListener('click',begin);
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
$('again').addEventListener('click',begin);
$('toRes').addEventListener('click',openResults);
$('toRes2').addEventListener('click',openResults);
$('back').addEventListener('click',()=>show('start'));
$('nm').value=lsGet(LSN)||'';
show('start');
</script>

<div id="pm-panel" hidden>
  <button type="button" class="pm-b" data-a="cursor" title="Керувати уроком (не писати)"><svg viewBox="0 0 24 24"><path d="M5.5 3.5l6.2 16 2.4-6.6 6.6-2.4z"/></svg></button>
  <button type="button" class="pm-b" data-a="pen" title="Писати"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
  <button type="button" class="pm-b" data-a="eraser" title="Гумка"><svg viewBox="0 0 24 24"><path d="M15.6 4.6l3.8 3.8a1.8 1.8 0 010 2.5L11.2 19H7.6l-3-3a1.8 1.8 0 010-2.5l8.5-8.9a1.8 1.8 0 012.5 0z"/><path d="M8.8 10.8l5.4 5.4"/><path d="M11.5 19H20"/></svg></button>
  <div class="pm-sep"></div>
  <div class="pm-colors">
    <button type="button" class="pm-c" data-a="color" data-c="#e53935" style="background:#e53935" title="Червоний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1e5fd6" style="background:#1e5fd6" title="Синій"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#222222" style="background:#222" title="Чорний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1f9d55" style="background:#1f9d55" title="Зелений"></button>
  </div>
  <button type="button" class="pm-b" data-a="width" title="Тонка / товста лінія"><svg viewBox="0 0 24 24"><path d="M4 8h16" style="stroke-width:1.1"/><path d="M4 15.5h16" style="stroke-width:3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="smart" title="Рівні фігури: трикутник, коло, пряма"><svg viewBox="0 0 24 24"><path d="M3.5 19.5l6-12 6 12z"/><circle cx="17" cy="8" r="3.4"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="paper" title="Виділити прямокутник білим"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2" stroke-dasharray="3 2.6"/></svg></button>
  <button type="button" class="pm-b" data-a="board" title="Закрити весь екран білим"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" style="fill:currentColor;fill-opacity:.14"/></svg></button>
  <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
