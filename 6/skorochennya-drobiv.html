<script>
(function(){"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const add=(x,y)=>fr(x.n*y.d+y.n*x.d,x.d*y.d);
const sub=(x,y)=>fr(x.n*y.d-y.n*x.d,x.d*y.d);
const eq=(x,y)=>x.n===y.n&&x.d===y.d;
const mv=(w,n,d)=>fr(w*d+n,d);
const rnd=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];

const N=n=>`<span class="n">${n}</span>`;
const FR=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`<span class="mx">${N(w)}${FR(n,d)}</span>`;
const OP=s=>`<span class="op">${s}</span>`;
const parts=f=>{const n=Math.abs(f.n),d=f.d;return{w:Math.floor(n/d),r:n%d,n,d}};
function txt(f,fmt){
  const p=parts(f);
  if(p.d===1)return ''+p.n;
  if(fmt==='frac'||p.n<p.d)return p.n+'/'+p.d;
  return p.w+' '+p.r+'/'+p.d;
}
function afmtOf(v){return v.d===1?'int':v.n<v.d?'frac':'mixed'}

const DENS=[12,15,18,20,21,24,28,30,35,36,39,42,45,48,52,54,56,60,63,65,72,75,81,84,85,90];

// every task: {text, html, plain, value, afmt}
function q215(){ // part of a day
  const h=pick([2,3,4,6,8,9,10,12,14,15,16,18,20,21,22]);
  const text=`Яку частину доби становлять ${h} год?`;
  return{text,html:'',plain:text,value:fr(h,24),afmt:'frac'};
}
function q216(){ // part of a straight angle (180°)
  let d;do{d=rnd(2,178)}while(gcd(d,180)<2);
  const text=`Яку частину розгорнутого кута становить кут, градусна міра якого дорівнює ${d}°?`;
  return{text,html:'',plain:text,value:fr(d,180),afmt:'frac'};
}
function q217(){ // part of a right angle (90°)
  let d;do{d=rnd(2,88)}while(gcd(d,90)<2);
  const text=`Яку частину прямого кута становить кут, градусна міра якого дорівнює ${d}°?`;
  return{text,html:'',plain:text,value:fr(d,90),afmt:'frac'};
}
function q218a(op){ // same denominators, reduce the result
  let n,a,b,r;
  for(;;){
    n=pick(DENS);a=rnd(1,n-1);b=rnd(1,n-1);
    if(op==='−'&&a<=b)continue;
    r=op==='+'?a+b:a-b;
    if(r<=0||r>=n||gcd(r,n)<2)continue;
    break;
  }
  const v=op==='+'?add(fr(a,n),fr(b,n)):sub(fr(a,n),fr(b,n));
  return{text:'Виконайте дії та скоротіть результат:',html:FR(a,n)+OP(op)+FR(b,n),plain:`${a}/${n} ${op} ${b}/${n}`,value:v,afmt:'frac'};
}
function q218b(op){ // mixed numbers with the same denominator
  let n,w1,w2,n1,n2,r;
  for(;;){
    n=pick(DENS);w1=rnd(1,9);w2=rnd(1,9);n1=rnd(1,n-1);n2=rnd(1,n-1);
    if(op==='+'){if(n1+n2>=n)continue;r=n1+n2}
    else{if(w1<=w2||n1<=n2)continue;r=n1-n2}
    if(gcd(r,n)<2)continue;
    break;
  }
  const A=mv(w1,n1,n),B=mv(w2,n2,n),v=op==='+'?add(A,B):sub(A,B);
  return{text:'Виконайте дії та скоротіть результат:',html:MX(w1,n1,n)+OP(op)+MX(w2,n2,n),plain:`${w1} ${n1}/${n} ${op} ${w2} ${n2}/${n}`,value:v,afmt:'mixed'};
}
function q222(){ // reduce a fraction written as a product
  let a,b,c,d,v,ok=false;
  for(let i=0;i<30000&&!ok;i++){
    a=rnd(2,40);b=rnd(2,40);c=rnd(2,40);d=rnd(2,40);
    if(a===c||a===d||b===c||b===d)continue;
    const top=a*b,bot=c*d;
    if(top>700||bot>700||gcd(top,bot)<6)continue;
    const pairs=(gcd(a,c)>1)+(gcd(a,d)>1)+(gcd(b,c)>1)+(gcd(b,d)>1);
    if(pairs<2)continue;
    v=fr(top,bot);
    if(v.d<2||v.n>40||v.d>40)continue;
    ok=true;
  }
  if(!ok){a=4;b=5;c=25;d=6;v=fr(20,150)}
  return{text:'Скоротіть:',html:FR(`${a} · ${b}`,`${c} · ${d}`),plain:`(${a}·${b})/(${c}·${d})`,value:v,afmt:'frac'};
}
function buildTest(){
  const plan=[q215,q215,q216,q216,q217,q217,()=>q218a('+'),()=>q218a('−'),()=>q218b('+'),()=>q218b('−'),q222,q222];
  const used=new Set(),out=[];
  for(const g of plan){let t;for(let i=0;i<40;i++){t=g();if(!used.has(t.plain))break}used.add(t.plain);out.push(t)}
  return out;
}
// vals: strings from the cells. Returns {r:'ok'|'bad'|'hint'|'empty', k?}
function checkWrite(t,vals){
  const f=t.afmt,need=f==='int'?['v']:f==='frac'?['n','d']:['w','n','d'];
  for(const k of need)if(vals[k]==null||vals[k]==='')return{r:'empty',k};
  const x=k=>parseInt(vals[k],10);
  if(f==='int')return{r:eq(fr(x('v')),t.value)?'ok':'bad'};
  if(x('d')===0)return{r:'bad'};
  let val;
  if(f==='frac')val=fr(x('n'),x('d'));
  else{if(x('n')>=x('d'))return{r:'bad'};val=fr(x('w')*x('d')+x('n'),x('d'))}
  if(!eq(val,t.value))return{r:'bad'};
  return{r:gcd(x('n'),x('d'))===1?'ok':'hint'};
}
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU",
  authDomain: "math-5-892a5.firebaseapp.com",
  projectId: "math-5-892a5",
  storageBucket: "math-5-892a5.firebasestorage.app",
  messagingSenderId: "163114803328",
  appId: "1:163114803328:web:caf86c4e8b8c4b3b630665",
  measurementId: "G-E06VKZ2GP5"
};
const APP_ID = 'default-app-id';
const COLLECTION = 'results_skorochennya_6';        // ← НОВА для кожного тесту
const TEACHER_PASSWORD = '8019';
const FBV = '10.12.2';
const TEST_NAME = 'Скорочення дробів (6 клас)';

let fbPromise = null;
function fb(){
  if(!fbPromise){
    fbPromise = (async()=>{
      const [appM, authM, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
      ]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      await authM.signInAnonymously(authM.getAuth(app));
      return { db: fs.getFirestore(app), fs };
    })();
    fbPromise.catch(() => { fbPromise = null; }); // при збої — повторна спроба
  }
  return fbPromise;
}
const coll = (db, fs) => fs.collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION);

async function saveResult(rec){
  try { const { db, fs } = await fb(); await fs.setDoc(fs.doc(coll(db, fs), rec.id), rec); }
  catch(e){ console.warn('Save failed', e); }   // учням нічого не показувати
}
async function loadResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
}
fb().catch(() => {});   // підключення одразу при відкритті сторінки

let Q=[],ans=[],cur=0,sur='',nam='',marks=null,state={checked:false},seed0=(new URLSearchParams(location.search).get('v'));
let W;function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}resetWatch();
function leave(){if(!state||state.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);window.addEventListener('focus',back);
const touch=matchMedia('(pointer:coarse)').matches;
const KEYS={int:['v'],frac:['n','d'],mixed:['w','n','d']};
const full=(t,a)=>KEYS[t.afmt].every(k=>a[k]!=null&&a[k]!=='');
function isOk(t,a){
  if(!full(t,a))return false;const x=k=>parseInt(a[k],10),f=t.afmt;
  if(f==='int')return eq(fr(x('v')),t.value);
  if(!x('d')||gcd(x('n'),x('d'))!==1)return false;
  if(f==='frac')return eq(fr(x('n'),x('d')),t.value);
  return x('n')<x('d')&&eq(fr(x('w')*x('d')+x('n'),x('d')),t.value)}
const ansTxt=(t,a)=>!full(t,a)?'—':t.afmt==='int'?a.v:t.afmt==='frac'?a.n+'/'+a.d:a.w+' '+a.n+'/'+a.d;
const show=n=>{for(let i=0;i<3;i++)$('s'+i).hidden=i!==n};
function build(){
  const s=seed0?parseInt(seed0,10)||1:(Date.now()^Math.floor(Math.random()*1e9));seed0=null;
  rng=mulberry32(s);Q=buildTest();ans=Q.map(()=>({}));cur=0;marks=null;state={checked:false};resetWatch()}
function numsHtml(el,pre){
  $(el).innerHTML=Q.map((t,i)=>{let c='nb';
    if(marks)c+=marks[i]?' ok':' bad';else if(full(t,ans[i]))c+=' f';
    if(!pre&&i===cur)c+=' cur';return`<button class="${c}" data-i="${i}">${i+1}</button>`}).join('')}
function cellH(k,v){return`<input class="cell" data-k="${k}" maxlength="4" autocomplete="off" ${touch?'inputmode="none"':'inputmode="numeric"'} value="${esc(v||'')}" ${state.checked?'readonly':''}>`}
function render(){
  const t=Q[cur],a=ans[cur],f=t.afmt;
  const afr=cellH('n',a.n)+'<i></i>'+cellH('d',a.d);
  const cells=f==='int'?cellH('v',a.v):f==='frac'?`<span class="afr">${afr}</span>`:cellH('w',a.w)+`<span class="afr">${afr}</span>`;
  $('cnt').textContent=`Завдання ${cur+1} з ${Q.length}`;
  let h=`<div class="cond">${t.text}</div>${t.html?`<div class="expr">${t.html}<span>=</span></div>`:''}<div class="cells">${cells}</div>`;
  const c=$('card');c.className='card';
  if(state.checked){const g=marks[cur];c.classList.add(g?'ok':'bad');
    h+=`<div class="st ${g?'ok':'bad'}">${g?'✓ Правильно':'✗ Неправильно'}</div>`;
    if(!g)h+=`<div class="st">Правильна відповідь: ${esc(txt(t.value,t.afmt))}</div>`}
  c.innerHTML=h;
  if(state.checked)c.querySelectorAll('.cell').forEach(e=>e.classList.add(marks[cur]?'ok':'bad'));
  numsHtml('nums');
  $('bk').disabled=cur===0;$('nx').disabled=state.checked&&cur===Q.length-1;
  $('kp').hidden=!touch||state.checked;
  if(!touch&&!state.checked){const e=c.querySelector('.cell');if(e)e.focus()}}
function go(i){if(i<0)return;if(i>=Q.length){if(state.checked)return;toPre();return}cur=i;show(1);render()}
function toPre(){show(2);numsHtml('pn',1);const m=Q.filter((t,i)=>!full(t,ans[i])).length;
  $('pt').textContent=`Відповіли на ${Q.length-m} з ${Q.length}`+(m?`. Ви не завершили ${m} ${m===1?'завдання':'завдань'}`:'');
  $('chk').textContent=m?'Все одно перевірити':'Перевірити'}
function finish(){
  marks=Q.map((t,i)=>isOk(t,ans[i])?1:0);const score=marks.reduce((s,x)=>s+x,0);
  state.checked=true;const now=Date.now();back();
  saveResult({id:now+'_'+Math.random().toString(36).slice(2,8),name:`${sur} ${nam}`,surname:sur,firstName:nam,ts:now,date:new Date(now).toISOString(),
    score,max:Q.length,tasks:marks,qtext:Q.map(t=>t.plain),answers:Q.map((t,i)=>ansTxt(t,ans[i])),correct:Q.map(t=>txt(t.value,t.afmt)),
    durationSec:Math.round((now-W.t0)/1000),leaves:W.leaves,awaySec:W.awaySec,test:TEST_NAME});
  $('sum').hidden=false;$('sum').innerHTML=`<div><b>${esc(sur)} ${esc(nam)}</b><br><span class="st">${score} з ${Q.length}</span></div><button id="again" class="btn">Пройти ще раз</button><div class="sig" style="width:100%">Автор розробки <b>Ковтун Тетяна</b></div>`;
  $('again').onclick=()=>{build();$('sum').hidden=true;go(0)};
  go(0)}
$('go').onclick=()=>{sur=$('sur').value.trim();nam=$('nam').value.trim();
  $('sur').classList.toggle('e',!sur);$('nam').classList.toggle('e',!nam);
  if(!sur||!nam){$('err').textContent='Введіть прізвище та ім’я, щоб почати';return}
  $('err').textContent='';go(0)};
$('bk').onclick=()=>go(cur-1);$('nx').onclick=()=>go(cur+1);
$('bk2').onclick=()=>go(Q.length-1);$('chk').onclick=finish;
$('nums').onclick=$('pn').onclick=e=>{const b=e.target.closest('.nb');if(b)go(+b.dataset.i)};
$('card').addEventListener('input',e=>{const el=e.target;if(!el.dataset.k)return;
  el.value=el.value.replace(/\D/g,'').slice(0,4);ans[cur][el.dataset.k]=el.value;numsHtml('nums')});
let act=null;$('card').addEventListener('focusin',e=>{if(e.target.dataset.k)act=e.target});
$('kp').innerHTML=['1','2','3','⌫','4','5','6','0','7','8','9','→'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('kp').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
  const cs=[...$('card').querySelectorAll('.cell')];if(!act||!cs.includes(act))act=cs[0];const k=b.dataset.k;
  if(k==='→'){const i=cs.indexOf(act);if(i<cs.length-1){act=cs[i+1];act.focus()}else go(cur+1);return}
  if(k==='⌫')act.value=act.value.slice(0,-1);else if(act.value.length<4)act.value+=k;
  ans[cur][act.dataset.k]=act.value;numsHtml('nums')});
document.addEventListener('keydown',e=>{if($('s1').hidden||!$('adm').hidden)return;
  const inp=e.target.tagName==='INPUT';
  if(e.key==='Enter'&&(!inp||full(Q[cur],ans[cur])))go(cur+1);
  else if(!inp&&e.key==='ArrowRight')go(cur+1);else if(!inp&&e.key==='ArrowLeft')go(cur-1)});
/* ---- журнал ---- */
const mmss=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const fd=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
let rows=[];
function adm(h){$('admc').innerHTML=h;$('adm').hidden=false}
$('key').onclick=()=>{adm(`<b>Журнал учителя</b><div class="row"><input id="pw" type="password" class="inp" placeholder="Пароль"><button id="ok" class="btn">Увійти</button><button class="btn sec" id="cl">Закрити</button></div><div id="pe" class="err"></div>`);
  $('cl').onclick=()=>$('adm').hidden=true;
  $('ok').onclick=()=>{if($('pw').value===TEACHER_PASSWORD)load();else $('pe').textContent='Неправильний пароль'}};
async function load(){
  adm('Завантаження…');
  try{rows=await loadResults()}catch(e){adm('<div class="err">Не вдалося підключитися до бази результатів</div><button class="btn sec" id="cl">Закрити</button>');$('cl').onclick=()=>$('adm').hidden=true;return}
  const mx=Math.max(0,...rows.map(r=>r.max||0));
  let h=`<div class="row"><b style="flex:1">Результати (${rows.length})</b><button class="btn sec" id="rf">Оновити</button><button class="btn sec" id="cv">Завантажити CSV</button><button class="btn sec" id="cr">Очистити</button><button class="btn" id="cl">Закрити</button></div><div id="cm"></div><div class="tw"><table><tr><th>№<th>Прізвище та ім’я<th>Дата<th>Час<th>Виходів<th>Бал`+Array.from({length:mx},(_,i)=>`<th>${i+1}`).join('')+'</tr>';
  rows.forEach((r,i)=>{const n=r.max||mx,has=r.durationSec!=null;
    h+=`<tr><td>${i+1}<td class="l" data-i="${i}">${esc(r.name)}<td>${fd(r.ts)}<td ${has&&r.durationSec<120?'class="r" title="Дуже швидко"':''}>${has?mmss(r.durationSec):'—'}<td ${has&&r.leaves>=3?'class="r"':''} title="${has?'Поза вікном '+mmss(r.awaySec||0):''}">${has?r.leaves:'—'}<td><b>${r.score}/${r.max}</b>`+
      Array.from({length:mx},(_,k)=>k<n?`<td class="${r.tasks[k]?'g':'r'}">${r.tasks[k]?'✓':'✗'}`:'<td>').join('')+`</tr><tr class="det" id="d${i}" hidden><td colspan="${mx+6}">`+
      (r.qtext||[]).map((q,k)=>`${k+1}. ${esc(q)} — відповідь: <b>${esc((r.answers||[])[k])}</b>, правильно: <b>${esc((r.correct||[])[k])}</b>`).join('<br>')+'</tr>'});
  adm(h+'</table></div>');
  $('cl').onclick=()=>$('adm').hidden=true;$('rf').onclick=load;
  $('admc').querySelector('table').onclick=e=>{const c=e.target.closest('.l');if(c){const d=$('d'+c.dataset.i);d.hidden=!d.hidden}};
  $('cv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    let t='Прізвище та ім’я;Дата;Час (хв:с);Виходів з вікна;Поза вікном (хв:с);Бал'+Array.from({length:mx},(_,i)=>';Завд. '+(i+1)).join('')+'\n';
    rows.forEach(r=>{const h=r.durationSec!=null;t+=[q(r.name),new Date(r.ts).toLocaleString('uk-UA'),h?mmss(r.durationSec):'',h?r.leaves:'',h?mmss(r.awaySec||0):'',r.score+'/'+r.max].concat(Array.from({length:mx},(_,k)=>r.tasks&&r.tasks[k]!=null?(r.tasks[k]?'+':'-'):'')).join(';')+'\n'});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download='Скорочення_дробів_6клас_результати.csv';a.click()};
  $('cr').onclick=()=>{$('cm').innerHTML=`Видалити всі записи (${rows.length})? <button class="btn" id="y">Так, видалити</button> <button class="btn sec" id="n">Скасувати</button>`;
    $('n').onclick=()=>$('cm').innerHTML='';
    $('y').onclick=async()=>{try{await clearResults();load()}catch(e){$('cm').innerHTML='<span class="err">Не вдалося очистити записи. Перевірте правила бази Firebase</span>'}}}}
build();
})();
</script></body></html>
