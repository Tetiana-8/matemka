<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест. Узагальнення за п. 11–14. Дроби й відсотки (6 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c:#C2410C; --cd:#C2410C; --cl:#FFEDD5; --c2:#EA580C;
  --ok:#1e9e55; --okl:#dff5e8; --bad:#d6334a; --badl:#fde4e8;
  --bg1:#FFF9F1; --bg2:#FFF9F1; --ch:#9A3412; --acc:#EA580C; --hd:#FFF1E3; --ln:#FED7AA; --bl:#1d4ed8; --tx:#431407;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow:hidden}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
i{font-family:'Times New Roman',serif}
#app{height:100dvh;max-width:760px;margin:0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.top{flex:none;padding:8px 44px 8px 10px;background:var(--hd);border:1px solid var(--ln);border-radius:14px}
.cnt{font-weight:800;font-size:1.05rem;color:var(--cd);margin:2px 0 6px}
.strip{display:flex;flex-wrap:wrap;gap:5px}
.strip button{width:30px;height:30px;border-radius:8px;border:2px solid #FDBA74;background:#fff;font-weight:800;font-size:.8rem;color:var(--tx);padding:0}
.strip button.a{background:var(--acc);border-color:var(--acc);color:#fff}
.strip button.cur{border-width:4px;border-color:var(--ch)}
.strip button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.strip button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.strip button.cur.ok{border-color:#0d6b37}.strip button.cur.bad{border-color:#8f1225}
.strip.big button{width:48px;height:48px;font-size:1rem;border-radius:10px}
.strip.big button.miss{border-color:var(--bad);color:var(--bad);background:#fff7f8}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;box-shadow:0 4px 18px rgba(194,65,12,.14);padding:16px 18px;flex:1 1 auto;min-height:0;overflow-y:auto}
.card.center.st{background:var(--hd)}
.card.center{display:flex;flex-direction:column;justify-content:center}
.ttl{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--cd);margin-bottom:14px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--c);display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
.q{font-size:1.4rem;font-weight:700;line-height:1.7;margin-bottom:16px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-size:.92em}
.fr>span{padding:0 4px}
.fr>span:first-child{border-bottom:2px solid currentColor}
.arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arow label{font-weight:800;font-size:1.1rem}
.ansin{width:170px;max-width:100%;font:inherit;font-size:1.35rem;font-weight:700;text-align:center;padding:8px 10px;border:3px solid #FDBA74;border-radius:12px;outline:none;background:#fff;color:var(--tx)}
.ansin:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--cl)}
.ansin.ok{border-color:var(--ok);background:var(--okl)}
.ansin.bad{border-color:var(--bad);background:var(--badl)}
.unit{font-weight:700;color:#8a5a3c}
.fansw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fansw>label{font-weight:800;font-size:1.1rem}
.fbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.fbox small,.fr1 small{font-size:.72rem;color:#8a5a3c;font-weight:700}
.ffr{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.fr1{display:flex;align-items:center;gap:8px}
.ffr .bar{width:78px;height:4px;background:var(--tx);border-radius:2px}
.fin{width:78px;font:inherit;font-size:1.35rem;font-weight:700;text-align:center;padding:8px 4px;border:3px solid #FDBA74;border-radius:12px;outline:none;background:#fff;color:var(--tx)}
.fin:focus{border-color:var(--c);box-shadow:0 0 0 3px var(--cl)}
.fin.ok{border-color:var(--ok);background:var(--okl)}
.fin.bad{border-color:var(--bad);background:var(--badl)}
.fin.part{border-color:var(--acc);background:var(--cl)}
.fb.part{color:var(--ch)}
.shot{font-weight:800;font-size:.95rem;color:var(--ch);background:var(--cl);border:1px dashed var(--acc);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.strip button.part{background:#FDBA74;border-color:var(--acc);color:#431407}
table.j td.h{color:var(--acc);font-weight:800}
.hint{margin-top:10px;font-size:.85rem;color:#8a5a3c}
.fb{margin-top:14px;font-weight:800;font-size:1.05rem}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.mrowq{margin-bottom:14px}
.mrowq .t{font-size:1.2rem;font-weight:700;line-height:1.6;margin-bottom:6px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:130px;min-height:46px;padding:8px 18px;border-radius:12px;border:3px solid #FDBA74;background:#fff;font-size:1.05rem;font-weight:800;color:var(--tx)}
.opt.sel{background:var(--c);border-color:var(--c);color:#fff}
.opt.ok{background:var(--okl);border-color:var(--ok);color:#0d6b37}
.opt.bad{background:var(--badl);border-color:var(--bad);color:#8f1225}
.nav{flex:none;display:flex;gap:10px}
.btn{min-height:46px;padding:10px 20px;border-radius:14px;border:none;background:var(--c);color:#fff;font-weight:800;font-size:1.05rem}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--cd);border:2px solid var(--c)}
.btn.green{background:var(--c)}
.btn:hover:not(:disabled){background:var(--ch)}
.btn.ghost:hover:not(:disabled){background:var(--cl);color:var(--ch)}
.nav .btn{flex:1}
.kb{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{min-height:44px;border-radius:10px;border:2px solid #FDBA74;background:#fff;font-size:1.25rem;font-weight:800;color:var(--tx);padding:0}
.key:active{background:var(--cl)}
.bl{color:var(--bl)}
.key.w2{grid-column:span 2}
.key.go{background:var(--c);border-color:var(--c);color:#fff}
.h1{font-size:1.6rem;font-weight:800;color:var(--cd);margin:0 0 14px;line-height:1.25}
.inp{width:100%;font:inherit;font-size:1.2rem;font-weight:700;padding:11px 14px;border:3px solid #FDBA74;border-radius:12px;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--c)}
.inp.bad{border-color:var(--bad);background:var(--badl)}
.msg{color:var(--bad);font-weight:700;min-height:1.3em;margin:4px 0 10px}
.sum{font-size:1.1rem;font-weight:800}
.sum .score{color:var(--cd);font-size:1.4rem;white-space:nowrap}
.rrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
#keyBtn{position:fixed;top:8px;right:8px;z-index:50;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.7);opacity:.4;font-size:1rem;padding:0}
#keyBtn:hover{opacity:.9}
.sign{flex:none;text-align:center;font-size:.8rem;color:#8a5a3c;background:var(--hd);border:1px solid var(--ln);border-radius:10px;padding:5px}
#modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(67,20,7,.5);align-items:center;justify-content:center;padding:10px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;padding:18px;max-width:1100px;width:100%;max-height:94dvh;overflow:auto}
.mbox.small{max-width:360px}
.mbox h3{margin:0 0 12px;color:var(--cd)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mrow .btn{min-height:40px;padding:8px 14px;font-size:.95rem}
table.j{border-collapse:collapse;width:100%;font-size:.88rem}
table.j th,table.j td{border:1px solid #FED7AA;padding:5px 7px;text-align:center;white-space:nowrap}
table.j th{background:var(--cl);position:sticky;top:0}
table.j td.nm{text-align:left;cursor:pointer;color:var(--ch);font-weight:800;white-space:normal}
table.j td.p{color:var(--ok);font-weight:800}table.j td.m{color:var(--bad);font-weight:800}
table.j td.red{color:var(--bad);font-weight:800}
table.j tr.det td{text-align:left;white-space:normal;background:#FFF9F1}
.jwrap{overflow:auto;max-height:62dvh}
@media (max-width:480px){
  .q{font-size:1.25rem;line-height:1.65}
  .card{padding:14px}
  .strip button{width:28px;height:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<button id="keyBtn" title="Журнал учителя" aria-label="Журнал учителя">🔑</button>
<div id="modal"></div>

<script>
(function(){ "use strict";

/*GEN_START*/
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d}var g=gcd(n,d)||1;return {n:n/g,d:d/g}}
function rmul(x,y){return R(x.n*y.n,x.d*y.d)}
function rdiv(x,y){return R(x.n*y.d,x.d*y.n)}
function req(x,y){return x.n===y.n&&x.d===y.d}
function fmt(x){if(x.d===1)return String(x.n);var w=Math.floor(x.n/x.d),m=x.n-w*x.d;return w>0?(w+' '+m+'/'+x.d):(m+'/'+x.d)}
function frH(a,b){return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'}
function mxH(w,a,b){return w+frH(a,b)}
function parseInput(s){
  s=String(s==null?'':s).replace(/\u00a0/g,' ').trim().replace(/,/g,'.');
  var m;
  if(/^\d+$/.test(s))return R(+s,1);
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))&&+m[2]>0)return R(+m[1],+m[2]);
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))&&+m[3]>0)return R(+m[1]*+m[3]+ +m[2],+m[3]);
  if((m=s.match(/^(\d+)\.(\d{1,6})$/)))return R(+(m[1]+m[2]),Math.pow(10,m[2].length));
  return null;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkR(seed){
  var f=mulberry32(seed);
  return {
    ri:function(a,b){return a+Math.floor(f()*(b-a+1))},
    pick:function(arr){return arr[Math.floor(f()*arr.length)]},
    shuf:function(arr){var x=arr.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(f()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
  };
}
function coprimeA(r,b){var a;do{a=r.ri(1,b-1)}while(gcd(a,b)!==1);return a}
function pf(r,lo,hi){var b=r.ri(lo,hi),a=coprimeA(r,b);return {a:a,b:b,v:R(a,b),h:frH(a,b),t:a+'/'+b}}
function mixed(r,lo,hi){var b=r.ri(lo,hi),a=coprimeA(r,b),w=r.ri(1,4);return {w:w,a:a,b:b,v:R(w*b+a,b),h:mxH(w,a,b),t:w+' '+a+'/'+b}}
var PCTS=[5,10,12,15,20,25,30,35,40,45,60,75];
function pctN(r,p,lo,hi){var step=100;return step*r.ri(Math.ceil(lo/step),Math.floor(hi/step))}

function makeTasks(r){
  var T=[],x,y,z,a,b,k,p,N,X,sc;
  function add(o){o.n=T.length+1;T.push(o)}

  // 1–3: множення
  b=r.pick([4,5,6,7,8,9,10,12]);a=coprimeA(r,b);k=r.ri(2,12);
  add({id:1,title:'Помножте дроби',kind:'frac',q:k+' · '+frH(a,b)+' =',text:k+' · '+a+'/'+b+' =',ans:R(k*a,b),p:{n:k,a:a,b:b}});
  x=pf(r,3,9);y=pf(r,3,9);
  add({id:2,title:'Помножте дроби',kind:'frac',q:x.h+' · '+'<span class="bl">'+y.h+'</span>'+' =',text:x.t+' · '+y.t+' =',ans:rmul(x.v,y.v),p:{a:x.a,b:x.b,c:y.a,d:y.b}});
  x=mixed(r,2,6);y=mixed(r,2,6);
  add({id:3,title:'Помножте дроби',kind:'frac',q:x.h+' · '+'<span class="bl">'+y.h+'</span>'+' =',text:x.t+' · '+y.t+' =',ans:rmul(x.v,y.v),p:{w1:x.w,a1:x.a,b1:x.b,w2:y.w,a2:y.a,b2:y.b}});

  // 4–6: ділення
  x=pf(r,3,9);k=r.ri(2,12);
  add({id:4,title:'Поділіть дроби',kind:'frac',q:k+' : '+'<span class="bl">'+x.h+'</span>'+' =',text:k+' : '+x.t+' =',ans:rdiv(R(k),x.v),p:{n:k,a:x.a,b:x.b}});
  x=pf(r,3,9);y=pf(r,3,9);
  add({id:5,title:'Поділіть дроби',kind:'frac',q:x.h+' : '+'<span class="bl">'+y.h+'</span>'+' =',text:x.t+' : '+y.t+' =',ans:rdiv(x.v,y.v),p:{a:x.a,b:x.b,c:y.a,d:y.b}});
  x=mixed(r,2,6);y=mixed(r,2,6);
  add({id:6,title:'Поділіть дроби',kind:'frac',q:x.h+' : '+'<span class="bl">'+y.h+'</span>'+' =',text:x.t+' : '+y.t+' =',ans:rdiv(x.v,y.v),p:{w1:x.w,a1:x.a,b1:x.b,w2:y.w,a2:y.a,b2:y.b}});

  // 7: дріб від числа
  b=r.ri(3,12);a=coprimeA(r,b);k=r.ri(3,30);N=b*k;
  add({id:7,title:'Знайдіть дріб від числа',kind:'num',q:frH(a,b)+' від '+N+' =',text:a+'/'+b+' від '+N+' =',ans:R(a*k),p:{a:a,b:b,N:N}});

  // 8: відсотки від числа
  p=r.pick(PCTS);N=pctN(r,p,40,900);
  add({id:8,title:'Знайдіть відсотки від числа',kind:'num',q:p+' % від '+N+' грн =',text:p+' % від '+N+' грн =',unit:'грн',ans:R(p*N/100),p:{p:p,N:N}});

  // 9: число за дробом
  b=r.pick([4,5,6,8,9,10,12]);a=coprimeA(r,b);k=r.ri(3,15);X=a*k;
  sc=r.pick([{g:'стрічки',u:'см',w:'всієї стрічки'},{g:'дороги',u:'км',w:'всієї дороги'},{g:'мотузки',u:'м',w:'всієї мотузки'}]);
  add({id:9,title:'Знайдіть число за його дробом',kind:'num',q:frH(a,b)+' '+sc.g+' — '+X+' '+sc.u+'. Яка довжина '+sc.w+'?',text:a+'/'+b+' '+sc.g+' — '+X+' '+sc.u+'. Яка довжина '+sc.w+'?',unit:sc.u,ans:R(b*k),p:{a:a,b:b,X:X}});

  // 10: число за відсотками
  p=r.pick(PCTS);N=pctN(r,p,40,800);X=p*N/100;
  add({id:10,title:'Знайдіть число за відсотками',kind:'num',q:p+' % числа = '+X+'. Яке це число?',text:p+' % числа = '+X+'. Яке це число?',ans:R(N),p:{p:p,X:X}});

  // 11: вираз
  var A,B,C,V,tries=0;
  do{A=mixed(r,2,4);B=mixed(r,2,4);C=mixed(r,2,4);V=rdiv(rmul(A.v,B.v),C.v);tries++}
  while(tries<200&&(V.n/V.d>30||V.d>12));
  add({id:11,star:true,title:'Знайдіть значення виразу',kind:'frac',q:A.h+' · '+B.h+' : '+'<span class="bl">'+C.h+'</span>'+' =',text:A.t+' · '+B.t+' : '+C.t+' =',ans:V,p:{w1:A.w,a1:A.a,b1:A.b,w2:B.w,a2:B.a,b2:B.b,w3:C.w,a3:C.a,b3:C.b}});

  // 12: множимо чи ділимо
  var mulRow,divRow,m1,d1;
  b=r.pick([3,4,5,6,7,8,10]);a=coprimeA(r,b);p=r.pick(PCTS);
  if(r.ri(0,1)){
    N=b*r.ri(4,30);
    mulRow={t:'Знайти '+frH(a,b)+' від '+N+' кг —',text:'Знайти '+a+'/'+b+' від '+N+' кг —',c:0};
  }else{
    N=pctN(r,p,100,700);
    mulRow={t:'Знайти '+p+' % від '+N+' грн —',text:'Знайти '+p+' % від '+N+' грн —',c:0};
  }
  b=r.pick([3,4,5,6,7,8,10]);a=coprimeA(r,b);p=r.pick(PCTS);
  if(r.ri(0,1)){
    k=r.ri(3,20);
    divRow={t:frH(a,b)+' маси = '+(a*k)+' кг. Маса —',text:a+'/'+b+' маси = '+(a*k)+' кг. Маса —',c:1};
  }else{
    N=pctN(r,p,100,700);
    divRow={t:p+' % ціни = '+(p*N/100)+' грн. Ціна —',text:p+' % ціни = '+(p*N/100)+' грн. Ціна —',c:1};
  }
  var rows=r.shuf([mulRow,divRow]);
  add({id:12,title:'Множимо чи ділимо?',kind:'mc',q:'',text:'Множимо чи ділимо? '+rows.map(function(o,i){return String.fromCharCode(97+i)+') '+o.text}).join(' '),opts:['Множимо','Ділимо'],rows:rows,ans:null,ansText:rows.map(function(o){return ['Множимо','Ділимо'][o.c]}).join(' | ')});

  // 13: бібліотека
  b=r.pick([3,4,5,6,8,10,12]);a=coprimeA(r,b);N=b*r.ri(40,200);
  add({id:13,title:'Задача',kind:'num',q:'У бібліотеці '+N+' книжок. '+frH(a,b)+' з них — підручники. Скільки підручників?',text:'У бібліотеці '+N+' книжок. '+a+'/'+b+' з них — підручники. Скільки підручників?',ans:R(a*N/b),p:{a:a,b:b,N:N}});

  // 14: яблука
  p=r.pick([10,15,20,25,30,35,40,45,60]);N=pctN(r,p,200,900);
  add({id:14,title:'Задача',kind:'num',q:'У магазині було '+N+' кг яблук. Продали '+p+' % яблук. Скільки кілограмів залишилось?',text:'У магазині було '+N+' кг яблук. Продали '+p+' % яблук. Скільки кілограмів залишилось?',unit:'кг',ans:R(N-p*N/100),p:{p:p,N:N}});

  // 15: маршрут
  var L,first,rest,ok=false,g=0;
  while(!ok&&g<500){
    g++;b=r.pick([5,8,10,12]);a=coprimeA(r,b);k=r.ri(5,20);L=b*k;first=a*k;rest=L-first;p=r.pick([10,20,25,30,40,50,60,75]);
    ok=(rest*p%100===0);
  }
  add({id:15,star:true,title:'Задача',kind:'num',q:'Маршрут — '+L+' км. У перший день пройшли '+frH(a,b)+' маршруту, в другий — '+p+' % решти. Скільки км пройшли в другий день?',text:'Маршрут — '+L+' км. У перший день пройшли '+a+'/'+b+' маршруту, в другий — '+p+' % решти. Скільки км пройшли в другий день?',unit:'км',ans:R(rest*p/100),p:{L:L,a:a,b:b,p:p}});

// Відповідь-дріб складається з трьох клітинок: [ціле, чисельник, знаменник]
function fracVal(a){
  const w=a[0], n=a[1], d=a[2];
  if(w==='' && n==='' && d==='') return null;
  if((n==='') !== (d==='')) return null;        // чисельник і знаменник — разом
  const W = w==='' ? 0 : +w;
  if(n==='') return R(W,1);                     // лише ціле число
  if(+d===0) return null;
  return R(W*(+d)+(+n), +d);
}
function fracStr(a){
  const w=a[0], n=a[1], d=a[2];
  const fr = (n!==''||d!=='') ? (n===''?'?':n)+'/'+(d===''?'?':d) : '';
  const s = ((w!==''?w:'')+(w!==''&&fr?' ':'')+fr).trim();
  return s||'—';
}
function isAns(i){
  const t = S.tasks[i], a = S.ans[i];
  if(t.kind==='mc') return a.every(v=>v>=0);
  if(t.kind==='frac') return a[0]!=='' || (a[1]!=='' && a[2]!=='');
  return String(a).trim()!=='';
}
function isOk(i){
  const t = S.tasks[i], a = S.ans[i];
  if(t.kind==='mc') return t.rows.every((r,j)=>a[j]===r.c);
  const v = t.kind==='frac' ? fracVal(a) : parseInput(a);
  return !!v && req(v, t.ans);
}
// Правильна за значенням відповідь-дріб оцінюється повністю, лише якщо дріб скорочено
// і цілу частину виділено (не 3/2, а 1 1/2). Інакше -0,5 бала.
function fracIssues(i){
  const t=S.tasks[i], a=S.ans[i], o={unred:false,improper:false};
  if(t.kind!=='frac'||a[1]===''||a[2]==='') return o;
  const n=+a[1], d=+a[2];
  o.unred = gcd(n,d)>1;
  o.improper = n>=d;
  return o;
}
function grade(i){
  if(!isOk(i)) return 0;
  const f=fracIssues(i);
  return (f.unred||f.improper) ? 0.5 : 1;
}
const sc2 = x => String(x).replace('.',',');

function answerText(i){

  if(t.kind==='mc') return a.map(v=>v<0?'—':t.opts[v]).join(' | ');
  if(t.kind==='frac') return fracStr(a);
  return String(a).trim()||'—';
}

    modal.innerHTML = '<div class="mbox"><h3>Журнал учителя</h3><div class="msg">Не вдалося підключитися до бази результатів</div><div class="mrow"><button class="btn" data-j="refresh">Оновити</button><button class="btn ghost" data-j="close">Закрити</button></div></div>';
    return;
  }
  drawJournal(msg);
}
function drawJournal(msg){
  const maxN = JR.reduce((m,r)=>Math.max(m, r.max||(r.tasks?r.tasks.length:0)), 0);
  let h = '<div class="mbox"><h3>Журнал учителя: '+esc(TEST_NAME)+' ('+JR.length+')</h3>'+
    '<div class="mrow"><button class="btn" data-j="refresh">Оновити</button><button class="btn" data-j="csv">Завантажити CSV</button><button class="btn ghost" data-j="clear">Очистити</button><button class="btn ghost" data-j="close">Закрити</button></div>'+
    '<div class="msg" id="jmsg">'+esc(msg||'')+'</div>'+
    '<div class="jwrap"><table class="j"><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
  for(let i=1;i<=maxN;i++) h += '<th>'+i+'</th>';
  h += '</tr></thead><tbody>';
  JR.forEach((r,ri)=>{
    const hasT = typeof r.durationSec==='number', hasL = typeof r.leaves==='number';
    const tcls = hasT && r.durationSec<120 ? ' class="red" title="Дуже швидко"' : '';
    const lcls = hasL && r.leaves>=3 ? ' class="red"' : '';
    const ltitle = hasL ? ' title="Поза вікном: '+mmss(r.awaySec||0)+'"' : '';
    h += '<tr><td>'+(ri+1)+'</td><td class="nm" data-j="det" data-i="'+ri+'">'+esc(r.name)+'</td><td>'+esc(r.ts?new Date(r.ts).toLocaleString('uk-UA'):'')+'</td>'+
      '<td'+tcls+'>'+(hasT?mmss(r.durationSec):'—')+'</td><td'+lcls+ltitle+'>'+(hasL?r.leaves:'—')+'</td><td><b>'+esc(sc2(r.score))+'/'+esc(r.max)+'</b></td>';
    for(let i=0;i<maxN;i++){
      const m = r.tasks && r.tasks[i];
      h += (m===undefined) ? '<td></td>' : (m===1 ? '<td class="p">✓</td>' : (m>0 ? '<td class="h" title="Дріб не скорочено або не виділено цілу частину">½</td>' : '<td class="m">✗</td>'));
    }
    h += '</tr><tr class="det" id="det'+ri+'" style="display:none"><td colspan="'+(6+maxN)+'">';
    const n = r.max||(r.tasks?r.tasks.length:0);
    for(let i=0;i<n;i++){
      h += '<div>'+((r.tasks&&r.tasks[i]===1)?'✓':((r.tasks&&r.tasks[i]>0)?'½ (дріб не скорочено / не виділено цілу частину)':'✗'))+' <b>'+(i+1)+'.</b> '+esc(r.qtext&&r.qtext[i])+' — відповідь учня: <b>'+esc(r.answers&&r.answers[i])+'</b>; правильно: <b>'+esc(r.correct&&r.correct[i])+'</b></div>';
    }
    h += '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  modal.innerHTML = h;
}
function downloadCSV(){
  const maxN = JR.reduce((m,r)=>Math.max(m, r.max||(r.tasks?r.tasks.length:0)), 0);
  const q = v => { v = String(v==null?'':v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const head = ['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал'];
  for(let i=1;i<=maxN;i++) head.push('Завд. '+i);
  const lines = [head.map(q).join(';')];
  JR.forEach(r=>{
    const row = [r.name, r.ts?new Date(r.ts).toLocaleString('uk-UA'):'',
      typeof r.durationSec==='number'?mmss(r.durationSec):'',
      typeof r.leaves==='number'?r.leaves:'',
      typeof r.awaySec==='number'?mmss(r.awaySec):'',
      sc2(r.score)+'/'+r.max];
    for(let i=0;i<maxN;i++) row.push(r.tasks&&r.tasks[i]!==undefined ? (r.tasks[i]===1?'+':(r.tasks[i]>0?'0,5':'-')) : '');
    lines.push(row.map(q).join(';'));
  });
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Узагальнення_11-14_Дроби_і_відсотки_6клас_результати.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
modal.addEventListener('click', async e=>{
  const b = e.target.closest('[data-j]');
  if(!b){ if(e.target===modal) closeModal(); return; }
  const j = b.dataset.j;
  if(j==='close') closeModal();
  else if(j==='login'){
    if(($('pw').value||'')===TEACHER_PASSWORD) showJournal();
    else $('jmsg').textContent = 'Неправильний пароль';
  }
  else if(j==='refresh') showJournal();
  else if(j==='csv') downloadCSV();
  else if(j==='det'){ const d=$('det'+b.dataset.i); if(d) d.style.display = d.style.display==='none'?'table-row':'none'; }
  else if(j==='clear'){
    $('jmsg').innerHTML = 'Видалити всі записи ('+JR.length+')? <button class="btn" style="min-height:34px;padding:4px 12px" data-j="clear-yes">Так, видалити</button> <button class="btn ghost" style="min-height:34px;padding:4px 12px" data-j="clear-no">Скасувати</button>';
  }
  else if(j==='clear-no'){ $('jmsg').textContent=''; }
  else if(j==='clear-yes'){
    try { await clearResults(); await showJournal('Записи видалено'); }
    catch(err){ $('jmsg').textContent = 'Не вдалося очистити записи. Перевірте правила бази Firebase'; }
  }
});
modal.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='pw'){ if(e.target.value===TEACHER_PASSWORD) showJournal(); else $('jmsg').textContent='Неправильний пароль'; }
});

build(false);
render();
})();

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
