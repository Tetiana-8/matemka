<style>

footer{flex:none;background:var(--hdr);border-top:2px solid var(--l1);text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:3px 0 5px}

.modal{background:#fff;border:2px solid var(--l1);border-radius:1.2rem;max-width:56rem;width:100%;max-height:92%;overflow:auto;padding:1.2rem 1.5rem;font-size:1rem;line-height:1.55}

<body>

<script>
(function(){
"use strict";

/* ===================== Налаштування ===================== */
const TARGET=28;            // скільки балів дає оцінку 12 (28 завдань без помилок)
const LESSON_MIN=45;        // тривалість уроку, хв
const MAXGRADE=12;
const MIN_FOR_FINISH=6;     // з якого завдання з'являється «Завершити»
const APP_ID='default-app-id', COLLECTION='results_fractions_summary_6', TEACHER_PASSWORD='8019', FBV='10.12.2';
const TEST_NAME='Підсумковий урок. Звичайні дроби (6 клас)';
const FIREBASE_CONFIG = { apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU", authDomain: "math-5-892a5.firebaseapp.com", projectId: "math-5-892a5", storageBucket: "math-5-892a5.firebasestorage.app", messagingSenderId: "163114803328", appId: "1:163114803328:web:caf86c4e8b8c4b3b630665", measurementId: "G-E06VKZ2GP5" };
let fbPromise=null;
function fb(){ if(!fbPromise){ fbPromise=(async()=>{ const [appM,authM,fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]); const app=appM.initializeApp(FIREBASE_CONFIG); await authM.signInAnonymously(authM.getAuth(app)); return {db:fs.getFirestore(app),fs}; })(); fbPromise.catch(()=>{fbPromise=null}); } return fbPromise; }
const coll=(db,fs)=>fs.collection(db,'artifacts',APP_ID,'public','data',COLLECTION);
async function saveResult(rec){ try{ const {db,fs}=await fb(); await fs.setDoc(fs.doc(coll(db,fs),rec.id),rec);}catch(e){console.warn('Save failed',e)} }
async function loadResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); const out=[]; snap.forEach(d=>out.push(d.data())); return out.sort((a,b)=>(b.ts||0)-(a.ts||0)); }
async function clearResults(){ const {db,fs}=await fb(); const snap=await fs.getDocs(coll(db,fs)); await Promise.all(snap.docs.map(d=>fs.deleteDoc(d.ref))); }
fb().catch(()=>{});

/* ===================== Випадкові числа ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=parseInt(new URLSearchParams(location.search).get('v'))||Math.floor(Math.random()*1e9)+1;
let R=mulberry32(SEED);
const rnd=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const red=(n,d)=>{const g=gcd(n,d);return{n:n/g,d:d/g}};
const fr=(n,d,c)=>`<span class="fr${c?' '+c:''}"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d,c)=>w>0?`<span class="mx${c?' '+c:''}"><b>${w}</b>${fr(n,d)}</span>`:fr(n,d,c);
function coprime(qmin,qmax){let p,q;do{q=rnd(qmin,qmax);p=rnd(1,q-1)}while(gcd(p,q)!==1);return[p,q]}
const slotsIn=(h)=>(h.match(/\[\[\d\]\]/g)||[]).length;

/* ===================== Станції ===================== */
const LV=[
 {emo:'🧩',name:'Основна властивість дробу',p:'п. 7'},
 {emo:'✂️',name:'Скорочення дробів',p:'п. 8'},
 {emo:'🛡️',name:'Нескоротні дроби',p:'п. 8'},
 {emo:'🤝',name:'Спільний знаменник',p:'п. 9'},
 {emo:'⚖️',name:'Порівняння дробів',p:'п. 9'},
 {emo:'🎯',name:'Найменший спільний знаменник',p:'п. 9'},
 {emo:'➕',name:'Додавання і віднімання дробів',p:'п. 10'},
 {emo:'🍰',name:'Мішані числа',p:'п. 10'},
 {emo:'🔍',name:'Рівняння',p:''},
 {emo:'📖',name:'Текстові задачі',p:''}
];
const mixedOf=(n,d)=>{const r=red(n,d);return{w:Math.floor(r.n/r.d),n:r.n%r.d,d:r.d}};
function stepsAdd(n1,b,n2,d,sub){
  const L=lcm(b,d),a1=n1*L/b,a2=n2*L/d,s=sub?a1-a2:a1+a2,r=red(s,L),sg=sub?'−':'+';
  return `${fr(n1,b)} ${sg} ${fr(n2,d,'b2')} = ${fr(a1,L)} ${sg} ${fr(a2,L,'b2')} = ${fr(s,L)}`+(r.d!==L?` = ${fr(r.n,r.d)}`:'');
}

/* ----- Станція 1 ----- */
function g1a(){const d=rnd(3,9),n=rnd(1,d-1),k=rnd(2,9);
  return{q:`Яке число пропущено? ${fr(n,d)} = ${fr('[[0]]',d*k)}`,a:{kind:'slots',v:[n*k]},
   hint:`Чисельник і знаменник множать на одне й те саме число. На яке число помножили ${d}, щоб отримати ${d*k}?`,
   expl:`${d}·${k} = ${d*k}, тому й чисельник множимо на ${k}: ${n}·${k} = ${n*k}.`,chk:()=>n*k*d===n*(d*k)}}
function g1b(){const d=rnd(2,9),n=rnd(1,d-1),k=rnd(2,9);
  return{q:`Яке число пропущено? ${fr(n*k,d*k)} = ${fr('[[0]]',d)}`,a:{kind:'slots',v:[n]},
   hint:`Чисельник і знаменник ділять на одне й те саме число. На яке число поділили ${d*k}, щоб отримати ${d}?`,
   expl:`${d*k} : ${k} = ${d}, тому й чисельник ділимо на ${k}: ${n*k} : ${k} = ${n}.`,chk:()=>n*(d*k)===n*k*d}}
function g1c(){const d=rnd(3,9),n=rnd(1,d-1),k=rnd(2,6);
  let n2=n*k,d2=d*k;if(R()<.5){if(R()<.5)n2+=pick([1,2,k]);else d2+=pick([1,2,k]);}
  const eq=n2*d===d2*n;
  return{q:`Чи правильна рівність? ${fr(n,d)} = ${fr(n2,d2)}`,a:{kind:'choice',opts:['Так','Ні'],correct:eq?0:1,fixed:true},tries:1,
   expl:eq?`Чисельник і знаменник помножили на ${k}: рівність правильна.`:`Основна властивість працює, лише коли обидва числа множать на одне й те саме. ${d}·${k} = ${d*k}, ${n}·${k} = ${n*k}, а тут ${d2} і ${n2}.`,
   chk:()=>(n2/d2===n/d)===eq}}

/* ----- Станція 2 ----- */
function g2a(){const[p,q]=coprime(3,12),k=rnd(2,9);
  return{q:`Скоротіть дріб: ${fr(p*k,q*k)}`,a:{kind:'frac',n:p,d:q},
   hint:`Знайдіть число, на яке діляться і ${p*k}, і ${q*k}.`,expl:`Ділимо чисельник і знаменник на ${k}: ${fr(p*k,q*k)} = ${fr(p,q)}.`,chk:()=>gcd(p,q)===1&&p*k*q===q*k*p}}
function g2b(){const[p,q]=coprime(5,15),k=rnd(3,12);
  return{q:`Скоротіть дріб до нескоротного: ${fr(p*k,q*k)}`,a:{kind:'frac',n:p,d:q},
   hint:`Скоротіть на найбільший спільний дільник чисельника й знаменника.`,expl:`НСД(${p*k}; ${q*k}) = ${k}, тому ${fr(p*k,q*k)} = ${fr(p,q)}.`,chk:()=>gcd(p*k,q*k)===k}}
function g2c(){const[p,q]=coprime(3,10),k=rnd(2,9);
  return{q:`Дріб ${fr(p*k,q*k)} скоротили й отримали ${fr(p,q,'b2')}. На яке число його скоротили?<div class="ans">Відповідь: [[0]]</div>`,a:{kind:'slots',v:[k]},
   hint:`Поділіть чисельник ${p*k} на ${p}.`,expl:`${p*k} : ${p} = ${k} і ${q*k} : ${q} = ${k}. Скоротили на ${k}.`,chk:()=>p*k/k===p&&q*k/k===q}}

/* ----- Станція 3 ----- */
function g3a(){
  const[p,q]=coprime(5,30);const set=[{n:p,d:q,irr:true}];
  while(set.length<4){const d=rnd(6,40),n=rnd(2,d-1);if(gcd(n,d)>1&&!set.some(s=>s.n===n&&s.d===d))set.push({n,d,irr:false});}
  const o=shuffle(set);

    {op:'+',f:(X,Y)=>`Одна дошка має довжину ${X} м, а друга — ${Y} м. Яка загальна довжина двох дошок?`}]);
  let t,w1,w2,fp,a1,a2,x,W;
  do{t=mxPair();a1=t.n1*t.L/t.b;a2=t.n2*t.L/t.d;
    if(st.op==='+'){fp=a1+a2;if(fp%t.L===0)continue;w1=rnd(1,6);w2=rnd(1,6);W=w1+w2+Math.floor(fp/t.L);x=mixedOf(fp%t.L,t.L);break}
    else{w1=rnd(3,9);w2=rnd(1,w1-2);const diff=(w1*t.L+a1)-(w2*t.L+a2);if(diff<=0||diff%t.L===0)continue;W=Math.floor(diff/t.L);x=mixedOf(diff%t.L,t.L);break}
  }while(true);
  const{b,d,L,n1,n2}=t;
  return{q:st.f(mx(w1,n1,b),mx(w2,n2,d,'b2')),a:{kind:'mixed',w:W,n:x.n,d:x.d},
   hint:st.op==='+'?`Щоб знайти загальну величину, додайте мішані числа: окремо цілі та дробові частини.`:`Щоб знайти залишок, відніміть мішані числа. Якщо дробова частина зменшуваного менша — «позичте» одиницю в цілої частини.`,
   expl:`${mx(w1,n1,b)} ${st.op==='+'?'+':'−'} ${mx(w2,n2,d,'b2')} = ${mx(W,x.n,x.d)}.`,
   chk:()=>{const v=st.op==='+'?(w1+n1/b+w2+n2/d):((w1+n1/b)-(w2+n2/d));return Math.abs(v-(W+x.n/x.d))<1e-12&&x.n>0&&gcd(x.n,x.d)===1}}}

const GEN=[[g1a,g1b,g1c],[g2a,g2b,g2c],[g3a,g3b,g3c],[g4a,g4b,g4c],[g5a,g5b,g5c],[g6a,g6b,g6c],[g7a,g7b,g7c],[g8a,g8b,g8c],[g9a,g9b,g9c],[g10a,g10b,g10c]];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plain(h){
  return String(h).replace(/<span class="mx[^"]*"><b>(\d+)<\/b>/g,'$1 ').replace(/<span class="fr[^"]*"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,'($1/$2)')
    .replace(/<br>|<\/div>/g,' ').replace(/<[^>]+>/g,'').replace(/\[\[\d\]\]/g,'□').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
}
const fmtAns=(a)=>a.kind==='slots'?a.v.join('; '):a.kind==='frac'?`${a.n}/${a.d}`:a.kind==='mixed'?`${a.w>0?a.w+' ':''}${a.n}/${a.d}`:plain(a.opts[a.correct]);

/* ===================== Стан ===================== */
let S=null;       // стан уроку
let W={leaves:0,awaySec:0,awayAt:0};
function leave(){ if(!S||!S.on||S.finished||W.awayAt)return; W.awayAt=Date.now();W.leaves++; }
function back(){ if(!W.awayAt)return; W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0; }
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());

function build(){
  const tasks=[];
  GEN.forEach((g,li)=>g.forEach(f=>{const t=f();t.lvl=li;t.tries=t.tries||2;tasks.push(t);}));
  return tasks;
}
function newState(sur,nam){
  return{sur,nam,tasks:build(),i:0,res:[],streak:0,best:0,t0:Date.now(),on:true,finished:false,used:0,resolved:false,saved:false};
}

/* ===================== Завдання ===================== */
const QC=['#C2410C','#B45309','#92400E','#86198F'];
const PRAISE=['Правильно! 🎉','Чудово! ⭐','Так тримати! 🚀','Блискуче! ✨','Ось це клас! 👏','Влучно! 🎯','Молодець! 🌟','Дроби вам підкоряються! 💪','Супер! 🥳'];
const PRAISE2=['Правильно! Помилку виправлено — це і є навчання 🌱','Є! Друга спроба — теж перемога 👍','Молодець, що не здалися! 💛'];
function inputsHTML(a){
  if(a.kind==='frac'||a.kind==='mixed'){
    return `<div class="ans">Відповідь: <span class="fin">${a.kind==='mixed'?'<input class="ni w" data-k="w" inputmode="numeric" maxlength="3" autocomplete="off">':''}<span class="fcol"><input class="ni" data-k="n" inputmode="numeric" maxlength="4" autocomplete="off"><i></i><input class="ni" data-k="d" inputmode="numeric" maxlength="4" autocomplete="off"></span></span></div>`
      +(a.kind==='mixed'?`<div class="note">Якщо цілої частини немає, залиште першу клітинку порожньою.</div>`:'');
  }
  return '';
}
function showTask(){
  const t=S.tasks[S.i];S.used=0;S.resolved=false;
  drawHdr();main.className='';
  const a=t.a;
  let q=t.q;
  q=q.replace(/\[\[(\d)\]\]/g,(_,i)=>`<input class="ni" data-i="${i}" inputmode="numeric" maxlength="4" autocomplete="off">`);
  let opts='';
  if(a.kind==='choice'){
    const order=a.fixed&&!a.shuffle?a.opts.map((_,i)=>i):shuffle(a.opts.map((_,i)=>i));
    opts=`<div class="opts">${order.map(i=>`<button class="opt" data-o="${i}">${a.opts[i]}</button>`).join('')}</div>`;
  }
  main.style.setProperty('--qc',QC[S.i%QC.length]);
  main.innerHTML=`<div class="card" style="--qc:${QC[S.i%QC.length]}"><div class="qhead"><span class="num">Завдання ${S.i+1}</span><span class="lv">${LV[t.lvl].emo} ${LV[t.lvl].name}</span></div>
    <div class="q">${q}</div>${inputsHTML(a)}${opts}<div class="msg" id="msg"></div>
    <div class="actions"><button class="btn" id="chk"${a.kind==='choice'?' hidden':''}>Перевірити</button><button class="btn" id="nxt" hidden>Далі ▶</button></div></div>`;
  const ins=[...main.querySelectorAll('.ni')];
  ins.forEach((el,k)=>{
    if(coarse)el.setAttribute('inputmode','none');
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');el.classList.remove('err','good');});
    el.addEventListener('focus',()=>{S.focus=el;});
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();if(k<ins.length-1)ins[k+1].focus();else check();}});
  });
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(+b.dataset.o,b));
  $('#chk').onclick=()=>check();$('#nxt').onclick=next;
  if(ins[0]&&!coarse)ins[0].focus();
  kp.classList.toggle('on',coarse&&ins.length>0);
  if(coarse)buildKp();
  main.scrollTop=0;
}
function buildKp(){
  kp.innerHTML=['1','2','3','4','5','6','7','8','9','⌫','0','→'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+`<button class="go" data-k="go">Перевірити</button>`;
  kp.onpointerdown=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
    const ins=[...main.querySelectorAll('.ni')],f=S.focus&&ins.includes(S.focus)?S.focus:ins[0],k=b.dataset.k;
    if(!f)return;
    if(k==='⌫'){f.value=f.value.slice(0,-1);f.classList.remove('err','good');}
    else if(k==='→'){const j=ins.indexOf(f);(ins[j+1]||ins[0]).focus();}
    else if(k==='go'){const nb=$('#nxt');if(nb&&!nb.hidden)next();else check();}
    else{if(f.value.length<(+f.maxLength||4)){f.value+=k;f.classList.remove('err','good');f.focus();}}
  };
}
function setMsg(cls,html){const m=$('#msg');m.className='msg show '+cls;m.innerHTML=html;}
function readAnswer(t,choice){
  const a=t.a,ins=[...main.querySelectorAll('.ni')];
  if(a.kind==='choice'){return{st:choice===a.correct?'ok':'bad',user:plain(a.opts[choice])};}
  if(a.kind==='slots'){
    const vals=ins.map(e=>e.value.trim());
    if(vals.some(v=>v===''))return{st:'blank',msg:'Заповніть усі клітинки.'};
    const ok=vals.every((v,i)=>+v===a.v[i]);
    ins.forEach((e,i)=>{e.classList.toggle('good',+vals[i]===a.v[i]&&!ok);});
    return{st:ok?'ok':'bad',user:vals.join('; ')};
  }
  const g=k=>{const e=ins.find(x=>x.dataset.k===k);return e?e.value.trim():null};
  const ns=g('n'),ds=g('d'),ws=a.kind==='mixed'?(g('w')||'0'):'0';
  if(ns===''||ds==='')return{st:'blank',msg:a.kind==='mixed'?'Заповніть чисельник і знаменник дробової частини.':'Заповніть чисельник і знаменник.'};
  const n=+ns,d=+ds,w=+ws,user=(w>0?w+' ':'')+n+'/'+d;
  if(d===0)return{st:'bad',user};
  const aw=a.kind==='mixed'?a.w:0,an=a.n,ad=a.d;
  const eq=(w*d+n)*ad===(aw*ad+an)*d;
  if(!eq)return{st:'bad',user};
  if(w===aw&&n===an&&d===ad)return{st:'ok',user};
  if(a.kind==='mixed'&&n>=d)return{st:'soft',msg:'Значення правильне! Виділіть цілу частину з неправильного дробу.'};
  return{st:'soft',msg:'Значення правильне! Але дріб можна скоротити — запишіть нескоротний дріб.'};
}
function check(choice,btn){
  if(S.resolved)return;
  const t=S.tasks[S.i],r=readAnswer(t,choice);
  if(r.st==='blank'||r.st==='soft'){setMsg('soft',r.msg);return;}
  const maxT=t.tries;
  if(r.st==='ok'){
    S.resolved=true;
    const mark=S.used===0?1:.5;
    S.streak++;S.best=Math.max(S.best,S.streak);
    S.res.push({lvl:t.lvl,mark,used:S.used+1,user:r.user,q:plain(t.q),c:fmtAns(t.a)});
    let txt=mark===1?pick(PRAISE):pick(PRAISE2);
    if([3,5,8,10,15,20].includes(S.streak))txt+=`<br>🔥 Серія з ${S.streak} правильних поспіль!`;
    const half=mark===.5?' (+0,5 бала)':' (+1 бал)';
    setMsg('ok',txt+`<div style="font-weight:600;font-size:.9em">${half}</div>`);
    main.querySelectorAll('.ni').forEach(e=>e.classList.add('good'));
    if(btn)btn.classList.add('good');
    burst(mark===1?34:18);afterResolve();
  }else{
    S.used++;
    S.streak=0;
    if(btn){btn.classList.add('err');btn.disabled=true;}
    main.querySelectorAll('.ni').forEach(e=>e.classList.add('err'));
    if(S.used>=maxT){
      S.resolved=true;
      S.res.push({lvl:t.lvl,mark:0,used:S.used,user:r.user,q:plain(t.q),c:fmtAns(t.a)});
      setMsg('bad',`Цього разу не вийшло — розберемо разом. Вдалих завдань ще багато! 💪<div class="sol"><b>Розв'язання:</b> ${t.expl}</div>`);
      main.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(+b.dataset.o===t.a.correct)b.classList.add('good');});
      afterResolve();
    }else{
      setMsg('hint',`Майже! Спробуйте ще раз. 💡 ${t.hint}`);
      const f=main.querySelector('.ni');if(f&&!coarse){f.focus();f.select();}
    }
  }
  drawHdr();
}
function afterResolve(){
  const c=$('#chk');if(c)c.hidden=true;
  const n=$('#nxt');n.hidden=false;
  const last=S.i===S.tasks.length-1,endLv=last||S.tasks[S.i+1].lvl!==S.tasks[S.i].lvl;
  n.textContent=last?'Підбити підсумок 🏁':endLv?'Завершити станцію ▶':'Далі ▶';
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  drawHdr();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!S||S.finished||!S.resolved||ovl.classList.contains('on')||(e.target&&e.target.tagName==='BUTTON'))return;
  const nb=$('#nxt');if(nb&&!nb.hidden){e.preventDefault();next();}
});
function next(){
  if(!S.resolved)return;
  const t=S.tasks[S.i],last=S.i===S.tasks.length-1,endLv=last||S.tasks[S.i+1].lvl!==t.lvl;
  if(endLv){showLevelUp(t.lvl,last);return;}
  S.i++;showTask();
}
function showLevelUp(li,last){
  kp.classList.remove('on');
  const rs=S.res.filter(r=>r.lvl===li),e=rs.reduce((a,r)=>a+r.mark,0),st=e>=2.5?3:e>=1.5?2:e>=.5?1:0;
  const msg=st===3?'Станцію пройдено блискуче!':st===2?'Добре! Станцію пройдено.':st===1?'Станцію пройдено. Наступна буде ще краще!':'Станцію пройдено. Іще раз прочитайте правило — і вперед!';
  main.innerHTML=`<div class="lvup"><div class="emo">${LV[li].emo}</div><h2>Станція ${li+1} «${LV[li].name}»</h2><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p style="font-size:1.2rem">${msg}<br>Бали на станції: <b>${String(e).replace('.',',')}</b> з 3</p>
    <button class="btn big" id="lvgo">${last?'Підбити підсумок 🏁':'До станції '+(li+2)+' ▶'}</button></div>`;
  if(st>=2)burst(60);
  $('#lvgo').onclick=()=>{if(last)finish();else{S.i++;showTask();}};
  $('#lvgo').focus();
}

/* ===================== Підсумок ===================== */
function gradeOf(earned,n){let g=Math.min(MAXGRADE,Math.round(MAXGRADE*earned/TARGET));if(n>0&&g<1)g=1;return g;}
function finish(){
  if(!S||S.finished)return;
  S.finished=true;clearInterval(tmrId);back();kp.classList.remove('on');hdr.hidden=true;
  const n=S.res.length,earned=S.res.reduce((a,r)=>a+r.mark,0),first=S.res.filter(r=>r.mark===1).length,g=gradeOf(earned,n);
  const wrong=S.res.reduce((a,r)=>a+(r.used-(r.mark>0?1:0)),0);
  const dur=Math.round((Date.now()-S.t0)/1000);
  const weak=[],map=LV.map((l,li)=>{const rs=S.res.filter(r=>r.lvl===li);if(!rs.length)return`<div class="st"><b>${l.emo} ${li+1}. ${l.name}</b><br><span style="color:var(--muted)">не розпочато</span></div>`;
    const e=rs.reduce((a,r)=>a+r.mark,0),pct=e/rs.length,stars=rs.length<3?'':(e>=2.5?'★★★':e>=1.5?'★★☆':e>=.5?'★☆☆':'☆☆☆');
    if(pct<.67)weak.push(l.name+(l.p?' ('+l.p+')':''));
    return`<div class="st${pct<.67?' weak':''}"><b>${l.emo} ${li+1}. ${l.name}</b><br><span class="stars">${stars}</span> ${String(e).replace('.',',')} з ${rs.length}</div>`}).join('');
  const word=g>=10?'Блискуче! Ви — майстер дробів 🏆':g>=7?'Дуже добре! Так тримати 🌟':g>=4?'Непогано! Є над чим попрацювати 💪':'Не здавайтеся — повторіть теми нижче, і буде краще 🌱';
  main.className='';
  main.innerHTML=`<div class="res"><div style="color:var(--muted);font-weight:800">${esc(S.sur)} ${esc(S.nam)}</div><div class="big-grade">${g}</div><div style="font-weight:800">балів із ${MAXGRADE}</div><h2>${word}</h2>
   <div class="kpis"><div class="kpi"><b>${n}</b><span>завдань виконано</span></div><div class="kpi"><b>${first}</b><span>з першої спроби</span></div><div class="kpi"><b>${wrong}</b><span>помилок</span></div><div class="kpi"><b>${String(earned).replace('.',',')}</b><span>балів (для 12 потрібно ${TARGET})</span></div><div class="kpi"><b>${S.best}</b><span>найдовша серія 🔥</span></div><div class="kpi"><b>${mmss(dur)}</b><span>час роботи</span></div></div>
   <div class="map">${map}</div>
   ${weak.length?`<div class="msg hint show" style="text-align:left"><b>Що повторити:</b> ${weak.join('; ')}.</div>`:`<div class="msg ok show">Усі пройдені теми засвоєно добре!</div>`}
   <div class="actions" style="justify-content:center"><button class="btn sec" id="again">↻ Почати спочатку</button></div></div>`;
  burst(g>=7?120:50);
  $('#again').onclick=()=>{R=mulberry32(SEED=Math.floor(Math.random()*1e9)+1);const p={sur:S.sur,nam:S.nam};S=null;showStart(p);};
  const now=Date.now();

window.__selftest=function(N){
  const bad=[],cnt={};
  for(let it=0;it<N;it++){
    R=mulberry32(it+1);
    GEN.forEach((g,li)=>g.forEach((f,fi)=>{
      const key=(li+1)+'.'+(fi+1);cnt[key]=(cnt[key]||0)+1;
      let t;try{t=f();}catch(e){bad.push(key+' throw '+e.message);return;}
      const a=t.a;
      if(!t.chk||!t.chk())bad.push(key+' chk fail seed '+(it+1));
      if(a.kind==='slots'&&a.v.length!==slotsIn(t.q))bad.push(key+' slots mismatch');
      if(a.kind==='slots'&&a.v.some(x=>!(x>0&&Number.isInteger(x))))bad.push(key+' slot value '+a.v);
      if(a.kind==='frac'&&!(a.n>0&&a.n<a.d&&gcd(a.n,a.d)===1))bad.push(key+' frac '+a.n+'/'+a.d);
      if(a.kind==='mixed'&&!(a.w>=0&&a.n>0&&a.n<a.d&&gcd(a.n,a.d)===1))bad.push(key+' mixed '+a.w+' '+a.n+'/'+a.d);

      if(!t.expl||/undefined|NaN/.test(t.q+t.expl+(t.hint||'')))bad.push(key+' text undefined/NaN seed '+(it+1));
    }));
  }
  return{bad:bad.slice(0,40),nbad:bad.length,cnt};
};

        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
