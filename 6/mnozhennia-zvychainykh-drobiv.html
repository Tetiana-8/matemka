    <script type="text/babel">

        // Асинхронний MathJax Компонент (Ідеально для Google Sites)
        const Formula = ({ math, block = false }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                let isCancelled = false;

                const renderMath = async () => {
                    // Чекаємо, доки MathJax завантажиться
                    while (!(window.MathJax && window.MathJax.typesetPromise)) {
                        if (isCancelled) return;
                        await new Promise(r => setTimeout(r, 50));
                    }
                    if (isCancelled || !containerRef.current) return;

                    // Використовуємо textContent, щоб браузер не ламав слеші (\)
                    const mathText = block ? `\\[ ${math} \\]` : `\\( ${math} \\)`;
                    containerRef.current.textContent = mathText;

                    try {
                        await window.MathJax.typesetPromise([containerRef.current]);
                    } catch (e) {
                        console.error("Помилка MathJax:", e);
                    }
                };

                renderMath();

                return () => { isCancelled = true; };
            }, [math, block]);

            return <span ref={containerRef} className={`inline-block ${block ? 'text-lg' : ''}`}></span>;
        };

        // Утиліти
        function НСД(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            if (b === 0) return a === 0 ? 1 : a;

                let t = b;
                b = a % b;
                a = t;

            return a;

            return Math.floor(Math.random() * (max - min + 1)) + min;

                    {/* Правило 2 */}
                    <div class="bg-orange-50 border border-orange-200 rounded-3xl overflow-hidden shadow-sm transition-all">
                        <button onClick={() => toggle(2)} class="w-full flex items-center justify-between p-5 focus:outline-none hover:bg-orange-100/50 transition-colors">
                            <div class="flex items-center space-x-3">
                                <span class="w-8 h-8 flex items-center justify-center bg-orange-200 text-orange-900 font-bold rounded-xl text-sm">2</span>
                                <h3 class="text-lg font-bold text-gray-900 text-left">Множення цілого числа на дріб</h3>
                            </div>

                        </button>
                        {відкритийПункт === 2 && (
                            <div class="px-6 pb-6 pt-2">
                                <p class="text-gray-900 text-sm mb-4 leading-relaxed font-medium">
                                    Щоб помножити натуральне число на дріб, можна подати натуральне число у вигляді дробу зі знаменником 1 і застосувати правило множення дробів.
                                </p>
                                <div class="bg-white p-4 rounded-2xl border border-orange-100 flex flex-col sm:flex-row items-center justify-around gap-4 text-center">
                                    <div>
                                        <span class="text-xs font-bold text-orange-800 uppercase block mb-1">Загальна формула</span>
                                        <Formula math={"n \\cdot \\frac{a}{b} = \\frac{n}{1} \\cdot \\frac{a}{b} = \\frac{n \\cdot a}{b}"} block />
                                    </div>

                                    <div>

                                        <Formula math={"6 \\cdot \\frac{2}{9} = \\frac{6}{1} \\cdot \\frac{2}{9} = \\frac{6 \\cdot 2}{1 \\cdot 9} = \\frac{2 \\cdot 2}{1 \\cdot 3} = \\frac{4}{3} = 1\\frac{1}{3}"} block />

                        {відкритийПункт === 4 && (

        // ==========================================
        // 2. РОЗДІЛ ТРЕНУВАННЯ
        // ==========================================
        function РозділТренування() {
            const [категорія, встановитиКатегорію] = useState('ціле_на_дріб'); 
            const [завдання, встановитиЗавдання] = useState(null);
            
            const [введенаЦіла, встановитиВведенуЦілу] = useState('');
            const [введенийЧисельник, встановитиВведенийЧисельник] = useState('');
            const [введенийЗнаменник, встановитиВведенийЗнаменник] = useState('');
            
            const [статус, встановитиСтатус] = useState('початковий'); 
            const [повідомлення, встановитиПовідомлення] = useState('');

            const ЗгенеруватиЗавдання = (тип) => {
                встановитиВведенуЦілу('');
                встановитиВведенийЧисельник('');
                встановитиВведенийЗнаменник('');
                встановитиСтатус('початковий');
                встановитиПовідомлення('');

                let newZavdannya = null;

                if (тип === 'ціле_на_дріб') {
                    const A = ВипадковеЦіле(2, 12);
                    let C = ВипадковеЦіле(2, 9);
                    let B = ВипадковеЦіле(1, C - 1);
                    
                    while (НСД(B, C) !== 1) {
                        B = ВипадковеЦіле(1, C - 1);
                    }

                    const pNum = A * B;
                    const pDen = C;
                    const g = НСД(pNum, pDen);
                    const sNum = pNum / g;
                    const sDen = pDen / g;
                    
                    const ansW = Math.floor(sNum / sDen);
                    const ansN = sNum % sDen;
                    const ansD = sDen;

                    let mathStr = `${A} \\cdot \\frac{${B}}{${C}} = \\frac{${A}}{1} \\cdot \\frac{${B}}{${C}} = \\frac{${A} \\cdot ${B}}{1 \\cdot ${C}} = \\frac{${pNum}}{${pDen}}`;
                    if (sDen === 1 && pDen !== 1) {
                        mathStr += ` = ${ansW}`;
                    } else if (ansW > 0 && ansN > 0) {
                        if (g > 1) mathStr += ` = \\frac{${sNum}}{${sDen}} = ${ansW}\\frac{${ansN}}{${ansD}}`;
                        else mathStr += ` = ${ansW}\\frac{${ansN}}{${ansD}}`;
                    } else if (ansW === 0 && ansN > 0 && g > 1) {
                        mathStr += ` = \\frac{${sNum}}{${sDen}}`;
                    }

                    newZavdannya = {
                        тип: 'ціле_на_дріб',
                        формула: `${A} \\cdot \\frac{${B}}{${C}}`,
                        правильнаЦіла: ansW,
                        правильнийЧисельник: ansN,
                        правильнийЗнаменник: ansD,
                        покрокове: mathStr
                    };
                } 
                else if (тип === 'дріб_на_дріб') {
                    let d1 = ВипадковеЦіле(2, 9); let n1 = ВипадковеЦіле(1, d1 - 1);
                    while(НСД(n1, d1) !== 1) n1 = ВипадковеЦіле(1, d1 - 1);
                    
                    let d2 = ВипадковеЦіле(2, 9); let n2 = ВипадковеЦіле(1, d2 - 1);
                    while(НСД(n2, d2) !== 1) n2 = ВипадковеЦіле(1, d2 - 1);

                    const pNum = n1 * n2;
                    const pDen = d1 * d2;
                    const g = НСД(pNum, pDen);
                    const sNum = pNum / g;
                    const sDen = pDen / g;
                    const ansW = Math.floor(sNum / sDen);
                    const ansN = sNum % sDen;
                    const ansD = sDen;

                    let mathStr = `\\frac{${n1}}{${d1}} \\cdot \\frac{${n2}}{${d2}} = \\frac{${n1} \\cdot ${n2}}{${d1} \\cdot ${d2}} = \\frac{${pNum}}{${pDen}}`;
                    if (sDen === 1 && pDen !== 1) {
                        mathStr += ` = ${ansW}`;
                    } else if (ansW > 0 && ansN > 0) {
                        if (g > 1) mathStr += ` = \\frac{${sNum}}{${sDen}} = ${ansW}\\frac{${ansN}}{${ansD}}`;
                        else mathStr += ` = ${ansW}\\frac{${ansN}}{${ansD}}`;
                    } else if (ansW === 0 && ansN > 0 && g > 1) {
                        mathStr += ` = \\frac{${sNum}}{${sDen}}`;
                    }

                    newZavdannya = {
                        тип: 'дріб_на_дріб',
                        формула: `\\frac{${n1}}{${d1}} \\cdot \\frac{${n2}}{${d2}}`,
                        правильнаЦіла: ansW,
                        правильнийЧисельник: ansN,
                        правильнийЗнаменник: ansD,
                        покрокове: mathStr
                    };
                }
                else if (тип === 'мішані') {
                    const d1 = ВипадковеЦіле(2, 5); const w1 = ВипадковеЦіле(1, 3); let n1 = ВипадковеЦіле(1, d1 - 1);
                    while (НСД(n1, d1) !== 1) n1 = ВипадковеЦіле(1, d1 - 1);
                    const d2 = ВипадковеЦіле(2, 5); const w2 = ВипадковеЦіле(1, 3); let n2 = ВипадковеЦіле(1, d2 - 1);
                    while (НСД(n2, d2) !== 1) n2 = ВипадковеЦіле(1, d2 - 1);

                    const impNum1 = w1 * d1 + n1;
                    const impNum2 = w2 * d2 + n2;

                    const pNum = impNum1 * impNum2;
                    const pDen = d1 * d2;
                    const g = НСД(pNum, pDen);
                    const sNum = pNum / g;
                    const sDen = pDen / g;
                    const ansW = Math.floor(sNum / sDen);
                    const ansN = sNum % sDen;
                    const ansD = sDen;

                    let mathStr = `${w1}\\frac{${n1}}{${d1}} \\cdot ${w2}\\frac{${n2}}{${d2}} = \\frac{${impNum1}}{${d1}} \\cdot \\frac{${impNum2}}{${d2}} = \\frac{${impNum1} \\cdot ${impNum2}}{${d1} \\cdot ${d2}} = \\frac{${pNum}}{${pDen}}`;
                    if (sDen === 1 && pDen !== 1) {
                        mathStr += ` = ${ansW}`;
                    } else if (ansW > 0 && ansN > 0) {
                        if (g > 1) mathStr += ` = \\frac{${sNum}}{${sDen}} = ${ansW}\\frac{${ansN}}{${ansD}}`;
                        else mathStr += ` = ${ansW}\\frac{${ansN}}{${ansD}}`;

                        mathStr += ` = \\frac{${sNum}}{${sDen}}`;

                    newZavdannya = {
                        тип: 'мішані',
                        формула: `${w1}\\frac{${n1}}{${d1}} \\cdot ${w2}\\frac{${n2}}{${d2}}`,

                else if (тип === 'десятковий') {
                    const decs = [
                        { d: '0{,}2', n: 1, den: 5 }, { d: '0{,}4', n: 2, den: 5 }, { d: '0{,}5', n: 1, den: 2 },

                    ];
                    const chosen = decs[ВипадковеЦіле(0, decs.length - 1)];
                    
                    let f2_den = ВипадковеЦіле(2, 9); let f2_num = ВипадковеЦіле(1, f2_den - 1);
                    while(НСД(f2_num, f2_den) !== 1) f2_num = ВипадковеЦіле(1, f2_den - 1);

                    const pNum = chosen.n * f2_num;
                    const pDen = chosen.den * f2_den;
                    const g = НСД(pNum, pDen);
                    const sNum = pNum / g;
                    const sDen = pDen / g;
                    const ansW = Math.floor(sNum / sDen);
                    const ansN = sNum % sDen;
                    const ansD = sDen;

                    let mathStr = `${chosen.d} \\cdot \\frac{${f2_num}}{${f2_den}} = \\frac{${chosen.n}}{${chosen.den}} \\cdot \\frac{${f2_num}}{${f2_den}} = \\frac{${chosen.n} \\cdot ${f2_num}}{${chosen.den} \\cdot ${f2_den}} = \\frac{${pNum}}{${pDen}}`;
                    if (sDen === 1 && pDen !== 1) {
                        mathStr += ` = ${ansW}`;
                    } else if (ansW > 0 && ansN > 0) {
                        if (g > 1) mathStr += ` = \\frac{${sNum}}{${sDen}} = ${ansW}\\frac{${ansN}}{${ansD}}`;
                        else mathStr += ` = ${ansW}\\frac{${ansN}}{${ansD}}`;

                    newZavdannya = {

        // ==========================================

        function РозділТестування() {
            const [стан, встановитиСтан] = useState('старт'); 
            const [списокЗавдань, встановитиСписокЗавдань] = useState([]);
            const [поточнийІндекс, встановитиПоточнийІндекс] = useState(0);
            const [імяУчня, встановитиІмяУчня] = useState('');
            const [помилкаІмені, встановитиПомилкуІмені] = useState(false);
            const [помилкаВводу, встановитиПомилкуВводу] = useState('');
            
            const [введенаЦіла, встановитиВведенуЦілу] = useState('');
            const [введенийЧисельник, встановитиВведенийЧисельник] = useState('');
            const [введенийЗнаменник, встановитиВведенийЗнаменник] = useState('');
            const [результати, встановитиРезультати] = useState([]);

            const ПочатиТест = () => {
                if (імяУчня.trim().length === 0) {
                    встановитиПомилкуІмені(true);
                    return;
                }
                встановитиПомилкуІмені(false);
                встановитиПомилкуВводу('');

                const новіЗавдання = [];
                const типи = ['ціле_на_дріб', 'дріб_на_дріб', 'мішані', 'десятковий'];

                for (let i = 0; i < 10; i++) {
                    const обранийТип = типи[i % типи.length];
                    
                    if (обранийТип === 'ціле_на_дріб') {
                        const A = ВипадковеЦіле(2, 8);
                        let C = ВипадковеЦіле(2, 7);
                        let B = ВипадковеЦіле(1, C - 1);
                        while (НСД(B, C) !== 1) B = ВипадковеЦіле(1, C - 1);

                        const pNum = A * B;
                        const pDen = C;
                        const g = НСД(pNum, pDen);
                        const sNum = pNum / g;
                        const sDen = pDen / g;

                        новіЗавдання.push({
                            id: i + 1,
                            формула: `${A} \\cdot \\frac{${B}}{${C}}`,
                            правильнаЦіла: Math.floor(sNum / sDen),
                            правильнийЧисельник: sNum % sDen,
                            правильнийЗнаменник: sDen
                        });
                    }
                    else if (обранийТип === 'дріб_на_дріб') {
                        let d1 = ВипадковеЦіле(2, 7); let n1 = ВипадковеЦіле(1, d1 - 1);
                        while(НСД(n1, d1) !== 1) n1 = ВипадковеЦіле(1, d1 - 1);
                        
                        let d2 = ВипадковеЦіле(2, 7); let n2 = ВипадковеЦіле(1, d2 - 1);
                        while(НСД(n2, d2) !== 1) n2 = ВипадковеЦіле(1, d2 - 1);

                        const pNum = n1 * n2;
                        const pDen = d1 * d2;
                        const g = НСД(pNum, pDen);
                        const sNum = pNum / g;
                        const sDen = pDen / g;

                        новіЗавдання.push({
                            id: i + 1,
                            формула: `\\frac{${n1}}{${d1}} \\cdot \\frac{${n2}}{${d2}}`,
                            правильнаЦіла: Math.floor(sNum / sDen),
                            правильнийЧисельник: sNum % sDen,
                            правильнийЗнаменник: sDen
                        });
                    }
                    else if (обранийТип === 'мішані') {
                        const d1 = ВипадковеЦіле(2, 4); const w1 = ВипадковеЦіле(1, 2); let n1 = ВипадковеЦіле(1, d1 - 1);
                        while (НСД(n1, d1) !== 1) n1 = ВипадковеЦіле(1, d1 - 1);
                        const d2 = ВипадковеЦіле(2, 5); const w2 = ВипадковеЦіле(1, 2); let n2 = ВипадковеЦіле(1, d2 - 1);
                        while (НСД(n2, d2) !== 1) n2 = ВипадковеЦіле(1, d2 - 1);

                        const imp1 = w1 * d1 + n1;
                        const imp2 = w2 * d2 + n2;
                        const pNum = imp1 * imp2;
                        const pDen = d1 * d2;
                        const g = НСД(pNum, pDen);
                        const sNum = pNum / g;
                        const sDen = pDen / g;

                        новіЗавдання.push({
                            id: i + 1,
                            формула: `${w1}\\frac{${n1}}{${d1}} \\cdot ${w2}\\frac{${n2}}{${d2}}`,
                            правильнаЦіла: Math.floor(sNum / sDen),
                            правильнийЧисельник: sNum % sDen,
                            правильнийЗнаменник: sDen
                        });
                    }
                    else {
                        const decs = [{ d: '0{,}5', n: 1, den: 2 }, { d: '0{,}2', n: 1, den: 5 }, { d: '0{,}4', n: 2, den: 5 }];
                        const chosen = decs[ВипадковеЦіле(0, decs.length - 1)];
                        
                        let f2_den = ВипадковеЦіле(2, 6); let f2_num = ВипадковеЦіле(1, f2_den - 1);
                        while(НСД(f2_num, f2_den) !== 1) f2_num = ВипадковеЦіле(1, f2_den - 1);

                        const pNum = chosen.n * f2_num;
                        const pDen = chosen.den * f2_den;
                        const g = НСД(pNum, pDen);
                        const sNum = pNum / g;
                        const sDen = pDen / g;

                        новіЗавдання.push({
                            id: i + 1,
                            формула: `${chosen.d} \\cdot \\frac{${f2_num}}{${f2_den}}`,
                            правильнаЦіла: Math.floor(sNum / sDen),
                            правильнийЧисельник: sNum % sDen,
                            правильнийЗнаменник: sDen
                        });
                    }
                }

                встановитиСписокЗавдань(новіЗавдання);
                встановитиПоточнийІндекс(0);
                встановитиРезультати([]);
                встановитиВведенуЦілу('');
                встановитиВведенийЧисельник('');
                встановитиВведенийЗнаменник('');
                встановитиСтан('тестування');
            };

            const ЗберегтиУФонд = async (правильних) => {
                if (!window.firebaseAPI || !window.firebaseAPI.isReady) return;
                try {
                    const { db, collection, addDoc, auth } = window.firebaseAPI;
                    if (!auth.currentUser) return;
                    
                    const оцінка = Math.round((правильних / 10) * 12);
                    const ref = collection(db, 'artifacts', APP_ID, 'public', 'data', 'test_results');
                    
                    await addDoc(ref, {
                        studentName: імяУчня,
                        score: правильних,
                        grade: оцінка,
                        total: 10,
                        timestamp: Date.now(),
                        dateString: new Date().toLocaleString('uk-UA')
                    });
                } catch (e) {
                    console.error("Помилка при збереженні", e);
                }
            };

            const ЗафіксуватиВідповідь = () => {
                const currentTask = списокЗавдань[поточнийІндекс];
                
                if (введенаЦіла.trim() === '' && введенийЧисельник.trim() === '' && введенийЗнаменник.trim() === '') {
                    встановитиПомилкуВводу('Будь ласка, введіть відповідь перед тим, як переходити далі.');
                    return;
                }

                const uWhole = введенаЦіла.trim() === '' ? 0 : parseInt(введенаЦіла, 10);
                const uNum = введенийЧисельник.trim() === '' ? 0 : parseInt(введенийЧисельник, 10);
                const uDen = введенийЗнаменник.trim() === '' ? 1 : parseInt(введенийЗнаменник, 10);

                if (isNaN(uWhole) || isNaN(uNum) || isNaN(uDen) || uDen === 0) {
                    встановитиПомилкуВводу("Введіть коректні числа (знаменник не може бути нулем).");
                    return;
                }
                
                встановитиПомилкуВводу('');

                const expectedWhole = currentTask.правильнаЦіла;
                const expectedNum = currentTask.правильнийЧисельник;
                const expectedDen = currentTask.правильнийЗнаменник;

                const userTotalNum = uWhole * uDen + uNum;
                const expectedTotalNum = expectedWhole * expectedDen + expectedNum;

                const isValueCorrect = (userTotalNum * expectedDen === expectedTotalNum * uDen);
                const isSimplified = (uNum === 0 && uDen === 1) || (uNum > 0 && НСД(uNum, uDen) === 1);
                const isProper = (uNum < uDen) || (uDen === 1);

                const правильно = isValueCorrect && isSimplified && isProper;

                const оновленіРезультати = [
                    ...результати,
                    {
                        завдання: currentTask,
                        правильно: правильно
                    }
                ];

                встановитиРезультати(оновленіРезультати);

                if (поточнийІндекс + 1 < списокЗавдань.length) {
                    встановитиПоточнийІндекс(поточнийІндекс + 1);
                    встановитиВведенуЦілу('');
                    встановитиВведенийЧисельник('');
                    встановитиВведенийЗнаменник('');
                } else {
                    const підсумковийБал = оновленіРезультати.filter(r => r.правильно).length;
                    ЗберегтиУФонд(підсумковийБал);
                    встановитиСтан('фініш');
                }
            };

            const ПравильнихВідповідей = результати.filter(r => r.правильно).length;

            return (

                                <input

                                    value={імяУчня}
                                    onChange={(e) => встановитиІмяУчня(e.target.value)}

                    )}

                    {стан === 'тестування' && (

                            <div class="mb-6">

                                <div class="w-full h-2.5 bg-orange-100 rounded-full overflow-hidden border border-orange-200">
                                    <div

                                    ></div>
                                </div>
                            </div>

                            <div class="bg-orange-50 rounded-2xl p-6 border border-orange-200 text-center mb-6">
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Обчисліть вираз</span>
                                <div class="font-bold text-gray-900">
                                    <Formula math={`${списокЗавдань[поточнийІндекс].формула} =`} block />
                                </div>
                            </div>

                            <div class="max-w-md mx-auto mb-4">
                                <div class="flex items-center justify-center space-x-2 bg-orange-50 p-4 rounded-2xl border border-orange-200">
                                    {(списокЗавдань[поточнийІндекс].правильнаЦіла !== 0 || (списокЗавдань[поточнийІндекс].правильнаЦіла === 0 && списокЗавдань[поточнийІндекс].правильнийЧисельник === 0)) && (
                                        <div class="flex flex-col items-center mr-2">
                                            <span class="text-[10px] text-gray-500 font-bold mb-1">Ціла частина</span>
                                            <input
                                                type="number" min="0" step="1"
                                                value={введенаЦіла}
                                                onChange={(e) => встановитиВведенуЦілу(e.target.value)}
                                                class="w-16 h-12 text-center text-lg font-bold border-2 border-orange-300 rounded-xl focus:border-orange-300 focus:outline-none bg-white text-gray-900"
                                            />

                                    )}
                                    
                                    <div class="flex flex-col items-center space-y-1">
                                        <span class="text-[10px] text-gray-500 font-bold">Чисельник</span>
                                        <input
                                            type="number" min="0" step="1"

                                            onChange={(e) => встановитиВведенийЧисельник(e.target.value)}

                                        />
                                        <div class="w-16 h-0.5 bg-gray-800 rounded-full"></div>
                                        <input
                                            type="number" min="1" step="1"

                            {помилкаВводу && (

                            <div class="text-center">
                                <button

                                >
                                    {поточнийІндекс + 1 === 10 ? 'Завершити тестування' : 'Відповісти та далі'}
                                </button>
                            </div>
                        </div>
                    )}

                    {стан === 'фініш' && (
                        <div class="space-y-6">
                            <div class="bg-orange-50 border border-orange-200 p-6 rounded-3xl text-center shadow-sm">
                                <span class="text-xs font-bold text-orange-700 uppercase tracking-widest block mb-1">Підсумковий результат</span>
                                <h3 class="text-2xl font-extrabold text-gray-900 mb-2">

                                <p class="text-sm text-gray-700 font-medium mb-4">

        // 4. ЖУРНАЛ ВЧИТЕЛЯ

        function РозділЖурнал({ закритиЖурнал, парольВведено, встановитиПарольВведено }) {
            const [пароль, встановитиПароль] = useState('');
            const [помилка, встановитиПомилку] = useState('');
            const [результати, встановитиРезультати] = useState([]);
            const [завантаження, встановитиЗавантаження] = useState(false);

            const ПеревіритиПароль = () => {
                if (пароль === '8019') {
                    встановитиПарольВведено(true);
                    встановитиПомилку('');
                } else {
                    встановитиПомилку('Невірний пароль доступу');
                    встановитиПароль('');
                }
            };

            useEffect(() => {
                let unsubscribe;
                if (парольВведено && window.firebaseAPI && window.firebaseAPI.isReady) {
                    встановитиЗавантаження(true);
                    const { db, collection, onSnapshot, query, auth } = window.firebaseAPI;
                    if (auth.currentUser) {
                        const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'test_results'));
                        unsubscribe = onSnapshot(q, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            data.sort((a, b) => b.timestamp - a.timestamp);
                            встановитиРезультати(data);
                            встановитиЗавантаження(false);
                        }, (err) => {
                            console.error("Помилка завантаження бази", err);
                            встановитиЗавантаження(false);
                        });
                    } else {
                        встановитиЗавантаження(false);
                    }
                }
                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, [парольВведено]);

            if (!парольВведено) {
                return (
                    <div class="bg-white border border-orange-200 rounded-3xl p-8 shadow-sm max-w-sm mx-auto mt-4 text-center relative">
                        <button 
                            onClick={закритиЖурнал}
                            class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 font-bold"
                            title="Закрити"
                        >
                            ✕
                        </button>
                        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold mb-4">
                            🔒
                        </div>
                        <h2 class="text-lg font-bold text-gray-900 mb-2">Журнал вчителя</h2>
                        <p class="text-xs text-gray-500 mb-6 font-medium">Введіть пароль для доступу до бази результатів.</p>
                        
                        <input
                            type="password"
                            placeholder="Пароль..."
                            value={пароль}
                            onChange={(e) => встановитиПароль(e.target.value)}
                            class={`w-full px-4 py-3 text-center text-sm font-bold border-2 rounded-xl focus:outline-none mb-4 transition-colors ${
                                помилка ? 'border-rose-400 bg-rose-50' : 'border-orange-300 focus:border-orange-400 bg-white'
                            } text-gray-900`}
                        />
                        {помилка && <p class="text-xs text-rose-600 mb-4 font-bold">{помилка}</p>}
                        
                        <button
                            onClick={ПеревіритиПароль}
                            class="w-full py-3 bg-gray-900 hover:bg-black text-white font-bold text-sm rounded-xl shadow-md transition-all"
                        >
                            Увійти
                        </button>
                    </div>
                );
            }

            return (
                <div class="bg-white border border-orange-200 rounded-3xl p-6 shadow-sm relative">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-extrabold text-gray-900">Результати учнів</h2>
                        <div class="space-x-2">
                            <button 
                                onClick={() => встановитиПарольВведено(false)}
                                class="text-xs font-bold text-gray-500 hover:text-gray-900 px-3 py-2 bg-orange-100 rounded-lg transition-colors"
                            >
                                Вийти
                            </button>
                            <button 
                                onClick={закритиЖурнал}
                                class="text-xs font-bold text-white bg-gray-800 hover:bg-black px-3 py-2 rounded-lg transition-colors"
                            >
                                Закрити журнал
                            </button>
                        </div>
                    </div>

                    {завантаження ? (
                        <div class="text-center py-8 text-sm font-bold text-gray-500">
                            Завантаження даних із хмари...
                        </div>
                    ) : результати.length === 0 ? (
                        <div class="text-center py-8 text-sm font-bold text-gray-500 bg-orange-50 rounded-2xl border border-orange-200">
                            Журнал поки що порожній.
                        </div>
                    ) : (
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-orange-50 border-b border-orange-200">
                                        <th class="p-3 text-xs font-bold text-gray-500 uppercase tracking-wider rounded-tl-xl">Учень / Учениця</th>
                                        <th class="p-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Дата</th>
                                        <th class="p-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Правильно</th>
                                        <th class="p-3 text-xs font-bold text-gray-500 uppercase tracking-wider text-right rounded-tr-xl">Оцінка (12)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {результати.map((res) => (
                                        <tr key={res.id} class="border-b border-orange-100 hover:bg-orange-50 transition-colors">
                                            <td class="p-3 text-sm font-bold text-gray-900">{res.studentName}</td>
                                            <td class="p-3 text-xs font-medium text-gray-500">{res.dateString}</td>
                                            <td class="p-3 text-sm font-bold text-gray-700">{res.score} / {res.total}</td>
                                            <td class="p-3 text-sm font-bold text-right text-gray-900">
                                                <span class="bg-orange-200 px-2.5 py-1 rounded-lg">{res.grade}</span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Додаток />);
    </script>

  <button type="button" class="pm-b" data-a="eraser" title="Гумка"><svg viewBox="0 0 24 24"><path d="M15.6 4.6l3.8 3.8a1.8 1.8 0 010 2.5L11.2 19H7.6l-3-3a1.8 1.8 0 010-2.5l8.5-8.9a1.8 1.8 0 012.5 0z"/><path d="M8.8 10.8l5.4 5.4"/><path d="M11.5 19H20"/></svg></button>
  <div class="pm-sep"></div>
  <div class="pm-colors">
    <button type="button" class="pm-c" data-a="color" data-c="#e53935" style="background:#e53935" title="Червоний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1e5fd6" style="background:#1e5fd6" title="Синій"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#222222" style="background:#222" title="Чорний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1f9d55" style="background:#1f9d55" title="Зелений"></button>
  </div>
  <button type="button" class="pm-b" data-a="width" title="Тонка / товста лінія"><svg viewBox="0 0 24 24"><path d="M4 8h16" style="stroke-width:1.1"/><path d="M4 15.5h16" style="stroke-width:3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="smart" title="Рівні фігури: трикутник, коло, пряма"><svg viewBox="0 0 24 24"><path d="M3.5 19.5l6-12 6 12z"/><circle cx="17" cy="8" r="3.4"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="paper" title="Виділити прямокутник білим"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2" stroke-dasharray="3 2.6"/></svg></button>
  <button type="button" class="pm-b" data-a="board" title="Закрити весь екран білим"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" style="fill:currentColor;fill-opacity:.14"/></svg></button>
  <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
  <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="2"/><path d="M4.5 19L19.5 5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><svg viewBox="0 0 24 24"><path d="M9 8h6a5 5 0 010 10H8"/><path d="M12 4.5L8.5 8 12 11.5"/></svg></button>
  <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/><path d="M10.5 11v5.5M13.5 11v5.5"/></svg></button>
  <div class="pm-sep"></div>
  <button type="button" class="pm-b" data-a="side" title="Перемістити на інший бік"><svg viewBox="0 0 24 24"><path d="M5 8h14M15.2 4.6L19 8l-3.8 3.4"/><path d="M19 16H5M8.8 12.6L5 16l3.8 3.4"/></svg></button>
  <button type="button" class="pm-b" data-a="hide" title="Сховати панельку"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
