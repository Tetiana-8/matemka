<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Знаходження числа за його дробом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  /* Колір 6 класу: помаранчевий. Усі кольори класу задано тут один раз. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          panelLeft: '#FFF1E3',
          panelRight: '#FFF9F1',
          brand: '#C2410C',
          brandLight: '#FFEDD5',
          brandMid: '#FED7AA',
          brandLine: '#FDBA74',
          accent: '#EA580C',
        },
        fontFamily: {
          ui: ['Nunito', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'],
          math: ['Lora', 'Georgia', 'Times New Roman', 'serif'],
        },
      },
    },
  };
</script>
<style>
  /* Розкладка: одна колонка, один крок на екран; зверху прогрес, знизу навігація. */
  html, body { height: 100%; margin: 0; }
  body { background: #FFF9F1; color: #1e293b; font-family: 'Nunito', system-ui, 'Segoe UI', Arial, sans-serif; overflow: hidden; }
  #root { height: 100%; width: 100%; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade { animation: fadeInUp .45s cubic-bezier(.16,1,.3,1) both; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
  .pop { animation: popIn .4s cubic-bezier(.175,.885,.32,1.1) both; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .nudge { animation: nudge .3s ease-in-out; }
  input.fr::-webkit-outer-spin-button, input.fr::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid #EA580C; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .fade, .pop, .nudge { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ============ Математичний запис без зовнішніх бібліотек ============
   Токени через пробіл:  7/9 дріб · 1_2/5 мішане число · : і * — знаки дії
   ~ перед токеном — синій (дільник), ^ — помаранчевий (значення)        */
const COL = { '~': 'text-sky-700', '^': 'text-brand' };

const Fr = ({ n, d }) => (
  <span className="inline-flex flex-col items-center align-middle text-center leading-none mx-0.5">
    <span className="px-1.5 pb-1" style={{ borderBottom: '0.08em solid currentColor' }}>{n}</span>
    <span className="px-1.5 pt-1">{d}</span>
  </span>
);

const Tok = ({ t }) => {
  let cls = '';
  if (COL[t[0]]) { cls = COL[t[0]]; t = t.slice(1); }
  if (t === ':') return <b className="text-green-600 mx-0.5">:</b>;
  if (t === '*') return <b className="text-green-600 mx-0.5">·</b>;
  if (t === '-') return <span>−</span>;
  const mixed = /^(\d+)_(\d+)\/(\d+)$/.exec(t);
  if (mixed) return (
    <span className={`inline-flex items-center ${cls}`}>
      <span className="mr-1">{mixed[1]}</span><Fr n={mixed[2]} d={mixed[3]} />
    </span>
  );
  if (t.includes('/')) {
    const [n, d] = t.split('/');
    return <span className={cls}><Fr n={n.replace(/\*/g, '·')} d={d.replace(/\*/g, '·')} /></span>;
  }
  return <span className={cls}>{t}</span>;
};

const M = ({ t }) => (
  <span className="font-math inline-flex flex-wrap items-center justify-center gap-x-2 gap-y-1 align-middle">
    {t.split(' ').filter(Boolean).map((x, i) => <Tok key={i} t={x} />)}
  </span>
);

// Текст із формулами у фігурних дужках: «Число, {3/4} якого дорівнюють {12}»
const T = ({ s }) => (
  <span>
    {s.split(/(\{[^}]*\})/).map((p, i) => (p && p[0] === '{' ? <M key={i} t={p.slice(1, -1)} /> : <span key={i}>{p}</span>))}
  </span>
);

/* ============ Поля введення ============ */
const stateBorder = state =>
  state === 'ok' ? 'border-green-500 bg-green-50' : state === 'bad' ? 'border-red-400 bg-red-50' : 'border-brandLine bg-white';

const FracInput = ({ value = {}, onChange, state }) => {
  const cls = `fr w-14 sm:w-16 lg:w-20 h-11 lg:h-14 text-center text-xl lg:text-3xl font-bold rounded-lg border-2 ${stateBorder(state)}`;
  const set = (k, v) => onChange({ ...value, [k]: v.replace(/[^0-9]/g, '').slice(0, 4) });
  return (
    <span className="inline-flex flex-col items-center gap-1 align-middle">
      <input aria-label="чисельник" className={cls} inputMode="numeric" value={value.n || ''} onChange={e => set('n', e.target.value)} />
      <span className="block w-16 sm:w-20 lg:w-24 h-1 bg-slate-700 rounded" />
      <input aria-label="знаменник" className={cls} inputMode="numeric" value={value.d || ''} onChange={e => set('d', e.target.value)} />
    </span>
  );
};

const NumInput = ({ value = '', onChange, state }) => {
  const cls = `fr w-24 sm:w-28 lg:w-36 h-11 lg:h-14 text-center text-xl lg:text-3xl font-bold rounded-lg border-2 ${stateBorder(state)}`;
  const set = v => {
    let s = v.replace(/\./g, ',').replace(/[^0-9,]/g, '');
    const k = s.indexOf(',');
    if (k >= 0) s = s.slice(0, k + 1) + s.slice(k + 1).replace(/,/g, '');
    onChange(s.slice(0, 8));
  };
  return <input aria-label="відповідь" className={cls} inputMode="decimal" value={value} onChange={e => set(e.target.value)} />;
};

const toNum = s => parseFloat(String(s == null ? '' : s).replace(',', '.'));
const numOk = (v, a) => v !== undefined && v !== '' && Math.abs(toNum(v) - toNum(a)) < 1e-9;
const fracOk = (v, [an, ad]) => {
  if (!v || !v.n) return false;
  const n = +v.n, d = v.d ? +v.d : 1;
  if (!d) return false;
  return n * ad === an * d;
};

/* ============ Загальні елементи ============ */
const Btn = ({ children, onClick, kind = 'main', disabled, className = '' }) => {
  const styles = {
    main: 'bg-brand hover:bg-orange-800 text-white border-brand',
    light: 'bg-brandLight hover:bg-brandMid text-brand border-brandLine',
    grey: 'bg-white hover:bg-slate-50 text-slate-600 border-slate-300',
  };
  return (
    <button disabled={disabled} onClick={onClick}
      className={`min-h-[34px] px-4 py-1.5 lg:px-5 lg:py-2 rounded-full border font-bold text-sm lg:text-base whitespace-nowrap active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed ${styles[kind]} ${className}`}>
      {children}
    </button>
  );
};

const Rule = ({ children }) => (
  <div className="pop bg-brandLight border-l-8 border-accent rounded-xl px-5 py-4 lg:px-8 lg:py-6 text-lg sm:text-xl lg:text-3xl font-bold leading-snug">
    {children}
  </div>
);

const Title = ({ children }) => (
  <h2 className="text-2xl sm:text-3xl lg:text-5xl font-extrabold text-brand mb-6 lg:mb-10 text-center" style={{ textWrap: 'balance' }}>{children}</h2>
);

const Sub = ({ children }) => (
  <p className="text-center text-lg lg:text-2xl text-slate-600 mb-6 lg:mb-8 leading-relaxed">{children}</p>
);

/* ============ Смужка-схема: ціле розбито на рівні частини ============ */
const Bar = ({ parts, shaded, top, cell, rest, bottom }) => (
  <div className="w-full max-w-2xl mx-auto select-none">
    <div style={{ width: `${(shaded / parts) * 100}%` }} className="text-center">
      <div className="text-lg sm:text-xl lg:text-3xl font-extrabold text-brand min-h-[1.6em]">{top}</div>
      <div className="h-2.5 border-2 border-b-0 border-brand rounded-t-md" />
    </div>
    <div className="flex mt-1.5 border-2 border-brand rounded-xl overflow-hidden bg-white">
      {Array.from({ length: parts }).map((_, i) => (
        <div key={i}
          className={`flex-1 h-12 sm:h-16 lg:h-20 flex items-center justify-center text-xl lg:text-4xl font-bold font-math ${i < shaded ? 'bg-brandMid text-brand' : 'bg-white text-slate-700'} ${i ? 'border-l-2 border-brand' : ''}`}>
          {(i < shaded ? cell : rest) ? <span className="pop">{i < shaded ? cell : rest}</span> : null}
        </div>
      ))}
    </div>
    <div className="mt-1.5 h-2.5 border-2 border-t-0 border-slate-700 rounded-b-md" />
    <div className="text-center text-lg sm:text-xl lg:text-3xl font-extrabold text-slate-800 min-h-[1.6em]">{bottom}</div>
  </div>
);

/* ============ Розв'язання по кроках ============ */
const Worked = ({ examples, onAll }) => {
  const [ex, setEx] = useState(0);
  const [shown, setShown] = useState(1);
  const e = examples[ex];
  const done = shown >= e.lines.length;
  const last = ex === examples.length - 1;
  useEffect(() => { if (done && last && onAll) onAll(); }, [done, last]);
  return (
    <div className="rounded-2xl border-2 border-brandMid bg-white p-4 lg:p-8">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4 lg:mb-6">
        <p className="text-lg lg:text-2xl font-bold text-slate-600">{examples.length > 1 ? `Приклад ${ex + 1}` : 'Розв’язання'}</p>
        {examples.length > 1 && (
          <div className="flex gap-2">
            {examples.map((_, i) => (
              <button key={i} aria-label={`Приклад ${i + 1}`} onClick={() => { setEx(i); setShown(1); }}
                className={`w-11 h-11 lg:w-12 lg:h-12 rounded-full border-2 font-extrabold lg:text-xl cursor-pointer ${i === ex ? 'bg-brand border-brand text-white' : 'bg-white border-brandMid text-brand hover:bg-brandLight'}`}>{i + 1}</button>
            ))}
          </div>
        )}
      </div>
      {e.task && <p className="text-lg lg:text-2xl text-slate-700 leading-relaxed mb-5"><T s={e.task} /></p>}
      <div className="space-y-5 lg:space-y-7">
        {e.lines.slice(0, shown).map(([lbl, tex], i) => (
          <div key={ex + '-' + i} className="fade">
            <p className="text-lg lg:text-2xl text-slate-600 mb-2"><span className="font-extrabold text-brand mr-2">{i + 1})</span>{lbl}</p>
            <div className="text-3xl lg:text-5xl leading-relaxed"><M t={tex} /></div>
          </div>
        ))}
      </div>
      <div className="mt-5 lg:mt-8 flex flex-wrap gap-3">
        {!done && <Btn kind="light" onClick={() => setShown(s => s + 1)}>Наступний крок ↓</Btn>}
        {done && !last && <Btn kind="light" onClick={() => { setEx(ex + 1); setShown(1); }}>Ще приклад →</Btn>}
      </div>
    </div>
  );
};

/* ============ «Спробуй сам»: кілька віконець в одному записі ============ */
// частини: { t } текст · { frac:[n,d] } · { num:'200' } · { br:true } — новий рядок
const TryChain = ({ parts, onDone }) => {
  const [vals, setVals] = useState({});
  const [sts, setSts] = useState({});
  const isIn = p => p.frac || p.num !== undefined;
  const okOf = (p, v) => (p.frac ? fracOk(v, p.frac) : numOk(v, p.num));
  const check = () => {
    const r = {}; let all = true;
    parts.forEach((p, i) => { if (isIn(p)) { const ok = okOf(p, vals[i]); r[i] = ok ? 'ok' : 'bad'; if (!ok) all = false; } });
    setSts(r);
    if (all && onDone) onDone();
  };
  const firstBad = parts.findIndex((p, i) => sts[i] === 'bad');
  const allOk = parts.some(isIn) && parts.every((p, i) => !isIn(p) || sts[i] === 'ok');
  const reset = i => { setSts({}); };
  return (
    <div className="fade border-2 border-dashed border-brandLine bg-white rounded-2xl p-4 lg:p-8">
      <p className="text-lg lg:text-2xl font-bold text-slate-600 mb-4">✎ Спробуй сам</p>
      <div className="flex flex-wrap items-center justify-center gap-3 lg:gap-5 text-3xl lg:text-5xl">
        {parts.map((p, i) => {
          if (p.br) return <span key={i} className="basis-full h-0" />;
          if (p.t) return <span key={i}><M t={p.t} /></span>;
          return (
            <span key={i} className="inline-flex flex-col items-center">
              {p.frac
                ? <FracInput value={vals[i]} onChange={x => { setVals(v => ({ ...v, [i]: x })); reset(i); }} state={sts[i]} />
                : <NumInput value={vals[i]} onChange={x => { setVals(v => ({ ...v, [i]: x })); reset(i); }} state={sts[i]} />}
              <span className={`block text-center text-sm lg:text-lg font-medium mt-2 leading-tight max-w-[8rem] ${p.blue ? 'text-sky-700 font-bold' : 'text-slate-500'}`}>{p.label}</span>
            </span>
          );
        })}
        <Btn onClick={check}>Перевірити</Btn>
      </div>
      {allOk && <p className="pop mt-4 text-center text-xl lg:text-3xl font-bold text-green-600">✓ Правильно!</p>}
      {firstBad >= 0 && <p className="pop mt-4 text-center text-lg lg:text-2xl text-red-500">Ще раз! <span className="text-slate-600">{parts[firstBad].help}</span></p>}
    </div>
  );
};

/* ============ КРОКИ ПОЯСНЕННЯ ============ */

// 1. Задача про вишні: схема і два кроки
const Step1 = ({ setReady }) => {
  const [shown, setShown] = useState(0);
  useEffect(() => setReady(shown >= 2), [shown]);
  const lines = [
    ['7 частин — це 28 дерев. Знаходимо одну частину:', '^28 : 7 = 4'],
    ['Усіх частин 9. Знаходимо всі дерева:', '4 * 9 = 36'],
  ];
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Задача</Title>
      <p className="text-xl lg:text-3xl leading-relaxed text-center mb-8 lg:mb-10">
        <T s="У саду ростуть 28 вишень. Це {7/9} усіх дерев. Скільки всього дерев росте в саду?" />
      </p>
      <Bar parts={9} shaded={7} top="28 вишень" cell={shown >= 1 ? '4' : ''} rest={shown >= 2 ? '4' : ''} bottom={shown >= 2 ? '36 дерев' : '? дерев'} />
      <div className="mt-8 lg:mt-10 space-y-5 lg:space-y-7">
        {lines.slice(0, shown).map(([lbl, tex], i) => (
          <div key={i} className="fade text-center">
            <p className="text-lg lg:text-2xl text-slate-600 mb-2"><span className="font-extrabold text-brand mr-2">{i + 1})</span>{lbl}</p>
            <div className="text-3xl lg:text-5xl"><M t={tex} /></div>
          </div>
        ))}
        {shown >= 2 && <div className="pop text-center"><Rule>Відповідь: 36 дерев.</Rule></div>}
      </div>
      {shown < 2 && <div className="mt-8 text-center"><Btn kind="light" onClick={() => setShown(s => s + 1)}>Наступний крок ↓</Btn></div>}
    </div>
  );
};

// 2. Правило (за підручником) + приклад
const Step2 = ({ setReady }) => {
  const [done, setDone] = useState(false);
  useEffect(() => setReady(done), [done]);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Правило</Title>
      <Rule>Щоб знайти <span className="text-brand">число за заданим значенням його дробу</span>, можна дане значення <span className="text-green-600">поділити</span> на цей дріб.</Rule>
      <p className="text-lg lg:text-2xl text-slate-600 text-center my-6 lg:my-8">Повернімося до задачі про вишні.</p>
      <Worked onAll={() => setDone(true)} examples={[{
        task: '28 вишень — це {7/9} усіх дерев. Скільки всього дерев?',
        lines: [
          ['Ділимо значення на дріб', '^28 : ~7/9 = 28/1 * ~9/7'],
          ['Скорочуємо й рахуємо', '= 28*9/1*7 = 36'],
        ],
      }]} />
    </div>
  );
};

// 3. Множимо чи ділимо?
const Step3 = ({ setReady }) => {
  const items = [
    { t: 'У класі 30 учнів. {2/5} з них — хлопці. Скільки хлопців?', op: 'mul', res: '^30 * ~2/5 = 12' },
    { t: 'У класі 12 хлопців. Це {2/5} усіх учнів. Скільки учнів у класі?', op: 'div', res: '^12 : ~2/5 = 30' },
    { t: 'У книзі 240 сторінок. Даринка прочитала {3/5} книги. Скільки сторінок вона прочитала?', op: 'mul', res: '^240 * ~3/5 = 144' },
    { t: 'Даринка прочитала 144 сторінки. Це {3/5} книги. Скільки сторінок у книзі?', op: 'div', res: '^144 : ~3/5 = 240' },
  ];
  const [st, setSt] = useState(items.map(() => null));
  const all = st.every(s => s === 'ok');
  useEffect(() => setReady(all), [all]);
  const pick = (i, op) => setSt(s => s.map((x, j) => (j === i ? (items[i].op === op ? 'ok' : 'bad') : x)));
  return (
    <div className="max-w-4xl mx-auto">
      <Title>Множимо чи ділимо?</Title>
      <Sub>Що відомо: <b>ціле</b> чи <b>частина</b>?</Sub>
      <div className="grid md:grid-cols-2 gap-4 lg:gap-6">
        {items.map((it, i) => (
          <div key={i} className={`rounded-2xl border-2 p-4 lg:p-6 bg-white ${st[i] === 'ok' ? 'border-green-300' : st[i] === 'bad' ? 'border-red-300 nudge' : 'border-brandMid'}`}>
            <p className="text-lg lg:text-2xl leading-relaxed mb-4"><T s={it.t} /></p>
            {st[i] === 'ok' ? (
              <div className="pop">
                <p className="text-base lg:text-xl text-slate-600 mb-2">{it.op === 'mul' ? 'Відоме ціле число — множимо.' : 'Відоме значення дробу — ділимо.'}</p>
                <div className="text-3xl lg:text-4xl"><M t={it.res} /></div>
              </div>
            ) : (
              <div>
                <div className="flex flex-wrap gap-3">
                  <Btn kind="light" onClick={() => pick(i, 'mul')}>Множимо</Btn>
                  <Btn kind="light" onClick={() => pick(i, 'div')}>Ділимо</Btn>
                </div>
                {st[i] === 'bad' && <p className="pop mt-3 text-base lg:text-xl text-red-500">Ще раз. Що відомо: ціле чи частина?</p>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

// 4. Спробуй сам: дріб
const Step4 = ({ setReady }) => {
  const [done, setDone] = useState(false);
  useEffect(() => setReady(done), [done]);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Спробуй сам</Title>
      <p className="text-xl lg:text-3xl text-center leading-relaxed mb-6 lg:mb-8"><T s="Знайди число, {3/4} якого дорівнюють {12}." /></p>
      <TryChain onDone={() => setDone(true)} parts={[
        { t: '^12 : ~3/4 = 12/1 *' },
        { frac: [4, 3], label: 'обернений дріб', blue: true, help: 'Переверни дільник 3/4.' },
        { t: '=' },
        { num: '16', label: 'число', help: 'Помнож 12 на 4 і поділи на 3.' },
      ]} />
    </div>
  );
};

// 5. Приклади
const Step5 = ({ setReady }) => {
  useEffect(() => setReady(true), []);
  return (
    <div className="max-w-3xl mx-auto">
      <Title>Приклади</Title>
      <Worked examples={[
        { task: 'Знайдіть число, {7/9} якого дорівнюють {63}.', lines: [
          ['Ділимо число на цей дріб', '^63 : ~7/9 = 63/1 * ~9/7'],
          ['Скорочуємо й рахуємо', '= 63*9/1*7 = 81'],
        ] },
        { task: 'Знайдіть число, {0,9} якого дорівнюють {81}.', lines: [
          ['Записуємо 0,9 звичайним дробом', '0,9 = ~9/10'],
          ['Ділимо число на цей дріб', '^81 : ~9/10 = 81/1 * ~10/9'],
          ['Скорочуємо й рахуємо', '= 81*10/1*9 = 90'],
        ] },
        { task: 'Знайдіть число, {8/15} якого дорівнюють {40}.', lines: [
          ['Ділимо число на цей дріб', '^40 : ~8/15 = 40/1 * ~15/8'],
          ['Скорочуємо й рахуємо', '= 40*15/1*8 = 75'],
        ] },
        { task: 'Даринка прочитала 144 сторінки, що становило {3/5} сторінок книги. Скільки сторінок у книзі?', lines: [

const Dropdown = ({ value, options, onChange, state }) => {
  const [open, setOpen] = useState(false);
  const [up, setUp] = useState(false);
  const ref = useRef(null);
  // Список відкривається вгору, якщо знизу мало місця (щоб його не обрізало)
  const toggle = () => {
    if (!open && ref.current) {
      const r = ref.current.getBoundingClientRect();
      setUp(window.innerHeight - r.bottom < 280);
    }
    setOpen(o => !o);
  };
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', h);
    return () => document.removeEventListener('pointerdown', h);
  }, []);
  const border = state === 'ok' ? 'border-green-500' : state === 'bad' ? 'border-red-400' : 'border-brandLine';
  return (
    <div ref={ref} className="relative inline-block">
      <button type="button" onClick={toggle}
        className={`min-w-[9.5rem] min-h-[3.5rem] px-4 py-1 rounded-xl border-2 ${border} bg-white flex items-center justify-between gap-3 text-xl lg:text-3xl cursor-pointer`}>
        {value ? <M t={value} /> : <span className="text-slate-400 text-lg lg:text-xl">— обери —</span>}
        <span className={`text-base text-accent transition-transform ${open ? 'rotate-180' : ''}`}>▾</span>
      </button>
      {open && (
        <div className={`pop absolute z-40 left-0 ${up ? 'bottom-full mb-2' : 'mt-2'} min-w-full bg-white border-2 border-brandLine rounded-xl shadow-lg py-1`}>
          {options.map(o => (
            <button key={o} type="button" onClick={() => { onChange(o); setOpen(false); }}
              className={`block w-full text-left px-5 py-2.5 text-xl lg:text-3xl whitespace-nowrap cursor-pointer hover:bg-brandLight ${o === value ? 'bg-brandMid' : ''}`}>
              <M t={o} />

        </div>

  );
};

/* ============ Без прокрутки: вміст сам підлаштовується під висоту екрана ============
   Якщо крок вищий за вікно, його масштаб зменшується рівно настільки, щоб усе вмістилося. */
const Fit = ({ children }) => {
  const box = useRef(null);
  const inner = useRef(null);
  const [k, setK] = useState(1);
  useEffect(() => {
    const calc = () => {
      const b = box.current, i = inner.current;
      if (!b || !i) return;
      const h = i.offsetHeight, avail = b.clientHeight;
      const s = h > avail ? Math.max(0.35, avail / h) : 1;
      setK(prev => (Math.abs(prev - s) > 0.004 ? s : prev));
    };
    calc();
    const ro = new ResizeObserver(calc);
    ro.observe(box.current);
    ro.observe(inner.current);
    window.addEventListener('resize', calc);
    return () => { ro.disconnect(); window.removeEventListener('resize', calc); };
  }, []);
  return (
    <div ref={box} className="h-full w-full overflow-hidden">
      <div ref={inner} className="px-4 py-4 lg:px-10 lg:py-8"
        style={{ transform: `scale(${k})`, transformOrigin: 'top center' }}>
        {children}
      </div>
    </div>
  );
};

          <span className="w-12 h-12 lg:w-14 lg:h-14 rounded-full bg-brand text-white flex items-center justify-center text-lg pl-1">▶</span>
          ПОЧАТИ
        </button>
      </div>
    </div>
  );

  return (
    <div className="h-full flex flex-col font-ui">
      <div className="shrink-0 flex items-center gap-3 px-4 py-1.5 lg:px-6 lg:py-2 border-b border-brandMid bg-panelLeft">
        <Btn kind="light" onClick={() => setMenu(m => !m)}>☰ Зміст</Btn>
        <div className="flex-1 flex items-center justify-center gap-1.5 lg:gap-2">
          {STEPS.map((s, i) => (
            <span key={i} title={s.name}
              className={`h-2.5 lg:h-3 rounded-full transition-all ${i === step ? 'w-8 lg:w-12 bg-brand' : i <= seen ? 'w-2.5 lg:w-3 bg-brandLine' : 'w-2.5 lg:w-3 bg-slate-200'}`} />
          ))}
        </div>
        <span className="text-sm lg:text-lg font-extrabold text-brand whitespace-nowrap">{step + 1} / {STEPS.length}</span>
      </div>

      <div className="flex-1 min-h-0 overflow-hidden bg-panelRight">
       <Fit>
        {menu ? (
          <div className="fade max-w-3xl mx-auto">
            <Title>Зміст уроку</Title>
            <div className="grid sm:grid-cols-2 gap-3">
              {STEPS.map((s, i) => (
                <button key={i} onClick={() => go(i)}
                  className={`flex items-center gap-4 p-3 lg:p-5 rounded-xl border-2 text-left cursor-pointer transition-all hover:border-accent hover:bg-brandLight ${i === step ? 'border-accent bg-brandLight' : 'border-brandMid bg-white'}`}>
                  <span className="w-10 h-10 lg:w-12 lg:h-12 shrink-0 rounded-full bg-brandMid text-brand font-extrabold flex items-center justify-center lg:text-xl">
                    {s.name.startsWith('Практикум') ? '✎' : i + 1}
                  </span>
                  <span className="text-lg lg:text-2xl font-bold">{s.name}</span>
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div key={step} className="fade"><Cur setReady={setReady} /></div>
        )}
       </Fit>
      </div>

      <div className="shrink-0 flex justify-between items-center gap-3 px-4 py-1.5 lg:px-6 lg:py-2 border-t border-brandMid bg-panelLeft">
        <div className="w-32 lg:w-36 shrink-0 flex justify-start">
          {!menu && <Btn kind="grey" disabled={step === 0} onClick={() => go(step - 1)}>← Назад</Btn>}
        </div>
        <Author className="flex-1 min-w-0" />
        <div className="w-32 lg:w-36 shrink-0 flex justify-end">
          {!menu && (step < STEPS.length - 1
            ? <Btn disabled={!canNext} onClick={() => go(step + 1)}>Далі →</Btn>
            : <Btn kind="light" onClick={() => setStarted(false)}>На початок</Btn>)}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }

  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
