<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моніторинг за Блумом</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#3b3552;
  background:linear-gradient(135deg,#fde7f1 0%,#efe9fb 35%,#e3f1fb 65%,#e4f6ea 100%);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#app{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 10px 0}
.screen{width:100%;max-width:820px;display:flex;flex-direction:column;min-height:0;position:relative}
.card{background:rgba(255,255,255,.9);border-radius:18px;box-shadow:0 4px 18px rgba(120,100,170,.14);padding:16px 18px;position:relative}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
h1{font-size:22px;color:#5a4b8a;text-align:center;margin-bottom:4px}
h2{font-size:15px;color:#5a4b8a;margin:16px 0 8px}
.sub{font-size:13px;color:#7d7699;text-align:center;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:#5a4b8a;margin:12px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;color:#3b3552;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#a695d6}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:10px 8px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:15px;font-weight:600;color:#5a4b8a;cursor:pointer}
.seg button.on{background:#e5dcf7;border-color:#a695d6}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;border:none;background:#b9a6ea;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#a994e0}
.btn:disabled{background:#d8d0ec;cursor:default}
.btn.soft{background:#ece6f8;color:#5a4b8a}
.btn.soft:hover{background:#e0d6f3}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.row6 div{text-align:center;font-size:11px;color:#7d7699}
.err{color:#b04a5a;font-size:13px;margin-top:8px;min-height:18px;text-align:center}
.note{font-size:12px;color:#8b84a3;margin-top:8px;line-height:1.45}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;color:#7d7699}
.tm{font-weight:700;color:#5a4b8a;font-size:15px;font-variant-numeric:tabular-nums}
.tm.low{color:#b04a5a}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.dots span{width:11px;height:11px;border-radius:50%;background:#ddd5f1;cursor:pointer}
.dots span.a{background:#b9a6ea}
.dots span.c{outline:2px solid #8e7cc3;outline-offset:1px}
.qbox{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.q{font-size:18px;line-height:1.55;color:#2f2946}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:11px 12px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:16px;cursor:pointer;text-align:left;color:#2f2946;min-height:46px;display:flex;align-items:center}
.opt:hover{border-color:#b9a6ea}
.opt.on{background:#e5dcf7;border-color:#8e7cc3}
.disp{min-height:50px;border-radius:12px;border:1.5px solid #d9d0ee;background:#fff;font-size:24px;padding:8px 14px;color:#2f2946;display:flex;align-items:center}
.disp .ph{color:#b6afcc;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad button{padding:10px 0;border-radius:12px;border:none;background:#efe9fb;font-size:20px;font-weight:600;color:#4a3d78;cursor:pointer}
.pad button:active{background:#ddd2f4}
.act{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.link{background:none;border:none;color:#8b84a3;font-size:13px;text-decoration:underline;cursor:pointer}
.open{border-top:1px dashed #d9d0ee;padding-top:8px}
.open .lb{font-size:13px;color:#5a4b8a;font-weight:600;margin-bottom:4px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em;line-height:1.2}
.fr i{font-style:normal;padding:0 4px}
.fr i:first-child{border-bottom:1.6px solid currentColor}
sub,sup{font-size:.7em}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:700;font-size:17px;margin:6px 0;background:#e5dcf7;color:#5a4b8a}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:#f6f2fd;border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:19px;color:#5a4b8a}
.stat span{font-size:11px;color:#8b84a3}
.lvl{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar{height:14px;border-radius:8px;background:#ece6f8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.g{background:#8fd1a6}.y{background:#f1d36b}.r{background:#eb9aa5}.n{background:#d9d4e6}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#ece6f8;color:#5a4b8a}
.trow{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1.5px solid #ece6f8;border-radius:12px;margin-bottom:6px;background:#fff;cursor:pointer}
.trow.off{opacity:.5;cursor:default;background:#f6f4fa}
.trow input{margin-top:3px;width:18px;height:18px}
.trow .tn{font-size:14px;font-weight:600}
.trow .tr{font-size:12px;color:#8b84a3}
.qb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.linkbox{background:#f6f2fd;border-radius:12px;padding:10px;margin-top:10px;word-break:break-all;font-size:13px}
.linkbox input{font-size:12px}
.key{position:absolute;top:8px;right:10px;background:none;border:none;font-size:15px;opacity:.5;cursor:pointer;z-index:2}
.key:hover{opacity:1}
.modal{position:fixed;inset:0;background:rgba(60,50,90,.28);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
.modal .box{background:#fff;border-radius:18px;padding:16px;max-width:1100px;width:100%;max-height:90dvh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid #eee8f8;padding:6px 5px;text-align:left;vertical-align:top}
th{color:#5a4b8a;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover{background:#f6f2fd}
.mis{font-size:13px;line-height:1.5;border-bottom:1px dashed #e3dcf3;padding:8px 0}
.mis .a{color:#a33b4a}.mis .ok{color:#2f6b45}
.gtask{border:1.5px solid #ece6f8;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.5}
.gtask input[type=number]{width:70px;display:inline-block;padding:5px 8px}
.sy{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}.sy button{min-width:38px;padding:6px 10px;border:1.5px solid #cdbff0;background:#fff;border-radius:10px;font-size:16px;color:#5a4b8a}.sy button:active{background:#e9e2fb}.xsel{width:100%;padding:10px 12px;border:1.5px solid #cdbff0;border-radius:12px;font-size:16px;background:#fff;color:inherit}.xrow{margin:12px 0}.xrow .xl{margin-bottom:6px}.xrow input[type=text]{width:100%;padding:10px 12px;border:1.5px solid #cdbff0;border-radius:12px;font-size:16px;box-sizing:border-box}
table.kt{width:auto;margin:0 0 8px}
.nrow.nw{flex-wrap:wrap}.nrow.nw>span:first-child{flex:1 1 100%}.nrow .wg,.nrow .fr,.nrow .fb,.nrow .wg span{flex:none}.nrow .fb{width:100%}
.wg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;vertical-align:middle}
.wi{width:92px!important;min-width:0;text-align:center}.fr{display:inline-flex;flex-direction:column;align-items:center;gap:3px}.fr .wi{width:120px!important}.fb{display:block;height:2px;background:#5a4b8a;width:100%;border-radius:2px}
.bsel{width:auto!important;font-size:20px;padding:6px 4px;border:1.5px solid #cdbff0;border-radius:8px;background:#fff}
.hint{font-size:13px;color:#5a4b8a;background:#f3eefc;border-radius:8px;padding:6px 10px;margin:4px 0 6px}.gerr{color:#c0392b;font-weight:600;font-size:14px;margin:8px 0}
.phs{margin-top:8px}.phb{display:inline-block;padding:9px 14px;border:1.5px dashed #8f7bd0;border-radius:12px;color:#5a4b8a;font-weight:600;font-size:14px;cursor:pointer;background:#faf7ff}.phn{font-size:12px;color:#7a6fa0;margin-left:8px}
#pth{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pt{position:relative}.pt img{height:84px;border-radius:8px;border:1px solid #cdbff0;display:block}.pt button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-size:12px;line-height:22px;padding:0}
.ptv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.ptv img{max-height:140px;border-radius:8px;border:1px solid #cdbff0;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(20,10,40,.88);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out}.zoom img{max-width:96vw;max-height:96vh}
table.kt th,table.kt td{border:1px solid #d9d0ee;padding:4px 8px}.stim{background:#f6f2fd;border-radius:12px;padding:8px 10px;margin-bottom:8px;overflow-x:auto;font-size:13px}.kfig{width:100%;max-width:420px;color:#4a3f78}.mrow{margin:8px 0}.mrow .ml{font-size:14px;margin-bottom:4px}.mrow .mo{display:grid;grid-template-columns:1fr 1fr;gap:6px}.nrow{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}.nrow span{flex:1}.nrow input{width:110px}
#foot{font-size:10px;letter-spacing:.05em;color:#9ca3af;text-align:center;padding:6px 0 8px}
#foot b{font-weight:700}
.banner{background:#fff1c2;color:#8a6a00;border-radius:10px;padding:6px 10px;font-size:12px;text-align:center;margin-bottom:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.q{font-size:17px}h1{font-size:20px}.lvl{grid-template-columns:96px 1fr 54px}}
@media (max-height:640px){.pad button{padding:7px 0;font-size:18px}.q{font-size:16px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="foot">Автор розробки <b>Ковтун Тетяна</b></div>
<script>
var APP_MON=true;
