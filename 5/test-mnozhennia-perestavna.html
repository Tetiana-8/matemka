<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест. Множення. Переставна властивість множення (5 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a1736;--muted:#8a5a78;
  --acc:#be185d;--acc2:#e5508a;--accL:#fce7f3;--soft:#fdeff5;--soft2:#fff7fa;--line:#f3cfe0;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;
  --warnbg:#fff6e5;--warntx:#8a5a00;
  --card:#ffffff;
  --cw:2.7rem;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:linear-gradient(135deg,#ffe3ee 0%,#fbd0e6 30%,#e9d9fb 62%,#d5f3ee 100%) fixed}
html,body{margin:0}
body{
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#ffe3ee 0%,#fbd0e6 30%,#e9d9fb 62%,#d5f3ee 100%) fixed;
}
body.kpOn{padding-bottom:9.5rem}
.wrap{max-width:860px;margin:0 auto;padding-block:26px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(120,20,70,.14);padding:22px 24px;margin-bottom:18px}
header.card{text-align:center;padding:26px 24px}
h1{margin:0;font-size:clamp(1.4rem,4vw,2.1rem);font-weight:900;line-height:1.25;
  background:linear-gradient(90deg,#be185d,#e5508a);-webkit-background-clip:text;background-clip:text;color:transparent}
.student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.student label{display:block;font-weight:800;font-size:.9rem;color:var(--muted);text-align:left;margin-bottom:4px}
.student input{width:100%;font:inherit;font-size:1.05rem;padding:10px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--soft);color:var(--ink)}
.student input:focus{border-color:var(--acc);background:#fff}
.student input.need{border-color:var(--bad);background:var(--badbg)}
.studentMsg{color:var(--bad);font-weight:800;margin-top:8px;min-height:1.2em}

.q{position:relative}
.qh{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.15rem;
  background:linear-gradient(135deg,#be185d,#e5508a)}
.qt{flex:1;min-width:0;font-size:1.12rem;font-weight:700;line-height:1.5;padding-top:6px}
.qt i,.opt i,.tx i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:none;place-items:center;font-size:1.4rem;font-weight:900;color:#fff}
.q.ok .mark{display:grid;background:var(--ok)}
.q.bad .mark{display:grid;background:var(--bad)}
.q.ok{box-shadow:0 0 0 3px var(--ok),0 10px 30px rgba(120,20,70,.14)}
.q.bad{box-shadow:0 0 0 3px var(--bad),0 10px 30px rgba(120,20,70,.14)}

.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.opt{font:inherit;font-weight:700;font-size:1.05rem;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;transition:.15s;text-align:left}
.opt:hover{border-color:#f0a9c7}
.opt.sel{border-color:var(--acc);background:#fbd9e8;box-shadow:0 0 0 3px rgba(190,24,93,.16)}
.opts.cmp .opt{min-width:4.2rem;text-align:center;font-size:1.6rem;font-weight:900;padding:6px 18px}
.locked .opt{cursor:default}

.tfs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tfr{display:flex;align-items:center;gap:12px;background:var(--soft2);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.tfr .tt{flex:1;min-width:0;font-weight:700;font-size:1.02rem;line-height:1.4}
.tfr .bb{flex:none;display:flex;gap:6px}
.tfb{font:inherit;font-weight:800;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--acc);cursor:pointer}
.tfb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.locked .tfb{cursor:default}

.numrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;font-weight:800;font-size:1.4rem}
.numin{width:9.5rem;font:inherit;font-size:1.4rem;font-weight:900;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--soft2);color:var(--ink);outline:none;text-align:center}
.numin:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.18)}
.numin.good,.cell.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.numin.bad,.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}

/* клітинки для цифр */
.rw{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-top:14px;font-size:1.5rem;font-weight:800}
.tx{font-weight:800}
.cell{flex:none;width:calc(var(--cw) - .3rem);height:3.1rem;padding:0;text-align:center;font:inherit;font-size:1.6rem;font-weight:900;
  color:var(--ink);background:var(--soft2);border:2px solid #eab5cd;border-radius:.6rem;outline:none;caret-color:var(--acc);
  -moz-appearance:textfield}
.cell:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.colwrap{display:flex;justify-content:center;margin-top:14px;overflow-x:auto}
.colm{display:inline-flex;flex-direction:column;align-items:flex-end;gap:.35rem;padding:.9rem 1.1rem;background:var(--soft2);border:2px dashed #eab5cd;border-radius:1rem}
.crow{display:flex}
.slot{flex:none;width:var(--cw);height:3.1rem;display:flex;align-items:center;justify-content:center}
.slot.dig{font-size:1.9rem;font-weight:900}
.slot.sg{font-size:1.8rem;font-weight:900;color:var(--acc)}
.slot.ph::after{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#e6bfd2}
.cline{align-self:stretch;height:3px;border-radius:2px;background:var(--ink);margin:.1rem 0}

.actions{text-align:center}
.btn{font:inherit;font-weight:900;font-size:1.15rem;border:0;border-radius:16px;padding:14px 34px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#be185d,#e5508a);box-shadow:0 8px 20px rgba(190,24,93,.32);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.warn{color:var(--bad);font-weight:800;margin:0 0 12px}
.warn:empty{display:none}
.result{text-align:center}
.result .big{font-size:clamp(2.4rem,8vw,3.4rem);font-weight:900;margin:4px 0;
  background:linear-gradient(90deg,#be185d,#e5508a);-webkit-background-clip:text;background-clip:text;color:transparent}
.result .who{font-weight:800;color:var(--muted);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 18px}
.chip{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:.95rem}
.chip.y{background:var(--ok)}.chip.n{background:var(--bad)}
footer{text-align:center;font:10px/1.3 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;margin-top:6px}

/* екранна цифрова клавіатура (тільки сенсорні екрани) */
#kp{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#f6e4ee;border-top:2px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  box-shadow:0 -6px 20px rgba(120,20,70,.15)}
#kp .g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:30rem;margin:0 auto}
#kp button{font:inherit;font-weight:900;font-size:1.35rem;height:2.9rem;border:0;border-radius:.7rem;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(120,20,70,.2);touch-action:manipulation}
#kp button:active{background:var(--accL)}
#kp button.fn{background:#fbd9e8;color:var(--acc)}

/* ключ учителя */
#keyBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:20;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:1.05rem;cursor:pointer;opacity:.7}
#keyBtn:hover{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(58,23,54,.45);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:1200px;box-shadow:0 20px 50px rgba(58,23,54,.3)}
.modal h2{margin:0 0 12px;font-weight:900;font-size:1.3rem}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modal input{font:inherit;font-size:1.05rem;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.sbtn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
.sbtn.g{background:#fce7f3;color:var(--acc)}
.sbtn.r{background:var(--bad)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;font-weight:900}
td.nm{text-align:left;font-weight:700}
td.y{color:var(--ok);font-weight:900}td.n{color:var(--bad);font-weight:900}
.pmsg{color:var(--bad);font-weight:800}

@media (max-width:640px){
  :root{--cw:2.4rem}
  .card{padding:18px 16px}
  .student{grid-template-columns:1fr}
  .num,.mark{width:34px;height:34px}
  .qt{font-size:1.02rem;padding-top:4px}
  .rw{font-size:1.3rem}
  .tfr{flex-direction:column;align-items:flex-start}
  .colm{padding:.7rem .6rem}
}
@media (max-width:380px){:root{--cw:2.2rem}}
</style>
</head>
<body>
<button id="keyBtn" title="Журнал учителя" aria-label="Журнал учителя">🔑</button>

<div class="wrap">
  <header class="card">
    <h1>Тест. Множення. Переставна властивість множення (5 клас)</h1>
    <div class="student">
      <div><label for="sur">Прізвище</label><input id="sur" autocomplete="off"></div>
      <div><label for="nam">Ім'я</label><input id="nam" autocomplete="off"></div>
    </div>
    <div class="studentMsg" id="studentMsg"></div>
  </header>

  <main id="questions"></main>

  <div class="card actions" id="actions">
    <p class="warn" id="warn"></p>
    <button class="btn" id="checkBtn">Перевірити</button>
  </div>

  <div class="card result" id="result" hidden></div>

  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>

<div id="kp" hidden>
  <div class="g">
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>
    <button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="next" aria-label="Далі">→</button>
  </div>
</div>

<div id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
"use strict";

/* ===================== Firebase (база math-5-892a5) ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU",
  authDomain: "math-5-892a5.firebaseapp.com",
  projectId: "math-5-892a5",
  storageBucket: "math-5-892a5.firebasestorage.app",
  messagingSenderId: "163114803328",
  appId: "1:163114803328:web:caf86c4e8b8c4b3b630665",
  measurementId: "G-E06VKZ2GP5"
};
const APP_ID = 'default-app-id';
const COLLECTION = 'results_multiplication_5';
const TEACHER_PASSWORD = '8019';
const FBV = '10.12.2';
const TEST_NAME = 'Множення. Переставна властивість множення (5 клас)';

let fbPromise = null;
function fb(){
  if(!fbPromise){
    fbPromise = (async()=>{
      const [appM, authM, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
      ]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      await authM.signInAnonymously(authM.getAuth(app));
      return { db: fs.getFirestore(app), fs };
    })();
    fbPromise.catch(() => { fbPromise = null; }); // при збої — повторна спроба
  }
  return fbPromise;
}
const coll = (db, fs) => fs.collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION);

async function saveResult(rec){
  try { const { db, fs } = await fb(); await fs.setDoc(fs.doc(coll(db, fs), rec.id), rec); }
  catch(e){ console.warn('Save failed', e); }   // учням нічого не показувати
}
async function loadResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
}
fb().catch(() => {});   // підключення одразу при відкритті сторінки

/* ===================== Допоміжне ===================== */
const $ = s => document.querySelector(s);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const I = s => `<i>${s}</i>`;
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
function digitsNoZero(n){let s='';for(let i=0;i<n;i++)s+=rnd(1,9);return s}
function digitsFrom(n,lo){let s='';for(let i=0;i<n;i++)s+=rnd(lo,9);return s}

/* ===================== Завдання (числа щоразу нові) ===================== */
function cell(q,ch){q.exp.push(String(ch));return {c:q.exp.length-1}}
function newCells(t,short){return {kind:'cells',t:t,short:short,exp:[],rowLens:[],rows:[]}}

/* множення в стовпчик: a · b, усі цифри у клітинках, порядок руху справа наліво */
function colQuestion(a,b){
  const sa=String(a), sb=String(b), fin=String(a*b);
  const q=newCells(`Виконайте множення в стовпчик. Впишіть цифри в клітинки.`,`${a} × ${b} у стовпчик`);
  const parts=sb.length>1?[...sb].reverse().map((d,i)=>({s:String(a*(+d)),shift:i})):[];
  const W=Math.max(sa.length,sb.length,fin.length,...parts.map(p=>p.s.length+p.shift))+1;
  const lines=[];
  const slotRow=(list,shift,sign)=>{
    const items=Array.from({length:W},()=>({e:1}));
    for(let j=0;j<list.length;j++) items[W-1-shift-(list.length-1-j)]=list[j];
    if(sign) items[0]={sg:sign};
    return items;
  };
  const cellsRtl=(str)=>{const o=new Array(str.length);for(let j=str.length-1;j>=0;j--)o[j]=cell(q,str[j]);q.rowLens.push(str.length);return o};
  lines.push({k:'slots',items:slotRow([...sa].map(d=>({d})),0)});
  lines.push({k:'slots',items:slotRow([...sb].map(d=>({d})),0,'×')});
  lines.push({k:'rule'});
  if(parts.length){
    parts.forEach((p,i)=>{
      const items=slotRow(cellsRtl(p.s),p.shift,i===1?'+':null);
      for(let s=0;s<p.shift;s++) items[W-1-s]={ph:1};
      lines.push({k:'slots',items});
    });
    lines.push({k:'rule'});
  }
  lines.push({k:'slots',items:slotRow(cellsRtl(fin),0)});
  q.rows=[{k:'col',lines}];
  q.colA=a;q.colB=b;
  return q;
}

function genQuestions(){
  const Q=[];

  /* 1. добуток як сума */
  {
    const a=rnd(2,9), b=rnd(3,5);
    const q=newCells(`Запишіть добуток ${I(a+' · '+b)} у вигляді суми однакових доданків.`,`${a} · ${b} як сума`);
    const items=[`${a} · ${b} =`];
    for(let i=0;i<b;i++){ if(i) items.push('+'); items.push(cell(q,a)); }
    q.rows=[{k:'flow',items}]; q.rowLens=[b];
    Q.push(q);
  }

  /* 2–3. назви компонентів */
  {
    let a=rnd(2,9), b; do{b=rnd(2,9)}while(b===a);
    const c=a*b;
    Q.push({kind:'choice',short:`назва чисел ${a} і ${b}`,
      t:`У рівності ${I(a+' · '+b+' = '+c)} числа ${I(a)} і ${I(b)} називають…`,
      opts:['множниками','доданками','добутками','сумами'],ans:0});
    Q.push({kind:'choice',short:`назва числа ${c}`,
      t:`У рівності ${I(a+' · '+b+' = '+c)} число ${I(c)} і запис ${I(a+' · '+b)} називають…`,
      opts:['добутком','множниками','доданками','сумою'],ans:0});
  }

  /* 4. формулювання переставної властивості */
  Q.push({kind:'choice',short:'формулювання переставної властивості',
    t:`Яке твердження є переставною властивістю множення?`,
    opts:['Від перестановки множників добуток не змінюється.',
          'Від перестановки доданків сума не змінюється.',
          'Якщо один із множників дорівнює 1, то добуток дорівнює другому множнику.',
          'Від перестановки множників добуток збільшується.'],ans:0});

  /* 5. запис літерами */
  Q.push({kind:'choice',short:'запис переставної властивості літерами',
    t:`Яка рівність виражає переставну властивість множення?`,
    opts:[`${I('a')} · ${I('b')} = ${I('b')} · ${I('a')}`,`${I('a')} + ${I('b')} = ${I('b')} + ${I('a')}`,`${I('a')} · 1 = ${I('a')}`,`${I('a')} · 0 = 0`],ans:0});

  /* 6. відомий добуток — переставити множники */
  {
    const a=rnd(11,49); let b; do{b=rnd(11,49)}while(b===a);
    const P=a*b;
    const q=newCells(`Відомо, що ${I(a+' · '+b)} = ${fmt(P)}. Не виконуючи множення, запишіть, чому дорівнює ${I(b+' · '+a)}.`,`${b} · ${a}, якщо ${a} · ${b} = ${P}`);
    const items=[`${b} · ${a} =`];
    [...String(P)].forEach(ch=>items.push(cell(q,ch)));
    q.rows=[{k:'flow',items}]; q.rowLens=[String(P).length];
    Q.push(q);
  }

  /* 7. пропущений множник за переставною властивістю */
  {
    const a=rnd(3,9), b=rnd(12,29);
    const q=newCells(`Впишіть пропущене число. Скористайтеся переставною властивістю множення.`,`пропущений множник: ${b} · ${a} = ${a} · ?`);
    const items=[`${b} · ${a} = ${a} ·`];
    [...String(b)].forEach(ch=>items.push(cell(q,ch)));
    q.rows=[{k:'flow',items}]; q.rowLens=[String(b).length];
    Q.push(q);
  }

  /* 8. порівняння без обчислень */
  {
    const x=rnd(21,89); let y; do{y=rnd(21,89)}while(y===x);
    Q.push({kind:'choice',keep:true,cmp:true,short:`порівняння ${x} · ${y} і ${y} · ${x}`,
      t:`Не виконуючи множення, порівняйте вирази ${I(x+' · '+y)} і ${I(y+' · '+x)}. Оберіть знак.`,
      opts:['&lt;','=','&gt;'],ans:1});
  }

  /* 9. множник 1 */
  {
    const a=rnd(120,989), left=Math.random()<.5;
    Q.push({kind:'num',short:left?`${a} · 1`:`1 · ${a}`,t:`Знайдіть добуток.`,lbl:left?`${fmt(a)} · 1 =`:`1 · ${fmt(a)} =`,ans:a});
  }

  /* 10. множник 0 */
  {
    const a=rnd(1200,9890), left=Math.random()<.5;
    Q.push({kind:'num',short:left?`${a} · 0`:`0 · ${a}`,t:`Знайдіть добуток.`,lbl:left?`${fmt(a)} · 0 =`:`0 · ${fmt(a)} =`,ans:0});
  }

  /* 11. так / ні */
  {
    const items=shuffle([
      {t:'Від перестановки множників добуток не змінюється.',ok:true},
      {t:'Якщо один із множників дорівнює 1, то добуток дорівнює 1.',ok:false},
      {t:'Якщо один із множників дорівнює нулю, то добуток дорівнює нулю.',ok:true},
      {t:'Добуток двох чисел, відмінних від нуля, може дорівнювати нулю.',ok:false},
      {t:`${rnd(2,9)*11} · 1 = 1 · ${'?'}`,ok:true}
    ]);
    items.forEach(it=>{
      if(it.t.indexOf('?')>-1){const n=it.t.split(' ')[0];it.t=`${n} · 1 = 1 · ${n}`;}
    });
    Q.push({kind:'tf',short:'вірні й хибні твердження',t:`Для кожної рівності чи твердження оберіть «Так» (правильно) або «Ні» (неправильно).`,items:items});
  }

  /* 12. добуток дорівнює нулю */
  Q.push({kind:'choice',short:'добуток дорівнює нулю',
    t:`Добуток двох чисел дорівнює нулю. Що можна стверджувати?`,
    opts:['Хоча б один із множників дорівнює нулю.','Жоден із множників не дорівнює нулю.','Обидва множники дорівнюють 1.','Один із множників дорівнює 1.'],ans:0});

  /* 13–16. множення в стовпчик */
  {
    let a=+digitsNoZero(3), b=rnd(2,9);
    Q.push(colQuestion(a,b));
    a=+(rnd(1,9)+'0'+rnd(1,9)); b=rnd(2,9);
    Q.push(colQuestion(a,b));
    a=+digitsNoZero(2); b=+digitsFrom(2,2);
    Q.push(colQuestion(a,b));
    a=+digitsNoZero(3); b=+digitsFrom(2,2);
    Q.push(colQuestion(a,b));
  }
  return Q;
}

/* ===================== Побудова тесту ===================== */
let QUESTIONS=genQuestions();
const N=QUESTIONS.length;
const qWrap=$('#questions');
const touch=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
let state=null;
let lastLeave=0;

function initVal(q){
  if(q.kind==='cells') return q.exp.map(()=> '');
  if(q.kind==='choice') return null;
  if(q.kind==='num') return '';
  return q.items.map(()=>null);
}
function cellHTML(qi,k){
  return `<input class="cell" data-q="${qi}" data-k="${k}" maxlength="1" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="цифра">`;
}
function rowsHTML(q,qi){
  let h='';
  q.rows.forEach(r=>{
    if(r.k==='flow'){
      h+=`<div class="rw">`+r.items.map(it=> typeof it==='string'?`<span class="tx">${it}</span>`:cellHTML(qi,it.c)).join('')+`</div>`;
    }else{
      h+=`<div class="colwrap"><div class="colm">`;
      r.lines.forEach(l=>{
        if(l.k==='rule') h+=`<div class="cline"></div>`;
        else h+=`<div class="crow">`+l.items.map(it=>{
          if(it.e) return `<span class="slot"></span>`;
          if(it.d!==undefined) return `<span class="slot dig">${it.d}</span>`;
          if(it.sg) return `<span class="slot sg">${it.sg}</span>`;
          if(it.ph) return `<span class="slot ph"></span>`;
          return `<span class="slot">${cellHTML(qi,it.c)}</span>`;
        }).join('')+`</div>`;
      });
      h+=`</div></div>`;
    }
  });
  return h;
}

function build(){
  QUESTIONS=genQuestions();
  state={val:QUESTIONS.map(initVal),orders:[],checked:false,startTs:0,leaves:0};
  qWrap.innerHTML='';
  QUESTIONS.forEach((q,qi)=>{
    const el=document.createElement('section');
    el.className='card q';el.id='q'+qi;
    let h=`<div class="qh"><span class="num">${qi+1}</span><div class="qt">${q.t}</div><span class="mark"></span></div>`;
    if(q.kind==='choice'){
      const order=q.keep?q.opts.map((_,i)=>i):shuffle(q.opts.map((_,i)=>i));
      state.orders[qi]=order;
      h+=`<div class="opts${q.cmp?' cmp':''}">${order.map(i=>`<button type="button" class="opt" data-q="${qi}" data-i="${i}">${q.opts[i]}</button>`).join('')}</div>`;
    }else if(q.kind==='tf'){
      h+=`<div class="tfs">${q.items.map((it,i)=>`<div class="tfr"><span class="tt">${it.t}</span><span class="bb"><button type="button" class="tfb" data-q="${qi}" data-i="${i}" data-v="1">Так</button><button type="button" class="tfb" data-q="${qi}" data-i="${i}" data-v="0">Ні</button></span></div>`).join('')}</div>`;
    }else if(q.kind==='num'){
      h+=`<div class="numrow"><span>${q.lbl}</span><input class="numin" data-q="${qi}" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="Відповідь"></div>`;
    }else{
      h+=rowsHTML(q,qi);
    }
    el.innerHTML=h;
    qWrap.appendChild(el);
  });
  $('#result').hidden=true;
  $('#actions').hidden=false;
  $('#checkBtn').textContent='Перевірити';
  clearWarn();
}

let warnedEmpty=false;
function clearWarn(){$('#warn').textContent='';warnedEmpty=false;$('#checkBtn').textContent='Перевірити'}
function markStart(){if(!state.startTs)state.startTs=Date.now()}

function cellEl(qi,k){return qWrap.querySelector(`.cell[data-q="${qi}"][data-k="${k}"]`)}
function focusCell(qi,k){const n=cellEl(qi,k);if(n){n.focus();try{n.select()}catch(e){}}}

/* введення з клавіатури */
qWrap.addEventListener('input',e=>{
  const el=e.target;if(!state||state.checked)return;
  const qi=+el.dataset.q;
  if(el.classList.contains('cell')){
    el.value=el.value.replace(/\D/g,'').slice(-1);
    const k=+el.dataset.k;
    state.val[qi][k]=el.value;markStart();clearWarn();
    if(el.value)focusCell(qi,k+1);
  }else if(el.classList.contains('numin')){
    el.value=el.value.replace(/\D/g,'').slice(0,9);
    state.val[qi]=el.value;markStart();clearWarn();
  }
});
qWrap.addEventListener('keydown',e=>{
  const el=e.target;
  if(!state||state.checked||!el.classList||!el.classList.contains('cell'))return;
  const qi=+el.dataset.q,k=+el.dataset.k;
  if(e.key==='Backspace'&&!el.value){
    e.preventDefault();
    const p=cellEl(qi,k-1);
    if(p){p.value='';state.val[qi][k-1]='';p.focus();}
  }else if(e.key==='Enter'){e.preventDefault();focusCell(qi,k+1)}
});
qWrap.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cell')){try{e.target.select()}catch(x){}}});

/* вибір варіанта, так/ні */
qWrap.addEventListener('click',e=>{
  if(!state||state.checked)return;
  const o=e.target.closest('.opt');
  if(o){
    const qi=+o.dataset.q;
    qWrap.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');state.val[qi]=+o.dataset.i;markStart();clearWarn();return;
  }
  const t=e.target.closest('.tfb');
  if(t){
    const qi=+t.dataset.q,i=+t.dataset.i;
    qWrap.querySelectorAll(`.tfb[data-q="${qi}"][data-i="${i}"]`).forEach(x=>x.classList.remove('sel'));
    t.classList.add('sel');state.val[qi][i]=t.dataset.v==='1';markStart();clearWarn();
  }
});

/* екранна клавіатура для сенсорних екранів */
const kp=$('#kp');
if(touch){
  document.addEventListener('focusin',e=>{
    if(e.target.matches&&e.target.matches('.cell,.numin')){
      kp.hidden=false;document.body.classList.add('kpOn');
      const t=e.target;setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},60);
    }
  });
  document.addEventListener('focusout',()=>{
    setTimeout(()=>{
      const a=document.activeElement;
      if(!(a&&a.matches&&a.matches('.cell,.numin'))){kp.hidden=true;document.body.classList.remove('kpOn')}
    },150);
  });
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked)return;
    const el=document.activeElement;
    if(!el||!el.matches||!el.matches('.cell,.numin'))return;
    const k=b.dataset.k,isCell=el.classList.contains('cell');
    const qi=+el.dataset.q;
    if(k==='bs'){
      if(isCell){
        if(el.value){el.value='';state.val[qi][+el.dataset.k]='';}
        else{const p=cellEl(qi,+el.dataset.k-1);if(p){p.value='';state.val[qi][+el.dataset.k-1]='';p.focus();}}
      }else{el.value=el.value.slice(0,-1);state.val[qi]=el.value}
    }else if(k==='next'){
      if(isCell)focusCell(qi,+el.dataset.k+1);
    }else{
      if(isCell){el.value=k;el.dispatchEvent(new Event('input',{bubbles:true}));}
      else if(el.value.length<9){el.value+=k;el.dispatchEvent(new Event('input',{bubbles:true}));}
    }
  });
}

/* виходи з вікна тесту */
function leaveEvt(){
  if(!state||state.checked||!state.startTs)return;
  const t=Date.now();if(t-lastLeave<700)return;
  lastLeave=t;state.leaves++;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)leaveEvt()});
window.addEventListener('blur',leaveEvt);

/* ===================== Перевірка ===================== */
function isFilled(q,v){
  if(q.kind==='cells')return v.every(x=>x!=='');
  if(q.kind==='choice')return v!==null;
  if(q.kind==='num')return v!=='';
  return v.every(x=>x!==null);
}
function isRight(q,v){
  if(!isFilled(q,v))return false;
  if(q.kind==='cells')return v.every((x,k)=>x===q.exp[k]);
  if(q.kind==='choice')return v===q.ans;
  if(q.kind==='num')return Number(v)===q.ans;
  return v.every((x,i)=>x===q.items[i].ok);
}
function answerText(q,v){
  if(q.kind==='cells'){
    let pos=0;
    return q.rowLens.map(n=>{const s=v.slice(pos,pos+n).map(x=>x===''?'·':x).join('');pos+=n;return s}).join(' | ');
  }
  if(q.kind==='choice')return v===null?'':plain(q.opts[v]);
  if(q.kind==='num')return v;
  return v.map(x=>x===null?'':(x?'Так':'Ні')).join(',');
}

['#sur','#nam'].forEach(s=>$(s).addEventListener('input',e=>{e.target.classList.remove('need');$('#studentMsg').textContent=''}));

$('#checkBtn').addEventListener('click',()=>{
  const sur=$('#sur').value.trim(),nam=$('#nam').value.trim();
  if(!sur||!nam){
    if(!sur)$('#sur').classList.add('need');
    if(!nam)$('#nam').classList.add('need');
    $('#studentMsg').textContent='Введіть прізвище та ім’я, щоб перевірити тест.';
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const empty=QUESTIONS.filter((q,i)=>!isFilled(q,state.val[i])).length;
  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(sur,nam);
});

function finish(sur,nam){
  state.checked=true;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const now=Date.now();
  const duration=state.startTs?Math.max(0,Math.round((now-state.startTs)/1000)):0;
  const marks=QUESTIONS.map((q,i)=>isRight(q,state.val[i])?1:0);
  const score=marks.reduce((s,x)=>s+x,0);
  QUESTIONS.forEach((q,i)=>{
    const el=$('#q'+i);el.classList.add('locked',marks[i]?'ok':'bad');
    el.querySelector('.mark').textContent=marks[i]?'✓':'✗';
    el.querySelectorAll('input').forEach(inp=>{inp.readOnly=true});
    if(q.kind==='cells'){
      el.querySelectorAll('.cell').forEach(c=>{
        const k=+c.dataset.k;
        if(c.value!=='')c.classList.add(c.value===q.exp[k]?'good':'bad');else c.classList.add('bad');
      });
    }else if(q.kind==='num'){
      el.querySelector('.numin').classList.add(marks[i]?'good':'bad');
    }
  });
  $('#sur').readOnly=$('#nam').readOnly=true;
  $('#actions').hidden=true;
  const r=$('#result');
  r.innerHTML=`<div class="who">${esc(sur)} ${esc(nam)}</div>
    <div class="big">${score} з ${N}</div>
    <div style="font-weight:800;color:var(--muted)">${plural(score,'бал','бали','балів')}</div>
    <div class="chips">${marks.map((m,i)=>`<span class="chip ${m?'y':'n'}">${i+1}</span>`).join('')}</div>
    <button class="btn ghost" id="againBtn">Пройти ще раз</button>`;
  r.hidden=false;
  r.scrollIntoView({behavior:'smooth',block:'center'});
  $('#againBtn').addEventListener('click',()=>{
    $('#sur').readOnly=$('#nam').readOnly=false;
    build();window.scrollTo({top:0,behavior:'smooth'});
  });
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,
    ts:now,date:new Date(now).toISOString(),
    score,max:N,tasks:marks,
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    qs:QUESTIONS.map(q=>q.short),
    durationSec:duration,leaves:state.leaves,
    test:TEST_NAME
  });
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="row"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Закрити</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=()=>{if(pw.value===TEACHER_PASSWORD)showJournal();else{$('#pmsg').textContent='Неправильний пароль';pw.select()}};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){overlay.classList.remove('on');modal.innerHTML=''}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Множення, переставна властивість</h2>
    <div class="row"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="row" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=await loadResults()}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Бал</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту">Виходи</th>${QUESTIONS.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>`<tr><td>${k+1}</td><td class="nm">${esc(r.name||'')}</td><td>${fmtDate(r.ts)}</td><td><b>${r.score}/${r.max||N}</b></td><td>${fmtDur(r.durationSec)}</td><td>${r.leaves===undefined?'—':r.leaves}</td>${
    QUESTIONS.map((_,i)=>{
      const m=(r.tasks||[])[i];
      const tip=esc(((r.qs||[])[i]||'')+((r.answers||[])[i]!==undefined?': '+(r.answers[i]||'—'):''));
      return m?`<td class="y" title="${tip}">✓</td>`:`<td class="n" title="${tip}">✗</td>`;
    }).join('')}</tr>`).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
}
function downloadCSV(){
  if(!rows.length)return;
  const hdr=['Прізвище та ім\'я','Дата','Бал','Час','Виходи з вікна',...QUESTIONS.map((_,i)=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,fmtDate(r.ts),`${r.score}/${r.max||N}`,fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,...QUESTIONS.map((_,i)=>(r.tasks||[])[i]?'+':'-')]));
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Множення_5клас_результати.csv';a.click();
}

build();
})();
