<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест. Усне множення. Сполучна властивість множення (5 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a1736;--muted:#8a5a78;
  --acc:#be185d;--acc2:#e5508a;--accL:#fce7f3;--soft:#fdeff5;--soft2:#fff7fa;--line:#f3cfe0;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;--badln:#efa3a8;
  --half:#e08a1e;--halfbg:#fff3e0;--halftx:#9a5a0a;--halfln:#f2c488;
  --card:#ffffff;
  --cw:2.7rem;--ch:3.1rem;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden;
  background-color:#fbd5e8;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><circle cx='40.0' cy='32.1' r='7.0' fill='%23f9a8d4'/><circle cx='49.4' cy='38.9' r='7.0' fill='%23f9a8d4'/><circle cx='45.8' cy='50.0' r='7.0' fill='%23f9a8d4'/><circle cx='34.2' cy='50.0' r='7.0' fill='%23f9a8d4'/><circle cx='30.6' cy='38.9' r='7.0' fill='%23f9a8d4'/><circle cx='40' cy='42' r='5.0' fill='%23fde68a'/><circle cx='152.3' cy='23.8' r='4.7' fill='%23ffffff'/><circle cx='156.6' cy='30.2' r='4.7' fill='%23ffffff'/><circle cx='151.8' cy='36.3' r='4.7' fill='%23ffffff'/><circle cx='144.5' cy='33.7' r='4.7' fill='%23ffffff'/><circle cx='144.8' cy='25.9' r='4.7' fill='%23ffffff'/><circle cx='150' cy='30' r='3.3' fill='%23f9a8d4'/><circle cx='191.9' cy='109.2' r='7.8' fill='%23f5b8dc'/><circle cx='200.9' cy='118.5' r='7.8' fill='%23f5b8dc'/><circle cx='194.8' cy='129.9' r='7.8' fill='%23f5b8dc'/><circle cx='182.1' cy='127.6' r='7.8' fill='%23f5b8dc'/><circle cx='180.3' cy='114.8' r='7.8' fill='%23f5b8dc'/><circle cx='190' cy='120' r='5.5' fill='%23fff3b0'/><circle cx='83.8' cy='143.3' r='5.5' fill='%23ffffff'/><circle cx='87.5' cy='151.6' r='5.5' fill='%23ffffff'/><circle cx='80.8' cy='157.7' r='5.5' fill='%23ffffff'/><circle cx='73.0' cy='153.1' r='5.5' fill='%23ffffff'/><circle cx='74.8' cy='144.3' r='5.5' fill='%23ffffff'/><circle cx='80' cy='150' r='3.9' fill='%23fbcfe8'/><circle cx='20.0' cy='189.4' r='4.7' fill='%23f9a8d4'/><circle cx='26.3' cy='194.0' r='4.7' fill='%23f9a8d4'/><circle cx='23.9' cy='201.3' r='4.7' fill='%23f9a8d4'/><circle cx='16.1' cy='201.3' r='4.7' fill='%23f9a8d4'/><circle cx='13.7' cy='194.0' r='4.7' fill='%23f9a8d4'/><circle cx='20' cy='196' r='3.3' fill='%23ffffff'/><circle cx='135.7' cy='193.3' r='6.2' fill='%23fbc5e0'/><circle cx='138.2' cy='203.3' r='6.2' fill='%23fbc5e0'/><circle cx='129.4' cy='208.8' r='6.2' fill='%23fbc5e0'/><circle cx='121.5' cy='202.1' r='6.2' fill='%23fbc5e0'/><circle cx='125.3' cy='192.5' r='6.2' fill='%23fbc5e0'/><circle cx='130' cy='200' r='4.4' fill='%23fde68a'/><ellipse cx='60' cy='60' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(30 60 60)'/><ellipse cx='168' cy='48' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(-20 168 48)'/><ellipse cx='168' cy='138' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(60 168 138)'/><ellipse cx='100' cy='168' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(-30 100 168)'/><ellipse cx='40' cy='176' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(20 40 176)'/><ellipse cx='112' cy='100' rx='7' ry='3.2' fill='%23c9efd6' transform='rotate(-50 112 100)'/><circle cx='110' cy='50' r='2.6' fill='%23f472b6'/><circle cx='22' cy='100' r='2.2' fill='%23ffffff'/><circle cx='100' cy='120' r='2.8' fill='%23f9a8d4'/><circle cx='205' cy='70' r='2.2' fill='%23ffffff'/><circle cx='60' cy='110' r='2' fill='%23f472b6'/><circle cx='150' cy='170' r='2.4' fill='%23ffffff'/><circle cx='200' cy='200' r='2.6' fill='%23f9a8d4'/><circle cx='10' cy='20' r='2' fill='%23ffffff'/></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 50 50'><circle cx='10' cy='10' r='4' fill='%23f9a8d4' fill-opacity='0.55'/><circle cx='40' cy='40' r='4' fill='%23ffffff' fill-opacity='0.8'/><circle cx='10' cy='40' r='2' fill='%23ffffff' fill-opacity='0.9'/><circle cx='40' cy='10' r='2' fill='%23f472b6' fill-opacity='0.35'/></svg>"),linear-gradient(135deg,#fff0f7 0%,#fde1ef 45%,#f9c6e0 100%);
  background-attachment:fixed}
#app{height:100dvh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(120,20,70,.16);padding:22px 24px;border:2px solid rgba(255,255,255,.9)}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem);font-weight:900;line-height:1.25;color:var(--acc);text-wrap:balance}

/* початок */
#sStart{justify-content:center;overflow:auto}
.start{text-align:center;padding:28px 24px}
.student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.student label{display:block;font-weight:800;font-size:.95rem;color:var(--muted);text-align:left;margin-bottom:4px}
.student input{width:100%;font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--soft);color:var(--ink)}
.student input:focus{border-color:var(--acc);background:#fff}
.student input.need{border-color:var(--bad);background:var(--badbg)}
.msg{color:var(--bad);font-weight:800;min-height:1.3em;margin:6px 0 10px}

/* ряд номерів */
#top{flex:none}
.cnt{font-weight:900;color:var(--acc);font-size:1.05rem;text-align:center;margin-bottom:6px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:900;font-size:.95rem;cursor:pointer;padding:0;touch-action:manipulation}
.chip.f{background:var(--acc2);border-color:var(--acc2);color:#fff}
.chip.cur{border-color:var(--acc);border-width:4px;line-height:1}
.chip.y{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.h{background:var(--half);border-color:var(--half);color:#fff}
.chip.n{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.cur.y{box-shadow:0 0 0 3px var(--okln)}.chip.cur.n{box-shadow:0 0 0 3px var(--badln)}.chip.cur.h{box-shadow:0 0 0 3px var(--halfln)}
.chip.big{width:46px;height:46px;font-size:1.1rem}

/* завдання */
#qbox{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:3px 4px 18px}
.q{position:relative}
.q.ok{box-shadow:0 0 0 3px var(--ok),0 10px 30px rgba(120,20,70,.14)}
.q.half{box-shadow:0 0 0 3px var(--half),0 10px 30px rgba(120,20,70,.14)}
.q.bad{box-shadow:0 0 0 3px var(--bad),0 10px 30px rgba(120,20,70,.14)}
.tag{display:inline-block;margin:0 0 10px;padding:3px 12px;border-radius:999px;font-weight:900;font-size:.85rem;letter-spacing:.02em;background:var(--accL);color:var(--acc);border:2px solid #f6bcd6}
.tag.wr{background:#fff;border-style:dashed}
.qh{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.15rem;background:linear-gradient(135deg,#be185d,#e5508a)}
.qt{flex:1;min-width:0;font-size:1.2rem;font-weight:700;line-height:1.5;padding-top:5px}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:none;place-items:center;font-size:1.3rem;font-weight:900;color:#fff}
.q.ok .mark{display:grid;background:var(--ok)}
.q.half .mark{display:grid;background:var(--half)}
.q.bad .mark{display:grid;background:var(--bad)}
i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px;font-weight:800;font-size:1.6rem}
.numin{width:10.5rem;font:inherit;font-weight:900;border:2px solid var(--line);border-radius:12px;background:var(--soft2);color:var(--ink);outline:none;text-align:center;padding:8px 12px;font-size:1.6rem;touch-action:manipulation}
.numin:focus,.numin.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.18)}
.numin.good,.cell.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.numin.bad,.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;text-align:left;touch-action:manipulation;line-height:1.4;min-height:46px}
.opts.mth .opt{font-size:1.3rem;font-weight:800}
.opt.sel{border-color:var(--acc);background:#fbd9e8;box-shadow:0 0 0 3px rgba(190,24,93,.16)}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx);box-shadow:none}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtx);box-shadow:none}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--okln)}
.locked .opt,.locked .tfb{cursor:default}

/* так / ні */
.tfs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tfr{display:flex;align-items:center;gap:12px;background:var(--soft2);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.tfr .tt{flex:1;min-width:0;font-weight:800;font-size:1.2rem;line-height:1.4}
.tfr .bb{flex:none;display:flex;gap:6px}
.tfb{font:inherit;font-weight:800;min-width:3.4rem;min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--acc);cursor:pointer;touch-action:manipulation}
.tfb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.tfb.good{background:var(--ok);border-color:var(--ok);color:#fff}
.tfb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tfb.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--okln)}

/* клітинки для цифр */
.cell{flex:none;width:calc(var(--cw) - .3rem);height:var(--ch);padding:0;text-align:center;font:inherit;font-size:1.6rem;font-weight:900;
  color:var(--ink);background:var(--soft2);border:2px solid #eab5cd;border-radius:.6rem;outline:none;caret-color:transparent;touch-action:manipulation}
.cell:focus,.cell.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.colwrap{display:flex;justify-content:center;margin-top:14px;overflow-x:auto}
.colm{display:inline-flex;flex-direction:column;align-items:flex-end;gap:.3rem;padding:.8rem 1rem;background:var(--soft2);border:2px dashed #eab5cd;border-radius:1rem}
.crow{display:flex}
.slot{flex:none;width:var(--cw);height:var(--ch);display:flex;align-items:center;justify-content:center}
.slot.dig{font-size:1.9rem;font-weight:900}
.slot.sg{font-size:1.8rem;font-weight:900;color:var(--acc)}
.slot.ph::after{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#e6bfd2}
.cline{align-self:stretch;height:3px;border-radius:2px;background:var(--ink);margin:.1rem 0}
.hint{margin-top:10px;font-size:.95rem;line-height:1.4;color:var(--muted);font-weight:700}
.corr{margin-top:14px;padding:9px 14px;border-radius:12px;background:var(--okbg);color:var(--oktx);font-weight:800;font-size:1.05rem}
.corr.no{background:var(--badbg);color:var(--badtx)}
.corr.hf{background:var(--halfbg);color:var(--halftx)}

/* нотатки (за бажанням) */
.notewrap{margin-top:16px}
.notebtn{font:inherit;font-weight:800;font-size:1rem;min-height:44px;padding:8px 16px;border-radius:999px;border:2px dashed var(--acc2);background:#fff;color:var(--acc);cursor:pointer;touch-action:manipulation}
.notebtn:active{background:var(--accL)}
.note{display:block;width:100%;margin-top:10px;font:inherit;font-size:1.1rem;font-weight:700;line-height:1.4;padding:10px 14px;border:2px solid #f0a9c7;border-radius:14px;background:#fffdf3;color:var(--ink);outline:none;resize:none}
.note:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(190,24,93,.16)}
.note::placeholder{color:var(--muted);font-weight:600}
.noteRo{margin-top:12px;padding:9px 14px;border-radius:12px;background:#fffdf3;border:2px dashed #f0a9c7;font-weight:700;white-space:pre-wrap}

/* нижня панель */
#nav{flex:none;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:4px 0 2px}
.btn{font:inherit;font-weight:900;font-size:1.1rem;border:0;border-radius:14px;padding:12px 26px;min-height:46px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#be185d,#e5508a);box-shadow:0 6px 16px rgba(190,24,93,.28);touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.btn.big{padding:14px 40px;font-size:1.25rem}

/* перед здачею й результат */
#sReview,#sResult{overflow:auto;justify-content:center}
.center{text-align:center}
.warn{color:var(--bad);font-weight:800;margin:10px 0 0;min-height:1.3em}
.who{font-weight:800;color:var(--muted);font-size:1.1rem}
.big{font-size:clamp(2.4rem,8vw,3.4rem);font-weight:900;margin:4px 0;color:var(--acc);line-height:1.1}
.bigsub{font-weight:800;color:var(--muted)}
.cardchips{margin:16px 0 18px}
.shot{margin:14px auto 18px;max-width:30rem;padding:10px 14px;border:2px dashed var(--acc2);border-radius:14px;background:var(--soft2);font-weight:800;color:var(--acc)}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* екранна клавіатура (сенсорні екрани) */
#kp{flex:none;background:#f6e4ee;border-top:2px solid var(--line);margin:0 calc(-1*max(14px,env(safe-area-inset-right,0px))) 0 calc(-1*max(14px,env(safe-area-inset-left,0px)));
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(120,20,70,.15)}
#kp .g{display:grid;gap:6px;max-width:34rem;margin:0 auto;grid-template-columns:repeat(6,1fr)}
#kp button{font:inherit;font-weight:900;font-size:1.3rem;height:2.8rem;border:0;border-radius:.7rem;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(120,20,70,.2);touch-action:manipulation}
#kp button:active{background:var(--accL)}
#kp button.fn{background:#fbd9e8;color:var(--acc)}
#kp button:disabled{opacity:.35}

footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* ключ учителя */
#keyBtn{position:fixed;top:calc(3px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));z-index:20;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:.9rem;cursor:pointer;opacity:.7;padding:0}
#keyBtn:hover{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(58,23,54,.45);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:1200px;box-shadow:0 20px 50px rgba(58,23,54,.3)}
.modal h2{margin:0 0 12px;font-weight:900;font-size:1.3rem}
.modal .mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modal input{font:inherit;font-size:1.05rem;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.sbtn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
.sbtn.g{background:#fce7f3;color:var(--acc)}
.sbtn.r{background:var(--bad)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;font-weight:900}
td.nm{text-align:left;font-weight:700;cursor:pointer;text-decoration:underline dotted}
td.y{color:var(--ok);font-weight:900}td.n{color:var(--bad);font-weight:900}td.h{color:var(--half);font-weight:900}
td.red{color:var(--bad);font-weight:900}
tr.det td{white-space:normal;text-align:left;background:var(--soft2)}
tr.det table{font-size:.9rem}
tr.det td.w{white-space:normal}
.pmsg{color:var(--bad);font-weight:800}

@media (max-width:640px){
  .card{padding:16px 14px}
  .student{grid-template-columns:1fr}
  .num,.mark{width:34px;height:34px}
  .qt{font-size:1.08rem;padding-top:3px}
  .row{font-size:1.3rem}
  .numin{font-size:1.4rem;width:9.5rem}
  .chip{width:32px;height:32px;font-size:.85rem}
  .chip.big{width:40px;height:40px}
  .btn{padding:12px 18px}
  #nav .btn{padding:12px 10px;font-size:1rem}
  .tfr{flex-direction:column;align-items:flex-start}
  .tfr .tt{font-size:1.1rem}
  .colm{padding:.5rem .5rem;gap:.2rem}
  .tag{margin-bottom:6px}
  .opts.mth .opt{font-size:1.15rem}
  :root{--cw:2.4rem;--ch:2.75rem}
  .cell,.slot.dig{font-size:1.45rem}
}
@media (max-width:380px){:root{--cw:2.2rem}}
@media (max-height:700px){
  #app{padding-top:6px}
  .card{padding:14px 18px}
  .row{margin-top:10px}
  .opts{margin-top:10px}
  .notewrap{margin-top:10px}
  :root{--ch:2.7rem}
  .cell,.slot.dig{font-size:1.4rem}
}
@media (max-height:680px){
  #top .chips{display:none}
}
</style>
</head>
<body>
<button id="keyBtn" title="Журнал учителя" aria-label="Журнал учителя">🔑</button>

<div id="app">
  <section class="scr" id="sStart">
    <div class="card start">
      <h1>Тест. Усне множення. Сполучна властивість множення (5 клас)</h1>
      <div class="student">
        <div><label for="sur">Прізвище</label><input id="sur" autocomplete="off" autofocus></div>
        <div><label for="nam">Ім'я</label><input id="nam" autocomplete="off"></div>
      </div>
      <div class="msg" id="studentMsg"></div>
      <button class="btn big" id="startBtn">Почати</button>
    </div>
  </section>

  <section class="scr" id="sPlay" hidden>
    <div id="top"></div>
    <div id="qbox"></div>
    <div id="nav"></div>
  </section>

  <section class="scr" id="sReview" hidden>
    <div class="card center">
      <h1 id="rvTitle"></h1>
      <div class="chips cardchips" id="rvChips"></div>
      <div class="warn" id="warn"></div>
      <div class="rbtns" style="margin-top:8px">
        <button class="btn ghost" id="rvBack">← До завдань</button>

/* ===================== Випадкові числа (свій варіант кожному учневі) ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
function setSeed(s){rng=mulberry32(s)}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const pick=a=>a[Math.floor(rng()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['a','b','c','d','k','m','n','p','x','y'];
function letters(n){const pool=LET.slice(),o=[];for(let i=0;i<n;i++)o.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);return o}
const I=s=>'<i>'+s+'</i>';
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function plain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/ /g,' ')}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
function digit(lo,hi){return String(rnd(lo,hi))}

/* ===================== Заготовки завдань ===================== */
function cq(t,qplain){return {kind:'cells',t:t,qplain:qplain,exp:[],groups:[],sep:' | ',rows:[],tag:'wr'}}
/* додає клітинки для рядка цифр; rtl — клітинки заповнюються справа наліво */
function addCells(q,str,rtl){
  const start=q.exp.length, idx=new Array(str.length);
  if(rtl){for(let j=str.length-1;j>=0;j--){q.exp.push(str[j]);idx[j]=q.exp.length-1}}
  else{for(let j=0;j<str.length;j++){q.exp.push(str[j]);idx[j]=q.exp.length-1}}
  q.groups.push({s:start,n:str.length,rtl:!!rtl});
  return idx;
}
function ch(t,opts,ans,qplain,o){return Object.assign({kind:'choice',t:t,opts:opts,ans:ans,qplain:qplain,tag:'or'},o||{})}

/* множення в стовпчик: a · b, усі цифри у клітинках; порядок введення: справа наліво, зверху вниз */
function colQuestion(a,b,w){
  const sa=String(a), sb=String(b), fin=String(a*b);
  const q=cq('Виконайте множення в стовпчик. Впишіть цифри в клітинки.','Множення в стовпчик: '+a+' · '+b);
  q.w=w;
  const parts=sb.length>1?[...sb].reverse().map((d,i)=>({s:String(a*(+d)),shift:i})):[];
  const W=Math.max(sa.length,sb.length,fin.length,...parts.map(p=>p.s.length+p.shift))+1;
  const lines=[];
  const slotRow=(list,shift,sign)=>{
    const items=Array.from({length:W},()=>({e:1}));
    for(let j=0;j<list.length;j++)items[W-1-shift-(list.length-1-j)]=list[j];
    if(sign)items[0]={sg:sign};
    return items;
  };
  const cellRow=str=>addCells(q,str,true).map(c=>({c:c}));
  lines.push({k:'slots',items:slotRow([...sa].map(d=>({d:d})),0)});
  lines.push({k:'slots',items:slotRow([...sb].map(d=>({d:d})),0,'×')});
  lines.push({k:'rule'});
  if(parts.length){
    parts.forEach((p,i)=>{
      const items=slotRow(cellRow(p.s),p.shift,i===1?'+':null);
      for(let s=0;s<p.shift;s++)items[W-1-s]={ph:1};
      lines.push({k:'slots',items:items});
    });
    lines.push({k:'rule'});
  }
  lines.push({k:'slots',items:slotRow(cellRow(fin),0)});
  q.rows=[{k:'col',lines:lines}];
  q.finGroup=parts.length?q.groups.length-1:-1;
  q.corrText=(parts.length?'неповні добутки: '+parts.map(p=>p.s).join(', ')+'; ':'')+'добуток: '+fin;
  return q;
}
/* число без нулів у кінці й середині: цифри lo..9; zeroMid — може бути 0 посередині */
function nDigits(len,lo,zeroMid){
  let s=digit(lo,9);
  for(let i=1;i<len-1;i++)s+=(zeroMid&&rng()<.4)?'0':digit(lo,9);
  if(len>1)s+=digit(lo,9);
  return +s;
}

    Q.push({kind:'num',tag:'or',w:6,t:'Обчисліть усно.',lbl:`(${pr[0]} · ${n}) · ${pr[1]} =`,ans:n*100,qplain:`Обчисліть усно: (${pr[0]} · ${n}) · ${pr[1]}`});

    const pr=pick([[250,4],[4,250],[500,2],[2,500]]);let n;do{n=rnd(11,99)}while(n%10===0);
    Q.push({kind:'num',tag:'or',w:6,t:'Обчисліть усно.',lbl:`${pr[0]} · ${n} · ${pr[1]} =`,ans:n*1000,qplain:`Обчисліть усно: ${pr[0]} · ${n} · ${pr[1]}`});

  {

  {

  {

    };
    let oks=[rng()<.5,rng()<.5,rng()<.5];

    const it=[mk([4,25],oks[0]),mk([2,5],oks[1]),mk(pick([[8,125],[125,8]]),oks[2])];

/* ===================== Перевірка відповіді ===================== */
function isFilled(q,v){
  if(q.kind==='cells')return v.every(x=>x!=='');
  if(q.kind==='choice')return v!==null;
  if(q.kind==='tf')return v.every(x=>x!==null);
  return String(v).trim()!=='';
}
/* 1 — правильно, 0,5 — у стовпчику добуток правильний, а неповні добутки ні, 0 — неправильно */
function markOf(q,v){
  if(q.kind==='cells'){
    if(v.every((x,k)=>x===q.exp[k]))return 1;
    if(q.finGroup>=0){
      const g=q.groups[q.finGroup];let ok=true;
      for(let k=g.s;k<g.s+g.n;k++)if(v[k]!==q.exp[k])ok=false;
      if(ok)return .5;
    }
    return 0;
  }
  if(!isFilled(q,v))return 0;
  if(q.kind==='choice')return v===q.ans?1:0;
  if(q.kind==='tf')return v.every((x,i)=>x===q.items[i].ok)?1:0;
  return Number(v)===q.ans?1:0;
}
function cellsText(q,arr){
  return q.groups.map(g=>{
    const s=arr.slice(g.s,g.s+g.n).map(x=>x===''?'·':x);
    if(g.rtl)s.reverse();
    return s.join('');
  }).join(q.sep);
}
function qText(q){return q.qplain||plain(q.t)}
function answerText(q,v){
  if(q.kind==='cells')return cellsText(q,v);
  if(q.kind==='choice')return v===null?'':plain(q.opts[v]);
  if(q.kind==='tf')return v.map(x=>x===null?'·':(x?'Так':'Ні')).join(', ');
  return String(v).trim();
}
function correctText(q){
  if(q.kind==='cells')return q.corrText||cellsText(q,q.exp);
  if(q.kind==='choice')return plain(q.opts[q.ans]);
  if(q.kind==='tf')return q.items.map(it=>it.ok?'Так':'Ні').join(', ');
  return String(q.ans);
}

    }).join('')+`</div>`;
  }else if(q.kind==='num'){
    h+=`<div class="row"><span>${q.lbl}</span><input class="numin${done?(m===1?' good':' bad'):''}" data-q="${qi}" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="Відповідь" maxlength="9" value="${esc(v)}"${done?' readonly':''}></div>`;
  }else{
    q.rows.forEach(r=>{
      h+=`<div class="colwrap"><div class="colm">`;
      r.lines.forEach(l=>{
        if(l.k==='rule')h+=`<div class="cline"></div>`;
        else h+=`<div class="crow">`+l.items.map(it=>{
          if(it.e)return `<span class="slot"></span>`;
          if(it.d!==undefined)return `<span class="slot dig">${it.d}</span>`;
          if(it.sg)return `<span class="slot sg">${it.sg}</span>`;
          if(it.ph)return `<span class="slot ph"></span>`;
          return `<span class="slot">${cellHtml(qi,it.c,v[it.c],done,q)}</span>`;
        }).join('')+`</div>`;
      });
      h+=`</div></div>`;
    });
  }
  if(done){
    if(m===1)h+=`<div class="corr">Правильно</div>`;
    else if(m===0.5)h+=`<div class="corr hf">Добуток правильний, але в неповних добутках є помилка. Правильно: ${esc(correctText(q))}</div>`;
    else h+=`<div class="corr no">${isFilled(q,v)?`Ваша відповідь: ${esc(answerText(q,v))}. `:'Не всі відповіді введено. '}Правильно: ${esc(correctText(q))}</div>`;
    if(state.notes[qi].trim())h+=`<div class="noteRo"><b>Ваші нотатки:</b> ${esc(state.notes[qi])}</div>`;
  }else{
    const has=state.notes[qi].trim()!=='',open=state.noteOpen[qi];
    h+=`<div class="notewrap"><button type="button" class="notebtn" data-note="1">${open?'✏️ Сховати нотатки':'✏️ Записати, що запам’ятовую'}${(!open&&has)?' ✓':''}</button>`+
       `<textarea class="note" data-q="${qi}" rows="3" maxlength="300" placeholder="Можете записати тут числа, які запам’ятовуєте. Це не обов’язково."${open?'':' hidden'}>${esc(state.notes[qi])}</textarea></div>`;
  }
  return h;
}
function qClass(i){
  if(!state.checked)return '';
  return ' locked '+(state.marks[i]===1?'ok':(state.marks[i]===0.5?'half':'bad'));
}
function showTask(i){
  cur=Math.max(0,Math.min(N-1,i));
  showScreen('sPlay');
  const q=QUESTIONS[cur];
  $('#top').innerHTML=`<div class="cnt">Завдання ${cur+1} з ${N}</div><div class="chips">${chipsHtml({cur:true})}</div>`;
  const box=$('#qbox');
  box.innerHTML=`<section class="card q${qClass(cur)}">${qHtml(q,cur)}</section>`;
  box.scrollTop=0;
  $('#nav').innerHTML=state.checked
    ?`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn ghost" id="bRes">← До результату</button><button class="btn" id="bNext"${cur===N-1?' disabled':''}>Далі →</button>`
    :`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn" id="bNext">Далі →</button>`;
  $('#bPrev').onclick=()=>showTask(cur-1);
  $('#bNext').onclick=()=>{if(cur<N-1)showTask(cur+1);else showReview()};
  if(state.checked)$('#bRes').onclick=showResult;
  act=null;
  const typed=!state.checked&&(q.kind==='cells'||q.kind==='num');
  if(typed){if(touch)showKp(q);else hideKp();focusFirst()}else hideKp();
}
function showReview(){
  showScreen('sReview');
  const filled=QUESTIONS.filter((q,i)=>isFilled(q,state.val[i])).length;
  $('#rvTitle').textContent=`Відповіли на ${filled} з ${N}`;
  $('#rvChips').innerHTML=chipsHtml({big:true});
  $('#warn').textContent='';warnedEmpty=false;$('#checkBtn').textContent='Перевірити';
}

/* введення: стан оновлюється завжди напряму, а не через події */
const qbox=$('#qbox');
function isCell(el){return el&&el.classList&&el.classList.contains('cell')}
function cellAt(qi,k){return qbox.querySelector(`.cell[data-q="${qi}"][data-k="${k}"]`)}
function setAct(el){
  act=el;
  qbox.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));
  if(el){
    el.classList.add('act');
    try{el.focus({preventScroll:true})}catch(x){el.focus()}
    try{el.scrollIntoView({block:'nearest'})}catch(x){}
  }
}
function focusFirst(){
  const q=QUESTIONS[cur];let t=null;
  if(q.kind==='cells'){
    let k=state.val[cur].findIndex(x=>x==='');
    if(k<0)k=0;
    t=cellAt(cur,k);
  }else t=qbox.querySelector('.numin');
  if(t)setAct(t);
}
function setVal(el,v){
  const qi=+el.dataset.q;
  if(isCell(el))state.val[qi][+el.dataset.k]=v;else state.val[qi]=v;
  el.value=v;warnedEmpty=false;
  const f=$('#top .chips');if(f)f.innerHTML=chipsHtml({cur:true});
}
qbox.addEventListener('input',e=>{
  const el=e.target;if(!state||state.checked||el.dataset.q===undefined)return;
  if(el.classList.contains('note')){
    state.notes[+el.dataset.q]=el.value;return;
  }
  if(isCell(el)){
    const d=el.value.replace(/\D/g,'').slice(-1);
    setVal(el,d);
    if(d){const nx=cellAt(+el.dataset.q,+el.dataset.k+1);if(nx)setAct(nx)}
  }else if(el.classList.contains('numin')){
    setVal(el,el.value.replace(/\D/g,'').slice(0,9));
  }
});
qbox.addEventListener('focusin',e=>{
  const el=e.target;
  if(!state||state.checked||!el.matches)return;
  if(el.matches('.note')){if(touch)hideKp();return}
  if(el.matches('.cell,.numin')){
    act=el;qbox.querySelectorAll('.act').forEach(x=>{if(x!==el)x.classList.remove('act')});el.classList.add('act');
    if(touch&&kp.hidden)showKp(QUESTIONS[+el.dataset.q]);
    try{el.select()}catch(x){}
  }
});
qbox.addEventListener('keydown',e=>{
  const el=e.target;
  if(!state||state.checked||!el.matches||!el.matches('.cell,.numin'))return;
  if(isCell(el)){
    const qi=+el.dataset.q,k=+el.dataset.k;
    if(e.key==='Backspace'&&!el.value){e.preventDefault();const p=cellAt(qi,k-1);if(p){setVal(p,'');setAct(p)}}
    else if(e.key==='Enter'){e.preventDefault();const nx=cellAt(qi,k+1);if(nx)setAct(nx);else $('#bNext').click()}
  }else if(e.key==='Enter'&&el.value!==''){e.preventDefault();$('#bNext').click()}
});
/* вибір варіанта, так/ні, нотатки */
qbox.addEventListener('click',e=>{
  if(!state||state.checked)return;
  const nb=e.target.closest('.notebtn');
  if(nb){
    const ta=qbox.querySelector('.note');
    state.noteOpen[cur]=!state.noteOpen[cur];
    ta.hidden=!state.noteOpen[cur];
    const has=state.notes[cur].trim()!=='';
    nb.textContent=state.noteOpen[cur]?'✏️ Сховати нотатки':('✏️ Записати, що запам’ятовую'+(has?' ✓':''));
    if(state.noteOpen[cur]){ta.focus();try{ta.scrollIntoView({block:'nearest'})}catch(x){}}
    return;
  }
  const o=e.target.closest('.opt');
  if(o){
    state.val[cur]=+o.dataset.opt;
    qbox.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');warnedEmpty=false;
    $('#top .chips').innerHTML=chipsHtml({cur:true});return;
  }
  const t=e.target.closest('.tfb');
  if(t){
    const i=+t.dataset.tf;
    state.val[cur][i]=t.dataset.v==='1';
    qbox.querySelectorAll(`.tfb[data-tf="${i}"]`).forEach(x=>x.classList.remove('sel'));
    t.classList.add('sel');warnedEmpty=false;
    $('#top .chips').innerHTML=chipsHtml({cur:true});
  }
});
/* номери завдань */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip[data-go]');
  if(c)showTask(+c.dataset.go);
});

/* екранна клавіатура (сенсорні екрани): працює з останнім обраним полем */
const kp=$('#kp');
function hideKp(){kp.hidden=true;kp.innerHTML=''}
function showKp(q){
  const cellsQ=q.kind==='cells';
  let h='<div class="g">';
  h+=['1','2','3','4','5'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>';
  h+=['6','7','8','9','0'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+`<button type="button" class="fn" data-k="next" aria-label="Наступна клітинка"${cellsQ?'':' disabled'}>→</button>`;
  kp.innerHTML=h+'</div>';kp.hidden=false;
}
if(touch){
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked||!act||b.disabled)return;
    const k=b.dataset.k,el=act,qi=+el.dataset.q;
    if(k==='bs'){
      if(isCell(el)){
        if(el.value)setVal(el,'');
        else{const p=cellAt(qi,+el.dataset.k-1);if(p){setVal(p,'');setAct(p)}}
      }else setVal(el,el.value.slice(0,-1));
    }else if(k==='next'){
      if(isCell(el)){const nx=cellAt(qi,+el.dataset.k+1);if(nx)setAct(nx)}
    }else if(isCell(el)){
      setVal(el,b.dataset.ch);
      const nx=cellAt(qi,+el.dataset.k+1);if(nx)setAct(nx);
    }else if(el.value.length<9){
      setVal(el,el.value+b.dataset.ch);
    }
  });
}

/* ===================== Початок і перевірка ===================== */
['#sur','#nam'].forEach(s=>$(s).addEventListener('input',e=>{e.target.classList.remove('need');$('#studentMsg').textContent=''}));
function needName(){
  const sur=$('#sur').value.trim(),nam=$('#nam').value.trim();
  if(!sur||!nam){
    if(!sur)$('#sur').classList.add('need');
    if(!nam)$('#nam').classList.add('need');
    $('#studentMsg').textContent='Введіть прізвище та ім’я, щоб почати.';
    return null;
  }
  return {sur,nam};
}
$('#startBtn').addEventListener('click',()=>{
  const s=needName();if(!s)return;
  student=s;resetWatch();showTask(0);
});
$('#rvBack').addEventListener('click',()=>showTask(N-1));
$('#checkBtn').addEventListener('click',()=>{
  const empty=QUESTIONS.filter((q,i)=>!isFilled(q,state.val[i])).length;
  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(student.sur,student.nam);
});

function totals(){
  const marks=state.marks;
  const score=QUESTIONS.reduce((s,q,i)=>s+q.w*marks[i],0);
  return {score:Math.round(score*2)/2};
}
function showResult(){
  showScreen('sResult');
  const t=totals(),marks=state.marks;
  $('#result').innerHTML=`<div class="who">${esc(student.sur)} ${esc(student.nam)}</div>
    <div class="big">${fmtScore(t.score)} з 100</div>
    <div class="bigsub">балів</div>
    <div class="big">${Math.round(t.score)} %</div>
    <div class="shot">Зробіть скріншот результату та надішліть його вчителю</div>
    <div class="rbtns"><button class="btn ghost" id="errBtn">Дивитись помилки</button><button class="btn" id="againBtn">Пройти ще раз</button></div>`;
  $('#errBtn').addEventListener('click',()=>{const f=marks.findIndex(m=>m!==1);showTask(f<0?0:f)});
  $('#againBtn').addEventListener('click',()=>{build(false);resetWatch();showTask(0)});
}

function finish(sur,nam){
  const now=Date.now();
  back();
  state.marks=QUESTIONS.map((q,i)=>markOf(q,state.val[i]));
  const t=totals(),marks=state.marks;
  const rec={
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,
    ts:now,date:new Date(now).toISOString(),
    score:t.score,max:100,percent:Math.round(t.score),tasks:marks,weights:QUESTIONS.map(q=>q.w),
    rightCount:marks.filter(m=>m===1).length,
    qtext:QUESTIONS.map(qText),
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    correct:QUESTIONS.map(correctText),
    durationSec:Math.max(0,Math.round((now-W.t0)/1000)),
    leaves:W.leaves,
    awaySec:W.awaySec,
    variant:seed,
    test:TEST_NAME
  };
  state.checked=true;
  W.on=false;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  showResult();
  saveResult(rec);
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="mrow"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Закрити</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=()=>{if(pw.value===TEACHER_PASSWORD)showJournal();else{$('#pmsg').textContent='Неправильний пароль';pw.select()}};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){overlay.classList.remove('on');modal.innerHTML=''}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const pctOf=r=>r.percent!==undefined?r.percent:Math.round(r.score/(r.max||100)*100);
const mkCell=m=>m===undefined?'<td>—</td>':(m===1?'<td class="y">✓</td>':(m===0.5?'<td class="h">½</td>':'<td class="n">✗</td>'));
const mkCsv=m=>m===undefined?'':(m===1?'+':(m===0.5?'0,5':'-'));

async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Усне множення, сполучна властивість</h2>
    <div class="mrow"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="mrow" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=await loadResults()}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||0),0)||N;
  const idx=Array.from({length:cols},(_,i)=>i);
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту">Виходів</th><th title="Скільки часу учень був поза вікном тесту">Поза вікном</th><th>Бал</th><th>%</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>{
    const quick=r.durationSec!==undefined&&r.durationSec<120;
    const many=r.leaves!==undefined&&r.leaves>=3;
    const main=`<tr><td>${k+1}</td><td class="nm" data-k="${k}" title="Показати відповіді">${esc(r.name||'')}</td><td>${fmtDate(r.ts)}</td><td${quick?' class="red" title="Дуже швидко"':''}>${fmtDur(r.durationSec)}</td><td${many?' class="red"':''}>${r.leaves===undefined?'—':r.leaves}</td><td>${fmtDur(r.awaySec)}</td><td><b>${fmtScore(r.score)}/${r.max||100}</b></td><td>${pctOf(r)} %</td>${
      idx.map(i=>mkCell((r.tasks||[])[i])).join('')}</tr>`;
    let det='';
    if(r.qtext){
      det=`<table><tr><th>№</th><th>Завдання</th><th>Бали</th><th>Відповідь учня</th><th>Правильна відповідь</th></tr>${
        r.qtext.map((t,i)=>{
          const w=(r.weights||[])[i],m=(r.tasks||[])[i];
          const got=(w===undefined||m===undefined)?'—':fmtScore(w*m)+' з '+w;
          return `<tr><td>${i+1}</td><td class="w">${esc(t)}</td><td>${got}</td><td class="w">${esc((r.answers||[])[i]||'—')}</td><td class="w">${esc((r.correct||[])[i]||'')}</td></tr>`}).join('')}</table>`;
      if(r.variant!==undefined)det+=`<div style="margin-top:6px;color:var(--muted)">Варіант № ${r.variant}. Щоб відкрити цей варіант, додайте до адреси тесту ?v=${r.variant}</div>`;
    }else det='<span style="color:var(--muted)">Для цього запису деталей немає.</span>';
    return main+`<tr class="det" id="det${k}" hidden><td colspan="${8+cols}">${det}</td></tr>`;
  }).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
  $('#jbody').querySelectorAll('td.nm').forEach(td=>td.addEventListener('click',()=>{const d=$('#det'+td.dataset.k);if(d)d.hidden=!d.hidden}));
}
function downloadCSV(){
  if(!rows.length)return;
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||0),0)||N;
  const idx=Array.from({length:cols},(_,i)=>i);
  const hdr=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (зі 100)','Відсоток',...idx.map(i=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,fmtDate(r.ts),r.durationSec===undefined?'':fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,r.awaySec===undefined?'':fmtDur(r.awaySec),fmtScore(r.score),pctOf(r),...idx.map(i=>mkCsv((r.tasks||[])[i]))]));
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Усне_множення_5клас_результати.csv';a.click();
}

build(true);
showScreen('sStart');
if(!touch)$('#sur').focus();
})();
</script>
</body>
</html>
