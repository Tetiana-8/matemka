<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Види трикутників</title>
<style>
:root{
  --ink:#3a2633; --muted:#7a5b6c; --card:#ffffff; --acc:#be185d; --acc2:#e5508a;
  --ok:#17914c; --okbg:#e2f6ea; --bad:#d23c3c; --badbg:#fde6e6; --line:#f3cfe0; --stage:#fff7fa;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#fdeff5}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 40%,#f9e6ef 75%,#fff7fa 100%);
  background-attachment:fixed; min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink);margin-bottom:14px}
header h1{margin:0;font-size:32px;letter-spacing:.3px;color:var(--acc)}
header .sub{font-size:16px;color:var(--muted)}
.spacer{flex:1}
.pill{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:8px 14px;border-radius:999px;font-weight:700;font-size:18px}
.hbtn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:8px 12px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.35)}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
nav.tabs button{border:0;padding:12px 20px;border-radius:14px;font-size:19px;font-weight:700;
  background:rgba(255,255,255,.55);color:var(--acc);cursor:pointer;transition:.15s}
nav.tabs button:hover{background:rgba(255,255,255,.85)}
nav.tabs button.active{background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(190,24,93,.25)}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 32px rgba(131,24,67,.12);padding:24px}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.stage{background:var(--stage);border:2px solid var(--line);border-radius:20px;padding:6px}
.stage svg{width:100%;height:auto;display:block}
.toggles{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:15px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{width:18px;height:18px;accent-color:var(--acc)}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.step{padding:6px 12px;border-radius:999px;background:#fff5f9;color:var(--muted);font-weight:700;font-size:14px}
.step.on{background:var(--acc);color:#fff}
.step.done{background:var(--okbg);color:var(--ok)}
.q{font-size:26px;font-weight:700;margin:4px 0 16px;line-height:1.3}
.opts{display:grid;gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:23px;font-weight:700;
  color:var(--ink);cursor:pointer;text-align:left;transition:.12s}
.opt:hover{border-color:var(--acc);transform:translateY(-1px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default;transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:30px;margin-top:14px;font-size:19px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.answer{margin-top:14px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#fff5f9,#fff4ec);
  border:2px solid #fbd3e5;font-size:19px;line-height:1.5;display:none}
.answer b.big{font-size:25px;color:var(--acc)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:14px;padding:13px 20px;font-size:18px;font-weight:700;cursor:pointer;
  background:var(--acc);color:#fff;box-shadow:0 6px 16px rgba(190,24,93,.3)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff5f9;color:var(--acc);box-shadow:none}
.btn.warm{background:var(--acc2);box-shadow:0 6px 16px rgba(229,80,138,.3)}
.hint{margin-top:12px;padding:12px 16px;border-radius:14px;background:#fff8e6;border:2px dashed #f3c66b;font-size:17px;display:none}
/* Rules */
.rule{font-size:31px;line-height:1.55;font-weight:600;margin:18px 0 26px;min-height:100px}
.blank{display:inline-block;min-width:200px;border-bottom:4px solid var(--acc);text-align:center;color:var(--acc);padding:0 8px}
.blank.ok{color:var(--ok);border-color:var(--ok);background:var(--okbg);border-radius:8px 8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-size:23px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--acc)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.dot{width:16px;height:16px;border-radius:50%;background:#f3cfe0;cursor:pointer}
.dot.cur{outline:3px solid var(--acc);outline-offset:2px}
.dot.ok{background:var(--ok)}.dot.miss{background:var(--acc2)}
.rlist{display:none;margin-top:20px;padding:18px 22px;border-radius:18px;background:#fffafc;border:2px solid var(--line)}
.rlist ol{margin:0;padding-left:26px;font-size:19px;line-height:1.7}
.rlist b{color:var(--acc)}
/* Problems */
.ptype{display:inline-block;padding:5px 12px;border-radius:999px;background:#fff1e6;color:#c45a12;font-weight:700;font-size:14px;margin-bottom:8px}
.ptext{font-size:25px;line-height:1.45;font-weight:600;margin:6px 0 18px}
.inrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:22px;font-weight:700;flex-wrap:wrap}
.inrow .lab{min-width:170px}
.inrow input{width:140px;font-size:24px;font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid var(--line);text-align:center;color:var(--ink)}
.inrow input:focus{outline:none;border-color:var(--acc)}
.inrow input.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.inrow input.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.sol{display:none;margin-top:14px;padding:16px 18px;border-radius:16px;background:#f3fbf6;border:2px solid #bfe8cf;font-size:20px;line-height:1.6}
.sol .t{font-weight:800;color:var(--ok);margin-bottom:4px}
select{font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);font-weight:600;color:var(--ink)}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-weight:600}
.small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>△ Види трикутників</h1>
      <div class="sub">Математика, 5 клас · § 2, п. 14</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="cls">1. Визнач вид трикутника</button>
    <button data-tab="rules">2. Правила: встав слово</button>
    <button data-tab="per">3. Периметр трикутника</button>
  </nav>

  <!-- 1. Класифікація -->
  <section class="card panel active" id="cls">
    <div class="grid">
      <div>
        <div class="stage"><svg id="clsSvg" viewBox="0 0 560 420"></svg></div>
        <div class="toggles">
          <label><input type="checkbox" id="tAng" checked> градусні міри кутів</label>
          <label><input type="checkbox" id="tLen" checked> довжини сторін</label>
        </div>
      </div>
      <div>
        <div class="steps">
          <span class="step" id="st1">Крок 1 · за кутами</span>
          <span class="step" id="st2">Крок 2 · за сторонами</span>
          <span class="step" id="st3">Крок 3 · основа</span>
        </div>
        <div class="q" id="clsQ"></div>
        <div class="opts" id="clsOpts"></div>
        <div class="fb" id="clsFb"></div>
        <div class="hint" id="clsHint"></div>
        <div class="answer" id="clsAns"></div>
        <div class="btnrow">
          <button class="btn sec" id="clsHintBtn">💡 Підказка</button>
          <button class="btn" id="clsNext">Наступний трикутник ➜</button>
        </div>
        <div class="small" style="margin-top:12px">Відповідь: спочатку вид за кутами, потім — за сторонами (наприклад, «прямокутний рівнобедрений»).</div>
      </div>
    </div>
  </section>

  <!-- 2. Правила -->
  <section class="card panel" id="rules">
    <div class="toprow">
      <span id="rCount"></span><span class="spacer"></span>
      <button class="btn sec" id="rShuffle">🔀 Перемішати</button>
      <button class="btn sec" id="rListBtn">📋 Усі правила</button>
    </div>
    <div class="dots" id="rDots"></div>
    <div class="rule" id="rText"></div>
    <div class="chips" id="rChips"></div>
    <div class="fb" id="rFb"></div>
    <div class="btnrow">
      <button class="btn sec" id="rPrev">⟵ Назад</button>
      <button class="btn" id="rNext">Далі ➜</button>
    </div>
    <div class="rlist" id="rList"></div>
  </section>

  <!-- 3. Периметр -->
  <section class="card panel" id="per">
    <div class="grid">
      <div>
        <div class="stage"><svg id="pSvg" viewBox="0 0 560 400"></svg></div>
      </div>
      <div>
        <span class="ptype" id="pType"></span>
        <div class="ptext" id="pText"></div>
        <div id="pInputs"></div>
        <div class="fb" id="pFb"></div>
        <div class="btnrow">
          <button class="btn" id="pCheck">✔ Перевірити</button>
          <button class="btn sec" id="pShow">👁 Розв'язання</button>
          <button class="btn warm" id="pNext">Нова задача ➜</button>
        </div>
        <div class="sol" id="pSol"></div>
      </div>
    </div>
  </section>
</div>

<script>
/* ===================== Утиліти ===================== */
const $ = s => document.querySelector(s);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = x => { const r=Math.round(x*10)/10; return String(r).replace('.',','); };
const NS = 'http://www.w3.org/2000/svg';
const V=(x,y)=>({x,y}), add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y),
      mul=(a,k)=>V(a.x*k,a.y*k), len=a=>Math.hypot(a.x,a.y), norm=a=>mul(a,1/len(a)), dot=(a,b)=>a.x*b.x+a.y*b.y;
const NAMES = ['ABC','MNK','DEF','PQR','KLM','CDE','ABD','EFK','STR'];

/* ===================== Рахунок ===================== */
const score = {ok:0,total:0};
function addScore(ok){ score.total++; if(ok) score.ok++; drawScore(); }
function drawScore(){}

/* ===================== Вкладки ===================== */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x===b));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));
  };
});

/* ===================== Малювання ===================== */
function el(tag, attrs, parent, text){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(text!==undefined) e.textContent=text;
  if(parent) parent.appendChild(e);
  return e;
}
function fit(pts,W,H,pad,rot=0,flip=false){
  const c=Math.cos(rot), s=Math.sin(rot);
  const p=pts.map(q=>V(q.x*c-q.y*s, (q.x*s+q.y*c)*(flip?-1:1)));
  const xs=p.map(q=>q.x), ys=p.map(q=>q.y);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const k=Math.min((W-2*pad)/(maxx-minx||1),(H-2*pad)/(maxy-miny||1));
  const ox=(W-(maxx-minx)*k)/2-minx*k, oy=(H-(maxy-miny)*k)/2-miny*k;
  return p.map(q=>V(q.x*k+ox,q.y*k+oy));
}
/* opt: P[3], names, angles[3]|null, showAngles, sideLabels[3] (сторона i — навпроти вершини i),
   ticks[3], hiSide (індекс або -1), unknownSides[3] */
function renderTri(svg,opt){
  svg.innerHTML='';
  const P=opt.P, G=mul(add(add(P[0],P[1]),P[2]),1/3);
  el('polygon',{points:P.map(p=>`${p.x},${p.y}`).join(' '),fill:'#fbd3e5','fill-opacity':.65,stroke:'none'},svg);
  // кути
  if(opt.angles && opt.showAngles!==false){
    for(let i=0;i<3;i++){
      const Vx=P[i], u1=norm(sub(P[(i+1)%3],Vx)), u2=norm(sub(P[(i+2)%3],Vx)), d=opt.angles[i];
      const col = d===90 ? '#e0457b' : (d>90 ? '#d9480f' : '#e8890c');
      if(d===90){
        const s=22, a=add(Vx,mul(u1,s)), b=add(a,mul(u2,s)), c=add(Vx,mul(u2,s));
        el('polyline',{points:`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,fill:'none',stroke:col,'stroke-width':3},svg);
      } else {
        const r = d<35?52:(d<55?40:32);
        const a=add(Vx,mul(u1,r)), b=add(Vx,mul(u2,r));
        const cr=u1.x*u2.y-u1.y*u2.x;
        el('path',{d:`M${a.x},${a.y} A${r},${r} 0 0 ${cr>0?1:0} ${b.x},${b.y}`,fill:'none',stroke:col,'stroke-width':3},svg);
      }
      if(opt.angleLabels!==false){
        const bis=norm(add(u1,u2));
        const dist = d===90?46:(d<35?74:(d<55?62:54));
        const q=add(Vx,mul(bis,dist));
        el('text',{x:q.x,y:q.y,'text-anchor':'middle','dominant-baseline':'middle','font-size':21,'font-weight':700,fill:col},svg,d+'°');
      }
    }
  }
  // сторони
  for(let i=0;i<3;i++){
    const A=P[(i+1)%3], B=P[(i+2)%3], hi=opt.hiSide===i;
    el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:hi?'#e0457b':'#831843','stroke-width':hi?7:4,'stroke-linecap':'round'},svg);
    const M=mul(add(A,B),.5), dir=norm(sub(B,A));
    let n=V(-dir.y,dir.x); if(dot(n,sub(M,G))<0) n=mul(n,-1);
    const t=(opt.ticks||[])[i]||0;
    for(let k=0;k<t;k++){
      const off=(k-(t-1)/2)*8, c=add(M,mul(dir,off));
      const p1=add(c,mul(n,9)), p2=add(c,mul(n,-9));
      el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:'#831843','stroke-width':3},svg);
    }
    const lab=(opt.sideLabels||[])[i];
    if(lab){
      const q=add(M,mul(n,38)), unk=(opt.unknownSides||[])[i];
      const tx=el('text',{x:q.x,y:q.y,'text-anchor':'middle','dominant-baseline':'middle','font-size':22,'font-weight':800,
        fill:unk?'#d9480f':'#9d174d',stroke:'#fff','stroke-width':5,'paint-order':'stroke'},svg,lab);
    }
  }
  // вершини
  for(let i=0;i<3;i++){
    el('circle',{cx:P[i].x,cy:P[i].y,r:5,fill:'#831843'},svg);
    const d=norm(sub(P[i],G)), q=add(P[i],mul(d,24));
    el('text',{x:q.x,y:q.y,'text-anchor':'middle','dominant-baseline':'middle','font-size':26,'font-weight':800,'font-style':'italic',fill:'#3a2633'},svg,opt.names[i]);
  }
}
const sideName=(names,i)=>{ const j=[(i+1)%3,(i+2)%3].sort(); return names[j[0]]+names[j[1]]; };

/* ===================== 1. КЛАСИФІКАЦІЯ ===================== */
const TYPES=[['acute','scalene'],['acute','isosceles'],['acute','equilateral'],
             ['right','scalene'],['right','isosceles'],['obtuse','scalene'],['obtuse','isosceles']];
const ANG={acute:'гострокутний',right:'прямокутний',obtuse:'тупокутний'};
const SID={scalene:'різносторонній',isosceles:'рівнобедрений',equilateral:'рівносторонній'};
let deck=[], C=null;

function genAngles(a,s){
  let t;
  if(s==='equilateral') return [60,60,60];
  if(a==='right'&&s==='isosceles') t=[90,45,45];
  else if(a==='right'){ let x; do{x=rnd(22,68);}while(Math.abs(x-45)<8); t=[90,x,90-x]; }
  else if(s==='isosceles'){
    let apex;
    if(a==='acute'){ do{apex=2*rnd(14,42);}while(apex>=52&&apex<=68); }
    else apex=2*rnd(52,68);
    const b=(180-apex)/2; t=[apex,b,b];
  } else if(a==='acute'){
    let x,y,z; do{x=rnd(35,86);y=rnd(35,86);z=180-x-y;}
    while(!(z>=35&&z<90&&Math.abs(x-y)>=8&&Math.abs(y-z)>=8&&Math.abs(x-z)>=8&&x<90&&y<90)); t=[x,y,z];
  } else {
    let o,x,y; do{o=rnd(100,145);x=rnd(14,180-o-14);y=180-o-x;}while(!(y>=14&&Math.abs(x-y)>=8)); t=[o,x,y];
  }
  return shuffle(t);
}
function newTri(){
  if(!deck.length) deck=shuffle(TYPES);
  let t=deck.pop();
  if(C && t[0]===C.a && t[1]===C.s && deck.length){ deck.unshift(t); t=deck.pop(); }
  const [a,s]=t, ang=genAngles(a,s), names=pick(NAMES).split('');
  const R=ang.map(d=>d*Math.PI/180), sn=R.map(Math.sin), mx=Math.max(...sn), L=rnd(6,12);
  const lens=sn.map(v=>L*v/mx);
  // побудова: A=(0,0), B=(c,0), C=(b cosA, b sinA)
  const pts=[V(0,0),V(lens[2],0),V(lens[1]*Math.cos(R[0]),-lens[1]*Math.sin(R[0]))];
  const P=fit(pts,560,420,78,Math.random()*Math.PI*2,Math.random()<.5);
  // рівні сторони (навпроти рівних кутів)
  const ticks=[0,0,0];
  if(s==='equilateral') ticks.fill(1);
  else if(s==='isosceles'){ for(let i=0;i<3;i++) if(ang.filter(d=>d===ang[i]).length===2) ticks[i]=1; }
  const iMax=ang.indexOf(Math.max(...ang));
  let el3=null;
  if(s==='isosceles') el3={kind:'base',idx:ang.findIndex(d=>ang.filter(x=>x===d).length===1)};
  C={a,s,ang,names,lens,P,ticks,iMax,el3,step:1,tries:0,hi:-1,done:false};
  drawCls(); showStep();
}
function drawCls(){
  renderTri($('#clsSvg'),{P:C.P,names:C.names,angles:C.ang,showAngles:$('#tAng').checked,
    sideLabels:$('#tLen').checked?C.lens.map(l=>fmt(l)+' см'):[],
    ticks:C.ticks,hiSide:C.hi});
}
['#tAng','#tLen'].forEach(id=>$(id).onchange=()=>C&&drawCls());

function setSteps(){
  [1,2,3].forEach(i=>{
    const e=$('#st'+i); e.className='step'+(C.step===i&&!C.done?' on':'')+(C.step>i||C.done?' done':'');
    e.style.display = (i===3 && !C.el3) ? 'none' : '';
  });
}
function showStep(){
  setSteps();
  $('#clsFb').textContent=''; $('#clsFb').className='fb';
  $('#clsHint').style.display='none';
  const tn=C.names.join('');
  let q,opts,correct;
  if(C.step===1){ q=`Який вид трикутника ${tn} <u>за кутами</u>?`; opts=['гострокутний','прямокутний','тупокутний']; correct=ANG[C.a]; }
  else if(C.step===2){ q=`Трикутник ${tn} — ${ANG[C.a]}. А який він <u>за сторонами</u>?`; opts=['різносторонній','рівнобедрений','рівносторонній']; correct=SID[C.s]; }
  else {
    const what = 'основа';
    q=`Яка сторона трикутника ${tn} — <u>${what}</u>?`;
    opts=[0,1,2].map(i=>sideName(C.names,i)); correct=sideName(C.names,C.el3.idx);
  }
  $('#clsQ').innerHTML=q;
  const box=$('#clsOpts'); box.innerHTML='';
  C.tries=0;
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>answerCls(b,o===correct);
    box.appendChild(b);
  });
  if(C.step===1) $('#clsAns').style.display='none';
}
function answerCls(btn,ok){
  if(btn.disabled) return;
  C.tries++;
  if(!ok){
    btn.classList.add('bad'); btn.disabled=true;
    $('#clsFb').className='fb bad'; $('#clsFb').textContent='Ні, подумайте ще! Натисніть «Підказка», якщо потрібно.';
    if(C.tries===1) addScore(false);
    return;
  }
  if(C.tries===1) addScore(true);
  btn.classList.add('ok');
  document.querySelectorAll('#clsOpts .opt').forEach(b=>b.disabled=true);
  $('#clsFb').className='fb ok'; $('#clsFb').textContent=pick(['Правильно! 👏','Так! Молодці! 🎉','Чудово! ✅','Саме так! ⭐']);
  const hasStep3=!!C.el3;
  setTimeout(()=>{
    if(C.step===1){ C.step=2; showStep(); }
    else if(C.step===2){ if(hasStep3){ C.step=3; showStep(); } else { C.done=true; setSteps(); } }
    else { C.hi=C.el3.idx; drawCls(); C.done=true; setSteps(); }
  },650);
}
$('#clsHintBtn').onclick=()=>{
  if(!C||C.done) return;
  const h=$('#clsHint');
  if(C.step===1) h.innerHTML='Знайдіть <b>найбільший</b> кут. Якщо він менший від 90° — трикутник гострокутний; дорівнює 90° — прямокутний; більший від 90° — тупокутний.';
  else if(C.step===2) h.innerHTML='Порівняйте довжини сторін (або подивіться на рисочки). Усі різні — різносторонній; дві рівні — рівнобедрений; усі три рівні — рівносторонній.';
  else h.innerHTML = 'Рівні сторони рівнобедреного трикутника — <b>бічні сторони</b>. Третя сторона — <b>основа</b>.';
  h.style.display='block';
};

let RULES=RULES0.map(r=>({...r,st:0})), ri=0; // st: 0 — не відповідали, 1 — з першої спроби, 2 — з помилкою

/* ===================== 3. ПЕРИМЕТР ===================== */
const tri_ok=(a,b,c)=>{ const m=Math.max(a,b,c); return m < 0.88*(a+b+c-m); };
/* Задача: {type, text, inputs:[{label,ans}], tri:{AB,BC,AC}, ticks, labels(revealed)=>{AB,BC,AC}, unknown:{..}, sol:[...], answer} */
const GEN = {
 p3:{name:'Периметр за трьома сторонами', f(){
   let a,b,c; do{a=rnd(4,16);b=rnd(4,16);c=rnd(4,16);}while(!(tri_ok(a,b,c)&&a!==b&&b!==c&&a!==c));
   const n=pick(NAMES);
   return {text:`Сторони трикутника ${n} дорівнюють ${a} см, ${b} см і ${c} см. Знайдіть периметр трикутника.`,
     names:n, inputs:[{label:`P<sub>${n}</sub> =`,ans:a+b+c}], tri:{AB:a,BC:b,AC:c},
     labels:()=>({AB:a+' см',BC:b+' см',AC:c+' см'}),
     sol:[`P = AB + BC + AC`.replace(/AB|BC|AC/g,s=>sideOf(n,s)),`P = ${a} + ${b} + ${c} = ${a+b+c} (см).`], answer:`${a+b+c} см`};
 }},
 p3u:{name:'Периметр (різні одиниці)', f(){
   let a,b,c; do{a=rnd(5,14);b=rnd(5,14);c=rnd(11,19);}while(!(tri_ok(a,b,c)&&a!==b&&b!==c&&a!==c));
   const n=pick(NAMES), m=a*10;
   return {text:`Сторони трикутника дорівнюють ${m} мм, ${b} см і 1 дм ${c-10} см. Знайдіть периметр трикутника в сантиметрах.`,
     names:n, inputs:[{label:'P =',ans:a+b+c}], tri:{AB:a,BC:b,AC:c},
     labels:r=>r?({AB:a+' см',BC:b+' см',AC:c+' см'}):({AB:m+' мм',BC:b+' см',AC:`1 дм ${c-10} см`}),
     sol:[`${m} мм = ${a} см;  1 дм ${c-10} см = ${c} см.`,`P = ${a} + ${b} + ${c} = ${a+b+c} (см).`], answer:`${a+b+c} см`};
 }},
 eqP:{name:'Рівносторонній: сторона → периметр', f(){
   const a=rnd(6,30)/2, n=pick(NAMES);
   return {text:`Сторона рівностороннього трикутника ${n} дорівнює ${fmt(a)} см. Знайдіть його периметр.`,
     names:n, inputs:[{label:'P =',ans:3*a}], tri:{AB:a,BC:a,AC:a}, ticks:{AB:1,BC:1,AC:1},
     labels:r=>({AB:fmt(a)+' см',BC:r?fmt(a)+' см':'',AC:r?fmt(a)+' см':''}),
     sol:[`У рівностороннього трикутника всі сторони рівні.`,`P = 3a = 3 · ${fmt(a)} = ${fmt(3*a)} (см).`], answer:`${fmt(3*a)} см`};
 }},
 eqA:{name:'Рівносторонній: периметр → сторона', f(){
   const a=rnd(3,22), n=pick(NAMES);
   return {text:`Периметр рівностороннього трикутника ${n} дорівнює ${3*a} см. Знайдіть його сторону.`,
     names:n, inputs:[{label:'Сторона =',ans:a}], tri:{AB:a,BC:a,AC:a}, ticks:{AB:1,BC:1,AC:1},
     labels:r=>({AB:r?a+' см':'?',BC:r?a+' см':'',AC:r?a+' см':''}), unknown:{AB:1},
     sol:[`P = 3a, тому a = P : 3.`,`a = ${3*a} : 3 = ${a} (см).`], answer:`${a} см`};
 }},
 isoP:{name:'Рівнобедрений: периметр', f(){
   let a,b; do{a=rnd(5,15);b=rnd(3,2*a-3);}while(b===a);
   const n=pick(NAMES), s=sides(n);
   return {text:`Основа ${s.AC} рівнобедреного трикутника ${n} дорівнює ${b} см, а бічна сторона — ${a} см. Знайдіть периметр трикутника.`,
     names:n, inputs:[{label:'P =',ans:2*a+b}], tri:{AB:a,BC:a,AC:b}, ticks:{AB:1,BC:1},
     labels:r=>({AB:a+' см',BC:r?a+' см':'',AC:b+' см'}),
     sol:[`Бічні сторони рівні: ${s.AB} = ${s.BC} = ${a} см.`,`P = ${a} + ${a} + ${b} = ${2*a+b} (см).`], answer:`${2*a+b} см`};
 }},
 isoLat:{name:'Рівнобедрений: знайти бічну сторону', f(){
   let a,b; do{a=rnd(5,16);b=rnd(3,2*a-3);}while(b===a);
   const n=pick(NAMES), s=sides(n), P=2*a+b;
   return {text:`Периметр рівнобедреного трикутника ${n} дорівнює ${P} см, а його основа ${s.AC} — ${b} см. Знайдіть бічну сторону.`,
     names:n, inputs:[{label:'Бічна сторона =',ans:a}], tri:{AB:a,BC:a,AC:b}, ticks:{AB:1,BC:1},
     labels:r=>({AB:r?a+' см':'?',BC:r?a+' см':'?',AC:b+' см'}), unknown:{AB:1,BC:1},
     sol:[`Сума бічних сторін: ${P} − ${b} = ${P-b} (см).`,`Бічна сторона: ${P-b} : 2 = ${a} (см).`], answer:`${a} см`};
 }},
 isoBase:{name:'Рівнобедрений: знайти основу', f(){
   let a,b; do{a=rnd(5,16);b=rnd(3,2*a-3);}while(b===a);
   const n=pick(NAMES), s=sides(n), P=2*a+b;
   return {text:`Периметр рівнобедреного трикутника ${n} дорівнює ${P} см, а бічна сторона — ${a} см. Знайдіть основу ${s.AC}.`,
     names:n, inputs:[{label:'Основа =',ans:b}], tri:{AB:a,BC:a,AC:b}, ticks:{AB:1,BC:1},
     labels:r=>({AB:a+' см',BC:r?a+' см':'',AC:r?b+' см':'?'}), unknown:{AC:1},
     sol:[`Дві бічні сторони разом: 2 · ${a} = ${2*a} (см).`,`Основа: ${P} − ${2*a} = ${b} (см).`], answer:`${b} см`};
 }},
 isoDiff:{name:'Рівнобедрений: основа більша/менша на …', f(){
   const a=rnd(7,16), longer=Math.random()<.5;
   let d; d = longer ? rnd(2,a-3) : rnd(2,a-3);
   const b = longer ? a+d : a-d, P=2*a+b, n=pick(NAMES);
   const txt = longer ? `на ${d} см більша` : `на ${d} см менша`;
   const expr = longer ? `(x + ${d})` : `(x − ${d})`;
   return {text:`Периметр рівнобедреного трикутника дорівнює ${P} см, а його основа ${txt} від бічної сторони. Знайдіть сторони трикутника.`,
     names:n, inputs:[{label:'Бічна сторона =',ans:a},{label:'Основа =',ans:b}], tri:{AB:a,BC:a,AC:b}, ticks:{AB:1,BC:1},
     labels:r=>r?({AB:a+' см',BC:a+' см',AC:b+' см'}):({AB:'x',BC:'x',AC:longer?`x + ${d}`:`x − ${d}`}), unknown:{AB:1,BC:1,AC:1},
     sol:[`Нехай бічна сторона — x см, тоді основа — ${expr} см.`,
          `x + x + ${expr} = ${P};  3x ${longer?'+':'−'} ${d} = ${P};  3x = ${longer?P-d:P+d};  x = ${a}.`,
          `Бічні сторони — ${a} см, основа — ${b} см.`], answer:`${a} см, ${a} см, ${b} см`};
 }},
 isoMult:{name:'Рівнобедрений: бічна сторона в k разів більша', f(){
   const q=pick([2,3]), x=rnd(2,9), P=(2*q+1)*x, n=pick(NAMES);
   return {text:`Периметр рівнобедреного трикутника дорівнює ${P} см, а бічна сторона в ${q} рази більша за основу. Знайдіть сторони трикутника.`,
     names:n, inputs:[{label:'Основа =',ans:x},{label:'Бічна сторона =',ans:q*x}], tri:{AB:q*x,BC:q*x,AC:x}, ticks:{AB:1,BC:1},
     labels:r=>r?({AB:q*x+' см',BC:q*x+' см',AC:x+' см'}):({AB:q+'x',BC:q+'x',AC:'x'}), unknown:{AB:1,BC:1,AC:1},
     sol:[`Нехай основа — x см, тоді бічна сторона — ${q}x см.`,`x + ${q}x + ${q}x = ${P};  ${2*q+1}x = ${P};  x = ${x}.`,
          `Основа — ${x} см, бічні сторони — ${q*x} см.`], answer:`${x} см, ${q*x} см, ${q*x} см`};
 }},
 chain:{name:'Сторони виражено одна через одну', f(){
   let x,k,m,b,c; do{x=rnd(5,12);k=rnd(2,6);m=rnd(1,8);b=x+k;c=b-m;}while(!(c>0&&c!==x&&c!==b&&tri_ok(x,b,c)));
   const n=pick(NAMES);
   return {text:`Одна сторона трикутника дорівнює ${x} см, друга — на ${k} см більша за неї, а третя — на ${m} см менша від другої. Знайдіть периметр трикутника.`,
     names:n, inputs:[{label:'P =',ans:x+b+c}], tri:{AB:b,BC:c,AC:x},
     labels:r=>r?({AB:b+' см',BC:c+' см',AC:x+' см'}):({AB:`${x} + ${k}`,BC:'?',AC:x+' см'}), unknown:{BC:1},
     sol:[`Друга сторона: ${x} + ${k} = ${b} (см).`,`Третя сторона: ${b} − ${m} = ${c} (см).`,`P = ${x} + ${b} + ${c} = ${x+b+c} (см).`], answer:`${x+b+c} см`};
 }},
 third:{name:'Знайти третю сторону', f(){
   let a,b,c; do{a=rnd(4,16);b=rnd(4,16);c=rnd(4,16);}while(!(tri_ok(a,b,c)&&a!==b&&b!==c&&a!==c));
   const n=pick(NAMES), s=sides(n), P=a+b+c;
   return {text:`Периметр трикутника ${n} дорівнює ${P} см, ${s.AB} = ${a} см, ${s.BC} = ${b} см. Знайдіть сторону ${s.AC}.`,
     names:n, inputs:[{label:`${s.AC} =`,ans:c}], tri:{AB:a,BC:b,AC:c},
     labels:r=>({AB:a+' см',BC:b+' см',AC:r?c+' см':'?'}), unknown:{AC:1},
     sol:[`${s.AC} = P − ${s.AB} − ${s.BC}`,`${s.AC} = ${P} − ${a} − ${b} = ${c} (см).`], answer:`${c} см`};
 }},
};
function sideOf(n,s){ const map={A:n[0],B:n[1],C:n[2]}; return s.split('').map(ch=>map[ch]).join(''); }
function sides(n){ return {AB:n[0]+n[1],BC:n[1]+n[2],AC:n[0]+n[2]}; }

const ORDER=['p3','eqA','isoP','chain'];
let PR=null, pIdx=-1;
function newProblem(){
  pIdx=(pIdx+1)%ORDER.length; const k=ORDER[pIdx];
  PR={...GEN[k].f(),key:k,checked:false,solved:false};
  $('#pType').textContent=GEN[k].name;
  $('#pText').textContent=PR.text;
  const box=$('#pInputs'); box.innerHTML='';
  PR.inputs.forEach((inp,i)=>{
    const row=document.createElement('div'); row.className='inrow';
    row.innerHTML=`<span class="lab">${inp.label}</span><input inputmode="decimal" autocomplete="off" id="pin${i}"><span>см</span>`;
    box.appendChild(row);
  });
  box.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') checkProblem(); }));
  $('#pFb').textContent=''; $('#pFb').className='fb';
  $('#pSol').style.display='none';
  drawProblem(false);
}
function drawProblem(revealed){
  const t=PR.tri, AB=t.AB, BC=t.BC, AC=t.AC;
  const x=(AB*AB-BC*BC+AC*AC)/(2*AC), y=Math.sqrt(Math.max(AB*AB-x*x,0.01));
  const P=fit([V(0,0),V(x,-y),V(AC,0)],560,400,70);
  const L=PR.labels(revealed), tk=PR.ticks||{}, un=revealed?{}:(PR.unknown||{});
  // вершини P[0]=A, P[1]=B, P[2]=C; сторона навпроти A — BC, навпроти B — AC, навпроти C — AB
  renderTri($('#pSvg'),{P,names:PR.names.split(''),angles:null,
    sideLabels:[L.BC,L.AC,L.AB],ticks:[tk.BC||0,tk.AC||0,tk.AB||0],unknownSides:[un.BC,un.AC,un.AB],hiSide:-1});
}
function parseNum(s){ s=(s||'').trim().replace(',','.').replace(/\s/g,''); if(s==='') return NaN; return Number(s); }
function checkProblem(){
  if(!PR||PR.solved) return;
  let all=true, empty=false;
  PR.inputs.forEach((inp,i)=>{
    const e=$('#pin'+i), v=parseNum(e.value);
    if(isNaN(v)){ empty=true; all=false; e.className=''; return; }
    const ok=Math.abs(v-inp.ans)<1e-6; e.className=ok?'ok':'bad'; if(!ok) all=false;
  });
  if(empty){ $('#pFb').className='fb bad'; $('#pFb').textContent='Заповніть усі поля відповіді.'; return; }
  if(!PR.checked){ PR.checked=true; addScore(all); }
  if(all){
    PR.solved=true;
    $('#pFb').className='fb ok'; $('#pFb').textContent=pick(['Правильно! 🎉','Чудово! Відповідь правильна ✅','Молодці! ⭐']);
    drawProblem(true); showSolution();
  } else if(!empty){
    $('#pFb').className='fb bad'; $('#pFb').textContent='Є помилка. Перевірте обчислення і спробуйте ще раз.';
  }
}
function showSolution(){
  $('#pSol').innerHTML='<div class="t">Розв\'язання</div>'+PR.sol.map(s=>`<div>${s}</div>`).join('')+`<div style="margin-top:6px"><b>Відповідь:</b> ${PR.answer}.</div>`;
  $('#pSol').style.display='block';
}
$('#pCheck').onclick=checkProblem;
$('#pShow').onclick=()=>{ if(!PR) return; if(!PR.checked){PR.checked=true; addScore(false);} PR.solved=true;
  PR.inputs.forEach((inp,i)=>{ const e=$('#pin'+i); if(!e.value.trim()){ e.value=fmt(inp.ans); } });
  drawProblem(true); showSolution(); };
$('#pNext').onclick=newProblem;

/* ===================== Старт ===================== */
newTri(); renderRule(); newProblem();

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
