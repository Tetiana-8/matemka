<script>
(function(){

  const out = []; snap.forEach(d => out.push(d.data()));

async function clearResults(){

fb().catch(() => {});   // підключення одразу при відкритті сторінки

/*LOGIC_START*/
/* ===================== Випадкові числа (свій варіант кожному учневі) ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
function setSeed(s){rng=mulberry32(s)}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const pick=a=>a[Math.floor(rng()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['a','b','c','d','k','m','n','p','x','y','z'];
function letters(n){const pool=LET.slice(),o=[];for(let i=0;i<n;i++)o.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);return o}
const disp=s=>s.replace(/[A-Za-z]+/g,m=>'<i>'+m+'</i>');
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
function plain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\u00a0/g,' ')}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}

/* ===================== Многочлени: розбір і порівняння виразів ===================== */
function clean(p){const r={};for(const k in p)if(p[k]!==0)r[k]=p[k];return r}
function pAdd(p,q,s){const r=Object.assign({},p);for(const k in q)r[k]=(r[k]||0)+s*q[k];return clean(r)}
function pMul(p,q){const r={};for(const a in p)for(const b in q){const k=(a+b).split('').sort().join('');r[k]=(r[k]||0)+p[a]*q[b]}return clean(r)}
function pEq(p,q){p=clean(p);q=clean(q);const a=Object.keys(p),b=Object.keys(q);return a.length===b.length&&a.every(k=>p[k]===q[k])}
const LOOK={'а':'a','с':'c','е':'e','о':'o','р':'p','х':'x','к':'k','м':'m','т':'t','у':'y','і':'i','в':'b'};
function normalize(s){
  return String(s).toLowerCase().replace(/[\u0400-\u04ff]/g,ch=>LOOK[ch]||ch)
    .replace(/[−–—‒]/g,'-').replace(/[×·⋅∙•*]/g,'*').replace(/[\[{]/g,'(').replace(/[\]}]/g,')').replace(/\s+/g,'');
}
function tokenize(s){const t=s.match(/\d+|[a-z]|[-+*()]/g)||[];return (t.length&&t.join('')===s)?t:null}
function parseExpr(t){
  if(!t)return null;
  let pos=0;
  function factor(){
    const x=t[pos];if(x===undefined)throw 0;
    if(/^\d+$/.test(x)){pos++;return {'':+x}}
    if(/^[a-z]$/.test(x)){pos++;return {[x]:1}}
    if(x==='('){pos++;const p=expr();if(t[pos]!==')')throw 0;pos++;return p}
    if(x==='-'){pos++;return pMul(factor(),{'':-1})}
    throw 0;
  }
  function term(){
    let p=factor();
    while(pos<t.length){
      const x=t[pos];
      if(x==='*'){pos++;p=pMul(p,factor())}
      else if(/^\d+$/.test(x)||/^[a-z]$/.test(x)||x==='('){p=pMul(p,factor())}
      else break;
    }
    return p;
  }
  function expr(){
    let sg=1;
    if(t[pos]==='-'){sg=-1;pos++}else if(t[pos]==='+'){pos++}
    let p=term();if(sg<0)p=pMul(p,{'':-1});
    while(t[pos]==='+'||t[pos]==='-'){const op=t[pos++];p=pAdd(p,term(),op==='+'?1:-1)}
    return p;
  }
  try{const p=expr();return pos===t.length?p:null}catch(e){return null}
}
const P=s=>parseExpr(tokenize(normalize(s)));
/* «найпростіший вигляд»: без дужок, у кожному доданку не більше одного числа, подібні доданки зведено */
function isSimplified(t){
  if(t.indexOf('(')>=0||t.indexOf(')')>=0)return false;
  const terms=[];let cur=[];
  t.forEach(x=>{
    const last=cur[cur.length-1];
    if((x==='+'||x==='-')&&cur.length&&last!=='*'&&last!=='+'&&last!=='-'){terms.push(cur);cur=[x]}
    else cur.push(x);
  });
  if(cur.length)terms.push(cur);
  const seen={};
  for(const tm of terms){
    if(tm.filter(x=>/^\d+$/.test(x)).length>1)return false;
    const p=parseExpr(tm);if(!p)return false;
    const ks=Object.keys(clean(p));
    if(ks.length>1)return false;
    if(ks.length===1){if(seen[ks[0]])return false;seen[ks[0]]=1}
  }
  return true;
}
function checkExpr(q,raw){
  const s=normalize(raw);const t=tokenize(s);if(!t)return false;
  const p=parseExpr(t);if(!p)return false;
  if(q.mode==='poly')return pEq(p,q.exp);
  if(q.mode==='simplified')return pEq(p,q.exp)&&isSimplified(t);
  if(q.mode==='factor'){
    const m=s.match(new RegExp('^'+q.K+'\\*?\\((.+)\\)$'))||s.match(new RegExp('^\\((.+)\\)\\*?'+q.K+'$'));
    if(!m)return false;
    const inn=P(m[1]);
    return !!inn&&pEq(inn,q.inner);
  }
  return false;
}

/* ===================== Завдання ===================== */
function genQuestions(){
  const Q=[];
  const HINT_L='Букви можна вводити з клавіатури або кнопками під полем.';

  /* 1. сполучна властивість, літерами */
  {
    const [u,v,w]=letters(3);
    Q.push({kind:'choice',math:true,t:'Яка рівність виражає сполучну властивість множення?',
      opts:[`(${u}${v})${w} = ${u}(${v}${w})`,`${u}(${v} + ${w}) = ${u}${v} + ${u}${w}`,`${u}${v} = ${v}${u}`,`(${u} + ${v}) + ${w} = ${u} + (${v} + ${w})`].map(disp),ans:0});
  }
  /* 2. розподільна властивість, літерами */
  {

  Q.push({kind:'choice',t:'Яке твердження є розподільною властивістю множення відносно додавання?',

  /* 8. так / ні */

  {

  {

  {
    const [v]=letters(1);let c,sg,total,ok;

      const n=rng()<.6?2:3;

      for(let i=1;i<n;i++){const s=rng()<.5?1:-1,x=rnd(1,45);sg.push(s);c.push(x);total+=s*x;if(total<=0)ok=false}
    }while(!ok||total<2);

    for(let i=1;i<c.length;i++)orig+=` ${sg[i]>0?'+':'−'} ${c[i]===1?'':c[i]}${v}`;

  {
    const minus=rng()<.5,sg=minus?'−':'+',asc=minus?'-':'+';
    if(rng()<.5){

        pre:disp(`${k}${u} ${sg} ${k}${v}`)+' =',post:'',letters:[u,v],show:`${k}(${u} ${sg} ${v})`,orig:`${k}${u} ${sg} ${k}${v}`,
        hint:'Запишіть добуток спільного множника та суми (різниці) в дужках. '+HINT_L});

        hint:'Запишіть добуток спільного множника та суми (різниці) в дужках. '+HINT_L});
    }
  }
  /* 16. задача: сполучна властивість на рисунку підручника */
  {
    const a=rnd(3,9),b=rnd(3,9);
    Q.push({kind:'num',t:`Прямокутник зі сторонами ${a} см і ${b} см розбили на квадрати зі стороною 1 см. Кожен такий квадрат містить 4 клітинки зошита. Скільки всього клітинок у прямокутнику?`,
      lbl:'Відповідь:',post:'клітинок',ans:a*b*4,meta:[a,b]});
  }
  return Q;
}

/* ===================== Перевірка відповіді ===================== */
function isFilled(q,v){
  if(q.kind==='choice')return v!==null;
  if(q.kind==='num')return v!=='';
  if(q.kind==='expr')return String(v).trim()!=='';
  return v.every(x=>x!==null);
}
function isRight(q,v){
  if(!isFilled(q,v))return false;
  if(q.kind==='choice')return v===q.ans;
  if(q.kind==='num')return Number(v)===q.ans;
  if(q.kind==='expr')return checkExpr(q,v);
  return v.every((x,i)=>x===q.items[i].ok);
}
function qText(q){
  if(q.kind==='num')return plain(q.t)+' '+plain(q.lbl)+(q.post?' … '+q.post:'');
  if(q.kind==='expr')return plain(q.t)+' '+plain(q.pre)+'…'+plain(q.post||'');
  if(q.kind==='tf')return plain(q.t)+' '+q.items.map(x=>plain(x.t)).join(' ; ');
  return plain(q.t);
}
function answerText(q,v){
  if(q.kind==='choice')return v===null?'':plain(q.opts[v]);
  if(q.kind==='num')return String(v);
  if(q.kind==='expr')return String(v).trim();
  return v.map(x=>x===null?'':(x?'Так':'Ні')).join(',');
}
function correctText(q){
  if(q.kind==='choice')return plain(q.opts[q.ans]);
  if(q.kind==='num')return String(q.ans);
  if(q.kind==='expr')return plain(q.show);
  return q.items.map(x=>x.ok?'Так':'Ні').join(',');
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qWrap=$('#questions');
const touch=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
let QUESTIONS=[],N=0,state=null,seed=0,warnedEmpty=false;

/* час і виходи з вікна */
let W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0};
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}
function leave(){if(!state||state.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);
window.addEventListener('focus',back);

function newSeed(first){
  let v=null;
  if(first){try{v=new URLSearchParams(location.search).get('v')}catch(e){}}
  seed=(v&&/^\d+$/.test(v))?(Number(v)>>>0):Math.floor(Math.random()*4294967296);
  setSeed(seed);
}
function initVal(q){
  if(q.kind==='choice')return null;
  if(q.kind==='num'||q.kind==='expr')return '';
  return q.items.map(()=>null);
}
const SYMS=['+','−','·','(',')'];

function build(first){
  newSeed(first);
  QUESTIONS=genQuestions();N=QUESTIONS.length;
  state={val:QUESTIONS.map(initVal),orders:[],checked:false};
  resetWatch();
  qWrap.innerHTML='';
  QUESTIONS.forEach((q,qi)=>{
    const el=document.createElement('section');
    el.className='card q';el.id='q'+qi;
    let h=`<div class="qh"><span class="num">${qi+1}</span><div class="qt">${q.t}</div><span class="mark"></span></div>`;
    if(q.kind==='choice'){
      const order=shuffle(q.opts.map((_,i)=>i));
      state.orders[qi]=order;
      h+=`<div class="opts${q.math?' mth':''}">${order.map(i=>`<button type="button" class="opt" data-q="${qi}" data-i="${i}">${q.opts[i]}</button>`).join('')}</div>`;
    }else if(q.kind==='tf'){
      h+=`<div class="tfs">${q.items.map((it,i)=>`<div class="tfr" data-i="${i}"><span class="tt">${it.t}</span><span class="bb"><button type="button" class="tfb" data-q="${qi}" data-i="${i}" data-v="1">Так</button><button type="button" class="tfb" data-q="${qi}" data-i="${i}" data-v="0">Ні</button></span></div>`).join('')}</div>`;
    }else if(q.kind==='num'){
      h+=`<div class="numrow"><span>${q.lbl}</span><input class="numin" data-q="${qi}" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="Відповідь">${q.post?`<span>${q.post}</span>`:''}</div>`;
    }else{
      h+=`<div class="exr"><span class="tx">${q.pre}</span><input class="exin" data-q="${qi}" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="40" aria-label="Відповідь"><span class="tx">${q.post||''}</span></div>`;
      h+=`<div class="symrow">`+q.letters.map(l=>`<button type="button" class="sym" data-q="${qi}" data-ch="${l}" aria-label="буква ${l}"><i>${l}</i></button>`).join('')
        +SYMS.map(ch=>`<button type="button" class="sym" data-q="${qi}" data-ch="${ch}">${ch}</button>`).join('')+`</div>`;
      h+=`<div class="hint">${q.hint}</div>`;
    }
    el.innerHTML=h;
    qWrap.appendChild(el);
  });
  $('#result').hidden=true;
  $('#actions').hidden=false;
  clearWarn();
}
function clearWarn(){$('#warn').textContent='';warnedEmpty=false;$('#checkBtn').textContent='Перевірити'}

/* введення */
qWrap.addEventListener('input',e=>{
  const el=e.target;if(!state||state.checked)return;
  const qi=+el.dataset.q;
  if(el.classList.contains('numin')){
    el.value=el.value.replace(/\D/g,'').slice(0,9);
    state.val[qi]=el.value;clearWarn();
  }else if(el.classList.contains('exin')){
    state.val[qi]=el.value;clearWarn();
  }
});
/* кнопки з буквами й знаками не забирають фокус із поля */
qWrap.addEventListener('mousedown',e=>{if(e.target.closest('.sym'))e.preventDefault()});

qWrap.addEventListener('click',e=>{
  if(!state||state.checked)return;
  const sy=e.target.closest('.sym');
  if(sy){
    const qi=+sy.dataset.q,inp=qWrap.querySelector(`.exin[data-q="${qi}"]`);
    if(!inp||inp.readOnly)return;
    const ch=sy.dataset.ch,a=inp.selectionStart==null?inp.value.length:inp.selectionStart,b=inp.selectionEnd==null?a:inp.selectionEnd;
    if(inp.value.length-(b-a)+ch.length>40)return;
    inp.value=inp.value.slice(0,a)+ch+inp.value.slice(b);
    try{inp.setSelectionRange(a+ch.length,a+ch.length)}catch(x){}
    state.val[qi]=inp.value;clearWarn();
    try{inp.focus({preventScroll:true})}catch(x){inp.focus()}
    return;
  }
  const o=e.target.closest('.opt');
  if(o){
    const qi=+o.dataset.q;
    qWrap.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');state.val[qi]=+o.dataset.i;clearWarn();return;
  }
  const t=e.target.closest('.tfb');
  if(t){
    const qi=+t.dataset.q,i=+t.dataset.i;
    qWrap.querySelectorAll(`.tfb[data-q="${qi}"][data-i="${i}"]`).forEach(x=>x.classList.remove('sel'));
    t.classList.add('sel');state.val[qi][i]=t.dataset.v==='1';clearWarn();
  }
});

/* екранна цифрова клавіатура для числових відповідей (сенсорні екрани) */
const kp=$('#kp');
if(touch){
  document.addEventListener('focusin',e=>{
    if(e.target.matches&&e.target.matches('.numin')){
      kp.hidden=false;document.body.classList.add('kpOn');
      const t=e.target;setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},60);
    }

  document.addEventListener('focusout',()=>{
    setTimeout(()=>{
      const a=document.activeElement;
      if(!(a&&a.matches&&a.matches('.numin'))){kp.hidden=true;document.body.classList.remove('kpOn')}
    },150);
  });
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked)return;

  });

  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(sur,nam);
});

function finish(sur,nam){
  const now=Date.now();
  back();
  state.checked=true;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const marks=QUESTIONS.map((q,i)=>isRight(q,state.val[i])?1:0);
  const score=marks.reduce((s,x)=>s+x,0);
  QUESTIONS.forEach((q,i)=>{
    const el=$('#q'+i);el.classList.add('locked',marks[i]?'ok':'bad');
    el.querySelector('.mark').textContent=marks[i]?'✓':'✗';
    el.querySelectorAll('input').forEach(inp=>{inp.readOnly=true});
    if(q.kind==='num'||q.kind==='expr'){
      el.querySelector(q.kind==='num'?'.numin':'.exin').classList.add(marks[i]?'good':'bad');
    }else if(q.kind==='choice'){
      const sel=el.querySelector('.opt.sel');
      if(sel){sel.classList.remove('sel');sel.classList.add(marks[i]?'good':'bad')}
    }else{
      el.querySelectorAll('.tfr').forEach((row,k)=>{
        const v=state.val[i][k];
        row.classList.add(v===q.items[k].ok?'good':'bad');
      });
    }
  });
  $('#sur').readOnly=$('#nam').readOnly=true;
  $('#actions').hidden=true;
  const r=$('#result');
  r.innerHTML=`<div class="who">${esc(sur)} ${esc(nam)}</div>
    <div class="big">${score} з ${N}</div>
    <div style="font-weight:800;color:var(--muted)">${plural(score,'бал','бали','балів')}</div>
    <div class="chips">${marks.map((m,i)=>`<span class="chip ${m?'y':'n'}">${i+1}</span>`).join('')}</div>
    <button class="btn ghost" id="againBtn">Пройти ще раз</button>`;
  r.hidden=false;
  r.scrollIntoView({behavior:'smooth',block:'center'});
  $('#againBtn').addEventListener('click',()=>{
    $('#sur').readOnly=$('#nam').readOnly=false;
    build(false);window.scrollTo({top:0,behavior:'smooth'});
  });
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,
    ts:now,date:new Date(now).toISOString(),
    score,max:N,tasks:marks,
    qtext:QUESTIONS.map(qText),
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    correct:QUESTIONS.map(correctText),
    durationSec:Math.round((now-W.t0)/1000),
    leaves:W.leaves,
    awaySec:W.awaySec,
    variant:seed,
    test:TEST_NAME
  });
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="row"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Закрити</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=()=>{if(pw.value===TEACHER_PASSWORD)showJournal();else{$('#pmsg').textContent='Неправильний пароль';pw.select()}};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){overlay.classList.remove('on');modal.innerHTML=''}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Сполучна та розподільна властивості множення</h2>
    <div class="row"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="row" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=await loadResults()}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const cols=Math.max(...rows.map(r=>r.max||(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту">Виходів</th><th>Бал</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>{
    const quick=r.durationSec!==undefined&&r.durationSec<120;
    const many=r.leaves!==undefined&&r.leaves>=3;
    const away=r.awaySec!==undefined?`Поза вікном: ${fmtDur(r.awaySec)}`:'';
    const main=`<tr><td>${k+1}</td><td class="nm" data-k="${k}" title="Показати відповіді">${esc(r.name||'')}</td><td>${fmtDate(r.ts)}</td><td${quick?' class="red" title="Дуже швидко"':''}>${fmtDur(r.durationSec)}</td><td${many?' class="red"':''}${away?` title="${away}"`:''}>${r.leaves===undefined?'—':r.leaves}</td><td><b>${r.score}/${r.max||N}</b></td>${
      idx.map(i=>{const m=(r.tasks||[])[i];return m===undefined?'<td>—</td>':(m?'<td class="y">✓</td>':'<td class="n">✗</td>')}).join('')}</tr>`;
    let det='';
    if(r.qtext){
      det=`<table><tr><th>№</th><th>Завдання</th><th>Відповідь учня</th><th>Правильна відповідь</th></tr>${
        r.qtext.map((t,i)=>`<tr><td>${i+1}</td><td class="w">${esc(t)}</td><td class="w">${esc((r.answers||[])[i]||'—')}</td><td class="w">${esc((r.correct||[])[i]||'')}</td></tr>`).join('')}</table>`;
      if(r.variant!==undefined)det+=`<div style="margin-top:6px;color:var(--muted)">Варіант № ${r.variant}${away?'. '+away:''}</div>`;
    }else det='<span style="color:var(--muted)">Для цього запису деталей немає.</span>';
    return main+`<tr class="det" id="det${k}" hidden><td colspan="${6+cols}">${det}</td></tr>`;
  }).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
  $('#jbody').querySelectorAll('td.nm').forEach(td=>td.addEventListener('click',()=>{const d=$('#det'+td.dataset.k);if(d)d.hidden=!d.hidden}));
}
function downloadCSV(){
  if(!rows.length)return;
  const cols=Math.max(...rows.map(r=>r.max||(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const hdr=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал',...idx.map(i=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,fmtDate(r.ts),r.durationSec===undefined?'':fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,r.awaySec===undefined?'':fmtDur(r.awaySec),`${r.score}/${r.max||N}`,...idx.map(i=>{const m=(r.tasks||[])[i];return m===undefined?'':(m?'+':'-')})]));
  const csv='\ufeff'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Сполучна_розподільна_властивості_5клас_результати.csv';a.click();
}

build(true);
})();
</script>
