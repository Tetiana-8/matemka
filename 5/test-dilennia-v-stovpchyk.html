  background-attachment:fixed}
#app{height:100dvh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(120,20,70,.16);padding:22px 24px;border:2px solid rgba(255,255,255,.9)}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem);font-weight:900;line-height:1.25;color:var(--acc);text-wrap:balance}

/* початок */
#sStart{justify-content:center;overflow:auto}
.start{text-align:center;padding:28px 24px}
.student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.student label{display:block;font-weight:800;font-size:.95rem;color:var(--muted);text-align:left;margin-bottom:4px}
.student input{width:100%;font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--soft);color:var(--ink)}
.student input:focus{border-color:var(--acc);background:#fff}
.student input.need{border-color:var(--bad);background:var(--badbg)}
.msg{color:var(--bad);font-weight:800;min-height:1.3em;margin:6px 0 10px}

/* ряд номерів */
#top{flex:none}
.cnt{font-weight:900;color:var(--acc);font-size:1.05rem;text-align:center;margin-bottom:6px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:900;font-size:.95rem;cursor:pointer;padding:0;touch-action:manipulation}
.chip.f{background:var(--acc2);border-color:var(--acc2);color:#fff}
.chip.cur{border-color:var(--acc);border-width:4px;line-height:1}
.chip.y{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.h{background:var(--half);border-color:var(--half);color:#fff}
.chip.n{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.cur.y{box-shadow:0 0 0 3px var(--okln)}.chip.cur.n{box-shadow:0 0 0 3px var(--badln)}.chip.cur.h{box-shadow:0 0 0 3px var(--halfln)}
.chip.big{width:46px;height:46px;font-size:1.1rem}

/* завдання */
#qbox{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:3px 4px 18px}
.q{position:relative}
.q.ok{box-shadow:0 0 0 3px var(--ok),0 10px 30px rgba(120,20,70,.14)}
.q.half{box-shadow:0 0 0 3px var(--half),0 10px 30px rgba(120,20,70,.14)}
.q.bad{box-shadow:0 0 0 3px var(--bad),0 10px 30px rgba(120,20,70,.14)}
.qh{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.15rem;background:linear-gradient(135deg,#be185d,#e5508a)}
.qt{flex:1;min-width:0;font-size:1.2rem;font-weight:700;line-height:1.5;padding-top:5px}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:none;place-items:center;font-size:1.3rem;font-weight:900;color:#fff}
.q.ok .mark{display:grid;background:var(--ok)}
.q.half .mark{display:grid;background:var(--half)}
.q.bad .mark{display:grid;background:var(--bad)}

/* клітинки для цифр і куточок */
.cell{flex:none;width:calc(var(--cw) - .2rem);height:var(--ch);padding:0;text-align:center;font:inherit;font-size:calc(var(--cw)*.6);font-weight:900;
  color:var(--ink);background:var(--soft2);border:2px solid #eab5cd;border-radius:.5rem;outline:none;caret-color:transparent;touch-action:manipulation}
.cell:focus,.cell.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.cell.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}
.colwrap{display:flex;justify-content:center;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.dvm{--g:.3rem;--ch:calc(var(--cw)*1.12);display:inline-flex;align-items:flex-start;gap:.3rem;padding:.8rem .9rem;background:var(--soft2);border:2px dashed #eab5cd;border-radius:1rem}
.dvl{display:flex;flex-direction:column;gap:var(--g)}
.crow{display:flex}
.slot{flex:none;width:var(--cw);height:var(--ch);display:flex;align-items:center;justify-content:center}
.dvl .crow .slot:first-child{width:calc(var(--cw)*.7)}
.slot.dig{font-size:calc(var(--cw)*.7);font-weight:900}
.slot.sg{font-size:calc(var(--cw)*.66);font-weight:900;color:var(--acc)}
.crow.rl .slot{height:3px}
.slot.ln{background:var(--ink)}
.dvr{display:flex;flex-direction:column;gap:var(--g);border-left:3px solid var(--ink);padding-left:.4rem}
.dvt{position:relative;display:flex}
.dvt::after{content:"";position:absolute;left:-.4rem;right:0;bottom:calc(var(--g)/-2 - 1.5px);height:3px;background:var(--ink);border-radius:2px}
.dvq{display:flex}
.hint{margin-top:12px;font-size:.95rem;line-height:1.4;color:var(--muted);font-weight:700;text-align:center}
.corr{margin-top:14px;padding:9px 14px;border-radius:12px;background:var(--okbg);color:var(--oktx);font-weight:800;font-size:1.05rem}
.corr.no{background:var(--badbg);color:var(--badtx)}
.corr.hf{background:var(--halfbg);color:var(--halftx)}

/* нижня панель */
#nav{flex:none;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:4px 0 2px}
.btn{font:inherit;font-weight:900;font-size:1.1rem;border:0;border-radius:14px;padding:12px 26px;min-height:46px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#be185d,#e5508a);box-shadow:0 6px 16px rgba(190,24,93,.28);touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.btn.big{padding:14px 40px;font-size:1.25rem}

/* перед здачею й результат */
#sReview,#sResult{overflow:auto;justify-content:center}
.center{text-align:center}
.warn{color:var(--bad);font-weight:800;margin:10px 0 0;min-height:1.3em}
.who{font-weight:800;color:var(--muted);font-size:1.1rem}
.big{font-size:clamp(2.2rem,7.5vw,3.2rem);font-weight:900;margin:4px 0;color:var(--acc);line-height:1.1}
.cardchips{margin:16px 0 18px}
.shot{margin:14px auto 18px;max-width:30rem;padding:10px 14px;border:2px dashed var(--acc2);border-radius:14px;background:var(--soft2);font-weight:800;color:var(--acc)}
.alertx{margin:12px auto 0;max-width:34rem;padding:10px 14px;border:2px solid #f2d48a;border-radius:14px;background:#fff8e1;color:#7a5a00;font-weight:700;line-height:1.45;text-align:left}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* екранна клавіатура (сенсорні екрани) */
#kp{flex:none;background:#f6e4ee;border-top:2px solid var(--line);margin:0 calc(-1*max(14px,env(safe-area-inset-right,0px))) 0 calc(-1*max(14px,env(safe-area-inset-left,0px)));
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(120,20,70,.15)}
#kp .g{display:grid;gap:6px;max-width:34rem;margin:0 auto;grid-template-columns:repeat(6,1fr)}
#kp button{font:inherit;font-weight:900;font-size:1.3rem;height:2.8rem;border:0;border-radius:.7rem;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(120,20,70,.2);touch-action:manipulation}
#kp button:active{background:var(--accL)}
#kp button.fn{background:#fbd9e8;color:var(--acc)}
#kp button:disabled{opacity:.35}

footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* ключ учителя */
#keyBtn{position:fixed;top:calc(3px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));z-index:20;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:.9rem;cursor:pointer;opacity:.7;padding:0}
#keyBtn:hover{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(58,23,54,.45);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:1200px;box-shadow:0 20px 50px rgba(58,23,54,.3)}
.modal h2{margin:0 0 12px;font-weight:900;font-size:1.3rem}
.modal .mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modal input{font:inherit;font-size:1.05rem;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.sbtn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
.sbtn.g{background:#fce7f3;color:var(--acc)}
.sbtn.r{background:var(--bad)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;font-weight:900}
td.nm{text-align:left;font-weight:700;cursor:pointer;text-decoration:underline dotted}
td.y{color:var(--ok);font-weight:900}td.n{color:var(--bad);font-weight:900}td.h{color:var(--half);font-weight:900}
td.red{color:var(--bad);font-weight:900}
tr.det td{white-space:normal;text-align:left;background:var(--soft2)}
tr.det table{font-size:.9rem}
tr.det td.w{white-space:normal}
.pmsg{color:var(--bad);font-weight:800}

fb().catch(()=>{});

/*LOGIC_START*/
/* ===================== Випадкові числа (свій варіант кожному учневі) ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
function setSeed(s){rng=mulberry32(s)}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}

/* ===================== Ділення в стовпчик ===================== */
/* Хід ділення без остачі: кроки, що знаходять цифри частки, добутки й остачі.
   null — якщо проміжна остача 0 (щоб не було нулів на початку рядка) або ділення не без остачі. */
function divPlan(a,b){
  const D=String(a),L=D.length;
  let pos=1,cur=+D[0];
  while(cur<b&&pos<L){cur=cur*10+(+D[pos]);pos++}
  if(cur<b)return null;
  const steps=[];let qs='';
  for(;;){
    const qd=Math.floor(cur/b),prod=qd*b,rem=cur-prod;
    const st={end:pos-1,qd:qd,prod:prod,rem:rem,after:[]};
    steps.push(st);qs+=qd;
    if(pos>=L){if(rem!==0)return null;break}
    if(rem===0)return null;
    let c=rem*10+(+D[pos]);st.after.push({t:'b',col:pos});pos++;
    while(c<b){
      if(pos>=L)return null;
      st.after.push({t:'z'});qs+='0';
      c=c*10+(+D[pos]);st.after.push({t:'b',col:pos});pos++;
    }
    cur=c;
  }
  return {steps:steps,qs:qs};
}
/* Завдання: усі цифри (частка, добутки, остачі, знесені цифри) учень вписує сам.
   Порядок клітинок = порядок роботи: цифра частки, добуток (справа наліво), остача (справа наліво), знесена цифра. */
function divQuestion(a,b,w){
  const plan=divPlan(a,b);
  const D=String(a),L=D.length,Q=String(a/b);
  const q={kind:'cells',w:w,exp:[],steps:[],qIdx:[],a:a,b:b,
    t:'Виконайте ділення в стовпчик: <b>'+a+' : '+b+'</b>. Впишіть цифри в клітинки.',
    qplain:'Ділення в стовпчик: '+a+' : '+b};
  const COLS=L+1; /* колонка 0 — для знака «−» */
  const mk=()=>Array.from({length:COLS},()=>({e:1}));
  const addC=ch=>{q.exp.push(ch);return q.exp.length-1};
  const lines=[];
  const r0=mk();[...D].forEach((d,i)=>{r0[i+1]={d:d}});lines.push({k:'slots',items:r0});
  plan.steps.forEach(st=>{
    q.qIdx.push(addC(String(st.qd)));
    const endc=st.end+1;
    const ps=String(st.prod),pr=mk(),pIdx=new Array(ps.length);
    for(let j=ps.length-1;j>=0;j--)pIdx[j]=addC(ps[j]);
    for(let j=0;j<ps.length;j++)pr[endc-(ps.length-1-j)]={c:pIdx[j]};
    pr[endc-ps.length]={sg:'−'};
    lines.push({k:'slots',items:pr});
    const ru=mk();for(let c=endc-ps.length;c<=endc;c++)ru[c]={ln:1};
    lines.push({k:'rule',items:ru});
    const rs=String(st.rem),rr=mk(),rIdx=new Array(rs.length),bIdx=[];
    for(let j=rs.length-1;j>=0;j--)rIdx[j]=addC(rs[j]);
    for(let j=0;j<rs.length;j++)rr[endc-(rs.length-1-j)]={c:rIdx[j]};
    st.after.forEach(it=>{
      if(it.t==='b'){const k=addC(D[it.col]);bIdx.push(k);rr[it.col+1]={c:k}}
      else q.qIdx.push(addC('0'));
    });
    lines.push({k:'slots',items:rr});
    q.steps.push({p:pIdx,r:rIdx,b:bIdx});
  });
  const R=Math.max(String(b).length,Q.length);
  q.board={lines:lines,divisor:String(b),R:R,tot:(L+0.7)+R+0.3};
  return q;
}
/* число з k цифр у частці; zero — один нуль усередині частки */
function genDiv(qlen,zero,minA,maxA){
  for(let t=0;t<20000;t++){
    const b=rnd(12,98);if(b%10===0)continue;
    const ds=[];for(let i=0;i<qlen;i++)ds.push(rnd(1,9));
    if(zero)ds[rnd(1,qlen-2)]=0;
    const Qn=+ds.join(''),a=b*Qn;
    if(a<minA||a>maxA)continue;
    const plan=divPlan(a,b);
    if(!plan||plan.qs!==String(Qn))continue;
    return {a:a,b:b};
  }
  return null;
}
function genQuestions(){
  /* [цифр у частці, нуль усередині частки, найменше ділене, найбільше ділене, бали] */
  const SPEC=[
    [2,false,1000,9999,10],
    [2,false,1000,9999,10],
    [3,false,10000,99999,12],
    [3,false,1000,99999,12],
    [3,false,10000,99999,12],
    [3,true,1000,99999,14],
    [3,true,10000,99999,14],
    [4,false,10000,99999,16]
  ];
  return SPEC.map(s=>{const p=genDiv(s[0],s[1],s[2],s[3]);return divQuestion(p.a,p.b,s[4])});
}

/* ===================== Перевірка відповіді ===================== */
function isFilled(q,v){return v.every(x=>x!=='')}
/* 1 — усе правильно; 0,5 — частка правильна, але в записах розв'язання є помилки; 0 — частка неправильна */
function markOf(q,v){
  if(v.every((x,k)=>x===q.exp[k]))return 1;
  if(q.qIdx.every(k=>v[k]===q.exp[k]))return .5;
  return 0;
}
function solText(q,arr){
  const g=idx=>idx.map(k=>arr[k]===''?'·':arr[k]).join('');
  return 'частка: '+g(q.qIdx)+'; '+q.steps.map(s=>'−'+g(s.p)+' → '+g(s.r)+g(s.b)).join('; ');
}
function qText(q){return q.qplain}
function answerText(q,v){return solText(q,v)}
function correctText(q){return solText(q,q.exp)}
/*LOGIC_END*/

/* ===================== Побудова тесту ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const touch=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
const fmtScore=x=>String(x).replace('.',',');
let QUESTIONS=[],N=0,state=null,seed=0,cur=0,warnedEmpty=false,student={sur:'',nam:''},act=null,loggedIn=false,attempt='',saveN=0,dirty=false;

/* час і виходи з вікна */
let W={t0:Date.now(),on:false,leaves:0,awaySec:0,awayAt:0};
function resetWatch(){W={t0:Date.now(),on:true,leaves:0,awaySec:0,awayAt:0}}
function leave(){if(!W.on||!state||state.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden){leave();saveProgress(true)}else back()});
window.addEventListener('pagehide',()=>saveProgress(true));
window.addEventListener('blur',leave);
window.addEventListener('focus',back);

function newSeed(first){
  let v=null;
  if(first){try{v=new URLSearchParams(location.search).get('v')}catch(e){}}
  seed=(v&&/^\d+$/.test(v))?(Number(v)>>>0):Math.floor(Math.random()*4294967296);
  setSeed(seed);
}
function build(first){
  newSeed(first);
  QUESTIONS=genQuestions();N=QUESTIONS.length;
  state={val:QUESTIONS.map(q=>q.exp.map(()=>'')),checked:false,marks:null};
  cur=0;warnedEmpty=false;act=null;
}
const cls=m=>m===1?'y':(m===0.5?'h':'n');

/* екрани */
const screens=['sStart','sPlay','sReview','sResult'];
function showScreen(id){
  screens.forEach(s=>{$('#'+s).hidden=(s!==id)});
  if(id!=='sPlay')hideKp();
}
function chipsHtml(opts){
  opts=opts||{};
  return QUESTIONS.map((q,i)=>{
    let c='chip'+(opts.big?' big':'');
    if(state.checked)c+=' '+cls(state.marks[i]);
    else if(isFilled(q,state.val[i]))c+=' f';
    if(opts.cur&&i===cur)c+=' cur';
    return `<button type="button" class="${c}" data-go="${i}" aria-label="Завдання ${i+1}">${i+1}</button>`;
  }).join('');
}
function cellHtml(qi,k,v,done,q){
  let c='cell';
  if(done)c+=(v!==''&&v===q.exp[k])?' good':' bad';
  return `<input class="${c}" data-q="${qi}" data-k="${k}" maxlength="1" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="цифра" value="${esc(v)}"${done?' readonly':''}>`;
}
function boardHtml(q,qi,v,done){
  const bd=q.board;
  let h=`<div class="colwrap"><div class="dvm" style="--cw:min(2.7rem,calc((100vw - 6.4rem)/${bd.tot.toFixed(2)}))"><div class="dvl">`;
  bd.lines.forEach(l=>{
    h+=`<div class="crow${l.k==='rule'?' rl':''}">`+l.items.map(it=>{
      if(it.e)return `<span class="slot"></span>`;
      if(it.d!==undefined)return `<span class="slot dig">${it.d}</span>`;
      if(it.sg)return `<span class="slot sg">${it.sg}</span>`;
      if(it.ln)return `<span class="slot ln"></span>`;
      return `<span class="slot">${cellHtml(qi,it.c,v[it.c],done,q)}</span>`;
    }).join('')+`</div>`;
  });
  h+=`</div><div class="dvr" style="min-width:calc(var(--cw)*${bd.R} + .5rem)"><div class="dvt">`+
    [...bd.divisor].map(d=>`<span class="slot dig">${d}</span>`).join('')+
    `</div><div class="dvq">`+
    q.qIdx.map(k=>`<span class="slot">${cellHtml(qi,k,v[k],done,q)}</span>`).join('')+
    `</div></div></div></div>`;
  return h;
}
function qHtml(q,qi){
  const done=state.checked,v=state.val[qi];
  const m=done?state.marks[qi]:null;
  let h=`<div class="qh"><span class="num">${qi+1}</span><div class="qt">${q.t}</div><span class="mark">${done?(m===1?'✓':(m===0.5?'½':'✗')):''}</span></div>`;
  h+=boardHtml(q,qi,v,done);
  if(done){
    if(m===1)h+=`<div class="corr">Правильно</div>`;
    else if(m===0.5)h+=`<div class="corr hf">Частка правильна, але в записах розв’язання є помилки. Правильно: ${esc(correctText(q))}</div>`;
    else h+=`<div class="corr no">${isFilled(q,v)?`Ваша відповідь: ${esc(answerText(q,v))}. `:'Не всі клітинки заповнено. '}Правильно: ${esc(correctText(q))}</div>`;
  }else{
    h+=`<div class="hint">Цифри вписуйте по порядку: цифра частки, потім добуток, остача й знесена цифра. Підсвічена клітинка показує, куди писати.</div>`;
  }
  return h;
}
function qClass(i){
  if(!state.checked)return '';
  return ' locked '+(state.marks[i]===1?'ok':(state.marks[i]===0.5?'half':'bad'));
}
function showTask(i){
  if(state&&!state.checked)saveProgress();
  cur=Math.max(0,Math.min(N-1,i));
  showScreen('sPlay');
  const q=QUESTIONS[cur];
  $('#top').innerHTML=`<div class="cnt">Завдання ${cur+1} з ${N}</div><div class="chips">${chipsHtml({cur:true})}</div>`;
  const box=$('#qbox');
  box.innerHTML=`<section class="card q${qClass(cur)}">${qHtml(q,cur)}</section>`;
  box.scrollTop=0;
  $('#nav').innerHTML=state.checked
    ?`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn ghost" id="bRes">← До результату</button><button class="btn" id="bNext"${cur===N-1?' disabled':''}>Далі →</button>`
    :`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn" id="bNext">Далі →</button>`;
  $('#bPrev').onclick=()=>showTask(cur-1);
  $('#bNext').onclick=()=>{if(cur<N-1)showTask(cur+1);else showReview()};
  if(state.checked)$('#bRes').onclick=showResult;
  act=null;
  if(!state.checked){if(touch)showKp();else hideKp();focusFirst()}else hideKp();
}
function showReview(){
  saveProgress();
  showScreen('sReview');
  const filled=QUESTIONS.filter((q,i)=>isFilled(q,state.val[i])).length;
  $('#rvTitle').textContent=`Відповіли на ${filled} з ${N}`;
  $('#rvChips').innerHTML=chipsHtml({big:true});
  $('#warn').textContent='';warnedEmpty=false;$('#checkBtn').textContent='Перевірити';
}

/* введення: стан оновлюється завжди напряму, а не через події */
const qbox=$('#qbox');
function isCell(el){return el&&el.classList&&el.classList.contains('cell')}
function cellAt(qi,k){return qbox.querySelector(`.cell[data-q="${qi}"][data-k="${k}"]`)}
function setAct(el){
  act=el;
  qbox.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));
  if(el){
    el.classList.add('act');
    try{el.focus({preventScroll:true})}catch(x){el.focus()}
    try{el.scrollIntoView({block:'nearest',inline:'nearest'})}catch(x){}
  }
}
function focusFirst(){
  let k=state.val[cur].findIndex(x=>x==='');
  if(k<0)k=0;
  const t=cellAt(cur,k);
  if(t)setAct(t);
}
function setVal(el,v){
  const qi=+el.dataset.q;
  state.val[qi][+el.dataset.k]=v;
  el.value=v;warnedEmpty=false;dirty=true;
  const f=$('#top .chips');if(f)f.innerHTML=chipsHtml({cur:true});
}
qbox.addEventListener('input',e=>{
  const el=e.target;if(!state||state.checked||el.dataset.q===undefined||!isCell(el))return;
  const d=el.value.replace(/\D/g,'').slice(-1);
  setVal(el,d);
  if(d){const nx=cellAt(+el.dataset.q,+el.dataset.k+1);if(nx)setAct(nx)}
});
qbox.addEventListener('focusin',e=>{
  const el=e.target;
  if(!state||state.checked||!isCell(el))return;
  act=el;qbox.querySelectorAll('.act').forEach(x=>{if(x!==el)x.classList.remove('act')});el.classList.add('act');
  if(touch&&kp.hidden)showKp();
  try{el.select()}catch(x){}
});
qbox.addEventListener('keydown',e=>{
  const el=e.target;
  if(!state||state.checked||!isCell(el))return;
  const qi=+el.dataset.q,k=+el.dataset.k;
  if(e.key==='Backspace'&&!el.value){e.preventDefault();const p=cellAt(qi,k-1);if(p){setVal(p,'');setAct(p)}}
  else if(e.key==='Enter'){e.preventDefault();const nx=cellAt(qi,k+1);if(nx)setAct(nx);else $('#bNext').click()}
});
/* номери завдань */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip[data-go]');
  if(c)showTask(+c.dataset.go);
});

/* екранна клавіатура (сенсорні екрани): працює з останнім обраним полем */
const kp=$('#kp');
function hideKp(){kp.hidden=true;kp.innerHTML=''}
function showKp(){
  let h='<div class="g">';
  h+=['1','2','3','4','5'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>';
  h+=['6','7','8','9','0'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="next" aria-label="Наступна клітинка">→</button>';
  kp.innerHTML=h+'</div>';kp.hidden=false;
}
if(touch){
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked||!act||b.disabled)return;
    const k=b.dataset.k,el=act,qi=+el.dataset.q;
    if(k==='bs'){
      if(el.value)setVal(el,'');
      else{const p=cellAt(qi,+el.dataset.k-1);if(p){setVal(p,'');setAct(p)}}
    }else if(k==='next'){
      const nx=cellAt(qi,+el.dataset.k+1);if(nx)setAct(nx);
    }else{
      setVal(el,b.dataset.ch);
      const nx=cellAt(qi,+el.dataset.k+1);if(nx)setAct(nx);
    }
  });
}

/* ===================== Початок і перевірка ===================== */
['#sur','#nam'].forEach(s=>$(s).addEventListener('input',e=>{e.target.classList.remove('need');$('#studentMsg').textContent=''}));
function needName(){
  const sur=$('#sur').value.trim(),nam=$('#nam').value.trim();
  if(!sur||!nam){
    if(!sur)$('#sur').classList.add('need');
    if(!nam)$('#nam').classList.add('need');
    $('#studentMsg').textContent='Введіть прізвище та ім’я, щоб почати.';
    return null;
  }
  return {sur,nam};
}
$('#startBtn').addEventListener('click',()=>{
  const s=needName();if(!s)return;
  student=s;resetWatch();newAttempt();showTask(0);saveProgress(true);
});
$('#rvBack').addEventListener('click',()=>showTask(N-1));
$('#checkBtn').addEventListener('click',()=>{
  const empty=QUESTIONS.filter((q,i)=>!isFilled(q,state.val[i])).length;
  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(student.sur,student.nam);
});

function totals(){
  const marks=state.marks;
  const score=QUESTIONS.reduce((s,q,i)=>s+q.w*marks[i],0);
  return {score:Math.round(score*2)/2};
}
function showResult(){
  showScreen('sResult');
  const t=totals(),marks=state.marks;
  const wrong=marks.findIndex(m=>m!==1);
  $('#result').innerHTML=`<div class="who">${esc(student.sur)} ${esc(student.nam)}</div>
    <div class="big">${fmtScore(t.score)} з 100 балів</div>
    <div class="big">${Math.round(t.score)} %</div>
    ${W.leaves>=3?`<div class="alertx">💡 <b>Ви забагато виходили з вікна тесту</b> (разів: ${W.leaves}), тому є підозра, що завдання виконано недоброчесно.<br>Недоброчесне виконання не дає знань, а лише створює ілюзію гарної оцінки.</div>`:''}
    <div class="shot">📸 Зробіть скріншот результату та надішліть його вчителю</div>
    <div class="rbtns"><button class="btn ghost" id="errBtn">${wrong>=0?'Дивитись помилки':'Переглянути завдання'}</button><button class="btn" id="againBtn">Пройти ще раз</button></div>`;
  $('#errBtn').addEventListener('click',()=>showTask(wrong<0?0:wrong));
  $('#againBtn').addEventListener('click',()=>{build(false);resetWatch();newAttempt();showTask(0)});
}

/* ===================== Запис результату ===================== */
/* Кожен знімок стану — окремий новий запис (id = спроба + номер), старі не переписуються.
   Журнал показує останній знімок кожної спроби. Так результат зараховується від моменту введення імені. */
function newAttempt(){attempt=Date.now()+'_'+Math.random().toString(36).slice(2,8);saveN=0;dirty=false}
function snapshot(finished){
  const now=Date.now();
  const marks=QUESTIONS.map((q,i)=>{const v=state.val[i];return(!finished&&v.every(x=>x===''))?null:markOf(q,v)});
  const score=Math.round(QUESTIONS.reduce((s,q,i)=>s+q.w*(marks[i]||0),0)*2)/2;
  const away=W.awaySec+(W.awayAt?Math.round((now-W.awayAt)/1000):0);
  const n=saveN++;
  return {
    id:attempt+'_'+String(n).padStart(3,'0'),attempt:attempt,n:n,finished:finished,
    answered:QUESTIONS.filter((q,i)=>isFilled(q,state.val[i])).length,
    name:`${student.sur} ${student.nam}`,surname:student.sur,firstName:student.nam,
    ts:now,date:new Date(now).toISOString(),startTs:W.t0,
    score:score,max:100,percent:Math.round(score),tasks:marks,weights:QUESTIONS.map(q=>q.w),
    rightCount:marks.filter(m=>m===1).length,
    qtext:QUESTIONS.map(qText),
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    correct:QUESTIONS.map(correctText),
    durationSec:Math.max(0,Math.round((now-W.t0)/1000)),
    leaves:W.leaves,
    awaySec:away,
    variant:seed,
    test:TEST_NAME
  };
}
function saveProgress(force){
  if(!state||state.checked||!student.sur||!attempt)return;
  if(!dirty&&!force)return;
  dirty=false;
  saveResult(snapshot(false));
}
setInterval(()=>saveProgress(),15000);
function finish(sur,nam){
  back();
  const rec=snapshot(true);
  state.marks=rec.tasks;
  state.checked=true;
  W.on=false;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  showResult();
  saveResult(rec);
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="mrow"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Скасувати</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=async()=>{
    $('#pmsg').textContent='';
    const ok=await teacherLogin(pw.value);
    if(ok){loggedIn=true;showJournal()}else{$('#pmsg').textContent='Неправильний пароль';pw.select()}
  };
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){
  overlay.classList.remove('on');modal.innerHTML='';
  if(loggedIn){loggedIn=false;teacherLogout()}
}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const pctOf=r=>r.percent!==undefined?r.percent:Math.round(r.score/(r.max||100)*100);
const mkCell=m=>(m===undefined||m===null)?'<td>—</td>':(m===1?'<td class="y">✓</td>':(m===0.5?'<td class="h">½</td>':'<td class="n">✗</td>'));
const mkCsv=m=>(m===undefined||m===null)?'':(m===1?'+':(m===0.5?'0,5':'-'));

function groupRows(all){
  const by={};
  all.forEach(r=>{const k=r.attempt||r.id,o=by[k];
    if(!o||(r.n||0)>(o.n||0)||((r.n||0)===(o.n||0)&&(r.ts||0)>(o.ts||0)))by[k]=r});
  return Object.values(by).sort((a,b)=>(b.startTs||b.ts||0)-(a.startTs||a.ts||0));
}
async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Ділення в стовпчик (5 клас)</h2>
    <div class="mrow"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="mrow" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=groupRows(await loadResults())}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||0),0)||N;
  const idx=Array.from({length:cols},(_,i)=>i);
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту (у дужках час поза вікном)">Виходів</th><th>Бал</th><th>%</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>{
    const unf=r.finished===false;
    const quick=!unf&&r.durationSec!==undefined&&r.durationSec<120;
    const many=r.leaves!==undefined&&r.leaves>=3;
    const lv=r.leaves===undefined?'—':`${r.leaves} (${fmtDur(r.awaySec)})`;
    const main=`<tr><td>${k+1}</td><td class="nm" data-k="${k}" title="Показати відповіді">${esc(r.name||'')}</td><td>${fmtDate(r.startTs||r.ts)}</td><td${quick?' class="red" title="Дуже швидко"':''}>${fmtDur(r.durationSec)}</td><td${many?' class="red"':''}>${lv}</td><td><b>${fmtScore(r.score)}/${r.max||100}</b>${unf?`<div class="unf">не завершено: ${r.answered} з ${(r.tasks||[]).length}</div>`:''}</td><td>${pctOf(r)} %</td>${
      idx.map(i=>mkCell((r.tasks||[])[i])).join('')}</tr>`;
    let det='';
    if(r.qtext){
      det=`<div style="margin-bottom:6px;font-weight:800">${unf?'Тест не завершено (показано стан на останнє збереження). ':''}Оцінка: ${fmtScore(r.score)} з ${r.max||100} (${pctOf(r)} %). Виходів з вікна: ${r.leaves===undefined?'—':r.leaves}, поза вікном: ${r.awaySec===undefined?'—':r.awaySec+' с'}.</div><table><tr><th>№</th><th>Завдання</th><th>Бали</th><th>Відповідь учня</th><th>Правильна відповідь</th></tr>${
        r.qtext.map((t,i)=>{
          const w=(r.weights||[])[i],m=(r.tasks||[])[i];
          const got=(w===undefined||m===undefined)?'—':fmtScore(w*m)+' з '+w;
          return `<tr><td>${i+1}</td><td class="w">${esc(t)}</td><td>${got}</td><td class="w">${esc((r.answers||[])[i]||'—')}</td><td class="w">${esc((r.correct||[])[i]||'')}</td></tr>`}).join('')}</table>`;
      if(r.variant!==undefined)det+=`<div style="margin-top:6px;color:var(--muted)">Варіант № ${r.variant}. Щоб відкрити цей варіант, додайте до адреси тесту ?v=${r.variant}</div>`;
    }else det='<span style="color:var(--muted)">Для цього запису деталей немає.</span>';
    return main+`<tr class="det" id="det${k}" hidden><td colspan="${7+cols}">${det}</td></tr>`;
  }).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
  $('#jbody').querySelectorAll('td.nm').forEach(td=>td.addEventListener('click',()=>{const d=$('#det'+td.dataset.k);if(d)d.hidden=!d.hidden}));
}
function downloadCSV(){
  if(!rows.length)return;
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||0),0)||N;
  const idx=Array.from({length:cols},(_,i)=>i);
  const hdr=['Прізвище та ім\'я','Статус','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (зі 100)','Відсоток',...idx.map(i=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,r.finished===false?'не завершено':'завершено',fmtDate(r.startTs||r.ts),r.durationSec===undefined?'':fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,r.awaySec===undefined?'':fmtDur(r.awaySec),fmtScore(r.score),pctOf(r),...idx.map(i=>mkCsv((r.tasks||[])[i]))]));
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Ділення_в_стовпчик_5клас_результати.csv';a.click();
}

build(true);
showScreen('sStart');
if(!touch)$('#sur').focus();
})();
</script>
