<style>

  color-scheme:light;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);

#app{height:100dvh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;

.qt{flex:1;min-width:0;font-size:1.2rem;font-weight:700;line-height:1.5;padding-top:5px}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:none;place-items:center;font-size:1.4rem;font-weight:900;color:#fff}

i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}

  <section class="scr" id="sStart">

<script>
(function(){
"use strict";

let fbPromise = null;
function fb(){

async function saveResult(rec){

}
async function loadResults(){

  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));

fb().catch(() => {});   // підключення одразу при відкритті сторінки

/*LOGIC_START*/
/* ===================== Випадкові числа (свій варіант кожному учневі) ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
function setSeed(s){rng=mulberry32(s)}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
const pick=a=>a[Math.floor(rng()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['a','b','c','d','k','m','n','p','x','y'];
function letters(n){const pool=LET.slice(),o=[];for(let i=0;i<n;i++)o.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);return o}
const disp=s=>s.replace(/[A-Za-z]+/g,m=>'<i>'+m+'</i>');
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function plain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/ /g,' ')}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
const co=c=>c===1?'':String(c);
function allDiff(a){for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i]===a[j])return false;return true}

/* ===================== Многочлени: розбір і порівняння виразів ===================== */
function clean(p){const r={};for(const k in p)if(p[k]!==0)r[k]=p[k];return r}
function pAdd(p,q,s){const r=Object.assign({},p);for(const k in q)r[k]=(r[k]||0)+s*q[k];return clean(r)}
function pMul(p,q){const r={};for(const a in p)for(const b in q){const k=(a+b).split('').sort().join('');r[k]=(r[k]||0)+p[a]*q[b]}return clean(r)}
function pEq(p,q){p=clean(p);q=clean(q);const a=Object.keys(p),b=Object.keys(q);return a.length===b.length&&a.every(k=>p[k]===q[k])}
const LOOK={'а':'a','с':'c','е':'e','о':'o','р':'p','х':'x','к':'k','м':'m','т':'t','у':'y','і':'i','в':'b'};
function normalize(s){
  return String(s).toLowerCase().replace(/[Ѐ-ӿ]/g,ch=>LOOK[ch]||ch)
    .replace(/[−–—‒]/g,'-').replace(/[×·⋅∙•*]/g,'*').replace(/[\[{]/g,'(').replace(/[\]}]/g,')').replace(/\s+/g,'');
}
function tokenize(s){const t=s.match(/\d+|[a-z]|[-+*()]/g)||[];return (t.length&&t.join('')===s)?t:null}
function parseExpr(t){
  if(!t)return null;
  let pos=0;
  function factor(){
    const x=t[pos];if(x===undefined)throw 0;
    if(/^\d+$/.test(x)){pos++;return {'':+x}}
    if(/^[a-z]$/.test(x)){pos++;return {[x]:1}}
    if(x==='('){pos++;const p=expr();if(t[pos]!==')')throw 0;pos++;return p}
    if(x==='-'){pos++;return pMul(factor(),{'':-1})}
    throw 0;
  }
  function term(){
    let p=factor();
    while(pos<t.length){
      const x=t[pos];
      if(x==='*'){pos++;p=pMul(p,factor())}
      else if(/^\d+$/.test(x)||/^[a-z]$/.test(x)||x==='('){p=pMul(p,factor())}
      else break;
    }
    return p;
  }
  function expr(){
    let sg=1;
    if(t[pos]==='-'){sg=-1;pos++}else if(t[pos]==='+'){pos++}
    let p=term();if(sg<0)p=pMul(p,{'':-1});
    while(t[pos]==='+'||t[pos]==='-'){const op=t[pos++];p=pAdd(p,term(),op==='+'?1:-1)}
    return p;
  }
  try{const p=expr();return pos===t.length?p:null}catch(e){return null}
}
/* «найпростіший вигляд»: без дужок, у кожному доданку не більше одного числа, подібні доданки зведено */
function isSimplified(t){
  if(t.indexOf('(')>=0||t.indexOf(')')>=0)return false;
  const terms=[];let cur=[];
  t.forEach(x=>{
    const last=cur[cur.length-1];
    if((x==='+'||x==='-')&&cur.length&&last!=='*'&&last!=='+'&&last!=='-'){terms.push(cur);cur=[x]}
    else cur.push(x);
  });
  if(cur.length)terms.push(cur);
  const seen={};
  for(const tm of terms){
    if(tm.filter(x=>/^\d+$/.test(x)).length>1)return false;
    const p=parseExpr(tm);if(!p)return false;
    const ks=Object.keys(clean(p));
    if(ks.length>1)return false;
    if(ks.length===1){if(seen[ks[0]])return false;seen[ks[0]]=1}
  }
  return true;
}
function checkExpr(q,raw){
  const t=tokenize(normalize(raw));if(!t)return false;
  const p=parseExpr(t);if(!p)return false;
  return pEq(p,q.exp)&&isSimplified(t);
}

/* ===================== Завдання ===================== */
const HINT_L='Букви й знаки можна вводити кнопками.';
const UN=[
  {big:'км',small:'м',r:1000,step:50},
  {big:'м',small:'см',r:100,step:5},
  {big:'т',small:'кг',r:1000,step:50},
  {big:'год',small:'хв',r:60,step:5},
  {big:'грн',small:'коп.',r:100,step:5}
];
function genQuestions(){
  const Q=[];

  /* 1. № 452: зручне обчислення добутку трьох чисел */
  {
    const pr=pick([[2,5],[4,25],[5,20],[2,50],[8,125],[4,250],[5,200],[2,500]]);let n;
    do{n=rnd(13,99)}while(n%5===0||n===pr[0]||n===pr[1]);
    const f=shuffle([pr[0],n,pr[1]]);
    Q.push({kind:'num',t:'Обчисліть зручним способом.',lbl:`${f.join(' · ')} =`,ans:n*pr[0]*pr[1],ev:f.join('*')});
  }
  /* 2. № 454: спростити добуток із буквами */
  {
    const kind=rnd(0,2);let orig,exp,show,L;
    if(kind===0){
      const v=letters(1)[0],a=rnd(11,29),b=rnd(2,9);L=[v];
      orig=rng()<.5?`${a} · ${b}${v}`:`${b}${v} · ${a}`;exp={[v]:a*b};show=a*b+v;
    }else if(kind===1){
      L=letters(2).sort();const a=rnd(2,12),b=rnd(2,12);
      orig=`${a}${L[0]} · ${b}${L[1]}`;exp={[L.join('')]:a*b};show=a*b+L.join('');
    }else{
      L=letters(2).sort();const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);
      orig=`${a}${L[0]} · ${b} · ${c}${L[1]}`;exp={[L.join('')]:a*b*c};show=a*b*c+L.join('');
    }
    Q.push({kind:'expr',t:'Спростіть вираз.',pre:disp(orig)+' =',letters:L,exp,show,orig,hint:'Запишіть відповідь у найпростішому вигляді. '+HINT_L});
  }
  /* 3. № 456: розподільна властивість, зручне обчислення */
  {
    let lbl,ans,ev;
    if(rng()<.5){
      const S=pick([100,1000]),a=rnd(121,989),b=S===100?rnd(11,89):rnd(101,899),c=S-b;
      lbl=`${a} · ${b} + ${a} · ${c} =`;ans=a*S;ev=`${a}*${b}+${a}*${c}`;
    }else{
      const k=rnd(11,98),D=pick([1,2,3,10,100]),x=rnd(301,989),y=x-D;
      lbl=`${x} · ${k} − ${y} · ${k} =`;ans=D*k;ev=`${x}*${k}-${y}*${k}`;
    }
    Q.push({kind:'num',t:'Обчисліть найзручнішим способом.',lbl,ans,ev});
  }
  /* 4. № 458: розкрити дужки */
  {
    const minus=rng()<.5,sg=minus?'−':'+',s=minus?-1:1,t=rnd(0,2);let orig,exp,show,L;
    if(t===0){
      const k=rnd(2,9),[v]=letters(1),p=rnd(1,9),q=rnd(2,9);L=[v];
      orig=`${k}(${co(p)}${v} ${sg} ${q})`;exp={[v]:k*p,'':s*k*q};show=`${co(k*p)}${v} ${sg} ${k*q}`;
    }else if(t===1){
      const k=rnd(2,9),[u,v]=letters(2),p=rnd(1,9),q=rnd(2,9);L=[u,v];
      orig=`${k}(${co(p)}${u} ${sg} ${co(q)}${v})`;exp={[u]:k*p,[v]:s*k*q};show=`${co(k*p)}${u} ${sg} ${co(k*q)}${v}`;
    }else{
      const [v]=letters(1),q=rnd(2,9),k=rnd(6,19);L=[v];
      orig=`(${v} ${sg} ${q}) · ${k}`;exp={[v]:k,'':s*k*q};show=`${k}${v} ${sg} ${k*q}`;
    }
    Q.push({kind:'expr',t:'Розкрийте дужки.',pre:disp(orig)+' =',letters:L,exp:clean(exp),show,orig,hint:'Запишіть відповідь у найпростішому вигляді, без дужок. '+HINT_L});
  }
  /* 5. № 460: подібні доданки */
  {
    const [v]=letters(1);let c,sg,total,ok;
    do{
      const n=rng()<.6?2:3;
      c=[rnd(2,45)];sg=[1];total=c[0];ok=true;
      for(let i=1;i<n;i++){const s=rng()<.5?1:-1,x=rnd(2,45);sg.push(s);c.push(x);total+=s*x;if(total<=1)ok=false}
    }while(!ok);
    const K=rng()<.5?rnd(11,60):0;
    let orig=`${c[0]}${v}`;
    for(let i=1;i<c.length;i++)orig+=` ${sg[i]>0?'+':'−'} ${c[i]}${v}`;
    if(K)orig+=` + ${K}`;
    const exp={[v]:total};if(K)exp['']=K;
    Q.push({kind:'expr',t:'Спростіть вираз.',pre:disp(orig)+' =',letters:[v],exp,show:total+v+(K?` + ${K}`:''),orig,hint:'Запишіть відповідь у найпростішому вигляді. '+HINT_L});
  }
  /* 6. № 462: спростити і знайти значення */
  {
    const [u,v]=letters(2),pr=pick([[2,5],[4,25],[5,20],[2,50]]),X=rnd(11,39),Y=rnd(3,19);
    const orig=`${pr[0]}${u} · ${pr[1]}${v}`;
    Q.push({kind:'num',t:`Спростіть вираз і знайдіть його значення, якщо ${disp(u)} = ${X}, ${disp(v)} = ${Y}.`,lbl:disp(orig)+' =',
      ans:pr[0]*pr[1]*X*Y,ev:`${pr[0]}*${X}*${pr[1]}*${Y}`});
  }
  /* 7. № 466: розкласти множник на зручні */
  {
    const pr=pick([[2,5],[4,25],[2,50]]),p=pr[0],q=pr[1];let s,t,A,B;
    do{s=rnd(2,9);t=rnd(2,9);A=q*s;B=p*t}while(A===B);
    const e=rng()<.5?[A,B]:[B,A];
    Q.push({kind:'num',t:'Обчисліть зручним способом.',lbl:`${e[0]} · ${e[1]} =`,ans:A*B,ev:`${e[0]}*${e[1]}`});
  }
  /* 8. № 468: вираз із чотирьох доданків */
  {
    let expr,ans;
    const ori=(a,b)=>rng()<.5?`${a} · ${b}`:`${b} · ${a}`;
    if(rng()<.5){
      let f,g,h,u,v;
      do{h=rnd(11,45);f=rnd(h+30,99);g=f-h;u=rnd(11,89);v=100-u}while(!allDiff([f,g,h,u,v]));
      expr=`${ori(f,u)} − ${ori(h,u)} + ${ori(g,v)}`;ans=g*100;
    }else{
      let f,g,w,u,v,D;
      do{g=rnd(52,99);u=rnd(11,g-11);v=g-u;f=rnd(41,90);D=pick([10,20,30]);w=f-D}while(!allDiff([f,g,u,v,w]));
      expr=`${ori(f,u)} + ${ori(f,v)} − ${ori(g,w)}`;ans=g*D;
    }
    Q.push({kind:'num',t:'Обчисліть значення виразу зручним способом.',lbl:expr+' =',ans,ev:expr.replace(/−/g,'-').replace(/·/g,'*')});
  }
  /* 9. № 470: множення величин */
  {
    const U=pick(UN),a=rnd(2,9),b=U.step*rnd(1,U.r/U.step-1),k=rnd(2,9);
    Q.push({kind:'num',t:`Виконайте множення й запишіть результат в одиницях «${U.small}».`,
      lbl:`${a} ${U.big} ${b} ${U.small} · ${k} =`,post:U.small,ans:(a*U.r+b)*k,ev:`(${a}*${U.r}+${b})*${k}`});
  }
  /* 10. № 472: нулі в кінці добутку */
  {
    const n=pick([20,30,40,50,60,70,80,100]);
    Q.push({kind:'num',t:`Скількома нулями закінчується добуток усіх натуральних чисел від 1 до ${n} включно?`,
      lbl:'',ph:true,cap:'кількість нулів',ans:Math.floor(n/5)+Math.floor(n/25),zeros:n});
  }
  return Q;
}

/* ===================== Перевірка відповіді ===================== */
function isFilled(q,v){
  if(q.kind==='choice')return v!==null;
  return String(v).trim()!=='';
}
function isRight(q,v){
  if(!isFilled(q,v))return false;
  if(q.kind==='choice')return v===q.ans;
  if(q.kind==='num')return Number(v)===q.ans;
  return checkExpr(q,v);
}
function qText(q){
  if(q.kind==='choice')return q.qplain||(plain(q.t)+' ('+q.opts.map(plain).join(' / ')+')');
  const base=plain(q.t)+(q.figText?' ['+q.figText+']':'');
  if(q.kind==='num')return base+(q.lbl?' '+plain(q.lbl):'')+(q.post?' … '+q.post:'');
  return base+' '+plain(q.pre)+' …';
}
function answerText(q,v){
  if(q.kind==='choice')return v===null?'':plain(q.opts[v]);
  return String(v).trim();
}
function correctText(q){
  if(q.kind==='choice')return plain(q.opts[q.ans]);
  if(q.kind==='num')return String(q.ans);
  return plain(q.show);
}

/* ===================== Побудова тесту ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const touch=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
let QUESTIONS=[],N=0,state=null,seed=0,cur=0,warnedEmpty=false,student={sur:'',nam:''};

/* час і виходи з вікна */
let W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0};
function resetWatch(){W={t0:Date.now(),leaves:0,awaySec:0,awayAt:0}}
function leave(){if(!state||state.checked||W.awayAt)return;W.awayAt=Date.now();W.leaves++}
function back(){if(!W.awayAt)return;W.awaySec+=Math.round((Date.now()-W.awayAt)/1000);W.awayAt=0}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);
window.addEventListener('focus',back);

function newSeed(first){
  let v=null;
  if(first){try{v=new URLSearchParams(location.search).get('v')}catch(e){}}
  seed=(v&&/^\d+$/.test(v))?(Number(v)>>>0):Math.floor(Math.random()*4294967296);
  setSeed(seed);
}
function initVal(q){return q.kind==='choice'?null:''}

function build(first){
  newSeed(first);
  QUESTIONS=genQuestions();N=QUESTIONS.length;
  state={val:QUESTIONS.map(initVal),orders:QUESTIONS.map(q=>q.kind==='choice'?shuffle(q.opts.map((_,i)=>i)):null),checked:false};
  resetWatch();cur=0;warnedEmpty=false;
}

/* екрани */
const screens=['sStart','sPlay','sReview','sResult'];
function showScreen(id){
  screens.forEach(s=>{$('#'+s).hidden=(s!==id)});
  if(id!=='sPlay')hideKp();
}
function chipsHtml(opts){
  opts=opts||{};
  return QUESTIONS.map((q,i)=>{
    let c='chip'+(opts.big?' big':'');
    if(state.checked)c+=isRight(q,state.val[i])?' y':' n';
    else if(isFilled(q,state.val[i]))c+=' f';
    if(opts.cur&&i===cur)c+=' cur';
    return `<button type="button" class="${c}" data-go="${i}" aria-label="Завдання ${i+1}">${i+1}</button>`;
  }).join('');
}
function qHtml(q,qi){
  const done=state.checked,v=state.val[qi];
  const ok=done&&isRight(q,v);
  let h=`<div class="qh"><span class="num">${qi+1}</span><div class="qt">${q.t}</div><span class="mark">${done?(ok?'✓':'✗'):''}</span></div>`;
  if(q.fig)h+=`<div class="fig">${q.fig}</div>`;
  if(q.kind==='choice'){
    h+=`<div class="opts">`+state.orders[qi].map(i=>{
      let c='opt';
      if(done){if(i===v)c+=ok?' good':' bad';else if(i===q.ans)c+=' right'}
      else if(i===v)c+=' sel';
      return `<button type="button" class="${c}" data-opt="${i}">${q.opts[i]}</button>`;
    }).join('')+`</div>`;
  }else if(q.kind==='num'){
    const inp=`<input class="numin${q.ph?' ph':''}${done?(ok?' good':' bad'):''}" data-q="${qi}" ${touch?'inputmode="none"':'inputmode="numeric"'} autocomplete="off" aria-label="Відповідь" value="${esc(v)}"${q.ph?' placeholder="Введіть відповідь числом"':''}${done?' readonly':''}>`;
    h+=`<div class="row">${q.lbl?`<span class="tx">${q.lbl}</span>`:''}${q.cap?`<span class="capf">${inp}<small>${q.cap}</small></span>`:inp}${q.post?`<span class="tx">${q.post}</span>`:''}</div>`;
  }else{
    h+=`<div class="row"><span class="tx">${q.pre}</span><input class="exin${done?(ok?' good':' bad'):''}" data-q="${qi}" type="text" ${touch?'inputmode="none"':'inputmode="text"'} autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="40" aria-label="Відповідь" value="${esc(v)}"${done?' readonly':''}></div>`;
    if(!touch&&!done)h+=`<div class="symrow">`+q.letters.map(l=>`<button type="button" class="sym" data-ch="${l}" aria-label="буква ${l}"><i>${l}</i></button>`).join('')+['+','−','·','(',')'].map(ch=>`<button type="button" class="sym" data-ch="${ch}">${ch}</button>`).join('')+`</div>`;
    if(!done)h+=`<div class="hint">${q.hint}</div>`;
  }
  if(done){
    h+=ok?`<div class="corr">Правильно</div>`
         :`<div class="corr no">${isFilled(q,v)?`Ваша відповідь: ${esc(answerText(q,v))}. `:'Відповіді немає. '}Правильно: ${esc(correctText(q))}</div>`;
  }
  return h;
}
function showTask(i){
  cur=Math.max(0,Math.min(N-1,i));
  showScreen('sPlay');
  const q=QUESTIONS[cur];
  $('#top').innerHTML=`<div class="cnt">Завдання ${cur+1} з ${N}</div><div class="chips">${chipsHtml({cur:true})}</div>`;
  const box=$('#qbox');
  box.innerHTML=`<section class="card q${state.checked?' locked '+(isRight(q,state.val[cur])?'ok':'bad'):''}">${qHtml(q,cur)}</section>`;
  box.scrollTop=0;
  let nv;
  if(state.checked){
    nv=`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn ghost" id="bRes">До результату</button><button class="btn" id="bNext"${cur===N-1?' disabled':''}>Далі →</button>`;
  }else{
    nv=`<button class="btn ghost" id="bPrev"${cur===0?' disabled':''}>← Назад</button><button class="btn" id="bNext">${cur===N-1?'Далі →':'Далі →'}</button>`;
  }
  $('#nav').innerHTML=nv;
  $('#bPrev').onclick=()=>showTask(cur-1);
  $('#bNext').onclick=()=>{if(cur<N-1)showTask(cur+1);else showReview()};
  if(state.checked)$('#bRes').onclick=showResult;
  hideKp();
}
function showReview(){
  showScreen('sReview');
  const filled=QUESTIONS.filter((q,i)=>isFilled(q,state.val[i])).length;
  $('#rvTitle').textContent=`Відповіли на ${filled} з ${N}`;
  $('#rvChips').innerHTML=chipsHtml({big:true});
  $('#warn').textContent='';warnedEmpty=false;$('#checkBtn').textContent='Перевірити';
}

/* введення */
const qbox=$('#qbox');
function setVal(el,v){
  const qi=+el.dataset.q;state.val[qi]=v;el.value=v;
  warnedEmpty=false;
  const f=$('#top .chips');if(f)f.innerHTML=chipsHtml({cur:true});
}
qbox.addEventListener('input',e=>{
  const el=e.target;if(!state||state.checked||!el.dataset.q)return;
  if(el.classList.contains('numin')){el.value=el.value.replace(/\D/g,'').slice(0,9)}
  setVal(el,el.value);
});
qbox.addEventListener('mousedown',e=>{if(e.target.closest('.sym'))e.preventDefault()});
function insertAt(inp,ch,max){
  const a=inp.selectionStart==null?inp.value.length:inp.selectionStart,b=inp.selectionEnd==null?a:inp.selectionEnd;
  if(inp.value.length-(b-a)+ch.length>max)return;
  inp.value=inp.value.slice(0,a)+ch+inp.value.slice(b);
  try{inp.setSelectionRange(a+ch.length,a+ch.length)}catch(x){}
  setVal(inp,inp.value);
}
qbox.addEventListener('click',e=>{
  if(!state||state.checked)return;
  const sy=e.target.closest('.sym');
  if(sy){
    const inp=qbox.querySelector('.exin');if(!inp)return;
    insertAt(inp,sy.dataset.ch,40);
    try{inp.focus({preventScroll:true})}catch(x){inp.focus()}
    return;
  }
  const o=e.target.closest('.opt');
  if(o){
    state.val[cur]=+o.dataset.opt;
    qbox.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');
    $('#top .chips').innerHTML=chipsHtml({cur:true});
  }
});
/* номери завдань */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip[data-go]');
  if(c)showTask(+c.dataset.go)
});
/* клавіатура комп'ютера */
document.addEventListener('keydown',e=>{
  if($('#sPlay').hidden||$('#overlay').classList.contains('on'))return;
  const inField=e.target.matches&&e.target.matches('input');
  if(e.key==='Enter'&&inField&&e.target.dataset.q&&isFilled(QUESTIONS[+e.target.dataset.q],state.val[+e.target.dataset.q])){
    e.preventDefault();$('#bNext').click();
  }else if(!inField&&e.key==='ArrowRight'){const b=$('#bNext');if(b&&!b.disabled)b.click()}
  else if(!inField&&e.key==='ArrowLeft'){const b=$('#bPrev');if(b&&!b.disabled)b.click()}
});

/* екранна клавіатура (сенсорні екрани): цифри; для виразів ще букви й знаки */
const kp=$('#kp');
function hideKp(){kp.hidden=true;kp.innerHTML=''}
function showKp(q){
  let h='<div class="g">';
  if(q.kind==='expr'){
    h+=q.letters.map(l=>`<button type="button" data-ch="${l}"><i>${l}</i></button>`).join('');
    h+=Array.from({length:Math.max(0,6-q.letters.length)}).map(()=>'<span></span>').join('');
    h+=['+','−','·','(',')'].map(ch=>`<button type="button" data-ch="${ch}">${ch}</button>`).join('')+'<button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>';
    h+=[1,2,3,4,5,6,7,8,9,0].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="ok" aria-label="Готово">✓</button><span></span>';
  }else{
    h+=['1','2','3','4','5'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>';
    h+=['6','7','8','9','0'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="ok" aria-label="Готово">✓</button>';
  }
  kp.innerHTML=h+'</div>';kp.hidden=false;
}
if(touch){
  document.addEventListener('focusin',e=>{
    const t=e.target;
    if(t.matches&&t.matches('.numin,.exin')&&state&&!state.checked){
      showKp(QUESTIONS[+t.dataset.q]);
      setTimeout(()=>{try{t.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(x){}},60);
    }
  });
  document.addEventListener('focusout',()=>{
    setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('.numin,.exin')))hideKp()},150);
  });
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked)return;
    const el=document.activeElement;
    if(!el||!el.matches||!el.matches('.numin,.exin'))return;
    const k=b.dataset.k;
    if(k==='bs')setVal(el,el.value.slice(0,-1));
    else if(k==='ok')el.blur();
    else if(el.classList.contains('numin')){if(el.value.length<9)setVal(el,el.value+b.dataset.ch)}
    else insertAt(el,b.dataset.ch,40);
  });
}

/* ===================== Початок і перевірка ===================== */
['#sur','#nam'].forEach(s=>$(s).addEventListener('input',e=>{e.target.classList.remove('need');$('#studentMsg').textContent=''}));
function needName(){
  const sur=$('#sur').value.trim(),nam=$('#nam').value.trim();
  if(!sur||!nam){
    if(!sur)$('#sur').classList.add('need');
    if(!nam)$('#nam').classList.add('need');
    $('#studentMsg').textContent='Введіть прізвище та ім’я, щоб почати.';
    return null;
  }
  return {sur,nam};
}
$('#startBtn').addEventListener('click',()=>{
  const s=needName();if(!s)return;
  student=s;showTask(0);
});
$('#rvBack').addEventListener('click',()=>showTask(N-1));
$('#checkBtn').addEventListener('click',()=>{
  const empty=QUESTIONS.filter((q,i)=>!isFilled(q,state.val[i])).length;
  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(student.sur,student.nam);
});

function showResult(){
  showScreen('sResult');
  const marks=QUESTIONS.map((q,i)=>isRight(q,state.val[i])?1:0),score=marks.reduce((s,x)=>s+x,0);
  $('#result').innerHTML=`<div class="who">${esc(student.sur)} ${esc(student.nam)}</div>
    <div class="big">${score} з ${N}</div>
    <div style="font-weight:800;color:var(--muted)">${plural(score,'бал','бали','балів')}</div>
    <div class="chips cardchips">${chipsHtml({big:true})}</div>
    <button class="btn ghost" id="againBtn">Пройти ще раз</button>`;
  $('#againBtn').addEventListener('click',()=>{build(false);showTask(0)});
}

function finish(sur,nam){
  const now=Date.now();
  back();
  state.checked=true;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const marks=QUESTIONS.map((q,i)=>isRight(q,state.val[i])?1:0);
  const score=marks.reduce((s,x)=>s+x,0);
  showResult();
  saveResult({
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,
    ts:now,date:new Date(now).toISOString(),
    score,max:N,tasks:marks,
    qtext:QUESTIONS.map(qText),
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    correct:QUESTIONS.map(correctText),
    durationSec:Math.round((now-W.t0)/1000),
    leaves:W.leaves,
    awaySec:W.awaySec,
    variant:seed,
    test:TEST_NAME
  });
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="mrow"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Закрити</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=()=>{if(pw.value===TEACHER_PASSWORD)showJournal();else{$('#pmsg').textContent='Неправильний пароль';pw.select()}};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){overlay.classList.remove('on');modal.innerHTML=''}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Сполучна та розподільна властивості множення (ДЗ)</h2>
    <div class="mrow"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="mrow" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=await loadResults()}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const cols=Math.max(...rows.map(r=>r.max||(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту">Виходів</th><th>Бал</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>{
    const quick=r.durationSec!==undefined&&r.durationSec<120;
    const many=r.leaves!==undefined&&r.leaves>=3;
    const away=r.awaySec!==undefined?`Поза вікном: ${fmtDur(r.awaySec)}`:'';
    const main=`<tr><td>${k+1}</td><td class="nm" data-k="${k}" title="Показати відповіді">${esc(r.name||'')}</td><td>${fmtDate(r.ts)}</td><td${quick?' class="red" title="Дуже швидко"':''}>${fmtDur(r.durationSec)}</td><td${many?' class="red"':''}${away?` title="${away}"`:''}>${r.leaves===undefined?'—':r.leaves}</td><td><b>${r.score}/${r.max||N}</b></td>${
      idx.map(i=>{const m=(r.tasks||[])[i];return m===undefined?'<td>—</td>':(m?'<td class="y">✓</td>':'<td class="n">✗</td>')}).join('')}</tr>`;
    let det='';
    if(r.qtext){
      det=`<table><tr><th>№</th><th>Завдання</th><th>Відповідь учня</th><th>Правильна відповідь</th></tr>${
        r.qtext.map((t,i)=>`<tr><td>${i+1}</td><td class="w">${esc(t)}</td><td class="w">${esc((r.answers||[])[i]||'—')}</td><td class="w">${esc((r.correct||[])[i]||'')}</td></tr>`).join('')}</table>`;
      if(r.variant!==undefined)det+=`<div style="margin-top:6px;color:var(--muted)">Варіант № ${r.variant}${away?'. '+away:''}</div>`;
    }else det='<span style="color:var(--muted)">Для цього запису деталей немає.</span>';
    return main+`<tr class="det" id="det${k}" hidden><td colspan="${6+cols}">${det}</td></tr>`;
  }).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
  $('#jbody').querySelectorAll('td.nm').forEach(td=>td.addEventListener('click',()=>{const d=$('#det'+td.dataset.k);if(d)d.hidden=!d.hidden}));
}
function downloadCSV(){
  if(!rows.length)return;
  const cols=Math.max(...rows.map(r=>r.max||(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const hdr=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал',...idx.map(i=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,fmtDate(r.ts),r.durationSec===undefined?'':fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,r.awaySec===undefined?'':fmtDur(r.awaySec),`${r.score}/${r.max||N}`,...idx.map(i=>{const m=(r.tasks||[])[i];return m===undefined?'':(m?'+':'-')})]));
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Сполучна_розподільна_ДЗ_5клас_результати.csv';a.click();
}

build(true);
showScreen('sStart');
})();
</script>
