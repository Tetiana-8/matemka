<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест. Множення натуральних чисел (5 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a1736;--muted:#8a5a78;
  --acc:#be185d;--acc2:#e5508a;--accL:#fce7f3;--soft:#fdeff5;--soft2:#fff7fa;--line:#f3cfe0;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;--badln:#efa3a8;
  --warn:#e8890c;--warnbg:#fff3e0;--warntx:#8a4b00;--warnln:#f3c27f;
  --card:#ffffff;
  --cw:2.7rem;--ch:3.1rem;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 45%,#fbcfe8 100%) fixed;overflow:hidden}
#app{height:100dvh;max-width:900px;margin:0 auto;display:flex;flex-direction:column;
  padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(120,20,70,.14);padding:22px 24px}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem);font-weight:900;line-height:1.25;color:var(--acc);text-wrap:balance}

/* початок */
#sStart{justify-content:center;overflow:auto}
.start{text-align:center;padding:28px 24px}
.student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.student label{display:block;font-weight:800;font-size:.95rem;color:var(--muted);text-align:left;margin-bottom:4px}
.student input{width:100%;font:inherit;font-size:1.1rem;padding:11px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--soft);color:var(--ink)}
.student input:focus{border-color:var(--acc);background:#fff}
.student input.need{border-color:var(--bad);background:var(--badbg)}
.msg{color:var(--bad);font-weight:800;min-height:1.3em;margin:6px 0 10px}

/* ряд номерів */
#top{flex:none}
.cnt{font-weight:900;color:var(--acc);font-size:1.05rem;text-align:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:900;font-size:.95rem;cursor:pointer;padding:0;touch-action:manipulation}
.chip.f{background:var(--acc2);border-color:var(--acc2);color:#fff}
.chip.cur{border-color:var(--acc);border-width:4px;line-height:1}
.chip.y{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.p{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.n{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.cur.y{box-shadow:0 0 0 3px var(--okln)}.chip.cur.n{box-shadow:0 0 0 3px var(--badln)}.chip.cur.p{box-shadow:0 0 0 3px var(--warnln)}
.chip.big{width:46px;height:46px;font-size:1.1rem}

/* завдання */
#qbox{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:3px 4px 18px}
.q{position:relative}
.q.ok{box-shadow:0 0 0 3px var(--ok),0 10px 30px rgba(120,20,70,.14)}
.q.part{box-shadow:0 0 0 3px var(--warn),0 10px 30px rgba(120,20,70,.14)}
.q.bad{box-shadow:0 0 0 3px var(--bad),0 10px 30px rgba(120,20,70,.14)}
.qh{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.15rem;background:linear-gradient(135deg,#be185d,#e5508a)}
.qt{flex:1;min-width:0;font-size:1.2rem;font-weight:700;line-height:1.5;padding-top:5px}
.pt{display:inline-block;margin-left:.5rem;padding:1px 10px;border-radius:999px;background:var(--accL);color:var(--acc);font-weight:900;font-size:.82rem;white-space:nowrap;vertical-align:middle}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:none;place-items:center;font-size:1.4rem;font-weight:900;color:#fff}
.q.ok .mark{display:grid;background:var(--ok)}
.q.part .mark{display:grid;background:var(--warn)}
.q.bad .mark{display:grid;background:var(--bad)}
i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px;font-weight:800;font-size:1.5rem}
.numin{width:9.5rem;font:inherit;font-weight:900;border:2px solid var(--line);border-radius:12px;background:var(--soft2);color:var(--ink);outline:none;text-align:center;padding:8px 12px;font-size:1.5rem;touch-action:manipulation}
.numin:focus,.numin.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.18)}
.numin.good,.cell.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.numin.bad,.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}

/* так / ні */
.tfs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tfr{display:flex;align-items:center;gap:12px;background:var(--soft2);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.tfr .tt{flex:1;min-width:0;font-weight:700;font-size:1.05rem;line-height:1.4}
.tfr .bb{flex:none;display:flex;gap:6px}
.tfb{font:inherit;font-weight:800;min-width:3.4rem;min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--acc);cursor:pointer;touch-action:manipulation}
.tfb.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.tfb.good{background:var(--ok);border-color:var(--ok);color:#fff}
.tfb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tfb.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--okln)}
.locked .tfb{cursor:default}

/* задача з кількома полями */
.mrows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;background:var(--soft2);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.mr .ml{flex:1 1 15rem;min-width:0;font-weight:700;font-size:1.05rem;line-height:1.35}
.mr .mi{flex:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;color:var(--muted)}
.mr .numin{width:8.5rem;font-size:1.35rem;padding:6px 10px}

/* клітинки для цифр */
.cell{flex:none;width:calc(var(--cw) - .3rem);height:var(--ch);padding:0;text-align:center;font:inherit;font-size:1.6rem;font-weight:900;
  color:var(--ink);background:var(--soft2);border:2px solid #eab5cd;border-radius:.6rem;outline:none;caret-color:transparent;touch-action:manipulation}
.cell:focus,.cell.act{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.colwrap{display:flex;justify-content:center;margin-top:14px;overflow-x:auto}
.colm{display:inline-flex;flex-direction:column;align-items:flex-end;gap:.3rem;padding:.8rem 1rem;background:var(--soft2);border:2px dashed #eab5cd;border-radius:1rem}
.crow{display:flex}
.slot{flex:none;width:var(--cw);height:var(--ch);display:flex;align-items:center;justify-content:center}
.slot.dig{font-size:1.9rem;font-weight:900}
.slot.sg{font-size:1.8rem;font-weight:900;color:var(--acc)}
.slot.ph::after{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#e6bfd2}
.cline{align-self:stretch;height:3px;border-radius:2px;background:var(--ink);margin:.1rem 0}
.hint{margin-top:10px;font-size:.95rem;line-height:1.4;color:var(--muted);font-weight:700}
.corr{margin-top:14px;padding:9px 14px;border-radius:12px;background:var(--okbg);color:var(--oktx);font-weight:800;font-size:1.05rem}
.corr.no{background:var(--badbg);color:var(--badtx)}
.corr.pp{background:var(--warnbg);color:var(--warntx)}

/* нижня панель */
#nav{flex:none;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:4px 0 2px}
.btn{font:inherit;font-weight:900;font-size:1.1rem;border:0;border-radius:14px;padding:12px 26px;min-height:46px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#be185d,#e5508a);box-shadow:0 6px 16px rgba(190,24,93,.28);touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.btn.big{padding:14px 40px;font-size:1.25rem}

/* перед здачею й результат */
#sReview,#sResult{overflow:auto;justify-content:center}
.center{text-align:center}
.warn{color:var(--bad);font-weight:800;margin:10px 0 0;min-height:1.3em}
.who{font-weight:800;color:var(--muted);font-size:1.1rem}
.big{font-size:clamp(2.4rem,8vw,3.4rem);font-weight:900;margin:4px 0;color:var(--acc);line-height:1.1}
.cardchips{margin:16px 0 18px}
.shot{margin:14px auto 0;max-width:32rem;padding:14px 16px;border:3px solid var(--acc);border-radius:16px;background:var(--accL);font-weight:900;font-size:1.25rem;line-height:1.35;color:var(--acc)}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* екранна клавіатура (сенсорні екрани) */
#kp{flex:none;background:#f6e4ee;border-top:2px solid var(--line);margin:0 calc(-1*max(14px,env(safe-area-inset-right,0px))) 0 calc(-1*max(14px,env(safe-area-inset-left,0px)));
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(120,20,70,.15)}
#kp .g{display:grid;gap:6px;max-width:34rem;margin:0 auto;grid-template-columns:repeat(6,1fr)}
#kp button{font:inherit;font-weight:900;font-size:1.3rem;height:2.8rem;border:0;border-radius:.7rem;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(120,20,70,.2);touch-action:manipulation}
#kp button:active{background:var(--accL)}
#kp button.fn{background:#fbd9e8;color:var(--acc)}
#kp button:disabled{opacity:.35}

footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* ключ учителя */
#keyBtn{position:fixed;top:calc(3px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));z-index:20;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:.9rem;cursor:pointer;opacity:.7;padding:0}
#keyBtn:hover{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(58,23,54,.45);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:1200px;box-shadow:0 20px 50px rgba(58,23,54,.3)}
.modal h2{margin:0 0 12px;font-weight:900;font-size:1.3rem}
.modal .mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.modal input{font:inherit;font-size:1.05rem;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none}
.sbtn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
.sbtn.g{background:#fce7f3;color:var(--acc)}
.sbtn.r{background:var(--bad)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;font-weight:900}
td.nm{text-align:left;font-weight:700;cursor:pointer;text-decoration:underline dotted}
td.y{color:var(--ok);font-weight:900}td.n{color:var(--bad);font-weight:900}td.h{color:var(--warn);font-weight:900}
td.red{color:var(--bad);font-weight:900}
tr.det td{white-space:normal;text-align:left;background:var(--soft2)}
tr.det table{font-size:.9rem}
tr.det td.w{white-space:normal}
.pmsg{color:var(--bad);font-weight:800}

@media (max-width:640px){
  .card{padding:16px 14px}
  .student{grid-template-columns:1fr}
  .num,.mark{width:34px;height:34px}
  .qt{font-size:1.08rem;padding-top:3px}
  .row{font-size:1.25rem}
  .chip{width:32px;height:32px;font-size:.85rem}
  .chip.big{width:40px;height:40px}
  .btn{padding:12px 18px}
  #nav .btn{padding:12px 10px;font-size:1rem}
  .tfr{flex-direction:column;align-items:flex-start}
  .colm{padding:.6rem .5rem}
  .mr .numin{width:7.2rem}
  :root{--cw:2.4rem;--ch:2.7rem}
}
@media (max-width:380px){:root{--cw:2.2rem}}
@media (max-height:700px){
  #app{padding-top:6px}
  .card{padding:14px 18px}
  .row{margin-top:10px}
  :root{--ch:2.6rem}
  .cell,.slot.dig{font-size:1.4rem}
}
@media (max-height:680px){
  #top .chips{display:none}
}
</style>
</head>
<body>
<button id="keyBtn" title="Журнал учителя" aria-label="Журнал учителя">🔑</button>

<div id="app">
  <section class="scr" id="sStart">
    <div class="card start">
      <h1>Тест. Множення натуральних чисел (5 клас)</h1>
      <div class="student">
        <div><label for="sur">Прізвище</label><input id="sur" autocomplete="off"></div>
        <div><label for="nam">Ім'я</label><input id="nam" autocomplete="off"></div>
      </div>
      <div class="msg" id="studentMsg"></div>
      <button class="btn big" id="startBtn">Почати</button>
    </div>
  </section>

  <section class="scr" id="sPlay" hidden>
    <div id="top"></div>
    <div id="qbox"></div>
    <div id="nav"></div>
  </section>

  <section class="scr" id="sReview" hidden>
    <div class="card center">
      <h1 id="rvTitle"></h1>
      <div class="chips cardchips" id="rvChips"></div>
      <div class="warn" id="warn"></div>
      <div class="rbtns" style="margin-top:8px">
        <button class="btn ghost" id="rvBack">← До завдань</button>
        <button class="btn" id="checkBtn">Перевірити</button>
      </div>
    </div>
  </section>

  <section class="scr" id="sResult" hidden>
    <div class="card center" id="result"></div>
  </section>

  <div id="kp" hidden></div>
  <footer>Автор розробки <b>Ковтун Тетяна</b></footer>
</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
"use strict";

/* ===================== Firebase (база math-5-892a5) ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEykTXlA8Um3MdHbA3dZEZGxuWzFreohU",
  authDomain: "math-5-892a5.firebaseapp.com",
  projectId: "math-5-892a5",
  storageBucket: "math-5-892a5.firebasestorage.app",
  messagingSenderId: "163114803328",
  appId: "1:163114803328:web:caf86c4e8b8c4b3b630665",
  measurementId: "G-E06VKZ2GP5"
};
const APP_ID = 'default-app-id';
const COLLECTION = 'results_multcolumn_5';
const TEACHER_PASSWORD = '8019';
const FBV = '10.12.2';
const TEST_NAME = 'Множення натуральних чисел (5 клас)';

let fbPromise = null;
function fb(){
  if(!fbPromise){
    fbPromise = (async()=>{
      const [appM, authM, fs] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)
      ]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      await authM.signInAnonymously(authM.getAuth(app));
      return { db: fs.getFirestore(app), fs };
    })();
    fbPromise.catch(() => { fbPromise = null; }); // при збої — повторна спроба
  }
  return fbPromise;
}
const coll = (db, fs) => fs.collection(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION);

async function saveResult(rec){
  try { const { db, fs } = await fb(); await fs.setDoc(fs.doc(coll(db, fs), rec.id), rec); }
  catch(e){ console.warn('Save failed', e); }   // учням нічого не показувати
}
async function loadResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  const out = []; snap.forEach(d => out.push(d.data()));
  return out.sort((a,b) => (b.ts||0) - (a.ts||0));
}
async function clearResults(){
  const { db, fs } = await fb();
  const snap = await fs.getDocs(coll(db, fs));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
}
fb().catch(() => {});   // підключення одразу при відкритті сторінки

/*LOGIC_START*/
/* ===================== Випадкові числа (свій варіант кожному учневі) ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
function setSeed(s){rng=mulberry32(s)}
const rnd=(a,b)=>Math.floor(rng()*(b-a+1))+a;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LET=['a','b','c','d','k','m','n','p','x','y'];
function letters(n){const pool=LET.slice(),o=[];for(let i=0;i<n;i++)o.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);return o}
const I=s=>'<i>'+s+'</i>';
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function plain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/ /g,' ')}
function plural(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c}
function digitsNo01(n){let s='';for(let i=0;i<n;i++)s+=rnd(2,9);return +s}

/* ===================== Заготовки завдань ===================== */
function cq(t,qplain,pts){return {kind:'cells',t:t,qplain:qplain,pts:pts,exp:[],groups:[],sep:' | ',rows:[],partG:[],hint:'Цифри вписуйте справа наліво, як під час письмового множення.'}}
/* додає клітинки для рядка цифр; rtl — клітинки заповнюються справа наліво */
function addCells(q,str,rtl){
  const start=q.exp.length, idx=new Array(str.length);
  if(rtl){for(let j=str.length-1;j>=0;j--){q.exp.push(str[j]);idx[j]=q.exp.length-1}}
  else{for(let j=0;j<str.length;j++){q.exp.push(str[j]);idx[j]=q.exp.length-1}}
  q.groups.push({s:start,n:str.length,rtl:!!rtl});
  return idx;
}
/* множення в стовпчик: a · b, усі цифри у клітинках; порядок введення: справа наліво, зверху вниз */
function colQuestion(a,b,pts){
  const sa=String(a), sb=String(b), fin=String(a*b);
  const q=cq('Виконайте множення в стовпчик. Впишіть цифри в клітинки.','Множення в стовпчик: '+a+' · '+b,pts);
  const parts=sb.length>1?[...sb].reverse().map((d,i)=>({s:String(a*(+d)),shift:i})):[];
  const W=Math.max(sa.length,sb.length,fin.length,...parts.map(p=>p.s.length+p.shift))+1;
  const lines=[];
  const slotRow=(list,shift,sign)=>{
    const items=Array.from({length:W},()=>({e:1}));
    for(let j=0;j<list.length;j++)items[W-1-shift-(list.length-1-j)]=list[j];
    if(sign)items[0]={sg:sign};
    return items;
  };
  const cellRow=str=>addCells(q,str,true).map(c=>({c:c}));
  lines.push({k:'slots',items:slotRow([...sa].map(d=>({d:d})),0)});
  lines.push({k:'slots',items:slotRow([...sb].map(d=>({d:d})),0,'×')});
  lines.push({k:'rule'});
  if(parts.length){
    parts.forEach((p,i)=>{
      const items=slotRow(cellRow(p.s),p.shift,i===1?'+':null);
      q.partG.push(q.groups.length-1);
      for(let s=0;s<p.shift;s++)items[W-1-s]={ph:1};
      lines.push({k:'slots',items:items});
    });
    lines.push({k:'rule'});
  }
  lines.push({k:'slots',items:slotRow(cellRow(fin),0)});
  q.finG=q.groups.length-1;
  q.rows=[{k:'col',lines:lines}];
  q.corrText=(parts.length?'неповні добутки: '+parts.map(p=>p.s).join(', ')+'; ':'')+'добуток: '+fin;
  return q;
}
function numQ(t,lbl,ans,qplain,pts,after){return {kind:'num',t:t,lbl:lbl,ans:ans,qplain:qplain,pts:pts,after:after||''}}

/* ===================== Перевірка відповіді та бали ===================== */
function isFilled(q,v){
  if(q.kind==='cells'||q.kind==='multi')return v.every(x=>String(x).trim()!=='');
  if(q.kind==='tf')return v.every(x=>x!==null);
  return String(v).trim()!=='';
}
const half=x=>Math.round(x*2)/2;
/* клітинка правильна, якщо збігається з відповіддю; цифри остаточного добутку теж, якщо вони відповідають
   сумі неповних добутків, які записав сам учень (одну помилку не карають двічі) */
function cellOk(q,v,k){
  if(v[k]==='')return false;
  if(v[k]===q.exp[k])return true;
  if(q.partG&&q.partG.length&&q.finG!==undefined){
    const g=q.groups[q.finG];
    if(k>=g.s&&k<g.s+g.n){
      let sum=0;
      for(let i=0;i<q.partG.length;i++){
        const pg=q.groups[q.partG[i]], t=v.slice(pg.s,pg.s+pg.n);
        if(t.some(x=>x===''))return false;
        sum+=Number(t.slice().reverse().join(''))*Math.pow(10,i);
      }
      const fs=String(sum), d=fs[fs.length-1-(k-g.s)];
      return d!==undefined&&v[k]===d;
    }
  }
  return false;
}
function partOk(q,v,k){
  const p=q.parts[k];
  if(String(v[k]).trim()==='')return false;
  const n=Number(v[k]);
  if(n===p.ans)return true;
  if(p.ft){const e=p.ft(v);return Number.isFinite(e)&&n===e}
  return false;
}
function oneSlip(a,b){
  a=String(a);b=String(b);
  if(a.length!==b.length||a===b)return false;
  let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;
  return d===1;
}
function earned(q,v){
  if(q.kind==='multi')return q.parts.reduce((s,p,k)=>s+(partOk(q,v,k)?p.pts:0),0);
  if(q.kind==='cells'){
    const n=q.exp.length;let ok=0;
    for(let k=0;k<n;k++)if(cellOk(q,v,k))ok++;
    if(ok===n)return q.pts;
    return Math.min(q.pts-0.5,half(q.pts*ok/n));
  }
  if(!isFilled(q,v))return 0;
  if(q.kind==='tf')return v.every((x,i)=>x===q.items[i].ok)?q.pts:0;
  const n=Number(v);
  if(n===q.ans)return q.pts;
  if(oneSlip(String(n),q.ans))return Math.min(q.pts-0.5,half(q.pts/2));  /* помилка в одній цифрі: половина балів */
  return 0;
}
function cellsText(q,arr){
  return q.groups.map(g=>{
    const s=arr.slice(g.s,g.s+g.n).map(x=>x===''?'·':x);
    if(g.rtl)s.reverse();
    return s.join('');
  }).join(q.sep);
}
function qText(q){return q.qplain||plain(q.t)}
function answerText(q,v){
  if(q.kind==='cells')return cellsText(q,v);
  if(q.kind==='multi')return v.map(x=>String(x).trim()===''?'·':String(x).trim()).join(' | ');
  if(q.kind==='tf')return v.map(x=>x===null?'·':(x?'Так':'Ні')).join(', ');
  return String(v).trim();
}
function correctText(q){
  if(q.kind==='cells')return q.corrText||cellsText(q,q.exp);
  if(q.kind==='multi')return q.parts.map(p=>p.ans).join(' | ');
  if(q.kind==='tf')return q.items.map(it=>it.ok?'Так':'Ні').join(', ');
  return String(q.ans);
}

  let h='<div class="g">';
  h+=['1','2','3','4','5'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+'<button type="button" class="fn" data-k="bs" aria-label="Стерти">⌫</button>';
  h+=['6','7','8','9','0'].map(d=>`<button type="button" data-ch="${d}">${d}</button>`).join('')+`<button type="button" class="fn" data-k="next" aria-label="Наступне поле"${multiField?'':' disabled'}>→</button>`;
  kp.innerHTML=h+'</div>';kp.hidden=false;
}
if(touch){
  const stop=e=>e.preventDefault();
  kp.addEventListener('pointerdown',stop);kp.addEventListener('mousedown',stop);
  kp.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!state||state.checked||!act||b.disabled)return;
    const k=b.dataset.k,el=act,qi=+el.dataset.q;
    if(k==='bs'){
      if(isCell(el)){
        if(el.value)setVal(el,'');
        else{const p=fieldAt(qi,+el.dataset.k-1);if(p){setVal(p,'');setAct(p)}}
      }else setVal(el,el.value.slice(0,-1));
    }else if(k==='next'){
      if(el.dataset.k!==undefined){const nx=fieldAt(qi,+el.dataset.k+1);if(nx)setAct(nx)}
    }else if(isCell(el)){
      setVal(el,b.dataset.ch);
      const nx=fieldAt(qi,+el.dataset.k+1);if(nx)setAct(nx);
    }else if(el.value.length<9){
      setVal(el,el.value+b.dataset.ch);
    }
  });
}

/* ===================== Початок і перевірка ===================== */
['#sur','#nam'].forEach(s=>$(s).addEventListener('input',e=>{e.target.classList.remove('need');$('#studentMsg').textContent=''}));
function needName(){
  const sur=$('#sur').value.trim(),nam=$('#nam').value.trim();
  if(!sur||!nam){
    if(!sur)$('#sur').classList.add('need');
    if(!nam)$('#nam').classList.add('need');
    $('#studentMsg').textContent='Введіть прізвище та ім’я, щоб почати.';
    return null;
  }
  return {sur,nam};
}
$('#startBtn').addEventListener('click',()=>{
  const s=needName();if(!s)return;
  student=s;resetWatch();showTask(0);
});
$('#rvBack').addEventListener('click',()=>showTask(N-1));
$('#checkBtn').addEventListener('click',()=>{
  const empty=QUESTIONS.filter((q,i)=>!isFilled(q,state.val[i])).length;
  if(empty&&!warnedEmpty){
    warnedEmpty=true;
    $('#warn').textContent=`Ви не завершили ${empty} ${plural(empty,'завдання','завдання','завдань')}.`;
    $('#checkBtn').textContent='Все одно перевірити';
    return;
  }
  finish(student.sur,student.nam);
});

function totalScore(){return QUESTIONS.reduce((s,q,i)=>s+earnedAt(i),0)}
function showResult(){
  showScreen('sResult');
  const score=totalScore();
  $('#result').innerHTML=`<div class="who">${esc(student.sur)} ${esc(student.nam)}</div>
    <div class="big">${comma(score)} з ${MAX}</div>
    <div style="font-weight:800;color:var(--muted)">${ptsWord(MAX)}</div>
    <div class="shot">Зробіть скриншот результату та надішліть його вчителю</div>
    <div class="chips cardchips">${chipsHtml({big:true})}</div>
    <div class="rbtns"><button class="btn ghost" id="errBtn">Дивитись помилки</button><button class="btn" id="againBtn">Пройти ще раз</button></div>`;
  $('#errBtn').addEventListener('click',()=>{const f=QUESTIONS.findIndex((q,i)=>earnedAt(i)<q.pts);showTask(f<0?0:f)});
  $('#againBtn').addEventListener('click',()=>{build(false);resetWatch();showTask(0)});
}

function finish(sur,nam){
  const now=Date.now();
  back();
  const pts=QUESTIONS.map((q,i)=>earnedAt(i));
  const marks=QUESTIONS.map((q,i)=>pts[i]===q.pts?1:(pts[i]>0?0.5:0));
  const score=pts.reduce((s,x)=>s+x,0);
  const rec={
    id:now+'_'+Math.random().toString(36).slice(2,8),
    name:`${sur} ${nam}`,surname:sur,firstName:nam,
    ts:now,date:new Date(now).toISOString(),
    score,max:MAX,percent:Math.round(score/MAX*100),tasks:marks,
    pts:pts,ptsMax:QUESTIONS.map(q=>q.pts),
    qtext:QUESTIONS.map(qText),
    answers:QUESTIONS.map((q,i)=>answerText(q,state.val[i])),
    correct:QUESTIONS.map(correctText),
    durationSec:Math.max(0,Math.round((now-W.t0)/1000)),
    leaves:W.leaves,
    awaySec:W.awaySec,
    variant:seed,
    test:TEST_NAME
  };
  state.checked=true;
  W.on=false;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  showResult();
  saveResult(rec);
}

/* ===================== Журнал учителя ===================== */
const overlay=$('#overlay'),modal=$('#modal');
let rows=[];
$('#keyBtn').addEventListener('click',()=>{
  modal.innerHTML=`<h2>🔑 Журнал учителя</h2>
    <div class="mrow"><input type="password" id="pw" placeholder="Пароль" autocomplete="off">
    <button class="sbtn" id="pwOk">Увійти</button><button class="sbtn g" id="close1">Закрити</button></div>
    <div class="pmsg" id="pmsg"></div>`;
  overlay.classList.add('on');
  const pw=$('#pw');pw.focus();
  const go=()=>{if(pw.value===TEACHER_PASSWORD)showJournal();else{$('#pmsg').textContent='Неправильний пароль';pw.select()}};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go()};
  $('#close1').onclick=closeModal;
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
function closeModal(){overlay.classList.remove('on');modal.innerHTML=''}
const fmtDate=ts=>new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>(s===undefined||s===null)?'—':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

async function showJournal(){
  modal.innerHTML=`<h2>🔑 Журнал учителя. Множення натуральних чисел (5 клас)</h2>
    <div class="mrow"><button class="sbtn" id="refresh">Оновити</button><button class="sbtn g" id="csv">Завантажити CSV</button><button class="sbtn g" id="clr">Очистити</button><button class="sbtn g" id="close2">Закрити</button><span id="cnt" style="font-weight:800;color:var(--muted)"></span></div>
    <div class="mrow" id="clrBox" hidden></div>
    <div id="jbody">Завантаження…</div>`;
  $('#close2').onclick=closeModal;$('#refresh').onclick=showJournal;$('#csv').onclick=downloadCSV;
  $('#clr').onclick=()=>{
    const b=$('#clrBox');b.hidden=false;
    b.innerHTML=`<span class="pmsg">Видалити всі записи (${rows.length})? Це не можна скасувати.</span><button class="sbtn r" id="clrYes">Так, видалити</button><button class="sbtn g" id="clrNo">Скасувати</button>`;
    $('#clrNo').onclick=()=>{b.hidden=true;b.innerHTML=''};
    $('#clrYes').onclick=async()=>{
      b.innerHTML='<span>Видалення…</span>';
      try{await clearResults();await showJournal()}
      catch(e){b.innerHTML='<span class="pmsg">Не вдалося очистити записи. Перевірте правила бази Firebase.</span>'}
    };
  };
  try{rows=await loadResults()}catch(e){$('#jbody').innerHTML='<div class="pmsg">Не вдалося підключитися до бази результатів.</div>';return}
  $('#cnt').textContent=`Записів: ${rows.length}`;
  if(!rows.length){$('#jbody').innerHTML='<p>Результатів поки немає.</p>';return}
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const head=`<tr><th>№</th><th>Прізвище та ім'я</th><th>Дата</th><th>Час</th><th title="Скільки разів учень виходив з вікна тесту">Виходів</th><th title="Скільки часу учень був поза вікном тесту">Поза вікном</th><th>Бал</th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>`;
  const body=rows.map((r,k)=>{
    const quick=r.durationSec!==undefined&&r.durationSec<120;
    const many=r.leaves!==undefined&&r.leaves>=3;
    const main=`<tr><td>${k+1}</td><td class="nm" data-k="${k}" title="Показати відповіді">${esc(r.name||'')}</td><td>${fmtDate(r.ts)}</td><td${quick?' class="red" title="Дуже швидко"':''}>${fmtDur(r.durationSec)}</td><td${many?' class="red"':''}>${r.leaves===undefined?'—':r.leaves}</td><td>${fmtDur(r.awaySec)}</td><td><b>${comma(r.score)}/${r.max||MAX}</b></td>${
      idx.map(i=>{const m=(r.tasks||[])[i];const tip=(r.pts&&r.ptsMax)?` title="${comma(r.pts[i])} з ${r.ptsMax[i]}"`:'';return m===undefined?'<td>—</td>':(m===1?`<td class="y"${tip}>✓</td>`:(m>0?`<td class="h"${tip}>½</td>`:`<td class="n"${tip}>✗</td>`))}).join('')}</tr>`;
    let det='';
    if(r.qtext){
      det=`<table><tr><th>№</th><th>Завдання</th><th>Відповідь учня</th><th>Правильна відповідь</th><th>Бали</th></tr>${
        r.qtext.map((t,i)=>`<tr><td>${i+1}</td><td class="w">${esc(t)}</td><td class="w">${esc((r.answers||[])[i]||'—')}</td><td class="w">${esc((r.correct||[])[i]||'')}</td><td>${r.pts?comma(r.pts[i])+' з '+r.ptsMax[i]:'—'}</td></tr>`).join('')}</table>`;
      if(r.variant!==undefined)det+=`<div style="margin-top:6px;color:var(--muted)">Варіант № ${r.variant}. Щоб відкрити цей варіант, додайте до адреси тесту ?v=${r.variant}</div>`;
    }else det='<span style="color:var(--muted)">Для цього запису деталей немає.</span>';
    return main+`<tr class="det" id="det${k}" hidden><td colspan="${7+cols}">${det}</td></tr>`;
  }).join('');
  $('#jbody').innerHTML=`<div class="tblwrap"><table>${head}${body}</table></div>`;
  $('#jbody').querySelectorAll('td.nm').forEach(td=>td.addEventListener('click',()=>{const d=$('#det'+td.dataset.k);if(d)d.hidden=!d.hidden}));
}
function downloadCSV(){
  if(!rows.length)return;
  const cols=Math.max(...rows.map(r=>(r.tasks||[]).length||N));
  const idx=Array.from({length:cols},(_,i)=>i);
  const hdr=['Прізвище та ім\'я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал',...idx.map(i=>'Завд. '+(i+1))];
  const lines=[hdr].concat(rows.map(r=>[r.name,fmtDate(r.ts),r.durationSec===undefined?'':fmtDur(r.durationSec),r.leaves===undefined?'':r.leaves,r.awaySec===undefined?'':fmtDur(r.awaySec),`${comma(r.score)}/${r.max||MAX}`,...idx.map(i=>{const m=(r.tasks||[])[i];return m===undefined?'':(m===1?'+':(m>0?'0,5':'-'))})]));
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Множення_натуральних_чисел_5клас_результати.csv';a.click();
}

build(true);
showScreen('sStart');
if(!touch)$('#sur').focus();
})();
</script>
</body>
</html>
