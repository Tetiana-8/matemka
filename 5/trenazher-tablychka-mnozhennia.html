<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Табличка множення</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');
        
        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #f0fdf4 0%, #fdf2f8 100%);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Прибираємо стандартні стрілочки вибору цифр */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #timer-bar {
            transition: width 1s linear, background-color 0.3s;
        }
        
        .active-btn {
            background-color: #ec4899 !important;
            color: white !important;
            border-color: #ec4899 !important;
        }

        .key-btn {
            background-color: white;
            border: 2px solid #fbcfe8;
            color: #be185d;
            transition: all 0.1s;
            user-select: none;
            touch-action: none;
        }
        .key-btn:active {
            transform: scale(0.95);
            background-color: #fce7f3;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2">

    <div id="app" class="bg-white rounded-3xl shadow-2xl p-4 w-full max-w-sm text-center border-4 border-rose-400 relative overflow-hidden">
        <!-- Смужка таймера зверху -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gray-100">
            <div id="timer-bar" class="h-full bg-emerald-400 w-full"></div>
        </div>

        <!-- Налаштування часу та статистика -->
        <div class="flex flex-col gap-3 mb-4 mt-2">
            <div class="flex justify-between items-center text-xs font-bold text-gray-400 tracking-tight">
                <span>Успіх: <span id="score" class="text-emerald-500 text-sm">0</span></span>
                <div id="timeSettings" class="flex gap-1.5">
                    <button onclick="setTimeLimit(5)" class="time-btn border-2 border-rose-100 px-3 py-2 rounded-lg text-sm transition-all">5с</button>
                    <button onclick="setTimeLimit(10)" class="time-btn border-2 border-rose-100 px-3 py-2 rounded-lg text-sm transition-all">10с</button>
                    <button onclick="setTimeLimit(15)" class="time-btn active-btn border-2 border-rose-100 px-3 py-2 rounded-lg text-sm transition-all">15с</button>
                    <button onclick="setTimeLimit(20)" class="time-btn border-2 border-rose-100 px-3 py-2 rounded-lg text-sm transition-all">20с</button>
                </div>
                <span>Рекорд: <span id="best" class="text-rose-400 text-sm">0</span></span>
            </div>
        </div>

        <!-- Область завдання -->
        <div class="bg-emerald-50 rounded-2xl p-6 mb-4 border-2 border-dashed border-emerald-200">
            <div id="question" class="text-5xl font-bold text-gray-800 tracking-tighter">
                -- × -- =
            </div>
        </div>

        <!-- Поле вводу (ReadOnly) -->
        <div class="mb-4">
            <input type="text" id="answerInput" 
                   class="w-full text-center text-5xl p-2 rounded-2xl border-4 border-rose-100 focus:border-rose-400 focus:outline-none transition-all bg-white text-gray-800"
                   placeholder="" readonly>
        </div>

        <!-- Клавіатура -->
        <div class="grid grid-cols-3 gap-2 mb-2">
            <button onclick="pressKey('1')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">1</button>
            <button onclick="pressKey('2')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">2</button>
            <button onclick="pressKey('3')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">3</button>
            <button onclick="pressKey('4')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">4</button>
            <button onclick="pressKey('5')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">5</button>
            <button onclick="pressKey('6')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">6</button>
            <button onclick="pressKey('7')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">7</button>
            <button onclick="pressKey('8')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">8</button>
            <button onclick="pressKey('9')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">9</button>
            <button onclick="pressKey('back')" class="key-btn py-3 rounded-xl text-2xl font-bold bg-rose-50 shadow-sm">⌫</button>
            <button onclick="pressKey('0')" class="key-btn py-3 rounded-xl text-2xl font-bold shadow-sm">0</button>
            <button id="checkBtn" onclick="handleCheck(false)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-xl shadow-lg active:transform active:scale-95 transition-all">OK</button>
        </div>

        <!-- Фідбек -->
        <div id="feedback" class="min-h-[60px] flex items-center justify-center text-center text-lg font-bold leading-tight px-2"></div>
    </div>

    <script>
        let currentA = 0;
        let currentB = 0;
        let score = 0;
        let best = 0;
        let timeLimit = 15; 
        let timeLeft = 15;
        let timerInterval;
        let nextTimeout;

        const praises = [
            "Це було мега-круто! 🔥",
            "Ти — справжній математичний маг! ✨",
            "Неймовірна швидкість! ⚡",
            "Просто космічний результат! 👨‍🚀",
            "Блискуче рішення! 💎",
            "Ти б'єш усі рекорди! 🏆",
            "Абсолютна досконалість! 🌈",
            "Ти — майбутній геній! 🧠",
            "Вау! Це було ідеально! 🌟",
            "Так тримати! Ти — суперзірка! ⭐",
            "Фантастична робота! 💪",
            "Ти знаєш табличку краще за всіх! 🎓",
            "Це було професійно! 😎",
            "Ого! Справжній чемпіон! 🥇",
            "Твій мозок працює як комп'ютер! 💻",
            "Неймовірно розумно! 🎈",
            "Ти просто вогонь! 🔥",
            "Математика тебе любить! ❤️",
            "Чудова перемога! 🎊",
            "Майстер множення! 🏅",
            "Ти просто супер-мозок! 🛸",
            "Це було легендарно! 🌟",
            "Ти просто космос! 🌌",
            "Справжній інтелектуал! 🧐",
            "Браво! Ти найкращий(а)! 👏"
        ];

        const questionEl = document.getElementById('question');
        const inputEl = document.getElementById('answerInput');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const timerBar = document.getElementById('timer-bar');

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pressKey(key) {
            if (inputEl.disabled) return;
            if (key === 'back') {
                inputEl.value = inputEl.value.slice(0, -1);
            } else {
                if (inputEl.value.length < 3) {
                    inputEl.value += key;
                }
            }
        }

        function setTimeLimit(seconds) {
            timeLimit = seconds;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.toggle('active-btn', parseInt(btn.innerText) === seconds);
            });
            generateNewQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = timeLimit;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleCheck(true);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const percentage = (timeLeft / timeLimit) * 100;
            timerBar.style.width = `${percentage}%`;
            if (timeLeft <= 3) {
                timerBar.style.backgroundColor = '#f43f5e'; 
            } else {
                timerBar.style.backgroundColor = '#10b981'; 
            }
        }

        function generateNewQuestion() {
            clearTimeout(nextTimeout);
            currentA = randomInt(2, 10);
            currentB = randomInt(2, 10);
            questionEl.innerText = `${currentA} × ${currentB} =`;
            
            questionEl.classList.remove('animate-pop');
            void questionEl.offsetWidth; 
            questionEl.classList.add('animate-pop');
            
            inputEl.value = '';
            inputEl.disabled = false;
            feedbackEl.innerText = "";
            startTimer();
        }

        function showFeedback(isCorrect, timeUp) {
            clearInterval(timerInterval);
            inputEl.disabled = true;

            if (isCorrect) {
                const randomPraise = praises[randomInt(0, praises.length - 1)];
                feedbackEl.innerText = randomPraise;
                feedbackEl.className = "min-h-[60px] flex items-center justify-center text-center text-xl font-bold text-emerald-600 animate-pop px-2";
                
                score++;
                if (score > best) best = score;
                nextTimeout = setTimeout(generateNewQuestion, 2000);
            } else {
                const correct = currentA * currentB;
                feedbackEl.innerText = (timeUp ? 'Час вийшов ⏰ ' : '') + `Правильно: ${correct} 🧐 Спробуй ще!`;
                feedbackEl.className = "min-h-[60px] flex items-center justify-center text-center text-lg font-bold text-rose-500 px-2";
                score = 0;
                nextTimeout = setTimeout(generateNewQuestion, 3000);
            }
            
            scoreEl.innerText = score;
            bestEl.innerText = best;
        }

        function handleCheck(timeUp) {
            if (inputEl.disabled) return;
            const userAnswer = parseInt(inputEl.value);
            const correctAnswer = currentA * currentB;

            if (userAnswer === correctAnswer) {
                showFeedback(true);
            } else {
                showFeedback(false, timeUp === true);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') pressKey(e.key);
            if (e.key === 'Backspace') pressKey('back');
            if (e.key === 'Enter') handleCheck(false);
        });

        window.onload = generateNewQuestion;
    </script>
</body>
</html>
