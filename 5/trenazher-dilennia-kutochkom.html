<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Тренажер: Ділення в стовпчик (Версія 31)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cell-size: 44px;
        }

        @media (max-width: 768px) { :root { --cell-size: 40px; } }
        @media (max-width: 640px) { :root { --cell-size: 36px; } }
        @media (max-width: 480px) { :root { --cell-size: 32px; } }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
        }

        .scroll-viewport {
            width: 100%;
            height: auto;
            min-height: 500px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 20px 300px 20px;
        }

        .math-grid {
            display: grid;
            grid-template-columns: repeat(13, var(--cell-size));
            grid-template-rows: repeat(15, var(--cell-size));
            gap: 1px;
            background-color: #cbd5e1;
            border: 3px solid #64748b;
            width: max-content;
            height: max-content;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: calc(var(--cell-size) * 0.65);
            font-weight: 700;
            border: 0.5px solid #f1f5f9;
            position: relative;
        }

        .input-cell {
            width: 100%;
            height: 100%;
            text-align: center;
            border: none;
            outline: none;
            background-color: #fefce8;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            border-radius: 0;
            -webkit-appearance: none;
            transition: background-color 0.2s;
        }

        .input-cell:focus {
            background-color: #fef9c3;
            box-shadow: inset 0 0 0 2px #3b82f6;
            z-index: 10;
        }

        .quotient-input {
            background-color: #e0f2fe !important;
        }

        .quotient-input:focus {
            background-color: #bae6fd !important;
        }
        
        .line-bottom { border-bottom: 3px solid black !important; }
        .line-left { border-left: 3px solid black !important; }
        .auto-underline { border-bottom: 4px solid black !important; }
        
        .minus-sign::before {
            content: "−";
            position: absolute;
            left: -14px;
            font-size: calc(var(--cell-size) * 0.5);
            font-weight: 900;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .control-panel {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .status-success { color: #16a34a; animation: bounce 0.5s ease-in-out; }
        .status-error { color: #dc2626; }
        .status-process { color: #3b82f6; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="p-2 sm:p-4">

    <div class="max-w-6xl w-full bg-white rounded-2xl sm:rounded-3xl shadow-xl p-3 sm:p-8 border border-slate-200 mx-auto">
        
        <!-- Панель керування -->
        <div class="control-panel bg-white p-4 sm:p-6 rounded-2xl border border-slate-100 mb-6 sm:mb-10 shadow-sm">
            <div class="flex flex-col w-full sm:w-auto">
                <label class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest text-center sm:text-left">Складність</label>
                <select id="difficulty" class="w-full sm:w-56 pl-4 pr-10 py-2 text-lg border-2 border-slate-200 focus:ring-blue-500 focus:border-blue-500 rounded-xl bg-slate-50 font-bold outline-none transition-all">
                    <option value="1000">До 1000</option>
                    <option value="10000">До 10 000</option>
                    <option value="50000" selected>До 50 000</option>
                </select>
            </div>

            <div id="status-area" class="flex-1 px-4 text-center min-h-[2.5rem] flex items-center justify-center">
                <span id="status-text" class="text-lg sm:text-xl font-black uppercase tracking-tight transition-all duration-300"></span>
            </div>

            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-center sm:justify-end">
                <button onclick="Очистити()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-3 px-4 rounded-xl transition-all active:scale-95 text-xs sm:text-sm uppercase tracking-wide">
                    Очистити
                </button>
                <button onclick="РучнаПеревірка()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 px-6 rounded-xl shadow-md transition-all active:scale-95 text-xs sm:text-sm uppercase tracking-wide">
                    Перевірити
                </button>
                <button onclick="Оновити()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-6 rounded-xl shadow-md transition-all active:scale-95 text-xs sm:text-sm uppercase tracking-wide">
                    Нове завдання
                </button>
            </div>
        </div>

        <!-- Робоча зона -->
        <div id="exercise-area" class="w-full">
            <div class="scroll-viewport" id="scroll-container">
                <div id="grid-container" class="math-grid rounded-lg overflow-hidden">
                    <!-- Клітинки генеруються JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function ВипадковеЦіле(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let currentDividend = 0;
        let currentDivisor = 0;
        let currentQuotient = 0;
        let steps = [];
        let isFinalZeroVisible = false;
        const startColGlobal = 2; 

        function РозрахуватиКроки(dividend, divisor) {
            let res = [];
            let divStr = dividend.toString();
            let currentStr = "";
            let currentIdx = 0;
            let qIdx = 0;

            while (currentIdx < divStr.length) {
                currentStr += divStr[currentIdx];
                let currentVal = parseInt(currentStr);

                if (currentVal >= divisor || (currentIdx === divStr.length - 1 && res.length === 0)) {
                    let q = Math.floor(currentVal / divisor);
                    let p = q * divisor;
                    let r = currentVal - p;
                    res.push({
                        partialDividend: currentVal,
                        digit: q,
                        product: p,
                        remainder: r,
                        posInDividend: currentIdx,
                        qIdx: qIdx
                    });
                    currentStr = r === 0 ? "" : r.toString();
                    qIdx++;
                } else if (res.length > 0) {
                    qIdx++;
                }
                currentIdx++;
            }
            return res;
        }

        function Очистити() {
            const inputs = document.querySelectorAll('.input-cell');
            inputs.forEach(input => {
                input.value = "";
                input.style.backgroundColor = input.dataset.type === 'quotient' ? '#e0f2fe' : '#fefce8';
                input.parentElement.classList.remove('auto-underline', 'minus-sign');
            });
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (cell.classList.contains('text-green-600')) {
                    cell.innerText = "";
                    cell.classList.remove('text-green-600', 'font-black');
                }
            });

            isFinalZeroVisible = false;
            document.getElementById('status-text').innerText = "";
        }

        function Оновити() {
            const statusText = document.getElementById('status-text');
            statusText.innerText = "";
            statusText.className = "text-lg sm:text-xl font-black uppercase tracking-tight text-slate-900";
            isFinalZeroVisible = false;

            const maxVal = parseInt(document.getElementById('difficulty').value);
            
            let attempt = 0;
            do {
                currentDivisor = ВипадковеЦіле(2, maxVal > 10000 ? 35 : (maxVal > 1000 ? 19 : 9));
                if (currentDivisor === 10) currentDivisor = 11;
                currentQuotient = ВипадковеЦіле(Math.max(11, Math.floor(maxVal/currentDivisor/4)), Math.floor(maxVal/currentDivisor));
                currentDividend = currentDivisor * currentQuotient;
                attempt++;
            } while (attempt < 100 && (currentDividend % 10 === 0 || currentDividend < 100));

            steps = РозрахуватиКроки(currentDividend, currentDivisor);
            СтворитиСітку();
            
            const wrapper = document.getElementById('scroll-container');
            if(wrapper) {
                wrapper.scrollLeft = 0;
                wrapper.scrollTop = 0;
            }
        }

        function РозумнийФокус(element) {
            if (!element) return;
            element.focus({ preventScroll: true });
            setTimeout(() => {
                element.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center',
                    inline: 'center'
                });
            }, 50);
        }

        function ПерейтиДоНаступного(currentInput) {
            if (currentInput.value.length === 0) return;

            const row = parseInt(currentInput.dataset.row);
            const col = parseInt(currentInput.dataset.col);
            const idx = parseInt(currentInput.dataset.idx);

            if (currentInput.dataset.type === 'quotient') {
                const step = steps.find(s => s.qIdx === idx);
                if (step) {
                    const sIdx = steps.indexOf(step);
                    const targetRow = 2 + (sIdx * 2);
                    const pStr = step.product.toString();
                    const targetCol = startColGlobal + step.posInDividend - (pStr.length - 1);
                    РозумнийФокус(document.querySelector(`input[data-row="${targetRow}"][data-col="${targetCol}"]`));
                }
                return;
            }

            const stepIdx = Math.floor((row - 2) / 2);
            if (stepIdx < 0 || stepIdx >= steps.length) return;
            const currentStep = steps[stepIdx];

            if (row % 2 === 0) {
                const rowValue = getRowValue(row);
                if (rowValue.length >= currentStep.product.toString().length) {
                    const nextRow = row + 1;
                    const nextStep = steps[stepIdx + 1];
                    const targetCol = nextStep 
                        ? (startColGlobal + nextStep.posInDividend - (nextStep.partialDividend.toString().length - 1))
                        : col;
                    РозумнийФокус(document.querySelector(`input[data-row="${nextRow}"][data-col="${targetCol}"]`));
                } else {
                    РозумнийФокус(document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`));
                }
            } else {
                const rowValue = getRowValue(row);
                const limit = (steps[stepIdx+1]) ? steps[stepIdx+1].partialDividend.toString().length : 1;
                
                if (rowValue.length >= limit) {
                    const nextStep = steps[stepIdx + 1];
                    if (nextStep) {
                        РозумнийФокус(document.querySelector(`input[data-type="quotient"][data-idx="${nextStep.qIdx}"]`));
                    }
                } else {
                    РозумнийФокус(document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`));
                }
            }
        }

        function getRowValue(row) {
            let val = "";
            document.querySelectorAll(`input[data-row="${row}"]`).forEach(i => val += i.value);
            return val;
        }

        function ОбробитиКлавішу(e) {
            if (e.key === "Backspace" && e.target.value === "") {
                if (e.target.dataset.type === 'quotient') {
                    const prevIdx = parseInt(e.target.dataset.idx) - 1;
                    РозумнийФокус(document.querySelector(`input[data-type="quotient"][data-idx="${prevIdx}"]`));
                } else {
                    const row = parseInt(e.target.dataset.row);
                    const col = parseInt(e.target.dataset.col);
                    const prevInput = document.querySelector(`input[data-row="${row}"][data-col="${col - 1}"]`);
                    if (prevInput) РозумнийФокус(prevInput);
                }
            }
        }

        function СтворитиСітку() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            const divStr = currentDividend.toString();
            const dvrStr = currentDivisor.toString();
            const startCol = startColGlobal;
            const startRow = 1;

            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 13; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    grid.appendChild(cell);
                }
            }

            for (let i = 0; i < divStr.length; i++) {
                document.getElementById(`cell-${startRow}-${startCol + i}`).innerText = divStr[i];
            }

            const divisorCol = startCol + divStr.length;
            for (let r = startRow; r <= startRow + 1; r++) {
                const cell = document.getElementById(`cell-${r}-${divisorCol}`);
                if (cell) cell.classList.add('line-left');
            }

            for (let i = 0; i < dvrStr.length; i++) {
                const cell = document.getElementById(`cell-${startRow}-${divisorCol + i}`);
                if (cell) {
                    cell.innerText = dvrStr[i];
                    cell.classList.add('line-bottom');
                }
            }

            const quotientStr = currentQuotient.toString();
            for (let i = 0; i < quotientStr.length; i++) {
                const cell = document.getElementById(`cell-${startRow + 1}-${divisorCol + i}`);
                if (!cell) continue;
                const input = document.createElement('input');
                input.className = 'input-cell quotient-input';
                input.inputMode = "numeric";
                input.maxLength = 1;
                input.dataset.type = 'quotient';
                input.dataset.idx = i;
                input.dataset.correct = quotientStr[i];
                input.oninput = (e) => {
                    ПеревіритиЧастку(e.target);
                    ПерейтиДоНаступного(e.target);
                };
                input.onkeydown = ОбробитиКлавішу;
                cell.appendChild(input);
            }

            for (let r = startRow + 1; r < 14; r++) {
                for (let c = startCol - 1; c < divisorCol; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (!cell) continue;
                    const input = document.createElement('input');
                    input.className = 'input-cell';
                    input.inputMode = "numeric";
                    input.maxLength = 1;
                    input.dataset.row = r;
                    input.dataset.col = c;
                    input.oninput = (e) => {
                        ПеревіритиКрок(e.target);
                        ПерейтиДоНаступного(e.target);
                    };
                    input.onkeydown = ОбробитиКлавішу;
                    cell.appendChild(input);
                }
            }
            
            setTimeout(() => {
                const firstInput = document.querySelector('input[data-type="quotient"][data-idx="0"]');
                if (firstInput) РозумнийФокус(firstInput);
            }, 300);
        }

        function ПеревіритиКрок(input) {
            const row = parseInt(input.dataset.row);
            const rowInputs = document.querySelectorAll(`input[data-row="${row}"]`);
            let rowValueStr = getRowValue(row);

            if (rowValueStr === "") {
                rowInputs.forEach(i => i.parentElement.classList.remove('auto-underline', 'minus-sign'));
                return;
            }

            const rowValueNum = parseInt(rowValueStr);
            const isSubtractionRow = (row % 2 === 0);
            const stepIdx = Math.floor((row - 2) / 2);
            const currentStep = steps[stepIdx];

            if (isSubtractionRow && currentStep) {
                if (rowValueNum === currentStep.product) {
                    rowInputs.forEach(i => {
                        if (i.value !== "") i.parentElement.classList.add('auto-underline');
                    });
                    const firstFilled = Array.from(rowInputs).find(i => i.value !== "");
                    if (firstFilled) firstFilled.parentElement.classList.add('minus-sign');

                    if (stepIdx === steps.length - 1 && !isFinalZeroVisible) {
                        setTimeout(ПоказатиФінальнийНуль, 400, row + 1, input.dataset.col);
                    }
                }
            }
        }

        function ПоказатиФінальнийНуль(row, col) {
            const cell = document.getElementById(`cell-${row}-${col}`);
            if (cell) {
                cell.innerHTML = "0";
                cell.classList.add('text-green-600', 'font-black');
                isFinalZeroVisible = true;
                ПеревіритиЗавершення();
            }
        }

        function ПеревіритиЧастку(input) {
            if (input.value === "") {
                input.style.backgroundColor = '#e0f2fe';
                return;
            }
            if (input.value === input.dataset.correct) {
                input.style.backgroundColor = '#dcfce7';
                ПеревіритиЗавершення();
            } else {
                input.style.backgroundColor = '#fee2e2';
                ПоказатиСтатус("Уважніше!", "status-error");
            }
        }

        /**
         * РучнаПеревірка з логікою "Ти на правильному шляху"
         */
        function РучнаПеревірка() {
            const qInputs = Array.from(document.querySelectorAll('input[data-type="quotient"]'));
            const columnInputs = Array.from(document.querySelectorAll('.input-cell:not([data-type="quotient"])'));
            
            let hasErrors = false;
            let hasAnyValue = false;

            // Перевірка частки
            qInputs.forEach(input => {
                if (input.value !== "") {
                    hasAnyValue = true;
                    if (input.value !== input.dataset.correct) {
                        input.style.backgroundColor = '#fee2e2';
                        hasErrors = true;
                    } else {
                        input.style.backgroundColor = '#dcfce7';
                    }
                }
            });

            // Перевірка стовпчика (лише наявних значень)
            columnInputs.forEach(input => {
                if (input.value !== "") {
                    hasAnyValue = true;
                    // Тут перевірка складніша, бо клітинки не мають dataset.correct
                    // Але ми можемо викликати ПеревіритиКрок для візуалізації
                    ПеревіритиКрок(input);
                }
            });

            // Визначаємо статус
            const allQuotientCorrect = qInputs.every(i => i.value === i.dataset.correct);
            const isFullyComplete = allQuotientCorrect && isFinalZeroVisible;

            if (hasErrors) {
                ПоказатиСтатус("Є помилки, перевір уважно", "status-error");
            } else if (isFullyComplete) {
                ПоказатиСтатус("Відмінно! Правильно ✨", "status-success");
            } else if (hasAnyValue) {
                ПоказатиСтатус("Ти на правильному шляху!", "status-process");
            } else {
                ПоказатиСтатус("Почни розв'язувати", "text-slate-500");
            }
        }

        function ПоказатиСтатус(text, className) {
            const statusText = document.getElementById('status-text');
            statusText.innerText = text;
            statusText.className = `text-lg sm:text-xl font-black uppercase tracking-tight ${className}`;
        }

        function ПеревіритиЗавершення() {
            const inputs = document.querySelectorAll('input[data-type="quotient"]');
            const allCorrect = Array.from(inputs).every(i => i.value === i.dataset.correct);
            
            if (allCorrect && isFinalZeroVisible) {
                ПоказатиСтатус("Відмінно! Правильно ✨", "status-success");
            }
        }

        window.onload = Оновити;
    </script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ (початок) =====================

<div id="pm-paper"></div>

  <div class="pm-head">
    <button type="button" data-a="side" title="Перемістити на інший бік">⇄</button>
    <button type="button" data-a="hide" title="Сховати панельку">✕</button>

  <div class="pm-colors">
    <button type="button" class="pm-c" data-a="color" data-c="#e53935" style="background:#e53935" title="Червоний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1e5fd6" style="background:#1e5fd6" title="Синій"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#222222" style="background:#222" title="Чорний"></button>
    <button type="button" class="pm-c" data-a="color" data-c="#1f9d55" style="background:#1f9d55" title="Зелений"></button>
  </div>
  <div class="pm-grid">
    <button type="button" class="pm-b" data-a="pen"><b>✏️</b><i>Писати</i></button>
    <button type="button" class="pm-b" data-a="eraser"><b>🧽</b><i>Гумка</i></button>
    <button type="button" class="pm-b" data-a="width" title="Тонка / товста лінія"><b><span class="pm-bar"></span></b><i>Товщина</i></button>
    <button type="button" class="pm-b" data-a="smart" title="Рівні фігури: трикутник, коло, пряма"><b>△</b><i>Рівні фігури</i></button>
    <button type="button" class="pm-b" data-a="paper" title="Виділити прямокутник білим"><b>⬜</b><i>Біле поле</i></button>
    <button type="button" class="pm-b" data-a="board" title="Закрити весь екран білим"><b>🗒️</b><i>Вся дошка</i></button>
    <button type="button" class="pm-b" data-a="grid" title="Клітинка: відкриває білу дошку в клітинку, а якщо біле поле вже є, вмикає й вимикає клітинку на ньому"><b>▦</b><i>Клітинка</i></button>
    <button type="button" class="pm-b" data-a="rmpaper" title="Прибрати біле, залишити написане"><b>👁️</b><i>Прибрати біле</i></button>
    <button type="button" class="pm-b" data-a="undo" title="Скасувати останнє"><b>↶</b><i>Назад</i></button>
    <button type="button" class="pm-b" data-a="clear" title="Стерти все написане і біле"><b>🗑️</b><i>Стерти все</i></button>
  </div>
</div>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper'), modeEl = document.getElementById('pm-mode');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; } 
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var LABEL = { pen: '✏️ Пишу', eraser: '🧽 Стираю', paper: '⬜ Малюю біле поле' };
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
    modeEl.textContent = st.tool ? LABEL[st.tool] : '👆 Керую уроком';
    modeEl.className = st.tool ? 'm-' + st.tool : '';
    modeEl.id = 'pm-mode';
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    var el = mkSheet(sx(), sy(), document.documentElement.clientWidth, document.documentElement.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'pen') setTool(st.tool === 'pen' ? null : 'pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? null : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? null : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); if (st.tool !== 'pen') st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); });
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ (кінець) ===================== -->
</body>
</html>
