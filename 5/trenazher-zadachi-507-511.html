<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 45%,#fbcfe8 100%) fixed}

button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:3px solid rgba(190,24,93,.55);outline-offset:2px}
b,strong{font-weight:900}

.stage{display:none;flex:1;min-height:0;flex-direction:column}
.stage.on{display:flex}
.card{position:relative;flex:1;min-height:0;overflow:auto;background:#fff;border:2px solid var(--line);border-radius:.9rem;
  box-shadow:0 .5rem 1.6rem rgba(120,20,70,.14);padding:.9rem 1.1rem;display:flex;flex-direction:column;align-items:center}

.inner.xw{max-width:80rem;margin:0 auto auto}
.h1{font-size:2.4rem;font-weight:900;color:var(--acc);margin:0;text-align:center;line-height:1.25;max-width:40rem}
.title2{font-size:1.5rem;font-weight:900;color:var(--acc);margin:0;text-align:center}
.o1{color:var(--o1)}.o2{color:var(--o2)}.o3{color:var(--o3)}.o4{color:var(--o4)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem}
.btn{border:0;border-radius:.6rem;padding:.5rem 1.05rem;color:#fff;font-weight:800;font-size:1.05rem;

.btn.big{font-size:1.45rem;padding:.65rem 1.9rem;border-radius:2rem}

.fb.bad{color:var(--badtx);background:var(--badbg);border-color:var(--badln)}

@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* журнал */
#keyBtn{position:fixed;top:4px;right:4px;z-index:2147483000;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.55);font-size:15px;opacity:.5;padding:0}
#keyBtn:hover{opacity:1}
.modal{position:fixed;inset:0;z-index:2147483200;background:rgba(58,23,54,.45);display:flex;align-items:center;justify-content:center;padding:.6rem}
.mbox{position:relative;width:100%;max-width:70rem;max-height:100%;overflow:auto;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:1rem 1.2rem;box-shadow:0 1rem 3rem rgba(58,23,54,.35)}
.mbox h3{margin:0 0 .6rem;font-size:1.2rem;color:var(--acc)}
.jt{width:100%;border-collapse:collapse;font-size:.85rem;font-weight:700}
.jt th{background:var(--accL);color:var(--acc);padding:.3rem .4rem;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
.jt td{padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.jt td.nm{cursor:pointer;color:var(--acc);font-weight:900}
.jt .red{color:var(--badtx);font-weight:900}
.jt .c1{color:var(--oktx);font-weight:900}.jt .c0{color:var(--badtx);font-weight:900}.jt .ch{color:#b45309;font-weight:900}
.dt{background:var(--soft2)}
.dr2{padding:.3rem .5rem;border-radius:.4rem;margin:.2rem 0;border-left:4px solid var(--okln);background:#fff;font-weight:700}
.dr2.er{background:var(--badbg);border-left-color:var(--bad)}
.dr2.er .a{color:var(--badtx);font-weight:900}

@media (max-width:900px){ .tk{grid-template-columns:1fr} }
@media (max-width:700px){
  .h1{font-size:1.9rem}
  .solw{flex-wrap:wrap}

}

<script>
(function(){ "use strict";

/* ===== спільне ядро ===== */
var cur = 0, LAST = 3, run = 1;
function $(i){ return document.getElementById(i); }
function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(a){ return a[rnd(0, a.length - 1)]; }
function plural(n, f1, f2, f5){ var m = Math.abs(n) % 100, k = m % 10; if (m > 10 && m < 20) return f5; if (k > 1 && k < 5) return f2; if (k === 1) return f1; return f5; }
function mk(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function fine(){ return window.matchMedia && window.matchMedia('(pointer:fine)').matches; }
function confetti(n){
  var cols = ['#be185d', '#e5508a', '#f9a8d4', '#1e9e62', '#f0b429', '#7c3aed'];
  for (var i = 0; i < (n || 30); i++){
    var p = document.createElement('i'); p.className = 'cf';
    p.style.left = (35 + Math.random() * 30) + 'vw'; p.style.background = cols[i % cols.length];
    p.style.setProperty('--dx', (Math.random() * 60 - 30) + 'vw'); p.style.setProperty('--dy', (35 + Math.random() * 50) + 'vh');
    p.style.animationDelay = (Math.random() * .15) + 's';
    document.body.appendChild(p);
    setTimeout((function(q){ return function(){ q.remove(); }; })(p), 1700);
  }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function strip(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); }

function c1(x){ return '<span class="o1">' + x + '</span>'; }
function c2(x){ return '<span class="o2">' + x + '</span>'; }
function c3(x){ return '<span class="o3">' + x + '</span>'; }
function c4(x){ return '<span class="o4">' + x + '</span>'; }
function QM(){ return '<b class="qm">?</b>'; }
function UN(x){ return '<span class="u">(' + x + ')</span>'; }
function pf(n, f){ return plural(n, f[0], f[1], f[2]); }
function fmtT(t){ var H = Math.floor(t / 60), M = t % 60; return H + ' год' + (M ? ' ' + M + ' хв' : ''); }
function kmm(d){ var k = Math.floor(d / 1000), m = d % 1000; return (k ? k + ' км' : '') + (k && m ? ' ' : '') + (m ? m + ' м' : ''); }
var INK = '#3a1736', O1 = '#0f766e', O2 = '#7c3aed', O3 = '#b45309', O4 = '#3b6ea8', ACC = '#be185d';

/* ===== записи в стовпчик і куточком ===== */
function digs(n){ return String(n).split(''); }
function gcell(r, c, t, cls){ return '<span style="grid-row:' + r + ';grid-column:' + c + '" class="' + (cls || '') + '">' + t + '</span>'; }
function putNum(out, n, r, endCol, cls){ var d = digs(n); for (var i = 0; i < d.length; i++) out.push(gcell(r, endCol - d.length + 1 + i, d[i], cls)); return endCol - d.length + 1; }
function gridHTML(cols, cells){ return '<div class="cg" style="grid-template-columns:repeat(' + cols + ',1.02em)">' + cells.join('') + '</div>'; }
function gridLines(W, out, ulRows){
  var res = out.map(function(s){
    var m = /grid-row:(\d+);grid-column:(\d+)/.exec(s);
    if (m && +m[2] >= 2 && ulRows.indexOf(+m[1]) >= 0) return s.replace('class="', 'class="ul ');
    return s;
  });
  ulRows.forEach(function(r){
    for (var c = 2; c <= W; c++){
      var has = out.some(function(s){ return s.indexOf('grid-row:' + r + ';grid-column:' + c + '"') >= 0; });
      if (!has) res.push(gcell(r, c, '', 'ul'));
    }
  });
  return gridHTML(W, res);
}
function colMul(a, b){
  var p = a * b, B = digs(b), parts = [], i;
  for (i = B.length - 1; i >= 0; i--) if (+B[i]) parts.push({ v: a * (+B[i]), sh: B.length - 1 - i });
  var W = Math.max(String(a).length, String(b).length, String(p).length) + 1, out = [], r = 1;
  putNum(out, a, r, W); r++;
  out.push(gcell(r, 1, '×', 'sg')); putNum(out, b, r, W); r++;
  if (parts.length > 1){
    parts.forEach(function(pt, j){ if (j === parts.length - 1) out.push(gcell(r, 1, '+', 'sg')); putNum(out, pt.v, r, W - pt.sh, j % 2 ? 'p2' : 'p1'); r++; });
  }
  putNum(out, p, r, W, 'res');
  return gridLines(W, out, [2].concat(parts.length > 1 ? [1 + 1 + parts.length] : []));
}
function colAddSub(a, b, op){
  var r = op === '+' ? a + b : a - b, W = Math.max(String(a).length, String(b).length, String(r).length) + 1, out = [];
  putNum(out, a, 1, W); out.push(gcell(2, 1, op, 'sg')); putNum(out, b, 2, W); putNum(out, r, 3, W, 'res');
  return gridLines(W, out, [2]);
}
function colDiv(a, b){
  var D = digs(a).map(Number), n = D.length, q = Math.floor(a / b), Q = digs(q), Lb = String(b).length, wR = Math.max(Lb, Q.length);
  var W = n + 1 + wR, out = [], i = 0, cu = 0, steps = [], rem;
  do { cu = cu * 10 + D[i]; i++; } while (cu < b && i < n);
  steps.push({ end: i - 1, cur: cu, prod: Math.floor(cu / b) * b }); rem = cu - steps[0].prod;
  for (; i < n; i++){
    cu = rem * 10 + D[i];
    var qd = Math.floor(cu / b);
    if (qd === 0){ rem = cu; continue; }
    steps.push({ end: i, cur: cu, prod: qd * b }); rem = cu - qd * b;
  }
  for (i = 0; i < n; i++) out.push(gcell(1, i + 2, D[i]));
  var bd = digs(b);
  for (i = 0; i < wR; i++) out.push(gcell(1, n + 2 + i, i < Lb ? bd[i] : '', 'ul' + (i === 0 ? ' vl' : '')));
  for (i = 0; i < wR; i++) out.push(gcell(2, n + 2 + i, i < Q.length ? Q[i] : '', 'res' + (i === 0 ? ' vl' : '')));
  var r = 2;
  steps.forEach(function(s, j){
    var e = s.end + 2;
    if (j > 0){ putNum(out, s.cur, r, e); }
    var st = e - String(s.prod).length + 1;
    out.push(gcell(r + (j > 0 ? 1 : 0), st - 1, '−', 'sg'));
    var pr = r + (j > 0 ? 1 : 0), d = digs(s.prod);

  if (fine()) setTimeout(function(){ inps[0].focus(); }, 60);
}
function finishWay(k){
  var st = ST[k], W = st.way, steps = st.g.ways[W.i].steps, typed = [];
  W.rows.forEach(function(r, i){
    Array.prototype.forEach.call(r.querySelectorAll('input'), function(inp){ typed.push(inp.value); inp.replaceWith(mk('b', 'okn', inp.value)); });
    var e = r.querySelector('.ex'); e.textContent = ' — ' + steps[i].ex + (i === steps.length - 1 ? '.' : ';'); e.hidden = false; e.classList.add('show');
  });
  var cb = $(k + '-col'); cb.hidden = true; cb.innerHTML = '';
  var an = $(k + '-ans'); an.innerHTML = 'Відповідь: ' + st.g.answer + '.'; an.hidden = false;
  if (!st.solved){ st.solved = true; confetti(40); }
  $(k + '-nr').hidden = false;
  if (W.i === 0) taskDone(k, typed);
  if (W.i < st.g.ways.length - 1){
    var b = mk('button', 'btn g s', 'Інший спосіб ▶'); b.onclick = function(){ openWay(k, W.i + 1); };
    var w2 = $(k + '-w2'); w2.innerHTML = ''; w2.appendChild(b);
  }
}
function taskDone(k, typed){
  var st = ST[k], T = TASK[k];
  if (st.scored && !S.res[T.idx]){
    var total = st.g.ways[0].steps.length, bad = Object.keys(st.bad).length;
    var pts = Math.round(T.w * (total - bad) / total);
    S.res[T.idx] = { bad: bad, pts: pts, ans: typed.join(' | '), cor: st.g.answer, q: T.no + ': ' + strip(st.g.cond.join(' ')) };
    saveNow();
  }
  st.done = true; updNav();
}

/* ===== навігація ===== */
function taskReady(k){ return !!(ST[k] && ST[k].done) || !!(ST[k] && ST[k].solved); }
function updNav(){
  var p = $('prevBtn'), n = $('nextBtn');
  $('bottomNav').hidden = (cur === 0 || cur === LAST);
  p.disabled = (cur <= 1);
  if (cur === 1){ n.textContent = 'Далі →'; n.disabled = !taskReady('t507'); }
  else if (cur === 2){ n.textContent = 'Результат →'; n.disabled = !taskReady('t511'); }
}
function goTo(n){
  cur = n;
  var st = document.querySelectorAll('.stage');
  for (var i = 0; i < st.length; i++) st[i].classList.toggle('on', i === n);
  if (n === 3) showResult();
  updNav();
  var c = st[n].querySelector('.card'); if (c) c.scrollTop = 0;
}
$('prevBtn').onclick = function(){ if (cur > 1) goTo(cur - 1); };
$('nextBtn').onclick = function(){ if (cur < LAST) goTo(cur + 1); };

function showResult(){
  leaveEnd(); S.over = true;
  var rec = buildRec();
  var h = '<h2 class="title2">Результат</h2>' +
    '<div class="big1">' + rec.score + ' з 100</div><div class="big1">' + rec.percent + ' %</div><div class="rt">';
  KEYS.forEach(function(k, i){
    var r = S.res[i];
    h += '<div' + (r && r.bad ? ' class="m"' : '') + '><span>' + TASK[k].no + '</span><span>' + (r ? (r.bad ? 'помилок у діях: ' + r.bad + ' — ' : 'без помилок — ') + r.pts + ' з ' + TASK[k].w : 'не розв’язано — 0 з ' + TASK[k].w) + '</span></div>';
  });
  h += '</div><div class="shot">Зробіть скріншот результату та покажіть його вчителю</div>' +
    '<button class="btn a big" id="againBtn">Пройти ще раз</button>';
  $('resBox').innerHTML = h;
  $('againBtn').onclick = function(){ run++; startRun(); };
}
function startRun(){
  newSession();
  initTask('t507', run > 1, true); initTask('t511', run > 1, true);
  goTo(1);
}

startRun();
window.__t = { ST: ST, S: S, R507: R507, R511: R511, B507: B507, B511: B511 };
})();
</script>
