<!DOCTYPE html>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        panelLeft: '#FDEFF5',
                        panelRight: '#FFF7FA',
                        brand: '#BE185D',
                        brandLight: '#FCE7F3'

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden !important;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        .math-font { font-family: 'Lora', Georgia, serif; }

        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button, label {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .high-contrast-shadow {
            box-shadow: 0 3px 5px -1px rgba(0, 0, 0, 0.08), 0 1px 3px -1px rgba(0, 0, 0, 0.04);
        }

        :root {
            /* Шрифти ростуть разом з екраном: на проєкторі / дошці 1920×1080 текст варіантів ≈ 28 px */
            --fluid-q-title: clamp(1rem, 1.6vh + 0.9vw, 2.6rem);
            --fluid-opt-text: clamp(0.9rem, 1.4vh + 0.7vw, 2.2rem);
            --fluid-tbl-text: clamp(0.8rem, 1.2vh + 0.6vw, 1.9rem);
            --fluid-btn-text: clamp(0.85rem, 1.2vh + 0.55vw, 1.75rem);
            --fluid-badge-size: clamp(1.6rem, 2.6vh + 1.2vw, 3.4rem);
            --fluid-label: clamp(0.65rem, 0.9vh + 0.45vw, 1.3rem);
        }

        .fluid-q-title { font-size: var(--fluid-q-title); }
        .fluid-opt-text { font-size: var(--fluid-opt-text); }
        .fluid-tbl-text { font-size: var(--fluid-tbl-text); }
        .fluid-btn-text { font-size: var(--fluid-btn-text); }

        .fluid-badge {
            width: var(--fluid-badge-size);
            height: var(--fluid-badge-size);
            font-size: clamp(0.8rem, 1.3vh + 0.6vw, 1.8rem);
        }
        .fluid-label { font-size: var(--fluid-label); }

        .fluid-table-row td, .fluid-table-row th {
            padding-top: clamp(0.25rem, 0.8vh, 0.75rem);
            padding-bottom: clamp(0.25rem, 0.8vh, 0.75rem);
            padding-left: clamp(0.4rem, 0.8vw, 1rem);
            padding-right: clamp(0.4rem, 0.8vw, 1rem);
        }
    </style>
</head>

            {

                    { id: 0, name: "Однакова кількість позначок на сторонах означає, що ці сторони рівні.", correct: "так" },
                    { id: 1, name: "У рівнобедреного трикутника всі три сторони рівні.", correct: "ні" },
                    { id: 2, name: "Якщо один із кутів трикутника прямий, то трикутник називають прямокутним.", correct: "так" },
                    { id: 3, name: "Тупий кут менший від прямого кута.", correct: "ні" },
                    { id: 4, name: "Периметр многокутника — це сума довжин усіх його сторін.", correct: "так" }
                ],
                svg: null

        ];

        const OPT_BASE = "w-full text-left p-2 sm:p-2.5 xl:p-3.5 rounded-xl bg-white border-2 border-slate-200 hover:border-brand/60 shadow-sm transition-all flex items-center group focus:outline-none active:scale-[0.99] my-0.5 min-h-[44px]";
        const TBL_BTN = "table-opt-btn px-2.5 py-1 rounded-lg border-2 font-bold fluid-btn-text focus:outline-none active:scale-95 w-[3.6em] min-h-[36px] transition-all";
        const MATCH_BTN = "table-opt-btn px-2 sm:px-2.5 xl:px-4 py-1 xl:py-1.5 rounded-lg border-2 font-semibold fluid-btn-text focus:outline-none active:scale-95 min-h-[38px] transition-all";
        const baseOf = b => b.dataset.kind === "match" ? MATCH_BTN : TBL_BTN;

        let currentStep = 0;
        let isAnswered = false;

        function render() {
            isAnswered = false;
            const step = steps[currentStep];

            document.getElementById("step-label").innerText = step.label;
            const q = document.getElementById("question-text");
            q.innerHTML = step.question;
            q.classList.toggle("hidden", step.question.trim() === "");

            document.getElementById("hint-btn").classList.toggle("hidden", !step.hasHint);

            const leftPanel = document.getElementById("left-panel");
            const rightPanel = document.getElementById("right-panel");

            if (!step.svg) {
                rightPanel.classList.add("hidden");
                leftPanel.classList.remove("md:w-[50%]", "lg:w-[50%]", "xl:w-[50%]", "2xl:w-[48%]", "md:border-r", "border-b", "h-[55%]");
                leftPanel.classList.add("md:w-full", "w-full", "h-full", "max-w-5xl", "mx-auto", "border-none");
            } else {
                rightPanel.classList.remove("hidden");
                leftPanel.classList.remove("md:w-full", "h-full", "max-w-5xl", "mx-auto", "border-none");
                leftPanel.classList.add("md:w-[50%]", "lg:w-[50%]", "xl:w-[50%]", "2xl:w-[48%]", "md:border-r", "border-b", "h-[55%]");
                document.getElementById("svg-container").innerHTML = step.svg;
            }

            const panel = document.getElementById("feedback-panel");
            const txt = document.getElementById("feedback-text");
            panel.className = "h-full flex-1 flex items-center justify-center sm:justify-start rounded-xl px-3 bg-transparent text-center sm:text-left overflow-hidden";
            txt.innerText = "";

            document.getElementById("restart-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.add("hidden");

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            if (step.type === "single") {
                container.className = "flex-1 min-h-0 flex flex-col justify-start gap-1.5 sm:gap-2 pt-1 sm:pt-2";
                const labels = ['А', 'Б', 'В', 'Г', 'Д'];
                step.options.forEach((opt, i) => {
                    const btn = document.createElement("button");
                    btn.className = OPT_BASE;
                    btn.innerHTML = `
                        <span class="fluid-badge rounded-full bg-brandLight text-brand flex items-center justify-center font-bold mr-2.5 shrink-0 transition-colors group-hover:bg-brand group-hover:text-white">${labels[i]}</span>
                        <span class="math-font fluid-opt-text text-slate-700 font-medium leading-snug">${opt.text}</span>
                    `;
                    btn.onclick = () => checkSingle(i, btn);
                    container.appendChild(btn);
                });
            } else if (step.type === "match") {
                tableAnswers = {};
                container.className = "flex flex-col justify-start gap-2 pt-1 sm:pt-2";
                const labelW = Math.max(...step.rows.map(r => r.name.replace(/<[^>]*>/g, "").length)) + 1;
                const wrap = document.createElement("div");
                wrap.className = "bg-white rounded-xl shadow-sm border-2 border-brandLight overflow-hidden flex flex-col divide-y divide-slate-100";
                step.rows.forEach(row => {
                    const r = document.createElement("div");
                    r.className = "flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3 px-3 py-1.5 xl:py-2.5";
                    r.setAttribute("data-row-id", row.id);
                    let btns = "";
                    step.choices.forEach(c => {
                        btns += `<button data-kind="match" data-val="${c}" onclick="setTableAnswer(${row.id}, '${c}', this)" class="${MATCH_BTN} border-slate-200 text-slate-600 hover:border-brand/60">${c}</button>`;
                    });
                    r.innerHTML = `
                        <span class="math-font fluid-opt-text font-bold text-[#1B365D] shrink-0 whitespace-nowrap" style="min-width:${labelW}ch">${row.name}</span>
                        <div class="flex flex-wrap gap-1.5">${btns}</div>`;
                    wrap.appendChild(r);
                });
                container.appendChild(wrap);

                const checkBtn = document.createElement("button");
                checkBtn.id = "check-table-btn";
                checkBtn.className = "w-full bg-brand hover:brightness-110 text-white font-bold py-2 px-4 rounded-xl shadow transition-all fluid-btn-text mt-1 hover:shadow-md active:scale-[0.98] shrink-0 min-h-[44px]";
                checkBtn.innerText = "Перевірити відповіді";
                checkBtn.onclick = checkTable;
                container.appendChild(checkBtn);
            } else if (step.type === "table_check") {
                tableAnswers = {};
                container.className = "flex-1 min-h-0 flex flex-col justify-start gap-2 pt-1 sm:pt-2 overflow-hidden";

                const tableWrapper = document.createElement("div");
                tableWrapper.className = "bg-white rounded-xl shadow-sm border-2 border-brandLight overflow-hidden flex-1 flex flex-col justify-center min-h-0";

                let tableHTML = `
                    <table class="w-full text-left border-collapse h-full">
                        <thead>
                            <tr class="bg-brandLight/60 fluid-label uppercase font-bold text-brand border-b border-brandLight">
                                <th class="py-1.5 px-3 pl-3.5">Твердження</th>
                                <th class="py-1.5 px-2 text-center w-[5em]">Так</th>
                                <th class="py-1.5 px-2 text-center w-[5em]">Ні</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                `;
                step.rows.forEach(row => {
                    tableHTML += `
                        <tr class="fluid-table-row hover:bg-panelRight transition-colors" data-row-id="${row.id}">
                            <td class="pl-3.5 text-[#1B365D] font-medium fluid-tbl-text math-font leading-tight">${row.name}</td>
                            <td class="text-center">
                                <button onclick="setTableAnswer(${row.id}, 'так', this)" class="${TBL_BTN} border-slate-200 text-slate-600 hover:border-brand/60" data-val="так">Так</button>
                            </td>
                            <td class="text-center">
                                <button onclick="setTableAnswer(${row.id}, 'ні', this)" class="${TBL_BTN} border-slate-200 text-slate-600 hover:border-brand/60" data-val="ні">Ні</button>
                            </td>
                        </tr>
                    `;
                });
                tableHTML += `</tbody></table>`;
                tableWrapper.innerHTML = tableHTML;
                container.appendChild(tableWrapper);

                const checkBtn = document.createElement("button");
                checkBtn.id = "check-table-btn";
                checkBtn.className = "w-full bg-brand hover:brightness-110 text-white font-bold py-2 px-4 rounded-xl shadow transition-all fluid-btn-text mt-2 hover:shadow-md active:scale-[0.98] shrink-0 min-h-[44px]";
                checkBtn.innerText = "Перевірити відповіді";
                checkBtn.onclick = checkTable;
                container.appendChild(checkBtn);
            }

            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false
            });
        }

        function showHint() {
            if (isAnswered) return;
            const step = steps[currentStep];
            if (step.svgHint) {
                document.getElementById("svg-container").innerHTML = step.svgHint;
                document.getElementById("hint-btn").classList.add("hidden");
            }
        }

        function setOk(panel, txt, message) {
            panel.className = "h-full flex-1 flex items-center justify-center sm:justify-start bg-emerald-100 text-emerald-800 px-3 rounded-xl border-2 border-emerald-300 shadow-sm overflow-hidden";
            txt.innerText = message;
        }

        function finishStep(panel, txt) {
            if (currentStep < steps.length - 1) {
                setOk(panel, txt, "Правильно!");
                document.getElementById("next-btn").classList.remove("hidden");
            } else {
                setOk(panel, txt, "Усі завдання виконано правильно!");
                document.getElementById("restart-btn").classList.remove("hidden");
            }
        }

        function checkSingle(idx, btn) {
            if (isAnswered) return;
            const step = steps[currentStep];
            const opt = step.options[idx];
            const panel = document.getElementById("feedback-panel");
            const txt = document.getElementById("feedback-text");
            const badge = btn.querySelector('span');

            if (opt.isCorrect) {
                isAnswered = true;
                btn.className = "w-full text-left p-2 sm:p-2.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 shadow-md flex items-center my-0.5 min-h-[44px]";
                badge.className = "fluid-badge rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold mr-2.5 shrink-0";
                if (step.svgHint) document.getElementById("svg-container").innerHTML = step.svgHint;
                document.querySelectorAll("#options-container button").forEach(b => b.disabled = true);
                finishStep(panel, txt);
            } else {
                btn.className = "w-full text-left p-2 sm:p-2.5 rounded-xl border-2 border-rose-400 bg-rose-50 opacity-75 flex items-center my-0.5 min-h-[44px]";
                badge.className = "fluid-badge rounded-full bg-rose-500 text-white flex items-center justify-center font-bold mr-2.5 shrink-0";
                panel.className = "h-full flex-1 flex items-center justify-center sm:justify-start bg-rose-100 text-rose-800 px-3 rounded-xl border border-rose-300 overflow-hidden";
                txt.innerText = "Неправильно. Спробуйте інший варіант.";
                btn.disabled = true;
            }
        }

        function setTableAnswer(rowId, answer, clickedBtn) {
            if (isAnswered) return;
            const row = document.querySelector(`[data-row-id="${rowId}"]`);
            row.querySelectorAll(".table-opt-btn").forEach(b => {
                b.className = `${baseOf(b)} border-slate-200 text-slate-600 hover:border-brand/60`;
            });
            tableAnswers[rowId] = answer;
            clickedBtn.className = `${baseOf(clickedBtn)} border-brand bg-brandLight text-brand shadow-sm`;
        }

        function checkTable() {
            if (isAnswered) return;
            const step = steps[currentStep];
            const panel = document.getElementById("feedback-panel");
            const txt = document.getElementById("feedback-text");

            if (Object.keys(tableAnswers).length < step.rows.length) {
                panel.className = "h-full flex-1 flex items-center justify-center sm:justify-start bg-amber-100 text-amber-800 px-3 rounded-xl border border-amber-300 overflow-hidden";
                txt.innerText = "Оберіть відповідь у кожному рядку.";
                return;
            }

            let allCorrect = true;
            step.rows.forEach(row => {
                const ok = tableAnswers[row.id] === row.correct;
                if (!ok) allCorrect = false;
                const rowEl = document.querySelector(`[data-row-id="${row.id}"]`);
                rowEl.querySelectorAll(".table-opt-btn").forEach(b => {
                    if (b.getAttribute("data-val") === tableAnswers[row.id]) {
                        b.className = ok
                            ? `${baseOf(b)} border-emerald-500 bg-emerald-100 text-emerald-800`
                            : `${baseOf(b)} border-rose-400 bg-rose-100 text-rose-800`;
                    }
                });
            });

            if (allCorrect) {
                isAnswered = true;
                document.querySelectorAll(".table-opt-btn").forEach(b => b.disabled = true);
                document.getElementById("check-table-btn").classList.add("hidden");
                finishStep(panel, txt);
            } else {
                panel.className = "h-full flex-1 flex items-center justify-center sm:justify-start bg-rose-100 text-rose-800 px-3 rounded-xl border border-rose-300 overflow-hidden";
                txt.innerText = "Є помилки. Виправте виділені відповіді.";
            }
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                render();
            }
        }

        function restart() {
            currentStep = 0;
            render();
        }

        window.onload = render;
        window.onresize = () => {
            document.body.style.height = `${window.innerHeight}px`;
        };
    </script>

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
