<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розв’язування рівнянь (5 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=STIX+Two+Text:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a1736;--muted:#8a5a78;
  --acc:#be185d;--acc2:#e5508a;--accL:#fce7f3;--soft:#fdeff5;--soft2:#fff7fa;--line:#f3cfe0;
  --ok:#1e9e62;--okbg:#e6f7ee;--oktx:#14663f;--okln:#8fd3b0;
  --bad:#e0464e;--badbg:#fdecee;--badtx:#a3232b;--badln:#efa3a8;
  --warnbg:#fff6e5;--warntx:#8a5a00;--warnln:#f3d9a4;
  --o1:#0f766e;--o2:#7c3aed;--o3:#b45309;--o4:#3b6ea8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(13px,min(2.2vh,1.3vw),26px);background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 45%,#fbcfe8 100%) fixed}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);touch-action:manipulation;
  background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 45%,#fbcfe8 100%) fixed}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:3px solid rgba(190,24,93,.55);outline-offset:2px}
b,strong{font-weight:900}

#app{flex:1;min-height:0;display:flex;flex-direction:column;padding:.5rem .7rem .2rem}
.stage{display:none;flex:1;min-height:0;flex-direction:column}
.stage.on{display:flex}
.card{position:relative;flex:1;min-height:0;overflow:auto;background:#fff;border:2px solid var(--line);border-radius:.9rem;
  box-shadow:0 .5rem 1.6rem rgba(120,20,70,.14);padding:.9rem 1.1rem;display:flex;flex-direction:column;align-items:center}
.card.start{background:linear-gradient(160deg,#fff 0%,#fff7fa 100%)}
.inner{margin:auto;width:100%;max-width:58rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.inner.xw{max-width:80rem;margin:0 auto auto}
.h1{font-size:2.6rem;font-weight:900;color:var(--acc);margin:0;text-align:center;line-height:1.25;max-width:40rem}
.title2{font-size:1.5rem;font-weight:900;color:var(--acc);margin:0;text-align:center}
.q{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.45;margin:0}
.hl{color:var(--acc)}
.o1{color:var(--o1)}.o2{color:var(--o2)}.o3{color:var(--o3)}.o4{color:var(--o4)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem}
.box{width:100%;background:var(--soft2);border:2px solid var(--line);border-radius:.8rem;padding:.8rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.box.white{background:#fff}
.eq{font-size:1.9rem;font-weight:900;text-align:center;line-height:1.35}
.sit{font-size:1.45rem;font-weight:800;text-align:center;line-height:1.45}
.v{font-family:"STIX Two Text","Cambria Math",Georgia,serif;font-style:italic;font-weight:600;font-size:1.14em;line-height:1;padding:0 .04em}

/* кнопки */
.btn{border:0;border-radius:.6rem;padding:.5rem 1.05rem;color:#fff;font-weight:800;font-size:1.05rem;
  box-shadow:0 .2rem .5rem rgba(190,24,93,.25);transition:transform .1s;white-space:nowrap;min-height:2.6rem}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.a{background:var(--acc)}
.btn.b{background:var(--acc2)}
.btn.g{background:#fff;color:var(--acc);border:2px solid var(--line);box-shadow:none}
.btn.big{font-size:1.45rem;padding:.65rem 1.9rem;border-radius:2rem}
.btn.s{font-size:.95rem;padding:.35rem .8rem;min-height:2.3rem}
.btn.pill{font-size:1.2rem;border-radius:2rem;padding:.5rem 1.4rem}

/* поля */
.num{width:5.6rem;font:inherit;font-weight:900;font-size:1.35rem;text-align:center;color:var(--ink);background:#fff;
  border:2px solid var(--acc2);border-radius:.5rem;padding:.15rem .3rem;-moz-appearance:textfield;vertical-align:middle}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(190,24,93,.2)}
.num.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.num.wrong{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}
.num.sm{width:3.6rem}
.num.wide{width:12rem;font-size:1.3rem}
.num.wide::placeholder{font-size:.8rem;font-weight:700;color:#b08aa0}

/* відгук */
.fb{padding:.4rem .9rem;border:2px solid;border-radius:.6rem;font-weight:800;font-size:1.05rem;text-align:center;line-height:1.35}
.fb.ok{color:var(--oktx);background:var(--okbg);border-color:var(--okln)}
.fb.bad{color:var(--badtx);background:var(--badbg);border-color:var(--badln)}
.fb.warn{color:var(--warntx);background:var(--warnbg);border-color:var(--warnln)}

/* варіанти відповідей */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%;max-width:42rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:#fff;border:2px solid var(--line);border-radius:.7rem;
  font-weight:900;font-size:1.4rem;color:var(--ink);box-shadow:0 2px 6px rgba(120,20,70,.08);min-height:3rem}
.opt:hover{border-color:var(--acc2)}
.opt .let{flex:none;width:2rem;height:2rem;border-radius:.5rem;background:var(--accL);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.opt .val{flex:1;text-align:center}
.opt.good{border-color:var(--ok);background:var(--okbg);color:var(--oktx)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--badtx)}

/* стрілка ↓ і кружечок «1» */
.go{flex:none;width:2.7rem;height:2.7rem;border:0;border-radius:50%;background:var(--acc2);color:#fff;font-size:1.45rem;font-weight:900;padding:0;
  box-shadow:0 .25rem .7rem rgba(190,24,93,.35);animation:bounce 1.1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(.3rem)}}
.one{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;border:2px dashed var(--acc2);background:#fff;color:var(--acc);font-weight:900;font-size:1.2rem;padding:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,80,138,.35)}50%{box-shadow:0 0 0 .45rem rgba(229,80,138,0)}}
@keyframes fdin{from{opacity:0}to{opacity:1}}

/* ===== задача ===== */
.tk{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:.9rem;width:100%;align-items:start}
.tkL,.tkR{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.ttl{align-self:flex-start;font-size:1.35rem;font-weight:900;color:var(--acc);background:var(--accL);border:2px solid var(--line);border-radius:2rem;padding:.05rem 1rem}
.cnd{width:100%;background:var(--warnbg);border:2px solid var(--warnln);border-radius:.8rem;padding:.45rem .85rem;font-weight:800;font-size:1.2rem;line-height:1.4}
.cnd .cl{display:block}
.cnd .cl+.cl{margin-top:.15rem}
.cnd .ask{color:var(--acc);font-weight:900}
.model{display:flex;flex-direction:column;align-items:center;gap:.55rem;width:100%}
.ctl{display:flex;justify-content:center;min-height:0}

/* таблиця, яку заповнюємо разом */
table.mt{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:2px solid var(--line);border-radius:.7rem;overflow:hidden;font-weight:900;font-size:1.25rem;text-align:center}
table.mt th{background:var(--accL);color:var(--acc);font-size:.92rem;padding:.3rem .35rem;line-height:1.2;border-bottom:2px solid var(--line)}
table.mt td{padding:.2rem .35rem;border-top:1px solid var(--line);height:2.2rem}
table.mt th+th,table.mt td+td{border-left:2px solid var(--line)}
table.mt td.lab{text-align:left;font-size:1.05rem;padding-left:.6rem}
.mc{display:inline-flex;align-items:center;justify-content:center;min-width:3.2rem;height:1.8rem;border-radius:.45rem}
.mc.hid{border:2px dashed var(--acc2);background:var(--soft);cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
.mc.on{animation:fdin .35s ease;opacity:1}
.mc.dash{color:var(--muted)}
.qm{color:var(--acc);font-size:1.35rem}

/* короткий запис */
.sr{display:flex;align-items:center;justify-content:center;gap:.6rem;background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;font-weight:900;font-size:1.35rem;line-height:1.6;animation:fdin .4s ease;width:100%;flex-wrap:wrap}
.sr .ls{display:flex;flex-direction:column}
.sr .br{flex:none;width:1rem;align-self:stretch}
.sr .rt{white-space:nowrap}
.sr .srn{flex-basis:100%;text-align:center;font-size:1.05rem;font-weight:800;color:var(--muted);line-height:1.3}
.sr .ls .k{display:inline-block;min-width:9.5rem;color:var(--muted);font-weight:800}

/* розв’язання */
.solh{font-size:1.25rem;font-weight:900;color:var(--acc);text-align:left}
.solp{width:100%;background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .8rem;display:flex;flex-direction:column;gap:.45rem;min-height:6rem}
.solw{display:flex;gap:.8rem;align-items:flex-start;width:100%}
.stl{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35rem;align-items:flex-start}
.way{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start;width:100%}
.wayh{font-weight:900;font-size:1.05rem;color:var(--acc);background:var(--accL);border:2px solid var(--line);border-radius:2rem;padding:.05rem .9rem}
.srow{width:100%;display:flex;flex-direction:column;gap:.3rem;animation:fdin .35s ease}
.sline{display:flex;align-items:baseline;gap:.5rem;font-weight:900;font-size:1.35rem;line-height:1.55}
.sline .n{flex:none;color:var(--acc)}
.sline .t{flex:1;min-width:0}
.u{color:var(--muted);font-size:1.15rem;white-space:nowrap;font-weight:900}
.sline .ex{font-weight:800;font-size:1.05rem;color:var(--ink)}
.sline .ex.show{animation:fdin .5s ease}
.okn{color:var(--oktx);background:var(--okbg);border-radius:.35rem;padding:0 .3rem}
.colb{flex:none;background:#fff;border:2px solid var(--line);border-radius:.7rem;padding:.4rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;animation:fdin .35s ease;
  background-image:linear-gradient(#f6dbe8 1px,transparent 1px),linear-gradient(90deg,#f6dbe8 1px,transparent 1px);background-size:.75rem .75rem}
.colnote{font-size:.9rem;font-weight:800;color:var(--muted);text-align:center;max-width:14rem;background:rgba(255,255,255,.9);border-radius:.4rem;padding:0 .3rem}
.ansb{width:100%;background:var(--okbg);border:2px solid var(--ok);border-radius:.7rem;padding:.4rem .8rem;font-weight:900;font-size:1.4rem;color:var(--oktx);animation:fdin .4s ease}
.newrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.6rem}

/* запис у стовпчик і куточком */
.cg{display:grid;grid-auto-rows:1.32em;font-size:1.75rem;font-weight:900;line-height:1.32em;font-variant-numeric:tabular-nums}
.cg span{display:flex;align-items:center;justify-content:center}
.cg .ul{border-bottom:.14rem solid var(--ink)}
.cg .vl{border-left:.14rem solid var(--ink)}
.cg .sg{color:var(--acc2);font-size:.9em}
.cg .res{color:var(--acc)}
.cg .p1{color:var(--o1)}.cg .p2{color:var(--o2)}

/* дошка усної лічби */
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;width:100%;max-width:56rem}
.bc{position:relative;min-height:4.4rem;border-radius:.9rem;border:2px solid var(--line);background:#fff;font-weight:900;font-size:2rem;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.3rem;box-shadow:0 2px 6px rgba(120,20,70,.08)}
.bc.hard{background:var(--warnbg);border-color:var(--warnln)}
.bc .r{color:var(--acc)}
.bc.open{border-color:var(--acc2)}

/* ===== рівняння ===== */
.eqw{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:.9rem;width:100%;align-items:start}
.eqL,.eqR{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.eqhead{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.tab{border:2px solid var(--line);background:#fff;border-radius:2rem;padding:.2rem .75rem;min-width:3rem;font-weight:900;font-size:1rem;color:var(--ink);min-height:2.3rem}
.tab:hover{border-color:var(--acc2)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab.done{border-color:var(--ok)}
.tab.done::after{content:" ✓";color:var(--ok)}
.tab.on.done::after{color:#fff}
.eqs{background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .9rem .6rem;display:flex;flex-direction:column;gap:.3rem;align-items:flex-start}
.eqrow{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem 1rem;animation:fdin .35s ease;width:100%}
.eql{display:flex;align-items:flex-start;font-weight:900;font-size:1.85rem;line-height:1.25}
.eqrow.first .eql{font-size:2.15rem}
.sg2{display:inline-flex;flex-direction:column;align-items:center}
.sgt{white-space:pre;border-bottom:.2rem solid transparent;border-radius:.15rem;transition:color .3s,border-color .3s}
.sgl{font-size:.78rem;font-weight:900;line-height:1.1;text-align:center;max-width:5.8rem;white-space:normal;visibility:hidden;margin-top:.12rem}
.eqrow.lb .sgl{visibility:visible;animation:fdin .45s ease}
.palA{--cu:var(--acc);--cr:var(--o2);--co:var(--o1)}
.palB{--cu:#e8590c;--cr:#1971c2;--co:#7a5418}
.eqrow.lb .r-op .sgt{border-color:var(--co);color:var(--co)} .eqrow.lb .r-op .sgl{color:var(--co)}
.eqrow.lb .r-rs .sgt{border-color:var(--cr);color:var(--cr)} .eqrow.lb .r-rs .sgl{color:var(--cr)}
.eqrow.lb .r-un .sgt{border-color:var(--cu);color:var(--cu)} .eqrow.lb .r-un .sgl{color:var(--cu)}
.eqrow.col .r-op .sgt{color:var(--co)} .eqrow.col .r-rs .sgt{color:var(--cr)} .eqrow.col .r-un .sgt{color:var(--cu)}
.mkx{background:linear-gradient(transparent 50%,rgba(255,212,59,.62) 50%);border-radius:.15rem}
.eqrow.mk .sg2.mk1 .sgt{background:linear-gradient(transparent 50%,rgba(255,212,59,.62) 50%);animation:fdin .5s ease}
.eqside{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;font-weight:900;font-size:.98rem;color:var(--acc)}
.eqside .nt{background:var(--accL);border-radius:.5rem;padding:.1rem .55rem}
.eqside .nt.gray{background:var(--soft2);color:var(--muted)}
.eqnote{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;background:var(--warnbg);border:2px solid var(--warnln);border-radius:.7rem;padding:.25rem .8rem;animation:fdin .35s ease}
.eqnote .tx{font-weight:900;font-size:1.15rem;color:var(--warntx)}
.eqnote .ex2{font-weight:900;font-size:1.6rem;white-space:pre}
.eqrow.fin .eql{color:var(--acc)}
.eqans{background:var(--okbg);border:2px solid var(--ok);border-radius:.7rem;padding:.3rem 1rem;font-weight:900;font-size:1.5rem;color:var(--oktx);animation:fdin .4s ease}
.eqctl{display:flex;align-items:center;gap:.6rem;width:100%;justify-content:space-between}
.eqctl .row{justify-content:flex-start}
.chk{width:100%;background:var(--soft2);border:2px solid var(--line);border-radius:.8rem;padding:.55rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.chk .cap{font-size:.95rem;font-weight:800;color:var(--muted)}
.rulebox{width:100%;background:#fff;border:2px solid var(--acc2);border-radius:.8rem;padding:.55rem .9rem;animation:fdin .35s ease}
.rulebox .rh{font-weight:900;font-size:1.1rem;color:var(--acc);margin-bottom:.2rem}
.rulebox .rt{font-weight:800;font-size:1.4rem;line-height:1.45}
.k-op{color:var(--co,var(--o1));font-weight:900}.k-rs{color:var(--cr,var(--o2));font-weight:900}.k-un{color:var(--cu,var(--acc));font-weight:900}
.eqcol{display:flex;justify-content:center}

/* підсумок */
.sumwrap{width:100%;max-width:52rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.sb{width:100%;background:#fff;border:2px solid var(--line);border-radius:.9rem;overflow:hidden}
.sb>button{width:100%;border:0;background:var(--soft2);display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem 1rem;font-weight:900;font-size:1.35rem;color:var(--acc);text-align:left}
.sb>button .ar{font-size:1.1rem;color:var(--acc2)}
.sb.shut>button{animation:pulse 1.8s ease-in-out infinite}
.sb .sbc{padding:.35rem 1rem .5rem;font-weight:900;font-size:1.4rem;line-height:1.5;text-align:center;animation:fdin .45s ease}
.sb .sbc small{display:block;font-size:1.05rem;font-weight:800;color:var(--muted)}
.sb .sbc .fm{display:inline-block;margin:0 .7rem}
.endr{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;width:100%;font-weight:800;font-size:1.3rem;line-height:1.4}
.endr .ans{color:var(--acc);font-weight:900}

/* нижня панель */
#bottomNav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.4rem .9rem}
#bottomNav .left{display:flex;align-items:center;gap:.6rem}
.gem{flex:none;width:2.4rem;height:2.4rem;padding:0;border-radius:.6rem;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.gem svg{width:1.6rem;height:1.6rem}
.gem.corner{position:absolute;right:.9rem;top:.9rem}
#candle{position:relative;flex:none;width:.55rem;height:2.2rem;border:1px solid var(--line);border-radius:9px;background:#fff;padding:2px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#candleFill{width:100%;background:var(--acc2);border-radius:9px;transition:height 1s linear}
#candle .tip{display:none;position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);background:#fff;border:2px solid var(--line);border-radius:.6rem;
  padding:.2rem .6rem;font-weight:900;font-size:.85rem;white-space:nowrap;text-align:center;z-index:50;box-shadow:0 4px 12px rgba(120,20,70,.18)}
#candle:hover .tip{display:block}
.tip b{display:block;color:var(--acc);font-size:1rem}
.tip span{color:var(--muted)}
footer{flex:none;text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:2px 0 5px}

/* вікно вчителя */
.modal{position:fixed;inset:0;z-index:2147483000;background:rgba(58,23,54,.45);display:flex;align-items:center;justify-content:center;padding:1rem}
.mbox{position:relative;width:100%;max-width:40rem;max-height:100%;overflow:auto;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:1rem 1.2rem;box-shadow:0 1rem 3rem rgba(58,23,54,.35)}
.mbox h3{display:flex;align-items:center;gap:.6rem;margin:0 0 .6rem;font-size:1.2rem;color:var(--acc);border-bottom:2px solid var(--line);padding-bottom:.4rem;padding-right:2rem}
.mbox h4{margin:0 0 .2rem;font-size:1rem;color:var(--acc)}
.mbox p{margin:0;font-size:.95rem;line-height:1.4;font-weight:600}
.mcard{background:var(--soft2);border:2px solid var(--line);border-radius:.7rem;padding:.5rem .7rem;margin-bottom:.5rem}
.mbox ul{list-style:none;margin:0;padding:0}
.mbox li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.35rem .5rem;border-bottom:1px solid var(--line);cursor:pointer;font-weight:800;font-size:.95rem;border-radius:.4rem}
.mbox li:hover{background:var(--accL)}
.mbox li:last-child{border-bottom:0}
.mbox li span.m{flex:none;background:var(--accL);color:var(--acc);border-radius:2rem;padding:.05rem .6rem;font-size:.85rem}
.x{position:absolute;right:.7rem;top:.5rem;border:0;background:none;font-size:1.8rem;color:var(--muted);line-height:1}

/* світлофор */
.tlv{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;width:100%;max-width:44rem}
.tlb{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.8rem .6rem;border-radius:1rem;border:3px solid;font-family:inherit;text-align:center}

  var cols = ['#be185d', '#e5508a', '#f9a8d4', '#1e9e62', '#f0b429', '#7c3aed'];
  for (var i = 0; i < (n || 30); i++){

    p.style.animationDelay = (Math.random() * .15) + 's';
    document.body.appendChild(p);
    setTimeout((function(q){ return function(){ q.remove(); }; })(p), 1700);

/* ===== записи в стовпчик і куточком ===== */
function digs(n){ return String(n).split(''); }
function gcell(r, c, t, cls){ return '<span style="grid-row:' + r + ';grid-column:' + c + '" class="' + (cls || '') + '">' + t + '</span>'; }
function putNum(out, n, r, endCol, cls){ var d = digs(n); for (var i = 0; i < d.length; i++) out.push(gcell(r, endCol - d.length + 1 + i, d[i], cls)); return endCol - d.length + 1; }
function gridHTML(cols, cells){ return '<div class="cg" style="grid-template-columns:repeat(' + cols + ',1.02em)">' + cells.join('') + '</div>'; }
function colMul(a, b){
  var p = a * b, B = digs(b), parts = [], i;
  for (i = B.length - 1; i >= 0; i--) if (+B[i]) parts.push({ v: a * (+B[i]), sh: B.length - 1 - i });
  var W = Math.max(String(a).length, String(b).length, String(p).length) + 1, out = [], r = 1;
  putNum(out, a, r, W); r++;
  out.push(gcell(r, 1, '×', 'sg')); putNum(out, b, r, W); r++;
  if (parts.length > 1){
    parts.forEach(function(pt, j){ if (j === parts.length - 1) out.push(gcell(r, 1, '+', 'sg')); putNum(out, pt.v, r, W - pt.sh, j % 2 ? 'p2' : 'p1'); r++; });
  }
  putNum(out, p, r, W, 'res');
  return gridLines(W, out, [2].concat(parts.length > 1 ? [1 + 1 + parts.length] : []));
}
function gridLines(W, out, ulRows){
  var res = out.map(function(s){
    var m = /grid-row:(\d+);grid-column:(\d+)/.exec(s);
    if (m && +m[2] >= 2 && ulRows.indexOf(+m[1]) >= 0) return s.replace('class="', 'class="ul ');
    return s;
  });
  ulRows.forEach(function(r){
    for (var c = 2; c <= W; c++){
      var has = out.some(function(s){ return s.indexOf('grid-row:' + r + ';grid-column:' + c + '"') >= 0; });
      if (!has) res.push(gcell(r, c, '', 'ul'));
    }
  });
  return gridHTML(W, res);
}
function colAddSub(a, b, op){
  var r = op === '+' ? a + b : a - b, W = Math.max(String(a).length, String(b).length, String(r).length) + 1, out = [];
  putNum(out, a, 1, W); out.push(gcell(2, 1, op, 'sg')); putNum(out, b, 2, W); putNum(out, r, 3, W, 'res');
  return gridLines(W, out, [2]);
}
function colDiv(a, b){
  var D = digs(a).map(Number), n = D.length, q = Math.floor(a / b), Q = digs(q), Lb = String(b).length, wR = Math.max(Lb, Q.length);
  var W = n + 1 + wR, out = [], i = 0, cu = 0, steps = [], rem;
  do { cu = cu * 10 + D[i]; i++; } while (cu < b && i < n);
  steps.push({ end: i - 1, cur: cu, prod: Math.floor(cu / b) * b }); rem = cu - steps[0].prod;
  for (; i < n; i++){
    cu = rem * 10 + D[i];
    var qd = Math.floor(cu / b);
    if (qd === 0){ rem = cu; continue; }
    steps.push({ end: i, cur: cu, prod: qd * b }); rem = cu - qd * b;
  }
  for (i = 0; i < n; i++) out.push(gcell(1, i + 2, D[i]));
  var bd = digs(b);
  for (i = 0; i < wR; i++) out.push(gcell(1, n + 2 + i, i < Lb ? bd[i] : '', 'ul' + (i === 0 ? ' vl' : '')));
  for (i = 0; i < wR; i++) out.push(gcell(2, n + 2 + i, i < Q.length ? Q[i] : '', 'res' + (i === 0 ? ' vl' : '')));
  var r = 2;
  steps.forEach(function(s, j){
    var e = s.end + 2;
    if (j > 0){ putNum(out, s.cur, r, e); }
    var st = e - String(s.prod).length + 1;
    out.push(gcell(r + (j > 0 ? 1 : 0), st - 1, '−', 'sg'));
    var pr = r + (j > 0 ? 1 : 0), d = digs(s.prod);
    for (var k = 0; k < d.length; k++) out.push(gcell(pr, st + k, d[k], 'ul'));
    r = pr + 1;
  });
  putNum(out, rem, r, n + 1);
  return gridHTML(W, out);
}
function colWorth(c){
  if (!c) return false;
  if (c.op === '*') return !(c.a < 10 && c.b < 10);
  if (c.op === ':') return c.a / c.b >= 10;
  return c.a >= 10 && c.b >= 10;
}
function colHTML(c){
  if (c.op === '*'){
    var top = c.a, bot = c.b, note = '';

    return colMul(top, bot) + note;
  }
  if (c.op === ':') return colDiv(c.a, c.b);
  return colAddSub(c.a, c.b, c.op);
}
function hintFor(c){
  if (!c) return 'Спробуйте ще раз.';

  return 'Помножте окремо десятки й одиниці, а потім додайте.';
}

    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
