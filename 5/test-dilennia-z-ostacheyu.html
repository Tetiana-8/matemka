<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тест. Ділення з остачею (5 клас)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--acc:#be185d;--accD:#9d174d;--acc2:#e5508a;--accL:#fce7f3;--soft:#fdeff5;--soft2:#fff7fa;--line:#f3cfe0;--ttl:#3a1736;
--ok:#1f9d55;--okL:#e3f5ea;--bad:#d64545;--badL:#fdeaea;--warn:#e08a00;--warnL:#fff4de}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#3a1736;background:linear-gradient(135deg,#fdeff5 0%,#fce7f3 45%,#fbcfe8 100%) fixed;min-height:100vh;display:flex;flex-direction:column;touch-action:manipulation}
#app{width:100%;max-width:960px;margin:0 auto;padding:8px 12px 0;flex:1}
h1{margin:4px 0 8px;padding:0 38px;font-size:clamp(19px,3.2vw,28px);color:var(--ttl);text-align:center;font-weight:800}
.m{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.18em;line-height:1.5}
.m i,i{font-family:'STIX Two Text','Times New Roman',serif}
.card{background:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 4px 18px rgba(190,24,93,.14);margin-bottom:10px}
.btn{border:0;border-radius:12px;background:var(--acc);color:#fff;font:800 16px Nunito,sans-serif;padding:10px 20px;cursor:pointer;min-height:46px}
.btn:hover{background:var(--accD)}
.btn.light{background:var(--accL);color:var(--accD)}
.btn.light:hover{background:#f9d3e6}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:7px 14px;min-height:40px;font-size:15px}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sp{flex:1}
.q{font-size:clamp(17px,2.5vw,23px);line-height:1.5;margin:4px 0 8px}
.tk{display:grid;grid-template-columns:1fr;gap:6px}
.tk .fig{text-align:center}
.tk .fig svg{width:100%;max-width:440px;max-height:28vh;height:auto}
@media(min-width:760px){.tk.has{grid-template-columns:1.05fr 1fr;gap:16px;align-items:center}.tk .fig svg{max-height:50vh}}
.ansrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:clamp(17px,2.4vw,22px);color:var(--accD);margin:4px 0}
.fld{font:700 22px 'STIX Two Text','Times New Roman',serif;color:#3a1736;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;outline:none;min-height:46px;width:5.2em;text-align:center}
.fld:focus,.fld.act{border-color:var(--acc);box-shadow:0 0 0 3px var(--accL)}
.fld.ok{border-color:var(--ok);background:var(--okL)}.fld.bad{border-color:var(--bad);background:var(--badL)}
.hintl{font-size:14px;color:#5b6b7c;margin-top:4px;font-weight:600}
.leg{font-size:13px;color:#4c5d6e;margin-top:2px;font-weight:700}
.msg{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:700}
.msg.ok{background:var(--okL);color:#146c3a}.msg.bad{background:var(--badL);color:#8f2020}.msg.part{background:var(--warnL);color:#7a4b00}
.sol{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft2);border:1px dashed var(--line);font-size:1.02em;line-height:1.55}
.stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--accD);font-weight:700;margin:2px 0 6px}
.stat span{background:var(--accL);border-radius:999px;padding:3px 12px}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:#fff;font:800 14px Nunito,sans-serif;color:var(--accD);padding:0}
button.num{cursor:pointer}
.num.cur{border-width:4px}
.num.r{background:var(--ok);border-color:var(--ok);color:#fff}.num.w{background:var(--bad);border-color:var(--bad);color:#fff}.num.p{background:var(--warn);border-color:var(--warn);color:#fff}
.field{width:100%;max-width:340px;font:700 18px Nunito,sans-serif;padding:11px 12px;border:2px solid var(--line);border-radius:12px;margin:5px 0;outline:none}
.field.err{border-color:var(--bad);background:var(--badL)}
.big{font-size:clamp(32px,8vw,56px);font-weight:800;color:var(--acc);text-align:center;line-height:1.1}
.shot{margin:12px auto;max-width:480px;border:2px dashed var(--acc2);border-radius:12px;padding:10px;text-align:center;color:var(--accD);font-weight:700;background:var(--soft2)}
.leaves{margin:10px 0;padding:10px 14px;border-radius:12px;background:#fff8dc;border:1px solid #ecd58a;color:#6b5400}
.sig{text-align:center;color:#8a95a3;font-size:10px;padding:10px 0 10px}
#keyBtn{position:fixed;top:6px;right:6px;z-index:900;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.55);opacity:.55;font-size:16px;cursor:pointer}
#keyBtn:hover{opacity:1}
#kbd{display:none;position:sticky;bottom:0;z-index:800;background:#dfe6ee;border-top:1px solid #aeb7c4;padding:6px 6px calc(6px + env(safe-area-inset-bottom));margin:0}
#kbd.show{display:block}
#kbd .kr{display:flex;gap:5px;margin-bottom:5px;justify-content:center}
#kbd .kr:last-child{margin-bottom:0}
#kbd button{flex:1;max-width:62px;height:44px;border:0;border-radius:9px;background:#fff;font:800 20px Nunito,sans-serif;color:#3a1736;box-shadow:0 1px 2px rgba(0,0,0,.25);touch-action:manipulation}
#kbd button:active{background:var(--accL)}
#kbd button.wide{max-width:96px}
/* вибір відповіді */
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin:6px 0}
@media(min-width:620px){.opts.two{grid-template-columns:1fr 1fr}}
.optb{font:700 clamp(15px,2.2vw,19px) Nunito,sans-serif;text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;color:#3a1736;padding:10px 14px;min-height:46px;cursor:pointer}
.optb:hover{border-color:var(--acc2)}
.optb.sel{border-color:var(--acc);background:var(--accL);box-shadow:0 0 0 3px var(--accL)}
.optb.ok{border-color:var(--ok);background:var(--okL)}.optb.bad{border-color:var(--bad);background:var(--badL)}
.optb[disabled]{cursor:default}
/* перетягування */
.dslot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:clamp(17px,2.4vw,21px);font-weight:700;color:#3a1736}
.cell{min-width:104px;min-height:46px;border:2px dashed var(--acc2);border-radius:12px;background:var(--soft2);display:inline-flex;align-items:center;justify-content:center;padding:2px 4px}
.cell.over{background:var(--accL);border-style:solid}
.cell.ok{border-color:var(--ok);background:var(--okL);border-style:solid}.cell.bad{border-color:var(--bad);background:var(--badL);border-style:solid}
#pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:48px;padding:6px;border-radius:12px;background:var(--soft)}
.chipd{padding:8px 14px;border:2px solid var(--acc2);background:#fff;color:#3a1736;border-radius:10px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;font:700 clamp(15px,4vw,19px) Nunito,sans-serif;white-space:nowrap}
.chipd.sel{background:var(--accL);border-color:var(--acc);box-shadow:0 0 0 3px var(--accL)}
.chipd.stat{cursor:default}
.chipd.ghost{position:fixed;z-index:2147483647;pointer-events:none;opacity:.92;box-shadow:0 6px 16px rgba(58,23,54,.3);background:var(--soft)}
/* знайди помилку */
.errl{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;background:#fff;color:#3a1736;padding:10px 14px;margin:6px 0;font:600 clamp(16px,2.3vw,20px)/1.45 'STIX Two Text','Times New Roman',serif;cursor:pointer;min-height:46px}
.errl:hover{border-color:var(--acc2)}
.errl.sel{border-color:var(--acc);background:var(--accL)}
.errl.ok{border-color:var(--ok);background:var(--okL)}.errl.bad{border-color:var(--bad);background:var(--badL)}
.errl[disabled]{cursor:default}
.modal{position:fixed;inset:0;background:rgba(58,23,54,.45);z-index:2147483640;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
.modal .box{background:#fff;border-radius:16px;padding:16px;max-width:1100px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal .box.small{max-width:340px;margin-top:12vh}
.jt{width:100%;border-collapse:collapse;font-size:13px}
.jt th,.jt td{border:1px solid #cfd9e3;padding:4px 6px;text-align:center}
.jt td.nm{text-align:left;cursor:pointer;color:var(--acc);font-weight:700}
.jt th{background:var(--accL)}
.jt .r{color:var(--ok);font-weight:800}.jt .w{color:var(--bad);font-weight:800}.jt .p{color:var(--warn);font-weight:800}
.jt .red{color:var(--bad);font-weight:800}
.jscroll{overflow:auto;max-height:64vh;margin-top:8px}
.det{text-align:left;background:var(--soft2);font-size:13px}
.det div{margin:2px 0;padding:3px 6px;border-radius:6px;text-align:left}
.det div.badrow{background:#fde3e3;border-left:4px solid var(--bad)}
.det div.badrow .no{color:var(--bad);font-weight:800}
.det div.badrow .ua{color:var(--bad);font-weight:800}
/* рисунок */
svg .vt{font-family:"STIX Two Text","Times New Roman",serif;font-style:italic;font-weight:700;font-size:22px;fill:#3a1736;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg .sl{font-family:Nunito,Arial,sans-serif;font-weight:800;font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg .al{font-family:Nunito,Arial,sans-serif;font-weight:800;font-size:16px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg .al.q{font-size:21px}
@media(max-width:560px){h1{font-size:15px;margin:2px 0 4px;padding:0 40px}
.nums:not(.nav){flex-wrap:nowrap;gap:3px;margin:2px 0 4px}
.nums:not(.nav) .num{width:auto;flex:1;min-width:0;height:20px;border-width:2px;font-size:11px;border-radius:6px}
.nums:not(.nav) .num.cur{border-width:3px}
.stat{margin:0 0 2px}.stat span{padding:1px 10px;font-size:13px}
.q{font-size:16px;margin:2px 0 4px}.ansrow{margin:2px 0}.fld{min-height:40px;padding:3px 8px;font-size:20px}
.optb{min-height:40px;padding:7px 12px}.errl{padding:7px 12px;margin:4px 0;min-height:40px}.row-btn{margin-top:6px}.btn{min-height:42px;padding:8px 16px}
.tk .fig svg{max-height:22vh}.msg{margin-top:6px;padding:6px 12px}.leg{font-size:12px}.hintl{display:none}#app{padding:6px 8px 0}.card{padding:10px 12px}.num{width:30px;height:30px;font-size:13px}.nums{gap:4px}}
</style>
</head>
<body>
<div id="app">
  <h1>Тест. Ділення з остачею (5 клас)</h1>
  <div id="screen"></div>
  <div class="sig">Автор розробки <b>Ковтун Тетяна</b></div>
</div>
<div id="kbd"></div>
<button id="keyBtn" type="button" title="Журнал">🔑</button>
<div id="modalHost"></div>
<div id="noticeHost"></div>

<script>
(function(){ "use strict";

// ==GEN-START==
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
function setSeed(s){rnd=mulberry32(s>>>0);}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const I=x=>'<i>'+x+'</i>';
function pl(n,a,b,c){const m=n%100,k=n%10;return (k===1&&m!==11)?a:(k>=2&&k<=4&&(m<12||m>14))?b:c;}
function mkChoice(o,good,wrongs){
  const all=shuffle([good].concat(wrongs));
  o.k='choice';o.opts=all;o.ci=all.indexOf(good);return o;}
function cellsTask(w,cond,rows,sol){return {w:w,k:'cells',cond:cond,rows:rows,sol:sol,desc:'без рисунка'};}
// число, після якого слово у родовому відмінку множини звучить правильно (закінчується на 0, 5–9)
function okN(n){const k=n%10;return k===0||k>=5;}

const FIX=[];
/* 1. Остача менша за дільник */
FIX.push(function(){
  const d=ri(5,9),bad=d+ri(0,3);
  const pool=shuffle([1,2,3,4,5,6,7,8].filter(x=>x<d)).slice(0,3).map(String);
  return mkChoice({w:8,cond:'Яке з чисел не може бути остачею при діленні на '+d+'?',
    sol:'Остача завжди менша від дільника. При діленні на '+d+' остача може бути від 0 до '+(d-1)+', тому число '+bad+' остачею бути не може.',desc:'без рисунка',two:true},String(bad),pool);
});
/* 2. Ділення з остачею: малі числа */
FIX.push(function(){
  const b=ri(3,9),q=ri(4,12),r=ri(1,b-1),a=b*q+r;
  return cellsTask(8,'Виконайте ділення з остачею: '+a+' : '+b+'.',
    [{lab:'неповна частка =',u:'',ans:q},{lab:'остача =',u:'',ans:r}],
    a+' = '+b+' · '+q+' + '+r+', тому неповна частка дорівнює '+q+', остача — '+r+'.');
});
/* 3. Ділення з остачею: тризначне число на одноцифрове */
FIX.push(function(){
  const b=ri(3,9),q=ri(Math.ceil(120/b),Math.floor(980/b)),r=ri(1,b-1),a=b*q+r;
  return cellsTask(8,'Виконайте ділення з остачею: '+a+' : '+b+'.',
    [{lab:'неповна частка =',u:'',ans:q},{lab:'остача =',u:'',ans:r}],
    a+' : '+b+' = '+q+' (ост. '+r+'). Перевірка: '+b+' · '+q+' + '+r+' = '+a+'.');
});
/* 4. Рівність a = bq + r */
FIX.push(function(){
  const b=pick([5,6,7,8,9]),q=ri(4,9),r=ri(1,b-1),a=b*q+r;
  const good=a+' = '+b+' · '+q+' + '+r;
  const w1=a+' = '+b+' · '+(q-1)+' + '+(r+b);
  const w2=a+' = '+b+' · '+q+' + '+(r+1);
  const w3=a+' = '+b+' · '+(q-1)+' + '+r;
  return mkChoice({w:8,cond:'Яка рівність правильно показує ділення з остачею числа '+a+' на '+b+'?',
    sol:'Ділене = дільник · неповна частка + остача, причому остача менша від дільника: '+good+'. У рівності «'+w1+'» остача '+(r+b)+' більша за дільник '+b+', тож це не ділення з остачею.',desc:'без рисунка',two:true},good,[w1,w2,w3]);
});
/* 5. Знайти ділене */
FIX.push(function(){
  const b=ri(4,9),q=ri(5,12),r=ri(1,b-1),a=b*q+r;
  return cellsTask(9,'При діленні числа на '+b+' неповна частка дорівнює '+q+', а остача — '+r+'. Знайдіть ділене.',
    [{lab:'ділене =',u:'',ans:a}],
    'Щоб знайти ділене, треба дільник помножити на неповну частку й додати остачу: '+b+' · '+q+' + '+r+' = '+a+'.');
});
/* 6. Можливі остачі */
FIX.push(function(){
  const d=ri(4,8);
  const L=(from,to)=>{const s=[];for(let x=from;x<=to;x++)s.push(x);return s.join('; ');};
  return mkChoice({w:8,cond:'Які остачі можуть бути при діленні на '+d+'?',
    sol:'Остача менша від дільника, але може дорівнювати 0 (коли число ділиться націло). Тому при діленні на '+d+' можливі остачі: '+L(0,d-1)+'.',desc:'без рисунка'},
    L(0,d-1),[L(1,d),L(0,d),L(1,d-1)]);
});
/* 7. Остача 0 — ділиться націло */
FIX.push(function(){
  const b=ri(4,9),m=ri(6,15),good=b*m;
  const set={};set[good]=1;const wr=[];let g=0;
  while(wr.length<3&&g++<500){const x=b*ri(6,15)+ri(1,b-1);if(!set[x]){set[x]=1;wr.push(String(x));}}
  return mkChoice({w:8,cond:'Яке з чисел при діленні на '+b+' дає остачу 0?',
    sol:'Остача 0 означає, що число ділиться націло: '+good+' : '+b+' = '+m+'. Інші числа націло на '+b+' не діляться.',desc:'без рисунка',two:true},String(good),wr);
});
/* 8. Чи може остача дорівнювати X */
FIX.push(function(){
  const d=ri(4,9),yes=rnd()<0.5,x=yes?ri(0,d-1):ri(d,d+4);
  const o=mkChoice({w:8,cond:'Чи може при діленні на '+d+' остача дорівнювати '+x+'?',
    sol:yes?(x===0?'Так: остача 0 буває, коли число ділиться на '+d+' націло.':'Так: остача '+x+' менша від дільника '+d+', тож вона можлива.')
      :'Ні: остача завжди менша від дільника, а '+x+' не менше від '+d+'.',desc:'без рисунка',two:true},yes?'так':'ні',[yes?'ні':'так']);
  return o;
});
/* 9. Задача: повні групи й залишок */
FIX.push(function(){
  const T=[
    {s:function(n,k){return 'Є '+n+' яблук. Їх розклали в пакети по '+k+' яблук у кожний. Скільки повних пакетів вийшло і скільки яблук залишилося?';},l1:'повних пакетів =',l2:'залишилося яблук ='},
    {s:function(n,k){return 'Є '+n+' олівців. Їх розклали в коробки по '+k+' олівців у кожну. Скільки повних коробок вийшло і скільки олівців залишилося?';},l1:'повних коробок =',l2:'залишилося олівців ='},
    {s:function(n,k){return 'Є '+n+' зошитів. Їх зв’язали в пачки по '+k+' зошитів у кожній. Скільки повних пачок вийшло і скільки зошитів залишилося?';},l1:'повних пачок =',l2:'залишилося зошитів ='}
  ];
  const t=pick(T);let k,q,r,n;
  do{k=ri(6,9);q=ri(4,11);r=ri(1,k-1);n=k*q+r;}while(!okN(n));
  return cellsTask(9,t.s(n,k),[{lab:t.l1,u:'',ans:q},{lab:t.l2,u:'',ans:r}],
    n+' : '+k+' = '+q+' (ост. '+r+'). Неповна частка '+q+' — кількість повних груп, остача '+r+' — те, що залишилося.');
});
/* 10. Задача: скільки потрібно (остачу не відкидаємо) */
FIX.push(function(){
  let k,q,r,n;
  do{k=ri(5,9);q=ri(3,11);r=ri(1,k-1);n=k*q+r;}while(!okN(n));
  const ans=q+1;
  return cellsTask(9,'Групу з '+n+' туристів треба переправити через озеро на човнах. У кожний човен можна посадити не більше ніж '+k+' осіб. Скільки човнів потрібно?',
    [{lab:'човнів =',u:'',ans:ans}],
    n+' : '+k+' = '+q+' (ост. '+r+'). У '+q+' '+pl(q,'човен','човни','човнів')+' сядуть '+(k*q)+' туристів, ще '+r+' залишаться, і для них потрібен ще один човен. Разом: '+q+' + 1 = '+ans+' '+pl(ans,'човен','човни','човнів')+'.');
});

function plainQ(h){return String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
function parseNum(s){s=String(s==null?'':s).trim().replace(/[°\s]/g,'').replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return null;return parseFloat(s);}
function checkTask(t,a){
  a=a||[];let parts=[];
  if(t.k==='cells')parts=t.rows.map((r,j)=>{const v=parseNum(a[j]);return v!==null&&Math.abs(v-r.ans)<1e-9;});
  else if(t.k==='choice')parts=[a[0]===t.ci];
  else if(t.k==='err')parts=[a[0]===t.ci];
  else if(t.k==='drag')parts=t.corr.map((c,j)=>a[j]===c);
  const ok=parts.filter(Boolean).length;
  return {parts:parts,frac:ok/parts.length,ok:ok===parts.length};
}
function ansText(t,a){
  a=a||[];
  if(t.k==='cells')return t.rows.map((r,j)=>String(a[j]==null?'':a[j]).trim()).join(' | ');
  if(t.k==='choice')return a[0]==null?'':plainQ(t.opts[a[0]]);
  if(t.k==='err')return a[0]==null?'':plainQ(t.lines[a[0]]);
  return t.slots.map((s,j)=>a[j]==null||a[j]<0?'':t.chips[a[j]].p).join(' | ');
}
function corrText(t){
  if(t.k==='cells')return t.rows.map(r=>String(r.ans)).join(' | ');
  if(t.k==='choice')return plainQ(t.opts[t.ci]);
  if(t.k==='err')return plainQ(t.lines[t.ci]);
  return t.corr.map(c=>t.chips[c].p).join(' | ');
}

KBD.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button[data-k]');if(!b)return;
  e.preventDefault();
  const t=T.tasks[T.i];if(!t||t.k!=='cells')return;
  let j=T.act;if(j>=t.rows.length)j=0;
  const el=$('#f'+j);if(!el)return;
  const k=b.dataset.k;let v=el.value;
  if(k==='bs')v=v.slice(0,-1);else if(v.length<3)v+=k;
  el.value=v;setAns(j,v);el.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('keydown',e=>{
  if(V.view!=='test'||!T.tasks)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'||tag==='SELECT')return;
  if(T.view==='task'&&T.done[T.i]&&e.key==='ArrowRight')act('tnext');
});
// перетягування
function cellsOf(){const a=T.ans[T.i];const t=T.tasks[T.i];const c=[];for(let j=0;j<t.slots.length;j++)c.push(a[j]!=null?a[j]:-1);return c;}
function putChip(idx,k){const c=cellsOf(),p=c.indexOf(idx);if(p>=0)c[p]=-1;if(k>=0)c[k]=idx;T.ans[T.i]=c;T.sel=null;render();}
let drag=null;
function clearOver(){document.querySelectorAll('.cell.over').forEach(n=>n.classList.remove('over'));}
S.addEventListener('pointerdown',e=>{
  if(V.view!=='test'||T.view!=='task'||T.done[T.i])return;
  const c=e.target.closest('.chipd');if(!c||c.classList.contains('stat'))return;
  e.preventDefault();drag={idx:+c.getAttribute('data-idx'),sx:e.clientX,sy:e.clientY,moved:false,ghost:null,el:c};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){
    drag.moved=true;const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=drag.el.offsetWidth+'px';document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.35';}
  if(drag.ghost){
    drag.ghost.style.left=(e.clientX-drag.ghost.offsetWidth/2)+'px';drag.ghost.style.top=(e.clientY-drag.ghost.offsetHeight/2)+'px';
    const u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest?u.closest('.cell'):null;
    clearOver();if(cl)cl.classList.add('over');}
});
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();clearOver();
  if(d.moved){
    const u=document.elementFromPoint(e.clientX,e.clientY),cl=u&&u.closest?u.closest('.cell'):null;
    if(cl)putChip(d.idx,+cl.getAttribute('data-cell'));
    else if(u&&u.closest&&u.closest('#pool'))putChip(d.idx,-1);
    else render();
  }else if(d.el.parentNode&&d.el.parentNode.classList.contains('cell'))putChip(d.idx,-1);
  else{T.sel=(T.sel===d.idx?null:d.idx);render();}
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
S.addEventListener('click',e=>{
  if(V.view!=='test'||T.view!=='task'||T.done[T.i])return;
  const cl=e.target.closest('.cell');
  if(cl&&T.sel!=null&&!cl.querySelector('.chipd')){putChip(T.sel,+cl.getAttribute('data-cell'));}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b);});
function act(a,b){
  const d=b?b.dataset:{};
  switch(a){
    case 'begin':{
      const su=$('#sur').value.trim(),na=$('#nam').value.trim();
      $('#sur').classList.toggle('err',!su);$('#nam').classList.toggle('err',!na);
      if(!su||!na){$('#nmErr').textContent='Введіть прізвище та ім’я, щоб почати';return;}
      V.name={sur:su,nam:na};testStart(+(new URLSearchParams(location.search).get('v'))||0);break;}
    case 'tagain':testStart(0);window.scrollTo(0,0);break;
    case 'opt':{if(T.done[T.i]||T.view!=='task')break;T.ans[T.i]=[+d.j];render();break;}
    case 'tans':{if(T.done[T.i]||!answered(T.i))break;
      const r=checkTask(T.tasks[T.i],T.ans[T.i]);T.done[T.i]={ok:r.ok,frac:r.frac,parts:r.parts};
      if(T.i===T.tasks.length-1)testCheck();
      render();break;}
    case 'tnext':if(!T.done[T.i])break;if(T.i<T.tasks.length-1){T.i++;T.act=0;T.sel=null;}else{T.view='result';T.i=0;}render();window.scrollTo(0,0);break;
    case 'go':if(T.view==='result')T.view='errors';if(T.view==='errors'){T.i=+d.i;render();}break;
    case 'terrs':{const f=T.rec.tasks.findIndex(x=>x<1);T.i=f<0?0:f;T.view='errors';render();break;}
    case 'tres':T.view='result';render();break;
    case 'eprev':if(T.i>0)T.i--;render();break;
    case 'enext':if(T.i<T.tasks.length-1)T.i++;render();break;
  }
}

// ---------- журнал вчительки ----------
const MH=$('#modalHost');
$('#keyBtn').addEventListener('click',()=>{
  MH.innerHTML='<div class="modal"><div class="box small"><b>Пароль</b><input class="field" id="pw" type="password" autocomplete="off"><div id="pwErr" style="color:var(--bad);min-height:20px;font-weight:700"></div><div class="row-btn"><button class="btn" id="pwOk">Увійти</button><button class="btn light" id="pwNo">Скасувати</button></div></div></div>';
  const pw=$('#pw');pw.focus();
  const go=async()=>{const ok=await teacherLogin(pw.value);if(!ok){$('#pwErr').textContent='Неправильний пароль';return;}openJournal();};
  $('#pwOk').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go();};$('#pwNo').onclick=()=>{MH.innerHTML='';};
});
async function openJournal(){
  MH.innerHTML='<div class="modal"><div class="box"><div class="row-btn" style="margin:0"><b style="font-size:18px">Журнал результатів</b><span class="sp"></span><button class="btn light sm" id="jRef">Оновити</button><button class="btn light sm" id="jCsv">Завантажити CSV</button><button class="btn light sm" id="jClr">Очистити</button><button class="btn sm" id="jClose">Закрити</button></div><div id="jBody" class="jscroll">Завантаження…</div></div></div>';
  let rows=[];
  const draw=()=>{
    const N=rows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0);
    let h='<table class="jt"><thead><tr><th>№</th><th>Прізвище та ім’я</th><th>Дата</th><th>Час</th><th>Виходів</th><th>Бал</th>';
    for(let i=1;i<=N;i++)h+='<th>'+i+'</th>';h+='</tr></thead><tbody>';
    rows.forEach((r,k)=>{
      const d=r.ts?new Date(r.ts).toLocaleString('uk-UA'):'—';
      const fast=r.durationSec!=null&&r.durationSec<120;
      h+='<tr><td>'+(k+1)+'</td><td class="nm" data-d="'+k+'">'+esc(r.name)+'</td><td>'+d+'</td><td'+(fast?' class="red" title="Дуже швидко"':'')+'>'+(r.durationSec!=null?fmtTime(r.durationSec):'—')+'</td><td'+((r.leaves||0)>=3?' class="red"':'')+(r.awaySec!=null?' title="Поза вікном: '+fmtTime(r.awaySec)+'"':'')+'>'+(r.leaves!=null?r.leaves:'—')+'</td><td><b>'+nf(r.score)+'</b>'+(r.finished===0?'<br><span class="red">не завершено ('+(r.answeredCount||0)+' з '+N+')</span>':'')+'</td>';
      for(let i=0;i<N;i++){const m=(r.tasks||[])[i];h+='<td class="'+(m===undefined?'':m>=1?'r':m>0?'p':'w')+'">'+(m===undefined?'':m>=1?'✓':m>0?'½':'✗')+'</td>';}
      h+='</tr><tr id="det'+k+'" hidden><td colspan="'+(6+N)+'" class="det">'+detHtml(r)+'</td></tr>';
    });
    h+='</tbody></table>';
    $('#jBody').innerHTML=h;
    $('#jBody').querySelectorAll('.nm').forEach(td=>td.onclick=()=>{const e=$('#det'+td.dataset.d);e.hidden=!e.hidden;});
  };
  const load=async()=>{try{rows=await loadResults();draw();}catch(e){$('#jBody').textContent='Не вдалося підключитися до бази результатів';}};
  $('#jRef').onclick=load;
  $('#jClose').onclick=async()=>{MH.innerHTML='';await teacherLogout();};
  $('#jCsv').onclick=()=>{
    const N=rows.reduce((m,r)=>Math.max(m,(r.tasks||[]).length),0);
    const head=['Прізвище та ім’я','Дата','Час (хв:с)','Виходів з вікна','Поза вікном (хв:с)','Бал (з 100)','%','Статус'];for(let i=1;i<=N;i++)head.push('Завд. '+i);
    const lines=[head].concat(rows.map(r=>{const a=[r.name,r.date||'',r.durationSec!=null?fmtTime(r.durationSec):'',r.leaves!=null?r.leaves:'',r.awaySec!=null?fmtTime(r.awaySec):'',nf(r.score),r.percent!=null?r.percent:'',r.finished===0?'не завершено':'завершено'];for(let i=0;i<N;i++){const m=(r.tasks||[])[i];a.push(m===undefined?'':m>=1?'+':m>0?nf(m):'-');}return a;}));
    const csv='﻿'+lines.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Ділення_з_остачею_5клас_результати.csv';document.body.appendChild(a);a.click();a.remove();
  };
  $('#jClr').onclick=()=>{
    $('#jBody').insertAdjacentHTML('afterbegin','<div class="msg bad" id="cf">Видалити всі записи ('+rows.length+')? <button class="btn sm" id="cfY">Так, видалити</button> <button class="btn light sm" id="cfN">Скасувати</button></div>');
    $('#cfN').onclick=()=>$('#cf').remove();
    $('#cfY').onclick=async()=>{try{await clearResults();rows=[];draw();}catch(e){$('#jBody').insertAdjacentHTML('afterbegin','<div class="msg bad">Не вдалося очистити записи. Перевірте правила бази Firebase</div>');}};
  };
  load();
}
function detHtml(r){
  let lv='';
  if(r.leaves){
    const by={};(r.leaveTasks||[]).forEach(n=>{by[n]=(by[n]||0)+1;});
    const parts=Object.keys(by).map(n=>'завд. '+n+' — '+by[n]+' р.');
    lv=parts.length?' (де саме: '+parts.join(', ')+')':'';
  }
  let h=(r.finished===0?'<div class="badrow"><b class="no">Тест НЕ завершено:</b> тестування закрито після забагатьох виходів з вікна; дано відповідей: '+(r.answeredCount||0)+' з '+(r.tasks||[]).length+'.</div>':'')+'<div><b>Бал: '+nf(r.score)+' з '+(r.max||100)+(r.percent!=null?' ('+r.percent+' %)':'')+'</b> · Виходів: <b>'+(r.leaves!=null?r.leaves:'—')+'</b>, поза вікном: '+fmtTime(r.awaySec||0)+lv+(r.leaveSecs&&r.leaveSecs.length?'; тривалість виходів, с: '+r.leaveSecs.join(', '):'')+' '+(r.variant?' · варіант '+r.variant:'')+'</div>';
  (r.tasks||[]).forEach((m,i)=>{
    const bad=!(m>=1);
    const ans=(r.answers||[])[i];
    h+='<div class="'+(bad?'badrow':'')+'"><span class="no">'+(i+1)+') '+(m>=1?'✓':m>0?'½':'✗')+'</span> '+esc((r.qtext||[])[i]||'')+' — відповідь: <span class="ua"><b>'+esc(ans?ans:'без відповіді')+'</b></span>; правильно: <b>'+esc((r.correct||[])[i]||'')+'</b>'+(r.weights&&r.taskScores?' ('+nf(r.taskScores[i])+' з '+r.weights[i]+' б.)':'')+'</div>';});
  return h;
}

window.__t={state:function(){return {V:V,T:T,W:W};},EASY:EASY,HARD:HARD,genTest:genTest,setSeed:setSeed,checkTask:checkTask};
render();
})();
