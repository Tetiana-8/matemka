<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Підсумок І чверті — картки-запитання, 5 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: одна велика картка на весь екран (для проєктора), над нею — вибір тем, під нею — дві кнопки */
:root{
  --bg:#fbeef3; --dot:#f3d3df; --ink:#3a2633; --muted:#8c6a7d;
  --card:#fffafc; --card-edge:#f1cbd9;
  --front:#f2a7c3; --front-2:#e98cb0; --front-ink:#ffffff;
  --accent:#c4467a; --accent-ink:#ffffff; --accent-soft:#fbdbe7;
  --chip:#fffafc; --chip-edge:#efc6d6;
  --ans-bg:#e5f5eb; --ans-ink:#1d6843; --ans-edge:#b6dfc6;
  --fig-fill:#fde4ee; --mark:#c4467a; --line:#3a2633; --unk:#6c4fc4;
  --f-display:"Comfortaa","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body)}
*{box-sizing:border-box}
.sign{text-align:center;font:10px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:6px 0 4px;user-select:none}.sign b{font-weight:700}
.app{height:100%;max-width:1240px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* теми */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top h1{margin:0;font-family:var(--f-display);font-size:clamp(18px,1.6vw,24px);color:var(--accent);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 clamp(14px,1.1vw,17px)/1 var(--f-body);padding:9px 14px;border-radius:999px;border:2px solid var(--chip-edge);
  background:var(--chip);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.front:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* картка */
.stage{min-height:0;perspective:1800px;position:relative}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.3,1)}
.card.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{cursor:pointer;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,var(--front),var(--front-2));color:var(--front-ink);
  box-shadow:0 10px 0 -4px var(--card-edge),0 18px 40px -18px rgba(120,40,80,.45)}
.front .q{font-family:var(--f-display);font-size:clamp(120px,22vh,260px);line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.front .hint{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-weight:800;font-size:clamp(18px,1.8vw,28px);opacity:.92}
.front .sym{position:absolute;font-family:var(--f-display);font-size:clamp(28px,4vw,60px);opacity:.22;user-select:none}
.back{transform:rotateY(180deg);background:var(--card);border:2px solid var(--card-edge);
  display:flex;flex-direction:column;gap:clamp(10px,1.6vh,20px);padding:clamp(18px,3vw,42px);overflow:auto;
  box-shadow:0 18px 40px -20px rgba(120,40,80,.35)}
.tag{align-self:flex-start;font-weight:800;font-size:clamp(14px,1.2vw,18px);letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:10px}
.qtext{font-weight:800;font-size:clamp(24px,2.3vw + 1vh,48px);line-height:1.28;text-wrap:balance}
.qtext b{color:var(--accent)}
.big{font-weight:900;font-size:clamp(38px,4.6vw + 1.6vh,96px);text-align:center;font-variant-numeric:tabular-nums;line-height:1.15;text-wrap:balance}
.words{font-weight:800;font-size:clamp(28px,2.8vw + 1.2vh,60px);text-align:center;line-height:1.25;text-wrap:balance}
.box{display:inline-block;width:.8em;height:.9em;border:.08em solid var(--accent);border-radius:.12em;vertical-align:-.1em;margin:0 .25em}
i.v{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700}
.figwrap{flex:1 1 0;min-height:200px;position:relative}
.fig{position:absolute;inset:0;width:100%;height:100%}
.spacer{flex:1 1 0}
[hidden]{display:none!important}
.answer{background:var(--ans-bg);border:2px solid var(--ans-edge);color:var(--ans-ink);border-radius:20px;
  padding:clamp(12px,1.8vh,22px) clamp(16px,2vw,28px);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.answer .lab{font:800 clamp(20px,1.7vw,28px)/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ans-ink);background:none;border:0;padding:0}
.answer.closed{align-self:flex-start;cursor:pointer;padding:clamp(12px,1.6vh,18px) clamp(22px,2.4vw,34px)}
.answer.closed .lab{cursor:pointer;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.answer .lab:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:6px}
.answer .val{font-weight:900;font-size:clamp(30px,3vw + 1vh,62px);font-variant-numeric:tabular-nums;line-height:1.2}
.answer .why{flex-basis:100%;font-weight:700;font-size:clamp(18px,1.4vw + .5vh,30px);color:var(--ink);opacity:.85}

/* рисунки */
.fig text{font-family:var(--f-body);font-weight:800;font-size:28px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.fig text.deg{fill:var(--mark);font-size:26px}
.fig text.unk{fill:var(--unk);font-size:32px}
.fig .shape{fill:var(--fig-fill);stroke:var(--line);stroke-width:3.5;stroke-linejoin:round}
.fig .ray{stroke:var(--line);stroke-width:3.5;stroke-linecap:round;fill:none}
.fig .mk{fill:none;stroke:var(--mark);stroke-width:3}
.fig .tick{stroke:var(--mark);stroke-width:3.5;stroke-linecap:round}
.fig .dot{fill:var(--line)}

/* кнопки */
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.btn{font:800 clamp(18px,1.7vw,26px)/1 var(--f-body);padding:16px 28px;border-radius:18px;cursor:pointer;border:3px solid var(--accent)}
.btn.show{background:var(--card);color:var(--accent)}
.btn.next{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}

@media (max-width:560px){.btn{flex:1 1 100%}.front .q{font-size:110px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>Підсумок І чверті · Відкрий картку</h1>
    <div class="chips" id="chips"></div>
  </header>

  <main class="stage">
    <div class="card" id="card">
      <div class="face front" id="front" role="button" tabindex="0" aria-label="Відкрити картку">
        <span class="sym" style="left:7%;top:10%">+</span>
        <span class="sym" style="right:9%;top:14%">−</span>
        <span class="sym" style="left:12%;bottom:22%">△</span>
        <span class="sym" style="right:13%;bottom:26%">∠</span>
        <span class="sym" style="left:30%;top:6%">·</span>
        <span class="sym" style="right:32%;bottom:12%">=</span>
        <span class="sym" style="left:4%;top:48%">°</span>
        <span class="sym" style="right:5%;top:50%">▭</span>
        <span class="q">?</span>
        <span class="hint">Натисніть, щоб відкрити</span>
      </div>
      <div class="face back" id="back" aria-live="polite"></div>
    </div>
  </main>

  <footer class="controls">
    <button class="btn next" id="btnNext">Наступна картка →</button>
  </footer>
  <div class="sign">Автор розробки <b>Ковтун Тетяна</b></div>
</div>

<script>
/* ---------- допоміжне ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const R5=(a,b)=>5*R(Math.ceil(a/5),Math.floor(b/5));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const NB=' ';
const fmt=n=>{const s=String(n);return n>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,NB):s};
const plural=(n,one,few,many)=>{const a=n%100,b=n%10;if(a>=11&&a<=14)return many;if(b===1)return one;if(b>=2&&b<=4)return few;return many};
const X='<i class="v">x</i>';

/* назви чисел */
const AP='’';
const UM=['','один','два','три','чотири',`п${AP}ять`,'шість','сім','вісім',`дев${AP}ять`];
const UF=['','одна','дві','три','чотири',`п${AP}ять`,'шість','сім','вісім',`дев${AP}ять`];
const TEEN=['десять','одинадцять','дванадцять','тринадцять','чотирнадцять',`п${AP}ятнадцять`,'шістнадцять','сімнадцять','вісімнадцять',`дев${AP}ятнадцять`];
const TENS=['','','двадцять','тридцять','сорок',`п${AP}ятдесят`,'шістдесят','сімдесят','вісімдесят',`дев${AP}яносто`];
const HUN=['','сто','двісті','триста','чотириста',`п${AP}ятсот`,'шістсот','сімсот','вісімсот',`дев${AP}ятсот`];
function w3(n,fem){const r=[],h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10;
  if(h)r.push(HUN[h]); if(t===1)r.push(TEEN[u]); else{if(t)r.push(TENS[t]); if(u)r.push((fem?UF:UM)[u]);} return r.join(' ')}
function words(n){if(n===0)return 'нуль';const r=[],m=Math.floor(n/1e6),t=Math.floor(n/1000)%1000,u=n%1000;
  if(m)r.push(w3(m,false)+' '+plural(m,'мільйон','мільйони','мільйонів'));
  if(t)r.push(w3(t,true)+' '+plural(t,'тисяча','тисячі','тисяч'));
  if(u)r.push(w3(u,false)); return r.join(' ')}
function genNum(d){let s=String(R(1,9));for(let i=1;i<d;i++)s+=Math.random()<.3?'0':String(R(0,9));return +s}

/* ---------- геометрія ---------- */
const P=(x,y)=>({x,y}),add=(a,b)=>P(a.x+b.x,a.y+b.y),sub=(a,b)=>P(a.x-b.x,a.y-b.y),mul=(a,k)=>P(a.x*k,a.y*k),
  ln=a=>Math.hypot(a.x,a.y),norm=a=>mul(a,1/ln(a)),ang=(V,Q)=>Math.atan2(Q.y-V.y,Q.x-V.x),
  dirM=d=>P(Math.cos(d*Math.PI/180),-Math.sin(d*Math.PI/180)),f=n=>n.toFixed(1),polar=(V,a,r)=>add(V,P(r*Math.cos(a),r*Math.sin(a)));
function Fig(){const els=[],pts=[];return{
  line(a,b,c='ray'){els.push(`<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" class="${c}"/>`);pts.push(a,b)},
  poly(ps,c='shape'){els.push(`<polygon points="${ps.map(p=>f(p.x)+','+f(p.y)).join(' ')}" class="${c}"/>`);pts.push(...ps)},
  path(d,c,ps=[]){els.push(`<path d="${d}" class="${c}"/>`);pts.push(...ps)},
  dot(p){els.push(`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="5.5" class="dot"/>`);pts.push(p)},
  text(p,s,c=''){els.push(`<text x="${f(p.x)}" y="${f(p.y)}" class="${c}">${s}</text>`);const w=String(s).replace(/<[^>]+>/g,'').length*8+6;pts.push(P(p.x-w,p.y-18),P(p.x+w,p.y+18))},
  svg(pad=16){const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,
    w=Math.max(...xs)-x0+pad,h=Math.max(...ys)-y0+pad;
    return `<svg class="fig" viewBox="${f(x0)} ${f(y0)} ${f(w)} ${f(h)}" role="img" aria-label="Рисунок">${els.join('')}</svg>`}}}
// підпис кута: на бісектрисі, на такій відстані від вершини, щоб не торкатися сторін
function lblR(v,a,b,r0){const u=norm(sub(a,v)),w=norm(sub(b,v)),h=Math.acos(Math.max(-1,Math.min(1,u.x*w.x+u.y*w.y)))/2,
  need=30/Math.max(Math.sin(h),.2),lim=.62*Math.min(ln(sub(a,v)),ln(sub(b,v)));return Math.max(r0,Math.min(need,Math.max(lim,r0)))}
function arcs(F,V,A,B,count,r0=34,gap=8){const a1=ang(V,A);let d=ang(V,B)-a1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;
  for(let i=0;i<count;i++){const r=r0+i*gap,s=polar(V,a1,r),e=polar(V,a1+d,r);F.path(`M${f(s.x)} ${f(s.y)}A${r} ${r} 0 0 ${d>0?1:0} ${f(e.x)} ${f(e.y)}`,'mk')}
  return a1+d/2}
function rightMark(F,V,A,B,s=24){const u=norm(sub(A,V)),w=norm(sub(B,V)),p1=add(V,mul(u,s)),p2=add(p1,mul(w,s)),p3=add(V,mul(w,s));
  F.path(`M${f(p1.x)} ${f(p1.y)}L${f(p2.x)} ${f(p2.y)}L${f(p3.x)} ${f(p3.y)}`,'mk')}
function ticks(F,A,B,k){const M=mul(add(A,B),.5),d=norm(sub(B,A)),n=P(-d.y,d.x);
  for(let i=0;i<k;i++){const c=add(M,mul(d,(i-(k-1)/2)*10));F.line(add(c,mul(n,11)),sub(c,mul(n,11)),'tick')}}
function sideLabel(F,A,B,G,s,c=''){const M=mul(add(A,B),.5),d=norm(sub(B,A));let n=P(-d.y,d.x);if((M.x-G.x)*n.x+(M.y-G.y)*n.y<0)n=mul(n,-1);const w=String(s).replace(/<[^>]+>/g,'').length*12;F.text(add(M,mul(n,18+w/2*Math.abs(n.x)+11*Math.abs(n.y))),s,c)}
function fitTri(pts,size=400){const rot=R(-12,12)*Math.PI/180,fl=Math.random()<.5?-1:1;
  let q=pts.map(p=>P(fl*p.x,p.y)).map(p=>P(p.x*Math.cos(rot)-p.y*Math.sin(rot),p.x*Math.sin(rot)+p.y*Math.cos(rot)));
  const xs=q.map(p=>p.x),ys=q.map(p=>p.y),k=size/Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  return q.map(p=>mul(p,k))}
const triFromSides=(a,b,c)=>{const x=(b*b+c*c-a*a)/(2*c),y=Math.sqrt(Math.max(0,b*b-x*x));return[P(0,0),P(c,0),P(x,-y)]};
const rad=d=>d*Math.PI/180;
const TRI_N=[['A','B','C'],['M','N','K'],['D','E','F'],['K','L','M'],['P','Q','R'],['C','D','E']];
function drawTri(F,V,N){F.poly(V);const G=mul(add(add(V[0],V[1]),V[2]),1/3);
  V.forEach((v,i)=>F.text(add(v,mul(norm(sub(v,G)),30)),N[i]));return G}

/* ---------- генератори запитань ---------- */
const T={nums:'Назви чисел',calc:'Обчислення',eq:'Рівняння',ang:'Кути',tri:'Трикутники',rect:'Прямокутник і квадрат'};
const G={
nums:[
 ()=>{const n=genNum(pick([4,5,6,6,7,7,8,9]));return{q:'Прочитайте число:',big:fmt(n),a:words(n)}},
 ()=>{const n=genNum(pick([4,5,6,7]));return{q:'Запишіть число цифрами:',words:words(n),a:fmt(n)}},
 ()=>{const d=R(6,7),n=genNum(d),i=R(1,d-1);
   const ranks=['одиниць','десятків','сотень','одиниць тисяч','десятків тисяч','сотень тисяч','одиниць мільйонів'];
   return{q:`Яка цифра стоїть у розряді <b>${ranks[i]}</b>?`,big:fmt(n),a:String(Math.floor(n/10**i)%10)}},
 ()=>{if(Math.random()<.5){const a=R(2,999),b=R(1,99);
     return{q:'Запишіть цифрами число, яке містить',words:`${a} ${plural(a,'тисячу','тисячі','тисяч')} і ${b} ${plural(b,'одиницю','одиниці','одиниць')}`,a:fmt(a*1000+b)}}
   const m=R(1,9),t=R(1,99),u=R(1,999);
   return{q:'Запишіть цифрами число, яке містить',words:`${m} ${plural(m,'мільйон','мільйони','мільйонів')} ${t} ${plural(t,'тисячу','тисячі','тисяч')} і ${u} ${plural(u,'одиницю','одиниці','одиниць')}`,a:fmt(m*1e6+t*1000+u)}},
 ()=>{const k=R(2,4),p=R(1,99);
   if(Math.random()<.5){const n=p*10**k+10**k-1;return{q:'Яке число йде <b>одразу після</b> числа',big:fmt(n),a:fmt(n+1)}}
   const n=(p%10?p:p+1)*10**k;return{q:'Яке число йде <b>одразу перед</b> числом',big:fmt(n),a:fmt(n-1)}},
 ()=>{const d=R(5,7),n=genNum(d);let s=String(n).split(''),i=R(1,d-1),o=+s[i],v;do v=R(0,9);while(v===o);s[i]=String(v);const m=+s.join('');
   return{q:'Порівняйте числа:',big:`${fmt(n)}<span class="box"></span>${fmt(m)}`,a:`${fmt(n)} ${n>m?'&gt;':'&lt;'} ${fmt(m)}`}},
],
calc:[
 ()=>{const [da,db]=pick([[3,3],[4,3],[4,4],[5,4],[5,5]]),a=R(10**(da-1),10**da-1),b=R(10**(db-1),10**db-1);
   return{q:'Обчисліть:',big:`${fmt(a)} + ${fmt(b)}`,a:fmt(a+b)}},
 ()=>{const [da,db]=pick([[3,3],[4,3],[4,4],[5,4]]);let a=R(10**(da-1),10**da-1),b=R(10**(db-1),10**db-1);if(b>a)[a,b]=[b,a];if(a===b)a+=R(11,99);
   return{q:'Обчисліть:',big:`${fmt(a)} − ${fmt(b)}`,a:fmt(a-b)}},
 ()=>{const a=R(120,899),b=R(25,299),c=R(15,a+b-10);
   return Math.random()<.5?{q:'Обчисліть:',big:`${a} + ${b} − ${c}`,a:fmt(a+b-c)}
     :(c<a?{q:'Обчисліть:',big:`${a} − ${c} + ${b}`,a:fmt(a-c+b)}:{q:'Обчисліть:',big:`${a} + ${b} − ${c}`,a:fmt(a+b-c)})},
 ()=>{const rnd=pick([100,100,200,1000]);let a;do a=rnd===1000?R(101,899):R(11,rnd-11);while(a%10===0);const c=rnd-a,b=R(17,389);
   const order=pick([[a,b,c],[a,c,b].reverse(),[c,b,a]]);
   return{q:'Обчисліть зручним способом:',big:order.join(' + '),a:fmt(a+b+c),why:`(${a} + ${c}) + ${b} = ${rnd} + ${b} = ${fmt(a+b+c)}`}},
 ()=>{const k=pick(['t','t','dd','tens','ten']);let a,b;
   if(k==='t'){a=R(2,9);b=R(2,9)}else if(k==='dd'){a=R(12,49);b=R(2,5)}else if(k==='tens'){a=R(2,9)*pick([10,100]);b=R(2,9)}else{a=R(12,99);b=pick([10,100])}
   return{q:'Обчисліть:',big:`${a} · ${b}`,a:fmt(a*b)}},
 ()=>pick([
   ()=>{const a=R(12,35),d=R(3,15);return{q:`Першого дня турист пройшов ${a} км, а другого — на ${d} км більше. Скільки кілометрів пройшов турист другого дня?`,a:`${a+d} км`,why:`${a} + ${d} = ${a+d} (км)`}},
   ()=>{const a=R(120,480),d=R(15,95);return{q:`У магазин привезли ${a} кг яблук, а груш — на ${d} кг менше. Скільки кілограмів груш привезли?`,a:`${a-d} кг`,why:`${a} − ${d} = ${a-d} (кг)`}},

function rectFig(a,b,N,opt){ // a — ліва (вертикальна) сторона, b — нижня

  return F.svg()}

const card=document.getElementById('card'),front=document.getElementById('front'),back=document.getElementById('back'),
  btnNext=document.getElementById('btnNext'),chips=document.getElementById('chips');
const on=new Set(Object.keys(T));let isOpen=false,shown=false,last='';
Object.entries(T).forEach(([k,name])=>{const b=document.createElement('button');b.className='chip';b.id='chip-'+k;b.textContent=name;b.setAttribute('aria-pressed','true');
  b.onclick=()=>{if(on.has(k)){if(on.size===1)return;on.delete(k)}else on.add(k);b.setAttribute('aria-pressed',on.has(k))};chips.appendChild(b)});

function makeQ(){let topic,idx,key,tries=0;
  do{topic=pick([...on]);idx=R(0,G[topic].length-1);key=topic+idx;tries++}while(key===last&&tries<20);last=key;
  return{topic,...G[topic][idx]()}}
function render(Q){
  let h=`<span class="tag">${T[Q.topic]}</span><div class="qtext">${Q.q}</div>`;
  if(Q.big)h+=`<div class="big">${Q.big}</div>`;
  if(Q.words)h+=`<div class="words">${Q.words}</div>`;
  if(Q.q2)h+=`<div class="qtext">${Q.q2}</div>`;
  h+=Q.fig?`<div class="figwrap">${Q.fig}</div>`:'<div class="spacer"></div>';
  h+=`<div class="answer closed" id="ans"><button class="lab" id="rev" type="button">Відповідь</button><span class="val" hidden>${Q.a}</span>${Q.why?`<span class="why" hidden>${Q.why}</span>`:''}</div>`;
  back.innerHTML=h;back.scrollTop=0;document.getElementById('rev').onclick=showAns}
function openCard(){if(isOpen)return;render(makeQ());isOpen=true;shown=false;card.classList.add('open');front.setAttribute('aria-hidden','true')}
function showAns(){if(!isOpen||shown)return;shown=true;const a=document.getElementById('ans');a.classList.remove('closed');a.querySelectorAll('[hidden]').forEach(e=>e.hidden=false);document.getElementById('rev').textContent='Відповідь:';a.scrollIntoView({block:'nearest',behavior:'smooth'})}
function next(){if(!isOpen){openCard();return}isOpen=false;card.classList.remove('open');front.removeAttribute('aria-hidden');front.focus({preventScroll:true})}
front.addEventListener('click',openCard);
front.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard()}});
btnNext.onclick=next;
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,[role=button]'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!isOpen)openCard()}
  else if(e.key==='ArrowRight')next()});

#pm-panel *{box-sizing:border-box}
#pm-panel[hidden],#pm-fab[hidden]{display:none!important}
#pm-panel{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:2147483600;width:42px;max-height:calc(100vh - 10px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  background:#e3e7ee;border:1px solid #aeb7c4;border-radius:14px;box-shadow:0 2px 12px rgba(40,50,70,.22)}
#pm-panel::-webkit-scrollbar{display:none}
#pm-panel.pm-left{right:auto;left:4px}
.pm-b{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:transparent;color:#465162;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pm-b svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pm-b:hover{background:#d3d9e3}
.pm-b:active{transform:scale(.93)}
.pm-b.on{background:#c5cedb;color:#26303f;box-shadow:inset 0 0 0 1px #8f9db2}
#pm-panel.pm-left [data-a="hide"] svg{transform:scaleX(-1)}
.pm-sep{flex:none;width:18px;height:1px;margin:3px 0;background:#bcc4d0}
.pm-colors{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px 0}
.pm-c{width:15px;height:15px;padding:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #9aa4b3;cursor:pointer}
.pm-c.on{box-shadow:0 0 0 2px #3b4452}

#pm-fab{position:fixed;right:0;top:50%;margin-top:-26px;z-index:2147483600;width:20px;height:52px;padding:0;
  display:flex;align-items:center;justify-content:center;color:#465162;cursor:pointer;
  background:#e3e7ee;border:1px solid #aeb7c4;border-right:0;border-radius:12px 0 0 12px;box-shadow:0 2px 8px rgba(40,50,70,.2)}
#pm-fab.pm-left{right:auto;left:0;border:1px solid #aeb7c4;border-left:0;border-radius:0 12px 12px 0}
#pm-fab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* низький екран: кнопки стають у дві колонки */
@media (max-height:600px){
  #pm-panel{width:78px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 2px}
  .pm-sep{display:none}
  .pm-colors{width:100%;grid-template-columns:repeat(4,auto);justify-content:center;gap:4px;padding:4px 0}
  .pm-c{width:14px;height:14px}
}

<script>
(function(){
  if (window.__pmLoaded) return; window.__pmLoaded = true;

  var ink = document.getElementById('pm-ink'), ctx = ink.getContext('2d');
  var panel = document.getElementById('pm-panel'), fab = document.getElementById('pm-fab');
  var layer = document.getElementById('pm-paper');
  document.documentElement.appendChild(layer);   // біле поле лежить у координатах сторінки і гортається разом з нею

  var st = { tool: null, color: '#e53935', thick: false, smart: true, grid: false };
  var strokes = [], sheets = [], hist = [], cur = null, penSeen = false, dpr = 1, sheetSeq = 0;

  /* ---------- розмір і перемальовування ---------- */
  function sx(){ return window.pageXOffset || 0; }
  function sy(){ return window.pageYOffset || 0; }
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    ink.style.width = w + 'px'; ink.style.height = h + 'px';
    ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
    redraw();
  }
  function setup(){ ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function drawStroke(s){
    var p = s.p, ox = -sx(), oy = -sy(), i;
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.fillStyle = s.e ? '#000' : s.c;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1){
      ctx.beginPath(); ctx.arc(p[0][0] + ox, p[0][1] + oy, s.w / 2, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(p[0][0] + ox, p[0][1] + oy);
      if (s.raw === false || p.length < 3){
        for (i = 1; i < p.length; i++) ctx.lineTo(p[i][0] + ox, p[i][1] + oy);
      } else {
        for (i = 1; i < p.length - 1; i++){
          var mx = (p[i][0] + p[i+1][0]) / 2 + ox, my = (p[i][1] + p[i+1][1]) / 2 + oy;
          ctx.quadraticCurveTo(p[i][0] + ox, p[i][1] + oy, mx, my);
        }
        ctx.lineTo(p[p.length-1][0] + ox, p[p.length-1][1] + oy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // напис, зроблений ДО білого поля, ховається під ним
  function clipUnderSheets(s){
    var W = ink.width / dpr, H = ink.height / dpr;
    for (var k = 0; k < sheets.length; k++){
      var sh = sheets[k];
      if (!sh._r || sh._seq <= s.seq) continue;
      ctx.beginPath(); ctx.rect(0, 0, W, H);
      ctx.rect(sh._r.x - sx(), sh._r.y - sy(), sh._r.w, sh._r.h);
      ctx.clip('evenodd');
    }
  }
  function redraw(){
    setup(); ctx.clearRect(0, 0, ink.width / dpr, ink.height / dpr);
    for (var i = 0; i < strokes.length; i++){
      ctx.save(); clipUnderSheets(strokes[i]); drawStroke(strokes[i]); ctx.restore();
    }
  }
  function seg(s, a, b){
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.e ? '#000' : s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0] - sx(), a[1] - sy()); ctx.lineTo(b[0] - sx(), b[1] - sy()); ctx.stroke();
    ctx.restore();
  }
  var raf = 0;
  window.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; redraw(); }); }, { passive: true });
  window.addEventListener('resize', size);

  /* ---------- рівні фігури ---------- */
  function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function perp(p, a, b){
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    if (!l) return dist(p, a);
    return Math.abs(dx * (a[1] - p[1]) - dy * (a[0] - p[0])) / l;
  }
  function rdp(P, eps){
    if (P.length < 3) return P.slice();
    var d = 0, idx = 0, A = P[0], B = P[P.length - 1];
    for (var i = 1; i < P.length - 1; i++){ var dd = perp(P[i], A, B); if (dd > d){ d = dd; idx = i; } }
    if (d > eps){ var l = rdp(P.slice(0, idx + 1), eps), r = rdp(P.slice(idx), eps); return l.slice(0, -1).concat(r); }
    return [A, B];
  }
  function resample(P, n){
    var L = 0, i; for (i = 1; i < P.length; i++) L += dist(P[i-1], P[i]);
    var step = L / (n - 1), out = [[P[0][0], P[0][1]]], acc = 0, prev = P[0];
    for (i = 1; i < P.length; i++){
      var cu = P[i], d = dist(prev, cu);
      while (d > 0 && acc + d >= step){
        var t = (step - acc) / d, q = [prev[0] + (cu[0] - prev[0]) * t, prev[1] + (cu[1] - prev[1]) * t];
        out.push(q); prev = q; d = dist(prev, cu); acc = 0;
      }
      acc += d; prev = cu;
    }
    if (out.length < n) out.push([P[P.length-1][0], P[P.length-1][1]]);
    return out;
  }
  function recognize(P){
    var n = P.length, i;
    if (n < 8) return null;
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, L = 0;
    for (i = 0; i < n; i++){
      x0 = Math.min(x0, P[i][0]); x1 = Math.max(x1, P[i][0]); y0 = Math.min(y0, P[i][1]); y1 = Math.max(y1, P[i][1]);
      if (i) L += dist(P[i-1], P[i]);
    }
    var w = x1 - x0, h = y1 - y0, diag = Math.hypot(w, h);
    if (diag < 80) return null;                       // дрібне (цифри, літери) не чіпаємо
    var a = P[0], b = P[n-1], d = dist(a, b);

    // пряма лінія
    var dev = 0; for (i = 1; i < n - 1; i++) dev = Math.max(dev, perp(P[i], a, b));
    if (d > 80 && d > 0.88 * L && dev < 0.07 * d){
      var A = [a[0], a[1]], B = [b[0], b[1]];
      if (Math.abs(B[1] - A[1]) < 0.1 * d){ var m = (A[1] + B[1]) / 2; A[1] = B[1] = m; }
      else if (Math.abs(B[0] - A[0]) < 0.1 * d){ var m2 = (A[0] + B[0]) / 2; A[0] = B[0] = m2; }
      return [A, B];
    }
    // далі тільки замкнені фігури
    if (d > 0.3 * L || L < diag * 1.6) return null;
    if (Math.min(w, h) < 0.18 * Math.max(w, h)) return null;

    // коло / еліпс
    var R = resample(P, 96), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2, ry = h / 2, sum = 0, sum2 = 0;
    for (i = 0; i < R.length; i++){
      var r = Math.hypot((R[i][0] - cx) / rx, (R[i][1] - cy) / ry); sum += r; sum2 += r * r;
    }
    var mean = sum / R.length, sd = Math.sqrt(Math.max(0, sum2 / R.length - mean * mean));
    if (sd < 0.09 && Math.abs(mean - 1) < 0.1){
      if (Math.abs(w - h) < 0.18 * Math.max(w, h)){ rx = ry = (w + h) / 4; }
      var out = [];
      for (i = 0; i <= 72; i++){ var ang = i / 72 * 2 * Math.PI; out.push([cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]); }
      return out;
    }

    // багатокутник (3–6 кутів)
    var k = 0, md = -1;
    for (i = 1; i < R.length; i++){ var dd = dist(R[i], R[0]); if (dd > md){ md = dd; k = i; } }
    var eps = Math.max(7, 0.05 * diag);
    var p1 = rdp(R.slice(0, k + 1), eps), p2 = rdp(R.slice(k).concat([R[0]]), eps);
    var V = p1.concat(p2.slice(1, -1));
    var changed = true;
    while (changed && V.length > 3){
      changed = false;
      for (i = 0; i < V.length; i++){
        var pv = V[(i + V.length - 1) % V.length], c = V[i], q = V[(i + 1) % V.length];
        var a1 = Math.atan2(c[1] - pv[1], c[0] - pv[0]), a2 = Math.atan2(q[1] - c[1], q[0] - c[0]);
        var t = Math.abs(a2 - a1); if (t > Math.PI) t = 2 * Math.PI - t;
        if (t < 0.38 || dist(c, pv) < 0.08 * diag){ V.splice(i, 1); changed = true; break; }
      }
    }
    if (V.length < 3 || V.length > 6) return null;
    // тільки опуклі
    var sign = 0;
    for (i = 0; i < V.length; i++){
      var o = V[i], p = V[(i + 1) % V.length], z = V[(i + 2) % V.length];
      var cr = (p[0] - o[0]) * (z[1] - p[1]) - (p[1] - o[1]) * (z[0] - p[0]);
      if (Math.abs(cr) < 1e-6) continue;
      if (!sign) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return null;
    }
    // майже горизонтальні / вертикальні сторони робимо рівними
    var t5 = Math.tan(5 * Math.PI / 180), j, e;
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx = V[j][0] - V[i][0], dy = V[j][1] - V[i][1];
      if (Math.abs(dy) < t5 * Math.abs(dx)){ e = (V[i][1] + V[j][1]) / 2; V[i][1] = V[j][1] = e; } }
    for (i = 0; i < V.length; i++){ j = (i + 1) % V.length; var dx2 = V[j][0] - V[i][0], dy2 = V[j][1] - V[i][1];
      if (Math.abs(dx2) < t5 * Math.abs(dy2)){ e = (V[i][0] + V[j][0]) / 2; V[i][0] = V[j][0] = e; } }
    V.push([V[0][0], V[0][1]]);
    return V;
  }

  /* ---------- біле поле ---------- */
  function mkSheet(x, y, w, h, preview){
    var el = document.createElement('div');
    el.className = 'pm-sheet' + (st.grid ? ' grid' : '') + (preview ? ' pm-prev' : '');
    placeSheet(el, x, y, w, h);
    layer.appendChild(el);
    return el;
  }
  function placeSheet(el, x, y, w, h){
    el._r = { x: x, y: y, w: w, h: h };
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  }
  function addSheet(el){ el._seq = ++sheetSeq; sheets.push(el); push({ t: 'p', el: el }); redraw(); }

  /* ---------- історія ---------- */
  function push(a){ hist.push(a); if (hist.length > 150) hist.shift(); }
  function undo(){
    var a = hist.pop(); if (!a) return;
    if (a.t === 's'){ var i = strokes.lastIndexOf(a.s); if (i >= 0) strokes.splice(i, 1); redraw(); }
    else if (a.t === 'p'){ var j = sheets.indexOf(a.el); if (j >= 0) sheets.splice(j, 1); a.el.remove(); redraw(); }
    else if (a.t === 'clear'){
      a.strokes.forEach(function(s){ strokes.push(s); });
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    } else if (a.t === 'rm'){
      a.sheets.forEach(function(el){ layer.appendChild(el); sheets.push(el); });
      redraw();
    }
  }
  function clearAll(){
    if (!strokes.length && !sheets.length) return;
    var s = strokes.splice(0), sh = sheets.splice(0);
    sh.forEach(function(el){ el.remove(); });
    push({ t: 'clear', strokes: s, sheets: sh }); redraw();
  }
  function removePaper(){
    if (!sheets.length) return;
    var sh = sheets.splice(0); sh.forEach(function(el){ el.remove(); });
    push({ t: 'rm', sheets: sh }); redraw();
  }

  /* ---------- малювання ---------- */
  function lw(eraser){ return eraser ? (st.thick ? 50 : 26) : (st.thick ? 6 : 3); }
  ink.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  ink.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;   // долоня не малює, коли працює стилус
    if (cur || e.button > 0 && e.pointerType !== 'pen') return;
    e.preventDefault();
    try { ink.setPointerCapture(e.pointerId); } catch (_) {}
    var t = st.tool;
    if (e.pointerType === 'pen' && (e.buttons & 32)) t = 'eraser';   // гумка на кінці стилуса
    var pt = [e.clientX + sx(), e.clientY + sy()];
    if (t === 'paper'){
      cur = { id: e.pointerId, m: 'paper', x0: pt[0], y0: pt[1], el: mkSheet(pt[0], pt[1], 0, 0, true) };
    } else {
      var s = { c: st.color, w: lw(t === 'eraser'), e: t === 'eraser', p: [pt], seq: sheetSeq };
      cur = { id: e.pointerId, m: 'draw', s: s };
      setup(); drawStroke(s);
    }
  });
  ink.addEventListener('pointermove', function(e){
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++){
      var pt = [evs[i].clientX + sx(), evs[i].clientY + sy()];
      if (cur.m === 'paper'){
        placeSheet(cur.el, Math.min(cur.x0, pt[0]), Math.min(cur.y0, pt[1]), Math.abs(pt[0] - cur.x0), Math.abs(pt[1] - cur.y0));
      } else {
        var last = cur.s.p[cur.s.p.length - 1];
        if (dist(last, pt) < 1.2) continue;
        cur.s.p.push(pt); setup(); seg(cur.s, last, pt);
      }
    }
  });
  function end(e){
    if (!cur || e.pointerId !== cur.id) return;
    var c = cur; cur = null;
    if (c.m === 'paper'){
      var el = c.el, w = parseFloat(el.style.width) || 0, h = parseFloat(el.style.height) || 0;
      if (w < 30 || h < 30){ el.remove(); return; }
      el.classList.remove('pm-prev'); addSheet(el); setTool('pen');
    } else {
      var s = c.s;
      if (!s.e && st.smart){ var r = recognize(s.p); if (r){ s.p = r; s.raw = false; } }
      strokes.push(s); push({ t: 's', s: s }); redraw();
    }
  }
  ink.addEventListener('pointerup', end);
  ink.addEventListener('pointercancel', end);

  /* ---------- панель ---------- */
  var root = document.documentElement, dockW = 26;
  function q(a){ return panel.querySelector('[data-a="' + a + '"]'); }
  function isLeft(){ return panel.classList.contains('pm-left'); }
  // забираємо місце під панельку в уроку: він звужується, а не перекривається
  function dock(){
    dockW = (panel.hidden ? fab.offsetWidth : panel.offsetWidth + 4) + 4;
    root.style.setProperty('--pm-w', dockW + 'px');
    root.classList.toggle('pm-dock-l', isLeft());
    root.classList.toggle('pm-dock-r', !isLeft());
  }
  function ui(){
    ink.classList.toggle('on', !!st.tool);
    q('cursor').classList.toggle('on', !st.tool);
    q('pen').classList.toggle('on', st.tool === 'pen');
    q('eraser').classList.toggle('on', st.tool === 'eraser');
    q('paper').classList.toggle('on', st.tool === 'paper');
    q('width').classList.toggle('on', st.thick);
    q('smart').classList.toggle('on', st.smart);
    q('grid').classList.toggle('on', st.grid);
    var cs = panel.querySelectorAll('.pm-c');
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-c') === st.color);
  }
  function setTool(t){ st.tool = t; ui(); }
  function board(){
    // біла дошка закриває тільки сам урок, не смужку з панелькою
    var el = mkSheet(sx() + (isLeft() ? dockW : 0), sy(), root.clientWidth - dockW, root.clientHeight);
    addSheet(el); setTool('pen');
  }
  panel.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'cursor') setTool(null);
    else if (a === 'pen') setTool('pen');
    else if (a === 'eraser') setTool(st.tool === 'eraser' ? 'pen' : 'eraser');
    else if (a === 'paper') setTool(st.tool === 'paper' ? 'pen' : 'paper');
    else if (a === 'color'){ st.color = b.getAttribute('data-c'); st.tool = 'pen'; ui(); }
    else if (a === 'width'){ st.thick = !st.thick; ui(); }
    else if (a === 'smart'){ st.smart = !st.smart; ui(); }
    else if (a === 'grid'){
      if (!sheets.length){ st.grid = true; board(); }          // білого поля ще немає: одразу відкриваємо дошку в клітинку
      else { st.grid = !st.grid; sheets.forEach(function(el){ el.classList.toggle('grid', st.grid); }); }
      ui();
    }
    else if (a === 'board') board();
    else if (a === 'rmpaper'){ removePaper(); st.grid = false; ui(); }
    else if (a === 'undo') undo();
    else if (a === 'clear'){ clearAll(); st.grid = false; ui(); }
    else if (a === 'side'){ panel.classList.toggle('pm-left'); fab.classList.toggle('pm-left'); dock(); }
    else if (a === 'hide'){ panel.hidden = true; fab.hidden = false; setTool(null); dock(); }
  });
  fab.addEventListener('click', function(){ fab.hidden = true; panel.hidden = false; setTool('pen'); dock(); });
  window.addEventListener('resize', dock);
  document.addEventListener('keydown', function(e){
    if (!panel.hidden && (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
  });

  window.pencilOverlay = { get strokes(){ return strokes; }, get sheets(){ return sheets; }, recognize: recognize };
  size(); ui(); dock();
})();
</script>
<!-- ===================== ПАНЕЛЬКА-ОЛІВЕЦЬ v2 (кінець) ===================== -->
</body>
</html>
