<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математика 5 клас — зміст</title>
<style>
  :root{
    --main:#e5508a;      /* рожевий — колір 5 класу */
    --soft:#fde7f0;
    --softer:#fff5f9;
    --text:#2b2230;
    --muted:#8a7f8f;
    --line:#f3cfe0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:26px;color:var(--main)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .rozdil{margin:22px 0 8px;padding:10px 14px;border-radius:10px;
    background:var(--main);color:#fff;font-weight:700;font-size:17px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--softer)}
  summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;
    display:flex;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--main);transition:transform .2s}
  details[open] summary::before{transform:rotate(90deg)}
  .count{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
  ul{list-style:none;margin:0;padding:0 10px 10px}
  li.tema{background:#fff;border:1px solid var(--line);border-radius:8px;
    margin:6px 0;padding:9px 12px}
  .t{display:flex;gap:8px}
  .n{min-width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .name{padding-top:3px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 36px}
  .btns a{display:inline-block;text-decoration:none;font-size:14px;padding:5px 11px;
    border-radius:16px;background:var(--main);color:#fff}
  .btns a.test{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btns a:hover{opacity:.85}
  li.pidsumok{margin:8px 0;padding:11px 12px;border-radius:10px;background:var(--soft);
    border:2px solid var(--main);font-weight:700;color:var(--main)}
  li.pidsumok .btns{margin-left:0}
  li.check .btns{margin-left:0}
  li.check{margin:6px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--main);
    background:#fff;color:var(--main);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Математика · 5 клас</h1>
  <p class="sub">Теми за підручником. Натисніть на параграф, щоб побачити теми та матеріали.</p>
  <div id="zmist"></div>
</div>

<script>
/* ===== ЗМІСТ ПІДРУЧНИКА ===== */
const ZMIST = [
 {rozdil:"Повторення на початку року", par:[
  {t:"Повторення курсу початкової школи", temy:[
   ["p1","Урок 1. Натуральні числа, додавання і віднімання"],
   ["p2","Урок 2. Множення і ділення, вирази та рівняння"],
   ["p3","Урок 3. Текстові задачі (рух, спільна робота, вартість)"],
   ["p4","Урок 4. Геометричні фігури, периметр і площа, одиниці вимірювання"]]}
 ]},
 {rozdil:"Розділ I. Натуральні числа і дії з ними", par:[
  {t:"§ 1. Натуральні числа", temy:[
   [1,"Ряд натуральних чисел"],
   [2,"Цифри. Десятковий запис натуральних чисел"],
   [3,"Відрізок. Довжина відрізка"],
   [4,"Площина. Пряма. Промінь"],
   [5,"Шкала. Координатний промінь"],
   [6,"Порівняння натуральних чисел"],
   ["check","Завдання № 1 «Перевірте себе»"]]},
  {t:"§ 2. Додавання і віднімання натуральних чисел", temy:[
   [7,"Додавання натуральних чисел. Властивості додавання"],
   [8,"Віднімання натуральних чисел"],
   [9,"Числові і буквені вирази. Формули"],
   [10,"Рівняння"],
   [11,"Кут. Позначення кутів"],
   [12,"Види кутів. Вимірювання кутів"],
   [13,"Многокутники. Рівні фігури"],
   [14,"Трикутник і його види"],
   [15,"Прямокутник"],
   ["check2","Завдання № 2 «Перевірте себе»"],
   ["chvert1","Повторення · Підсумок І чверті"]]},
  {t:"§ 3. Множення і ділення натуральних чисел", temy:[
   [16,"Множення. Переставна властивість множення"],
   [17,"Сполучна та розподільна властивості множення"],
   [18,"Ділення"],
   [19,"Ділення з остачею"],
   [20,"Степінь числа"],
   [21,"Площа. Площа прямокутника"],
   [22,"Прямокутний паралелепіпед. Піраміда"],
   [23,"Об’єм прямокутного паралелепіпеда"],
   [24,"Комбінаторні задачі"],
   ["check","Завдання № 3 «Перевірте себе»"]]}
 ]},
 {rozdil:"Розділ II. Дробові числа і дії з ними", par:[
  {t:"§ 4. Звичайні дроби", temy:[
   [25,"Уявлення про звичайні дроби"],
   [26,"Правильні і неправильні дроби. Порівняння дробів"],
   [27,"Додавання і віднімання дробів з однаковими знаменниками"],
   [28,"Дроби і ділення натуральних чисел"],
   [29,"Мішані числа"],
   ["check","Завдання № 4 «Перевірте себе»"]]},
  {t:"§ 5. Десяткові дроби", temy:[
   [30,"Уявлення про десяткові дроби"],
   [31,"Порівняння десяткових дробів"],
   [32,"Округлення чисел"],
   [33,"Додавання і віднімання десяткових дробів"],
   ["check","Завдання № 5 «Перевірте себе»"],
   [34,"Множення десяткових дробів"],
   [35,"Ділення десяткових дробів"],
   [36,"Середнє арифметичне. Середнє значення величини"],
   [37,"Відсотки. Знаходження відсотків від числа"],
   [38,"Знаходження числа за його відсотками"],
   ["check","Завдання № 6 «Перевірте себе»"]]}
 ]},
 {rozdil:"Повторення", par:[
  {t:"Вправи для повторення за курс 5 класу", temy:[["povt","Повторення за курс 5 класу"]]}
 ]}
];

/* ===== РОЗРОБКИ =====
   Ключ — номер теми (або "povt" для повторення).
   test:true — кнопка буде світлою (для тестів).
   Приклад:  7: [{n:"Урок", url:"https://..."}, {n:"Тест", url:"https://...", test:true}],
*/
const ROZROBKY = {
  p1: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/5/povtorennia-urok-1-naturalni-chysla.html"},
       {n:"Тест", url:"https://tetiana-8.github.io/matemka/5/test-dz-povtorennia-urok-1.html", test:true}],
  p2: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/5/povtorennia-urok-2-mnozhennia-dilennia.html"}],
  p3: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/5/povtorennia-urok-3-tekstovi-zadachi.html"}],
  p4: [{n:"Урок", url:"https://tetiana-8.github.io/matemka/5/povtorennia-urok-4-peremetr-ploshcha-odynytsi.html"}],
  1: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-naturalnyi-riad-velyki-chysla.html"}],
  3: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-vidrizky.html"},
      {n:"Тест", url:"https://tetiana-8.github.io/matemka/5/test-vidrizky.html", test:true}],
  7: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-dodavannia-v-stovpchyk.html"}],
  10: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-rivnyannia.html"}],
  14: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-vydy-trykutnykiv.html"},
       {n:"Урок", url:"https://tetiana-8.github.io/matemka/5/urok-trykutnyk-vydy.html"},
       {n:"Тест", url:"https://sites.google.com/view/trikutnik-i-vid", test:true}],
  18: [{n:"Тренажер", url:"https://tetiana-8.github.io/matemka/5/trenazher-dilennia-kutochkom.html"}],
  chvert1: [{n:"Гра", url:"https://tetiana-8.github.io/matemka/5/kartky-pidsumok-1-chvert.html"}],
  check2: [{n:"Тест-контрольна", url:"https://tetiana-8.github.io/matemka/5/test-dodavannia-vidnimannia.html", test:true}],
  15: [{n:"Актуалізація", url:"https://tetiana-8.github.io/matemka/5/aktualizatsiia-pryamokutnyk.html"},
       {n:"Урок", url:"https://sites.google.com/view/pryamokutnik"}],
  16: [{n:"Актуалізація", url:"https://tetiana-8.github.io/matemka/5/aktualizatsiia-mnozhennia-perestavna.html"},
       {n:"Урок", url:"https://tetiana-8.github.io/matemka/5/urok-mnozhennia-perestavna-vlastyvist.html"},
       {n:"Урок 2", url:"https://tetiana-8.github.io/matemka/5/urok-2-mnozhennia-perestavna-vlastyvist.html"},
       {n:"Тест", url:"https://tetiana-8.github.io/matemka/5/test-mnozhennia-perestavna.html", test:true}],
};

/* ===== ПОБУДОВА СТОРІНКИ ===== */
const root = document.getElementById("zmist");
function btns(key){
  const list = ROZROBKY[key];
  if(!list || !list.length) return "";
  return '<div class="btns">' + list.map(r =>
    `<a href="${r.url}" target="_blank" rel="noopener"${r.test?' class="test"':''}>${r.n}</a>`).join("") + "</div>";
}
ZMIST.forEach(r=>{
  const h = document.createElement("div");
  h.className="rozdil"; h.textContent=r.rozdil; root.appendChild(h);
  r.par.forEach(p=>{
    const d=document.createElement("details");
    const nTem=p.temy.filter(x=>typeof x[0]==="number").length;
    const nMat=p.temy.reduce((s,x)=>s+((ROZROBKY[x[0]]||[]).length),0);
    let html=`<summary>${p.t}<span class="count">${nTem?nTem+" тем":""}${nMat?" · "+nMat+" матеріалів":""}</span></summary><ul>`;
    p.temy.forEach(([k,name])=>{
      if(k==="check"||k==="check2"){ html+=`<li class="check">✔ ${name}${btns(k)}</li>`; return; }
      if(k==="chvert1"){ html+=`<li class="pidsumok">★ ${name}${btns(k)}</li>`; return; }
      const num = typeof k==="number" ? k : "↺";
      html+=`<li class="tema"><div class="t"><span class="n">${num}</span><span class="name">${name}</span></div>${btns(k)}</li>`;
    });
    d.innerHTML=html+"</ul>";
    root.appendChild(d);
  });
});
</script>
<div style="text-align:center;font:10px/1.2 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;letter-spacing:.05em;color:#6b7280;padding:14px 0 10px">Автор розробки <b>Ковтун Тетяна</b></div>
</body>
</html>
